<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Scroll | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 884px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        .widget-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            background: #FFF;
            z-index: 10;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--team-creative);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .header-title { font-size: 18px; font-weight: 900; color: var(--ink); }
        .header-sub { font-size: 12px; color: var(--ink-sub); margin-left: auto; }
        
        .feed-list {
            display: flex;
            flex-direction: column;
        }
        
        .post-card {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }
        .post-card:last-child { border-bottom: none; }
        
        .post-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .post-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #FFF;
            cursor: pointer;
        }
        .post-meta { flex: 1; }
        .post-author { font-size: 16px; font-weight: 700; color: var(--ink); cursor: pointer; }
        .post-author:hover { color: var(--dmg-blue); }
        .post-timestamp { font-size: 12px; color: var(--ink-sub); }
        
        .mood-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #FEF3C7;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 700;
            color: #B45309;
            margin-bottom: 12px;
        }
        
        .post-content {
            font-size: 16px;
            line-height: 1.7;
            color: var(--ink);
            margin-bottom: 16px;
        }
        .mention { color: var(--team-creative); font-weight: 600; cursor: pointer; }
        .mention:hover { text-decoration: underline; }
        .hashtag { color: var(--dmg-blue); font-weight: 600; }
        
        /* Link preview */
        .link-preview {
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .link-preview:hover { border-color: var(--dmg-blue); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .link-preview-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-soft);
        }
        .link-preview-content { padding: 16px 20px; }
        .link-preview-domain {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--ink-sub);
            margin-bottom: 6px;
        }
        .link-preview-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 6px;
        }
        .link-preview-desc {
            font-size: 13px;
            color: var(--ink-sub);
            line-height: 1.5;
        }
        
        /* Reactions */
        .post-reactions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .reaction-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 99px;
            background: #FFF;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .reaction-btn:hover { background: var(--bg-soft); border-color: #DDD; }
        .reaction-btn.active { background: #FEF3C7; border-color: #F59E0B; }
        .reaction-count { font-size: 13px; font-weight: 700; color: var(--ink); }
        .comment-btn { margin-left: auto; color: var(--ink-sub); }
        
        .demo-badge {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: var(--team-creative);
            padding: 4px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Operations': '#9333EA'
        };

        const DEMO_POSTS = [
            { type: 'link', author: {n:'Nick B',t:'Creative'}, time: '30m', content: 'This is exactly the vibe we need for the JAECOO adventure series. Wes Anderson energy meets British chaotic road trip. <span class="mention">@Ana</span> thoughts?', link: { url: '#', domain: 'youtube.com', title: 'The French Dispatch | Behind the Scenes', desc: 'How Wes Anderson created the visual world of his most ambitious film', image: 'https://picsum.photos/seed/wesanderson/800/400' }, reactions: {'🔥':2,'💡':1,'😍':1}, comments: 1 },
            { type: 'text', author: {n:'Ana',t:'Creative'}, time: '1h', mood: {emoji:'🎯',label:'Locked In'}, content: 'Hot take: The best hooks aren\'t clever, they\'re specific. "We tested if the Big Mac tastes different in Japan" beats "The truth about McDonald\'s" every time. Specificity = curiosity.', reactions: {'🔥':4,'👏':2,'💡':3}, comments: 0 },
            { type: 'link', author: {n:'Hugo M',t:'Production'}, time: '2h', content: 'Found this on r/videoediting. These transition templates would be perfect for the Street Talks format refresh. <span class="mention">@Mimi</span> take a look?', link: { url: '#', domain: 'reddit.com', title: 'Free 4K transition pack - 50+ social-first templates', desc: 'Made these for my own projects, sharing free. Works with Premiere and DaVinci.', image: 'https://picsum.photos/seed/transitions/800/400' }, reactions: {'❤️':2,'💡':1}, comments: 0 },
            { type: 'text', author: {n:'Kaylee A',t:'Editorial'}, time: '4h', content: 'Overheard on the Tube: "I\'d literally sell my soul for a Greggs sausage roll right now" followed by "same but for a Pret cookie". This is the content we need. <span class="hashtag">#OnlyInBritain</span>', reactions: {'😂':6,'❤️':2}, comments: 1 },
            { type: 'link', author: {n:'Sophia S',t:'Editorial'}, time: '5h', content: 'This Is Money angle: Gen Z are spending more on "little treats" than millennials did at the same age. Could tie into the Sky Vegas "small wins" positioning?', link: { url: '#', domain: 'thisismoney.co.uk', title: 'The Little Treat Economy: How Gen Z is redefining reward culture', desc: 'New data shows under-30s spend 23% more on small indulgences than previous generations', image: 'https://picsum.photos/seed/money2/800/400' }, reactions: {'💡':2,'👏':1}, comments: 0 },
            { type: 'text', author: {n:'Dan Q',t:'Social'}, time: '6h', mood: {emoji:'💪',label:'Crushing It'}, content: 'Just wrapped the 3 Peaks Investigates shoot. Knackered but we got some incredible footage. Preview dropping Monday. 🏔️', reactions: {'🔥':7,'🎉':3,'❤️':2}, comments: 4 },
            { type: 'link', author: {n:'Mimi Yates',t:'Social'}, time: '8h', content: 'This TikTok editing style is everywhere right now. Quick cuts, zooms on keywords, that specific font. Should we be doing more of this for Headlines?', link: { url: '#', domain: 'tiktok.com', title: '@contentcreator - This editing style gets 10M views', desc: 'Tutorial on the viral editing technique taking over the platform', image: 'https://picsum.photos/seed/tiktok/800/400' }, reactions: {'🔥':3,'💡':4}, comments: 2 },
            { type: 'text', author: {n:'Gemma P',t:'Production'}, time: '10h', content: 'Reminder: If you\'re booking studio time for next week, the calendar is getting full. First come first served. <span class="mention">@Hugo M</span> <span class="mention">@Isobel</span>', reactions: {'👏':2}, comments: 0 },
            { type: 'link', author: {n:'Nick B',t:'Creative'}, time: '12h', content: 'Competitor watch: Look at this format from LADbible. The "asking couples" series is massive right now. We should pitch something similar for Valentine\'s.', link: { url: '#', domain: 'instagram.com', title: 'LADbible - We Asked 100 Couples', desc: 'Series averaging 2M+ views per episode', image: 'https://picsum.photos/seed/couples/800/400' }, reactions: {'💡':5,'🔥':2}, comments: 3 },
            { type: 'text', author: {n:'Ellie B',t:'Creative'}, time: '1d', mood: {emoji:'🔥',label:'On Fire'}, content: 'Big news coming next week. Can\'t say much yet but the team has been working on something special for Q1. Watch this space. 👀', reactions: {'🔥':8,'🎉':4,'❤️':3}, comments: 6 }
        ];

        const root = document.getElementById('root');
        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = n => n.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);

        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">The Scroll</h2>
                        <span class="header-sub">Inspo & Links</span>
                        <span class="demo-badge">Preview</span>
                    </div>
                    <div class="feed-list">
                        ${DEMO_POSTS.map(p => renderPost(p)).join('')}
                    </div>
                </div>
            `;
        }

        function renderPost(p) {
            return `
                <div class="post-card">
                    <div class="post-header">
                        <div class="post-avatar" style="background:${getTeamColor(p.author.t)}">${getInitials(p.author.n)}</div>
                        <div class="post-meta">
                            <div class="post-author">${p.author.n}</div>
                            <div class="post-timestamp">${p.time}</div>
                        </div>
                    </div>
                    
                    ${p.mood ? `<div class="mood-chip"><span>${p.mood.emoji}</span><span>${p.mood.label}</span></div>` : ''}
                    
                    <div class="post-content">${p.content}</div>
                    
                    ${p.link ? `
                        <div class="link-preview">
                            <img class="link-preview-image" src="${p.link.image}" alt="">
                            <div class="link-preview-content">
                                <div class="link-preview-domain">${p.link.domain}</div>
                                <div class="link-preview-title">${p.link.title}</div>
                                <div class="link-preview-desc">${p.link.desc}</div>
                            </div>
                        </div>
                    ` : ''}
                    
                    <div class="post-reactions">
                        ${['❤️','🔥','👏','💡','😂','🎉'].map(e => {
                            const c = p.reactions?.[e] || 0;
                            return `<button class="reaction-btn ${c > 0 ? 'active' : ''}"><span>${e}</span>${c > 0 ? `<span class="reaction-count">${c}</span>` : ''}</button>`;
                        }).join('')}
                        <button class="reaction-btn comment-btn">💬${p.comments > 0 ? ` <span class="reaction-count">${p.comments}</span>` : ''}</button>
                    </div>
                </div>
            `;
        }

        onAuthStateChanged(auth, u => { if (u) render(); else signInAnonymously(auth); });
    </script>
</body>
</html>
