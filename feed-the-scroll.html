<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Scroll | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }
        .widget-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--team-creative);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .header-title { font-size: 15px; font-weight: 900; color: var(--ink); }
        .header-sub { font-size: 11px; color: var(--ink-sub); margin-left: auto; }
        
        .feed-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: #F0F0F0;
        }
        
        .post-card {
            padding: 20px 24px;
            background: #FFF;
            transition: background 0.15s ease;
        }
        .post-card:hover { background: var(--bg-soft); }
        
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #FFF;
            flex-shrink: 0;
            cursor: pointer;
        }
        .post-meta { flex: 1; min-width: 0; }
        .post-author { font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer; }
        .post-author:hover { color: var(--dmg-blue); }
        .post-timestamp { font-size: 11px; color: var(--ink-sub); }
        
        .post-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--ink);
            margin-bottom: 14px;
        }
        .mention { color: var(--team-creative); font-weight: 600; cursor: pointer; }
        .hashtag { color: var(--dmg-blue); font-weight: 600; }
        
        /* Link preview */
        .link-preview {
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .link-preview:hover { border-color: var(--dmg-blue); box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .link-preview-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: var(--bg-soft);
        }
        .link-preview-content { padding: 14px; }
        .link-preview-domain {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--ink-sub);
            margin-bottom: 4px;
        }
        .link-preview-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .link-preview-desc {
            font-size: 12px;
            color: var(--ink-sub);
            line-height: 1.4;
        }
        
        /* Image post */
        .post-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 14px;
        }
        
        /* Mood chip */
        .mood-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: #FEF3C7;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            color: #B45309;
            margin-bottom: 10px;
        }
        
        /* Reactions */
        .post-reactions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .reaction-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 99px;
            background: #FFF;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .reaction-btn:hover { background: var(--bg-soft); border-color: #DDD; }
        .reaction-btn.active { background: #FEF3C7; border-color: #F59E0B; }
        .reaction-count { font-size: 12px; font-weight: 700; color: var(--ink); }
        .comment-btn { margin-left: auto; color: var(--ink-sub); }
        
        .demo-badge {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: #E6468B;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        @media (max-width: 700px) {
            .feed-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Social Video': '#F2C316', 'Operations': '#9333EA', 'Sales': '#F97316'
        };

        const DEMO_POSTS = [
            {
                id: 'p1', type: 'link', authorId: 'nick', authorName: 'Nick B', authorTeam: 'Creative',
                content: 'This is exactly the vibe we need for the JAECOO adventure series. Wes Anderson energy meets British chaotic road trip. @Ana thoughts?',
                link: { url: 'https://youtube.com/watch?v=example', domain: 'youtube.com', title: 'The French Dispatch | Behind the Scenes', desc: 'How Wes Anderson created the visual world of his most ambitious film', image: 'https://picsum.photos/seed/wesanderson/800/400' },
                timestamp: Date.now() - 1800000,
                reactions: { '🔥': ['ana','hugo'], '💡': ['mimi'] },
                comments: [{ authorName: 'Ana', text: 'YES. Stealing this for the mood board' }]
            },
            {
                id: 'p2', type: 'text', authorId: 'ana', authorName: 'Ana', authorTeam: 'Creative',
                content: 'Hot take: The best hooks aren\'t clever, they\'re specific. "We tested if the Big Mac tastes different in Japan" beats "The truth about McDonald\'s" every time. Specificity = curiosity.',
                mood: { emoji: '🎯', label: 'Locked In' },
                timestamp: Date.now() - 3600000,
                reactions: { '🔥': ['nick','hugo','dan','kaylee'], '👏': ['mimi','sophia'] },
                comments: []
            },
            {
                id: 'p3', type: 'link', authorId: 'hugo', authorName: 'Hugo M', authorTeam: 'Production',
                content: 'Found this on r/videoediting. These transition templates would be perfect for the Street Talks format refresh. @Mimi take a look?',
                link: { url: 'https://reddit.com/r/videoediting', domain: 'reddit.com', title: 'Free 4K transition pack - 50+ social-first templates', desc: 'Made these for my own projects, sharing free. Works with Premiere and DaVinci.', image: 'https://picsum.photos/seed/transitions/800/400' },
                timestamp: Date.now() - 7200000,
                reactions: { '❤️': ['mimi','dan'], '💡': ['nick'] },
                comments: []
            },
            {
                id: 'p4', type: 'text', authorId: 'kaylee', authorName: 'Kaylee A', authorTeam: 'Editorial',
                content: 'Overheard on the Tube: "I\'d literally sell my soul for a Greggs sausage roll right now" — followed by "same but for a Pret cookie". This is the content we need. #OnlyInBritain',
                timestamp: Date.now() - 14400000,
                reactions: { '😂': ['ana','nick','hugo','mimi','dan'], '❤️': ['sophia'] },
                comments: [{ authorName: 'Dan Q', text: 'Street Talk: Greggs vs Pret. Final answer.' }]
            },
            {
                id: 'p5', type: 'link', authorId: 'sophia', authorName: 'Sophia S', authorTeam: 'Editorial',
                content: 'This is Money angle: Gen Z are spending more on "little treats" than millennials did at the same age. Could tie into the Sky Vegas "small wins" positioning?',
                link: { url: 'https://thisismoney.co.uk', domain: 'thisismoney.co.uk', title: 'The Little Treat Economy: How Gen Z is redefining reward culture', desc: 'New data shows under-30s spend 23% more on small indulgences than previous generations', image: 'https://picsum.photos/seed/money/800/400' },
                timestamp: Date.now() - 21600000,
                reactions: { '💡': ['ana','nick'], '👏': ['hugo'] },
                comments: []
            },
            {
                id: 'p6', type: 'text', authorId: 'dan', authorName: 'Dan Q', authorTeam: 'Social',
                content: 'Just wrapped the 3 Peaks Investigates shoot. Knackered but we got some incredible footage. Preview dropping Monday. 🏔️',
                mood: { emoji: '💪', label: 'Crushing It' },
                timestamp: Date.now() - 28800000,
                reactions: { '🔥': ['ana','nick','hugo','mimi','kaylee','sophia'], '🎉': ['isobel'] },
                comments: []
            }
        ];

        let posts = DEMO_POSTS;
        let isDemo = true;
        const root = document.getElementById('root');

        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = n => n.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
        const timeAgo = ts => {
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 60) return 'just now';
            const m = Math.floor(s / 60); if (m < 60) return `${m}m`;
            const h = Math.floor(m / 60); if (h < 24) return `${h}h`;
            return `${Math.floor(h / 24)}d`;
        };

        function parseContent(text) {
            return text
                .replace(/@(\w+)/g, '<span class="mention">@$1</span>')
                .replace(/#(\w+)/g, '<span class="hashtag">#$1</span>');
        }

        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">The Scroll</h2>
                        <span class="header-sub">Inspo & Links</span>
                        ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    </div>
                    <div class="feed-list">
                        ${posts.map(p => renderPost(p)).join('')}
                    </div>
                </div>
            `;
        }

        function renderPost(p) {
            return `
                <div class="post-card" data-id="${p.id}">
                    <div class="post-header">
                        <div class="post-avatar" style="background:${getTeamColor(p.authorTeam)}">${getInitials(p.authorName)}</div>
                        <div class="post-meta">
                            <div class="post-author">${p.authorName}</div>
                            <div class="post-timestamp">${timeAgo(p.timestamp)}</div>
                        </div>
                    </div>
                    
                    ${p.mood ? `<div class="mood-chip"><span>${p.mood.emoji}</span><span>${p.mood.label}</span></div>` : ''}
                    
                    <div class="post-content">${parseContent(p.content)}</div>
                    
                    ${p.type === 'link' && p.link ? `
                        <div class="link-preview" onclick="window.open('${p.link.url}', '_blank')">
                            ${p.link.image ? `<img class="link-preview-image" src="${p.link.image}" alt="">` : ''}
                            <div class="link-preview-content">
                                <div class="link-preview-domain">${p.link.domain}</div>
                                <div class="link-preview-title">${p.link.title}</div>
                                <div class="link-preview-desc">${p.link.desc}</div>
                            </div>
                        </div>
                    ` : ''}
                    
                    ${p.type === 'image' && p.image ? `<img class="post-image" src="${p.image}" alt="">` : ''}
                    
                    <div class="post-reactions">
                        ${['❤️','🔥','💡','👏','😂'].map(e => {
                            const c = p.reactions?.[e]?.length || 0;
                            return `<button class="reaction-btn ${c > 0 ? 'active' : ''}"><span>${e}</span>${c > 0 ? `<span class="reaction-count">${c}</span>` : ''}</button>`;
                        }).join('')}
                        <button class="reaction-btn comment-btn">💬 ${p.comments?.length || 0}</button>
                    </div>
                </div>
            `;
        }

        onAuthStateChanged(auth, u => { if (u) render(); else signInAnonymously(auth); });
    </script>
</body>
</html>
