<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Scroll | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 420px;
            overflow: hidden;
        }
        .widget-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--team-creative);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .header-title { font-size: 13px; font-weight: 900; color: var(--ink); }
        .header-sub { font-size: 9px; color: var(--ink-sub); margin-left: auto; }
        
        /* Compose bar */
        .compose-bar {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .compose-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--dmg-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #FFF;
            flex-shrink: 0;
        }
        .compose-input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 99px;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .compose-input:focus {
            outline: none;
            border-color: var(--dmg-blue);
        }
        .compose-input::placeholder { color: #BBB; }
        .compose-btn {
            padding: 10px 16px;
            background: var(--team-creative);
            color: #FFF;
            border: none;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .compose-btn:hover { background: #d43d7a; }
        
        .feed-list {
            max-height: 450px;
            overflow-y: auto;
        }
        
        /* Post styles */
        .post-card {
            padding: 14px 18px;
            border-bottom: 1px solid #F5F5F5;
            transition: background 0.15s ease;
        }
        .post-card:hover { background: var(--bg-soft); }
        .post-card:last-child { border-bottom: none; }
        
        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #FFF;
            flex-shrink: 0;
            cursor: pointer;
        }
        .post-meta { flex: 1; min-width: 0; }
        .post-author {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            cursor: pointer;
        }
        .post-author:hover { color: var(--dmg-blue); }
        .post-timestamp { font-size: 10px; color: var(--ink-sub); }
        
        .post-content {
            font-size: 13px;
            line-height: 1.5;
            color: var(--ink);
            margin-bottom: 10px;
        }
        .post-content a {
            color: var(--dmg-blue);
            text-decoration: none;
        }
        .post-content a:hover { text-decoration: underline; }
        .mention { color: var(--team-creative); font-weight: 600; cursor: pointer; }
        .hashtag { color: var(--dmg-blue); font-weight: 600; }
        
        /* Link preview */
        .link-preview {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .link-preview:hover {
            border-color: var(--dmg-blue);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .link-preview-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: var(--bg-soft);
        }
        .link-preview-content {
            padding: 12px;
        }
        .link-preview-domain {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--ink-sub);
            margin-bottom: 4px;
        }
        .link-preview-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .link-preview-desc {
            font-size: 11px;
            color: var(--ink-sub);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Image post */
        .post-image {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        
        /* Reactions */
        .post-reactions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reaction-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 99px;
            background: #FFF;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .reaction-btn:hover {
            background: var(--bg-soft);
            border-color: #DDD;
        }
        .reaction-btn.active {
            background: #FEF3C7;
            border-color: #F59E0B;
        }
        .reaction-count {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
        }
        .comment-btn {
            margin-left: auto;
            color: var(--ink-sub);
        }
        
        .demo-badge {
            font-size: 7px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: #E6468B;
            padding: 3px 6px;
            border-radius: 4px;
        }
        
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: #FFF;
            padding: 12px 24px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.active { bottom: 30px; opacity: 1; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="toast" id="toast">Posted!</div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, addDoc, doc, updateDoc, arrayUnion, arrayRemove, getDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Social Video': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316'
        };

        const DEMO_POSTS = [
            {
                id: 'scroll-1',
                type: 'link',
                authorId: 'ana',
                authorName: 'Ana',
                authorTeam: 'Creative',
                content: 'This Wes Anderson breakdown is incredible. Stealing this framing for the next pitch deck 👀',
                link: {
                    url: 'https://www.youtube.com/watch?v=example',
                    domain: 'youtube.com',
                    title: 'How Wes Anderson Directs a Scene',
                    description: 'A visual essay breaking down the symmetry, colour palettes, and dolly movements that define Anderson\'s style.',
                    image: 'https://picsum.photos/seed/wesanderson/400/200'
                },
                timestamp: Date.now() - 1800000,
                reactions: { '🔥': ['nick', 'hugo'], '👏': ['mimi'] },
                comments: []
            },
            {
                id: 'scroll-2',
                type: 'text',
                authorId: 'nick',
                authorName: 'Nick B',
                authorTeam: 'Creative',
                content: 'Hot take: the best hooks don\'t tell you what the video is about. They tell you how you\'re going to feel watching it. Discuss.',
                timestamp: Date.now() - 5400000,
                reactions: { '🔥': ['ana', 'dan', 'mimi', 'kaylee'], '🤔': ['hugo', 'isobel'] },
                comments: [
                    { authorName: 'Dan Q', authorTeam: 'Social', text: 'This is why "I tried X so you don\'t have to" works so well' }
                ]
            },
            {
                id: 'scroll-3',
                type: 'link',
                authorId: 'hugo',
                authorName: 'Hugo M',
                authorTeam: 'Production',
                content: 'Found this on r/videoediting. The pacing is mental. @mimi thoughts for the next Street Talk?',
                link: {
                    url: 'https://www.tiktok.com/@example',
                    domain: 'tiktok.com',
                    title: 'POV: You\'re the last train home',
                    description: 'Viral TikTok with 4.2M views using jump cuts and diegetic sound',
                    image: 'https://picsum.photos/seed/tiktok/400/200'
                },
                timestamp: Date.now() - 10800000,
                reactions: { '❤️': ['mimi'], '🔥': ['ana', 'nick'] },
                comments: []
            },
            {
                id: 'scroll-4',
                type: 'text',
                authorId: 'kaylee',
                authorName: 'Kaylee A',
                authorTeam: 'Social',
                content: 'Just overheard on the Tube: "She\'s giving main character energy but in a problematic way." This is going in a script somehow.',
                timestamp: Date.now() - 18000000,
                reactions: { '😂': ['ana', 'nick', 'hugo', 'mimi', 'dan', 'sophia'] },
                comments: []
            },
            {
                id: 'scroll-5',
                type: 'link',
                authorId: 'sophia',
                authorName: 'Sophia S',
                authorTeam: 'Editorial',
                content: 'This Money article is getting traction. Could we do a "What £1000 looked like in every decade" for This Is Money?',
                link: {
                    url: 'https://www.ft.com/example',
                    domain: 'ft.com',
                    title: 'The Shrinking Pound: What Your Money Actually Buys',
                    description: 'A visual investigation into purchasing power over the last 50 years.',
                    image: 'https://picsum.photos/seed/money/400/200'
                },
                timestamp: Date.now() - 43200000,
                reactions: { '👏': ['ana', 'nick'], '💡': ['hugo'] },
                comments: []
            }
        ];

        let currentUser = null;
        let posts = [];
        let isDemo = true;

        const root = document.getElementById('root');

        function getTeamColor(team) {
            return TEAM_COLORS[team] || '#21a0d8';
        }

        function getInitials(name) {
            const parts = name.split(' ');
            return parts.map(p => p[0]).join('').toUpperCase().slice(0, 2);
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h`;
            const days = Math.floor(hours / 24);
            return `${days}d`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 2000);
        }

        function parseContent(text) {
            // Parse @mentions and #hashtags
            return text
                .replace(/@(\w+)/g, '<span class="mention" onclick="window.viewProfile(\'$1\')">@$1</span>')
                .replace(/#(\w+)/g, '<span class="hashtag">#$1</span>');
        }

        function render() {
            const displayPosts = posts.length > 0 ? posts : DEMO_POSTS;
            const userInitials = currentUser ? getInitials(`${currentUser.firstName} ${currentUser.lastName}`) : '?';
            const userColor = currentUser ? getTeamColor(currentUser.team) : '#21a0d8';

            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">The Scroll</h2>
                        <span class="header-sub">Inspo & Vibes</span>
                        ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    </div>
                    
                    <div class="compose-bar">
                        <div class="compose-avatar" style="background: ${userColor}">${userInitials}</div>
                        <input type="text" class="compose-input" id="compose-input" 
                               placeholder="Share something with the team...">
                        <button class="compose-btn" onclick="window.submitPost()">Post</button>
                    </div>
                    
                    <div class="feed-list">
                        ${displayPosts.map(post => renderPost(post)).join('')}
                    </div>
                </div>
            `;

            // Enter key to post
            setTimeout(() => {
                const input = document.getElementById('compose-input');
                if (input) {
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') window.submitPost();
                    });
                }
            }, 50);
        }

        function renderPost(post) {
            const userId = currentUser?.id || 'demo';

            return `
                <div class="post-card" data-id="${post.id}">
                    <div class="post-header">
                        <div class="post-avatar" style="background: ${getTeamColor(post.authorTeam)}"
                             onclick="window.viewProfile('${post.authorId}')">
                            ${getInitials(post.authorName)}
                        </div>
                        <div class="post-meta">
                            <div class="post-author" onclick="window.viewProfile('${post.authorId}')">${post.authorName}</div>
                            <div class="post-timestamp">${timeAgo(post.timestamp)}</div>
                        </div>
                    </div>
                    
                    <div class="post-content">${parseContent(post.content)}</div>
                    
                    ${post.link ? `
                        <div class="link-preview" onclick="window.open('${post.link.url}', '_blank')">
                            ${post.link.image ? `<img src="${post.link.image}" class="link-preview-image" alt="">` : ''}
                            <div class="link-preview-content">
                                <div class="link-preview-domain">${post.link.domain}</div>
                                <div class="link-preview-title">${post.link.title}</div>
                                <div class="link-preview-desc">${post.link.description || ''}</div>
                            </div>
                        </div>
                    ` : ''}
                    
                    ${post.image ? `<img src="${post.image}" class="post-image" alt="">` : ''}
                    
                    <div class="post-reactions">
                        ${['❤️', '🔥', '😂', '👏', '💡'].map(emoji => {
                            const count = post.reactions?.[emoji]?.length || 0;
                            const active = post.reactions?.[emoji]?.includes(userId);
                            return `
                                <button class="reaction-btn ${active ? 'active' : ''}" 
                                        onclick="window.toggleReaction('${post.id}', '${emoji}')">
                                    <span>${emoji}</span>
                                    ${count > 0 ? `<span class="reaction-count">${count}</span>` : ''}
                                </button>
                            `;
                        }).join('')}
                        <button class="reaction-btn comment-btn">💬 ${post.comments?.length || 0}</button>
                    </div>
                </div>
            `;
        }

        window.submitPost = async () => {
            const input = document.getElementById('compose-input');
            const content = input?.value?.trim();
            if (!content) return;

            const newPost = {
                type: 'text',
                authorId: currentUser?.id || 'demo',
                authorName: currentUser ? `${currentUser.firstName} ${currentUser.lastName}` : 'You',
                authorTeam: currentUser?.team || 'Creative',
                content: content,
                timestamp: Date.now(),
                reactions: {},
                comments: []
            };

            // Check if it's a link
            const urlMatch = content.match(/(https?:\/\/[^\s]+)/);
            if (urlMatch) {
                newPost.type = 'link';
                const url = urlMatch[1];
                newPost.link = {
                    url: url,
                    domain: new URL(url).hostname.replace('www.', ''),
                    title: 'Shared link',
                    description: '',
                    image: ''
                };
            }

            if (isDemo) {
                DEMO_POSTS.unshift({ id: 'new-' + Date.now(), ...newPost });
                input.value = '';
                render();
                showToast('Posted! (Preview mode)');
                return;
            }

            try {
                await addDoc(collection(db, "artifacts", appId, "public", "data", "feed_posts"), {
                    ...newPost,
                    createdAt: serverTimestamp()
                });
                input.value = '';
                showToast('Posted!');
            } catch (e) {
                console.error('Failed to post:', e);
                showToast('Failed to post');
            }
        };

        window.toggleReaction = async (postId, emoji) => {
            const userId = currentUser?.id || 'demo';
            
            if (isDemo) {
                const post = DEMO_POSTS.find(p => p.id === postId);
                if (post) {
                    if (!post.reactions) post.reactions = {};
                    if (!post.reactions[emoji]) post.reactions[emoji] = [];
                    
                    const idx = post.reactions[emoji].indexOf(userId);
                    if (idx >= 0) {
                        post.reactions[emoji].splice(idx, 1);
                    } else {
                        post.reactions[emoji].push(userId);
                    }
                    render();
                }
                return;
            }

            try {
                const postRef = doc(db, "artifacts", appId, "public", "data", "feed_posts", postId);
                const postSnap = await getDoc(postRef);
                if (!postSnap.exists()) return;
                
                const reactions = postSnap.data().reactions || {};
                const hasIt = reactions[emoji]?.includes(userId);
                
                await updateDoc(postRef, {
                    [`reactions.${emoji}`]: hasIt ? arrayRemove(userId) : arrayUnion(userId)
                });
            } catch (e) {
                console.error('Failed to react:', e);
            }
        };

        window.viewProfile = (profileId) => {
            window.open(`profile-public-modal.html?id=${profileId}`, '_blank');
        };

        async function loadPosts() {
            if (isDemo) {
                posts = DEMO_POSTS;
                render();
                return;
            }

            try {
                const q = query(
                    collection(db, "artifacts", appId, "public", "data", "feed_posts"),
                    where("type", "in", ["text", "link", "image"]),
                    orderBy("timestamp", "desc"),
                    limit(20)
                );

                onSnapshot(q, (snap) => {
                    posts = [];
                    snap.forEach(d => posts.push({ id: d.id, ...d.data() }));
                    render();
                });
            } catch (e) {
                console.error('Failed to load posts:', e);
                posts = DEMO_POSTS;
                render();
            }
        }

        async function resolveIdentity(authUser) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');

            if (paramId || (authUser && authUser.email && !authUser.isAnonymous)) {
                try {
                    const staffSnap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                    let found = null;
                    staffSnap.forEach(d => {
                        const data = d.data();
                        if (d.id === paramId || data.email === authUser?.email) {
                            found = { id: d.id, ...data };
                        }
                    });
                    if (found) {
                        currentUser = found;
                        isDemo = false;
                    }
                } catch (e) {
                    console.log('Identity resolution failed:', e);
                }
            }

            loadPosts();
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                resolveIdentity(user);
            } else {
                signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
