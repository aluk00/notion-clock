<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>With Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #E6468B;
            --pink-soft: rgba(230, 70, 139, 0.1);
            --green: #10B981;
            --amber: #F59E0B;
            --red: #EF4444;
            --border: #E5E7EB;
            --text-main: #1C1C1C;
            --text-sub: #6B7280;
            --bg-grey: #F9FAFB;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #FFF; padding: 20px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 24px; height: 24px; }
        .dot { width: 100%; height: 100%; background: var(--pink); border-radius: 50%; }
        @keyframes heartbeat { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dot-anim { animation: heartbeat 3s infinite ease-in-out; }
        .dot-anim:nth-child(1) { animation-delay: 0s; }
        .dot-anim:nth-child(2) { animation-delay: 0.75s; }
        .dot-anim:nth-child(4) { animation-delay: 1.5s; }
        .dot-anim:nth-child(3) { animation-delay: 2.25s; }
        .title { font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-main); }
        .count { font-size: 12px; font-weight: 800; color: #FFF; background: var(--pink); padding: 4px 12px; border-radius: 99px; }
        
        .queue { display: flex; flex-direction: column; gap: 10px; }
        
        .card { 
            display: flex; align-items: stretch;
            background: #FFF; 
            border: 2px solid var(--border); 
            border-radius: 14px; 
            overflow: hidden;
            transition: 0.2s;
        }
        .card:hover { border-color: var(--pink); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(230, 70, 139, 0.1); }
        
        .card-priority { width: 6px; flex-shrink: 0; }
        .card-priority.high { background: var(--red); }
        .card-priority.medium { background: var(--amber); }
        .card-priority.low { background: var(--green); }
        
        .card-main { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-info { }
        .card-campaign { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--text-sub); letter-spacing: 0.08em; margin-bottom: 2px; }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-main); }
        
        .card-due { font-size: 11px; font-weight: 700; color: var(--text-sub); white-space: nowrap; }
        .card-due.urgent { color: var(--red); font-weight: 800; }
        
        .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .meta-tag { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; background: var(--bg-grey); color: var(--text-sub); }
        .meta-tag.asset { background: var(--pink-soft); color: var(--pink); }
        
        .card-actions { display: flex; gap: 8px; margin-top: 4px; }
        .card-btn { 
            padding: 8px 14px; 
            font-size: 10px; font-weight: 800; 
            border: none; border-radius: 8px; 
            cursor: pointer; 
            transition: 0.15s;
            text-transform: uppercase;
            font-family: inherit;
        }
        .card-btn.claim { background: var(--pink); color: #FFF; }
        .card-btn.claim:hover { background: #D63D7A; }
        .card-btn.done { background: var(--green); color: #FFF; }
        .card-btn.done:hover { background: #059669; }
        .card-btn.view { background: var(--bg-grey); color: var(--text-main); }
        .card-btn.view:hover { background: #E5E7EB; }
        
        .empty { text-align: center; padding: 40px; color: #CCC; font-size: 13px; font-weight: 600; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text-main); color: #FFF; padding: 12px 24px; border-radius: 10px; font-size: 12px; font-weight: 700; z-index: 2000; transition: 0.3s; }
        .toast.visible { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="dots-grid">
            <div class="dot dot-anim"></div>
            <div class="dot dot-anim"></div>
            <div class="dot dot-anim"></div>
            <div class="dot dot-anim"></div>
        </div>
        <span class="title">With Design</span>
    </div>
    <span class="count" id="count">0</span>
</div>

<div class="queue" id="queue"></div>

<div class="toast" id="toast">Updated</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    
    const firebaseConfig = { apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY", authDomain: "dmg-command-centre-native.firebaseapp.com", projectId: "dmg-command-centre-native" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
    
    let items = [];
    
    function formatDate(dateStr) {
        if (!dateStr) return 'No date';
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }
    
    function isUrgent(dateStr) {
        if (!dateStr) return false;
        const d = new Date(dateStr);
        const now = new Date();
        const diff = (d - now) / (1000 * 60 * 60 * 24);
        return diff >= 0 && diff <= 2;
    }
    
    function getPriorityClass(priority) {
        if (!priority) return 'medium';
        const p = priority.toLowerCase();
        if (p === 'high') return 'high';
        if (p === 'low') return 'low';
        return 'medium';
    }
    
    function render() {
        // Filter for DESK STATE = "With Design" OR CREATIVE WORKFLOW STATUS = "With Design"
        const withDesign = items.filter(p => {
            const desk = (p.deskState || '').toLowerCase();
            const creative = (p.creativeWorkflowStatus || '').toLowerCase();
            return desk.includes('with design') || creative.includes('with design');
        });
        
        document.getElementById('count').textContent = withDesign.length;
        
        const queue = document.getElementById('queue');
        if (withDesign.length === 0) {
            queue.innerHTML = '<div class="empty">Nothing with design right now</div>';
            return;
        }
        
        // Sort by due date (soonest first)
        withDesign.sort((a, b) => {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return new Date(a.dueDate) - new Date(b.dueDate);
        });
        
        queue.innerHTML = withDesign.map(p => {
            const assets = p.assetsNeeded || [];
            const assetTags = Array.isArray(assets) ? assets.slice(0, 2).map(a => `<span class="meta-tag asset">${a}</span>`).join('') : '';
            
            return `
                <div class="card">
                    <div class="card-priority ${getPriorityClass(p.priority)}"></div>
                    <div class="card-main">
                        <div class="card-top">
                            <div class="card-info">
                                <div class="card-campaign">${p.client || 'Internal'}</div>
                                <div class="card-title">${p.title}</div>
                            </div>
                            <div class="card-due ${isUrgent(p.dueDate) ? 'urgent' : ''}">${formatDate(p.dueDate)}</div>
                        </div>
                        <div class="card-meta">
                            ${assetTags}
                            <span class="meta-tag">${p.projectType || 'Project'}</span>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn claim" onclick="claimItem('${p.id}')">Claim</button>
                            <button class="card-btn done" onclick="markDone('${p.id}')">Done</button>
                            <button class="card-btn view" onclick="window.open('${p.url || '#'}', '_blank')">View</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    window.claimItem = async (id) => {
        try {
            // Note: To assign designer, you'd need to pass user ID
            // For now, just update the card summary to indicate it's claimed
            const res = await fetch(`${API_URL}/projects/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    cardSummary: 'Claimed by designer - in progress'
                })
            });
            
            if (!res.ok) throw new Error('Failed to update');
            
            await loadData(); // Refresh
            showToast('Claimed!');
        } catch (err) {
            console.error('Error:', err);
            showToast('Failed - check console');
        }
    };
    
    window.markDone = async (id) => {
        try {
            const res = await fetch(`${API_URL}/projects/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type: 'application/json' },
                body: JSON.stringify({ 
                    deskState: 'Ready for Edit',
                    creativeWorkflowStatus: 'Complete'
                })
            });
            
            if (!res.ok) throw new Error('Failed to update');
            
            await loadData(); // Refresh from server
            showToast('Marked as done!');
        } catch (err) {
            console.error('Error:', err);
            // Fallback to local update
            const item = items.find(p => p.id === id);
            if (item) {
                item.deskState = 'Ready for Edit';
                render();
            }
            showToast('Updated locally (API unavailable)');
        }
    };
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('visible');
        setTimeout(() => toast.classList.remove('visible'), 2000);
    }
    
    async function loadData() {
        try {
            const res = await fetch(API_URL + '/projects');
            const data = await res.json();
            items = data.projects || [];
            render();
        } catch (err) {
            console.error('Error:', err);
            document.getElementById('queue').innerHTML = '<div class="empty">Unable to load</div>';
        }
    }
    
    signInAnonymously(auth).then(loadData);
</script>

</body>
</html>
