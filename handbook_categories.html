<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handbook Categories | DMG New Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --creative-pink: #E6468B;
            --prod-green: #43B049;
            --editorial-red: #E94B4B;
            --ink: #1C1C1C;
        }
        body {
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 10px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .cat-card {
            background: #FFFFFF;
            border: 1px solid #EAEAEA;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .cat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.06);
            border-color: var(--dmg-blue);
        }

        .cat-title {
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            color: var(--ink);
        }

        .cat-desc {
            font-size: 10px;
            font-weight: 600;
            color: #757575;
            line-height: 1.3;
        }

        /* Dot Language per Team */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            width: 14px;
            height: 14px;
            margin-bottom: 4px;
        }
        .dot { border-radius: 50%; width: 100%; height: 100%; opacity: 0.8; }

        .cat-editorial .dot { background-color: var(--editorial-red); }
        .cat-creative .dot { background-color: var(--creative-pink); }
        .cat-production .dot { background-color: var(--prod-green); }
        .cat-global .dot { background-color: var(--dmg-blue); }

        @media (min-width: 600px) {
            .category-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div class="category-grid">
        <!-- Editorial -->
        <a href="#" class="cat-card cat-editorial">
            <div class="dots-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="cat-title">Editorial</div>
            <div class="cat-desc">Sourcing, Script Vault, and Banned Words.</div>
        </a>

        <!-- Production -->
        <a href="#" class="cat-card cat-production">
            <div class="dots-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="cat-title">Production</div>
            <div class="cat-desc">Studio Rules, Kit Booking, and Templates.</div>
        </a>

        <!-- Design -->
        <a href="#" class="cat-card cat-creative">
            <div class="dots-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="cat-title">Branding</div>
            <div class="cat-desc">Thumbnails, Covers, and Social Specs.</div>
        </a>

        <!-- Global/Admin -->
        <a href="#" class="cat-card cat-global">
            <div class="dots-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="cat-title">Directory</div>
            <div class="cat-desc">Rotas, IT Support, and Team Contacts.</div>
        </a>
    </div>

</body>
</html>
