<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logline Calendar</title>
    <style>
        /* Core Styles */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff; /* White background */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; /* Clean, modern font */
        }

        /* Main Container */
        .calendar-container {
            text-align: center;
        }

        /* Logline Text */
        .logline-text {
            font-size: 2rem;
            font-weight: 900; /* Extra bold font weight */
            color: #000000; /* Black color */
            letter-spacing: -0.03em; /* Slightly tighter kerning */
            white-space: nowrap; /* Keep text on one line */
        }

        /* Blue Dots - Mimicking the logo */
        .blue-dots {
            display: inline-block;
            margin: 0 10px; /* Space between dots and text */
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #21a0d8; /* DMG Logo Blue */
            border-radius: 50%;
            margin: 0 2px;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="logline-text">
            <!-- The first part of the text ("TODAY IS") -->
            <span>TODAY IS</span>
            
            <!-- The blue dots -->
            <span class="blue-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
            
            <!-- The dynamic date placeholder -->
            <span id="dynamic-date"></span>
        </div>
    </div>

    <script>
        function getDaySuffix(day) {
            if (day > 3 && day < 21) return 'th';
            switch (day % 10) {
                case 1:  return "st";
                case 2:  return "nd";
                case 3:  return "rd";
                default: return "th";
            }
        }

        function updateDate() {
            const date = new Date();
            const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

            const dayName = days[date.getDay()];
            const dayNumber = date.getDate();
            const monthName = months[date.getMonth()];

            const dateString = `${dayName}, ${dayNumber}${getDaySuffix(dayNumber)} ${monthName}`;
            
            document.getElementById('dynamic-date').textContent = dateString;
        }

        updateDate();
        // Update the date every minute to keep it accurate
        setInterval(updateDate, 60000); 
    </script>

</body>
</html>
