<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logline Calendar</title>
    <style>
        /* Core Styles */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start; /* Align content to the left */
            align-items: center;
            height: 100vh;
            background-color: transparent; /* Transparent background for Notion blend */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevent scrollbars */
            padding-left: 20px; /* Add some padding from the left edge */
        }

        /* Main Container */
        .calendar-container {
            text-align: left; /* Ensure text aligns left */
            width: 100%; /* Take full width */
        }

        /* Logline Text */
        .logline-text {
            font-size: 4rem; /* Large size */
            font-weight: 800; /* Extra bold */
            color: #000000;
            letter-spacing: -0.04em; /* Tight kerning */
            white-space: nowrap;
            line-height: 1;
            display: flex;
            align-items: center; /* Vertically align text and dots (baseline alignment handles the actual dot positioning) */
        }

        /* Blue Dots - Single line, matching the screenshot */
        .blue-dots {
            display: inline-block;
            margin: 0 15px; /* Space between dots and text */
            vertical-align: baseline; /* Align the block itself to the text baseline */
        }

        .dot {
            display: inline-block;
            width: 12px; /* INCREASED SIZE from 8px */
            height: 12px; /* INCREASED SIZE from 8px */
            background-color: #21a0d8; /* DMG Logo Blue */
            border-radius: 50%;
            margin: 0 3px; /* Space between dots */
            vertical-align: baseline; /* ALIGNS TO THE BOTTOM (baseline) OF THE SURROUNDING TEXT */
        }

        /* Responsive scaling for smaller screens */
        @media (max-width: 800px) {
            .logline-text { font-size: 2.5rem; }
            .blue-dots { margin: 0 10px; }
            .dot { width: 8px; height: 8px; } /* Adjusting responsive size proportionally */
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="logline-text">
            <!-- The first part of the text -->
            <span>TODAY IS</span>
            
            <!-- The blue dots (Single line) -->
            <span class="blue-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
            
            <!-- The dynamic date placeholder -->
            <span id="dynamic-date"></span>
        </div>
    </div>

    <script>
        function getDaySuffix(day) {
            if (day > 3 && day < 21) return 'th';
            switch (day % 10) {
                case 1:  return "st";
                case 2:  return "nd";
                case 3:  return "rd";
                default: return "th";
            }
        }

        function updateDate() {
            const date = new Date();
            const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

            const dayName = days[date.getDay()];
            const dayNumber = date.getDate();
            const monthName = months[date.getMonth()];

            // Format: SATURDAY, 13th DECEMBER 
            const dateString = `${dayName}, ${dayNumber}${getDaySuffix(dayNumber)} ${monthName}`;
            
            document.getElementById('dynamic-date').textContent = dateString;
        }

        updateDate();
        // Update the date every minute to keep it accurate
        setInterval(updateDate, 60000); 
    </script>

</body>
</html>
