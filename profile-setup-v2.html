<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Profile Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .dot-grid {
            display: inline-grid;
            grid-template-columns: repeat(2, 10px);
            gap: 6px;
            margin-bottom: 16px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3B82F6;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        .dot:nth-child(4) { animation-delay: 0.6s; }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        
        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #3B82F6;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .btn-primary {
            background: #3B82F6;
            color: #fff;
        }
        
        .btn-primary:hover {
            background: #2563EB;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-danger {
            background: #fee;
            color: #c00;
            margin-top: 10px;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 13px;
        }
        
        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
        
        .link a {
            color: #3B82F6;
            text-decoration: none;
            cursor: pointer;
        }
        
        .link a:hover {
            text-decoration: underline;
        }
        
        .error {
            background: #FEE;
            color: #C00;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        
        .success {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        
        .profile-display {
            text-align: center;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #3B82F6;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            margin: 0 auto 16px;
        }
        
        .profile-name {
            font-size: 20px;
            font-weight: 600;
            color: #111;
            margin-bottom: 4px;
        }
        
        .profile-email {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .profile-meta {
            font-size: 13px;
            color: #888;
        }
        
        .hidden {
            display: none;
        }
        
        .debug {
            margin-top: 20px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 10px;
            color: #666;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="dot-grid">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="title">DMG Command Centre</div>
            <div class="subtitle" id="pageSubtitle">Sign in to continue</div>
        </div>
        
        <div id="messageArea"></div>
        
        <!-- Login View -->
        <div id="loginView">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@dailymail.co.uk">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" id="loginBtn">Sign In</button>
            <button class="btn btn-secondary" id="guestBtn">Continue as Guest</button>
            <div class="link">
                Don't have an account? <a id="showRegister">Create one</a>
            </div>
        </div>
        
        <!-- Register View -->
        <div id="registerView" class="hidden">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Your Name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="you@dailymail.co.uk">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="At least 6 characters">
            </div>
            <div class="form-group">
                <label>Team</label>
                <select id="regTeam">
                    <option value="">Select team...</option>
                    <option value="Editorial">Editorial</option>
                    <option value="Creative">Creative</option>
                    <option value="Production">Production</option>
                    <option value="Social">Social</option>
                    <option value="Operations">Operations</option>
                    <option value="Sales">Sales</option>
                </select>
            </div>
            <button class="btn btn-primary" id="registerBtn">Create Account</button>
            <div class="link">
                Already have an account? <a id="showLogin">Sign in</a>
            </div>
        </div>
        
        <!-- Profile View -->
        <div id="profileView" class="hidden">
            <div class="profile-display">
                <div class="avatar" id="profileAvatar">?</div>
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-email" id="profileEmail"></div>
                <div class="profile-meta" id="profileMeta"></div>
            </div>
            <button class="btn btn-secondary" id="signOutBtn">Sign Out</button>
        </div>
        
        <div id="debugArea" class="debug hidden"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "dmg-command-centre-native";
        
        // Debug mode - set to true to see debug info
        const DEBUG = true;
        
        function debug(msg) {
            if (DEBUG) {
                const area = document.getElementById('debugArea');
                area.classList.remove('hidden');
                area.innerHTML += msg + '<br>';
                console.log(msg);
            }
        }
        
        function showMessage(text, isError = false) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="${isError ? 'error' : 'success'}">${text}</div>`;
            setTimeout(() => area.innerHTML = '', 5000);
        }
        
        function showView(viewId) {
            ['loginView', 'registerView', 'profileView'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            
            const subtitle = document.getElementById('pageSubtitle');
            if (viewId === 'loginView') subtitle.textContent = 'Sign in to continue';
            if (viewId === 'registerView') subtitle.textContent = 'Create your account';
            if (viewId === 'profileView') subtitle.textContent = 'Your profile';
        }
        
        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }
        
        // Auth state listener
        auth.onAuthStateChanged(async (user) => {
            debug('Auth state changed: ' + (user ? user.email : 'null'));
            
            if (user) {
                showView('profileView');
                
                // Try to get profile from Firestore
                try {
                    const profilePath = `artifacts/${appId}/public/data/user_profiles/${user.uid}`;
                    debug('Fetching profile from: ' + profilePath);
                    
                    const doc = await db.doc(profilePath).get();
                    
                    if (doc.exists) {
                        const data = doc.data();
                        debug('Profile found: ' + JSON.stringify(data));
                        document.getElementById('profileAvatar').textContent = getInitials(data.fullName);
                        document.getElementById('profileName').textContent = data.fullName || 'User';
                        document.getElementById('profileEmail').textContent = user.email;
                        document.getElementById('profileMeta').textContent = data.team ? `Team: ${data.team}` : '';
                    } else {
                        debug('No profile document, using auth data');
                        document.getElementById('profileAvatar').textContent = getInitials(user.displayName || user.email);
                        document.getElementById('profileName').textContent = user.displayName || 'User';
                        document.getElementById('profileEmail').textContent = user.email;
                        document.getElementById('profileMeta').textContent = user.isAnonymous ? 'Guest Account' : '';
                    }
                } catch (e) {
                    debug('Profile fetch error: ' + e.message);
                    document.getElementById('profileAvatar').textContent = getInitials(user.email);
                    document.getElementById('profileName').textContent = user.displayName || 'User';
                    document.getElementById('profileEmail').textContent = user.email || 'Guest';
                }
            } else {
                showView('loginView');
            }
        });
        
        // Login
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage('Please enter email and password', true);
                return;
            }
            
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            
            try {
                debug('Attempting login: ' + email);
                await auth.signInWithEmailAndPassword(email, password);
                debug('Login successful');
            } catch (e) {
                debug('Login error: ' + e.code + ' - ' + e.message);
                let msg = 'Sign in failed';
                if (e.code === 'auth/user-not-found') msg = 'No account found with this email';
                if (e.code === 'auth/wrong-password') msg = 'Incorrect password';
                if (e.code === 'auth/invalid-email') msg = 'Invalid email address';
                if (e.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
                showMessage(msg, true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
        
        // Register
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const team = document.getElementById('regTeam').value;
            
            if (!name || !email || !password) {
                showMessage('Please fill in all fields', true);
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', true);
                return;
            }
            
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';
            
            try {
                debug('Creating account: ' + email);
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                debug('Account created: ' + cred.user.uid);
                
                // Update display name
                await cred.user.updateProfile({ displayName: name });
                debug('Display name updated');
                
                // Save profile to Firestore
                const profilePath = `artifacts/${appId}/public/data/user_profiles/${cred.user.uid}`;
                debug('Saving profile to: ' + profilePath);
                
                await db.doc(profilePath).set({
                    fullName: name,
                    firstName: name.split(' ')[0],
                    lastName: name.split(' ').slice(1).join(' '),
                    email: email,
                    team: team,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                debug('Profile saved');
                showMessage('Account created successfully!');
            } catch (e) {
                debug('Register error: ' + e.code + ' - ' + e.message);
                let msg = 'Registration failed';
                if (e.code === 'auth/email-already-in-use') msg = 'An account with this email already exists';
                if (e.code === 'auth/invalid-email') msg = 'Invalid email address';
                if (e.code === 'auth/weak-password') msg = 'Password is too weak';
                showMessage(msg, true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
        
        // Guest login
        document.getElementById('guestBtn').addEventListener('click', async () => {
            const btn = document.getElementById('guestBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';
            
            try {
                debug('Signing in anonymously');
                await auth.signInAnonymously();
                debug('Anonymous sign in successful');
            } catch (e) {
                debug('Anonymous sign in error: ' + e.message);
                showMessage('Guest login failed: ' + e.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Continue as Guest';
            }
        });
        
        // Sign out
        document.getElementById('signOutBtn').addEventListener('click', async () => {
            try {
                await auth.signOut();
                debug('Signed out');
            } catch (e) {
                debug('Sign out error: ' + e.message);
            }
        });
        
        // View toggles
        document.getElementById('showRegister').addEventListener('click', () => showView('registerView'));
        document.getElementById('showLogin').addEventListener('click', () => showView('loginView'));
        
        debug('Page loaded');
    </script>
</body>
</html>
