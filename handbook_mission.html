<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handbook Mission Statement</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #FFFFFF;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .mission-container {
            text-align: center;
            cursor: default;
        }

        .mission-text {
            font-size: 4.5rem;
            font-weight: 900;
            color: #000000;
            letter-spacing: -0.05em;
            line-height: 0.9;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Light Mouse Interaction */
        body:hover .mission-text {
            letter-spacing: -0.02em;
        }

        .highlight {
            position: relative;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .mission-text { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="mission-container">
        <div class="mission-text">
            THE PUBLISHER<br>
            FOR THE <span style="color: #21a0d8; font-style: italic;">NEW ERA.</span>
        </div>
    </div>
    <script>
        // Subtle tilt effect on mouse move
        const container = document.body;
        const text = document.querySelector('.mission-text');
        
        container.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            text.style.transform = `perspective(1000px) rotateX(${-y}deg) rotateY(${x}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            text.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
