<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Shoots | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue: #21a0d8; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; --sales: #F97316; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 700px; overflow: hidden; }
        .header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dot-grid span { width: 6px; height: 6px; border-radius: 50%; background: var(--sales); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 15px; font-weight: 900; }
        .badge { font-size: 10px; font-weight: 700; padding: 4px 12px; border-radius: 99px; background: #FFEDD5; color: #C2410C; margin-left: auto; }
        .stats { display: flex; gap: 24px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .stat { text-align: center; }
        .stat-value { font-size: 24px; font-weight: 900; color: var(--sales); }
        .stat-label { font-size: 10px; color: var(--ink-sub); text-transform: uppercase; font-weight: 600; }
        .list { max-height: 300px; overflow-y: auto; }
        .shoot { padding: 14px 20px; border-bottom: 1px solid #F5F5F5; display: flex; align-items: center; gap: 14px; }
        .shoot:last-child { border-bottom: none; }
        .shoot-date { width: 50px; text-align: center; }
        .shoot-day { font-size: 20px; font-weight: 900; color: var(--sales); }
        .shoot-month { font-size: 10px; color: var(--ink-sub); text-transform: uppercase; }
        .shoot-info { flex: 1; }
        .shoot-title { font-size: 14px; font-weight: 700; }
        .shoot-detail { font-size: 12px; color: var(--ink-sub); margin-top: 2px; }
        .shoot-status { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; }
        .status-confirmed { background: #DCFCE7; color: #166534; }
        .status-pending { background: #FEF3C7; color: #B45309; }
        .status-cancelled { background: #FEE2E2; color: #B91C1C; }
        .empty { padding: 50px 20px; text-align: center; }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 50px; color: var(--ink-sub); font-size: 12px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--sales); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        
        var db = firebase.firestore();
        var auth = firebase.auth();
        var appId = "dmg-command-centre-native";
        var shoots = [];
        var root = document.getElementById('root');

        function formatDate(d) {
            if (!d) return { day: '?', month: '?' };
            var date = d.toDate ? d.toDate() : new Date(d);
            return {
                day: date.getDate(),
                month: date.toLocaleDateString('en-GB', { month: 'short' })
            };
        }

        function render() {
            var upcoming = shoots.filter(function(s) {
                var d = s.date && s.date.toDate ? s.date.toDate() : new Date(s.date);
                return d >= new Date();
            });
            var confirmed = shoots.filter(function(s) { return s.status === 'confirmed'; }).length;
            var pending = shoots.filter(function(s) { return s.status === 'pending'; }).length;
            
            var shootsHtml = '';
            for (var i = 0; i < upcoming.slice(0, 10).length; i++) {
                var s = upcoming[i];
                var d = formatDate(s.date);
                var statusClass = 'status-' + (s.status || 'pending');
                shootsHtml += '\
                    <div class="shoot">\
                        <div class="shoot-date">\
                            <div class="shoot-day">' + d.day + '</div>\
                            <div class="shoot-month">' + d.month + '</div>\
                        </div>\
                        <div class="shoot-info">\
                            <div class="shoot-title">' + (s.title || s.client || 'Untitled Shoot') + '</div>\
                            <div class="shoot-detail">' + (s.location || 'TBC') + ' • ' + (s.brand || s.client || 'Client TBC') + '</div>\
                        </div>\
                        <span class="shoot-status ' + statusClass + '">' + (s.status || 'Pending') + '</span>\
                    </div>\
                ';
            }
            
            root.innerHTML = '\
                <div class="widget">\
                    <div class="header">\
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>\
                        <h2 class="title">Commercial Shoots</h2>\
                        <span class="badge">' + upcoming.length + ' upcoming</span>\
                    </div>\
                    <div class="stats">\
                        <div class="stat">\
                            <div class="stat-value">' + shoots.length + '</div>\
                            <div class="stat-label">Total</div>\
                        </div>\
                        <div class="stat">\
                            <div class="stat-value" style="color:#22C55E">' + confirmed + '</div>\
                            <div class="stat-label">Confirmed</div>\
                        </div>\
                        <div class="stat">\
                            <div class="stat-value" style="color:#F59E0B">' + pending + '</div>\
                            <div class="stat-label">Pending</div>\
                        </div>\
                    </div>\
                    ' + (upcoming.length === 0 ? '\
                        <div class="empty">\
                            <div class="empty-icon">🎬</div>\
                            <div class="empty-title">No Upcoming Shoots</div>\
                            <div class="empty-sub">Add shoots to the shoots collection in Firebase with: title, date, location, client, status.</div>\
                        </div>\
                    ' : '\
                        <div class="list">' + shootsHtml + '</div>\
                    ') + '\
                </div>\
            ';
        }

        function loadData() {
            root.innerHTML = '<div class="widget"><div class="loading"><div class="spinner"></div>Loading shoots...</div></div>';
            
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shoots')
                .onSnapshot(function(snapshot) {
                    shoots = [];
                    snapshot.forEach(function(doc) {
                        shoots.push(Object.assign({ id: doc.id }, doc.data()));
                    });
                    shoots.sort(function(a, b) {
                        var aDate = a.date && a.date.toDate ? a.date.toDate() : new Date(a.date || 0);
                        var bDate = b.date && b.date.toDate ? b.date.toDate() : new Date(b.date || 0);
                        return aDate - bDate;
                    });
                    render();
                }, function(error) {
                    console.error('Firestore error:', error);
                    shoots = [];
                    render();
                });
        }

        auth.signInAnonymously().then(function() {
            loadData();
        }).catch(function(error) {
            console.error('Auth error:', error);
            shoots = [];
            render();
        });
    </script>
</body>
</html>
