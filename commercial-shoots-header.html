<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Shoots</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 8px);
            gap: 4px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43B049;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        .dot:nth-child(4) { animation-delay: 0.6s; }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #111;
        }
        
        .stats-row {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px 20px;
            flex: 1;
        }
        
        .stat-label {
            font-size: 11px;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #111;
        }
        
        .stat-value.highlight {
            color: #43B049;
        }
        
        .shoots-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .shoot-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #43B049;
        }
        
        .shoot-date {
            text-align: center;
            min-width: 50px;
        }
        
        .shoot-day {
            font-size: 24px;
            font-weight: 700;
            color: #111;
            line-height: 1;
        }
        
        .shoot-month {
            font-size: 11px;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
        }
        
        .shoot-info {
            flex: 1;
        }
        
        .shoot-title {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            margin-bottom: 4px;
        }
        
        .shoot-meta {
            font-size: 12px;
            color: #666;
            display: flex;
            gap: 12px;
        }
        
        .shoot-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
        }
        
        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-completed {
            background: #e2e3e5;
            color: #383d41;
        }
        
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .empty-text {
            font-size: 13px;
            color: #888;
            line-height: 1.6;
        }
        
        .loading {
            text-align: center;
            padding: 48px;
            color: #666;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
        }
        
        .debug {
            margin-top: 20px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 10px;
            color: #666;
            font-family: monospace;
        }
        
        code {
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="dot-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="title">Commercial Shoots</div>
    </div>
    
    <div id="content">
        <div class="loading">Loading shoots...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = "dmg-command-centre-native";
        
        async function loadShoots() {
            const content = document.getElementById('content');
            let debugInfo = [];
            
            try {
                // Try multiple possible collection paths
                const paths = [
                    `artifacts/${appId}/public/data/shoot_calendar_events`,
                    `artifacts/${appId}/public/data/shoots`,
                    `artifacts/${appId}/public/data/production_events`,
                    `shoot_calendar_events`,
                    `shoots`,
                    `production_events`
                ];
                
                let shoots = [];
                let usedPath = '';
                
                for (const path of paths) {
                    debugInfo.push(`Trying: ${path}`);
                    try {
                        // First try without orderBy in case there's no index
                        const snapshot = await db.collection(path).limit(50).get();
                        
                        if (!snapshot.empty) {
                            snapshot.forEach(doc => {
                                shoots.push({ id: doc.id, ...doc.data() });
                            });
                            usedPath = path;
                            debugInfo.push(`✓ Found ${shoots.length} items in ${path}`);
                            break;
                        } else {
                            debugInfo.push(`Empty: ${path}`);
                        }
                    } catch (e) {
                        debugInfo.push(`Error on ${path}: ${e.message}`);
                    }
                }
                
                if (shoots.length === 0) {
                    content.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🎬</div>
                            <div class="empty-title">No Shoots Scheduled</div>
                            <div class="empty-text">
                                Add shoot data to Firestore to see it here.<br><br>
                                <strong>Expected collection path:</strong><br>
                                <code>artifacts/${appId}/public/data/shoot_calendar_events</code><br><br>
                                <strong>Document fields:</strong><br>
                                <code>title</code>, <code>date</code>, <code>location</code>, <code>client</code>, <code>status</code>
                            </div>
                        </div>
                        <div class="debug">
                            <strong>Debug - Paths tried:</strong><br>
                            ${debugInfo.join('<br>')}
                        </div>
                    `;
                    return;
                }
                
                // Sort by date
                const now = new Date();
                shoots.sort((a, b) => {
                    const dateA = a.date?.toDate ? a.date.toDate() : new Date(a.date || 0);
                    const dateB = b.date?.toDate ? b.date.toDate() : new Date(b.date || 0);
                    return dateA - dateB;
                });
                
                // Calculate stats
                const upcoming = shoots.filter(s => {
                    const shootDate = s.date?.toDate ? s.date.toDate() : new Date(s.date);
                    return shootDate >= now;
                });
                
                const thisWeek = upcoming.filter(s => {
                    const shootDate = s.date?.toDate ? s.date.toDate() : new Date(s.date);
                    const weekFromNow = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
                    return shootDate <= weekFromNow;
                });
                
                const confirmed = shoots.filter(s => 
                    s.status?.toLowerCase() === 'confirmed'
                ).length;
                
                // Render
                content.innerHTML = `
                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="stat-label">This Week</div>
                            <div class="stat-value highlight">${thisWeek.length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Upcoming</div>
                            <div class="stat-value">${upcoming.length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Confirmed</div>
                            <div class="stat-value">${confirmed}</div>
                        </div>
                    </div>
                    <div class="shoots-list">
                        ${upcoming.slice(0, 5).map(shoot => renderShoot(shoot)).join('')}
                    </div>
                    <div class="debug">
                        <strong>Debug:</strong> Loaded ${shoots.length} shoots from ${usedPath}
                    </div>
                `;
                
            } catch (error) {
                console.error('Error loading shoots:', error);
                content.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                    <div class="debug">
                        <strong>Debug:</strong><br>
                        ${debugInfo.join('<br>')}
                    </div>
                `;
            }
        }
        
        function renderShoot(shoot) {
            const date = shoot.date?.toDate ? shoot.date.toDate() : new Date(shoot.date);
            const day = date.getDate();
            const month = date.toLocaleDateString('en-GB', { month: 'short' });
            
            const status = shoot.status || 'pending';
            const statusClass = status.toLowerCase() === 'confirmed' ? 'status-confirmed' :
                               status.toLowerCase() === 'completed' ? 'status-completed' : 'status-pending';
            
            const title = shoot.title || shoot.name || shoot.client || 'Untitled Shoot';
            const location = shoot.location || '';
            const client = shoot.client || shoot.brand || '';
            
            return `
                <div class="shoot-item">
                    <div class="shoot-date">
                        <div class="shoot-day">${day}</div>
                        <div class="shoot-month">${month}</div>
                    </div>
                    <div class="shoot-info">
                        <div class="shoot-title">${title}</div>
                        <div class="shoot-meta">
                            ${location ? `<span>📍 ${location}</span>` : ''}
                            ${client ? `<span>🏢 ${client}</span>` : ''}
                        </div>
                    </div>
                    <div class="shoot-status ${statusClass}">${status}</div>
                </div>
            `;
        }
        
        loadShoots();
    </script>
</body>
</html>
