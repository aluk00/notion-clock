<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Shoots Header | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --production: #43B049;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; }
        
        .widget { background: #FFF; border-radius: 14px; border: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        
        .left { display: flex; align-items: center; gap: 14px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 18px; height: 18px; }
        .dot { width: 100%; height: 100%; background: var(--production); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 16px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: -0.02em; }
        
        .center { display: flex; align-items: center; gap: 10px; }
        
        .stat-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-soft); border-radius: 20px; font-size: 10px; font-weight: 700; color: var(--ink-sub); }
        .stat-pill strong { color: var(--ink); font-size: 12px; }
        
        .right { display: flex; align-items: center; gap: 10px; }
        
        .view-toggle { display: flex; background: var(--bg-soft); border-radius: 8px; padding: 3px; }
        .view-btn { padding: 6px 12px; border: none; background: transparent; font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); cursor: pointer; border-radius: 6px; font-family: inherit; }
        .view-btn.active { background: var(--production); color: #FFF; }
        
        .action-btn { padding: 8px 16px; background: var(--production); color: #FFF; border: none; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; font-family: inherit; }
        .action-btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Demo shoots data
        const DEMO_SHOOTS = [
            { title: 'Sky Vegas Campaign', date: '2025-01-13', status: 'confirmed', client: 'Sky' },
            { title: 'JAECOO 24 Hours', date: '2025-01-15', status: 'confirmed', client: 'JAECOO' },
            { title: 'Wuthering Heights', date: '2025-01-20', status: 'pending', client: 'Studio Canal' },
            { title: 'Trading 212', date: '2025-01-22', status: 'confirmed', client: 'Trading 212' },
            { title: 'Chery Family', date: '2025-01-28', status: 'pending', client: 'Chery' },
        ];
        
        function App() {
            const [shoots, setShoots] = useState([]);
            const [view, setView] = useState('week');
            
            useEffect(() => {
                const unsub = db.collection('shoots')
                    .onSnapshot(snap => {
                        if (snap.empty) {
                            setShoots(DEMO_SHOOTS);
                        } else {
                            setShoots(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }
                    }, err => {
                        console.log('Using demo shoots:', err.message);
                        setShoots(DEMO_SHOOTS);
                    });
                return () => unsub();
            }, []);
            
            const stats = useMemo(() => {
                const now = new Date();
                const weekEnd = new Date(now);
                weekEnd.setDate(weekEnd.getDate() + 7);
                
                const thisWeek = shoots.filter(s => {
                    const d = new Date(s.date);
                    return d >= now && d <= weekEnd;
                }).length;
                
                const upcoming = shoots.filter(s => new Date(s.date) >= now).length;
                const confirmed = shoots.filter(s => s.status === 'confirmed').length;
                
                return { thisWeek, upcoming, confirmed };
            }, [shoots]);
            
            const handleViewChange = (newView) => {
                setView(newView);
                // Notify parent page
                window.parent.postMessage({ type: 'VIEW_CHANGE', view: newView }, '*');
            };
            
            const handleNewShoot = () => {
                window.parent.postMessage({ type: 'NEW_SHOOT' }, '*');
            };
            
            return (
                <div className="widget">
                    <div className="left">
                        <div className="dots">
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                        </div>
                        <span className="title">Commercial Shoots</span>
                    </div>
                    
                    <div className="center">
                        <div className="stat-pill">
                            <span>This Week</span>
                            <strong>{stats.thisWeek}</strong>
                        </div>
                        <div className="stat-pill">
                            <span>Upcoming</span>
                            <strong>{stats.upcoming}</strong>
                        </div>
                        <div className="stat-pill">
                            <span>Confirmed</span>
                            <strong>{stats.confirmed}</strong>
                        </div>
                    </div>
                    
                    <div className="right">
                        <div className="view-toggle">
                            <button 
                                className={`view-btn ${view === 'day' ? 'active' : ''}`}
                                onClick={() => handleViewChange('day')}
                            >Day</button>
                            <button 
                                className={`view-btn ${view === 'week' ? 'active' : ''}`}
                                onClick={() => handleViewChange('week')}
                            >Week</button>
                            <button 
                                className={`view-btn ${view === 'month' ? 'active' : ''}`}
                                onClick={() => handleViewChange('month')}
                            >Month</button>
                        </div>
                        <button className="action-btn" onClick={handleNewShoot}>+ New Shoot</button>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
