<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Hub Header</title>
    <style>
        /* Core Layout */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            height: 100vh; 
            background-color: transparent; 
            font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            /* Minimal padding to prevent clipping on some screens */
            padding-left: 5px; 
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 1.5rem; 
            padding: 5px 0; /* Minimized padding */
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* Text Styling */
        .title-text {
            font-size: 4rem; 
            font-weight: 800; 
            color: #000000;
            letter-spacing: -0.04em; 
            line-height: 1;
            opacity: 0; 
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: uppercase;
            transition: letter-spacing 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        /* Hover effect for letter spacing */
        body:hover .title-text {
            letter-spacing: -0.01em;
        }

        /* Staggered text delays */
        .text-left {
            animation-delay: 0.1s;
        }

        .text-right {
            animation-delay: 0.3s;
        }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px; 
            width: 44px; 
            height: 44px;
            pointer-events: none;
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG BLUE */
            border-radius: 50%;
            transform: scale(0); 
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Stagger the dot animations */
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* Animations */
        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            to { transform: scale(1); }
        }
        
        /* Responsive scaling */
        @media (max-width: 600px) {
            .title-text { font-size: 2.5rem; }
            .header-container { gap: 1rem; }
            .dots-grid { width: 28px; height: 28px; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-text text-left">PROJECT</div>

        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="title-text text-right">HUB</div>
    </div>

    <script>
        const container = document.querySelector('.header-container');
        
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * 15;
            container.style.transform = `perspective(1000px) rotateX(${-y}deg) rotateY(${x}deg)`;
        });

        window.addEventListener('mouseleave', () => {
            container.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
