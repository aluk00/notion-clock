<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG New Media HQ Header</title>
    <style>
        /* Core Layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%; 
            height: 100vh; /* Set to viewport height to capture mouse movement */
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: transparent;
            font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* Outer Centering Wrapper */
        .outer-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 20px; /* Reduced padding for tighter fit */
            white-space: nowrap; 
            box-sizing: border-box;
            width: fit-content;
        }

        /* Inner Container for the Lockup with 3D context */
        .header-container {
            display: flex;
            align-items: center;
            gap: 0.96rem; 
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* Text Styling */
        .title-text {
            font-size: 7.68rem; 
            color: #000000;
            letter-spacing: -0.04em; 
            line-height: 1;
            opacity: 0;
            transform: translateY(19.2px); 
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: lowercase;
            transition: letter-spacing 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none; /* Let hover events pass to body */
        }

        /* Hover effect for letter spacing (expands slightly) */
        body:hover .title-text {
            letter-spacing: -0.01em;
        }

        .text-dmg {
            font-weight: 800; 
            animation-delay: 0.1s;
        }
        
        .text-hq {
            font-weight: 600; 
            animation-delay: 0.3s;
        }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11.52px; 
            width: 84.48px; 
            height: 84.48px; 
            pointer-events: none;
        }

        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            to { transform: scale(1); }
        }

        /* Responsive scaling */
        @media (max-width: 600px) {
            .title-text { font-size: 4rem; } 
            .outer-wrapper { padding: 10px 20px; }
            .header-container { gap: 0.6rem; }
            .dots-grid { width: 44px; height: 44px; gap: 6px; }
        }
    </style>
</head>
<body>
    
    <div class="outer-wrapper">
        <div class="header-container">
            <div class="title-text text-dmg">dmg</div>

            <div class="dots-grid">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="title-text text-hq">newmediahq</div>
        </div>
    </div>

    <script>
        const container = document.querySelector('.header-container');
        
        // Interactive 3D Tilt Effect
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * 15;
            container.style.transform = `perspective(1000px) rotateX(${-y}deg) rotateY(${x}deg)`;
        });

        // Reset on mouse leave
        window.addEventListener('mouseleave', () => {
            container.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
