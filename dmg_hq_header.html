<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG New Media HQ Header</title>
    <style>
        /* Core Layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%; 
            height: auto; 
        }

        body {
            /* Vertical Padding for breathing room (24px top/bottom) */
            padding: 24px 0;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            background-color: transparent; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative; 
        }

        /* Outer Centering Wrapper */
        .outer-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;

            /* INCREASED HORIZONTAL PADDING (40px * 1.3 = 52px) */
            padding: 15px 52px; /* ADDED 15px VERTICAL PADDING HERE */
            white-space: nowrap; 
            box-sizing: border-box;
            width: fit-content;
        }

        /* Inner Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 0.96rem; /* Scaled gap */
        }

        /* Text Styling (Overall Look) */
        .title-text {
            font-size: 7.68rem; /* 40% SMALLER (7.68rem) */
            color: #000000;
            letter-spacing: -0.04em; 
            line-height: 1;
            
            /* Animation Setup */
            opacity: 0;
            transform: translateY(19.2px); 
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Specific styles matching the actual logo typography */
        .text-dmg {
            font-weight: 800; 
            animation-delay: 0.1s;
        }
        
        .text-hq {
            font-weight: 600; 
            animation-delay: 0.3s;
        }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11.52px; 
            width: 84.48px; 
            height: 84.48px; 
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Stagger the dot animations */
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* Animations */
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }

        /* Responsive scaling for smaller screens/embeds */
        @media (max-width: 600px) {
            .title-text { font-size: 5rem; } 
            .outer-wrapper { padding: 10px 30px; }
            .header-container { gap: 0.8rem; }
            .dots-grid { width: 56.32px; height: 56.32px; gap: 8.53px; }
        }
    </style>
</head>
<body>
    
    <div class="outer-wrapper">
        <div class="header-container">
            <!-- Left Text: dmg -->
            <div class="title-text text-dmg">dmg</div>

            <!-- Center Dots (The Logo Motif) -->
            <div class="dots-grid">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <!-- Right Text: newmediahq -->
            <div class="title-text text-hq">newmediahq</div>
        </div>
    </div>

</body>
</html>
