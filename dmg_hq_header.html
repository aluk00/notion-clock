<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG New Media HQ Header</title>
    <style>
        /* Core Layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%; 
            height: auto; 
        }

        body {
            /* INCREASED PADDING FOR MORE VERTICAL SPACE (was 20px) */
            padding: 40px 0;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            background-color: transparent; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative; 
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            /* Scaled gap (0.8rem * 2 = 1.6rem) */
            gap: 1.6rem; 
            
            /* CRITICAL FIX FOR CENTERING IN IFRAME */
            position: absolute; 
            left: 50%; 
            transform: translateX(-50%); 
        }

        /* Text Styling (Overall Look) */
        .title-text {
            font-size: 12.8rem; /* 100% LARGER (6.4rem * 2 = 12.8rem) */
            color: #000000;
            letter-spacing: -0.04em; 
            line-height: 1;
            
            /* Animation Setup */
            opacity: 0;
            /* Scaled slide distance (16px * 2 = 32px) */
            transform: translateY(32px); 
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Specific styles matching the actual logo typography */
        .text-dmg {
            font-weight: 800; 
            animation-delay: 0.1s;
        }
        
        .text-hq {
            font-weight: 600; 
            animation-delay: 0.3s;
        }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* Scaled gap (9.6px * 2 = 19.2px) */
            gap: 19.2px; 
            /* 100% LARGER (70.4px * 2 = 140.8px) */
            width: 140.8px; 
            height: 140.8px; 
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Stagger the dot animations */
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* Animations */
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }

        /* Responsive scaling for smaller screens/embeds */
        @media (max-width: 600px) {
            .title-text { font-size: 8rem; } /* Scaled responsive size */
            .header-container { gap: 1.28rem; }
            .dots-grid { width: 89.6px; height: 89.6px; gap: 12.8px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Left Text: dmg -->
        <div class="title-text text-dmg">dmg</div>

        <!-- Center Dots (The Logo Motif) -->
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Right Text: newmediahq -->
        <div class="title-text text-hq">newmediahq</div>
    </div>

</body>
</html>
