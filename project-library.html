                                            <div style={{ width: 48, height: 48, borderRadius: '50%', background: '#FEE2E2', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px', color: 'var(--danger)' }}>
                                                <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                                    <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" strokeLinecap="round" strokeLinejoin="round"/>
                                                </svg>
                                            </div>
                                            <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink)', marginBottom: 8 }}>
                                                Are you sure you want to delete "{modalData.name}"?
                                            </div>
                                            <div style={{ fontSize: 12, color: 'var(--ink-muted)' }}>
                                                {modalData.isNotionItem
                                                    ? 'This will archive the item in Notion. It can be restored later.'
                                                    : 'This action cannot be undone.'}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button className="btn btn-secondary" onClick={() => { setShowModal(null); setModalData(null); }}>Cancel</button>
                                        <button className="btn" style={{ background: 'var(--danger)', color: 'white', borderColor: 'var(--danger)' }}
                                                onClick={() => deleteItem(modalData.id, modalData.isFolder, modalData.isNotionItem)}>
                                            Delete
                                        </button>
                                    </div>
                                </>
                            )}

                            {/* ═══════════════════════════════════════════════════════════
                                ADD DELIVERABLES MODAL (after project creation)
                            ═══════════════════════════════════════════════════════════ */}
                            {showModal === 'addDeliverables' && modalData && (() => {
                                const deliverableNames = modalData.deliverables || [''];
                                const setDeliverableNames = (names) => setModalData({ ...modalData, deliverables: names });

                                const addDeliverable = () => {
                                    setDeliverableNames([...deliverableNames, '']);
                                };

                                const updateDeliverable = (index, value) => {
                                    const updated = [...deliverableNames];
                                    updated[index] = value;
                                    setDeliverableNames(updated);
                                };

                                const removeDeliverable = (index) => {
                                    if (deliverableNames.length > 1) {
                                        setDeliverableNames(deliverableNames.filter((_, i) => i !== index));
                                    }
                                };

                                const createDeliverables = async () => {
                                    const validNames = deliverableNames.filter(n => n.trim());
                                    if (validNames.length === 0) {
                                        setShowModal(null);
                                        setModalData(null);
                                        return;
                                    }

                                    try {
                                        for (const name of validNames) {
                                            const res = await fetch(`${CONFIG.API_URL}/projects`, {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({
                                                    title: name.trim(),
                                                    parentItemId: modalData.projectId,
                                                    status: 'Not started'
                                                })
                                            });
                                            const data = await res.json();
                                            if (!data.success) {
                                                showToast(`Failed to create "${name}": ${data.error}`, 'error');
                                            }
                                        }
                                        showToast(`Created ${validNames.length} deliverable(s)`, 'success');
                                        await fetchProjects();
                                    } catch (err) {
                                        showToast(`Error: ${err.message}`, 'error');
                                    }

                                    setShowModal(null);
                                    setModalData(null);
                                };

                                return (
                                    <>
                                        <div className="modal-header">
                                            <span>Add Deliverables to "{modalData.projectName}"</span>
                                            <button className="modal-close" onClick={() => { setShowModal(null); setModalData(null); }}>{Icons.x}</button>
                                        </div>
                                        <div className="modal-body">
                                            <div style={{ marginBottom: 16 }}>
                                                <div style={{ fontSize: 13, color: 'var(--ink-muted)', marginBottom: 12 }}>
                                                    Would you like to add deliverables/episodes to this project? You can skip this and add them later.
                                                </div>

                                                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                                    {deliverableNames.map((name, index) => (
                                                        <div key={index} style={{ display: 'flex', gap: 8 }}>
                                                            <input
                                                                type="text"
                                                                className="form-input"
                                                                placeholder={`Deliverable ${index + 1} (e.g. Episode 1, Hero Video)`}
                                                                value={name}
                                                                onChange={(e) => updateDeliverable(index, e.target.value)}
                                                                autoFocus={index === 0}
                                                                onKeyDown={(e) => {
                                                                    if (e.key === 'Enter' && index === deliverableNames.length - 1) {
                                                                        addDeliverable();
                                                                    }
                                                                }}
                                                                style={{ flex: 1 }} />
                                                            {deliverableNames.length > 1 && (
                                                                <button
                                                                    onClick={() => removeDeliverable(index)}
                                                                    style={{
                                                                        background: 'none',
                                                                        border: '1px solid #E5E7EB',
                                                                        borderRadius: 6,
                                                                        padding: '8px 10px',
                                                                        cursor: 'pointer',
                                                                        color: 'var(--ink-muted)'
                                                                    }}>
                                                                    {Icons.x}
                                                                </button>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>

                                                <button
                                                    onClick={addDeliverable}
                                                    style={{
                                                        marginTop: 12,
                                                        background: 'none',
                                                        border: '1px dashed #D1D5DB',
                                                        borderRadius: 6,
                                                        padding: '8px 16px',
                                                        color: 'var(--dmg-blue)',
                                                        cursor: 'pointer',
                                                        fontSize: 12,
                                                        width: '100%',
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'center',
                                                        gap: 6
                                                    }}>
                                                    {Icons.plus} Add Another Deliverable
                                                </button>
                                            </div>

                                            {/* Quick Suggestions */}
                                            <div style={{ padding: 12, background: '#F3F4F6', borderRadius: 8, fontSize: 12, color: '#6B7280' }}>
                                                <strong style={{ color: '#374151' }}>Quick Add:</strong>
                                                <div style={{ display: 'flex', gap: 6, marginTop: 8, flexWrap: 'wrap' }}>
                                                    {['Episode 1', 'Episode 2', 'Hero Video', 'Trailer', 'Social Cut', 'Behind the Scenes'].map(suggestion => (
                                                        <button key={suggestion}
                                                                onClick={() => {
                                                                    // Add to first empty slot or create new
                                                                    const emptyIndex = deliverableNames.findIndex(n => !n.trim());
                                                                    if (emptyIndex >= 0) {
                                                                        updateDeliverable(emptyIndex, suggestion);
                                                                    } else {
                                                                        setDeliverableNames([...deliverableNames, suggestion]);
                                                                    }
                                                                }}
                                                                style={{
                                                                    padding: '4px 10px',
                                                                    background: 'white',
                                                                    border: '1px solid #E5E7EB',
                                                                    borderRadius: 4,
                                                                    fontSize: 11,
                                                                    cursor: 'pointer'
                                                                }}>
                                                            {suggestion}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="modal-footer">
                                            <button className="btn btn-secondary" onClick={() => { setShowModal(null); setModalData(null); }}>
                                                Skip for Now
                                            </button>
                                            <button className="btn btn-primary" onClick={createDeliverables}>
                                                {deliverableNames.filter(n => n.trim()).length > 0
                                                    ? `Create ${deliverableNames.filter(n => n.trim()).length} Deliverable(s)`
                                                    : 'Done'}
                                            </button>
                                        </div>
                                    </>
                                );
                            })()}

                            {/* ═══════════════════════════════════════════════════════════
                                MOVE FILE MODAL WITH FOLDER TREE PICKER
                            ═══════════════════════════════════════════════════════════ */}
                            {showModal === 'move' && modalData && (() => {
                                // Use modalData to store move target state
                                const moveTarget = modalData.moveTarget || null;
                                const setMoveTarget = (target) => setModalData({ ...modalData, moveTarget: target });

                                // Build folder tree from projects
                                const buildFolderTree = () => {
                                    const currentLocation = getCurrentLocation();
                                    // Get projects in current status category or all active
                                    const projectsToShow = getProjectsByCategory('active').slice(0, 20);

                                    return projectsToShow.map(p => ({
                                        id: p.id,
                                        name: p.title,
                                        type: 'project',
                                        client: p.client,
                                        // Add default subfolders
                                        subfolders: [
                                            { id: 'script', name: 'Script', type: 'subfolder' },
                                            { id: 'production', name: 'Production', type: 'subfolder' },
                                            { id: 'edits', name: 'Edits', type: 'subfolder' },
                                            { id: 'graphics', name: 'Graphics', type: 'subfolder' }
                                        ]
                                    }));
                                };

                                const folderTree = buildFolderTree();
                                const expandedProjects = modalData.expandedProjects || [];
                                const setExpandedProjects = (fn) => {
                                    const newExpanded = typeof fn === 'function' ? fn(expandedProjects) : fn;
                                    setModalData({ ...modalData, expandedProjects: newExpanded });
                                };

                                const toggleExpand = (projectId) => {
                                    setExpandedProjects(prev =>
                                        prev.includes(projectId)
                                            ? prev.filter(id => id !== projectId)
                                            : [...prev, projectId]
                                    );
                                };

                                return (
                                    <>
                                        <div className="modal-header">
                                            <span>Move "{modalData.name}" to...</span>
                                            <button className="modal-close" onClick={() => { setShowModal(null); setModalData(null); }}>{Icons.x}</button>
                                        </div>
                                        <div className="modal-body" style={{ maxHeight: 400, overflow: 'auto' }}>
                                            <div style={{ fontSize: 12, color: 'var(--ink-muted)', marginBottom: 12 }}>
                                                Select a destination folder:
                                            </div>
                                            {folderTree.map(project => (
                                                <div key={project.id} style={{ marginBottom: 4 }}>
                                                    <div
                                                        onClick={() => toggleExpand(project.id)}
                                                        style={{
                                                            display: 'flex',
                                                            alignItems: 'center',
                                                            gap: 8,
                                                            padding: '8px 12px',
                                                            background: moveTarget?.projectId === project.id && !moveTarget?.subfolder ? '#EFF6FF' : 'transparent',
                                                            borderRadius: 6,
                                                            cursor: 'pointer',
                                                            fontSize: 13
                                                        }}>
                                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                                                             style={{ transform: expandedProjects.includes(project.id) ? 'rotate(90deg)' : 'rotate(0)', transition: 'transform 0.15s' }}>
                                                            <polyline points="9 18 15 12 9 6"/>
                                                        </svg>
                                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--success)">
                                                            <path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/>
                                                        </svg>
                                                        <span style={{ fontWeight: 500 }}>{project.name}</span>
                                                        <span style={{ fontSize: 11, color: 'var(--ink-muted)' }}>({project.client})</span>
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); setMoveTarget({ projectId: project.id, projectName: project.name }); }}
                                                            style={{
                                                                marginLeft: 'auto',
                                                                padding: '2px 8px',
                                                                fontSize: 10,
                                                                background: moveTarget?.projectId === project.id && !moveTarget?.subfolder ? 'var(--dmg-blue)' : 'var(--surface)',
                                                                color: moveTarget?.projectId === project.id && !moveTarget?.subfolder ? 'white' : 'var(--ink-sub)',
                                                                border: 'none',
                                                                borderRadius: 4,
                                                                cursor: 'pointer'
                                                            }}>
                                                            Select
                                                        </button>
                                                    </div>
                                                    {expandedProjects.includes(project.id) && (
                                                        <div style={{ marginLeft: 32, borderLeft: '1px solid var(--border)', paddingLeft: 12 }}>
                                                            {project.subfolders.map(sf => (
                                                                <div
                                                                    key={sf.id}
                                                                    onClick={() => setMoveTarget({ projectId: project.id, projectName: project.name, subfolder: sf.id, subfolderName: sf.name })}
                                                                    style={{
                                                                        display: 'flex',
                                                                        alignItems: 'center',
                                                                        gap: 8,
                                                                        padding: '6px 12px',
                                                                        background: moveTarget?.subfolder === sf.id && moveTarget?.projectId === project.id ? '#EFF6FF' : 'transparent',
                                                                        borderRadius: 6,
                                                                        cursor: 'pointer',
                                                                        fontSize: 12
                                                                    }}>
                                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--dmg-blue)">
                                                                        <path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/>
                                                                    </svg>
                                                                    <span>{sf.name}</span>
                                                                    {moveTarget?.subfolder === sf.id && moveTarget?.projectId === project.id && (
                                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--dmg-blue)" style={{ marginLeft: 'auto' }}>
                                                                            <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" strokeWidth="2"/>
                                                                        </svg>
                                                                    )}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                        <div className="modal-footer">
                                            <button className="btn btn-secondary" onClick={() => { setShowModal(null); setModalData(null); }}>Cancel</button>
                                            <button className="btn btn-primary"
                                                    disabled={!moveTarget}
                                                    onClick={() => {
                                                        if (moveTarget) {
                                                            moveItem(modalData.id, moveTarget);
                                                        }
                                                    }}>
                                                Move Here
                                            </button>
                                        </div>
                                    </>
                                );
                            })()}

                            {/* ═══════════════════════════════════════════════════════════
                                STATUS ACTION MODAL - Quick status update
                            ═══════════════════════════════════════════════════════════ */}
                            {statusModal.show && statusModal.item && (() => {
                                const item = statusModal.item;
                                const layer = statusModal.layer || 1;
                                const currentStatus = getDisplayStatus(item, layer);
                                const suggestions = getSuggestedActions(item, layer);
                                const actions = layer === 1 ? PROJECT_STATUS_ACTIONS : DELIVERABLE_STATUS_ACTIONS;

                                // Use modalData to store selected action and note
                                const selectedAction = modalData?.selectedAction || null;
                                const setSelectedAction = (actionId) => setModalData({ ...modalData, selectedAction: actionId });
                                const statusNote = modalData?.statusNote || '';
                                const setStatusNote = (note) => setModalData({ ...modalData, statusNote: note });
                                const statusLoading = modalData?.statusLoading || false;
                                const setStatusLoading = (loading) => setModalData({ ...modalData, statusLoading: loading });

                                // Find action object by ID
                                const findAction = (actionId) => {
                                    for (const cat of Object.values(actions)) {
                                        const found = cat.find(a => a.id === actionId);
                                        if (found) return found;
                                    }
                                    return null;
                                };

                                const handleUpdate = async () => {
                                    if (!selectedAction) return;
                                    setStatusLoading(true);
                                    const actionObj = findAction(selectedAction);
                                    if (actionObj) {
                                        await updateProjectStatus(item, actionObj, statusNote || null);
                                    }
                                    setStatusLoading(false);
                                };

                                const renderActionGroup = (name, items, emoji) => (
                                    <div className="action-group" style={{ marginBottom: 16 }}>
                                        <div className="action-group-title" style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', color: '#9CA3AF', marginBottom: 8 }}>
                                            {emoji} {name}
                                        </div>
                                        {items.map(action => (
                                            <div key={action.id}
                                                 className={`action-item ${selectedAction === action.id ? 'selected' : ''}`}
                                                 onClick={() => setSelectedAction(action.id)}
                                                 style={{
                                                     display: 'flex',
                                                     alignItems: 'center',
                                                     gap: 10,
                                                     padding: '10px 12px',
                                                     borderRadius: 8,
                                                     cursor: 'pointer',
                                                     border: selectedAction === action.id ? '2px solid #21A0D8' : '2px solid transparent',
                                                     background: selectedAction === action.id ? 'rgba(33, 160, 216, 0.1)' : (suggestions.includes(action.id) ? 'rgba(34, 197, 94, 0.05)' : 'transparent'),
                                                     transition: 'all 0.1s'
                                                 }}
                                                 onMouseEnter={(e) => { if (selectedAction !== action.id) e.currentTarget.style.background = '#F9FAFB'; }}
                                                 onMouseLeave={(e) => { if (selectedAction !== action.id) e.currentTarget.style.background = suggestions.includes(action.id) ? 'rgba(34, 197, 94, 0.05)' : 'transparent'; }}>
                                                <span style={{ fontSize: 16 }}>{action.icon}</span>
                                                <span style={{ fontSize: 13 }}>{action.label}</span>
                                                {suggestions.includes(action.id) && (
                                                    <span style={{ marginLeft: 'auto', fontSize: 9, fontWeight: 700, textTransform: 'uppercase', padding: '2px 6px', borderRadius: 4, background: '#22C55E', color: 'white' }}>
                                                        Suggested
                                                    </span>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                );

                                return (
                                    <div className="modal-overlay show" onClick={closeStatusModal} style={{ zIndex: 10001 }}>
                                        <div className="modal" onClick={e => e.stopPropagation()} style={{ width: 480, maxWidth: '95vw' }}>
                                            <div className="modal-header">
                                                <div>
                                                    <span style={{ fontWeight: 700 }}>Update: {item.title || item.name}</span>
                                                    <div style={{ fontSize: 12, marginTop: 4, color: '#6B7280', display: 'flex', alignItems: 'center', gap: 6 }}>
                                                        Current:
                                                        <span style={{
                                                            display: 'inline-flex',
                                                            alignItems: 'center',
                                                            gap: 4,
                                                            padding: '2px 8px',
                                                            borderRadius: 6,
                                                            fontSize: 11,
                                                            fontWeight: 600,
                                                            background: `${currentStatus.color}15`,
                                                            color: currentStatus.color,
                                                            border: `1px solid ${currentStatus.color}30`
                                                        }}>
                                                            <span>{currentStatus.icon}</span>
                                                            <span>{currentStatus.label}</span>
                                                        </span>
                                                    </div>
                                                </div>
                                                <button className="modal-close" onClick={closeStatusModal}>{Icons.x}</button>
                                            </div>

                                            <div className="modal-body" style={{ maxHeight: 400, overflowY: 'auto' }}>
                                                {suggestions.length > 0 && (
                                                    <div style={{ background: 'rgba(34,197,94,0.05)', border: '1px solid rgba(34,197,94,0.2)', borderRadius: 8, padding: 12, marginBottom: 16 }}>
                                                        <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', color: '#22C55E', marginBottom: 8 }}>
                                                            💡 SUGGESTED NEXT STEP
                                                        </div>
                                                        {Object.values(actions).flat().filter(a => suggestions.includes(a.id)).map(action => (
                                                            <div key={action.id}
                                                                 className="action-item"
                                                                 onClick={() => setSelectedAction(action.id)}
                                                                 style={{
                                                                     display: 'flex',
                                                                     alignItems: 'center',
                                                                     gap: 10,
                                                                     padding: '10px 12px',
                                                                     borderRadius: 8,
                                                                     cursor: 'pointer',
                                                                     border: selectedAction === action.id ? '2px solid #21A0D8' : '2px solid transparent',
                                                                     background: selectedAction === action.id ? 'rgba(33, 160, 216, 0.1)' : 'transparent'
                                                                 }}>
                                                                <span style={{ fontSize: 16 }}>{action.icon}</span>
                                                                <span style={{ fontSize: 13, fontWeight: 500 }}>{action.label}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {layer === 1 ? (
                                                    <>
                                                        {renderActionGroup('PIPELINE', actions.pipeline, '📥')}
                                                        {renderActionGroup('ACTIVE', actions.active, '✅')}
                                                        {renderActionGroup('CLOSED', actions.closed, '❌')}
                                                    </>
                                                ) : (
                                                    <>
                                                        {renderActionGroup('PLANNING', actions.planning, '📋')}
                                                        {renderActionGroup('PRODUCTION', actions.production, '🎬')}
                                                        {renderActionGroup('DELIVERY', actions.delivery, '📤')}
                                                    </>
                                                )}

                                                <div style={{ marginTop: 16, paddingTop: 16, borderTop: '1px solid #E5E7EB' }}>
                                                    <label style={{ fontSize: 12, fontWeight: 600, color: '#374151', marginBottom: 6, display: 'block' }}>
                                                        📝 Add note (optional)
                                                    </label>
                                                    <input
                                                        type="text"
                                                        className="form-input"
                                                        placeholder="e.g. Client asked for minor copy changes"
                                                        value={statusNote}
                                                        onChange={e => setStatusNote(e.target.value)}
                                                        style={{ fontSize: 13 }}
                                                    />
                                                </div>
                                            </div>

                                            <div className="modal-footer">
                                                <button className="btn btn-secondary" onClick={closeStatusModal}>Cancel</button>
                                                <button className="btn btn-primary" onClick={handleUpdate} disabled={!selectedAction || statusLoading}>
                                                    {statusLoading ? 'Updating...' : 'Update Status'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    </div>
                );
            };

            // ─────────────────────────────────────────────────────────────────────
            // RENAME ITEM FUNCTION
            // ─────────────────────────────────────────────────────────────────────
            const renameItem = async (id, newName, isFolder) => {
                try {
                    // Update in Firebase
                    await filesCollection.doc(id).update({ name: newName });
                    await logActivity({
                        type: 'rename',
                        action: 'renamed',
                        fileName: newName,
                        ...getCurrentLocation()
                    });
                    showToast(`Renamed to "${newName}"`, 'success');
                    await fetchFiles();
                    setShowModal(null);
                    setModalData(null);
                } catch (err) {
                    console.error('Rename error:', err);
                    showToast('Failed to rename', 'error');
                }
            };

            // ─────────────────────────────────────────────────────────────────────
            // DELETE ITEM FUNCTION
            // ─────────────────────────────────────────────────────────────────────
            const deleteItem = async (id, isFolder, isNotionItem) => {
                try {
                    if (isNotionItem) {
                        // Archive in Notion (soft delete)
                        await fetch(`${CONFIG.API_URL}/projects/${id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ archived: true })
                        });
                        await fetchProjects();
                    } else {
                        // Delete from Firebase
                        const fileDoc = await filesCollection.doc(id).get();
                        if (fileDoc.exists) {
                            const data = fileDoc.data();
                            // Delete from storage if it has a path
                            if (data.path) {
                                try {
                                    await firebase.storage().ref(data.path).delete();
                                } catch (e) {
                                    console.log('Storage delete skipped:', e.message);
                                }
                            }
                        }
                        await filesCollection.doc(id).delete();
                        await fetchFiles();
                    }

                    await logActivity({
                        type: 'delete',
                        action: 'deleted',
                        fileName: modalData?.name,
                        ...getCurrentLocation()
                    });

                    showToast('Deleted successfully', 'success');
                    setShowModal(null);
                    setModalData(null);
                } catch (err) {
                    console.error('Delete error:', err);
                    showToast('Failed to delete', 'error');
                }
            };

            // ─────────────────────────────────────────────────────────────────────
            // MOVE ITEM FUNCTION
            // ─────────────────────────────────────────────────────────────────────
            const moveItem = async (id, target) => {
                try {
                    await filesCollection.doc(id).update({
                        projectId: target.projectId,
                        projectName: target.projectName,
                        subfolder: target.subfolder || null,
                        subfolderName: target.subfolderName || null
                    });

                    await logActivity({
                        type: 'move',
                        action: 'moved',
                        fileName: modalData?.name,
                        projectId: target.projectId,
                        projectName: target.projectName
                    });

                    showToast(`Moved to ${target.projectName}${target.subfolderName ? ' › ' + target.subfolderName : ''}`, 'success');
                    await fetchFiles();
                    setShowModal(null);
                    setModalData(null);
                } catch (err) {
                    console.error('Move error:', err);
                    showToast('Failed to move', 'error');
                }
            };

            const renderActivityFeed = () => (
                <div className="activity-panel">
                    <div className="activity-header">
                        Activity Feed
                        <div className="live-dot" title="Live updates" />
                    </div>
                    <div className="activity-list">
                        {activities.length === 0 ? (
                            <div className="empty-state" style={{ padding: '20px' }}>
                                <div className="empty-state-text">No activity yet</div>
                            </div>
                        ) : (
                            activities.map(a => (
                                <div key={a.id} className="activity-item">
                                    <div className="activity-avatar">{a.user?.initials || '?'}</div>
                                    <div className="activity-content">
                                        <div className="activity-text">
                                            <strong>{a.user?.name || 'Someone'}</strong> {a.action}{' '}
                                            <span className="highlight">{a.fileName || a.deliverableName || ''}</span>
                                            {a.projectName && (
                                                <> to <span className="highlight">{a.clientName} › {a.projectName}</span></>
                                            )}
                                        </div>
                                        <div className="activity-time">{formatTimeAgo(a.timestamp)}</div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );

            const renderSidebar = () => {
                const grouped = groupProjectsByClient();

                // Count projects by status
                // Helper to check if a status is currently active in path
                const isStatusActive = (status) => {
                    const statusInPath = currentPath.find(p => p.type === 'status');
                    return statusInPath?.id === status;
                };

                // Navigate to status folder
                const goToStatus = (status, label) => {
                    setSearchQuery('');
                    setCurrentPath([{ type: 'status', id: status, name: label }]);
                };

                return (
                    <div className="sidebar">
                        <div className="sidebar-header" onClick={() => setCurrentPath([])} style={{ cursor: 'pointer' }} title="Go to home">
                            <div className="dot-grid"><span/><span/><span/><span/></div>
                            <span className="sidebar-title">Project Library</span>
                            {currentPath.length > 0 && (
                                <button
                                    onClick={(e) => { e.stopPropagation(); setCurrentPath([]); }}
                                    style={{
                                        marginLeft: 'auto',
                                        background: 'var(--dmg-blue)',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: 6,
                                        padding: '4px 8px',
                                        fontSize: 10,
                                        fontWeight: 600,
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: 4
                                    }}
                                    title="Go to home">
                                    {Icons.home} Home
                                </button>
                            )}
                        </div>

                        <div className="sidebar-search">
                            <div className="search-wrapper">
                                {Icons.search}
                                <input type="text" className="search-input"
                                       placeholder="Search files, projects..."
                                       value={searchQuery}
                                       onChange={(e) => setSearchQuery(e.target.value)} />
                            </div>
                        </div>

                        <div className="sidebar-nav">
                            <div className="nav-section">
                                <div className="nav-section-title">Projects</div>
                                <div className={`nav-item ${isStatusActive('active') ? 'active' : ''}`}
                                     onClick={() => goToStatus('active', 'Active')}>
                                    {Icons.star}
                                    Active
                                    <span className="count">{getProjectsByCategory('active').length}</span>
                                </div>
                                <div className={`nav-item ${isStatusActive('pipeline') ? 'active' : ''}`}
                                     onClick={() => goToStatus('pipeline', 'Pipeline')}>
                                    {Icons.clock}
                                    Pipeline
                                    <span className="count">{getProjectsByCategory('pipeline').length}</span>
                                </div>
                                <div className={`nav-item ${isStatusActive('archive') ? 'active' : ''}`}
                                     onClick={() => goToStatus('archive', 'Archive')}>
                                    {Icons.folder}
                                    Archive
                                    <span className="count">{getProjectsByCategory('archive').length}</span>
                                </div>
                            </div>

                            <div className="nav-section">
                                <div className="nav-section-title">Clients</div>
                                {Object.keys(grouped).sort().slice(0, 12).map(client => (
                                    <div key={client}
                                         className={`nav-item ${currentPath.find(p => p.type === 'client')?.name === client ? 'active' : ''}`}
                                         onClick={() => {
                                             setSearchQuery('');
                                             // Navigate to Active > Client by default
                                             setCurrentPath([
                                                 { type: 'status', id: 'active', name: 'Active' },
                                                 { type: 'client', id: client, name: client }
                                             ]);
                                         }}>
                                        {Icons.folder}
                                        {client}
                                        <span className="count">{grouped[client].length}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // ─────────────────────────────────────────────────────────────────────
            // MAIN RENDER
            // ─────────────────────────────────────────────────────────────────────
            if (loading) {
                return (
                    <div className="app-container">
                        <div className="loading-state" style={{ flex: 1 }}>
                            <div className="dot-grid" style={{ transform: 'scale(2)' }}>
                                <span/><span/><span/><span/>
                            </div>
                            <div className="loading-text">Loading projects...</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    {renderSidebar()}

                    <div className="main-content">
                        <div className="main-header">
                            {renderBreadcrumb()}
                            <div className="header-actions">
                                {/* Always show a create button */}
                                <button className="btn btn-secondary" onClick={() => { setModalData(null); setShowModal('newFolder'); }}>
                                    {Icons.plus}
                                    {currentPath.length === 0
                                        ? 'New Project'
                                        : currentPath.find(p => p.type === 'status') && !currentPath.find(p => p.type === 'client')
                                            ? 'New Project'
                                            : currentPath.find(p => p.type === 'client') && !currentPath.find(p => p.type === 'project')
                                                ? 'New Project'
                                                : currentPath.find(p => p.type === 'project') && !currentPath.find(p => p.type === 'deliverable')
                                                    ? 'New Asset'
                                                    : 'New Folder'}
                                </button>
                                {getCurrentLocation().projectId && (
                                    <>
                                        <button className="btn btn-secondary" onClick={() => setShowModal('addLink')}>
                                            {Icons.link}
                                            Add Link
                                        </button>
                                        <button className="btn btn-primary" onClick={() => fileInputRef.current?.click()}>
                                            {Icons.upload}
                                            Upload
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="content-area">
                            <div className="file-browser">
                                {renderPinnedSection()}
                                {renderFolderGrid()}
                            </div>
                            {renderActivityFeed()}
                        </div>
                    </div>

                    <Toast {...toast} />
                    {renderModals()}
                </div>
            );
        };

        // ═══════════════════════════════════════════════════════════════════════════
        // MOUNT APP
        // ═══════════════════════════════════════════════════════════════════════════
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
