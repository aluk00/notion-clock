                    return;
                }

                try {
                    const user = getCurrentUser();
                    const timestamp = Date.now();
                    const fileDoc = {
                        name: linkData.name,
                        type: 'link',
                        url: linkData.url,
                        isExternal: true,
                        docType: linkData.docType || null,
                        pinned: linkData.pinned || false,
                        clientName: currentLocation.clientName,
                        projectId: currentLocation.projectId,
                        projectName: currentLocation.projectName,
                        deliverableId: currentLocation.deliverableId || null,
                        deliverableName: currentLocation.deliverableName || 'General',
                        uploadedBy: user,
                        uploadedAt: new Date().toISOString()
                    };

                    await filesCollection.doc(timestamp.toString()).set(fileDoc);
                    await logActivity({
                        type: 'link_add',
                        action: 'added link',
                        fileName: linkData.name,
                        ...currentLocation
                    });
                    showToast('Link added', 'success');
                    setShowModal(null);
                    setModalData(null);
                    await fetchFiles();
                } catch (err) {
                    console.error('Add link error:', err);
                    showToast('Failed to add link', 'error');
                }
            };

            // ─────────────────────────────────────────────────────────────────────
            // NAVIGATION HELPERS
            // ─────────────────────────────────────────────────────────────────────
            const getCurrentLocation = () => {
                const loc = {
                    clientName: null,
                    projectId: null,
                    projectName: null,
                    deliverableId: null,
                    deliverableName: null,
                    subfolder: null // For nested folders within deliverables (Production, Edits, etc.)
                };
                currentPath.forEach(p => {
                    if (p.type === 'client') loc.clientName = p.name;
                    if (p.type === 'project') { loc.projectId = p.id; loc.projectName = p.name; }
                    if (p.type === 'deliverable') { loc.deliverableId = p.id; loc.deliverableName = p.name; }
                    if (p.type === 'subfolder') loc.subfolder = p.name;
                });
                return loc;
            };

            const navigateTo = (type, id, name) => {
                if (type === 'root') {
                    setCurrentPath([]);
                } else if (type === 'status') {
                    setCurrentPath([{ type: 'status', id, name }]);
                } else if (type === 'client') {
                    // Preserve status level, add client
                    const statusPath = currentPath.find(p => p.type === 'status');
                    setCurrentPath([statusPath, { type: 'client', id: name, name }].filter(Boolean));
                } else if (type === 'project') {
                    // Preserve status and client levels, add project
                    const statusPath = currentPath.find(p => p.type === 'status');
                    const clientPath = currentPath.find(p => p.type === 'client');
                    setCurrentPath([statusPath, clientPath, { type: 'project', id, name }].filter(Boolean));
                } else if (type === 'deliverable') {
                    // Keep status, client and project, add deliverable
                    const filtered = currentPath.filter(p => p.type === 'status' || p.type === 'client' || p.type === 'project');
                    setCurrentPath([...filtered, { type: 'deliverable', id, name }]);
                } else if (type === 'subfolder') {
                    // Keep everything up to deliverable, add subfolder
                    const filtered = currentPath.filter(p => p.type !== 'subfolder');
                    setCurrentPath([...filtered, { type: 'subfolder', id, name }]);
                }
            };

            const navigateBack = (index) => {
                setCurrentPath(currentPath.slice(0, index + 1));
            };

            // ─────────────────────────────────────────────────────────────────────
            // FILTERING & GROUPING
            // ─────────────────────────────────────────────────────────────────────
            const groupProjectsByClient = () => {
                const groups = {};
                projects.forEach(p => {
                    const client = p.client || 'Unknown Client';
                    if (!groups[client]) groups[client] = [];
                    groups[client].push(p);
                });
                return groups;
            };

            const getFilesForCurrentPath = () => {
                const loc = getCurrentLocation();
                return files.filter(f => {
                    // Location filters
                    if (loc.subfolder && f.subfolder !== loc.subfolder) return false;
                    if (loc.deliverableId && f.deliverableId !== loc.deliverableId) return false;
                    if (loc.projectId && f.projectId !== loc.projectId) return false;
                    if (loc.clientName && f.clientName !== loc.clientName) return false;

                    // Date filters
                    if (dateFilter.from) {
                        const fileDate = new Date(f.uploadedAt);
                        const fromDate = new Date(dateFilter.from);
                        if (fileDate < fromDate) return false;
                    }
                    if (dateFilter.to) {
                        const fileDate = new Date(f.uploadedAt);
                        const toDate = new Date(dateFilter.to);
                        toDate.setHours(23, 59, 59); // Include the whole day
                        if (fileDate > toDate) return false;
                    }

                    return true;
                });
            };

            // Get pinned files for current project
            const getPinnedFiles = () => {
                const loc = getCurrentLocation();
                if (!loc.projectId) return [];
                return files.filter(f => f.pinned && f.projectId === loc.projectId);
            };

            // Search
            const getSearchResults = () => {
                if (!searchQuery.trim()) return null;
                const query = searchQuery.toLowerCase();

                const matchedProjects = projects.filter(p =>
                    p.title.toLowerCase().includes(query) ||
                    p.client.toLowerCase().includes(query)
                );

                const matchedFiles = files.filter(f =>
                    f.name.toLowerCase().includes(query) ||
                    (f.uploadedBy?.name || '').toLowerCase().includes(query)
                );

                return { projects: matchedProjects, files: matchedFiles };
            };

            // ─────────────────────────────────────────────────────────────────────
            // RENDER HELPERS
            // ─────────────────────────────────────────────────────────────────────
            const renderBreadcrumb = () => {
                // Find if we're inside a project to show status badge
                const projectPath = currentPath.find(p => p.type === 'project');
                const project = projectPath ? projects.find(p => p.id === projectPath.id) : null;
                const projectStatus = project ? getDisplayStatus(project, 1) : null;

                return (
                    <div className="breadcrumb" style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span className={`breadcrumb-item ${currentPath.length === 0 ? 'current' : ''}`}
                              onClick={() => navigateTo('root')}>
                            Projects
                        </span>
                        {currentPath.map((item, idx) => (
                            <React.Fragment key={idx}>
                                <span className="breadcrumb-sep">›</span>
                                <span className={`breadcrumb-item ${idx === currentPath.length - 1 ? 'current' : ''}`}
                                      onClick={() => navigateBack(idx)}>
                                    {item.name}
                                </span>
                            </React.Fragment>
                        ))}
                        {/* Clickable Status Badge when inside a project */}
                        {project && projectStatus && (
                            <button
                                type="button"
                                onClick={(e) => {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    setModalData(null);
                                    openStatusModal(project, 1);
                                }}
                                style={{
                                    display: 'inline-flex',
                                    alignItems: 'center',
                                    gap: 4,
                                    padding: '4px 12px',
                                    borderRadius: 6,
                                    fontSize: 11,
                                    fontWeight: 600,
                                    background: `${projectStatus.color}15`,
                                    color: projectStatus.color,
                                    border: `1px solid ${projectStatus.color}30`,
                                    marginLeft: 8,
                                    cursor: 'pointer',
                                    transition: 'all 0.15s',
                                    position: 'relative',
                                    zIndex: 10,
                                    userSelect: 'none'
                                }}
                                onMouseEnter={(e) => {
                                    e.currentTarget.style.background = `${projectStatus.color}25`;
                                    e.currentTarget.style.transform = 'scale(1.02)';
                                }}
                                onMouseLeave={(e) => {
                                    e.currentTarget.style.background = `${projectStatus.color}15`;
                                    e.currentTarget.style.transform = 'scale(1)';
                                }}
                                title="Click to update status">
                                <span>{projectStatus.icon}</span>
                                <span>{projectStatus.label}</span>
                                <span style={{ fontSize: 8, marginLeft: 2 }}>▼</span>
                            </button>
                        )}
                    </div>
                );
            };

            const renderUploadZone = () => {
                const loc = getCurrentLocation();
                if (!loc.projectId) return null; // Only show in project/deliverable folders

                return (
                    <>
                        <div className={`upload-zone ${dragOver ? 'drag-over' : ''} ${uploadProgress.active ? 'uploading' : ''}`}
                             onClick={() => fileInputRef.current?.click()}
                             onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                             onDragLeave={(e) => { e.preventDefault(); setDragOver(false); }}
                             onDrop={(e) => {
                                 e.preventDefault();
                                 setDragOver(false);
                                 handleFileUpload(e.dataTransfer.files);
                             }}>
                            {Icons.upload}
                            <div className="upload-zone-title">Drop files here or click to upload</div>
                            <div className="upload-zone-hint">
                                {frameioEnabled ? (
                                    <>Videos → Frame.io • Other files → Firebase • Up to 5GB</>
                                ) : (
                                    <>Videos, PSDs, PDFs, images • Up to 500MB</>
                                )}
                            </div>
                            {frameioEnabled && (
                                <div style={{ marginTop: 8, display: 'flex', gap: 8, justifyContent: 'center' }}>
                                    <span style={{ fontSize: 10, padding: '3px 8px', background: '#7C3AED', color: 'white', borderRadius: 4, fontWeight: 600 }}>
                                        Frame.io Connected
                                    </span>
                                </div>
                            )}
                            <input type="file" ref={fileInputRef} multiple style={{ display: 'none' }}
                                   onChange={(e) => handleFileUpload(e.target.files)} />
                        </div>
                        <div className={`upload-progress ${uploadProgress.active ? 'active' : ''}`}>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{ width: `${uploadProgress.percent}%` }} />
                            </div>
                            <div className="progress-text">Uploading {uploadProgress.fileName}... {Math.round(uploadProgress.percent)}%</div>
                        </div>
                    </>
                );
            };

            const renderFolderGrid = () => {
                // Search mode
                const searchResults = getSearchResults();
                if (searchResults) {
                    return (
                        <div className="search-results">
                            {searchResults.projects.length > 0 && (
                                <div className="search-result-group">
                                    <div className="search-result-title">Projects ({searchResults.projects.length})</div>
                                    <div className="folder-grid">
                                        {searchResults.projects.map(p => (
                                            <div key={p.id} className="folder-card project"
                                                 onClick={() => {
                                                     setSearchQuery('');
                                                     navigateTo('client', p.client, p.client);
                                                     setTimeout(() => navigateTo('project', p.id, p.title), 0);
                                                 }}>
                                                {Icons.folder}
                                                <div className="folder-name">{p.title}</div>
                                                <div className="folder-meta">{p.client}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {searchResults.files.length > 0 && (
                                <div className="search-result-group">
                                    <div className="search-result-title">Files ({searchResults.files.length})</div>
                                    <div className="file-list">
                                        {searchResults.files.slice(0, 20).map(f => renderFileItem(f))}
                                    </div>
                                </div>
                            )}
                            {searchResults.projects.length === 0 && searchResults.files.length === 0 && (
                                <div className="empty-state">
                                    {Icons.search}
                                    <div className="empty-state-title">No results found</div>
                                    <div className="empty-state-text">Try a different search term</div>
                                </div>
                            )}
                        </div>
                    );
                }

                // ═══════════════════════════════════════════════════════════════
                // LEVEL 0: ROOT - Show three status folder icons (SharePoint style)
                // ═══════════════════════════════════════════════════════════════
                if (currentPath.length === 0) {
                    const statusFolders = [
                        {
                            id: 'active',
                            name: 'Active',
                            icon: Icons.star,
                            gradient: 'linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%)',
                            iconColor: '#059669',
                            hoverBorder: '#22C55E'
                        },
                        {
                            id: 'pipeline',
                            name: 'Pipeline',
                            icon: Icons.clock,
                            gradient: 'linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%)',
                            iconColor: '#D97706',
                            hoverBorder: '#F59E0B'
                        },
                        {
                            id: 'archive',
                            name: 'Archive',
                            icon: Icons.folder,
                            gradient: 'linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%)',
                            iconColor: '#6B7280',
                            hoverBorder: '#9CA3AF'
                        }
                    ];

                    return (
                        <div style={{ padding: '40px 20px' }}>
                            <div style={{ textAlign: 'center', marginBottom: 40 }}>
                                <div style={{ fontSize: 18, fontWeight: 700, color: 'var(--ink)', marginBottom: 6 }}>Project Library</div>
                                <div style={{ fontSize: 13, color: 'var(--ink-muted)' }}>Click a folder to browse projects by status</div>
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'center', gap: 24, flexWrap: 'wrap' }}>
                                {statusFolders.map(folder => {
                                    const count = getProjectsByCategory(folder.id).length;
                                    return (
                                        <div key={folder.id}
                                             className={`status-folder ${folder.id}`}
                                             onClick={() => setCurrentPath([{ type: 'status', id: folder.id, name: folder.name }])}
                                             style={{
                                                 display: 'flex',
                                                 flexDirection: 'column',
                                                 alignItems: 'center',
                                                 gap: 12,
                                                 padding: '32px 24px',
                                                 background: 'var(--white)',
                                                 border: '2px solid var(--border)',
                                                 borderRadius: 16,
                                                 cursor: 'pointer',
                                                 transition: 'all 0.2s',
                                                 minWidth: 160
                                             }}
                                             onMouseEnter={(e) => {
                                                 e.currentTarget.style.transform = 'translateY(-4px)';
                                                 e.currentTarget.style.boxShadow = '0 8px 24px rgba(0,0,0,0.08)';
                                                 e.currentTarget.style.borderColor = folder.hoverBorder;
                                             }}
                                             onMouseLeave={(e) => {
                                                 e.currentTarget.style.transform = 'translateY(0)';
                                                 e.currentTarget.style.boxShadow = 'none';
                                                 e.currentTarget.style.borderColor = 'var(--border)';
                                             }}>
                                            <div style={{
                                                width: 64,
                                                height: 64,
                                                borderRadius: 16,
                                                display: 'flex',
                                                alignItems: 'center',
                                                justifyContent: 'center',
                                                background: folder.gradient,
                                                color: folder.iconColor
                                            }}>
                                                <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                                                    {folder.id === 'active' && <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>}
                                                    {folder.id === 'pipeline' && <><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" strokeWidth="2"/><polyline points="12 6 12 12 16 14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></>}
                                                    {folder.id === 'archive' && <path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/>}
                                                </svg>
                                            </div>
                                            <div style={{ fontSize: 16, fontWeight: 700, color: 'var(--ink)' }}>{folder.name}</div>
                                            <div style={{ fontSize: 12, color: 'var(--ink-muted)' }}>{count} project{count !== 1 ? 's' : ''}</div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    );
                }

                // ═══════════════════════════════════════════════════════════════
                // LEVEL 1: STATUS - Show clients grouped within this status
                // ═══════════════════════════════════════════════════════════════
                const currentStatus = currentPath.find(p => p.type === 'status');
                const currentClient = currentPath.find(p => p.type === 'client');
                const currentProject = currentPath.find(p => p.type === 'project');

                if (currentStatus && !currentClient) {
                    const statusProjects = getProjectsByCategory(currentStatus.id);
                    const groupedByClient = {};
                    statusProjects.forEach(p => {
                        const client = p.client || 'Unknown Client';
                        if (!groupedByClient[client]) groupedByClient[client] = [];
                        groupedByClient[client].push(p);
                    });
                    const clients = Object.keys(groupedByClient).sort();

                    return (
                        <>
                            {clients.length > 0 ? (
                                <div className="folder-grid">
                                    {clients.map(client => (
                                        <div key={client}
                                             className="folder-card"
                                             onClick={() => setCurrentPath([...currentPath, { type: 'client', id: client, name: client }])}
                                             style={{ cursor: 'pointer' }}>
                                            {Icons.folder}
                                            <div className="folder-name">{client}</div>
                                            <div className="folder-meta">{groupedByClient[client].length} project{groupedByClient[client].length !== 1 ? 's' : ''}</div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div style={{ padding: 40, textAlign: 'center', color: 'var(--ink-muted)' }}>
                                    <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>No {currentStatus.name.toLowerCase()} projects</div>
                                    <div style={{ fontSize: 12 }}>Projects will appear here based on their status in Notion</div>
                                </div>
                            )}
                        </>
                    );
                }

                // ═══════════════════════════════════════════════════════════════
                // LEVEL 2: CLIENT - Show projects for this client within status
                // ═══════════════════════════════════════════════════════════════
                if (currentClient && !currentProject) {
                    // Filter by both status and client
                    const clientProjects = getProjectsByCategory(currentStatus?.id || 'active')
                        .filter(p => p.client === currentClient.name);

                    return (
                        <div className="folder-grid">
                            {clientProjects.length > 0 ? (
                                clientProjects.map(p => {
                                    const status = getDisplayStatus(p, 1);
                                    return (
                                        <div key={p.id} className="folder-card project"
                                             onClick={() => setCurrentPath([...currentPath, { type: 'project', id: p.id, name: p.title }])}
                                             style={{ position: 'relative' }}>
                                            {/* Quick Status Button - Lightning Bolt */}
                                            <button
                                                className="quick-status-btn"
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    setModalData(null); // Reset modal data
                                                    openStatusModal(p, 1);
                                                }}
                                                title="Update status"
>
                                                ⚡
                                            </button>
                                            {Icons.folder}
                                            <div className="folder-name">{p.title}</div>
                                            {/* Status Badge */}
                                            <div style={{
                                                display: 'inline-flex',
                                                alignItems: 'center',
                                                gap: 4,
                                                padding: '2px 8px',
                                                borderRadius: 6,
                                                fontSize: 10,
                                                fontWeight: 600,
                                                background: `${status.color}15`,
                                                color: status.color,
                                                border: `1px solid ${status.color}30`,
                                                marginTop: 4
                                            }}>
                                                <span>{status.icon}</span>
                                                <span>{status.label}</span>
                                            </div>
                                        </div>
                                    );
                                })
                            ) : (
                                <div style={{ padding: 40, textAlign: 'center', color: 'var(--ink-muted)' }}>
                                    <div style={{ fontSize: 14 }}>No projects for this client</div>
                                </div>
                            )}
                        </div>
                    );
                }

                // Project level - SharePoint-style nested folder structure
                if (currentProject) {
                    const project = projects.find(p => p.id === currentProject.id);
                    const currentDeliverable = currentPath.find(p => p.type === 'deliverable');
                    const currentSubfolder = currentPath.find(p => p.type === 'subfolder');
                    const currentFiles = getFilesForCurrentPath();
                    const loc = getCurrentLocation();

                    // LEVEL 1: At project root - show Brief, Response Doc, Team, Deliverables folder
                    if (!currentDeliverable && !currentSubfolder) {
                        // Get deliverables from Notion (Layer 2)
                        const deliverables = project?.deliverables || [];
                        // Get files uploaded directly to this project (not in a deliverable)
                        const projectFiles = files.filter(f =>
                            f.projectId === currentProject.id && !f.deliverableId && !f.isFolder
                        );
                        // Get user-created folders at project root
                        const projectFolders = files.filter(f =>
                            f.isFolder && f.projectId === currentProject.id && !f.deliverableId
                        );

                        return (
                            <>
                                {/* Upload Zone - Always show at project level */}
                                {renderUploadZone()}

                                {/* Key Documents Section */}
                                <div className="file-section">
                                    <div className="file-section-title" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        Key Documents
                                        <button className="btn btn-secondary" style={{ padding: '4px 10px', fontSize: 11 }}
                                                onClick={() => { setModalData({ type: 'keyDoc' }); setShowModal('addLink'); }}>
                                            {Icons.plus} Add Link
                                        </button>
                                    </div>
                                    <div className="file-list">
                                        {project?.briefLink && (
                                            <a href={project.briefLink} target="_blank" rel="noopener noreferrer"
                                               className="file-item" style={{ textDecoration: 'none' }}>
                                                <div className="file-icon pdf">{Icons.file}</div>
                                                <div className="file-info">
                                                    <div className="file-name">Brief</div>
                                                    <div className="file-meta">Project brief document</div>
                                                </div>
                                                <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', color: 'var(--ink-muted)' }}>{Icons.externalLink}</div>
                                            </a>
                                        )}
                                        {project?.responseLink && (
                                            <a href={project.responseLink} target="_blank" rel="noopener noreferrer"
                                               className="file-item" style={{ textDecoration: 'none' }}>
                                                <div className="file-icon doc">{Icons.file}</div>
                                                <div className="file-info">
                                                    <div className="file-name">Creative Response</div>
                                                    <div className="file-meta">Response to brief • Google Doc</div>
                                                </div>
                                                <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', color: 'var(--ink-muted)' }}>{Icons.externalLink}</div>
                                            </a>
                                        )}
                                        {project?.driveFolder && (
                                            <a href={project.driveFolder} target="_blank" rel="noopener noreferrer"
                                               className="file-item" style={{ textDecoration: 'none' }}>
                                                <div className="file-icon other">{Icons.folder}</div>
                                                <div className="file-info">
                                                    <div className="file-name">Google Drive</div>
                                                    <div className="file-meta">Project folder</div>
                                                </div>
                                                <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', color: 'var(--ink-muted)' }}>{Icons.externalLink}</div>
                                            </a>
                                        )}
                                        {project?.frameIo && (
                                            <a href={project.frameIo} target="_blank" rel="noopener noreferrer"
                                               className="file-item" style={{ textDecoration: 'none' }}>
                                                <div className="file-icon video">{Icons.video}</div>
                                                <div className="file-info">
                                                    <div className="file-name">Frame.io</div>
                                                    <div className="file-meta">Video review & collaboration</div>
                                                </div>
                                                <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', color: 'var(--ink-muted)' }}>{Icons.externalLink}</div>
                                            </a>
                                        )}
                                        {/* Show pinned/key files from uploads */}
                                        {files.filter(f => f.projectId === currentProject.id && f.pinned).map(file => (
                                            <div key={file.id} className="file-item" onClick={() => window.open(file.url, '_blank')} style={{ cursor: 'pointer' }}>
                                                <div className={`file-icon ${getFileType(file.name, file.type)}`}>{Icons.file}</div>
                                                <div className="file-info">
                                                    <div className="file-name">{file.name}</div>
                                                    <div className="file-meta">Uploaded by {file.uploadedBy?.name || 'Unknown'}</div>
                                                </div>
                                                <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', color: 'var(--amber)' }}>{Icons.starFilled}</div>
                                            </div>
                                        ))}
                                        {!project?.briefLink && !project?.responseLink && !project?.driveFolder && files.filter(f => f.projectId === currentProject.id && f.pinned).length === 0 && (
                                            <div className="file-item" style={{ opacity: 0.5, border: '1px dashed var(--border)' }}>
                                                <div className="file-icon other" style={{ background: 'transparent' }}>{Icons.plus}</div>
                                                <div className="file-info">
                                                    <div className="file-name" style={{ color: 'var(--ink-muted)' }}>No key documents yet</div>
                                                    <div className="file-meta">Click "Add Link" or upload & pin files</div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Team Section - Editable */}
                                {renderEditableTeamSection(project)}

                                {/* Deliverables & Folders */}
                                <div className="file-section">
                                    <div className="file-section-title" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        Deliverables & Folders
                                        <div style={{ display: 'flex', gap: 6 }}>
                                            <button className="btn btn-secondary" style={{ padding: '4px 10px', fontSize: 11 }}
                                                    onClick={() => setShowModal('newFolder')}>
                                                {Icons.plus} New Folder
                                            </button>
                                            <button className="btn btn-primary" style={{ padding: '4px 10px', fontSize: 11 }}
                                                    onClick={() => { setModalData({ selectedType: 'deliverable' }); setShowModal('newFolder'); }}>
                                                {Icons.plus} Add Asset
                                            </button>
                                        </div>
                                    </div>
                                    <div className="folder-grid">
                                        {deliverables.map(d => (
                                            <div key={d.id || d.name} className="folder-card deliverable"
                                                 onClick={() => navigateTo('deliverable', d.id || d.name, d.title || d.name)}>
                                                {Icons.folder}
                                                <div className="folder-name">{d.title || d.name}</div>
                                                <div className="folder-meta">
                                                    {files.filter(f => f.deliverableId === (d.id || d.name) && !f.isFolder).length} files
                                                </div>
                                            </div>
                                        ))}
                                        {/* User-created folders at project level */}
                                        {projectFolders.map(folder => (
                                            <div key={folder.id} className="folder-card"
                                                 onClick={() => navigateTo('subfolder', folder.id, folder.name)}
                                                 style={{ borderColor: 'var(--dmg-blue)', borderStyle: 'dashed' }}>
                                                {Icons.folder}
                                                <div className="folder-name">{folder.name}</div>
                                                <div className="folder-meta" style={{ color: 'var(--dmg-blue)' }}>Custom folder</div>
                                            </div>
                                        ))}
                                        {deliverables.length === 0 && projectFolders.length === 0 && (
                                            <div className="folder-card" style={{ opacity: 0.5, border: '1px dashed var(--border)', background: 'transparent' }}
                                                 onClick={() => setShowModal('newFolder')}>
                                                <div style={{ color: 'var(--ink-muted)' }}>{Icons.plus}</div>
                                                <div className="folder-name" style={{ color: 'var(--ink-muted)' }}>Add Folder</div>
                                                <div className="folder-meta">Click to create</div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Project Files - files uploaded to project level */}
                                <div className="file-section">
                                    <div className="file-section-title">Project Files ({projectFiles.length})</div>
                                    {projectFiles.length > 0 ? (
                                        <div className="file-list">
                                            {projectFiles.map(f => renderFileItem(f))}
                                        </div>
                                    ) : (
                                        <div style={{ padding: '20px', textAlign: 'center', color: 'var(--ink-muted)', fontSize: 12 }}>
                                            Drop files above to upload to this project
                                        </div>
                                    )}
                                </div>

                                {/* Frame.io Section */}
                                {renderFrameIoSection(project)}
                            </>
                        );
                    }

                    // LEVEL 2: Inside a deliverable - show subfolders (Production, Edits, etc.)
                    if (currentDeliverable && !currentSubfolder) {
                        // Standard subfolders for each deliverable
                        const subfolders = [
                            { id: 'script', name: 'Script', icon: 'doc', description: 'Scripts and treatments' },
                            { id: 'production', name: 'Production', icon: 'folder', description: 'Call sheets, shot lists, receipts' },
                            { id: 'rushes', name: 'Rushes', icon: 'video', description: 'Raw footage from Frame.io' },
                            { id: 'edits', name: 'Edits', icon: 'video', description: 'V1, V2, FINAL versions' },
                            { id: 'graphics', name: 'Graphics', icon: 'image', description: 'Thumbnails, end cards, assets' },
                            { id: 'client-assets', name: 'Client Assets', icon: 'folder', description: 'Logos, brand guidelines' }
                        ];

                        // Get user-created folders at this level
                        const userFolders = files.filter(f =>
                            f.isFolder &&
                            f.projectId === currentProject.id &&
                            f.deliverableId === currentDeliverable.id &&
                            !f.subfolder
                        );

                        return (
                            <>
                                {renderUploadZone()}

                                {/* Pinned Files at deliverable level */}
                                {renderPinnedSection()}

                                <div className="file-section">
                                    <div className="file-section-title" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        Folders in {currentDeliverable.name}
                                        <button className="btn btn-secondary" style={{ padding: '4px 10px', fontSize: 11 }}
                                                onClick={() => setShowModal('newFolder')}>
                                            {Icons.plus} New Folder
                                        </button>
                                    </div>
                                    <div className="folder-grid">
                                        {subfolders.map(sf => {
                                            const fileCount = files.filter(f =>
                                                f.deliverableId === currentDeliverable.id &&
                                                f.subfolder === sf.id &&
                                                !f.isFolder
                                            ).length;

                                            // Special handling for Rushes - link to Frame.io
                                            if (sf.id === 'rushes' && project?.frameIo) {
                                                return (
                                                    <a key={sf.id} href={project.frameIo} target="_blank" rel="noopener noreferrer"
                                                       className="folder-card deliverable" style={{ textDecoration: 'none' }}>
                                                        {Icons.video}
                                                        <div className="folder-name">{sf.name}</div>
                                                        <div className="folder-meta">Open in Frame.io</div>
                                                    </a>
                                                );
                                            }

                                            return (
                                                <div key={sf.id} className="folder-card deliverable"
                                                     onClick={() => navigateTo('subfolder', sf.id, sf.name)}>
                                                    {sf.icon === 'video' ? Icons.video :
                                                     sf.icon === 'image' ? Icons.file :
                                                     sf.icon === 'doc' ? Icons.file : Icons.folder}
                                                    <div className="folder-name">{sf.name}</div>
                                                    <div className="folder-meta">{fileCount} files</div>
                                                </div>
                                            );
                                        })}
                                        {/* User-created folders */}
                                        {userFolders.map(folder => (
                                            <div key={folder.id} className="folder-card deliverable"
                                                 onClick={() => navigateTo('subfolder', folder.id, folder.name)}>
                                                {Icons.folder}
                                                <div className="folder-name">{folder.name}</div>
                                                <div className="folder-meta">Custom folder</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Frame.io assets for this deliverable */}
                                {frameioAssets.length > 0 && (
                                    <div className="frameio-section">
                                        <div className="frameio-header">
                                            <div className="title">{Icons.video} Video Review</div>
                                            {project?.frameIo && (
                                                <a href={project.frameIo} target="_blank" rel="noopener noreferrer" className="frameio-link">
                                                    Open Frame.io {Icons.externalLink}
                                                </a>
                                            )}
                                        </div>
                                        <div className="frameio-assets">
                                            {frameioAssets.map(asset => (
                                                <div key={asset.id} className="frameio-asset"
                                                     onClick={() => window.open(`https://app.frame.io/player/${asset.id}`, '_blank')}>
                                                    <div className="thumb">
                                                        {asset.thumb_url ?
                                                            <img src={asset.thumb_url} alt={asset.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> :
                                                            Icons.video
                                                        }
                                                    </div>
                                                    <div className="name">
                                                        {asset.name}
                                                        {asset.commentCount > 0 && <span style={{ marginLeft: 4, opacity: 0.7 }}>💬 {asset.commentCount}</span>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Files not in any subfolder */}
                                {files.filter(f => f.deliverableId === currentDeliverable.id && !f.subfolder).length > 0 && (
                                    <div className="file-section">
                                        <div className="file-section-title">Other Files</div>
                                        <div className="file-list">
                                            {files.filter(f => f.deliverableId === currentDeliverable.id && !f.subfolder).map(f => renderFileItem(f))}
                                        </div>
                                    </div>
                                )}
                            </>
                        );
                    }

                    // LEVEL 3: Inside a subfolder - show files
                    if (currentSubfolder) {
                        return (
                            <>
                                {renderUploadZone()}

                                {/* Date Filter */}
                                {renderDateFilter()}

                                {currentFiles.length > 0 ? (
                                    <div className="file-section">
                                        <div className="file-section-title">
                                            {currentSubfolder.name} ({currentFiles.length} files)
                                        </div>
                                        <div className="file-list">
                                            {currentFiles.map(f => renderFileItem(f))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="empty-state">
                                        {Icons.upload}
                                        <div className="empty-state-title">No files in {currentSubfolder.name}</div>
                                        <div className="empty-state-text">Drop files here or click to upload</div>
                                    </div>
                                )}
                            </>
                        );
                    }
                }

                return null;
            };

            const renderFileItem = (file) => {
                const docTypeInfo = file.docType ? CONFIG.DOC_TYPES.find(d => d.id === file.docType) : null;

                return (
                    <div key={file.id} className="file-item" style={{ position: 'relative' }}>
                        {/* Pinned badge */}
                        {file.pinned && (
                            <div className="pin-icon" style={{ position: 'absolute', top: -6, left: 8, width: 16, height: 16, background: '#F59E0B', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                <span style={{ fontSize: 8, color: 'white' }}>★</span>
                            </div>
                        )}
                        {/* Doc type badge */}
                        {docTypeInfo && (
                            <span className="doc-type-badge" style={{ position: 'absolute', top: -6, right: 8, padding: '2px 8px', borderRadius: 4, fontSize: 9, fontWeight: 700, background: docTypeInfo.color, color: 'white' }}>
                                {docTypeInfo.label}
                            </span>
                        )}

                        <div className={`file-icon ${file.isExternal ? 'link' : getFileType(file.name, file.type)}`}>
                            {file.isExternal ? Icons.link : Icons.file}
                        </div>
                        <div className="file-info">
                            <div className="file-name">{file.name}</div>
                            <div className="file-meta" style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                                {file.isExternal ? 'External link' : formatFileSize(file.size)}
                                <span style={{ color: 'var(--dmg-blue)', fontWeight: 500 }}>• {file.uploadedBy?.name || 'Unknown'}</span>
                                • {formatTimeAgo(file.uploadedAt)}
                            </div>
                        </div>
                        <div className="file-actions">
                            <button className="icon-btn" title={file.isExternal ? 'Open' : 'Download'} onClick={() => window.open(file.url, '_blank')}>
                                {file.isExternal ? Icons.externalLink : Icons.download}
                            </button>
                            <button className="icon-btn" title={file.pinned ? 'Unpin' : 'Pin as key document'} onClick={() => {
                                if (file.pinned) {
                                    togglePinFile(file);
                                } else {
                                    setModalData(file);
                                    setShowModal('pin');
                                }
                            }}>
                                {file.pinned ? Icons.starFilled : Icons.star}
                            </button>
                            <button className="icon-btn" title="Rename" onClick={() => { setModalData(file); setShowModal('rename'); }}>
                                {Icons.edit}
                            </button>
                            <button className="icon-btn" title="Move" onClick={() => { setModalData(file); setShowModal('move'); }}>
                                {Icons.move}
                            </button>
                            <button className="icon-btn danger" title="Delete" onClick={() => deleteFile(file)}>
                                {Icons.trash}
                            </button>
                        </div>
                    </div>
                );
            };

            // Render pinned files section
            const renderPinnedSection = () => {
                const pinnedFiles = getPinnedFiles();
                if (pinnedFiles.length === 0) return null;

                return (
                    <div className="pinned-section">
                        <div className="pinned-header">
                            {Icons.starFilled}
                            Key Documents
                        </div>
                        <div className="pinned-grid">
                            {pinnedFiles.map(file => {
                                const docTypeInfo = file.docType ? CONFIG.DOC_TYPES.find(d => d.id === file.docType) : null;
                                return (
                                    <div key={file.id} className="pinned-card" onClick={() => window.open(file.url, '_blank')}>
                                        {docTypeInfo && (
                                            <span className="doc-type-badge" style={{ background: docTypeInfo.color }}>
                                                {docTypeInfo.label}
                                            </span>
                                        )}
                                        <div className={`file-icon ${file.isExternal ? 'link' : getFileType(file.name, file.type)}`} style={{ width: 28, height: 28 }}>
                                            {file.isExternal ? Icons.link : Icons.file}
                                        </div>
                                        <div className="file-info" style={{ flex: 1 }}>
                                            <div className="file-name" style={{ fontSize: 11 }}>{file.name}</div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            // Editable Team Section with roles
            const [editingTeam, setEditingTeam] = React.useState(false);
            const [teamMembers, setTeamMembers] = React.useState({});

            // Load team from Firebase when project changes
            React.useEffect(() => {
                const loadTeam = async () => {
                    const loc = getCurrentLocation();
                    if (!loc.projectId) return;

                    try {
                        const doc = await configCollection.doc(`team-${loc.projectId}`).get();
                        if (doc.exists) {
                            setTeamMembers(doc.data().members || {});
                        } else {
                            // Initialize with Notion data
                            const project = projects.find(p => p.id === loc.projectId);
                            if (project) {
                                setTeamMembers({
                                    creative: project.creativeLead || '',
                                    sales: project.salesLead || '',
                                    producer: '',
                                    client: ''
                                });
                            }
                        }
                    } catch (err) {
                        console.error('Failed to load team:', err);
                    }
                };
                loadTeam();
            }, [currentPath, projects]);

            const saveTeam = async () => {
                const loc = getCurrentLocation();
                if (!loc.projectId) return;

                try {
                    await configCollection.doc(`team-${loc.projectId}`).set({
                        members: teamMembers,
                        updatedAt: new Date().toISOString()
                    });

                    await logActivity({
                        type: 'team_update',
                        action: 'updated team',
                        projectId: loc.projectId,
                        projectName: loc.projectName
                    });

                    showToast('Team saved', 'success');
                    setEditingTeam(false);
                } catch (err) {
                    console.error('Save team error:', err);
                    showToast('Failed to save team', 'error');
                }
            };

            // Custom Staff Dropdown Component
            const StaffDropdown = ({ value, onChange, placeholder, color, filterRole = null }) => {
                const [isOpen, setIsOpen] = React.useState(false);
                const [search, setSearch] = React.useState('');
                const dropdownRef = React.useRef(null);

                // Close on click outside
                React.useEffect(() => {
                    const handleClickOutside = (e) => {
                        if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
                            setIsOpen(false);
                        }
                    };
                    document.addEventListener('mousedown', handleClickOutside);
                    return () => document.removeEventListener('mousedown', handleClickOutside);
                }, []);

                // Filter staff based on search and optional role filter
                const filteredStaff = staffDirectory.filter(s => {
                    const matchesSearch = !search ||
                        s.name?.toLowerCase().includes(search.toLowerCase()) ||
                        s.email?.toLowerCase().includes(search.toLowerCase()) ||
                        s.role?.toLowerCase().includes(search.toLowerCase());

                    const matchesRole = !filterRole || s.role === filterRole ||
                        (s.secondaryRoles && s.secondaryRoles.includes(filterRole));

                    return matchesSearch && matchesRole;
                });

                // Find selected staff member
                const selectedStaff = staffDirectory.find(s => s.name === value || s.id === value);

                // Get background color based on team
                const getTeamColor = (team) => {
                    const colors = {
                        'Sales': '#F59E0B',
                        'Creative': '#8B5CF6',
                        'Production': '#22C55E',
                        'Operations': '#EC4899',
                        'Content': '#06B6D4',
                        'Editorial': '#EF4444',
                        'Social': '#3B82F6',
                        'Design': '#F97316'
                    };
                    return colors[team] || '#6B7280';
                };

                return (
                    <div className="staff-dropdown" ref={dropdownRef}>
                        <div
                            className={`staff-dropdown-trigger ${isOpen ? 'open' : ''}`}
                            onClick={() => setIsOpen(!isOpen)}
                            style={{ borderColor: isOpen ? color : undefined }}>
                            {selectedStaff ? (
                                <>
                                    <div className="avatar" style={{
                                        width: 24, height: 24, borderRadius: '50%',
                                        background: color || getTeamColor(selectedStaff.team),
                                        color: 'white',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                                        fontSize: 9, fontWeight: 700
                                    }}>
                                        {getInitials(selectedStaff.name)}
                                    </div>
                                    <span style={{ color: 'var(--ink)', fontWeight: 500 }}>{selectedStaff.name}</span>
                                </>
                            ) : (
                                <span className="placeholder">{placeholder || 'Select person...'}</span>
                            )}
                            <span className="chevron">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </span>
                        </div>

                        {isOpen && (
                            <div className="staff-dropdown-menu">
                                <div className="staff-dropdown-search">
                                    <input
                                        type="text"
                                        placeholder="Search by name, role..."
                                        value={search}
                                        onChange={(e) => setSearch(e.target.value)}
                                        autoFocus
                                    />
                                </div>
                                <div className="staff-dropdown-list">
                                    {filteredStaff.length > 0 ? (
                                        filteredStaff.map(staff => (
                                            <div
                                                key={staff.id}
                                                className={`staff-dropdown-item ${selectedStaff?.id === staff.id ? 'selected' : ''}`}
                                                onClick={() => {
                                                    onChange(staff.name, staff);
                                                    setIsOpen(false);
                                                    setSearch('');
                                                }}>
                                                <div className="avatar" style={{ background: getTeamColor(staff.team) }}>
                                                    {getInitials(staff.name)}
                                                </div>
                                                <div className="info">
                                                    <div className="name">{staff.name}</div>
                                                    <div className="meta">{staff.role} • {staff.team}</div>
                                                </div>
                                                {staff.slackId && (
                                                    <span style={{ fontSize: 10, color: '#4A154B' }} title="Has Slack ID">
                                                        💬
                                                    </span>
                                                )}
                                            </div>
                                        ))
                                    ) : (
                                        <div className="staff-dropdown-empty">
                                            {staffLoading ? 'Loading staff...' :
                                             staffDirectory.length === 0 ? 'Staff directory not available' :
                                             'No matching staff found'}
                                        </div>
                                    )}
                                </div>
                                {value && (
                                    <div className="staff-dropdown-clear" onClick={() => {
                                        onChange(null, null);
                                        setIsOpen(false);
                                    }}>
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                                        </svg>
                                        Clear selection
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            const renderEditableTeamSection = (project) => {
                const roles = [
                    { key: 'sales', label: 'Sales Lead', color: '#F59E0B', filterRole: null },
                    { key: 'creative', label: 'Creative Lead', color: '#8B5CF6', filterRole: 'Creative' },
                    { key: 'producer', label: 'Producer', color: '#22C55E', filterRole: null },
                    { key: 'client', label: 'Client Contact', color: '#21A0D8', filterRole: null }
                ];

                return (
                    <div className="file-section">
                        <div className="file-section-title" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                            TEAM
                            <button className="btn btn-secondary" style={{ padding: '4px 10px', fontSize: 11 }}
                                    onClick={() => editingTeam ? saveTeam() : setEditingTeam(true)}>
                                {editingTeam ? 'Save' : 'Edit'}
                            </button>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 10 }}>
                            {roles.map(role => (
                                <div key={role.key} style={{
                                    padding: 14,
                                    background: 'var(--white)',
                                    border: editingTeam ? `2px solid ${role.color}30` : '1px solid var(--border)',
                                    borderRadius: 10,
                                    transition: 'all 0.15s'
                                }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                                        <div style={{
                                            width: 36, height: 36, borderRadius: '50%',
                                            background: role.color, color: 'white',
                                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                                            fontSize: 12, fontWeight: 700, flexShrink: 0
                                        }}>
                                            {getInitials(teamMembers[role.key] || '?')}
                                        </div>
                                        <div style={{ flex: 1, minWidth: 0 }}>
