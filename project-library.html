                                                     onClick={() => window.open(`https://app.frame.io/player/${asset.id}`, '_blank')}>
                                                    <div className="thumb">
                                                        {asset.thumb_url ?
                                                            <img src={asset.thumb_url} alt={asset.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> :
                                                            Icons.video
                                                        }
                                                    </div>
                                                    <div className="name">
                                                        {asset.name}
                                                        {asset.commentCount > 0 && <span style={{ marginLeft: 4, opacity: 0.7 }}>💬 {asset.commentCount}</span>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Files not in any subfolder */}
                                {files.filter(f => f.deliverableId === currentDeliverable.id && !f.subfolder).length > 0 && (
                                    <div className="file-section">
                                        <div className="file-section-title">Other Files</div>
                                        <div className="file-list">
                                            {files.filter(f => f.deliverableId === currentDeliverable.id && !f.subfolder).map(f => renderFileItem(f))}
                                        </div>
                                    </div>
                                )}
                            </>
                        );
                    }

                    // LEVEL 3: Inside a subfolder - show files
                    if (currentSubfolder) {
                        return (
                            <>
                                {renderUploadZone()}

                                {/* Date Filter */}
                                {renderDateFilter()}

                                {currentFiles.length > 0 ? (
                                    <div className="file-section">
                                        <div className="file-section-title">
                                            {currentSubfolder.name} ({currentFiles.length} files)
                                        </div>
                                        <div className="file-list">
                                            {currentFiles.map(f => renderFileItem(f))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="empty-state">
                                        {Icons.upload}
                                        <div className="empty-state-title">No files in {currentSubfolder.name}</div>
                                        <div className="empty-state-text">Drop files here or click to upload</div>
                                    </div>
                                )}
                            </>
                        );
                    }
                }

                return null;
            };

            const renderFileItem = (file) => {
                const docTypeInfo = file.docType ? CONFIG.DOC_TYPES.find(d => d.id === file.docType) : null;

                return (
                    <div key={file.id} className="file-item" style={{ position: 'relative' }}>
                        {/* Pinned badge */}
                        {file.pinned && (
                            <div className="pin-icon" style={{ position: 'absolute', top: -6, left: 8, width: 16, height: 16, background: '#F59E0B', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                <span style={{ fontSize: 8, color: 'white' }}>★</span>
                            </div>
                        )}
                        {/* Doc type badge */}
                        {docTypeInfo && (
                            <span className="doc-type-badge" style={{ position: 'absolute', top: -6, right: 8, padding: '2px 8px', borderRadius: 4, fontSize: 9, fontWeight: 700, background: docTypeInfo.color, color: 'white' }}>
                                {docTypeInfo.label}
                            </span>
                        )}

                        <div className={`file-icon ${file.isExternal ? 'link' : getFileType(file.name, file.type)}`}>
                            {file.isExternal ? Icons.link : Icons.file}
                        </div>
                        <div className="file-info">
                            <div className="file-name">{file.name}</div>
                            <div className="file-meta" style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                                {file.isExternal ? 'External link' : formatFileSize(file.size)}
                                <span style={{ color: 'var(--dmg-blue)', fontWeight: 500 }}>• {file.uploadedBy?.name || 'Unknown'}</span>
                                • {formatTimeAgo(file.uploadedAt)}
                            </div>
                        </div>
                        <div className="file-actions">
                            <button className="icon-btn" title={file.isExternal ? 'Open' : 'Download'} onClick={() => window.open(file.url, '_blank')}>
                                {file.isExternal ? Icons.externalLink : Icons.download}
                            </button>
                            <button className="icon-btn" title={file.pinned ? 'Unpin' : 'Pin as key document'} onClick={() => {
                                if (file.pinned) {
                                    togglePinFile(file);
                                } else {
                                    setModalData(file);
                                    setShowModal('pin');
                                }
                            }}>
                                {file.pinned ? Icons.starFilled : Icons.star}
                            </button>
                            <button className="icon-btn" title="Rename" onClick={() => { setModalData(file); setShowModal('rename'); }}>
                                {Icons.edit}
                            </button>
                            <button className="icon-btn" title="Move" onClick={() => { setModalData(file); setShowModal('move'); }}>
                                {Icons.move}
                            </button>
                            <button className="icon-btn danger" title="Delete" onClick={() => deleteFile(file)}>
                                {Icons.trash}
                            </button>
                        </div>
                    </div>
                );
            };

            // Render pinned files section
            const renderPinnedSection = () => {
                const pinnedFiles = getPinnedFiles();
                if (pinnedFiles.length === 0) return null;

                return (
                    <div className="pinned-section">
                        <div className="pinned-header">
                            {Icons.starFilled}
                            Key Documents
                        </div>
                        <div className="pinned-grid">
                            {pinnedFiles.map(file => {
                                const docTypeInfo = file.docType ? CONFIG.DOC_TYPES.find(d => d.id === file.docType) : null;
                                return (
                                    <div key={file.id} className="pinned-card" onClick={() => window.open(file.url, '_blank')}>
                                        {docTypeInfo && (
                                            <span className="doc-type-badge" style={{ background: docTypeInfo.color }}>
                                                {docTypeInfo.label}
                                            </span>
                                        )}
                                        <div className={`file-icon ${file.isExternal ? 'link' : getFileType(file.name, file.type)}`} style={{ width: 28, height: 28 }}>
                                            {file.isExternal ? Icons.link : Icons.file}
                                        </div>
                                        <div className="file-info" style={{ flex: 1 }}>
                                            <div className="file-name" style={{ fontSize: 11 }}>{file.name}</div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            // Editable Team Section with roles
            const [editingTeam, setEditingTeam] = React.useState(false);
            const [teamMembers, setTeamMembers] = React.useState({});

            // Load team from Firebase when project changes
            React.useEffect(() => {
                const loadTeam = async () => {
                    const loc = getCurrentLocation();
                    if (!loc.projectId) return;

                    try {
                        const doc = await configCollection.doc(`team-${loc.projectId}`).get();
                        if (doc.exists) {
                            setTeamMembers(doc.data().members || {});
                        } else {
                            // Initialize with Notion data
                            const project = projects.find(p => p.id === loc.projectId);
                            if (project) {
                                setTeamMembers({
                                    creative: project.creativeLead || '',
                                    sales: project.salesLead || '',
                                    producer: '',
                                    client: ''
                                });
                            }
                        }
                    } catch (err) {
                        console.error('Failed to load team:', err);
                    }
                };
                loadTeam();
            }, [currentPath, projects]);

            const saveTeam = async () => {
                const loc = getCurrentLocation();
                if (!loc.projectId) return;

                try {
                    await configCollection.doc(`team-${loc.projectId}`).set({
                        members: teamMembers,
                        updatedAt: new Date().toISOString()
                    });

                    await logActivity({
                        type: 'team_update',
                        action: 'updated team',
                        projectId: loc.projectId,
                        projectName: loc.projectName
                    });

                    showToast('Team saved', 'success');
                    setEditingTeam(false);
                } catch (err) {
                    console.error('Save team error:', err);
                    showToast('Failed to save team', 'error');
                }
            };

            const renderEditableTeamSection = (project) => {
                const roles = [
                    { key: 'sales', label: 'Sales Lead', color: '#F59E0B' },
                    { key: 'creative', label: 'Creative Lead', color: '#8B5CF6' },
                    { key: 'producer', label: 'Producer', color: '#22C55E' },
                    { key: 'client', label: 'Client Contact', color: '#21A0D8' }
                ];

                return (
                    <div className="file-section">
                        <div className="file-section-title" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                            Team
                            <button className="btn btn-secondary" style={{ padding: '4px 10px', fontSize: 11 }}
                                    onClick={() => editingTeam ? saveTeam() : setEditingTeam(true)}>
                                {editingTeam ? 'Save' : 'Edit'}
                            </button>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 10 }}>
                            {roles.map(role => (
                                <div key={role.key} className="file-item" style={{ padding: 12 }}>
                                    <div className="avatar" style={{
                                        width: 32, height: 32, borderRadius: '50%',
                                        background: role.color, color: 'white',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                                        fontSize: 11, fontWeight: 700, flexShrink: 0
                                    }}>
                                        {getInitials(teamMembers[role.key] || '?')}
                                    </div>
                                    <div className="file-info" style={{ flex: 1 }}>
                                        <div className="file-meta" style={{ fontSize: 10, marginBottom: 2 }}>{role.label}</div>
                                        {editingTeam ? (
                                            <input
                                                type="text"
                                                className="form-input"
                                                style={{ padding: '4px 8px', fontSize: 12 }}
                                                value={teamMembers[role.key] || ''}
                                                placeholder={`Add ${role.label.toLowerCase()}`}
                                                onChange={(e) => setTeamMembers({ ...teamMembers, [role.key]: e.target.value })}
                                            />
                                        ) : (
                                            <div className="file-name" style={{ fontSize: 13 }}>
                                                {teamMembers[role.key] || <span style={{ opacity: 0.5, fontStyle: 'italic' }}>Not assigned</span>}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // Render Frame.io section (if project has Frame.io link or we have API access)
            const renderFrameIoSection = (project) => {
                // Show if project has Frame.io link OR if we have Frame.io API assets
                if (!project?.frameIo && frameioAssets.length === 0 && !frameioEnabled) return null;

                return (
                    <div className="frameio-section">
                        <div className="frameio-header">
                            <div className="title">
                                {Icons.video}
                                Video Review
                                {frameioAssets.length > 0 && (
                                    <span style={{ marginLeft: 8, fontSize: 11, opacity: 0.8 }}>
                                        {frameioAssets.length} {frameioAssets.length === 1 ? 'video' : 'videos'}
                                    </span>
                                )}
                            </div>
                            <div style={{ display: 'flex', gap: 8 }}>
                                {!frameioEnabled && (
                                    <button className="frameio-link" onClick={() => setShowModal('frameioSetup')} style={{ border: 'none', cursor: 'pointer' }}>
                                        Connect Frame.io
                                    </button>
                                )}
                                {project?.frameIo && (
                                    <a href={project.frameIo} target="_blank" rel="noopener noreferrer" className="frameio-link">
                                        Open Frame.io {Icons.externalLink}
                                    </a>
                                )}
                            </div>
                        </div>

                        {frameioLoading && (
                            <div style={{ padding: 16, textAlign: 'center', fontSize: 11, opacity: 0.7 }}>
                                Loading videos from Frame.io...
                            </div>
                        )}

                        {!frameioLoading && frameioAssets.length > 0 && (
                            <div className="frameio-assets">
                                {frameioAssets.map(asset => (
                                    <div key={asset.id} className="frameio-asset" onClick={() => window.open(`https://app.frame.io/player/${asset.id}`, '_blank')}>
                                        <div className="thumb">
                                            {asset.thumb_url ? (
                                                <img src={asset.thumb_url} alt={asset.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                            ) : (
                                                Icons.video
                                            )}
                                        </div>
                                        <div className="name">
                                            {asset.name}
                                            {asset.commentCount > 0 && (
                                                <span style={{ marginLeft: 4, opacity: 0.7 }}>
                                                    💬 {asset.commentCount}
                                                </span>
                                            )}
                                        </div>
                                        {asset.label && (
                                            <div style={{ padding: '0 8px 8px', fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.03em' }}>
                                                {asset.label === 'approved' && '✓ Approved'}
                                                {asset.label === 'in_progress' && '🔄 In Progress'}
                                                {asset.label === 'needs_review' && '👁 Needs Review'}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}

                        {!frameioLoading && frameioAssets.length === 0 && frameioEnabled && (
                            <div style={{ fontSize: 11, opacity: 0.8 }}>
                                No videos found in Frame.io for this project
                            </div>
                        )}

                        {!frameioEnabled && !project?.frameIo && (
                            <div style={{ fontSize: 11, opacity: 0.8 }}>
                                Connect Frame.io to see video thumbnails and comment counts
                            </div>
                        )}
                    </div>
                );
            };

            // Render date filter
            const renderDateFilter = () => {
                if (!getCurrentLocation().projectId) return null;

                return (
                    <div className="date-filter">
                        {Icons.calendar}
                        <label>From:</label>
                        <input type="date" value={dateFilter.from} onChange={(e) => setDateFilter({ ...dateFilter, from: e.target.value })} />
                        <label>To:</label>
                        <input type="date" value={dateFilter.to} onChange={(e) => setDateFilter({ ...dateFilter, to: e.target.value })} />
                        {(dateFilter.from || dateFilter.to) && (
                            <button className="clear-btn" onClick={() => setDateFilter({ from: '', to: '' })}>Clear</button>
                        )}
                    </div>
                );
            };

            // Render modals
            const renderModals = () => {
                if (!showModal) return null;

                return (
                    <div className="modal-overlay show" onClick={() => { setShowModal(null); setModalData(null); }}>
                        <div className="modal" onClick={(e) => e.stopPropagation()}>
                            {showModal === 'rename' && modalData && (
                                <>
                                    <div className="modal-header">
                                        <span>Rename File</span>
                                        <button className="modal-close" onClick={() => { setShowModal(null); setModalData(null); }}>{Icons.x}</button>
                                    </div>
                                    <div className="modal-body">
                                        <div className="form-group">
                                            <label className="form-label">New name</label>
                                            <input type="text" className="form-input" id="renameInput" defaultValue={modalData.name} autoFocus
                                                   onKeyDown={(e) => { if (e.key === 'Enter') renameFile(modalData, e.target.value); }} />
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button className="btn btn-secondary" onClick={() => { setShowModal(null); setModalData(null); }}>Cancel</button>
                                        <button className="btn btn-primary" onClick={() => renameFile(modalData, document.getElementById('renameInput').value)}>Rename</button>
                                    </div>
                                </>
                            )}

                            {showModal === 'move' && modalData && (
                                <>
                                    <div className="modal-header">
                                        <span>Move to Folder</span>
                                        <button className="modal-close" onClick={() => { setShowModal(null); setModalData(null); }}>{Icons.x}</button>
                                    </div>
                                    <div className="modal-body">
                                        <div className="form-group">
                                            <label className="form-label">Select destination folder</label>
                                            <div className="folder-selector">
                                                {[
                                                    { id: 'script', name: 'Script' },
                                                    { id: 'production', name: 'Production' },
                                                    { id: 'rushes', name: 'Rushes' },
                                                    { id: 'edits', name: 'Edits' },
                                                    { id: 'graphics', name: 'Graphics' },
                                                    { id: 'client-assets', name: 'Client Assets' }
                                                ].map(folder => (
                                                    <div key={folder.id} className={`folder-option ${modalData.subfolder === folder.id ? 'selected' : ''}`}
                                                         onClick={() => moveFileToSubfolder(modalData, folder.id, folder.name)}>
                                                        {Icons.folder}
                                                        <span className="name">{folder.name}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}

                            {showModal === 'pin' && modalData && (
                                <>
                                    <div className="modal-header">
                                        <span>Pin as Key Document</span>
                                        <button className="modal-close" onClick={() => { setShowModal(null); setModalData(null); }}>{Icons.x}</button>
                                    </div>
                                    <div className="modal-body">
                                        <div className="form-group">
                                            <label className="form-label">Document Type</label>
                                            <div className="doc-type-grid">
                                                {CONFIG.DOC_TYPES.map(docType => (
                                                    <div key={docType.id} className="doc-type-option" onClick={() => togglePinFile(modalData, docType.id)}>
                                                        <div className="dot" style={{ background: docType.color }}></div>
                                                        {docType.label}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}

                            {showModal === 'addLink' && (
                                <>
                                    <div className="modal-header">
                                        <span>Add External Link</span>
                                        <button className="modal-close" onClick={() => { setShowModal(null); setModalData(null); }}>{Icons.x}</button>
                                    </div>
                                    <div className="modal-body">
                                        <div className="form-group">
                                            <label className="form-label">Name</label>
                                            <input type="text" className="form-input" id="linkName" placeholder="e.g. Project Tracker" />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">URL</label>
                                            <input type="url" className="form-input" id="linkUrl" placeholder="https://docs.google.com/..." />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Document Type (optional)</label>
                                            <select className="form-select" id="linkDocType">
                                                <option value="">None</option>
                                                {CONFIG.DOC_TYPES.map(docType => (
                                                    <option key={docType.id} value={docType.id}>{docType.label}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, cursor: 'pointer' }}>
                                                <input type="checkbox" id="linkPinned" />
                                                Pin as key document
                                            </label>
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button className="btn btn-secondary" onClick={() => { setShowModal(null); setModalData(null); }}>Cancel</button>
                                        <button className="btn btn-primary" onClick={() => {
                                            const name = document.getElementById('linkName').value;
                                            const url = document.getElementById('linkUrl').value;
                                            const docType = document.getElementById('linkDocType').value;
                                            const pinned = document.getElementById('linkPinned').checked;
                                            if (name && url) addExternalLink({ name, url, docType, pinned });
                                        }}>Add Link</button>
                                    </div>
                                </>
                            )}

                            {showModal === 'frameioSetup' && (
                                <>
                                    <div className="modal-header">
                                        <span>Connect Frame.io</span>
                                        <button className="modal-close" onClick={() => { setShowModal(null); setModalData(null); }}>{Icons.x}</button>
                                    </div>
                                    <div className="modal-body">
                                        <div style={{ marginBottom: 16, padding: 12, background: '#F3F4F6', borderRadius: 8, fontSize: 12 }}>
                                            <strong>How to get your Frame.io API token:</strong>
                                            <ol style={{ margin: '8px 0 0 16px', lineHeight: 1.6 }}>
                                                <li>Go to <a href="https://developer.frame.io" target="_blank" rel="noopener noreferrer" style={{ color: '#7C3AED' }}>developer.frame.io</a></li>
                                                <li>Click "Tokens" in the sidebar</li>
                                                <li>Create a new token with read permissions</li>
                                                <li>Copy and paste it below</li>
                                            </ol>
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Frame.io API Token</label>
                                            <input type="password" className="form-input" id="frameioToken" placeholder="fio-u-xxxxxxxxxxxx" autoFocus />
                                        </div>
                                        <div style={{ fontSize: 11, color: '#6B7280' }}>
                                            Your token is stored securely in Firebase and never exposed in the browser.
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button className="btn btn-secondary" onClick={() => { setShowModal(null); setModalData(null); }}>Cancel</button>
                                        <button className="btn btn-primary" style={{ background: '#7C3AED' }} onClick={async () => {
                                            const token = document.getElementById('frameioToken').value;
                                            if (!token) return;

                                            showToast('Connecting to Frame.io...');
                                            const success = await FrameIO.saveToken(token);
                                            if (success) {
                                                setFrameioEnabled(true);
                                                showToast('Frame.io connected!', 'success');
                                                // Reload Frame.io data
                                                try {
                                                    const me = await FrameIO.getMe();
                                                    if (me.account_id) {
                                                        const teams = await FrameIO.getTeams(me.account_id);
                                                        if (teams.length > 0) {
                                                            const projects = await FrameIO.getProjects(teams[0].id);
                                                            setFrameioProjects(projects);
                                                        }
                                                    }
                                                } catch (err) {
                                                    console.error('Frame.io init error:', err);
                                                    showToast('Connected but could not load projects', 'error');
                                                }
                                                setShowModal(null);
                                            } else {
                                                showToast('Failed to save token', 'error');
                                            }
                                        }}>Connect Frame.io</button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                );
            };

            const renderActivityFeed = () => (
                <div className="activity-panel">
                    <div className="activity-header">
                        Activity Feed
                        <div className="live-dot" title="Live updates" />
                    </div>
                    <div className="activity-list">
                        {activities.length === 0 ? (
                            <div className="empty-state" style={{ padding: '20px' }}>
                                <div className="empty-state-text">No activity yet</div>
                            </div>
                        ) : (
                            activities.map(a => (
                                <div key={a.id} className="activity-item">
                                    <div className="activity-avatar">{a.user?.initials || '?'}</div>
                                    <div className="activity-content">
                                        <div className="activity-text">
                                            <strong>{a.user?.name || 'Someone'}</strong> {a.action}{' '}
                                            <span className="highlight">{a.fileName || a.deliverableName || ''}</span>
                                            {a.projectName && (
                                                <> to <span className="highlight">{a.clientName} › {a.projectName}</span></>
                                            )}
                                        </div>
                                        <div className="activity-time">{formatTimeAgo(a.timestamp)}</div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );

            const renderSidebar = () => {
                const grouped = groupProjectsByClient();
                const activeProjects = projects.filter(p =>
                    p.dealStage?.toLowerCase().includes('won') ||
                    p.dealStage?.toLowerCase().includes('production')
                );

                return (
                    <div className="sidebar">
                        <div className="sidebar-header">
                            <div className="dot-grid"><span/><span/><span/><span/></div>
                            <span className="sidebar-title">Project Library</span>
                        </div>

                        <div className="sidebar-search">
                            <div className="search-wrapper">
                                {Icons.search}
                                <input type="text" className="search-input"
                                       placeholder="Search files, projects..."
                                       value={searchQuery}
                                       onChange={(e) => setSearchQuery(e.target.value)} />
                            </div>
                        </div>

                        <div className="sidebar-nav">
                            <div className="nav-section">
                                <div className="nav-section-title">Quick Access</div>
                                <div className={`nav-item ${currentPath.length === 0 && !searchQuery ? 'active' : ''}`}
                                     onClick={() => { setSearchQuery(''); navigateTo('root'); }}>
                                    {Icons.home}
                                    All Clients
                                    <span className="count">{Object.keys(grouped).length}</span>
                                </div>
                                <div className="nav-item" onClick={() => setSearchQuery('active')}>
                                    {Icons.star}
                                    Active Projects
                                    <span className="count">{activeProjects.length}</span>
                                </div>
                                <div className="nav-item" onClick={() => showToast('Recent files coming soon')}>
                                    {Icons.clock}
                                    Recent Files
                                </div>
                            </div>

                            <div className="nav-section">
                                <div className="nav-section-title">Clients</div>
                                {Object.keys(grouped).sort().slice(0, 10).map(client => (
                                    <div key={client}
                                         className={`nav-item ${currentPath[0]?.name === client ? 'active' : ''}`}
                                         onClick={() => { setSearchQuery(''); navigateTo('client', client, client); }}>
                                        {Icons.folder}
                                        {client}
                                        <span className="count">{grouped[client].length}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // ─────────────────────────────────────────────────────────────────────
            // MAIN RENDER
            // ─────────────────────────────────────────────────────────────────────
            if (loading) {
                return (
                    <div className="app-container">
                        <div className="loading-state" style={{ flex: 1 }}>
                            <div className="dot-grid" style={{ transform: 'scale(2)' }}>
                                <span/><span/><span/><span/>
                            </div>
                            <div className="loading-text">Loading projects...</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    {renderSidebar()}

                    <div className="main-content">
                        <div className="main-header">
                            {renderBreadcrumb()}
                            <div className="header-actions">
                                {getCurrentLocation().projectId && (
                                    <>
                                        <button className="btn btn-secondary" onClick={() => setShowModal('addLink')}>
                                            {Icons.link}
                                            Add Link
                                        </button>
                                        <button className="btn btn-primary" onClick={() => fileInputRef.current?.click()}>
                                            {Icons.upload}
                                            Upload
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="content-area">
                            <div className="file-browser">
                                {renderPinnedSection()}
                                {renderFolderGrid()}
                            </div>
                            {renderActivityFeed()}
                        </div>
                    </div>

                    <Toast {...toast} />
                    {renderModals()}
                </div>
            );
        };

        // ═══════════════════════════════════════════════════════════════════════════
        // MOUNT APP
        // ═══════════════════════════════════════════════════════════════════════════
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
