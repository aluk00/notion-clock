<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Outlook | Live Cloud</title>
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --text-main: #111;
            --text-sub: #888;
            --border: #eeeeee;
            --bg-light: #f9f9f9;
            --st-office: #2E7D32;
            --st-wfh: #F9A825;
            --st-shoot: #2196F3;
            --st-pto: #F44336;
        }

        html, body { margin: 0; padding: 0; background-color: transparent; font-family: sans-serif; color: var(--text-main); }
        body { padding: 10px; }
        .outlook-container { background: #ffffff; border: 1.5px solid var(--border); border-radius: 16px; padding: 24px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .date-header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 5px; }
        .today-label { font-size: 10px; font-weight: 900; text-transform: uppercase; color: var(--dmg-blue); }
        .today-date { font-size: 18px; font-weight: 800; }
        .status-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 15px; }
        .status-pill { padding: 12px; background: var(--bg-light); border-radius: 10px; text-align: center; }
        .pill-count { font-size: 24px; font-weight: 900; display: block; }
        .pill-label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--text-sub); }
        .section-header { font-size: 11px; font-weight: 900; text-transform: uppercase; color: #bbb; margin-top: 20px; }
        .people-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .person-tag { background: #fff; border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--st-office); }
    </style>
</head>
<body>

    <div class="outlook-container">
        <div class="date-header">
            <div style="display:flex; flex-direction:column;">
                <span class="today-label">Live Cloud Outlook</span>
                <span class="today-date" id="display-today">Today</span>
            </div>
            <div style="font-size:11px; font-weight:700; color:var(--text-sub);" id="display-wc">Sync Active</div>
        </div>
        
        <div class="status-row">
            <div class="status-pill"><span class="pill-count" id="today-office" style="color: var(--st-office);">0</span><span class="pill-label">Office</span></div>
            <div class="status-pill"><span class="pill-count" id="today-remote" style="color: var(--st-wfh);">0</span><span class="pill-label">Remote</span></div>
            <div class="status-pill"><span class="pill-count" id="today-shoot" style="color: var(--st-shoot);">0</span><span class="pill-label">Off-Site</span></div>
            <div class="status-pill"><span class="pill-count" id="today-pto" style="color: var(--st-pto);">0</span><span class="pill-label">Leave</span></div>
        </div>

        <div class="section-header">Currently in building</div>
        <div class="people-grid" id="tags-mount"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMhRhG2j-NprFJdeZ8VvcPQ_sRiqILz6o",
        authDomain: "dmg-command-centre.firebaseapp.com",
        projectId: "dmg-command-centre",
        storageBucket: "dmg-command-centre.firebasestorage.app",
        messagingSenderId: "870188205332",
        appId: "1:870188205332:web:0d6b87300fe272eae0ae01",
        measurementId: "G-25TS57VLVS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const appId = 'dmg-command-centre';
    const dayIdx = new Date().getDay() - 1;

    async function init() {
        document.getElementById('display-today').innerText = new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'short'});
        await signInAnonymously(auth);
        
        onAuthStateChanged(auth, (user) => {
            if(user) {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'rota_submissions'), (snap) => {
                    const subs = [];
                    snap.forEach(d => subs.push(d.data()));
                    render(subs);
                });
            }
        });
    }

    function render(data) {
        const counts = { Office: 0, WFH: 0, Shoot: 0, PTO: 0, Abroad: 0, "Half Day": 0 };
        const inOffice = [];

        data.forEach(s => {
            const status = s.schedule[dayIdx] || 'Office';
            if(counts[status] !== undefined) counts[status]++;
            if(status === 'Office') inOffice.push(s.name);
        });

        document.getElementById('today-office').innerText = counts.Office;
        document.getElementById('today-remote').innerText = counts.WFH;
        document.getElementById('today-shoot').innerText = counts.Shoot;
        document.getElementById('today-pto').innerText = counts.PTO;

        document.getElementById('tags-mount').innerHTML = inOffice.map(n => `
            <div class="person-tag"><div class="status-dot"></div> ${n}</div>
        `).join('') || '<div style="font-size:12px; color:#BBB;">No one logged in office.</div>';
    }

    init();
</script>
</body>
</html>
