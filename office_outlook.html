<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>DMG Office Outlook</title>

  <style>
    :root {
      --dmg-blue: #21a0d8;
      --carbon: #1c1c1c;
      --text-main: #1c1c1c;
      --text-sub: #888;
      --border: #eeeeee;
      --bg-light: #f9f9f9;

      --st-office: #2e7d32;
      --st-wfh: #f9a825;
      --st-shoot: #2196f3;
      --st-pto: #f44336;

      --team-editorial: #e94b4b;
      --team-creative: #e6468b;
      --team-production: #43b049;
      --team-social: #f2c316;
      --team-people: #21a0d8;
      --team-operations: #21a0d8;
      --team-executive: #1c1c1c;

      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text-main);
    }

    body { padding: 10px; }

    .outlook-container {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .status-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

    .status-pill {
      padding: 16px;
      background: var(--bg-light);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
      position: relative;
      user-select: none;
    }

    .status-pill:hover {
      transform: translateY(-4px);
      background: #fff;
      border-color: var(--border);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }

    .status-pill.weekend-locked {
      opacity: 0.3;
      filter: grayscale(1);
      cursor: default;
    }

    .status-pill.weekend-locked:hover {
      transform: none;
      box-shadow: none;
      border-color: transparent;
      background: var(--bg-light);
    }

    .pill-count { font-size: 32px; font-weight: 900; display: block; line-height: 1; margin-bottom: 4px; }
    .pill-label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--text-sub); letter-spacing: 0.05em; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 560px;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .close-btn {
      position: absolute; top: 16px; right: 18px;
      font-size: 24px; font-weight: 800; color: #ccc;
      cursor: pointer;
    }

    .modal-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--dmg-blue);
      letter-spacing: 0.1em;
      margin-bottom: 18px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 10px;
    }

    .team-group { margin-bottom: 18px; }
    .team-label {
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 10px;
      display: block;
    }

    .staff-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px solid #f9f9f9;
      gap: 12px;
    }
    .staff-name { font-size: 14px; font-weight: 700; color: var(--carbon); }
    .staff-role { font-size: 11px; color: #999; font-weight: 500; text-align: right; }
    .staff-time { font-size: 10px; color: var(--dmg-blue); font-weight: 800; margin-left: 8px; white-space: nowrap; }

    /* Weekend toast */
    #weekend-toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--carbon);
      color: #fff;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 800;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      z-index: 2000;
      text-transform: uppercase;
    }
    #weekend-toast.visible { opacity: 1; bottom: 30px; }
  </style>
</head>

<body>
  <div class="outlook-container">
    <div class="status-row">
      <div class="status-pill" id="pill-Office" onclick="handlePillClick('Office')">
        <span class="pill-count" id="today-office" style="color: var(--st-office);">0</span>
        <span class="pill-label">In Building</span>
      </div>

      <div class="status-pill" id="pill-WFH" onclick="handlePillClick('WFH')">
        <span class="pill-count" id="today-remote" style="color: var(--st-wfh);">0</span>
        <span class="pill-label">Remote</span>
      </div>

      <div class="status-pill" id="pill-Shoot" onclick="handlePillClick('Shoot')">
        <span class="pill-count" id="today-shoot" style="color: var(--st-shoot);">0</span>
        <span class="pill-label">Off-Site</span>
      </div>

      <div class="status-pill" id="pill-PTO" onclick="handlePillClick('PTO')">
        <span class="pill-count" id="today-pto" style="color: var(--st-pto);">0</span>
        <span class="pill-label">Leave</span>
      </div>
    </div>
  </div>

  <div id="weekend-toast">Weekend: Office Closed</div>

  <div class="modal-overlay" id="status-modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="close-btn" onclick="closeModal()">×</div>
      <div class="modal-title" id="modal-title-text">Status Details</div>
      <div id="modal-mount"></div>
    </div>
  </div>

  <script type="module">
    // Uses Firebase ESM from gstatic (stable on GitHub Pages + Notion embeds)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
      authDomain: "dmg-command-centre-native.firebaseapp.com",
      projectId: "dmg-command-centre-native",
      storageBucket: "dmg-command-centre-native.firebasestorage.app",
      messagingSenderId: "223535956454",
      appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const appId = "dmg-command-centre-native";

    // Day logic: your rota request stores schedule as Mon–Fri (0..4).
    const now = new Date();
    const jsDay = now.getDay(); // Sun=0, Mon=1..Sat=6
    const isWeekend = (jsDay === 0 || jsDay === 6);
    const dayIdx = isWeekend ? -1 : (jsDay - 1); // Mon=0..Fri=4

    let submissions = [];
    let directory = [];

    function safeNameKey(entry) {
      const f = (entry?.firstName || "").trim();
      const l = (entry?.lastName || "").trim();
      return `${f} ${l}`.trim();
    }

    function normaliseStatus(raw) {
      if (!raw) return "Office";
      if (raw === "Leave" || raw === "Abroad") return "PTO";
      if (raw === "Client / Travel") return "Shoot";
      return raw;
    }

    async function init() {
      if (isWeekend) {
        document.getElementById("pill-Office").classList.add("weekend-locked");
        document.getElementById("pill-WFH").classList.add("weekend-locked");
        document.getElementById("pill-PTO").classList.add("weekend-locked");
      }

      await signInAnonymously(auth);

      onAuthStateChanged(auth, (user) => {
        if (!user) return;

        onSnapshot(
          collection(db, "artifacts", appId, "public", "data", "rota_submissions"),
          (snap) => {
            submissions = [];
            snap.forEach((d) => submissions.push(d.data()));
            updateUI();
          }
        );

        onSnapshot(
          collection(db, "artifacts", appId, "public", "data", "staff_directory"),
          (snap) => {
            directory = [];
            snap.forEach((d) => directory.push(d.data()));
            updateUI();
          }
        );
      });
    }

    function updateUI() {
      const counts = { Office: 0, WFH: 0, Shoot: 0, PTO: 0 };

      submissions.forEach((s) => {
        if (dayIdx < 0 || dayIdx > 4) return;

        const dayData = (s.schedule && s.schedule[dayIdx]) ? s.schedule[dayIdx] : { status: "Office" };
        const key = normaliseStatus(dayData.status);

        if (counts[key] !== undefined) counts[key] += 1;
      });

      document.getElementById("today-office").innerText = counts.Office;
      document.getElementById("today-remote").innerText = counts.WFH;
      document.getElementById("today-shoot").innerText = counts.Shoot;
      document.getElementById("today-pto").innerText = counts.PTO;
    }

    window.handlePillClick = (type) => {
      if (isWeekend && type !== "Shoot") {
        const t = document.getElementById("weekend-toast");
        t.classList.add("visible");
        setTimeout(() => t.classList.remove("visible"), 2000);
        return;
      }
      openStatusModal(type);
    };

    window.openStatusModal = (statusType) => {
      const mount = document.getElementById("modal-mount");
      document.getElementById("modal-title-text").innerText = `Daily Presence: ${statusType}`;

      if (dayIdx < 0 || dayIdx > 4) {
        mount.innerHTML = `<div style="text-align:center; padding:40px; color:#AAA; font-weight:700;">Weekend view is locked.</div>`;
        document.getElementById("status-modal").classList.add("active");
        return;
      }

      const usersInStatus = submissions.filter((sub) => {
        const dayData = (sub.schedule && sub.schedule[dayIdx]) ? sub.schedule[dayIdx] : { status: "Office" };
        const key = normaliseStatus(dayData.status);
        return key === statusType;
      });

      if (usersInStatus.length === 0) {
        mount.innerHTML = `<div style="text-align:center; padding:40px; color:#CCC; font-weight:700;">No staff logged for this status.</div>`;
      } else {
        const detailedUsers = usersInStatus.map((u) => {
          const info = directory.find((d) => safeNameKey(d) === (u.name || "").trim()) || { team: "Staff", role: "Team Member" };
          const dayData = u.schedule?.[dayIdx];
          let timeStr = "";
          if (dayData && (dayData.status === "Shoot" || dayData.status === "Client / Travel") && !dayData.fullDay) {
            if (dayData.start && dayData.end) timeStr = ` (${dayData.start}-${dayData.end})`;
          }
          return { name: u.name, team: info.team, role: info.role, time: timeStr };
        });

        const teams = [...new Set(detailedUsers.map((u) => u.team || "Staff"))].sort();

        mount.innerHTML = teams
          .map(
            (team) => `
            <div class="team-group">
              <span class="team-label">${team}</span>
              ${detailedUsers
                .filter((u) => (u.team || "Staff") === team)
                .sort((a,b) => (a.name || "").localeCompare(b.name || ""))
                .map(
                  (m) => `
                  <div class="staff-line">
                    <span class="staff-name">${m.name || ""}<span class="staff-time">${m.time || ""}</span></span>
                    <span class="staff-role">${m.role || ""}</span>
                  </div>
                `
                )
                .join("")}
            </div>
          `
          )
          .join("");
      }

      document.getElementById("status-modal").classList.add("active");
    };

    window.closeModal = () => document.getElementById("status-modal").classList.remove("active");

    init();
  </script>
</body>
</html>
