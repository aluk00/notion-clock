<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Outlook | DMG Command Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Core Colors - Unified Design System */
            --ink: #0F172A;
            --ink-sub: #64748B;
            --ink-muted: #94A3B8;
            --border: #E2E8F0;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;
            --bg-soft: #F8FAFC;

            /* Primary Brand */
            --dmg-blue: #21A0D8;
            --dmg-blue-light: rgba(33, 160, 216, 0.1);
            --dmg-blue-soft: rgba(33, 160, 216, 0.1);

            /* Pillar Colors */
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #21A0D8;
            --team-executive: #0F172A;

            /* Layout */
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: transparent; padding: 16px; -webkit-font-smoothing: antialiased; }
        
        .outlook-widget { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
        
        .widget-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 20px; height: 20px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; animation: pulse 2.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.6s; }
        .dot:nth-child(3) { animation-delay: 0.9s; }
        .header-title { font-size: 11px; font-weight: 800; color: var(--dmg-blue); text-transform: uppercase; letter-spacing: 0.05em; }
        .header-date { font-size: 11px; font-weight: 600; color: var(--ink-sub); background: var(--bg-soft); padding: 6px 12px; border-radius: 99px; }
        
        .status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 24px; }
        .status-card { background: var(--bg-soft); border-radius: 16px; padding: 20px 16px; text-align: center; cursor: pointer; transition: all 0.25s ease; border: 2px solid transparent; }
        .status-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .status-card.active { border-color: var(--dmg-blue); background: var(--dmg-blue-light); }
        .status-card.locked { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
        .status-count { font-size: 36px; font-weight: 900; line-height: 1; margin-bottom: 6px; color: var(--dmg-blue); }
        .status-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--ink-sub); letter-spacing: 0.05em; }
        
        .detail-panel { border-top: 1px solid var(--border); max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        .detail-panel.open { max-height: 400px; }
        .detail-content { padding: 20px 24px; }
        .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .detail-title { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--dmg-blue); letter-spacing: 0.05em; }
        .detail-close { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-soft); border: none; cursor: pointer; font-size: 16px; color: var(--ink-sub); transition: 0.2s; }
        .detail-close:hover { background: #EEE; color: var(--ink); }
        
        .staff-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
        .staff-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg-soft); border-radius: 12px; transition: 0.2s; }
        .staff-item:hover { background: #F0F0F0; }
        .staff-left { display: flex; align-items: center; gap: 12px; }
        .staff-dots { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 12px; height: 12px; }
        .staff-dots span { width: 100%; height: 100%; border-radius: 50%; }
        .staff-name { font-size: 14px; font-weight: 700; color: var(--ink); }
        .staff-team { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-sub); }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.3; }
        .empty-text { font-size: 13px; font-weight: 600; }
        
        .loading { display: flex; align-items: center; justify-content: center; padding: 60px; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .weekend-banner { background: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%); padding: 16px 24px; text-align: center; }
        .weekend-text { font-size: 12px; font-weight: 700; color: var(--ink-sub); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'dmg-command-centre-native';
        
        // Helpers
        const normalize = (n) => n?.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase() || "";
        const teamColors = { Editorial: '#E94B4B', Creative: '#E6468B', Production: '#43B049', Social: '#F2C316', Operations: '#21a0d8', Executive: '#1C1C1C' };
        
        const getWeekInfo = () => {
            const today = new Date();
            const day = today.getDay();
            const monday = new Date(today);
            monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1));
            monday.setHours(0, 0, 0, 0);
            return {
                weekId: monday.toISOString().split('T')[0],
                dayIndex: day === 0 ? 6 : day - 1,
                isWeekend: day === 0 || day === 6,
                dateString: today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })
            };
        };
        
        // Components
        function StatusCard({ type, count, label, isLocked, isActive, onClick }) {
            return (
                <div 
                    className={`status-card ${isLocked ? 'locked' : ''} ${isActive ? 'active' : ''}`}
                    onClick={isLocked ? null : onClick}
                >
                    <div className={`status-count ${type}`}>{count}</div>
                    <div className="status-label">{label}</div>
                </div>
            );
        }
        
        function StaffItem({ name, team }) {
            const color = teamColors[team] || '#999';
            return (
                <div className="staff-item">
                    <div className="staff-left">
                        <div className="staff-dots">
                            {[...Array(4)].map((_, i) => <span key={i} style={{ background: color }} />)}
                        </div>
                        <span className="staff-name">{name}</span>
                    </div>
                    <span className="staff-team" style={{ color }}>{team || 'Staff'}</span>
                </div>
            );
        }
        
        function DetailPanel({ isOpen, title, staff, onClose }) {
            return (
                <div className={`detail-panel ${isOpen ? 'open' : ''}`}>
                    <div className="detail-content">
                        <div className="detail-header">
                            <span className="detail-title">{title} ({staff.length})</span>
                            <button className="detail-close" onClick={onClose}>×</button>
                        </div>
                        <div className="staff-list">
                            {staff.length > 0 ? (
                                staff.map((s, i) => <StaffItem key={i} name={s.name} team={s.team} />)
                            ) : (
                                <div className="empty-state">
                                    <div className="empty-text">No staff with this status today</div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        
        function OfficeOutlook() {
            const [loading, setLoading] = useState(true);
            const [submissions, setSubmissions] = useState([]);
            const [directory, setDirectory] = useState([]);
            const [activeStatus, setActiveStatus] = useState(null);
            
            const { weekId, dayIndex, isWeekend, dateString } = useMemo(() => getWeekInfo(), []);
            
            useEffect(() => {
                auth.signInAnonymously();
                const unsubAuth = auth.onAuthStateChanged((user) => {
                    if (user) {
                        const basePath = `artifacts/${appId}/public/data`;
                        
                        db.collection(`${basePath}/rota_submissions`).onSnapshot(snap => {
                            const list = [];
                            snap.forEach(doc => list.push(doc.data()));
                            setSubmissions(list);
                            setLoading(false);
                        });
                        
                        db.collection(`${basePath}/staff_directory`).onSnapshot(snap => {
                            const list = [];
                            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                            setDirectory(list);
                        });
                    }
                });
                return () => unsubAuth();
            }, []);
            
            // Get current week submissions (deduplicated by name)
            const currentWeekData = useMemo(() => {
                const map = new Map();
                submissions
                    .filter(s => s.weekId === weekId)
                    .sort((a, b) => new Date(a.submittedAt || 0) - new Date(b.submittedAt || 0))
                    .forEach(sub => {
                        if (sub.name) map.set(normalize(sub.name), sub);
                    });
                return Array.from(map.values());
            }, [submissions, weekId]);
            
            // Calculate counts
            const counts = useMemo(() => {
                const result = { office: 0, wfh: 0, shoot: 0, leave: 0 };
                
                currentWeekData.forEach(sub => {
                    const day = sub.schedule?.[dayIndex];
                    if (!day) return;
                    const status = day.status;
                    
                    if (isWeekend) {
                        if (['Shoot', 'Client / Travel'].includes(status)) result.shoot++;
                        return;
                    }
                    
                    if (status === 'Office') result.office++;
                    else if (status === 'WFH') result.wfh++;
                    else if (['Shoot', 'Client / Travel'].includes(status)) result.shoot++;
                    else if (['PTO', 'Leave', 'Abroad'].includes(status)) result.leave++;
                    else result.office++; // Default
                });
                
                return result;
            }, [currentWeekData, dayIndex, isWeekend]);
            
            // Get staff list for active status
            const activeStaff = useMemo(() => {
                if (!activeStatus) return [];
                
                return currentWeekData
                    .filter(sub => {
                        const status = sub.schedule?.[dayIndex]?.status;
                        if (activeStatus === 'office') return !isWeekend && status === 'Office';
                        if (activeStatus === 'wfh') return !isWeekend && status === 'WFH';
                        if (activeStatus === 'shoot') return ['Shoot', 'Client / Travel'].includes(status);
                        if (activeStatus === 'leave') return !isWeekend && ['PTO', 'Leave', 'Abroad'].includes(status);
                        return false;
                    })
                    .map(sub => {
                        const dir = directory.find(d => normalize(`${d.firstName} ${d.lastName}`) === normalize(sub.name)) || {};
                        return { name: sub.name, team: dir.team };
                    })
                    .sort((a, b) => a.name.localeCompare(b.name));
            }, [activeStatus, currentWeekData, directory, dayIndex, isWeekend]);
            
            const handleCardClick = (status) => {
                setActiveStatus(activeStatus === status ? null : status);
            };
            
            const statusLabels = {
                office: 'In Building',
                wfh: 'Remote',
                shoot: 'Off-Site',
                leave: 'On Leave'
            };
            
            if (loading) {
                return (
                    <div className="outlook-widget">
                        <div className="loading"><div className="spinner"></div></div>
                    </div>
                );
            }
            
            return (
                <div className="outlook-widget">
                    <div className="widget-header">
                        <div className="header-left">
                            <div className="dots-grid">
                                <div className="dot"></div><div className="dot"></div>
                                <div className="dot"></div><div className="dot"></div>
                            </div>
                            <span className="header-title">Office Outlook</span>
                        </div>
                        <span className="header-date">{dateString}</span>
                    </div>
                    
                    {isWeekend && (
                        <div className="weekend-banner">
                            <span className="weekend-text">🌴 Weekend Mode — Only shoot/travel staff shown</span>
                        </div>
                    )}
                    
                    <div className="status-grid">
                        <StatusCard 
                            type="office" 
                            count={isWeekend ? '—' : counts.office} 
                            label="In Building" 
                            isLocked={isWeekend}
                            isActive={activeStatus === 'office'}
                            onClick={() => handleCardClick('office')}
                        />
                        <StatusCard 
                            type="wfh" 
                            count={isWeekend ? '—' : counts.wfh} 
                            label="Remote" 
                            isLocked={isWeekend}
                            isActive={activeStatus === 'wfh'}
                            onClick={() => handleCardClick('wfh')}
                        />
                        <StatusCard 
                            type="shoot" 
                            count={counts.shoot} 
                            label="Off-Site" 
                            isLocked={false}
                            isActive={activeStatus === 'shoot'}
                            onClick={() => handleCardClick('shoot')}
                        />
                        <StatusCard 
                            type="leave" 
                            count={isWeekend ? '—' : counts.leave} 
                            label="On Leave" 
                            isLocked={isWeekend}
                            isActive={activeStatus === 'leave'}
                            onClick={() => handleCardClick('leave')}
                        />
                    </div>
                    
                    <DetailPanel 
                        isOpen={activeStatus !== null}
                        title={statusLabels[activeStatus] || ''}
                        staff={activeStaff}
                        onClose={() => setActiveStatus(null)}
                    />
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OfficeOutlook />);
    </script>
</body>
</html>
