<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Snapshot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
        :root {
            /* Palette from Kanban/Command Centre */
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --ink-muted: #9CA3AF;
            --border: #EAECEF;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            
            /* Domain Colors */
            --dmg-blue: #21A0D8;
            --creative: #E6468B;
            --production: #43B049;
            --editorial: #E94B4B;
            --social: #F2C316;
            --amber: #F59E0B;
            --purple: #8B5CF6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--surface); /* Notion usually blends better with white or transparent */
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden; /* Prevent scrollbars due to scaling width comp */
        }

        /* SCALING WRAPPER FOR NOTION (30% Smaller) */
        #scale-wrapper {
            transform: scale(0.7);
            transform-origin: top left;
            /* Compensate for the shrink to fill width */
            width: 142.85%; 
            height: 142.85%;
            padding: 20px;
        }

        /* 2x2 Dot Grid Animation */
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }
        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 20px; }

        /* Typography Utilities */
        .label-xs {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ink-sub);
        }

        /* Card Styles matching Reference */
        .bento-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        
        .item-card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            position: relative;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .item-card:hover {
            border-color: #D1D5DB;
            transform: translateY(-1px);
        }
        
        /* Left border strip for items */
        .item-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 6px 0 0 6px;
            background: var(--border); /* Default */
        }
        
        /* Dynamic Border Colors classes */
        .border-l-creative::before { background: var(--creative); }
        .border-l-production::before { background: var(--production); }
        .border-l-editorial::before { background: var(--editorial); }
        .border-l-social::before { background: var(--social); }
        .border-l-blue::before { background: var(--dmg-blue); }
        .border-l-amber::before { background: var(--amber); }

        /* Text colors for stats */
        .text-creative { color: var(--creative); }
        .text-production { color: var(--production); }
        .text-blue { color: var(--dmg-blue); }
        .text-amber { color: var(--amber); }
    </style>
</head>
<body>
    
    <div id="scale-wrapper">
        <div id="root">
            <div class="flex flex-col items-center justify-center h-[400px] gap-4">
                <div class="dot-grid" style="transform: scale(1.5);">
                    <span></span><span></span><span></span><span></span>
                </div>
                <p class="label-xs text-slate-400">Loading snapshot...</p>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const COLLECTION_PATH = "artifacts/dmg-command-centre-native/public/data/creative_updates";

    // Re-mapped to new color variables
    const highlightOrder = ['pending', 'live', 'completed', 'media', 'partnerships', 'internal', 'coming_up'];

    const getSectionMeta = (sectionId) => {
        const map = {
            pending: { color: 'var(--amber)', label: 'In Progress', border: 'border-l-amber' },
            live: { color: 'var(--production)', label: 'Live', border: 'border-l-production' },
            completed: { color: 'var(--dmg-blue)', label: 'Completed', border: 'border-l-blue' },
            media: { color: 'var(--purple)', label: 'Media', border: 'border-l-editorial' },
            partnerships: { color: 'var(--editorial)', label: 'Partnerships', border: 'border-l-editorial' },
            internal: { color: 'var(--ink-sub)', label: 'Internal', border: '' },
            coming_up: { color: 'var(--social)', label: 'Coming Up', border: 'border-l-social' }
        };
        return map[sectionId] || { color: 'var(--ink)', label: 'Update', border: '' };
    };

    const formatDate = (date) => date.toLocaleDateString('en-GB', {
        weekday: 'short',
        day: 'numeric',
        month: 'short'
    });

    const formatTime = (iso) => {
        if (!iso) return '—';
        const parsed = new Date(iso);
        if (Number.isNaN(parsed.getTime())) return '—';
        return parsed.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    };

    const countItems = (sections) => sections.reduce((total, section) => total + section.items.length, 0);

    const escapeHtml = (text) => {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    };

    async function loadData() {
        try {
            await signInAnonymously(auth);
            const today = new Date().toISOString().split('T')[0];
            const todayQuery = query(collection(db, COLLECTION_PATH), where('date', '==', today));
            const todaySnapshot = await getDocs(todayQuery);

            let rundown = null;
            let isFallback = false;

            if (!todaySnapshot.empty) {
                const docSnap = todaySnapshot.docs[0];
                rundown = { ...docSnap.data(), id: docSnap.id };
            } else {
                const fallbackQuery = query(collection(db, COLLECTION_PATH), orderBy('date', 'desc'), limit(1));
                const fallbackSnapshot = await getDocs(fallbackQuery);
                if (!fallbackSnapshot.empty) {
                    const docSnap = fallbackSnapshot.docs[0];
                    rundown = { ...docSnap.data(), id: docSnap.id };
                    isFallback = true;
                }
            }

            render(rundown, isFallback);
        } catch (error) {
            console.error('Failed to load updates', error);
            renderError();
        }
    }

    function renderError() {
        document.getElementById('root').innerHTML = `
             <div class="flex flex-col items-center justify-center h-[300px] gap-2">
                <span class="label-xs text-editorial">Unable to load updates</span>
            </div>
        `;
    }

    function renderEmpty() {
        document.getElementById('root').innerHTML = `
            ${renderHeader(null)}
            <div class="mt-8 flex flex-col items-center justify-center h-[200px] border border-dashed border-slate-200 rounded-xl">
                <span class="label-xs text-slate-400">No updates posted yet</span>
            </div>
        `;
    }

    // New Header matching the Kanban style
    function renderHeader(rundown) {
        return `
            <header class="flex items-center justify-between pb-4 border-b border-[var(--border)] mb-6">
                <div class="flex items-center gap-3">
                    <div class="dot-grid">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <h1 class="label-xs text-[var(--ink)]">Daily Snapshot</h1>
                </div>
                
                <div class="flex items-center gap-6">
                    <div class="flex flex-col items-end">
                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Date</span>
                        <span class="text-[11px] font-bold text-[var(--ink)]">${formatDate(new Date())}</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Session</span>
                        <span class="text-[11px] font-bold text-[var(--ink)]">${escapeHtml(rundown?.session) || 'Latest'}</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Updated</span>
                        <span class="text-[11px] font-bold text-[var(--ink)]">${formatTime(rundown?.lastModified)}</span>
                    </div>
                </div>
            </header>
        `;
    }

    function render(rundown, isFallback) {
        if (!rundown) {
            renderEmpty();
            return;
        }

        const sections = [...rundown.sections]
            .sort((a, b) => highlightOrder.indexOf(a.id) - highlightOrder.indexOf(b.id))
            .filter(section => section.items.length > 0);

        const total = countItems(rundown.sections);
        const live = rundown.sections.find(s => s.id === 'live')?.items.length ?? 0;
        const pending = rundown.sections.find(s => s.id === 'pending')?.items.length ?? 0;
        const completed = rundown.sections.find(s => s.id === 'completed')?.items.length ?? 0;

        const focusSectionIds = new Set(['pending', 'live', 'coming_up']);
        const focusItems = rundown.sections
            .filter(section => focusSectionIds.has(section.id))
            .flatMap(section => section.items.map(item => ({ ...item, sectionId: section.id })))
            .slice(0, 5); // Limit to 5 for space

        const fallbackBanner = isFallback ? `
            <div class="mb-4 rounded-md bg-amber-50 border border-amber-100 px-3 py-2 text-[10px] font-medium text-amber-700 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                Showing update from previous date: ${escapeHtml(rundown.date)}
            </div>
        ` : '';

        document.getElementById('root').innerHTML = `
            ${renderHeader(rundown)}
            ${fallbackBanner}
            
            <main class="grid grid-cols-1 gap-5 lg:grid-cols-12 h-full">
                
                <div class="lg:col-span-4 flex flex-col gap-5">
                    
                    <div class="bento-card p-5">
                        <p class="label-xs mb-4">At a glance</p>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-[var(--surface-alt)] rounded-lg p-3 border border-[var(--border)]">
                                <p class="text-2xl font-black text-[var(--ink)]">${total}</p>
                                <p class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Total</p>
                            </div>
                            <div class="bg-[var(--surface-alt)] rounded-lg p-3 border border-[var(--border)]">
                                <p class="text-2xl font-black text-production">${live}</p>
                                <p class="text-[9px] font-bold uppercase text-production tracking-wider opacity-70">Live</p>
                            </div>
                            <div class="bg-[var(--surface-alt)] rounded-lg p-3 border border-[var(--border)]">
                                <p class="text-2xl font-black text-amber">${pending}</p>
                                <p class="text-[9px] font-bold uppercase text-amber tracking-wider opacity-70">Pending</p>
                            </div>
                            <div class="bg-[var(--surface-alt)] rounded-lg p-3 border border-[var(--border)]">
                                <p class="text-2xl font-black text-blue">${completed}</p>
                                <p class="text-[9px] font-bold uppercase text-blue tracking-wider opacity-70">Done</p>
                            </div>
                        </div>
                    </div>

                    <div class="bento-card p-5 flex-1">
                        <p class="label-xs mb-4">Key Focus</p>
                        <div class="space-y-2">
                            ${focusItems.length === 0 ? `
                                <p class="text-xs text-slate-400 italic">No priority items.</p>
                            ` : focusItems.map(item => {
                                const meta = getSectionMeta(item.sectionId);
                                return `
                                <div class="item-card p-3 ${meta.border} bg-white">
                                    <div class="flex items-start justify-between gap-2">
                                        <p class="text-[11px] font-semibold text-[var(--ink)] leading-snug line-clamp-2">${escapeHtml(item.projectName)}</p>
                                    </div>
                                    <div class="mt-2 flex items-center justify-between">
                                        <span class="text-[8px] font-bold uppercase tracking-wider text-slate-400">${meta.label}</span>
                                        ${item.statusNote ? `<span class="text-[9px] text-slate-500 truncate max-w-[100px]">${escapeHtml(item.statusNote)}</span>` : ''}
                                    </div>
                                </div>
                            `}).join('')}
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-8 flex flex-col gap-5">
                     ${sections.map(section => {
                        const meta = getSectionMeta(section.id);
                        return `
                        <div class="bento-card p-5">
                            <div class="flex items-center justify-between mb-4 border-b border-[var(--surface-alt)] pb-2">
                                <div class="flex items-center gap-2">
                                    <span class="w-2 h-2 rounded-full" style="background-color: ${meta.color}"></span>
                                    <h2 class="label-xs text-[var(--ink)]">${escapeHtml(section.title)}</h2>
                                </div>
                                <span class="text-[9px] font-bold text-slate-400 bg-[var(--surface-alt)] px-2 py-1 rounded-md">${section.items.length}</span>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                ${section.items.map(item => `
                                    <div class="item-card p-3 bg-white border border-[var(--border)]">
                                        <div class="flex flex-wrap items-start justify-between gap-2 mb-1">
                                            <p class="text-[11px] font-semibold text-[var(--ink)]">${escapeHtml(item.projectName)}</p>
                                            ${item.link ? `
                                                <a href="${escapeHtml(item.link)}" target="_blank" class="text-[9px] font-bold text-blue hover:underline uppercase tracking-wider">
                                                    Link
                                                </a>
                                            ` : ''}
                                        </div>
                                        
                                        ${item.statusNote ? `<p class="text-[10px] text-slate-500 mb-2">${escapeHtml(item.statusNote)}</p>` : ''}
                                        
                                        ${item.bullets && item.bullets.length > 0 ? `
                                            <ul class="space-y-1 mt-2 border-t border-dashed border-slate-100 pt-2">
                                                ${item.bullets.map(bullet => `
                                                    <li class="flex items-start gap-1.5">
                                                        <span class="mt-1 h-1 w-1 rounded-full bg-slate-300 flex-shrink-0"></span>
                                                        <span class="text-[10px] text-slate-600 leading-tight">${escapeHtml(bullet.text)}</span>
                                                    </li>
                                                `).join('')}
                                            </ul>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `}).join('')}
                </div>

            </main>
        `;
    }

    loadData();
</script>
</body>
</html>
