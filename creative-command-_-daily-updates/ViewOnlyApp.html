<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Daily Snapshot | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0F172A;
            --ink-sub: #64748B;
            --ink-muted: #94A3B8;
            --border: #E2E8F0;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;
            --hero-blue: #21A0D8;
            --creative-pink: #E6468B;
            --production-green: #43B049;
            --social-yellow: #F59E0B;
            --editorial-red: #EF4444;

            /* Section tones */
            --sky: #0EA5E9;
            --sky-soft: rgba(14, 165, 233, 0.1);
            --amber: #F59E0B;
            --amber-soft: rgba(245, 158, 11, 0.1);
            --emerald: #10B981;
            --emerald-soft: rgba(16, 185, 129, 0.1);
            --purple: #8B5CF6;
            --purple-soft: rgba(139, 92, 246, 0.1);
            --rose: #F43F5E;
            --rose-soft: rgba(244, 63, 94, 0.1);
            --gray: #6B7280;
            --gray-soft: rgba(107, 114, 128, 0.1);
            --indigo: #6366F1;
            --indigo-soft: rgba(99, 102, 241, 0.1);

            /* Status tags */
            --green: #10B981;
            --green-soft: rgba(16, 185, 129, 0.1);
            --yellow: #F59E0B;
            --yellow-soft: rgba(245, 158, 11, 0.1);
            --red: #EF4444;
            --red-soft: rgba(239, 68, 68, 0.1);
            --blue: #3B82F6;
            --blue-soft: rgba(59, 130, 246, 0.1);

            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #FFFFFF;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 16px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }

        .widget-main {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dot-grid span { width: 6px; height: 6px; border-radius: 50%; background: var(--hero-blue); }
        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .header-brand h1 {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--creative-pink);
            margin: 0;
            text-transform: uppercase;
        }
        .header-brand p {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
            margin-top: 2px;
        }
        .header-brand span {
            font-size: 11px;
            color: var(--ink-muted);
        }

        .header-meta { display: flex; gap: 8px; align-items: center; }

        .meta-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 20px;
            background: var(--surface-alt);
            color: var(--ink-sub);
            border: 1px solid var(--border);
        }

        .slack-btn {
            font-size: 11px;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 20px;
            background: var(--creative-pink);
            color: white;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .slack-btn:hover { background: #d63d7d; }

        /* Loading & Error */
        .loading-screen, .error-state, .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            gap: 12px;
            padding: 40px;
            text-align: center;
        }
        .loading-text, .error-text, .empty-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .error-text { color: var(--editorial-red); }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 16px;
            padding: 16px 24px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .stat-item {
            padding: 8px 16px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .stat-num { font-size: 20px; font-weight: 800; }
        .stat-label { font-size: 10px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; }

        /* Main Grid */
        .main-content { display: flex; gap: 0; }

        .sidebar {
            width: 280px;
            border-right: 1px solid var(--border);
            padding: 20px;
            background: var(--surface-alt);
            flex-shrink: 0;
        }
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }
        .sidebar-list { display: flex; flex-direction: column; gap: 6px; }
        .sidebar-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--ink-sub);
        }
        .sidebar-item-count { font-weight: 700; color: var(--ink); }

        .focus-card {
            padding: 12px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .focus-card-title { font-size: 12px; font-weight: 600; color: var(--ink); }
        .focus-card-section { font-size: 10px; color: var(--ink-muted); margin-top: 4px; }
        .focus-card .status-tag {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 6px;
        }

        .sections-grid {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            align-content: start;
        }
        @media (max-width: 1000px) { .sections-grid { grid-template-columns: 1fr; } }

        /* Section Cards */
        .section-card {
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            background: var(--surface);
        }
        .section-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .section-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ink);
        }
        .section-count {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-sub);
        }
        .section-items { padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }

        /* Section Tones */
        .section-card.sky .section-header { background: var(--sky-soft); }
        .section-card.amber .section-header { background: var(--amber-soft); }
        .section-card.emerald .section-header { background: var(--emerald-soft); }
        .section-card.purple .section-header { background: var(--purple-soft); }
        .section-card.rose .section-header { background: var(--rose-soft); }
        .section-card.gray .section-header { background: var(--gray-soft); }
        .section-card.indigo .section-header { background: var(--indigo-soft); }

        /* Item Cards */
        .item-card {
            padding: 12px;
            background: var(--surface-alt);
            border-radius: var(--radius);
            transition: var(--transition);
            cursor: pointer;
        }
        .item-card:hover { background: #F1F5F9; }
        .item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .item-headline { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; }
        .item-client { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
        .item-details { font-size: 11px; color: var(--ink-sub); margin-top: 8px; line-height: 1.5; white-space: pre-line; }
        .item-footer { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .item-link {
            font-size: 10px;
            font-weight: 600;
            color: var(--hero-blue);
            text-decoration: none;
        }
        .item-link:hover { text-decoration: underline; }

        .status-tag {
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }
        .status-tag.green { background: var(--green-soft); color: var(--green); }
        .status-tag.yellow { background: var(--yellow-soft); color: var(--yellow); }
        .status-tag.red { background: var(--red-soft); color: var(--red); }
        .status-tag.info { background: var(--blue-soft); color: var(--blue); }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            font-weight: 700;
            color: var(--production-green);
            text-transform: uppercase;
        }
        .live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--production-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        /* Slack Panel */
        .slack-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 480px;
            max-width: 100%;
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: -10px 0 40px rgba(0,0,0,0.1);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .slack-panel.open { transform: translateX(0); }

        .slack-panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .slack-panel-title { font-size: 16px; font-weight: 800; color: var(--ink); }
        .slack-panel-subtitle { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
        .slack-panel-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--surface-alt);
            color: var(--ink-sub);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slack-panel-close:hover { background: var(--border); }

        .slack-panel-actions {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-alt);
        }
        .copy-btn {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius);
            border: none;
            background: var(--creative-pink);
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .copy-btn:hover { background: #d63d7d; }
        .copy-btn.copied { background: var(--production-green); }

        .slack-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .slack-preview {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--ink-sub);
            white-space: pre-wrap;
            background: var(--surface-alt);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
        }

        .slack-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 999;
        }
        .slack-backdrop.open { opacity: 1; visibility: visible; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--production-green); }
    </style>
</head>
<body>
    <div id="root">
        <div class="widget-main">
            <div class="loading-screen">
                <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                <span class="loading-text">Loading daily snapshot from Notion...</span>
            </div>
        </div>
    </div>

    <!-- Slack Panel -->
    <div class="slack-backdrop" id="slackBackdrop"></div>
    <div class="slack-panel" id="slackPanel">
        <div class="slack-panel-header">
            <div>
                <div class="slack-panel-title">Slack Message</div>
                <div class="slack-panel-subtitle">Ready to copy and send</div>
            </div>
            <button class="slack-panel-close" id="slackClose">&times;</button>
        </div>
        <div class="slack-panel-actions">
            <button class="copy-btn" id="copyBtn">Copy to Clipboard</button>
        </div>
        <div class="slack-panel-content">
            <pre class="slack-preview" id="slackPreview"></pre>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

<script type="module">
    // ═══════════════════════════════════════════════════════════════════════════
    // CONFIGURATION
    // ═══════════════════════════════════════════════════════════════════════════
    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

    // ═══════════════════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════════════════
    let rundownData = null;

    // ═══════════════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════════════
    const formatDate = (date) => date.toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
    });

    const formatTime = (iso) => {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    };

    const escapeHtml = (text) => {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    };

    const showToast = (message, type = '') => {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast show ${type}`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    };

    const parseLinks = (linksText) => {
        if (!linksText) return [];
        const urlRegex = /https?:\/\/[^\s<]+/g;
        const matches = linksText.match(urlRegex);
        return matches ? matches.map((url, i) => ({ label: `Link ${i + 1}`, url })) : [];
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // SLACK MESSAGE GENERATION
    // ═══════════════════════════════════════════════════════════════════════════
    function generateSlackMessage(data) {
        if (!data || !data.sections) return '';

        const dateStr = new Date(data.date).toLocaleDateString('en-GB', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        let message = `*Creative Command — Daily Snapshot*\n${dateStr}\n\n`;

        data.sections.forEach(section => {
            if (section.items.length === 0) return;

            message += `*${section.title}*\n`;

            section.items.forEach(item => {
                const headline = item.headline || item.projectName || item.record || 'Untitled';
                const tag = item.statusTag ? ` [${item.statusTag}]` : '';
                message += `• ${headline}${tag}\n`;

                if (item.details) {
                    const detailLines = item.details.split('\n').filter(l => l.trim());
                    detailLines.forEach(line => {
                        message += `    ${line.trim()}\n`;
                    });
                }
            });

            message += '\n';
        });

        return message.trim();
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // DATA LOADING
    // ═══════════════════════════════════════════════════════════════════════════
    async function loadData() {
        try {
            const response = await fetch(`${API_URL}/daily-rundown`);

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error || 'Failed to fetch rundown');
            }

            if (data.totalItems === 0) {
                renderEmpty();
                return;
            }

            rundownData = data;
            render();
        } catch (error) {
            console.error('Failed to load data:', error);
            renderError(error.message);
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // RENDER FUNCTIONS
    // ═══════════════════════════════════════════════════════════════════════════
    function render() {
        const { sections, totalItems, date, lastFetched } = rundownData;

        // Filter to non-empty sections
        const activeSections = sections.filter(s => s.items.length > 0);

        // Compute totals from sections (API doesn't provide pre-computed totals)
        const allItems = sections.flatMap(s => s.items);
        const totals = {
            total: totalItems || allItems.length,
            byStatusTag: allItems.reduce((acc, item) => {
                const tag = item.statusTag || 'None';
                acc[tag] = (acc[tag] || 0) + 1;
                return acc;
            }, {})
        };

        // Get focus items (Yellow/Red status tags)
        const focusItems = sections
            .flatMap(s => s.items.map(item => ({ ...item, sectionTitle: s.title })))
            .filter(item => item.statusTag === 'Red' || item.statusTag === 'Yellow')
            .slice(0, 5);

        document.getElementById('root').innerHTML = `
            <div class="widget-main">
                ${renderStatsBar(totals, lastFetched)}
                <div class="main-content">
                    ${renderSidebar(activeSections, focusItems)}
                    <div class="sections-grid">
                        ${activeSections.map(s => renderSection(s)).join('')}
                    </div>
                </div>
            </div>
        `;

        // Update Slack preview
        document.getElementById('slackPreview').textContent = generateSlackMessage(rundownData);

        attachEventListeners();
    }

    function renderStatsBar(totals, lastFetched) {
        const { total, byStatusTag } = totals;
        const green = byStatusTag?.Green || 0;
        const yellow = byStatusTag?.Yellow || 0;
        const red = byStatusTag?.Red || 0;

        return `
            <div class="stats-bar" style="justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 16px;">
                    <div class="stat-item">
                        <div class="stat-num" style="color: var(--ink);">${total}</div>
                        <div class="stat-label">Total Items</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" style="color: var(--green);">${green}</div>
                        <div class="stat-label">On Track</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" style="color: var(--yellow);">${yellow}</div>
                        <div class="stat-label">Attention</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" style="color: var(--red);">${red}</div>
                        <div class="stat-label">Blocked</div>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span class="meta-badge">${formatDate(new Date())}</span>
                    ${lastFetched ? `<span class="meta-badge">Updated ${formatTime(lastFetched)}</span>` : ''}
                    <button class="slack-btn" id="openSlack">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        Slack
                    </button>
                </div>
            </div>
        `;
    }

    function renderSidebar(sections, focusItems) {
        return `
            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">Sections</div>
                    <div class="sidebar-list">
                        ${sections.map(s => `
                            <div class="sidebar-item">
                                <span>${escapeHtml(s.title)}</span>
                                <span class="sidebar-item-count">${s.items.length}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${focusItems.length > 0 ? `
                    <div class="sidebar-section">
                        <div class="sidebar-title">Needs Attention</div>
                        ${focusItems.map(item => `
                            <div class="focus-card">
                                <div class="focus-card-title">${escapeHtml(item.headline || item.projectName || item.record || 'Untitled')}</div>
                                <div class="focus-card-section">${escapeHtml(item.sectionTitle)}</div>
                                ${item.statusTag ? `<span class="status-tag ${item.statusTag.toLowerCase()}">${item.statusTag}</span>` : ''}
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
            </div>
        `;
    }

    function renderSection(section) {
        return `
            <div class="section-card ${section.tone}">
                <div class="section-header">
                    <span class="section-title">${escapeHtml(section.title)}</span>
                    <span class="section-count">${section.items.length} items</span>
                </div>
                <div class="section-items">
                    ${section.items.map(item => renderItem(item)).join('')}
                </div>
            </div>
        `;
    }

    function renderItem(item) {
        const headline = item.headline || item.projectName || item.record || 'Untitled';
        const links = parseLinks(item.links);

        return `
            <div class="item-card" ${item.url ? `onclick="window.open('${escapeHtml(item.url)}', '_blank')"` : ''}>
                <div class="item-header">
                    <div>
                        <div class="item-headline">${escapeHtml(headline)}</div>
                        ${item.clientPartner ? `<div class="item-client">${escapeHtml(item.clientPartner)}</div>` : ''}
                    </div>
                    ${item.statusTag ? `<span class="status-tag ${item.statusTag.toLowerCase()}">${item.statusTag}</span>` : ''}
                </div>
                ${item.details ? `<div class="item-details">${escapeHtml(item.details)}</div>` : ''}
                <div class="item-footer">
                    ${item.liveLink ? `<span class="live-badge">Live</span>` : ''}
                    ${links.map((l, i) => `<a href="${escapeHtml(l.url)}" target="_blank" rel="noreferrer" class="item-link" onclick="event.stopPropagation()">Link ${i + 1}</a>`).join('')}
                    ${item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer" class="item-link" onclick="event.stopPropagation()">Notion</a>` : ''}
                </div>
            </div>
        `;
    }

    function renderEmpty() {
        document.getElementById('root').innerHTML = `
            <div class="widget-main">
                <div class="empty-state">
                    <div style="font-size: 48px; opacity: 0.3;">📋</div>
                    <span class="empty-text">No items for today</span>
                    <p style="font-size: 12px; color: var(--ink-sub); max-width: 300px;">
                        Add items to Commercial Snapshot in Notion with today's Snapshot Date to see them here.
                    </p>
                </div>
            </div>
        `;
    }

    function renderError(message) {
        document.getElementById('root').innerHTML = `
            <div class="widget-main">
                <div class="error-state">
                    <div style="font-size: 48px; opacity: 0.3;">⚠️</div>
                    <span class="error-text">Unable to load snapshot</span>
                    <p style="font-size: 12px; color: var(--ink-sub);">${escapeHtml(message)}</p>
                    <button onclick="location.reload()" style="margin-top: 16px; padding: 10px 20px; background: var(--hero-blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                        Retry
                    </button>
                </div>
            </div>
        `;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // EVENT LISTENERS
    // ═══════════════════════════════════════════════════════════════════════════
    function attachEventListeners() {
        // Open Slack panel
        document.getElementById('openSlack')?.addEventListener('click', () => {
            document.getElementById('slackPanel').classList.add('open');
            document.getElementById('slackBackdrop').classList.add('open');
        });
    }

    // Slack panel listeners (always present)
    document.getElementById('slackClose')?.addEventListener('click', closeSlackPanel);
    document.getElementById('slackBackdrop')?.addEventListener('click', closeSlackPanel);

    document.getElementById('copyBtn')?.addEventListener('click', async () => {
        const btn = document.getElementById('copyBtn');
        const text = document.getElementById('slackPreview').textContent;

        try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            showToast('Copied to clipboard', 'success');
            setTimeout(() => {
                btn.textContent = 'Copy to Clipboard';
                btn.classList.remove('copied');
            }, 2000);
        } catch (err) {
            showToast('Failed to copy', '');
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeSlackPanel();
        }
    });

    function closeSlackPanel() {
        document.getElementById('slackPanel').classList.remove('open');
        document.getElementById('slackBackdrop').classList.remove('open');
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // INITIALIZE
    // ═══════════════════════════════════════════════════════════════════════════
    loadData();
</script>
</body>
</html>
