<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Snapshot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --ink-muted: #9CA3AF;
            --border: #E5E7EB;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --dmg-blue: #21A0D8;
            --amber: #F59E0B;
            --emerald: #10B981;
            --sky: #0EA5E9;
            --purple: #8B5CF6;
            --rose: #F43F5E;
            --indigo: #6366F1;
            --white: #FFFFFF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 20px;
        }

        /* SCROLLBARS - Match other widgets */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }

        /* WIDGET MAIN CONTAINER - Match other widgets */
        .widget-main {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: none;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Loading */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            gap: 10px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }
        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .loading-text {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Main Container */
        .container {
            padding: 16px 20px;
        }

        /* Header - Match commercial-hub-react style */
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--white);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-brand {
            display: flex;
            flex-direction: column;
        }
        .header-label {
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            color: var(--ink);
            margin: 0;
        }
        .header-sublabel {
            font-size: 10px;
            font-weight: 600;
            color: var(--dmg-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }
        .header-meta {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .meta-item {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-muted);
        }
        .meta-item strong {
            color: var(--ink);
            font-weight: 700;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .stat-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
        }
        .stat-badge .num {
            font-size: 14px;
            font-weight: 800;
        }
        .stat-total { background: var(--surface-alt); color: var(--ink); }
        .stat-live { background: rgba(16, 185, 129, 0.1); color: var(--emerald); }
        .stat-pending { background: rgba(245, 158, 11, 0.1); color: var(--amber); }
        .stat-completed { background: rgba(14, 165, 233, 0.1); color: var(--sky); }

        /* Focus Row */
        .focus-row {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .focus-row::-webkit-scrollbar { height: 4px; }
        .focus-row::-webkit-scrollbar-track { background: transparent; }
        .focus-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .focus-chip {
            flex-shrink: 0;
            padding: 6px 10px;
            border-radius: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .focus-chip:hover {
            border-color: #D1D5DB;
            background: var(--surface-alt);
        }
        .focus-chip .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .focus-chip .name {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .focus-chip .tag {
            font-size: 8px;
            font-weight: 600;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* Section Label */
        .section-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        /* Sections Grid */
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }
        @media (min-width: 800px) {
            .sections-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Section Card */
        .section-card {
            background: var(--surface-alt);
            border-radius: 8px;
            padding: 10px;
            min-height: 80px;
        }
        .section-card.pending { background: rgba(245, 158, 11, 0.08); }
        .section-card.live { background: rgba(16, 185, 129, 0.08); }
        .section-card.completed { background: rgba(14, 165, 233, 0.08); }
        .section-card.media { background: rgba(139, 92, 246, 0.08); }
        .section-card.partnerships { background: rgba(244, 63, 94, 0.08); }
        .section-card.internal { background: var(--surface-alt); }
        .section-card.coming_up { background: rgba(99, 102, 241, 0.08); }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .section-title {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--ink);
        }
        .section-count {
            font-size: 8px;
            font-weight: 700;
            color: var(--ink-muted);
            background: var(--surface);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Item */
        .item {
            background: var(--surface);
            border-radius: 5px;
            padding: 6px 8px;
            margin-bottom: 4px;
        }
        .item:last-child { margin-bottom: 0; }
        .item-name {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .item-note {
            font-size: 9px;
            color: var(--ink-muted);
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .item-link {
            display: inline-block;
            font-size: 8px;
            font-weight: 700;
            color: var(--dmg-blue);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-top: 3px;
            text-decoration: none;
        }
        .item-link:hover { text-decoration: underline; }

        /* Empty/Error States */
        .empty-state, .error-state {
            text-align: center;
            padding: 24px 16px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
        }
        .empty-state {
            background: var(--surface-alt);
            color: var(--ink-muted);
            border: 1px dashed var(--border);
        }
        .error-state {
            background: rgba(244, 63, 94, 0.08);
            color: var(--rose);
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        /* Fallback Banner */
        .fallback-banner {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 10px;
            font-weight: 500;
            color: var(--amber);
            margin-bottom: 12px;
        }

        /* Scope Banner - Shows what user is viewing */
        .scope-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }
        .scope-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .scope-label {
            font-size: 9px;
            font-weight: 600;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .scope-badge {
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(33, 160, 216, 0.1);
            color: var(--dmg-blue);
        }
        .scope-badge.today { background: rgba(16, 185, 129, 0.1); color: var(--emerald); }
        .scope-badge.fallback { background: rgba(245, 158, 11, 0.1); color: var(--amber); }
        .scope-help {
            font-size: 9px;
            color: var(--ink-muted);
            font-weight: 500;
        }

        /* More Items */
        .more-items {
            font-size: 9px;
            font-weight: 600;
            color: var(--ink-muted);
            text-align: center;
            padding: 4px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="widget-main">
            <div class="loading-screen">
                <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                <span class="loading-text">Loading today's update...</span>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const COLLECTION_PATH = "artifacts/dmg-command-centre-native/public/data/creative_updates";

    const highlightOrder = ['pending', 'live', 'completed', 'media', 'partnerships', 'internal', 'coming_up'];

    const sectionColors = {
        pending: '#F59E0B',
        live: '#10B981',
        completed: '#0EA5E9',
        media: '#8B5CF6',
        partnerships: '#F43F5E',
        internal: '#9CA3AF',
        coming_up: '#6366F1'
    };

    const formatDate = (date) => date.toLocaleDateString('en-GB', {
        weekday: 'short',
        day: 'numeric',
        month: 'short'
    });

    const formatTime = (iso) => {
        if (!iso) return '—';
        const parsed = new Date(iso);
        if (Number.isNaN(parsed.getTime())) return '—';
        return parsed.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    };

    const countItems = (sections) => sections.reduce((total, section) => total + section.items.length, 0);

    const escapeHtml = (text) => {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    };

    async function loadData() {
        try {
            await signInAnonymously(auth);
            const today = new Date().toISOString().split('T')[0];
            const todayQuery = query(collection(db, COLLECTION_PATH), where('date', '==', today));
            const todaySnapshot = await getDocs(todayQuery);

            let rundown = null;
            let isFallback = false;

            if (!todaySnapshot.empty) {
                const docSnap = todaySnapshot.docs[0];
                rundown = { ...docSnap.data(), id: docSnap.id };
            } else {
                const fallbackQuery = query(collection(db, COLLECTION_PATH), orderBy('date', 'desc'), limit(1));
                const fallbackSnapshot = await getDocs(fallbackQuery);
                if (!fallbackSnapshot.empty) {
                    const docSnap = fallbackSnapshot.docs[0];
                    rundown = { ...docSnap.data(), id: docSnap.id };
                    isFallback = true;
                }
            }

            render(rundown, isFallback);
        } catch (error) {
            console.error('Failed to load updates', error);
            renderError();
        }
    }

    function renderEmpty() {
        document.getElementById('root').innerHTML = `
            <div class="widget-main">
                ${renderHeader(null)}
                <div class="container">
                    <div class="empty-state">No updates have been posted yet.</div>
                </div>
            </div>
        `;
    }

    function renderError() {
        document.getElementById('root').innerHTML = `
            <div class="widget-main">
                ${renderHeader(null)}
                <div class="container">
                    <div class="error-state">Unable to load the daily update right now.</div>
                </div>
            </div>
        `;
    }

    function renderHeader(rundown) {
        return `
            <div class="header">
                <div class="header-left">
                    <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                    <div class="header-brand">
                        <h1 class="header-label">Daily Snapshot</h1>
                        <p class="header-sublabel">Creative Updates</p>
                    </div>
                </div>
                <div class="header-meta">
                    <span class="meta-item"><strong>${formatDate(new Date())}</strong></span>
                    <span class="meta-item">Session: <strong>${escapeHtml(rundown?.session) || 'Latest'}</strong></span>
                    <span class="meta-item">Updated: <strong>${formatTime(rundown?.lastModified)}</strong></span>
                </div>
            </div>
        `;
    }

    function render(rundown, isFallback) {
        if (!rundown) {
            renderEmpty();
            return;
        }

        const sections = [...rundown.sections]
            .sort((a, b) => highlightOrder.indexOf(a.id) - highlightOrder.indexOf(b.id))
            .filter(section => section.items.length > 0);

        const total = countItems(rundown.sections);
        const live = rundown.sections.find(s => s.id === 'live')?.items.length ?? 0;
        const pending = rundown.sections.find(s => s.id === 'pending')?.items.length ?? 0;
        const completed = rundown.sections.find(s => s.id === 'completed')?.items.length ?? 0;

        const focusSectionIds = new Set(['pending', 'live', 'coming_up']);
        const focusItems = rundown.sections
            .filter(section => focusSectionIds.has(section.id))
            .flatMap(section => section.items.map(item => ({ ...item, sectionId: section.id })))
            .slice(0, 8);

        const fallbackBanner = isFallback ? `
            <div class="fallback-banner">
                Showing the most recent update from ${escapeHtml(rundown.date)}.
            </div>
        ` : '';

        // Create scope banner based on whether it's today's data or fallback
        const scopeBadgeClass = isFallback ? 'fallback' : 'today';
        const scopeText = isFallback ? 'Previous Update' : "Today's Update";
        const scopeHelp = isFallback
            ? `Showing data from ${escapeHtml(rundown.date)} (no update for today yet)`
            : `Data from ${escapeHtml(rundown.date)} • ${total} items tracked`;

        document.getElementById('root').innerHTML = `
            <div class="widget-main">
                ${renderHeader(rundown)}

                <!-- Scope Banner - Clarifies data source -->
                <div class="scope-banner">
                    <div class="scope-info">
                        <span class="scope-label">Viewing:</span>
                        <span class="scope-badge ${scopeBadgeClass}">${scopeText}</span>
                        <span class="scope-badge">${total} items</span>
                    </div>
                    <span class="scope-help">${scopeHelp}</span>
                </div>

                <div class="container">
                    ${fallbackBanner}

                    <!-- Stats Row -->
                    <div class="stats-row">
                        <div class="stat-badge stat-total">
                            <span class="num">${total}</span>
                            <span>Total</span>
                        </div>
                        <div class="stat-badge stat-live">
                            <span class="num">${live}</span>
                            <span>Live</span>
                        </div>
                        <div class="stat-badge stat-pending">
                            <span class="num">${pending}</span>
                            <span>In Progress</span>
                        </div>
                        <div class="stat-badge stat-completed">
                            <span class="num">${completed}</span>
                            <span>Done</span>
                        </div>
                    </div>

                    <!-- Key Focus -->
                    ${focusItems.length > 0 ? `
                        <div class="section-label">Key Focus</div>
                        <div class="focus-row">
                            ${focusItems.map(item => `
                                <div class="focus-chip">
                                    <span class="dot" style="background: ${sectionColors[item.sectionId] || '#9CA3AF'}"></span>
                                    <span class="name">${escapeHtml(item.projectName) || 'Untitled'}</span>
                                    <span class="tag">${escapeHtml(item.sectionId.replace('_', ' '))}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}

                    <!-- Sections Grid -->
                    <div class="section-label" style="margin-top: 4px;">All Updates</div>
                    <div class="sections-grid">
                        ${sections.map(section => {
                            const maxItems = 3;
                            const visibleItems = section.items.slice(0, maxItems);
                            const moreCount = section.items.length - maxItems;

                            return `
                                <div class="section-card ${section.id}">
                                    <div class="section-header">
                                        <span class="section-title" style="color: ${sectionColors[section.id] || '#1C1C1C'}">${escapeHtml(section.title)}</span>
                                        <span class="section-count">${section.items.length}</span>
                                    </div>
                                    ${visibleItems.map(item => `
                                        <div class="item">
                                            <div class="item-name">${escapeHtml(item.projectName) || 'Untitled'}</div>
                                            ${item.statusNote ? `<div class="item-note">${escapeHtml(item.statusNote)}</div>` : ''}
                                            ${item.link ? `<a href="${escapeHtml(item.link)}" target="_blank" rel="noreferrer" class="item-link">Link →</a>` : ''}
                                        </div>
                                    `).join('')}
                                    ${moreCount > 0 ? `<div class="more-items">+${moreCount} more</div>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    loadData();
</script>
</body>
</html>
