<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Command | Daily Snapshot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --hero-blue: #21A0D8;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;
            --border: #E5E7EB;
            --ink: #1C1C1C;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: transparent;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            padding: 16px;
        }
        .dot-pulse { animation: pulse 2s ease-in-out infinite; }
        .dot-pulse-2 { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-pulse-3 { animation: pulse 2s ease-in-out 0.6s infinite; }
        .dot-pulse-4 { animation: pulse 2s ease-in-out 0.9s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root">
        <div class="text-[#1C1C1C]">
            <div class="mx-auto max-w-[1200px] rounded-3xl border border-slate-200 bg-white shadow-sm">
                <div class="flex flex-col items-center gap-3 px-6 py-10">
                    <div class="grid grid-cols-2 gap-[3px]">
                        <span class="w-[6px] h-[6px] rounded-full bg-[#21A0D8] dot-pulse"></span>
                        <span class="w-[6px] h-[6px] rounded-full bg-[#21A0D8] dot-pulse-2"></span>
                        <span class="w-[6px] h-[6px] rounded-full bg-[#21A0D8] dot-pulse-3"></span>
                        <span class="w-[6px] h-[6px] rounded-full bg-[#21A0D8] dot-pulse-4"></span>
                    </div>
                    <p class="text-sm text-slate-500">Loading today's update...</p>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const COLLECTION_PATH = "artifacts/dmg-command-centre-native/public/data/creative_updates";

    const highlightOrder = ['pending', 'live', 'completed', 'media', 'partnerships', 'internal', 'coming_up'];

    const cardStyles = {
        pending: 'border-amber-200 bg-amber-50/40',
        live: 'border-emerald-200 bg-emerald-50/40',
        completed: 'border-sky-200 bg-sky-50/40',
        media: 'border-purple-200 bg-purple-50/40',
        partnerships: 'border-rose-200 bg-rose-50/40',
        internal: 'border-gray-200 bg-gray-50/50',
        coming_up: 'border-indigo-200 bg-indigo-50/40'
    };

    const getSectionTone = (sectionId) => cardStyles[sectionId] || 'border-slate-200 bg-white';

    const formatDate = (date) => date.toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
    });

    const formatTime = (iso) => {
        if (!iso) return '—';
        const parsed = new Date(iso);
        if (Number.isNaN(parsed.getTime())) return '—';
        return parsed.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    };

    const countItems = (sections) => sections.reduce((total, section) => total + section.items.length, 0);

    const escapeHtml = (text) => {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    };

    async function loadData() {
        try {
            await signInAnonymously(auth);
            const today = new Date().toISOString().split('T')[0];
            const todayQuery = query(collection(db, COLLECTION_PATH), where('date', '==', today));
            const todaySnapshot = await getDocs(todayQuery);

            let rundown = null;
            let isFallback = false;

            if (!todaySnapshot.empty) {
                const docSnap = todaySnapshot.docs[0];
                rundown = { ...docSnap.data(), id: docSnap.id };
            } else {
                const fallbackQuery = query(collection(db, COLLECTION_PATH), orderBy('date', 'desc'), limit(1));
                const fallbackSnapshot = await getDocs(fallbackQuery);
                if (!fallbackSnapshot.empty) {
                    const docSnap = fallbackSnapshot.docs[0];
                    rundown = { ...docSnap.data(), id: docSnap.id };
                    isFallback = true;
                }
            }

            render(rundown, isFallback);
        } catch (error) {
            console.error('Failed to load updates', error);
            renderError();
        }
    }

    function renderEmpty() {
        document.getElementById('root').innerHTML = `
            <div class="text-[#1C1C1C]">
                <div class="mx-auto max-w-[1200px] rounded-3xl border border-slate-200 bg-white shadow-sm">
                    <div class="px-6 py-8">
                        ${renderHeader(null)}
                        <div class="mt-16 rounded-2xl border border-dashed border-slate-200 bg-white px-8 py-10 text-center text-slate-500">
                            No updates have been posted yet.
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderError() {
        document.getElementById('root').innerHTML = `
            <div class="text-[#1C1C1C]">
                <div class="mx-auto max-w-[1200px] rounded-3xl border border-slate-200 bg-white shadow-sm">
                    <div class="px-6 py-8">
                        ${renderHeader(null)}
                        <div class="mt-16 rounded-2xl border border-red-200 bg-red-50 px-8 py-10 text-center text-red-600">
                            Unable to load the daily update right now.
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderHeader(rundown) {
        return `
            <header class="flex flex-col gap-6 border-b border-slate-200 pb-6 lg:flex-row lg:items-center lg:justify-end">
                <div class="flex flex-wrap items-center gap-4">
                    <div class="rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm">
                        <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Date</p>
                        <p class="text-sm font-semibold text-slate-700">${formatDate(new Date())}</p>
                    </div>
                    <div class="rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm">
                        <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Session</p>
                        <p class="text-sm font-semibold text-slate-700">${escapeHtml(rundown?.session) || 'Latest'}</p>
                    </div>
                    <div class="rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm">
                        <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Last Updated</p>
                        <p class="text-sm font-semibold text-slate-700">${formatTime(rundown?.lastModified)}</p>
                    </div>
                </div>
            </header>
        `;
    }

    function render(rundown, isFallback) {
        if (!rundown) {
            renderEmpty();
            return;
        }

        const sections = [...rundown.sections]
            .sort((a, b) => highlightOrder.indexOf(a.id) - highlightOrder.indexOf(b.id))
            .filter(section => section.items.length > 0);

        const total = countItems(rundown.sections);
        const live = rundown.sections.find(s => s.id === 'live')?.items.length ?? 0;
        const pending = rundown.sections.find(s => s.id === 'pending')?.items.length ?? 0;
        const completed = rundown.sections.find(s => s.id === 'completed')?.items.length ?? 0;

        const focusSectionIds = new Set(['pending', 'live', 'coming_up']);
        const focusItems = rundown.sections
            .filter(section => focusSectionIds.has(section.id))
            .flatMap(section => section.items.map(item => ({ ...item, sectionId: section.id })))
            .slice(0, 6);

        const fallbackBanner = isFallback ? `
            <div class="mt-6 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700">
                Showing the most recent update from ${escapeHtml(rundown.date)}.
            </div>
        ` : '';

        document.getElementById('root').innerHTML = `
            <div class="text-[#1C1C1C]">
                <div class="mx-auto max-w-[1200px] rounded-3xl border border-slate-200 bg-white shadow-sm">
                    <div class="px-6 py-8">
                        ${renderHeader(rundown)}
                        ${fallbackBanner}
                        <main class="mt-8 grid grid-cols-1 gap-6 lg:grid-cols-12">
                            <section class="lg:col-span-4 space-y-6">
                                <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                                    <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400">At a glance</p>
                                    <div class="mt-4 grid grid-cols-2 gap-4">
                                        <div class="rounded-2xl bg-slate-50 p-4">
                                            <p class="text-3xl font-black text-slate-800">${total}</p>
                                            <p class="text-xs font-semibold uppercase tracking-widest text-slate-400">Total items</p>
                                        </div>
                                        <div class="rounded-2xl bg-emerald-50 p-4">
                                            <p class="text-3xl font-black text-emerald-600">${live}</p>
                                            <p class="text-xs font-semibold uppercase tracking-widest text-emerald-600/70">Live projects</p>
                                        </div>
                                        <div class="rounded-2xl bg-amber-50 p-4">
                                            <p class="text-3xl font-black text-amber-600">${pending}</p>
                                            <p class="text-xs font-semibold uppercase tracking-widest text-amber-600/70">In progress</p>
                                        </div>
                                        <div class="rounded-2xl bg-sky-50 p-4">
                                            <p class="text-3xl font-black text-sky-600">${completed}</p>
                                            <p class="text-xs font-semibold uppercase tracking-widest text-sky-600/70">Completed</p>
                                        </div>
                                    </div>
                                </div>

                                <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                                    <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Key focus</p>
                                    <div class="mt-4 space-y-3">
                                        ${focusItems.length === 0 ? `
                                            <p class="text-sm text-slate-500">No priority items shared yet.</p>
                                        ` : focusItems.map(item => `
                                            <div class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3">
                                                <div class="flex items-center justify-between">
                                                    <p class="text-sm font-semibold text-slate-700">${escapeHtml(item.projectName) || 'Untitled'}</p>
                                                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">
                                                        ${escapeHtml(item.sectionId.replace('_', ' '))}
                                                    </span>
                                                </div>
                                                ${item.statusNote ? `<p class="mt-1 text-xs text-slate-500">${escapeHtml(item.statusNote)}</p>` : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </section>

                            <section class="lg:col-span-8 grid grid-cols-1 gap-5 md:grid-cols-2">
                                ${sections.map(section => `
                                    <div class="rounded-3xl border p-5 shadow-sm ${getSectionTone(section.id)}">
                                        <div class="flex items-center justify-between">
                                            <h2 class="text-sm font-black uppercase tracking-[0.2em] text-slate-700">
                                                ${escapeHtml(section.title)}
                                            </h2>
                                            <span class="text-xs font-semibold text-slate-500">${section.items.length} items</span>
                                        </div>
                                        <div class="mt-4 space-y-4">
                                            ${section.items.map(item => `
                                                <div class="rounded-2xl border border-white/80 bg-white/70 p-4">
                                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                                        <p class="text-sm font-semibold text-slate-800">${escapeHtml(item.projectName) || 'Untitled'}</p>
                                                        ${item.link ? `
                                                            <a href="${escapeHtml(item.link)}" target="_blank" rel="noreferrer" class="text-[11px] font-bold uppercase tracking-widest text-[#21A0D8]">
                                                                Link
                                                            </a>
                                                        ` : ''}
                                                    </div>
                                                    ${item.statusNote ? `<p class="mt-1 text-xs text-slate-500">${escapeHtml(item.statusNote)}</p>` : ''}
                                                    ${item.bullets && item.bullets.length > 0 ? `
                                                        <ul class="mt-2 space-y-1 text-xs text-slate-500">
                                                            ${item.bullets.map(bullet => `
                                                                <li class="flex items-start gap-2">
                                                                    <span class="mt-1 h-1.5 w-1.5 rounded-full bg-slate-400 flex-shrink-0"></span>
                                                                    <span>${escapeHtml(bullet.text)}</span>
                                                                </li>
                                                            `).join('')}
                                                        </ul>
                                                    ` : ''}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </section>
                        </main>
                    </div>
                </div>
            </div>
        `;
    }

    loadData();
</script>
</body>
</html>
