<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Daily Snapshot | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Core Colors - Unified Design System */
            --ink: #0F172A;
            --ink-sub: #64748B;
            --ink-muted: #94A3B8;
            --border: #E2E8F0;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;

            /* Pillar Colors - Design System */
            --hero-blue: #21A0D8;
            --hero-blue-soft: rgba(33, 160, 216, 0.1);
            --hero-blue-glow: rgba(33, 160, 216, 0.15);
            --editorial-red: #E94B4B;
            --editorial-red-soft: rgba(233, 75, 75, 0.1);
            --creative-pink: #E6468B;
            --creative-pink-soft: rgba(230, 70, 139, 0.1);
            --production-green: #43B049;
            --production-green-soft: rgba(67, 176, 73, 0.1);
            --social-yellow: #F59E0B;
            --social-yellow-soft: rgba(245, 158, 11, 0.1);

            /* Status Colors mapped to Pillars */
            --pending: var(--social-yellow);
            --pending-soft: var(--social-yellow-soft);
            --live: var(--production-green);
            --live-soft: var(--production-green-soft);
            --awaiting: var(--hero-blue);
            --awaiting-soft: var(--hero-blue-soft);
            --creative: var(--creative-pink);
            --creative-soft: var(--creative-pink-soft);
            --edit: var(--editorial-red);
            --edit-soft: var(--editorial-red-soft);
            --feedback: var(--hero-blue);
            --feedback-soft: var(--hero-blue-soft);

            /* Legacy alias */
            --dmg-blue: var(--hero-blue);
            --dmg-blue-soft: var(--hero-blue-soft);
            --dmg-blue-glow: var(--hero-blue-glow);

            /* Layout */
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 16px;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }

        /* Main Container */
        .widget-main {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            max-width: 1820px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }

        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }

        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .header-brand h1 {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--dmg-blue);
            margin: 0;
            text-transform: uppercase;
        }

        .header-brand p {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        .header-meta {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .meta-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--surface-alt);
            color: var(--ink-sub);
            border: 1px solid var(--border);
        }

        .meta-badge.live {
            background: var(--live-soft);
            color: var(--live);
            border-color: transparent;
        }

        /* Loading */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            gap: 12px;
        }

        .loading-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Bento Grid Layout */
        .bento-container {
            padding: 20px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto;
            gap: 16px;
        }

        @media (max-width: 1100px) {
            .bento-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 800px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 500px) {
            .bento-grid { grid-template-columns: 1fr; }
        }

        /* Bento Card - Base */
        .bento-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .bento-card:hover {
            border-color: #CBD5E1;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }

        /* Card Variants - Sizes */
        .bento-card.tall {
            grid-row: span 2;
        }

        .bento-card.wide {
            grid-column: span 2;
        }

        .bento-card.featured {
            grid-column: span 2;
            grid-row: span 2;
        }

        /* Card Header */
        .card-header {
            padding: 16px 18px 12px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .card-meta {
            flex: 1;
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 2px;
            line-height: 1.3;
        }

        .card-subtitle {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-count {
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
        }

        /* Card Content - Project List */
        .card-content {
            padding: 0 18px 16px;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .project-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .project-item:hover {
            background: #F1F5F9;
        }

        .project-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .project-info {
            flex: 1;
            min-width: 0;
        }

        .project-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project-client {
            font-size: 10px;
            color: var(--ink-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project-tag {
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            background: var(--surface);
            color: var(--ink-sub);
            flex-shrink: 0;
        }

        /* View More Button */
        .view-more {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            margin-top: 8px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 600;
            color: var(--dmg-blue);
            background: var(--dmg-blue-soft);
            transition: var(--transition);
        }

        .view-more:hover {
            background: rgba(33, 160, 216, 0.15);
        }

        /* Status-specific Styles */
        .bento-card.pending .card-icon { background: var(--pending-soft); }
        .bento-card.pending .card-count { color: var(--pending); }
        .bento-card.pending .project-dot { background: var(--pending); }

        .bento-card.awaiting .card-icon { background: var(--awaiting-soft); }
        .bento-card.awaiting .card-count { color: var(--awaiting); }
        .bento-card.awaiting .project-dot { background: var(--awaiting); }

        .bento-card.creative .card-icon { background: var(--creative-soft); }
        .bento-card.creative .card-count { color: var(--creative); }
        .bento-card.creative .project-dot { background: var(--creative); }

        .bento-card.live .card-icon { background: var(--live-soft); }
        .bento-card.live .card-count { color: var(--live); }
        .bento-card.live .project-dot { background: var(--live); }

        .bento-card.edit .card-icon { background: var(--edit-soft); }
        .bento-card.edit .card-count { color: var(--edit); }
        .bento-card.edit .project-dot { background: var(--edit); }

        .bento-card.feedback .card-icon { background: var(--feedback-soft); }
        .bento-card.feedback .card-count { color: var(--feedback); }
        .bento-card.feedback .project-dot { background: var(--feedback); }

        /* Empty Card State */
        .empty-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: var(--ink-muted);
        }

        .empty-card-icon {
            font-size: 24px;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .empty-card-text {
            font-size: 11px;
            font-weight: 500;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-alt);
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
        }

        .modal-subtitle {
            font-size: 11px;
            color: var(--ink-muted);
            font-weight: 500;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--ink-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--border);
            color: var(--ink);
        }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .modal-section-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        /* Modal Project Item */
        .modal-project-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 16px;
            background: var(--surface-alt);
            border-radius: var(--radius);
            margin-bottom: 10px;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .modal-project-item:hover {
            border-color: var(--border);
            background: #F1F5F9;
        }

        .modal-project-item .clickable-details {
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-project-item .clickable-details:hover .modal-project-name {
            color: var(--hero-blue);
        }

        .modal-project-item:last-child {
            margin-bottom: 0;
        }

        .modal-project-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .modal-project-details {
            flex: 1;
            min-width: 0;
        }

        .modal-project-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .modal-project-client {
            font-size: 11px;
            color: var(--ink-sub);
            margin-bottom: 8px;
        }

        .modal-project-note {
            font-size: 12px;
            color: var(--ink-sub);
            line-height: 1.5;
            padding: 10px 12px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--border);
        }

        .modal-project-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* Action Buttons */
        .btn {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--dmg-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #1a8ac0;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--ink-sub);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--ink-muted);
            color: var(--ink);
        }

        .btn-ghost {
            background: transparent;
            color: var(--dmg-blue);
            padding: 6px 10px;
        }

        .btn-ghost:hover {
            background: var(--dmg-blue-soft);
        }

        .btn-danger {
            background: var(--editorial-red-soft);
            color: var(--editorial-red);
            border: 1px solid transparent;
        }

        .btn-danger:hover {
            background: var(--editorial-red);
            color: white;
        }

        /* Small Notion link button - compact and tucked away */
        .btn-notion-link {
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0;
            background: var(--surface-alt);
            color: var(--ink-muted);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-notion-link:hover {
            background: var(--dmg-blue-soft);
            color: var(--dmg-blue);
            border-color: var(--dmg-blue);
        }

        /* Subtle inline Notion link for footer areas */
        .btn-notion-subtle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--ink-muted);
            text-decoration: none;
            background: transparent;
            transition: var(--transition);
            margin-left: 8px;
        }

        .btn-notion-subtle:hover {
            color: var(--dmg-blue);
            background: var(--dmg-blue-soft);
        }

        /* Modal Footer */
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-alt);
        }

        .modal-footer-info {
            font-size: 11px;
            color: var(--ink-muted);
        }

        /* Edit Mode Styles */
        .edit-field {
            margin-bottom: 16px;
        }

        .edit-field label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .edit-field input,
        .edit-field textarea,
        .edit-field select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            background: var(--surface);
            color: var(--ink);
            outline: none;
            transition: var(--transition);
        }

        .edit-field input:focus,
        .edit-field textarea:focus,
        .edit-field select:focus {
            border-color: var(--dmg-blue);
            box-shadow: 0 0 0 3px var(--dmg-blue-glow);
        }

        .edit-field textarea {
            min-height: 80px;
            resize: vertical;
        }

        .edit-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: var(--production-green); }
        .toast.error { background: var(--editorial-red); }

        /* Spinning animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* ═══════════════════════════════════════════════════════════════════════════
           PROJECT DETAIL OVERLAY - Elegant slide-up modal for individual projects
           ═══════════════════════════════════════════════════════════════════════════ */
        .project-detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .project-detail-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .project-detail-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.92) translateY(30px);
            width: 95%;
            max-width: 800px;
            max-height: 90vh;
            background: var(--surface);
            border-radius: var(--radius-xl);
            overflow: hidden;
            z-index: 1101;
            opacity: 0;
            visibility: hidden;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.35s ease-out,
                        visibility 0.35s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.35);
        }

        .project-detail-overlay.open .project-detail-modal {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1) translateY(0);
        }

        .project-detail-modal.closing {
            transform: translate(-50%, -50%) scale(0.95) translateY(20px);
            opacity: 0;
            transition: transform 0.25s ease-in, opacity 0.2s ease-in;
        }

        /* Project Detail Header */
        .project-detail-header {
            padding: 24px 28px;
            background: linear-gradient(135deg, var(--surface-alt) 0%, var(--surface) 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .project-detail-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .project-detail-title-section {
            flex: 1;
            min-width: 0;
        }

        .project-detail-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .project-detail-status-badge .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .project-detail-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--ink);
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .project-detail-subtitle {
            font-size: 12px;
            color: var(--ink-sub);
            font-weight: 500;
        }

        .project-detail-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--ink-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .project-detail-close:hover {
            background: var(--border);
            color: var(--ink);
        }

        /* Project Detail Body */
        .project-detail-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .detail-section {
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(16px);
            animation: detailFadeIn 0.4s ease forwards;
        }

        .detail-section:nth-child(1) { animation-delay: 0.05s; }
        .detail-section:nth-child(2) { animation-delay: 0.1s; }
        .detail-section:nth-child(3) { animation-delay: 0.15s; }
        .detail-section:nth-child(4) { animation-delay: 0.2s; }

        @keyframes detailFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .detail-section-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .detail-section-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Status Note Block */
        .detail-note-block {
            background: var(--surface-alt);
            border-radius: var(--radius);
            padding: 16px 18px;
            border-left: 4px solid var(--hero-blue);
        }

        .detail-note-block p {
            font-size: 14px;
            color: var(--ink);
            line-height: 1.6;
            margin: 0;
        }

        /* Bullets List */
        .detail-bullets {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .detail-bullets li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--ink);
            line-height: 1.5;
        }

        .detail-bullets li:last-child {
            margin-bottom: 0;
        }

        .detail-bullets li::before {
            content: '•';
            color: var(--hero-blue);
            font-weight: 900;
            font-size: 16px;
            line-height: 1.3;
        }

        /* Info Grid */
        .detail-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (max-width: 500px) {
            .detail-info-grid {
                grid-template-columns: 1fr;
            }
        }

        .detail-info-card {
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .detail-info-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .detail-info-content {
            flex: 1;
            min-width: 0;
        }

        .detail-info-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 2px;
        }

        .detail-info-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Project Detail Footer */
        .project-detail-footer {
            padding: 16px 28px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-alt);
            gap: 12px;
            flex-wrap: wrap;
        }

        .project-detail-footer-info {
            font-size: 11px;
            color: var(--ink-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .project-detail-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Click feedback for project items */
        .project-item {
            position: relative;
            overflow: hidden;
        }

        .project-item:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }

        .project-item::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, var(--hero-blue) 0%, transparent 70%);
            opacity: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .project-item.ripple::after {
            animation: itemRipple 0.4s ease-out forwards;
        }

        @keyframes itemRipple {
            0% { width: 0; height: 0; opacity: 0.25; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        /* Add Project Button */
        .add-project-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--hero-blue);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-project-btn:hover {
            background: #1a8ac0;
            transform: translateY(-1px);
        }

        /* Quick Stats Row */
        .quick-stats {
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .quick-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .quick-stat-num {
            font-size: 18px;
            font-weight: 800;
        }

        .quick-stat-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-sub);
            text-transform: uppercase;
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 48px 24px;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .error-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .error-desc {
            font-size: 13px;
            color: var(--ink-sub);
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="widget-main">
            <div class="loading-screen">
                <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                <span class="loading-text">Loading project status...</span>
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <!-- Content populated dynamically -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Project Detail Overlay -->
    <div class="project-detail-overlay" id="projectDetailOverlay">
        <div class="project-detail-modal" id="projectDetailModal">
            <!-- Content populated dynamically -->
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, orderBy, limit, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ═══════════════════════════════════════════════════════════════════════════
    // CONFIGURATION
    // ═══════════════════════════════════════════════════════════════════════════
    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
    const APP_ID = 'dmg-command-centre-native';
    const COLLECTION_PATH = "artifacts/dmg-command-centre-native/public/data/creative_updates";

    // Status Categories Configuration
    const STATUS_CATEGORIES = [
        {
            id: 'pending',
            title: 'Projects Pending',
            subtitle: 'Awaiting action',
            icon: '&#x23F3;',
            statusMatch: ['pending', 'Not started', 'In progress'],
            sectionMatch: ['pending'],
            color: 'pending',
            size: 'tall'
        },
        {
            id: 'awaiting_client',
            title: 'Awaiting Client Response',
            subtitle: 'Pending client input',
            icon: '&#x1F4AC;',
            statusMatch: ['Awaiting client', 'Client review'],
            sectionMatch: [],
            color: 'awaiting',
            size: 'normal'
        },
        {
            id: 'creative_response',
            title: 'Creative Response In Progress',
            subtitle: 'Active creative work',
            icon: '&#x1F3A8;',
            statusMatch: ['Creative response', 'In creative'],
            sectionMatch: ['completed'],
            color: 'creative',
            size: 'wide'
        },
        {
            id: 'live',
            title: 'Live Project Assets',
            subtitle: 'Most recent deliverables',
            icon: '&#x1F680;',
            statusMatch: ['Live', 'Published', 'Delivered'],
            sectionMatch: ['live'],
            color: 'live',
            size: 'featured'
        },
        {
            id: 'in_edit',
            title: 'Projects In Edit',
            subtitle: 'Post-production phase',
            icon: '&#x1F3AC;',
            statusMatch: ['In edit', 'Editing', 'Post-production'],
            sectionMatch: [],
            color: 'edit',
            size: 'normal'
        },
        {
            id: 'awaiting_feedback',
            title: 'Awaiting Feedback',
            subtitle: 'Pending review',
            icon: '&#x1F50D;',
            statusMatch: ['Awaiting feedback', 'Internal review', 'QC'],
            sectionMatch: ['coming_up'],
            color: 'feedback',
            size: 'tall'
        }
    ];

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // ═══════════════════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════════════════
    let rundownData = null;
    let projects = [];
    let categorizedProjects = {};
    let currentModal = null;

    // ═══════════════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════════════
    const formatDate = (date) => date.toLocaleDateString('en-GB', {
        weekday: 'short',
        day: 'numeric',
        month: 'short'
    });

    const escapeHtml = (text) => {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    };

    const showToast = (message, type = '') => {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast show ${type}`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // DATA LOADING
    // ═══════════════════════════════════════════════════════════════════════════
    async function loadData() {
        try {
            await signInAnonymously(auth);

            // Fetch creative updates
            const today = new Date().toISOString().split('T')[0];
            const todayQuery = query(collection(db, COLLECTION_PATH), where('date', '==', today));
            const todaySnapshot = await getDocs(todayQuery);

            if (!todaySnapshot.empty) {
                const docSnap = todaySnapshot.docs[0];
                rundownData = { ...docSnap.data(), id: docSnap.id };
            } else {
                const fallbackQuery = query(collection(db, COLLECTION_PATH), orderBy('date', 'desc'), limit(1));
                const fallbackSnapshot = await getDocs(fallbackQuery);
                if (!fallbackSnapshot.empty) {
                    const docSnap = fallbackSnapshot.docs[0];
                    rundownData = { ...docSnap.data(), id: docSnap.id };
                }
            }

            // Fetch projects from API
            try {
                const res = await fetch(API_URL + '/projects');
                const data = await res.json();
                if (data.success && data.projects) {
                    projects = data.projects;
                }
            } catch (e) {
                console.warn('Could not fetch projects:', e);
            }

            // Categorize projects
            categorizeProjects();

            render();
        } catch (error) {
            console.error('Failed to load data:', error);
            renderError();
        }
    }

    function categorizeProjects() {
        // Reset categories
        STATUS_CATEGORIES.forEach(cat => {
            categorizedProjects[cat.id] = [];
        });

        if (!rundownData?.sections) return;

        // Categorize items from rundown data
        rundownData.sections.forEach(section => {
            section.items.forEach(item => {
                STATUS_CATEGORIES.forEach(cat => {
                    // Match by section
                    if (cat.sectionMatch.includes(section.id)) {
                        categorizedProjects[cat.id].push({
                            ...item,
                            sectionTitle: section.title,
                            sectionId: section.id
                        });
                    }
                });
            });
        });

        // Distribute items that match multiple categories more intelligently
        // For awaiting_client - pull from pending that have client-related notes
        if (categorizedProjects['pending'].length > 0) {
            const awaitingClient = categorizedProjects['pending'].filter(p =>
                p.statusNote?.toLowerCase().includes('client') ||
                p.statusNote?.toLowerCase().includes('awaiting')
            );
            awaitingClient.forEach(p => {
                if (!categorizedProjects['awaiting_client'].find(x => x.id === p.id)) {
                    categorizedProjects['awaiting_client'].push(p);
                }
            });
        }

        // For in_edit - check status notes
        rundownData.sections.forEach(section => {
            section.items.forEach(item => {
                if (item.statusNote?.toLowerCase().includes('edit') ||
                    item.statusNote?.toLowerCase().includes('post')) {
                    if (!categorizedProjects['in_edit'].find(x => x.id === item.id)) {
                        categorizedProjects['in_edit'].push({
                            ...item,
                            sectionTitle: section.title,
                            sectionId: section.id
                        });
                    }
                }
            });
        });

        // For awaiting_feedback - check status notes
        rundownData.sections.forEach(section => {
            section.items.forEach(item => {
                if (item.statusNote?.toLowerCase().includes('feedback') ||
                    item.statusNote?.toLowerCase().includes('review') ||
                    item.statusNote?.toLowerCase().includes('qc')) {
                    if (!categorizedProjects['awaiting_feedback'].find(x => x.id === item.id)) {
                        categorizedProjects['awaiting_feedback'].push({
                            ...item,
                            sectionTitle: section.title,
                            sectionId: section.id
                        });
                    }
                }
            });
        });
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // RENDER FUNCTIONS
    // ═══════════════════════════════════════════════════════════════════════════
    function render() {
        if (!rundownData) {
            renderEmpty();
            return;
        }

        const totalItems = rundownData.sections.reduce((sum, s) => sum + s.items.length, 0);
        const liveCount = categorizedProjects['live']?.length || 0;
        const pendingCount = categorizedProjects['pending']?.length || 0;

        document.getElementById('root').innerHTML = `
            <div class="widget-main">
                ${renderHeader()}

                <!-- Quick Stats -->
                <div class="quick-stats">
                    <div class="quick-stat">
                        <span class="quick-stat-num" style="color: var(--ink);">${totalItems}</span>
                        <span class="quick-stat-label">Total Projects</span>
                    </div>
                    <div class="quick-stat">
                        <span class="quick-stat-num" style="color: var(--live);">${liveCount}</span>
                        <span class="quick-stat-label">Live</span>
                    </div>
                    <div class="quick-stat">
                        <span class="quick-stat-num" style="color: var(--pending);">${pendingCount}</span>
                        <span class="quick-stat-label">Pending</span>
                    </div>
                    <div class="quick-stat">
                        <span class="quick-stat-num" style="color: var(--creative);">${categorizedProjects['creative_response']?.length || 0}</span>
                        <span class="quick-stat-label">In Creative</span>
                    </div>
                    <div class="quick-stat">
                        <span class="quick-stat-num" style="color: var(--edit);">${categorizedProjects['in_edit']?.length || 0}</span>
                        <span class="quick-stat-label">In Edit</span>
                    </div>
                </div>

                <!-- Bento Grid -->
                <div class="bento-container">
                    <div class="bento-grid">
                        ${STATUS_CATEGORIES.map(cat => renderBentoCard(cat)).join('')}
                    </div>
                </div>
            </div>
        `;

        attachEventListeners();
    }

    function renderHeader() {
        return `
            <div class="header">
                <div class="header-left">
                    <div class="header-brand">
                    </div>
                </div>
                <div class="header-meta">
                    <span class="meta-badge">${formatDate(new Date())}</span>
                    <span class="meta-badge live">Live Data</span>
                </div>
            </div>
        `;
    }

    function renderBentoCard(category) {
        const items = categorizedProjects[category.id] || [];
        const sizeClass = category.size === 'tall' ? 'tall' :
                         category.size === 'wide' ? 'wide' :
                         category.size === 'featured' ? 'featured' : '';

        const maxDisplay = category.size === 'featured' ? 5 :
                          category.size === 'tall' ? 4 :
                          category.size === 'wide' ? 3 : 2;

        const displayItems = items.slice(0, maxDisplay);
        const moreCount = Math.max(0, items.length - maxDisplay);

        return `
            <div class="bento-card ${category.color} ${sizeClass}" data-category="${category.id}">
                <div class="card-header">
                    <div class="card-icon">${category.icon}</div>
                    <div class="card-meta">
                        <div class="card-title">${escapeHtml(category.title)}</div>
                        <div class="card-subtitle">${escapeHtml(category.subtitle)}</div>
                    </div>
                    <div class="card-count">${items.length}</div>
                </div>
                <div class="card-content">
                    ${items.length > 0 ? `
                        <div class="project-list">
                            ${displayItems.map(item => `
                                <div class="project-item" data-project-id="${escapeHtml(item.id)}">
                                    <div class="project-dot"></div>
                                    <div class="project-info">
                                        <div class="project-name">${escapeHtml(item.projectName) || 'Untitled'}</div>
                                        ${item.statusNote ? `<div class="project-client">${escapeHtml(item.statusNote)}</div>` : ''}
                                    </div>
                                    ${item.link ? `<span class="project-tag">Link</span>` : ''}
                                </div>
                            `).join('')}
                        </div>
                        ${moreCount > 0 ? `
                            <div class="view-more">
                                View all ${items.length} projects
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            </div>
                        ` : ''}
                    ` : `
                        <div class="empty-card">
                            <div class="empty-card-icon">${category.icon}</div>
                            <div class="empty-card-text">No projects in this status</div>
                        </div>
                    `}
                </div>
            </div>
        `;
    }

    function renderEmpty() {
        document.getElementById('root').innerHTML = `
            <div class="widget-main">
                ${renderHeader()}
                <div class="error-state">
                    <div class="error-icon">&#x1F4CB;</div>
                    <div class="error-title">No Updates Available</div>
                    <div class="error-desc">No project updates have been posted yet.</div>
                </div>
            </div>
        `;
    }

    function renderError() {
        document.getElementById('root').innerHTML = `
            <div class="widget-main">
                ${renderHeader()}
                <div class="error-state">
                    <div class="error-icon">&#x26A0;</div>
                    <div class="error-title">Connection Error</div>
                    <div class="error-desc">Unable to load project data. Please refresh to try again.</div>
                </div>
            </div>
        `;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // MODAL FUNCTIONS
    // ═══════════════════════════════════════════════════════════════════════════
    function openModal(categoryId) {
        const category = STATUS_CATEGORIES.find(c => c.id === categoryId);
        const items = categorizedProjects[categoryId] || [];
        currentModal = { categoryId, items };

        const modal = document.getElementById('modal');
        const overlay = document.getElementById('modalOverlay');

        modal.innerHTML = `
            <div class="modal-header">
                <div class="modal-title-group">
                    <div class="modal-icon" style="background: var(--${category.color}-soft);">${category.icon}</div>
                    <div>
                        <div class="modal-title">${escapeHtml(category.title)}</div>
                        <div class="modal-subtitle">${items.length} project${items.length !== 1 ? 's' : ''}</div>
                    </div>
                </div>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                ${items.length > 0 ? `
                    <div class="modal-section">
                        <div class="modal-section-title">All Projects</div>
                        ${items.map(item => renderModalProjectItem(item, category)).join('')}
                    </div>
                ` : `
                    <div class="empty-card" style="padding: 48px;">
                        <div class="empty-card-icon">${category.icon}</div>
                        <div class="empty-card-text">No projects currently in this status</div>
                    </div>
                `}
            </div>
            <div class="modal-footer" style="justify-content: space-between;">
                <div class="modal-footer-info">
                    Last updated: ${rundownData?.lastModified ? new Date(rundownData.lastModified).toLocaleString() : 'Unknown'}
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-primary" id="addProjectBtn" data-section="${category.sectionMatch[0] || 'pending'}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add Project
                    </button>
                    <button class="btn btn-secondary" id="modalClose2">Close</button>
                </div>
            </div>
        `;

        overlay.classList.add('open');
        attachModalListeners(categoryId);
    }

    function attachEventListeners() {
        // Bento card clicks - open category modal when clicking card header/empty areas
        document.querySelectorAll('.bento-card').forEach(card => {
            card.addEventListener('click', (e) => {
                // Don't open modal if clicking on a project item or view more button
                if (!e.target.closest('.project-item') && !e.target.closest('.view-more')) {
                    const categoryId = card.dataset.category;
                    openModal(categoryId);
                }
            });

            // Individual project item clicks - open project detail view
            card.querySelectorAll('.project-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const categoryId = card.dataset.category;
                    const projectId = item.dataset.projectId;

                    // Add ripple effect
                    item.classList.add('ripple');
                    setTimeout(() => {
                        item.classList.remove('ripple');
                        openProjectDetail(projectId, categoryId);
                    }, 150);
                });
            });
        });

        // View more buttons - open category modal (show all projects)
        document.querySelectorAll('.view-more').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const card = btn.closest('.bento-card');
                const categoryId = card.dataset.category;
                openModal(categoryId);
            });
        });

        // Modal overlay close
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeModal();
            }
        });

        // Escape key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    }

    function attachEditModalListeners(item, categoryId) {
        document.getElementById('modalClose')?.addEventListener('click', closeModal);
        document.getElementById('cancelEdit')?.addEventListener('click', () => {
            openModal(categoryId);
        });

        document.getElementById('saveEdit')?.addEventListener('click', async () => {
            const saveBtn = document.getElementById('saveEdit');
            const projectName = document.getElementById('editProjectName').value;
            const statusNote = document.getElementById('editStatusNote').value;
            const link = document.getElementById('editLink').value;
            const newStatus = document.getElementById('editStatus').value;
            const priority = document.getElementById('editPriority').value;

            // Disable button and show loading state
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<svg class="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4m-7-9H2m20 0h-3m-2.5-6.5L14 7m-4 10l-2.5 2.5m9-2.5L14 17M7 7L4.5 4.5"/></svg> Saving...`;

            try {
                // Update the item in rundownData sections
                if (rundownData && rundownData.sections) {
                    let itemFound = false;
                    const oldSectionId = item.sectionId;

                    // Find and update the item in its current section
                    rundownData.sections.forEach(section => {
                        const itemIndex = section.items.findIndex(i => i.id === item.id);
                        if (itemIndex !== -1) {
                            itemFound = true;

                            // If status changed, move to new section
                            if (newStatus !== oldSectionId) {
                                // Remove from current section
                                const [movedItem] = section.items.splice(itemIndex, 1);

                                // Update the item
                                movedItem.projectName = projectName;
                                movedItem.statusNote = statusNote;
                                movedItem.link = link;
                                movedItem.priority = priority;

                                // Find target section and add item
                                const targetSection = rundownData.sections.find(s => s.id === newStatus);
                                if (targetSection) {
                                    targetSection.items.push(movedItem);
                                }
                            } else {
                                // Just update in place
                                section.items[itemIndex] = {
                                    ...section.items[itemIndex],
                                    projectName,
                                    statusNote,
                                    link,
                                    priority
                                };
                            }
                        }
                    });

                    if (itemFound) {
                        // Save to Firebase
                        const docRef = doc(db, COLLECTION_PATH, rundownData.id);
                        await updateDoc(docRef, {
                            sections: rundownData.sections,
                            lastModified: new Date().toISOString()
                        });

                        // Re-categorize projects with updated data
                        categorizeProjects();

                        showToast('Changes saved to database', 'success');
                    } else {
                        showToast('Item not found in data', 'error');
                    }
                }

                closeModal();
                render();
            } catch (error) {
                console.error('Save error:', error);
                showToast('Failed to save: ' + error.message, 'error');
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Changes`;
            }
        });

        // Delete button handler
        document.getElementById('deleteItem')?.addEventListener('click', async () => {
            if (!confirm('Are you sure you want to delete this project? This cannot be undone.')) {
                return;
            }

            const deleteBtn = document.getElementById('deleteItem');
            deleteBtn.disabled = true;
            deleteBtn.textContent = 'Deleting...';

            try {
                if (rundownData && rundownData.sections) {
                    // Find and remove the item
                    rundownData.sections.forEach(section => {
                        const itemIndex = section.items.findIndex(i => i.id === item.id);
                        if (itemIndex !== -1) {
                            section.items.splice(itemIndex, 1);
                        }
                    });

                    // Save to Firebase
                    const docRef = doc(db, COLLECTION_PATH, rundownData.id);
                    await updateDoc(docRef, {
                        sections: rundownData.sections,
                        lastModified: new Date().toISOString()
                    });

                    // Re-categorize
                    categorizeProjects();

                    showToast('Project deleted', 'success');
                    closeModal();
                    render();
                }
            } catch (error) {
                console.error('Delete error:', error);
                showToast('Failed to delete: ' + error.message, 'error');
                deleteBtn.disabled = false;
                deleteBtn.textContent = 'Delete';
            }
        });
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // INITIALIZE
    // ═══════════════════════════════════════════════════════════════════════════
    loadData();
</script>
</body>
</html>
