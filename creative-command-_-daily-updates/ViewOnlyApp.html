<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Daily Snapshot | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21A0D8;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --ink-muted: #9CA3AF;
            --border: #EAECEF;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;

            /* Section colours */
            --urgent: #E94B4B;
            --active: #F59E0B;
            --upcoming: #21A0D8;
            --complete: #43B049;
            --briefs: #E6468B;
            --pipeline: #8B5CF6;

            /* Status tags */
            --green: #43B049;
            --green-soft: rgba(67, 176, 73, 0.12);
            --yellow: #F59E0B;
            --yellow-soft: rgba(245, 158, 11, 0.12);
            --red: #E94B4B;
            --red-soft: rgba(233, 75, 75, 0.12);
            --blue: #21A0D8;
            --blue-soft: rgba(33, 160, 216, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }

        /* ========== CONTAINER ========== */
        .widget {
            background: var(--surface);
            overflow: hidden;
            max-width: 1800px;
            margin: 0 auto;
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }

        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
            animation: pulse 2.5s infinite;
        }

        .dot-grid span:nth-child(1) { animation-delay: 0s; }
        .dot-grid span:nth-child(2) { animation-delay: 0.2s; }
        .dot-grid span:nth-child(3) { animation-delay: 0.4s; }
        .dot-grid span:nth-child(4) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .header-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: var(--ink);
        }

        .header-date {
            font-size: 14px;
            font-weight: 800;
            color: var(--dmg-blue);
            margin-left: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            color: var(--ink-sub);
            font-size: 13px;
            font-weight: 700;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background: var(--dmg-blue);
            color: white;
            border-color: var(--dmg-blue);
        }

        .btn-today {
            padding: 8px 16px;
            background: var(--dmg-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.15s ease;
        }

        .btn-today:hover {
            background: #1a8bc0;
        }

        .slack-btn {
            padding: 8px 16px;
            background: var(--briefs);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .slack-btn:hover {
            background: #d63d7d;
        }

        /* ========== STATS BAR ========== */
        .stats-bar {
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 14px 28px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 800;
            color: var(--ink);
        }

        .stat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .stat-dot--urgent { background: var(--urgent); }
        .stat-dot--active { background: var(--active); }
        .stat-dot--complete { background: var(--complete); }

        .stats-spacer { flex: 1; }

        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-muted);
        }

        .sync-indicator::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--complete);
            border-radius: 50%;
        }

        /* ========== BENTO GRID ========== */
        .bento {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto auto;
            gap: 0;
            background: var(--surface-alt);
        }

        /* ========== SECTION ========== */
        .section {
            background: var(--surface);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 260px;
            max-height: 360px;
        }

        .section:nth-child(4n) { border-right: none; }
        .section:nth-last-child(-n+4) { border-bottom: none; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .section-dot--urgent { background: var(--urgent); }
        .section-dot--active { background: var(--active); }
        .section-dot--upcoming { background: var(--upcoming); }
        .section-dot--complete { background: var(--complete); }
        .section-dot--briefs { background: var(--briefs); }
        .section-dot--pipeline { background: var(--pipeline); }
        .section-dot--internal { background: var(--ink-sub); }
        .section-dot--ventures { background: #8B5CF6; }
        .section-dot--default { background: var(--dmg-blue); }

        .section-name {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--ink);
        }

        .section-count {
            font-size: 10px;
            font-weight: 700;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 12px;
            color: var(--ink-sub);
        }

        .section-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ========== ITEM CARDS ========== */
        .item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            color: inherit;
        }

        .item:hover {
            border-color: var(--dmg-blue);
            background: rgba(33, 160, 216, 0.03);
        }

        .item-status {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
            margin-top: 2px;
        }

        .item-status--done {
            background: var(--complete);
            border-color: var(--complete);
            color: white;
        }

        .item-status--progress {
            background: var(--active);
            border-color: var(--active);
            color: white;
        }

        .item-status--pending {
            background: transparent;
            border-color: var(--border);
            color: var(--ink-muted);
        }

        .item-status--red {
            background: var(--urgent);
            border-color: var(--urgent);
            color: white;
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .item-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-meta {
            font-size: 11px;
            color: var(--ink-sub);
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-badge {
            flex-shrink: 0;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--surface-alt);
            color: var(--ink-sub);
        }

        .item-badge--live {
            background: rgba(67, 176, 73, 0.12);
            color: var(--complete);
        }

        .item-badge--green {
            background: var(--green-soft);
            color: var(--green);
        }

        .item-badge--yellow {
            background: var(--yellow-soft);
            color: var(--yellow);
        }

        .item-badge--red {
            background: var(--red-soft);
            color: var(--red);
        }

        /* ========== EMPTY STATE ========== */
        .empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.4;
            padding: 20px;
        }

        .empty-bar {
            width: 2px;
            height: 30px;
            background: var(--border);
            border-radius: 2px;
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ink-sub);
        }

        /* Loading & Error States */
        .loading-screen, .error-state, .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            gap: 12px;
            padding: 40px;
            text-align: center;
        }

        .loading-text, .error-text, .empty-text-full {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .error-text { color: var(--urgent); }

        /* ========== SLACK PANEL ========== */
        .slack-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 480px;
            max-width: 100%;
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: -10px 0 40px rgba(0,0,0,0.1);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .slack-panel.open { transform: translateX(0); }

        .slack-panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .slack-panel-title { font-size: 16px; font-weight: 800; color: var(--ink); }
        .slack-panel-subtitle { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
        .slack-panel-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--surface-alt);
            color: var(--ink-sub);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slack-panel-close:hover { background: var(--border); }

        .slack-panel-actions {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-alt);
        }
        .copy-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--briefs);
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .copy-btn:hover { background: #d63d7d; }
        .copy-btn.copied { background: var(--complete); }

        .slack-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .slack-preview {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--ink-sub);
            white-space: pre-wrap;
            background: var(--surface-alt);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .slack-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 999;
        }
        .slack-backdrop.open { opacity: 1; visibility: visible; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--complete); }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1000px) {
            .bento {
                grid-template-columns: repeat(2, 1fr);
            }
            .section:nth-child(2n) { border-right: none; }
            .section:nth-child(4n) { border-right: 1px solid var(--border); }
        }

        @media (max-width: 600px) {
            .bento {
                grid-template-columns: 1fr;
            }
            .section { border-right: none; }
            .stats-bar { flex-wrap: wrap; gap: 12px; }
            .header { flex-wrap: wrap; gap: 12px; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="widget">
            <div class="loading-screen">
                <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                <span class="loading-text">Loading daily snapshot from Notion...</span>
            </div>
        </div>
    </div>

    <!-- Slack Panel -->
    <div class="slack-backdrop" id="slackBackdrop"></div>
    <div class="slack-panel" id="slackPanel">
        <div class="slack-panel-header">
            <div>
                <div class="slack-panel-title">Slack Message</div>
                <div class="slack-panel-subtitle">Ready to copy and send</div>
            </div>
            <button class="slack-panel-close" id="slackClose">&times;</button>
        </div>
        <div class="slack-panel-actions">
            <button class="copy-btn" id="copyBtn">Copy to Clipboard</button>
        </div>
        <div class="slack-panel-content">
            <pre class="slack-preview" id="slackPreview"></pre>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

<script type="module">
    // ═══════════════════════════════════════════════════════════════════════════
    // CONFIGURATION
    // ═══════════════════════════════════════════════════════════════════════════
    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

    // ═══════════════════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════════════════
    let rundownData = null;
    let currentDate = new Date(); // Track which date we're viewing

    // ═══════════════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════════════
    const formatDate = (date) => date.toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
    });

    const formatDateShort = (date) => date.toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
    });

    const formatTime = (iso) => {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    };

    const escapeHtml = (text) => {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    };

    const showToast = (message, type = '') => {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast show ${type}`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    };

    const parseLinks = (linksText) => {
        if (!linksText) return [];
        const urlRegex = /https?:\/\/[^\s<]+/g;
        const matches = linksText.match(urlRegex);
        return matches ? matches.map((url, i) => ({ label: `Link ${i + 1}`, url })) : [];
    };

    // Map section titles to dot colors
    const getSectionDotClass = (title) => {
        const lower = title.toLowerCase();
        if (lower.includes('attention') || lower.includes('urgent') || lower.includes('blocked')) return 'urgent';
        if (lower.includes('active') || lower.includes('production') || lower.includes('in progress')) return 'active';
        if (lower.includes('coming') || lower.includes('upcoming') || lower.includes('this week')) return 'upcoming';
        if (lower.includes('complete') || lower.includes('done') || lower.includes('delivered')) return 'complete';
        if (lower.includes('brief') || lower.includes('new')) return 'briefs';
        if (lower.includes('pipeline') || lower.includes('prospect')) return 'pipeline';
        if (lower.includes('internal') || lower.includes('admin')) return 'internal';
        if (lower.includes('venture')) return 'ventures';
        return 'default';
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // SLACK MESSAGE GENERATION
    // ═══════════════════════════════════════════════════════════════════════════
    function generateSlackMessage(data) {
        if (!data || !data.sections) return '';

        const dateStr = new Date(data.date).toLocaleDateString('en-GB', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        let message = `*Creative Command — Daily Snapshot*\n${dateStr}\n\n`;

        data.sections.forEach(section => {
            if (section.items.length === 0) return;

            message += `*${section.title}*\n`;

            section.items.forEach(item => {
                const headline = item.headline || item.projectName || item.record || 'Untitled';
                const tag = item.statusTag ? ` [${item.statusTag}]` : '';
                message += `• ${headline}${tag}\n`;

                if (item.details) {
                    const detailLines = item.details.split('\n').filter(l => l.trim());
                    detailLines.forEach(line => {
                        message += `    ${line.trim()}\n`;
                    });
                }
            });

            message += '\n';
        });

        return message.trim();
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // DATE NAVIGATION
    // ═══════════════════════════════════════════════════════════════════════════
    function changeDate(days) {
        currentDate.setDate(currentDate.getDate() + days);
        loadData();
    }

    function goToToday() {
        currentDate = new Date();
        loadData();
    }

    function getDateKey(date) {
        return date.toISOString().split('T')[0]; // YYYY-MM-DD
    }

    function isToday(date) {
        const today = new Date();
        return date.toDateString() === today.toDateString();
    }

    // Make functions available globally for onclick handlers
    window.changeDate = changeDate;
    window.goToToday = goToToday;

    // ═══════════════════════════════════════════════════════════════════════════
    // DATA LOADING
    // ═══════════════════════════════════════════════════════════════════════════
    async function loadData() {
        try {
            const dateKey = getDateKey(currentDate);
            const response = await fetch(`${API_URL}/daily-rundown?date=${dateKey}`);

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error || 'Failed to fetch rundown');
            }

            if (data.totalItems === 0) {
                renderEmpty();
                return;
            }

            rundownData = data;
            render();
        } catch (error) {
            console.error('Failed to load data:', error);
            renderError(error.message);
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // RENDER FUNCTIONS
    // ═══════════════════════════════════════════════════════════════════════════
    function render() {
        const { sections, totalItems, date, lastFetched } = rundownData;

        // Filter to non-empty sections
        const activeSections = sections.filter(s => s.items.length > 0);

        // Compute totals from sections
        const allItems = sections.flatMap(s => s.items);
        const totals = {
            total: totalItems || allItems.length,
            byStatusTag: allItems.reduce((acc, item) => {
                const tag = item.statusTag || 'None';
                acc[tag] = (acc[tag] || 0) + 1;
                return acc;
            }, {})
        };

        document.getElementById('root').innerHTML = `
            <div class="widget">
                ${renderHeader()}
                ${renderStatsBar(totals, lastFetched)}
                <div class="bento">
                    ${activeSections.map(s => renderSection(s)).join('')}
                </div>
            </div>
        `;

        // Update Slack preview
        document.getElementById('slackPreview').textContent = generateSlackMessage(rundownData);

        attachEventListeners();
    }

    function renderHeader() {
        const viewingToday = isToday(currentDate);
        return `
            <header class="header">
                <div class="header-left">
                    <div class="dot-grid">
                        <span></span><span></span>
                        <span></span><span></span>
                    </div>
                    <span class="header-title">Creative Daily Snapshot</span>
                    <span class="header-date">• ${formatDateShort(currentDate)}</span>
                </div>
                <div class="header-right">
                    <button class="nav-btn" onclick="changeDate(-1)" title="Previous day">←</button>
                    ${!viewingToday ? `<button class="btn-today" onclick="goToToday()">Today</button>` : ''}
                    <button class="nav-btn" onclick="changeDate(1)" title="Next day">→</button>
                    <button class="slack-btn" id="openSlack">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        Slack
                    </button>
                </div>
            </header>
        `;
    }

    function renderStatsBar(totals, lastFetched) {
        const { total, byStatusTag } = totals;
        const green = byStatusTag?.Green || 0;
        const yellow = byStatusTag?.Yellow || 0;
        const red = byStatusTag?.Red || 0;
        const inProgress = total - green - red; // Approximate in-progress count

        return `
            <div class="stats-bar">
                <div class="stat">
                    <span class="stat-label">Total</span>
                    <span class="stat-value">${total}</span>
                </div>
                <div class="stat">
                    <span class="stat-dot stat-dot--complete"></span>
                    <span class="stat-label">On Track</span>
                    <span class="stat-value">${green}</span>
                </div>
                <div class="stat">
                    <span class="stat-dot stat-dot--active"></span>
                    <span class="stat-label">Attention</span>
                    <span class="stat-value">${yellow}</span>
                </div>
                <div class="stat">
                    <span class="stat-dot stat-dot--urgent"></span>
                    <span class="stat-label">Blocked</span>
                    <span class="stat-value">${red}</span>
                </div>
                <div class="stats-spacer"></div>
                <div class="sync-indicator">Synced with Notion${lastFetched ? ` • ${formatTime(lastFetched)}` : ''}</div>
            </div>
        `;
    }

    function renderSection(section) {
        const dotClass = getSectionDotClass(section.title);
        return `
            <section class="section">
                <div class="section-header">
                    <div class="section-title">
                        <span class="section-dot section-dot--${dotClass}"></span>
                        <span class="section-name">${escapeHtml(section.title)}</span>
                    </div>
                    <span class="section-count">${section.items.length}</span>
                </div>
                <div class="section-body">
                    ${section.items.length > 0
                        ? section.items.map(item => renderItem(item)).join('')
                        : `<div class="empty"><div class="empty-bar"></div><span class="empty-text">No items</span></div>`
                    }
                </div>
            </section>
        `;
    }

    function renderItem(item) {
        const headline = item.headline || item.projectName || item.record || 'Untitled';
        const statusTag = item.statusTag?.toLowerCase() || '';

        // Determine status icon
        let statusClass = 'pending';
        let statusIcon = '○';
        if (statusTag === 'green') {
            statusClass = 'done';
            statusIcon = '✓';
        } else if (statusTag === 'yellow') {
            statusClass = 'progress';
            statusIcon = '◔';
        } else if (statusTag === 'red') {
            statusClass = 'red';
            statusIcon = '!';
        } else if (item.details || item.clientPartner) {
            // Has some activity, show as in progress
            statusClass = 'progress';
            statusIcon = '◔';
        }

        // Check for live badge
        const hasLive = item.liveLink || (item.details && item.details.toLowerCase().includes('live'));

        // Build badge HTML
        let badgeHtml = '';
        if (hasLive) {
            badgeHtml = `<span class="item-badge item-badge--live">Live</span>`;
        } else if (item.statusTag) {
            badgeHtml = `<span class="item-badge item-badge--${statusTag}">${item.statusTag}</span>`;
        }

        // Link to project-detail page if projectId available, otherwise use Notion URL
        const projectDetailUrl = item.projectId
            ? `../project-detail.html?id=${encodeURIComponent(item.projectId)}`
            : (item.url || '#');

        return `
            <a href="${escapeHtml(projectDetailUrl)}" class="item" target="_blank" rel="noreferrer">
                <span class="item-status item-status--${statusClass}">${statusIcon}</span>
                <div class="item-content">
                    <div class="item-title">${escapeHtml(headline)}</div>
                    ${item.details ? `<div class="item-meta">${escapeHtml(item.details)}</div>` : ''}
                    ${item.clientPartner && !item.details ? `<div class="item-meta">${escapeHtml(item.clientPartner)}</div>` : ''}
                </div>
                ${badgeHtml}
            </a>
        `;
    }

    function renderEmpty() {
        const viewingToday = isToday(currentDate);
        document.getElementById('root').innerHTML = `
            <div class="widget">
                ${renderHeader()}
                <div class="stats-bar">
                    <div class="stat">
                        <span class="stat-label">Total</span>
                        <span class="stat-value">0</span>
                    </div>
                    <div class="stats-spacer"></div>
                    <div class="sync-indicator">Synced with Notion</div>
                </div>
                <div class="empty-state">
                    <div class="empty-bar" style="width: 2px; height: 40px; background: var(--border); border-radius: 2px;"></div>
                    <span class="empty-text-full">No items for ${viewingToday ? 'today' : formatDateShort(currentDate)}</span>
                    <p style="font-size: 12px; color: var(--ink-sub); max-width: 300px; margin-top: 8px;">
                        ${viewingToday ? 'Add items to the Daily Rundown in Notion with today\'s date to see them here.' : 'Try navigating to a different day, or go back to today.'}
                    </p>
                </div>
            </div>
        `;
        attachEventListeners();
    }

    function renderError(message) {
        document.getElementById('root').innerHTML = `
            <div class="widget">
                <header class="header">
                    <div class="header-left">
                        <div class="dot-grid">
                            <span></span><span></span>
                            <span></span><span></span>
                        </div>
                        <span class="header-title">Creative Daily Snapshot</span>
                    </div>
                </header>
                <div class="error-state">
                    <div style="font-size: 32px; opacity: 0.3;">⚠</div>
                    <span class="error-text">Unable to load snapshot</span>
                    <p style="font-size: 12px; color: var(--ink-sub);">${escapeHtml(message)}</p>
                    <button onclick="location.reload()" style="margin-top: 16px; padding: 8px 16px; background: var(--dmg-blue); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px;">
                        Retry
                    </button>
                </div>
            </div>
        `;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // EVENT LISTENERS
    // ═══════════════════════════════════════════════════════════════════════════
    function attachEventListeners() {
        // Open Slack panel
        document.getElementById('openSlack')?.addEventListener('click', () => {
            document.getElementById('slackPanel').classList.add('open');
            document.getElementById('slackBackdrop').classList.add('open');
        });
    }

    // Slack panel listeners (always present)
    document.getElementById('slackClose')?.addEventListener('click', closeSlackPanel);
    document.getElementById('slackBackdrop')?.addEventListener('click', closeSlackPanel);

    document.getElementById('copyBtn')?.addEventListener('click', async () => {
        const btn = document.getElementById('copyBtn');
        const text = document.getElementById('slackPreview').textContent;

        try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            showToast('Copied to clipboard', 'success');
            setTimeout(() => {
                btn.textContent = 'Copy to Clipboard';
                btn.classList.remove('copied');
            }, 2000);
        } catch (err) {
            showToast('Failed to copy', '');
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeSlackPanel();
        }
    });

    function closeSlackPanel() {
        document.getElementById('slackPanel').classList.remove('open');
        document.getElementById('slackBackdrop').classList.remove('open');
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // INITIALIZE
    // ═══════════════════════════════════════════════════════════════════════════
    loadData();
</script>
</body>
</html>
