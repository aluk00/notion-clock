<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reminders Header</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Core Layout */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            height: auto; 
            background-color: transparent; 
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            padding-top: 1px;
            padding-bottom: 1px;
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 0.6rem; 
            white-space: nowrap;
        }

        /* Text Styling - 30% Bigger */
        .title-text {
            font-size: 2rem; /* Increased from 1.5rem */
            font-weight: 900;
            color: #1C1C1C;
            letter-spacing: -0.04em;
            line-height: 1;
            opacity: 0;
            transform: translateY(5px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-left { animation-delay: 0.1s; }
        .text-right { animation-delay: 0.3s; }

        /* The Dots Container - 30% Bigger */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px; 
            width: 24px; /* Increased from 18px */
            height: 24px; /* Increased from 18px */
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* BLUE */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        
        /* Ultra-Small Screens */
        @media (max-width: 300px) {
            .title-text { font-size: 1.5rem; }
            .header-container { gap: 0.4rem; }
            .dots-grid { width: 18px; height: 18px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-text text-left">MY</div>
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="title-text text-right">REMINDERS</div>
    </div>

</body>
</html>
