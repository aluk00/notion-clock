<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People & Team Header</title>
    <style>
        /* Core Layout */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: flex-start; /* Aligns to the left to match the column start */
            align-items: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 1.5rem; /* Space between text and dots */
            padding-left: 20px; /* Aligns with Notion content */
        }

        /* Text Styling */
        .title-text {
            font-size: 4rem; /* Big, impact text */
            font-weight: 800; /* Extra Bold like the logo */
            color: #000000;
            letter-spacing: -0.04em; /* Tight kerning like the logo */
            line-height: 1;
            opacity: 0; /* Start hidden for animation */
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* The "PEOPLE" (Left side) */
        .text-left {
            animation-delay: 0.1s;
        }

        /* The "TEAM" (Right side) */
        .text-right {
            animation-delay: 0.3s;
        }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px; /* Spacing between dots */
            width: 44px; /* Size of the grid */
            height: 44px;
            flex-shrink: 0;
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG BLUE */
            border-radius: 50%;
            transform: scale(0); /* Start hidden */
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Stagger the dot animations */
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* Animations */
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }

        /* Responsive scaling for smaller screens/embeds */
        @media (max-width: 768px) {
            .title-text { font-size: 2.5rem; }
            .header-container { gap: 1rem; padding-left: 10px; }
            .dots-grid { width: 28px; height: 28px; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Left Text -->
        <div class="title-text text-left">PEOPLE</div>

        <!-- Center Dots (The Logo Motif) -->
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Right Text -->
        <div class="title-text text-right">TEAM</div>
    </div>

</body>
</html>
