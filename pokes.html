<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokes | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
            --poke: #F59E0B;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            overflow: hidden;
        }
        .widget-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
        }
        .poke-icon {
            font-size: 28px;
            animation: poke 1.5s infinite;
        }
        @keyframes poke {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-20deg); }
        }
        .header-title { font-size: 18px; font-weight: 900; color: var(--ink); }
        .header-sub { font-size: 12px; color: var(--ink-sub); margin-left: auto; }
        .poke-count {
            background: var(--poke);
            color: #FFF;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 800;
        }
        
        /* Poke someone section */
        .poke-someone {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-soft);
        }
        .poke-someone-title {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--poke);
            margin-bottom: 12px;
        }
        .poke-search {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 13px;
            font-family: inherit;
            margin-bottom: 12px;
        }
        .poke-search:focus { outline: none; border-color: var(--poke); }
        .poke-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .poke-suggestion {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .poke-suggestion:hover {
            border-color: var(--poke);
            background: #FFFBEB;
        }
        .poke-suggestion-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 800;
            color: #FFF;
        }
        .poke-suggestion-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
        }
        
        /* Received pokes */
        .pokes-section-title {
            padding: 16px 24px 8px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-sub);
        }
        
        .poke-list {
            display: flex;
            flex-direction: column;
        }
        
        .poke-item {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #F5F5F5;
            transition: background 0.15s;
        }
        .poke-item:hover { background: #FFFBEB; }
        .poke-item:last-child { border-bottom: none; }
        .poke-item.new { background: #FFFBEB; border-left: 4px solid var(--poke); }
        
        .poke-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #FFF;
            position: relative;
            cursor: pointer;
        }
        .poke-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 18px;
        }
        
        .poke-info { flex: 1; min-width: 0; }
        .poke-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            cursor: pointer;
        }
        .poke-name:hover { color: var(--poke); }
        .poke-time {
            font-size: 12px;
            color: var(--ink-sub);
        }
        .poke-streak {
            font-size: 11px;
            color: var(--poke);
            font-weight: 700;
        }
        
        .poke-back-btn {
            padding: 10px 18px;
            border: 2px solid var(--poke);
            background: #FFFBEB;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 800;
            color: #B45309;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .poke-back-btn:hover { background: var(--poke); color: #FFF; }
        
        .empty-state {
            padding: 40px 24px;
            text-align: center;
        }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-title { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
        .empty-sub { font-size: 13px; color: var(--ink-sub); }
        
        .demo-badge {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: var(--poke);
            padding: 4px 10px;
            border-radius: 4px;
        }
        
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--poke);
            color: #FFF;
            padding: 14px 28px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.active { bottom: 30px; opacity: 1; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="toast" id="toast">👉 Poked!</div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Operations': '#9333EA'
        };

        const DEMO_POKES = [
            { from: {n:'Dan Q',t:'Social'}, time: '2m', isNew: true, streak: 3 },
            { from: {n:'Mimi Yates',t:'Social'}, time: '15m', isNew: true },
            { from: {n:'Nick B',t:'Creative'}, time: '1h', isNew: false, streak: 7 },
            { from: {n:'Hugo M',t:'Production'}, time: '3h', isNew: false },
            { from: {n:'Kaylee A',t:'Editorial'}, time: '1d', isNew: false, streak: 2 }
        ];

        const DEMO_SUGGESTIONS = [
            { n: 'Ana', t: 'Creative' },
            { n: 'Sophia S', t: 'Editorial' },
            { n: 'Gemma P', t: 'Production' },
            { n: 'Henry W', t: 'Social' },
            { n: 'Ellie B', t: 'Creative' }
        ];

        const root = document.getElementById('root');
        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = n => n.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);

        function showToast(name) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `👉 You poked ${name}!`;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 2500);
        }

        function render() {
            const newCount = DEMO_POKES.filter(p => p.isNew).length;
            
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <span class="poke-icon">👉</span>
                        <h2 class="header-title">Pokes</h2>
                        ${newCount > 0 ? `<span class="poke-count">${newCount} new</span>` : ''}
                        <span class="demo-badge">Preview</span>
                    </div>
                    
                    <div class="poke-someone">
                        <div class="poke-someone-title">👉 Poke Someone</div>
                        <input type="text" class="poke-search" placeholder="Search teammates to poke...">
                        <div class="poke-suggestions">
                            ${DEMO_SUGGESTIONS.map(s => `
                                <div class="poke-suggestion" onclick="window.pokePerson('${s.n}')">
                                    <div class="poke-suggestion-avatar" style="background:${getTeamColor(s.t)}">${getInitials(s.n)}</div>
                                    <span class="poke-suggestion-name">${s.n}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="pokes-section-title">Pokes You've Received</div>
                    
                    <div class="poke-list">
                        ${DEMO_POKES.map(p => `
                            <div class="poke-item ${p.isNew ? 'new' : ''}">
                                <div class="poke-avatar" style="background:${getTeamColor(p.from.t)}">
                                    ${getInitials(p.from.n)}
                                    <span class="poke-badge">👉</span>
                                </div>
                                <div class="poke-info">
                                    <div class="poke-name">${p.from.n}</div>
                                    <div class="poke-time">${p.time} ago</div>
                                    ${p.streak ? `<div class="poke-streak">🔥 ${p.streak} poke streak!</div>` : ''}
                                </div>
                                <button class="poke-back-btn" onclick="window.pokeBack('${p.from.n}')">
                                    <span>👉</span>
                                    <span>Poke Back</span>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.pokePerson = (name) => {
            showToast(name);
        };

        window.pokeBack = (name) => {
            showToast(name);
        };

        onAuthStateChanged(auth, u => { if (u) render(); else signInAnonymously(auth); });
    </script>
</body>
</html>
