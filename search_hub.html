<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Search Hub</title>
    <style>
        /* Core Styles */
        body {
            margin: 0;
            padding: 5px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            width: 100%;
        }

        /* Header Styling */
        .search-header {
            font-size: 2.5rem;
            font-weight: 800;
            color: #000;
            letter-spacing: -0.04em;
            margin-bottom: 5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
        }

        /* Dots for Header */
        .header-dots {
            width: 30px;
            height: 30px;
            margin: 0 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .dot {
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
        }

        /* Search Bar Container */
        .search-container {
            width: 100%;
            max-width: 420px; 
            position: relative;
        }

        /* Input Field */
        .search-input {
            width: 100%;
            padding: 8px 50px 8px 15px;
            font-size: 16px;
            border: 2px solid #21a0d8; 
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.2s;
            outline: none;
            font-weight: 500;
            box-sizing: border-box; 
        }

        .search-input:focus {
            box-shadow: 0 4px 10px rgba(33, 160, 216, 0.5);
        }
        
        /* Search Icon */
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #21a0d8;
            font-size: 20px;
            pointer-events: none; 
        }

        /* Sub-Link Buttons Container */
        .search-tools {
            margin-top: 5px;
            display: flex;
            flex-wrap: nowrap; 
            justify-content: center; 
            gap: 8px;
            max-width: 420px; 
        }

        /* Button Styling (MUST BE BLUE) */
        .search-btn {
            background-color: #21a0d8 !important; /* Added !important to ensure color priority */
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            flex-shrink: 0; 
        }

        .search-btn:hover {
            background-color: #1a8bbd;
            color: white;
        }
    </style>
</head>
<body>

    <div class="search-header">
        <span>QUICK</span>
        <div class="header-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <span>SEARCH</span>
    </div>

    <div class="search-container">
        <input type="text" id="searchQuery" class="search-input" placeholder="Search team tools, resources, and people...">
        
        <!-- Magnifying Glass Icon (using inline SVG for universal compatibility) -->
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
    </div>

    <div class="search-tools">
        <div class="search-btn" data-url="https://docs.google.com/search?q=">Internal Docs</div>
        <div class="search-btn" data-url="https://airtable.com/search?q=">Airtable</div>
        <div class="search-btn" data-url="https://dailymail.co.uk/staff-directory/search?q=">Staff Directory</div>
        <div class="search-btn" data-url="https://google.com/search?q=">Web Search</div>
    </div>

    <script>
        const input = document.getElementById('searchQuery');
        const buttons = document.querySelectorAll('.search-btn');

        function performSearch(url, query) {
            if (query) {
                // Open the search link in a new tab
                window.open(url + encodeURIComponent(query), '_blank');
            }
        }

        // 1. Attach listeners to the quick links
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const url = button.getAttribute('data-url');
                performSearch(url, input.value);
            });
        });

        // 2. Attach listener to the main input (default to Web Search if Enter pressed)
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                const defaultUrl = buttons[buttons.length - 1].getAttribute('data-url');
                performSearch(defaultUrl, input.value);
            }
        });
    </script>

</body>
</html>
