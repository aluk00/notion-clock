<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --production: #06402B;
            --editorial: #E94B4B;
            --design: #F2C316;
            --border: #E5E7EB;
            --text-main: #1C1C1C;
            --text-sub: #6B7280;
            --bg-grey: #F9FAFB;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 16px; background: transparent; }
        
        .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .title { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; color: var(--text-main); }
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 22px; height: 22px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; }
        @keyframes heartbeat { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dot-anim { animation: heartbeat 3s infinite ease-in-out; }
        .dot-anim:nth-child(1) { animation-delay: 0s; }
        .dot-anim:nth-child(2) { animation-delay: 0.75s; }
        .dot-anim:nth-child(4) { animation-delay: 1.5s; }
        .dot-anim:nth-child(3) { animation-delay: 2.25s; }
        
        .search-wrap { position: relative; max-width: 420px; margin: 0 auto; }
        .search-input { width: 100%; padding: 12px 44px 12px 16px; font-size: 14px; font-weight: 600; border: 2px solid var(--dmg-blue); border-radius: 12px; outline: none; transition: 0.2s; font-family: inherit; }
        .search-input:focus { box-shadow: 0 0 0 4px rgba(33, 160, 216, 0.15); }
        .search-input::placeholder { color: #AAA; font-weight: 500; }
        .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--dmg-blue); pointer-events: none; }
        
        .results { max-width: 420px; margin: 0 auto; margin-top: 8px; display: none; }
        .results.visible { display: block; }
        
        .result-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #FFF; border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 6px; text-decoration: none; transition: 0.2s; cursor: pointer; }
        .result-item:hover { transform: translateX(4px); border-color: var(--dmg-blue); }
        
        .result-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .result-dot.blue { background: var(--dmg-blue); }
        .result-dot.green { background: var(--production); }
        .result-dot.red { background: var(--editorial); }
        .result-dot.yellow { background: var(--design); }
        
        .result-content { flex: 1; }
        .result-title { font-size: 12px; font-weight: 700; color: var(--text-main); }
        .result-cat { font-size: 9px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; }
        
        .result-arrow { color: #CCC; font-size: 12px; }
        
        .no-results { text-align: center; padding: 20px; font-size: 11px; color: var(--text-sub); }
        
        .hint { text-align: center; font-size: 10px; color: #BBB; margin-top: 8px; }
    </style>
</head>
<body>

<div class="header">
    <span class="title">Quick</span>
    <div class="dots-grid">
        <div class="dot dot-anim"></div>
        <div class="dot dot-anim"></div>
        <div class="dot dot-anim"></div>
        <div class="dot dot-anim"></div>
    </div>
    <span class="title">Search</span>
</div>

<div class="search-wrap">
    <input type="text" id="searchInput" class="search-input" placeholder="Search tools, dashboards, resources..." autocomplete="off">
    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
</div>

<div class="results" id="results"></div>
<div class="hint" id="hint">Type to search team tools and resources</div>

<script>
    const SEARCH_INDEX = [
        // DASHBOARDS
        { title: 'Daily Rundown', cat: 'Editorial Dashboard', url: 'daily-rundown.html', color: 'red', keywords: ['rundown', 'daily', 'editorial', 'standup', 'morning', 'eod', 'filming', 'live'] },
        { title: 'Editorial Calendar', cat: 'Editorial Dashboard', url: 'social-command-centre.html', color: 'red', keywords: ['calendar', 'editorial', 'command', 'centre', 'hooks', 'events', 'birthdays', 'planning'] },
        { title: 'Studio Pulse', cat: 'Production Dashboard', url: 'studio-pulse.html', color: 'green', keywords: ['studio', 'pulse', 'capacity', 'availability', 'designers', 'editors', 'production'] },
        { title: 'Designer Queue', cat: 'Design Dashboard', url: 'designer-queue.html', color: 'yellow', keywords: ['designer', 'queue', 'requests', 'graphics', 'urgent', 'progress'] },
        { title: 'Shoot Calendar', cat: 'Production Dashboard', url: 'shoot-calendar.html', color: 'green', keywords: ['shoot', 'calendar', 'filming', 'production', 'schedule', 'booking'] },
        
        // FORMS & TOOLS
        { title: 'Request Graphics', cat: 'Design Request', url: 'design-request-form.html', color: 'yellow', keywords: ['design', 'request', 'graphics', 'thumbnail', 'headline', 'brief'] },
        { title: 'Firebase Admin', cat: 'Admin Tool', url: 'firebase-command-centre.html', color: 'blue', keywords: ['firebase', 'admin', 'database', 'data', 'console'] },
        
        // TEAM PAGES
        { title: 'Editorial Hub', cat: 'Team Page', url: '#editorial', color: 'red', keywords: ['editorial', 'team', 'social', 'content'] },
        { title: 'Production Hub', cat: 'Team Page', url: '#production', color: 'green', keywords: ['production', 'team', 'studio', 'filming'] },
        { title: 'Creative Hub', cat: 'Team Page', url: '#creative', color: 'yellow', keywords: ['creative', 'design', 'team'] },
        
        // RESOURCES
        { title: 'Staff Directory', cat: 'People', url: '#staff-directory', color: 'blue', keywords: ['staff', 'directory', 'people', 'team', 'contacts', 'who'] },
        { title: 'Staffing & Rotas', cat: 'People', url: '#rotas', color: 'blue', keywords: ['staffing', 'rotas', 'schedule', 'shifts', 'availability'] },
        { title: 'Org Chart', cat: 'People', url: '#org-chart', color: 'blue', keywords: ['org', 'chart', 'structure', 'reporting', 'team'] },
        
        // EXTERNAL
        { title: 'Meta Business Suite', cat: 'External Platform', url: 'https://business.facebook.com/', color: 'blue', keywords: ['meta', 'facebook', 'instagram', 'business', 'publishing'] },
        { title: 'YouTube Studio', cat: 'External Platform', url: 'https://studio.youtube.com/', color: 'blue', keywords: ['youtube', 'studio', 'video', 'analytics'] },
        { title: 'TikTok Creative Center', cat: 'External Platform', url: 'https://ads.tiktok.com/business/creativecenter', color: 'blue', keywords: ['tiktok', 'creative', 'trends', 'sounds', 'hashtags'] },
        { title: 'Epidemic Sound', cat: 'Music', url: 'https://www.epidemicsound.com/', color: 'blue', keywords: ['epidemic', 'sound', 'music', 'audio', 'licensing'] },
        { title: 'Workday', cat: 'HR System', url: '#workday', color: 'blue', keywords: ['workday', 'hr', 'leave', 'expenses', 'payroll'] },
        { title: 'Airtable', cat: 'External System', url: '#airtable', color: 'blue', keywords: ['airtable', 'database', 'tracker'] },
    ];
    
    const input = document.getElementById('searchInput');
    const resultsEl = document.getElementById('results');
    const hintEl = document.getElementById('hint');
    
    function search(query) {
        if (!query.trim()) {
            resultsEl.classList.remove('visible');
            hintEl.style.display = 'block';
            return;
        }
        
        const q = query.toLowerCase().trim();
        const matches = SEARCH_INDEX.filter(item => {
            if (item.title.toLowerCase().includes(q)) return true;
            if (item.cat.toLowerCase().includes(q)) return true;
            if (item.keywords.some(kw => kw.includes(q))) return true;
            return false;
        }).slice(0, 8);
        
        hintEl.style.display = 'none';
        
        if (matches.length === 0) {
            resultsEl.innerHTML = '<div class="no-results">No results found</div>';
        } else {
            resultsEl.innerHTML = matches.map(item => `
                <a href="${item.url}" class="result-item" target="${item.url.startsWith('http') ? '_blank' : '_top'}">
                    <div class="result-dot ${item.color}"></div>
                    <div class="result-content">
                        <div class="result-title">${item.title}</div>
                        <div class="result-cat">${item.cat}</div>
                    </div>
                    <span class="result-arrow">→</span>
                </a>
            `).join('');
        }
        
        resultsEl.classList.add('visible');
    }
    
    input.addEventListener('input', (e) => search(e.target.value));
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const firstResult = resultsEl.querySelector('.result-item');
            if (firstResult) firstResult.click();
        }
    });
</script>

</body>
</html>
