<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Navigation | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --dmg-blue-alpha: rgba(33, 160, 216, 0.25);
            --editorial: #E94B4B;
            --production: #06402B;
            --design: #F2C316;
            --creative: #E6468B;
            --text-main: #1C1C1C;
            --text-sub: #6B7280;
            --border-standard: #E5E7EB;
            --ui-stroke: 1.5px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; padding: 12px; }
        
        .sidebar { width: 100%; display: flex; flex-direction: column; gap: 24px; }
        
        /* Section Headers */
        .section-header { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-standard);
        }
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 14px; height: 14px; }
        .dot-static { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; opacity: 0.8; }
        .section-title { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sub); }

        /* Blue Outlined Items (For Operations & Hubs) */
        .nav-item { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            padding: 11px 14px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s ease;
            background: #FFF;
            border: var(--ui-stroke) solid var(--dmg-blue-alpha); /* Consistent Blue Outline */
            margin-bottom: 8px;
        }
        .nav-item:hover { transform: translateX(4px); border-color: var(--dmg-blue); background: #F0F9FF; box-shadow: 0 4px 12px rgba(33, 160, 216, 0.1); }
        
        .indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .indicator.blue { background: var(--dmg-blue); }
        .indicator.red { background: var(--editorial); }
        .indicator.green { background: var(--production); }
        .indicator.yellow { background: var(--design); }
        .indicator.dark { background: var(--text-main); }

        .external-icon { font-size: 10px; margin-left: auto; opacity: 0.4; }

        /* Team Cards Grid (Standard Borders) */
        .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .team-card { 
            display: flex; 
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            border-radius: 10px;
            border: var(--ui-stroke) solid var(--border-standard);
            text-decoration: none;
            transition: 0.2s;
            background: #FFF;
        }
        .team-card:hover { transform: translateY(-2px); border-color: var(--dmg-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .team-card.red { border-top: 3px solid var(--editorial); }
        .team-card.green { border-top: 3px solid var(--production); }
        .team-card.pink { border-top: 3px solid var(--creative); }
        .team-card.yellow { border-top: 3px solid var(--design); }
        .team-card.blue { border-top: 3px solid var(--dmg-blue); }
        
        .team-name { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-main); }

        /* Sub-labels for clarity within Operation section */
        .op-label { font-size: 9px; font-weight: 800; color: #BBB; text-transform: uppercase; margin-bottom: 8px; padding-left: 4px; margin-top: 4px; }
    </style>
</head>
<body>

        </div>
        
        <div class="op-label">Control Centres</div>
        <a href="https://www.notion.so/606268e73f174c85b47e18f89620cb18" target="_top" class="nav-item">

        <a href="#notion-guide" class="nav-item">

</div>

</body>
</html>
