<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lately on DMG Header | DMG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .banner-wrapper {
            width: 100%;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 40px 24px 0;
            box-sizing: border-box;
            background: #FFF;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .banner-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.4;
            pointer-events: none;
        }
        
        .content-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
            flex: 1;
            padding-left: 2px;
        }
        .main-headline {
            font-size: 72px;
            font-weight: 900;
            line-height: 0.92;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: -0.04em;
            white-space: nowrap;
        }
        .text-solid { color: var(--ink); }
        .outlined {
            color: transparent;
            -webkit-text-stroke: 2px var(--ink);
            opacity: 0.2;
        }
        .text-blue { color: var(--dmg-blue); }
        
        .stats-block {
            display: flex;
            align-items: center;
            gap: 28px;
            z-index: 2;
            padding-left: 32px;
            border-left: 1px solid var(--border);
            height: 120px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .stat-number {
            font-size: 36px;
            font-weight: 900;
            color: var(--dmg-blue);
            line-height: 1;
        }
        .stat-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-sub);
            margin-top: 4px;
        }
        
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 8px);
            gap: 4px;
            margin-left: 20px;
        }
        .dot-grid span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dmg-blue);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body>
    <div class="banner-wrapper fade-in">
        <div class="content-left">
            <div class="main-headline">
                <span class="outlined">Lately on</span><br />
                <span class="text-blue">DMG</span>
            </div>
        </div>
        <div class="stats-block">
            <div class="stat-item">
                <div class="stat-number">24</div>
                <div class="stat-label">Posts Today</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">8</div>
                <div class="stat-label">Active Now</div>
            </div>
            <div class="dot-grid">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>
</body>
</html>
