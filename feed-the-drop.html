<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Drop | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }
        .widget-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--team-production);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .header-title { font-size: 15px; font-weight: 900; color: var(--ink); }
        .header-sub { font-size: 11px; color: var(--ink-sub); margin-left: auto; }
        
        .feed-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: #F0F0F0;
        }
        
        .post-card {
            padding: 20px 24px;
            background: #FFF;
            transition: background 0.15s ease;
        }
        .post-card:hover { background: var(--bg-soft); }
        
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #FFF;
            flex-shrink: 0;
            cursor: pointer;
        }
        .post-meta { flex: 1; min-width: 0; }
        .post-author { font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer; }
        .post-author:hover { color: var(--dmg-blue); }
        .post-timestamp { font-size: 11px; color: var(--ink-sub); }
        
        /* Video thumbnail */
        .video-preview {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 14px;
            background: #1C1C1C;
        }
        .video-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .video-play-btn:hover { transform: translate(-50%, -50%) scale(1.1); }
        .video-stats {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: flex;
            gap: 10px;
        }
        .video-stat {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            background: rgba(0,0,0,0.7);
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
            color: #FFF;
        }
        
        .post-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .post-desc {
            font-size: 13px;
            color: var(--ink-sub);
            line-height: 1.5;
            margin-bottom: 12px;
        }
        
        /* Milestone banner */
        .milestone-banner {
            background: linear-gradient(135deg, var(--team-production) 0%, #2d8a34 100%);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 14px;
            color: #FFF;
            text-align: center;
        }
        .milestone-icon { font-size: 36px; margin-bottom: 10px; }
        .milestone-title { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
        .milestone-project { font-size: 13px; opacity: 0.9; }
        
        /* Reactions */
        .post-reactions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .reaction-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 99px;
            background: #FFF;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .reaction-btn:hover { background: var(--bg-soft); border-color: #DDD; }
        .reaction-btn.active { background: #FEF3C7; border-color: #F59E0B; }
        .reaction-count { font-size: 12px; font-weight: 700; color: var(--ink); }
        .comment-btn { margin-left: auto; color: var(--ink-sub); }
        
        .demo-badge {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: #E6468B;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        @media (max-width: 700px) {
            .feed-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Social Video': '#F2C316', 'Operations': '#9333EA', 'Sales': '#F97316'
        };

        const DEMO_POSTS = [
            { id: 'd1', type: 'video', authorId: 'mimi', authorName: 'Mimi Yates', authorTeam: 'Social', title: 'Sky Vegas "Little Wins" Street Talk', desc: 'Just dropped! We hit the streets to ask people about their small victories. The reactions are gold.', thumbnail: 'https://picsum.photos/seed/skyvegas/800/450', views: '250K', likes: '18.2K', timestamp: Date.now() - 3600000, reactions: { '🔥': ['nick','ana','hugo'], '❤️': ['dan','kaylee'] }, comments: [{ authorName: 'Nick B', text: 'The hook at 0:03 is perfect' }] },
            { id: 'd2', type: 'milestone', authorId: 'system', authorName: 'DMG System', authorTeam: 'Operations', title: 'Published', project: 'Chery 24 Hours Campaign', timestamp: Date.now() - 7200000, reactions: { '🎉': ['ana','nick','hugo','mimi'], '👏': ['dan'] }, comments: [] },
            { id: 'd3', type: 'video', authorId: 'dan', authorName: 'Dan Quinnell', authorTeam: 'Social', title: 'McDonald\'s Investigates: Japan vs UK', desc: 'Does the Big Mac really taste different in Tokyo? We flew out to find out. 4.2M views and counting.', thumbnail: 'https://picsum.photos/seed/mcdonalds/800/450', views: '4.2M', likes: '312K', timestamp: Date.now() - 86400000, reactions: { '🔥': ['ana','nick','hugo','mimi','kaylee','sophia'], '😂': ['isobel'] }, comments: [{ authorName: 'Hugo M', text: 'The Japan segment was *chefs kiss*' }] },
            { id: 'd4', type: 'milestone', authorId: 'system', authorName: 'DMG System', authorTeam: 'Operations', title: 'Creative Approved', project: 'Wuthering Heights Valentine\'s', timestamp: Date.now() - 172800000, reactions: { '❤️': ['ana','nick'], '🎉': ['hugo'] }, comments: [] }
        ];

        let posts = DEMO_POSTS;
        let isDemo = true;
        const root = document.getElementById('root');

        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = n => n.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
        const timeAgo = ts => {
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 60) return 'just now';
            const m = Math.floor(s / 60); if (m < 60) return `${m}m`;
            const h = Math.floor(m / 60); if (h < 24) return `${h}h`;
            return `${Math.floor(h / 24)}d`;
        };
        const countReactions = r => Object.values(r || {}).reduce((a, b) => a + b.length, 0);

        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">The Drop</h2>
                        <span class="header-sub">Video Drops & Milestones</span>
                        ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    </div>
                    <div class="feed-list">
                        ${posts.map(p => p.type === 'video' ? renderVideo(p) : renderMilestone(p)).join('')}
                    </div>
                </div>
            `;
        }

        function renderVideo(p) {
            const total = countReactions(p.reactions);
            return `
                <div class="post-card" data-id="${p.id}">
                    <div class="post-header">
                        <div class="post-avatar" style="background:${getTeamColor(p.authorTeam)}">${getInitials(p.authorName)}</div>
                        <div class="post-meta">
                            <div class="post-author">${p.authorName}</div>
                            <div class="post-timestamp">${timeAgo(p.timestamp)}</div>
                        </div>
                    </div>
                    <div class="video-preview">
                        <img src="${p.thumbnail}" alt="${p.title}">
                        <div class="video-play-btn">▶</div>
                        <div class="video-stats">
                            <div class="video-stat">👁 ${p.views}</div>
                            <div class="video-stat">❤️ ${p.likes}</div>
                        </div>
                    </div>
                    <div class="post-title">${p.title}</div>
                    <div class="post-desc">${p.desc}</div>
                    <div class="post-reactions">
                        ${['❤️','🔥','👏','🎉'].map(e => {
                            const c = p.reactions?.[e]?.length || 0;
                            return `<button class="reaction-btn ${c > 0 ? 'active' : ''}"><span>${e}</span>${c > 0 ? `<span class="reaction-count">${c}</span>` : ''}</button>`;
                        }).join('')}
                        <button class="reaction-btn comment-btn">💬 ${p.comments?.length || 0}</button>
                    </div>
                </div>
            `;
        }

        function renderMilestone(p) {
            const total = countReactions(p.reactions);
            return `
                <div class="post-card" data-id="${p.id}">
                    <div class="post-header">
                        <div class="post-avatar" style="background:var(--team-production)">🏆</div>
                        <div class="post-meta">
                            <div class="post-author">Project Update</div>
                            <div class="post-timestamp">${timeAgo(p.timestamp)}</div>
                        </div>
                    </div>
                    <div class="milestone-banner">
                        <div class="milestone-icon">🎉</div>
                        <div class="milestone-title">${p.title}</div>
                        <div class="milestone-project">${p.project}</div>
                    </div>
                    <div class="post-reactions">
                        ${['🎉','👏','❤️','🔥'].map(e => {
                            const c = p.reactions?.[e]?.length || 0;
                            return `<button class="reaction-btn ${c > 0 ? 'active' : ''}"><span>${e}</span>${c > 0 ? `<span class="reaction-count">${c}</span>` : ''}</button>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        onAuthStateChanged(auth, u => { if (u) render(); else signInAnonymously(auth); });
    </script>
</body>
</html>
