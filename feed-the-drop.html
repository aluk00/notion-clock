<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Drop | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        .widget-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            background: #FFF;
            z-index: 10;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--team-production);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .header-title { font-size: 18px; font-weight: 900; color: var(--ink); }
        .header-sub { font-size: 12px; color: var(--ink-sub); margin-left: auto; }
        
        .feed-list {
            display: flex;
            flex-direction: column;
        }
        
        .post-card {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }
        .post-card:last-child { border-bottom: none; }
        
        .post-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .post-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #FFF;
            cursor: pointer;
        }
        .post-meta { flex: 1; }
        .post-author { font-size: 16px; font-weight: 700; color: var(--ink); cursor: pointer; }
        .post-author:hover { color: var(--dmg-blue); }
        .post-timestamp { font-size: 12px; color: var(--ink-sub); }
        
        /* Video card */
        .video-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .video-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: var(--bg-soft);
        }
        .video-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .video-card:hover .video-play { background: rgba(0,0,0,0.85); transform: translate(-50%, -50%) scale(1.1); }
        .video-play::after {
            content: '';
            border-style: solid;
            border-width: 14px 0 14px 24px;
            border-color: transparent transparent transparent #FFF;
            margin-left: 6px;
        }
        .video-stats {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: flex;
            gap: 12px;
        }
        .video-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.75);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #FFF;
        }
        
        .post-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .post-desc {
            font-size: 14px;
            line-height: 1.6;
            color: var(--ink-sub);
            margin-bottom: 16px;
        }
        
        /* Milestone banner */
        .milestone-banner {
            background: linear-gradient(135deg, var(--team-production) 0%, #2D8A32 100%);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            margin-bottom: 16px;
        }
        .milestone-icon { font-size: 48px; margin-bottom: 12px; }
        .milestone-status { font-size: 24px; font-weight: 900; color: #FFF; margin-bottom: 6px; }
        .milestone-project { font-size: 14px; color: rgba(255,255,255,0.85); }
        
        /* Reactions */
        .post-reactions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .reaction-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 99px;
            background: #FFF;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .reaction-btn:hover { background: var(--bg-soft); border-color: #DDD; }
        .reaction-btn.active { background: #FEF3C7; border-color: #F59E0B; }
        .reaction-count { font-size: 13px; font-weight: 700; color: var(--ink); }
        .comment-btn { margin-left: auto; color: var(--ink-sub); }
        
        .demo-badge {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: var(--team-production);
            padding: 4px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Operations': '#9333EA'
        };

        const DEMO_POSTS = [
            { type: 'video', author: {n:'Mimi Yates',t:'Social'}, time: '1h', thumb: 'https://picsum.photos/seed/skyvegas/800/450', views: '250K', likes: '18.2K', title: 'Sky Vegas "Little Wins" Street Talk', desc: 'Just dropped! We hit the streets to ask people about their small victories. The reactions are gold.', reactions: {'❤️':2,'🔥':3,'👏':1,'🎉':2} },
            { type: 'milestone', project: 'Chery 24 Hours Campaign', status: 'Published', time: '2h', reactions: {'🎉':4,'👏':1,'❤️':2,'🔥':1} },
            { type: 'video', author: {n:'Dan Quinnell',t:'Social'}, time: '1d', thumb: 'https://picsum.photos/seed/3peaks/800/450', views: '4.2M', likes: '312K', title: '3 Peaks Challenge: Is It Actually Possible?', desc: 'We climbed Ben Nevis, Scafell Pike, and Snowdon in 24 hours. Here\'s what happened.', reactions: {'🔥':8,'❤️':5,'👏':4,'🎉':3} },
            { type: 'milestone', project: 'Wuthering Heights Valentine\'s', status: 'Creative Approved', time: '2d', reactions: {'🎉':1,'❤️':2} },
            { type: 'video', author: {n:'Kaylee A',t:'Editorial'}, time: '2d', thumb: 'https://picsum.photos/seed/mcdonalds/800/450', views: '1.8M', likes: '89K', title: 'McDonald\'s Japan vs UK: Taste Test', desc: 'We flew to Tokyo to settle this once and for all. Is the Big Mac actually better abroad?', reactions: {'🔥':6,'😂':4,'❤️':2} },
            { type: 'milestone', project: 'JAECOO 24 Hours to Anywhere', status: 'In Production', time: '3d', reactions: {'👏':3,'🔥':2} },
            { type: 'video', author: {n:'Sophia S',t:'Editorial'}, time: '3d', thumb: 'https://picsum.photos/seed/money/800/450', views: '890K', likes: '45K', title: 'The Little Treat Economy Explained', desc: 'Why Gen Z spends more on "little treats" than millennials. This Is Money investigates.', reactions: {'💡':5,'👏':3,'🔥':2} },
            { type: 'video', author: {n:'Hugo M',t:'Production'}, time: '4d', thumb: 'https://picsum.photos/seed/bts/800/450', views: '156K', likes: '12K', title: 'Behind the Scenes: Street Talks Setup', desc: 'Ever wondered how we film Street Talks? Here\'s a look at our mobile production rig.', reactions: {'❤️':4,'👏':2,'🔥':1} },
            { type: 'milestone', project: 'Trading 212 Headlines', status: 'Published', time: '5d', reactions: {'🎉':2,'👏':1} }
        ];

        const root = document.getElementById('root');
        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = n => n.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);

        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">The Drop</h2>
                        <span class="header-sub">Video Drops & Milestones</span>
                        <span class="demo-badge">Preview</span>
                    </div>
                    <div class="feed-list">
                        ${DEMO_POSTS.map(p => renderPost(p)).join('')}
                    </div>
                </div>
            `;
        }

        function renderPost(p) {
            if (p.type === 'video') {
                return `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-avatar" style="background:${getTeamColor(p.author.t)}">${getInitials(p.author.n)}</div>
                            <div class="post-meta">
                                <div class="post-author">${p.author.n}</div>
                                <div class="post-timestamp">${p.time}</div>
                            </div>
                        </div>
                        <div class="video-card">
                            <img class="video-thumb" src="${p.thumb}" alt="">
                            <div class="video-play"></div>
                            <div class="video-stats">
                                <div class="video-stat">👁 ${p.views}</div>
                                <div class="video-stat">❤️ ${p.likes}</div>
                            </div>
                        </div>
                        <div class="post-title">${p.title}</div>
                        <div class="post-desc">${p.desc}</div>
                        <div class="post-reactions">
                            ${['❤️','🔥','👏','🎉','😂','💡'].map(e => {
                                const c = p.reactions?.[e] || 0;
                                return `<button class="reaction-btn ${c > 0 ? 'active' : ''}"><span>${e}</span>${c > 0 ? `<span class="reaction-count">${c}</span>` : ''}</button>`;
                            }).join('')}
                            <button class="reaction-btn comment-btn">💬</button>
                        </div>
                    </div>
                `;
            }
            if (p.type === 'milestone') {
                return `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-avatar" style="background:var(--team-production)">🎯</div>
                            <div class="post-meta">
                                <div class="post-author">Project Update</div>
                                <div class="post-timestamp">${p.time}</div>
                            </div>
                        </div>
                        <div class="milestone-banner">
                            <div class="milestone-icon">🎉</div>
                            <div class="milestone-status">${p.status}</div>
                            <div class="milestone-project">${p.project}</div>
                        </div>
                        <div class="post-reactions">
                            ${['🎉','👏','❤️','🔥'].map(e => {
                                const c = p.reactions?.[e] || 0;
                                return `<button class="reaction-btn ${c > 0 ? 'active' : ''}"><span>${e}</span>${c > 0 ? `<span class="reaction-count">${c}</span>` : ''}</button>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            return '';
        }

        onAuthStateChanged(auth, u => { if (u) render(); else signInAnonymously(auth); });
    </script>
</body>
</html>
