<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Drop | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 420px;
            overflow: hidden;
        }
        .widget-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--team-editorial);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .header-title {
            font-size: 13px;
            font-weight: 900;
            color: var(--ink);
            margin: 0;
        }
        .header-sub {
            font-size: 9px;
            color: var(--ink-sub);
            margin-left: auto;
        }
        
        .feed-list {
            max-height: 500px;
            overflow-y: auto;
        }
        
        /* Post Card */
        .post-card {
            padding: 16px 18px;
            border-bottom: 1px solid #F5F5F5;
            transition: background 0.15s ease;
        }
        .post-card:hover { background: var(--bg-soft); }
        .post-card:last-child { border-bottom: none; }
        
        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #FFF;
            flex-shrink: 0;
        }
        .post-meta {
            flex: 1;
            min-width: 0;
        }
        .post-author {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
        }
        .post-author:hover {
            color: var(--dmg-blue);
            cursor: pointer;
        }
        .post-timestamp {
            font-size: 10px;
            color: var(--ink-sub);
        }
        .post-type {
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--team-editorial);
            color: #FFF;
        }
        .post-type.milestone { background: var(--team-production); }
        .post-type.video { background: var(--team-editorial); }
        
        .post-content {
            font-size: 13px;
            line-height: 1.5;
            color: var(--ink);
            margin-bottom: 12px;
        }
        .post-content strong {
            font-weight: 700;
        }
        
        /* Video Preview */
        .video-preview {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
            aspect-ratio: 16/9;
        }
        .video-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .video-play:hover {
            background: #FFF;
            transform: translate(-50%, -50%) scale(1.1);
        }
        .video-stats {
            position: absolute;
            bottom: 8px;
            left: 8px;
            display: flex;
            gap: 8px;
        }
        .video-stat {
            background: rgba(0,0,0,0.7);
            color: #FFF;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }
        
        /* Milestone Card */
        .milestone-banner {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .milestone-icon {
            font-size: 28px;
        }
        .milestone-text {
            flex: 1;
        }
        .milestone-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--team-production);
        }
        .milestone-sub {
            font-size: 11px;
            color: #2E7D32;
        }
        
        /* Reactions */
        .post-reactions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reaction-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 99px;
            background: #FFF;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .reaction-btn:hover {
            background: var(--bg-soft);
            border-color: #DDD;
        }
        .reaction-btn.active {
            background: #FEF3C7;
            border-color: #F59E0B;
        }
        .reaction-count {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
        }
        .comment-btn {
            margin-left: auto;
            color: var(--ink-sub);
        }
        .comment-btn:hover {
            color: var(--dmg-blue);
        }
        
        /* Comments Preview */
        .comments-preview {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #F0F0F0;
        }
        .comment-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .comment-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 800;
            color: #FFF;
            flex-shrink: 0;
        }
        .comment-body {
            flex: 1;
            background: var(--bg-soft);
            padding: 8px 10px;
            border-radius: 10px;
        }
        .comment-author {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
        }
        .comment-text {
            font-size: 12px;
            color: var(--ink);
            margin-top: 2px;
        }
        .view-all-comments {
            font-size: 11px;
            color: var(--dmg-blue);
            font-weight: 600;
            cursor: pointer;
        }
        
        .demo-badge {
            font-size: 7px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: #E6468B;
            padding: 3px 6px;
            border-radius: 4px;
        }
        
        .empty-state {
            padding: 40px 20px;
            text-align: center;
        }
        .empty-icon { font-size: 32px; margin-bottom: 12px; }
        .empty-title { font-size: 14px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
        .empty-sub { font-size: 11px; color: var(--ink-sub); }
        
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: #FFF;
            padding: 12px 24px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.active { bottom: 30px; opacity: 1; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="toast" id="toast">Reacted!</div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, doc, updateDoc, arrayUnion, arrayRemove, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Social Video': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316'
        };

        // Demo posts
        const DEMO_POSTS = [
            {
                id: 'demo-1',
                type: 'video',
                authorId: 'mimi',
                authorName: 'Mimi Yates',
                authorTeam: 'Social',
                content: '🎬 Just dropped! Our Sky Vegas "Little Wins" Street Talk is now LIVE. Already at 250k views in 3 hours!',
                videoUrl: '#',
                thumbnail: 'https://picsum.photos/seed/skyvegas/400/225',
                views: '250K',
                likes: 12,
                timestamp: Date.now() - 3600000,
                reactions: { '❤️': ['nick', 'hugo'], '🔥': ['ana', 'isobel', 'dan'], '👏': ['kaylee'] },
                comments: [
                    { authorName: 'Nick B', authorTeam: 'Creative', text: 'The hook on this is incredible 🔥' }
                ]
            },
            {
                id: 'demo-2',
                type: 'milestone',
                authorId: 'system',
                authorName: 'DMG Bot',
                authorTeam: 'Operations',
                content: '🎉 <strong>Chery Campaign</strong> just hit Creative Approved! Moving to Production.',
                milestone: {
                    icon: '✅',
                    title: 'Creative Approved',
                    project: 'Chery x DMG New Media'
                },
                timestamp: Date.now() - 7200000,
                reactions: { '🎉': ['ana', 'nick', 'hugo', 'isobel'] },
                comments: []
            },
            {
                id: 'demo-3',
                type: 'video',
                authorId: 'dan',
                authorName: 'Dan Quinnell',
                authorTeam: 'Social',
                content: 'Mail Investigates: "Does McDonald\'s taste better abroad?" is officially our best performer this quarter. 4.2M views and counting.',
                videoUrl: '#',
                thumbnail: 'https://picsum.photos/seed/mcdonalds/400/225',
                views: '4.2M',
                likes: 89,
                timestamp: Date.now() - 86400000,
                reactions: { '❤️': ['mimi', 'kaylee', 'henry'], '🔥': ['nick', 'hugo', 'ana', 'sophia'] },
                comments: [
                    { authorName: 'Hugo M', authorTeam: 'Production', text: 'The Japan segment was *chefs kiss*' },
                    { authorName: 'Ana', authorTeam: 'Creative', text: 'This is the format to beat' }
                ]
            },
            {
                id: 'demo-4',
                type: 'milestone',
                authorId: 'system',
                authorName: 'DMG Bot',
                authorTeam: 'Operations',
                content: '📹 <strong>Wuthering Heights - Love Notes Ep. 1</strong> is now Published!',
                milestone: {
                    icon: '🎬',
                    title: 'Video Published',
                    project: 'Wuthering Heights x Valentine\'s'
                },
                timestamp: Date.now() - 172800000,
                reactions: { '❤️': ['mimi', 'kaylee', 'sophia'], '🎉': ['nick'] },
                comments: []
            }
        ];

        let currentUser = null;
        let posts = [];
        let isDemo = true;

        const root = document.getElementById('root');

        function getTeamColor(team) {
            return TEAM_COLORS[team] || '#21a0d8';
        }

        function getInitials(name) {
            const parts = name.split(' ');
            return parts.map(p => p[0]).join('').toUpperCase().slice(0, 2);
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h`;
            const days = Math.floor(hours / 24);
            return `${days}d`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 2000);
        }

        function countReactions(reactions) {
            let total = 0;
            Object.values(reactions || {}).forEach(arr => total += arr.length);
            return total;
        }

        function hasReacted(reactions, emoji, userId) {
            return reactions && reactions[emoji] && reactions[emoji].includes(userId);
        }

        function render() {
            const displayPosts = posts.length > 0 ? posts : DEMO_POSTS;

            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">The Drop</h2>
                        <span class="header-sub">Videos & Milestones</span>
                        ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    </div>
                    
                    <div class="feed-list">
                        ${displayPosts.length === 0 ? `
                            <div class="empty-state">
                                <div class="empty-icon">📺</div>
                                <div class="empty-title">Nothing yet</div>
                                <div class="empty-sub">Video drops and milestones will appear here</div>
                            </div>
                        ` : displayPosts.map(post => renderPost(post)).join('')}
                    </div>
                </div>
            `;
        }

        function renderPost(post) {
            const totalReactions = countReactions(post.reactions);
            const userId = currentUser?.id || 'demo';

            return `
                <div class="post-card" data-id="${post.id}">
                    <div class="post-header">
                        <div class="post-avatar" style="background: ${getTeamColor(post.authorTeam)}">
                            ${post.authorId === 'system' ? '🤖' : getInitials(post.authorName)}
                        </div>
                        <div class="post-meta">
                            <div class="post-author" onclick="window.viewProfile('${post.authorId}')">${post.authorName}</div>
                            <div class="post-timestamp">${timeAgo(post.timestamp)}</div>
                        </div>
                        <span class="post-type ${post.type}">${post.type === 'video' ? '📺 Video' : '🏆 Milestone'}</span>
                    </div>
                    
                    <div class="post-content">${post.content}</div>
                    
                    ${post.type === 'video' ? `
                        <div class="video-preview">
                            <img src="${post.thumbnail}" class="video-thumbnail" alt="Video thumbnail">
                            <div class="video-play" onclick="window.playVideo('${post.videoUrl}')">▶</div>
                            <div class="video-stats">
                                <span class="video-stat">👁 ${post.views}</span>
                                <span class="video-stat">❤️ ${post.likes}</span>
                            </div>
                        </div>
                    ` : ''}
                    
                    ${post.type === 'milestone' && post.milestone ? `
                        <div class="milestone-banner">
                            <div class="milestone-icon">${post.milestone.icon}</div>
                            <div class="milestone-text">
                                <div class="milestone-title">${post.milestone.title}</div>
                                <div class="milestone-sub">${post.milestone.project}</div>
                            </div>
                        </div>
                    ` : ''}
                    
                    <div class="post-reactions">
                        ${['❤️', '🔥', '👏', '🎉'].map(emoji => {
                            const count = post.reactions?.[emoji]?.length || 0;
                            const active = hasReacted(post.reactions, emoji, userId);
                            return `
                                <button class="reaction-btn ${active ? 'active' : ''}" 
                                        onclick="window.toggleReaction('${post.id}', '${emoji}')">
                                    <span>${emoji}</span>
                                    ${count > 0 ? `<span class="reaction-count">${count}</span>` : ''}
                                </button>
                            `;
                        }).join('')}
                        <button class="reaction-btn comment-btn" onclick="window.openComments('${post.id}')">
                            💬 ${post.comments?.length || 0}
                        </button>
                    </div>
                    
                    ${post.comments && post.comments.length > 0 ? `
                        <div class="comments-preview">
                            ${post.comments.slice(0, 2).map(comment => `
                                <div class="comment-item">
                                    <div class="comment-avatar" style="background: ${getTeamColor(comment.authorTeam)}">
                                        ${getInitials(comment.authorName)}
                                    </div>
                                    <div class="comment-body">
                                        <div class="comment-author">${comment.authorName}</div>
                                        <div class="comment-text">${comment.text}</div>
                                    </div>
                                </div>
                            `).join('')}
                            ${post.comments.length > 2 ? `
                                <div class="view-all-comments" onclick="window.openComments('${post.id}')">
                                    View all ${post.comments.length} comments
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        window.toggleReaction = async (postId, emoji) => {
            const userId = currentUser?.id || 'demo';
            
            if (isDemo) {
                // Update local demo data
                const post = DEMO_POSTS.find(p => p.id === postId);
                if (post) {
                    if (!post.reactions) post.reactions = {};
                    if (!post.reactions[emoji]) post.reactions[emoji] = [];
                    
                    const idx = post.reactions[emoji].indexOf(userId);
                    if (idx >= 0) {
                        post.reactions[emoji].splice(idx, 1);
                    } else {
                        post.reactions[emoji].push(userId);
                    }
                    render();
                    showToast(idx >= 0 ? 'Removed' : `${emoji}`);
                }
                return;
            }

            try {
                const postRef = doc(db, "artifacts", appId, "public", "data", "feed_posts", postId);
                const postSnap = await getDoc(postRef);
                if (!postSnap.exists()) return;
                
                const reactions = postSnap.data().reactions || {};
                const hasIt = reactions[emoji]?.includes(userId);
                
                await updateDoc(postRef, {
                    [`reactions.${emoji}`]: hasIt ? arrayRemove(userId) : arrayUnion(userId)
                });
                showToast(hasIt ? 'Removed' : `${emoji}`);
            } catch (e) {
                console.error('Failed to react:', e);
            }
        };

        window.viewProfile = (profileId) => {
            if (profileId === 'system') return;
            window.open(`profile-public-modal.html?id=${profileId}`, '_blank');
        };

        window.playVideo = (url) => {
            if (url && url !== '#') {
                window.open(url, '_blank');
            } else {
                showToast('Video preview');
            }
        };

        window.openComments = (postId) => {
            showToast('Comments panel coming soon');
        };

        async function loadPosts() {
            if (isDemo) {
                posts = DEMO_POSTS;
                render();
                return;
            }

            try {
                const q = query(
                    collection(db, "artifacts", appId, "public", "data", "feed_posts"),
                    where("type", "in", ["video", "milestone"]),
                    orderBy("timestamp", "desc"),
                    limit(20)
                );

                onSnapshot(q, (snap) => {
                    posts = [];
                    snap.forEach(d => posts.push({ id: d.id, ...d.data() }));
                    render();
                });
            } catch (e) {
                console.error('Failed to load posts:', e);
                posts = DEMO_POSTS;
                render();
            }
        }

        async function resolveIdentity(authUser) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');

            if (paramId || (authUser && authUser.email && !authUser.isAnonymous)) {
                try {
                    const staffSnap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                    let found = null;
                    staffSnap.forEach(d => {
                        const data = d.data();
                        if (d.id === paramId || data.email === authUser?.email) {
                            found = { id: d.id, ...data };
                        }
                    });
                    if (found) {
                        currentUser = found;
                        isDemo = false;
                    }
                } catch (e) {
                    console.log('Identity resolution failed:', e);
                }
            }

            loadPosts();
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                resolveIdentity(user);
            } else {
                signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
