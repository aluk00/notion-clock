<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Pulse | DMG New Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --hero: #06402B;
            --hero-light: #DCFCE7;
            --design: #F2C316;
            --border: #EAECEF;
            --text-main: #1C1C1C;
            --text-sub: #6b7280;
            --bg-grey: #f9fafb;
            --done: #10B981;
            --busy: #F59E0B;
            --full: #EF4444;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background-color: transparent; margin: 0; padding: 20px; color: var(--text-main); }
        
        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        .header-left { display: flex; align-items: center; gap: 1.25rem; }
        .title-text { font-size: 3rem; font-weight: 800; letter-spacing: -0.04em; text-transform: uppercase; line-height: 1; color: var(--text-main); transform: scaleY(0.9); transform-origin: left center; }
        
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 38px; height: 38px; }
        .dot { width: 100%; height: 100%; background-color: var(--hero); border-radius: 50%; }
        @keyframes heartbeat { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        .dot-anim { animation: heartbeat 3s infinite ease-in-out; }...
