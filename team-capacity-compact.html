<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Capacity | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --editorial: #E94B4B;
            --creative: #E6468B;
            --production: #43B049;
            --design: #8B5CF6;
            --social: #F2C316;
            --operations: #21A0D8;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --success: #10B981;
            --warning: #F59E0B;
            --urgent: #EF4444;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; }
        
        .widget { background: #FFF; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
        
        .header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 16px; height: 16px; }
        .dot { width: 100%; height: 100%; border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 12px; font-weight: 900; color: var(--ink); text-transform: uppercase; }
        
        .capacity-badge { padding: 4px 10px; border-radius: 20px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .capacity-badge.good { background: #D1FAE5; color: var(--success); }
        .capacity-badge.warning { background: #FEF3C7; color: #92400E; }
        .capacity-badge.full { background: #FEE2E2; color: var(--urgent); }
        
        .body { padding: 12px 16px; }
        
        .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        
        .member-card { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg-soft); border-radius: 10px; }
        
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #FFF; flex-shrink: 0; }
        
        .member-info { flex: 1; min-width: 0; }
        .member-name { font-size: 11px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .member-status { font-size: 9px; color: var(--ink-sub); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .status-dot.available { background: var(--success); }
        .status-dot.busy { background: var(--warning); }
        .status-dot.maxed { background: var(--urgent); }
        .status-dot.away { background: #9CA3AF; }
        
        .workload-bar { height: 4px; background: #E5E7EB; border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .workload-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
        .workload-fill.low { background: var(--success); }
        .workload-fill.medium { background: var(--warning); }
        .workload-fill.high { background: var(--urgent); }
        
        .footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .footer-stat { font-size: 10px; color: var(--ink-sub); }
        .footer-stat strong { color: var(--ink); }
        
        .empty { padding: 30px; text-align: center; color: var(--ink-sub); font-size: 11px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const TEAM_COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Design': '#8B5CF6',
            'Social': '#F2C316',
            'Operations': '#21A0D8'
        };
        
        // Demo data for fallback
        const DEMO_STAFF = {
            'Production': [
                { firstName: 'Sarah', lastName: 'Mitchell', workload: 60, status: 'Office' },
                { firstName: 'James', lastName: 'Cooper', workload: 85, status: 'Shoot' },
                { firstName: 'Emma', lastName: 'Wilson', workload: 40, status: 'WFH' },
            ],
            'Design': [
                { firstName: 'Alex', lastName: 'Chen', workload: 75, status: 'Office' },
                { firstName: 'Maya', lastName: 'Patel', workload: 50, status: 'WFH' },
            ],
            'Editorial': [
                { firstName: 'Ellie', lastName: 'Beetham', workload: 70, status: 'Office' },
                { firstName: 'Dan', lastName: 'Quinnell', workload: 90, status: 'Shoot' },
                { firstName: 'Kaylee', lastName: 'Abrahams', workload: 55, status: 'Office' },
            ],
            'Creative': [
                { firstName: 'Ana', lastName: 'Murphy', workload: 65, status: 'Office' },
                { firstName: 'Nick', lastName: 'Bramley', workload: 80, status: 'WFH' },
                { firstName: 'Hugo', lastName: 'Torres', workload: 45, status: 'Office' },
            ],
        };
        
        const getInitials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();
        
        function App() {
            const [staff, setStaff] = useState([]);
            const [rota, setRota] = useState([]);
            const [loading, setLoading] = useState(true);
            
            const urlParams = new URLSearchParams(window.location.search);
            const team = urlParams.get('team') || 'Production';
            const teamColor = TEAM_COLORS[team] || '#21A0D8';
            
            useEffect(() => {
                // Try Firestore with direct collection path
                const unsub1 = db.collection('staff_directory')
                    .onSnapshot(snap => {
                        if (!snap.empty) {
                            setStaff(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }
                        setLoading(false);
                    }, err => {
                        console.log('Using demo data:', err.message);
                        setLoading(false);
                    });
                
                const unsub2 = db.collection('rota_submissions')
                    .onSnapshot(snap => {
                        setRota(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, () => {});
                
                return () => { unsub1(); unsub2(); };
            }, []);
            
            const teamMembers = useMemo(() => {
                // Use Firestore data if available, otherwise demo
                const firestoreMembers = staff.filter(s => s.team === team);
                if (firestoreMembers.length > 0) {
                    return firestoreMembers.map(m => ({
                        ...m,
                        workload: m.workload || Math.floor(Math.random() * 60 + 30),
                        status: m.status || 'Office'
                    }));
                }
                return DEMO_STAFF[team] || [];
            }, [staff, team]);
            
            const stats = useMemo(() => {
                const available = teamMembers.filter(m => m.workload < 70).length;
                const avgWorkload = teamMembers.length > 0 
                    ? Math.round(teamMembers.reduce((sum, m) => sum + m.workload, 0) / teamMembers.length)
                    : 0;
                return { available, avgWorkload, total: teamMembers.length };
            }, [teamMembers]);
            
            const getWorkloadClass = (wl) => wl < 60 ? 'low' : wl < 85 ? 'medium' : 'high';
            const getStatusClass = (wl, status) => {
                if (status === 'PTO' || status === 'Leave') return 'away';
                if (wl >= 85) return 'maxed';
                if (wl >= 60) return 'busy';
                return 'available';
            };
            
            const capacityStatus = stats.avgWorkload < 60 ? 'good' : stats.avgWorkload < 80 ? 'warning' : 'full';
            
            return (
                <div className="widget">
                    <div className="header">
                        <div className="header-left">
                            <div className="dots">
                                <div className="dot" style={{ background: teamColor }}></div>
                                <div className="dot" style={{ background: teamColor }}></div>
                                <div className="dot" style={{ background: teamColor }}></div>
                                <div className="dot" style={{ background: teamColor }}></div>
                            </div>
                            <span className="title">{team} Capacity</span>
                        </div>
                        <div className={`capacity-badge ${capacityStatus}`}>
                            {stats.avgWorkload}% Avg
                        </div>
                    </div>
                    
                    <div className="body">
                        {teamMembers.length > 0 ? (
                            <div className="members-grid">
                                {teamMembers.map((member, idx) => (
                                    <div key={member.id || idx} className="member-card">
                                        <div className="avatar" style={{ background: teamColor }}>
                                            {getInitials(member.firstName, member.lastName)}
                                        </div>
                                        <div className="member-info">
                                            <div className="member-name">{member.firstName}</div>
                                            <div className="member-status">
                                                <span className={`status-dot ${getStatusClass(member.workload, member.status)}`}></span>
                                                {member.status} • {member.workload}%
                                            </div>
                                            <div className="workload-bar">
                                                <div 
                                                    className={`workload-fill ${getWorkloadClass(member.workload)}`}
                                                    style={{ width: `${member.workload}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="empty">No team members found</div>
                        )}
                    </div>
                    
                    <div className="footer">
                        <span className="footer-stat"><strong>{stats.available}</strong> available</span>
                        <span className="footer-stat"><strong>{stats.total}</strong> members</span>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
