<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Mail TikTok Feed Row</title>
    <style>
        /* CORE LAYOUT */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: transparent;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            box-sizing: border-box;
            display: flex;
            justify-content: center; /* Center the whole component in the iframe */
        }
        
        /* Main Wrapper to control the overall width of the component */
        .main-wrapper {
            width: 100%;
            /* Removed max-width: 1000px to allow it to stretch fully in the column */
        }

        /* Container for the Follower Count (Top Row) */
        .profile-count-row {
            width: 100%;
            /* AGGRESSIVELY REDUCED VERTICAL PADDING (was 0 20px 15px 20px) */
            padding: 5px 20px 10px 20px; 
            box-sizing: border-box;
            display: flex;
            justify-content: flex-start; 
        }
        
        /* Container for the 3-Video Row */
        .video-feed-row {
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;
            gap: 15px; 
            width: 100%;
            padding: 0 20px 20px 20px; 
            box-sizing: border-box;
        }

        /* Individual TikTok Embed Styling */
        .tiktok-embed-container {
            flex-grow: 1; 
            max-width: 310px; 
            min-width: 250px;
            width: 33%; 
        }
        
        /* Profile Block Styling */
        .tiktok-embed-profile {
             /* Ensures the block itself uses 100% of the available row width */
             max-width: 100%; 
             min-width: 100%; /* Force minimum width to be the full row */
             margin: 0; 
        }

        /* Responsive adjustments for narrow screens */
        @media (max-width: 768px) {
            .video-feed-row {
                flex-wrap: wrap; 
                justify-content: center;
                gap: 10px;
            }
            .tiktok-embed-container {
                width: 48%; 
                max-width: 48%;
            }
            /* Adjust padding on mobile */
            .profile-count-row, .video-feed-row {
                padding: 0 10px 10px 10px;
            }
        }
    </style>
</head>
<body>
    
    <div class="main-wrapper">
    
        <!-- 1. Follower Count / Profile Section (Acts as the wide header) -->
        <div class="profile-count-row">
            <!-- Note: You will need to manually adjust the dimensions of the TikTok embed block 
                 in Notion (after embedding this file) to crop it vertically to just show the count. -->
            <blockquote 
                class="tiktok-embed tiktok-embed-profile" 
                cite="https://www.tiktok.com/@dailymail" 
                data-unique-id="dailymail-profile" 
                data-embed-type="creator" 
                style="width: 100%;" > 
                <section> 
                    <a target="_blank" href="https://www.tiktok.com/@dailymail?refer=creator_embed">@dailymail</a> 
                </section> 
            </blockquote> 
        </div>
    
        <!-- 2. Three Video Feed Row -->
        <div class="video-feed-row">
    
            <!-- Video 1 Placeholder -->
            <div class="tiktok-embed-container">
                <blockquote 
                    class="tiktok-embed" 
                    cite="https://www.tiktok.com/@dailymail/video/7304169999427355936" 
                    data-video-id="7304169999427355936" 
                    style="max-width: 100%; min-width: 200px; max-height: 400px;" > 
                    <section> 
                        <a target="_blank" title="Video 1" href="https://www.tiktok.com/@dailymail/video/7304169999427355936">Video 1</a> 
                    </section> 
                </blockquote>
            </div>
    
            <!-- Video 2 Placeholder -->
            <div class="tiktok-embed-container">
                <blockquote 
                    class="tiktok-embed" 
                    cite="https://www.tiktok.com/@dailymail/video/7300581423854195744" 
                    data-video-id="7300581423854195744" 
                    style="max-width: 100%; min-width: 200px; max-height: 400px;" > 
                    <section> 
                        <a target="_blank" title="Video 2" href="https://www.tiktok.com/@dailymail/video/7300581423854195744">Video 2</a> 
                    </section> 
                </blockquote>
            </div>
            
            <!-- Video 3 Placeholder -->
            <div class="tiktok-embed-container">
                <blockquote 
                    class="tiktok-embed" 
                    cite="https://www.tiktok.com/@dailymail/video/7298944583999446304" 
                    data-video-id="7298944583999446304" 
                    style="max-width: 100%; min-width: 200px; max-height: 400px;" > 
                    <section> 
                        <a target="_blank" title="Video 3" href="https://www.tiktok.com/@dailymail/video/7298944583999446304">Video 3</a> 
                    </section> 
                </blockquote>
            </div>
    
        </div>
    
    </div>

    <!-- The critical asynchronous script tag (Required only once) -->
    <script async src="https://www.tiktok.com/embed.js"></script>

</body>
</html>
