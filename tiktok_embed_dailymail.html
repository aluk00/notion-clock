<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Mail TikTok Profile</title>
    <style>
        /* Ensures the embed takes full available width within the Notion column */
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            /* CRITICAL: Center the fixed-width wrapper */
            justify-content: center; 
        }
        /* Custom styling for the embed container to control max width */
        .tiktok-embed-wrapper {
            /* CRITICAL FIX: Manually set a large fixed width (1000px) 
               to match the combined width of the three videos. */
            width: 1000px; 
            max-width: 100%; /* Still allows shrinking if the Notion column is less than 1000px */
            /* Added padding around the actual header content for breathing room */
            padding: 10px 20px; 
            box-sizing: border-box;
        }
        
        /* Ensure the blockquote itself honors the full wrapper width */
        .tiktok-embed {
             width: 100% !important; 
             min-width: 100% !important;
             max-width: none !important; 
        }
    </style>
</head>
<body>

    <div class="tiktok-embed-wrapper">
        <!-- Official TikTok Creator Embed Code -->
        <blockquote 
            class="tiktok-embed" 
            cite="https://www.tiktok.com/@dailymail" 
            data-unique-id="dailymail" 
            data-embed-type="creator" 
            /* Inline style removed, letting CSS handle width */
            > 
            <section> 
                <a target="_blank" href="https://www.tiktok.com/@dailymail?refer=creator_embed">@dailymail</a> 
            </section> 
        </blockquote> 
    </div>

    <!-- The critical asynchronous script tag -->
    <script async src="https://www.tiktok.com/embed.js"></script>

</body>
</html>
