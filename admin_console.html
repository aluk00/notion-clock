<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue: #21a0d8; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; --success: #22C55E; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F5F5F7; margin: 0; padding: 16px; color: var(--ink); }
        .console { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding: 16px 20px; background: #FFF; border-radius: 16px; border: 1px solid var(--border); }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dot-grid span { width: 6px; height: 6px; border-radius: 50%; background: var(--dmg-blue); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 18px; font-weight: 900; }
        .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-sub); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .card { background: #FFF; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: 800; }
        .card-badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--bg-soft); color: var(--ink-sub); }
        .table { width: 100%; border-collapse: collapse; }
        .table th { text-align: left; padding: 12px 20px; font-size: 10px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; background: var(--bg-soft); }
        .table td { padding: 14px 20px; font-size: 13px; border-bottom: 1px solid #F5F5F5; }
        .table tr:hover { background: var(--bg-soft); }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #FFF; margin-right: 12px; }
        .empty { padding: 60px 20px; text-align: center; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); max-width: 300px; margin: 0 auto; }
        .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--ink-sub); }
        .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .team-colors { Editorial: '#E94B4B', Creative: '#E6468B', Production: '#43B049', Social: '#F2C316', Operations: '#9333EA', Sales: '#F97316' }
    </style>
</head>
<body>
    <div id="root"><div class="loading"><div class="spinner"></div>Loading...</div></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const COLORS = { Editorial: '#E94B4B', Creative: '#E6468B', Production: '#43B049', Social: '#F2C316', Operations: '#9333EA', Sales: '#F97316' };
        let staff = [], loading = true, status = 'checking';
        const root = document.getElementById('root');
        const color = t => COLORS[t] || '#21a0d8';
        const initials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();

        function render() {
            if (loading) { root.innerHTML = `<div class="loading"><div class="spinner"></div>Loading admin console...</div>`; return; }
            const teams = [...new Set(staff.map(s => s.team).filter(Boolean))];
            root.innerHTML = `
                <div class="console">
                    <div class="header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h1 class="title">Admin Console</h1>
                        <div class="status">
                            <span class="status-dot" style="background: ${status === 'connected' ? '#22C55E' : '#F59E0B'}"></span>
                            Firebase ${status === 'connected' ? 'Connected' : 'Connecting...'}
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">Staff Directory</h2>
                            <span class="card-badge">${staff.length} members</span>
                        </div>
                        ${staff.length === 0 ? `
                            <div class="empty">
                                <div class="empty-icon">👤</div>
                                <div class="empty-title">No Staff Members</div>
                                <div class="empty-sub">Add staff to the staff_directory collection in Firebase to manage users here.</div>
                            </div>
                        ` : `
                            <table class="table">
                                <thead><tr><th>User</th><th>Role</th><th>Team</th><th>Status</th></tr></thead>
                                <tbody>
                                    ${staff.map(s => `
                                        <tr>
                                            <td style="display: flex; align-items: center;">
                                                <div class="avatar" style="background: ${color(s.team)}">${initials(s.firstName, s.lastName)}</div>
                                                <div><div style="font-weight: 700;">${s.firstName} ${s.lastName}</div><div style="font-size: 11px; color: var(--ink-sub);">${s.email || ''}</div></div>
                                            </td>
                                            <td style="color: var(--ink-sub);">${s.role || 'Member'}</td>
                                            <td><span style="font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: ${color(s.team)}20; color: ${color(s.team)}">${s.team || 'Unassigned'}</span></td>
                                            <td><span style="display: flex; align-items: center; gap: 6px; font-size: 11px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: ${s.active !== false ? '#22C55E' : '#CCC'}"></span>${s.active !== false ? 'Active' : 'Inactive'}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `}
                    </div>
                    <div class="card">
                        <div class="card-header"><h2 class="card-title">Teams</h2><span class="card-badge">${teams.length} teams</span></div>
                        <div style="padding: 16px 20px;">
                            ${teams.length === 0 ? '<div style="color: var(--ink-sub); font-size: 12px;">No teams configured yet.</div>' : teams.map(t => `
                                <div style="display: flex; align-items: center; margin-bottom: 10px;">
                                    <span style="width: 8px; height: 8px; border-radius: 50%; background: ${color(t)}; margin-right: 10px;"></span>
                                    <span style="flex: 1; font-size: 12px; font-weight: 600;">${t}</span>
                                    <span style="font-size: 12px; font-weight: 800; color: var(--ink-sub);">${staff.filter(s => s.team === t).length}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        onAuthStateChanged(auth, user => {
            if (user) {
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "staff_directory"), snap => {
                    staff = []; snap.forEach(d => staff.push({ id: d.id, ...d.data() }));
                    status = 'connected'; loading = false; render();
                }, e => { console.error(e); loading = false; render(); });
            } else {
                signInAnonymously(auth).catch(e => { console.error(e); loading = false; render(); });
            }
        });
    </script>
</body>
</html>
