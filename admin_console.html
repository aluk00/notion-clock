<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | DMG Command Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --dmg-blue-light: #e8f6fc;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --success: #43B049;
            --danger: #E94B4B;
            --warning: #F2C316;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #21a0d8;
            --team-executive: #1C1C1C;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #FFF; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        
        /* Lock Screen */
        .lock-screen { position: fixed; inset: 0; background: #FFF; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .lock-screen.hidden { opacity: 0; pointer-events: none; }
        .lock-title { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
        .lock-text { font-size: 48px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.03em; color: var(--ink); }
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 36px; height: 36px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; animation: pulse 2.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dot:nth-child(2) { animation-delay: 0.5s; }
        .dot:nth-child(4) { animation-delay: 1s; }
        .dot:nth-child(3) { animation-delay: 1.5s; }
        
        .pin-display { display: flex; gap: 12px; margin-bottom: 32px; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: 0.2s; }
        .pin-dot.filled { background: var(--dmg-blue); border-color: var(--dmg-blue); transform: scale(1.2); }
        
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 260px; }
        .num-btn { height: 56px; border-radius: 12px; background: #FFF; border: 1px solid var(--border); font-size: 20px; font-weight: 700; cursor: pointer; transition: 0.15s; color: var(--ink); }
        .num-btn:hover { background: var(--bg-soft); }
        .num-btn:active { background: var(--dmg-blue); color: #FFF; transform: scale(0.96); }
        .num-btn.action { font-size: 10px; font-weight: 800; color: var(--dmg-blue); text-transform: uppercase; }
        
        /* Main App */
        .app-container { max-width: 1200px; margin: 0 auto; padding: 40px; }
        .app-header { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
        .app-title { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; }
        
        .tab-nav { display: flex; gap: 8px; padding: 6px; background: var(--bg-soft); border-radius: 99px; width: fit-content; margin-bottom: 40px; border: 1px solid var(--border); }
        .tab-btn { padding: 10px 24px; border: none; background: transparent; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; border-radius: 99px; color: var(--ink-sub); transition: 0.2s; letter-spacing: 0.05em; }
        .tab-btn.active { background: var(--ink); color: #FFF; }
        
        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: #FFF; border: 1px solid var(--border); border-radius: 20px; padding: 32px; margin-bottom: 24px; }
        .card-title { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--dmg-blue); letter-spacing: 0.1em; margin-bottom: 24px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
        .form-group label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 8px; letter-spacing: 0.05em; }
        .form-group input, .form-group select { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 600; background: var(--bg-soft); transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--dmg-blue); background: #FFF; box-shadow: 0 0 0 4px rgba(33,160,216,0.1); }
        
        .checkbox-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding: 16px; background: var(--bg-soft); border-radius: 12px; cursor: pointer; width: fit-content; }
        .checkbox-row input { display: none; }
        .checkbox-box { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: 0.2s; color: #FFF; font-size: 12px; }
        .checkbox-row input:checked + .checkbox-box { background: var(--dmg-blue); border-color: var(--dmg-blue); }
        .checkbox-label { font-size: 13px; font-weight: 700; }
        
        .btn { padding: 14px 28px; border: none; border-radius: 12px; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.2s; letter-spacing: 0.05em; }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: var(--ink); color: #FFF; }
        .btn-primary:hover { background: var(--dmg-blue); }
        .btn-danger { background: #FEE2E2; color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #FFF; }
        .btn-secondary { background: var(--bg-soft); color: var(--ink); border: 1px solid var(--border); }
        
        /* Directory Table */
        .directory-table { width: 100%; border-collapse: collapse; }
        .directory-table th { text-align: left; padding: 16px; font-size: 10px; font-weight: 800; color: var(--ink-sub); text-transform: uppercase; border-bottom: 2px solid var(--border); background: var(--bg-soft); }
        .directory-table td { padding: 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #F5F5F5; }
        .directory-table tr:hover td { background: #FAFAFA; }
        
        .name-cell { display: flex; align-items: center; gap: 12px; }
        .name-dots { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 12px; height: 12px; }
        .name-dots span { width: 100%; height: 100%; border-radius: 50%; }
        .mgr-badge { font-size: 8px; background: var(--dmg-blue); color: #FFF; padding: 3px 8px; border-radius: 99px; margin-left: 8px; font-weight: 800; }
        
        .action-btns { display: flex; gap: 6px; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .action-btn.edit { background: #EBF8FF; color: var(--dmg-blue); }
        .action-btn.delete { background: #FEE2E2; color: var(--danger); }
        
        /* Toast */
        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: #FFF; padding: 14px 32px; border-radius: 99px; font-size: 13px; font-weight: 700; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; z-index: 2000; }
        .toast.active { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        /* Widget Registry */
        .widget-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .widget-card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 16px; padding: 20px; cursor: pointer; transition: 0.25s; border-left: 4px solid var(--dmg-blue); }
        .widget-card:hover { background: #FFF; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .widget-name { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--ink); word-break: break-all; }
        .widget-hint { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 6px; letter-spacing: 0.1em; }
        
        .loading { display: flex; align-items: center; justify-content: center; padding: 60px; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .app-container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'dmg-command-centre-native';
        const basePath = `artifacts/${appId}/public/data`;
        
        // Constants
        const CORRECT_PIN = "3646";
        const teamColors = { Editorial: '#E94B4B', Creative: '#E6468B', Production: '#43B049', Social: '#F2C316', Operations: '#21a0d8', Executive: '#1C1C1C' };
        const SENIORITIES = ['Intern', 'Junior', 'Freelance', 'Midweight', 'Senior', 'Lead', 'Head of', 'Director', 'Executive'];
        const ROLES = ['Designer', 'Video Producer', 'Video Editor', 'Channel Lead', 'Creative', 'Multimedia Journalist', 'Project Manager', 'Managing Producer'];
        const TEAMS = ['Editorial', 'Production', 'Creative', 'Social', 'Operations', 'Executive'];
        const TYPES = ['Permanent', 'Casual', 'Freelance'];
        
        // Lock Screen Component
        function LockScreen({ onUnlock }) {
            const [pin, setPin] = useState('');
            
            useEffect(() => {
                if (pin.length === 4) {
                    if (pin === CORRECT_PIN) {
                        setTimeout(() => onUnlock(), 200);
                    } else {
                        setPin('');
                    }
                }
            }, [pin, onUnlock]);
            
            const handlePress = (n) => pin.length < 4 && setPin(p => p + n);
            const handleClear = () => setPin('');
            
            return (
                <div className="lock-screen">
                    <div className="lock-title">
                        <span className="lock-text">Admin</span>
                        <div className="dots-grid">
                            <div className="dot"></div><div className="dot"></div>
                            <div className="dot"></div><div className="dot"></div>
                        </div>
                        <span className="lock-text">Hub</span>
                    </div>
                    
                    <div className="pin-display">
                        {[1,2,3,4].map(i => (
                            <div key={i} className={`pin-dot ${pin.length >= i ? 'filled' : ''}`} />
                        ))}
                    </div>
                    
                    <div className="numpad">
                        {[1,2,3,4,5,6,7,8,9].map(n => (
                            <button key={n} className="num-btn" onClick={() => handlePress(n)}>{n}</button>
                        ))}
                        <button className="num-btn action" onClick={handleClear}>Clear</button>
                        <button className="num-btn" onClick={() => handlePress(0)}>0</button>
                        <button className="num-btn action" onClick={() => setPin(p => p.slice(0,-1))}>Del</button>
                    </div>
                </div>
            );
        }
        
        // Toast Component
        function Toast({ message, isActive }) {
            return <div className={`toast ${isActive ? 'active' : ''}`}>{message}</div>;
        }
        
        // Intake Form Component
        function IntakeForm({ staff, editingId, onSave, onCancel, managers }) {
            const [form, setForm] = useState({
                firstName: '', lastName: '', seniority: 'Midweight', role: 'Designer',
                team: 'Creative', type: 'Permanent', manager: 'None', isManager: false
            });
            
            useEffect(() => {
                if (editingId) {
                    const s = staff.find(x => x.id === editingId);
                    if (s) setForm({
                        firstName: s.firstName, lastName: s.lastName, seniority: s.seniority,
                        role: s.role, team: s.team, type: s.type, manager: s.manager, isManager: s.isManager
                    });
                }
            }, [editingId, staff]);
            
            const handleSubmit = () => {
                if (!form.firstName.trim()) return;
                onSave({ ...form, active: true }, editingId);
                setForm({ firstName: '', lastName: '', seniority: 'Midweight', role: 'Designer', team: 'Creative', type: 'Permanent', manager: 'None', isManager: false });
            };
            
            return (
                <div className="card">
                    <div className="card-title">{editingId ? 'Edit Personnel' : 'Personnel Intake'}</div>
                    
                    <div className="form-grid">
                        <div className="form-group">
                            <label>First Name</label>
                            <input value={form.firstName} onChange={e => setForm({...form, firstName: e.target.value})} />
                        </div>
                        <div className="form-group">
                            <label>Last Name</label>
                            <input value={form.lastName} onChange={e => setForm({...form, lastName: e.target.value})} />
                        </div>
                        <div className="form-group">
                            <label>Seniority</label>
                            <select value={form.seniority} onChange={e => setForm({...form, seniority: e.target.value})}>
                                {SENIORITIES.map(s => <option key={s}>{s}</option>)}
                            </select>
                        </div>
                    </div>
                    
                    <div className="form-grid">
                        <div className="form-group">
                            <label>Role</label>
                            <select value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                                {ROLES.map(r => <option key={r}>{r}</option>)}
                            </select>
                        </div>
                        <div className="form-group">
                            <label>Stream</label>
                            <select value={form.team} onChange={e => setForm({...form, team: e.target.value})}>
                                {TEAMS.map(t => <option key={t}>{t}</option>)}
                            </select>
                        </div>
                        <div className="form-group">
                            <label>Reports To</label>
                            <select value={form.manager} onChange={e => setForm({...form, manager: e.target.value})}>
                                <option value="None">None</option>
                                {managers.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                    </div>
                    
                    <div className="form-grid">
                        <div className="form-group">
                            <label>Employment Type</label>
                            <select value={form.type} onChange={e => setForm({...form, type: e.target.value})}>
                                {TYPES.map(t => <option key={t}>{t}</option>)}
                            </select>
                        </div>
                    </div>
                    
                    <label className="checkbox-row">
                        <input type="checkbox" checked={form.isManager} onChange={e => setForm({...form, isManager: e.target.checked})} />
                        <div className="checkbox-box">{form.isManager && '✓'}</div>
                        <span className="checkbox-label">Line Manager?</span>
                    </label>
                    
                    <div style={{ display: 'flex', gap: 12 }}>
                        <button className="btn btn-primary" onClick={handleSubmit}>
                            {editingId ? 'Update Record' : 'Confirm & Sync'}
                        </button>
                        {editingId && <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>}
                    </div>
                </div>
            );
        }
        
        // Directory Table Component
        function DirectoryTable({ staff, onEdit, onDelete }) {
            return (
                <div className="card">
                    <div className="card-title">Live Directory ({staff.length})</div>
                    <table className="directory-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Seniority</th>
                                <th>Stream</th>
                                <th>Manager</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {staff.sort((a,b) => a.firstName.localeCompare(b.firstName)).map(s => {
                                const color = teamColors[s.team] || '#999';
                                return (
                                    <tr key={s.id}>
                                        <td>
                                            <div className="name-cell">
                                                <div className="name-dots">
                                                    {[...Array(4)].map((_, i) => <span key={i} style={{ background: color }} />)}
                                                </div>
                                                <span>{s.firstName} {s.lastName}</span>
                                                {s.isManager && <span className="mgr-badge">MGR</span>}
                                            </div>
                                        </td>
                                        <td style={{ fontSize: 11, color: '#999', textTransform: 'uppercase', fontWeight: 700 }}>{s.seniority}</td>
                                        <td style={{ color, fontWeight: 700, fontSize: 11, textTransform: 'uppercase' }}>{s.team}</td>
                                        <td style={{ color: '#666', fontSize: 13 }}>{s.manager}</td>
                                        <td>
                                            <div className="action-btns">
                                                <button className="action-btn edit" onClick={() => onEdit(s.id)}>Edit</button>
                                                <button className="action-btn delete" onClick={() => onDelete(s.id)}>Del</button>
                                            </div>
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        }
        
        // Widget Registry Component
        function WidgetRegistry({ widgets, onCopy }) {
            return (
                <div className="card">
                    <div className="card-title">Widget Library ({widgets.length})</div>
                    <p style={{ fontSize: 11, color: '#999', marginBottom: 20 }}>Click any card to copy the embed URL</p>
                    <div className="widget-grid">
                        {widgets.sort((a,b) => a.filename.localeCompare(b.filename)).map(w => (
                            <div key={w.id} className="widget-card" onClick={() => onCopy(w.url)}>
                                <div className="widget-hint">Embed URL</div>
                                <div className="widget-name">{w.filename}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        // Main App
        function AdminConsole() {
            const [isLocked, setIsLocked] = useState(true);
            const [activeTab, setActiveTab] = useState('intake');
            const [staff, setStaff] = useState([]);
            const [widgets, setWidgets] = useState([]);
            const [editingId, setEditingId] = useState(null);
            const [toast, setToast] = useState({ message: '', active: false });
            const [loading, setLoading] = useState(true);
            
            const showToast = useCallback((message) => {
                setToast({ message, active: true });
                setTimeout(() => setToast({ message: '', active: false }), 2500);
            }, []);
            
            useEffect(() => {
                auth.signInAnonymously();
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        db.collection(`${basePath}/staff_directory`).onSnapshot(snap => {
                            const list = [];
                            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                            setStaff(list);
                            setLoading(false);
                        });
                        
                        db.collection(`${basePath}/asset_registry`).onSnapshot(snap => {
                            const list = [];
                            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                            setWidgets(list);
                        });
                    }
                });
            }, []);
            
            const managers = staff.filter(s => s.isManager).map(s => `${s.firstName} ${s.lastName}`);
            
            const handleSave = async (data, id) => {
                if (id) {
                    await db.collection(`${basePath}/staff_directory`).doc(id).update(data);
                    setEditingId(null);
                } else {
                    await db.collection(`${basePath}/staff_directory`).add(data);
                }
                showToast('Profile Synced');
            };
            
            const handleDelete = async (id) => {
                if (confirm('Delete this profile?')) {
                    await db.collection(`${basePath}/staff_directory`).doc(id).delete();
                    showToast('Profile Removed');
                }
            };
            
            const handleEdit = (id) => {
                setEditingId(id);
                setActiveTab('intake');
            };
            
            const handleCopy = (url) => {
                navigator.clipboard.writeText(url);
                showToast('URL Copied');
            };
            
            if (isLocked) {
                return <LockScreen onUnlock={() => setIsLocked(false)} />;
            }
            
            return (
                <div className="app-container">
                    <div className="app-header">
                        <span className="app-title">Admin</span>
                        <div className="dots-grid">
                            <div className="dot"></div><div className="dot"></div>
                            <div className="dot"></div><div className="dot"></div>
                        </div>
                        <span className="app-title">Hub</span>
                    </div>
                    
                    <nav className="tab-nav">
                        {[
                            { id: 'intake', label: 'Personnel Intake' },
                            { id: 'directory', label: 'Live Directory' },
                            { id: 'registry', label: 'Widget Assets' }
                        ].map(tab => (
                            <button 
                                key={tab.id}
                                className={`tab-btn ${activeTab === tab.id ? 'active' : ''}`}
                                onClick={() => setActiveTab(tab.id)}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </nav>
                    
                    {loading ? (
                        <div className="loading"><div className="spinner"></div></div>
                    ) : (
                        <>
                            <div className={`panel ${activeTab === 'intake' ? 'active' : ''}`}>
                                <IntakeForm 
                                    staff={staff}
                                    editingId={editingId}
                                    onSave={handleSave}
                                    onCancel={() => setEditingId(null)}
                                    managers={managers}
                                />
                            </div>
                            
                            <div className={`panel ${activeTab === 'directory' ? 'active' : ''}`}>
                                <DirectoryTable staff={staff} onEdit={handleEdit} onDelete={handleDelete} />
                            </div>
                            
                            <div className={`panel ${activeTab === 'registry' ? 'active' : ''}`}>
                                <WidgetRegistry widgets={widgets} onCopy={handleCopy} />
                            </div>
                        </>
                    )}
                    
                    <Toast message={toast.message} isActive={toast.active} />
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminConsole />);
    </script>
</body>
</html>
