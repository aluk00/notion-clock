<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | DMG Command Centre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --team-sales: #F97316;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F5F7;
            margin: 0;
            padding: 16px;
            color: var(--ink);
            min-height: 100vh;
        }
        .console {
            max-width: 1400px;
            margin: 0 auto;
        }
        .console-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: #FFF;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot-grid span:nth-child(1) { animation-delay: 0s; }
        .dot-grid span:nth-child(2) { animation-delay: 0.15s; }
        .dot-grid span:nth-child(3) { animation-delay: 0.3s; }
        .dot-grid span:nth-child(4) { animation-delay: 0.45s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .console-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--ink);
        }
        .console-sub {
            font-size: 12px;
            color: var(--ink-sub);
            margin-left: auto;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .demo-badge {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: var(--team-creative);
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            padding: 4px;
            background: #FFF;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: fit-content;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            color: var(--ink-sub);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab-btn:hover { color: var(--ink); background: var(--bg-soft); }
        .tab-btn.active { background: var(--ink); color: #FFF; }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* Card Styles */
        .card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--ink);
        }
        .card-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
            background: var(--bg-soft);
            color: var(--ink-sub);
        }
        .card-body { padding: 0; }

        /* Staff Table */
        .staff-table {
            width: 100%;
            border-collapse: collapse;
        }
        .staff-table th {
            text-align: left;
            padding: 12px 20px;
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--bg-soft);
            border-bottom: 1px solid var(--border);
        }
        .staff-table td {
            padding: 14px 20px;
            font-size: 13px;
            border-bottom: 1px solid #F5F5F5;
        }
        .staff-table tr:last-child td { border-bottom: none; }
        .staff-table tr:hover { background: var(--bg-soft); }

        .staff-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .staff-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #FFF;
        }
        .staff-name { font-weight: 700; color: var(--ink); }
        .staff-email { font-size: 11px; color: var(--ink-sub); }
        .staff-role { color: var(--ink-sub); }
        .staff-team {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
        }
        .staff-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-indicator.active { background: var(--success); }
        .status-indicator.inactive { background: #CCC; }

        .action-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: #FFF;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-sub);
            cursor: pointer;
            transition: all 0.15s;
        }
        .action-btn:hover {
            border-color: var(--dmg-blue);
            color: var(--dmg-blue);
        }

        /* System Status */
        .system-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #F5F5F5;
        }
        .system-item:last-child { border-bottom: none; }
        .system-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background: var(--bg-soft);
            margin-right: 12px;
        }
        .system-info { flex: 1; }
        .system-name { font-size: 13px; font-weight: 700; color: var(--ink); }
        .system-desc { font-size: 11px; color: var(--ink-sub); }
        .system-status {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
        }
        .system-status.online { background: #DCFCE7; color: #166534; }
        .system-status.offline { background: #FEE2E2; color: #B91C1C; }
        .system-status.warning { background: #FEF3C7; color: #B45309; }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 16px 20px;
        }
        .quick-btn {
            padding: 14px;
            border: 1px solid var(--border);
            background: #FFF;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .quick-btn:hover {
            border-color: var(--dmg-blue);
            background: #F0F9FF;
        }
        .quick-icon { font-size: 20px; margin-bottom: 6px; }
        .quick-label { font-size: 11px; font-weight: 700; color: var(--ink); }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--ink-sub);
            font-size: 13px;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--dmg-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div class="spinner"></div>
            Loading admin console...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Social Video': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316'
        };

        // Demo data fallback
        const DEMO_STAFF = [
            { id: '1', firstName: 'Nick', lastName: 'B', team: 'Creative', role: 'Creative Lead', email: 'nick.b@dmgmedia.co.uk', active: true },
            { id: '2', firstName: 'Ana', lastName: 'C', team: 'Creative', role: 'Senior Creative', email: 'ana.c@dmgmedia.co.uk', active: true },
            { id: '3', firstName: 'Hugo', lastName: 'M', team: 'Production', role: 'Producer', email: 'hugo.m@dmgmedia.co.uk', active: true },
            { id: '4', firstName: 'Isobel', lastName: 'W', team: 'Editorial', role: 'Editor', email: 'isobel.w@dmgmedia.co.uk', active: true },
            { id: '5', firstName: 'Mimi', lastName: 'Y', team: 'Social', role: 'Creator', email: 'mimi.y@dmgmedia.co.uk', active: true },
            { id: '6', firstName: 'Dan', lastName: 'Q', team: 'Social', role: 'Presenter', email: 'dan.q@dmgmedia.co.uk', active: false },
            { id: '7', firstName: 'Kaylee', lastName: 'A', team: 'Editorial', role: 'Presenter', email: 'kaylee.a@dmgmedia.co.uk', active: true },
            { id: '8', firstName: 'Sophia', lastName: 'S', team: 'Editorial', role: 'Finance Creator', email: 'sophia.s@dmgmedia.co.uk', active: true },
            { id: '9', firstName: 'Henry', lastName: 'W', team: 'Social', role: 'Sport Creator', email: 'henry.w@dmgmedia.co.uk', active: true },
            { id: '10', firstName: 'Ellie', lastName: 'B', team: 'Creative', role: 'Head of Social', email: 'ellie.b@dmgmedia.co.uk', active: true }
        ];

        const SYSTEMS = [
            { name: 'Firebase Auth', desc: 'User authentication', status: 'online', icon: '🔐' },
            { name: 'Firestore DB', desc: 'Database connection', status: 'online', icon: '💾' },
            { name: 'Cloud Functions', desc: 'API endpoints', status: 'online', icon: '⚡' },
            { name: 'Notion Sync', desc: 'Project data sync', status: 'warning', icon: '📋' },
            { name: 'Storage', desc: 'File storage bucket', status: 'online', icon: '📁' }
        ];

        let staff = [];
        let isDemo = true;
        let activeTab = 'users';
        let connectionStatus = 'checking';
        const root = document.getElementById('root');

        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();

        function render() {
            root.innerHTML = `
                <div class="console">
                    <div class="console-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h1 class="console-title">Admin Console</h1>
                        <div class="console-sub">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="status-dot" style="background: ${connectionStatus === 'connected' ? '#22C55E' : connectionStatus === 'checking' ? '#F59E0B' : '#EF4444'}"></span>
                                Firebase ${connectionStatus === 'connected' ? 'Connected' : connectionStatus === 'checking' ? 'Connecting...' : 'Disconnected'}
                            </div>
                        </div>
                        ${isDemo ? '<span class="demo-badge">Preview Mode</span>' : ''}
                    </div>

                    <div class="tab-nav">
                        <button class="tab-btn ${activeTab === 'users' ? 'active' : ''}" onclick="window.setTab('users')">👥 Users</button>
                        <button class="tab-btn ${activeTab === 'system' ? 'active' : ''}" onclick="window.setTab('system')">⚙️ System</button>
                        <button class="tab-btn ${activeTab === 'actions' ? 'active' : ''}" onclick="window.setTab('actions')">🚀 Actions</button>
                    </div>

                    <div class="main-grid">
                        <div class="card">
                            <div class="card-header">
                                <h2 class="card-title">${activeTab === 'users' ? 'Staff Directory' : activeTab === 'system' ? 'System Status' : 'Quick Actions'}</h2>
                                <span class="card-badge">${activeTab === 'users' ? `${staff.length} members` : activeTab === 'system' ? `${SYSTEMS.filter(s => s.status === 'online').length}/${SYSTEMS.length} online` : '6 actions'}</span>
                            </div>
                            <div class="card-body">
                                ${activeTab === 'users' ? renderUsersTable() : activeTab === 'system' ? renderSystemStatus() : renderQuickActions()}
                            </div>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 20px;">
                            <div class="card">
                                <div class="card-header">
                                    <h2 class="card-title">Connection Info</h2>
                                </div>
                                <div class="card-body" style="padding: 16px 20px;">
                                    <div style="font-size: 11px; color: var(--ink-sub); margin-bottom: 12px;">
                                        <strong style="color: var(--ink);">Project ID</strong><br>
                                        dmg-command-centre-native
                                    </div>
                                    <div style="font-size: 11px; color: var(--ink-sub); margin-bottom: 12px;">
                                        <strong style="color: var(--ink);">Auth Status</strong><br>
                                        ${connectionStatus === 'connected' ? '✅ Anonymous auth active' : '⏳ Authenticating...'}
                                    </div>
                                    <div style="font-size: 11px; color: var(--ink-sub);">
                                        <strong style="color: var(--ink);">Data Source</strong><br>
                                        ${isDemo ? '📋 Demo data (preview)' : '🔥 Live Firestore'}
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h2 class="card-title">Team Breakdown</h2>
                                </div>
                                <div class="card-body" style="padding: 16px 20px;">
                                    ${renderTeamBreakdown()}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderUsersTable() {
            if (staff.length === 0) {
                return '<div class="loading">No staff data available</div>';
            }
            return `
                <table class="staff-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Role</th>
                            <th>Team</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${staff.map(s => `
                            <tr>
                                <td>
                                    <div class="staff-user">
                                        <div class="staff-avatar" style="background: ${getTeamColor(s.team)}">
                                            ${getInitials(s.firstName, s.lastName)}
                                        </div>
                                        <div>
                                            <div class="staff-name">${s.firstName} ${s.lastName}</div>
                                            <div class="staff-email">${s.email || 'No email'}</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="staff-role">${s.role || 'Member'}</td>
                                <td>
                                    <span class="staff-team" style="background: ${getTeamColor(s.team)}20; color: ${getTeamColor(s.team)}">${s.team}</span>
                                </td>
                                <td>
                                    <div class="staff-status">
                                        <span class="status-indicator ${s.active !== false ? 'active' : 'inactive'}"></span>
                                        ${s.active !== false ? 'Active' : 'Inactive'}
                                    </div>
                                </td>
                                <td><button class="action-btn" onclick="window.editUser('${s.id}')">Edit</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderSystemStatus() {
            return SYSTEMS.map(s => `
                <div class="system-item">
                    <div class="system-icon">${s.icon}</div>
                    <div class="system-info">
                        <div class="system-name">${s.name}</div>
                        <div class="system-desc">${s.desc}</div>
                    </div>
                    <span class="system-status ${s.status}">${s.status === 'online' ? 'Online' : s.status === 'warning' ? 'Warning' : 'Offline'}</span>
                </div>
            `).join('');
        }

        function renderQuickActions() {
            return `
                <div class="quick-actions">
                    <div class="quick-btn" onclick="window.refreshData()">
                        <div class="quick-icon">🔄</div>
                        <div class="quick-label">Refresh Data</div>
                    </div>
                    <div class="quick-btn" onclick="window.clearCache()">
                        <div class="quick-icon">🗑️</div>
                        <div class="quick-label">Clear Cache</div>
                    </div>
                    <div class="quick-btn" onclick="window.exportData()">
                        <div class="quick-icon">📥</div>
                        <div class="quick-label">Export Data</div>
                    </div>
                    <div class="quick-btn" onclick="window.syncNotion()">
                        <div class="quick-icon">📋</div>
                        <div class="quick-label">Sync Notion</div>
                    </div>
                    <div class="quick-btn" onclick="window.viewLogs()">
                        <div class="quick-icon">📜</div>
                        <div class="quick-label">View Logs</div>
                    </div>
                    <div class="quick-btn" onclick="window.testConnection()">
                        <div class="quick-icon">🔌</div>
                        <div class="quick-label">Test Connection</div>
                    </div>
                </div>
            `;
        }

        function renderTeamBreakdown() {
            const teams = {};
            staff.forEach(s => {
                teams[s.team] = (teams[s.team] || 0) + 1;
            });
            return Object.entries(teams).map(([team, count]) => `
                <div style="display: flex; align-items: center; margin-bottom: 10px;">
                    <div style="width: 8px; height: 8px; border-radius: 50%; background: ${getTeamColor(team)}; margin-right: 10px;"></div>
                    <div style="flex: 1; font-size: 12px; font-weight: 600; color: var(--ink);">${team}</div>
                    <div style="font-size: 12px; font-weight: 800; color: var(--ink-sub);">${count}</div>
                </div>
            `).join('');
        }

        window.setTab = (tab) => {
            activeTab = tab;
            render();
        };

        window.editUser = (id) => {
            console.log('Edit user:', id);
            alert('Edit user: ' + id);
        };

        window.refreshData = () => {
            connectionStatus = 'checking';
            render();
            loadData();
        };

        window.clearCache = () => alert('Cache cleared');
        window.exportData = () => alert('Data export started');
        window.syncNotion = () => alert('Notion sync triggered');
        window.viewLogs = () => alert('Opening logs...');
        window.testConnection = async () => {
            connectionStatus = 'checking';
            render();
            try {
                await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                connectionStatus = 'connected';
                alert('✅ Connection successful!');
            } catch (e) {
                connectionStatus = 'error';
                alert('❌ Connection failed: ' + e.message);
            }
            render();
        };

        async function loadData() {
            try {
                const staffSnap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                if (!staffSnap.empty) {
                    staff = [];
                    staffSnap.forEach(d => {
                        staff.push({ id: d.id, ...d.data() });
                    });
                    isDemo = false;
                    connectionStatus = 'connected';
                } else {
                    staff = DEMO_STAFF;
                    isDemo = true;
                    connectionStatus = 'connected';
                }
            } catch (e) {
                console.log('Using demo data:', e);
                staff = DEMO_STAFF;
                isDemo = true;
                connectionStatus = 'error';
            }
            render();
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadData();
            } else {
                signInAnonymously(auth).catch(e => {
                    console.error('Auth failed:', e);
                    staff = DEMO_STAFF;
                    isDemo = true;
                    connectionStatus = 'error';
                    render();
                });
            }
        });
    </script>
</body>
</html>
