<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ready to Post Header</title>
    <style>
        /* Core Layout */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: flex-start;
            height: auto; 
            background-color: transparent; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            padding-left: 20px; 
            padding-top: 20px;
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 1.5rem; 
            /* Kept margin-bottom if there was content below the header */
            margin-bottom: 10px; 
        }

        /* Text Styling */
        .title-text {
            font-size: 4rem; 
            font-weight: 800; 
            color: #000000;
            letter-spacing: -0.04em; 
            line-height: 1;
            opacity: 0; 
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* The "READY" (Left side) */
        .text-left {
            animation-delay: 0.1s;
        }

        /* The "TO POST" (Right side) */
        .text-right {
            animation-delay: 0.3s;
        }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px; 
            width: 44px; 
            height: 44px;
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #FFC107; /* YELLOW */
            border-radius: 50%;
            transform: scale(0); 
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Stagger the dot animations */
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* Animations */
        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            to { transform: scale(1); }
        }
        
        /* Removed Download Button Styling */

        /* Responsive scaling */
        @media (max-width: 600px) {
            .title-text { font-size: 2.5rem; }
            .header-container { gap: 1rem; }
            .dots-grid { width: 28px; height: 28px; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="header-container" id="header-to-capture-ready">
        <!-- Left Text -->
        <div class="title-text text-left">READY</div>

        <!-- Center Dots (The Logo Motif) -->
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Right Text -->
        <div class="title-text text-right">TO POST</div>
    </div>
    
    <!-- Removed download button and script -->

</body>
</html>
