<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Widget</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* This subtle zoom ensures no black edges appear */
            transform: scale(1.05); 
            transform-origin: center center;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://docs.google.com/presentation/d/e/2PACX-1vSvFo3R8CqoVz10PEVZHmcUpT3px8Z66degq78DDiN-xF-aNrx_35hMob1mc-oEFdFDRi43MBBJFC8o/embed?start=true&loop=true&delayms=5000&rm=minimal" 
        allowfullscreen="true" 
        mozallowfullscreen="true" 
        webkitallowfullscreen="true">
    </iframe>
</body>
</html>
