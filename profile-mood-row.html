<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How I'm Feeling | DMG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 340px;
        }
        .widget-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .header-icon { font-size: 14px; }
        .header-title {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-sub);
        }
        .edit-btn {
            margin-left: auto;
            font-size: 10px;
            color: var(--dmg-blue);
            text-decoration: none;
            font-weight: 700;
        }
        .edit-btn:hover { text-decoration: underline; }
        
        .mood-display {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .mood-emoji {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .mood-info { flex: 1; }
        .mood-label {
            font-size: 16px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .mood-time {
            font-size: 11px;
            color: var(--ink-sub);
        }
        
        .mood-empty {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-soft);
            border: 2px dashed var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .mood-empty:hover { border-color: var(--dmg-blue); background: #F0F9FF; }
        .mood-empty-icon { font-size: 24px; opacity: 0.5; }
        .mood-empty-text { font-size: 13px; color: var(--ink-sub); font-weight: 600; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        // Demo mood
        let mood = { emoji: '🔥', label: 'On Fire' };
        let moodTime = '2h ago';

        const root = document.getElementById('root');

        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <span class="header-icon">💭</span>
                        <span class="header-title">How I'm Feeling</span>
                        <a href="#" class="edit-btn">Update</a>
                    </div>
                    ${mood ? `
                        <div class="mood-display">
                            <div class="mood-emoji">${mood.emoji}</div>
                            <div class="mood-info">
                                <div class="mood-label">${mood.label}</div>
                                <div class="mood-time">Updated ${moodTime}</div>
                            </div>
                        </div>
                    ` : `
                        <div class="mood-empty">
                            <span class="mood-empty-icon">😶</span>
                            <span class="mood-empty-text">Set your mood</span>
                        </div>
                    `}
                </div>
            `;
        }

        async function loadProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');
            
            if (userId) {
                try {
                    const profileRef = doc(db, "artifacts", appId, "public", "data", "user_profiles", userId);
                    const snap = await getDoc(profileRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.mood) {
                            mood = data.mood;
                            if (data.moodUpdatedAt) {
                                const diff = Date.now() - data.moodUpdatedAt;
                                const mins = Math.floor(diff / 60000);
                                if (mins < 60) moodTime = `${mins}m ago`;
                                else if (mins < 1440) moodTime = `${Math.floor(mins/60)}h ago`;
                                else moodTime = `${Math.floor(mins/1440)}d ago`;
                            }
                        }
                    }
                } catch (e) { console.log('Using demo data'); }
            }
            render();
        }

        onAuthStateChanged(auth, u => { if (u) loadProfile(); else signInAnonymously(auth); });
    </script>
</body>
</html>
