<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How I'm Feeling | DMG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 4px;
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            max-width: 280px;
        }
        .widget-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }
        .header-icon { font-size: 12px; }
        .header-title {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-sub);
        }
        .edit-btn {
            margin-left: auto;
            font-size: 9px;
            color: var(--dmg-blue);
            text-decoration: none;
            font-weight: 700;
        }
        .edit-btn:hover { text-decoration: underline; }
        
        .mood-display {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mood-emoji {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .mood-info { flex: 1; }
        .mood-label {
            font-size: 13px;
            font-weight: 800;
            color: var(--ink);
        }
        .mood-time {
            font-size: 9px;
            color: var(--ink-sub);
        }
    </style>
</head>
<body>
    <div class="widget">
        <div class="widget-header">
            <span class="header-icon">💭</span>
            <span class="header-title">How I'm Feeling</span>
            <a href="#" class="edit-btn">Update</a>
        </div>
        <div class="mood-display">
            <div class="mood-emoji">🔥</div>
            <div class="mood-info">
                <div class="mood-label">On Fire</div>
                <div class="mood-time">Updated 2h ago</div>
            </div>
        </div>
    </div>
</body>
</html>
