<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Hub Header | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --editorial: #E94B4B;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; }
        
        .widget { background: #FFF; border-radius: 14px; border: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        
        .left { display: flex; align-items: center; gap: 14px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 18px; height: 18px; }
        .dot { width: 100%; height: 100%; background: var(--editorial); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 16px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: -0.02em; }
        
        .center { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        
        .channel-pill { padding: 6px 14px; border-radius: 20px; font-size: 9px; font-weight: 800; text-transform: uppercase; border: 1px solid var(--border); background: #FFF; color: var(--ink-sub); cursor: pointer; transition: 0.2s; font-family: inherit; }
        .channel-pill:hover { border-color: var(--editorial); color: var(--editorial); }
        .channel-pill.active { background: var(--ink); color: #FFF; border-color: var(--ink); }
        
        .right { display: flex; align-items: center; gap: 10px; }
        
        .stat-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-soft); border-radius: 20px; font-size: 10px; font-weight: 700; color: var(--ink-sub); }
        .stat-pill strong { color: var(--ink); font-size: 12px; }
        
        .action-btn { padding: 8px 16px; background: var(--editorial); color: #FFF; border: none; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; font-family: inherit; }
        .action-btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const CHANNELS = ['All', 'Daily Mail', 'Mail UK', 'Spotlight', 'Mail Sport', 'Respawn'];
        
        // Demo content data
        const DEMO_CONTENT = [
            { title: 'Blue Monday Explainer', channel: 'Daily Mail', status: 'scheduled', date: '2025-01-13' },
            { title: 'Australian Open Preview', channel: 'Mail Sport', status: 'in_review', date: '2025-01-13' },
            { title: 'Cost of Living Update', channel: 'Mail UK', status: 'scheduled', date: '2025-01-14' },
            { title: 'Celebrity News Roundup', channel: 'Spotlight', status: 'published', date: '2025-01-11' },
            { title: 'Gaming Week Ahead', channel: 'Respawn', status: 'in_review', date: '2025-01-12' },
        ];
        
        function App() {
            const [content, setContent] = useState([]);
            const [activeChannel, setActiveChannel] = useState('All');
            
            useEffect(() => {
                const unsub = db.collection('editorial_content')
                    .onSnapshot(snap => {
                        if (snap.empty) {
                            setContent(DEMO_CONTENT);
                        } else {
                            setContent(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }
                    }, err => {
                        console.log('Using demo content:', err.message);
                        setContent(DEMO_CONTENT);
                    });
                return () => unsub();
            }, []);
            
            const filteredContent = useMemo(() => {
                if (activeChannel === 'All') return content;
                return content.filter(c => c.channel === activeChannel);
            }, [content, activeChannel]);
            
            const stats = useMemo(() => {
                const today = new Date().toISOString().split('T')[0];
                const todayContent = filteredContent.filter(c => c.date === today).length;
                const scheduled = filteredContent.filter(c => c.status === 'scheduled').length;
                const inReview = filteredContent.filter(c => c.status === 'in_review').length;
                return { todayContent, scheduled, inReview };
            }, [filteredContent]);
            
            const handleChannelChange = (channel) => {
                setActiveChannel(channel);
                window.parent.postMessage({ type: 'CHANNEL_CHANGE', channel }, '*');
            };
            
            const handleNewContent = () => {
                window.parent.postMessage({ type: 'NEW_CONTENT' }, '*');
            };
            
            return (
                <div className="widget">
                    <div className="left">
                        <div className="dots">
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                        </div>
                        <span className="title">Editorial Hub</span>
                    </div>
                    
                    <div className="center">
                        {CHANNELS.map(ch => (
                            <button 
                                key={ch}
                                className={`channel-pill ${activeChannel === ch ? 'active' : ''}`}
                                onClick={() => handleChannelChange(ch)}
                            >{ch}</button>
                        ))}
                    </div>
                    
                    <div className="right">
                        <div className="stat-pill">
                            <span>Today</span>
                            <strong>{stats.todayContent}</strong>
                        </div>
                        <div className="stat-pill">
                            <span>Scheduled</span>
                            <strong>{stats.scheduled}</strong>
                        </div>
                        <div className="stat-pill">
                            <span>In Review</span>
                            <strong>{stats.inReview}</strong>
                        </div>
                        <button className="action-btn" onClick={handleNewContent}>+ New Content</button>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
