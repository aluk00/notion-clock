<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Links | New Media</title>
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --dmg-blue-hover: #f0f9ff;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: transparent;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: flex-start;
        }

        .links-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
        }

        .link-card {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 8px;
            background: #ffffff;
            border: 1.5px solid var(--dmg-blue);
            transition: all 0.2s ease;
            min-width: 110px;
        }

        .link-card:hover {
            background-color: var(--dmg-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(33, 160, 216, 0.1);
        }

        .category-tag {
            font-size: 7px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
            color: var(--dmg-blue);
            opacity: 0.7;
        }

        .link-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--dmg-blue);
            margin: 0;
            line-height: 1.1;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .link-card {
                flex: 1 1 calc(50% - 8px);
                min-width: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="links-grid">
        <!-- OPERATIONS -->
        <a href="https://wd3.myworkday.com/dmgt/d/home.htmld" target="_blank" class="link-card">
            <span class="category-tag">Operations</span>
            <p class="link-title">Workday</p>
        </a>

        <a href="https://eu1.concursolutions.com/" target="_blank" class="link-card">
            <span class="category-tag">Expenses</span>
            <p class="link-title">Concur</p>
        </a>

        <a href="https://myhub.dmgmedia.co.uk/new-starter-section/" target="_blank" class="link-card">
            <span class="category-tag">Operations</span>
            <p class="link-title">My Hub</p>
        </a>

        <!-- STRATEGY -->
        <a href="https://dmgtcloud-my.sharepoint.com/:x:/g/personal/i_millingtonphillips_mailmetromedia_co_uk/ER_0Gv_uOAtAkqb-t-N4QBdt3HjOqHqSp7J_8uNi8FSAQbvPLzNbw65uSejjiT6U6w?e=Dnk0bk" target="_blank" class="link-card">
            <span class="category-tag">Commercial</span>
            <p class="link-title">Status Doc</p>
        </a>

        <a href="https://docs.google.com/document/d/1TN0-5Ianw4i5CAB-mV3mPgtpt8WJ8YhrNTeOcOPVmtk/edit?tab=t.0" target="_blank" class="link-card">
            <span class="category-tag">Continuity</span>
            <p class="link-title">Handover</p>
        </a>

        <a href="#" target="_blank" class="link-card">
            <span class="category-tag">Editorial</span>
            <p class="link-title">Daily Slate</p>
        </a>

        <!-- PRODUCTION -->

            <span class="category-tag">Design</span>
            <p class="link-title">Graphics Req</p>
        </a>
    </div>

</body>
</html>
