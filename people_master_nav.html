<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Directory | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue: #21a0d8; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 800px; overflow: hidden; }
        .header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dot-grid span { width: 6px; height: 6px; border-radius: 50%; background: var(--dmg-blue); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 15px; font-weight: 900; }
        .search-box { margin-left: auto; position: relative; }
        .search-input { padding: 8px 12px 8px 32px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; width: 200px; }
        .search-input:focus { outline: none; border-color: var(--dmg-blue); }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--ink-sub); }
        
        .filters { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .filter-btn { padding: 8px 14px; border-radius: 99px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .filter-btn { background: var(--bg-soft); color: var(--ink-sub); }
        .filter-btn:hover { color: var(--ink); }
        .filter-btn.active { background: var(--ink); color: #FFF; }
        
        .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1px; background: #F0F0F0; }
        .person-card { background: #FFF; padding: 16px; text-align: center; cursor: pointer; transition: background 0.15s; }
        .person-card:hover { background: var(--bg-soft); }
        .person-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #FFF; margin: 0 auto 10px; }
        .person-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
        .person-role { font-size: 11px; color: var(--ink-sub); margin-bottom: 4px; }
        .person-team { font-size: 10px; font-weight: 700; }
        
        .empty { padding: 60px 20px; text-align: center; background: #FFF; }
        .empty-icon { font-size: 48px; margin-bottom: 14px; }
        .empty-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--ink-sub); font-size: 13px; background: #FFF; }
        .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        
        var db = firebase.firestore();
        var auth = firebase.auth();
        var appId = "dmg-command-centre-native";
        
        var COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Social Video': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316',
            'Design': '#8B5CF6'
        };
        
        var staff = [];
        var activeFilter = 'all';
        var searchQuery = '';
        var root = document.getElementById('root');
        
        function getColor(team) {
            return COLORS[team] || '#21a0d8';
        }
        
        function getInitials(firstName, lastName) {
            var f = firstName || '?';
            var l = lastName || '?';
            return (f[0] + l[0]).toUpperCase();
        }

        function getTeams() {
            var teams = {};
            for (var i = 0; i < staff.length; i++) {
                if (staff[i].team) teams[staff[i].team] = true;
            }
            return Object.keys(teams).sort();
        }

        function getFiltered() {
            var filtered = staff;
            
            if (activeFilter !== 'all') {
                filtered = filtered.filter(function(s) { return s.team === activeFilter; });
            }
            
            if (searchQuery) {
                var q = searchQuery.toLowerCase();
                filtered = filtered.filter(function(s) {
                    var name = ((s.firstName || '') + ' ' + (s.lastName || '')).toLowerCase();
                    var role = (s.role || '').toLowerCase();
                    return name.indexOf(q) !== -1 || role.indexOf(q) !== -1;
                });
            }
            
            return filtered;
        }

        function render() {
            var teams = getTeams();
            var filtered = getFiltered();
            
            var filtersHtml = '<button class="filter-btn ' + (activeFilter === 'all' ? 'active' : '') + '" onclick="setFilter(\'all\')">All (' + staff.length + ')</button>';
            for (var i = 0; i < teams.length; i++) {
                var t = teams[i];
                var count = staff.filter(function(s) { return s.team === t; }).length;
                filtersHtml += '<button class="filter-btn ' + (activeFilter === t ? 'active' : '') + '" onclick="setFilter(\'' + t + '\')">' + t + ' (' + count + ')</button>';
            }
            
            var peopleHtml = '';
            for (var j = 0; j < filtered.length; j++) {
                var p = filtered[j];
                peopleHtml += '\
                    <div class="person-card">\
                        <div class="person-avatar" style="background:' + getColor(p.team) + '">' + getInitials(p.firstName, p.lastName) + '</div>\
                        <div class="person-name">' + (p.firstName || '') + ' ' + (p.lastName || '') + '</div>\
                        <div class="person-role">' + (p.role || 'Team Member') + '</div>\
                        <div class="person-team" style="color:' + getColor(p.team) + '">' + (p.team || '') + '</div>\
                    </div>\
                ';
            }
            
            root.innerHTML = '\
                <div class="widget">\
                    <div class="header">\
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>\
                        <h2 class="title">People Directory</h2>\
                        <div class="search-box">\
                            <span class="search-icon">🔍</span>\
                            <input type="text" class="search-input" placeholder="Search..." value="' + searchQuery + '" oninput="setSearch(this.value)">\
                        </div>\
                    </div>\
                    <div class="filters">' + filtersHtml + '</div>\
                    ' + (filtered.length === 0 ? '\
                        <div class="empty">\
                            <div class="empty-icon">👥</div>\
                            <div class="empty-title">' + (staff.length === 0 ? 'No Team Members' : 'No Results') + '</div>\
                            <div class="empty-sub">' + (staff.length === 0 ? 'Add staff to the staff_directory collection in Firebase.' : 'Try adjusting your search or filter.') + '</div>\
                        </div>\
                    ' : '\
                        <div class="people-grid">' + peopleHtml + '</div>\
                    ') + '\
                </div>\
            ';
        }

        window.setFilter = function(filter) {
            activeFilter = filter;
            render();
        };

        window.setSearch = function(query) {
            searchQuery = query;
            render();
        };

        function loadData() {
            root.innerHTML = '<div class="widget"><div class="loading"><div class="spinner"></div>Loading directory...</div></div>';
            
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('staff_directory')
                .onSnapshot(function(snapshot) {
                    staff = [];
                    snapshot.forEach(function(doc) {
                        staff.push(Object.assign({ id: doc.id }, doc.data()));
                    });
                    staff.sort(function(a, b) {
                        return (a.firstName || '').localeCompare(b.firstName || '');
                    });
                    render();
                }, function(error) {
                    console.error('Firestore error:', error);
                    staff = [];
                    render();
                });
        }

        auth.signInAnonymously().then(function() {
            loadData();
        }).catch(function(error) {
            console.error('Auth error:', error);
            staff = [];
            render();
        });
    </script>
</body>
</html>
