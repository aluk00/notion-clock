<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Activity Feed Header | DMG New Media</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --creative-pink: #E6468B;
            --prod-green: #43B049;
            --editorial-red: #E94B4B;
            --dist-yellow: #F2C316;
            --carbon: #121212;
            --border-grey: #EAECEF;
            --bg-white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        /* --- HEADER LOCKUP --- */
        .header-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem; /* Tightened from 1.5rem */
            max-width: 1400px;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .title-text {
            font-size: 4rem;
            font-weight: 800;
            color: var(--carbon);
            letter-spacing: -0.04em;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: uppercase;
        }

        /* Dots: Scaled to match the 4rem font height */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .dot {
            width: 100%; height: 100%;
            border-radius: 50%;
            transform: scale(0);
            animation: 
                popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                colorMorph 8s infinite ease-in-out,
                dotWave 2s infinite ease-in-out;
        }

        /* Staggered entrance and wave timing */
        .dot:nth-child(1) { animation-delay: 0.1s, 0.0s, 0.0s; }
        .dot:nth-child(2) { animation-delay: 0.2s, 0.2s, 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.2s, 0.4s, 0.4s; }
        .dot:nth-child(4) { animation-delay: 0.3s, 0.6s, 0.6s; }

        /* --- UNIFIED FEED BAR --- */
        .feed-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px; /* Slightly tightened padding */
            background: #FFFFFF;
            /* Blue Outline & Ambient Glow */
            border: 1.5px solid var(--dmg-blue);
            box-shadow: 0 4px 20px rgba(33, 160, 216, 0.12);
            border-radius: 16px;
            opacity: 0;
            animation: slideUpFade 0.8s 0.4s forwards;
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .description {
            font-size: 11px;
            font-weight: 800;
            color: var(--dmg-blue);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* --- BUTTONS --- */
        .button-group {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: #F9FAFB;
            border: 1px solid var(--border-grey);
            border-radius: 10px;
            padding: 8px 16px;
            text-decoration: none;
            color: var(--carbon);
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            border-color: var(--dmg-blue);
            background: #FFF;
            box-shadow: 0 5px 15px rgba(33, 160, 216, 0.1);
        }

        .nav-btn .arrow { 
            color: var(--dmg-blue); 
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .nav-btn:hover .arrow {
            transform: translateX(2px);
        }

        /* --- ANIMATIONS --- */
        @keyframes slideUpFade { 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes popIn { 
            to { transform: scale(1); } 
        }

        @keyframes dotWave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes colorMorph {
            0%, 100% { background-color: var(--editorial-red); }
            20% { background-color: var(--creative-pink); }
            40% { background-color: var(--prod-green); }
            60% { background-color: var(--dist-yellow); }
            80% { background-color: var(--dmg-blue); }
        }

        @media (max-width: 1024px) {
            .title-text { font-size: 3rem; }
            .dots-grid { width: 34px; height: 34px; gap: 4px; }
            .feed-bar { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .button-group { width: 100%; }
            .nav-btn { flex: 1; justify-content: center; }
        }

        @media (max-width: 768px) {
            .title-text { font-size: 2.2rem; }
            .dots-grid { width: 28px; height: 28px; gap: 4px; }
            .status-group { flex-direction: column; align-items: flex-start; gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Title & Dots Row -->
        <div class="title-row">
            <div class="title-text" style="animation-delay: 0.1s;">TEAM ACTIVITY FEED</div>
            
            <div class="dots-grid">
                <div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <!-- Unified Feed Bar -->
        <div class="feed-bar">
            <!-- Left Side: Status -->
            <div class="status-group">
                <div class="description">What's happening across DMG New Media right now</div>
            </div>

            <!-- Right Side: Navigation -->
            <div class="button-group">
                <a href="https://notion.so/my-feed" target="_top" class="nav-btn">
                    <span class="arrow">→</span> MY FEED
                </a>
                <a href="https://notion.so/filter-by-team" target="_top" class="nav-btn">
                    <span class="arrow">→</span> BY TEAM
                </a>
                <a href="https://notion.so/filter-by-stage" target="_top" class="nav-btn">
                    <span class="arrow">→</span> BY STAGE
                </a>
            </div>
        </div>
    </div>

</body>
</html>
