<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Divider</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Blends with background */
            overflow: hidden;
            display: flex;
            align-items: center;
            height: 100vh; /* Centers the line in the embed frame */
        }

        .line {
            width: 100%;
            height: 1.5px;
            background-color: #EAECEF; /* Canonical Grey */
            border: none;
        }
    </style>
</head>
<body>
    <div class="line"></div>
</body>
</html>
