<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Quick Links</title>
    <style>
        /* Core Styles */
        body {
            margin: 0;
            padding: 10px 20px; 
            display: flex;
            justify-content: flex-start; 
            background-color: transparent;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            width: 100%;
        }

        /* Container for the buttons */
        .links-container {
            display: flex;
            flex-wrap: wrap; 
            gap: 10px; 
            width: 100%;
        }

        /* Button Styling (Yellow Theme) */
        .link-btn {
            background-color: #FFC107; /* Yellow, matching the Social dots */
            color: black; /* Changed to black for contrast on yellow */
            padding: 10px 16px; 
            border-radius: 12px; 
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            white-space: nowrap; 
            
            /* Enhanced Clickable Look */
            border: 2px solid #ffaa00; /* Subtle border for definition */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); /* Lifted appearance */
        }

        .link-btn:hover {
            background-color: #ffaa00; /* Darker yellow on hover */
            transform: translateY(-2px); /* Lift button on hover */
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.25);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .link-btn {
                font-size: 11px;
                padding: 8px 12px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="links-container">
        
        <!-- TikTok Creative Center -->
        <a href="https://ads.tiktok.com/business/creativecenter/inspiration/topads/pc/en" target="_blank" class="link-btn">TikTok Creative Center</a>
        
        <!-- Tiktok Keyword Insights -->
        <a href="https://ads.tiktok.com/business/creativecenter/keyword-insights/pc/en" target="_blank" class="link-btn">TikTok Keyword Insights</a>
        
        <!-- Tiktok Creative Insights -->
        <a href="https://ads.tiktok.com/business/creativecenter/creative-trends/pc/en" target="_blank" class="link-btn">TikTok Creative Trends</a>
        
        <!-- Tiktok UK Trending -->
        <a href="https://www.tiktok.com/tag/trending-uk" target="_blank" class="link-btn">TikTok UK Trending</a>
        
        <!-- External Trend Tool -->
        <a href="https://trends.google.com/trends/" target="_blank" class="link-btn">Google Trends</a>
        
        <!-- UPDATED: DMG Stock Library Link -->
        <a href="YOUR_DMG_STOCK_LIBRARY_URL" target="_blank" class="link-btn">DMG Asset Library</a>

    </div>

</body>
</html>
