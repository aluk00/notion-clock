<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 400px;
            overflow: hidden;
        }
        .widget-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--dmg-blue);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        
        .section {
            padding: 16px 18px;
            border-bottom: 1px solid #F5F5F5;
        }
        .section:last-child { border-bottom: none; }
        
        .section-title {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--dmg-blue);
            margin-bottom: 12px;
        }
        
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .mood-option {
            padding: 10px 4px;
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mood-option:hover {
            border-color: var(--dmg-blue);
            background: #F0F9FF;
        }
        .mood-option.selected {
            border-color: var(--dmg-blue);
            background: #E0F2FE;
        }
        .mood-emoji { font-size: 20px; margin-bottom: 4px; }
        .mood-label { font-size: 8px; font-weight: 700; color: var(--ink-sub); }
        
        .song-inputs { display: flex; flex-direction: column; gap: 10px; }
        .input-field {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .input-field:focus { outline: none; border-color: var(--dmg-blue); }
        .input-field::placeholder { color: #BBB; }
        .spotify-hint {
            font-size: 10px;
            color: var(--ink-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .spotify-icon {
            width: 16px; height: 16px;
            border-radius: 4px;
            background: #1DB954;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
        }
        
        .save-section { padding: 16px 18px; background: var(--bg-soft); }
        .save-btn {
            width: 100%;
            padding: 14px;
            background: var(--dmg-blue);
            color: #FFF;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .save-btn:hover { background: #1a8ac6; transform: translateY(-1px); }
        
        .demo-badge {
            font-size: 7px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: #FFF; background: #E6468B;
            padding: 3px 6px; border-radius: 4px; margin-left: auto;
        }
        
        .toast {
            position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
            background: var(--ink); color: #FFF;
            padding: 12px 24px; border-radius: 99px;
            font-size: 12px; font-weight: 700;
            opacity: 0; transition: all 0.3s ease; z-index: 1000;
        }
        .toast.active { bottom: 30px; opacity: 1; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="toast" id="toast">Profile saved!</div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";
        
        const MOODS = [
            { emoji: '🔥', label: 'On Fire' },
            { emoji: '😤', label: 'In The Zone' },
            { emoji: '☕', label: 'Need Coffee' },
            { emoji: '🧘', label: 'Zen Mode' },
            { emoji: '🎉', label: 'Celebrating' },
            { emoji: '😴', label: 'Low Battery' },
            { emoji: '🤔', label: 'Thinking' },
            { emoji: '💪', label: 'Crushing It' }
        ];
        
        const STORAGE_KEY = 'dmg_profile_editor';
        let currentUser = null;
        let staffDirectory = [];
        let isDemo = true;
        let selectedMood = MOODS[0];
        let songTitle = '';
        let songArtist = '';
        let spotifyUrl = '';
        
        const root = document.getElementById('root');
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 2500);
        }
        
        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 style="font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); margin: 0;">
                            Edit Your Profile
                        </h2>
                        ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    </div>
                    
                    <div class="section">
                        <div class="section-title">How are you feeling?</div>
                        <div class="mood-grid">
                            ${MOODS.map(mood => `
                                <div class="mood-option ${selectedMood.emoji === mood.emoji ? 'selected' : ''}" 
                                     onclick="window.selectMood('${mood.emoji}', '${mood.label}')">
                                    <div class="mood-emoji">${mood.emoji}</div>
                                    <div class="mood-label">${mood.label}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">Song of the Moment</div>
                        <div class="song-inputs">
                            <input type="text" class="input-field" id="song-title" 
                                   placeholder="Song title" value="${songTitle}" onchange="window.updateSong()">
                            <input type="text" class="input-field" id="song-artist" 
                                   placeholder="Artist" value="${songArtist}" onchange="window.updateSong()">
                            <input type="text" class="input-field" id="spotify-url" 
                                   placeholder="Spotify link (optional)" value="${spotifyUrl}" onchange="window.updateSong()">
                            <div class="spotify-hint">
                                <span class="spotify-icon">🎵</span>
                                <span>Paste a Spotify track URL for the play button</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="save-section">
                        <button class="save-btn" onclick="window.saveProfile()">Save Profile</button>
                    </div>
                </div>
            `;
        }
        
        window.selectMood = (emoji, label) => { selectedMood = { emoji, label }; render(); };
        
        window.updateSong = () => {
            songTitle = document.getElementById('song-title')?.value || '';
            songArtist = document.getElementById('song-artist')?.value || '';
            spotifyUrl = document.getElementById('spotify-url')?.value || '';
        };
        
        window.saveProfile = async () => {
            window.updateSong();
            const profileData = {
                mood: selectedMood,
                song: { title: songTitle, artist: songArtist, spotifyUrl: spotifyUrl },
                updatedAt: new Date().toISOString()
            };
            
            if (isDemo || !currentUser) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(profileData));
                showToast('Profile saved! (Preview mode)');
                return;
            }
            
            try {
                await setDoc(doc(db, "artifacts", appId, "public", "data", "user_profiles", currentUser.id), profileData, { merge: true });
                showToast('Profile saved!');
            } catch (e) {
                console.error('Failed to save:', e);
                showToast('Failed to save. Try again.');
            }
        };
        
        async function loadExistingProfile(userId) {
            if (userId) {
                try {
                    const snap = await getDoc(doc(db, "artifacts", appId, "public", "data", "user_profiles", userId));
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.mood) selectedMood = data.mood;
                        if (data.song) {
                            songTitle = data.song.title || '';
                            songArtist = data.song.artist || '';
                            spotifyUrl = data.song.spotifyUrl || '';
                        }
                        return;
                    }
                } catch (e) { console.log('Failed to load profile:', e); }
            }
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (data.mood) selectedMood = data.mood;
                    if (data.song) {
                        songTitle = data.song.title || '';
                        songArtist = data.song.artist || '';
                        spotifyUrl = data.song.spotifyUrl || '';
                    }
                } catch (e) {}
            }
        }
        
        async function loadStaffDirectory() {
            try {
                const snap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                staffDirectory = [];
                snap.forEach(d => staffDirectory.push({ id: d.id, ...d.data() }));
            } catch (e) { console.error('Failed to load staff:', e); }
        }
        
        async function resolveIdentity(authUser) {
            await loadStaffDirectory();
            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');
            
            if (paramId) {
                const found = staffDirectory.find(s => s.id === paramId);
                if (found) { currentUser = found; isDemo = false; await loadExistingProfile(currentUser.id); render(); return; }
            }
            if (authUser && authUser.email && !authUser.isAnonymous) {
                const found = staffDirectory.find(s => s.email === authUser.email);
                if (found) { currentUser = found; isDemo = false; await loadExistingProfile(currentUser.id); render(); return; }
            }
            isDemo = true;
            await loadExistingProfile(null);
            render();
        }
        
        onAuthStateChanged(auth, (user) => {
            if (user) resolveIdentity(user);
            else signInAnonymously(auth);
        });
    </script>
</body>
</html>
