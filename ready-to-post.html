<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ready to Post</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #F2C316;
            --yellow-soft: rgba(242, 195, 22, 0.15);
            --yellow-dark: #B8860B;
            --green: #10B981;
            --amber: #F59E0B;
            --red: #EF4444;
            --border: #E5E7EB;
            --text-main: #1C1C1C;
            --text-sub: #6B7280;
            --bg-grey: #F9FAFB;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #FFF; padding: 20px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 24px; height: 24px; }
        .dot { width: 100%; height: 100%; background: var(--yellow); border-radius: 50%; }
        @keyframes heartbeat { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dot-anim { animation: heartbeat 3s infinite ease-in-out; }
        .dot-anim:nth-child(1) { animation-delay: 0s; }
        .dot-anim:nth-child(2) { animation-delay: 0.75s; }
        .dot-anim:nth-child(4) { animation-delay: 1.5s; }
        .dot-anim:nth-child(3) { animation-delay: 2.25s; }
        .title { font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-main); }
        .count { font-size: 12px; font-weight: 500; letter-spacing: 0.05em; color: var(--text-sub); }
        
    </style>
</head>
<body>
</body>
</html>
