<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Calendar | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        production: '#43B049',
                        editorial: '#E94B4B',
                        sales: '#21A0D8',
                        social: '#F59E0B',
                        creative: '#E6468B',
                        ink: '#1C1C1C',
                        'ink-sub': '#757575',
                        'bg-soft': '#F9FAFB',
                        border: '#EAECEF',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #E5E7EB;
            border-radius: 20px;
        }
    </style>
</head>
<body class="text-ink">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const INITIAL_VISIBLE = 5;

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const APP_ID = "dmg-command-centre-native";
        const COLLECTION_PATH = `artifacts/${APP_ID}/public/data/shoot_calendar_events`;

        const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

        const FORMAT_STYLES = {
            'PRODUCTION': 'bg-green-100 text-green-700',
            'STUDIO': 'bg-blue-100 text-blue-600',
            'LOCATION': 'bg-purple-100 text-purple-600',
            'REMOTE': 'bg-gray-100 text-gray-600',
            'EVENT': 'bg-pink-100 text-pink-600'
        };

        const DotGrid = () => (
            <div className="grid grid-cols-2 gap-[2px] w-[12px]">
                {[0, 1, 2, 3].map((i) => (
                    <span
                        key={i}
                        className="w-[5px] h-[5px] rounded-full bg-production animate-pulse"
                        style={{ animationDelay: `${i * 0.3}s` }}
                    />
                ))}
            </div>
        );

        const ShootCard = ({ item, onClick }) => {
            const formatClass = FORMAT_STYLES[item.format?.toUpperCase()] || 'bg-green-100 text-green-700';
            const hasNotes = !!item.notes;
            const hasLocation = !!item.location;

            return (
                <div
                    onClick={() => onClick && onClick(item)}
                    className="p-2 bg-white rounded-lg border border-border shadow-[0_2px_4px_rgba(0,0,0,0.02)] hover:shadow-[0_4px_8px_rgba(0,0,0,0.06)] hover:-translate-y-[1px] transition-all duration-200 flex gap-2 group cursor-pointer relative"
                >
                    <div className={`w-[14px] h-[14px] mt-[2px] rounded-full border-[1.5px] flex items-center justify-center text-[8px] flex-shrink-0 ${item.status === 'confirmed' ? 'bg-green-500 border-green-500 text-white' : item.status === 'tentative' ? 'bg-yellow-500 border-yellow-500 text-white' : 'border-gray-200'}`}>
                        {item.status === 'confirmed' ? '✓' : item.status === 'tentative' ? '◔' : ''}
                    </div>
                    <div className="flex-1 min-w-0">
                        <div className="flex flex-wrap gap-1 mb-1 items-center">
                            <span className={`text-[8px] font-extrabold uppercase px-1.5 py-0.5 rounded ${formatClass} tracking-wide`}>
                                {item.format || 'PRODUCTION'}
                            </span>
                            {item.time && (
                                <span className="text-[8px] font-bold uppercase px-1.5 py-0.5 rounded bg-gray-100 text-gray-500 border border-gray-200">
                                    {item.time}
                                </span>
                            )}
                            {item.producer && (
                                <span className="text-[8px] font-bold uppercase px-1.5 py-0.5 rounded bg-blue-50 text-blue-600 border border-blue-100">
                                    {item.producer}
                                </span>
                            )}
                        </div>
                        <div className="text-[10px] font-semibold text-ink leading-snug break-words mb-1">
                            {item.projectTitle || item.title || 'Untitled Shoot'}
                        </div>

                        {(hasLocation || hasNotes) && (
                            <div className="flex gap-2 pt-1 border-t border-gray-50">
                                {hasLocation && <span title="Location" className="text-[9px] text-gray-500">📍 {item.location}</span>}
                                {hasNotes && <span title="Has Notes" className="text-[9px] text-gray-400">📝 Notes</span>}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const DetailModal = ({ item, isOpen, onClose }) => {
            const modalRef = useRef(null);

            useEffect(() => {
                const handleEscape = (e) => {
                    if (e.key === 'Escape') onClose();
                };
                if (isOpen) {
                    document.addEventListener('keydown', handleEscape);
                    document.body.style.overflow = 'hidden';
                }
                return () => {
                    document.removeEventListener('keydown', handleEscape);
                    document.body.style.overflow = '';
                };
            }, [isOpen, onClose]);

            if (!isOpen || !item) return null;

            const formatClass = FORMAT_STYLES[item.format?.toUpperCase()] || 'bg-green-100 text-green-700';

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-in fade-in duration-200"
                    onClick={(e) => e.target === e.currentTarget && onClose()}
                >
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" />
                    <div
                        ref={modalRef}
                        className="relative bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in-95 slide-in-from-bottom-4 duration-200"
                    >
                        <div className="px-5 py-4 border-b border-gray-100 flex justify-between items-start bg-gradient-to-r from-production/5 to-transparent">
                            <div className="flex-1 pr-4">
                                <div className="flex flex-wrap gap-1.5 mb-2 items-center">
                                    <span className={`text-[9px] font-extrabold uppercase px-2 py-0.5 rounded ${formatClass} tracking-wide`}>
                                        {item.format || 'PRODUCTION'}
                                    </span>
                                    <span className={`text-[9px] font-bold uppercase px-2 py-0.5 rounded ${item.status === 'confirmed' ? 'bg-green-100 text-green-700' : item.status === 'tentative' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-600'}`}>
                                        {item.status || 'Pending'}
                                    </span>
                                </div>
                                <h2 className="text-sm font-bold text-ink leading-snug">
                                    {item.projectTitle || item.title || 'Untitled Shoot'}
                                </h2>
                            </div>
                            <button
                                onClick={onClose}
                                className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400 hover:text-ink transition-colors -mr-1 -mt-1"
                            >
                                ✕
                            </button>
                        </div>

                        <div className="p-5 space-y-4 max-h-[60vh] overflow-y-auto custom-scrollbar">
                            {item.time && (
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-lg bg-production/10 flex items-center justify-center text-production">
                                        <span className="text-sm">🕐</span>
                                    </div>
                                    <div>
                                        <div className="text-[9px] font-bold uppercase text-ink-sub tracking-wide">Time</div>
                                        <div className="text-xs font-semibold text-ink">{item.time}</div>
                                    </div>
                                </div>
                            )}

                            {item.location && (
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-blue-500">
                                        <span className="text-sm">📍</span>
                                    </div>
                                    <div>
                                        <div className="text-[9px] font-bold uppercase text-ink-sub tracking-wide">Location</div>
                                        <div className="text-xs font-semibold text-ink">{item.location}</div>
                                    </div>
                                </div>
                            )}

                            {item.producer && (
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-lg bg-purple-50 flex items-center justify-center text-purple-500">
                                        <span className="text-sm">👤</span>
                                    </div>
                                    <div>
                                        <div className="text-[9px] font-bold uppercase text-ink-sub tracking-wide">Producer</div>
                                        <div className="text-xs font-semibold text-ink">{item.producer}</div>
                                    </div>
                                </div>
                            )}

                            {item.notes && (
                                <div className="p-3 bg-bg-soft rounded-lg border border-dashed border-gray-200">
                                    <div className="text-[9px] font-bold uppercase text-ink-sub tracking-wide mb-1.5">Notes</div>
                                    <div className="text-xs text-ink leading-relaxed whitespace-pre-wrap">{item.notes}</div>
                                </div>
                            )}
                        </div>

                        <div className="px-5 py-3 border-t border-gray-100 bg-bg-soft flex justify-end">
                            <button
                                onClick={onClose}
                                className="px-4 py-2 text-[10px] font-bold uppercase bg-production text-white rounded-lg hover:bg-green-600 transition-colors"
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const DayColumn = ({ day, dayItems, isToday, onCardClick }) => {
            const [expanded, setExpanded] = useState(false);
            const hasMore = dayItems.length > INITIAL_VISIBLE;
            const displayItems = expanded ? dayItems : dayItems.slice(0, INITIAL_VISIBLE);
            const hiddenCount = dayItems.length - INITIAL_VISIBLE;

            return (
                <div className="min-h-[200px] md:min-h-[600px] flex flex-col">
                    <div className={`p-3 text-center border-b border-gray-50 transition-colors ${isToday ? 'bg-production/5' : 'bg-bg-soft'}`}>
                        <div className="text-[9px] font-bold uppercase text-ink-sub tracking-widest mb-0.5">
                            {day.weekday}
                        </div>
                        <div className={`text-lg font-black ${isToday ? 'text-production' : 'text-ink'}`}>
                            {day.dayNum}
                        </div>
                        {dayItems.length > 0 && (
                            <div className="mt-1">
                                <span className="text-[8px] font-bold px-1.5 py-0.5 rounded-full bg-gray-100 text-ink-sub">
                                    {dayItems.length} shoot{dayItems.length !== 1 ? 's' : ''}
                                </span>
                            </div>
                        )}
                    </div>

                    <div className={`flex-1 p-2 bg-white flex flex-col gap-2 ${expanded ? 'overflow-y-auto max-h-[500px] custom-scrollbar' : 'overflow-hidden'}`}>
                        {dayItems.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-start pt-8 opacity-20 hover:opacity-40 transition-opacity">
                                <div className="w-1 h-8 bg-gray-300 rounded-full mb-2"></div>
                                <span className="text-[8px] font-bold uppercase">No Shoots</span>
                            </div>
                        ) : (
                            <>
                                {displayItems.map((item) => (
                                    <ShootCard key={item.id} item={item} onClick={onCardClick} />
                                ))}
                                {hasMore && !expanded && (
                                    <button
                                        onClick={() => setExpanded(true)}
                                        className="mt-1 py-2 text-[9px] font-bold text-ink-sub hover:text-production transition-colors flex items-center justify-center gap-1 rounded-lg border border-dashed border-gray-200 hover:border-production/30 bg-gradient-to-t from-white to-transparent"
                                    >
                                        <span>+{hiddenCount} more</span>
                                        <span className="text-[7px]">▼</span>
                                    </button>
                                )}
                                {expanded && hasMore && (
                                    <button
                                        onClick={() => setExpanded(false)}
                                        className="mt-1 py-2 text-[9px] font-bold text-ink-sub hover:text-production transition-colors flex items-center justify-center gap-1 rounded-lg border border-dashed border-gray-200 hover:border-production/30 sticky bottom-0 bg-white"
                                    >
                                        <span>Show less</span>
                                        <span className="text-[7px]">▲</span>
                                    </button>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const getWeekStart = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        };

        const getWeekDates = (start) => {
            return Array.from({ length: 7 }, (_, i) => {
                const d = new Date(start);
                d.setDate(d.getDate() + i);
                return d;
            });
        };

        const formatDateKey = (date) => date.toISOString().split('T')[0];

        const App = () => {
            const [currentWeekStart, setCurrentWeekStart] = useState(getWeekStart(new Date()));
            const [shoots, setShoots] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedItem, setSelectedItem] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);

            useEffect(() => {
                const loadData = async () => {
                    try {
                        await auth.signInAnonymously();

                        const unsubscribe = db.collection(COLLECTION_PATH).onSnapshot((snapshot) => {
                            const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setShoots(items);
                            setLoading(false);
                        });

                        return () => unsubscribe();
                    } catch (error) {
                        console.error("Failed to load data", error);
                        setLoading(false);
                    }
                };

                loadData();
            }, []);

            const weekDates = useMemo(() => getWeekDates(currentWeekStart), [currentWeekStart]);

            const getShootsForDate = (date) => {
                const dateStr = formatDateKey(date);
                return shoots.filter(s => {
                    const targetDate = s.date || s.shootDate || s.dueDate || (s.startDateTime ? s.startDateTime.split('T')[0] : null);
                    return targetDate === dateStr;
                });
            };

            const handlePrevWeek = () => {
                const d = new Date(currentWeekStart);
                d.setDate(d.getDate() - 7);
                setCurrentWeekStart(d);
            };

            const handleNextWeek = () => {
                const d = new Date(currentWeekStart);
                d.setDate(d.getDate() + 7);
                setCurrentWeekStart(d);
            };

            const handleToday = () => {
                setCurrentWeekStart(getWeekStart(new Date()));
            };

            const formatWeekLabel = () => {
                const start = weekDates[0];
                const end = weekDates[6];
                const startMonth = start.toLocaleDateString('en-GB', { month: 'short' });
                const endMonth = end.toLocaleDateString('en-GB', { month: 'short' });

                if (startMonth === endMonth) {
                    return `${start.getDate()} - ${end.getDate()} ${startMonth}`;
                }
                return `${start.getDate()} ${startMonth} - ${end.getDate()} ${endMonth}`;
            };

            const isTodayDate = (date) => formatDateKey(date) === formatDateKey(new Date());

            const handleCardClick = (item) => {
                setSelectedItem(item);
                setIsModalOpen(true);
            };

            const handleCloseModal = () => {
                setIsModalOpen(false);
                setTimeout(() => setSelectedItem(null), 200);
            };

            return (
                <div className="p-4 font-sans text-ink">
                    <div className="bg-white rounded-2xl border border-border overflow-hidden max-w-[1400px] mx-auto transition-all duration-300 hover:shadow-xl">
                        <div className="px-4 py-3 border-b border-border flex items-center gap-4 bg-white sticky top-0 z-10">
                            <DotGrid />
                            <h1 className="flex-1 text-[13px] font-extrabold tracking-tight uppercase text-ink">
                                Production Calendar <span className="text-production mx-2">•</span> {formatWeekLabel()}
                            </h1>

                            <div className="flex gap-1">
                                <button
                                    onClick={handlePrevWeek}
                                    className="px-2.5 py-1.5 text-[10px] font-bold bg-bg-soft hover:bg-production hover:text-white rounded-md transition-colors"
                                >
                                    ←
                                </button>
                                <button
                                    onClick={handleToday}
                                    className="px-3 py-1.5 text-[10px] font-bold bg-bg-soft hover:bg-production hover:text-white rounded-md transition-colors"
                                >
                                    Today
                                </button>
                                <button
                                    onClick={handleNextWeek}
                                    className="px-2.5 py-1.5 text-[10px] font-bold bg-bg-soft hover:bg-production hover:text-white rounded-md transition-colors"
                                >
                                    →
                                </button>
                            </div>
                        </div>

                        {loading ? (
                            <div className="min-h-[400px] flex flex-col items-center justify-center gap-4 text-ink-sub">
                                <DotGrid />
                                <span className="text-[10px] font-bold uppercase tracking-widest">Syncing Ecosystem...</span>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-7 divide-y md:divide-y-0 md:divide-x divide-gray-100">
                                {weekDates.map((date, i) => {
                                    const dayItems = getShootsForDate(date);
                                    return (
                                        <DayColumn
                                            key={formatDateKey(date)}
                                            day={{ weekday: WEEKDAYS[i], dayNum: date.getDate() }}
                                            dayItems={dayItems}
                                            isToday={isTodayDate(date)}
                                            onCardClick={handleCardClick}
                                        />
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    <DetailModal
                        item={selectedItem}
                        isOpen={isModalOpen}
                        onClose={handleCloseModal}
                    />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
