<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Calendar | DMG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-green: #43B049;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            color: var(--ink);
            padding: 12px;
        }
        
        /* --- EXPANDED CONTAINER --- */
        .calendar-card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
            max-width: 1200px; /* Increased to fit 7 days comfortably */
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- SIGNATURE HEADER (Like Weekly Shoots) --- */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: white;
        }

        .header-branding {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-text {
            font-size: 16px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            width: 14px;
            height: 14px;
        }

        .dot {
            width: 100%;
            height: 100%;
            background-color: var(--brand-green);
            border-radius: 50%;
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }
        .dot:nth-child(4) { animation-delay: 0.9s; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }

        .week-label {
            font-size: 12px;
            font-weight: 800;
            color: var(--brand-green);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .nav-controls {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            padding: 8px 14px;
            font-size: 10px;
            font-weight: 800;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--ink-sub);
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            border-color: var(--brand-green);
            color: var(--brand-green);
            background: white;
        }
        
        /* --- CALENDAR GRID --- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: var(--border);
            gap: 1px;
        }
        
        .day-column {
            background: white;
            min-height: 160px;
            display: flex;
            flex-direction: column;
        }
        
        .day-header {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid #F5F5F5;
            background: var(--bg-soft);
        }
        .day-header.today {
            background: rgba(67,176,73,0.06);
            border-bottom: 2px solid var(--brand-green);
        }
        .day-name {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--ink-sub);
            letter-spacing: 0.1em;
        }
        .day-number {
            font-size: 18px;
            font-weight: 900;
            color: var(--ink);
            margin-top: 2px;
        }
        .day-header.today .day-number {
            color: var(--brand-green);
        }
        
        .day-content {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        
        /* --- SHOOT ITEM --- */
        .shoot-item {
            padding: 8px 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            border-left: 4px solid var(--brand-green);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
        }
        .shoot-item:hover {
            transform: translateY(-2px);
            border-color: var(--brand-green);
            box-shadow: 0 4px 12px rgba(67,176,73,0.12);
            z-index: 2;
        }
        
        .shoot-title {
            font-size: 10px;
            font-weight: 900;
            color: var(--ink);
            line-height: 1.2;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .shoot-meta {
            font-size: 8px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .shoot-format {
            color: var(--brand-green);
        }
        
        .empty-day {
            padding: 20px 8px;
            text-align: center;
            opacity: 0.3;
        }
        .empty-text {
            font-size: 14px;
            font-weight: 900;
            color: #CCC;
        }
        
        .loading {
            padding: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        window.firebaseModules = { initializeApp, getFirestore, collection, onSnapshot, getAuth, signInAnonymously, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        
        function ProductionCalendar() {
            const [shoots, setShoots] = useState([]);
            const [currentWeek, setCurrentWeek] = useState(() => {
                const d = new Date();
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                return new Date(d.setDate(diff));
            });
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                const { initializeApp, getFirestore, getAuth, signInAnonymously, onAuthStateChanged, collection, onSnapshot } = window.firebaseModules;
                
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                const appId = "dmg-command-centre-native";

                signInAnonymously(auth);

                const unsubAuth = onAuthStateChanged(auth, (user) => {
                    if (user) {
                        const q = collection(db, "artifacts", appId, "public", "data", "shoot_calendar_events");
                        const unsubShoots = onSnapshot(q, (snapshot) => {
                            const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setShoots(items);
                            setLoading(false);
                        });
                        return () => unsubShoots();
                    }
                });

                return () => unsubAuth();
            }, []);
            
            const weekDates = useMemo(() => {
                return Array.from({ length: 7 }, (_, i) => {
                    const d = new Date(currentWeek);
                    d.setDate(d.getDate() + i);
                    return d;
                });
            }, [currentWeek]);
            
            const isToday = (date) => {
                const today = new Date();
                return date.toDateString() === today.toDateString();
            };
            
            const getShootsForDate = (date) => {
                const dateStr = date.toISOString().split('T')[0];
                return shoots.filter(s => {
                    const targetDate = s.date || s.shootDate || s.dueDate || (s.startDateTime ? s.startDateTime.split('T')[0] : null);
                    return targetDate === dateStr;
                });
            };
            
            const formatWeekLabel = () => {
                const start = weekDates[0];
                const end = weekDates[6];
                const startMonth = start.toLocaleDateString('en-GB', { month: 'short' });
                const endMonth = end.toLocaleDateString('en-GB', { month: 'short' });
                if (startMonth === endMonth) {
                    return `${start.getDate()} - ${end.getDate()} ${startMonth}`;
                }
                return `${start.getDate()} ${startMonth} - ${end.getDate()} ${endMonth}`;
            };
            
            const shiftWeek = (delta) => {
                const d = new Date(currentWeek);
                d.setDate(d.getDate() + delta);
                setCurrentWeek(d);
            };
            
            const goToday = () => {
                const d = new Date();
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                setCurrentWeek(new Date(d.setDate(diff)));
            };
            
            if (loading) return (
                <div className="calendar-card loading">
                    <div className="dots-grid">
                        <div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div>
                    </div>
                </div>
            );

            return (
                <div className="calendar-card">
                    <div className="header-container">
                        <div className="header-branding">
                            <div className="dots-grid">
                                <div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div>
                            </div>
                        </div>

                        <div className="week-label">{formatWeekLabel()}</div>

                        <div className="nav-controls">
                            <button className="nav-btn" onClick={() => shiftWeek(-7)}>← PREV</button>
                            <button className="nav-btn" onClick={goToday}>TODAY</button>
                            <button className="nav-btn" onClick={() => shiftWeek(7)}>NEXT →</button>
                        </div>
                    </div>
                    
                    <div className="calendar-grid">
                        {weekDates.map((date, i) => {
                            const dayItems = getShootsForDate(date);
                            return (
                                <div key={i} className="day-column">
                                    <div className={`day-header ${isToday(date) ? 'today' : ''}`}>
                                        <div className="day-name">{WEEKDAYS[i]}</div>
                                        <div className="day-number">{date.getDate()}</div>
                                    </div>
                                    <div className="day-content">
                                        {dayItems.length === 0 ? (
                                            <div className="empty-day">
                                                <div className="empty-text">—</div>
                                            </div>
                                        ) : (
                                            dayItems.map((item, j) => (
                                                <div key={j} className="shoot-item">
                                                    <div className="shoot-title">{item.projectTitle || item.title || 'Untitled Shoot'}</div>
                                                    <div className="shoot-meta">
                                                        {item.time && <span className="shoot-time">{item.time} • </span>}
                                                        <span className="shoot-format">{item.format || 'PRODUCTION'}</span>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProductionCalendar />);
    </script>
</body>
</html>
