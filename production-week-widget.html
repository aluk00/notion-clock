<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Week View | DMG New Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --hero-blue: #21a0d8; 
            --carbon: #1C1C1C; 
            --border: #E5E7EB; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #FFFFFF; color: var(--carbon); overflow-x: hidden; }
        
        /* Ultra-compact container */
        .widget-wrapper { padding: 10px; background: #FFF; width: 100%; max-width: 800px; margin: 0 auto; }
        
        /* Ultra-compact header */
        .header-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
        .header-title { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; color: #666; }
        
        /* Smaller dots */
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 12px; height: 12px; }
        .dots-grid span { background: var(--hero-blue); border-radius: 50%; opacity: 0.6; }
        
        /* Square Grid Configuration */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 6px; 
        }
        
        /* Aspect Ratio forced to Square */
        .event-card { 
            background: #FFF; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            padding: 10px; 
            cursor: pointer; 
            transition: 0.3s; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            aspect-ratio: 1 / 1; /* Makes the card square */
            justify-content: space-between;
        }
        .event-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--hero-blue); }
        .event-card:hover { transform: translateY(-2px); border-color: var(--hero-blue); box-shadow: 0 4px 12px rgba(33, 160, 216, 0.1); }
        
        /* Ultra-compact typography */
        .card-date-num { font-size: 9px; font-weight: 800; color: var(--hero-blue); text-transform: uppercase; }
        .card-title { 
            font-size: 9px; 
            font-weight: 800; 
            color: var(--carbon); 
            line-height: 1.2; 
            margin: 4px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .lead-pill { 
            font-size: 7px; 
            font-weight: 900; 
            color: var(--hero-blue); 
            background: #F0F9FF; 
            padding: 2px 6px; 
            border-radius: 4px; 
            text-transform: uppercase; 
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        
        @media (max-width: 480px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }

        #loading { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--hero-blue); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="loading">SYNCING...</div>

<div class="widget-wrapper">
    <div class="header-row">
        <div class="dots-grid"><span></span><span></span><span></span><span></span></div>
        <h1 class="header-title">Weekly Shoots</h1>
    </div>
    <div id="gridInner" class="grid-container"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const appId = "dmg-command-centre-native";
    const firebaseConfig = { apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY", authDomain: "dmg-command-centre-native.firebaseapp.com", projectId: "dmg-command-centre-native", storageBucket: "dmg-command-centre-native.firebasestorage.app", messagingSenderId: "223535956454", appId: "1:223535956454:web:b25e5bc69d8a4a7f209627" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    let state = { events: [], staff: [] };

    function resolveLeadProducer(ev) {
        if (ev.productionLeadId) {
            const found = state.staff.find(s => s.id === ev.productionLeadId);
            if (found) return `${found.firstName} ${found.lastName}`;
        }
        if (ev.freelanceOwnerName) return ev.freelanceOwnerName;
        return 'TBC';
    }

    function render() {
        const inner = document.getElementById('gridInner'); inner.innerHTML = '';
        
        // Show up to 9 square cards for a clean 3x3 layout
        state.events.slice(0, 9).forEach(ev => {
            const date = ev.startDateTime ? new Date(ev.startDateTime) : null;
            const lead = resolveLeadProducer(ev);
            const card = document.createElement('div');
            card.className = 'event-card';
            card.innerHTML = `
                <div class="card-date-num">${date ? date.getDate() + ' ' + date.toLocaleDateString('en-GB', {month: 'short'}) : 'TBC'}</div>
                <div class="card-title">${ev.projectTitle || ev.title || 'Untitled'}</div>
                <div><span class="lead-pill">${lead}</span></div>
            `;
            inner.appendChild(card);
        });
    }

    signInAnonymously(auth);
    onAuthStateChanged(auth, async (u) => {
        if (!u) return;
        const staffSnap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
        state.staff = staffSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        onSnapshot(collection(db, "artifacts", appId, "public", "data", "shoot_calendar_events"), snap => {
            state.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            document.getElementById('loading').style.display = 'none';
            render();
        });
    });
</script>
</body>
</html>
