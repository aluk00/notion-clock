<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Shoots | DMG New Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dmg-blue: #21a0d8; 
            --ink: #1C1C1C; 
            --ink-sub: #757575;
            --border: #EAECEF; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: transparent; 
            color: var(--ink); 
            overflow-x: hidden; 
            padding: 0;
        }

        /* --- SIGNATURE HEADER --- */
        .header-container {
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1;
            margin-bottom: 12px;
            padding: 10px 2px 0 2px;
        }

        .title-text {
            font-size: 0.8rem; /* Scaled down slightly to accommodate longer commercial text */
            font-weight: 900;
            color: var(--ink);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .dot {
            width: 100%;
            height: 100%;
            background-color: var(--dmg-blue);
            border-radius: 50%;
            opacity: 0.8;
        }

        /* --- GRID LAYOUT --- */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 8px; 
            padding: 2px;
        }
        
        /* Square Event Card */
        .event-card { 
            background: #FFF; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 10px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            aspect-ratio: 1 / 1;
            justify-content: space-between;
        }

        .event-card::before { 
            content: ""; 
            position: absolute; 
            left: 0; top: 0; bottom: 0; 
            width: 3px; 
            background: var(--dmg-blue); 
            opacity: 0.4;
        }

        .event-card:hover { 
            transform: translateY(-2px); 
            border-color: var(--dmg-blue); 
            box-shadow: 0 4px 12px rgba(33, 160, 216, 0.12); 
        }
        
        .card-date { 
            font-size: 9px; 
            font-weight: 800; 
            color: var(--dmg-blue); 
            text-transform: uppercase; 
            letter-spacing: 0.02em;
        }

        .card-title { 
            font-size: 10px; 
            font-weight: 800; 
            color: var(--ink); 
            line-height: 1.25; 
            margin: 4px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .lead-pill { 
            font-size: 7px; 
            font-weight: 900; 
            color: var(--dmg-blue); 
            background: #F0F9FF; 
            padding: 3px 6px; 
            border-radius: 4px; 
            text-transform: uppercase; 
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            border: 1px solid rgba(33, 160, 216, 0.1);
        }

        #loading { 
            padding: 20px; 
            text-align: center; 
            font-weight: 900; 
            color: #CCC; 
            font-size: 9px; 
            letter-spacing: 0.2em; 
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 40px 20px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-sub);
            background: #FAFAFA;
            border-radius: 12px;
            border: 1px dashed var(--border);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-text">THIS WEEKS</div>
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="title-text">COMMERCIAL SHOOTS</div>
    </div>

    <div id="loading">SYNCING...</div>
    <div id="gridInner" class="grid-container"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const appId = "dmg-command-centre-native";
    const firebaseConfig = { apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY", authDomain: "dmg-command-centre-native.firebaseapp.com", projectId: "dmg-command-centre-native", storageBucket: "dmg-command-centre-native.firebasestorage.app", messagingSenderId: "223535956454", appId: "1:223535956454:web:b25e5bc69d8a4a7f209627" };
    
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app); 
    const db = getFirestore(app);

    let state = { events: [], staff: [] };

    function resolveLeadProducer(ev) {
        if (ev.productionLeadId) {
            const found = state.staff.find(s => s.id === ev.productionLeadId);
            if (found) return `${found.firstName} ${found.lastName}`;
        }
        return ev.freelanceOwnerName || 'TBC';
    }

    function render() {
        const inner = document.getElementById('gridInner'); 
        inner.innerHTML = '';
        
        const now = new Date();
        const endOfWeek = new Date();
        endOfWeek.setDate(now.getDate() + 7);

        // Filter: Only show events within the next 7 days
        const weeklyEvents = state.events.filter(ev => {
            if (!ev.startDateTime) return false;
            const eventDate = new Date(ev.startDateTime);
            return eventDate >= new Date(now.setHours(0,0,0,0)) && eventDate <= endOfWeek;
        });

        const sorted = weeklyEvents.sort((a,b) => new Date(a.startDateTime) - new Date(b.startDateTime));

        if (sorted.length === 0) {
            inner.innerHTML = '<div class="empty-state">No shoots scheduled this week.</div>';
            return;
        }

        sorted.slice(0, 9).forEach(ev => {
            const date = new Date(ev.startDateTime);
            const lead = resolveLeadProducer(ev);
            const card = document.createElement('div');
            card.className = 'event-card';
            card.innerHTML = `
                <div class="card-date">${date.getDate()} ${date.toLocaleDateString('en-GB', {month: 'short'})}</div>
                <div class="card-title">${ev.projectTitle || ev.title || 'Untitled Shoot'}</div>
                <div><span class="lead-pill">${lead}</span></div>
            `;
            inner.appendChild(card);
        });
    }

    signInAnonymously(auth);
    onAuthStateChanged(auth, async (u) => {
        if (!u) return;
        
        // Load staff directory once
        const staffSnap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
        state.staff = staffSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        
        // Listen for live shoot updates
        onSnapshot(collection(db, "artifacts", appId, "public", "data", "shoot_calendar_events"), snap => {
            state.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            document.getElementById('loading').style.display = 'none';
            render();
        });
    });
</script>
</body>
</html>
