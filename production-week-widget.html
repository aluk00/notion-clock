<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Week View | DMG New Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --hero-blue: #21a0d8; 
            --carbon: #1C1C1C; 
            --border: #E5E7EB; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #FFFFFF; color: var(--carbon); overflow-x: hidden; }
        
        /* Scaled down container padding */
        .widget-wrapper { padding: 15px; background: #FFF; width: 100%; margin: 0 auto; }
        
        /* Scaled down header */
        .header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
        .header-title { font-size: 0.9rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; }
        
        /* Scaled down dots */
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 14px; height: 14px; }
        .dots-grid span { background: var(--hero-blue); border-radius: 50%; }
        
        /* Scaled down grid gap */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        @media (max-width: 1024px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .grid-container { grid-template-columns: 1fr; } } 
        
        /* Scaled down cards */
        .event-card { 
            background: #FFF; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 12px; 
            cursor: pointer; 
            transition: 0.3s; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            min-height: 100px; 
        }
        .event-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--hero-blue); }
        .event-card:hover { transform: translateY(-3px); border-color: var(--hero-blue); box-shadow: 0 8px 20px rgba(33, 160, 216, 0.12); }
        
        /* Scaled down typography */
        .card-date-num { font-size: 11px; font-weight: 800; color: var(--hero-blue); }
        .card-title { font-size: 11px; font-weight: 800; color: var(--carbon); line-height: 1.25; flex-grow: 1; margin: 6px 0; }
        .lead-pill { font-size: 7.5px; font-weight: 900; color: var(--hero-blue); background: #F0F9FF; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; display: inline-block; }
        
        #loading { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--hero-blue); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="loading">SYNCING SHOOTS...</div>

<div class="widget-wrapper">
    <div class="header-row">
        <div class="dots-grid"><span></span><span></span><span></span><span></span></div>
        <h1 class="header-title">Shoots This Week</h1>
    </div>
    <div id="gridInner" class="grid-container"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const appId = "dmg-command-centre-native";
    const firebaseConfig = { apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY", authDomain: "dmg-command-centre-native.firebaseapp.com", projectId: "dmg-command-centre-native" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    let state = { events: [], staff: [] };

    function resolveLeadProducer(ev) {
        if (ev.productionLeadId) {
            const found = state.staff.find(s => s.id === ev.productionLeadId);
            if (found) return `${found.firstName} ${found.lastName}`;
        }
        if (ev.freelanceOwnerName) return ev.freelanceOwnerName;
        return 'TBC';
    }

    function render() {
        const inner = document.getElementById('gridInner'); inner.innerHTML = '';
        // Slice top 9 events for the compact grid
        state.events.slice(0, 9).forEach(ev => {
            const date = ev.startDateTime ? new Date(ev.startDateTime) : null;
            const lead = resolveLeadProducer(ev);
            const card = document.createElement('div');
            card.className = 'event-card';
            card.innerHTML = `
                <div class="card-date-num">${date ? date.getDate() + ' ' + date.toLocaleDateString('en-GB', {month: 'short'}) : 'Date TBC'}</div>
                <div class="card-title">${ev.projectTitle || ev.title || 'Untitled Shoot'}</div>
                <div><span class="lead-pill">${lead}</span></div>
            `;
            inner.appendChild(card);
        });
    }

    signInAnonymously(auth);
    onAuthStateChanged(auth, async (u) => {
        if (!u) return;
        const staffSnap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
        state.staff = staffSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        onSnapshot(collection(db, "artifacts", appId, "public", "data", "shoot_calendar_events"), snap => {
            state.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            document.getElementById('loading').style.display = 'none';
            render();
        });
    });
</script>
</body>
</html>
