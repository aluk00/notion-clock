<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Capacity & Workload Header</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            padding-left: 20px;
        }

        .header-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .title-text {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .carbon {
            color: #1C1C1C;
            animation-delay: 0.1s;
        }

        .dmg-blue {
            color: #21a0d8;
            animation-delay: 0.3s;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1024px) {
            .title-text { font-size: 3rem; }
        }

        @media (max-width: 768px) {
            .title-text { font-size: 2.2rem; }
            .header-container { gap: 0.4rem; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Part 1: Carbon -->
        <div class="title-text carbon">Understanding</div>
        
        <!-- Part 2: DMG Blue -->
        <div class="title-text dmg-blue">Capacity & Workload</div>
    </div>

</body>
</html>
