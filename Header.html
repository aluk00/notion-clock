<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header | DMG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
            --accent: #21A0D8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            padding: 16px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, 
                #21A0D8 0%, 
                #43B049 25%, 
                #F2C316 50%, 
                #E6468B 75%, 
                #E94B4B 100%
            );
        }
        
        /* Animated Dot Grid */
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 8px);
            gap: 4px;
        }
        .dot-grid span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot-grid span:nth-child(1) { animation-delay: 0s; background: #21A0D8; }
        .dot-grid span:nth-child(2) { animation-delay: 0.3s; background: #43B049; }
        .dot-grid span:nth-child(3) { animation-delay: 0.6s; background: #E6468B; }
        .dot-grid span:nth-child(4) { animation-delay: 0.3s; background: #F2C316; }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .title-block {
            flex: 1;
        }
        
        .title {
            font-size: 22px;
            font-weight: 900;
            color: var(--ink);
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        
        .title span {
            color: var(--accent);
        }
        
        .subtitle {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-sub);
            margin-top: 4px;
        }
        
        /* Live indicator */
        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(67, 176, 73, 0.1);
            border-radius: 20px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43B049;
            animation: livePulse 1.5s infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(67,176,73,0.4); }
            50% { opacity: 0.8; box-shadow: 0 0 0 6px transparent; }
        }
        .live-text {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #43B049;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="dot-grid">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <div class="title-block">
            <h1 class="title">DMG <span>Command Centre</span></h1>
            <p class="subtitle">New Media Operations Hub</p>
        </div>
        
        <div class="live-badge">
            <div class="live-dot"></div>
            <span class="live-text">Live</span>
        </div>
    </div>
</body>
</html>
