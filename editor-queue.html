<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Queue | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --production: #43B049;
            --production-light: rgba(67, 176, 73, 0.1);
            --urgent: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            --ink: #1C1C1C;
            --ink-light: #6B7280;
            --border: #E5E7EB;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; color: var(--ink); padding: 16px; -webkit-font-smoothing: antialiased; }
        .dots { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--production); }
        .dots span:nth-child(1) { animation: pulse 2s ease-in-out infinite; }
        .dots span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dots span:nth-child(3) { animation: pulse 2s ease-in-out 0.6s infinite; }
        .dots span:nth-child(4) { animation: pulse 2s ease-in-out 0.9s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .queue-label { font-size: 11px; font-weight: 700; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; }
        .stats { margin-left: auto; display: flex; gap: 16px; }
        .stat { display: flex; align-items: center; gap: 6px; }
        .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
        .stat-value { font-size: 12px; font-weight: 700; }
        .stat-label { font-size: 10px; color: var(--ink-light); }
        .columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        @media (max-width: 900px) { .columns { grid-template-columns: 1fr; } }
        .column { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-height: 400px; }
        .column-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .column-dot { width: 8px; height: 8px; border-radius: 50%; }
        .column-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-light); }
        .column-count { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--ink-light); background: var(--surface-alt); padding: 2px 8px; border-radius: 10px; }
        .cards { display: flex; flex-direction: column; gap: 10px; }
        .card { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; position: relative; transition: var(--transition); }
        .card:hover { border-color: var(--ink-light); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .card-priority { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
        .card-priority.high { background: var(--urgent); }
        .card-priority.medium { background: var(--warning); }
        .card-priority.low { background: var(--success); }
        .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
        .card-type { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 4px; background: var(--production-light); color: var(--production); }
        .card-effort { font-size: 9px; font-weight: 600; color: var(--ink-light); }
        .card-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; margin-bottom: 6px; }
        .card-project { font-size: 10px; color: var(--ink-light); margin-bottom: 10px; }
        .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .card-due { font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: var(--surface); }
        .card-due.overdue { background: rgba(239, 68, 68, 0.1); color: var(--urgent); }
        .card-due.soon { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .card-editor { font-size: 10px; color: var(--ink-light); margin-left: auto; }
        .card-blocker { font-size: 10px; font-weight: 600; color: var(--urgent); padding: 4px 8px; border-radius: 4px; background: rgba(239, 68, 68, 0.1); margin-top: 8px; display: flex; align-items: center; gap: 4px; }
        .empty { text-align: center; padding: 40px 20px; color: var(--ink-light); font-size: 11px; font-weight: 500; }
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; gap: 12px; }
        .loading-text { font-size: 11px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.1em; }
        .error { text-align: center; padding: 40px; color: var(--urgent); font-size: 12px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <span class="queue-label">Editor Queue</span>
        <div class="stats">
            <div class="stat">
                <div class="stat-dot" style="background: var(--urgent)"></div>
                <span class="stat-value" id="blockedCount">0</span>
                <span class="stat-label">Blocked</span>
            </div>
            <div class="stat">
                <div class="stat-dot" style="background: var(--warning)"></div>
                <span class="stat-value" id="dueTodayCount">0</span>
                <span class="stat-label">Due Today</span>
            </div>
        </div>
    </div>
    <div class="columns" id="columns">
        <div class="loading">
            <div class="dots"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading queue...</span>
        </div>
    </div>
<script type="module">
    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

    // Column definitions based on DESK STATE / workflow
    const COLUMNS = [
        { key: 'ready', title: 'Ready for Edit', color: 'var(--success)', filter: d => d.deskState === 'Ready for Edit' && !d.editBlocker },
        { key: 'in-progress', title: 'In Progress', color: 'var(--warning)', filter: d => d.deskState === 'In Edit' || d.productionStatus === 'In Progress' },
        { key: 'blocked', title: 'Blocked', color: 'var(--urgent)', filter: d => d.editBlocker === true }
    ];

    let deliverables = [];

    function isOverdue(dateStr) {
        if (!dateStr) return false;
        return new Date(dateStr) < new Date();
    }

    function isDueSoon(dateStr) {
        if (!dateStr) return false;
        const due = new Date(dateStr);
        const now = new Date();
        const diff = (due - now) / (1000 * 60 * 60 * 24);
        return diff >= 0 && diff <= 2;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        const now = new Date();
        const diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
        if (diff < 0) return `${Math.abs(diff)}d overdue`;
        if (diff === 0) return 'Today';
        if (diff === 1) return 'Tomorrow';
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function getPriority(d) {
        if (d.priorityLevel === 'High' || d.priorityLevel === 'Urgent') return 'high';
        if (d.priorityLevel === 'Medium') return 'medium';
        return 'low';
    }

    function getAssetType(d) {
        if (d.movingAssetsNeeded?.length > 0) {
            if (d.movingAssetsNeeded.includes('9:16 Video')) return '9:16 VIDEO';
            if (d.movingAssetsNeeded.includes('16:9 Video')) return '16:9 VIDEO';
            return 'VIDEO';
        }
        return 'EDIT';
    }

    function render() {
        // Filter to only deliverables that need editing (have moving assets or are in edit workflow)
        const editQueue = deliverables.filter(d => 
            (d.movingAssetsNeeded?.length > 0 || d.movingAssetCount > 0) &&
            d.status !== 'Live' && d.status !== 'Published' && d.status !== 'Complete'
        );

        // Stats
        const blocked = editQueue.filter(d => d.editBlocker).length;
        const dueToday = editQueue.filter(d => {
            if (!d.dueDate) return false;
            return d.dueDate.startsWith(new Date().toISOString().split('T')[0]);
        }).length;

        document.getElementById('blockedCount').textContent = blocked;
        document.getElementById('dueTodayCount').textContent = dueToday;

        document.getElementById('columns').innerHTML = COLUMNS.map(col => {
            const items = editQueue.filter(col.filter);
            // Sort by due date
            items.sort((a, b) => {
                if (!a.dueDate) return 1;
                if (!b.dueDate) return -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });

            return `
                <div class="column">
                    <div class="column-header">
                        <div class="column-dot" style="background: ${col.color}"></div>
                        <span class="column-title">${col.title}</span>
                        <span class="column-count">${items.length}</span>
                    </div>
                    <div class="cards">
                        ${items.length === 0 ? '<div class="empty">No items</div>' : items.map(d => {
                            const overdue = isOverdue(d.dueDate);
                            const soon = isDueSoon(d.dueDate);
                            return `
                                <div class="card">
                                    <div class="card-priority ${getPriority(d)}"></div>
                                    <div class="card-top">
                                        <span class="card-type">${getAssetType(d)}</span>
                                        <span class="card-effort">${d.editorEffort || 0} pts</span>
                                    </div>
                                    <div class="card-title">${d.title || 'Untitled'}</div>
                                    <div class="card-project">${d.projectTitle || d.project || 'No project'}</div>
                                    <div class="card-meta">
                                        ${d.dueDate ? `<span class="card-due ${overdue ? 'overdue' : (soon ? 'soon' : '')}">${formatDate(d.dueDate)}</span>` : ''}
                                        <span class="card-editor">${d.videoEditor || 'Unassigned'}</span>
                                    </div>
                                    ${d.editBlocker ? `<div class="card-blocker">⚠️ ${typeof d.editBlocker === 'string' ? d.editBlocker : 'Blocked'}</div>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    async function loadData() {
        try {
            const res = await fetch(`${API_URL}/deliverables`);
            const data = await res.json();
            deliverables = data.deliverables || data.projects || [];
            render();
        } catch (err) {
            console.error('Failed to load deliverables', err);
            document.getElementById('columns').innerHTML = '<div class="error">Failed to load queue. Check API connection.</div>';
        }
    }

    loadData();
    // Refresh every 60 seconds
    setInterval(loadData, 60000);
</script>
</body>
</html>
