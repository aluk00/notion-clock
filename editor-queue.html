<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Queue | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue: #21a0d8; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; --production: #43B049; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 500px; overflow: hidden; }
        .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; }
        .dot-grid span { width: 5px; height: 5px; border-radius: 50%; background: var(--production); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 13px; font-weight: 800; }
        .count { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #DCFCE7; color: #166534; margin-left: auto; }
        .list { max-height: 300px; overflow-y: auto; }
        .item { padding: 14px 20px; border-bottom: 1px solid #F5F5F5; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.15s; }
        .item:hover { background: var(--bg-soft); }
        .item:last-child { border-bottom: none; }
        .item-icon { width: 36px; height: 36px; border-radius: 10px; background: #DCFCE7; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .item-info { flex: 1; min-width: 0; }
        .item-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-sub { font-size: 11px; color: var(--ink-sub); }
        .item-priority { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 99px; text-transform: uppercase; }
        .priority-high { background: #FEE2E2; color: #B91C1C; }
        .priority-medium { background: #FEF3C7; color: #B45309; }
        .priority-low { background: #E5E5E5; color: #525252; }
        .source-legend { font-size: 9px; color: var(--ink-sub); margin-top: 4px; }
        .source-legend span { font-weight: 600; }
        .empty { padding: 50px 20px; text-align: center; }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 50px; color: var(--ink-sub); font-size: 12px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--production); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== PROJECT DETAIL VIEW ===== */
        .project-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .project-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .project-detail {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 95%;
            max-width: 900px;
            max-height: 90vh;
            background: #FFF;
            border-radius: 16px;
            overflow: hidden;
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }
        .project-detail.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .project-detail-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, var(--bg-soft) 0%, #FFF 100%);
        }

        .project-back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: #FFF;
            cursor: pointer;
            color: var(--ink-sub);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .project-back-btn:hover {
            background: var(--bg-soft);
            border-color: #D1D5DB;
            color: var(--ink);
        }
        .project-back-btn svg { width: 14px; height: 14px; }

        .project-title-section { flex: 1; }
        .project-client-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        .project-title-main {
            font-size: 20px;
            font-weight: 900;
            color: var(--ink);
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .project-status-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .project-detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 700px) {
            .project-detail-content { grid-template-columns: 1fr; }
        }

        .detail-section {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }
        .detail-section-title {
            font-size: 10px;
            font-weight: 800;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-section-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .detail-field {
            margin-bottom: 12px;
        }
        .detail-field:last-child { margin-bottom: 0; }
        .detail-field-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }
        .detail-field-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
        }
        .detail-field-value.empty { color: var(--ink-sub); font-style: italic; }

        .detail-actions {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .detail-action-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: #FFF;
            cursor: pointer;
            color: var(--ink);
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .detail-action-btn:hover {
            background: var(--production);
            color: white;
            border-color: var(--production);
        }
        .detail-action-btn.primary {
            background: var(--production);
            color: white;
            border-color: var(--production);
        }
    </style>
</head>
<body>
    <div id="root"><div class="loading"><div class="spinner"></div>Loading...</div></div>

    <div class="project-overlay" id="projectOverlay" onclick="closeProjectDetail()"></div>
    <div class="project-detail" id="projectDetail"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        const auth = getAuth(app), db = getFirestore(app), appId = "dmg-command-centre-native";
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

        let items = [], rundownItems = [], apiDeliverables = [], loading = true;

        // Project Detail View Functions
        window.openProjectDetail = function(itemData) {
            const detail = document.getElementById('projectDetail');
            const statusColor = getStatusColor(itemData.status);
            const formatDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : 'Not set';
            const formatCurrency = (val) => val ? `£${Number(val).toLocaleString()}` : 'Not set';

            detail.innerHTML = `
                <div class="project-detail-header">
                    <button class="project-back-btn" onclick="closeProjectDetail()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        Back
                    </button>
                    <div class="project-title-section">
                        <div class="project-client-name">${itemData.clientName || itemData.projectTitle || 'Edit Task'}</div>
                        <div class="project-title-main">${itemData.title || 'Untitled Edit'}</div>
                    </div>
                    <div class="project-status-badge" style="background: ${statusColor}15; color: ${statusColor}">${itemData.priority || 'Medium'}</div>
                </div>

                <div class="project-detail-content">
                    <!-- Task Details Section -->
                    <div class="detail-section">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: var(--production)"></div>
                            Task Details
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Priority</div>
                            <div class="detail-field-value">${itemData.priority || 'Medium'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Status</div>
                            <div class="detail-field-value">${itemData.status || 'Not Started'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Format</div>
                            <div class="detail-field-value ${!itemData.format ? 'empty' : ''}">${itemData.format || 'Not specified'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Source</div>
                            <div class="detail-field-value">${itemData.source === 'api' ? 'Master Ledger' : itemData.source === 'rundown' ? 'Daily Rundown' : 'Edit Queue'}</div>
                        </div>
                    </div>

                    <!-- Team Section -->
                    <div class="detail-section">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: #9333EA"></div>
                            Team
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Video Editor</div>
                            <div class="detail-field-value">${itemData.editor || 'Unassigned'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Creative Lead</div>
                            <div class="detail-field-value ${!itemData.creativeLead ? 'empty' : ''}">${itemData.creativeLead || 'Not assigned'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Sales Lead</div>
                            <div class="detail-field-value ${!itemData.salesLead ? 'empty' : ''}">${itemData.salesLead || 'Not assigned'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Producer</div>
                            <div class="detail-field-value ${!itemData.producer ? 'empty' : ''}">${itemData.producer || 'Not assigned'}</div>
                        </div>
                    </div>

                    <!-- Project Info Section -->
                    <div class="detail-section">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: #21A0D8"></div>
                            Project Info
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Client</div>
                            <div class="detail-field-value ${!itemData.clientName ? 'empty' : ''}">${itemData.clientName || 'Not specified'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Project</div>
                            <div class="detail-field-value ${!itemData.projectTitle ? 'empty' : ''}">${itemData.projectTitle || 'Not specified'}</div>
                        </div>
                        ${itemData.budget || itemData.dealValue ? `
                        <div class="detail-field">
                            <div class="detail-field-label">Project Budget</div>
                            <div class="detail-field-value" style="color: #22C55E; font-weight: 700;">${formatCurrency(itemData.budget || itemData.dealValue)}</div>
                        </div>` : ''}
                        ${itemData.editBudget ? `
                        <div class="detail-field">
                            <div class="detail-field-label">Edit Allocation</div>
                            <div class="detail-field-value" style="color: #22C55E;">${formatCurrency(itemData.editBudget)}</div>
                        </div>` : ''}
                    </div>

                    <!-- Key Dates Section -->
                    <div class="detail-section">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: #F59E0B"></div>
                            Key Dates
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Client Due Date</div>
                            <div class="detail-field-value ${!itemData.clientDueDate && !itemData.dueDate ? 'empty' : ''}">${formatDate(itemData.clientDueDate || itemData.dueDate)}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Live Date</div>
                            <div class="detail-field-value ${!itemData.liveDate ? 'empty' : ''}">${formatDate(itemData.liveDate)}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Feedback Due</div>
                            <div class="detail-field-value ${!itemData.feedbackDue ? 'empty' : ''}">${formatDate(itemData.feedbackDue)}</div>
                        </div>
                        ${itemData.feedbackStatus ? `
                        <div class="detail-field">
                            <div class="detail-field-label">Feedback Status</div>
                            <div class="detail-field-value">${itemData.feedbackStatus}</div>
                        </div>` : ''}
                    </div>

                    <!-- Deliverables Section (if available) -->
                    ${itemData.deliverables && itemData.deliverables.length > 0 ? `
                    <div class="detail-section" style="grid-column: 1 / -1;">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: #E6468B"></div>
                            Related Deliverables
                            <span style="font-size: 9px; background: #E5E5E5; padding: 2px 8px; border-radius: 10px; margin-left: auto;">${itemData.deliverables.length}</span>
                        </div>
                        <div style="display: grid; gap: 8px;">
                            ${itemData.deliverables.map(d => `
                                <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-soft); border-radius: 8px; cursor: pointer; transition: all 0.15s ease;" onclick="window.open('${d.url || '#'}', '_blank')" onmouseover="this.style.transform='translateX(4px)'" onmouseout="this.style.transform='none'">
                                    <div style="width: 8px; height: 8px; border-radius: 50%; background: ${getStatusColor(d.status)};"></div>
                                    <div style="flex: 1; min-width: 0;">
                                        <div style="font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${d.title || 'Untitled'}</div>
                                        <div style="font-size: 10px; color: var(--ink-sub);">${d.format || d.type || 'Asset'} • ${d.status || 'Not Started'}</div>
                                    </div>
                                    ${d.budget ? `<div style="font-size: 11px; font-weight: 700; color: #22C55E;">${formatCurrency(d.budget)}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>` : ''}

                    <!-- Notes Section -->
                    ${itemData.notes ? `
                    <div class="detail-section" style="grid-column: 1 / -1;">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: var(--ink-sub)"></div>
                            Notes
                        </div>
                        <div style="font-size: 12px; color: var(--ink-sub); line-height: 1.5; white-space: pre-wrap;">${itemData.notes}</div>
                    </div>` : ''}
                </div>

                <div class="detail-actions">
                    ${itemData.url ? `<a href="${itemData.url}" target="_blank" class="detail-action-btn primary">View in Notion</a>` : ''}
                    <a href="commercial-hub-react.html?project=${itemData.projectId || itemData.id || ''}" target="_blank" class="detail-action-btn" style="background: #E5E5E5;">Open in Hub</a>
                    <button class="detail-action-btn" onclick="closeProjectDetail()">Close</button>
                </div>
            `;

            document.getElementById('projectOverlay').classList.add('visible');
            detail.classList.add('visible');
        };

        window.closeProjectDetail = function() {
            document.getElementById('projectOverlay').classList.remove('visible');
            document.getElementById('projectDetail').classList.remove('visible');
        };

        function getStatusColor(status) {
            const statusLower = (status || '').toLowerCase();
            if (statusLower.includes('high') || statusLower.includes('urgent')) return '#EF4444';
            if (statusLower.includes('medium')) return '#F59E0B';
            if (statusLower.includes('low')) return '#22C55E';
            return '#9CA3AF';
        }

        // Fetch deliverables from Cloud Run API (canonical Notion data)
        // This is optional - widget still works with just Firebase data
        async function loadApiDeliverables() {
            try {
                // Try /deliverables first with timeout
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                let res = await fetch(`${API_URL}/deliverables`, { signal: controller.signal });
                clearTimeout(timeout);

                if (!res.ok) {
                    console.warn('[Editor Queue] API returned', res.status, '- using Firebase data only');
                    return;
                }

                let data = await res.json();
                let deliverables = data.deliverables || data.projects || [];

                // If empty, try /projects
                if (deliverables.length === 0) {
                    const projRes = await fetch(`${API_URL}/projects`, { signal: controller.signal });
                    if (projRes.ok) {
                        data = await projRes.json();
                        deliverables = data.projects || [];
                    }
                }

                // Filter for items that need editing
                apiDeliverables = deliverables.filter(d => {
                    const status = (d.status || d.productionWorkflowStatus || '').toLowerCase();
                    const discipline = (d.discipline || '').toLowerCase();
                    if (status === 'live' || status === 'published' || status === 'complete' || status === 'done') return false;
                    if (d.movingAssetsNeeded?.length > 0 || d.movingAssetCount > 0) return true;
                    if (discipline === 'editor') return true;
                    if (status.includes('edit') || status.includes('filming') || status.includes('review')) return true;
                    if (d.videoEditor) return true;
                    return false;
                }).map(d => ({
                    id: d.id,
                    title: d.title,
                    editor: d.videoEditor || d.assignedTo || 'Unassigned',
                    priority: d.dueDate && new Date(d.dueDate) < new Date(Date.now() + 2*24*60*60*1000) ? 'High' : 'Medium',
                    dueDate: d.dueDate || d.clientDueDate || d.internalDueDate,
                    liveDate: d.plannedLiveDate || d.liveDate,
                    clientDueDate: d.clientDueDate,
                    feedbackDue: d.feedbackDue,
                    feedbackStatus: d.feedbackStatus,
                    status: d.status || d.productionWorkflowStatus || 'Not Started',
                    clientName: d.client,
                    projectTitle: d.projectTitle || d.client,
                    source: 'api',
                    url: d.url
                }));

                console.log('[Editor Queue] Loaded', apiDeliverables.length, 'items from API');
                render();
            } catch (err) {
                // Silently fail - widget works fine with just Firebase data
                console.warn('[Editor Queue] API unavailable, using Firebase data only');
            }
        }

        // Fetch rundown items that need editing (optional enhancement)
        async function loadRundownItems() {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                const dates = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    dates.push(d.toISOString().split('T')[0]);
                }

                const allItems = [];
                for (const date of dates) {
                    try {
                        const res = await fetch(`${API_URL}/rundown?date=${date}`, { signal: controller.signal });
                        if (!res.ok) continue;
                        const data = await res.json();
                        if (data.success && data.items) {
                            const editItems = data.items.filter(item =>
                                (item.section === 'FILMING' || item.section === 'INTERNAL') &&
                                item.status !== 'done'
                            );
                            allItems.push(...editItems);
                        }
                    } catch (e) { /* skip failed date */ }
                }
                clearTimeout(timeout);

                rundownItems = allItems.map(r => ({
                    id: r.id,
                    title: r.title || 'Untitled',
                    editor: r.creator || 'Unassigned',
                    priority: r.plannedLiveDate && new Date(r.plannedLiveDate) < new Date(Date.now() + 2*24*60*60*1000) ? 'High' : 'Medium',
                    dueDate: r.plannedLiveDate || r.date,
                    liveDate: r.plannedLiveDate,
                    status: r.section,
                    projectTitle: r.vertical || 'Daily Rundown',
                    source: 'rundown',
                    url: r.url
                }));
                render();
            } catch (err) {
                console.warn('[Editor Queue] Rundown API unavailable');
            }
        }
        const root = document.getElementById('root');

        function render() {
            if (loading) { root.innerHTML = `<div class="widget"><div class="loading"><div class="spinner"></div>Loading queue...</div></div>`; return; }

            // Merge all data sources, avoiding duplicates
            // Priority: Firebase edit_queue > API deliverables > Rundown items
            const existingIds = new Set(items.map(i => i.id));
            const allItems = [
                ...items,
                ...apiDeliverables.filter(d => !existingIds.has(d.id)),
                ...rundownItems.filter(r => !existingIds.has(r.id) && !apiDeliverables.some(d => d.id === r.id))
            ];
            const priorityOrder = { high: 0, medium: 1, low: 2 };
            allItems.sort((a, b) => (priorityOrder[a.priority?.toLowerCase()] || 2) - (priorityOrder[b.priority?.toLowerCase()] || 2));

            root.innerHTML = `
                <div class="widget">
                    <div class="header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <div>
                            <h2 class="title">Edit Queue</h2>
                            <div class="source-legend"><span style="color: #21A0D8;">API</span> = Master Ledger &nbsp; <span style="color: #E94B4B;">RUN</span> = Daily Rundown</div>
                        </div>
                        <span class="count">${allItems.length} in queue</span>
                    </div>
                    ${allItems.length === 0 ? `
                        <div class="empty">
                            <div class="empty-icon">🎬</div>
                            <div class="empty-title">Queue Empty</div>
                            <div class="empty-sub">No edits pending. Add items via Daily Rundown or Commercial Hub.</div>
                        </div>
                    ` : `
                        <div class="list">
                            ${allItems.map(item => {
                                const dueDate = item.dueDate || item.deliveryDue || item.internalDueDate || '';
                                const liveDate = item.liveDate || item.goLiveDate || item.plannedLiveDate || '';
                                const clientDue = item.clientDueDate || item.feedbackDue || item.dueDate || '';
                                const feedbackStatus = item.feedbackStatus || '';
                                const formatDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
                                const isOverdue = (d) => d && new Date(d) < new Date();
                                const isDueSoon = (d) => { if (!d) return false; const diff = (new Date(d) - new Date()) / (1000*60*60*24); return diff >= 0 && diff <= 2; };
                                const itemData = JSON.stringify(item).replace(/"/g, '&quot;');
                                return `
                                <div class="item" onclick="openProjectDetail(${itemData})" style="cursor: pointer;">
                                    <div class="item-icon">🎬</div>
                                    <div class="item-info">
                                        <div class="item-title">${item.title || 'Untitled Edit'}</div>
                                        <div class="item-sub">
                                            ${item.editor || 'Unassigned'} • ${item.clientName || item.projectTitle || 'Project'}
                                            ${item.source === 'rundown' ? '<span style="font-size: 8px; font-weight: 700; padding: 2px 5px; border-radius: 3px; background: rgba(233, 75, 75, 0.1); color: #E94B4B; margin-left: 4px;">RUN</span>' : ''}
                                            ${item.source === 'api' ? '<span style="font-size: 8px; font-weight: 700; padding: 2px 5px; border-radius: 3px; background: rgba(33, 160, 216, 0.1); color: #21A0D8; margin-left: 4px;">API</span>' : ''}
                                            ${item.url ? `<a href="${item.url}" target="_blank" onclick="event.stopPropagation()" style="display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; background: var(--bg-soft); color: var(--ink-sub); text-decoration: none; margin-left: 4px; transition: 0.15s;" onmouseover="this.style.background='#21A0D8';this.style.color='white'" onmouseout="this.style.background='var(--bg-soft)';this.style.color='var(--ink-sub)'" title="Open in Notion"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>` : ''}
                                        </div>
                                        <div style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap;">
                                            ${clientDue ? `<span style="font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: ${isOverdue(clientDue) ? '#FEE2E2' : isDueSoon(clientDue) ? '#FEF3C7' : '#E5E5E5'}; color: ${isOverdue(clientDue) ? '#B91C1C' : isDueSoon(clientDue) ? '#B45309' : '#525252'};">Client: ${formatDate(clientDue)}</span>` : ''}
                                            ${liveDate ? `<span style="font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: #DCFCE7; color: #166534;">Live: ${formatDate(liveDate)}</span>` : ''}
                                            ${feedbackStatus ? `<span style="font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: #DBEAFE; color: #1E40AF;">${feedbackStatus}</span>` : ''}
                                        </div>
                                    </div>
                                    <span class="item-priority priority-${(item.priority || 'low').toLowerCase()}">${item.priority || 'Low'}</span>
                                </div>
                            `}).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        onAuthStateChanged(auth, user => {
            if (user) {
                // Load API deliverables (canonical Notion data)
                loadApiDeliverables();

                // Load rundown items
                loadRundownItems();

                // Refresh both every minute
                setInterval(() => {
                    loadApiDeliverables();
                    loadRundownItems();
                }, 60000);

                // Listen to edit_queue - now synced from Commercial Hub
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "edit_queue"), snap => {
                    items = []; snap.forEach(d => items.push({ id: d.id, ...d.data() }));
                    // Sort by priority: high > medium > low
                    const priorityOrder = { high: 0, medium: 1, low: 2 };
                    items.sort((a, b) => (priorityOrder[a.priority?.toLowerCase()] || 2) - (priorityOrder[b.priority?.toLowerCase()] || 2));
                    loading = false; render();
                }, e => { console.error(e); loading = false; render(); });

                // Also listen to asset_metadata for additional edit tasks
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "asset_metadata"), snap => {
                    const assets = [];
                    snap.forEach(d => {
                        const data = d.data();
                        // Include assets in edit phase that have an editor assigned
                        if (data.editor && ['Edit', 'Filming', 'Review'].includes(data.status)) {
                            // Check if not already in edit_queue
                            if (!items.some(i => i.id === d.id)) {
                                assets.push({
                                    id: d.id,
                                    title: data.assetTitle || 'Untitled',
                                    editor: data.editor,
                                    format: data.assetFormat,
                                    priority: data.deliveryDue && new Date(data.deliveryDue) < new Date(Date.now() + 2*24*60*60*1000) ? 'High' : 'Medium',
                                    dueDate: data.deliveryDue,
                                    liveDate: data.liveDate || data.plannedLiveDate,
                                    feedbackDue: data.feedbackDue,
                                    feedbackStatus: data.feedbackStatus,
                                    status: data.status,
                                    clientName: data.clientName,
                                    projectTitle: data.projectTitle,
                                    source: 'asset-metadata'
                                });
                            }
                        }
                    });
                    // Merge and re-sort
                    const editQueueIds = new Set(items.filter(i => i.source !== 'asset-metadata').map(i => i.id));
                    const newItems = [...items.filter(i => i.source !== 'asset-metadata'), ...assets.filter(a => !editQueueIds.has(a.id))];
                    const priorityOrder = { high: 0, medium: 1, low: 2 };
                    newItems.sort((a, b) => (priorityOrder[a.priority?.toLowerCase()] || 2) - (priorityOrder[b.priority?.toLowerCase()] || 2));
                    items = newItems;
                    render();
                }, e => console.error(e));
            } else {
                signInAnonymously(auth).catch(e => { loading = false; render(); });
            }
        });

        // Close project detail on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('projectOverlay').classList.contains('visible')) {
                    closeProjectDetail();
                }
            }
        });
    </script>
</body>
</html>
