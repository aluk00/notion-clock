<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Queue | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
            --production: #43B049;
            --editorial: #E94B4B;
            --creative: #E6468B;
            --urgent: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: transparent; padding: 16px; color: var(--ink); -webkit-font-smoothing: antialiased; }

        .dots { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--production); }
        .dots span:nth-child(1) { animation: pulse 2s ease-in-out infinite; }
        .dots span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dots span:nth-child(3) { animation: pulse 2s ease-in-out 0.6s infinite; }
        .dots span:nth-child(4) { animation: pulse 2s ease-in-out 0.9s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .queue-label { font-size: 11px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; }
        .stats { margin-left: auto; display: flex; gap: 16px; }
        .stat { display: flex; align-items: center; gap: 6px; }
        .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
        .stat-value { font-size: 12px; font-weight: 700; }
        .stat-label { font-size: 10px; color: var(--ink-sub); }

        .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab { padding: 8px 14px; border-radius: 10px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); background: white; cursor: pointer; transition: all 0.25s var(--ease); }
        .tab:hover { border-color: var(--ink-sub); }
        .tab.active { background: var(--ink); color: white; border-color: var(--ink); }

        .legend { display: flex; gap: 12px; margin-left: auto; font-size: 9px; align-items: center; }
        .legend-item { display: flex; align-items: center; gap: 4px; color: var(--ink-sub); }
        .legend-badge { font-size: 8px; font-weight: 700; padding: 2px 5px; border-radius: 3px; }

        .columns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 1200px) { .columns { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 700px) { .columns { grid-template-columns: 1fr; } }

        .column { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 16px; min-height: 400px; transition: all 0.3s var(--ease); }
        .column:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .column.forecasted { background: linear-gradient(180deg, rgba(33, 160, 216, 0.03) 0%, white 100%); border-color: rgba(33, 160, 216, 0.2); }

        .column-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .column-dot { width: 8px; height: 8px; border-radius: 50%; }
        .column-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-sub); }
        .column-count { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--ink-sub); background: var(--bg-soft); padding: 2px 8px; border-radius: 10px; }
        .column-effort { font-size: 9px; font-weight: 600; color: var(--production); background: rgba(67, 176, 73, 0.1); padding: 2px 8px; border-radius: 10px; margin-left: 4px; }

        .cards { display: flex; flex-direction: column; gap: 10px; }

        .card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 14px; position: relative; cursor: pointer; transition: all 0.25s var(--ease); }
        .card:hover { border-color: var(--ink-sub); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.04); }

        .card-priority { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 10px 0 0 10px; }
        .card-priority.high { background: var(--urgent); }
        .card-priority.medium { background: var(--warning); }
        .card-priority.low { background: var(--success); }
        .card-priority.forecasted { background: var(--dmg-blue); }

        .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .card-type { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 4px; background: rgba(67, 176, 73, 0.1); color: var(--production); }
        .card-source { font-size: 8px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; }
        .card-source.api { background: rgba(33, 160, 216, 0.1); color: #21A0D8; }
        .card-source.rundown { background: rgba(233, 75, 75, 0.1); color: #E94B4B; }
        .card-source.firebase { background: rgba(67, 176, 73, 0.1); color: #43B049; }
        .card-source.forecasted { background: rgba(33, 160, 216, 0.15); color: #21A0D8; }
        .card-effort { font-size: 9px; font-weight: 600; color: var(--ink-sub); margin-left: auto; }
        .card-effort-badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(67, 176, 73, 0.1); color: var(--production); }
        .card-notion-link { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; background: white; color: var(--ink-sub); text-decoration: none; transition: 0.2s var(--ease); }
        .card-notion-link:hover { background: #21A0D8; color: white; }

        .card-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; margin-bottom: 6px; }
        .card-project { font-size: 10px; color: var(--ink-sub); margin-bottom: 10px; }

        .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .card-due { font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: white; }
        .card-due.overdue { background: rgba(239, 68, 68, 0.1); color: var(--urgent); }
        .card-due.soon { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .card-live { font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .card-editor { font-size: 10px; color: var(--ink-sub); margin-left: auto; }

        .empty { text-align: center; padding: 40px 20px; color: var(--ink-sub); font-size: 11px; font-weight: 500; }
        .empty-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.5; }
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; gap: 12px; }
        .loading-text { font-size: 11px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.1em; }

        /* Project Detail Modal */
        .project-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.7);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s var(--ease);
        }
        .project-overlay.visible { opacity: 1; visibility: visible; }

        .project-detail {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95) translateY(20px);
            width: 95%;
            max-width: 900px;
            max-height: 90vh;
            background: #FFF;
            border-radius: 16px;
            overflow: hidden;
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s var(--ease);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }
        .project-detail.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1) translateY(0);
        }

        .project-detail-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, var(--bg-soft) 0%, #FFF 100%);
        }

        .project-back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: #FFF;
            cursor: pointer;
            color: var(--ink-sub);
            transition: all 0.2s var(--ease);
            flex-shrink: 0;
        }
        .project-back-btn:hover { background: var(--bg-soft); border-color: #D1D5DB; color: var(--ink); }
        .project-back-btn svg { width: 14px; height: 14px; }

        .project-title-section { flex: 1; }
        .project-client-name { font-size: 10px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .project-title-main { font-size: 20px; font-weight: 900; color: var(--ink); line-height: 1.2; letter-spacing: -0.02em; }

        .project-status-badge { font-size: 10px; font-weight: 700; padding: 8px 16px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.03em; }

        .project-detail-content { flex: 1; overflow-y: auto; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 700px) { .project-detail-content { grid-template-columns: 1fr; } }

        .detail-section { background: #FFF; border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .detail-section-title { font-size: 10px; font-weight: 800; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .detail-section-dot { width: 8px; height: 8px; border-radius: 50%; }

        .detail-field { margin-bottom: 12px; }
        .detail-field:last-child { margin-bottom: 0; }
        .detail-field-label { font-size: 9px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
        .detail-field-value { font-size: 13px; font-weight: 600; color: var(--ink); }
        .detail-field-value.empty { color: var(--ink-sub); font-style: italic; }

        .detail-actions { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
        .detail-action-btn { padding: 10px 20px; border-radius: 8px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); background: #FFF; cursor: pointer; color: var(--ink); text-decoration: none; transition: all 0.2s var(--ease); }
        .detail-action-btn:hover { background: var(--production); color: white; border-color: var(--production); }
        .detail-action-btn.primary { background: var(--production); color: white; border-color: var(--production); }

        /* Config badge */
        .config-status { font-size: 9px; font-weight: 600; padding: 3px 8px; border-radius: 4px; margin-left: 8px; }
        .config-status.active { background: rgba(16, 185, 129, 0.1); color: #10B981; }
        .config-status.loading { background: rgba(245, 158, 11, 0.1); color: #F59E0B; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <span class="queue-label">Edit Queue</span>
        <span class="config-status loading" id="configStatus">Loading config...</span>
        <div class="stats">
            <div class="stat">
                <div class="stat-dot" style="background: var(--urgent)"></div>
                <span class="stat-value" id="urgentCount">0</span>
                <span class="stat-label">Urgent</span>
            </div>
            <div class="stat">
                <div class="stat-dot" style="background: var(--dmg-blue)"></div>
                <span class="stat-value" id="forecastedCount">0</span>
                <span class="stat-label">Forecasted</span>
            </div>
            <div class="stat">
                <div class="stat-dot" style="background: var(--production)"></div>
                <span class="stat-value" id="totalEffort">0</span>
                <span class="stat-label">Total Hrs</span>
            </div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-view="all" onclick="switchTab('all')">All</div>
        <div class="tab" data-view="in-queue" onclick="switchTab('in-queue')">In Queue</div>
        <div class="tab" data-view="in-progress" onclick="switchTab('in-progress')">In Progress</div>
        <div class="tab" data-view="review" onclick="switchTab('review')">Review</div>
        <div class="tab" data-view="forecasted" onclick="switchTab('forecasted')">Forecasted</div>
        <div class="legend">
            <div class="legend-item"><span class="legend-badge" style="background: rgba(33, 160, 216, 0.1); color: #21A0D8;">API</span> Master Ledger</div>
            <div class="legend-item"><span class="legend-badge" style="background: rgba(233, 75, 75, 0.1); color: #E94B4B;">RUN</span> Daily Rundown</div>
            <div class="legend-item"><span class="legend-badge" style="background: rgba(33, 160, 216, 0.15); color: #21A0D8;">⏳</span> Forecasted</div>
        </div>
    </div>

    <div class="columns" id="columns">
        <div class="loading">
            <div class="dots"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading queue...</span>
        </div>
    </div>

    <div class="project-overlay" id="projectOverlay" onclick="closeProjectDetail()"></div>
    <div class="project-detail" id="projectDetail"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        const auth = getAuth(app), db = getFirestore(app), appId = "dmg-command-centre-native";
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

        // Effort configuration - loaded from Firebase
        let effortConfig = {
            taskTypes: {
                video_edit_short: { baseHours: 4, label: 'Video Edit (Short)' },
                video_edit_medium: { baseHours: 8, label: 'Video Edit (Medium)' },
                video_edit_long: { baseHours: 16, label: 'Video Edit (Long)' },
                motion_graphics: { baseHours: 6, label: 'Motion Graphics' },
                colour_grade: { baseHours: 2, label: 'Colour Grade' },
                sound_mix: { baseHours: 3, label: 'Sound Mix' },
                revision_round: { baseHours: 2, label: 'Revision Round' }
            },
            seniorityMultipliers: {
                intern: 1.5,
                junior: 1.3,
                midweight: 1.0,
                senior: 0.85,
                lead: 0.75
            }
        };
        let staffDirectory = {};
        let rotaData = {};
        let currentView = 'all';

        const COLUMNS = [
            { key: 'forecasted', title: 'Forecasted', color: 'var(--dmg-blue)', filter: i => i.isForecasted === true },
            { key: 'in-queue', title: 'In Queue', color: 'var(--warning)', filter: i => !i.isForecasted && (i.status === 'Not Started' || i.status === 'Queued' || i.status === 'To Do') },
            { key: 'in-progress', title: 'In Progress', color: 'var(--production)', filter: i => !i.isForecasted && (i.status === 'In Progress' || i.status === 'Edit' || i.status === 'Filming') },
            { key: 'review', title: 'Review', color: '#8B5CF6', filter: i => !i.isForecasted && (i.status === 'Review' || i.status === 'Stakeholder Review' || i.status === 'Internal Review' || i.status === 'Client Review') }
        ];

        let items = [], rundownItems = [], apiDeliverables = [], forecastedItems = [];

        // Calculate effort based on task type and editor seniority
        function calculateEffort(item) {
            // Try to match task type
            let baseHours = 4; // Default
            const taskType = (item.editType || item.type || item.format || '').toLowerCase();

            if (taskType.includes('short') || taskType.includes('reel') || taskType.includes('tiktok')) {
                baseHours = effortConfig.taskTypes.video_edit_short?.baseHours || 4;
            } else if (taskType.includes('long') || taskType.includes('documentary') || taskType.includes('feature')) {
                baseHours = effortConfig.taskTypes.video_edit_long?.baseHours || 16;
            } else if (taskType.includes('motion') || taskType.includes('animation')) {
                baseHours = effortConfig.taskTypes.motion_graphics?.baseHours || 6;
            } else if (taskType.includes('colour') || taskType.includes('color') || taskType.includes('grade')) {
                baseHours = effortConfig.taskTypes.colour_grade?.baseHours || 2;
            } else if (taskType.includes('sound') || taskType.includes('audio') || taskType.includes('mix')) {
                baseHours = effortConfig.taskTypes.sound_mix?.baseHours || 3;
            } else {
                baseHours = effortConfig.taskTypes.video_edit_medium?.baseHours || 8;
            }

            // Apply seniority multiplier if we know the editor
            let multiplier = 1.0;
            const editorName = item.editor || '';
            const staffMember = Object.values(staffDirectory).find(s =>
                `${s.firstName} ${s.lastName}`.toLowerCase() === editorName.toLowerCase() ||
                s.firstName?.toLowerCase() === editorName.toLowerCase()
            );

            if (staffMember?.seniority) {
                const seniority = staffMember.seniority.toLowerCase();
                multiplier = effortConfig.seniorityMultipliers[seniority] || 1.0;
            }

            return Math.round(baseHours * multiplier * 10) / 10;
        }

        // Check if editor is available (not on leave)
        function isEditorAvailable(editorName) {
            if (!editorName || !rotaData) return true;
            const today = new Date().toISOString().split('T')[0];
            const staffMember = Object.entries(staffDirectory).find(([id, s]) =>
                `${s.firstName} ${s.lastName}`.toLowerCase() === editorName.toLowerCase()
            );
            if (!staffMember) return true;
            const staffId = staffMember[0];
            const todayRota = rotaData[staffId]?.[today];
            return !todayRota || todayRota === 'Office' || todayRota === 'WFH';
        }

        // Project Detail View Functions
        window.openProjectDetail = function(itemData) {
            const detail = document.getElementById('projectDetail');
            const statusColor = getStatusColor(itemData.status);
            const formatDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : 'Not set';
            const formatCurrency = (val) => val ? `£${Number(val).toLocaleString()}` : 'Not set';
            const effort = calculateEffort(itemData);

            detail.innerHTML = `
                <div class="project-detail-header">
                    <button class="project-back-btn" onclick="closeProjectDetail()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        Back
                    </button>
                    <div class="project-title-section">
                        <div class="project-client-name">${itemData.clientName || itemData.projectTitle || 'Edit Task'}</div>
                        <div class="project-title-main">${itemData.title || 'Untitled Edit'}</div>
                    </div>
                    <div class="project-status-badge" style="background: ${statusColor}15; color: ${statusColor}">${itemData.isForecasted ? 'Forecasted' : itemData.priority || 'Medium'}</div>
                </div>

                <div class="project-detail-content">
                    <div class="detail-section">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: var(--production)"></div>
                            Task Details
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Effort (Calculated)</div>
                            <div class="detail-field-value" style="color: var(--production); font-weight: 700;">${effort} hours</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Priority</div>
                            <div class="detail-field-value">${itemData.priority || 'Medium'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Status</div>
                            <div class="detail-field-value">${itemData.isForecasted ? 'Forecasted (Pipeline)' : itemData.status || 'Not Started'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Format / Type</div>
                            <div class="detail-field-value ${!itemData.format && !itemData.editType ? 'empty' : ''}">${itemData.editType || itemData.format || 'Video Edit'}</div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: #9333EA"></div>
                            Team
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Video Editor</div>
                            <div class="detail-field-value">${itemData.editor || 'Unassigned'}${!isEditorAvailable(itemData.editor) ? ' <span style="color: var(--warning); font-size: 10px;">(On Leave)</span>' : ''}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Creative Lead</div>
                            <div class="detail-field-value ${!itemData.creativeLead ? 'empty' : ''}">${itemData.creativeLead || 'Not assigned'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Producer</div>
                            <div class="detail-field-value ${!itemData.producer ? 'empty' : ''}">${itemData.producer || 'Not assigned'}</div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: #21A0D8"></div>
                            Project Info
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Client</div>
                            <div class="detail-field-value ${!itemData.clientName ? 'empty' : ''}">${itemData.clientName || 'Not specified'}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Project</div>
                            <div class="detail-field-value ${!itemData.projectTitle ? 'empty' : ''}">${itemData.projectTitle || 'Not specified'}</div>
                        </div>
                        ${itemData.dealValue ? `
                        <div class="detail-field">
                            <div class="detail-field-label">Deal Value</div>
                            <div class="detail-field-value" style="color: #22C55E; font-weight: 700;">${formatCurrency(itemData.dealValue)}</div>
                        </div>` : ''}
                    </div>

                    <div class="detail-section">
                        <div class="detail-section-title">
                            <div class="detail-section-dot" style="background: #F59E0B"></div>
                            Key Dates
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Due Date</div>
                            <div class="detail-field-value ${!itemData.dueDate ? 'empty' : ''}">${formatDate(itemData.dueDate)}</div>
                        </div>
                        <div class="detail-field">
                            <div class="detail-field-label">Live Date</div>
                            <div class="detail-field-value ${!itemData.liveDate ? 'empty' : ''}">${formatDate(itemData.liveDate)}</div>
                        </div>
                        ${itemData.isForecasted ? `
                        <div class="detail-field">
                            <div class="detail-field-label">Deal Stage</div>
                            <div class="detail-field-value" style="color: var(--dmg-blue);">${itemData.dealStage || 'Pipeline'}</div>
                        </div>` : ''}
                    </div>
                </div>

                <div class="detail-actions">
                    ${itemData.projectId ? `<a href="project-detail.html?id=${itemData.projectId}" target="_blank" class="detail-action-btn primary" style="display: flex; align-items: center; gap: 6px;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                        Full Project Page
                    </a>` : ''}
                    ${itemData.url ? `<a href="${itemData.url}" target="_blank" class="detail-action-btn" style="background: var(--bg-soft);">View in Notion</a>` : ''}
                    <button class="detail-action-btn" onclick="closeProjectDetail()">Close</button>
                </div>
            `;

            document.getElementById('projectOverlay').classList.add('visible');
            detail.classList.add('visible');
        };

        window.closeProjectDetail = function() {
            document.getElementById('projectOverlay').classList.remove('visible');
            document.getElementById('projectDetail').classList.remove('visible');
        };

        function getStatusColor(status) {
            const statusLower = (status || '').toLowerCase();
            if (statusLower.includes('high') || statusLower.includes('urgent')) return '#EF4444';
            if (statusLower.includes('medium') || statusLower.includes('progress')) return '#F59E0B';
            if (statusLower.includes('review')) return '#8B5CF6';
            if (statusLower.includes('forecasted')) return '#21A0D8';
            return '#9CA3AF';
        }

        function isOverdue(dateStr) {
            if (!dateStr) return false;
            return new Date(dateStr) < new Date();
        }

        function isDueSoon(dateStr) {
            if (!dateStr) return false;
            const due = new Date(dateStr);
            const now = new Date();
            const diff = (due - now) / (1000 * 60 * 60 * 24);
            return diff >= 0 && diff <= 2;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const now = new Date();
            const diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
            if (diff < 0) return `${Math.abs(diff)}d overdue`;
            if (diff === 0) return 'Today';
            if (diff === 1) return 'Tomorrow';
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        }

        function getPriority(item) {
            if (item.isForecasted) return 'forecasted';
            if (item.priority === 'High' || item.priority === 'Urgent') return 'high';
            if (item.priority === 'Medium') return 'medium';
            return 'low';
        }

        // Load forecasted items from API (pipeline projects)
        async function loadForecastedItems() {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                const res = await fetch(`${API_URL}/projects`, { signal: controller.signal });
                clearTimeout(timeout);

                if (!res.ok) return;

                const data = await res.json();
                const projects = data.projects || [];

                // Filter for pipeline projects with moving assets
                forecastedItems = projects.filter(p => {
                    const dealStage = (p.dealStage || p.status1 || '').toLowerCase();
                    const hasAssets = (p.movingAssetCount > 0 || p.movingAssetsNeeded?.length > 0);
                    const isPipeline = dealStage.includes('agreed') || dealStage.includes('won') || dealStage.includes('verbal') || dealStage.includes('confirmed');
                    const notInProduction = !(p.productionWorkflowStatus || '').toLowerCase().includes('progress');
                    return hasAssets && isPipeline && notInProduction;
                }).map(p => ({
                    id: p.id,
                    title: p.title || 'Untitled Project',
                    editor: p.videoEditor || 'TBC',
                    priority: 'Pipeline',
                    dueDate: p.dueDate || p.clientDueDate,
                    liveDate: p.plannedLiveDate || p.liveDate,
                    status: 'Forecasted',
                    clientName: p.client,
                    projectTitle: p.title,
                    projectId: p.id,
                    source: 'forecasted',
                    isForecasted: true,
                    dealStage: p.dealStage || p.status1,
                    dealValue: p.dealValue || p.projectBudget,
                    movingAssetCount: p.movingAssetCount || p.movingAssetsNeeded?.length || 1,
                    editType: 'Video Edit',
                    url: p.url
                }));

                console.log('[Editor Queue] Loaded', forecastedItems.length, 'forecasted items');
                render();
            } catch (err) {
                console.warn('[Editor Queue] Could not load forecasted items');
            }
        }

        // Load deliverables from API
        async function loadApiDeliverables() {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                let res = await fetch(`${API_URL}/deliverables`, { signal: controller.signal });
                clearTimeout(timeout);

                if (!res.ok) {
                    console.warn('[Editor Queue] API returned', res.status);
                    return;
                }

                let data = await res.json();
                let deliverables = data.deliverables || data.projects || [];

                if (deliverables.length === 0) {
                    const projRes = await fetch(`${API_URL}/projects`);
                    if (projRes.ok) {
                        data = await projRes.json();
                        deliverables = data.projects || [];
                    }
                }

                // Filter for items that need editing
                apiDeliverables = deliverables.filter(d => {
                    const status = (d.status || d.productionWorkflowStatus || '').toLowerCase();
                    if (status === 'live' || status === 'published' || status === 'complete' || status === 'done') return false;
                    if (d.movingAssetsNeeded?.length > 0 || d.movingAssetCount > 0) return true;
                    if ((d.discipline || '').toLowerCase() === 'editor') return true;
                    if (status.includes('edit') || status.includes('filming') || status.includes('review')) return true;
                    if (d.videoEditor) return true;
                    return false;
                }).map(d => ({
                    id: d.id,
                    title: d.title,
                    editor: d.videoEditor || d.assignedTo || 'Unassigned',
                    priority: d.dueDate && new Date(d.dueDate) < new Date(Date.now() + 2*24*60*60*1000) ? 'High' : 'Medium',
                    dueDate: d.dueDate || d.clientDueDate || d.internalDueDate,
                    liveDate: d.plannedLiveDate || d.liveDate,
                    clientDueDate: d.clientDueDate,
                    feedbackDue: d.feedbackDue,
                    feedbackStatus: d.feedbackStatus,
                    status: d.status || d.productionWorkflowStatus || 'Not Started',
                    clientName: d.client,
                    projectTitle: d.projectTitle || d.client,
                    projectId: d.projectId || d.id,
                    source: 'api',
                    isForecasted: false,
                    editType: d.editType || d.format,
                    url: d.url
                }));

                console.log('[Editor Queue] Loaded', apiDeliverables.length, 'items from API');
                render();
            } catch (err) {
                console.warn('[Editor Queue] API unavailable');
            }
        }

        // Load rundown items
        async function loadRundownItems() {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                const dates = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    dates.push(d.toISOString().split('T')[0]);
                }

                const allItems = [];
                for (const date of dates) {
                    try {
                        const res = await fetch(`${API_URL}/rundown?date=${date}`, { signal: controller.signal });
                        if (!res.ok) continue;
                        const data = await res.json();
                        if (data.success && data.items) {
                            const editItems = data.items.filter(item =>
                                (item.section === 'FILMING' || item.section === 'INTERNAL') &&
                                item.status !== 'done'
                            );
                            allItems.push(...editItems);
                        }
                    } catch (e) { /* skip */ }
                }
                clearTimeout(timeout);

                rundownItems = allItems.map(r => ({
                    id: r.id,
                    title: r.title || 'Untitled',
                    editor: r.creator || 'Unassigned',
                    priority: r.plannedLiveDate && new Date(r.plannedLiveDate) < new Date(Date.now() + 2*24*60*60*1000) ? 'High' : 'Medium',
                    dueDate: r.plannedLiveDate || r.date,
                    liveDate: r.plannedLiveDate,
                    status: r.section === 'FILMING' ? 'In Progress' : 'Not Started',
                    projectTitle: r.vertical || 'Daily Rundown',
                    source: 'rundown',
                    isForecasted: false,
                    url: r.url
                }));
                render();
            } catch (err) {
                console.warn('[Editor Queue] Rundown API unavailable');
            }
        }

        // Tab switching
        window.switchTab = (view) => {
            currentView = view;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[data-view="${view}"]`).classList.add('active');
            render();
        };

        function render() {
            // Merge all data sources
            const existingIds = new Set(items.map(i => i.id));
            let allItems = [
                ...forecastedItems,
                ...items.filter(i => !forecastedItems.some(f => f.id === i.id)),
                ...apiDeliverables.filter(d => !existingIds.has(d.id) && !forecastedItems.some(f => f.id === d.id)),
                ...rundownItems.filter(r => !existingIds.has(r.id) && !apiDeliverables.some(d => d.id === r.id) && !forecastedItems.some(f => f.id === r.id))
            ];

            // Filter based on current view
            if (currentView !== 'all') {
                const col = COLUMNS.find(c => c.key === currentView);
                if (col) {
                    allItems = allItems.filter(col.filter);
                }
            }

            // Calculate stats
            const urgent = allItems.filter(i => getPriority(i) === 'high').length;
            const forecasted = allItems.filter(i => i.isForecasted).length;
            const totalEffort = allItems.reduce((sum, item) => sum + calculateEffort(item), 0);

            document.getElementById('urgentCount').textContent = urgent;
            document.getElementById('forecastedCount').textContent = forecasted;
            document.getElementById('totalEffort').textContent = Math.round(totalEffort);

            // Render columns
            document.getElementById('columns').innerHTML = COLUMNS.map(col => {
                const colItems = allItems.filter(col.filter);
                colItems.sort((a, b) => {
                    const pOrder = { high: 0, medium: 1, low: 2, forecasted: 3 };
                    if (pOrder[getPriority(a)] !== pOrder[getPriority(b)]) return pOrder[getPriority(a)] - pOrder[getPriority(b)];
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                });

                const colEffort = colItems.reduce((sum, item) => sum + calculateEffort(item), 0);

                return `
                    <div class="column ${col.key === 'forecasted' ? 'forecasted' : ''}">
                        <div class="column-header">
                            <div class="column-dot" style="background: ${col.color}"></div>
                            <span class="column-title">${col.title}</span>
                            <span class="column-count">${colItems.length}</span>
                            <span class="column-effort">${Math.round(colEffort)}h</span>
                        </div>
                        <div class="cards">
                            ${colItems.length === 0 ? `<div class="empty"><div class="empty-icon">${col.key === 'forecasted' ? '📊' : '🎬'}</div>No items</div>` : colItems.map(item => {
                                const overdue = isOverdue(item.dueDate);
                                const soon = isDueSoon(item.dueDate);
                                const effort = calculateEffort(item);
                                const itemData = JSON.stringify(item).replace(/"/g, '&quot;');
                                const available = isEditorAvailable(item.editor);

                                return `
                                    <div class="card" onclick="openProjectDetail(${itemData})">
                                        <div class="card-priority ${getPriority(item)}"></div>
                                        <div class="card-top">
                                            <span class="card-type">${item.editType || 'Edit'}</span>
                                            <span class="card-source ${item.source}">${item.isForecasted ? '⏳' : (item.source === 'api' ? 'API' : (item.source === 'rundown' ? 'RUN' : 'FB'))}</span>
                                            <span class="card-effort-badge">${effort}h</span>
                                            ${item.projectId ? `<a href="project-detail.html?id=${item.projectId}" target="_blank" class="card-notion-link" title="View Project" onclick="event.stopPropagation()" style="background: rgba(67, 176, 73, 0.1); color: var(--production);"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></a>` : ''}
                                            ${item.url ? `<a href="${item.url}" target="_blank" class="card-notion-link" title="Open in Notion" onclick="event.stopPropagation()"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>` : ''}
                                        </div>
                                        <div class="card-title">${item.title || 'Untitled Edit'}</div>
                                        ${item.projectTitle ? `<div class="card-project">${item.clientName || ''} ${item.clientName && item.projectTitle ? '•' : ''} ${item.projectTitle}</div>` : ''}
                                        <div class="card-meta">
                                            ${item.dueDate ? `<span class="card-due ${overdue ? 'overdue' : (soon ? 'soon' : '')}">${formatDate(item.dueDate)}</span>` : ''}
                                            ${item.liveDate ? `<span class="card-live">Live: ${formatDate(item.liveDate)}</span>` : ''}
                                            ${item.isForecasted && item.movingAssetCount ? `<span style="font-size: 9px; font-weight: 600; padding: 3px 6px; border-radius: 4px; background: rgba(33, 160, 216, 0.1); color: var(--dmg-blue);">${item.movingAssetCount} assets</span>` : ''}
                                            <span class="card-editor">${item.editor || 'Unassigned'}${!available ? ' 🏖️' : ''}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Load effort config from Firebase
        async function loadEffortConfig() {
            try {
                const configDoc = await getDoc(doc(db, "artifacts", appId, "public", "config", "effortScores"));
                if (configDoc.exists()) {
                    effortConfig = { ...effortConfig, ...configDoc.data() };
                    document.getElementById('configStatus').textContent = 'Config loaded';
                    document.getElementById('configStatus').className = 'config-status active';
                    console.log('[Editor Queue] Loaded effort config from Firebase');
                } else {
                    document.getElementById('configStatus').textContent = 'Using defaults';
                    document.getElementById('configStatus').className = 'config-status';
                }
                render();
            } catch (err) {
                console.warn('[Editor Queue] Could not load effort config, using defaults');
                document.getElementById('configStatus').textContent = 'Using defaults';
                document.getElementById('configStatus').className = 'config-status';
            }
        }

        // Load staff directory
        async function loadStaffDirectory() {
            try {
                const snap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                snap.docs.forEach(d => { staffDirectory[d.id] = d.data(); });
                console.log('[Editor Queue] Loaded', Object.keys(staffDirectory).length, 'staff members');
            } catch (err) {
                console.warn('[Editor Queue] Could not load staff directory');
            }
        }

        // Load rota data
        async function loadRotaData() {
            try {
                const snap = await getDocs(collection(db, "artifacts", appId, "public", "data", "rota"));
                snap.docs.forEach(d => { rotaData[d.id] = d.data(); });
                console.log('[Editor Queue] Loaded rota data');
            } catch (err) {
                console.warn('[Editor Queue] Could not load rota data');
            }
        }

        onAuthStateChanged(auth, user => {
            if (user) {
                // Load configurations
                loadEffortConfig();
                loadStaffDirectory();
                loadRotaData();

                // Load data sources
                loadForecastedItems();
                loadApiDeliverables();
                loadRundownItems();

                // Refresh every minute
                setInterval(() => {
                    loadForecastedItems();
                    loadApiDeliverables();
                    loadRundownItems();
                }, 60000);

                // Listen to Firebase edit_queue
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "edit_queue"), snap => {
                    items = []; snap.forEach(d => items.push({ id: d.id, ...d.data(), isForecasted: false }));
                    const priorityOrder = { high: 0, medium: 1, low: 2 };
                    items.sort((a, b) => (priorityOrder[a.priority?.toLowerCase()] || 2) - (priorityOrder[b.priority?.toLowerCase()] || 2));
                    render();
                }, e => console.error(e));

                // Listen to asset_metadata
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "asset_metadata"), snap => {
                    const assets = [];
                    snap.forEach(d => {
                        const data = d.data();
                        if (data.editor && ['Edit', 'Filming', 'Review'].includes(data.status)) {
                            if (!items.some(i => i.id === d.id)) {
                                assets.push({
                                    id: d.id,
                                    title: data.assetTitle || 'Untitled',
                                    editor: data.editor,
                                    format: data.assetFormat,
                                    editType: data.assetFormat,
                                    priority: data.deliveryDue && new Date(data.deliveryDue) < new Date(Date.now() + 2*24*60*60*1000) ? 'High' : 'Medium',
                                    dueDate: data.deliveryDue,
                                    liveDate: data.liveDate || data.plannedLiveDate,
                                    feedbackDue: data.feedbackDue,
                                    feedbackStatus: data.feedbackStatus,
                                    status: data.status,
                                    clientName: data.clientName,
                                    projectTitle: data.projectTitle,
                                    source: 'asset-metadata',
                                    isForecasted: false
                                });
                            }
                        }
                    });
                    const editQueueIds = new Set(items.filter(i => i.source !== 'asset-metadata').map(i => i.id));
                    const newItems = [...items.filter(i => i.source !== 'asset-metadata'), ...assets.filter(a => !editQueueIds.has(a.id))];
                    const priorityOrder = { high: 0, medium: 1, low: 2 };
                    newItems.sort((a, b) => (priorityOrder[a.priority?.toLowerCase()] || 2) - (priorityOrder[b.priority?.toLowerCase()] || 2));
                    items = newItems;
                    render();
                }, e => console.error(e));

                // Listen for effort config changes
                onSnapshot(doc(db, "artifacts", appId, "public", "config", "effortScores"), snap => {
                    if (snap.exists()) {
                        effortConfig = { ...effortConfig, ...snap.data() };
                        document.getElementById('configStatus').textContent = 'Config loaded';
                        document.getElementById('configStatus').className = 'config-status active';
                        render();
                    }
                });

            } else {
                signInAnonymously(auth).catch(e => console.error(e));
            }
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('projectOverlay').classList.contains('visible')) {
                closeProjectDetail();
            }
        });
    </script>
</body>
