<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Queue | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue: #21a0d8; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; --production: #43B049; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 500px; overflow: hidden; }
        .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; }
        .dot-grid span { width: 5px; height: 5px; border-radius: 50%; background: var(--production); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 13px; font-weight: 800; }
        .count { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #DCFCE7; color: #166534; margin-left: auto; }
        .list { max-height: 300px; overflow-y: auto; }
        .item { padding: 14px 20px; border-bottom: 1px solid #F5F5F5; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.15s; }
        .item:hover { background: var(--bg-soft); }
        .item:last-child { border-bottom: none; }
        .item-icon { width: 36px; height: 36px; border-radius: 10px; background: #DCFCE7; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .item-info { flex: 1; min-width: 0; }
        .item-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-sub { font-size: 11px; color: var(--ink-sub); }
        .item-priority { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 99px; text-transform: uppercase; }
        .priority-high { background: #FEE2E2; color: #B91C1C; }
        .priority-medium { background: #FEF3C7; color: #B45309; }
        .priority-low { background: #E5E5E5; color: #525252; }
        .empty { padding: 50px 20px; text-align: center; }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 50px; color: var(--ink-sub); font-size: 12px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--production); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"><div class="loading"><div class="spinner"></div>Loading...</div></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        const auth = getAuth(app), db = getFirestore(app), appId = "dmg-command-centre-native";
        
        let items = [], loading = true;
        const root = document.getElementById('root');

        function render() {
            if (loading) { root.innerHTML = `<div class="widget"><div class="loading"><div class="spinner"></div>Loading queue...</div></div>`; return; }
            
            root.innerHTML = `
                <div class="widget">
                    <div class="header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="title">Edit Queue</h2>
                        <span class="count">${items.length} in queue</span>
                    </div>
                    ${items.length === 0 ? `
                        <div class="empty">
                            <div class="empty-icon">🎬</div>
                            <div class="empty-title">Queue Empty</div>
                            <div class="empty-sub">No edits pending. Add items to the edit_queue collection in Firebase.</div>
                        </div>
                    ` : `
                        <div class="list">
                            ${items.map(item => `
                                <div class="item" onclick="window.open('${item.url || '#'}', '_blank')">
                                    <div class="item-icon">🎬</div>
                                    <div class="item-info">
                                        <div class="item-title">${item.title || 'Untitled Edit'}</div>
                                        <div class="item-sub">${item.editor || 'Unassigned'} • ${item.duration || '0:00'}</div>
                                    </div>
                                    <span class="item-priority priority-${(item.priority || 'low').toLowerCase()}">${item.priority || 'Low'}</span>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        onAuthStateChanged(auth, user => {
            if (user) {
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "edit_queue"), snap => {
                    items = []; snap.forEach(d => items.push({ id: d.id, ...d.data() }));
                    // Sort by priority: high > medium > low
                    const priorityOrder = { high: 0, medium: 1, low: 2 };
                    items.sort((a, b) => (priorityOrder[a.priority?.toLowerCase()] || 2) - (priorityOrder[b.priority?.toLowerCase()] || 2));
                    loading = false; render();
                }, e => { console.error(e); loading = false; render(); });
            } else {
                signInAnonymously(auth).catch(e => { loading = false; render(); });
            }
        });
    </script>
</body>
</html>
