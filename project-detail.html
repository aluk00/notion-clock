<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | DMG Command Centre</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --ink-muted: #9CA3AF;
            --border: #EAECEF;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --dmg-blue: #21A0D8;
            --creative: #E6468B;
            --production: #43B049;
            --editorial: #E94B4B;
            --social: #F2C316;
            --sales: #21A0D8;
            --amber: #F59E0B;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--surface-alt);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Loading State */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 8px);
            gap: 4px;
        }
        .dot-grid span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }
        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .loading-text {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Error State */
        .error-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px;
            padding: 20px;
            text-align: center;
        }
        .error-icon { font-size: 48px; }
        .error-title { font-size: 18px; font-weight: 800; }
        .error-message { font-size: 13px; color: var(--ink-sub); max-width: 400px; }
        .error-btn {
            margin-top: 12px;
            padding: 12px 24px;
            background: var(--dmg-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        /* Page Layout */
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Back Navigation */
        .back-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-sub);
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .back-btn:hover {
            border-color: var(--ink-muted);
            color: var(--ink);
        }
        .back-btn svg { width: 16px; height: 16px; }

        /* Project Header */
        .project-header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
        }
        .header-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }
        .header-info { flex: 1; }
        .project-client {
            font-size: 11px;
            font-weight: 700;
            color: var(--dmg-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .project-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--ink);
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }
        .project-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .badge-stage { background: rgba(33, 160, 216, 0.1); color: var(--dmg-blue); }
        .badge-priority { background: rgba(245, 158, 11, 0.1); color: var(--amber); }
        .badge-team { background: rgba(230, 70, 139, 0.1); color: var(--creative); }
        .badge-type { background: var(--surface-alt); color: var(--ink-sub); }

        .header-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        .header-value {
            font-size: 24px;
            font-weight: 900;
            color: var(--success);
        }
        .notion-link {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-muted);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.15s ease;
        }
        .notion-link:hover {
            background: var(--dmg-blue);
            color: white;
            border-color: var(--dmg-blue);
        }
        .notion-link svg { width: 12px; height: 12px; }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .stat-item {
            text-align: center;
            padding: 12px;
            background: var(--surface-alt);
            border-radius: 10px;
        }
        .stat-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 14px;
            font-weight: 800;
            color: var(--ink);
        }
        .stat-value.overdue { color: var(--danger); }
        .stat-value.soon { color: var(--warning); }

        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }
        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .card-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .card-count {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--surface-alt);
            color: var(--ink-sub);
        }
        .card-body { padding: 20px; }
        .card-empty {
            text-align: center;
            padding: 32px 20px;
            color: var(--ink-muted);
            font-size: 12px;
        }

        /* Team Section */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (max-width: 500px) {
            .team-grid { grid-template-columns: 1fr; }
        }
        .team-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: var(--surface-alt);
            border-radius: 10px;
        }
        .team-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }
        .team-info { flex: 1; min-width: 0; }
        .team-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .team-role {
            font-size: 10px;
            color: var(--ink-sub);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Links Section */
        .links-list { display: flex; flex-direction: column; gap: 10px; }
        .link-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--surface-alt);
            border-radius: 10px;
            text-decoration: none;
            color: var(--ink);
            transition: all 0.15s ease;
        }
        .link-item:hover {
            background: var(--dmg-blue);
            color: white;
            transform: translateX(4px);
        }
        .link-item:hover .link-icon { background: rgba(255,255,255,0.2); color: white; }
        .link-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.15s ease;
        }
        .link-info { flex: 1; }
        .link-title { font-size: 12px; font-weight: 700; }
        .link-desc { font-size: 10px; opacity: 0.7; margin-top: 2px; }
        .link-arrow { opacity: 0.5; }

        /* Deliverables Section */
        .deliverables-list { display: flex; flex-direction: column; gap: 12px; }
        .deliverable-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.15s ease;
        }
        .deliverable-card:hover {
            border-color: var(--dmg-blue);
            box-shadow: 0 4px 12px rgba(33, 160, 216, 0.1);
        }
        .deliverable-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
        }
        .deliverable-title-section { flex: 1; min-width: 0; }
        .deliverable-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .deliverable-format {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-sub);
            text-transform: uppercase;
        }
        .deliverable-status {
            font-size: 9px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-progress { background: #DBEAFE; color: #1E40AF; }
        .status-review { background: #E9D5FF; color: #7C3AED; }
        .status-complete { background: #DCFCE7; color: #166534; }
        .status-live { background: #D1FAE5; color: #059669; }

        .deliverable-body { padding: 16px; }
        .deliverable-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }
        @media (max-width: 600px) {
            .deliverable-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .deliverable-field {}
        .deliverable-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }
        .deliverable-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
        }
        .deliverable-value.empty { color: var(--ink-muted); font-style: italic; }

        .deliverable-notes {
            padding: 12px;
            background: var(--surface-alt);
            border-radius: 8px;
            font-size: 12px;
            color: var(--ink-sub);
            line-height: 1.5;
            margin-top: 12px;
        }
        .deliverable-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .deliverable-link {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-sub);
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .deliverable-link:hover {
            background: var(--dmg-blue);
            color: white;
            border-color: var(--dmg-blue);
        }
        .deliverable-link svg { width: 12px; height: 12px; }

        /* Notes Section */
        .notes-block {
            padding: 16px;
            background: var(--surface-alt);
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .notes-block:last-child { margin-bottom: 0; }
        .notes-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }
        .notes-content {
            font-size: 13px;
            color: var(--ink);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .notes-empty {
            font-size: 12px;
            color: var(--ink-muted);
            font-style: italic;
        }

        /* Workflow Status */
        .workflow-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        @media (max-width: 500px) {
            .workflow-grid { grid-template-columns: 1fr; }
        }
        .workflow-item {
            padding: 14px;
            background: var(--surface-alt);
            border-radius: 10px;
            text-align: center;
        }
        .workflow-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .workflow-status {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
        }

        /* Budget Section */
        .budget-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (max-width: 500px) {
            .budget-grid { grid-template-columns: 1fr; }
        }
        .budget-item {
            padding: 16px;
            background: var(--surface-alt);
            border-radius: 10px;
            text-align: center;
        }
        .budget-item.highlight {
            background: rgba(33, 160, 216, 0.08);
            border: 1px solid rgba(33, 160, 216, 0.2);
        }
        .budget-item.positive {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .budget-item.warning {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .budget-item.negative {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .budget-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .budget-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
        }
        .budget-value.positive { color: var(--success); }
        .budget-value.warning { color: var(--warning); }
        .budget-value.negative { color: var(--danger); }
        .budget-value.muted { color: var(--ink-muted); font-size: 14px; }
        .budget-sub {
            font-size: 10px;
            color: var(--ink-sub);
            margin-top: 4px;
        }
        .budget-divider {
            grid-column: 1 / -1;
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }
        .budget-section-title {
            grid-column: 1 / -1;
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 8px 0 4px;
        }

        /* Quick Actions Sidebar */
        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            text-decoration: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .action-btn:hover {
            border-color: var(--dmg-blue);
            color: var(--dmg-blue);
        }
        .action-btn.primary {
            background: var(--dmg-blue);
            border-color: var(--dmg-blue);
            color: white;
        }
        .action-btn.primary:hover {
            background: #1a8ac0;
        }
        .action-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--surface-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .action-btn.primary .action-icon {
            background: rgba(255,255,255,0.2);
        }

        /* Expense Tracking Styles */
        .expense-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .expense-total {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--surface-alt);
            border-radius: 10px;
        }
        .expense-total-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
        }
        .expense-total-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
        }
        .add-expense-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--success);
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .add-expense-btn:hover { background: #1aa34a; }
        .expense-list { display: flex; flex-direction: column; gap: 10px; }
        .expense-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--surface-alt);
            border-radius: 10px;
            border-left: 3px solid var(--dmg-blue);
        }
        .expense-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .expense-item-info { flex: 1; min-width: 0; }
        .expense-item-desc {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .expense-item-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 10px;
            color: var(--ink-sub);
        }
        .expense-item-meta span { display: flex; align-items: center; gap: 4px; }
        .expense-item-amount {
            font-size: 16px;
            font-weight: 800;
            color: var(--ink);
            flex-shrink: 0;
        }
        .expense-receipt-btn {
            padding: 6px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 9px;
            font-weight: 600;
            color: var(--ink-sub);
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }
        .expense-receipt-btn:hover {
            background: var(--dmg-blue);
            color: white;
            border-color: var(--dmg-blue);
        }
        .concur-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            background: #004B87;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            margin-top: 16px;
            transition: all 0.15s ease;
        }
        .concur-link:hover { background: #003866; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: var(--surface);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading Project...</span>
        </div>
    </div>

    <script>
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        // Initialize Firebase
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        const auth = firebase.auth();

        // Sign in anonymously for Firebase access
        auth.signInAnonymously().catch(err => console.warn('Firebase auth error:', err));

        let project = null;
        let parentProject = null;
        let subitems = [];
        let deliverables = [];
        let expenses = [];
        let projectFiles = [];
        let itemLayer = 1; // 1 = Project, 2 = Episode, 3 = Task

        // Prompt user to add or edit a link
        async function promptAddLink(fieldName, fieldLabel) {
            const currentValue = project[fieldName] || '';
            const url = prompt(`Enter ${fieldLabel} URL:`, currentValue);
            if (url === null) return; // cancelled
            if (url === currentValue) return; // no change

            // Allow empty string to clear, otherwise validate
            if (url && url.trim()) {
                try {
                    new URL(url.trim());
                } catch (e) {
                    alert('Please enter a valid URL');
                    return;
                }
            }

            // Update in Notion via API
            try {
                const updateData = {};
                updateData[fieldName] = url.trim() || null;

                const res = await fetch(`${API_URL}/projects/${projectId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                if (res.ok) {
                    project[fieldName] = url.trim() || null;
                    render();
                } else {
                    throw new Error('Failed to update');
                }
            } catch (e) {
                console.error('Update error:', e);
                alert('Failed to save link. Please try again.');
            }
        }

        // Delete a link (set to null in Notion)
        async function deleteLink(fieldName, fieldLabel) {
            if (!confirm(`Remove ${fieldLabel} link?`)) return;

            try {
                const updateData = {};
                updateData[fieldName] = null;

                const res = await fetch(`${API_URL}/projects/${projectId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                if (res.ok) {
                    project[fieldName] = null;
                    render();
                } else {
                    throw new Error('Failed to delete');
                }
            } catch (e) {
                console.error('Delete error:', e);
                alert('Failed to remove link. Please try again.');
            }
        }

        // Load project files from Firebase Storage
        async function loadProjectFiles() {
            try {
                const storageRef = storage.ref(`project_files/${projectId}`);
                const result = await storageRef.listAll();

                const files = await Promise.all(result.items.map(async (itemRef) => {
                    const url = await itemRef.getDownloadURL();
                    const metadata = await itemRef.getMetadata();
                    return {
                        name: itemRef.name,
                        fullPath: itemRef.fullPath,
                        url: url,
                        size: metadata.size,
                        contentType: metadata.contentType,
                        updated: metadata.updated
                    };
                }));

                // Sort by most recent first
                files.sort((a, b) => new Date(b.updated) - new Date(a.updated));
                projectFiles = files;
            } catch (e) {
                console.warn('Could not load project files:', e);
                projectFiles = [];
            }
        }

        // Upload a file to Firebase Storage for this project
        async function uploadProjectFile(input) {
            const file = input.files[0];
            if (!file) return;

            // 25MB limit
            if (file.size > 25 * 1024 * 1024) {
                alert('File too large. Maximum size is 25MB.');
                input.value = '';
                return;
            }

            // Sanitise filename: keep alphanumeric, dots, hyphens, underscores
            const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const timestamp = Date.now();
            const storagePath = `project_files/${projectId}/${timestamp}_${safeName}`;
            const storageRef = storage.ref(storagePath);

            try {
                const uploadLabel = document.getElementById('uploadLabel');
                if (uploadLabel) {
                    uploadLabel.textContent = 'Uploading...';
                    uploadLabel.style.pointerEvents = 'none';
                }

                await storageRef.put(file);
                await loadProjectFiles();
                render();
            } catch (e) {
                console.error('Upload error:', e);
                alert('Failed to upload file: ' + e.message);
            } finally {
                input.value = '';
            }
        }

        // Delete a file from Firebase Storage
        async function deleteProjectFile(fullPath, fileName) {
            if (!confirm(`Delete "${fileName}"?`)) return;

            try {
                const fileRef = storage.ref(fullPath);
                await fileRef.delete();
                await loadProjectFiles();
                render();
            } catch (e) {
                console.error('Delete file error:', e);
                alert('Failed to delete file: ' + e.message);
            }
        }

        // Rename a project file in Firebase Storage (copy + delete)
        async function renameProjectFile(fullPath, currentName) {
            const ext = currentName.includes('.') ? '.' + currentName.split('.').pop() : '';
            const baseName = currentName.includes('.') ? currentName.substring(0, currentName.lastIndexOf('.')) : currentName;
            // Strip timestamp prefix for display
            const displayBase = baseName.replace(/^\d+_/, '');

            const newName = prompt('Rename file:', displayBase);
            if (!newName || newName === displayBase) return;

            // Sanitise
            const safeName = newName.replace(/[^a-zA-Z0-9._-]/g, '_');
            const timestamp = Date.now();
            const newPath = `project_files/${projectId}/${timestamp}_${safeName}${ext}`;

            try {
                // Firebase Storage doesn't support rename, so we download + re-upload + delete
                const oldRef = storage.ref(fullPath);
                const url = await oldRef.getDownloadURL();
                const response = await fetch(url);
                const blob = await response.blob();

                const newRef = storage.ref(newPath);
                await newRef.put(blob);
                await oldRef.delete();

                await loadProjectFiles();
                render();
            } catch (e) {
                console.error('Rename error:', e);
                alert('Failed to rename file: ' + e.message);
            }
        }

        // Get file type icon from content type or extension
        function getFileIcon(name, contentType) {
            if (contentType?.startsWith('image/')) return '🖼️';
            if (contentType?.startsWith('video/')) return '🎬';
            if (contentType?.includes('pdf')) return '📄';
            if (contentType?.includes('word') || name.endsWith('.docx') || name.endsWith('.doc')) return '📝';
            if (contentType?.includes('sheet') || contentType?.includes('excel') || name.endsWith('.xlsx')) return '📊';
            if (contentType?.includes('presentation') || name.endsWith('.pptx')) return '📊';
            return '📎';
        }

        // Format file size
        function formatFileSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Get display name (strip timestamp prefix)
        function getDisplayName(name) {
            return name.replace(/^\d+_/, '');
        }

        // Render a resource button with edit/delete actions
        function renderResourceBtn(value, fieldName, fieldLabel, icon, shortLabel) {
            if (value) {
                return `
                    <a href="${value}" target="_blank" rel="noopener noreferrer" class="resource-btn" onclick="event.stopPropagation();">
                        <div class="resource-actions">
                            <button class="resource-action-btn edit-btn" onclick="event.preventDefault(); event.stopPropagation(); promptAddLink('${fieldName}', '${fieldLabel}');" title="Edit link">✏️</button>
                            <button class="resource-action-btn delete-btn" onclick="event.preventDefault(); event.stopPropagation(); deleteLink('${fieldName}', '${fieldLabel}');" title="Remove link">×</button>
                        </div>
                        <span class="resource-icon">${icon}</span>
                        <span class="resource-label">${shortLabel}</span>
                    </a>
                `;
            } else {
                return `
                    <a href="#" class="resource-btn empty" onclick="event.preventDefault(); promptAddLink('${fieldName}', '${fieldLabel}');">
                        <span class="resource-icon">${icon}</span>
                        <span class="resource-label">${shortLabel}</span>
                        <span class="resource-add">+ Add</span>
                    </a>
                `;
            }
        }

        // Get project ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        if (!projectId) {
            showError('No project specified', 'Please provide a project ID in the URL.');
        } else {
            loadProject();
        }

        async function loadProject() {
            try {
                // Fetch project directly by ID using the new endpoint
                const projRes = await fetch(`${API_URL}/projects/${projectId}`);
                const projData = await projRes.json();

                if (!projData.success) {
                    showError('Project not found', 'The requested project could not be found.');
                    return;
                }

                project = projData.project;

                // Determine what layer this item is based on PARENT ITEM
                const hasParent = project.parentItemIds && project.parentItemIds.length > 0;
                const hasSubItems = project.subItemIds && project.subItemIds.length > 0;

                if (!hasParent) {
                    itemLayer = 1; // Layer 1: Project (no parent)
                } else if (hasSubItems) {
                    itemLayer = 2; // Layer 2: Episode (has parent and children)
                } else {
                    // Could be Layer 2 without children yet, or Layer 3
                    // Check if parent has a parent to determine
                    itemLayer = 2; // Default to Episode, could be Task
                }

                // If this item has a parent, fetch the parent project
                if (hasParent) {
                    try {
                        const parentId = project.parentItemIds[0];
                        const parentRes = await fetch(`${API_URL}/projects/${parentId}`);
                        const parentData = await parentRes.json();
                        if (parentData.success) {
                            parentProject = parentData.project;
                            // If parent also has a parent, this is Layer 3
                            if (parentProject.parentItemIds && parentProject.parentItemIds.length > 0) {
                                itemLayer = 3;
                            }
                        }
                    } catch (e) {
                        console.warn('Could not load parent project:', e);
                    }

                    // If current project has no title, redirect to the top-level parent
                    if (!project.title && parentProject) {
                        // Find the Layer 1 (top-level) project
                        let topLevelId = parentProject.id;
                        let topLevelProject = parentProject;

                        // Traverse up if parent also has a parent
                        while (topLevelProject.parentItemIds && topLevelProject.parentItemIds.length > 0) {
                            try {
                                const grandparentRes = await fetch(`${API_URL}/projects/${topLevelProject.parentItemIds[0]}`);
                                const grandparentData = await grandparentRes.json();
                                if (grandparentData.success) {
                                    topLevelId = grandparentData.project.id;
                                    topLevelProject = grandparentData.project;
                                } else {
                                    break;
                                }
                            } catch (e) {
                                break;
                            }
                        }

                        // Redirect to the top-level project
                        window.location.href = `project-detail.html?id=${topLevelId}`;
                        return;
                    }
                }

                // Fetch sub-items (children) for this item using the new endpoint
                try {
                    const subRes = await fetch(`${API_URL}/projects/${project.id}/subitems`);
                    const subData = await subRes.json();
                    subitems = subData.subitems || [];
                } catch (e) {
                    console.warn('Could not load sub-items:', e);
                    subitems = [];
                }

                // Also try to fetch deliverables from the separate DB (for backwards compatibility)
                try {
                    const delRes = await fetch(`${API_URL}/deliverables/project/${project.id}`);
                    const delData = await delRes.json();
                    deliverables = delData.deliverables || [];
                } catch (e) {
                    console.warn('Could not load deliverables:', e);
                    deliverables = [];
                }

                // Load expenses and project files from Firebase
                await Promise.all([loadExpenses(), loadProjectFiles()]);

                render();
                const layerLabel = itemLayer === 1 ? 'Project' : itemLayer === 2 ? 'Episode' : 'Task';
                document.title = `${project.title || layerLabel} | DMG Command Centre`;

            } catch (e) {
                console.error('Load error:', e);
                showError('Failed to load project', e.message);
            }
        }

        async function loadExpenses() {
            try {
                const snapshot = await db.collection('expenses')
                    .where('projectId', '==', projectId)
                    .orderBy('date', 'desc')
                    .get();

                expenses = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
            } catch (e) {
                console.warn('Could not load expenses:', e);
                expenses = [];
            }
        }

        function getExpenseTotal() {
            return expenses.reduce((sum, exp) => sum + (parseFloat(exp.amount) || 0), 0);
        }

        function getCategoryIcon(category) {
            const icons = {
                'Travel': '✈️',
                'Accommodation': '🏨',
                'Catering': '🍽️',
                'Equipment': '🎥',
                'Software': '💻',
                'Talent': '🎭',
                'Crew': '👥',
                'Props': '🎪',
                'Location': '📍',
                'Transport': '🚗',
                'Other': '📦'
            };
            return icons[category] || '📦';
        }

        async function submitExpense(e) {
            e.preventDefault();
            const form = e.target;
            const submitBtn = form.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            try {
                const amount = parseFloat(form.amount.value);
                const description = form.description.value.trim();
                const category = form.category.value;
                const vendor = form.vendor.value.trim();
                const date = form.date.value;
                const addedBy = form.addedBy.value.trim() || 'Anonymous';
                const receiptFile = form.receipt.files[0];

                let receiptUrl = null;
                let receiptPath = null;

                // Upload receipt if provided
                if (receiptFile) {
                    const timestamp = Date.now();
                    const safeName = receiptFile.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                    receiptPath = `expenses/${projectId}/${timestamp}_${safeName}`;
                    const storageRef = storage.ref(receiptPath);

                    await storageRef.put(receiptFile);
                    receiptUrl = await storageRef.getDownloadURL();
                }

                // Save expense to Firestore
                await db.collection('expenses').add({
                    projectId: projectId,
                    projectTitle: project.title || 'Untitled',
                    amount: amount,
                    description: description,
                    category: category,
                    vendor: vendor,
                    date: new Date(date),
                    receiptUrl: receiptUrl,
                    receiptPath: receiptPath,
                    addedBy: addedBy,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Refresh expenses and re-render
                await loadExpenses();
                closeExpenseModal();
                render();

            } catch (err) {
                console.error('Error saving expense:', err);
                alert('Failed to save expense: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Expense';
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return null;
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function formatCurrency(value) {
            if (value === null || value === undefined || value === '') return '—';
            const num = parseFloat(value);
            if (isNaN(num)) return '—';
            return '£' + num.toLocaleString('en-GB');
        }

        function hasCurrencyValue(value) {
            if (value === null || value === undefined || value === '') return false;
            const num = parseFloat(value);
            return !isNaN(num);
        }

        function formatBudgetValue(value) {
            if (value === null || value === undefined) return { display: '—', class: 'muted' };
            const num = parseFloat(value);
            if (isNaN(num)) return { display: '—', class: 'muted' };
            const formatted = '£' + Math.abs(num).toLocaleString('en-GB');
            if (num > 0) return { display: formatted, class: 'positive' };
            if (num < 0) return { display: '-' + formatted, class: 'negative' };
            return { display: formatted, class: '' };
        }

        function getBudgetStatus(remaining, total) {
            if (!total || total === 0) return '';
            const percent = (remaining / total) * 100;
            if (percent < 0) return 'negative';
            if (percent < 20) return 'warning';
            return 'positive';
        }

        function getInitials(name) {
            if (!name) return '?';
            if (typeof name === 'object' && name.name) name = name.name;
            return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        }

        function formatPerson(person) {
            if (!person) return null;
            if (Array.isArray(person)) return person.map(p => p.name || p).join(', ');
            if (typeof person === 'object') return person.name || null;
            return person;
        }

        function getStatusClass(status) {
            if (!status) return 'status-pending';
            const s = status.toLowerCase();
            if (s.includes('live') || s.includes('published')) return 'status-live';
            if (s.includes('complete') || s.includes('done') || s.includes('approved')) return 'status-complete';
            if (s.includes('review') || s.includes('feedback')) return 'status-review';
            if (s.includes('progress') || s.includes('editing') || s.includes('production')) return 'status-progress';
            return 'status-pending';
        }

        function isOverdue(dateStr) {
            if (!dateStr) return false;
            return new Date(dateStr) < new Date();
        }

        function isDueSoon(dateStr) {
            if (!dateStr) return false;
            const diff = (new Date(dateStr) - new Date()) / (1000 * 60 * 60 * 24);
            return diff >= 0 && diff <= 3;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
