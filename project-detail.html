<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --ink-muted: #9CA3AF;
            --border: #EAECEF;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --dmg-blue: #21A0D8;
            --creative: #E6468B;
            --production: #43B049;
            --editorial: #E94B4B;
            --social: #F2C316;
            --sales: #21A0D8;
            --amber: #F59E0B;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--surface-alt);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Loading State */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 8px);
            gap: 4px;
        }
        .dot-grid span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }
        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .loading-text {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Error State */
        .error-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px;
            padding: 20px;
            text-align: center;
        }
        .error-icon { font-size: 48px; }
        .error-title { font-size: 18px; font-weight: 800; }
        .error-message { font-size: 13px; color: var(--ink-sub); max-width: 400px; }
        .error-btn {
            margin-top: 12px;
            padding: 12px 24px;
            background: var(--dmg-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        /* Page Layout */
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Back Navigation */
        .back-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-sub);
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .back-btn:hover {
            border-color: var(--ink-muted);
            color: var(--ink);
        }
        .back-btn svg { width: 16px; height: 16px; }

        /* Project Header */
        .project-header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
        }
        .header-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }
        .header-info { flex: 1; }
        .project-client {
            font-size: 11px;
            font-weight: 700;
            color: var(--dmg-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .project-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--ink);
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }
        .project-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .badge-stage { background: rgba(33, 160, 216, 0.1); color: var(--dmg-blue); }
        .badge-priority { background: rgba(245, 158, 11, 0.1); color: var(--amber); }
        .badge-team { background: rgba(230, 70, 139, 0.1); color: var(--creative); }
        .badge-type { background: var(--surface-alt); color: var(--ink-sub); }

        .header-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        .header-value {
            font-size: 24px;
            font-weight: 900;
            color: var(--success);
        }
        .notion-link {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-muted);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.15s ease;
        }
        .notion-link:hover {
            background: var(--dmg-blue);
            color: white;
            border-color: var(--dmg-blue);
        }
        .notion-link svg { width: 12px; height: 12px; }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .stat-item {
            text-align: center;
            padding: 12px;
            background: var(--surface-alt);
            border-radius: 10px;
        }
        .stat-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 14px;
            font-weight: 800;
            color: var(--ink);
        }
        .stat-value.overdue { color: var(--danger); }
        .stat-value.soon { color: var(--warning); }

        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }
        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .card-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .card-count {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--surface-alt);
            color: var(--ink-sub);
        }
        .card-body { padding: 20px; }
        .card-empty {
            text-align: center;
            padding: 32px 20px;
            color: var(--ink-muted);
            font-size: 12px;
        }

        /* Team Section */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (max-width: 500px) {
            .team-grid { grid-template-columns: 1fr; }
        }
        .team-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: var(--surface-alt);
            border-radius: 10px;
        }
        .team-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }
        .team-info { flex: 1; min-width: 0; }
        .team-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .team-role {
            font-size: 10px;
            color: var(--ink-sub);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Links Section */
        .links-list { display: flex; flex-direction: column; gap: 10px; }
        .link-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--surface-alt);
            border-radius: 10px;
            text-decoration: none;
            color: var(--ink);
            transition: all 0.15s ease;
        }
        .link-item:hover {
            background: var(--dmg-blue);
            color: white;
            transform: translateX(4px);
        }
        .link-item:hover .link-icon { background: rgba(255,255,255,0.2); color: white; }
        .link-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.15s ease;
        }
        .link-info { flex: 1; }
        .link-title { font-size: 12px; font-weight: 700; }
        .link-desc { font-size: 10px; opacity: 0.7; margin-top: 2px; }
        .link-arrow { opacity: 0.5; }

        /* Deliverables Section */
        .deliverables-list { display: flex; flex-direction: column; gap: 12px; }
        .deliverable-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.15s ease;
        }
        .deliverable-card:hover {
            border-color: var(--dmg-blue);
            box-shadow: 0 4px 12px rgba(33, 160, 216, 0.1);
        }
        .deliverable-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
        }
        .deliverable-title-section { flex: 1; min-width: 0; }
        .deliverable-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .deliverable-format {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-sub);
            text-transform: uppercase;
        }
        .deliverable-status {
            font-size: 9px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-progress { background: #DBEAFE; color: #1E40AF; }
        .status-review { background: #E9D5FF; color: #7C3AED; }
        .status-complete { background: #DCFCE7; color: #166534; }
        .status-live { background: #D1FAE5; color: #059669; }

        .deliverable-body { padding: 16px; }
        .deliverable-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }
        @media (max-width: 600px) {
            .deliverable-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .deliverable-field {}
        .deliverable-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }
        .deliverable-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
        }
        .deliverable-value.empty { color: var(--ink-muted); font-style: italic; }

        .deliverable-notes {
            padding: 12px;
            background: var(--surface-alt);
            border-radius: 8px;
            font-size: 12px;
            color: var(--ink-sub);
            line-height: 1.5;
            margin-top: 12px;
        }
        .deliverable-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .deliverable-link {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-sub);
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .deliverable-link:hover {
            background: var(--dmg-blue);
            color: white;
            border-color: var(--dmg-blue);
        }
        .deliverable-link svg { width: 12px; height: 12px; }

        /* Notes Section */
        .notes-block {
            padding: 16px;
            background: var(--surface-alt);
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .notes-block:last-child { margin-bottom: 0; }
        .notes-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }
        .notes-content {
            font-size: 13px;
            color: var(--ink);
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .notes-empty {
            font-size: 12px;
            color: var(--ink-muted);
            font-style: italic;
        }

        /* Workflow Status */
        .workflow-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        @media (max-width: 500px) {
            .workflow-grid { grid-template-columns: 1fr; }
        }
        .workflow-item {
            padding: 14px;
            background: var(--surface-alt);
            border-radius: 10px;
            text-align: center;
        }
        .workflow-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .workflow-status {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
        }

        /* Quick Actions Sidebar */
        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            text-decoration: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .action-btn:hover {
            border-color: var(--dmg-blue);
            color: var(--dmg-blue);
        }
        .action-btn.primary {
            background: var(--dmg-blue);
            border-color: var(--dmg-blue);
            color: white;
        }
        .action-btn.primary:hover {
            background: #1a8ac0;
        }
        .action-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--surface-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .action-btn.primary .action-icon {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading Project...</span>
        </div>
    </div>

    <script>
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

        let project = null;
        let deliverables = [];

        // Get project ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        if (!projectId) {
            showError('No project specified', 'Please provide a project ID in the URL.');
        } else {
            loadProject();
        }

        async function loadProject() {
            try {
                // Fetch all projects
                const projRes = await fetch(`${API_URL}/projects`);
                const projData = await projRes.json();

                if (!projData.success) throw new Error('Failed to fetch projects');

                // First try to find project directly by ID
                project = projData.projects.find(p => p.id === projectId);

                // If not found, the ID might be a deliverable/episode ID
                // Try to find it through deliverables and get its parent project
                if (!project) {
                    try {
                        const delRes = await fetch(`${API_URL}/deliverables`);
                        const delData = await delRes.json();
                        const allDeliverables = delData.deliverables || [];

                        // Look for a deliverable with this ID
                        const deliverable = allDeliverables.find(d => d.id === projectId);

                        if (deliverable && deliverable.projectId) {
                            // Found the deliverable, now get its parent project
                            project = projData.projects.find(p => p.id === deliverable.projectId);
                        }

                        // Also check if ID matches any episode within projects
                        if (!project) {
                            for (const p of projData.projects) {
                                if (p.episodes && p.episodes.some(ep => ep.id === projectId)) {
                                    project = p;
                                    break;
                                }
                            }
                        }
                    } catch (e) {
                        console.warn('Could not search deliverables:', e);
                    }
                }

                if (!project) {
                    showError('Project not found', 'The requested project could not be found.');
                    return;
                }

                // Fetch deliverables for this project (use the actual project ID)
                try {
                    const delRes = await fetch(`${API_URL}/deliverables/project/${project.id}`);
                    const delData = await delRes.json();
                    deliverables = delData.deliverables || [];
                } catch (e) {
                    console.warn('Could not load deliverables:', e);
                    deliverables = [];
                }

                render();
                document.title = `${project.title || 'Project'} | DMG Command Centre`;

            } catch (e) {
                console.error('Load error:', e);
                showError('Failed to load project', e.message);
            }
        }

        function showError(title, message) {
            document.getElementById('app').innerHTML = `
                <div class="error-screen">
                    <div class="error-icon">😕</div>
                    <div class="error-title">${title}</div>
                    <div class="error-message">${message}</div>
                    <a href="projects-kanban-creative.html" class="error-btn">Back to Projects</a>
                </div>
            `;
        }

        function formatDate(dateStr) {
            if (!dateStr) return null;
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function formatCurrency(value) {
            if (!value) return null;
            const num = parseFloat(value);
            if (isNaN(num)) return null;
            return '£' + num.toLocaleString('en-GB');
        }

        function getInitials(name) {
            if (!name) return '?';
            if (typeof name === 'object' && name.name) name = name.name;
            return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        }

        function formatPerson(person) {
            if (!person) return null;
            if (Array.isArray(person)) return person.map(p => p.name || p).join(', ');
            if (typeof person === 'object') return person.name || null;
            return person;
        }

        function getStatusClass(status) {
            if (!status) return 'status-pending';
            const s = status.toLowerCase();
            if (s.includes('live') || s.includes('published')) return 'status-live';
            if (s.includes('complete') || s.includes('done') || s.includes('approved')) return 'status-complete';
            if (s.includes('review') || s.includes('feedback')) return 'status-review';
            if (s.includes('progress') || s.includes('editing') || s.includes('production')) return 'status-progress';
            return 'status-pending';
        }

        function isOverdue(dateStr) {
            if (!dateStr) return false;
            return new Date(dateStr) < new Date();
        }

        function isDueSoon(dateStr) {
            if (!dateStr) return false;
            const diff = (new Date(dateStr) - new Date()) / (1000 * 60 * 60 * 24);
            return diff >= 0 && diff <= 3;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function getTeamColor(role) {
            const colors = {
                'sales': '#21A0D8',
                'creative': '#E6468B',
                'production': '#43B049',
                'editorial': '#E94B4B'
            };
            return colors[role.toLowerCase()] || '#9CA3AF';
        }

        function render() {
            const p = project;
            const salesLead = formatPerson(p.salesLead);
            const creativeLead = formatPerson(p.creativeLead);
            const productionLead = formatPerson(p.productionLead);
            const editorialLead = formatPerson(p.editorialLead);

            const hasLinks = p.briefLink || p.creativeResponseLink || p.frameIoLink || p.driveFolder;
            const hasNotes = p.notes || p.salesNotes;
            const hasTeam = salesLead || creativeLead || productionLead || editorialLead;

            document.getElementById('app').innerHTML = `
                <div class="page-container">
                    <!-- Back Navigation -->
                    <div class="back-nav">
                        <a href="projects-kanban-creative.html" class="back-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            Back to Projects
                        </a>
                    </div>

                    <!-- Project Header -->
                    <div class="project-header">
                        <div class="header-top">
                            <div class="header-info">
                                ${p.client ? `<div class="project-client">${escapeHtml(p.client)}</div>` : ''}
                                <h1 class="project-title">${escapeHtml(p.title) || 'Untitled Project'}</h1>
                                <div class="project-badges">
                                    ${p.dealStage ? `<span class="badge badge-stage">${escapeHtml(p.dealStage)}</span>` : ''}
                                    ${p.priority ? `<span class="badge badge-priority">${escapeHtml(p.priority)}</span>` : ''}
                                    ${p.primaryTeam ? `<span class="badge badge-team">${escapeHtml(p.primaryTeam)}</span>` : ''}
                                    ${p.projectType ? `<span class="badge badge-type">${escapeHtml(p.projectType)}</span>` : ''}
                                </div>
                            </div>
                            <div class="header-actions">
                                ${p.dealValue ? `<div class="header-value">${formatCurrency(p.dealValue)}</div>` : ''}
                                ${p.url ? `
                                    <a href="${p.url}" target="_blank" class="notion-link" title="Open in Notion">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                        Notion
                                    </a>
                                ` : ''}
                            </div>
                        </div>

                        <div class="stats-row">
                            <div class="stat-item">
                                <div class="stat-label">Internal Due</div>
                                <div class="stat-value ${isOverdue(p.dueDate) ? 'overdue' : isDueSoon(p.dueDate) ? 'soon' : ''}">${formatDate(p.dueDate) || '—'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Client Due</div>
                                <div class="stat-value ${isOverdue(p.clientDueDate) ? 'overdue' : isDueSoon(p.clientDueDate) ? 'soon' : ''}">${formatDate(p.clientDueDate) || '—'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Deliverables</div>
                                <div class="stat-value">${deliverables.length || p.deliverableCount || 0}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Completed</div>
                                <div class="stat-value">${p.deliverablesComplete || 0}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Probability</div>
                                <div class="stat-value">${p.probability ? p.probability + '%' : '—'}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Main Content -->
                    <div class="content-grid">
                        <div class="main-column">
                            <!-- Deliverables -->
                            <div class="card">
                                <div class="card-header">
                                    <div class="card-title">
                                        <div class="card-dot" style="background: var(--production)"></div>
                                        Deliverables
                                    </div>
                                    <span class="card-count">${deliverables.length}</span>
                                </div>
                                <div class="card-body">
                                    ${deliverables.length === 0 ? `
                                        <div class="card-empty">No deliverables linked to this project yet.</div>
                                    ` : `
                                        <div class="deliverables-list">
                                            ${deliverables.map(d => renderDeliverable(d)).join('')}
                                        </div>
                                    `}
                                </div>
                            </div>

                            <!-- Notes -->
                            ${hasNotes ? `
                                <div class="card">
                                    <div class="card-header">
                                        <div class="card-title">
                                            <div class="card-dot" style="background: var(--ink-muted)"></div>
                                            Notes
                                        </div>
                                    </div>
                                    <div class="card-body">
                                        ${p.notes ? `
                                            <div class="notes-block">
                                                <div class="notes-label">Internal Notes</div>
                                                <div class="notes-content">${escapeHtml(p.notes)}</div>
                                            </div>
                                        ` : ''}
                                        ${p.salesNotes ? `
                                            <div class="notes-block">
                                                <div class="notes-label">Sales Notes</div>
                                                <div class="notes-content">${escapeHtml(p.salesNotes)}</div>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="side-column">
                            <!-- Team -->
                            ${hasTeam ? `
                                <div class="card">
                                    <div class="card-header">
                                        <div class="card-title">
                                            <div class="card-dot" style="background: var(--creative)"></div>
                                            Team
                                        </div>
                                    </div>
                                    <div class="card-body">
                                        <div class="team-grid">
                                            ${salesLead ? `
                                                <div class="team-member">
                                                    <div class="team-avatar" style="background: ${getTeamColor('sales')}">${getInitials(salesLead)}</div>
                                                    <div class="team-info">
                                                        <div class="team-name">${escapeHtml(salesLead)}</div>
                                                        <div class="team-role">Sales Lead</div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                            ${creativeLead ? `
                                                <div class="team-member">
                                                    <div class="team-avatar" style="background: ${getTeamColor('creative')}">${getInitials(creativeLead)}</div>
                                                    <div class="team-info">
                                                        <div class="team-name">${escapeHtml(creativeLead)}</div>
                                                        <div class="team-role">Creative Lead</div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                            ${productionLead ? `
                                                <div class="team-member">
                                                    <div class="team-avatar" style="background: ${getTeamColor('production')}">${getInitials(productionLead)}</div>
                                                    <div class="team-info">
                                                        <div class="team-name">${escapeHtml(productionLead)}</div>
                                                        <div class="team-role">Production Lead</div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                            ${editorialLead ? `
                                                <div class="team-member">
                                                    <div class="team-avatar" style="background: ${getTeamColor('editorial')}">${getInitials(editorialLead)}</div>
                                                    <div class="team-info">
                                                        <div class="team-name">${escapeHtml(editorialLead)}</div>
                                                        <div class="team-role">Editorial Lead</div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Links -->
                            ${hasLinks ? `
                                <div class="card">
                                    <div class="card-header">
                                        <div class="card-title">
                                            <div class="card-dot" style="background: var(--dmg-blue)"></div>
                                            Links
                                        </div>
                                    </div>
                                    <div class="card-body">
                                        <div class="links-list">
                                            ${p.briefLink ? `
                                                <a href="${p.briefLink}" target="_blank" class="link-item">
                                                    <div class="link-icon">📋</div>
                                                    <div class="link-info">
                                                        <div class="link-title">Brief</div>
                                                        <div class="link-desc">View project brief</div>
                                                    </div>
                                                    <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                                </a>
                                            ` : ''}
                                            ${p.creativeResponseLink ? `
                                                <a href="${p.creativeResponseLink}" target="_blank" class="link-item">
                                                    <div class="link-icon">🎨</div>
                                                    <div class="link-info">
                                                        <div class="link-title">Creative Response</div>
                                                        <div class="link-desc">View creative deck</div>
                                                    </div>
                                                    <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                                </a>
                                            ` : ''}
                                            ${p.frameIoLink ? `
                                                <a href="${p.frameIoLink}" target="_blank" class="link-item">
                                                    <div class="link-icon">🎬</div>
                                                    <div class="link-info">
                                                        <div class="link-title">Frame.io</div>
                                                        <div class="link-desc">Review video assets</div>
                                                    </div>
                                                    <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                                </a>
                                            ` : ''}
                                            ${p.driveFolder ? `
                                                <a href="${p.driveFolder}" target="_blank" class="link-item">
                                                    <div class="link-icon">📁</div>
                                                    <div class="link-info">
                                                        <div class="link-title">Drive Folder</div>
                                                        <div class="link-desc">Project files & assets</div>
                                                    </div>
                                                    <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                                </a>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Workflow Status -->
                            <div class="card">
                                <div class="card-header">
                                    <div class="card-title">
                                        <div class="card-dot" style="background: var(--amber)"></div>
                                        Workflow Status
                                    </div>
                                </div>
                                <div class="card-body">
                                    <div class="workflow-grid">
                                        <div class="workflow-item">
                                            <div class="workflow-label">Creative</div>
                                            <div class="workflow-status">${escapeHtml(p.creativeWorkflowStatus) || '—'}</div>
                                        </div>
                                        <div class="workflow-item">
                                            <div class="workflow-label">Production</div>
                                            <div class="workflow-status">${escapeHtml(p.productionWorkflowStatus) || '—'}</div>
                                        </div>
                                        <div class="workflow-item">
                                            <div class="workflow-label">Social</div>
                                            <div class="workflow-status">${escapeHtml(p.socialWorkflowStatus) || '—'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Quick Actions -->
                            <div class="card">
                                <div class="card-header">
                                    <div class="card-title">
                                        <div class="card-dot" style="background: var(--ink)"></div>
                                        Quick Actions
                                    </div>
                                </div>
                                <div class="card-body">
                                    <div class="quick-actions">
                                        <a href="commercial-hub-react.html?project=${p.id}" class="action-btn primary">
                                            <div class="action-icon">📊</div>
                                            <span>Open in Commercial Hub</span>
                                        </a>
                                        <a href="projects-kanban-creative.html?project=${p.id}" class="action-btn">
                                            <div class="action-icon">🎯</div>
                                            <span>View in Creative Kanban</span>
                                        </a>
                                        ${p.url ? `
                                            <a href="${p.url}" target="_blank" class="action-btn">
                                                <div class="action-icon">📝</div>
                                                <span>Edit in Notion</span>
                                            </a>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDeliverable(d) {
            const contentCreator = formatPerson(d.contentCreator);
            const assignedCreative = formatPerson(d.assignedCreative);
            const statusClass = getStatusClass(d.status);

            return `
                <div class="deliverable-card">
                    <div class="deliverable-header">
                        <div class="deliverable-title-section">
                            <div class="deliverable-title">${escapeHtml(d.title) || 'Untitled Deliverable'}</div>
                            <div class="deliverable-format">${escapeHtml(d.format) || 'Asset'}</div>
                        </div>
                        <span class="deliverable-status ${statusClass}">${escapeHtml(d.status) || 'Pending'}</span>
                    </div>
                    <div class="deliverable-body">
                        <div class="deliverable-grid">
                            <div class="deliverable-field">
                                <div class="deliverable-label">Due Date</div>
                                <div class="deliverable-value ${d.dueDate ? (isOverdue(d.dueDate) ? 'overdue' : '') : 'empty'}">${formatDate(d.dueDate) || 'Not set'}</div>
                            </div>
                            <div class="deliverable-field">
                                <div class="deliverable-label">Content Creator</div>
                                <div class="deliverable-value ${contentCreator ? '' : 'empty'}">${escapeHtml(contentCreator) || 'Unassigned'}</div>
                            </div>
                            <div class="deliverable-field">
                                <div class="deliverable-label">Editor / Designer</div>
                                <div class="deliverable-value ${assignedCreative ? '' : 'empty'}">${escapeHtml(assignedCreative) || 'Unassigned'}</div>
                            </div>
                            ${d.staticAssetCount ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Static Assets</div>
                                    <div class="deliverable-value">${d.staticAssetCount}</div>
                                </div>
                            ` : ''}
                            ${d.movingAssetCount ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Moving Assets</div>
                                    <div class="deliverable-value">${d.movingAssetCount}</div>
                                </div>
                            ` : ''}
                            ${d.creativeEffort || d.designEffort || d.editorEffort ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Effort (pts)</div>
                                    <div class="deliverable-value">${d.creativeEffort || 0} / ${d.designEffort || 0} / ${d.editorEffort || 0}</div>
                                </div>
                            ` : ''}
                        </div>

                        ${d.notes ? `
                            <div class="deliverable-notes">
                                <strong>Notes:</strong> ${escapeHtml(d.notes)}
                            </div>
                        ` : ''}

                        <div class="deliverable-actions">
                            ${d.url ? `
                                <a href="${d.url}" target="_blank" class="deliverable-link">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                    Open in Notion
                                </a>
                            ` : ''}
                            ${d.liveLink ? `
                                <a href="${d.liveLink}" target="_blank" class="deliverable-link" style="background: #DCFCE7; border-color: #86EFAC; color: #166534;">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                                    Live Link
                                </a>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
