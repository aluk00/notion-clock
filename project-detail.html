                                                <button class="slack-action-btn delete" onclick="event.preventDefault(); deleteLink('slackChannelLink', 'Slack Channel')" title="Remove">×</button>
                                            </div>
                                        ` : `
                                            <button onclick="promptAddLink('slackChannelLink', 'Slack Channel')" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 16px; background: linear-gradient(135deg, rgba(97,31,105,0.1) 0%, rgba(74,21,75,0.05) 100%); border: 2px dashed rgba(97,31,105,0.3); border-radius: 10px; color: #611f69; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s ease;">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color: #611f69;"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></svg>
                                                <span>+ Add Slack Channel Link</span>
                                            </button>
                                        `}
                                    </div>

                                    <!-- Notion Link -->
                                    ${p.url ? `
                                        <div style="margin-top: 8px;">
                                            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="notion-mini-link">
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                                Edit in Notion
                                            </a>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>

                            <!-- Latest Files -->
                            <div class="card">
                                <div class="card-header">
                                    <div class="card-title">
                                        <div class="card-dot" style="background: var(--production)"></div>
                                        Latest Files
                                    </div>
                                    <span class="card-count">${projectFiles.length}</span>
                                </div>
                                <div class="card-body">
                                    ${projectFiles.length > 0 ? `
                                        <div class="latest-files-list">
                                            ${projectFiles.slice(0, 10).map(f => `
                                                <div class="latest-file-item">
                                                    <span class="latest-file-icon">${getFileIcon(f.name, f.contentType)}</span>
                                                    <div class="latest-file-info">
                                                        <div class="latest-file-name" title="${escapeHtml(getDisplayName(f.name))}">${escapeHtml(getDisplayName(f.name))}</div>
                                                        <div class="latest-file-date">${formatFileSize(f.size)} · ${new Date(f.updated).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
                                                    </div>
                                                    <div class="latest-file-actions">
                                                        <a href="${f.url}" target="_blank" rel="noopener noreferrer" title="Open">↗</a>
                                                        <button onclick="renameProjectFile('${escapeHtml(f.fullPath)}', '${escapeHtml(f.name)}')" title="Rename">✏️</button>
                                                        <button onclick="deleteProjectFile('${escapeHtml(f.fullPath)}', '${escapeHtml(getDisplayName(f.name))}')" title="Delete">×</button>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : `
                                        <div class="files-empty">No files uploaded yet</div>
                                    `}
                                    <label class="files-upload-zone" id="uploadLabel">
                                        <input type="file" style="display:none" onchange="uploadProjectFile(this)">
                                        <span>📎</span>
                                        <span>Upload file (max 25MB)</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Hierarchy Info -->
                            <div class="card" style="border-left: 3px solid ${layer.color};">
                                <div class="card-header">
                                    <div class="card-title">
                                        <div class="card-dot" style="background: ${layer.color}"></div>
                                        Item Type
                                    </div>
                                </div>
                                <div class="card-body" style="padding: 16px;">
                                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                                        <span style="font-size: 24px;">${layer.icon}</span>
                                        <div>
                                            <div style="font-size: 16px; font-weight: 800; color: ${layer.color};">${layer.label}</div>
                                            <div style="font-size: 10px; color: var(--ink-sub);">
                                                ${itemLayer === 1 ? 'Top-level project in Master Ledger' :
                                                  itemLayer === 2 ? 'Episode or deliverable under a project' :
                                                  'Individual task under an episode'}
                                            </div>
                                        </div>
                                    </div>
                                    ${hasParentLink ? `
                                        <div style="padding: 10px; background: var(--surface-alt); border-radius: 8px; margin-top: 8px;">
                                            <div style="font-size: 9px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; margin-bottom: 4px;">Parent</div>
                                            <a href="project-detail.html?id=${parentProject.id}" style="font-size: 12px; font-weight: 600; color: var(--ink); text-decoration: none;">
                                                ${escapeHtml(parentProject.title || 'Untitled')} →
                                            </a>
                                        </div>
                                    ` : ''}
                                    ${subitems.length > 0 ? `
                                        <div style="padding: 10px; background: var(--surface-alt); border-radius: 8px; margin-top: 8px;">
                                            <div style="font-size: 9px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; margin-bottom: 4px;">
                                                ${itemLayer === 1 ? 'Episodes' : 'Tasks'}
                                            </div>
                                            <div style="font-size: 12px; font-weight: 600; color: var(--ink);">
                                                ${subitems.length} ${itemLayer === 1 ? 'episode' : 'task'}${subitems.length !== 1 ? 's' : ''} linked
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>

                            <!-- Team -->
                            <div class="card">
                                <div class="card-header">
                                    <div class="card-title">
                                        <div class="card-dot" style="background: var(--creative)"></div>
                                        Team
                                    </div>
                                </div>
                                <div class="card-body">
                                    ${hasTeam ? `
                                        <div class="team-grid">
                                            ${salesLead ? `
                                                <div class="team-member">
                                                    <div class="team-avatar" style="background: ${getTeamColor('sales')}">${getInitials(salesLead)}</div>
                                                    <div class="team-info">
                                                        <div class="team-name">${escapeHtml(salesLead)}</div>
                                                        <div class="team-role">Sales Lead</div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                            ${creativeLead ? `
                                                <div class="team-member">
                                                    <div class="team-avatar" style="background: ${getTeamColor('creative')}">${getInitials(creativeLead)}</div>
                                                    <div class="team-info">
                                                        <div class="team-name">${escapeHtml(creativeLead)}</div>
                                                        <div class="team-role">Creative Lead</div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                            ${productionLead ? `
                                                <div class="team-member">
                                                    <div class="team-avatar" style="background: ${getTeamColor('production')}">${getInitials(productionLead)}</div>
                                                    <div class="team-info">
                                                        <div class="team-name">${escapeHtml(productionLead)}</div>
                                                        <div class="team-role">Production Lead</div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                            ${editorialLead ? `
                                                <div class="team-member">
                                                    <div class="team-avatar" style="background: ${getTeamColor('editorial')}">${getInitials(editorialLead)}</div>
                                                    <div class="team-info">
                                                        <div class="team-name">${escapeHtml(editorialLead)}</div>
                                                        <div class="team-role">Editorial Lead</div>
                                                    </div>
                                                </div>
                                            ` : ''}
                                        </div>
                                    ` : `
                                        <div class="card-empty">No team members assigned yet.</div>
                                    `}
                                </div>
                            </div>

                            <!-- Links moved to Project Resources section at top -->

                            <!-- Workflow Status -->
                            <div class="card">
                                <div class="card-header">
                                    <div class="card-title">
                                        <div class="card-dot" style="background: var(--amber)"></div>
                                        Workflow Status
                                    </div>
                                </div>
                                <div class="card-body">
                                    <div class="workflow-grid">
                                        <div class="workflow-item">
                                            <div class="workflow-label">Creative</div>
                                            <div class="workflow-status">${escapeHtml(p.creativeWorkflowStatus) || '—'}</div>
                                        </div>
                                        <div class="workflow-item">
                                            <div class="workflow-label">Production</div>
                                            <div class="workflow-status">${escapeHtml(p.productionWorkflowStatus) || '—'}</div>
                                        </div>
                                        <div class="workflow-item">
                                            <div class="workflow-label">Social</div>
                                            <div class="workflow-status">${escapeHtml(p.socialWorkflowStatus) || '—'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Quick Actions -->
                            <div class="card">
                                <div class="card-header">
                                    <div class="card-title">
                                        <div class="card-dot" style="background: var(--ink)"></div>
                                        Quick Actions
                                    </div>
                                </div>
                                <div class="card-body">
                                    <div class="quick-actions">
                                        <a href="commercial-hub-react.html" class="action-btn primary">
                                            <div class="action-icon">📊</div>
                                            <span>Commercial Hub</span>
                                        </a>
                                        <a href="projects-kanban-creative.html" class="action-btn">
                                            <div class="action-icon">🎯</div>
                                            <span>Creative Kanban</span>
                                        </a>
                                        <a href="projects-kanban-production.html" class="action-btn">
                                            <div class="action-icon">🎬</div>
                                            <span>Production Kanban</span>
                                        </a>
                                    </div>
                                    ${p.url ? `
                                        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
                                            <a href="${p.url}" target="_blank" style="display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ink-muted); text-decoration: none;">
                                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                                Edit in Notion
                                            </a>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Expense Modal -->
                <div id="expenseModal" class="modal-overlay" onclick="if(event.target === this) closeExpenseModal()">
                    <div class="modal">
                        <div class="modal-header">
                            <div class="modal-title">Add Expense</div>
                            <button class="modal-close" onclick="closeExpenseModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <form id="expenseForm" onsubmit="submitExpense(event)">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">Amount (£) *</label>
                                        <input type="number" name="amount" class="form-input" step="0.01" min="0" required placeholder="0.00">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Date *</label>
                                        <input type="date" name="date" id="expenseDate" class="form-input" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Description *</label>
                                    <input type="text" name="description" class="form-input" required placeholder="What was this expense for?">
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">Category *</label>
                                        <select name="category" class="form-select" required>
                                            <option value="">Select category...</option>
                                            <option value="Travel">Travel</option>
                                            <option value="Accommodation">Accommodation</option>
                                            <option value="Catering">Catering</option>
                                            <option value="Equipment">Equipment</option>
                                            <option value="Software">Software</option>
                                            <option value="Talent">Talent</option>
                                            <option value="Crew">Crew</option>
                                            <option value="Props">Props</option>
                                            <option value="Location">Location</option>
                                            <option value="Transport">Transport</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Vendor</label>
                                        <input type="text" name="vendor" class="form-input" placeholder="e.g., Amazon, Uber">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Your Name</label>
                                    <input type="text" name="addedBy" class="form-input" placeholder="Who is adding this expense?">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Receipt (optional)</label>
                                    <label class="file-upload-area">
                                        <input type="file" name="receipt" accept="image/*,.pdf" style="display:none" onchange="handleFileSelect(this)">
                                        <div class="file-upload-icon">📎</div>
                                        <div class="file-upload-text">Click to upload receipt (image or PDF)</div>
                                        <div class="file-upload-name"></div>
                                    </label>
                                </div>
                                <button type="submit" class="submit-btn">Add Expense</button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSubitem(s) {
            const assignedTo = formatPerson(s.assignedTo);
            const statusClass = getStatusClass(s.status || s.status1);
            const hasChildren = s.hasSubItems && s.subItemCount > 0;

            // Determine if this is an Episode (Layer 2) or Task (Layer 3)
            const isEpisode = hasChildren || (itemLayer === 1);
            const itemColor = isEpisode ? 'var(--creative)' : 'var(--production)';

            return `
                <div class="deliverable-card" style="border-left: 3px solid ${itemColor};">
                    <div class="deliverable-header">
                        <div class="deliverable-title-section">
                            <div class="deliverable-title" style="display: flex; align-items: center; gap: 8px;">
                                <span>${escapeHtml(s.title) || 'Untitled'}</span>
                                ${hasChildren ? `<span style="font-size: 9px; background: var(--surface-alt); padding: 2px 6px; border-radius: 10px; color: var(--ink-sub);">${s.subItemCount} tasks</span>` : ''}
                            </div>
                            <div class="deliverable-format">
                                ${s.discipline ? escapeHtml(s.discipline) : ''}
                                ${s.discipline && s.format ? ' • ' : ''}
                                ${s.format ? escapeHtml(s.format) : ''}
                                ${!s.discipline && !s.format ? 'Item' : ''}
                            </div>
                        </div>
                        <span class="deliverable-status ${statusClass}">${escapeHtml(s.status || s.status1) || 'Pending'}</span>
                    </div>
                    <div class="deliverable-body">
                        <div class="deliverable-grid">
                            <div class="deliverable-field">
                                <div class="deliverable-label">Due Date</div>
                                <div class="deliverable-value ${s.dueDate ? (isOverdue(s.dueDate) ? 'overdue' : '') : 'empty'}">${formatDate(s.dueDate) || 'Not set'}</div>
                            </div>
                            ${assignedTo ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Assigned To</div>
                                    <div class="deliverable-value">${escapeHtml(assignedTo)}</div>
                                </div>
                            ` : ''}
                            ${s.effortPts || s.effortScore ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Effort (pts)</div>
                                    <div class="deliverable-value">${s.effortPts || s.effortScore || 0}</div>
                                </div>
                            ` : ''}
                            ${s.channel ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Channel</div>
                                    <div class="deliverable-value">${escapeHtml(s.channel)}</div>
                                </div>
                            ` : ''}
                            ${s.creativeWorkflowStatus ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Creative Status</div>
                                    <div class="deliverable-value">${escapeHtml(s.creativeWorkflowStatus)}</div>
                                </div>
                            ` : ''}
                            ${s.productionWorkflowStatus ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Production Status</div>
                                    <div class="deliverable-value">${escapeHtml(s.productionWorkflowStatus)}</div>
                                </div>
                            ` : ''}
                            ${s.feedbackStatus ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Feedback</div>
                                    <div class="deliverable-value">${escapeHtml(s.feedbackStatus)}</div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="deliverable-actions">
                            <a href="project-detail.html?id=${s.id}" class="deliverable-link" style="background: ${itemColor}15; border-color: ${itemColor}40; color: ${itemColor};">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                                View Details
                            </a>
                            ${s.url ? `
                                <a href="${s.url}" target="_blank" class="deliverable-link">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                    Notion
                                </a>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDeliverable(d) {
            const contentCreator = formatPerson(d.contentCreator);
            const assignedCreative = formatPerson(d.assignedCreative);
            const statusClass = getStatusClass(d.status);

            return `
                <div class="deliverable-card">
                    <div class="deliverable-header">
                        <div class="deliverable-title-section">
                            <div class="deliverable-title">${escapeHtml(d.title) || 'Untitled Deliverable'}</div>
                            <div class="deliverable-format">${escapeHtml(d.format) || 'Asset'}</div>
                        </div>
                        <span class="deliverable-status ${statusClass}">${escapeHtml(d.status) || 'Pending'}</span>
                    </div>
                    <div class="deliverable-body">
                        <div class="deliverable-grid">
                            <div class="deliverable-field">
                                <div class="deliverable-label">Due Date</div>
                                <div class="deliverable-value ${d.dueDate ? (isOverdue(d.dueDate) ? 'overdue' : '') : 'empty'}">${formatDate(d.dueDate) || 'Not set'}</div>
                            </div>
                            <div class="deliverable-field">
                                <div class="deliverable-label">Content Creator</div>
                                <div class="deliverable-value ${contentCreator ? '' : 'empty'}">${escapeHtml(contentCreator) || 'Unassigned'}</div>
                            </div>
                            <div class="deliverable-field">
                                <div class="deliverable-label">Editor / Designer</div>
                                <div class="deliverable-value ${assignedCreative ? '' : 'empty'}">${escapeHtml(assignedCreative) || 'Unassigned'}</div>
                            </div>
                            ${d.staticAssetCount ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Static Assets</div>
                                    <div class="deliverable-value">${d.staticAssetCount}</div>
                                </div>
                            ` : ''}
                            ${d.movingAssetCount ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Moving Assets</div>
                                    <div class="deliverable-value">${d.movingAssetCount}</div>
                                </div>
                            ` : ''}
                            ${d.creativeEffort || d.designEffort || d.editorEffort ? `
                                <div class="deliverable-field">
                                    <div class="deliverable-label">Effort (pts)</div>
                                    <div class="deliverable-value">${d.creativeEffort || 0} / ${d.designEffort || 0} / ${d.editorEffort || 0}</div>
                                </div>
                            ` : ''}
                        </div>

                        ${d.notes ? `
                            <div class="deliverable-notes">
                                <strong>Notes:</strong> ${escapeHtml(d.notes)}
                            </div>
                        ` : ''}

                        <div class="deliverable-actions">
                            ${d.url ? `
                                <a href="${d.url}" target="_blank" class="deliverable-link">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                    Open in Notion
                                </a>
                            ` : ''}
                            ${d.liveLink ? `
                                <a href="${d.liveLink}" target="_blank" class="deliverable-link" style="background: #DCFCE7; border-color: #86EFAC; color: #166534;">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                                    Live Link
                                </a>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
