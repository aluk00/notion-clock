<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoots This Week Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
:root {
    --hero-blue: #21A0D8;
    --ink: #1C1C1C;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    margin: 0;
    padding: 0 0 0 20px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    height: 100vh;
    background-color: transparent;
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
}

.header-container {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    padding: 20px 0;
}

.title-text {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--ink);
    line-height: 0.92;
    letter-spacing: -0.05em;
    text-transform: uppercase;
}

.dots-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    width: 20px;
    height: 20px;
}

.dot {
    width: 100%;
    height: 100%;
    background-color: var(--hero-blue);
    border-radius: 50%;
}
</style>
</head>
<body>
<div class="header-container">
    <div class="title-text">SHOOTS</div>
    <div class="dots-grid">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <div class="title-text">THIS WEEK</div>
</div>
</body>
</html>
