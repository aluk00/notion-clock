<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slick Notion Clock</title>
    <style>
        /* * Core Layout & Aesthetics 
         */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Pure white background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Container ensures the clock stays square and responsive */
        .clock-container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 500px;
            max-height: 500px;
        }

        /* SVG styling */
        svg {
            width: 100%;
            height: 100%;
            overflow: visible; /* Allows shadows to spill out if added */
        }

        /* * Hand Styling
         */
        .hand {
            stroke-linecap: round;
            transform-origin: 50% 50%;
            transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44); /* Subtle bounce for tick, but we use linear for sweep usually */
        }

        .hand-smooth {
            transition: none; /* Smooth sweep for second hand */
        }

        /* Light Blue Color Palette */
        .hand-hour, .hand-minute {
            stroke: #38bdf8; /* Sky Blue */
            stroke-width: 6;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.15)); /* Subtle shadow for white bg */
        }

        .hand-second {
            stroke: #00e1ff; /* Brighter Cyan/Blue for seconds */
            stroke-width: 2;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
        }

        /* Center Pin */
        .center-pin {
            fill: #ffffff;
            stroke: #38bdf8;
            stroke-width: 3;
        }

        /* Tick Markers (Subtle background details) */
        .tick {
            stroke: #000000; /* Black ticks */
            stroke-width: 2;
            stroke-linecap: round;
        }
        
        .tick-major {
            stroke: #000000; /* Black major ticks */
            stroke-width: 3;
        }

    </style>
</head>
<body>

    <div class="clock-container">
        <svg viewBox="0 0 200 200">
            <!-- Clock Face Definitions -->
            <defs>
                <!-- Filter for a subtle glow (slick effect) -->
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Ticks Group (Generated via JS for precision, but hardcoded here for reliability/simplicity) -->
            <g id="ticks">
                <!-- Generated by JS below to keep HTML clean -->
            </g>

            <!-- Hands -->
            <!-- Hour Hand -->
            <line id="hour-hand" class="hand hand-hour" x1="100" y1="100" x2="100" y2="55" />
            
            <!-- Minute Hand -->
            <line id="minute-hand" class="hand hand-minute" x1="100" y1="100" x2="100" y2="30" />
            
            <!-- Second Hand -->
            <line id="second-hand" class="hand hand-second hand-smooth" x1="100" y1="110" x2="100" y2="25" />

            <!-- Center Pin -->
            <circle class="center-pin" cx="100" cy="100" r="4" />
        </svg>
    </div>

    <script>
        /**
         * Clock Logic
         */
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const ticksGroup = document.getElementById('ticks');

        // 1. Generate Ticks
        function generateTicks() {
            const radius = 90; // Distance from center
            const center = 100;
            
            for (let i = 0; i < 60; i++) {
                const angle = (i * 6) * (Math.PI / 180); // 6 degrees per tick
                const isMajor = i % 5 === 0;
                
                // Length of tick
                const length = isMajor ? 10 : 5;
                const innerRadius = radius - length;

                const x1 = center + radius * Math.sin(angle);
                const y1 = center - radius * Math.cos(angle);
                const x2 = center + innerRadius * Math.sin(angle);
                const y2 = center - innerRadius * Math.cos(angle);

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x1);
                line.setAttribute("y1", y1);
                line.setAttribute("x2", x2);
                line.setAttribute("y2", y2);
                line.setAttribute("class", isMajor ? "tick tick-major" : "tick");
                
                ticksGroup.appendChild(line);
            }
        }

        // 2. Update Time
        function updateClock() {
            const now = new Date();
            
            // Get current times
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();
            const milliseconds = now.getMilliseconds();

            // Calculate degrees
            // Seconds: Smooth sweep using milliseconds
            const secondsDegrees = ((seconds / 60) * 360) + ((milliseconds / 1000) * 6);
            
            // Minutes: Moves slightly with seconds
            const minutesDegrees = ((minutes / 60) * 360) + ((seconds / 60) * 6);
            
            // Hours: Moves slightly with minutes
            const hoursDegrees = ((hours % 12) / 12 * 360) + ((minutes / 60) * 30);

            // Apply rotations
            // We use JS template strings to set the rotate transform around center (100, 100)
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`;
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`;

            // Loop
            requestAnimationFrame(updateClock);
        }

        // Initialize
        generateTicks();
        requestAnimationFrame(updateClock);

    </script>
</body>
</html>
