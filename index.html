<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slick Notion Clock | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; }
        .clock-container { position: relative; width: 90vmin; height: 90vmin; max-width: 500px; max-height: 500px; }
        svg { width: 100%; height: 100%; overflow: visible; }
        .hand { stroke-linecap: round; transform-origin: 50% 50%; }
        .hand-smooth { transition: none; }
        .hand-hour, .hand-minute { stroke: #38bdf8; stroke-width: 6; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.15)); }
        .hand-second { stroke: #00e1ff; stroke-width: 2; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15)); }
        .center-pin { fill: #ffffff; stroke: #38bdf8; stroke-width: 3; }
        .tick { stroke: #000000; stroke-width: 2; stroke-linecap: round; }
        .tick-major { stroke: #000000; stroke-width: 3; }

        /* AI Assistant Styling */
        #ai-trigger {
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
            background: #21A0D8; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; z-index: 10000;
            box-shadow: 0 10px 25px rgba(33, 160, 216, 0.4);
            transition: transform 0.2s ease;
        }
        #ai-trigger:hover { transform: scale(1.1); }
        #ai-sidebar {
            position: fixed; top: 0; right: 0; bottom: 0; width: 380px; 
            background: white; border-left: 1px solid #EAECEF; z-index: 10001;
            transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
            box-shadow: -20px 0 60px rgba(0,0,0,0.1);
        }
        #ai-sidebar.open { transform: translateX(0); }
        .ai-dot-grid { display: grid; grid-template-columns: repeat(2, 5px); gap: 3px; }
        .ai-dot-grid span { width: 5px; height: 5px; background: white; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="clock-container">
        <svg viewBox="0 0 200 200">
            <g id="ticks"></g>
            <line id="hour-hand" class="hand hand-hour" x1="100" y1="100" x2="100" y2="55" />
            <line id="minute-hand" class="hand hand-minute" x1="100" y1="100" x2="100" y2="30" />
            <line id="second-hand" class="hand hand-second hand-smooth" x1="100" y1="110" x2="100" y2="25" />
            <circle class="center-pin" cx="100" cy="100" r="4" />
        </svg>
    </div>

    <div id="dmg-ai-root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const ticksGroup = document.getElementById('ticks');
        function generateTicks() {
            const radius = 90; const center = 100;
            for (let i = 0; i < 60; i++) {
                const angle = (i * 6) * (Math.PI / 180);
                const isMajor = i % 5 === 0;
                const length = isMajor ? 10 : 5;
                const innerRadius = radius - length;
                const x1 = center + radius * Math.sin(angle);
                const y1 = center - radius * Math.cos(angle);
                const x2 = center + innerRadius * Math.sin(angle);
                const y2 = center - innerRadius * Math.cos(angle);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x1); line.setAttribute("y1", y1); line.setAttribute("x2", x2); line.setAttribute("y2", y2);
                line.setAttribute("class", isMajor ? "tick tick-major" : "tick");
                ticksGroup.appendChild(line);
            }
        }
        function updateClock() {
            const now = new Date();
            const ms = now.getMilliseconds();
            const s = now.getSeconds();
            const m = now.getMinutes();
            const h = now.getHours();
            secondHand.style.transform = `rotate(${((s / 60) * 360) + ((ms / 1000) * 6)}deg)`;
            minuteHand.style.transform = `rotate(${((m / 60) * 360) + ((s / 60) * 6)}deg)`;
            hourHand.style.transform = `rotate(${((h % 12) / 12 * 360) + ((m / 60) * 30)}deg)`;
            requestAnimationFrame(updateClock);
        }
        generateTicks(); requestAnimationFrame(updateClock);
    </script>

    <script type="text/babel">
        const Assistant = () => {
            const [open, setOpen] = React.useState(false);
            const [chat, setChat] = React.useState([{ role: 'ai', text: "DMG Assistant online. How can I help with New Media production?" }]);
            
            const askAI = async (val) => {
                setChat(prev => [...prev, { role: 'user', text: val }]);
                try {
                    const res = await fetch('https://createnotionproject-223535956454.us-central1.run.app/api/v1/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: val, context: { page: "Notion Clock", url: window.location.href } })
                    });
                    const data = await res.json();
                    setChat(prev => [...prev, { role: 'ai', text: data.response }]);
                } catch (e) {
                    setChat(prev => [...prev, { role: 'ai', text: "Connection error. Make sure Cloud Run is updated." }]);
                }
            };

            return (
                <React.Fragment>
                    <div id="ai-trigger" onClick={() => setOpen(true)}>
                        <div className="ai-dot-grid"><span></span><span></span><span></span><span></span></div>
                    </div>
                    <div id="ai-sidebar" className={open ? 'open' : ''}>
                        <div style={{padding:'24px', borderBottom:'1px solid #EEE', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                            <span style={{fontSize:'10px', fontWeight:900, color:'#21A0D8', letterSpacing:'0.1em'}}>DMG NEW MEDIA ASSISTANT</span>
                            <button onClick={() => setOpen(false)} style={{border:'none', background:'none', cursor:'pointer', fontSize:'18px'}}>✕</button>
                        </div>
                        <div style={{flex:1, padding:'24px', overflowY:'auto', background:'#F9FAFB'}}>
                            {chat.map((m,i) => <div key={i} style={{marginBottom:'12px', padding:'14px', borderRadius:'14px', background: m.role==='ai'?'white':'#21A0D8', color:m.role==='ai'?'#1C1C1C':'#FFF', fontSize:'13px', border: m.role==='ai'?'1px solid #EEE':'none', boxShadow:'0 2px 5px rgba(0,0,0,0.02)'}} dangerouslySetInnerHTML={{__html: m.text}}></div>)}
                        </div>
                        <div style={{padding:'20px', borderTop:'1px solid #EEE'}}>
                            <input type="text" placeholder="Check status, nudge leads..." style={{width:'100%', padding:'12px', borderRadius:'8px', border:'2px solid #EEE', outline:'none'}} onKeyDown={e => { if(e.key==='Enter'){ askAI(e.target.value); e.target.value=''; }}} />
                        </div>
                    </div>
                </React.Fragment>
            );
        };
        ReactDOM.createRoot(document.getElementById('dmg-ai-root')).render(<Assistant />);
    </script>
</body>
</html>
