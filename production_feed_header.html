<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Feed Header</title>
    <style>
        /* Core Layout */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            height: auto; 
            background-color: transparent; 
            font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            padding-top: 2px;
            padding-bottom: 2px;
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 0.5rem; 
            white-space: nowrap;
        }

        /* Text Styling */
        .title-text {
            font-size: 1.5rem; 
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.04em;
            line-height: 1;
            opacity: 0;
            transform: translateY(5px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: uppercase;
        }

        .text-left { animation-delay: 0.1s; }
        .text-right { animation-delay: 0.3s; }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px; 
            width: 18px; 
            height: 18px; 
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #43B049; /* PRODUCTION GREEN */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        
        /* Ultra-Small Screens */
        @media (max-width: 300px) {
            .title-text { font-size: 1.2rem; }
            .header-container { gap: 0.4rem; }
            .dots-grid { width: 14px; height: 14px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-text text-left">PRODUCTION</div>
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="title-text text-right">FEED</div>
    </div>

</body>
</html>
