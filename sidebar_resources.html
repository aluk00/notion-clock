<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Resources</title>
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --text-main: #1A1A1A;
            --text-sub: #6B6B6B;
            --bg-hover: rgba(33, 160, 216, 0.06);
            --border-soft: #EAEAEA;
        }

        /* Core Layout - Fixed, non-scrollable */
        body {
            margin: 0;
            padding: 20px 15px;
            background-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: var(--text-main);
            height: auto;
        }

        /* HEADER STYLES */
        .header-container { 
            display: flex;
            align-items: center;
            gap: 0.8rem; 
            margin-bottom: 25px;
        }
        
        .title-text {
            font-size: 1.6rem;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.04em;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: uppercase;
        }
        .text-left { animation-delay: 0.1s; }
        .text-right { animation-delay: 0.3s; }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px; 
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .dot {
            width: 100%;
            height: 100%;
            background-color: var(--dmg-blue);
            border-radius: 50%;
            transform: scale(0); 
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* LIST STYLES */
        .resource-section {
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.5s forwards;
        }

        .section-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            padding-left: 12px;
            display: block;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-item {
            text-decoration: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            color: var(--dmg-blue);
            background-color: var(--bg-hover);
            transform: translateX(4px);
        }

        .external-icon {
            font-size: 10px;
            opacity: 0.4;
            margin-left: auto;
        }

        /* Animations */
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-text text-left">THE</div>
        <div class="dots-grid">
            <div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div>
        </div>
        <div class="title-text text-right">RESOURCES</div>
    </div>

    <!-- MAIN GUIDES -->
    <div class="resource-section">
        <span class="section-label">Hubs & Training</span>
        <nav class="nav-list">
            <a href="#" class="nav-item" target="_top">How to use DMG Notion</a>
            <a href="#" class="nav-item" target="_top">Freelancer Hub</a>
            <a href="#" class="nav-item" target="_top">New Starter Hub</a>
            <a href="#" class="nav-item" target="_top">The Toolbox</a>
        </nav>
    </div>

    <!-- OPERATIONAL -->
    <div class="resource-section">
        <span class="section-label">Operations</span>
        <nav class="nav-list">
            <a href="#" class="nav-item" target="_top">Production Request Form</a>
            <a href="#" class="nav-item" target="_top">Expenses & Travel</a>
        </nav>
    </div>

    <!-- EXTERNAL TOOLS -->
    <div class="resource-section">
        <span class="section-label">External Systems</span>
        <nav class="nav-list">
            <a href="#" class="nav-item" target="_blank">Airtable <span class="external-icon">↗</span></a>
            <a href="#" class="nav-item" target="_blank">Workday <span class="external-icon">↗</span></a>
            <a href="#" class="nav-item" target="_blank">IT & Support <span class="external-icon">↗</span></a>
        </nav>
    </div>

</body>
</html>
