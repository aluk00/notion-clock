<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Links | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Stealth / Industrial Palette */
            --tool-bg: #111111;
            --tool-item-bg: rgba(255, 255, 255, 0.03);
            --tool-border: rgba(255, 255, 255, 0.08);
            
            /* Team Palette */
            --editorial: #E94B4B;
            --creative: #E6468B;
            --production: #43B049;
            --design: #F2C316;
            --ops: #21A0D8;
            
            --text-main: #FFFFFF;
            --text-sub: #888888;

            /* Stacked Scale (Compact Vertical Profile) */
            --font-size: 9.5px;
            --icon-size: 13px;
            --dot-size: 12px;
            --strip-width: 170px;
        }

        body {
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: flex-start; /* Left Aligned */
            align-items: flex-start;
            min-height: 100vh;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- KINETIC COLOR CYCLE ANIMATIONS --- */
        @keyframes cycleText {
            0%, 100% { color: var(--editorial); }
            20% { color: var(--creative); }
            40% { color: var(--production); }
            60% { color: var(--design); }
            80% { color: var(--ops); }
        }

        @keyframes cycleBg {
            0%, 100% { background-color: var(--editorial); }
            20% { background-color: var(--creative); }
            40% { background-color: var(--production); }
            60% { background-color: var(--design); }
            80% { background-color: var(--ops); }
        }

        /* The Command Strip (Vertical Container) - SHADOW REMOVED */
        .command-strip {
            display: flex;
            flex-direction: column;
            width: var(--strip-width);
            background: var(--tool-bg);
            border: 1px solid var(--tool-border);
            padding: 6px;
            border-radius: 18px;
            gap: 6px;
            box-shadow: none; /* Removed the shadow */
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Header Label */
        .utility-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--tool-border);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: var(--dot-size);
            height: var(--dot-size);
        }

        .dot {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: cycleBg 8s infinite linear, pulse 3s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.5s, 0s; }
        .dot:nth-child(4) { animation-delay: 1s, 0s; }
        .dot:nth-child(3) { animation-delay: 1.5s, 0s; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .label-text {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            animation: cycleText 8s infinite linear;
        }

        /* Button Structure */
        .nav-tab {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            color: var(--text-sub);
            font-size: var(--font-size);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--tool-item-bg);
            border: 1px solid var(--tool-border);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .tab-icon {
            width: var(--icon-size);
            height: var(--icon-size);
            stroke-width: 2.5;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            opacity: 0.6;
        }

        /* --- HOVER STATES: SHADOWS REMOVED --- */
        .nav-tab:hover {
            color: #FFFFFF !important;
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
            box-shadow: none; /* Ensure no shadow on generic hover */
        }

        .nav-tab:hover .tab-icon {
            transform: scale(1.15);
            opacity: 1;
        }

        /* Individual Hover Overrides - All box-shadows set to none */
        .tab-editorial:hover { border-color: var(--editorial); color: var(--editorial) !important; box-shadow: none; }
        .tab-editorial:hover .tab-icon { color: var(--editorial); }

        .tab-design:hover { border-color: var(--design); color: var(--design) !important; box-shadow: none; }
        .tab-design:hover .tab-icon { color: var(--design); }

        .tab-production:hover { border-color: var(--production); color: var(--production) !important; box-shadow: none; }
        .tab-production:hover .tab-icon { color: var(--production); }

        .tab-hub:hover { border-color: var(--ops); color: var(--ops) !important; box-shadow: none; }
        .tab-hub:hover .tab-icon { color: var(--ops); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="command-strip">
        <!-- Unified Header -->
        <div class="utility-header">
            <span class="label-text">Quick Links</span>
            <div class="dots-grid">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        
        <!-- Daily Rundown -->
        <a href="daily-rundown.html" class="nav-tab tab-editorial" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
            </svg>
            Daily Rundown
        </a>

        <!-- Editorial Calendar -->
        <a href="social-command-centre.html" class="nav-tab tab-editorial" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            Editorial Cal
        </a>

        <!-- Request Graphics -->
        <a href="design-request-form.html" class="nav-tab tab-design" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19l7-7 3 3-7 7-3-3z" /><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" /><path d="m2 2 20 20" />
            </svg>
            Graphics Req
        </a>

        <!-- Shoot Calendar -->
        <a href="shoot-calendar.html" class="nav-tab tab-production" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" />
            </svg>
            Shoot Cal
        </a>

        <!-- Hub Master -->
        <a href="project-hub.html" class="nav-tab tab-hub" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" />
            </svg>
            Hub Master
        </a>
    </div>

</body>
</html>
