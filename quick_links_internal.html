<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Links | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Stealth / Industrial Palette */
            --tool-bg: #111111;
            --tool-grey: #2a2a2a;
            
            /* Team Palette */
            --editorial: #E94B4B;
            --creative: #E6468B;
            --production: #43B049;
            --design: #F2C316;
            --ops: #21A0D8;
            
            --text-main: #FFFFFF;
            --text-sub: #A0A0A0;
            --border: rgba(255,255,255,0.1);

            --font-size: 9.5px;
            --icon-size: 12px;
            --dot-size: 13px;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start; /* Left Aligned */
            align-items: center;
            height: 60px;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            padding-left: 20px;
        }

        /* The Deck */
        .nav-deck {
            display: flex;
            align-items: center;
            background: var(--tool-bg);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 14px;
            gap: 2px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* --- KINETIC COLOR CYCLE ANIMATIONS --- */
        @keyframes cycleText {
            0%, 100% { color: var(--editorial); }
            20% { color: var(--creative); }
            40% { color: var(--production); }
            60% { color: var(--design); }
            80% { color: var(--ops); }
        }

        @keyframes cycleBg {
            0%, 100% { background-color: var(--editorial); box-shadow: 0 0 8px var(--editorial); }
            20% { background-color: var(--creative); box-shadow: 0 0 8px var(--creative); }
            40% { background-color: var(--production); box-shadow: 0 0 8px var(--production); }
            60% { background-color: var(--design); box-shadow: 0 0 8px var(--design); }
            80% { background-color: var(--ops); box-shadow: 0 0 8px var(--ops); }
        }

        /* Label Section */
        .utility-label {
            padding: 0 10px 0 8px;
            border-right: 1px solid var(--border);
            margin-right: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: var(--dot-size);
            height: var(--dot-size);
        }

        .dot {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: cycleBg 8s infinite linear, pulse 3s infinite ease-in-out;
        }
        /* Staggered pulse but unified color cycle */
        .dot:nth-child(2) { animation-delay: 0.5s, 0s; }
        .dot:nth-child(4) { animation-delay: 1s, 0s; }
        .dot:nth-child(3) { animation-delay: 1.5s, 0s; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .label-text {
            font-size: 8.5px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            white-space: nowrap;
            animation: cycleText 8s infinite linear;
        }

        /* Tab Base Styling */
        .nav-tab {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border-radius: 10px;
            color: var(--text-sub);
            font-size: var(--font-size);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            white-space: nowrap;
        }

        .tab-icon {
            width: var(--icon-size);
            height: var(--icon-size);
            stroke-width: 2.5;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        /* --- PRIMARY ACTION: EDITORIAL RED --- */
        .tab-primary {
            background: rgba(233, 75, 75, 0.1);
            border: 1px solid rgba(233, 75, 75, 0.2);
            color: var(--editorial) !important;
            margin-right: 4px;
        }

        .tab-primary:hover {
            background: var(--editorial);
            color: #FFFFFF !important;
            transform: translateY(-1.5px);
            box-shadow: 0 4px 15px rgba(233, 75, 75, 0.4);
        }

        .tab-primary .tab-icon { color: var(--editorial); }
        .tab-primary:hover .tab-icon { color: #FFFFFF; }

        /* --- UTILITY TABS --- */
        .nav-tab:not(.tab-primary):hover {
            color: #FFFFFF;
            background: var(--tool-grey);
            transform: translateY(-1px);
        }

        .nav-tab:not(.tab-primary):hover .tab-icon {
            transform: scale(1.1);
        }

        /* Sub-tab indicators */
        .nav-tab:not(.tab-primary)::before {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            width: 0;
            height: 2px;
            border-radius: 10px;
            background: #FFFFFF;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
            opacity: 0;
        }

        .nav-tab:not(.tab-primary):hover::before {
            width: 8px;
            opacity: 1;
        }

        /* Team Hover Overrides */
        .tab-editorial:hover { color: var(--editorial) !important; }
        .tab-editorial:hover::before { background: var(--editorial) !important; }
        
        .tab-design:hover { color: var(--design) !important; }
        .tab-design:hover::before { background: var(--design) !important; }
        
        .tab-production:hover { color: var(--production) !important; }
        .tab-production:hover::before { background: var(--production) !important; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 600px) {
            .utility-label { display: none; }
            .nav-tab { padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <div class="nav-deck">
        <!-- Cycling Branding Section -->
        <div class="utility-label">
            <div class="dots-grid">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <span class="label-text">Tools</span>
        </div>
        
        <!-- Primary Action: Editorial Red -->
        <a href="daily-rundown.html" class="nav-tab tab-primary" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
            </svg>
            Daily Rundown
        </a>

        <!-- Action Items -->
        <a href="social-command-centre.html" class="nav-tab tab-editorial" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            Editorial Cal
        </a>

        <a href="design-request-form.html" class="nav-tab tab-design" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19l7-7 3 3-7 7-3-3z" /><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" /><path d="m2 2 20 20" />
            </svg>
            Request Graphics
        </a>

        <a href="shoot-calendar.html" class="nav-tab tab-production" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" />
            </svg>
            Shoot Cal
        </a>

        <a href="project-hub.html" class="nav-tab" target="_top">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" />
            </svg>
            Hub
        </a>
    </div>

</body>
</html>
