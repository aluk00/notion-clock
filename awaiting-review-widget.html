<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awaiting Review | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue: #21a0d8; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; --warning: #F59E0B; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 500px; overflow: hidden; }
        .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; }
        .dot-grid span { width: 5px; height: 5px; border-radius: 50%; background: var(--warning); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 13px; font-weight: 800; }
        .count { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #FEF3C7; color: #B45309; margin-left: auto; }
        .list { max-height: 300px; overflow-y: auto; }
        .item { padding: 14px 20px; border-bottom: 1px solid #F5F5F5; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.15s; }
        .item:hover { background: var(--bg-soft); }
        .item:last-child { border-bottom: none; }
        .item-icon { width: 36px; height: 36px; border-radius: 10px; background: #FEF3C7; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .item-info { flex: 1; min-width: 0; }
        .item-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-sub { font-size: 11px; color: var(--ink-sub); }
        .item-time { font-size: 10px; color: var(--ink-sub); }
        .empty { padding: 50px 20px; text-align: center; }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 50px; color: var(--ink-sub); font-size: 12px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--warning); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "dmg-command-centre-native";
        let items = [];
        const root = document.getElementById('root');

        function timeAgo(date) {
            if (!date) return '';
            const d = date.toDate ? date.toDate() : new Date(date);
            const diff = Math.floor((Date.now() - d.getTime()) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff/60) + 'm ago';
            if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
            return Math.floor(diff/86400) + 'd ago';
        }

        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="title">Awaiting Review</h2>
                        <span class="count">${items.length} pending</span>
                    </div>
                    ${items.length === 0 ? `
                        <div class="empty">
                            <div class="empty-icon">✅</div>
                            <div class="empty-title">All Clear</div>
                            <div class="empty-sub">No items waiting for review. Add items to the review_queue collection.</div>
                        </div>
                    ` : `
                        <div class="list">
                            ${items.map(function(item) {
                                return `
                                    <div class="item" onclick="window.open('${item.url || '#'}', '_blank')">
                                        <div class="item-icon">📝</div>
                                        <div class="item-info">
                                            <div class="item-title">${item.title || 'Untitled'}</div>
                                            <div class="item-sub">${item.type || 'Review'} • ${item.submittedBy || 'Unknown'}</div>
                                        </div>
                                        <div class="item-time">${timeAgo(item.submittedAt)}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function loadData() {
            root.innerHTML = '<div class="widget"><div class="loading"><div class="spinner"></div>Loading...</div></div>';
            
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('review_queue')
                .onSnapshot(function(snapshot) {
                    items = [];
                    snapshot.forEach(function(doc) {
                        items.push(Object.assign({ id: doc.id }, doc.data()));
                    });
                    items.sort(function(a, b) {
                        var aTime = a.submittedAt && a.submittedAt.toDate ? a.submittedAt.toDate() : new Date(0);
                        var bTime = b.submittedAt && b.submittedAt.toDate ? b.submittedAt.toDate() : new Date(0);
                        return bTime - aTime;
                    });
                    render();
                }, function(error) {
                    console.error('Firestore error:', error);
                    items = [];
                    render();
                });
        }

        auth.signInAnonymously().then(function() {
            loadData();
        }).catch(function(error) {
            console.error('Auth error:', error);
            items = [];
            render();
        });
    </script>
</body>
</html>
