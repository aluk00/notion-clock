<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awaiting Review | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --production: #43B049;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --success: #10B981;
            --warning: #F59E0B;
            --urgent: #EF4444;
            --blue: #3B82F6;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; }
        
        .widget { background: #FFF; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
        
        .header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 16px; height: 16px; }
        .dot { width: 100%; height: 100%; background: var(--production); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 12px; font-weight: 900; color: var(--ink); text-transform: uppercase; }
        
        .body { padding: 12px; }
        
        .review-list { display: flex; flex-direction: column; gap: 8px; }
        
        .review-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-soft); border-radius: 10px; border-left: 3px solid var(--border); }
        .review-item.high { border-left-color: var(--urgent); }
        .review-item.medium { border-left-color: var(--warning); }
        .review-item.low { border-left-color: var(--success); }
        
        .review-info { flex: 1; min-width: 0; }
        .review-title { font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .review-meta { font-size: 10px; color: var(--ink-sub); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
        .review-type { padding: 2px 6px; background: #FFF; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
        
        .review-time { text-align: right; flex-shrink: 0; }
        .time-value { font-size: 14px; font-weight: 900; color: var(--ink); }
        .time-label { font-size: 9px; color: var(--ink-sub); }
        .time-value.overdue { color: var(--urgent); }
        
        .review-btn { padding: 6px 12px; background: var(--production); color: #FFF; border: none; border-radius: 6px; font-size: 9px; font-weight: 800; text-transform: uppercase; cursor: pointer; font-family: inherit; flex-shrink: 0; }
        .review-btn:hover { filter: brightness(1.1); }
        
        .empty { padding: 30px; text-align: center; color: var(--ink-sub); font-size: 11px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const APP_ID = 'dmg-command-centre-native';
        const basePath = `artifacts/${APP_ID}/public/data`;
        
        // Demo review queue
        const DEMO_QUEUE = [
            { title: 'Sky Vegas Street Talk', type: 'Video', priority: 'high', submittedAt: new Date(Date.now() - 10 * 60 * 60 * 1000).toISOString(), client: 'Sky' },
            { title: 'JAECOO Thumbnail Pack', type: 'Graphics', priority: 'high', submittedAt: new Date(Date.now() - 6 * 60 * 60 * 1000).toISOString(), client: 'JAECOO' },
            { title: 'Wuthering Heights Promo', type: 'Video', priority: 'medium', submittedAt: new Date(Date.now() - 3 * 60 * 60 * 1000).toISOString(), client: 'Studio Canal' },
            { title: 'Q1 Media Plan', type: 'Document', priority: 'low', submittedAt: new Date(Date.now() - 1 * 60 * 60 * 1000).toISOString(), client: 'Internal' },
        ];
        
        function App() {
            const [queue, setQueue] = useState([]);
            
            useEffect(() => {
                const unsub = db.collection(basePath).doc('review_queue').collection('items')
                    .where('status', '==', 'pending_review')
                    .onSnapshot(snap => {
                        if (snap.empty) {
                            setQueue(DEMO_QUEUE);
                        } else {
                            setQueue(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }
                    }, err => {
                        console.log('Using demo queue:', err.message);
                        setQueue(DEMO_QUEUE);
                    });
                return () => unsub();
            }, []);
            
            const getWaitingTime = (submittedAt) => {
                const hours = Math.floor((Date.now() - new Date(submittedAt).getTime()) / (1000 * 60 * 60));
                return { hours, isOverdue: hours > 8 };
            };
            
            const handleReview = (item) => {
                window.parent.postMessage({ type: 'OPEN_REVIEW', item }, '*');
            };
            
            return (
                <div className="widget">
                    <div className="header">
                        <div className="dots">
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                        </div>
                        <span className="title">Awaiting Review</span>
                    </div>
                    
                    <div className="body">
                        {queue.length > 0 ? (
                            <div className="review-list">
                                {queue.map((item, idx) => {
                                    const wait = getWaitingTime(item.submittedAt);
                                    return (
                                        <div key={item.id || idx} className={`review-item ${item.priority}`}>
                                            <div className="review-info">
                                                <div className="review-title">{item.title}</div>
                                                <div className="review-meta">
                                                    <span className="review-type">{item.type}</span>
                                                    <span>{item.client}</span>
                                                </div>
                                            </div>
                                            <div className="review-time">
                                                <div className={`time-value ${wait.isOverdue ? 'overdue' : ''}`}>
                                                    {wait.hours}h
                                                </div>
                                                <div className="time-label">{wait.isOverdue ? 'overdue' : 'waiting'}</div>
                                            </div>
                                            <button className="review-btn" onClick={() => handleReview(item)}>
                                                Review
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <div className="empty">No items awaiting review</div>
                        )}
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
