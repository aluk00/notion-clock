<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awaiting Review | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue: #21a0d8; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; --warning: #F59E0B; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 500px; overflow: hidden; }
        .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; }
        .dot-grid span { width: 5px; height: 5px; border-radius: 50%; background: var(--warning); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 13px; font-weight: 800; }
        .count { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #FEF3C7; color: #B45309; margin-left: auto; }
        .list { max-height: 300px; overflow-y: auto; }
        .item { padding: 14px 20px; border-bottom: 1px solid #F5F5F5; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.15s; }
        .item:hover { background: var(--bg-soft); }
        .item:last-child { border-bottom: none; }
        .item-icon { width: 36px; height: 36px; border-radius: 10px; background: #FEF3C7; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .item-info { flex: 1; min-width: 0; }
        .item-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-sub { font-size: 11px; color: var(--ink-sub); }
        .item-time { font-size: 10px; color: var(--ink-sub); }
        .empty { padding: 50px 20px; text-align: center; }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 50px; color: var(--ink-sub); font-size: 12px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--warning); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const API_URL = 'https://us-central1-dmg-command-centre-native.cloudfunctions.net/api';

        let items = [];
        const root = document.getElementById('root');

        // Review statuses that indicate awaiting review
        const reviewStatuses = ['Stakeholder Review', 'Internal Review', 'Feedback / Revisions'];

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const now = new Date();
            const diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
            if (diff < 0) return `${Math.abs(diff)}d overdue`;
            if (diff === 0) return 'Today';
            if (diff === 1) return 'Tomorrow';
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        }

        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="title">Awaiting Review</h2>
                        <span class="count">${items.length} pending</span>
                    </div>
                    ${items.length === 0 ? `
                        <div class="empty">
                            <div class="empty-icon">✅</div>
                            <div class="empty-title">All Clear</div>
                            <div class="empty-sub">No projects or deliverables awaiting review.</div>
                        </div>
                    ` : `
                        <div class="list">
                            ${items.map(function(item) {
                                return `
                                    <div class="item" onclick="window.open('${item.url || '#'}', '_blank')">
                                        <div class="item-icon">📝</div>
                                        <div class="item-info">
                                            <div class="item-title">${item.title || 'Untitled'}</div>
                                            <div class="item-sub">${item.type || 'Review'} • ${item.status || 'Pending'}</div>
                                        </div>
                                        <div class="item-time">${formatDate(item.dueDate)}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        async function loadData() {
            root.innerHTML = '<div class="widget"><div class="loading"><div class="spinner"></div>Loading...</div></div>';

            try {
                // Fetch projects in review status
                const projectsRes = await fetch(`${API_URL}/projects`);
                const projectsData = await projectsRes.json();
                const projects = projectsData?.projects || [];

                // Filter for projects awaiting review in any workflow
                const reviewProjects = projects.filter(p =>
                    reviewStatuses.includes(p.creativeWorkflowStatus) ||
                    reviewStatuses.includes(p.productionWorkflowStatus) ||
                    reviewStatuses.includes(p.socialWorkflowStatus)
                ).map(p => ({
                    id: p.id,
                    title: p.title,
                    url: p.url,
                    type: 'Project',
                    status: p.creativeWorkflowStatus || p.productionWorkflowStatus || p.socialWorkflowStatus,
                    dueDate: p.dueDate || p.clientDueDate
                }));

                // Fetch deliverables in review status
                const deliverablesRes = await fetch(`${API_URL}/deliverables`);
                const deliverablesData = await deliverablesRes.json();
                const deliverables = deliverablesData?.deliverables || [];

                const reviewDeliverables = deliverables.filter(d =>
                    reviewStatuses.includes(d.status) ||
                    reviewStatuses.includes(d.deskState)
                ).map(d => ({
                    id: d.id,
                    title: d.title,
                    url: d.url,
                    type: 'Deliverable',
                    status: d.status || d.deskState,
                    dueDate: d.dueDate
                }));

                items = [...reviewProjects, ...reviewDeliverables];

                // Sort by due date
                items.sort((a, b) => {
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                });

                render();
            } catch (error) {
                console.error('Load failed:', error);
                items = [];
                render();
            }
        }

        // Load data on page load
        loadData();

        // Auto-refresh every 2 minutes
        setInterval(loadData, 120000);
    </script>
</body>
</html>
