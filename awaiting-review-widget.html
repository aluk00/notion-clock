<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awaiting Review | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --production: #43B049;
            --warning: #F59E0B;
            --urgent: #EF4444;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; }
        
        .widget { background: #FFF; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
        
        .widget-header { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 14px 16px; border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 14px; height: 14px; }
        .dot { width: 100%; height: 100%; background: var(--warning); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 11px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: 0.03em; }
        
        .count-badge { 
            padding: 4px 10px; border-radius: 20px; background: #FEF3C7;
            font-size: 10px; font-weight: 800; color: var(--warning);
        }
        .count-badge.urgent { background: #FEE2E2; color: var(--urgent); }
        
        .items-list { max-height: 300px; overflow-y: auto; }
        
        .review-item { 
            display: flex; align-items: center; gap: 12px; 
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            transition: background 0.2s; cursor: pointer;
        }
        .review-item:last-child { border-bottom: none; }
        .review-item:hover { background: var(--bg-soft); }
        
        .item-priority { 
            width: 4px; height: 32px; border-radius: 2px; flex-shrink: 0;
        }
        .item-priority.high { background: var(--urgent); }
        .item-priority.medium { background: var(--warning); }
        .item-priority.low { background: var(--production); }
        
        .item-info { flex: 1; min-width: 0; }
        .item-title { font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-meta { font-size: 10px; color: var(--ink-sub); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
        
        .item-type { 
            padding: 2px 6px; border-radius: 4px; background: var(--bg-soft);
            font-size: 8px; font-weight: 800; color: var(--ink-sub); text-transform: uppercase;
        }
        
        .item-waiting { 
            font-size: 9px; font-weight: 700; color: var(--ink-sub);
            display: flex; align-items: center; gap: 4px;
        }
        .item-waiting.overdue { color: var(--urgent); }
        
        .action-btn {
            padding: 6px 12px; border-radius: 6px; border: none;
            background: var(--production); color: #FFF;
            font-size: 9px; font-weight: 800; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .action-btn:hover { filter: brightness(1.1); }
        
        .empty-state { 
            padding: 40px 20px; text-align: center; 
        }
        .empty-icon { font-size: 32px; margin-bottom: 8px; }
        .empty-text { font-size: 11px; color: var(--ink-sub); }
        
        .footer { 
            padding: 10px 16px; border-top: 1px solid var(--border); 
            background: var(--bg-soft); text-align: center;
        }
        .view-all { 
            font-size: 10px; font-weight: 700; color: var(--production);
            cursor: pointer; text-decoration: none;
        }
        .view-all:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const appId = 'dmg-command-centre-native';
        const basePath = `artifacts/${appId}/public/data`;
        
        const getWaitingTime = (date) => {
            if (!date) return { text: 'Unknown', isOverdue: false };
            const submitted = new Date(date);
            const now = new Date();
            const hours = Math.floor((now - submitted) / (1000 * 60 * 60));
            
            if (hours < 1) return { text: 'Just now', isOverdue: false };
            if (hours < 24) return { text: `${hours}h ago`, isOverdue: hours > 8 };
            const days = Math.floor(hours / 24);
            return { text: `${days}d ago`, isOverdue: days > 1 };
        };
        
        // Demo data
        const DEMO_ITEMS = [
            { id: '1', title: 'Sky Vegas Campaign Deck', type: 'Deliverable', priority: 'high', submittedAt: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString(), submittedBy: 'Nick B' },
            { id: '2', title: 'JAECOO Hero Video Edit', type: 'Video', priority: 'high', submittedAt: new Date(Date.now() - 10 * 60 * 60 * 1000).toISOString(), submittedBy: 'Hugo' },
            { id: '3', title: 'Wuthering Heights Social Pack', type: 'Graphics', priority: 'medium', submittedAt: new Date(Date.now() - 4 * 60 * 60 * 1000).toISOString(), submittedBy: 'Isobel' },
            { id: '4', title: 'Q1 Media Plan Document', type: 'Document', priority: 'low', submittedAt: new Date(Date.now() - 1 * 60 * 60 * 1000).toISOString(), submittedBy: 'Ana' },
        ];
        
        function App() {
            const [items, setItems] = useState(DEMO_ITEMS);
            
            useEffect(() => {
                // Try to load from Firestore
                const unsub = db.collection(basePath).doc('review_queue').collection('review_queue')
                    .where('status', '==', 'pending_review')
                    .orderBy('submittedAt', 'desc')
                    .limit(10)
                    .onSnapshot(snap => {
                        if (!snap.empty) {
                            setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }
                    }, () => {});
                
                return () => unsub?.();
            }, []);
            
            const handleReview = (item) => {
                window.parent?.postMessage({ type: 'OPEN_REVIEW', itemId: item.id }, '*');
            };
            
            const handleViewAll = () => {
                window.parent?.postMessage({ type: 'VIEW_ALL_REVIEWS' }, '*');
            };
            
            const urgentCount = items.filter(i => i.priority === 'high').length;
            
            return (
                <div className="widget">
                    <div className="widget-header">
                        <div className="header-left">
                            <div className="dots">
                                <div className="dot"></div>
                                <div className="dot"></div>
                                <div className="dot"></div>
                                <div className="dot"></div>
                            </div>
                            <span className="title">Awaiting Review</span>
                        </div>
                        <div className={`count-badge ${urgentCount > 0 ? 'urgent' : ''}`}>
                            {items.length} items
                        </div>
                    </div>
                    
                    {items.length > 0 ? (
                        <>
                            <div className="items-list">
                                {items.map(item => {
                                    const waiting = getWaitingTime(item.submittedAt);
                                    return (
                                        <div key={item.id} className="review-item" onClick={() => handleReview(item)}>
                                            <div className={`item-priority ${item.priority}`}></div>
                                            <div className="item-info">
                                                <div className="item-title">{item.title}</div>
                                                <div className="item-meta">
                                                    <span className="item-type">{item.type}</span>
                                                    <span>by {item.submittedBy}</span>
                                                </div>
                                            </div>
                                            <div className={`item-waiting ${waiting.isOverdue ? 'overdue' : ''}`}>
                                                {waiting.isOverdue && '⚠️ '}
                                                {waiting.text}
                                            </div>
                                            <button className="action-btn">Review</button>
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="footer">
                                <a className="view-all" onClick={handleViewAll}>View All Pending Reviews →</a>
                            </div>
                        </>
                    ) : (
                        <div className="empty-state">
                            <div className="empty-icon">✅</div>
                            <div className="empty-text">All caught up! Nothing awaiting review.</div>
                        </div>
                    )}
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
