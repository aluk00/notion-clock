<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotlight TikTok Profile</title>
    <style>
        body { margin: 0; padding: 0; background-color: transparent; width: 100%; box-sizing: border-box; display: flex; justify-content: center; }
        .tiktok-embed-wrapper { width: 1000px; max-width: 100%; padding: 10px 20px; box-sizing: border-box; }
        .tiktok-embed { width: 100% !important; min-width: 100% !important; max-width: none !important; }
    </style>
</head>
<body>
    <div class="tiktok-embed-wrapper">
        <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@itsthespotlight" data-unique-id="itsthespotlight" data-embed-type="creator" > 
            <section> <a target="_blank" href="https://www.tiktok.com/@itsthespotlight?refer=creator_embed">@itsthespotlight</a> </section> 
        </blockquote> 
    </div>
    <script async src="https://www.tiktok.com/embed.js"></script>
</body>
</html>
