<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8"><title>Log Shoot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-gray-50">
    <div class="max-w-lg mx-auto bg-white p-8 rounded-3xl border shadow-sm">
        <h2 class="text-2xl font-black mb-6 uppercase">Log Shoot</h2>
        <form id="shootForm" class="space-y-4">
            <input type="text" id="title" placeholder="Shoot Title / Project" class="w-full p-4 border rounded-xl" required>
            <input type="date" id="date" class="w-full p-4 border rounded-xl" required>
            <div class="grid grid-cols-2 gap-4">
                <input type="time" id="start" class="p-4 border rounded-xl" required>
                <input type="time" id="end" class="p-4 border rounded-xl" required>
            </div>
            <input type="text" id="loc" placeholder="Location" class="w-full p-4 border rounded-xl">
            <button type="submit" class="w-full bg-green-900 text-white p-5 rounded-2xl font-black uppercase">Sync to Calendar</button>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = { apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY", authDomain: "dmg-command-centre-native.firebaseapp.com", projectId: "dmg-command-centre-native", storageBucket: "dmg-command-centre-native.firebasestorage.app", messagingSenderId: "223535956454", appId: "1:223535956454:web:b25e5bc69d8a4a7f209627" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('shootForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            title: document.getElementById('title').value,
            startDateTime: `${document.getElementById('date').value}T${document.getElementById('start').value}`,
            endDateTime: `${document.getElementById('date').value}T${document.getElementById('end').value}`,
            location: document.getElementById('loc').value,
            createdAt: serverTimestamp()
        };
        await addDoc(collection(db, "artifacts", "dmg-command-centre-native", "public", "data", "shoot_calendar_events"), data);
        alert('Shoot Logged!');
        location.reload();
    };
</script>
</body>
</html>
