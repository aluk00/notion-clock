<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Reminders</title>
    <style>
        /* Core Styles */
        body {
            margin: 0;
            padding: 10px; /* Reduced padding for sidebar fit */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* --- CONTAINER CARD --- */
        .widget-card {
            background: #ffffff;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #f0f0f0;
        }

        /* --- INPUT AREA --- */
        .input-area {
            padding: 15px;
            background-color: #fcfcfc;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto; /* Allow scrolling if adding many reminders */
            max-height: 50%; /* limit height so list is always visible */
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-bottom: -4px;
        }

        input, textarea, select {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #9C27B0;
        }

        #taskInput { font-weight: 600; }
        
        .date-time-group {
            display: flex;
            gap: 5px;
        }
        
        input[type="date"], input[type="time"] {
            color: #555;
        }

        #notesInput {
            resize: none;
            height: 50px;
        }

        /* Reminder Section */
        .reminder-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            padding: 5px 0;
            user-select: none;
        }
        .reminder-toggle:hover { color: #9C27B0; }

        .reminder-inputs-container {
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 6px;
            padding-left: 5px;
            border-left: 2px solid #eee;
        }

        .reminder-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .reminder-input { width: 50px; }
        .reminder-select { flex-grow: 1; }
        
        .remove-reminder-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        .remove-reminder-btn:hover { color: #d32f2f; }

        .add-more-btn {
            background: none;
            border: none;
            color: #9C27B0;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            padding: 0;
            margin-top: 4px;
        }

        /* Main Add Button */
        .add-btn {
            background-color: #9C27B0; 
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .add-btn:hover { background-color: #7B1FA2; }

        /* --- LIST AREA --- */
        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #aaa;
            font-size: 12px;
            font-style: italic;
        }

        .reminder-item {
            display: flex;
            flex-direction: column;
            padding: 12px 15px;
            border-bottom: 1px solid #f5f5f5;
            transition: all 0.2s;
            position: relative;
            background: #fff;
        }

        /* Urgent Style (Red) */
        .reminder-item.urgent {
            border-left: 4px solid #d32f2f;
            background-color: #fff5f5;
        }
        .reminder-item.urgent .task-title { color: #d32f2f; }
        .reminder-item.urgent .check-circle { border-color: #d32f2f; }

        .item-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .check-circle {
            width: 16px;
            height: 16px;
            border: 2px solid #ddd;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 3px;
            transition: all 0.2s;
        }
        .check-circle:hover { border-color: #9C27B0; }
        
        .task-content { flex-grow: 1; }

        .task-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
            line-height: 1.3;
        }

        .task-meta {
            font-size: 10px;
            color: #999;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-weight: 600;
            text-transform: uppercase;
            align-items: center;
        }

        .reminder-badge {
            color: #9C27B0;
            background: #f3e5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
        }

        .task-notes {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            background: rgba(0,0,0,0.03);
            padding: 6px 8px;
            border-radius: 4px;
            display: block;
            white-space: pre-wrap;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ddd;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .delete-btn:hover { color: #d32f2f; }

        .perm-btn {
            background: none; border: none; color: #9C27B0; text-decoration: underline; cursor: pointer; font-size: 10px; padding: 0;
        }

    </style>
</head>
<body>

    <div class="widget-card">
        
        <!-- Input Area -->
        <div class="input-area">
            <label>Title</label>
            <input type="text" id="taskInput" placeholder="Task Name..." autocomplete="off">
            
            <label>Due Date & Time</label>
            <div class="date-time-group">
                <input type="date" id="dateInput">
                <input type="time" id="timeInput">
            </div>

            <label>Notes</label>
            <textarea id="notesInput" placeholder="Details..."></textarea>

            <!-- Optional Reminders Toggle -->
            <div class="reminder-toggle" onclick="toggleReminders()">
                <span>🔔 Set Reminders (Optional)</span>
                <span id="toggleIcon">+</span>
            </div>

            <div id="reminderContainer" class="reminder-inputs-container">
                <div class="permission-notice" style="margin-bottom:5px;">
                    <button id="reqPermBtn" class="perm-btn" onclick="reqPermission()" style="display:none;">Enable Browser Alerts</button>
                </div>
                <!-- Rows injected via JS -->
                <button class="add-more-btn" onclick="addReminderRow()">+ Add another (Max 4)</button>
            </div>
            
            <button class="add-btn" onclick="addTask()">Add to List</button>
        </div>

        <!-- List Area -->
        <div id="reminderList" class="list-container"></div>

    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('my_personal_reminders_v2')) || [];
        
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const dateInput = document.getElementById('dateInput');
        const timeInput = document.getElementById('timeInput');
        const notesInput = document.getElementById('notesInput');
        const listContainer = document.getElementById('reminderList');
        const reminderContainer = document.getElementById('reminderContainer');
        const reqPermBtn = document.getElementById('reqPermBtn');

        // Check Notification Permission
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            reqPermBtn.style.display = 'inline-block';
        }

        function reqPermission() {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") reqPermBtn.style.display = 'none';
            });
        }

        // Toggle UI
        function toggleReminders() {
            const isHidden = reminderContainer.style.display === 'none' || reminderContainer.style.display === '';
            reminderContainer.style.display = isHidden ? 'flex' : 'none';
            document.getElementById('toggleIcon').textContent = isHidden ? '−' : '+';
            if(isHidden && document.querySelectorAll('.reminder-row').length === 0) {
                addReminderRow(); // Add first row if empty
            }
        }

        function addReminderRow() {
            const currentRows = document.querySelectorAll('.reminder-row').length;
            if (currentRows >= 4) return;

            const div = document.createElement('div');
            div.className = 'reminder-row';
            div.innerHTML = `
                <span>Remind me</span>
                <input type="number" class="reminder-input" placeholder="15" min="1">
                <select class="reminder-select">
                    <option value="minutes">minutes</option>
                    <option value="hours">hours</option>
                    <option value="days">days</option>
                </select>
                <span>before</span>
                <button class="remove-reminder-btn" onclick="this.parentElement.remove()">×</button>
            `;
            // Insert before the "Add more" button
            reminderContainer.insertBefore(div, reminderContainer.lastElementChild);
        }

        function addTask() {
            const title = taskInput.value.trim();
            if (!title) return;

            // Collect Reminders
            const remindersList = [];
            if (dateInput.value && timeInput.value) {
                const dueStr = `${dateInput.value}T${timeInput.value}`;
                const dueDate = new Date(dueStr);
                
                document.querySelectorAll('.reminder-row').forEach(row => {
                    const val = parseInt(row.querySelector('.reminder-input').value);
                    const unit = row.querySelector('.reminder-select').value;
                    if (!val) return;

                    const triggerDate = new Date(dueDate);
                    if (unit === 'minutes') triggerDate.setMinutes(triggerDate.getMinutes() - val);
                    if (unit === 'hours') triggerDate.setHours(triggerDate.getHours() - val);
                    if (unit === 'days') triggerDate.setDate(triggerDate.getDate() - val);

                    remindersList.push({
                        val: val,
                        unit: unit,
                        triggerTime: triggerDate.getTime(),
                        notified: false
                    });
                });
            }

            const newTask = {
                id: Date.now(),
                title: title,
                date: dateInput.value,
                time: timeInput.value,
                notes: notesInput.value.trim(),
                reminders: remindersList,
                createdAt: Date.now()
            };

            tasks.push(newTask);
            saveAndRender();
            clearInputs();
            
            if (remindersList.length > 0 && Notification.permission !== "granted") {
                reqPermission();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            tasks.sort((a, b) => {
                if (a.date && b.date) return new Date(a.date + ' ' + (a.time || '00:00')) - new Date(b.date + ' ' + (b.time || '00:00'));
                if (a.date && !b.date) return -1;
                if (!a.date && b.date) return 1;
                return b.createdAt - a.createdAt;
            });

            localStorage.setItem('my_personal_reminders_v2', JSON.stringify(tasks));
            renderList();
        }

        function renderList() {
            listContainer.innerHTML = '';
            if (tasks.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">No reminders set.</div>';
                return;
            }

            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];

            tasks.forEach(item => {
                // Determine Urgency (Red)
                let isUrgent = false;
                let dateDisplay = '';
                
                if (item.date) {
                    const dateObj = new Date(item.date);
                    dateDisplay = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                    
                    // Logic: If date is today or in the past, render RED
                    if (item.date <= todayStr) {
                        isUrgent = true;
                        if(item.date < todayStr) dateDisplay += " (Overdue)";
                        else dateDisplay = "Today";
                    }
                }

                let timeDisplay = item.time ? item.time : '';
                
                // Render Reminder Tags
                let badgeHtml = '';
                if (item.reminders && item.reminders.length > 0) {
                    const pendingCount = item.reminders.filter(r => !r.notified).length;
                    if(pendingCount > 0) badgeHtml = `<span class="reminder-badge">🔔 ${pendingCount} active alerts</span>`;
                }

                const html = `
                    <div class="reminder-item ${isUrgent ? 'urgent' : ''}">
                        <button class="delete-btn" onclick="deleteTask(${item.id})">×</button>
                        <div class="item-header">
                            <div class="check-circle" onclick="deleteTask(${item.id})"></div>
                            <div class="task-content">
                                <div class="task-title">${escapeHtml(item.title)}</div>
                                
                                ${(dateDisplay || timeDisplay || badgeHtml) ? `
                                    <div class="task-meta">
                                        ${dateDisplay ? `<span>📅 ${dateDisplay}</span>` : ''}
                                        ${timeDisplay ? `<span>⏰ ${timeDisplay}</span>` : ''}
                                        ${badgeHtml}
                                    </div>
                                ` : ''}

                                ${item.notes ? `<div class="task-notes">${escapeHtml(item.notes)}</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += html;
            });
        }

        // Background Check Loop
        setInterval(() => {
            const now = Date.now();
            let changed = false;
            
            tasks.forEach(task => {
                if(task.reminders) {
                    task.reminders.forEach(r => {
                        if (r.triggerTime && !r.notified && now >= r.triggerTime) {
                            if (Notification.permission === "granted") {
                                new Notification("Reminder: " + task.title, { body: task.notes || "Due now!" });
                            }
                            r.notified = true;
                            changed = true;
                        }
                    });
                }
            });
            if (changed) saveAndRender();
        }, 30000);

        function clearInputs() {
            taskInput.value = '';
            dateInput.value = '';
            timeInput.value = '';
            notesInput.value = '';
            // Clear reminder rows but keep toggle state if user wants to add multiple tasks
            document.querySelectorAll('.reminder-row').forEach(e => e.remove());
            if(reminderContainer.style.display !== 'none') addReminderRow();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>

</body>
</html>
