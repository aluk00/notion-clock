<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8"><title>Project Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Inter', sans-serif; } .btn-submit { background: #43B049; color: white; width: 100%; padding: 20px; border-radius: 12px; font-weight: 800; } </style>
</head>
<body class="p-10">
    <div class="max-w-xl mx-auto bg-white p-8 border rounded-2xl shadow-sm">
        <h2 class="text-3xl font-black mb-8 uppercase tracking-tight">Log New Project</h2>
        <div class="space-y-4">
            <label class="block text-xs font-black text-gray-400 uppercase">Project Title</label>
            <input type="text" id="pTitle" class="w-full p-4 border rounded-xl" placeholder="e.g. Little Wins 2026">
            <label class="block text-xs font-black text-gray-400 uppercase">Client</label>
            <input type="text" id="pClient" class="w-full p-4 border rounded-xl" placeholder="e.g. Sky Vegas">
            <label class="block text-xs font-black text-gray-400 uppercase">Project Type</label>
            <select id="pType" class="w-full p-4 border rounded-xl">
                <option value="Commercial Brief">Commercial Brief</option>
                <option value="Original Format">Original Format</option>
            </select>
            <button onclick="upload()" id="btnSubmit" class="btn-submit uppercase">Create in Notion ✓</button>
        </div>
    </div>

<script>
    const BRIDGE = 'https://createnotionproject-223535956454.us-central1.run.app';
    async function upload() {
        const btn = document.getElementById('btnSubmit');
        btn.innerText = 'UPLOADING...';
        const payload = {
            TITLE: document.getElementById('pTitle').value,
            "CLIENT / EXTERNAL PARTNER": document.getElementById('pClient').value,
            "PROJECT TYPE": document.getElementById('pType').value
        };
        try {
            const res = await fetch(BRIDGE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (res.ok) { alert('✓ Logged to Notion'); location.reload(); }
            else { alert('Error - Check Connection'); }
        } catch (e) { alert('Error - Check Console'); }
        btn.innerText = 'Create in Notion ✓';
    }
</script>
</body>
</html>
