<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Overview | DMG New Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dmg-blue: #21a0d8; 
            --team-production: #06402B; 
            --carbon: #000000; 
            --surface: #FFFFFF; 
            --border: #E5E7EB; 
            --border-light: #F3F4F6; 
            --ink: #1C1C1C; 
            --ink-sub: #6B7280; 
            --overlay: rgba(0, 0, 0, 0.75);
            
            /* Team Colors for Avatars */
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-social: #F2C316;
            --team-sales: #21a0d8;
            --team-people: #21a0d8;
            --team-exec: #000000;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #FFFFFF; color: var(--carbon); overflow-x: hidden; }

        /* HEADER (BLUE THEME) */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 40px; border-bottom: 1.5px solid #F3F4F6; margin-bottom: 30px; background: #FFF; }
        .header-left { display: flex; align-items: center; gap: 25px; }
        .header-title { font-size: 3.2rem; font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase; line-height: 0.85; transform: scaleY(0.9); transform-origin: left center; }
        
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 75px; height: 75px; flex-shrink: 0; }
        .dots-grid span { background: var(--dmg-blue); border-radius: 50%; animation: dotCycle 3s infinite ease-in-out; opacity: 0.8; }
        @keyframes dotCycle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }

        .refresh-indicator { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #BBB; display: flex; align-items: center; gap: 6px; }
        .live-dot { width: 6px; height: 6px; background: #10B981; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* STATS */
        .stats-bar { padding: 0 40px 40px; display: flex; gap: 50px; }
        .stat-item { display: flex; flex-direction: column; gap: 4px; }
        .stat-value { font-size: 32px; font-weight: 900; color: var(--carbon); line-height: 1; }
        .stat-label { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #BBB; letter-spacing: 0.1em; }

        /* KANBAN BOARD */
        .kanban-container { padding: 0 40px 100px; overflow-x: auto; }
        .kanban-board { display: flex; gap: 20px; min-width: max-content; }
        .kanban-column { width: 320px; flex-shrink: 0; }
        
        .column-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 5px; margin-bottom: 10px; }
        .column-name { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dmg-blue); }
        .column-count { font-size: 11px; font-weight: 900; color: #BBB; }
        
        .column-body { background: #F9FAFB; border-radius: 24px; padding: 15px; min-height: 600px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #F3F4F6; }

        /* CARDS WITH AVATAR ROWS */
        .project-card {
            background: var(--surface); border-radius: 18px; padding: 22px;
            border: 1.5px solid transparent;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; position: relative;
        }
        .project-card:hover { transform: translateY(-4px); border-color: var(--dmg-blue); }
        
        .card-client { font-size: 9px; font-weight: 900; text-transform: uppercase; color: #BBB; letter-spacing: 0.05em; margin-bottom: 6px; display: block; }
        .card-title { font-size: 14px; font-weight: 800; color: var(--carbon); line-height: 1.3; margin-bottom: 15px; }
        
        .avatar-row { display: flex; justify-content: flex-end; align-items: center; gap: -8px; margin-top: 10px; }
        .mini-avatar { 
            width: 26px; height: 26px; border-radius: 50%; color: white; border: 2px solid white; 
            display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 900; 
            margin-left: -8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .mini-avatar:first-child { margin-left: 0; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(12px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 900px; border-radius: 36px; padding: 60px; position: relative; animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1); max-height: 90vh; overflow-y: auto; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .modal-close { position: absolute; top: 40px; right: 40px; cursor: pointer; font-size: 24px; color: #CCC; transition: 0.2s; }
        .modal-close:hover { color: var(--dmg-blue); transform: rotate(90deg); }

        .modal-label { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #BBB; letter-spacing: 0.15em; margin-bottom: 8px; display: block; }
        .modal-title { font-size: 3rem; font-weight: 900; text-transform: uppercase; transform: scaleY(0.9); transform-origin: left; line-height: 0.95; margin-bottom: 40px; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; }
        .workflow-row { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; background: #F9FAFB; border-radius: 20px; border: 1.5px solid var(--border-light); margin-bottom: 30px; }
        .workflow-item { flex: 1; min-width: 150px; }
        .workflow-val { font-size: 13px; font-weight: 800; color: var(--dmg-blue); text-transform: uppercase; margin-top: 4px; }

        .person-tag { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: white; border-radius: 14px; border: 1.5px solid var(--border-light); margin-top: 5px; cursor: pointer; transition: 0.2s; }
        .person-tag:hover { border-color: var(--dmg-blue); background: #F0F9FF; transform: translateY(-2px); }
        .tag-avatar { width: 32px; height: 32px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }
        .person-name { font-size: 13px; font-weight: 800; color: var(--carbon); }

        .btn-notion { display: block; width: 100%; padding: 20px; background: var(--carbon); color: white; text-align: center; border-radius: 16px; font-size: 12px; font-weight: 900; text-transform: uppercase; text-decoration: none; margin-top: 40px; transition: 0.2s; }
        .btn-notion:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        .loading-overlay { position: fixed; inset: 0; background: #FFF; display: flex; align-items: center; justify-content: center; z-index: 3000; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; color: var(--dmg-blue); }
        .hidden { display: none !important; }
        .btn-brief { display: inline-flex; align-items: center; gap: 8px; color: var(--dmg-blue); font-weight: 800; text-transform: uppercase; font-size: 10px; text-decoration: underline; margin-top: 8px; }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">Loading Overview...</div>

<header class="header">
    <div class="header-left">
        <div class="dots-grid"><span></span><span></span><span></span><span></span></div>
        <h1 class="header-title">Project<br>Overview</h1>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
        <div class="refresh-indicator"><div class="live-dot"></div> Live Sync Active</div>
        <span id="lastUpdated" style="font-size:10px; font-weight:800; color:#BBB;">Updated: Just now</span>
    </div>
</header>

<div class="stats-bar">
    <div class="stat-item">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Total Projects</span>
    </div>
</div>

<div class="kanban-container">
    <div class="kanban-board" id="kanbanBoard"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-close" onclick="closeModal()">×</div>
        
        <span class="modal-label" id="modalLabelClient">Client Name</span>
        <h2 class="modal-title" id="modalTitle">Project Title</h2>

        <div class="workflow-row">
            <div class="workflow-item"><span class="modal-label">Creative Status</span><div class="workflow-val" id="modalCreativeWorkflow">-</div></div>
            <div class="workflow-item"><span class="modal-label">Production Status</span><div class="workflow-val" id="modalProductionWorkflow">-</div></div>
            <div class="workflow-item"><span class="modal-label">Social Status</span><div class="workflow-val" id="modalSocialStatus">-</div></div>
            <div class="workflow-item"><span class="modal-label">Priority</span><div class="workflow-val" id="modalPriority" style="color:#EF4444">-</div></div>
        </div>

        <div class="info-grid">
            <div>
                <span class="modal-label">Target Due Date</span>
                <p id="modalDueDate" style="font-size: 18px; font-weight: 800; margin-bottom: 25px; color: var(--dmg-blue);">-</p>
                <span class="modal-label">Project Leads</span>
                <div id="modalLeads"></div>
            </div>
            <div>
                <span class="modal-label">Asset(s) Required</span>
                <div id="modalAssetsNeeded" style="margin-top: 10px;"></div>
                <div style="margin-top: 25px;">
                    <span class="modal-label">Response & Brief</span>
                    <p id="modalResponseType" style="font-size: 14px; font-weight: 700; color: var(--carbon);">-</p>
                    <div id="briefMount"></div>
                </div>
            </div>
        </div>

        <a href="#" id="modalNotionLink" target="_blank" class="btn-notion">Manage Data in Notion →</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY", authDomain: "dmg-command-centre-native.firebaseapp.com", projectId: "dmg-command-centre-native", storageBucket: "dmg-command-centre-native.firebasestorage.app", messagingSenderId: "223535956454", appId: "1:223535956454:web:b25e5bc69d8a4a7f209627" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
    
    let allProjects = []; let staffDirectory = [];
    const STAGES = [{ id: 'To Be Briefed', name: 'To Be Briefed' }, { id: 'Pitch Sent', name: 'Pitch Sent' }, { id: 'Deal Agreed', name: 'Deal Agreed' }, { id: 'Sales Review', name: 'Sales Review' }, { id: 'Complete', name: 'Complete' }];
    const TEAM_COLS = { Editorial: '#E94B4B', Creative: '#E6468B', Production: '#43B049', Social: '#F2C316', Sales: '#21a0d8', People: '#21a0d8', Executive: '#000000' };

    function getInitials(name) {
        if (!name || name === '-' || typeof name !== 'string') return '??';
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
        return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function findStaff(name) {
        if (!name || typeof name !== 'string') return null;
        return staffDirectory.find(s => s.name.toLowerCase() === name.toLowerCase().trim());
    }

    function renderPersonTag(name, role) {
        if (!name) return '';
        const staff = findStaff(name);
        const col = TEAM_COLS[staff?.team] || '#CCC';
        return `
            <div class="person-tag">
                <div class="tag-avatar" style="background:${col}">${getInitials(name)}</div>
                <div><div class="person-name">${name}</div><div style="font-size:9px; font-weight:900; color:#BBB; text-transform:uppercase;">${role}</div></div>
            </div>`;
    }

    async function loadAll() {
        try {
            const snap = await getDocs(collection(db, "artifacts", "dmg-command-centre-native", "public", "data", "staff_directory"));
            staffDirectory = snap.docs.map(doc => { const d = doc.data(); return { name: `${d.firstName} ${d.lastName}`.trim(), team: d.team }; });

            const projData = await fetch(API_URL + '/projects').then(r => r.json());
            allProjects = projData.projects || [];
            document.getElementById('statTotal').textContent = allProjects.length;

            const board = document.getElementById('kanbanBoard');
            board.innerHTML = STAGES.map(stage => {
                const stageProjects = allProjects.filter(p => p.stage === stage.id);
                return `
                    <div class="kanban-column">
                        <div class="column-header"><span class="column-name">${stage.name}</span><span class="column-count">${stageProjects.length}</span></div>
                        <div class="column-body">
                            ${stageProjects.length === 0 ? '<div style="text-align:center; padding:50px; font-size:10px; font-weight:800; color:#CCC;">No Projects</div>' : stageProjects.map(p => {
                                // Gather all leads for avatar row
                                const leads = [p.salesLead, p.creativeLead, p.productionLead].filter(l => l && l !== '-' && l !== 'Unknown');
                                const uniqueLeads = [...new Set(leads)];
                                const avatarRow = uniqueLeads.map(l => {
                                    const s = findStaff(l);
                                    const col = TEAM_COLS[s?.team] || '#CCC';
                                    return `<div class="mini-avatar" style="background:${col}" title="${l}">${getInitials(l)}</div>`;
                                }).join('');

                                return `<div class="project-card" onclick="openProject('${p.id}')">
                                    <span class="card-client">${p.client || 'General'}</span>
                                    <div class="card-title">${p.title}</div>
                                    <div class="avatar-row">${avatarRow}</div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
            }).join('');
            
            document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString('en-GB');
            document.getElementById('loadingOverlay').classList.add('hidden');
        } catch (e) { console.error(e); }
    }

    window.openProject = function(projectId) {
        const p = allProjects.find(item => item.id === projectId);
        if (!p) return;

        document.getElementById('modalLabelClient').textContent = p.client || 'General';
        document.getElementById('modalTitle').textContent = p.title;
        document.getElementById('modalDueDate').textContent = p.dueDate ? new Date(p.dueDate).toLocaleDateString('en-GB') : 'No Date Set';
        document.getElementById('modalCreativeWorkflow').textContent = p.creativeWorkflowStatus || 'Not Started';
        document.getElementById('modalProductionWorkflow').textContent = p.productionWorkflowStatus || 'Not Started';
        document.getElementById('modalSocialStatus').textContent = p.socialWorkflowStatus || 'Awaiting Asset(s)';
        document.getElementById('modalPriority').textContent = p.priority || 'Medium';
        document.getElementById('modalResponseType').textContent = p.responseTypeNeeded || 'TBC';
        document.getElementById('modalNotionLink').href = p.url;
        
        document.getElementById('briefMount').innerHTML = p.briefUrl ? `<a href="${p.briefUrl}" target="_blank" class="btn-brief">View Brief on Notion →</a>` : '';
        document.getElementById('modalLeads').innerHTML = renderPersonTag(p.salesLead, 'Sales Lead') + renderPersonTag(p.creativeLead, 'Creative Lead') + renderPersonTag(p.productionLead, 'Production Lead');

        const assetContainer = document.getElementById('modalAssetsNeeded');
        assetContainer.innerHTML = (p.assetsNeeded || []).map(a => `<span style="display:inline-block; padding:4px 10px; background:#E1F5FE; color:#0277BD; border-radius:6px; font-size:9px; font-weight:800; margin-right:6px; margin-bottom:6px;">${a}</span>`).join('');

        document.getElementById('modalOverlay').style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('modalOverlay').style.display = 'none';

    signInAnonymously(auth).then(() => {
        loadAll();
        setInterval(loadAll, 5000); // 5 Second Auto-Refresh
    });
</script>
</body>
</html>
