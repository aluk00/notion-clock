<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Header | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #21A0D8;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .banner-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px 20px 0;
            box-sizing: border-box;
            background: #FFF;
            border-bottom: 1px solid var(--border);
            position: relative;
            border-radius: 12px;
        }
        .banner-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.4;
            pointer-events: none;
            border-radius: 12px;
        }
        .content-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
            flex: 1;
            padding-left: 24px;
        }
        .label {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--team-color, var(--dmg-blue));
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .line-deco {
            height: 1px;
            background: var(--border);
            width: 60px;
        }
        .main-headline {
            font-size: 48px; 
            font-weight: 900;
            line-height: 0.95;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: -0.04em;
        }
        .outlined {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--ink);
            opacity: 0.25;
        }
        .user-name {
            color: var(--ink);
        }
        .role-line {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-sub);
            margin-top: 8px;
        }
        .role-line .team-name {
            color: var(--team-color, var(--dmg-blue));
        }
        .system-block {
            display: flex;
            align-items: center;
            gap: 24px;
            z-index: 2;
            padding-left: 30px;
            border-left: 1px solid var(--border);
            height: 120px;
        }
        .clock-container {
            position: relative;
            width: 100px;
            height: 100px;
        }
        .hand { stroke-linecap: round; transform-origin: 50% 50%; transition: transform 0.05s linear; }
        .hand-hour { stroke: var(--team-color, var(--dmg-blue)); stroke-width: 4; }
        .hand-minute { stroke: var(--team-color, var(--dmg-blue)); stroke-width: 4; }
        .hand-second { stroke: #00e1ff; stroke-width: 1.5; }
        .center-pin { fill: #ffffff; stroke: var(--team-color, var(--dmg-blue)); stroke-width: 2; }
        .tick { stroke: var(--border); stroke-width: 1.5; stroke-linecap: round; }
        .date-display {
            display: flex;
            flex-direction: column;
            text-align: left;
            min-width: 70px;
        }
        .date-weekday {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--team-color, var(--dmg-blue));
        }
        .date-main {
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            color: var(--ink);
            margin: 2px 0;
        }
        .date-month {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-sub);
        }
        .demo-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: var(--team-creative);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 10;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";
        
        const teamColors = {
            Editorial: '#E94B4B',
            Creative: '#E6468B',
            Production: '#43B049',
            Social: '#F2C316',
            Operations: '#21A0D8',
            Executive: '#1C1C1C'
        };

        // Demo user for template design
        const DEMO_USER = {
            firstName: 'Your',
            lastName: 'Name',
            role: 'Your Role',
            team: 'Operations',
            isDemo: true
        };

        const root = document.getElementById('root');

        function getGreeting() {
            const hr = new Date().getHours();
            if (hr < 12) return 'Good Morning';
            if (hr < 18) return 'Good Afternoon';
            return 'Good Evening';
        }

        function render(user, isDemo = false) {
            const teamColor = teamColors[user.team] || '#21A0D8';
            
            root.innerHTML = `
                <div class="banner-wrapper fade-in" style="--team-color: ${teamColor}">
                    ${isDemo ? '<div class="demo-badge">Preview Mode</div>' : ''}
                    <div class="content-left">
                        <div class="label">
                            <span>My Profile</span>
                            <div class="line-deco"></div>
                        </div>
                        <div class="main-headline">
                            <span class="outlined">${getGreeting()},</span><br>
                            <span class="user-name">${user.firstName}</span>
                        </div>
                        <div class="role-line">
                            ${user.role} · <span class="team-name">${user.team}</span>
                        </div>
                    </div>
                    <div class="system-block">
                        <div class="clock-container">
                            <svg viewBox="0 0 120 120" width="100%" height="100%">
                                <g id="ticks"></g>
                                <line id="hour-hand" class="hand hand-hour" x1="60" y1="60" x2="60" y2="38" />
                                <line id="min-hand" class="hand hand-minute" x1="60" y1="60" x2="60" y2="24" />
                                <line id="sec-hand" class="hand hand-second" x1="60" y1="66" x2="60" y2="22" />
                                <circle class="center-pin" cx="60" cy="60" r="3" />
                            </svg>
                        </div>
                        <div class="date-display">
                            <div class="date-weekday" id="weekday"></div>
                            <div class="date-main" id="daynum"></div>
                            <div class="date-month" id="monthyear"></div>
                        </div>
                    </div>
                </div>
            `;
            
            // Draw ticks
            const ticksGroup = document.getElementById('ticks');
            const radius = 52, center = 60;
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const len = 5;
                const inner = radius - len;
                const x1 = center + radius * Math.sin(angle);
                const y1 = center - radius * Math.cos(angle);
                const x2 = center + inner * Math.sin(angle);
                const y2 = center - inner * Math.cos(angle);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x1); line.setAttribute("y1", y1);
                line.setAttribute("x2", x2); line.setAttribute("y2", y2);
                line.setAttribute("class", "tick");
                ticksGroup.appendChild(line);
            }
            
            // Animate clock
            function updateClock() {
                const now = new Date();
                const sec = now.getSeconds() + now.getMilliseconds() / 1000;
                const min = now.getMinutes() + sec / 60;
                const hr = (now.getHours() % 12) + min / 60;
                
                document.getElementById('sec-hand').style.transform = `rotate(${sec * 6}deg)`;
                document.getElementById('min-hand').style.transform = `rotate(${min * 6}deg)`;
                document.getElementById('hour-hand').style.transform = `rotate(${hr * 30}deg)`;
                
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                document.getElementById('weekday').textContent = days[now.getDay()];
                document.getElementById('daynum').textContent = now.getDate().toString().padStart(2, '0');
                document.getElementById('monthyear').textContent = `${months[now.getMonth()]} ${now.getFullYear()}`;
                
                requestAnimationFrame(updateClock);
            }
            updateClock();
        }

        async function resolveIdentity(authUser) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');

            // Try URL param first
            if (paramId) {
                try {
                    const docRef = doc(db, "artifacts", appId, "public", "data", "staff_directory", paramId);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        render({ id: snap.id, ...snap.data() }, false);
                        return;
                    }
                } catch (e) { console.log('Param lookup failed:', e); }
            }

            // Try email match
            if (authUser && authUser.email && !authUser.isAnonymous) {
                try {
                    const q = query(
                        collection(db, "artifacts", appId, "public", "data", "staff_directory"), 
                        where("email", "==", authUser.email)
                    );
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        render({ id: snap.docs[0].id, ...snap.docs[0].data() }, false);
                        return;
                    }
                } catch (e) { console.log('Email lookup failed:', e); }
            }

            // Fall back to demo mode
            render(DEMO_USER, true);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                resolveIdentity(user);
            } else {
                signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
