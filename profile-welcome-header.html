<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Header | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .banner-wrapper {
            width: 100%;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 50px 28px 0;
            box-sizing: border-box;
            background: #FFF;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .banner-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.4;
            pointer-events: none;
        }
        
        .content-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
            flex: 1;
            padding-left: 2px;
        }
        .main-headline {
            font-size: 90px;
            font-weight: 900;
            line-height: 0.92;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: -0.04em;
            white-space: nowrap;
        }
        .user-name { color: var(--ink); }
        .outlined {
            color: transparent;
            -webkit-text-stroke: 2.5px var(--ink);
            opacity: 0.2;
        }
        
        .system-block {
            display: flex;
            align-items: center;
            gap: 32px;
            z-index: 2;
            padding-left: 40px;
            border-left: 1px solid var(--border);
            height: 180px;
        }
        .clock-container {
            position: relative;
            width: 160px;
            height: 160px;
        }
        .hand { stroke-linecap: round; transform-origin: 50% 50%; transition: transform 0.05s linear; }
        .hand-hour { stroke: var(--dmg-blue); stroke-width: 6; }
        .hand-minute { stroke: var(--dmg-blue); stroke-width: 6; }
        .hand-second { stroke: #00e1ff; stroke-width: 2.5; }
        .center-pin { fill: #ffffff; stroke: var(--dmg-blue); stroke-width: 4; }
        .tick { stroke: var(--border); stroke-width: 2.5; stroke-linecap: round; }
        
        .date-display {
            display: flex;
            flex-direction: column;
            text-align: left;
            min-width: 110px;
        }
        .date-weekday {
            font-size: 17px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--dmg-blue);
        }
        .date-main {
            font-size: 48px;
            font-weight: 900;
            line-height: 1;
            color: var(--ink);
            margin: 4px 0;
        }
        .date-month {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-sub);
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        let user = null;
        let loading = true;
        const root = document.getElementById('root');

        function getGreeting() {
            const hr = new Date().getHours();
            if (hr < 12) return 'Good Morning';
            if (hr < 18) return 'Good Afternoon';
            return 'Good Evening';
        }

        function render() {
            root.innerHTML = `
                <div class="banner-wrapper fade-in">
                    <div class="content-left">
                        <div class="main-headline">
                            <span class="outlined">${getGreeting()},</span><br />
                            <span class="user-name">${loading ? '...' : (user ? user.firstName : 'Visitor')}</span>
                        </div>
                    </div>
                    <div class="system-block">
                        <div class="clock-container">
                            <svg viewBox="0 0 120 120" width="100%" height="100%">
                                <g id="ticks"></g>
                                <line id="hand-hour" class="hand hand-hour" x1="60" y1="60" x2="60" y2="35" />
                                <line id="hand-min" class="hand hand-minute" x1="60" y1="60" x2="60" y2="20" />
                                <line id="hand-sec" class="hand hand-second" x1="60" y1="66" x2="60" y2="18" />
                                <circle class="center-pin" cx="60" cy="60" r="4" />
                            </svg>
                        </div>
                        <div class="date-display">
                            <div class="date-weekday" id="date-weekday"></div>
                            <div class="date-main" id="date-main"></div>
                            <div class="date-month" id="date-month"></div>
                        </div>
                    </div>
                </div>
            `;
            initClock();
        }

        function initClock() {
            const ticksGroup = document.getElementById('ticks');
            if (ticksGroup && !ticksGroup.hasChildNodes()) {
                const radius = 52, center = 60;
                for (let i = 0; i < 60; i++) {
                    if (i % 5 !== 0) continue;
                    const angle = (i * 6) * (Math.PI / 180);
                    const innerRadius = radius - 6;
                    const x1 = center + radius * Math.sin(angle);
                    const y1 = center - radius * Math.cos(angle);
                    const x2 = center + innerRadius * Math.sin(angle);
                    const y2 = center - innerRadius * Math.cos(angle);
                    
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", x1); line.setAttribute("y1", y1);
                    line.setAttribute("x2", x2); line.setAttribute("y2", y2);
                    line.setAttribute("class", "tick");
                    ticksGroup.appendChild(line);
                }
            }

            const update = () => {
                const now = new Date();
                const sec = now.getSeconds(), min = now.getMinutes(), hr = now.getHours(), ms = now.getMilliseconds();
                const secDeg = ((sec / 60) * 360) + ((ms / 1000) * 6);
                const minDeg = ((min / 60) * 360) + ((sec / 60) * 6);
                const hrDeg = ((hr % 12) / 12 * 360) + ((min / 60) * 30);

                const secHand = document.getElementById('hand-sec');
                const minHand = document.getElementById('hand-min');
                const hrHand = document.getElementById('hand-hour');
                if (secHand) secHand.style.transform = `rotate(${secDeg}deg)`;
                if (minHand) minHand.style.transform = `rotate(${minDeg}deg)`;
                if (hrHand) hrHand.style.transform = `rotate(${hrDeg}deg)`;

                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
                const dayEl = document.getElementById('date-weekday');
                const mainEl = document.getElementById('date-main');
                const monthEl = document.getElementById('date-month');
                if (dayEl) dayEl.textContent = days[now.getDay()];
                if (mainEl) mainEl.textContent = now.getDate().toString().padStart(2, '0');
                if (monthEl) monthEl.textContent = `${months[now.getMonth()]} ${now.getFullYear()}`;
                requestAnimationFrame(update);
            };
            requestAnimationFrame(update);
        }

        async function resolveIdentity(authUser) {
            // 1. First check if logged in via profile-login widget (localStorage session)
            const STORAGE_KEY = 'dmg_profile_session';
            const REMEMBER_KEY = 'dmg_profile_remember';
            const remembered = localStorage.getItem(REMEMBER_KEY);
            const session = localStorage.getItem(STORAGE_KEY);

            if (remembered && session) {
                try {
                    const sessionData = JSON.parse(session);
                    if (sessionData.staffId) {
                        const docRef = doc(db, "artifacts", appId, "public", "data", "staff_directory", sessionData.staffId);
                        const snap = await getDoc(docRef);
                        if (snap.exists()) {
                            const data = snap.data();
                            const fullName = data.name || data.Name || 'User';
                            user = { id: snap.id, ...data, firstName: fullName.split(' ')[0] };
                            loading = false;
                            render();
                            return;
                        }
                    }
                } catch (e) { console.log('Session lookup failed:', e); }
            }

            // 2. Then try URL param
            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');

            if (paramId) {
                try {
                    const docRef = doc(db, "artifacts", appId, "public", "data", "staff_directory", paramId);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        const fullName = data.name || data.Name || 'User';
                        user = { id: snap.id, ...data, firstName: fullName.split(' ')[0] };
                    }
                } catch (e) { console.log('Param lookup failed:', e); }
            }

            // 3. Finally try Firebase auth email (for future SSO)
            if (!user && authUser?.email && !authUser.isAnonymous) {
                try {
                    const q = query(collection(db, "artifacts", appId, "public", "data", "staff_directory"), where("email", "==", authUser.email));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        const data = snap.docs[0].data();
                        const fullName = data.name || data.Name || 'User';
                        user = { id: snap.docs[0].id, ...data, firstName: fullName.split(' ')[0] };
                    }
                } catch (e) { console.log('Email lookup failed:', e); }
            }

            loading = false;
            render();
        }

        // Listen for login/logout events from profile-login widget
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'DMG_PROFILE_LOGIN') {
                const fullName = e.data.staffMember?.name || e.data.staffMember?.Name || 'User';
                user = { ...e.data.staffMember, firstName: fullName.split(' ')[0] };
                render();
            } else if (e.data?.type === 'DMG_PROFILE_LOGOUT') {
                user = null;
                render();
            }
        });

        onAuthStateChanged(auth, (authUser) => {
            if (authUser) resolveIdentity(authUser);
            else signInAnonymously(auth);
        });
    </script>
</body>
</html>
