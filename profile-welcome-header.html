<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 16px;
            color: var(--ink);
        }
        .banner {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 32px;
            position: relative;
            overflow: hidden;
            min-height: 160px;
        }
        
        /* Decorative elements */
        .deco-circles {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 180px;
            height: 180px;
            opacity: 0.08;
        }
        .deco-circles circle {
            fill: none;
            stroke: var(--team-color, var(--dmg-blue));
            stroke-width: 2;
        }
        
        /* Left content */
        .content-left {
            flex: 1;
            z-index: 1;
        }
        .greeting-line {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .user-name {
            font-size: 52px;
            font-weight: 900;
            color: var(--ink);
            margin: 0;
            letter-spacing: -2px;
            line-height: 1;
            -webkit-text-stroke: 2px var(--ink);
            -webkit-text-fill-color: transparent;
        }
        .user-name span {
            -webkit-text-fill-color: var(--ink);
        }
        
        /* Right content - Clock & Date */
        .content-right {
            display: flex;
            align-items: center;
            gap: 28px;
            z-index: 1;
        }
        
        /* Analog Clock */
        .clock-container {
            width: 100px;
            height: 100px;
            position: relative;
        }
        .clock-face {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--ink);
            position: relative;
            background: #FFF;
        }
        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--team-color, var(--dmg-blue));
            border-radius: 50%;
            z-index: 10;
        }
        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
        }
        .hour-hand {
            width: 4px;
            height: 28px;
            background: var(--ink);
            margin-left: -2px;
        }
        .minute-hand {
            width: 3px;
            height: 38px;
            background: var(--ink);
            margin-left: -1.5px;
        }
        .second-hand {
            width: 2px;
            height: 42px;
            background: var(--team-color, var(--dmg-blue));
            margin-left: -1px;
        }
        /* Hour markers */
        .clock-marker {
            position: absolute;
            width: 3px;
            height: 10px;
            background: var(--ink);
            left: 50%;
            margin-left: -1.5px;
            transform-origin: center 47px;
        }
        
        /* Date display */
        .date-display {
            text-align: right;
        }
        .date-weekday {
            font-size: 14px;
            font-weight: 800;
            color: var(--team-color, var(--dmg-blue));
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .date-day {
            font-size: 42px;
            font-weight: 900;
            color: var(--ink);
            line-height: 1;
            letter-spacing: -1px;
        }
        .date-month {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        /* Demo badge */
        .demo-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: var(--team-creative);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Social Video': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316'
        };

        const DEMO_USER = {
            firstName: 'Your',
            lastName: 'Name',
            team: 'Operations',
            isDemo: true
        };

        let currentUser = null;
        let isDemo = true;

        const root = document.getElementById('root');

        function getTeamColor(team) {
            return TEAM_COLORS[team] || '#21a0d8';
        }

        function getGreeting() {
            const hour = new Date().getHours();
            if (hour < 12) return 'Good Morning';
            if (hour < 17) return 'Good Afternoon';
            return 'Good Evening';
        }

        function getDateParts() {
            const now = new Date();
            const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return {
                weekday: weekdays[now.getDay()],
                day: now.getDate(),
                month: months[now.getMonth()],
                year: now.getFullYear()
            };
        }

        function render() {
            const user = currentUser || DEMO_USER;
            const teamColor = getTeamColor(user.team);
            const greeting = getGreeting();
            const date = getDateParts();

            root.innerHTML = `
                <div class="banner" style="--team-color: ${teamColor}">
                    ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    
                    <svg class="deco-circles" viewBox="0 0 180 180">
                        <circle cx="90" cy="90" r="40"/>
                        <circle cx="90" cy="90" r="60"/>
                        <circle cx="90" cy="90" r="80"/>
                    </svg>
                    
                    <div class="content-left">
                        <div class="greeting-line">${greeting}</div>
                        <h1 class="user-name"><span>${user.firstName}</span></h1>
                    </div>
                    
                    <div class="content-right">
                        <div class="clock-container">
                            <div class="clock-face">
                                ${[0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map(deg => 
                                    `<div class="clock-marker" style="transform: rotate(${deg}deg)"></div>`
                                ).join('')}
                                <div class="clock-hand hour-hand" id="hour-hand"></div>
                                <div class="clock-hand minute-hand" id="minute-hand"></div>
                                <div class="clock-hand second-hand" id="second-hand"></div>
                                <div class="clock-center"></div>
                            </div>
                        </div>
                        
                        <div class="date-display">
                            <div class="date-weekday">${date.weekday}</div>
                            <div class="date-day">${date.day}</div>
                            <div class="date-month">${date.month} ${date.year}</div>
                        </div>
                    </div>
                </div>
            `;

            startClock();
        }

        function startClock() {
            function updateClock() {
                const now = new Date();
                const hours = now.getHours() % 12;
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                const ms = now.getMilliseconds();

                const hourDeg = (hours * 30) + (minutes * 0.5);
                const minuteDeg = (minutes * 6) + (seconds * 0.1);
                const secondDeg = (seconds * 6) + (ms * 0.006);

                const hourHand = document.getElementById('hour-hand');
                const minuteHand = document.getElementById('minute-hand');
                const secondHand = document.getElementById('second-hand');

                if (hourHand) hourHand.style.transform = `rotate(${hourDeg}deg)`;
                if (minuteHand) minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
                if (secondHand) secondHand.style.transform = `rotate(${secondDeg}deg)`;

                requestAnimationFrame(updateClock);
            }
            updateClock();
        }

        async function resolveIdentity(authUser) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');

            if (paramId) {
                try {
                    const docRef = doc(db, "artifacts", appId, "public", "data", "staff_directory", paramId);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        currentUser = { id: snap.id, ...snap.data() };
                        isDemo = false;
                        render();
                        return;
                    }
                } catch (e) {
                    console.log('Param lookup failed:', e);
                }
            }

            if (authUser && authUser.email && !authUser.isAnonymous) {
                try {
                    const q = query(
                        collection(db, "artifacts", appId, "public", "data", "staff_directory"),
                        where("email", "==", authUser.email)
                    );
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        currentUser = { id: snap.docs[0].id, ...snap.docs[0].data() };
                        isDemo = false;
                        render();
                        return;
                    }
                } catch (e) {
                    console.log('Email lookup failed:', e);
                }
            }

            currentUser = DEMO_USER;
            isDemo = true;
            render();
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                resolveIdentity(user);
            } else {
                signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
