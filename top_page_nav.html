<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Page Navigation | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --dmg-blue-dark: #1b8ab9;
            --dmg-glow: rgba(33, 160, 216, 0.3);
            
            /* Team Palette */
            --editorial: #E94B4B;
            --creative: #E6468B;
            --production: #43B049;
            --social: #F2C316;
            --people: #9333EA;
            --sales: #F97316;
            
            --text-main: #1C1C1C;
            --text-sub: #757575;
            --border: #EAECEF;
            --font-size: 10.5px;
            --icon-size: 13px;
            --dot-size: 14px;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 70px;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            padding-right: 20px;
        }
        .nav-deck {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 5px;
            border-radius: 16px;
            gap: 3px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .brand-section {
            display: flex;
            align-items: center;
            padding: 0 12px 0 8px;
            border-right: 1px solid var(--border);
            margin-right: 5px;
        }
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: var(--dot-size);
            height: var(--dot-size);
        }
        .dot {
            width: 100%;
            height: 100%;
            background: var(--dmg-blue);
            border-radius: 50%;
            animation: pulse 3s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.5s; }
        .dot:nth-child(4) { animation-delay: 1s; }
        .dot:nth-child(3) { animation-delay: 1.5s; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }
        .nav-tab {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 12px;
            color: var(--text-sub);
            font-size: var(--font-size);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            white-space: nowrap;
        }
        .tab-icon {
            width: var(--icon-size);
            height: var(--icon-size);
            stroke-width: 2.5;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        .tab-home {
            background: linear-gradient(135deg, var(--dmg-blue), var(--dmg-blue-dark));
            color: #FFFFFF !important;
            margin-right: 8px;
            box-shadow: 0 4px 12px var(--dmg-glow);
        }
        .tab-home:hover {
            transform: translateY(-1.5px) scale(1.02);
            box-shadow: 0 6px 18px var(--dmg-glow);
        }
        .tab-profile {
            background: rgba(33, 160, 216, 0.06);
            border: 1px solid color-mix(in srgb, var(--dmg-blue) 20%, transparent);
            color: var(--dmg-blue);
            margin-left: 6px;
        }
        .tab-profile:hover {
            background: var(--dmg-blue);
            color: #FFFFFF !important;
            border-color: var(--dmg-blue);
            transform: translateY(-1px);
        }
        .nav-tab:not(.tab-home):not(.tab-profile):hover {
            color: var(--text-main);
            background: #FFFFFF;
            transform: translateY(-1px);
        }
        .nav-tab:hover .tab-icon {
            transform: scale(1.15);
        }
        .nav-tab:not(.tab-home):not(.tab-profile)::before {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            width: 0;
            height: 2px;
            border-radius: 10px;
            background: var(--dmg-blue);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
            opacity: 0;
        }
        .nav-tab:not(.tab-home):not(.tab-profile):hover::before {
            width: 12px;
            opacity: 1;
        }
        /* Team Specific Hover Colors */
        .tab-editorial:hover { color: var(--editorial) !important; }
        .tab-editorial:hover .tab-icon { color: var(--editorial); }
        .tab-editorial:hover::before { background: var(--editorial); }
        
        .tab-creative:hover { color: var(--creative) !important; }
        .tab-creative:hover .tab-icon { color: var(--creative); }
        .tab-creative:hover::before { background: var(--creative); }
        
        .tab-production:hover { color: var(--production) !important; }
        .tab-production:hover .tab-icon { color: var(--production); }
        .tab-production:hover::before { background: var(--production); }
        
        .tab-social:hover { color: var(--social) !important; }
        .tab-social:hover .tab-icon { color: var(--social); }
        .tab-social:hover::before { background: var(--social); }
        
        .tab-people:hover { color: var(--people) !important; }
        .tab-people:hover .tab-icon { color: var(--people); }
        .tab-people:hover::before { background: var(--people); }
        
        .tab-sales:hover { color: var(--sales) !important; }
        .tab-sales:hover .tab-icon { color: var(--sales); }
        .tab-sales:hover::before { background: var(--sales); }
        
        .tab-projects:hover { color: var(--dmg-blue) !important; }
        .tab-projects:hover .tab-icon { color: var(--dmg-blue); }
        .tab-projects:hover::before { background: var(--dmg-blue); }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @media (max-width: 900px) {
            .brand-section { display: none; }
            .nav-tab { padding: 7px 11px; font-size: 9px; }
            .nav-tab span { display: none; }
        }
    </style>
</head>
