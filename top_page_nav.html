<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Page Navigation | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --dmg-blue-dark: #1b8ab9;
            --dmg-glow: rgba(33, 160, 216, 0.3);
            
            /* Team Palette */
            --editorial: #E94B4B;
            --creative: #E6468B;
            --production: #43B049;
            --social: #F2C316;
            --people: #21A0D8;
            
            --text-main: #1C1C1C;
            --text-sub: #757575;
            --border: #EAECEF;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 80px;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* The Main Navigation Deck */
        .nav-deck {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 20px;
            gap: 2px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.06);
            margin-left: 4px;
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Brand Indicator Section */
        .brand-section {
            display: flex;
            align-items: center;
            padding: 0 14px 0 10px;
            border-right: 1px solid var(--border);
            margin-right: 6px;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            width: 18px;
            height: 18px;
        }

        .dot {
            width: 100%;
            height: 100%;
            background: var(--dmg-blue);
            border-radius: 50%;
            animation: pulse 3s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.5s; }
        .dot:nth-child(4) { animation-delay: 1s; }
        .dot:nth-child(3) { animation-delay: 1.5s; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        /* Tab Base Styling */
        .nav-tab {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 14px;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            white-space: nowrap;
        }

        .tab-icon {
            width: 16px;
            height: 16px;
            stroke-width: 2.25;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        /* --- HOME PILL --- */
        .tab-home {
            background: linear-gradient(135deg, var(--dmg-blue), var(--dmg-blue-dark));
            color: #FFFFFF !important;
            margin-right: 8px;
            box-shadow: 0 4px 15px var(--dmg-glow);
        }

        .tab-home:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px var(--dmg-glow);
        }

        .tab-home .tab-icon {
            color: #FFFFFF;
        }

        /* --- TEAM TABS: Glass Hover --- */
        .nav-tab:not(.tab-home):hover {
            color: var(--text-main);
            background: #FFFFFF;
            transform: translateY(-1px);
        }

        .nav-tab:not(.tab-home):hover .tab-icon {
            transform: scale(1.1);
        }

        /* Kinetic Underline Indicator */
        .nav-tab:not(.tab-home)::before {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            width: 0;
            height: 3px;
            border-radius: 10px;
            background: var(--dmg-blue);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
            opacity: 0;
        }

        .nav-tab:not(.tab-home):hover::before {
            width: 14px;
            opacity: 1;
        }

        /* Team Specific Interaction Colors */
        .tab-editorial:hover { color: var(--editorial) !important; text-shadow: 0 0 10px color-mix(in srgb, var(--editorial) 20%, transparent); }
        .tab-editorial:hover .tab-icon { color: var(--editorial); }
        .tab-editorial:hover::before { background: var(--editorial); }
        
        .tab-creative:hover { color: var(--creative) !important; text-shadow: 0 0 10px color-mix(in srgb, var(--creative) 20%, transparent); }
        .tab-creative:hover .tab-icon { color: var(--creative); }
        .tab-creative:hover::before { background: var(--creative); }
        
        .tab-production:hover { color: var(--production) !important; text-shadow: 0 0 10px color-mix(in srgb, var(--production) 20%, transparent); }
        .tab-production:hover .tab-icon { color: var(--production); }
        .tab-production:hover::before { background: var(--production); }
        
        .tab-social:hover { color: var(--social) !important; text-shadow: 0 0 10px color-mix(in srgb, var(--social) 20%, transparent); }
        .tab-social:hover .tab-icon { color: var(--social); }
        .tab-social:hover::before { background: var(--social); }
        
        .tab-people:hover { color: var(--people) !important; text-shadow: 0 0 10px var(--dmg-glow); }
        .tab-people:hover .tab-icon { color: var(--people); }
        .tab-people:hover::before { background: var(--people); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 1000px) {
            .nav-tab { padding: 10px 14px; font-size: 11px; gap: 6px; }
            .brand-section { display: none; }
        }
    </style>
</head>
<body>

    <div class="nav-deck">
        <!-- Live System Branding -->

        <!-- Navigation Hub -->
        <a href="https://aluk00.github.io/notion-clock/homepage.html" class="nav-tab tab-home" target="_top">

        <a href="social.html" class="nav-tab tab-social" target="_top">

    </div>

</body>
