<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handbook Search | DMG New Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #757575;
        }
        body {
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 10px;
            overflow: hidden;
        }

        /* The Dot Language */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 24px;
            height: 24px;
        }
        .dot {
            width: 100%; height: 100%;
            background-color: var(--dmg-blue);
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .dot:nth-child(1) { animation-delay: 0.1s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.2s; }
        .dot:nth-child(4) { animation-delay: 0.3s; }

        @keyframes popIn { to { transform: scale(1); } }

        /* Search Input Styling */
        .search-container {
            display: flex;
            align-items: center;
            background: #FFFFFF;
            border: 1px solid #EAEAEA;
            border-radius: 16px;
            padding: 12px 20px;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .search-container:focus-within {
            border-color: var(--dmg-blue);
            box-shadow: 0 0 20px rgba(33, 160, 216, 0.15);
            transform: translateY(-2px);
        }

        input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            background: transparent;
        }
        input::placeholder {
            color: #BBB;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 800;
            font-size: 11px;
        }

        .label-text {
            font-size: 10px;
            font-weight: 900;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="label-text">
        <div class="dots-grid">
            <div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div>
        </div>
        Operational Search
    </div>

    <div class="search-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color: var(--dmg-blue)">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="handbookSearch" placeholder="Search sourcing, legal, or workflows...">
    </div>

    <script type="module">
        // In a real scenario, this would filter a local Firestore collection 
        // that is synced with the Notion Wiki database.
        const input = document.getElementById('handbookSearch');
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                // Example: Triggering a Notion-specific search URL or custom results modal
                console.log("Searching for:", input.value);
            }
        });
    </script>
</body>
</html>
