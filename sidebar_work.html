<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Work</title>
    <style>
        /* Core Layout */
        body {
            margin: 0; padding: 0 10px; /* Slight padding for the column */
            display: flex; flex-direction: column; /* Stack header and links */
            justify-content: flex-start;
            height: 100vh; background-color: transparent;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* HEADER STYLES */
        .header-container { 
            display: flex; align-items: center; gap: 0.6rem; 
            margin-bottom: 15px; /* Space between header and links */
            padding-top: 10px;
        }
        
        .title-text {
            font-size: 1.6rem; font-weight: 800; color: #000000;
            letter-spacing: -0.04em; line-height: 1;
            opacity: 0; transform: translateY(10px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .text-left { animation-delay: 0.1s; }
        .text-right { animation-delay: 0.3s; }

        .dots-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
            width: 18px; height: 18px;
        }
        .dot {
            width: 100%; height: 100%; background-color: #21a0d8;
            border-radius: 50%; transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* BUTTON LIST STYLES */
        .link-list {
            display: flex; flex-direction: column; gap: 8px;
            width: 100%;
            opacity: 0; animation: fadeIn 1s ease 0.5s forwards; /* Fade in after header */
        }

        .nav-item {
            text-decoration: none;
            color: #4a4a4a;
            font-size: 0.9rem; font-weight: 600;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex; align-items: center;
            position: relative;
        }

        /* Slick Hover Effect */
        .nav-item:hover {
            color: #21a0d8; /* Blue text */
            background-color: rgba(33, 160, 216, 0.08); /* Very faint blue bg */
            padding-left: 16px; /* Slide right slightly */
        }

        /* Active/Click Effect */
        .nav-item:active { transform: scale(0.98); }

        /* Animation Keyframes */
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-container">
        <div class="title-text text-left">THE</div>
        <div class="dots-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="title-text text-right">WORK</div>
    </div>

    <!-- Links Section -->
    <div class="link-list">
        <!-- PASTE YOUR LINKS HERE -->
        <a href="#" class="nav-item" target="_top">Commercial Briefs</a>
        <a href="#" class="nav-item" target="_top">Production Briefing Sheet</a>
        <a href="#" class="nav-item" target="_top">Daily Slate</a>
        <a href="#" class="nav-item" target="_top">Delivery & Sign-Off</a>
    </div>

</body>
</html>
