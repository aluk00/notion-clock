<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Rota Dashboard Header</title>
    <style>
        /* Core Layout */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: flex-start; /* Pinned to left to avoid center-void space */
            align-items: center;
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 1.5rem; /* Matched to snippet */
            line-height: 1;
        }

        /* Text Styling */
        .title-text {
            font-size: 4rem; /* Precise size from snippet */
            font-weight: 800; /* Precise weight from snippet */
            color: #000000;
            letter-spacing: -0.04em; /* Precise tracking from snippet */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Left/Right Text delays */
        .text-left { animation-delay: 0.1s; }
        .text-right { animation-delay: 0.3s; }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 44px; /* Size from snippet */
            height: 44px;
            flex-shrink: 0;
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Dot animation stagger */
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        
        /* Responsive scaling */
        @media (max-width: 768px) {
            .title-text { font-size: 2.5rem; }
            .header-container { gap: 1rem; }
            .dots-grid { width: 28px; height: 28px; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Left Text -->
        <div class="title-text text-left">MANAGER</div>

        <!-- Center Motif -->
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Right Text -->
        <div class="title-text text-right">ROTA DASHBOARD</div>
    </div>

</body>
</html>
