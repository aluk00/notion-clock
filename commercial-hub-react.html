<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Hub | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --ink-muted: #9CA3AF;
            --border: #EAECEF;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --dmg-blue: #21A0D8;
            --creative: #E6468B;
            --production: #43B049;
            --editorial: #E94B4B;
            --social: #F2C316;
            --commercial: #9333EA;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--surface-alt); 
            color: var(--ink); 
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Dot Grid Animation */
        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dot-grid span { width: 6px; height: 6px; border-radius: 50%; background: var(--commercial); }
        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        /* Layout */
        .app-container { max-width: 1400px; margin: 0 auto; padding: 32px; }
        
        /* Header */
        .header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding-bottom: 24px; 
            margin-bottom: 32px; 
            border-bottom: 1px solid var(--border); 
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-label { 
            font-size: 10px; 
            font-weight: 700; 
            color: var(--ink-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.08em; 
        }
        .header-title { 
            font-size: 24px; 
            font-weight: 800; 
            color: var(--ink); 
            letter-spacing: -0.02em; 
        }
        .header-actions { display: flex; gap: 12px; }
        
        /* Buttons */
        .btn { 
            padding: 10px 18px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.04em; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            border: none; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .btn-primary { background: var(--dmg-blue); color: white; }
        .btn-primary:hover { background: #1B8ABF; transform: translateY(-1px); }
        .btn-secondary { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            color: var(--ink-sub); 
        }
        .btn-secondary:hover { border-color: var(--dmg-blue); color: var(--dmg-blue); }
        
        /* Stats Bento */
        .stats-bento { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        .stat-card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 24px; 
            transition: all 0.2s;
        }
        .stat-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
        }
        .stat-label { 
            font-size: 10px; 
            font-weight: 700; 
            color: var(--ink-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.06em; 
            margin-bottom: 12px; 
        }
        .stat-value { 
            font-size: 32px; 
            font-weight: 800; 
            color: var(--ink); 
            letter-spacing: -0.02em; 
            font-variant-numeric: tabular-nums;
        }
        .stat-value.highlight { color: var(--production); }
        .stat-value.money { color: var(--commercial); }
        .stat-sub { font-size: 11px; color: var(--ink-sub); margin-top: 8px; }
        
        /* Sections */
        .section { margin-bottom: 40px; }
        .section-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 16px; 
        }
        .section-title { 
            font-size: 13px; 
            font-weight: 800; 
            color: var(--ink); 
            text-transform: uppercase; 
            letter-spacing: 0.06em; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .section-title svg { opacity: 0.5; }
        .count { 
            background: var(--surface-alt); 
            padding: 3px 10px; 
            border-radius: 12px; 
            font-size: 11px; 
            color: var(--ink-sub); 
            font-weight: 700; 
        }
        .sync-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 10px; 
            font-weight: 600; 
            padding: 4px 10px; 
            border-radius: 6px; 
            background: rgba(67, 176, 73, 0.1); 
            color: var(--production); 
        }
        
        /* Tables */
        .table-wrapper { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            overflow: hidden; 
        }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { 
            background: var(--surface-alt); 
            padding: 14px 16px; 
            text-align: left; 
            font-size: 9px; 
            font-weight: 700; 
            color: var(--ink-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.06em; 
            border-bottom: 1px solid var(--border); 
        }
        .data-table td { 
            padding: 16px; 
            border-bottom: 1px solid var(--border); 
            font-size: 13px; 
            vertical-align: middle; 
        }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tbody tr { cursor: pointer; transition: background 0.15s; }
        .data-table tbody tr:hover td { background: var(--surface-alt); }
        
        /* Project Cell */
        .project-cell { display: flex; flex-direction: column; gap: 3px; }
        .project-title { font-weight: 700; color: var(--ink); font-size: 13px; }
        .project-client { font-size: 11px; color: var(--ink-sub); }
        
        /* Stage Pills */
        .stage-pill { 
            display: inline-flex; 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 10px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.03em; 
        }
        .stage-ideation { background: #F3E8FF; color: #7C3AED; }
        .stage-response { background: #DBEAFE; color: #2563EB; }
        .stage-feedback { background: #FEF3C7; color: #D97706; }
        .stage-negotiation { background: #FEE2E2; color: #DC2626; }
        .stage-won { background: #D1FAE5; color: #059669; }
        .stage-lost { background: #F3F4F6; color: #6B7280; }
        
        /* Phase Pills */
        .phase-pill { 
            display: inline-flex; 
            align-items: center;
            gap: 6px;
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 10px; 
            font-weight: 700; 
            text-transform: uppercase; 
        }
        .phase-preproduction { background: #EDE9FE; color: #7C3AED; }
        .phase-shoot { background: #DBEAFE; color: #2563EB; }
        .phase-edit { background: #FEF3C7; color: #D97706; }
        .phase-delivery { background: #FED7AA; color: #EA580C; }
        .phase-feedback { background: #FEE2E2; color: #DC2626; }
        .phase-live { background: #D1FAE5; color: #059669; }
        .phase-amends { background: #FCE7F3; color: #DB2777; }
        
        /* Other cells */
        .date-cell { font-size: 12px; color: var(--ink-sub); white-space: nowrap; }
        .date-cell.overdue { color: var(--editorial); font-weight: 600; }
        .date-cell.soon { color: #D97706; font-weight: 600; }
        .team-name { font-size: 12px; color: var(--ink); font-weight: 500; }
        .team-name.unassigned { color: var(--ink-muted); font-style: italic; }
        .money-value { font-weight: 700; color: var(--commercial); font-variant-numeric: tabular-nums; }
        .channel-cell { font-size: 11px; color: var(--ink-sub); }
        .deliverable-cell { font-size: 11px; color: var(--ink-sub); max-width: 180px; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 48px; color: var(--ink-muted); font-size: 13px; }
        
        /* Sidebar */
        .sidebar-overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.25); 
            z-index: 99; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.3s; 
        }
        .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        .sidebar-panel { 
            width: 480px; 
            position: fixed; 
            right: 0; 
            top: 0; 
            bottom: 0; 
            background: var(--surface); 
            border-left: 1px solid var(--border); 
            z-index: 100; 
            transform: translateX(100%); 
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }
        .sidebar-panel.open { transform: translateX(0); box-shadow: -12px 0 40px rgba(0,0,0,0.1); }
        .sidebar-scroll { padding: 28px; overflow-y: auto; flex: 1; }
        .sidebar-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 24px; 
            padding-bottom: 20px; 
            border-bottom: 1px solid var(--border); 
        }
        .sidebar-title { font-size: 20px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
        .sidebar-client { font-size: 13px; color: var(--ink-sub); }
        .sidebar-close { 
            background: none; 
            border: none; 
            font-size: 28px; 
            color: var(--ink-muted); 
            cursor: pointer; 
            line-height: 1; 
        }
        .sidebar-close:hover { color: var(--ink); }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-label { 
            font-size: 9px; 
            font-weight: 700; 
            color: var(--ink-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.06em; 
            margin-bottom: 8px; 
        }
        .sidebar-input, .sidebar-select, .sidebar-textarea { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 14px; 
            font-family: inherit; 
            background: var(--surface-alt); 
            outline: none; 
            transition: all 0.2s; 
        }
        .sidebar-input:focus, .sidebar-select:focus, .sidebar-textarea:focus { 
            border-color: var(--dmg-blue); 
            background: var(--surface); 
        }
        .sidebar-textarea { min-height: 100px; resize: vertical; }
        .sidebar-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .sidebar-actions { 
            padding: 20px 28px; 
            border-top: 1px solid var(--border); 
            display: flex; 
            gap: 12px; 
            background: var(--surface); 
        }
        .sidebar-actions .btn { flex: 1; justify-content: center; }
        
        /* Modal */
        .modal-overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.4); 
            z-index: 200; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.2s; 
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal { 
            background: var(--surface); 
            border-radius: 20px; 
            width: 100%; 
            max-width: 560px; 
            max-height: 90vh; 
            overflow-y: auto; 
            transform: translateY(20px); 
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .modal-overlay.open .modal { transform: translateY(0); }
        .modal-header { 
            padding: 24px 28px; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .modal-title { font-size: 18px; font-weight: 800; color: var(--ink); }
        .modal-close { background: none; border: none; font-size: 24px; color: var(--ink-muted); cursor: pointer; }
        .modal-body { padding: 28px; }
        .modal-field { margin-bottom: 20px; }
        .modal-actions { 
            padding: 20px 28px; 
            border-top: 1px solid var(--border); 
            display: flex; 
            gap: 12px; 
            justify-content: flex-end; 
        }
        
        /* Toast */
        .toast { 
            position: fixed; 
            bottom: 32px; 
            left: 50%; 
            transform: translateX(-50%) translateY(20px); 
            background: #111827; 
            color: white; 
            padding: 14px 24px; 
            border-radius: 30px; 
            font-size: 13px; 
            font-weight: 600; 
            opacity: 0; 
            transition: all 0.3s; 
            pointer-events: none; 
            z-index: 300; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-dot { width: 8px; height: 8px; background: #4ADE80; border-radius: 50%; }
        
        /* Loading */
        .loading-screen { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            gap: 16px; 
        }
        .loading-screen span { font-size: 14px; font-weight: 600; color: var(--ink-sub); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
        const APP_ID = 'dmg-command-centre-native';
        
        const PIPELINE_STAGES = ['Ideation', 'Response with MMM', 'Response Sent', 'Awaiting Feedback', 'Negotiation', 'Won', 'Lost', 'On Hold'];
        const PRODUCTION_PHASES = ['Pre-Production', 'Shoot/Edit/Delivery', 'Shoot', 'Edit', 'Final Amends', 'Waiting Client Feedback', 'Delivery', 'Live'];
        
        // SEED DATA from the spreadsheet screenshot
        const SEED_PRODUCTION = [
            { id: 'prod-1', title: 'Sponsored Channel + TT Video', client: 'Nationwide', productionPhase: 'Shoot/Edit/Delivery', channel: 'This is Money', deliverableType: 'Sponsored channel + TT Video', projectLead: 'Maxine', creativeLead: 'Ellie' },
            { id: 'prod-2', title: '7 x TT/IG Videos', client: "Alzheimer's Society", productionPhase: 'Pre-Production', channel: 'DMUK, DM Sport, Metro UK', deliverableType: '7 x TT/IG Videos', projectLead: 'Maxine/Daniel', creativeLead: 'Dan Q, Alex Biddle', scriptsAndTreatment: 'V1: LIVE, V2: LIVE, V3' },
            { id: 'prod-3', title: 'Headlines Video', client: 'Sunweb', productionPhase: 'Final Amends', channel: 'DMUK', deliverableType: '1x Video TT/IG - Headlines', projectLead: 'Maxine/Daniel', creativeLead: 'Hugo', internalDeliveryDate: '2026-01-07' },
            { id: 'prod-4', title: 'Love Notes', client: 'Wuthering Heights', productionPhase: 'Pre-Production', channel: 'DMUK', deliverableType: '3x Video TT/IG - Love Notes', projectLead: 'Maxine/Daniel', creativeLead: 'Hugo', internalDeliveryDate: '2026-01-14' },
            { id: 'prod-5', title: 'Mail Investigates', client: 'Tesco Whoosh', productionPhase: 'Waiting Client Feedback', channel: 'DMUK', deliverableType: '1x Video TT/IG - Investigates', projectLead: 'Maxine/Daniel', creativeLead: 'Hugo' },
            { id: 'prod-6', title: 'Trading 2-1-2', client: 'Trading 212', productionPhase: 'Pre-Production', channel: 'TBC', deliverableType: 'TBC', projectLead: 'TBC', creativeLead: 'TBC' }
        ];
        
        const SEED_PIPELINE = [
            { id: 'pipe-1', title: 'Abu Dhabi Campaign', client: 'Department of Culture and Tourism', dealStage: 'Response with MMM', channel: 'DM Main/ DM Sport', deliverableType: 'TT/IG Content', format: 'Google Doc', commercialOwner: 'Zach' },
            { id: 'pipe-2', title: 'Heavenly Days', client: 'Ramonas', dealStage: 'Response with MMM', channel: 'DMUK', deliverableType: 'Tiered social response', format: 'Google Doc', commercialOwner: 'Isobel' },
            { id: 'pipe-3', title: 'Release Amplification', client: 'M1 Movie', dealStage: 'Response with MMM', channel: 'DMUK', deliverableType: 'TT/IG Content', format: 'Google Doc', commercialOwner: 'Isobel' },
            { id: 'pipe-4', title: 'Slider Box (Evergreen + World Cup)', client: 'Burger King', dealStage: 'Response with MMM', channel: 'DMUK', deliverableType: 'TT/IG Content', format: 'Google Doc', commercialOwner: 'Isobel' },
            { id: 'pipe-5', title: 'World Cup Campaign', client: 'Duracell', dealStage: 'Ideation', channel: 'DM Sport', deliverableType: 'TT/IG Content', format: 'Google Doc', commercialOwner: 'Isobel' },
            { id: 'pipe-6', title: 'La Liga Partnership', client: 'Duracell', dealStage: 'Ideation', channel: 'DM Sport', deliverableType: 'TT/IG Content', format: 'Google Doc', commercialOwner: 'Isobel' },
            { id: 'pipe-7', title: 'World Cup Campaign', client: 'Currys', dealStage: 'Ideation', channel: 'TBC', deliverableType: 'TBC', format: 'TBC', commercialOwner: 'TBC' }
        ];
        
        const getStageClass = (stage) => {
            const s = (stage || '').toLowerCase();
            if (s.includes('ideation')) return 'stage-ideation';
            if (s.includes('response')) return 'stage-response';
            if (s.includes('feedback')) return 'stage-feedback';
            if (s.includes('negotiation')) return 'stage-negotiation';
            if (s.includes('won')) return 'stage-won';
            if (s.includes('lost')) return 'stage-lost';
            return 'stage-ideation';
        };
        
        const getPhaseClass = (phase) => {
            const p = (phase || '').toLowerCase();
            if (p.includes('pre-production')) return 'phase-preproduction';
            if (p.includes('shoot')) return 'phase-shoot';
            if (p.includes('edit')) return 'phase-edit';
            if (p.includes('amends')) return 'phase-amends';
            if (p.includes('feedback')) return 'phase-feedback';
            if (p.includes('delivery')) return 'phase-delivery';
            if (p.includes('live')) return 'phase-live';
            return 'phase-preproduction';
        };
        
        const formatDate = (dateStr) => {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        };
        
        const getDateStatus = (dateStr) => {
            if (!dateStr) return '';
            const diff = (new Date(dateStr) - new Date()) / (1000 * 60 * 60 * 24);
            if (diff < 0) return 'overdue';
            if (diff <= 3) return 'soon';
            return '';
        };
        
        function CommercialHub() {
            const [productionProjects, setProductionProjects] = useState([]);
            const [pipelineProjects, setPipelineProjects] = useState([]);
            const [annotations, setAnnotations] = useState({});
            const [loading, setLoading] = useState(true);
            const [selectedItem, setSelectedItem] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [modalOpen, setModalOpen] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '' });
            const [newBrief, setNewBrief] = useState({ 
                title: '', client: '', stage: 'Ideation', channel: '', 
                commercialOwner: '', creativeLead: '', deliverableType: '' 
            });
            
            useEffect(() => { 
                loadData(); 
            }, []);
            
            const loadData = async () => {
                try {
                    // Try to load from API first
                    const res = await fetch(API_URL + '/projects');
                    const data = await res.json();
                    
                    if (data && data.projects && data.projects.length > 0) {
                        // Split API data into production vs pipeline
                        const production = [];
                        const pipeline = [];
                        data.projects.forEach(p => {
                            const stage = p.dealStage || p.status || '';
                            if (stage === 'Won' || p.productionPhase) {
                                production.push(p);
                            } else {
                                pipeline.push(p);
                            }
                        });
                        setProductionProjects(production.length > 0 ? production : SEED_PRODUCTION);
                        setPipelineProjects(pipeline.length > 0 ? pipeline : SEED_PIPELINE);
                    } else {
                        // Use seed data
                        setProductionProjects(SEED_PRODUCTION);
                        setPipelineProjects(SEED_PIPELINE);
                    }
                    
                    // Load annotations from Firebase
                    try {
                        const annotSnap = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_annotations').get();
                        const annots = {};
                        annotSnap.forEach(doc => { annots[doc.id] = doc.data(); });
                        setAnnotations(annots);
                    } catch (e) { console.log('Firebase annotations not loaded'); }
                    
                } catch (e) { 
                    console.log('API not available, using seed data');
                    setProductionProjects(SEED_PRODUCTION);
                    setPipelineProjects(SEED_PIPELINE);
                } finally { 
                    setLoading(false); 
                }
            };
            
            const seedToFirebase = async () => {
                showToast('Seeding data to Firebase...');
                try {
                    // Seed production projects
                    for (const item of SEED_PRODUCTION) {
                        await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_projects').doc(item.id).set({
                            ...item,
                            type: 'production',
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    }
                    // Seed pipeline projects
                    for (const item of SEED_PIPELINE) {
                        await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_projects').doc(item.id).set({
                            ...item,
                            type: 'pipeline',
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    }
                    showToast('Data seeded to Firebase successfully!');
                } catch (e) {
                    console.error('Seed error:', e);
                    showToast('Seed failed - check console');
                }
            };
            
            const showToast = (msg) => {
                setToast({ show: true, message: msg });
                setTimeout(() => setToast({ show: false, message: '' }), 3000);
            };
            
            const stats = useMemo(() => ({
                liveProductions: productionProjects.filter(p => p.productionPhase === 'Live').length,
                activeProductions: productionProjects.length,
                pipelineCount: pipelineProjects.length,
                responseWithMMM: pipelineProjects.filter(p => (p.dealStage || '').includes('Response')).length
            }), [productionProjects, pipelineProjects]);
            
            const openSidebar = (item, type) => {
                const annotation = annotations[item.id] || {};
                setSelectedItem({ ...item, ...annotation, _type: type });
                setSidebarOpen(true);
            };
            
            const closeSidebar = () => { 
                setSidebarOpen(false); 
                setTimeout(() => setSelectedItem(null), 300); 
            };
            
            const updateItemField = (field, value) => { 
                setSelectedItem(prev => ({ ...prev, [field]: value })); 
            };
            
            const saveChanges = async () => {
                if (!selectedItem || !selectedItem.id) return;
                try {
                    const { id, _type, ...data } = selectedItem;
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_annotations').doc(id).set({ 
                        ...data, 
                        updatedAt: new Date().toISOString() 
                    }, { merge: true });
                    setAnnotations(prev => ({ ...prev, [id]: data }));
                    closeSidebar();
                    showToast('Changes saved');
                } catch (e) { 
                    console.error('Save error:', e); 
                    showToast('Save failed');
                }
            };
            
            const submitNewBrief = async () => {
                if (!newBrief.title || !newBrief.client) return;
                try {
                    const newId = 'brief-' + Date.now();
                    const briefData = {
                        ...newBrief,
                        id: newId,
                        type: 'pipeline',
                        createdAt: new Date().toISOString()
                    };
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_projects').doc(newId).set(briefData);
                    setPipelineProjects(prev => [...prev, briefData]);
                    setModalOpen(false);
                    setNewBrief({ title: '', client: '', stage: 'Ideation', channel: '', commercialOwner: '', creativeLead: '', deliverableType: '' });
                    showToast('Brief added');
                } catch (e) { 
                    console.error('Submit error:', e); 
                    showToast('Failed to add brief');
                }
            };
            
            if (loading) {
                return (
                    <div className="loading-screen">
                        <div className="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <span>Loading Commercial Hub...</span>
                    </div>
                );
            }
            
            return (
                <div className="app-container">
                    {/* Header */}
                    <div className="header">
                        <div className="header-left">
                            <div className="dot-grid"><span></span><span></span><span></span><span></span></div>
                            <div>
                                <div className="header-label">Week Commencing: 12th Jan</div>
                                <div className="header-title">Commercial Hub</div>
                            </div>
                        </div>
                        <div className="header-actions">
                            <button className="btn btn-secondary" onClick={seedToFirebase}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                Seed Data
                            </button>
                            <button className="btn btn-secondary" onClick={loadData}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                                Refresh
                            </button>
                            <button className="btn btn-primary" onClick={() => setModalOpen(true)}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                Add Brief
                            </button>
                        </div>
                    </div>
                    
                    {/* Stats */}
                    <div className="stats-bento">
                        <div className="stat-card">
                            <div className="stat-label">Live Campaigns</div>
                            <div className="stat-value highlight">{stats.liveProductions}</div>
                            <div className="stat-sub">Currently broadcasting</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">In Production</div>
                            <div className="stat-value">{stats.activeProductions}</div>
                            <div className="stat-sub">Active projects</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Pipeline</div>
                            <div className="stat-value">{stats.pipelineCount}</div>
                            <div className="stat-sub">Inbound briefs</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Response with MMM</div>
                            <div className="stat-value money">{stats.responseWithMMM}</div>
                            <div className="stat-sub">Awaiting creative</div>
                        </div>
                    </div>
                    
                    {/* Production Table */}
                    <div className="section">
                        <div className="section-header">
                            <div className="section-title">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                                Production / Live Campaigns
                                <span className="count">{productionProjects.length}</span>
                            </div>
                            <span className="sync-badge">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                                Syncs to queues
                            </span>
                        </div>
                        <div className="table-wrapper">
                            {productionProjects.length === 0 ? (
                                <div className="empty-state">No active productions</div>
                            ) : (
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th>Client / Project</th>
                                            <th>Phase</th>
                                            <th>Channel</th>
                                            <th>Deliverable Type</th>
                                            <th>Project Lead</th>
                                            <th>Creative Lead</th>
                                            <th>Delivery Date</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {productionProjects.map(item => {
                                            const merged = { ...item, ...(annotations[item.id] || {}) };
                                            return (
                                                <tr key={item.id} onClick={() => openSidebar(merged, 'production')}>
                                                    <td>
                                                        <div className="project-cell">
                                                            <span className="project-title">{merged.client || 'Untitled'}</span>
                                                            <span className="project-client">{merged.title || '—'}</span>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <span className={'phase-pill ' + getPhaseClass(merged.productionPhase)}>
                                                            {merged.productionPhase || 'TBC'}
                                                        </span>
                                                    </td>
                                                    <td className="channel-cell">{merged.channel || '—'}</td>
                                                    <td className="deliverable-cell">{merged.deliverableType || '—'}</td>
                                                    <td className="team-name">{merged.projectLead || '—'}</td>
                                                    <td className="team-name">{merged.creativeLead || '—'}</td>
                                                    <td>
                                                        <span className={'date-cell ' + getDateStatus(merged.internalDeliveryDate)}>
                                                            {formatDate(merged.internalDeliveryDate)}
                                                        </span>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                    
                    {/* Pipeline Table */}
                    <div className="section">
                        <div className="section-header">
                            <div className="section-title">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                Inbound Briefs / Responses in Progress
                                <span className="count">{pipelineProjects.length}</span>
                            </div>
                        </div>
                        <div className="table-wrapper">
                            {pipelineProjects.length === 0 ? (
                                <div className="empty-state">No briefs in pipeline</div>
                            ) : (
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th>Client / Project</th>
                                            <th>Brief Title</th>
                                            <th>Channel</th>
                                            <th>Stage</th>
                                            <th>Deliverables Requested</th>
                                            <th>Format</th>
                                            <th>Commercial Owner</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {pipelineProjects.map(item => {
                                            const merged = { ...item, ...(annotations[item.id] || {}) };
                                            return (
                                                <tr key={item.id} onClick={() => openSidebar(merged, 'pipeline')}>
                                                    <td>
                                                        <div className="project-cell">
                                                            <span className="project-title">{merged.client || 'Untitled'}</span>
                                                        </div>
                                                    </td>
                                                    <td className="project-client" style={{fontWeight: 500}}>{merged.title || '—'}</td>
                                                    <td className="channel-cell">{merged.channel || '—'}</td>
                                                    <td>
                                                        <span className={'stage-pill ' + getStageClass(merged.dealStage)}>
                                                            {merged.dealStage || 'Ideation'}
                                                        </span>
                                                    </td>
                                                    <td className="deliverable-cell">{merged.deliverableType || '—'}</td>
                                                    <td className="channel-cell">{merged.format || '—'}</td>
                                                    <td className="team-name">{merged.commercialOwner || '—'}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                    
                    {/* Sidebar */}
                    <div className={'sidebar-overlay' + (sidebarOpen ? ' open' : '')} onClick={closeSidebar}></div>
                    <div className={'sidebar-panel' + (sidebarOpen ? ' open' : '')}>
                        {selectedItem && (
                            <>
                                <div className="sidebar-scroll">
                                    <div className="sidebar-header">
                                        <div>
                                            <div className="sidebar-title">{selectedItem.client || 'Untitled'}</div>
                                            <div className="sidebar-client">{selectedItem.title || 'No project title'}</div>
                                        </div>
                                        <button className="sidebar-close" onClick={closeSidebar}>×</button>
                                    </div>
                                    
                                    {selectedItem._type === 'production' ? (
                                        <>
                                            <div className="sidebar-section">
                                                <div className="sidebar-label">Production Phase</div>
                                                <select className="sidebar-select" value={selectedItem.productionPhase || ''} onChange={e => updateItemField('productionPhase', e.target.value)}>
                                                    <option value="">Select phase...</option>
                                                    {PRODUCTION_PHASES.map(phase => <option key={phase} value={phase}>{phase}</option>)}
                                                </select>
                                            </div>
                                            <div className="sidebar-section">
                                                <div className="sidebar-label">Channel</div>
                                                <input type="text" className="sidebar-input" value={selectedItem.channel || ''} onChange={e => updateItemField('channel', e.target.value)} placeholder="e.g. DMUK, DM Sport" />
                                            </div>
                                            <div className="sidebar-section">
                                                <div className="sidebar-label">Deliverable Type</div>
                                                <input type="text" className="sidebar-input" value={selectedItem.deliverableType || ''} onChange={e => updateItemField('deliverableType', e.target.value)} placeholder="e.g. 3x Video TT/IG" />
                                            </div>
                                            <div className="sidebar-row">
                                                <div className="sidebar-section">
                                                    <div className="sidebar-label">Project Lead</div>
                                                    <input type="text" className="sidebar-input" value={selectedItem.projectLead || ''} onChange={e => updateItemField('projectLead', e.target.value)} />
                                                </div>
                                                <div className="sidebar-section">
                                                    <div className="sidebar-label">Creative Lead</div>
                                                    <input type="text" className="sidebar-input" value={selectedItem.creativeLead || ''} onChange={e => updateItemField('creativeLead', e.target.value)} />
                                                </div>
                                            </div>
                                            <div className="sidebar-section">
                                                <div className="sidebar-label">Internal Delivery Date</div>
                                                <input type="date" className="sidebar-input" value={selectedItem.internalDeliveryDate || ''} onChange={e => updateItemField('internalDeliveryDate', e.target.value)} />
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <div className="sidebar-section">
                                                <div className="sidebar-label">Pipeline Stage</div>
                                                <select className="sidebar-select" value={selectedItem.dealStage || 'Ideation'} onChange={e => updateItemField('dealStage', e.target.value)}>
                                                    {PIPELINE_STAGES.map(stage => <option key={stage} value={stage}>{stage}</option>)}
                                                </select>
                                            </div>
                                            <div className="sidebar-section">
                                                <div className="sidebar-label">Channel</div>
                                                <input type="text" className="sidebar-input" value={selectedItem.channel || ''} onChange={e => updateItemField('channel', e.target.value)} placeholder="e.g. DMUK, DM Sport" />
                                            </div>
                                            <div className="sidebar-section">
                                                <div className="sidebar-label">Deliverables Requested</div>
                                                <input type="text" className="sidebar-input" value={selectedItem.deliverableType || ''} onChange={e => updateItemField('deliverableType', e.target.value)} placeholder="e.g. TT/IG Content" />
                                            </div>
                                            <div className="sidebar-row">
                                                <div className="sidebar-section">
                                                    <div className="sidebar-label">Commercial Owner</div>
                                                    <input type="text" className="sidebar-input" value={selectedItem.commercialOwner || ''} onChange={e => updateItemField('commercialOwner', e.target.value)} />
                                                </div>
                                                <div className="sidebar-section">
                                                    <div className="sidebar-label">Format</div>
                                                    <input type="text" className="sidebar-input" value={selectedItem.format || ''} onChange={e => updateItemField('format', e.target.value)} placeholder="e.g. Google Doc" />
                                                </div>
                                            </div>
                                        </>
                                    )}
                                    
                                    <div className="sidebar-section">
                                        <div className="sidebar-label">Notes</div>
                                        <textarea className="sidebar-input sidebar-textarea" value={selectedItem.notes || ''} onChange={e => updateItemField('notes', e.target.value)} placeholder="Add notes..."></textarea>
                                    </div>
                                </div>
                                <div className="sidebar-actions">
                                    <button className="btn btn-secondary" onClick={closeSidebar}>Cancel</button>
                                    <button className="btn btn-primary" onClick={saveChanges}>Save Changes</button>
                                </div>
                            </>
                        )}
                    </div>
                    
                    {/* Add Brief Modal */}
                    <div className={'modal-overlay' + (modalOpen ? ' open' : '')} onClick={() => setModalOpen(false)}>
                        <div className="modal" onClick={e => e.stopPropagation()}>
                            <div className="modal-header">
                                <div className="modal-title">Add New Brief</div>
                                <button className="modal-close" onClick={() => setModalOpen(false)}>×</button>
                            </div>
                            <div className="modal-body">
                                <div className="modal-field">
                                    <div className="sidebar-label">Client <span style={{color: 'var(--editorial)'}}>*</span></div>
                                    <input type="text" className="sidebar-input" value={newBrief.client} onChange={e => setNewBrief(prev => ({ ...prev, client: e.target.value }))} placeholder="Client name" />
                                </div>
                                <div className="modal-field">
                                    <div className="sidebar-label">Brief Title <span style={{color: 'var(--editorial)'}}>*</span></div>
                                    <input type="text" className="sidebar-input" value={newBrief.title} onChange={e => setNewBrief(prev => ({ ...prev, title: e.target.value }))} placeholder="Project / brief title" />
                                </div>
                                <div className="modal-field">
                                    <div className="sidebar-label">Pipeline Stage</div>
                                    <select className="sidebar-select" value={newBrief.stage} onChange={e => setNewBrief(prev => ({ ...prev, stage: e.target.value }))}>
                                        {PIPELINE_STAGES.filter(s => s !== 'Won' && s !== 'Lost').map(stage => <option key={stage} value={stage}>{stage}</option>)}
                                    </select>
                                </div>
                                <div className="modal-field">
                                    <div className="sidebar-label">Channel</div>
                                    <input type="text" className="sidebar-input" value={newBrief.channel} onChange={e => setNewBrief(prev => ({ ...prev, channel: e.target.value }))} placeholder="e.g. DMUK, DM Sport" />
                                </div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                                    <div className="modal-field">
                                        <div className="sidebar-label">Commercial Owner</div>
                                        <input type="text" className="sidebar-input" value={newBrief.commercialOwner} onChange={e => setNewBrief(prev => ({ ...prev, commercialOwner: e.target.value }))} placeholder="Name" />
                                    </div>
                                    <div className="modal-field">
                                        <div className="sidebar-label">Deliverables Requested</div>
                                        <input type="text" className="sidebar-input" value={newBrief.deliverableType} onChange={e => setNewBrief(prev => ({ ...prev, deliverableType: e.target.value }))} placeholder="e.g. TT/IG Content" />
                                    </div>
                                </div>
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-secondary" onClick={() => setModalOpen(false)}>Cancel</button>
                                <button className="btn btn-primary" onClick={submitNewBrief} disabled={!newBrief.title || !newBrief.client}>Add Brief</button>
                            </div>
                        </div>
                    </div>
                    
                    {/* Toast */}
                    <div className={'toast' + (toast.show ? ' visible' : '')}>
                        <div className="toast-dot"></div>
                        {toast.message}
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<CommercialHub />);
    </script>
</body>
</html>
