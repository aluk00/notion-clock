    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        
        const SALES_STATUSES = ['Not Started', 'Awaiting Brief', 'Brief Received', 'Drafting Response', 'Response Sent', 'Awaiting Feedback', 'In Production', 'Won', 'Lost', 'On Hold'];
        
        // Styles
        const S = {
            app: { display: 'flex', flexDirection: 'column', minHeight: '100vh' },
            header: { padding: '16px 24px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: '14px', background: 'var(--surface)', position: 'sticky', top: 0, zIndex: 100 },
            dots: { display: 'grid', gridTemplateColumns: 'repeat(2, 6px)', gap: '3px' },
            title: { fontSize: 15, fontWeight: 900, flex: 1, textTransform: 'uppercase', letterSpacing: '-0.02em' },
            main: { display: 'flex', flex: 1, overflow: 'hidden' },
            content: { flex: 1, overflowY: 'auto', padding: '20px 24px' },
            bento: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginBottom: 20 },
            section: { background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', marginBottom: 16, overflow: 'hidden' },
            sectionHeader: { padding: '14px 16px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10, background: 'var(--surface-alt)' },
            table: { width: '100%', borderCollapse: 'collapse' },
            th: { textAlign: 'left', padding: '10px 14px', fontSize: 8, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase', letterSpacing: '0.06em', background: 'var(--surface)', borderBottom: '1px solid var(--border)' },
            td: { padding: 14, borderBottom: '1px solid var(--surface-alt)', verticalAlign: 'middle' },
            sidebar: { width: 400, borderLeft: '1px solid var(--border)', background: 'var(--surface-alt)', display: 'flex', flexDirection: 'column', animation: 'slideIn 0.3s ease' },
            loading: { display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 60, gap: 12, color: 'var(--ink-muted)', fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em' },
            spinner: { width: 18, height: 18, border: '2px solid var(--border)', borderTopColor: 'var(--hero)', borderRadius: '50%', animation: 'spin 0.8s linear infinite' },
            empty: { padding: 30, textAlign: 'center', color: 'var(--ink-muted)', fontSize: 11, fontStyle: 'italic' }
        };
        
        // Helpers
        const getWeekString = () => {
            const now = new Date();
            const monday = new Date(now);
            monday.setDate(now.getDate() - now.getDay() + 1);
            return 'w/c ' + monday.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        };
        
        const getInitials = (name) => name ? name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2) : '?';
        
        const getTagType = (status) => {
            if (!status) return 'default';
            const s = status.toLowerCase();
            if (s.includes('live') || s.includes('won') || s.includes('approved') || s.includes('shoot')) return 'won';
            if (s.includes('edit') || s.includes('review') || s.includes('progress') || s.includes('production')) return 'progress';
            if (s.includes('wait') || s.includes('hold') || s.includes('block') || s.includes('await')) return 'waiting';
            if (s.includes('brief') || s.includes('lead') || s.includes('not started') || s.includes('ideation')) return 'brief';
            if (s.includes('response') || s.includes('sent') || s.includes('draft')) return 'response';
            return 'default';
        };
        
        const tagColors = { won: { bg: 'var(--success-soft)', color: 'var(--success)' }, progress: { bg: 'var(--hero-soft)', color: 'var(--hero)' }, waiting: { bg: 'var(--danger-soft)', color: 'var(--danger)' }, brief: { bg: 'var(--warning-soft)', color: 'var(--warning)' }, response: { bg: 'var(--creative-soft)', color: 'var(--creative)' }, default: { bg: 'var(--surface-alt)', color: 'var(--ink-muted)' } };
        
        const getProgressColor = (pct) => pct >= 80 ? 'var(--success)' : pct >= 40 ? 'var(--hero)' : pct > 0 ? 'var(--warning)' : 'var(--border)';
        
        const calculateProgress = (dels) => {
            if (!dels?.length) return 0;
            const done = dels.filter(d => ['live', 'approved', 'complete'].includes((d.status || '').toLowerCase())).length;
            return Math.round((done / dels.length) * 100);
        };
        
        const timeAgo = (ts) => {
            if (!ts) return '';
            const secs = Math.floor((new Date() - new Date(ts)) / 1000);
            if (secs < 60) return 'Just now';
            if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
            if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
            return Math.floor(secs / 86400) + 'd ago';
        };
        
        const formatCurrency = (val) => {
            if (val >= 1000000) return '£' + (val / 1000000).toFixed(1) + 'M';
            if (val >= 1000) return '£' + Math.round(val / 1000) + 'K';
            return '£' + Math.round(val || 0);
        };
        
        // Components
        const Dots = ({ color = 'var(--hero)' }) => (
            <div style={S.dots}>
                {[0,1,2,3].map(i => <span key={i} style={{ width: 6, height: 6, borderRadius: '50%', background: color, animation: `pulse 2.5s ease-in-out ${i * 0.2}s infinite` }} />)}
            </div>
        );
        
        const Badge = ({ type, children }) => {
            const bg = type === 'connected' ? 'var(--success-soft)' : type === 'offline' ? 'var(--warning-soft)' : 'var(--surface-alt)';
            const color = type === 'connected' ? 'var(--success)' : type === 'offline' ? 'var(--warning)' : 'var(--ink-sub)';
            return <span style={{ fontSize: 9, fontWeight: 700, padding: '5px 10px', borderRadius: 99, textTransform: 'uppercase', letterSpacing: '0.02em', background: bg, color }}>{children}</span>;
        };
        
        const Btn = ({ primary, danger, small, onClick, children, disabled }) => (
            <button disabled={disabled} onClick={onClick} style={{ padding: small ? '6px 10px' : '8px 14px', border: primary || danger ? 'none' : '1px solid var(--border)', borderRadius: 'var(--radius-sm)', fontSize: small ? 9 : 11, fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6, textTransform: 'uppercase', letterSpacing: '0.02em', background: disabled ? 'var(--border)' : danger ? 'var(--danger)' : primary ? 'var(--ink)' : 'var(--surface-alt)', color: disabled ? 'var(--ink-muted)' : (primary || danger) ? 'white' : 'var(--ink)', opacity: disabled ? 0.6 : 1 }}>{children}</button>
        );
        
        const Tag = ({ status }) => {
            const t = getTagType(status);
            const c = tagColors[t] || tagColors.default;
            return <span style={{ display: 'inline-flex', padding: '4px 8px', borderRadius: 4, fontSize: 7, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.04em', background: c.bg, color: c.color }}>{status || 'TBC'}</span>;
        };
        
        const PersonChip = ({ name, role }) => {
            const [hover, setHover] = useState(false);
            if (!name) return null;
            const bg = role === 'creative' ? 'var(--creative)' : role === 'production' ? 'var(--production)' : 'var(--sales)';
            return (
                <span onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '3px 8px 3px 3px', background: 'var(--surface-alt)', borderRadius: 99, fontSize: 9, fontWeight: 600, margin: 2, position: 'relative' }}>
                    <span style={{ width: 18, height: 18, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 7, fontWeight: 800, color: 'white', background: bg }}>{getInitials(name)}</span>
                    {hover && <span style={{ position: 'absolute', bottom: 'calc(100% + 6px)', left: '50%', transform: 'translateX(-50%)', background: 'var(--ink)', color: 'white', padding: '6px 10px', borderRadius: 6, fontSize: 9, fontWeight: 600, whiteSpace: 'nowrap', zIndex: 50 }}>{name}</span>}
                </span>
            );
        };
        
        const Progress = ({ pct }) => (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <div style={{ height: 6, background: 'var(--surface-alt)', borderRadius: 3, overflow: 'hidden', width: 60 }}>
                    <div style={{ height: '100%', borderRadius: 3, width: `${pct}%`, background: getProgressColor(pct), transition: 'width 0.5s ease' }} />
                </div>
                <span style={{ fontSize: 10, fontWeight: 800, color: 'var(--ink-sub)', fontVariantNumeric: 'tabular-nums' }}>{pct}%</span>
            </div>
        );
        
        const Card = ({ accent, span, rowSpan, children }) => (
            <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', padding: 16, display: 'flex', flexDirection: 'column', borderTop: `3px solid ${accent || 'transparent'}`, gridColumn: span ? `span ${span}` : undefined, gridRow: rowSpan ? `span ${rowSpan}` : undefined }}>{children}</div>
        );
        
        // Main App
        const CommercialHub = () => {
            const [projects, setProjects] = useState([]);
            const [deliverables, setDeliverables] = useState([]);
            const [annotations, setAnnotations] = useState({});
            const [selectedId, setSelectedId] = useState(null);
            const [currentNote, setCurrentNote] = useState({ status: '', notes: '' });
            const [hasChanges, setHasChanges] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [dataSource, setDataSource] = useState('loading'); // 'api', 'firebase', 'sample'
            const [showModal, setShowModal] = useState(false);
            const [saving, setSaving] = useState(false);
            const [authReady, setAuthReady] = useState(false);
            
            // Auth on mount
            useEffect(() => {
                auth.signInAnonymously()
                    .then(() => { console.log('Auth ready'); setAuthReady(true); })
                    .catch(e => { console.error('Auth failed:', e); setAuthReady(true); });
            }, []);
            
            // Load data - try API first, then Firebase, then sample data
            const loadData = useCallback(async () => {
                console.log('Loading data...');
                
                // Try API first
                try {
                    const [pRes, dRes] = await Promise.all([
                        fetch(API_URL + '/projects'),
                        fetch(API_URL + '/deliverables')
                    ]);
                    const pData = await pRes.json();
                    const dData = await dRes.json();
                    
                    if (pData.success && pData.projects?.length > 0) {
                        console.log('Loaded from API:', pData.projects.length, 'projects');
                        setProjects(pData.projects);
                        setDeliverables(dData.deliverables || []);
                        setDataSource('api');
                        
                        // Still load annotations from Firebase
                        try {
                            const snap = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_annotations').get();
                            const annots = {};
                            snap.forEach(d => { annots[d.id] = d.data(); });
                            setAnnotations(annots);
                        } catch (e) { console.log('No annotations yet'); }
                        
                        setIsLoading(false);
                        return;
                    }
                } catch (e) {
                    console.log('API not available:', e.message);
                }
                
                // Try Firebase projects
                try {
                    const projSnap = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_projects').get();
                    if (!projSnap.empty) {
                        const fbProjects = [];
                        projSnap.forEach(d => fbProjects.push({ id: d.id, ...d.data() }));
                        console.log('Loaded from Firebase:', fbProjects.length, 'projects');
                        setProjects(fbProjects);
                        
                        // Load deliverables
                        const delSnap = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_deliverables').get();
                        const fbDels = [];
                        delSnap.forEach(d => fbDels.push({ id: d.id, ...d.data() }));
                        setDeliverables(fbDels);
                        
                        // Load annotations
                        const annSnap = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_annotations').get();
                        const annots = {};
                        annSnap.forEach(d => { annots[d.id] = d.data(); });
                        setAnnotations(annots);
                        
                        setDataSource('firebase');
                        setIsLoading(false);
                        return;
                    }
                } catch (e) {
                    console.log('Firebase projects not available:', e.message);
                }
                
                // Fall back to sample data
                console.log('Using sample data');
                setProjects(SAMPLE_PROJECTS);
                setDeliverables(SAMPLE_DELIVERABLES);
                setAnnotations(SAMPLE_ANNOTATIONS);
                setDataSource('sample');
                setIsLoading(false);
            }, []);
            
            useEffect(() => {
                if (authReady) loadData();
            }, [authReady, loadData]);
            
            // Seed sample data to Firebase
            const seedToFirebase = async () => {
                if (!confirm('This will save all sample projects, deliverables, and annotations to Firebase. Continue?')) return;
                setSaving(true);
                try {
                    // Save projects
                    for (const p of SAMPLE_PROJECTS) {
                        await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_projects').doc(p.id).set(p);
                    }
                    // Save deliverables
                    for (const d of SAMPLE_DELIVERABLES) {
                        await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_deliverables').doc(d.id).set(d);
                    }
                    // Save annotations
                    for (const [pid, ann] of Object.entries(SAMPLE_ANNOTATIONS)) {
                        await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_annotations').doc(pid).set(ann);
                    }
                    alert('Sample data saved to Firebase!');
                    loadData();
                } catch (e) {
                    console.error('Seed failed:', e);
                    alert('Error saving to Firebase: ' + e.message);
                }
                setSaving(false);
            };
            
            // Auto-refresh
            useEffect(() => {
                if (!authReady) return;
                const interval = setInterval(() => { if (!hasChanges && !showModal) loadData(); }, 60000);
                return () => clearInterval(interval);
            }, [hasChanges, showModal, authReady, loadData]);
            
            // Categorise
            const { production, pipeline, stats } = useMemo(() => {
                const prod = [], pipe = [];
                projects.forEach(p => {
                    const stage = (p.dealStage || '').toLowerCase();
                    const status = (p.projectStatus || '').toLowerCase();
                    const dels = deliverables.filter(d => d.campaignId === p.id);
                    const progress = calculateProgress(dels);
                    const annot = annotations[p.id] || {};
                    const enriched = { ...p, _dels: dels, _progress: progress, _annot: annot };
                    
                    if (stage.includes('won') || stage.includes('live') || stage.includes('production') || status.includes('in progress') || status.includes('filming') || status.includes('edit') || status.includes('pre-production')) {
                        prod.push(enriched);
                    } else if (!stage.includes('lost')) {
                        pipe.push(enriched);
                    }
                });
                return { production: prod, pipeline: pipe, stats: { live: prod.length, pipeline: pipe.length, pipelineValue: pipe.reduce((s, p) => s + (p.dealValue || 0), 0), totalValue: [...prod, ...pipe].reduce((s, p) => s + (p.dealValue || 0), 0) } };
            }, [projects, deliverables, annotations]);
            
            const selected = useMemo(() => selectedId ? [...production, ...pipeline].find(p => p.id === selectedId) : null, [selectedId, production, pipeline]);
            
            const selectProject = (id) => {
                setSelectedId(id);
                const annot = annotations[id] || {};
                setCurrentNote({ status: annot.status || '', notes: annot.notes || '' });
                setHasChanges(false);
            };
            
            const closePanel = () => { setSelectedId(null); setCurrentNote({ status: '', notes: '' }); setHasChanges(false); };
            
            const saveAnnotation = async () => {
                if (!selected) return;
                setSaving(true);
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_annotations').doc(selected.id).set({
                        ...currentNote,
                        projectTitle: selected.title,
                        client: selected.client,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setAnnotations(prev => ({ ...prev, [selected.id]: currentNote }));
                    setHasChanges(false);
                } catch (e) { console.error(e); alert('Error saving'); }
                setSaving(false);
            };
            
            const updateDeliverable = async (delId, field, value) => {
                // Update local state
                setDeliverables(prev => prev.map(d => d.id === delId ? { ...d, [field]: value } : d));
                // Save to Firebase
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_deliverables').doc(delId).update({ [field]: value });
                } catch (e) { console.error('Update failed:', e); }
            };
            
            // Render
            if (isLoading) {
                return <div style={S.loading}><div style={S.spinner} />Loading...</div>;
            }
            
            const renderLeads = (p) => {
                const leads = [];
                if (p.productionLead?.length) p.productionLead.forEach(l => leads.push(<PersonChip key={'p'+l} name={l} role="production" />));
                if (p.creativeLead?.length) p.creativeLead.forEach(l => leads.push(<PersonChip key={'c'+l} name={l} role="creative" />));
                return leads.length ? leads : <span style={{ fontSize: 10, color: 'var(--ink-sub)' }}>Unassigned</span>;
            };
            
            const renderTable = (items, type) => {
                if (!items.length) return <div style={S.empty}>No {type === 'production' ? 'live campaigns' : 'briefs in pipeline'}</div>;
                return (
                    <table style={S.table}>
                        <thead><tr>
                            <th style={S.th}>Client / Project</th>
                            <th style={S.th}>{type === 'production' ? 'Phase' : 'Stage'}</th>
                            <th style={S.th}>Channel</th>
                            <th style={S.th}>Leads</th>
                            <th style={S.th}>Progress</th>
                            <th style={S.th}>Update</th>
                        </tr></thead>
                        <tbody>
                            {items.map(p => (
                                <tr key={p.id} onClick={() => selectProject(p.id)} style={{ cursor: 'pointer', background: selectedId === p.id ? 'var(--hero-soft)' : 'transparent' }}>
                                    <td style={S.td}><div style={{ fontSize: 12, fontWeight: 700, marginBottom: 2 }}>{p.client || 'TBC'}</div><div style={{ fontSize: 10, color: 'var(--ink-sub)' }}>{p.title || ''}</div></td>
                                    <td style={S.td}><Tag status={type === 'production' ? (p.projectStatus || p.dealStage) : p.dealStage} /></td>
                                    <td style={S.td}><span style={{ fontSize: 10, color: 'var(--ink-sub)' }}>{p.channel || '—'}</span></td>
                                    <td style={S.td}>{renderLeads(p)}</td>
                                    <td style={S.td}><Progress pct={p._progress} /><span style={{ fontSize: 9, color: 'var(--ink-muted)' }}>{p._dels.length} assets</span></td>
                                    <td style={S.td}><div style={{ fontSize: 10, color: 'var(--ink-sub)', fontStyle: 'italic', maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p._annot?.notes || '—'}</div></td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                );
            };
            
            return (
                <div style={S.app}>
                    <div style={S.header}>
                        <Dots />
                        <h1 style={S.title}>Commercial Hub</h1>
                        <Badge type="week">{getWeekString()}</Badge>
                        <Badge type={dataSource === 'api' ? 'connected' : 'offline'}>
                            {dataSource === 'api' ? '● Notion' : dataSource === 'firebase' ? '● Firebase' : '● Sample Data'}
                        </Badge>
                        <Btn onClick={loadData}>↻</Btn>
                        {dataSource === 'sample' && <Btn primary onClick={seedToFirebase} disabled={saving}>{saving ? 'Saving...' : '⬆ Save to Firebase'}</Btn>}
                    </div>
                    
                    <div style={S.main}>
                        <div style={S.content}>
                            <div style={S.bento}>
                                <Card accent="var(--hero)">
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}><Dots /><span style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Live Campaigns</span></div>
                                    <div style={{ fontSize: 36, fontWeight: 900, color: 'var(--hero)', fontVariantNumeric: 'tabular-nums' }}>{String(stats.live).padStart(2, '0')}</div>
                                    <div style={{ marginTop: 'auto', paddingTop: 12, borderTop: '1px solid var(--surface-alt)', fontSize: 9, color: 'var(--ink-muted)' }}>In Production</div>
                                </Card>
                                <Card accent="var(--success)">
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}><Dots color="var(--success)" /><span style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Pipeline</span></div>
                                    <div style={{ fontSize: 36, fontWeight: 900, color: 'var(--success)', fontVariantNumeric: 'tabular-nums' }}>{String(stats.pipeline).padStart(2, '0')}</div>
                                    <div style={{ marginTop: 'auto', paddingTop: 12, borderTop: '1px solid var(--surface-alt)', fontSize: 9, color: 'var(--ink-muted)' }}>{formatCurrency(stats.pipelineValue)} pipeline</div>
                                </Card>
                                <Card accent="var(--creative)" span={2}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}><Dots color="var(--creative)" /><span style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Total Value</span></div>
                                    <div style={{ fontSize: 36, fontWeight: 900, color: 'var(--creative)', fontVariantNumeric: 'tabular-nums' }}>{formatCurrency(stats.totalValue)}</div>
                                    <div style={{ marginTop: 'auto', paddingTop: 12, borderTop: '1px solid var(--surface-alt)', fontSize: 9, color: 'var(--ink-muted)' }}>{projects.length} total projects</div>
                                </Card>
                            </div>
                            
                            <div style={S.section}>
                                <div style={S.sectionHeader}><span style={{ fontSize: 14 }}>📹</span><span style={{ fontSize: 11, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.02em', flex: 1 }}>Production / Live Campaigns</span><span style={{ fontSize: 9, fontWeight: 700, padding: '4px 10px', borderRadius: 99, background: 'var(--hero-soft)', color: 'var(--hero)' }}>{stats.live}</span></div>
                                {renderTable(production, 'production')}
                            </div>
                            
                            <div style={S.section}>
                                <div style={S.sectionHeader}><span style={{ fontSize: 14 }}>📋</span><span style={{ fontSize: 11, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.02em', flex: 1 }}>Inbound Briefs / Pipeline</span><span style={{ fontSize: 9, fontWeight: 700, padding: '4px 10px', borderRadius: 99, background: 'var(--hero-soft)', color: 'var(--hero)' }}>{stats.pipeline}</span></div>
                                {renderTable(pipeline, 'pipeline')}
                            </div>
                        </div>
                        
                        {selected && (
                            <div style={S.sidebar}>
                                <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--border)', background: 'var(--surface)', display: 'flex', alignItems: 'center', gap: 10 }}>
                                    <Dots /><span style={{ fontSize: 13, fontWeight: 800, flex: 1, textTransform: 'uppercase' }}>{selected.client}</span>
                                    <button onClick={closePanel} style={{ width: 28, height: 28, border: 'none', background: 'var(--surface-alt)', borderRadius: 6, cursor: 'pointer', fontSize: 14 }}>✕</button>
                                </div>
                                <div style={{ flex: 1, overflowY: 'auto', padding: '16px 20px' }}>
                                    <div style={{ marginBottom: 16, padding: 14, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)' }}>
                                        <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase', marginBottom: 8 }}>Project Details</div>
                                        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>{selected.title}</div>
                                        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 8 }}><Tag status={selected.dealStage} /><Tag status={selected.projectStatus} /></div>
                                        <div style={{ fontSize: 10, color: 'var(--ink-sub)' }}>Channel: {selected.channel || 'TBC'}</div>
                                        {selected.dealValue && <div style={{ fontSize: 10, color: 'var(--ink-sub)' }}>Value: {formatCurrency(selected.dealValue)}</div>}
                                    </div>
                                    
                                    <div style={{ background: 'var(--hero-soft)', border: '1px solid var(--hero)', borderRadius: 'var(--radius-sm)', padding: 14, marginBottom: 16 }}>
                                        <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--hero)', textTransform: 'uppercase', marginBottom: 8 }}>Sales Tracking</div>
                                        <select value={currentNote.status} onChange={(e) => { setCurrentNote(n => ({ ...n, status: e.target.value })); setHasChanges(true); }} style={{ width: '100%', padding: '8px 10px', border: '1px solid var(--border)', borderRadius: 6, fontSize: 11, fontFamily: 'inherit', background: 'var(--surface)', marginBottom: 10 }}>
                                            <option value="">Select status...</option>
                                            {SALES_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                        <textarea value={currentNote.notes} onChange={(e) => { setCurrentNote(n => ({ ...n, notes: e.target.value })); setHasChanges(true); }} placeholder="Notes, follow-ups..." style={{ width: '100%', minHeight: 70, padding: 10, border: '1px solid var(--border)', borderRadius: 6, fontSize: 11, fontFamily: 'inherit', resize: 'vertical' }} />
                                    </div>
                                    
                                    <div>
                                        <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase', marginBottom: 10 }}>Deliverables ({selected._dels.length})</div>
                                        {selected._dels.length === 0 ? <div style={S.empty}>No deliverables yet</div> : selected._dels.map(d => (
                                            <div key={d.id} style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', padding: 12, marginBottom: 8 }}>
                                                <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 6 }}>{d.title}</div>
                                                <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}><Tag status={d.status} />{d.format && <Tag status={d.format} />}</div>
                                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                                                    <select value={d.status || ''} onChange={(e) => updateDeliverable(d.id, 'status', e.target.value)} style={{ padding: '6px 8px', border: '1px solid var(--border)', borderRadius: 4, fontSize: 10, fontFamily: 'inherit' }}>
                                                        <option value="Briefed">Briefed</option>
                                                        <option value="In Progress">In Progress</option>
                                                        <option value="Edit">Edit</option>
                                                        <option value="Review">Review</option>
                                                        <option value="Approved">Approved</option>
                                                        <option value="Live">Live</option>
                                                    </select>
                                                    <select value={d.deskState || ''} onChange={(e) => updateDeliverable(d.id, 'deskState', e.target.value)} style={{ padding: '6px 8px', border: '1px solid var(--border)', borderRadius: 4, fontSize: 10, fontFamily: 'inherit' }}>
                                                        <option value="With Creative">With Creative</option>
                                                        <option value="With Design">With Design</option>
                                                        <option value="With Production">With Production</option>
                                                        <option value="With Edit">With Edit</option>
                                                        <option value="With Review">With Review</option>
                                                        <option value="Live">Live</option>
                                                    </select>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div style={{ padding: '16px 20px', borderTop: '1px solid var(--border)', background: 'var(--surface)' }}>
                                    <Btn primary disabled={!hasChanges || saving} onClick={saveAnnotation} style={{ width: '100%' }}>{saving ? 'Saving...' : hasChanges ? 'Save Notes' : 'No Changes'}</Btn>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<CommercialHub />);
    </script>
</body>
</html>
