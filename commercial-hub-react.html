<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Hub | DMG Command Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --hero: #21A0D8; --hero-dark: #1B8BC0; --hero-soft: rgba(33, 160, 216, 0.08); --ink: #1C1C1C; --ink-secondary: #4A5568; --ink-muted: #9CA3AF; --border: #E2E8F0; --border-light: #F1F5F9; --surface: #FFFFFF; --bg: #FFFFFF; --success: #10B981; --success-soft: rgba(16, 185, 129, 0.1); --warning: #F59E0B; --warning-soft: rgba(245, 158, 11, 0.1); --danger: #EF4444; --danger-soft: rgba(239, 68, 68, 0.08); --purple: #8B5CF6; --purple-soft: rgba(139, 92, 246, 0.1); --font: 'Inter', sans-serif; --radius-card: 12px; --radius-input: 8px; --radius-pill: 6px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--ink); padding: 24px; -webkit-font-smoothing: antialiased; }
        
        /* Layout & Typography */
        .hero-header { background: var(--surface); padding: 20px 24px; border: 1px solid var(--border); border-radius: var(--radius-card); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-content h1 { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 2px; }
        .header-content p { font-size: 11px; font-weight: 600; color: var(--ink-muted); }
        .header-actions { display: flex; gap: 10px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 4px; }
        .dot-grid span { width: 6px; height: 6px; border-radius: 50%; background: var(--hero); animation: pulse 2.4s infinite; }
        
        /* Stats */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 18px 20px; transition: 0.2s; position: relative; overflow: hidden; }
        .stat-card:hover { border-color: var(--hero); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--border); }
        .stat-card.blue::before { background: var(--hero); }
        .stat-card.orange::before { background: var(--warning); }
        .stat-card.green::before { background: var(--success); }
        .stat-card.red::before { background: var(--danger); }
        .stat-label { font-size: 10px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; }
        .stat-value { font-size: 32px; font-weight: 900; letter-spacing: -0.03em; }

        /* Lists */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; display: flex; gap: 10px; align-items: center; }
        .badge { background: var(--hero); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; }
        .list-header { display: grid; padding: 0 20px 10px; font-size: 10px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .list-container { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; padding-right: 4px; }
        .card-row { display: grid; align-items: center; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-input); cursor: pointer; transition: all 0.2s ease; }
        .card-row:hover { border-color: var(--hero); box-shadow: 0 4px 16px rgba(33,160,216,0.08); transform: translateY(-1px); }
        .prod-grid { grid-template-columns: 44px 2.2fr 130px 1fr 100px 100px 90px; gap: 16px; }
        .pipe-grid { grid-template-columns: 2.2fr 130px 1fr 1.2fr 100px 90px; gap: 16px; }

        /* Cells */
        .cell-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
        .cell-sub, .cell-text { font-size: 11px; color: var(--ink-secondary); }
        .cell-person { font-size: 12px; font-weight: 600; }
        .cell-date { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .cell-date.overdue { color: var(--danger); }
        .asset-count { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: var(--hero); text-transform: uppercase; margin-top: 4px; }
        
        /* Pills */
        .pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .pill .dot { width: 5px; height: 5px; border-radius: 50%; }
        .pill-prepro { background: var(--purple-soft); color: #7C3AED; } .pill-prepro .dot { background: #7C3AED; }
        .pill-shoot { background: var(--hero-soft); color: var(--hero); } .pill-shoot .dot { background: var(--hero); }
        .pill-edit { background: var(--warning-soft); color: #B45309; } .pill-edit .dot { background: #B45309; }
        .pill-live { background: var(--success-soft); color: var(--success); } .pill-live .dot { background: var(--success); }
        .pill-pitch { background: var(--hero-soft); color: var(--hero); } .pill-pitch .dot { background: var(--hero); }

        /* Utils */
        .expand-btn { width: 32px; height: 32px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary); display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .expand-btn:hover { border-color: var(--hero); color: var(--hero); }
        .expand-btn.expanded { background: var(--hero); color: white; border-color: var(--hero); }
        .deliverables-tray { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--hero); border-radius: 0 0 8px 8px; margin: -8px 0 8px 0; padding: 20px; animation: slideUp 0.3s; }
        .deliverables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .del-card { background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
        
        /* Sidebar */
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 500; }
        .sidebar-overlay.open { opacity: 1; pointer-events: all; }
        .sidebar { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 95vw; background: white; transform: translateX(100%); transition: 0.3s; z-index: 501; display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(0,0,0,0.2); }
        .sidebar.open { transform: translateX(0); }
        .sb-header { padding: 24px 32px; background: linear-gradient(135deg, var(--hero), var(--hero-dark)); color: white; }
        .sb-body { padding: 24px 32px; flex: 1; overflow-y: auto; }
        .sb-actions { padding: 20px 32px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; background: #F8FAFC; }

        /* Form */
        .field { margin-bottom: 20px; }
        .label { display: block; font-size: 10px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; margin-bottom: 8px; }
        .input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px; }
        .input:focus { border-color: var(--hero); outline: none; }
        
        /* Generator */
        .generator { background: #F0F9FF; padding: 16px; border-radius: 12px; border: 1px dashed var(--hero); margin-top: 24px; }
        .gen-row { display: flex; gap: 10px; margin-top: 10px; }
        
        /* Buttons */
        .btn { padding: 10px 18px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .btn-primary { background: var(--hero); color: white; }
        .btn-ghost { background: transparent; color: var(--ink-secondary); border-color: var(--border); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }

        /* Dropdown */
        .dropdown { position: relative; }
        .dropdown-trigger { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: white; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .dropdown-menu { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; display: none; z-index: 100; max-height: 200px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .dropdown-menu.open { display: block; }
        .dropdown-option { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border-light); }
        .dropdown-option:hover { background: var(--hero-soft); color: var(--hero); }

        /* Toast */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1E293B; color: white; padding: 12px 24px; border-radius: 30px; font-size: 12px; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 9999; }
        .toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        /* Loading */
        .loading { text-align: center; padding: 40px; color: var(--ink-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; }
        @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="hero-header">
        <div class="header-left">
            <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
            <div class="header-content">
                <h1>Commercial Hub</h1>
                <p>Master Ledger: New Media Hub (1) • 2025-09-03</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-ghost" onclick="loadData()">↻ Refresh</button>
            <button class="btn btn-primary">+ New Brief</button>
        </div>
    </header>

    <div id="offline-warning"></div>

    <main>
        <div class="stats-row">
            <div class="stat-card blue"><span class="stat-label">In Production</span><span class="stat-value blue" id="stat-prod">0</span></div>
            <div class="stat-card orange"><span class="stat-label">Pipeline</span><span class="stat-value" id="stat-pipe">0</span></div>
            <div class="stat-card green"><span class="stat-label">Live (MTD)</span><span class="stat-value green" id="stat-live">0</span></div>
            <div class="stat-card red"><span class="stat-label">Action Req</span><span class="stat-value red" id="stat-action">0</span></div>
        </div>

        <section class="section">
            <div class="section-header">
                <div class="section-title">Active Production <span class="badge" id="count-prod">0</span></div>
                <div class="sync-indicator" style="color:var(--success)">● Syncs to Notion</div>
            </div>
            <div class="list-header prod-grid">
                <span></span><span>Client / Project</span><span>Status</span><span>Vertical</span><span>Sales</span><span>Creative</span><span>Due</span>
            </div>
            <div class="list-container" id="production-list">
                <div class="loading">Loading...</div>
            </div>
        </section>

        <section class="section">
            <div class="section-header"><div class="section-title">Pipeline <span class="badge" id="count-pipe">0</span></div></div>
            <div class="list-header pipe-grid">
                <span>Client / Brief</span><span>Stage</span><span>Vertical</span><span>Assets</span><span>Sales</span><span>Due</span>
            </div>
            <div class="list-container" id="pipeline-list"></div>
        </section>
    </main>

    <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div id="sidebar-content"></div>
    </div>

    <div class="toast" id="toast"><span>Saved</span></div>

    <script>
    // ========================================
    // CONFIGURATION
    // ========================================
    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
    const APP_ID = "dmg-command-centre-native";

    const OPTIONS = {
        verticals: ['DMUK', 'DM Sport', 'DM Main', 'Metro UK', 'This is Money', 'Spotlight'],
        salesLeads: ['Zach', 'Isobel', 'Maxine', 'Daniel', 'Sarah'],
        creatives: ['Ellie', 'Hugo', 'Dan Q', 'Sophie', 'Alex'],
        prodStatuses: ['Pre-Production', 'Shoot', 'Edit', 'Client Approval', 'Live'],
        dealStages: ['Ideation', 'Pitch', 'Negotiation', 'Won'],
        assetTypes: ['Street Talks', 'Headlines', 'Budget Builder', 'Side Hustles', 'Ask the Nation']
    };

    let projects = [];
    let selectedProject = null;
    let expandedRows = new Set();
    let generatedAssets = [];

    // ========================================
    // INIT & DATA
    // ========================================
    document.addEventListener('DOMContentLoaded', loadData);

    async function loadData() {
        const prodList = document.getElementById('production-list');
        prodList.innerHTML = '<div class="loading">📡 Connecting to Master Ledger...</div>';
        
        try {
            const res = await fetch(API_URL + '/projects');
            const data = await res.json();
            
            if(data.success) {
                projects = data.projects.map(p => ({
                    id: p.id,
                    title: p.title || "Untitled",
                    client: p.client || "Internal",
                    dealStage: p.dealStage || "Pitch",
                    prodStatus: p.productionStatus || "Pre-Production",
                    vertical: p.vertical || "",
                    salesLead: p.salesLead || "",
                    creativeLead: Array.isArray(p.creativeLead) ? p.creativeLead[0]?.name : (p.creativeLead || ""), 
                    dueDate: p.internalDueDate || p.dueDate || "",
                    assetsNeeded: p.assetsNeeded || "",
                    assetCount: parseInt(p.deliverableCount) || 0,
                    deliverables: [] 
                }));
                render();
                showToast('Synced');
            }
        } catch (e) {
            console.error(e);
            prodList.innerHTML = '<div class="loading" style="color:red">Failed to connect to API</div>';
            document.getElementById('offline-warning').innerText = "⚠️ API Error: Check console for details";
        }
    }

    // ========================================
    // RENDER
    // ========================================
    function render() {
        const prodCont = document.getElementById('production-list');
        const pipeCont = document.getElementById('pipeline-list');
        prodCont.innerHTML = ''; pipeCont.innerHTML = '';
        
        let counts = { prod: 0, pipe: 0, live: 0, action: 0 };

        projects.forEach(p => {
            const isWon = ['won','live','campaign complete','production'].some(k => (p.dealStage||'').toLowerCase().includes(k));
            
            if (isWon) {
                counts.prod++;
                if((p.prodStatus||'').toLowerCase().includes('live')) counts.live++;
                
                // Production Row
                const div = document.createElement('div');
                div.innerHTML = renderProdRow(p);
                // Handle click on row (except expand button)
                div.firstElementChild.onclick = (e) => { 
                    if(!e.target.classList.contains('expand-btn')) openSidebar(p.id); 
                };
                prodCont.appendChild(div);
                
                // Tray
                if (expandedRows.has(p.id)) {
                    prodCont.insertAdjacentHTML('beforeend', renderTray(p));
                }
            } else {
                counts.pipe++;
                if((p.dealStage||'').toLowerCase().includes('pitch')) counts.action++;
                const div = document.createElement('div');
                div.innerHTML = renderPipeRow(p);
                div.firstElementChild.onclick = () => openSidebar(p.id); // Pipeline also opens sidebar
                pipeCont.appendChild(div);
            }
        });

        document.getElementById('stat-prod').innerText = counts.prod;
        document.getElementById('count-prod').innerText = counts.prod;
        document.getElementById('stat-pipe').innerText = counts.pipe;
        document.getElementById('count-pipe').innerText = counts.pipe;
        document.getElementById('stat-live').innerText = counts.live;
        document.getElementById('stat-action').innerText = counts.action;
    }

    function renderProdRow(p) {
        let badge = p.assetCount > 0 ? `<div class="asset-count">📄 ${p.assetCount} Assets</div>` : '';
        return `
        <div class="card-row prod-grid">
            <div class="cell-expand"><div class="expand-btn ${expandedRows.has(p.id)?'expanded':''}" onclick="toggleExpand('${p.id}')">${expandedRows.has(p.id)?'−':'+'}</div></div>
            <div><div class="cell-title">${p.client}</div><div class="cell-sub">${p.title}</div>${badge}</div>
            <div><span class="pill pill-prepro"><span class="dot"></span>${p.prodStatus}</span></div>
            <div class="cell-sub">${p.vertical}</div>
            <div class="cell-person">${p.salesLead || '--'}</div>
            <div class="cell-person">${p.creativeLead || '--'}</div>
            <div class="cell-date ${isOverdue(p.dueDate)?'overdue':''}">${formatDate(p.dueDate)}</div>
        </div>`;
    }

    function renderPipeRow(p) {
        return `
        <div class="card-row pipe-grid">
            <div><div class="cell-title">${p.client}</div><div class="cell-sub">${p.title}</div></div>
            <div><span class="pill pill-pitch"><span class="dot"></span>${p.dealStage}</span></div>
            <div class="cell-sub">${p.vertical}</div>
            <div class="cell-sub" style="color:var(--purple)">${p.assetsNeeded || '--'}</div>
            <div class="cell-person">${p.salesLead || '--'}</div>
            <div class="cell-date">${formatDate(p.dueDate)}</div>
        </div>`;
    }

    function renderTray(p) {
        if(!p.deliverables || p.deliverables.length === 0) return `<div class="deliverables-tray" style="text-align:center; color:#999; font-size:11px;">Loading deliverables...</div>`;
        const items = p.deliverables.map(d => `
            <div class="del-card">
                <div class="del-title">${d.title}</div>
                <div class="del-type">${d.type}</div>
                <div style="display:flex; justify-content:space-between; margin-top:8px;">
                    <span class="del-status pending">${d.status}</span>
                    <span class="del-meta-value">${d.assignee}</span>
                </div>
            </div>`).join('');
        return `<div class="deliverables-tray"><div class="deliverables-grid">${items}</div></div>`;
    }

    // ========================================
    // ACTIONS
    // ========================================
    window.toggleExpand = async (id) => {
        if(expandedRows.has(id)) expandedRows.delete(id);
        else expandedRows.add(id);
        
        const idx = projects.findIndex(p => p.id === id);
        render(); // Update UI immediately

        if(expandedRows.has(id)) {
            try {
                const res = await fetch(`${API_URL}/deliverables/project/${id}`);
                const data = await res.json();
                if(data.success) {
                    projects[idx].deliverables = data.deliverables.map(d => ({
                        id: d.id, title: d.title, type: d.format || 'Asset', status: d.status,
                        assignee: d.assignedEditor?.[0]?.name || 'Unassigned'
                    }));
                    render();
                }
            } catch(e) { console.error(e); }
        }
    };

    window.openSidebar = async (id) => {
        selectedProject = projects.find(p => p.id === id);
        const content = document.getElementById('sidebar-content');
        
        // Use BACKTICKS for multiline strings
        content.innerHTML = `
            <div class="sb-header">
                <button class="sb-close" onclick="closeSidebar()">×</button>
                <div class="sb-label">PROJECT DETAILS</div>
                <div class="sb-title">${selectedProject.client}</div>
            </div>
            <div class="sb-body">
                <div class="field"><label class="label">Title</label><input class="input" id="sb-title" value="${selectedProject.title}"></div>
                <div class="field"><label class="label">Status</label>${createDropdown('sb-status', OPTIONS.prodStatuses, selectedProject.prodStatus)}</div>
                <div class="field"><label class="label">Sales Lead</label>${createDropdown('sb-sales', OPTIONS.salesLeads, selectedProject.salesLead)}</div>
                
                <div class="generator">
                    <div class="label" style="color:var(--hero)">ASSET GENERATOR</div>
                    <div class="gen-row">
                        <input type="number" class="gen-count-input" id="gen-count" value="1" min="1" max="20">
                        <select id="gen-type" class="input" style="flex:1">
                            ${OPTIONS.assetTypes.map(t => `<option>${t}</option>`).join('')}
                        </select>
                        <button class="btn btn-primary" id="btn-gen" onclick="generateAssets()">GENERATE</button>
                    </div>
                    <div id="gen-list" class="gen-list" style="margin-top:10px;"></div>
                </div>
            </div>
            <div class="sb-actions">
                <button class="btn btn-success" onclick="saveChanges()">SAVE CHANGES</button>
            </div>
        `;
        
        document.getElementById('overlay').classList.add('open');
        document.getElementById('sidebar').classList.add('open');

        // Fetch assets for sidebar list
        const res = await fetch(`${API_URL}/deliverables/project/${id}`);
        const data = await res.json();
        if(data.success) {
            generatedAssets = data.deliverables;
            document.getElementById('gen-list').innerHTML = generatedAssets.map((a,i) => 
                `<div class="gen-item"><span class="gen-num">#${i+1}</span> <span>${a.title}</span></div>`
            ).join('');
        }
    };

    window.generateAssets = async () => {
        const btn = document.getElementById('btn-gen');
        const count = document.getElementById('gen-count').value;
        const type = document.getElementById('gen-type').value;
        
        btn.innerText = "Creating..."; btn.disabled = true;

        const newDeliverables = [];
        for(let i=1; i<=count; i++) newDeliverables.push({ title: `${type} #${i}`, format: type, status: 'Briefed' });

        try {
            await fetch(`${API_URL}/deliverables/bulk`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ projectId: selectedProject.id, deliverables: newDeliverables })
            });
            showToast("Assets Created");
            openSidebar(selectedProject.id); // Refresh sidebar
        } catch(e) { alert("API Error"); }
        finally { btn.innerText = "GENERATE"; btn.disabled = false; }
    };

    window.saveChanges = async () => {
        const newTitle = document.getElementById('sb-title').value;
        const newStatus = document.getElementById('value-sb-status').value;
        
        await fetch(`${API_URL}/projects/${selectedProject.id}`, {
            method: 'PATCH', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title: newTitle, productionWorkflowStatus: newStatus })
        });
        showToast("Saved");
        closeSidebar();
        loadData();
    };

    window.closeSidebar = () => {
        document.getElementById('overlay').classList.remove('open');
        document.getElementById('sidebar').classList.remove('open');
    };

    function createDropdown(id, opts, sel) {
        let val = sel || 'Select...';
        return `<div class="dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('open')">
            <div class="dropdown-trigger"><span>${val}</span><span>▼</span></div>
            <div class="dropdown-menu">
                ${opts.map(o => `<div class="dropdown-option" onclick="selectOption('${id}', '${o}', this)">${o}</div>`).join('')}
            </div>
        </div><input type="hidden" id="value-${id}" value="${sel}">`;
    }
    
    window.selectOption = (id, val, el) => {
        event.stopPropagation();
        document.getElementById(`value-${id}`).value = val;
        el.closest('.dropdown').querySelector('.dropdown-trigger span').innerText = val;
        el.closest('.dropdown-menu').classList.remove('open');
    };

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.classList.add('visible');
        setTimeout(() => t.classList.remove('visible'), 3000);
    }

    function isOverdue(d) { return d ? new Date(d) < new Date() : false; }
    function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '--'; }

    </script>
</body>
</html>
