<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Hub | DMG Command Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase Compat SDK (works reliably) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        :root {
            --hero: #21A0D8;
            --hero-light: #3BB5E8;
            --hero-soft: rgba(33, 160, 216, 0.1);
            --hero-glow: rgba(33, 160, 216, 0.15);
            --success: #43B049;
            --success-soft: rgba(67, 176, 73, 0.1);
            --warning: #F59E0B;
            --warning-soft: rgba(245, 158, 11, 0.1);
            --danger: #EF4444;
            --danger-soft: rgba(239, 68, 68, 0.1);
            --creative: #E6468B;
            --creative-soft: rgba(230, 70, 139, 0.1);
            --production: #43B049;
            --sales: #F97316;
            --editorial: #E94B4B;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --ink-muted: #9CA3AF;
            --border: #EAECEF;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--surface); color: var(--ink); -webkit-font-smoothing: antialiased; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
    <script>
        // Initialize Firebase BEFORE React loads
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const APP_ID = "dmg-command-centre-native";
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
    </script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        
        const SALES_STATUSES = ['Not Started', 'Awaiting Brief', 'Brief Received', 'Drafting Response', 'Response Sent', 'Awaiting Feedback', 'Won', 'Lost', 'On Hold'];
        
        // Styles
        const S = {
            app: { display: 'flex', flexDirection: 'column', minHeight: '100vh' },
            header: { padding: '16px 24px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: '14px', background: 'var(--surface)', position: 'sticky', top: 0, zIndex: 100 },
            dots: { display: 'grid', gridTemplateColumns: 'repeat(2, 6px)', gap: '3px' },
            title: { fontSize: 15, fontWeight: 900, flex: 1, textTransform: 'uppercase', letterSpacing: '-0.02em' },
            main: { display: 'flex', flex: 1, overflow: 'hidden' },
            content: { flex: 1, overflowY: 'auto', padding: '20px 24px' },
            bento: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginBottom: 20 },
            section: { background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', marginBottom: 16, overflow: 'hidden' },
            sectionHeader: { padding: '14px 16px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10, background: 'var(--surface-alt)' },
            table: { width: '100%', borderCollapse: 'collapse' },
            th: { textAlign: 'left', padding: '10px 14px', fontSize: 8, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase', letterSpacing: '0.06em', background: 'var(--surface)', borderBottom: '1px solid var(--border)' },
            td: { padding: 14, borderBottom: '1px solid var(--surface-alt)', verticalAlign: 'middle' },
            sidebar: { width: 380, borderLeft: '1px solid var(--border)', background: 'var(--surface-alt)', display: 'flex', flexDirection: 'column', animation: 'slideIn 0.3s ease' },
            loading: { display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 60, gap: 12, color: 'var(--ink-muted)', fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em' },
            spinner: { width: 18, height: 18, border: '2px solid var(--border)', borderTopColor: 'var(--hero)', borderRadius: '50%', animation: 'spin 0.8s linear infinite' },
            empty: { padding: 30, textAlign: 'center', color: 'var(--ink-muted)', fontSize: 11, fontStyle: 'italic' }
        };
        
        // Helpers
        const getWeekString = () => {
            const now = new Date();
            const monday = new Date(now);
            monday.setDate(now.getDate() - now.getDay() + 1);
            return 'w/c ' + monday.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        };
        
        const getInitials = (name) => name ? name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2) : '?';
        
        const getTagType = (status) => {
            if (!status) return 'default';
            const s = status.toLowerCase();
            if (s.includes('live') || s.includes('won') || s.includes('approved') || s.includes('shoot')) return 'won';
            if (s.includes('edit') || s.includes('review') || s.includes('progress') || s.includes('draft')) return 'progress';
            if (s.includes('wait') || s.includes('hold') || s.includes('block') || s.includes('await')) return 'waiting';
            if (s.includes('brief') || s.includes('lead') || s.includes('not started')) return 'brief';
            if (s.includes('response') || s.includes('sent')) return 'response';
            return 'default';
        };
        
        const tagColors = { won: { bg: 'var(--success-soft)', color: 'var(--success)' }, progress: { bg: 'var(--hero-soft)', color: 'var(--hero)' }, waiting: { bg: 'var(--danger-soft)', color: 'var(--danger)' }, brief: { bg: 'var(--warning-soft)', color: 'var(--warning)' }, response: { bg: 'var(--creative-soft)', color: 'var(--creative)' }, default: { bg: 'var(--surface-alt)', color: 'var(--ink-muted)' } };
        
        const getProgressColor = (pct) => pct >= 80 ? 'var(--success)' : pct >= 40 ? 'var(--hero)' : pct > 0 ? 'var(--warning)' : 'var(--border)';
        
        const calculateProgress = (dels) => {
            if (!dels?.length) return 0;
            const done = dels.filter(d => ['live', 'approved', 'complete'].includes((d.status || '').toLowerCase())).length;
            return Math.round((done / dels.length) * 100);
        };
        
        const timeAgo = (ts) => {
            if (!ts) return '';
            const secs = Math.floor((new Date() - new Date(ts)) / 1000);
            if (secs < 60) return 'Just now';
            if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
            if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
            return Math.floor(secs / 86400) + 'd ago';
        };
        
        const formatCurrency = (val) => {
            if (val >= 1000000) return '£' + (val / 1000000).toFixed(1) + 'M';
            if (val >= 1000) return '£' + Math.round(val / 1000) + 'K';
            return '£' + Math.round(val || 0);
        };
        
        // Components
        const Dots = ({ color = 'var(--hero)' }) => (
            <div style={S.dots}>
                {[0,1,2,3].map(i => <span key={i} style={{ width: 6, height: 6, borderRadius: '50%', background: color, animation: `pulse 2.5s ease-in-out ${i * 0.2}s infinite` }} />)}
            </div>
        );
        
        const Badge = ({ type, children }) => {
            const bg = type === 'connected' ? 'var(--success-soft)' : type === 'offline' ? 'var(--danger-soft)' : 'var(--surface-alt)';
            const color = type === 'connected' ? 'var(--success)' : type === 'offline' ? 'var(--danger)' : 'var(--ink-sub)';
            return <span style={{ fontSize: 9, fontWeight: 700, padding: '5px 10px', borderRadius: 99, textTransform: 'uppercase', letterSpacing: '0.02em', background: bg, color }}>{children}</span>;
        };
        
        const Btn = ({ primary, onClick, children, disabled }) => (
            <button disabled={disabled} onClick={onClick} style={{ padding: '8px 14px', border: primary ? 'none' : '1px solid var(--border)', borderRadius: 'var(--radius-sm)', fontSize: 11, fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6, textTransform: 'uppercase', letterSpacing: '0.02em', background: disabled ? 'var(--border)' : primary ? 'var(--ink)' : 'var(--surface-alt)', color: disabled ? 'var(--ink-muted)' : primary ? 'white' : 'var(--ink)', opacity: disabled ? 0.6 : 1 }}>{children}</button>
        );
        
        const Tag = ({ status }) => {
            const t = getTagType(status);
            const c = tagColors[t] || tagColors.default;
            return <span style={{ display: 'inline-flex', padding: '4px 8px', borderRadius: 4, fontSize: 7, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.04em', background: c.bg, color: c.color }}>{status || 'TBC'}</span>;
        };
        
        const PersonChip = ({ name, role }) => {
            const [hover, setHover] = useState(false);
            if (!name) return null;
            const bg = role === 'creative' ? 'var(--creative)' : role === 'production' ? 'var(--production)' : 'var(--sales)';
            return (
                <span onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '3px 8px 3px 3px', background: 'var(--surface-alt)', borderRadius: 99, fontSize: 9, fontWeight: 600, margin: 2, position: 'relative' }}>
                    <span style={{ width: 18, height: 18, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 7, fontWeight: 800, color: 'white', background: bg }}>{getInitials(name)}</span>
                    {hover && <span style={{ position: 'absolute', bottom: 'calc(100% + 6px)', left: '50%', transform: 'translateX(-50%)', background: 'var(--ink)', color: 'white', padding: '6px 10px', borderRadius: 6, fontSize: 9, fontWeight: 600, whiteSpace: 'nowrap', zIndex: 50 }}>{name}</span>}
                </span>
            );
        };
        
        const Progress = ({ pct }) => (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <div style={{ height: 6, background: 'var(--surface-alt)', borderRadius: 3, overflow: 'hidden', width: 60 }}>
                    <div style={{ height: '100%', borderRadius: 3, width: `${pct}%`, background: getProgressColor(pct), transition: 'width 0.5s ease' }} />
                </div>
                <span style={{ fontSize: 10, fontWeight: 800, color: 'var(--ink-sub)', fontVariantNumeric: 'tabular-nums' }}>{pct}%</span>
            </div>
        );
        
        const Card = ({ accent, span, rowSpan, children }) => (
            <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', padding: 16, display: 'flex', flexDirection: 'column', borderTop: `3px solid ${accent || 'transparent'}`, gridColumn: span ? `span ${span}` : undefined, gridRow: rowSpan ? `span ${rowSpan}` : undefined }}>{children}</div>
        );
        
        // Main App
        const CommercialHub = () => {
            const [projects, setProjects] = useState([]);
            const [deliverables, setDeliverables] = useState([]);
            const [annotations, setAnnotations] = useState({});
            const [selectedId, setSelectedId] = useState(null);
            const [currentNote, setCurrentNote] = useState({ status: '', notes: '' });
            const [hasChanges, setHasChanges] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [apiConnected, setApiConnected] = useState(false);
            const [showModal, setShowModal] = useState(false);
            const [saving, setSaving] = useState(false);
            const [authReady, setAuthReady] = useState(false);
            
            // Auth on mount
            useEffect(() => {
                auth.signInAnonymously()
                    .then(() => { console.log('Auth ready'); setAuthReady(true); })
                    .catch(e => { console.error('Auth failed:', e); setAuthReady(true); }); // Continue anyway
            }, []);
            
            // Load data
            const loadData = useCallback(async () => {
                console.log('Loading data...');
                try {
                    const [pRes, dRes] = await Promise.all([
                        fetch(API_URL + '/projects'),
                        fetch(API_URL + '/deliverables')
                    ]);
                    const pData = await pRes.json();
                    const dData = await dRes.json();
                    
                    console.log('Projects:', pData);
                    console.log('Deliverables:', dData);
                    
                    if (pData.success) { setProjects(pData.projects || []); setApiConnected(true); }
                    else { setProjects([]); }
                    
                    if (dData.success) { setDeliverables(dData.deliverables || []); }
                    else { setDeliverables([]); }
                    
                    // Load annotations from Firebase
                    try {
                        const snap = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_annotations').get();
                        const annots = {};
                        snap.forEach(d => { annots[d.id] = d.data(); });
                        setAnnotations(annots);
                        console.log('Annotations:', annots);
                    } catch (e) { console.error('Annotations load failed:', e); }
                    
                    setIsLoading(false);
                } catch (e) {
                    console.error('Load failed:', e);
                    setApiConnected(false);
                    setIsLoading(false);
                }
            }, []);
            
            useEffect(() => {
                if (authReady) loadData();
            }, [authReady, loadData]);
            
            // Auto-refresh
            useEffect(() => {
                if (!authReady) return;
                const interval = setInterval(() => { if (!hasChanges && !showModal) loadData(); }, 60000);
                return () => clearInterval(interval);
            }, [hasChanges, showModal, authReady, loadData]);
            
            // Categorise
            const { production, pipeline, stats } = useMemo(() => {
                const prod = [], pipe = [];
                projects.forEach(p => {
                    const stage = (p.dealStage || '').toLowerCase();
                    const status = (p.projectStatus || '').toLowerCase();
                    const dels = deliverables.filter(d => d.campaignId === p.id);
                    const progress = calculateProgress(dels);
                    const annot = annotations[p.id] || {};
                    const enriched = { ...p, _dels: dels, _progress: progress, _annot: annot };
                    
                    if (stage.includes('won') || stage.includes('live') || stage.includes('production') || status.includes('in progress') || status.includes('filming') || status.includes('edit')) {
                        prod.push(enriched);
                    } else if (!stage.includes('lost')) {
                        pipe.push(enriched);
                    }
                });
                return { production: prod, pipeline: pipe, stats: { live: prod.length, pipeline: pipe.length, pipelineValue: pipe.reduce((s, p) => s + (p.dealValue || 0), 0), deliverables: deliverables.length } };
            }, [projects, deliverables, annotations]);
            
            const selected = useMemo(() => selectedId ? [...production, ...pipeline].find(p => p.id === selectedId) : null, [selectedId, production, pipeline]);
            
            const activity = useMemo(() => projects.filter(p => p.lastEdited || p.lastEditedTime).sort((a, b) => new Date(b.lastEdited || b.lastEditedTime || 0) - new Date(a.lastEdited || a.lastEditedTime || 0)).slice(0, 5), [projects]);
            
            const selectProject = (id) => {
                setSelectedId(id);
                const annot = annotations[id] || {};
                setCurrentNote({ status: annot.status || '', notes: annot.notes || '' });
                setHasChanges(false);
            };
            
            const closePanel = () => { setSelectedId(null); setCurrentNote({ status: '', notes: '' }); setHasChanges(false); };
            
            const saveAnnotation = async () => {
                if (!selected) return;
                setSaving(true);
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('commercial_annotations').doc(selected.id).set({
                        ...currentNote,
                        projectTitle: selected.title,
                        client: selected.client,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setAnnotations(prev => ({ ...prev, [selected.id]: currentNote }));
                    setHasChanges(false);
                } catch (e) { console.error(e); alert('Error saving'); }
                setSaving(false);
            };
            
            const submitProject = async (e) => {
                e.preventDefault();
                const form = e.target;
                const data = { client: form.client.value, title: form.title.value, dealStage: form.stage.value, dealValue: form.value.value ? parseFloat(form.value.value) : null, dueDate: form.date.value || null, notes: form.notes.value || '' };
                try {
                    const res = await fetch(API_URL + '/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                    const result = await res.json();
                    if (result.success) { setShowModal(false); loadData(); }
                    else { alert('Error creating project'); }
                } catch (e) { console.error(e); alert('Error creating project'); }
            };
            
            // Render
            if (isLoading) {
                return <div style={S.loading}><div style={S.spinner} />Syncing Data...</div>;
            }
            
            const renderLeads = (p) => {
                const leads = [];
                if (p.productionLead?.length) p.productionLead.forEach(l => leads.push(<PersonChip key={'p'+l} name={l} role="production" />));
                if (p.creativeLead?.length) p.creativeLead.forEach(l => leads.push(<PersonChip key={'c'+l} name={l} role="creative" />));
                return leads.length ? leads : <span style={{ fontSize: 10, color: 'var(--ink-sub)' }}>Unassigned</span>;
            };
            
            const renderTable = (items, type) => {
                if (!items.length) return <div style={S.empty}>No {type === 'production' ? 'live campaigns' : 'briefs in pipeline'}</div>;
                return (
                    <table style={S.table}>
                        <thead><tr>
                            <th style={S.th}>Client / Project</th>
                            <th style={S.th}>{type === 'production' ? 'Phase' : 'Stage'}</th>
                            <th style={S.th}>Leads</th>
                            {type === 'pipeline' && <th style={S.th}>Sales Status</th>}
                            <th style={S.th}>Progress</th>
                            <th style={S.th}>Assets</th>
                        </tr></thead>
                        <tbody>
                            {items.map(p => (
                                <tr key={p.id} onClick={() => selectProject(p.id)} style={{ cursor: 'pointer', background: selectedId === p.id ? 'var(--hero-soft)' : 'transparent' }}>
                                    <td style={S.td}><div style={{ fontSize: 12, fontWeight: 700, marginBottom: 2 }}>{p.client || 'TBC'}</div><div style={{ fontSize: 10, color: 'var(--ink-sub)' }}>{p.title || ''}</div></td>
                                    <td style={S.td}><Tag status={type === 'production' ? (p.projectStatus || p.dealStage) : p.dealStage} /></td>
                                    <td style={S.td}>{renderLeads(p)}</td>
                                    {type === 'pipeline' && <td style={S.td}>{p._annot?.status ? <Tag status={p._annot.status} /> : <span style={{ fontSize: 10, color: 'var(--ink-sub)' }}>–</span>}</td>}
                                    <td style={S.td}><Progress pct={p._progress} /></td>
                                    <td style={S.td}><span style={{ fontSize: 11, color: 'var(--ink-sub)', fontWeight: 600 }}>{p._dels.length}</span></td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                );
            };
            
            return (
                <div style={S.app}>
                    <div style={S.header}>
                        <Dots />
                        <h1 style={S.title}>Commercial Hub</h1>
                        <Badge type="week">{getWeekString()}</Badge>
                        <Badge type={apiConnected ? 'connected' : 'offline'}>{apiConnected ? '● Connected' : '● Offline'}</Badge>
                        <Btn onClick={loadData}>↻ Refresh</Btn>
                        <Btn primary onClick={() => setShowModal(true)}>+ Add Project</Btn>
                    </div>
                    
                    <div style={S.main}>
                        <div style={S.content}>
                            <div style={S.bento}>
                                <Card accent="var(--hero)">
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}><Dots /><span style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Live Campaigns</span></div>
                                    <div style={{ fontSize: 36, fontWeight: 900, color: 'var(--hero)', fontVariantNumeric: 'tabular-nums' }}>{String(stats.live).padStart(2, '0')}</div>
                                    <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase', marginTop: 4 }}>In Production</div>
                                    <div style={{ marginTop: 'auto', paddingTop: 12, borderTop: '1px solid var(--surface-alt)', display: 'flex', justifyContent: 'space-between' }}><span style={{ fontSize: 8, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase' }}>Total Assets</span><span style={{ fontSize: 10, fontWeight: 800 }}>{stats.deliverables}</span></div>
                                </Card>
                                <Card accent="var(--success)">
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}><Dots color="var(--success)" /><span style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Pipeline</span></div>
                                    <div style={{ fontSize: 36, fontWeight: 900, color: 'var(--success)', fontVariantNumeric: 'tabular-nums' }}>{String(stats.pipeline).padStart(2, '0')}</div>
                                    <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase', marginTop: 4 }}>Active Briefs</div>
                                    <div style={{ marginTop: 'auto', paddingTop: 12, borderTop: '1px solid var(--surface-alt)', display: 'flex', justifyContent: 'space-between' }}><span style={{ fontSize: 8, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase' }}>Pipeline Value</span><span style={{ fontSize: 10, fontWeight: 800 }}>{formatCurrency(stats.pipelineValue)}</span></div>
                                </Card>
                                <Card accent="var(--ink)" span={2} rowSpan={2}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}><Dots color="var(--ink)" /><span style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Recent Activity</span><span style={{ marginLeft: 'auto', fontSize: 8, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase' }}>Auto-updating</span></div>
                                    <div style={{ flex: 1, overflowY: 'auto' }}>
                                        {activity.length === 0 ? <div style={{ fontSize: 10, color: 'var(--ink-muted)', fontStyle: 'italic' }}>No recent activity</div> : activity.map(a => {
                                            const teamColor = a.primaryTeam === 'Creative' ? 'var(--creative)' : a.primaryTeam === 'Production' ? 'var(--production)' : 'var(--hero)';
                                            return (
                                                <div key={a.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'var(--surface-alt)', borderRadius: 'var(--radius-sm)', marginBottom: 8 }}>
                                                    <div style={{ width: 3, height: 28, borderRadius: 2, background: teamColor }} />
                                                    <div style={{ flex: 1, minWidth: 0 }}>
                                                        <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{a.title || 'Untitled'}</div>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 3 }}><span style={{ fontSize: 9, fontWeight: 600, color: 'var(--ink-muted)', textTransform: 'uppercase' }}>{a.client || 'Internal'}</span><Tag status={a.projectStatus || 'Active'} /></div>
                                                    </div>
                                                    <span style={{ fontSize: 9, fontWeight: 600, color: 'var(--ink-muted)', fontVariantNumeric: 'tabular-nums' }}>{timeAgo(a.lastEdited || a.lastEditedTime)}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </Card>
                            </div>
                            
                            <div style={S.section}>
                                <div style={S.sectionHeader}><span style={{ fontSize: 14 }}>📹</span><span style={{ fontSize: 11, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.02em', flex: 1 }}>Production / Live Campaigns</span><span style={{ fontSize: 9, fontWeight: 700, padding: '4px 10px', borderRadius: 99, background: 'var(--hero-soft)', color: 'var(--hero)' }}>{stats.live}</span></div>
                                {renderTable(production, 'production')}
                            </div>
                            
                            <div style={S.section}>
                                <div style={S.sectionHeader}><span style={{ fontSize: 14 }}>📋</span><span style={{ fontSize: 11, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.02em', flex: 1 }}>Inbound Briefs / Pipeline</span><span style={{ fontSize: 9, fontWeight: 700, padding: '4px 10px', borderRadius: 99, background: 'var(--hero-soft)', color: 'var(--hero)' }}>{stats.pipeline}</span></div>
                                {renderTable(pipeline, 'pipeline')}
                            </div>
                        </div>
                        
                        {selected && (
                            <div style={S.sidebar}>
                                <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--border)', background: 'var(--surface)', display: 'flex', alignItems: 'center', gap: 10 }}>
                                    <Dots /><span style={{ fontSize: 13, fontWeight: 800, flex: 1, textTransform: 'uppercase' }}>{selected.client || selected.title}</span>
                                    <button onClick={closePanel} style={{ width: 28, height: 28, border: 'none', background: 'var(--surface-alt)', borderRadius: 6, cursor: 'pointer', fontSize: 14 }}>✕</button>
                                </div>
                                <div style={{ flex: 1, overflowY: 'auto', padding: '16px 20px' }}>
                                    <div style={{ marginBottom: 20 }}>
                                        <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 10 }}>Project Details (from Notion)</div>
                                        <div style={{ marginBottom: 12, display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}><Tag status={selected.dealStage || selected.projectStatus} /><span style={{ fontSize: 10, color: 'var(--ink-muted)', fontWeight: 600 }}>{selected._dels.length} deliverables</span></div>
                                        <div style={{ marginBottom: 12 }}><div style={{ fontSize: 9, color: 'var(--ink-muted)', textTransform: 'uppercase', fontWeight: 600, marginBottom: 6 }}>Progress</div><Progress pct={selected._progress} /></div>
                                        {selected.url && <a href={selected.url} target="_blank" rel="noreferrer" style={{ color: 'var(--hero)', fontSize: 9, fontWeight: 700, textDecoration: 'none', textTransform: 'uppercase' }}>Open in Notion ↗</a>}
                                    </div>
                                    
                                    <div style={{ background: 'var(--hero-soft)', border: '1px solid var(--hero)', borderRadius: 'var(--radius-sm)', padding: 14, marginTop: 16 }}>
                                        <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--hero)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 8 }}>Sales Tracking (your notes)</div>
                                        <select value={currentNote.status} onChange={(e) => { setCurrentNote(n => ({ ...n, status: e.target.value })); setHasChanges(true); }} style={{ width: '100%', padding: '8px 10px', border: '1px solid var(--border)', borderRadius: 6, fontSize: 11, fontWeight: 500, fontFamily: 'inherit', background: 'var(--surface)', marginBottom: 10 }}>
                                            <option value="">Select status...</option>
                                            {SALES_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                        <textarea value={currentNote.notes} onChange={(e) => { setCurrentNote(n => ({ ...n, notes: e.target.value })); setHasChanges(true); }} placeholder="Add notes, follow-ups, key contacts..." style={{ width: '100%', minHeight: 80, padding: 10, border: '1px solid var(--border)', borderRadius: 6, fontSize: 12, fontFamily: 'inherit', resize: 'vertical' }} />
                                    </div>
                                    
                                    <div style={{ marginTop: 20 }}>
                                        <div style={{ fontSize: 9, fontWeight: 700, color: 'var(--ink-muted)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 10 }}>Deliverables ({selected._dels.length})</div>
                                        {selected._dels.length === 0 ? <div style={S.empty}>No deliverables linked</div> : selected._dels.map(d => (
                                            <div key={d.id} style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', padding: 14, marginBottom: 10 }}>
                                                <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 10 }}><span style={{ fontSize: 12, fontWeight: 700, flex: 1 }}>{d.title || 'Untitled'}</span>{d.url && <a href={d.url} target="_blank" rel="noreferrer" style={{ color: 'var(--hero)', fontSize: 9, fontWeight: 700, textDecoration: 'none', textTransform: 'uppercase' }}>View ↗</a>}</div>
                                                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}><Tag status={d.status} />{d.format && <Tag status={d.format} />}</div>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 0', borderTop: '1px solid var(--surface-alt)' }}><span style={{ fontSize: 9, color: 'var(--ink-muted)', textTransform: 'uppercase', fontWeight: 600 }}>Desk State</span><span style={{ fontSize: 10, fontWeight: 600 }}>{d.deskState || 'TBC'}</span></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div style={{ padding: '16px 20px', borderTop: '1px solid var(--border)', background: 'var(--surface)' }}>
                                    <Btn primary disabled={!hasChanges || saving} onClick={saveAnnotation}>{saving ? 'Saving...' : hasChanges ? 'Save Notes' : 'No Changes'}</Btn>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    {showModal && (
                        <div onClick={() => setShowModal(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, animation: 'fadeIn 0.2s ease' }}>
                            <div onClick={e => e.stopPropagation()} style={{ background: 'var(--surface)', borderRadius: 'var(--radius)', width: '100%', maxWidth: 480, maxHeight: '90vh', overflow: 'auto', boxShadow: '0 20px 60px rgba(0,0,0,0.3)', animation: 'modalIn 0.3s ease' }}>
                                <div style={{ padding: '20px 24px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 12 }}><Dots /><span style={{ fontSize: 14, fontWeight: 800, textTransform: 'uppercase', flex: 1 }}>Add New Project</span><button onClick={() => setShowModal(false)} style={{ width: 28, height: 28, border: 'none', background: 'var(--surface-alt)', borderRadius: 6, cursor: 'pointer', fontSize: 14 }}>✕</button></div>
                                <form onSubmit={submitProject}>
                                    <div style={{ padding: 24 }}>
                                        <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 10, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 6 }}>Client <span style={{ color: 'var(--danger)' }}>*</span></label><input name="client" required placeholder="Client name" style={{ width: '100%', padding: '11px 14px', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', fontSize: 13, fontWeight: 500, fontFamily: 'inherit' }} /></div>
                                        <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 10, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 6 }}>Project Title <span style={{ color: 'var(--danger)' }}>*</span></label><input name="title" required placeholder="Brief title or campaign name" style={{ width: '100%', padding: '11px 14px', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', fontSize: 13, fontWeight: 500, fontFamily: 'inherit' }} /></div>
                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                                            <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 10, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 6 }}>Deal Stage</label><select name="stage" defaultValue="Brief Received" style={{ width: '100%', padding: '11px 14px', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', fontSize: 13, fontFamily: 'inherit' }}><option>Lead</option><option>Brief Received</option><option>Response Sent</option><option>Negotiation</option><option>Won</option></select></div>
                                            <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 10, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 6 }}>Deal Value (£)</label><input name="value" type="number" placeholder="50000" style={{ width: '100%', padding: '11px 14px', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', fontSize: 13, fontFamily: 'inherit' }} /></div>
                                        </div>
                                        <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 10, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 6 }}>Deadline</label><input name="date" type="date" style={{ width: '100%', padding: '11px 14px', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', fontSize: 13, fontFamily: 'inherit' }} /></div>
                                        <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 10, fontWeight: 700, color: 'var(--ink-sub)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 6 }}>Notes</label><textarea name="notes" placeholder="Brief overview, key contacts..." style={{ width: '100%', padding: '11px 14px', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', fontSize: 13, fontFamily: 'inherit', minHeight: 70, resize: 'vertical' }} /></div>
                                    </div>
                                    <div style={{ padding: '16px 24px', borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'flex-end', gap: 10 }}><Btn onClick={() => setShowModal(false)}>Cancel</Btn><Btn primary>Create Project</Btn></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<CommercialHub />);
    </script>
</body>
</html>
