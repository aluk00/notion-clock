<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Org Chart | DMG Media</title>
    <style>
        :root {
            /* Canonical Team Colours */
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-people: #21A0D8;
            --team-operations: #21A0D8;
            --team-executive: #1C1C1C;

            --bg-page: #FFFFFF;
            --border-soft: #EAEAEA;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --radius-md: 14px;
            --shadow-soft: 0 4px 20px rgba(0,0,0,0.04);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            --line-color: #D1D1D1;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            margin: 0; padding: 44px 17px;
            color: var(--ink);
            overflow-x: auto;
        }

        /* --- HEADER --- */
        .main-header { display: flex; align-items: center; justify-content: center; gap: 1.15rem; margin-bottom: 55px; }
        .title-text { font-size: 2.76rem; font-weight: 900; color: var(--ink); letter-spacing: -0.04em; line-height: 1; text-transform: uppercase; }
        .header-dots { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 32px; height: 32px; }
        .header-dots .dot { width: 100%; height: 100%; background-color: var(--team-people); border-radius: 50%; animation: popIn 0.6s forwards; }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

        /* --- TREE LAYOUT --- */
        .org-tree { display: flex; flex-direction: column; align-items: center; width: fit-content; min-width: 100%; margin: 0 auto; }
        .node-layer { display: flex; justify-content: center; gap: 34px; position: relative; margin-bottom: 44px; }

        .person-card {
            background: #FFF; border: 1px solid var(--border-soft); border-radius: 11px;
            padding: 16px 24px; min-width: 192px; box-shadow: var(--shadow-soft); position: relative;
            transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 5px; z-index: 10;
        }
        .person-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }

        .card-label {
            position: absolute; top: -9px; left: 17px; background: #F5F5F5; font-size: 8px; font-weight: 900;
            padding: 3px 10px; border-radius: 5px; text-transform: uppercase; border: 1px solid var(--border-soft); color: var(--ink-sub);
        }

        .name { font-size: 13px; font-weight: 900; color: var(--ink); text-align: center; }
        .role { font-size: 8px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.02em; text-align: center; }

        .dot-motif { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; margin-bottom: 5px; }
        .dot-motif span { width: 5px; height: 5px; border-radius: 50%; background: #DDD; }

        /* --- STREAM GRID --- */
        .stream-grid-container { width: 100%; max-width: 1130px; margin-top: 31px; border-top: 1px solid var(--border-soft); padding-top: 31px; }
        .stream-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 17px; }
        .stream-col { display: flex; flex-direction: column; gap: 9px; }
        .stream-title { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; color: #BBB; margin-bottom: 8px; text-align: center; }

        .staff-item { background: #F9FAFB; padding: 9px 12px; border-radius: 8px; border-left: 2px solid transparent; transition: 0.2s; }
        .staff-item:hover { background: #FFF; box-shadow: 0 3px 8px rgba(0,0,0,0.05); transform: translateX(3px); }

        .mgr-badge { font-size: 6px; font-weight: 900; padding: 2px 6px; border-radius: 3px; color: #FFF; text-transform: uppercase; margin-bottom: 3px; width: fit-content; }
        .nested-reports { margin-left: 12px; padding-left: 12px; border-left: 1.5px dashed #EEE; margin-top: 7px; display: flex; flex-direction: column; gap: 7px; }

        #loader { position: fixed; inset: 0; background: #FFF; z-index: 1000; display: flex; align-items: center; justify-content: center; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; color: var(--team-people); }
    </style>
</head>
<body>

    <div id="loader">Syncing Live Hierarchy...</div>

    <header class="main-header">
        <div class="title-text">NEW MEDIA</div>
        <div class="header-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="title-text">ORG CHART</div>
    </header>

    <div class="org-tree">
        <div class="node-layer" id="layer-exec"></div>
        <div class="node-layer" id="layer-directors"></div>

        <div class="stream-grid-container">
            <div style="font-size: 8px; font-weight: 900; color: #CCC; text-transform: uppercase; margin-bottom: 23px; text-align: center; letter-spacing: 0.2em;">Operational Stream View</div>
            <div class="stream-grid" id="stream-mount">
                <div class="stream-col" id="col-Production"><div class="stream-title">Production</div></div>
                <div class="stream-col" id="col-Social"><div class="stream-title">Social & Editorial</div></div>
                <div class="stream-col" id="col-Creative"><div class="stream-title">Creative</div></div>
                <div class="stream-col" id="col-Operations"><div class="stream-title">Operations</div></div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
      authDomain: "dmg-command-centre-native.firebaseapp.com",
      projectId: "dmg-command-centre-native",
      storageBucket: "dmg-command-centre-native.firebasestorage.app",
      messagingSenderId: "223535956454",
      appId: "1:223535956454:web:b25e5bc69d8a4a7f209627",
      measurementId: "G-5HNGPRJGZY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const appId = 'dmg-command-centre-native';

    const colors = {
        Editorial: '#E94B4B', Creative: '#E6468B', Production: '#43B049',
        Social: '#F2C316', Operations: '#21A0D8', Executive: '#1C1C1C'
    };

    async function init() {
        await signInAnonymously(auth);
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'staff_directory'), (snap) => {
            const staff = [];
            snap.forEach(d => staff.push({id: d.id, ...d.data()}));
            renderOrgChart(staff);
            document.getElementById('loader').style.display = 'none';
        });
    }

    function renderOrgChart(data) {
        document.getElementById('layer-exec').innerHTML = "";
        document.getElementById('layer-directors').innerHTML = "";
        ['Production', 'Social', 'Creative', 'Operations'].forEach(t => {
            document.getElementById('col-'+t).innerHTML = `<div class="stream-title">${t === 'Social' ? 'Social & Editorial' : t}</div>`;
        });

        const head = data.find(s => s.manager === "None" || s.seniority === "Executive");
        const directors = data.filter(s => s.seniority === "Director" && s.id !== head?.id);
        
        if(head) document.getElementById('layer-exec').innerHTML = createCard(head, 'EXECUTIVE');
        directors.forEach(d => document.getElementById('layer-directors').innerHTML += createCard(d, 'DIRECTOR'));

        const streamStaff = data.filter(s => s.id !== head?.id && !directors.some(d => d.id === s.id));
        
        ['Production', 'Social', 'Creative', 'Operations'].forEach(teamName => {
            const mount = document.getElementById('col-' + teamName);
            let teamMembers = [];
            
            if(teamName === 'Social') {
                // Combine Social and Editorial under Ellie
                teamMembers = streamStaff.filter(s => s.team === 'Social' || s.team === 'Editorial');
            } else {
                teamMembers = streamStaff.filter(s => s.team === teamName);
            }
            
            const teamManagers = teamMembers.filter(s => s.isManager);
            teamManagers.forEach(m => {
                const node = createStaffNode(m, true);
                mount.appendChild(node);
                const reports = teamMembers.filter(s => s.manager === `${m.firstName} ${m.lastName}`);
                if(reports.length > 0) {
                    const nested = document.createElement('div');
                    nested.className = "nested-reports";
                    reports.forEach(r => nested.appendChild(createStaffNode(r, false)));
                    mount.appendChild(nested);
                }
            });

            const looseEnds = teamMembers.filter(s => !s.isManager && !teamManagers.some(m => s.manager === `${m.firstName} ${m.lastName}`));
            looseEnds.forEach(l => mount.appendChild(createStaffNode(l, false)));
        });
    }

    function createCard(s, label) {
        const color = colors[s.team] || '#1C1C1C';
        return `
            <div class="person-card" style="border-top: 4px solid ${color}">
                <div class="card-label">${label}</div>
                <div class="dot-motif">
                    <span style="background:${color}"></span><span style="background:${color}"></span>
                    <span style="background:${color}"></span><span style="background:${color}"></span>
                </div>
                <div class="name">${s.firstName} ${s.lastName}</div>
                <div class="role">${s.role}</div>
            </div>
        `;
    }

    function createStaffNode(s, isMgr) {
        const div = document.createElement('div');
        const color = colors[s.team] || '#EEE';
        div.className = "staff-item";
        div.style.borderLeftColor = color;
        div.innerHTML = `
            ${isMgr ? `<div class="mgr-badge" style="background:${color}">Line Manager</div>` : ''}
            <div class="name" style="text-align:left; font-size:10px;">${s.firstName} ${s.lastName}</div>
            <div class="role" style="text-align:left; font-size:7px; color:#999;">${s.role}</div>
        `;
        return div;
    }

    init();
</script>
</body>
</html>
