<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Activity | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --urgent: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; }
        
        .widget { background: #FFF; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; max-width: 380px; }
        
        .header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 18px; height: 18px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 14px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: -0.02em; }
        
        .content { padding: 16px; }
        
        /* Alert Banner */
        .alert-banner { padding: 14px 16px; border-radius: 12px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 12px; }
        .alert-banner.urgent { background: #FEF2F2; border: 1px solid #FECACA; }
        .alert-banner.warning { background: #FFFBEB; border: 1px solid #FDE68A; }
        .alert-banner.info { background: #EFF6FF; border: 1px solid #BFDBFE; }
        .alert-banner.success { background: #ECFDF5; border: 1px solid #A7F3D0; }
        
        .alert-icon { font-size: 20px; flex-shrink: 0; }
        .alert-content { flex: 1; }
        .alert-title { font-size: 12px; font-weight: 800; margin-bottom: 4px; }
        .alert-banner.urgent .alert-title { color: var(--urgent); }
        .alert-banner.warning .alert-title { color: var(--warning); }
        .alert-banner.info .alert-title { color: var(--dmg-blue); }
        .alert-banner.success .alert-title { color: var(--success); }
        .alert-desc { font-size: 11px; color: var(--ink-sub); line-height: 1.4; }
        
        .alert-action { margin-top: 10px; }
        .alert-btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
        .alert-btn.primary { background: var(--dmg-blue); color: #FFF; }
        .alert-btn.primary:hover { filter: brightness(1.1); }
        
        /* Activity Feed */
        .feed-section { }
        .feed-title { font-size: 9px; font-weight: 800; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
        
        .activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .activity-item:last-child { border-bottom: none; }
        
        .activity-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .activity-icon.rota { background: #DBEAFE; }
        .activity-icon.approval { background: #D1FAE5; }
        .activity-icon.poke { background: #FEF3C7; }
        .activity-icon.mention { background: #FCE7F3; }
        
        .activity-content { flex: 1; }
        .activity-text { font-size: 12px; color: var(--ink); line-height: 1.4; }
        .activity-text strong { font-weight: 700; }
        .activity-time { font-size: 10px; color: var(--ink-sub); margin-top: 4px; }
        
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-icon { font-size: 32px; margin-bottom: 12px; }
        .empty-text { font-size: 12px; color: var(--ink-sub); }
        
        .loading { text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Firebase setup
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        const appId = 'dmg-command-centre-native';
        const basePath = `artifacts/${appId}/public/data`;
        
        const DotGrid = () => (
            <div className="dots">
                <div className="dot"></div>
                <div className="dot"></div>
                <div className="dot"></div>
                <div className="dot"></div>
            </div>
        );
        
        // Alert Banner Component
        const AlertBanner = ({ type, icon, title, description, actionLabel, onAction }) => (
            <div className={`alert-banner ${type}`}>
                <span className="alert-icon">{icon}</span>
                <div className="alert-content">
                    <div className="alert-title">{title}</div>
                    <div className="alert-desc">{description}</div>
                    {actionLabel && (
                        <div className="alert-action">
                            <button className="alert-btn primary" onClick={onAction}>{actionLabel}</button>
                        </div>
                    )}
                </div>
            </div>
        );
        
        // Activity Item Component
        const ActivityItem = ({ activity }) => {
            const iconMap = {
                rota: { icon: '📅', class: 'rota' },
                approval: { icon: '✅', class: 'approval' },
                poke: { icon: '👋', class: 'poke' },
                mention: { icon: '💬', class: 'mention' }
            };
            
            const config = iconMap[activity.type] || iconMap.rota;
            
            const formatTime = (timestamp) => {
                if (!timestamp) return '';
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                const now = new Date();
                const diff = now - date;
                
                if (diff < 60000) return 'Just now';
                if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
                if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
                return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            };
            
            return (
                <div className="activity-item">
                    <div className={`activity-icon ${config.class}`}>{config.icon}</div>
                    <div className="activity-content">
                        <div className="activity-text" dangerouslySetInnerHTML={{ __html: activity.message }} />
                        <div className="activity-time">{formatTime(activity.createdAt)}</div>
                    </div>
                </div>
            );
        };
        
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [staffDirectory, setStaffDirectory] = useState([]);
            const [rotaSubmissions, setRotaSubmissions] = useState([]);
            const [activities, setActivities] = useState([]);
            const [loading, setLoading] = useState(true);
            
            // Get current week info
            const getWeekInfo = () => {
                const today = new Date();
                const day = today.getDay();
                const monday = new Date(today);
                monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1));
                monday.setHours(0, 0, 0, 0);
                
                // Wednesday EOD deadline
                const wednesday = new Date(monday);
                wednesday.setDate(monday.getDate() + 2);
                wednesday.setHours(17, 0, 0, 0);
                
                return {
                    weekId: monday.toISOString().split('T')[0],
                    dayOfWeek: day,
                    isMonday: day === 1,
                    isTuesday: day === 2,
                    isWednesday: day === 3,
                    isPastDeadline: today > wednesday,
                    deadlineDay: 'Wednesday'
                };
            };
            
            const weekInfo = useMemo(() => getWeekInfo(), []);
            
            // Check if user has submitted rota for this week
            const hasSubmittedRota = useMemo(() => {
                if (!currentUser || !rotaSubmissions.length) return false;
                return rotaSubmissions.some(s => 
                    s.weekId === weekInfo.weekId && 
                    (s.userId === currentUser.id || s.name === `${currentUser.firstName} ${currentUser.lastName}`)
                );
            }, [currentUser, rotaSubmissions, weekInfo.weekId]);
            
            // Determine alert to show
            const rotaAlert = useMemo(() => {
                if (!currentUser) return null;
                
                // Already submitted
                if (hasSubmittedRota) {
                    return {
                        type: 'success',
                        icon: '✅',
                        title: 'Rota Submitted',
                        description: `You've submitted your schedule for this week.`
                    };
                }
                
                // Monday reminder
                if (weekInfo.isMonday) {
                    return {
                        type: 'info',
                        icon: '📅',
                        title: 'Weekly Rota Reminder',
                        description: `Please submit your working schedule for this week by ${weekInfo.deadlineDay} EOD.`,
                        actionLabel: 'Submit Rota',
                        onAction: () => window.open('https://aluk00.github.io/notion-clock/rota-request-v2.html', '_blank')
                    };
                }
                
                // Tuesday nudge
                if (weekInfo.isTuesday) {
                    return {
                        type: 'warning',
                        icon: '⏰',
                        title: 'Rota Due Tomorrow',
                        description: `Don't forget to submit your working schedule by ${weekInfo.deadlineDay} EOD.`,
                        actionLabel: 'Submit Now',
                        onAction: () => window.open('https://aluk00.github.io/notion-clock/rota-request-v2.html', '_blank')
                    };
                }
                
                // Wednesday or past deadline
                if (weekInfo.isWednesday || weekInfo.isPastDeadline) {
                    return {
                        type: 'urgent',
                        icon: '🚨',
                        title: 'Rota Overdue',
                        description: `Your working schedule hasn't been submitted. Please do this ASAP.`,
                        actionLabel: 'Submit Urgently',
                        onAction: () => window.open('https://aluk00.github.io/notion-clock/rota-request-v2.html', '_blank')
                    };
                }
                
                return null;
            }, [currentUser, hasSubmittedRota, weekInfo]);
            
            // Load staff directory
            useEffect(() => {
                const unsub = db.collection(basePath).doc('staff_directory').collection('staff_directory')
                    .onSnapshot(snap => {
                        setStaffDirectory(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                return () => unsub();
            }, []);
            
            // Load rota submissions
            useEffect(() => {
                const unsub = db.collection(basePath).doc('rota_submissions').collection('rota_submissions')
                    .onSnapshot(snap => {
                        setRotaSubmissions(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                return () => unsub();
            }, []);
            
            // Load activities for current user
            useEffect(() => {
                if (!currentUser) return;
                
                const unsub = db.collection(basePath).doc('activity_feed').collection('activity_feed')
                    .where('userId', '==', currentUser.id)
                    .orderBy('createdAt', 'desc')
                    .limit(10)
                    .onSnapshot(snap => {
                        setActivities(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, err => {
                        // If orderBy fails (no index), try without
                        console.log('Falling back to unordered query');
                        db.collection(basePath).doc('activity_feed').collection('activity_feed')
                            .where('userId', '==', currentUser.id)
                            .limit(10)
                            .get()
                            .then(snap => {
                                setActivities(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                            });
                    });
                
                return () => unsub && unsub();
            }, [currentUser]);
            
            // Auth & user resolution
            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (firebaseUser) => {
                    if (!firebaseUser) {
                        auth.signInAnonymously();
                        return;
                    }
                    
                    // Check URL param
                    const urlParams = new URLSearchParams(window.location.search);
                    const paramId = urlParams.get('id');
                    
                    if (paramId && staffDirectory.length > 0) {
                        const found = staffDirectory.find(s => s.id === paramId);
                        if (found) {
                            setCurrentUser(found);
                            setLoading(false);
                            return;
                        }
                    }
                    
                    if (firebaseUser.email && staffDirectory.length > 0) {
                        const found = staffDirectory.find(s => 
                            s.email?.toLowerCase() === firebaseUser.email.toLowerCase()
                        );
                        if (found) {
                            setCurrentUser(found);
                            setLoading(false);
                            return;
                        }
                    }
                    
                    // No user found - show empty state
                    setCurrentUser(null);
                    setLoading(false);
                });
                
                return () => unsub();
            }, [staffDirectory]);
            
            if (loading) {
                return (
                    <div className="widget">
                        <div className="loading">
                            <DotGrid />
                            <p style={{ fontSize: '11px', color: 'var(--ink-sub)', marginTop: '12px' }}>Loading...</p>
                        </div>
                    </div>
                );
            }
            
            if (!currentUser) {
                return (
                    <div className="widget">
                        <div className="header">
                            <DotGrid />
                            <span className="title">My Activity</span>
                        </div>
                        <div className="content">
                            <div className="empty-state">
                                <div className="empty-icon">👤</div>
                                <div className="empty-text">User not found. Please sign in or access via your profile.</div>
                            </div>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="widget">
                    <div className="header">
                        <DotGrid />
                        <span className="title">My Activity</span>
                    </div>
                    
                    <div className="content">
                        {/* Rota Alert Banner */}
                        {rotaAlert && (
                            <AlertBanner
                                type={rotaAlert.type}
                                icon={rotaAlert.icon}
                                title={rotaAlert.title}
                                description={rotaAlert.description}
                                actionLabel={rotaAlert.actionLabel}
                                onAction={rotaAlert.onAction}
                            />
                        )}
                        
                        {/* Activity Feed */}
                        <div className="feed-section">
                            <div className="feed-title">Recent Activity</div>
                            
                            {activities.length > 0 ? (
                                activities.map(activity => (
                                    <ActivityItem key={activity.id} activity={activity} />
                                ))
                            ) : (
                                <div className="empty-state">
                                    <div className="empty-icon">📭</div>
                                    <div className="empty-text">No recent activity</div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
