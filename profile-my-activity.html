<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Activity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 8px);
            gap: 4px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3B82F6;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        .dot:nth-child(4) { animation-delay: 0.6s; }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .title { font-size: 18px; font-weight: 600; color: #111; }
        
        .activity-list { display: flex; flex-direction: column; gap: 12px; }
        
        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 3px solid #3B82F6;
        }
        
        .activity-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #EBF5FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .activity-content { flex: 1; min-width: 0; }
        .activity-text { font-size: 13px; color: #333; line-height: 1.4; margin-bottom: 4px; }
        .activity-time { font-size: 11px; color: #888; }
        
        .empty-state { text-align: center; padding: 48px 24px; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .empty-text { font-size: 13px; color: #888; line-height: 1.5; }
        .loading { text-align: center; padding: 48px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <div class="dot-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="title">My Activity</div>
    </div>
    
    <div id="content">
        <div class="loading">Loading activity...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = "dmg-command-centre-native";
        
        function timeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        }
        
        function getIcon(type) {
            const icons = {
                'post': '📝', 'comment': '💬', 'like': '❤️', 'share': '🔗',
                'upload': '📤', 'edit': '✏️', 'create': '➕', 'delete': '🗑️',
                'login': '🔐', 'view': '👁️', 'default': '📌'
            };
            return icons[type?.toLowerCase()] || icons.default;
        }
        
        async function loadActivity() {
            const content = document.getElementById('content');
            
            try {
                const paths = [
                    `artifacts/${appId}/public/data/activity_feed`,
                    `artifacts/${appId}/public/data/user_activity`,
                    `activity_feed`,
                    `user_activity`
                ];
                
                let activities = [];
                
                for (const path of paths) {
                    console.log(`Trying: ${path}`);
                    try {
                        const snapshot = await db.collection(path).orderBy('timestamp', 'desc').limit(20).get();
                        if (!snapshot.empty) {
                            snapshot.forEach(doc => activities.push({ id: doc.id, ...doc.data() }));
                            console.log(`Found ${activities.length} items in ${path}`);
                            break;
                        }
                    } catch (e) {
                        console.log(`Error on ${path}: ${e.message}`);
                    }
                }
                
                if (activities.length === 0) {
                    content.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">No Activity Yet</div>
                            <div class="empty-text">Activity will appear here once you start using the system.</div>
                        </div>
                    `;
                    return;
                }
                
                const html = activities.map(item => {
                    const timestamp = item.timestamp?.toDate ? item.timestamp.toDate() : new Date(item.timestamp);
                    const text = item.text || item.message || item.description || item.action || 'Activity';
                    const type = item.type || item.action_type || 'default';
                    
                    return `
                        <div class="activity-item">
                            <div class="activity-icon">${getIcon(type)}</div>
                            <div class="activity-content">
                                <div class="activity-text">${text}</div>
                                <div class="activity-time">${timeAgo(timestamp)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                content.innerHTML = `<div class="activity-list">${html}</div>`;
                
            } catch (error) {
                console.error('Error:', error);
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Unable to Load</div>
                        <div class="empty-text">Check console for details.</div>
                    </div>
                `;
            }
        }
        
        loadActivity();
    </script>
</body>
</html>
