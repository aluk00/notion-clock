<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Rundown Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            editorial: '#E94B4B',
            production: '#43B049',
            sales: '#21A0D8',
            social: '#F59E0B',
            creative: '#E6468B',
            ink: '#1C1C1C',
            'ink-sub': '#757575',
            'bg-soft': '#F9FAFB',
            border: '#EAECEF',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: transparent;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #E5E7EB;
      border-radius: 20px;
    }
  </style>
</head>
<body class="text-ink">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
    const INITIAL_VISIBLE = 5;

    // Fetch rundown items from Notion API for a date range
    const fetchRundownItems = async (startDate, endDate) => {
      try {
        const allItems = [];
        let currentDate = new Date(startDate);
        const end = new Date(endDate);

        // Fetch each day in the range
        while (currentDate <= end) {
          const dateStr = currentDate.toISOString().split('T')[0];
          const response = await fetch(`${API_URL}/rundown?date=${dateStr}`);

          // Check if response is OK before parsing JSON
          if (!response.ok) {
            const errorText = await response.text();
            console.error(`Error fetching rundown for ${dateStr}:`, response.status, errorText.substring(0, 200));
            // Continue to next date instead of failing completely
            currentDate.setDate(currentDate.getDate() + 1);
            continue;
          }

          const data = await response.json();

          if (data.success && data.items) {
            // Add dateKey to each item for grouping
            const itemsWithDate = data.items.map(item => ({
              ...item,
              dateKey: dateStr
            }));
            allItems.push(...itemsWithDate);
          }

          currentDate.setDate(currentDate.getDate() + 1);
        }

        return allItems;
      } catch (error) {
        console.error("Error fetching rundown items:", error);
        return [];
      }
    };

    // Update rundown item via API
    const updateRundownItem = async (id, data) => {
      try {
        const response = await fetch(`${API_URL}/rundown/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.error);
        return result;
      } catch (error) {
        console.error("Error updating item:", error);
        throw error;
      }
    };

    // Delete rundown item via API
    const deleteRundownItem = async (id) => {
      try {
        const response = await fetch(`${API_URL}/rundown/${id}`, {
          method: 'DELETE'
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.error);
        return result;
      } catch (error) {
        console.error("Error deleting item:", error);
        throw error;
      }
    };

    const DotGrid = () => (
      <div className="grid grid-cols-2 gap-[2px] w-[12px]">
        {[0, 1, 2, 3].map((i) => (
          <span
            key={i}
            className="w-[5px] h-[5px] rounded-full bg-editorial animate-pulse"
            style={{ animationDelay: `${i * 0.3}s` }}
          />
        ))}
      </div>
    );

    const Select = ({ label, value, options, onChange, placeholder = "Select...", className = "" }) => {
      const [isOpen, setIsOpen] = useState(false);
      const containerRef = useRef(null);
      const selectedOption = options.find(opt => opt.value === value);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <div className={`relative ${className}`} ref={containerRef}>
          <label className="block text-[10px] font-bold uppercase text-ink-sub mb-1.5 tracking-wide">{label}</label>
          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className={`w-full text-left text-xs font-semibold border rounded-lg px-3 py-2.5 flex items-center justify-between transition-all duration-200
              ${isOpen ? 'border-editorial ring-1 ring-editorial/20 shadow-sm' : 'border-gray-200 hover:border-gray-300'}
              bg-white`}
          >
            <span className={!selectedOption ? "text-gray-400" : "text-ink"}>
              {selectedOption ? selectedOption.label : placeholder}
            </span>
            <span className="text-gray-400 text-[10px]">▼</span>
          </button>

          {isOpen && (
            <div className="absolute z-50 w-full mt-1 bg-white border border-gray-100 rounded-lg shadow-xl max-h-60 overflow-y-auto animate-in fade-in zoom-in-95 duration-100">
              <div className="py-1">
                {options.map((option) => (
                  <button
                    key={option.value}
                    type="button"
                    onClick={() => {
                      onChange(option.value);
                      setIsOpen(false);
                    }}
                    className={`w-full text-left px-3 py-2 text-xs font-medium hover:bg-gray-50 flex items-center justify-between group
                      ${option.value === value ? 'bg-editorial/5 text-editorial' : 'text-ink'}`}
                  >
                    <span>{option.label}</span>
                    {option.value === value && <span className="text-editorial">✓</span>}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    const VERTICAL_STYLES = {
      SPORT: 'bg-green-100 text-green-700',
      UK: 'bg-blue-100 text-blue-600',
      RESPAWN: 'bg-purple-100 text-purple-600',
      MAIN: 'bg-gray-100 text-gray-800',
      MONEY: 'bg-yellow-100 text-yellow-700',
      SPOTLIGHT: 'bg-pink-100 text-pink-600'
    };

    const STATUS_ICONS = {
      done: '✓',
      pending: '◔',
      blocked: '!',
      '': ''
    };

    const STATUS_STYLES = {
      done: 'bg-green-500 border-green-500 text-white',
      pending: 'bg-yellow-500 border-yellow-500 text-white',
      blocked: 'bg-red-500 border-red-500 text-white',
      '': 'border-gray-200'
    };

    const RundownCard = ({ item, onClick }) => {
      const vertical = (item.vertical || '').toUpperCase();
      const verticalClass = VERTICAL_STYLES[vertical] || 'bg-gray-100 text-gray-600';
      const status = (item.status || '').toLowerCase();
      const statusClass = STATUS_STYLES[status] || 'border-gray-200';
      const statusIcon = STATUS_ICONS[status] || '';

      const hasThumbnailIssue = item.thumbnailStatus === 'needed';
      const hasLink = !!item.liveLink;
      const hasNotes = !!item.notes;
      const creator = item.creator || item.assignedCreator || '';
      const editor = item.editor || item.assignedEditor || '';

      return (
        <div
          onClick={() => onClick(item)}
          className="p-2 bg-white rounded-lg border border-border shadow-[0_2px_4px_rgba(0,0,0,0.02)] hover:shadow-[0_4px_8px_rgba(0,0,0,0.06)] hover:-translate-y-[1px] transition-all duration-200 flex gap-2 group cursor-pointer relative"
        >
          <div className={`w-[14px] h-[14px] mt-[2px] rounded-full border-[1.5px] flex items-center justify-center text-[8px] flex-shrink-0 ${statusClass}`}>
            {statusIcon}
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex flex-wrap gap-1 mb-1 items-center">
              <span className={`text-[8px] font-extrabold uppercase px-1.5 py-0.5 rounded ${verticalClass} tracking-wide`}>
                {vertical || 'MAIN'}
              </span>
              {creator && (
                <span className="text-[8px] font-bold uppercase px-1.5 py-0.5 rounded bg-gray-100 text-gray-500 border border-gray-200">
                  {creator}
                </span>
              )}
              {editor && (
                <span className="text-[8px] font-bold uppercase px-1.5 py-0.5 rounded bg-blue-50 text-blue-600 border border-blue-100">
                  ED: {editor}
                </span>
              )}
              {hasThumbnailIssue && (
                <span className="text-[8px] font-bold uppercase px-1.5 py-0.5 rounded bg-orange-100 text-orange-600 border border-orange-200 animate-pulse">
                  Thumb Needed
                </span>
              )}
            </div>
            <div className="text-[10px] font-semibold text-ink leading-snug break-words mb-1">
              {item.title || 'Untitled'}
            </div>

            {(hasLink || hasNotes) && (
              <div className="flex gap-2 pt-1 border-t border-gray-50">
                {hasLink && <span title="Live Link" className="text-[9px] text-blue-500">🔗 Live</span>}
                {hasNotes && <span title="Has Notes" className="text-[9px] text-gray-400">📝 Notes</span>}
              </div>
            )}
          </div>
        </div>
      );
    };

    const EditModal = ({ item, isOpen, onClose, onSave, onDelete }) => {
      const [formData, setFormData] = useState({});
      const [loading, setLoading] = useState(false);
      const [deleteConfirm, setDeleteConfirm] = useState(false);
      const modalRef = useRef(null);

      useEffect(() => {
        if (item) {
          setFormData({
            title: item.title || '',
            section: item.section || '',
            vertical: item.vertical || '',
            creator: item.creator || item.assignedCreator || '',
            editor: item.editor || item.assignedEditor || '',
            status: item.status || '',
            plannedLiveDate: item.plannedLiveDate || item.liveDate || '',
            liveLink: item.liveLink || '',
            thumbnailStatus: item.thumbnailStatus || 'n/a',
            notes: item.notes || ''
          });
          setDeleteConfirm(false);
        }
      }, [item]);

      useEffect(() => {
        const handleEscape = (e) => {
          if (e.key === 'Escape') {
            if (deleteConfirm) {
              setDeleteConfirm(false);
            } else {
              onClose();
            }
          }
        };
        if (isOpen) {
          document.addEventListener('keydown', handleEscape);
          document.body.style.overflow = 'hidden';
        }
        return () => {
          document.removeEventListener('keydown', handleEscape);
          document.body.style.overflow = '';
        };
      }, [isOpen, onClose, deleteConfirm]);

      if (!isOpen) return null;

      const handleChange = (name, value) => {
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleInputChange = (event) => {
        const { name, value } = event.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSave = async () => {
        setLoading(true);
        try {
          await onSave(item.id, formData);
          onClose();
        } catch (error) {
          console.error(error);
          alert('Failed to save. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      const handleDelete = async () => {
        if (!deleteConfirm) {
          setDeleteConfirm(true);
          return;
        }
        setLoading(true);
        try {
          await onDelete(item.id);
          onClose();
        } catch (error) {
          console.error(error);
          alert('Failed to delete. Please try again.');
        } finally {
          setLoading(false);
          setDeleteConfirm(false);
        }
      };

      const SECTIONS = [
        { value: 'FILMING', label: 'FILMING' },
        { value: 'INTERNAL', label: 'INTERNAL' },
        { value: 'EXTERNAL', label: 'EXTERNAL' },
        { value: 'GOING LIVE', label: 'GOING LIVE' }
      ];

      const VERTICALS = [
        { value: 'SPORT', label: 'SPORT' },
        { value: 'UK', label: 'UK' },
        { value: 'RESPAWN', label: 'RESPAWN' },
        { value: 'MAIN', label: 'MAIN' },
        { value: 'MONEY', label: 'MONEY' },
        { value: 'SPOTLIGHT', label: 'SPOTLIGHT' }
      ];

      const STATUSES = [
        { value: '', label: 'No Status' },
        { value: 'pending', label: 'Pending (In Progress)' },
        { value: 'done', label: 'Done (Approved)' },
        { value: 'blocked', label: 'Blocked (Needs Attention)' }
      ];

      const THUMBNAIL_STATUSES = [
        { value: 'n/a', label: 'Not Required' },
        { value: 'needed', label: 'Thumbnail Needed' },
        { value: 'done', label: 'Thumbnail Ready' }
      ];

      const vertical = (formData.vertical || '').toUpperCase();
      const verticalClass = VERTICAL_STYLES[vertical] || 'bg-gray-100 text-gray-600';
      const status = (formData.status || '').toLowerCase();
      const statusClass = STATUS_STYLES[status] || 'border-gray-200';

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4"
          onClick={(e) => e.target === e.currentTarget && onClose()}
        >
          <div className="absolute inset-0 bg-black/40 backdrop-blur-sm animate-in fade-in duration-200" />
          <div
            ref={modalRef}
            className="relative bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 slide-in-from-bottom-4 duration-200"
          >
            {/* Header with item preview */}
            <div className="px-6 py-4 border-b border-gray-100 bg-gradient-to-r from-editorial/5 to-transparent">
              <div className="flex justify-between items-start">
                <div className="flex-1 pr-4">
                  <div className="flex flex-wrap gap-1.5 mb-2 items-center">
                    <span className={`text-[9px] font-extrabold uppercase px-2 py-0.5 rounded ${verticalClass} tracking-wide`}>
                      {vertical || 'MAIN'}
                    </span>
                    {formData.section && (
                      <span className="text-[9px] font-bold uppercase px-2 py-0.5 rounded bg-gray-100 text-gray-600">
                        {formData.section}
                      </span>
                    )}
                    {status && (
                      <span className={`text-[9px] font-bold uppercase px-2 py-0.5 rounded ${status === 'done' ? 'bg-green-100 text-green-700' : status === 'pending' ? 'bg-yellow-100 text-yellow-700' : status === 'blocked' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600'}`}>
                        {status}
                      </span>
                    )}
                  </div>
                  <h2 className="text-sm font-bold text-ink leading-snug">{formData.title || 'Untitled'}</h2>
                  <p className="text-[10px] text-ink-sub mt-1 font-medium">Edit details below (syncs to Notion)</p>
                </div>
                <button
                  onClick={onClose}
                  className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400 hover:text-ink transition-colors -mr-1 -mt-1"
                >
                  ✕
                </button>
              </div>
            </div>

            <div className="p-6 overflow-y-auto custom-scrollbar flex-1">
              <div className="space-y-6">
                <div className="space-y-4">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-ink-sub mb-1.5 tracking-wide">Content Title</label>
                    <input
                      type="text"
                      name="title"
                      value={formData.title || ''}
                      onChange={handleInputChange}
                      className="w-full text-sm font-semibold text-ink border border-gray-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-editorial/20 focus:border-editorial transition-all placeholder:text-gray-300"
                      placeholder="e.g. Manchester United Match Analysis"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <Select
                      label="Vertical"
                      value={formData.vertical || ''}
                      options={VERTICALS}
                      onChange={(val) => handleChange('vertical', val)}
                    />
                    <Select
                      label="Rundown Section"
                      value={formData.section || ''}
                      options={SECTIONS}
                      onChange={(val) => handleChange('section', val)}
                    />
                  </div>
                </div>

                <div className="p-4 bg-bg-soft rounded-lg border border-dashed border-gray-200 space-y-4">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-editorial"></span>
                    <h3 className="text-[10px] font-bold uppercase text-ink tracking-widest">Team Assignment</h3>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-bold uppercase text-ink-sub mb-1.5 tracking-wide">Creator</label>
                      <input
                        type="text"
                        name="creator"
                        value={formData.creator || ''}
                        onChange={handleInputChange}
                        className="w-full text-xs font-semibold text-ink border border-gray-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-editorial/20 focus:border-editorial transition-all"
                        placeholder="Creator name"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold uppercase text-ink-sub mb-1.5 tracking-wide">Editor</label>
                      <input
                        type="text"
                        name="editor"
                        value={formData.editor || ''}
                        onChange={handleInputChange}
                        className="w-full text-xs font-semibold text-ink border border-gray-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-editorial/20 focus:border-editorial transition-all"
                        placeholder="Editor name"
                      />
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <Select
                    label="Status"
                    value={formData.status || ''}
                    options={STATUSES}
                    onChange={(val) => handleChange('status', val)}
                  />
                  <Select
                    label="Thumbnail"
                    value={formData.thumbnailStatus || 'n/a'}
                    options={THUMBNAIL_STATUSES}
                    onChange={(val) => handleChange('thumbnailStatus', val)}
                  />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-ink-sub mb-1.5 tracking-wide">Planned Live Date</label>
                    <input
                      type="date"
                      name="plannedLiveDate"
                      value={formData.plannedLiveDate || ''}
                      onChange={handleInputChange}
                      className="w-full text-xs font-semibold text-ink border border-gray-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-editorial/20 focus:border-editorial transition-all"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-ink-sub mb-1.5 tracking-wide">Live Link</label>
                    <input
                      type="url"
                      name="liveLink"
                      value={formData.liveLink || ''}
                      onChange={handleInputChange}
                      className="w-full text-xs font-semibold text-ink border border-gray-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-editorial/20 focus:border-editorial transition-all"
                      placeholder="https://"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-[10px] font-bold uppercase text-ink-sub mb-1.5 tracking-wide">Notes</label>
                  <textarea
                    name="notes"
                    value={formData.notes || ''}
                    onChange={handleInputChange}
                    className="w-full text-xs font-semibold text-ink border border-gray-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-editorial/20 focus:border-editorial transition-all min-h-[90px] resize-none"
                    placeholder="Add any context, edits, or blockers..."
                  />
                </div>

                {item.url && (
                  <div className="pt-2">
                    <a
                      href={item.url}
                      target="_blank"
                      rel="noreferrer"
                      className="inline-flex items-center gap-1.5 text-xs text-blue-600 hover:text-blue-700 transition-colors"
                    >
                      <svg className="w-3 h-3" viewBox="0 0 100 100" fill="currentColor">
                        <path d="M6.017 4.313l55.333-4.087c6.797-.583 8.543-.19 12.817 2.917l17.663 12.443c2.913 2.14 3.883 2.723 3.883 5.053v68.243c0 4.277-1.553 6.807-6.99 7.193L24.467 99.967c-4.08.193-6.023-.39-8.16-3.113L3.3 79.94c-2.333-3.113-3.3-5.443-3.3-8.167V11.113c0-3.497 1.553-6.413 6.017-6.8z" fillRule="evenodd"/>
                      </svg>
                      <span className="underline">View in Notion</span>
                    </a>
                  </div>
                )}
              </div>
            </div>

            <div className="px-6 py-4 border-t border-gray-100 bg-bg-soft flex items-center justify-between">
              {deleteConfirm ? (
                <div className="flex items-center gap-2">
                  <span className="text-[11px] font-bold text-red-600">Confirm delete?</span>
                  <button
                    onClick={handleDelete}
                    className="px-3 py-1.5 text-[10px] font-bold uppercase bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
                    disabled={loading}
                  >
                    {loading ? 'Deleting...' : 'Yes, Delete'}
                  </button>
                  <button
                    onClick={() => setDeleteConfirm(false)}
                    className="px-3 py-1.5 text-[10px] font-bold uppercase text-ink-sub hover:text-ink transition-colors"
                  >
                    Cancel
                  </button>
                </div>
              ) : (
                <button
                  onClick={handleDelete}
                  className="text-[11px] font-bold uppercase text-red-500 hover:text-red-600 transition-colors"
                  disabled={loading}
                >
                  Delete
                </button>
              )}
              <div className="flex gap-2">
                <button
                  onClick={onClose}
                  className="px-4 py-2 text-[11px] font-bold uppercase border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors"
                >
                  Cancel
                </button>
                <button
                  onClick={handleSave}
                  disabled={loading}
                  className="px-4 py-2 text-[11px] font-bold uppercase bg-editorial text-white rounded-lg hover:bg-red-600 transition-colors disabled:opacity-50"
                >
                  {loading ? 'Saving...' : 'Save Changes'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const DayColumn = ({ day, weekdayLabel, isToday, onCardClick }) => {
      const [expanded, setExpanded] = useState(false);
      const hasMore = day.items.length > INITIAL_VISIBLE;
      const displayItems = expanded ? day.items : day.items.slice(0, INITIAL_VISIBLE);
      const hiddenCount = day.items.length - INITIAL_VISIBLE;

      return (
        <div className="min-h-[200px] md:min-h-[600px] flex flex-col">
          <div className={`p-3 text-center border-b border-gray-50 transition-colors ${isToday ? 'bg-editorial/5' : 'bg-bg-soft'}`}>
            <div className="text-[9px] font-bold uppercase text-ink-sub tracking-widest mb-0.5">
              {weekdayLabel}
            </div>
            <div className={`text-lg font-black ${isToday ? 'text-editorial' : 'text-ink'}`}>
              {day.date.getDate()}
            </div>
            {day.items.length > 0 && (
              <div className="mt-1">
                <span className="text-[8px] font-bold px-1.5 py-0.5 rounded-full bg-gray-100 text-ink-sub">
                  {day.items.length} item{day.items.length !== 1 ? 's' : ''}
                </span>
              </div>
            )}
          </div>

          <div className={`flex-1 p-2 bg-white flex flex-col gap-2 ${expanded ? 'overflow-y-auto max-h-[500px] custom-scrollbar' : 'overflow-hidden'}`}>
            {day.items.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-start pt-8 opacity-20 hover:opacity-40 transition-opacity">
                <div className="w-1 h-8 bg-gray-300 rounded-full mb-2"></div>
                <span className="text-[8px] font-bold uppercase">No Items</span>
              </div>
            ) : (
              <>
                {displayItems.map((item) => (
                  <RundownCard
                    key={item.id}
                    item={item}
                    onClick={onCardClick}
                  />
                ))}
                {hasMore && !expanded && (
                  <button
                    onClick={() => setExpanded(true)}
                    className="mt-1 py-2 text-[9px] font-bold text-ink-sub hover:text-editorial transition-colors flex items-center justify-center gap-1 rounded-lg border border-dashed border-gray-200 hover:border-editorial/30 bg-gradient-to-t from-white to-transparent"
                  >
                    <span>+{hiddenCount} more</span>
                    <span className="text-[7px]">▼</span>
                  </button>
                )}
                {expanded && hasMore && (
                  <button
                    onClick={() => setExpanded(false)}
                    className="mt-1 py-2 text-[9px] font-bold text-ink-sub hover:text-editorial transition-colors flex items-center justify-center gap-1 rounded-lg border border-dashed border-gray-200 hover:border-editorial/30 sticky bottom-0 bg-white"
                  >
                    <span>Show less</span>
                    <span className="text-[7px]">▲</span>
                  </button>
                )}
              </>
            )}
          </div>
        </div>
      );
    };

    const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    const getWeekStart = (date) => {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    };

    const getWeekDates = (start) => {
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(start);
        d.setDate(d.getDate() + i);
        return d;
      });
    };

    const formatDateKey = (date) => date.toISOString().split('T')[0];

    const App = () => {
      const [currentWeekStart, setCurrentWeekStart] = useState(getWeekStart(new Date()));
      const [weekData, setWeekData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedItem, setSelectedItem] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const loadData = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          const dates = getWeekDates(currentWeekStart);
          const startKey = formatDateKey(dates[0]);
          const endKey = formatDateKey(dates[6]);

          const items = await fetchRundownItems(startKey, endKey);

          const data = dates.map(date => {
            const key = formatDateKey(date);
            return {
              date,
              dateKey: key,
              items: items.filter(i => i.dateKey === key || i.date === key)
            };
          });

          setWeekData(data);
        } catch (error) {
          console.error("Failed to load data", error);
          setError("Failed to load data from Notion. Please try again.");
        } finally {
          setLoading(false);
        }
      }, [currentWeekStart]);

      useEffect(() => {
        loadData();
      }, [loadData]);

      const handlePrevWeek = () => {
        const d = new Date(currentWeekStart);
        d.setDate(d.getDate() - 7);
        setCurrentWeekStart(d);
      };

      const handleNextWeek = () => {
        const d = new Date(currentWeekStart);
        d.setDate(d.getDate() + 7);
        setCurrentWeekStart(d);
      };

      const handleToday = () => {
        setCurrentWeekStart(getWeekStart(new Date()));
      };

      const formatWeekLabel = () => {
        const dates = getWeekDates(currentWeekStart);
        const start = dates[0];
        const end = dates[6];
        const startMonth = start.toLocaleDateString('en-GB', { month: 'short' });
        const endMonth = end.toLocaleDateString('en-GB', { month: 'short' });

        if (startMonth === endMonth) {
          return `${start.getDate()} - ${end.getDate()} ${startMonth}`;
        }
        return `${start.getDate()} ${startMonth} - ${end.getDate()} ${endMonth}`;
      };

      const isToday = (date) => formatDateKey(date) === formatDateKey(new Date());

      const handleCardClick = (item) => {
        setSelectedItem(item);
        setIsModalOpen(true);
      };

      const handleSave = async (id, data) => {
        await updateRundownItem(id, data);
        loadData();
      };

      const handleDelete = async (id) => {
        await deleteRundownItem(id);
        loadData();
      };

      return (
        <div className="p-4 font-sans text-ink">
          <div className="bg-white rounded-2xl border border-border overflow-hidden max-w-[1400px] mx-auto transition-all duration-300 hover:shadow-xl">
            <div className="px-4 py-3 border-b border-border flex items-center gap-4 bg-white sticky top-0 z-10">
              <DotGrid />
              <h1 className="flex-1 text-[13px] font-extrabold tracking-tight uppercase text-ink">
                Editorial Production Calendar <span className="text-editorial mx-2">•</span> {formatWeekLabel()}
              </h1>

              <div className="flex gap-1">
                <button
                  onClick={handlePrevWeek}
                  className="px-2.5 py-1.5 text-[10px] font-bold bg-bg-soft hover:bg-editorial hover:text-white rounded-md transition-colors"
                >
                  ←
                </button>
                <button
                  onClick={handleToday}
                  className="px-3 py-1.5 text-[10px] font-bold bg-bg-soft hover:bg-editorial hover:text-white rounded-md transition-colors"
                >
                  Today
                </button>
                <button
                  onClick={handleNextWeek}
                  className="px-2.5 py-1.5 text-[10px] font-bold bg-bg-soft hover:bg-editorial hover:text-white rounded-md transition-colors"
                >
                  →
                </button>
              </div>
            </div>

            {loading ? (
              <div className="min-h-[400px] flex flex-col items-center justify-center gap-4 text-ink-sub">
                <DotGrid />
                <span className="text-[10px] font-bold uppercase tracking-widest">Syncing with Notion...</span>
              </div>
            ) : error ? (
              <div className="min-h-[400px] flex flex-col items-center justify-center gap-4 text-red-500">
                <span className="text-[12px] font-bold">{error}</span>
                <button
                  onClick={loadData}
                  className="px-4 py-2 text-[11px] font-bold uppercase bg-editorial text-white rounded-lg"
                >
                  Retry
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-7 divide-y md:divide-y-0 md:divide-x divide-gray-100">
                {weekData.map((day, i) => (
                  <DayColumn
                    key={day.dateKey}
                    day={day}
                    weekdayLabel={WEEKDAYS[i]}
                    isToday={isToday(day.date)}
                    onCardClick={handleCardClick}
                  />
                ))}
              </div>
            )}
          </div>

          {selectedItem && (
            <EditModal
              item={selectedItem}
              isOpen={isModalOpen}
              onClose={() => setIsModalOpen(false)}
              onSave={handleSave}
              onDelete={handleDelete}
            />
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
