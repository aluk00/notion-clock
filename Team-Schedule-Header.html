<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Rota Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
    <style>
        /* Core Layout - Zero Padding as requested */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start; /* Aligns to the left */
            align-items: center;
            height: 100vh;
            background-color: transparent; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 1.5rem; /* Space between text and dots */
            padding: 0;
            margin: 0;
        }

        /* Text Styling */
        .title-text {
            font-size: 4rem; /* Big impact text matching existing headers */
            font-weight: 900;
            color: #000000;
            letter-spacing: -0.05em; /* Tight DMG tracking */
            line-height: 1;
            text-transform: uppercase;
            opacity: 0; /* Start hidden for animation */
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animation Delays */
        .text-left { animation-delay: 0.1s; }
        .text-right { animation-delay: 0.35s; }

        /* The Dots Container - 2x2 Grid */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px; /* Spacing between dots */
            width: 44px; /* Size calibrated to 4rem text height */
            height: 44px;
            flex-shrink: 0;
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
            transform: scale(0); /* Start hidden for pop animation */
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Staggered Dot Animations */
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* Keyframes */
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }

        /* Responsive scaling */
        @media (max-width: 768px) {
            .title-text { font-size: 2.5rem; }
            .header-container { gap: 1rem; }
            .dots-grid { width: 30px; height: 30px; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Left Text -->
        <div class="title-text text-left">TEAM</div>

        <!-- Center Dots (2x2 DMG Motif) -->
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Right Text -->
        <div class="title-text text-right">ROTA</div>
    </div>

</body>
</html>
