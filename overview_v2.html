<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Overview Hub | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: transparent; }
        .cubic-bezier { transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0/client",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
        }
    }
    </script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, onSnapshot } from 'firebase/firestore';

        // --- CONFIGURATION ---
        // Hardcoded for GitHub Pages / External Hosting
        const firebaseConfig = { 
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY", 
            authDomain: "dmg-command-centre-native.firebaseapp.com", 
            projectId: "dmg-command-centre-native", 
            storageBucket: "dmg-command-centre-native.firebasestorage.app", 
            messagingSenderId: "223535956454", 
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627" 
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'dmg-command-centre-native';

        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app/projects';
        const DELIVERABLES_URL = 'https://createnotionproject-223535956454.us-central1.run.app/deliverables';

        const TEAM_COLORS = {
            Editorial: '#E94B4B',
            Creative: '#E6468B',
            Production: '#43B049',
            Social: '#F2C316',
            Operations: '#21A0D8',
            Sales: '#21A0D8',
            Executive: '#1C1C1C'
        };

        const STATUS_COLORS = {
            'Briefed': { bg: 'rgba(107,114,128,0.1)', color: '#6B7280' },
            'In Progress': { bg: 'rgba(33,160,216,0.1)', color: '#21A0D8' },
            'Review': { bg: 'rgba(245,158,11,0.1)', color: '#F59E0B' },
            'Approved': { bg: 'rgba(67,176,73,0.1)', color: '#43B049' },
            'Live': { bg: 'rgba(155,89,182,0.1)', color: '#9B59B6' }
        };

        const DotGrid = ({ color = "#DDD", activeIndex = 0 }) => (
            <div className="grid grid-cols-2 gap-0.5 w-2.5 h-2.5">
                {[0, 1, 2, 3].map((i) => (
                    <div 
                        key={i} 
                        className={`w-1 h-1 rounded-full transition-all duration-700 ${i === activeIndex ? 'opacity-100 scale-110' : 'opacity-20'}`}
                        style={{ 
                            backgroundColor: color, 
                            boxShadow: i === activeIndex ? `0 0 8px ${color}` : 'none' 
                        }}
                    />
                ))}
            </div>
        );

        const Card = ({ children, accent, wide = false, rowSpan = 1 }) => (
            <div 
                className={`relative bg-white border border-[#EAECEF] rounded-[16px] p-4 transition-all duration-500 cubic-bezier hover:-translate-y-0.5 hover:shadow-lg group ${wide ? 'col-span-2' : 'col-span-1'} ${rowSpan === 2 ? 'row-span-2 flex flex-col' : ''}`}
            >
                <div 
                    className="absolute top-0 left-0 right-0 h-[3px] opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                    style={{ backgroundColor: accent }}
                />
                {children}
            </div>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [projects, setProjects] = useState([]);
            const [deliverables, setDeliverables] = useState([]);
            const [loading, setLoading] = useState(true);
            const [pulse, setPulse] = useState(0);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        // For external hosting, allow anonymous sign-in if no token is present
                        await signInAnonymously(auth);
                    } catch (err) {
                        console.error("Auth failed", err);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                const interval = setInterval(() => setPulse(p => (p + 1) % 4), 3000);
                return () => { unsubscribe(); clearInterval(interval); };
            }, []);

            useEffect(() => {
                if (!user) return;
                const fetchData = async () => {
                    try {
                        const [pRes, dRes] = await Promise.all([fetch(API_URL), fetch(DELIVERABLES_URL)]);
                        const pData = await pRes.json();
                        const dData = await dRes.json();
                        setProjects(pData.projects || []);
                        setDeliverables(dData.deliverables || dData.projects || []);
                        setLoading(false);
                    } catch (err) { console.error("Sync Error", err); }
                };
                fetchData();
                const interval = setInterval(fetchData, 60000);
                return () => clearInterval(interval);
            }, [user]);

            const stats = useMemo(() => {
                const normalize = (s) => (s || '').toLowerCase().trim();
                const wonProjects = projects.filter(p => ['complete', 'won', 'completed'].includes(normalize(p.status)) || ['complete', 'won'].includes(normalize(p.dealStage)));
                const wonValue = wonProjects.reduce((acc, p) => acc + (parseFloat(String(p.budget).replace(/[^0-9.]/g, '')) || 0), 0);
                const activeProjects = projects.filter(p => !['complete', 'won', 'completed', 'lost', 'cancelled'].includes(normalize(p.status)) && normalize(p.status) !== '');
                const activeWorkflowCount = deliverables.filter(d => !['complete', 'approved', 'done', 'live'].includes(normalize(d.status)) && normalize(d.status) !== '').length;
                const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate() + 7);
                const dueDeliverables = deliverables.filter(d => {
                    const date = new Date(d.dueDate || d.due_date);
                    return date >= new Date().setHours(0,0,0,0) && date <= weekEnd;
                }).sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
                const activityFeed = [...projects].sort((a, b) => new Date(b.lastEdited || 0) - new Date(a.lastEdited || 0)).slice(0, 6);
                const partners = activeProjects.reduce((acc, p) => {
                    const name = p.brand || p.client;
                    if (name) acc[name] = (acc[name] || 0) + 1;
                    return acc;
                }, {});
                const topPartners = Object.entries(partners).sort((a, b) => b[1] - a[1]);
                const reviewQueue = projects.filter(p => normalize(p.status).includes('review'));
                return { won: { count: wonProjects.length, value: wonValue }, active: { count: activeProjects.length, workflow: activeWorkflowCount }, due: dueDeliverables, activity: activityFeed, partners: topPartners, review: reviewQueue.length };
            }, [projects, deliverables]);

            const formatCurrency = (val) => {
                if (val >= 1000000) return `£${(val / 1000000).toFixed(1)}M`;
                if (val >= 1000) return `£${Math.round(val / 1000)}K`;
                return `£${val}`;
            };

            const formatTime = (ts) => {
                if (!ts) return 'Active';
                const s = Math.floor((new Date() - new Date(ts)) / 1000);
                if (s < 3600) return Math.floor(s/60) + 'm ago';
                if (s < 86400) return Math.floor(s/3600) + 'h ago';
                return Math.floor(s/86400) + 'd ago';
            };

            if (loading) {
                return <div className="flex items-center justify-center h-48 bg-transparent"><DotGrid color="#21A0D8" activeIndex={pulse} /></div>;
            }

            return (
                <div className="grid grid-cols-2 gap-3 max-w-[420px] mx-auto p-4 antialiased font-sans">
                    <Card accent="#43B049">
                        <div className="flex items-center gap-2 mb-2"><DotGrid color="#43B049" activeIndex={pulse} /><span className="text-[9px] font-bold text-[#757575] uppercase tracking-wider">Commercial Status (Q1)</span></div>
                        <div className="flex items-baseline gap-1.5"><span className="text-[32px] font-black leading-none text-[#43B049] font-mono">{stats.won.count.toString().padStart(2, '0')}</span><span className="text-[9px] font-black text-[#9CA3AF] uppercase">Wins</span></div>
                        <div className="mt-2 pt-2 border-t border-gray-50 flex justify-between items-center"><span className="text-[8px] font-bold text-[#9CA3AF] uppercase">Total Revenue Won</span><span className="text-[10px] font-black text-[#1C1C1C] font-mono">{formatCurrency(stats.won.value)}</span></div>
                    </Card>
                    <Card accent="#21A0D8">
                        <div className="flex items-center gap-2 mb-2"><DotGrid color="#21A0D8" activeIndex={(pulse + 1) % 4} /><span className="text-[9px] font-bold text-[#757575] uppercase tracking-wider">Production Velocity</span></div>
                        <div className="flex items-baseline gap-1.5"><span className="text-[32px] font-black leading-none text-[#21A0D8] font-mono">{stats.active.count.toString().padStart(2, '0')}</span><span className="text-[9px] font-black text-[#9CA3AF] uppercase">Active</span></div>
                        <div className="mt-2 pt-2 border-t border-gray-50 flex justify-between items-center"><span className="text-[8px] font-bold text-[#9CA3AF] uppercase">Live Workflow Count</span><span className="text-[10px] font-black text-[#1C1C1C] font-mono">{stats.active.workflow.toString().padStart(2, '0')}</span></div>
                    </Card>
                    <Card accent="#E6468B">
                        <div className="flex items-center gap-2 mb-2"><DotGrid color="#E6468B" activeIndex={(pulse + 2) % 4} /><span className="text-[9px] font-bold text-[#757575] uppercase tracking-wider">Asset Deadlines (7D)</span></div>
                        <div className="space-y-1.5 mt-1 overflow-hidden h-[50px]">
                            {stats.due.slice(0, 3).map((d, i) => (
                                <div key={i} className="flex justify-between items-center text-[9px] font-bold border-b border-gray-50 last:border-0 pb-1"><span className="truncate pr-2 text-[#1C1C1C]">{d.title || d.name}</span><span className="font-mono text-[#9CA3AF] bg-gray-50 px-1 rounded">{new Date(d.dueDate || d.due_date).getDate()}th</span></div>
                            ))}
                            {stats.due.length === 0 && <div className="text-[9px] text-[#9CA3AF] italic">No immediate deadlines</div>}
                        </div>
                        <div className="mt-2 pt-2 border-t border-gray-50 text-[8px] font-black text-[#E6468B] uppercase tracking-tighter">{stats.due.length} Deliverables Pending</div>
                    </Card>
                    <Card accent="#F2C316">
                        <div className="flex items-center gap-2 mb-2"><DotGrid color="#F2C316" activeIndex={(pulse + 3) % 4} /><span className="text-[9px] font-bold text-[#757575] uppercase tracking-wider">Partners</span></div>
                        <div className="flex flex-wrap gap-1.5 mt-1">
                            {stats.partners.slice(0, 5).map(([name, count]) => (
                                <span key={name} className="text-[8.5px] font-bold px-2 py-0.5 bg-[#F9FAFB] rounded-full text-[#757575] border border-black/5 hover:bg-[#21A0D8] hover:text-white hover:border-[#21A0D8] transition-colors cursor-pointer">{name.substring(0, 8)} <span className="opacity-50">({count})</span></span>
                            ))}
                        </div>
                    </Card>
                    <Card accent="#1C1C1C" wide rowSpan={2}>
                        <div className="flex items-center gap-2 mb-3"><DotGrid color="#1C1C1C" activeIndex={pulse} /><span className="text-[9px] font-bold text-[#757575] uppercase tracking-wider">Latest Activity</span><span className="ml-auto text-[8px] font-black text-[#9CA3AF] uppercase">Live Pulse</span></div>
                        <div className="space-y-2 flex-1 overflow-hidden">
                            {stats.activity.map((item) => {
                                const teamColor = TEAM_COLORS[item.team] || '#6B7280';
                                let statusStyle = { bg: '#F0F0F0', color: '#666' };
                                const s = (item.status || '').toLowerCase();
                                if (s.includes('brief')) statusStyle = STATUS_COLORS['Briefed'];
                                if (s.includes('progress')) statusStyle = STATUS_COLORS['In Progress'];
                                if (s.includes('review')) statusStyle = STATUS_COLORS['Review'];
                                if (s.includes('complete') || s.includes('won')) statusStyle = STATUS_COLORS['Live'];
                                return (
                                    <div key={item.id} className="flex gap-2.5 p-2 bg-[#F9FAFB] rounded-[10px] items-center hover:bg-white hover:shadow-sm transition-all duration-200 cursor-default">
                                        <div className="w-[3px] h-6 rounded-full flex-shrink-0" style={{ backgroundColor: teamColor }} />
                                        <div className="flex-1 min-w-0">
                                            <div className="text-[10px] font-bold text-[#1C1C1C] truncate uppercase tracking-tight">{item.title || 'Untitled'}</div>
                                            <div className="flex items-center gap-1.5 mt-0.5"><span className="text-[8px] font-bold text-[#9CA3AF] uppercase tracking-wide">{item.client || 'Internal'}</span>{item.status && <span className="text-[7px] font-black uppercase px-1.5 py-0.5 rounded-[4px] whitespace-nowrap" style={{ backgroundColor: statusStyle.bg, color: statusStyle.color }}>{item.status}</span>}</div>
                                        </div>
                                        <span className="text-[8px] font-bold text-[#BCBCBC] font-mono uppercase whitespace-nowrap">{formatTime(item.lastEdited)}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </Card>
                    <Card accent="#F59E0B" wide>
                        <div className="flex items-center gap-2 mb-2"><DotGrid color="#F59E0B" activeIndex={pulse} /><span className="text-[9px] font-bold text-[#757575] uppercase tracking-wider">Awaiting Sign-off</span><span className="ml-auto text-[10px] font-black font-mono text-[#F59E0B]">{stats.review}</span></div>
                        <div className="mt-1 space-y-1.5">
                            {projects.filter(p => (p.status||'').toLowerCase().includes('review')).slice(0, 2).map(p => (
                                <div key={p.id} className="flex items-center gap-2 bg-[#FEF3C7] bg-opacity-20 p-1.5 rounded-lg border border-[#F59E0B] border-opacity-10"><div className="w-1.5 h-1.5 rounded-full bg-[#F59E0B]"></div><span className="truncate text-[9px] font-bold text-[#1C1C1C] uppercase">{p.title}</span></div>
                            ))}
                        </div>
                    </Card>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
