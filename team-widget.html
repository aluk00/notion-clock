<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #21A0D8;
            --team-executive: #1C1C1C;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 16px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 340px;
            overflow: hidden;
        }
        .widget-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot-grid span:nth-child(1) { animation-delay: 0s; }
        .dot-grid span:nth-child(2) { animation-delay: 0.3s; }
        .dot-grid span:nth-child(3) { animation-delay: 0.6s; }
        .dot-grid span:nth-child(4) { animation-delay: 0.3s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .team-tabs {
            display: flex;
            padding: 8px 12px;
            gap: 4px;
            border-bottom: 1px solid #F5F5F5;
            overflow-x: auto;
        }
        .team-tabs::-webkit-scrollbar { display: none; }
        .team-tab {
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: transparent;
            color: var(--ink-sub);
            border: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .team-tab:hover {
            border-color: var(--tab-color, #EEE);
            color: var(--tab-color, var(--ink));
        }
        .team-tab.active {
            background: var(--tab-color, var(--ink));
            border-color: var(--tab-color, var(--ink));
            color: #FFF;
        }
        .people-list {
            max-height: 320px;
            overflow-y: auto;
            padding: 8px;
        }
        .people-list::-webkit-scrollbar { width: 4px; }
        .people-list::-webkit-scrollbar-track { background: transparent; }
        .people-list::-webkit-scrollbar-thumb { background: #EEE; border-radius: 4px; }
        
        .person-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        .person-row:hover {
            background: var(--bg-soft);
        }
        .person-row:hover .avatar {
            transform: scale(1.08);
            box-shadow: 0 0 16px color-mix(in srgb, var(--team-color) 30%, transparent);
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 11px;
            color: var(--team-color, var(--ink-sub));
            border: 2px solid color-mix(in srgb, var(--team-color) 20%, transparent);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .manager-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--team-color);
            border: 2px solid #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #FFF;
        }
        .count-bubble {
            font-size: 10px;
            font-weight: 900;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-soft);
            color: var(--ink-sub);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .person-row {
            animation: fadeIn 0.25s ease forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'dmg-command-centre-native';
        
        const teamColors = {
            Editorial: '#E94B4B',
            Creative: '#E6468B',
            Production: '#43B049',
            Social: '#F2C316',
            Operations: '#21A0D8',
            Executive: '#1C1C1C'
        };
        
        const DotGrid = ({ colors }) => (
            <div className="dot-grid">
                {colors.map((c, i) => (
                    <span key={i} style={{ background: c }}></span>
                ))}
            </div>
        );
        
        function TeamWidget() {
            const { useState, useEffect } = React;
            const [staff, setStaff] = useState([]);
            const [activeTeam, setActiveTeam] = useState('All');
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                auth.signInAnonymously();
                
                const staffRef = db.collection('artifacts')
                    .doc(appId)
                    .collection('public')
                    .doc('data')
                    .collection('staff_directory');
                
                const unsub = staffRef.onSnapshot(snap => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setStaff(data);
                    setLoading(false);
                });
                
                return () => unsub();
            }, []);
            
            const teams = ['All', 'Creative', 'Production', 'Editorial', 'Operations'];
            
            const filtered = activeTeam === 'All' 
                ? staff 
                : staff.filter(s => s.team === activeTeam);
            
            const teamCounts = teams.reduce((acc, t) => {
                acc[t] = t === 'All' ? staff.length : staff.filter(s => s.team === t).length;
                return acc;
            }, {});
            
            return (
                <div className="widget">
                    <div className="widget-header">
                        <DotGrid colors={[
                            teamColors.Creative,
                            teamColors.Production,
                            teamColors.Editorial,
                            teamColors.Operations
                        ]} />
                        <h2 className="text-[12px] font-black uppercase tracking-tight text-[--ink]">
                            Team
                        </h2>
                        <span className="count-bubble ml-auto">
                            {staff.length}
                        </span>
                    </div>
                    
                    <div className="team-tabs">
                        {teams.map(team => (
                            <button
                                key={team}
                                className={`team-tab ${activeTeam === team ? 'active' : ''}`}
                                style={{ '--tab-color': teamColors[team] || '#1C1C1C' }}
                                onClick={() => setActiveTeam(team)}
                            >
                                {team}
                                {teamCounts[team] > 0 && (
                                    <span className="ml-1 opacity-60">
                                        {teamCounts[team]}
                                    </span>
                                )}
                            </button>
                        ))}
                    </div>
                    
                    <div className="people-list">
                        {loading ? (
                            <div className="py-8 text-center">
                                <DotGrid colors={['#DDD', '#DDD', '#DDD', '#DDD']} />
                            </div>
                        ) : filtered.length === 0 ? (
                            <div className="py-8 text-center">
                                <p className="text-[11px] font-semibold text-[--ink-sub]">
                                    No team members
                                </p>
                            </div>
                        ) : (
                            filtered.map((person, idx) => {
                                const color = teamColors[person.team] || '#757575';
                                const initials = `${person.firstName?.[0] || ''}${person.lastName?.[0] || ''}`;
                                
                                return (
                                    <div 
                                        key={person.id}
                                        className="person-row"
                                        style={{ 
                                            '--team-color': color,
                                            animationDelay: `${idx * 0.03}s`
                                        }}
                                    >
                                        <div className="relative">
                                            <div className="avatar">
                                                {initials}
                                            </div>
                                            {person.isManager && (
                                                <div className="manager-badge">★</div>
                                            )}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="text-[12px] font-bold text-[--ink] truncate">
                                                {person.firstName} {person.lastName}
                                            </div>
                                            <div className="text-[9px] font-semibold text-[--ink-sub] uppercase tracking-wide truncate">
                                                {person.role}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TeamWidget />);
    </script>
</body>
</html>
