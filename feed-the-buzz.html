<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Buzz | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        .widget-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            background: #FFF;
            z-index: 10;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .header-title { font-size: 18px; font-weight: 900; color: var(--ink); }
        .header-sub { font-size: 12px; color: var(--ink-sub); margin-left: auto; }
        
        .feed-list {
            display: flex;
            flex-direction: column;
        }
        
        .activity-item {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 16px;
            transition: background 0.15s;
        }
        .activity-item:hover { background: var(--bg-soft); }
        .activity-item:last-child { border-bottom: none; }
        
        .activity-item[data-type="comment"] { border-left: 4px solid var(--dmg-blue); }
        .activity-item[data-type="mood"] { border-left: 4px solid var(--team-creative); }
        .activity-item[data-type="milestone"] { border-left: 4px solid var(--team-production); }
        .activity-item[data-type="mention"] { border-left: 4px solid var(--team-editorial); }
        .activity-item[data-type="poke"] { border-left: 4px solid #F59E0B; }
        
        .avatar-stack { display: flex; flex-shrink: 0; }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #FFF;
            border: 3px solid #FFF;
            margin-left: -12px;
            cursor: pointer;
        }
        .avatar:first-child { margin-left: 0; }
        .avatar-more { background: var(--border); color: var(--ink-sub); font-size: 11px; }
        
        .activity-content { flex: 1; min-width: 0; }
        .activity-text { font-size: 15px; line-height: 1.5; color: var(--ink); margin-bottom: 6px; }
        .activity-text strong { font-weight: 700; cursor: pointer; }
        .activity-text strong:hover { color: var(--dmg-blue); }
        .activity-quote {
            font-size: 14px;
            font-style: italic;
            color: var(--ink-sub);
            padding: 12px 16px;
            background: var(--bg-soft);
            border-radius: 12px;
            margin: 10px 0;
            border-left: 3px solid var(--border);
        }
        .activity-timestamp { font-size: 12px; color: var(--ink-sub); }
        .activity-emoji { font-size: 28px; flex-shrink: 0; }
        
        .mood-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #FEF3C7;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 700;
            color: #B45309;
            margin-top: 6px;
        }
        
        .milestone-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--team-production) 0%, #2D8A32 100%);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #FFF;
            margin-top: 8px;
        }
        
        .poke-btn {
            padding: 8px 16px;
            border: 2px solid #F59E0B;
            background: #FFFBEB;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            color: #B45309;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .poke-btn:hover { background: #FEF3C7; }
        
        .demo-badge {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: var(--dmg-blue);
            padding: 4px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Operations': '#9333EA'
        };

        const DEMO_ACTIVITY = [
            { type: 'reaction', people: [{n:'Gemma',t:'Production'},{n:'Nick B',t:'Creative'},{n:'Hugo M',t:'Production'},{n:'Isobel',t:'Editorial'}], emoji: '🔥', target: 'Mimi Yates', time: '2m' },
            { type: 'poke', from: {n:'Dan Q',t:'Social'}, to: 'you', time: '5m' },
            { type: 'mood', person: {n:'Ana',t:'Creative'}, mood: {emoji:'🔥',label:'On Fire'}, time: '8m' },
            { type: 'comment', person: {n:'Dan Q',t:'Social'}, target: 'Nick B', quote: '"This is why \'I tried X so you don\'t have to\' works so well for us"', time: '15m' },
            { type: 'reaction', people: [{n:'Ana',t:'Creative'},{n:'Nick B',t:'Creative'}], emoji: '😍', target: 'Kaylee A', time: '22m' },
            { type: 'milestone', project: 'Chery Campaign', status: 'Creative Approved', time: '45m' },
            { type: 'mood', person: {n:'Hugo M',t:'Production'}, mood: {emoji:'☕',label:'Need Coffee'}, time: '1h' },
            { type: 'poke', from: {n:'Mimi Yates',t:'Social'}, to: 'Kaylee A', time: '1h' },
            { type: 'mention', person: {n:'Hugo M',t:'Production'}, mentioned: 'Mimi', time: '1h' },
            { type: 'reaction', people: [{n:'Ana',t:'Creative'},{n:'Nick B',t:'Creative'},{n:'Sophia S',t:'Editorial'}], emoji: '👏', target: 'Sophia S', time: '2h' },
            { type: 'comment', person: {n:'Kaylee A',t:'Editorial'}, target: 'Ana', quote: '"The Street Talks format is perfect for this brief"', time: '2h' },
            { type: 'mood', person: {n:'Sophia S',t:'Editorial'}, mood: {emoji:'💪',label:'Crushing It'}, time: '3h' },
            { type: 'milestone', project: 'Sky Vegas Little Wins', status: 'Published', time: '3h' },
            { type: 'reaction', people: [{n:'Dan Q',t:'Social'},{n:'Henry W',t:'Social'}], emoji: '🎉', target: 'the team', time: '4h' },
            { type: 'poke', from: {n:'Nick B',t:'Creative'}, to: 'Hugo M', time: '4h' },
            { type: 'mention', person: {n:'Sophia S',t:'Editorial'}, mentioned: 'Dan Q', time: '5h' },
            { type: 'mood', person: {n:'Mimi Yates',t:'Social'}, mood: {emoji:'😤',label:'In The Zone'}, time: '5h' },
            { type: 'comment', person: {n:'Nick B',t:'Creative'}, target: 'Ellie B', quote: '"This hook is brilliant. Let\'s greenlight it."', time: '6h' },
            { type: 'reaction', people: [{n:'Gemma',t:'Production'},{n:'Tom R',t:'Operations'}], emoji: '🔥', target: 'Ana', time: '6h' },
            { type: 'milestone', project: 'Wuthering Heights Valentine\'s', status: 'In Production', time: '8h' }
        ];

        const root = document.getElementById('root');
        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = n => n.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);

        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">The Buzz</h2>
                        <span class="header-sub">Activity Feed</span>
                        <span class="demo-badge">Preview</span>
                    </div>
                    <div class="feed-list">
                        ${DEMO_ACTIVITY.map(a => renderActivity(a)).join('')}
                    </div>
                </div>
            `;
        }

        function renderActivity(a) {
            if (a.type === 'reaction') {
                const showCount = Math.min(a.people.length, 3);
                const extra = a.people.length - showCount;
                return `
                    <div class="activity-item" data-type="reaction">
                        <div class="avatar-stack">
                            ${a.people.slice(0, showCount).map(p => `<div class="avatar" style="background:${getTeamColor(p.t)}">${getInitials(p.n)}</div>`).join('')}
                            ${extra > 0 ? `<div class="avatar avatar-more">+${extra}</div>` : ''}
                        </div>
                        <div class="activity-content">
                            <div class="activity-text"><strong>${a.people[0].n}</strong>${a.people.length > 1 ? `, <strong>${a.people[1].n}</strong>` : ''}${a.people.length > 2 ? ` and ${a.people.length - 2} other${a.people.length > 3 ? 's' : ''}` : ''} reacted ${a.emoji} to <strong>${a.target}</strong>'s post</div>
                            <div class="activity-timestamp">${a.time}</div>
                        </div>
                        <div class="activity-emoji">${a.emoji}</div>
                    </div>
                `;
            }
            if (a.type === 'mood') {
                return `
                    <div class="activity-item" data-type="mood">
                        <div class="avatar" style="background:${getTeamColor(a.person.t)}">${getInitials(a.person.n)}</div>
                        <div class="activity-content">
                            <div class="activity-text"><strong>${a.person.n}</strong> updated their mood</div>
                            <div class="mood-chip"><span>${a.mood.emoji}</span><span>${a.mood.label}</span></div>
                            <div class="activity-timestamp" style="margin-top:8px">${a.time}</div>
                        </div>
                    </div>
                `;
            }
            if (a.type === 'comment') {
                return `
                    <div class="activity-item" data-type="comment">
                        <div class="avatar" style="background:${getTeamColor(a.person.t)}">${getInitials(a.person.n)}</div>
                        <div class="activity-content">
                            <div class="activity-text"><strong>${a.person.n}</strong> commented on <strong>${a.target}</strong>'s post</div>
                            <div class="activity-quote">${a.quote}</div>
                            <div class="activity-timestamp">${a.time}</div>
                        </div>
                    </div>
                `;
            }
            if (a.type === 'milestone') {
                return `
                    <div class="activity-item" data-type="milestone">
                        <div class="avatar" style="background:var(--team-production)">🎯</div>
                        <div class="activity-content">
                            <div class="activity-text"><strong>${a.project}</strong> hit a milestone</div>
                            <div class="milestone-badge">🎉 ${a.status}</div>
                            <div class="activity-timestamp" style="margin-top:8px">${a.time}</div>
                        </div>
                    </div>
                `;
            }
            if (a.type === 'mention') {
                return `
                    <div class="activity-item" data-type="mention">
                        <div class="avatar" style="background:${getTeamColor(a.person.t)}">${getInitials(a.person.n)}</div>
                        <div class="activity-content">
                            <div class="activity-text"><strong>${a.person.n}</strong> mentioned <strong>@${a.mentioned}</strong> in a post</div>
                            <div class="activity-timestamp">${a.time}</div>
                        </div>
                        <div class="activity-emoji">👋</div>
                    </div>
                `;
            }
            if (a.type === 'poke') {
                return `
                    <div class="activity-item" data-type="poke">
                        <div class="avatar" style="background:${getTeamColor(a.from.t)}">${getInitials(a.from.n)}</div>
                        <div class="activity-content">
                            <div class="activity-text"><strong>${a.from.n}</strong> poked <strong>${a.to}</strong> 👉</div>
                            ${a.to === 'you' ? '<button class="poke-btn" onclick="alert(\'You poked back! 👉\')">👉 Poke Back</button>' : ''}
                            <div class="activity-timestamp" style="margin-top:8px">${a.time}</div>
                        </div>
                        <div class="activity-emoji">👉</div>
                    </div>
                `;
            }
            return '';
        }

        onAuthStateChanged(auth, u => { if (u) render(); else signInAnonymously(auth); });
    </script>
</body>
</html>
