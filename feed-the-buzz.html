<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Buzz | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }
        .widget-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--team-social);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .header-title { font-size: 15px; font-weight: 900; color: var(--ink); }
        .header-sub { font-size: 11px; color: var(--ink-sub); margin-left: auto; }
        
        .activity-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: #F0F0F0;
        }
        
        .activity-item {
            display: flex;
            gap: 14px;
            padding: 16px 20px;
            background: #FFF;
            transition: background 0.15s ease;
        }
        .activity-item:hover { background: var(--bg-soft); }
        
        .avatar-stack {
            display: flex;
            flex-shrink: 0;
        }
        .avatar-stack .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #FFF;
            border: 2px solid #FFF;
            margin-right: -10px;
        }
        .avatar-stack .avatar:last-child { margin-right: 0; }
        .avatar-stack .avatar-overflow { background: var(--ink-sub); font-size: 10px; }
        
        .activity-content { flex: 1; min-width: 0; }
        .activity-text { font-size: 13px; line-height: 1.4; color: var(--ink); }
        .activity-text strong { font-weight: 700; cursor: pointer; }
        .activity-text strong:hover { color: var(--dmg-blue); }
        .activity-time { font-size: 11px; color: var(--ink-sub); margin-top: 4px; }
        .activity-icon { font-size: 18px; flex-shrink: 0; }
        
        .activity-item.comment { border-left: 4px solid var(--dmg-blue); }
        .activity-item.mood { border-left: 4px solid var(--team-creative); }
        .activity-item.milestone { border-left: 4px solid var(--team-production); }
        .activity-item.mention { border-left: 4px solid var(--team-editorial); }
        
        .mood-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--bg-soft);
            padding: 5px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 6px;
        }
        .comment-preview {
            background: var(--bg-soft);
            padding: 10px 12px;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--ink);
            font-style: italic;
        }
        .demo-badge {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: #E6468B;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .empty-state {
            padding: 60px 24px;
            text-align: center;
            grid-column: 1 / -1;
            background: #FFF;
        }
        @media (max-width: 700px) {
            .activity-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Social Video': '#F2C316', 'Operations': '#9333EA', 'Sales': '#F97316'
        };

        const DEMO_ACTIVITY = [
            { id: 'act-1', type: 'reaction', emoji: '🔥', actors: [{ name: 'Gemma', team: 'Production' }, { name: 'Nick B', team: 'Creative' }, { name: 'Hugo M', team: 'Production' }, { name: 'Isobel W', team: 'Editorial' }], target: { author: 'Mimi Yates' }, timestamp: Date.now() - 300000 },
            { id: 'act-2', type: 'mood', actor: { name: 'Ana', team: 'Creative' }, mood: { emoji: '🔥', label: 'On Fire' }, timestamp: Date.now() - 900000 },
            { id: 'act-3', type: 'comment', actor: { name: 'Dan Q', team: 'Social' }, target: { type: 'post', author: 'Nick B' }, comment: 'This is why "I tried X so you don\'t have to" works so well', timestamp: Date.now() - 1800000 },
            { id: 'act-4', type: 'reaction', emoji: '😂', actors: [{ name: 'Ana', team: 'Creative' }, { name: 'Nick B', team: 'Creative' }, { name: 'Hugo M', team: 'Production' }], target: { author: 'Kaylee A' }, timestamp: Date.now() - 3600000 },
            { id: 'act-5', type: 'milestone', target: { project: 'Chery Campaign', status: 'Creative Approved' }, timestamp: Date.now() - 7200000 },
            { id: 'act-6', type: 'mood', actor: { name: 'Hugo M', team: 'Production' }, mood: { emoji: '☕', label: 'Need Coffee' }, timestamp: Date.now() - 10800000 },
            { id: 'act-7', type: 'mention', actor: { name: 'Hugo M', team: 'Production' }, mentioned: { name: 'Mimi' }, timestamp: Date.now() - 14400000 },
            { id: 'act-8', type: 'reaction', emoji: '👏', actors: [{ name: 'Ana', team: 'Creative' }, { name: 'Nick B', team: 'Creative' }], target: { author: 'Sophia S' }, timestamp: Date.now() - 21600000 }
        ];

        let activities = DEMO_ACTIVITY;
        let isDemo = true;
        const root = document.getElementById('root');

        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = n => n.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
        const timeAgo = ts => {
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 60) return 'just now';
            const m = Math.floor(s / 60); if (m < 60) return `${m}m`;
            const h = Math.floor(m / 60); if (h < 24) return `${h}h`;
            return `${Math.floor(h / 24)}d`;
        };
        const formatActors = (a, lim = 2) => {
            if (!a?.length) return '';
            if (a.length === 1) return `<strong>${a[0].name}</strong>`;
            if (a.length === 2) return `<strong>${a[0].name}</strong> and <strong>${a[1].name}</strong>`;
            return `${a.slice(0, lim).map(x => `<strong>${x.name}</strong>`).join(', ')} and ${a.length - lim} other${a.length - lim > 1 ? 's' : ''}`;
        };

        function render() {
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">The Buzz</h2>
                        <span class="header-sub">Activity Feed</span>
                        ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    </div>
                    <div class="activity-list">
                        ${activities.map(a => {
                            if (a.type === 'reaction') {
                                const avs = a.actors.slice(0, 3), ov = a.actors.length > 3 ? a.actors.length - 3 : 0;
                                return `<div class="activity-item"><div class="avatar-stack">${avs.map(x => `<div class="avatar" style="background:${getTeamColor(x.team)}">${getInitials(x.name)}</div>`).join('')}${ov ? `<div class="avatar avatar-overflow">+${ov}</div>` : ''}</div><div class="activity-content"><div class="activity-text">${formatActors(a.actors)} reacted ${a.emoji} to <strong>${a.target.author}</strong>'s post</div><div class="activity-time">${timeAgo(a.timestamp)}</div></div><div class="activity-icon">${a.emoji}</div></div>`;
                            }
                            if (a.type === 'mood') {
                                return `<div class="activity-item mood"><div class="avatar-stack"><div class="avatar" style="background:${getTeamColor(a.actor.team)}">${getInitials(a.actor.name)}</div></div><div class="activity-content"><div class="activity-text"><strong>${a.actor.name}</strong> updated their mood</div><div class="mood-badge"><span>${a.mood.emoji}</span><span>${a.mood.label}</span></div><div class="activity-time">${timeAgo(a.timestamp)}</div></div></div>`;
                            }
                            if (a.type === 'comment') {
                                return `<div class="activity-item comment"><div class="avatar-stack"><div class="avatar" style="background:${getTeamColor(a.actor.team)}">${getInitials(a.actor.name)}</div></div><div class="activity-content"><div class="activity-text"><strong>${a.actor.name}</strong> commented on <strong>${a.target.author}</strong>'s post</div><div class="comment-preview">"${a.comment}"</div><div class="activity-time">${timeAgo(a.timestamp)}</div></div></div>`;
                            }
                            if (a.type === 'milestone') {
                                return `<div class="activity-item milestone"><div class="avatar-stack"><div class="avatar" style="background:var(--team-production)">🏆</div></div><div class="activity-content"><div class="activity-text"><strong>${a.target.project}</strong> hit <strong>${a.target.status}</strong></div><div class="activity-time">${timeAgo(a.timestamp)}</div></div><div class="activity-icon">🎉</div></div>`;
                            }
                            if (a.type === 'mention') {
                                return `<div class="activity-item mention"><div class="avatar-stack"><div class="avatar" style="background:${getTeamColor(a.actor.team)}">${getInitials(a.actor.name)}</div></div><div class="activity-content"><div class="activity-text"><strong>${a.actor.name}</strong> mentioned <strong>@${a.mentioned.name}</strong> in a post</div><div class="activity-time">${timeAgo(a.timestamp)}</div></div><div class="activity-icon">📣</div></div>`;
                            }
                            return '';
                        }).join('')}
                    </div>
                </div>
            `;
        }

        onAuthStateChanged(auth, u => { if (u) render(); else signInAnonymously(auth); });
    </script>
</body>
</html>
