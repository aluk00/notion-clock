<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Buzz | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 380px;
            overflow: hidden;
        }
        .widget-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--team-social);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .header-title { font-size: 13px; font-weight: 900; color: var(--ink); }
        .header-sub { font-size: 9px; color: var(--ink-sub); margin-left: auto; }
        
        .activity-list {
            max-height: 420px;
            overflow-y: auto;
        }
        
        /* Activity Item */
        .activity-item {
            display: flex;
            gap: 12px;
            padding: 12px 18px;
            border-bottom: 1px solid #F5F5F5;
            transition: background 0.15s ease;
        }
        .activity-item:hover { background: var(--bg-soft); }
        .activity-item:last-child { border-bottom: none; }
        
        /* Stacked avatars */
        .avatar-stack {
            display: flex;
            flex-shrink: 0;
        }
        .avatar-stack .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #FFF;
            border: 2px solid #FFF;
            margin-right: -10px;
        }
        .avatar-stack .avatar:last-child { margin-right: 0; }
        .avatar-stack .avatar-overflow {
            background: var(--ink-sub);
            font-size: 9px;
        }
        
        .activity-content {
            flex: 1;
            min-width: 0;
        }
        .activity-text {
            font-size: 12px;
            line-height: 1.4;
            color: var(--ink);
        }
        .activity-text strong {
            font-weight: 700;
            cursor: pointer;
        }
        .activity-text strong:hover { color: var(--dmg-blue); }
        .activity-time {
            font-size: 10px;
            color: var(--ink-sub);
            margin-top: 2px;
        }
        
        .activity-icon {
            font-size: 16px;
            flex-shrink: 0;
        }
        
        /* Activity types */
        .activity-item.reaction .activity-icon { opacity: 1; }
        .activity-item.comment { border-left: 3px solid var(--dmg-blue); }
        .activity-item.mood { border-left: 3px solid var(--team-creative); }
        .activity-item.milestone { border-left: 3px solid var(--team-production); }
        .activity-item.mention { border-left: 3px solid var(--team-editorial); }
        
        /* Mood preview */
        .mood-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-soft);
            padding: 4px 8px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 700;
            margin-top: 4px;
        }
        
        /* Comment preview */
        .comment-preview {
            background: var(--bg-soft);
            padding: 8px 10px;
            border-radius: 8px;
            margin-top: 6px;
            font-size: 11px;
            color: var(--ink);
            font-style: italic;
        }
        
        .demo-badge {
            font-size: 7px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: #E6468B;
            padding: 3px 6px;
            border-radius: 4px;
        }
        
        .empty-state {
            padding: 40px 20px;
            text-align: center;
        }
        .empty-icon { font-size: 32px; margin-bottom: 12px; }
        .empty-title { font-size: 14px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
        .empty-sub { font-size: 11px; color: var(--ink-sub); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Social Video': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316'
        };

        // Demo activity data
        const DEMO_ACTIVITY = [
            {
                id: 'act-1',
                type: 'reaction',
                emoji: '🔥',
                actors: [
                    { name: 'Gemma', team: 'Production' },
                    { name: 'Nick B', team: 'Creative' },
                    { name: 'Hugo M', team: 'Production' },
                    { name: 'Isobel W', team: 'Editorial' }
                ],
                target: { type: 'post', author: 'Mimi Yates', title: 'Sky Vegas video drop' },
                timestamp: Date.now() - 300000
            },
            {
                id: 'act-2',
                type: 'mood',
                actor: { name: 'Ana', team: 'Creative' },
                mood: { emoji: '🔥', label: 'On Fire' },
                timestamp: Date.now() - 900000
            },
            {
                id: 'act-3',
                type: 'comment',
                actor: { name: 'Dan Q', team: 'Social' },
                target: { type: 'post', author: 'Nick B', title: 'Hot take about hooks' },
                comment: 'This is why "I tried X so you don\'t have to" works so well',
                timestamp: Date.now() - 1800000
            },
            {
                id: 'act-4',
                type: 'reaction',
                emoji: '😂',
                actors: [
                    { name: 'Ana', team: 'Creative' },
                    { name: 'Nick B', team: 'Creative' },
                    { name: 'Hugo M', team: 'Production' }
                ],
                target: { type: 'post', author: 'Kaylee A', title: 'Tube overheard' },
                timestamp: Date.now() - 3600000
            },
            {
                id: 'act-5',
                type: 'milestone',
                target: { project: 'Chery Campaign', status: 'Creative Approved' },
                timestamp: Date.now() - 7200000
            },
            {
                id: 'act-6',
                type: 'mood',
                actor: { name: 'Hugo M', team: 'Production' },
                mood: { emoji: '☕', label: 'Need Coffee' },
                timestamp: Date.now() - 10800000
            },
            {
                id: 'act-7',
                type: 'mention',
                actor: { name: 'Hugo M', team: 'Production' },
                mentioned: { name: 'Mimi' },
                target: { type: 'post', title: 'r/videoediting find' },
                timestamp: Date.now() - 14400000
            },
            {
                id: 'act-8',
                type: 'reaction',
                emoji: '👏',
                actors: [
                    { name: 'Ana', team: 'Creative' },
                    { name: 'Nick B', team: 'Creative' }
                ],
                target: { type: 'post', author: 'Sophia S', title: 'Money article idea' },
                timestamp: Date.now() - 21600000
            },
            {
                id: 'act-9',
                type: 'comment',
                actor: { name: 'Hugo M', team: 'Production' },
                target: { type: 'video', author: 'Dan Q', title: 'McDonald\'s Investigates' },
                comment: 'The Japan segment was *chefs kiss*',
                timestamp: Date.now() - 28800000
            },
            {
                id: 'act-10',
                type: 'mood',
                actor: { name: 'Kaylee A', team: 'Social' },
                mood: { emoji: '💪', label: 'Crushing It' },
                timestamp: Date.now() - 36000000
            }
        ];

        let activities = [];
        let isDemo = true;

        const root = document.getElementById('root');

        function getTeamColor(team) {
            return TEAM_COLORS[team] || '#21a0d8';
        }

        function getInitials(name) {
            const parts = name.split(' ');
            return parts.map(p => p[0]).join('').toUpperCase().slice(0, 2);
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h`;
            const days = Math.floor(hours / 24);
            return `${days}d`;
        }

        function formatActors(actors, limit = 2) {
            if (!actors || actors.length === 0) return '';
            
            if (actors.length === 1) {
                return `<strong>${actors[0].name}</strong>`;
            }
            
            if (actors.length === 2) {
                return `<strong>${actors[0].name}</strong> and <strong>${actors[1].name}</strong>`;
            }
            
            const others = actors.length - limit;
            const shown = actors.slice(0, limit).map(a => `<strong>${a.name}</strong>`).join(', ');
            return `${shown} and ${others} other${others > 1 ? 's' : ''}`;
        }

        function render() {
            const displayActivities = activities.length > 0 ? activities : DEMO_ACTIVITY;

            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">The Buzz</h2>
                        <span class="header-sub">Activity</span>
                        ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    </div>
                    
                    <div class="activity-list">
                        ${displayActivities.length === 0 ? `
                            <div class="empty-state">
                                <div class="empty-icon">🐝</div>
                                <div class="empty-title">All quiet</div>
                                <div class="empty-sub">Activity will appear here</div>
                            </div>
                        ` : displayActivities.map(activity => renderActivity(activity)).join('')}
                    </div>
                </div>
            `;
        }

        function renderActivity(activity) {
            switch (activity.type) {
                case 'reaction':
                    return renderReaction(activity);
                case 'mood':
                    return renderMoodUpdate(activity);
                case 'comment':
                    return renderComment(activity);
                case 'milestone':
                    return renderMilestone(activity);
                case 'mention':
                    return renderMention(activity);
                default:
                    return '';
            }
        }

        function renderReaction(activity) {
            const avatars = activity.actors.slice(0, 3);
            const overflow = activity.actors.length > 3 ? activity.actors.length - 3 : 0;

            return `
                <div class="activity-item reaction">
                    <div class="avatar-stack">
                        ${avatars.map(a => `
                            <div class="avatar" style="background: ${getTeamColor(a.team)}">${getInitials(a.name)}</div>
                        `).join('')}
                        ${overflow > 0 ? `<div class="avatar avatar-overflow">+${overflow}</div>` : ''}
                    </div>
                    <div class="activity-content">
                        <div class="activity-text">
                            ${formatActors(activity.actors)} reacted ${activity.emoji} to <strong>${activity.target.author}</strong>'s post
                        </div>
                        <div class="activity-time">${timeAgo(activity.timestamp)}</div>
                    </div>
                    <div class="activity-icon">${activity.emoji}</div>
                </div>
            `;
        }

        function renderMoodUpdate(activity) {
            return `
                <div class="activity-item mood">
                    <div class="avatar-stack">
                        <div class="avatar" style="background: ${getTeamColor(activity.actor.team)}">${getInitials(activity.actor.name)}</div>
                    </div>
                    <div class="activity-content">
                        <div class="activity-text">
                            <strong>${activity.actor.name}</strong> updated their mood
                        </div>
                        <div class="mood-badge">
                            <span>${activity.mood.emoji}</span>
                            <span>${activity.mood.label}</span>
                        </div>
                        <div class="activity-time">${timeAgo(activity.timestamp)}</div>
                    </div>
                </div>
            `;
        }

        function renderComment(activity) {
            return `
                <div class="activity-item comment">
                    <div class="avatar-stack">
                        <div class="avatar" style="background: ${getTeamColor(activity.actor.team)}">${getInitials(activity.actor.name)}</div>
                    </div>
                    <div class="activity-content">
                        <div class="activity-text">
                            <strong>${activity.actor.name}</strong> commented on <strong>${activity.target.author}</strong>'s ${activity.target.type}
                        </div>
                        <div class="comment-preview">"${activity.comment}"</div>
                        <div class="activity-time">${timeAgo(activity.timestamp)}</div>
                    </div>
                </div>
            `;
        }

        function renderMilestone(activity) {
            return `
                <div class="activity-item milestone">
                    <div class="avatar-stack">
                        <div class="avatar" style="background: var(--team-production)">🏆</div>
                    </div>
                    <div class="activity-content">
                        <div class="activity-text">
                            <strong>${activity.target.project}</strong> hit <strong>${activity.target.status}</strong>
                        </div>
                        <div class="activity-time">${timeAgo(activity.timestamp)}</div>
                    </div>
                    <div class="activity-icon">🎉</div>
                </div>
            `;
        }

        function renderMention(activity) {
            return `
                <div class="activity-item mention">
                    <div class="avatar-stack">
                        <div class="avatar" style="background: ${getTeamColor(activity.actor.team)}">${getInitials(activity.actor.name)}</div>
                    </div>
                    <div class="activity-content">
                        <div class="activity-text">
                            <strong>${activity.actor.name}</strong> mentioned <strong>@${activity.mentioned.name}</strong> in a post
                        </div>
                        <div class="activity-time">${timeAgo(activity.timestamp)}</div>
                    </div>
                    <div class="activity-icon">📣</div>
                </div>
            `;
        }

        async function loadActivities() {
            if (isDemo) {
                activities = DEMO_ACTIVITY;
                render();
                return;
            }

            try {
                const q = query(
                    collection(db, "artifacts", appId, "public", "data", "activity_feed"),
                    orderBy("timestamp", "desc"),
                    limit(30)
                );

                onSnapshot(q, (snap) => {
                    activities = [];
                    snap.forEach(d => activities.push({ id: d.id, ...d.data() }));
                    render();
                });
            } catch (e) {
                console.error('Failed to load activities:', e);
                activities = DEMO_ACTIVITY;
                render();
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadActivities();
            } else {
                signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
