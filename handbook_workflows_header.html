<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Header</title>
    <style>
        /* Core Layout - Transparent for Notion */
        body {
            margin: 0; padding: 0;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .header-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            line-height: 1;
            padding-left: 10px;
        }

        .title-text {
            font-size: 4rem;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.04em;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: uppercase;
        }

        .text-left { animation-delay: 0.1s; }
        .text-right { animation-delay: 0.3s; }

        /* The DMG Dot Grid */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .dot {
            width: 100%; height: 100%;
            background-color: #21a0d8; /* Canonical DMG Blue */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Staggered Dot Entry */
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        
        /* Mobile Scaling */
        @media (max-width: 768px) {
            .title-text { font-size: 2.2rem; }
            .header-container { gap: 1rem; }
            .dots-grid { width: 28px; height: 28px; gap: 4px; }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <!-- Left Wing -->
        <div class="title-text text-left">THE</div>
        
        <!-- Motif -->
        <div class="dots-grid">
            <div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div>
        </div>
        
        <!-- Right Wing -->
        <div class="title-text text-right">WORKFLOWS</div>
    </div>
</body>
</html>
