<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People & Ops Hub Welcome | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
        }

        body {
            margin: 0;
            padding: 0 0 0 20px; 
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .header-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 20px 0;
        }

        /* --- LEFT SIDE: THE BIG WELCOME --- */
        .welcome-section {
            flex: 2.2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-title {
            font-size: 6rem;
            font-weight: 900;
            color: var(--ink);
            line-height: 0.92;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .title-accent {
            color: transparent;
            -webkit-text-stroke: 1.2px var(--dmg-blue);
            opacity: 0.9;
        }

        /* --- VERTICAL SEPARATOR --- */
        .divider {
            width: 1px;
            height: 160px;
            background: var(--border);
            margin: 0 50px;
            position: relative;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -2px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--dmg-blue);
            box-shadow: 0 0 10px var(--dmg-blue);
        }

        /* --- RIGHT SIDE: THE EXPLAINER --- */
        .explainer-section {
            flex: 1.2;
            padding-right: 40px;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: 16px;
            height: 16px;
            margin-bottom: 12px;
        }

        .dot {
            width: 100%;
            height: 100%;
            background: var(--dmg-blue);
            border-radius: 50%;
        }

        .explainer-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink-sub);
            font-weight: 500;
        }

        .explainer-text b {
            color: var(--ink);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.02em;
        }


        /* Responsive scaling */
        @media (max-width: 1150px) {
            .main-title { font-size: 4rem; }
            .divider { margin: 0 30px; height: 120px; }
        }

        @media (max-width: 768px) {
            .header-wrapper { flex-direction: column; align-items: flex-start; gap: 20px; }
            .divider { width: 60px; height: 1px; margin: 10px 0; }
            .divider::after { display: none; }
        }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <!-- Headline Section -->
        <div class="welcome-section">
            <h1 class="main-title">
                Welcome to the<br>
                <span class="title-accent">People & Ops Hub</span>
            </h1>
        </div>

        <!-- Vertical Divider -->
        <div class="divider"></div>

        <!-- Explainer Section -->
        <div class="explainer-section">
            <!-- DMG Blue "Dot Language" Anchor -->
            <div class="dots-grid">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            
            <p class="explainer-text">
                <b>Operational Excellence & Talent</b><br>
                Manage workforce logistics, oversee operational standards, and coordinate talent development. This hub centralises <b>recruitment, HR workflows</b>, and the strategic distribution of our <b>people and assets</b> across DMG Media.
            </p>
        </div>
    </div>

</body>
</html>
