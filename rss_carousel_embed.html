<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS News Carousel</title>
    <style>
        /* Aggressively strip all padding and margins */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%; /* Important for Notion iframe behavior */
            overflow: hidden;
            background-color: transparent;
            font-family: sans-serif; /* Basic font to avoid unexpected spacing */
        }
        
        /* Ensure the external widget fits well */
        rssapp-carousel {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Your external RSS code here -->
    <rssapp-carousel id="QJtJ24Uz1NvlFv5q"></rssapp-carousel>
    
    <!-- The necessary external script -->
    <script src="https://widget.rss.app/v1/carousel.js" type="text/javascript" async></script>

</body>
</html>
