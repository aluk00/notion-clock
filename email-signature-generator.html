<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature Generator | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --success: #10B981;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-soft); margin: 0; padding: 20px; min-height: 100vh; }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 20px; height: 20px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 20px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: -0.02em; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
        
        .card { background: #FFF; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .card-title { font-size: 12px; font-weight: 800; color: var(--ink); text-transform: uppercase; }
        .card-body { padding: 20px; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 6px; display: block; }
        .form-input, .form-select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-family: inherit; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--dmg-blue); }
        
        .preview-title { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 12px; }
        
        /* Signature Preview */
        .signature-preview { background: #FFF; border: 1px solid var(--border); border-radius: 8px; padding: 20px; font-family: Arial, sans-serif; }
        .sig-name { font-size: 16px; font-weight: bold; color: #1C1C1C; margin-bottom: 2px; }
        .sig-role { font-size: 13px; color: #666; margin-bottom: 8px; }
        .sig-divider { height: 3px; width: 40px; background: #21a0d8; margin: 10px 0; }
        .sig-company { font-size: 12px; font-weight: bold; color: #1C1C1C; }
        .sig-contact { font-size: 11px; color: #666; margin-top: 4px; }
        .sig-contact a { color: #21a0d8; text-decoration: none; }
        .sig-logo { margin-top: 12px; }
        .sig-logo img { height: 30px; }
        
        .btn { padding: 12px 24px; border-radius: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: var(--dmg-blue); color: #FFF; }
        .btn-primary:hover { filter: brightness(1.1); }
        
        .copy-btn { width: 100%; margin-top: 16px; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: var(--success); color: #FFF; border-radius: 10px; font-size: 12px; font-weight: 700; z-index: 1000; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        
        .instructions { background: #FEF3C7; border: 1px solid #FDE68A; border-radius: 10px; padding: 16px; margin-top: 20px; }
        .instructions-title { font-size: 11px; font-weight: 800; color: #92400E; margin-bottom: 8px; }
        .instructions-text { font-size: 11px; color: #92400E; line-height: 1.5; }
        .instructions-text ol { margin: 8px 0 0 16px; padding: 0; }
        .instructions-text li { margin-bottom: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        const appId = 'dmg-command-centre-native';
        const basePath = `artifacts/${appId}/public/data`;
        
        const TEAMS = ['Editorial', 'Creative', 'Production', 'Social', 'Operations'];
        
        const DotGrid = () => (
            <div className="dots">
                <div className="dot"></div>
                <div className="dot"></div>
                <div className="dot"></div>
                <div className="dot"></div>
            </div>
        );
        
        function App() {
            const [form, setForm] = useState({
                firstName: '',
                lastName: '',
                role: '',
                team: 'Creative',
                phone: '',
                email: ''
            });
            const [toast, setToast] = useState(null);
            const [staffDirectory, setStaffDirectory] = useState([]);
            const signatureRef = useRef(null);
            
            // Load staff directory for auto-fill
            useEffect(() => {
                const unsub = db.collection(basePath).doc('staff_directory').collection('staff_directory')
                    .onSnapshot(snap => {
                        setStaffDirectory(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                return () => unsub();
            }, []);
            
            // Auto-fill from auth
            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (firebaseUser) => {
                    if (!firebaseUser) { auth.signInAnonymously(); return; }
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const paramId = urlParams.get('id');
                    
                    let found = null;
                    if (paramId && staffDirectory.length > 0) {
                        found = staffDirectory.find(s => s.id === paramId);
                    } else if (firebaseUser.email && staffDirectory.length > 0) {
                        found = staffDirectory.find(s => s.email?.toLowerCase() === firebaseUser.email.toLowerCase());
                    }
                    
                    if (found) {
                        setForm({
                            firstName: found.firstName || '',
                            lastName: found.lastName || '',
                            role: found.role || '',
                            team: found.team || 'Creative',
                            phone: found.phone || '',
                            email: found.email || ''
                        });
                    }
                });
                return () => unsub();
            }, [staffDirectory]);
            
            const copySignature = async () => {
                if (!signatureRef.current) return;
                
                try {
                    // Create a range and select the signature content
                    const range = document.createRange();
                    range.selectNodeContents(signatureRef.current);
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                    
                    // Copy to clipboard
                    document.execCommand('copy');
                    selection.removeAllRanges();
                    
                    setToast('Signature copied! Paste into Outlook.');
                    setTimeout(() => setToast(null), 3000);
                } catch (err) {
                    console.error('Copy failed:', err);
                }
            };
            
            return (
                <div className="container">
                    {toast && <div className="toast">{toast}</div>}
                    
                    <div className="header">
                        <DotGrid />
                        <span className="title">Email Signature Generator</span>
                    </div>
                    
                    <div className="grid">
                        <div className="card">
                            <div className="card-header">
                                <span className="card-title">Your Details</span>
                            </div>
                            <div className="card-body">
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                                    <div className="form-group">
                                        <label className="form-label">First Name</label>
                                        <input 
                                            type="text" 
                                            className="form-input" 
                                            value={form.firstName}
                                            onChange={e => setForm({...form, firstName: e.target.value})}
                                            placeholder="Ana"
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Last Name</label>
                                        <input 
                                            type="text" 
                                            className="form-input" 
                                            value={form.lastName}
                                            onChange={e => setForm({...form, lastName: e.target.value})}
                                            placeholder="Smith"
                                        />
                                    </div>
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Job Title</label>
                                    <input 
                                        type="text" 
                                        className="form-input" 
                                        value={form.role}
                                        onChange={e => setForm({...form, role: e.target.value})}
                                        placeholder="Senior Creative"
                                    />
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Team</label>
                                    <select 
                                        className="form-select"
                                        value={form.team}
                                        onChange={e => setForm({...form, team: e.target.value})}
                                    >
                                        {TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Email</label>
                                    <input 
                                        type="email" 
                                        className="form-input" 
                                        value={form.email}
                                        onChange={e => setForm({...form, email: e.target.value})}
                                        placeholder="ana.smith@mailonline.co.uk"
                                    />
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Phone (Optional)</label>
                                    <input 
                                        type="tel" 
                                        className="form-input" 
                                        value={form.phone}
                                        onChange={e => setForm({...form, phone: e.target.value})}
                                        placeholder="+44 20 7938 6000"
                                    />
                                </div>
                            </div>
                        </div>
                        
                        <div className="card">
                            <div className="card-header">
                                <span className="card-title">Preview</span>
                            </div>
                            <div className="card-body">
                                <div className="signature-preview" ref={signatureRef}>
                                    <div className="sig-name">{form.firstName} {form.lastName}</div>
                                    <div className="sig-role">{form.role} | DMG New Media</div>
                                    <div className="sig-divider"></div>
                                    <div className="sig-company">Daily Mail Group</div>
                                    <div className="sig-contact">
                                        {form.email && <><a href={`mailto:${form.email}`}>{form.email}</a><br/></>}
                                        {form.phone && <>{form.phone}<br/></>}
                                        Northcliffe House, London W8 5TT
                                    </div>
                                    <div className="sig-logo">
                                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Daily_Mail_mastance.svg/200px-Daily_Mail_mastance.svg.png" alt="Daily Mail" style={{ height: '24px' }} />
                                    </div>
                                </div>
                                
                                <button className="btn btn-primary copy-btn" onClick={copySignature}>
                                    📋 Copy Signature
                                </button>
                                
                                <div className="instructions">
                                    <div className="instructions-title">How to Add to Outlook</div>
                                    <div className="instructions-text">
                                        <ol>
                                            <li>Click "Copy Signature" above</li>
                                            <li>Open Outlook → File → Options → Mail → Signatures</li>
                                            <li>Create new signature, paste, and save</li>
                                            <li>Set as default for new messages</li>
                                        </ol>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
