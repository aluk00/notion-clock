<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature Generator | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --success: #10B981;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-soft); margin: 0; padding: 20px; min-height: 100vh; }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 20px; height: 20px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 20px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: -0.02em; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
        
        .card { background: #FFF; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .card-title { font-size: 12px; font-weight: 800; color: var(--ink); text-transform: uppercase; }
        .card-body { padding: 20px; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 6px; display: block; }
        .form-input, .form-select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-family: inherit; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--dmg-blue); }
        
        .preview-title { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 12px; }
        
        /* Signature Preview */
        .signature-preview { background: #FFF; border: 1px solid var(--border); border-radius: 8px; padding: 20px; font-family: Arial, sans-serif; }
        .sig-name { font-size: 16px; font-weight: bold; color: #1C1C1C; margin-bottom: 2px; }
        .sig-role { font-size: 13px; color: #6B7280; margin-bottom: 8px; }
        .sig-divider { height: 2px; background: linear-gradient(90deg, #21a0d8, #E6468B); margin: 12px 0; width: 60px; }
        .sig-company { font-size: 12px; font-weight: bold; color: #1C1C1C; margin-bottom: 4px; }
        .sig-contact { font-size: 11px; color: #6B7280; line-height: 1.6; }
        .sig-contact a { color: #21a0d8; text-decoration: none; }
        .sig-social { margin-top: 10px; display: flex; gap: 8px; }
        .sig-social a { color: #6B7280; font-size: 11px; text-decoration: none; }
        .sig-social a:hover { color: #21a0d8; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 16px; }
        .btn { padding: 12px 20px; border-radius: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit; }
        .btn-primary { background: var(--dmg-blue); color: #FFF; flex: 1; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-secondary { background: var(--bg-soft); color: var(--ink); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #F3F4F6; }
        
        .copied-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: #FFF; padding: 12px 24px; border-radius: 10px; font-size: 12px; font-weight: 700; opacity: 0; transition: opacity 0.3s; }
        .copied-toast.show { opacity: 1; }
        
        .staff-select { margin-bottom: 20px; padding: 16px; background: var(--bg-soft); border-radius: 10px; }
        .staff-select-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 8px; display: block; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="copied-toast" id="toast">Signature copied to clipboard!</div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Demo staff data
        const DEMO_STAFF = [
            { id: '1', firstName: 'Ana', lastName: 'Murphy', role: 'Senior Creative', email: 'ana.murphy@dmgmedia.co.uk', team: 'Creative' },
            { id: '2', firstName: 'Ellie', lastName: 'Beetham', role: 'Head of Social Creative', email: 'ellie.beetham@dmgmedia.co.uk', team: 'Editorial' },
            { id: '3', firstName: 'Dan', lastName: 'Quinnell', role: 'Senior Presenter', email: 'dan.quinnell@dmgmedia.co.uk', team: 'Editorial' },
            { id: '4', firstName: 'Mimi', lastName: 'Yates', role: 'Social Creator', email: 'mimi.yates@dmgmedia.co.uk', team: 'Social' },
            { id: '5', firstName: 'Nick', lastName: 'Bramley', role: 'Creative Strategist', email: 'nick.bramley@dmgmedia.co.uk', team: 'Creative' },
        ];
        
        function App() {
            const [staff, setStaff] = useState([]);
            const [selectedStaff, setSelectedStaff] = useState(null);
            const [formData, setFormData] = useState({
                name: '',
                role: '',
                email: '',
                phone: '',
                mobile: ''
            });
            
            useEffect(() => {
                // Try to load from Firestore
                const unsub = db.collection('staff_directory')
                    .onSnapshot(snap => {
                        if (snap.empty) {
                            setStaff(DEMO_STAFF);
                        } else {
                            setStaff(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }
                    }, err => {
                        console.log('Using demo data:', err.message);
                        setStaff(DEMO_STAFF);
                    });
                return () => unsub();
            }, []);
            
            const handleStaffSelect = (e) => {
                const staffId = e.target.value;
                if (!staffId) {
                    setSelectedStaff(null);
                    setFormData({ name: '', role: '', email: '', phone: '', mobile: '' });
                    return;
                }
                const person = staff.find(s => s.id === staffId);
                if (person) {
                    setSelectedStaff(person);
                    setFormData({
                        name: `${person.firstName} ${person.lastName}`,
                        role: person.role || '',
                        email: person.email || `${person.firstName.toLowerCase()}.${person.lastName.toLowerCase()}@dmgmedia.co.uk`,
                        phone: person.phone || '+44 20 3615 0000',
                        mobile: person.mobile || ''
                    });
                }
            };
            
            const updateField = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };
            
            const copySignature = () => {
                const sigEl = document.getElementById('signature-html');
                if (!sigEl) return;
                
                const range = document.createRange();
                range.selectNode(sigEl);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            };
            
            return (
                <div className="container">
                    <div className="header">
                        <div className="dots">
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                        </div>
                        <h1 className="title">Email Signature Generator</h1>
                    </div>
                    
                    <div className="grid">
                        <div className="card">
                            <div className="card-header">
                                <div className="card-title">Your Details</div>
                            </div>
                            <div className="card-body">
                                <div className="staff-select">
                                    <label className="staff-select-label">Quick Fill from Staff Directory</label>
                                    <select className="form-select" onChange={handleStaffSelect}>
                                        <option value="">Select a person...</option>
                                        {staff.map(s => (
                                            <option key={s.id} value={s.id}>
                                                {s.firstName} {s.lastName} - {s.team}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Full Name</label>
                                    <input 
                                        type="text" 
                                        className="form-input" 
                                        value={formData.name}
                                        onChange={e => updateField('name', e.target.value)}
                                        placeholder="John Smith"
                                    />
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Job Title</label>
                                    <input 
                                        type="text" 
                                        className="form-input" 
                                        value={formData.role}
                                        onChange={e => updateField('role', e.target.value)}
                                        placeholder="Senior Creative"
                                    />
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Email</label>
                                    <input 
                                        type="email" 
                                        className="form-input" 
                                        value={formData.email}
                                        onChange={e => updateField('email', e.target.value)}
                                        placeholder="name@dmgmedia.co.uk"
                                    />
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Office Phone</label>
                                    <input 
                                        type="tel" 
                                        className="form-input" 
                                        value={formData.phone}
                                        onChange={e => updateField('phone', e.target.value)}
                                        placeholder="+44 20 3615 0000"
                                    />
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Mobile (Optional)</label>
                                    <input 
                                        type="tel" 
                                        className="form-input" 
                                        value={formData.mobile}
                                        onChange={e => updateField('mobile', e.target.value)}
                                        placeholder="+44 7XXX XXX XXX"
                                    />
                                </div>
                            </div>
                        </div>
                        
                        <div className="card">
                            <div className="card-header">
                                <div className="card-title">Preview</div>
                            </div>
                            <div className="card-body">
                                <div className="preview-title">Your Email Signature</div>
                                
                                <div id="signature-html" className="signature-preview">
                                    <div className="sig-name">{formData.name || 'Your Name'}</div>
                                    <div className="sig-role">{formData.role || 'Job Title'}</div>
                                    <div className="sig-divider"></div>
                                    <div className="sig-company">DMG Media | Daily Mail Group</div>
                                    <div className="sig-contact">
                                        {formData.email && <div>✉️ <a href={`mailto:${formData.email}`}>{formData.email}</a></div>}
                                        {formData.phone && <div>📞 {formData.phone}</div>}
                                        {formData.mobile && <div>📱 {formData.mobile}</div>}
                                        <div>🌐 <a href="https://www.dailymail.co.uk">dailymail.co.uk</a></div>
                                    </div>
                                    <div className="sig-social">
                                        <a href="https://twitter.com/dailymail">Twitter</a>
                                        <span style={{color: '#E5E7EB'}}>|</span>
                                        <a href="https://www.instagram.com/dailymail">Instagram</a>
                                        <span style={{color: '#E5E7EB'}}>|</span>
                                        <a href="https://www.tiktok.com/@dailymail">TikTok</a>
                                    </div>
                                </div>
                                
                                <div className="btn-row">
                                    <button className="btn btn-primary" onClick={copySignature}>
                                        Copy Signature
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
