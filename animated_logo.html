<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated DMG Logo</title>
    <style>
        /* Core Layout */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: transparent; /* Blends with Notion */
        }

        /* The Grid Container */
        .logo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12%; /* Proportional spacing based on the logo */
            width: 80vmin; /* Responsive size */
            height: 80vmin;
            max-width: 300px;
            max-height: 300px;
            transform: rotate(0deg); /* Prepared for potential rotation */
        }

        /* The Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
            
            /* The Animation Definitions */
            animation: pulseWave 3s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Staggered Animation Delays 
           This creates the "Wave" effect from Top-Left to Bottom-Right
        */
        .dot:nth-child(1) { animation-delay: 0.0s; } /* Top Left */
        .dot:nth-child(2) { animation-delay: 0.2s; } /* Top Right */
        .dot:nth-child(3) { animation-delay: 0.2s; } /* Bottom Left */
        .dot:nth-child(4) { animation-delay: 0.4s; } /* Bottom Right */

        /* Keyframes for the "Breathing" Motion */
        @keyframes pulseWave {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
                filter: brightness(1);
            }
            50% {
                transform: scale(0.92); /* Shrink slightly */
                opacity: 0.85; /* Fade slightly */
                filter: brightness(1.1); /* Subtle highlight */
            }
        }
    </style>
</head>
<body>

    <div class="logo-grid">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

</body>
</html>
