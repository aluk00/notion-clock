<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK News Ticker</title>
    <style>
        /* RESET & LAYOUT */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center; 
            line-height: 1; 
        }

        /* Ticker Container */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
            height: 14px; /* REFINED THIN HEIGHT */
            display: flex;
            align-items: center;
        }

        /* The Moving Part */
        .ticker {
            display: inline-block;
            padding-left: 100%; 
            /* Speed: 65s (Smooth). Delay: -32s (Starts halfway across screen) */
            animation: ticker-scroll 65s linear infinite; 
            animation-delay: -32s; 
        }

        /* Individual Story Styling */
        .ticker-item {
            display: inline-block;
            color: #ffffff;
            font-size: 9px; /* REDUCED FONT for ultra-thin bar */
            font-weight: 700;
            margin-right: 30px; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            line-height: 14px; /* Matches container height for vertical centering */
        }

        /* The Link Styling */
        .ticker-item a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .ticker-item a:hover {
            color: #21a0d8; 
            text-decoration: none; 
        }

        /* Source Tag Styling */
        .source-tag {
            color: #21a0d8; /* DMG Blue */
            font-weight: 800;
            margin-right: 6px;
        }

        /* Time Tag Styling */
        .time-tag {
            color: #666666; /* Subtle Grey */
            font-weight: 500;
            margin-left: 6px;
        }

        /* Separator */
        .separator {
            color: #21a0d8;
            margin-left: 15px;
            font-size: 1.1em; 
            vertical-align: middle;
            opacity: 0.5;
        }

        @keyframes ticker-scroll {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="ticker-wrap">
        <div class="ticker" id="news-content">
            <!-- Loading State -->
            <div class="ticker-item">Sourcing UK Headlines...</div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const RSS_URL = 'https://news.google.com/rss?hl=en-GB&gl=GB&ceid=GB:en';
        const API_ENDPOINT = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

        const tickerContainer = document.getElementById('news-content');
        const MAX_AGE_MS = 24 * 60 * 60 * 1000;
        const TARGET_STORIES = 25; 

        async function fetchNews() {
            try {
                const response = await fetch(API_ENDPOINT);
                const data = await response.json();

                if (data.status === 'ok') {
                    renderNews(data.items);
                } else {
                    tickerContainer.innerHTML = '<div class="ticker-item">Feed temporarily unavailable.</div>';
                }
            } catch (error) {
                console.error('Network error:', error);
            }
        }

        function renderNews(items) {
            const now = new Date();
            const filteredStories = items.filter(item => {
                const pubDate = new Date(item.pubDate);
                return (now - pubDate) <= MAX_AGE_MS;
            });
            
            let html = '';
            const storiesToDisplay = filteredStories.slice(0, TARGET_STORIES);

            storiesToDisplay.forEach(item => {
                let title = item.title;
                let source = "NEWS";

                const splitIndex = title.lastIndexOf('-');
                if (splitIndex > -1) {
                    source = title.substring(splitIndex + 1).trim();
                    title = title.substring(0, splitIndex).trim();
                }

                const timeString = timeAgo(item.pubDate);

                html += `
                    <div class="ticker-item">
                        <span class="source-tag">${source}</span>
                        <a href="${item.link}" target="_blank">${title}</a>
                        <span class="time-tag">${timeString}</span>
                        <span class="separator">/ / / /</span>
                    </div>
                `;
            });

            if (storiesToDisplay.length === 0) {
                 tickerContainer.innerHTML = '<div class="ticker-item">Searching for latest updates...</div>';
            } else {
                 tickerContainer.innerHTML = html;
            }
        }

        function timeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            let interval = Math.floor(seconds / 86400);
            if (interval >= 1) return interval + "d";

            interval = Math.floor(seconds / 3600);
            if (interval >= 1) return interval + "h";

            interval = Math.floor(seconds / 60);
            if (interval >= 1) return interval + "m";

            return "now";
        }

        fetchNews();
        setInterval(fetchNews, 300000); // 5-minute refresh
    </script>

</body>
</html>
