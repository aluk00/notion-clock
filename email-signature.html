<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
            margin: 0;
            padding: 24px;
            color: var(--ink);
        }
        .container { max-width: 720px; margin: 0 auto; }

        /* Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dot-grid span {
            width: 6px; height: 6px; border-radius: 50%; background: var(--dmg-blue);
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot-grid span:nth-child(2) { animation-delay: 0.15s; }
        .dot-grid span:nth-child(3) { animation-delay: 0.3s; }
        .dot-grid span:nth-child(4) { animation-delay: 0.45s; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .page-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }

        /* Manager Dashboard Button */
        .manager-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #FFF;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .manager-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .manager-btn svg { width: 16px; height: 16px; }

        /* Card */
        .card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            background: #FAFAFA;
        }
        .card-body { padding: 18px; }

        /* Form */
        .form-group { margin-bottom: 14px; }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 6px;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #FFF;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--dmg-blue);
            box-shadow: 0 0 0 3px rgba(33, 160, 216, 0.1);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Staff Selector */
        .staff-selector {
            position: relative;
        }
        .staff-selector-hint {
            font-size: 11px;
            color: var(--ink-sub);
            margin-top: 6px;
        }

        /* Buttons */
        .btn {
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--dmg-blue); color: #FFF; }
        .btn-primary:hover { background: #1a8bc0; }
        .btn-secondary { background: #F5F5F5; color: var(--ink); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #EAEAEA; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        /* Signature Preview - Clean email-safe layout */
        .signature-container {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .signature-preview {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            color: #333333;
        }
        .sig-table {
            border-collapse: collapse;
            border-spacing: 0;
        }
        .sig-divider {
            width: 2px;
            background: #21a0d8;
        }
        .sig-content {
            padding-left: 16px;
        }
        .sig-name {
            font-size: 15px;
            font-weight: bold;
            color: #1C1C1C;
            margin: 0 0 2px 0;
        }
        .sig-role {
            font-size: 13px;
            color: #666666;
            margin: 0 0 10px 0;
        }
        .sig-company {
            font-size: 13px;
            font-weight: bold;
            color: #E94B4B;
            margin: 0 0 8px 0;
        }
        .sig-details {
            font-size: 12px;
            color: #666666;
            margin: 0;
        }
        .sig-details a {
            color: #21a0d8;
            text-decoration: none;
        }
        .sig-logo {
            max-width: 120px;
            height: auto;
        }

        /* Copy feedback */
        .copy-box {
            margin-top: 14px;
            padding: 12px;
            background: #ECFDF5;
            border: 1px solid #A7F3D0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #065F46;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .copy-box.show { display: flex; }
        .copy-box svg { width: 16px; height: 16px; flex-shrink: 0; }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--ink-sub);
            font-size: 13px;
            gap: 10px;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--dmg-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div id="root">
            <div class="loading">
                <div class="spinner"></div>
                Loading staff directory...
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });

        var db = firebase.firestore();
        var auth = firebase.auth();
        var appId = "dmg-command-centre-native";
        var root = document.getElementById('root');

        var staffList = [];
        var selectedStaff = null;

        function render() {
            var staffOptions = staffList.map(function(s) {
                var fullName = (s.firstName || '') + ' ' + (s.lastName || '');
                var selected = selectedStaff && selectedStaff.id === s.id ? 'selected' : '';
                return '<option value="' + s.id + '" ' + selected + '>' + fullName.trim() + ' - ' + (s.role || 'No role') + '</option>';
            }).join('');

            var firstName = selectedStaff ? (selectedStaff.firstName || '') : '';
            var lastName = selectedStaff ? (selectedStaff.lastName || '') : '';
            var role = selectedStaff ? (selectedStaff.role || '') : '';
            var email = selectedStaff ? (selectedStaff.email || '') : '';
            var phone = selectedStaff ? (selectedStaff.phone || '') : '';

            root.innerHTML = '\
                <div class="page-header">\
                    <div class="header-left">\
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>\
                        <h1 class="page-title">Email Signature Generator</h1>\
                    </div>\
                    <a href="https://aluk00.github.io/notion-clock/manager_dashboard.html" target="_blank" class="manager-btn">\
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">\
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>\
                            <circle cx="9" cy="7" r="4"/>\
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>\
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>\
                        </svg>\
                        Manager Dashboard\
                    </a>\
                </div>\
                \
                <div class="card">\
                    <div class="card-header">Select Your Profile</div>\
                    <div class="card-body">\
                        <div class="form-group staff-selector">\
                            <label class="form-label">Choose from Staff Directory</label>\
                            <select id="staffSelect" class="form-select" onchange="selectStaff(this.value)">\
                                <option value="">-- Select your name --</option>\
                                ' + staffOptions + '\
                            </select>\
                            <div class="staff-selector-hint">Select your name to auto-fill your details, or enter manually below</div>\
                        </div>\
                    </div>\
                </div>\
                \
                <div class="card">\
                    <div class="card-header">Your Details</div>\
                    <div class="card-body">\
                        <div class="form-row">\
                            <div class="form-group">\
                                <label class="form-label">First Name</label>\
                                <input type="text" id="firstName" class="form-input" value="' + firstName + '" placeholder="Your first name" oninput="updatePreview()">\
                            </div>\
                            <div class="form-group">\
                                <label class="form-label">Last Name</label>\
                                <input type="text" id="lastName" class="form-input" value="' + lastName + '" placeholder="Your last name" oninput="updatePreview()">\
                            </div>\
                        </div>\
                        <div class="form-group">\
                            <label class="form-label">Job Title</label>\
                            <input type="text" id="role" class="form-input" value="' + role + '" placeholder="e.g. Senior Creative" oninput="updatePreview()">\
                        </div>\
                        <div class="form-row">\
                            <div class="form-group">\
                                <label class="form-label">Email</label>\
                                <input type="email" id="email" class="form-input" value="' + email + '" placeholder="you@dmgmedia.co.uk" oninput="updatePreview()">\
                            </div>\
                            <div class="form-group">\
                                <label class="form-label">Phone (Optional)</label>\
                                <input type="text" id="phone" class="form-input" value="' + phone + '" placeholder="+44 20 xxxx xxxx" oninput="updatePreview()">\
                            </div>\
                        </div>\
                    </div>\
                </div>\
                \
                <div class="card">\
                    <div class="card-header">Signature Preview</div>\
                    <div class="card-body">\
                        <div class="signature-container">\
                            <div id="signaturePreview" class="signature-preview">\
                                ' + buildSignatureHTML(firstName, lastName, role, email, phone) + '\
                            </div>\
                        </div>\
                        <div style="margin-top: 16px;">\
                            <div class="btn-group">\
                                <button class="btn btn-primary" onclick="copySignature()">Copy to Clipboard</button>\
                                <button class="btn btn-secondary" onclick="copyHTML()">Copy HTML</button>\
                            </div>\
                        </div>\
                        <div id="copyMsg" class="copy-box">\
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">\
                                <path d="M20 6L9 17l-5-5"/>\
                            </svg>\
                            <span id="copyMsgText">Signature copied! Paste into your email client.</span>\
                        </div>\
                    </div>\
                </div>\
            ';
            updatePreview();
        }

        function buildSignatureHTML(firstName, lastName, role, email, phone) {
            var name = ((firstName || 'Your') + ' ' + (lastName || 'Name')).trim();
            var roleText = role || 'Your Role';
            var emailText = email || 'email@dmgmedia.co.uk';
            var phoneHTML = phone ? '<br>' + phone : '';

            return '\
                <table cellpadding="0" cellspacing="0" border="0" class="sig-table">\
                    <tr>\
                        <td style="vertical-align: top; padding-right: 16px;">\
                            <img src="https://iabeurope.eu/wp-content/uploads/DMG_Media_logo_NO_IRELAND-01-1024x288-1.png" alt="DMG Media" class="sig-logo" style="width: 120px; height: auto;">\
                        </td>\
                        <td class="sig-divider"></td>\
                        <td class="sig-content" style="vertical-align: top;">\
                            <p class="sig-name" style="font-size: 15px; font-weight: bold; color: #1C1C1C; margin: 0 0 2px 0;">' + name + '</p>\
                            <p class="sig-role" style="font-size: 13px; color: #666666; margin: 0 0 10px 0;">' + roleText + '</p>\
                            <p class="sig-company" style="font-size: 13px; font-weight: bold; color: #E94B4B; margin: 0 0 8px 0;">DMG Media</p>\
                            <p class="sig-details" style="font-size: 12px; color: #666666; margin: 0; line-height: 1.6;">\
                                <a href="mailto:' + emailText + '" style="color: #21a0d8; text-decoration: none;">' + emailText + '</a>' + phoneHTML + '\
                                <br>Northcliffe House, 2 Derry Street, London W8 5TT\
                                <br><a href="https://www.dailymail.co.uk" style="color: #21a0d8; text-decoration: none;">dailymail.co.uk</a>\
                            </p>\
                        </td>\
                    </tr>\
                </table>\
            ';
        }

        window.selectStaff = function(staffId) {
            if (!staffId) {
                selectedStaff = null;
            } else {
                selectedStaff = staffList.find(function(s) { return s.id === staffId; });
            }
            render();
        };

        window.updatePreview = function() {
            var firstName = document.getElementById('firstName').value;
            var lastName = document.getElementById('lastName').value;
            var role = document.getElementById('role').value;
            var email = document.getElementById('email').value;
            var phone = document.getElementById('phone').value;

            document.getElementById('signaturePreview').innerHTML = buildSignatureHTML(firstName, lastName, role, email, phone);
        };

        window.copySignature = function() {
            var sig = document.getElementById('signaturePreview');
            var range = document.createRange();
            range.selectNode(sig);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            window.getSelection().removeAllRanges();

            document.getElementById('copyMsgText').textContent = 'Signature copied! Paste into your email client.';
            document.getElementById('copyMsg').classList.add('show');
            setTimeout(function() { document.getElementById('copyMsg').classList.remove('show'); }, 3000);
        };

        window.copyHTML = function() {
            var sig = document.getElementById('signaturePreview');
            navigator.clipboard.writeText(sig.innerHTML).then(function() {
                document.getElementById('copyMsgText').textContent = 'HTML copied to clipboard!';
                document.getElementById('copyMsg').classList.add('show');
                setTimeout(function() { document.getElementById('copyMsg').classList.remove('show'); }, 3000);
            });
        };

        function loadStaff() {
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('staff_directory')
                .get().then(function(snapshot) {
                    staffList = [];
                    snapshot.forEach(function(doc) {
                        staffList.push({ id: doc.id, ...doc.data() });
                    });
                    // Sort alphabetically by first name
                    staffList.sort(function(a, b) {
                        var nameA = (a.firstName || '').toLowerCase();
                        var nameB = (b.firstName || '').toLowerCase();
                        return nameA.localeCompare(nameB);
                    });

                    // Check if there's an ID in the URL
                    var params = new URLSearchParams(window.location.search);
                    var staffId = params.get('id');
                    if (staffId) {
                        selectedStaff = staffList.find(function(s) { return s.id === staffId; });
                    }

                    render();
                }).catch(function(error) {
                    console.error('Load error:', error);
                    render();
                });
        }

        auth.signInAnonymously().then(function() {
            loadStaff();
        }).catch(function(error) {
            console.error('Auth error:', error);
            render();
        });
    </script>
</body>
</html>
