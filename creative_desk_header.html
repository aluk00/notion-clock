<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Desk Welcome | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --creative-pink: #E6468B;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
        }

        body {
            margin: 0;
            padding: 0 0 0 20px; /* Prevents clipping on the 'W' and 'C' */
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* 3D Container */
        .header-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 20px 0;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            perspective: 1200px;
        }

        /* --- LEFT SIDE: THE BIG WELCOME (2/3) --- */
        .welcome-section {
            flex: 2.5; 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-title {
            font-size: 6rem; /* Tactical scale (25% bigger) */
            font-weight: 900;
            color: var(--ink);
            line-height: 0.92;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .title-accent {
            color: transparent;
            -webkit-text-stroke: 1.2px var(--creative-pink); /* Refined pink outline */
            opacity: 0.9;
        }

        /* --- VERTICAL SEPARATOR --- */
        .divider {
            width: 1px;
            height: 160px;
            background: var(--border);
            margin: 0 50px;
            opacity: 0;
            animation: fadeIn 1s ease 0.4s forwards;
            position: relative;
        }

        /* Dot Language integration in Creative Pink */
        .divider::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -2px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--creative-pink);
            box-shadow: 0 0 10px var(--creative-pink);
        }

        /* --- RIGHT SIDE: THE EXPLAINER (1/3) --- */
        .explainer-section {
            flex: 1.2;
            padding-right: 40px;
            opacity: 0;
            transform: translateX(20px);
            animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: 16px;
            height: 16px;
            margin-bottom: 12px;
        }

        .dot {
            width: 100%;
            height: 100%;
            background: var(--creative-pink);
            border-radius: 50%;
            animation: pulse 3s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.5s; }
        .dot:nth-child(4) { animation-delay: 1s; }
        .dot:nth-child(3) { animation-delay: 1.5s; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .explainer-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink-sub);
            font-weight: 500;
        }

        .explainer-text b {
            color: var(--ink);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.02em;
        }

        /* Animations */
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes slideLeft { to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { to { opacity: 1; } }

        /* Responsive scaling */
        @media (max-width: 1150px) {
            .main-title { font-size: 4rem; }
            .divider { margin: 0 30px; height: 120px; }
        }

        @media (max-width: 768px) {
            .header-wrapper { flex-direction: column; align-items: flex-start; gap: 20px; }
            .divider { width: 60px; height: 1px; margin: 10px 0; }
            .divider::after { display: none; }
        }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <!-- Headline Section -->
        <div class="welcome-section">
            <h1 class="main-title">
                Welcome to the<br>
                <span class="title-accent">Creative Desk</span>
            </h1>
        </div>

        <!-- Vertical Divider -->
        <div class="divider"></div>

        <!-- Explainer Section -->
        <div class="explainer-section">
            <div class="dots-grid">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            
            <p class="explainer-text">
                <b>The Ideation Engine</b><br>
                Review client briefs, coordinate with the <b>design and production</b> teams on project deliverables, and manage the final hand-off of assets to Sales. This workspace synchronises the <b>creative lifecycle</b> from concept to client delivery.
            </p>
        </div>
    </div>

    <script>
        const wrapper = document.querySelector('.header-wrapper');
        
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            wrapper.style.transform = `perspective(1200px) rotateX(${-y}deg) rotateY(${x}deg)`;
        });

        window.addEventListener('mouseleave', () => {
            wrapper.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
