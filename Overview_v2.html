<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview | DMG Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #21A0D8;
            --team-executive: #1C1C1C;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            color: var(--ink);
            padding: 16px;
        }
        
        /* Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 400px;
        }
        
        /* Card Base */
        .card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--accent, var(--team-operations));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .card:hover::before { opacity: 1; }
        
        /* Span full width */
        .card.wide { grid-column: span 2; }
        
        /* Dot Grid */
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent, #DDD);
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot-grid span:nth-child(1) { animation-delay: 0s; }
        .dot-grid span:nth-child(2) { animation-delay: 0.3s; }
        .dot-grid span:nth-child(3) { animation-delay: 0.6s; }
        .dot-grid span:nth-child(4) { animation-delay: 0.3s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        /* Stat Card */
        .stat-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .stat-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-sub);
        }
        .stat-value {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent, var(--ink));
            line-height: 1;
        }
        .stat-sub {
            font-size: 10px;
            color: var(--ink-sub);
        }
        
        /* Activity Card */
        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }
        .activity-item {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: var(--bg-soft);
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .activity-item:hover {
            background: #FFF;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .activity-marker {
            width: 3px;
            border-radius: 2px;
            background: var(--team-color, #DDD);
            flex-shrink: 0;
        }
        .activity-content {
            flex: 1;
            min-width: 0;
        }
        .activity-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .activity-meta {
            font-size: 9px;
            color: var(--ink-sub);
            margin-top: 2px;
        }
        .activity-time {
            font-size: 9px;
            color: #BCBCBC;
            flex-shrink: 0;
        }
        
        /* Status Badge */
        .status-badge {
            display: inline-block;
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 3px 6px;
            border-radius: 4px;
            background: var(--status-bg, #F0F0F0);
            color: var(--status-color, #666);
        }
        
        /* Client Pills */
        .client-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .client-pill {
            font-size: 9px;
            font-weight: 700;
            padding: 5px 10px;
            background: var(--bg-soft);
            border-radius: 20px;
            color: var(--ink-sub);
            transition: all 0.2s ease;
        }
        .client-pill:hover {
            background: var(--team-operations);
            color: #FFF;
        }
        .client-pill.active {
            background: var(--team-operations);
            color: #FFF;
        }
        
        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // Notion API
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
        
        const teamColors = {
            Editorial: '#E94B4B',
            Creative: '#E6468B',
            Production: '#43B049',
            Social: '#F2C316',
            Operations: '#21A0D8',
            Executive: '#1C1C1C'
        };
        
        const statusColors = {
            'Briefed': { bg: 'rgba(107,114,128,0.1)', color: '#6B7280' },
            'In Progress': { bg: 'rgba(33,160,216,0.1)', color: '#21A0D8' },
            'Review': { bg: 'rgba(245,158,11,0.1)', color: '#F59E0B' },
            'Approved': { bg: 'rgba(67,176,73,0.1)', color: '#43B049' },
            'Live': { bg: 'rgba(155,89,182,0.1)', color: '#9B59B6' }
        };
        
        const DotGrid = ({ color }) => (
            <div className="dot-grid" style={{ '--accent': color }}>
                {[...Array(4)].map((_, i) => <span key={i} style={{ background: color }} />)}
            </div>
        );
        
        function Overview() {
            const [projects, setProjects] = useState([]);
            const [activity, setActivity] = useState([]);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                auth.signInAnonymously();
                fetchData();
            }, []);
            
            const fetchData = async () => {
                try {
                    // Fetch from Notion API
                    const res = await fetch(`${API_URL}/projects`);
                    if (res.ok) {
                        const data = await res.json();
                        setProjects(data.projects || []);
                    }
                    
                    // Fetch activity from Firebase
                    const actSnap = await db.collection('artifacts/dmg-command-centre-native/public/data/activity_feed')
                        .orderBy('timestamp', 'desc')
                        .limit(5)
                        .get();
                    setActivity(actSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                } catch (err) {
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };
            
            // Stats
            const liveProjects = projects.filter(p => p.status === 'Live' || p.status === 'Approved').length;
            const inProgress = projects.filter(p => p.status === 'In Progress').length;
            const inReview = projects.filter(p => p.status === 'Review').length;
            
            // Top 4 clients
            const clientCounts = {};
            projects.forEach(p => {
                if (p.brand) clientCounts[p.brand] = (clientCounts[p.brand] || 0) + 1;
            });
            const topClients = Object.entries(clientCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 4);
            
            const timeAgo = (ts) => {
                if (!ts) return '';
                const date = ts.toDate ? ts.toDate() : new Date(ts);
                const diff = Math.floor((Date.now() - date) / 1000);
                if (diff < 60) return 'now';
                if (diff < 3600) return `${Math.floor(diff/60)}m`;
                if (diff < 86400) return `${Math.floor(diff/3600)}h`;
                return `${Math.floor(diff/86400)}d`;
            };
            
            if (loading) {
                return (
                    <div className="loading">
                        <DotGrid color="#21A0D8" />
                    </div>
                );
            }
            
            return (
                <div className="bento-grid">
                    {/* Live Projects */}
                    <div className="card stat-card" style={{ '--accent': '#43B049' }}>
                        <div className="stat-header">
                            <DotGrid color="#43B049" />
                            <span className="stat-label">Live</span>
                        </div>
                        <div className="stat-value">{liveProjects}</div>
                        <div className="stat-sub">Active campaigns</div>
                    </div>
                    
                    {/* In Progress */}
                    <div className="card stat-card" style={{ '--accent': '#21A0D8' }}>
                        <div className="stat-header">
                            <DotGrid color="#21A0D8" />
                            <span className="stat-label">In Progress</span>
                        </div>
                        <div className="stat-value">{inProgress}</div>
                        <div className="stat-sub">Being worked on</div>
                    </div>
                    
                    {/* Review */}
                    <div className="card stat-card" style={{ '--accent': '#F59E0B' }}>
                        <div className="stat-header">
                            <DotGrid color="#F59E0B" />
                            <span className="stat-label">Review</span>
                        </div>
                        <div className="stat-value">{inReview}</div>
                        <div className="stat-sub">Awaiting approval</div>
                    </div>
                    
                    {/* Clients */}
                    <div className="card stat-card" style={{ '--accent': '#E6468B' }}>
                        <div className="stat-header">
                            <DotGrid color="#E6468B" />
                            <span className="stat-label">Clients</span>
                        </div>
                        <div className="client-grid">
                            {topClients.map(([name, count]) => (
                                <span key={name} className="client-pill">
                                    {name.substring(0, 8)} ({count})
                                </span>
                            ))}
                        </div>
                    </div>
                    
                    {/* Latest Updates - Full Width */}
                    <div className="card wide" style={{ '--accent': '#1C1C1C' }}>
                        <div className="stat-header">
                            <DotGrid color="#1C1C1C" />
                            <span className="stat-label">Latest Updates</span>
                        </div>
                        <div className="activity-list">
                            {activity.length === 0 ? (
                                <div style={{ fontSize: 11, color: '#999', textAlign: 'center', padding: 20 }}>
                                    No recent activity
                                </div>
                            ) : (
                                activity.map(item => {
                                    const teamColor = teamColors[item.team] || '#6B7280';
                                    const statusStyle = statusColors[item.newStatus] || {};
                                    return (
                                        <div key={item.id} className="activity-item">
                                            <div className="activity-marker" style={{ '--team-color': teamColor, background: teamColor }} />
                                            <div className="activity-content">
                                                <div className="activity-title">{item.title}</div>
                                                <div className="activity-meta">
                                                    {item.user && <span>{item.user} • </span>}
                                                    {item.newStatus && (
                                                        <span 
                                                            className="status-badge"
                                                            style={{ 
                                                                '--status-bg': statusStyle.bg, 
                                                                '--status-color': statusStyle.color 
                                                            }}
                                                        >
                                                            {item.newStatus}
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                            <span className="activity-time">{timeAgo(item.timestamp)}</span>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<Overview />);
    </script>
</body>
</html>
