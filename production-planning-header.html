<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Planning Calendar Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --production-green: #43B049;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 0 0 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            background-color: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
        }

        /* 3D Container */
        .header-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 20px 0;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            perspective: 1200px;
        }

        /* --- LEFT SIDE: THE BIG TITLE (2/3) --- */
        .title-section {
            flex: 2.5;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .title-text {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--ink);
            line-height: 0.92;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .title-text.text-left { animation-delay: 0.1s; }
        .title-text.text-middle { animation-delay: 0.2s; }
        .title-text.text-right { animation-delay: 0.3s; }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            width: 20px;
            height: 20px;
        }

        .dot {
            width: 100%;
            height: 100%;
            background-color: var(--production-green);
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* --- VERTICAL SEPARATOR --- */
        .divider {
            width: 1px;
            height: 70px;
            background: var(--border);
            margin: 0 30px;
            opacity: 0;
            animation: fadeIn 1s ease 0.4s forwards;
            position: relative;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -2px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--production-green);
            box-shadow: 0 0 10px var(--production-green);
        }

        /* --- RIGHT SIDE: THE EXPLAINER (1/3) --- */
        .explainer-section {
            flex: 1.4;
            padding-right: 40px;
            opacity: 0;
            transform: translateX(20px);
            animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .dots-grid-small {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: 16px;
            height: 16px;
            margin-bottom: 12px;
        }

        .dot-small {
            width: 100%;
            height: 100%;
            background: var(--production-green);
            border-radius: 50%;
            animation: pulse 3s infinite ease-in-out;
        }
        .dot-small:nth-child(2) { animation-delay: 0.5s; }
        .dot-small:nth-child(4) { animation-delay: 1s; }
        .dot-small:nth-child(3) { animation-delay: 1.5s; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .explainer-text {
            font-size: 12px;
            line-height: 1.6;
            color: var(--ink-sub);
            font-weight: 500;
        }

        /* Animations */
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes slideLeft { to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes popIn { to { transform: scale(1); } }

        /* Responsive scaling */
        @media (max-width: 1150px) {
            .title-text { font-size: 1.8rem; }
            .divider { margin: 0 20px; height: 60px; }
        }

        @media (max-width: 768px) {
            .header-wrapper { flex-direction: column; align-items: flex-start; gap: 20px; }
            .divider { width: 60px; height: 1px; margin: 10px 0; }
            .divider::after { display: none; }
        }

        @media (max-width: 500px) {
            .title-text { font-size: 1.5rem; }
            .title-section { gap: 0.5rem; }
            .dots-grid { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title-text text-left">PRODUCTION</div>
            <div class="dots-grid">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="title-text text-right">PLANNING CALENDAR</div>
        </div>

        <!-- Vertical Divider -->
        <div class="divider"></div>

        <!-- Explainer Section -->
        <div class="explainer-section">
            <div class="dots-grid-small">
                <div class="dot-small"></div>
                <div class="dot-small"></div>
                <div class="dot-small"></div>
                <div class="dot-small"></div>
            </div>

            <p class="explainer-text">
                Track production events, shoots, and key dates. View accreditation status, assigned producers, and event details at a glance.
            </p>
        </div>
    </div>

    <script>
        const wrapper = document.querySelector('.header-wrapper');

        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            wrapper.style.transform = `perspective(1200px) rotateX(${-y}deg) rotateY(${x}deg)`;
        });

        window.addEventListener('mouseleave', () => {
            wrapper.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
