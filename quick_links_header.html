<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Links Header</title>
    <style>
        /* Core Layout */
        html, body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            height: auto;
            width: fit-content; /* Hugs the content strictly to remove right-side space */
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            padding: 5px; /* Minimal padding to prevent font clipping */
        }

        /* Container for the Stacked Lockup */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.4rem; 
            line-height: 1;
            width: fit-content;
        }

        /* Text Styling */
        .title-text {
            font-size: 2.2rem; 
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.04em;
            line-height: 0.9;
            opacity: 0;
            white-space: nowrap; /* Prevents phantom width from text wrapping */
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-top { animation-delay: 0.1s; }
        .text-bottom { animation-delay: 0.3s; }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 28px; 
            height: 28px;
            flex-shrink: 0;
            margin: 2px 0;
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUpFade { 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes popIn { 
            to { transform: scale(1); } 
        }
        
        /* Mobile adjustment */
        @media (max-width: 600px) {
            .title-text { font-size: 1.8rem; }
            .dots-grid { width: 22px; height: 22px; gap: 3px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Top Text -->
        <div class="title-text text-top">QUICK</div>

        <!-- Center Dots -->
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Bottom Text -->
        <div class="title-text text-bottom">LINKS</div>
    </div>

</body>
</html>
