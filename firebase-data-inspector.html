<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Data Inspector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #222;
            --text: #FFF;
            --text-sub: #666;
            --blue: #21a0d8;
            --green: #10B981;
            --yellow: #F2C316;
            --red: #E94B4B;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; min-height: 100vh; }
        
        .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 28px; height: 28px; }
        .dot { width: 100%; height: 100%; background: var(--blue); border-radius: 50%; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dot { animation: pulse 2s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.5s; }
        .dot:nth-child(3) { animation-delay: 0.5s; }
        .dot:nth-child(4) { animation-delay: 1s; }
        
        h1 { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin: 0; }
        .subtitle { font-size: 10px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
        
        .stats { display: flex; gap: 12px; margin-bottom: 24px; }
        .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
        .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
        .stat-num { font-size: 20px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
        .stat-label { font-size: 9px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; }
        
        .collections { display: grid; gap: 16px; }
        
        .collection { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .collection-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .collection-header:hover { background: rgba(255,255,255,0.02); }
        .collection-name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
        .collection-dot { width: 8px; height: 8px; border-radius: 50%; }
        .collection-count { font-size: 11px; font-weight: 700; color: var(--text-sub); background: var(--bg); padding: 4px 10px; border-radius: 99px; }
        .collection-toggle { font-size: 14px; color: var(--text-sub); transition: 0.2s; }
        .collection.open .collection-toggle { transform: rotate(180deg); }
        
        .collection-body { display: none; max-height: 400px; overflow-y: auto; }
        .collection.open .collection-body { display: block; }
        
        .doc { border-bottom: 1px solid var(--border); padding: 12px 18px; }
        .doc:last-child { border-bottom: none; }
        .doc-id { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--blue); margin-bottom: 8px; opacity: 0.7; }
        .doc-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
        .field { background: var(--bg); padding: 8px 10px; border-radius: 6px; }
        .field-key { font-size: 8px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
