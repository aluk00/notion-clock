<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Status View Header</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
    <style>
        /* Core Layout */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            background-color: transparent;
            font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            padding-left: 20px;
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            white-space: nowrap;
        }

        /* Text Styling */
        .title-text {
            font-size: 3.5rem;
            font-weight: 900;
            color: #1C1C1C;
            letter-spacing: -0.04em;
            line-height: 1;
            text-transform: uppercase;
        }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG BLUE */
            border-radius: 50%;
        }

        /* Responsive scaling */
        @media (max-width: 768px) {
            .title-text { font-size: 2.2rem; }
            .header-container { gap: 0.8rem; }
            .dots-grid { width: 32px; height: 32px; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Left Text -->
        <div class="title-text text-left">PROJECT STATUS</div>

        <!-- Center Dots (The Blue Motif) -->
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Right Text -->
        <div class="title-text text-right">VIEW</div>
    </div>

</body>
</html>
