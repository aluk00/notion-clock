<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Schedule | DMG Media</title>
    <style>
        :root {
            --team-production: #43B049;
            --bg-page: #FFFFFF;
            --bg-base: #F8F9FA;
            --border-soft: #EAEAEA;
            --ink: #1A1A1A;
            --ink-sub: #757575;
            --radius-lg: 16px;
            --shadow-soft: 0 4px 20px rgba(0,0,0,0.04);
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            margin: 0; padding: 0; color: var(--ink);
            min-height: 100vh;
        }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* --- HEADER --- */
        .main-header {
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            gap: 24px;
            border-bottom: 1px solid var(--border-soft);
            margin-bottom: 40px;
        }

        .header-lockup { display: flex; align-items: center; gap: 1.5rem; }
        .title-text {
            font-size: 3.5rem; font-weight: 800; color: #000;
            letter-spacing: -0.04em; line-height: 1; text-transform: uppercase;
        }

        .dots-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
            width: 44px; height: 44px; flex-shrink: 0;
        }
        .dot { 
            width: 100%; height: 100%; background-color: var(--team-production); 
            border-radius: 50%; transform: scale(0); 
            animation: popIn 0.6s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; 
        }

        @keyframes popIn { to { transform: scale(1); } }

        /* --- FOLDER SYSTEM --- */
        .folder-card {
            background: #FFF; border: 1px solid var(--border-soft); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft); position: relative; padding: 45px 30px 30px; margin-bottom: 40px;
            min-height: 600px;
        }
        .folder-tab {
            position: absolute; top: -14px; left: 30px; background: #EEE; color: var(--ink);
            padding: 6px 16px; border-radius: 8px 8px 0 0; font-size: 9px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.15em; border: 1px solid var(--border-soft); border-bottom: none;
            display: flex; align-items: center; gap: 8px;
            border-top: 3px solid var(--team-production);
        }

        /* --- NOTION EMBED PLACEHOLDER --- */
        .notion-embed-container {
            width: 100%; height: 100%; min-height: 500px;
            background: var(--bg-base); border-radius: 12px;
            border: 2px dashed var(--border-soft);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px;
        }

        .placeholder-text {
            max-width: 600px; font-size: 15px; font-weight: 700; color: var(--ink-sub);
            line-height: 1.6;
        }

        .instruction-tag {
            margin-top: 24px; padding: 6px 14px; background: var(--team-production);
            color: #FFF; border-radius: var(--radius-chip); font-size: 10px;
            font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="main-header">
            <div class="header-lockup">
                <div class="title-text">PRODUCTION</div>
                <div class="dots-grid">
                    <div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div>
                </div>
                <div class="title-text">SCHEDULE</div>
            </div>
        </header>

        <div class="folder-card">
            <div class="folder-tab">Operational Calendar</div>
            
            <div class="notion-embed-container">
                <div class="placeholder-text">
                    [notion calendar of all the projects (colour coded) and then the production dates of the projects themselves (colour coded)]
                </div>
                
                <div class="instruction-tag">Awaiting Notion Calendar URL</div>
            </div>
        </div>
    </div>

</body>
</html>
