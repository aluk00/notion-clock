<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Calendar</title>
    <style>
        /* Core Styles */
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: transparent;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* --- SETUP SCREEN STYLES --- */
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 30px;
            box-sizing: border-box;
            background-color: #ffffff;
            border-radius: 20px;
            /* Slick modern shadow */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); 
            max-width: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }

        h2 {
            font-size: 20px;
            font-weight: 900;
            margin: 0 0 12px 0;
            letter-spacing: -0.02em;
            color: #1a1a1a;
            text-transform: uppercase;
        }

        p {
            font-size: 13px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Steps Container */
        .steps {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* Inputs */
        input[type="text"] {
            padding: 14px 16px;
            background-color: #f7f7f7;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
            color: #333;
        }

        input[type="text"]:focus {
            background-color: #fff;
            border-color: #9C27B0;
            box-shadow: 0 0 0 4px rgba(156, 39, 176, 0.1);
        }

        input[type="text"]::placeholder {
            color: #aaa;
        }

        /* Buttons */
        .action-btn {
            background-color: #9C27B0; /* Purple Theme */
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        .action-btn:hover {
            background-color: #7B1FA2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(156, 39, 176, 0.3);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .secondary-btn {
            background-color: transparent;
            border: 2px solid #f0f0f0;
            color: #555;
            box-shadow: none;
        }

        .secondary-btn:hover {
            background-color: #fff;
            border-color: #9C27B0;
            color: #9C27B0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transform: translateY(-1px);
        }

        /* --- CALENDAR VIEW STYLES --- */
        #calendar-view {
            display: none; /* Hidden by default */
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
            background-color: white;
        }

        /* Settings Bar */
        .settings-bar {
            display: flex;
            justify-content: flex-end;
            padding: 8px 15px;
            background-color: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .reset-btn {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .reset-btn:hover { color: #9C27B0; }

        /* Responsive Fixes */
        @media (max-width: 400px) {
            #setup-screen { padding: 30px 20px; }
            h2 { font-size: 18px; }
        }

    </style>
</head>
<body>

    <!-- SCREEN 1: SETUP -->
    <div id="setup-screen">
        <h2>Connect Calendar</h2>
        <p>Paste your private Outlook HTML link below to view your schedule securely.</p>
        
        <div class="steps">
            <!-- Step 1: Link to get the URL -->
            <a href="https://outlook.office.com/calendar/options/calendar/SharedCalendars" target="_blank" class="action-btn secondary-btn">
                1. Get My Link from Outlook ↗
            </a>
            
            <!-- Step 2: Input -->
            <input type="text" id="calendarInput" placeholder="2. Paste link here...">
            
            <!-- Step 3: Save -->
            <button class="action-btn" onclick="saveCalendar()">Save & View Calendar</button>
        </div>
    </div>

    <!-- SCREEN 2: LIVE CALENDAR -->
    <div id="calendar-view">
        <iframe id="calendarFrame" src=""></iframe>
        <div class="settings-bar">
            <button class="reset-btn" onclick="resetCalendar()">Change / Reset Link</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const setupScreen = document.getElementById('setup-screen');
        const calendarView = document.getElementById('calendar-view');
        const calendarInput = document.getElementById('calendarInput');
        const calendarFrame = document.getElementById('calendarFrame');

        // Check for saved link on load
        const savedLink = localStorage.getItem('my_outlook_calendar_link');

        if (savedLink) {
            showCalendar(savedLink);
        }

        function saveCalendar() {
            const link = calendarInput.value.trim();
            
            // Basic validation
            if (!link) {
                alert("Please paste your calendar link first.");
                return;
            }
            
            // Clean up the link (sometimes people paste iframe code instead of just the URL)
            let cleanLink = link;
            // If they pasted a full iframe tag, try to extract the src
            const srcMatch = link.match(/src="([^"]+)"/);
            if (srcMatch) {
                cleanLink = srcMatch[1];
            }

            // Save to browser memory
            localStorage.setItem('my_outlook_calendar_link', cleanLink);
            showCalendar(cleanLink);
        }

        function showCalendar(url) {
            calendarFrame.src = url;
            setupScreen.style.display = 'none';
            calendarView.style.display = 'flex';
            // Adjust body padding for full view
            document.body.style.padding = '0'; 
        }

        function resetCalendar() {
            // Confirm before clearing
            if(confirm("Remove this calendar? You will need to paste the link again.")) {
                localStorage.removeItem('my_outlook_calendar_link');
                calendarFrame.src = '';
                calendarView.style.display = 'none';
                setupScreen.style.display = 'flex';
                calendarInput.value = ''; // Clear input
                document.body.style.padding = '20px'; // Restore padding for setup card
            }
        }
    </script>

</body>
</html>
