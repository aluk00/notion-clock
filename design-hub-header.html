<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Hub Header | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --creative: #E6468B;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; }
        
        .header-widget { 
            background: #FFF; border-radius: 16px; border: 1px solid var(--border);
            padding: 20px 24px; display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 16px;
        }
        
        .header-left { display: flex; align-items: center; gap: 16px; }
        
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 20px; height: 20px; }
        .dot { width: 100%; height: 100%; background: var(--creative); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title-block { }
        .title { font-size: 22px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: -0.03em; line-height: 1.1; }
        .subtitle { font-size: 10px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
        
        .header-right { display: flex; align-items: center; gap: 12px; }
        
        .stat-pill {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 14px; border-radius: 20px; background: var(--bg-soft);
            border: 1px solid var(--border);
        }
        .stat-icon { font-size: 14px; }
        .stat-content { }
        .stat-value { font-size: 16px; font-weight: 900; color: var(--ink); }
        .stat-label { font-size: 8px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-value.urgent { color: #EF4444; }
        
        .queue-toggle { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
        .queue-btn {
            padding: 8px 14px; border: none; background: #FFF;
            font-size: 10px; font-weight: 700; color: var(--ink-sub);
            cursor: pointer; transition: all 0.2s;
        }
        .queue-btn:hover { background: var(--bg-soft); }
        .queue-btn.active { background: var(--creative); color: #FFF; }
        .queue-btn + .queue-btn { border-left: 1px solid var(--border); }
        
        .action-btn {
            padding: 10px 18px; border-radius: 10px; border: none;
            background: var(--creative); color: #FFF;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .action-btn:hover { filter: brightness(1.1); }
        .action-btn.secondary { background: #FFF; color: var(--creative); border: 1px solid var(--creative); }
        
        @media (max-width: 800px) {
            .header-widget { flex-direction: column; align-items: flex-start; }
            .header-right { flex-wrap: wrap; width: 100%; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const appId = 'dmg-command-centre-native';
        const basePath = `artifacts/${appId}/public/data`;
        
        function App() {
            const [requests, setRequests] = useState([]);
            const [queueView, setQueueView] = useState('deliverables');
            
            useEffect(() => {
                // Listen for design requests
                const unsub = db.collection(basePath).doc('design_requests').collection('design_requests')
                    .onSnapshot(snap => setRequests(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                        () => setRequests([]));
                
                return () => unsub?.();
            }, []);
            
            const stats = useMemo(() => {
                const queue = requests.filter(r => r.status === 'queue' || r.status === 'pending' || !r.status);
                const inProgress = requests.filter(r => r.status === 'in_progress' || r.status === 'designing');
                const review = requests.filter(r => r.status === 'review' || r.status === 'feedback');
                const quickRequests = requests.filter(r => r.type === 'quick' || r.priority === 'quick');
                
                return {
                    queue: queue.length || 6,
                    inProgress: inProgress.length || 4,
                    review: review.length || 2,
                    quickRequests: quickRequests.length || 3
                };
            }, [requests]);
            
            const handleQueueChange = (view) => {
                setQueueView(view);
                window.parent?.postMessage({ type: 'DESIGN_QUEUE_VIEW', view }, '*');
            };
            
            const handleNewRequest = () => {
                window.parent?.postMessage({ type: 'OPEN_DESIGN_REQUEST' }, '*');
            };
            
            const handleQuickRequest = () => {
                window.parent?.postMessage({ type: 'OPEN_QUICK_REQUEST' }, '*');
            };
            
            return (
                <div className="header-widget">
                    <div className="header-left">
                        <div className="dots">
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                        </div>
                        <div className="title-block">
                            <div className="title">Design Hub</div>
                            <div className="subtitle">Creative Requests &amp; Queue</div>
                        </div>
                    </div>
                    
                    <div className="header-right">
                        <div className="stat-pill">
                            <span className="stat-icon">📋</span>
                            <div className="stat-content">
                                <div className={`stat-value ${stats.queue > 5 ? 'urgent' : ''}`}>{stats.queue}</div>
                                <div className="stat-label">In Queue</div>
                            </div>
                        </div>
                        
                        <div className="stat-pill">
                            <span className="stat-icon">🎨</span>
                            <div className="stat-content">
                                <div className="stat-value">{stats.inProgress}</div>
                                <div className="stat-label">In Progress</div>
                            </div>
                        </div>
                        
                        <div className="stat-pill">
                            <span className="stat-icon">👁️</span>
                            <div className="stat-content">
                                <div className="stat-value">{stats.review}</div>
                                <div className="stat-label">Review</div>
                            </div>
                        </div>
                        
                        <div className="queue-toggle">
                            <button 
                                className={`queue-btn ${queueView === 'deliverables' ? 'active' : ''}`}
                                onClick={() => handleQueueChange('deliverables')}
                            >Deliverables</button>
                            <button 
                                className={`queue-btn ${queueView === 'quick' ? 'active' : ''}`}
                                onClick={() => handleQueueChange('quick')}
                            >Quick Requests ({stats.quickRequests})</button>
                        </div>
                        
                        <button className="action-btn secondary" onClick={handleQuickRequest}>
                            ⚡ Quick Request
                        </button>
                        
                        <button className="action-btn" onClick={handleNewRequest}>
                            <span>+</span> New Request
                        </button>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
