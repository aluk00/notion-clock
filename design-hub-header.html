<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Hub Header | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --design: #8B5CF6;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --urgent: #EF4444;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; }
        
        .widget { background: #FFF; border-radius: 14px; border: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        
        .left { display: flex; align-items: center; gap: 14px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 18px; height: 18px; }
        .dot { width: 100%; height: 100%; background: var(--design); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 16px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: -0.02em; }
        
        .center { display: flex; align-items: center; gap: 10px; }
        
        .stat-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-soft); border-radius: 20px; font-size: 10px; font-weight: 700; color: var(--ink-sub); }
        .stat-pill strong { color: var(--ink); font-size: 12px; }
        .stat-pill.urgent { background: #FEE2E2; color: var(--urgent); }
        .stat-pill.urgent strong { color: var(--urgent); }
        
        .right { display: flex; align-items: center; gap: 10px; }
        
        .queue-toggle { display: flex; background: var(--bg-soft); border-radius: 8px; padding: 3px; }
        .queue-btn { padding: 6px 12px; border: none; background: transparent; font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); cursor: pointer; border-radius: 6px; font-family: inherit; }
        .queue-btn.active { background: var(--design); color: #FFF; }
        
        .action-btn { padding: 8px 14px; background: var(--bg-soft); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; font-family: inherit; }
        .action-btn:hover { background: #F3F4F6; }
        .action-btn.primary { background: var(--design); color: #FFF; border-color: var(--design); }
        .action-btn.primary:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Demo design requests
        const DEMO_REQUESTS = [
            { title: 'Sky Vegas Thumbnail', type: 'deliverable', status: 'in_queue', priority: 'high' },
            { title: 'JAECOO Social Pack', type: 'deliverable', status: 'in_progress', priority: 'medium' },
            { title: 'Quick Icon Request', type: 'quick', status: 'in_queue', priority: 'low' },
            { title: 'Wuthering Heights Promo', type: 'deliverable', status: 'review', priority: 'high' },
            { title: 'Deck Template Update', type: 'quick', status: 'in_queue', priority: 'medium' },
            { title: 'Trading 212 Banner', type: 'deliverable', status: 'in_progress', priority: 'medium' },
        ];
        
        function App() {
            const [requests, setRequests] = useState([]);
            const [queueType, setQueueType] = useState('deliverables');
            
            useEffect(() => {
                const unsub = db.collection('design_requests')
                    .onSnapshot(snap => {
                        if (snap.empty) {
                            setRequests(DEMO_REQUESTS);
                        } else {
                            setRequests(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }
                    }, err => {
                        console.log('Using demo requests:', err.message);
                        setRequests(DEMO_REQUESTS);
                    });
                return () => unsub();
            }, []);
            
            const stats = useMemo(() => {
                const filtered = queueType === 'deliverables' 
                    ? requests.filter(r => r.type === 'deliverable')
                    : requests.filter(r => r.type === 'quick');
                    
                const inQueue = filtered.filter(r => r.status === 'in_queue').length;
                const inProgress = filtered.filter(r => r.status === 'in_progress').length;
                const review = filtered.filter(r => r.status === 'review').length;
                
                return { inQueue, inProgress, review, isUrgent: inQueue > 5 };
            }, [requests, queueType]);
            
            const handleQueueChange = (type) => {
                setQueueType(type);
                window.parent.postMessage({ type: 'QUEUE_CHANGE', queueType: type }, '*');
            };
            
            const handleQuickRequest = () => {
                window.parent.postMessage({ type: 'QUICK_REQUEST' }, '*');
            };
            
            const handleNewRequest = () => {
                window.parent.postMessage({ type: 'NEW_REQUEST' }, '*');
            };
            
            return (
                <div className="widget">
                    <div className="left">
                        <div className="dots">
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                            <div className="dot"></div>
                        </div>
                        <span className="title">Design Hub</span>
                    </div>
                    
                    <div className="center">
                        <div className={`stat-pill ${stats.isUrgent ? 'urgent' : ''}`}>
                            <span>In Queue</span>
                            <strong>{stats.inQueue}</strong>
                        </div>
                        <div className="stat-pill">
                            <span>In Progress</span>
                            <strong>{stats.inProgress}</strong>
                        </div>
                        <div className="stat-pill">
                            <span>Review</span>
                            <strong>{stats.review}</strong>
                        </div>
                    </div>
                    
                    <div className="right">
                        <div className="queue-toggle">
                            <button 
                                className={`queue-btn ${queueType === 'deliverables' ? 'active' : ''}`}
                                onClick={() => handleQueueChange('deliverables')}
                            >Deliverables</button>
                            <button 
                                className={`queue-btn ${queueType === 'quick' ? 'active' : ''}`}
                                onClick={() => handleQueueChange('quick')}
                            >Quick Requests</button>
                        </div>
                        <button className="action-btn" onClick={handleQuickRequest}>Quick Request</button>
                        <button className="action-btn primary" onClick={handleNewRequest}>+ New Request</button>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
