<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Quick Links</title>
    <style>
        /* Core Styles */
        body {
            margin: 0;
            padding: 10px 20px; 
            display: flex;
            justify-content: flex-start; 
            background-color: transparent;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            width: 100%;
        }

        /* Container for the buttons */
        .links-container {
            display: flex;
            flex-wrap: wrap; 
            gap: 10px; 
            width: 100%;
        }

        /* Button Styling (Pink Theme) */
        .link-btn {
            background-color: #E91E63; /* Pink, matching the Creative dots */
            color: white;
            padding: 10px 16px; /* Slightly increased padding */
            border-radius: 12px; /* Increased border radius for a softer, more clickable look */
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            white-space: nowrap; 
            
            /* Enhanced Clickable Look */
            border: 2px solid #d81b60; /* Subtle border for definition */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); /* Lifted appearance */
        }

        .link-btn:hover {
            background-color: #d81b60; /* Darker pink on hover */
            transform: translateY(-2px); /* Lift button on hover */
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.25);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .link-btn {
                font-size: 11px;
                padding: 8px 12px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="links-container">
        <!-- 1. Ideation Hub -->
        <a href="YOUR_STICKY_NOTES_PAGE_URL" target="_blank" class="link-btn">Ideation Hub</a>
        
        <!-- 2. Create a New Creative Brief Response -->
        <a href="YOUR_NEW_BRIEF_TEMPLATE_URL" target="_blank" class="link-btn">New Brief Response</a>
        
        <!-- 3. TikTok Creative Center -->
        <a href="https://ads.tiktok.com/business/creativecenter/inspiration/topads/pc/en" target="_blank" class="link-btn">TikTok Creative Center</a>
        
        <!-- 4. Tiktok Keyword Insights -->
        <a href="https://ads.tiktok.com/business/creativecenter/keyword-insights/pc/en" target="_blank" class="link-btn">TikTok Keyword Insights</a>
        
        <!-- 5. Tiktok Creative Insights -->
        <a href="https://ads.tiktok.com/business/creativecenter/creative-trends/pc/en" target="_blank" class="link-btn">TikTok Creative Trends</a>
        
        <!-- 6. Tiktok UK Trending -->
        <a href="https://www.tiktok.com/tag/trending-uk" target="_blank" class="link-btn">TikTok UK Trending</a>

        <!-- 7. Perplexity (General Research/AI) -->
        <a href="https://www.perplexity.ai/" target="_blank" class="link-btn">Perplexity</a>
        
        <!-- 8. Gemini (General Research/AI) -->
        <a href="https://gemini.google.com/" target="_blank" class="link-btn">Gemini</a>
    </div>

</body>
</html>
