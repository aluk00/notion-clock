<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            max-width: 600px;
        }
        .widget-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--dmg-blue);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .calendar-frame {
            width: 100%;
            height: 400px;
            border: none;
        }
        .setup-panel {
            padding: 30px 20px;
            text-align: center;
        }
        .setup-icon {
            font-size: 36px;
            margin-bottom: 16px;
        }
        .setup-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .setup-desc {
            font-size: 12px;
            color: var(--ink-sub);
            line-height: 1.5;
            margin-bottom: 20px;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        .setup-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 12px;
            font-family: inherit;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .setup-input:focus {
            outline: none;
            border-color: var(--dmg-blue);
        }
        .setup-input::placeholder {
            color: #BBB;
        }
        .setup-btn {
            padding: 12px 24px;
            background: var(--dmg-blue);
            color: #FFF;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .setup-btn:hover {
            background: #1a8ac6;
            transform: translateY(-1px);
        }
        .setup-btn:disabled {
            background: #CCC;
            cursor: not-allowed;
            transform: none;
        }
        .help-link {
            display: inline-block;
            margin-top: 16px;
            font-size: 10px;
            color: var(--dmg-blue);
            text-decoration: none;
            font-weight: 700;
        }
        .help-link:hover {
            text-decoration: underline;
        }
        .edit-bar {
            padding: 8px 18px;
            background: var(--bg-soft);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .edit-btn {
            background: none;
            border: none;
            color: var(--dmg-blue);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 8px;
        }
        .edit-btn:hover {
            text-decoration: underline;
        }
        .status-text {
            font-size: 9px;
            color: var(--ink-sub);
        }
        .demo-badge {
            font-size: 7px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: #E6468B;
            padding: 3px 6px;
            border-radius: 4px;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const STORAGE_KEY = 'dmg_calendar_url';

        let currentUser = null;
        let calendarUrl = null;
        let isDemo = true;
        let showSetup = false;

        const root = document.getElementById('root');

        function isValidCalendarUrl(url) {
            if (!url) return false;
            // Accept Outlook web calendar URLs and Google Calendar embed URLs
            return url.includes('outlook.office365.com') || 
                   url.includes('outlook.live.com') ||
                   url.includes('calendar.google.com') ||
                   url.includes('outlook.office.com');
        }

        function render() {
            const hasCalendar = isValidCalendarUrl(calendarUrl);

            if (!hasCalendar || showSetup) {
                root.innerHTML = `
                    <div class="widget">
                        <div class="widget-header">
                            <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                            <h2 style="font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); margin: 0;">
                                My Calendar
                            </h2>
                            ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                        </div>
                        <div class="setup-panel">
                            <div class="setup-icon">📅</div>
                            <div class="setup-title">Connect Your Calendar</div>
                            <div class="setup-desc">
                                Paste your Outlook or Google Calendar public embed URL below to display your schedule here.
                            </div>
                            <input type="text" 
                                class="setup-input" 
                                id="calendar-url-input"
                                placeholder="https://outlook.office365.com/owa/calendar/..."
                                value="${calendarUrl || ''}"
                            >
                            <br>
                            <button class="setup-btn" onclick="window.saveCalendarUrl()">
                                ${hasCalendar ? 'Update Calendar' : 'Connect Calendar'}
                            </button>
                            ${hasCalendar ? `
                                <br>
                                <button class="edit-btn" onclick="window.cancelSetup()" style="margin-top: 12px;">
                                    ← Back to Calendar
                                </button>
                            ` : ''}
                            <br>
                            <a href="https://support.microsoft.com/en-us/office/share-your-calendar-in-outlook-com-0fc1cb48-569d-4d1e-ac20-5a9b3f5e6ff1" 
                               target="_blank" 
                               class="help-link">
                                How to get your Outlook calendar URL →
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 style="font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); margin: 0;">
                            My Calendar
                        </h2>
                        ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    </div>
                    <iframe class="calendar-frame" src="${calendarUrl}" loading="lazy"></iframe>
                    <div class="edit-bar">
                        <span class="status-text">Connected to external calendar</span>
                        <button class="edit-btn" onclick="window.editCalendar()">Change URL</button>
                    </div>
                </div>
            `;
        }

        window.saveCalendarUrl = async () => {
            const input = document.getElementById('calendar-url-input');
            const url = input?.value?.trim();
            
            if (!url) {
                alert('Please enter a calendar URL');
                return;
            }

            calendarUrl = url;
            showSetup = false;

            // Save to Firestore or localStorage
            if (currentUser && !isDemo) {
                try {
                    await setDoc(doc(db, "artifacts", appId, "public", "data", "user_calendar", currentUser.id), {
                        url: calendarUrl,
                        updatedAt: new Date().toISOString()
                    });
                } catch (e) {
                    console.log('Failed to save:', e);
                }
            } else {
                localStorage.setItem(STORAGE_KEY, calendarUrl);
            }

            render();
        };

        window.editCalendar = () => {
            showSetup = true;
            render();
        };

        window.cancelSetup = () => {
            showSetup = false;
            render();
        };

        async function loadCalendarUrl(userId) {
            if (userId) {
                try {
                    const docRef = doc(db, "artifacts", appId, "public", "data", "user_calendar", userId);
                    const snap = await getDoc(docRef);
                    if (snap.exists() && snap.data().url) {
                        return snap.data().url;
                    }
                } catch (e) {
                    console.log('Failed to load calendar URL:', e);
                }
            }
            
            return localStorage.getItem(STORAGE_KEY) || null;
        }

        async function resolveIdentity(authUser) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');

            if (paramId) {
                try {
                    const docRef = doc(db, "artifacts", appId, "public", "data", "staff_directory", paramId);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        currentUser = { id: snap.id, ...snap.data() };
                        isDemo = false;
                        calendarUrl = await loadCalendarUrl(currentUser.id);
                        render();
                        return;
                    }
                } catch (e) { console.log('Param lookup failed:', e); }
            }

            if (authUser && authUser.email && !authUser.isAnonymous) {
                try {
                    const q = query(
                        collection(db, "artifacts", appId, "public", "data", "staff_directory"), 
                        where("email", "==", authUser.email)
                    );
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        currentUser = { id: snap.docs[0].id, ...snap.docs[0].data() };
                        isDemo = false;
                        calendarUrl = await loadCalendarUrl(currentUser.id);
                        render();
                        return;
                    }
                } catch (e) { console.log('Email lookup failed:', e); }
            }

            // Demo mode
            isDemo = true;
            calendarUrl = localStorage.getItem(STORAGE_KEY) || null;
            render();
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                resolveIdentity(user);
            } else {
                signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
