<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar | DMG Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --dmg-blue-light: #e8f6fc;
            --outlook: #0078d4;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --meeting-blue: #dbeafe;
            --meeting-green: #dcfce7;
            --meeting-purple: #f3e8ff;
            --meeting-orange: #ffedd5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: transparent; padding: 16px; -webkit-font-smoothing: antialiased; }
        .calendar-widget { background: #FFF; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        .widget-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 16px; height: 16px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; animation: pulse 2.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.6s; }
        .dot:nth-child(3) { animation-delay: 0.9s; }
        .header-title { font-size: 13px; font-weight: 800; color: var(--ink); text-transform: uppercase; letter-spacing: 0.02em; }
        .sync-badge { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--dmg-blue-light); border-radius: 99px; font-size: 10px; font-weight: 600; color: var(--dmg-blue); }
        .calendar-body { padding: 16px 20px; }
        .date-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
        .date-tab { display: flex; flex-direction: column; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--bg-soft); border: none; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
        .date-tab:hover { background: #EEE; }
        .date-tab.active { background: var(--dmg-blue); }
        .date-tab .day-name { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 2px; }
        .date-tab.active .day-name { color: rgba(255,255,255,0.8); }
        .date-tab .day-num { font-size: 18px; font-weight: 800; color: var(--ink); }
        .date-tab.active .day-num { color: #FFF; }
        .date-tab.today { border: 2px solid var(--dmg-blue); }
        .selected-date { font-size: 12px; font-weight: 600; color: var(--ink-sub); margin-bottom: 16px; }
        .events-list { display: flex; flex-direction: column; gap: 10px; }
        .event-card { display: flex; gap: 12px; padding: 14px; border-radius: 12px; transition: all 0.2s ease; }
        .event-card:hover { transform: translateX(4px); }
        .event-card.blue { background: var(--meeting-blue); }
        .event-card.green { background: var(--meeting-green); }
        .event-card.purple { background: var(--meeting-purple); }
        .event-card.orange { background: var(--meeting-orange); }
        .event-time { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 50px; padding-right: 12px; border-right: 2px solid rgba(0,0,0,0.1); }
        .event-time .start { font-size: 14px; font-weight: 700; color: var(--ink); }
        .event-time .end { font-size: 11px; color: var(--ink-sub); }
        .event-details { flex: 1; min-width: 0; }
        .event-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .event-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-sub); }
        .event-badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.08); }
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
        .empty-text { font-size: 12px; color: var(--ink-sub); }
        .connect-state { text-align: center; padding: 40px 20px; }
        .connect-icon { width: 64px; height: 64px; border-radius: 16px; background: var(--outlook); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .connect-icon svg { width: 32px; height: 32px; fill: #FFF; }
        .connect-title { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
        .connect-text { font-size: 13px; color: var(--ink-sub); margin-bottom: 20px; line-height: 1.5; }
        .connect-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--outlook); color: #FFF; border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .connect-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const firebaseConfig = { apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY", authDomain: "dmg-command-centre-native.firebaseapp.com", projectId: "dmg-command-centre-native" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "dmg-command-centre-native";
        const EVENT_COLORS = ['blue', 'green', 'purple', 'orange'];
        
        const formatTime = (dateStr) => new Date(dateStr).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        const formatDate = (date) => date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
        const getDayName = (date) => date.toLocaleDateString('en-GB', { weekday: 'short' });
        const isSameDay = (d1, d2) => d1.toDateString() === d2.toDateString();
        
        function DateTabs({ dates, selectedDate, onSelect }) {
            const today = new Date();
            return (
                <div className="date-tabs">
                    {dates.map((date, i) => (
                        <button key={i} className={`date-tab ${isSameDay(date, selectedDate) ? 'active' : ''} ${isSameDay(date, today) ? 'today' : ''}`} onClick={() => onSelect(date)}>
                            <span className="day-name">{getDayName(date)}</span>
                            <span className="day-num">{date.getDate()}</span>
                        </button>
                    ))}
                </div>
            );
        }
        
        function EventCard({ event, colorIndex }) {
            const color = EVENT_COLORS[colorIndex % EVENT_COLORS.length];
            const isOnline = event.isOnlineMeeting || event.location?.displayName?.includes('Teams');
            return (
                <div className={`event-card ${color}`}>
                    <div className="event-time">
                        <span className="start">{formatTime(event.start.dateTime)}</span>
                        <span className="end">{formatTime(event.end.dateTime)}</span>
                    </div>
                    <div className="event-details">
                        <div className="event-title">{event.subject}</div>
                        <div className="event-meta">
                            {isOnline ? <span>📹 Teams</span> : event.location?.displayName ? <span>📍 {event.location.displayName}</span> : null}
                            {event.attendees?.length > 0 && <span className="event-badge">{event.attendees.length} attendees</span>}
                        </div>
                    </div>
                </div>
            );
        }
        
        function ConnectState({ onConnect }) {
            return (
                <div className="connect-state">
                    <div className="connect-icon"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg></div>
                    <div className="connect-title">Connect your calendar</div>
                    <div className="connect-text">Sign in with Microsoft to see your Outlook calendar here.</div>
                    <button className="connect-btn" onClick={onConnect}>
                        <svg viewBox="0 0 21 21" width="18" height="18"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
                        Connect with Microsoft
                    </button>
                </div>
            );
        }
        
        function CalendarWidget() {
            const [loading, setLoading] = useState(true);
            const [connected, setConnected] = useState(false);
            const [accessToken, setAccessToken] = useState(null);
            const [events, setEvents] = useState([]);
            const [selectedDate, setSelectedDate] = useState(new Date());
            
            const dates = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
            
            useEffect(() => {
                const checkAuth = async () => {
                    const storedToken = localStorage.getItem('dmg_ms_token');
                    if (storedToken) {
                        try {
                            const response = await fetch('https://graph.microsoft.com/v1.0/me', { headers: { 'Authorization': `Bearer ${storedToken}` } });
                            if (response.ok) { setAccessToken(storedToken); setConnected(true); await fetchEvents(storedToken); }
                            else { localStorage.removeItem('dmg_ms_token'); }
                        } catch (e) { localStorage.removeItem('dmg_ms_token'); }
                    }
                    setLoading(false);
                };
                checkAuth();
            }, []);
            
            const fetchEvents = async (token, date = selectedDate) => {
                try {
                    const startOfDay = new Date(date); startOfDay.setHours(0, 0, 0, 0);
                    const endOfDay = new Date(date); endOfDay.setHours(23, 59, 59, 999);
                    const response = await fetch(`https://graph.microsoft.com/v1.0/me/calendarview?startDateTime=${startOfDay.toISOString()}&endDateTime=${endOfDay.toISOString()}&$orderby=start/dateTime&$top=20`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (response.ok) { const data = await response.json(); setEvents(data.value || []); }
                    else if (response.status === 401) { setConnected(false); localStorage.removeItem('dmg_ms_token'); }
                } catch (e) { console.error('Failed to fetch events:', e); }
            };
            
            const handleConnect = async () => {
                try {
                    const provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.addScope('Calendars.Read');
                    provider.setCustomParameters({ prompt: 'consent' });
                    const result = await auth.signInWithPopup(provider);
                    if (result.credential?.accessToken) {
                        const token = result.credential.accessToken;
                        setAccessToken(token); setConnected(true);
                        localStorage.setItem('dmg_ms_token', token);
                        if (result.user?.uid) {
                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('user_profiles').doc(result.user.uid).set({ msAccessToken: token, calendarConnected: true }, { merge: true });
                        }
                        await fetchEvents(token);
                    }
                } catch (e) { console.error('Connection failed:', e); alert('Failed to connect. Please try again.'); }
            };
            
            const handleDateSelect = async (date) => { setSelectedDate(date); if (accessToken) await fetchEvents(accessToken, date); };
            
            if (loading) return <div className="calendar-widget"><div className="loading"><div className="spinner"></div></div></div>;
            if (!connected) return <div className="calendar-widget"><ConnectState onConnect={handleConnect} /></div>;
            
            return (
                <div className="calendar-widget">
                    <div className="widget-header">
                        <div className="header-left">
                            <div className="dots-grid"><div className="dot"></div><div className="dot"></div><div className="dot"></div><div className="dot"></div></div>
                            <span className="header-title">My Calendar</span>
                        </div>
                        <div className="sync-badge">📅 Outlook</div>
                    </div>
                    <div className="calendar-body">
                        <DateTabs dates={dates} selectedDate={selectedDate} onSelect={handleDateSelect} />
                        <div className="selected-date">{formatDate(selectedDate)}</div>
                        <div className="events-list">
                            {events.length === 0 ? (
                                <div className="empty-state"><div className="empty-title">No meetings</div><div className="empty-text">Enjoy your clear schedule!</div></div>
                            ) : events.map((event, i) => <EventCard key={event.id || i} event={event} colorIndex={i} />)}
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CalendarWidget />);
    </script>
</body>
</html>
