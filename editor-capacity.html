<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Capacity | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --hero: #43B049; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; --success: #22C55E; --warning: #F59E0B; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 500px; overflow: hidden; }
        .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; }
        .dot-grid span { width: 5px; height: 5px; border-radius: 50%; background: var(--hero); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 13px; font-weight: 800; }
        .badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; margin-left: auto; }
        .list { }
        .editor { padding: 14px 20px; border-bottom: 1px solid #F5F5F5; display: flex; flex-direction: column; gap: 10px; }
        .editor-main { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .editor-main:hover .editor-name { color: var(--hero); }
        .editor:last-child { border-bottom: none; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #FFF; flex-shrink: 0; }
        .editor-info { flex: 1; min-width: 0; }
        .editor-name { font-size: 13px; font-weight: 700; transition: color 0.15s; }
        .editor-role { font-size: 11px; color: var(--ink-sub); }
        .capacity-bar { width: 80px; height: 6px; background: #E5E5E5; border-radius: 3px; overflow: hidden; margin-right: 8px; }
        .capacity-fill { height: 100%; border-radius: 3px; }
        .capacity-value { font-size: 12px; font-weight: 800; width: 36px; text-align: right; }
        .task-list { display: none; background: var(--bg-soft); border-radius: 8px; padding: 8px; margin-top: 4px; }
        .task-list.expanded { display: block; }
        .task-item { font-size: 10px; padding: 6px 8px; background: #fff; border-radius: 6px; margin-bottom: 4px; border-left: 3px solid var(--hero); }
        .task-item:last-child { margin-bottom: 0; }
        .task-title { font-weight: 700; color: var(--ink); }
        .task-meta { color: var(--ink-sub); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
        .task-date { font-weight: 600; padding: 1px 4px; border-radius: 3px; background: #E5E5E5; }
        .empty { padding: 50px 20px; text-align: center; }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 50px; color: var(--ink-sub); font-size: 12px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--hero); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal Styles - clean transition (lighter background for Notion-embedded feel) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { background: #FFF; border-radius: 16px; max-width: 600px; width: 90%; max-height: 90vh; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.12); animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .modal-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #FFF; flex-shrink: 0; }
        .modal-info { flex: 1; }
        .modal-name { font-size: 18px; font-weight: 800; }
        .modal-role { font-size: 12px; color: var(--ink-sub); margin-top: 2px; }
        .modal-capacity { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .modal-bar { width: 120px; height: 8px; background: #E5E5E5; border-radius: 4px; overflow: hidden; }
        .modal-bar-fill { height: 100%; border-radius: 4px; }
        .modal-percent { font-size: 14px; font-weight: 800; }
        .modal-close { width: 36px; height: 36px; border: none; background: var(--bg-soft); border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--ink-sub); }
        .modal-close:hover { background: #E5E5E5; }
        .modal-body { padding: 20px; overflow-y: auto; max-height: calc(90vh - 200px); }
        .modal-section { margin-bottom: 20px; }
        .modal-section:last-child { margin-bottom: 0; }
        .modal-section-title { font-size: 11px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .modal-section-count { background: var(--hero); color: #FFF; padding: 2px 8px; border-radius: 10px; font-size: 10px; }
        .modal-task { background: var(--bg-soft); border-radius: 10px; padding: 12px; margin-bottom: 8px; border-left: 3px solid var(--hero); }
        .modal-task:last-child { margin-bottom: 0; }
        .modal-task-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
        .modal-task-meta { display: flex; gap: 8px; flex-wrap: wrap; }
        .modal-tag { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: #E5E5E5; color: var(--ink-sub); }
        .modal-tag.client { background: #DBEAFE; color: #1E40AF; }
        .modal-tag.due { background: #FEF3C7; color: #92400E; }
        .modal-tag.live { background: #DCFCE7; color: #166534; }
        .modal-tag.status { background: rgba(67, 176, 73, 0.1); color: var(--hero); }
        .modal-empty { text-align: center; padding: 30px; color: var(--ink-sub); font-size: 12px; }

        /* Assign Project Section */
        .assign-section { background: var(--bg-soft); border-radius: 10px; padding: 14px; }
        .assign-title { font-size: 11px; font-weight: 700; color: var(--ink-sub); margin-bottom: 10px; text-transform: uppercase; }
        .assign-select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 500; background: #FFF; cursor: pointer; -webkit-appearance: none; -moz-appearance: none; appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236B7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 16px 16px; padding-right: 32px; }
        .assign-select:focus { outline: none; border-color: var(--hero); }
        .assign-btn { margin-top: 10px; width: 100%; padding: 10px; background: var(--hero); color: #FFF; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .assign-btn:hover { opacity: 0.9; }
        .assign-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: #FFF; padding: 12px 24px; border-radius: 50px; font-size: 12px; font-weight: 600; z-index: 2000; transition: transform 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: #EF4444; }
        .toast.success { background: var(--hero); }
    </style>
</head>
<body>
    <div id="root"><div class="loading"><div class="spinner"></div>Loading...</div></div>
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal"></div>
    </div>
    <div class="toast" id="toast"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        const auth = getAuth(app), db = getFirestore(app), appId = "dmg-command-centre-native";
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

        let staff = [], editQueue = [], assetMetadata = [], dailyRundowns = [], apiDeliverables = [], loading = true;
        let currentEditor = null;
        const root = document.getElementById('root');

        const initials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();
        const capacityColor = c => c > 100 ? '#EF4444' : c >= 80 ? '#F59E0B' : '#22C55E';

        // Team colors matching design system
        const teamColors = {
            'Editorial': '#43B049',
            'Production': '#43B049',
            'Creative': '#E6468B',
            'Social': '#F2C316',
            'Sales': '#21A0D8'
        };

        const getTeamColor = (team) => teamColors[team] || '#43B049';

        // Fetch deliverables from Cloud Run API (optional enhancement)
        // Widget works fine with just Firebase data if API is unavailable
        async function loadApiDeliverables() {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                let res = await fetch(`${API_URL}/deliverables`, { signal: controller.signal });
                clearTimeout(timeout);

                if (!res.ok) {
                    console.warn('[Editor Capacity] API returned', res.status, '- using Firebase data only');
                    return;
                }

                let data = await res.json();
                let deliverables = data.deliverables || data.projects || [];

                if (deliverables.length === 0) {
                    const projRes = await fetch(`${API_URL}/projects`);
                    if (projRes.ok) {
                        data = await projRes.json();
                        deliverables = data.projects || [];
                    }
                }

                // Filter for editor-related items
                apiDeliverables = deliverables.filter(d => {
                    const status = (d.status || d.productionWorkflowStatus || '').toLowerCase();
                    const discipline = (d.discipline || '').toLowerCase();
                    if (status === 'live' || status === 'published' || status === 'complete' || status === 'done') return false;
                    if (d.movingAssetsNeeded?.length > 0 || d.movingAssetCount > 0) return true;
                    if (discipline === 'editor') return true;
                    if (d.videoEditor) return true;
                    return false;
                }).map(d => ({
                    id: d.id,
                    title: d.title,
                    editor: d.videoEditor || d.assignedTo,
                    effortPTS: d.effortPTS || d.effortPts || 0,
                    dueDate: d.dueDate || d.clientDueDate,
                    liveDate: d.plannedLiveDate || d.liveDate,
                    clientName: d.client,
                    status: d.status || d.productionWorkflowStatus,
                    source: 'api'
                }));

                console.log('[Editor Capacity] Loaded', apiDeliverables.length, 'items from API');
                render();
            } catch (err) {
                // Silently fail - widget works with just Firebase data
                console.warn('[Editor Capacity] API unavailable, using Firebase data only');
            }
        }

        // Calculate workload per editor from edit_queue, asset_metadata, and API
        function getWeeklyCapacity(editor) {
            return Number(editor.weeklyCapacityPTS ?? editor.weeklyCapacityPts ?? editor.maxHoursPerWeek ?? 40);
        }

        function getEffortPoints(item) {
            if (typeof item?.effortPTS === 'number') return item.effortPTS;
            if (typeof item?.effortPts === 'number') return item.effortPts;
            return 0;
        }

        function calculateEditorWorkload(editorName) {
            let taskCount = 0;
            let effortPoints = 0;
            let tasks = [];
            const seenIds = new Set();

            // Count from edit_queue (synced from Commercial Hub)
            editQueue.forEach(item => {
                if (item.editor === editorName && item.status !== 'Live' && item.status !== 'Approved') {
                    const effort = getEffortPoints(item);
                    taskCount++;
                    effortPoints += effort;
                    seenIds.add(item.id);
                    tasks.push({
                        title: item.title,
                        client: item.clientName,
                        dueDate: item.dueDate,
                        liveDate: item.liveDate,
                        status: item.status,
                        effortPTS: effort,
                        source: 'firebase'
                    });
                }
            });

            // Count from asset_metadata where editor is assigned
            assetMetadata.forEach(asset => {
                if (asset.editor === editorName &&
                    !seenIds.has(asset.id) &&
                    asset.status !== 'Live' && asset.status !== 'Approved') {
                    const effort = getEffortPoints(asset);
                    taskCount++;
                    effortPoints += effort;
                    seenIds.add(asset.id);
                    tasks.push({
                        title: asset.assetTitle,
                        client: asset.clientName,
                        dueDate: asset.deliveryDue,
                        liveDate: asset.liveDate || asset.plannedLiveDate,
                        status: asset.status,
                        effortPTS: effort,
                        source: 'firebase'
                    });
                }
            });

            // Count from API deliverables (canonical Notion data)
            apiDeliverables.forEach(item => {
                if (item.editor === editorName && !seenIds.has(item.id)) {
                    const effort = item.effortPTS || 0;
                    taskCount++;
                    effortPoints += effort;
                    seenIds.add(item.id);
                    tasks.push({
                        title: item.title,
                        client: item.clientName,
                        dueDate: item.dueDate,
                        liveDate: item.liveDate,
                        status: item.status,
                        effortPTS: effort,
                        source: 'api'
                    });
                }
            });

            return { taskCount, effortPoints, tasks };
        }

        function render() {
            if (loading) { root.innerHTML = `<div class="widget"><div class="loading"><div class="spinner"></div>Loading...</div></div>`; return; }

            // Filter to Editorial team (editors) or based on edit_queue assignments
            // Exclude non-editors by name (Megan, Alex are not editors)
            const excludedNames = ['Megan', 'Alex'];
            const editors = staff.filter(s => {
                const fullName = `${s.firstName || ''} ${s.lastName || ''}`.trim();
                const firstName = (s.firstName || '').trim();
                // Exclude specific non-editors
                if (excludedNames.includes(firstName)) return false;
                // Include only Editorial team or roles containing 'editor'
                return s.team === 'Editorial' || s.role?.toLowerCase().includes('editor');
            });

            // Calculate capacity based on actual workload
            const editorsWithWorkload = editors.map(e => {
                const fullName = `${e.firstName} ${e.lastName}`;
                const { taskCount, effortPoints, tasks } = calculateEditorWorkload(fullName);
                const weeklyCapacity = getWeeklyCapacity(e);
                const utilization = weeklyCapacity > 0 ? Math.round((effortPoints / weeklyCapacity) * 100) : 0;
                return { ...e, utilization, taskCount, tasks, effortPoints, weeklyCapacity };
            });

            const avgCapacity = editorsWithWorkload.length > 0
                ? Math.round(editorsWithWorkload.reduce((sum, s) => sum + s.utilization, 0) / editorsWithWorkload.length)
                : 0;

            root.innerHTML = `
                <div class="widget">
                    <div class="header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="title">Editor Capacity</h2>
                        <span class="badge" style="background:${capacityColor(avgCapacity)}20; color:${capacityColor(avgCapacity)}">${avgCapacity}% avg</span>
                    </div>
                    ${editorsWithWorkload.length === 0 ? `
                        <div class="empty">
                            <div class="empty-icon">✏️</div>
                            <div class="empty-title">No Editors Found</div>
                            <div class="empty-sub">Add staff members with team "Editorial" or role containing "editor" to Firebase.</div>
                        </div>
                    ` : `
                        <div class="list">
                            ${editorsWithWorkload.map((e, idx) => `
                                <div class="editor" id="editor-${idx}">
                                    <div class="editor-main" onclick="openEditorModal(${JSON.stringify(e).replace(/"/g, '&quot;')})">
                                        <div class="avatar" style="background: ${getTeamColor(e.team)}">${initials(e.firstName, e.lastName)}</div>
                                        <div class="editor-info">
                                            <div class="editor-name">${e.firstName} ${e.lastName}</div>
                                            <div class="editor-role">${e.role || 'Editor'} • ${e.effortPoints.toFixed(1)} PTS / ${e.weeklyCapacity} PTS</div>
                                        </div>
                                        <div class="capacity-bar">
                                            <div class="capacity-fill" style="width:${Math.min(e.utilization, 100)}%; background:${capacityColor(e.utilization)}"></div>
                                        </div>
                                        <div class="capacity-value" style="color:${capacityColor(e.utilization)}">${e.utilization}%</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        // Global toggle function for expanding task list
        window.toggleTasks = function(idx) {
            const taskList = document.getElementById(`tasks-${idx}`);
            if (taskList) {
                taskList.classList.toggle('expanded');
            }
        };

        // Show toast notification
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Close modal
        window.closeModal = function() {
            document.getElementById('modalOverlay').classList.remove('active');
            currentEditor = null;
        };

        // Get available projects from daily rundowns and commercial hub
        function getAvailableProjects() {
            const projects = [];
            // From daily rundowns (not assigned to editors yet or this editor)
            dailyRundowns.forEach(item => {
                if (item.section === 'GOING LIVE' || item.section === 'EXTERNAL') {
                    projects.push({
                        id: item.id,
                        title: item.title,
                        source: 'daily_rundown',
                        vertical: item.vertical,
                        creator: item.creator,
                        dateKey: item.dateKey
                    });
                }
            });
            // From edit queue (unassigned items)
            editQueue.forEach(item => {
                if (!item.editor) {
                    projects.push({
                        id: item.id,
                        title: item.title,
                        source: 'edit_queue',
                        client: item.clientName,
                        dueDate: item.dueDate
                    });
                }
            });
            // From asset metadata (unassigned)
            assetMetadata.forEach(asset => {
                if (!asset.editor && asset.status !== 'Live' && asset.status !== 'Approved') {
                    projects.push({
                        id: asset.id,
                        title: asset.assetTitle || 'Untitled Asset',
                        source: 'asset_metadata',
                        client: asset.clientName,
                        dueDate: asset.deliveryDue
                    });
                }
            });
            return projects;
        }

        // Assign project to editor
        window.assignProject = async function() {
            const select = document.getElementById('assignSelect');
            const projectData = JSON.parse(select.value || 'null');
            if (!projectData || !currentEditor) return;

            const btn = document.querySelector('.assign-btn');
            btn.disabled = true;
            btn.textContent = 'Assigning...';

            try {
                const editorName = `${currentEditor.firstName} ${currentEditor.lastName}`;

                if (projectData.source === 'edit_queue') {
                    // Update existing edit_queue item
                    await setDoc(doc(db, "artifacts", appId, "public", "data", "edit_queue", projectData.id), {
                        editor: editorName,
                        assignedAt: serverTimestamp()
                    }, { merge: true });
                } else if (projectData.source === 'asset_metadata') {
                    // Update existing asset_metadata item
                    await setDoc(doc(db, "artifacts", appId, "public", "data", "asset_metadata", projectData.id), {
                        editor: editorName,
                        assignedAt: serverTimestamp()
                    }, { merge: true });
                } else if (projectData.source === 'daily_rundown') {
                    // Create a new edit_queue entry from daily rundown
                    await addDoc(collection(db, "artifacts", appId, "public", "data", "edit_queue"), {
                        title: projectData.title,
                        editor: editorName,
                        sourceType: 'daily_rundown',
                        sourceId: projectData.id,
                        vertical: projectData.vertical,
                        creator: projectData.creator,
                        status: 'Edit',
                        assignedAt: serverTimestamp()
                    });
                }

                showToast(`Assigned to ${editorName}`, 'success');
                closeModal();
            } catch (error) {
                console.error('Assignment error:', error);
                showToast('Failed to assign: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Assign to Editor';
        };

        // Open editor detail modal
        window.openEditorModal = function(editorData) {
            currentEditor = editorData;
            const modal = document.getElementById('modal');
            const availableProjects = getAvailableProjects();

            modal.innerHTML = `
                <div class="modal-header">
                    <div class="modal-avatar" style="background: ${getTeamColor(editorData.team)}">${initials(editorData.firstName, editorData.lastName)}</div>
                    <div class="modal-info">
                        <div class="modal-name">${editorData.firstName} ${editorData.lastName}</div>
                        <div class="modal-role">${editorData.role || 'Editor'} • ${editorData.team || 'Editorial'}</div>
                        <div class="modal-capacity">
                            <div class="modal-bar">
                                <div class="modal-bar-fill" style="width:${Math.min(editorData.utilization, 100)}%; background:${capacityColor(editorData.utilization)}"></div>
                            </div>
                            <span class="modal-percent" style="color:${capacityColor(editorData.utilization)}">${editorData.utilization}%</span>
                            <span style="font-size: 11px; color: var(--ink-sub);">${editorData.effortPoints.toFixed(1)} PTS / ${editorData.weeklyCapacity} PTS</span>
                        </div>
                    </div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="modal-section">
                        <div class="modal-section-title">
                            Current Assignments
                            <span class="modal-section-count">${editorData.tasks.length}</span>
                        </div>
                        ${editorData.tasks.length === 0 ?
                            '<div class="modal-empty">No active tasks assigned</div>' :
                            editorData.tasks.map(t => `
                                <div class="modal-task">
                                    <div class="modal-task-title" style="display: flex; align-items: center; gap: 8px;">
                                        ${t.title || 'Untitled'}
                                        ${t.projectId ? `<a href="project-detail.html?id=${t.projectId}" target="_blank" style="display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: var(--bg-soft); border-radius: 4px; color: var(--ink-sub); text-decoration: none; transition: 0.15s;" title="View Project Page"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></a>` : ''}
                                    </div>
                                    <div class="modal-task-meta">
                                        ${t.client ? `<span class="modal-tag client">${t.client}</span>` : ''}
                                        ${t.status ? `<span class="modal-tag status">${t.status}</span>` : ''}
                                        ${t.effortPTS ? `<span class="modal-tag">${t.effortPTS} PTS</span>` : ''}
                                        ${t.dueDate ? `<span class="modal-tag due">Due: ${new Date(t.dueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>` : ''}
                                        ${t.liveDate ? `<span class="modal-tag live">Live: ${new Date(t.liveDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>` : ''}
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>

                    <div class="modal-section">
                        <div class="assign-section">
                            <div class="assign-title">Assign New Project</div>
                            <select class="assign-select" id="assignSelect">
                                <option value="">Select a project to assign...</option>
                                ${availableProjects.length === 0 ? '<option disabled>No unassigned projects available</option>' : ''}
                                ${availableProjects.map(p => `
                                    <option value='${JSON.stringify(p).replace(/'/g, "&#39;")}'>${p.title}${p.client ? ` (${p.client})` : ''}${p.source === 'daily_rundown' ? ' [Rundown]' : ''}</option>
                                `).join('')}
                            </select>
                            <button class="assign-btn" onclick="assignProject()" ${availableProjects.length === 0 ? 'disabled' : ''}>Assign to Editor</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('modalOverlay').classList.add('active');
        };

        onAuthStateChanged(auth, user => {
            if (user) {
                // Load API deliverables (canonical Notion data)
                loadApiDeliverables();
                setInterval(loadApiDeliverables, 60000); // Refresh every minute

                // Listen to staff directory
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "staff_directory"), snap => {
                    staff = []; snap.forEach(d => staff.push({ id: d.id, ...d.data() }));
                    loading = false; render();
                }, e => { console.error(e); loading = false; render(); });

                // Listen to edit queue (synced from Commercial Hub)
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "edit_queue"), snap => {
                    editQueue = []; snap.forEach(d => editQueue.push({ id: d.id, ...d.data() }));
                    render();
                }, e => console.error(e));

                // Listen to asset metadata (from Commercial Hub)
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "asset_metadata"), snap => {
                    assetMetadata = []; snap.forEach(d => assetMetadata.push({ id: d.id, ...d.data() }));
                    render();
                }, e => console.error(e));

                // Listen to daily rundowns for assignment capability
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "daily_rundowns"), snap => {
                    dailyRundowns = []; snap.forEach(d => dailyRundowns.push({ id: d.id, ...d.data() }));
                }, e => console.error(e));
            } else {
                signInAnonymously(auth).catch(e => { loading = false; render(); });
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('modalOverlay').classList.contains('active')) {
                    closeModal();
                }
            }
        });
    </script>
</body>
</html>
