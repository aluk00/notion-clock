<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Capacity | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --production: #43B049;
            --available: #10B981;
            --busy: #F59E0B;
            --full: #EF4444;
            --ink: #1C1C1C;
            --ink-light: #6B7280;
            --border: #E5E7EB;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            color: var(--ink);
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }
        .dots { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--production); }
        .dots span:nth-child(1) { animation: pulse 2s ease-in-out infinite; }
        .dots span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dots span:nth-child(3) { animation: pulse 2s ease-in-out 0.6s infinite; }
        .dots span:nth-child(4) { animation: pulse 2s ease-in-out 0.9s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .pulse-label { font-size: 11px; font-weight: 700; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; }
        .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        @media (max-width: 500px) { .summary { grid-template-columns: 1fr; } }
        .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 12px; }
        .summary-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .summary-icon.available { background: rgba(16, 185, 129, 0.1); }
        .summary-icon.busy { background: rgba(245, 158, 11, 0.1); }
        .summary-icon.full { background: rgba(239, 68, 68, 0.1); }
        .summary-content { flex: 1; }
        .summary-value { font-size: 24px; font-weight: 800; line-height: 1; margin-bottom: 2px; }
        .summary-label { font-size: 10px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .member-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: var(--transition); }
        .member-card:hover { border-color: var(--ink-light); }
        .member-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .member-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--production); color: white; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .member-info { flex: 1; }
        .member-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
        .member-role { font-size: 10px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.03em; }
        .member-status { width: 10px; height: 10px; border-radius: 50%; }
        .member-status.available { background: var(--available); }
        .member-status.busy { background: var(--busy); }
        .member-status.full { background: var(--full); }
        .capacity-bar { height: 6px; background: var(--surface-alt); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
        .capacity-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .capacity-fill.available { background: var(--available); }
        .capacity-fill.busy { background: var(--busy); }
        .capacity-fill.full { background: var(--full); }
        .tasks-summary { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
        .tasks-count { font-weight: 600; color: var(--ink); }
        .tasks-detail { color: var(--ink-light); }
        .footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .footer-text { font-size: 10px; color: var(--ink-light); }
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; gap: 12px; }
        .loading-text { font-size: 11px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.1em; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <span class="pulse-label">Editor Capacity</span>
    </div>
    <div id="content">
        <div class="loading">
            <div class="dots"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading capacity...</span>
        </div>
    </div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const APP_ID = "dmg-command-centre-native";

    // Edit effort in hours by video type
    const EFFORT = { 'Street Talks': 2, 'Mail Talks': 3, 'Deep Dive': 4, 'Spotlight': 2, 'Sport': 2, 'Other': 2 };
    const MAX_HOURS = 8;

    let editors = [];
    let shoots = [];

    function getInitials(name) { return name.split(' ').map(n => n[0]).join('').toUpperCase(); }
    function getCapacityStatus(hours) {
        const pct = (hours / MAX_HOURS) * 100;
        if (pct < 50) return 'available';
        if (pct < 80) return 'busy';
        return 'full';
    }

    function render() {
        const workload = {};
        editors.forEach(d => { workload[d.id] = { tasks: 0, hours: 0 }; });

        shoots.forEach(r => {
            if (r.editorId && workload[r.editorId] && r.status !== 'Published') {
                const effort = EFFORT[r.series] || 2;
                workload[r.editorId].tasks++;
                workload[r.editorId].hours += effort;
            }
        });

        let available = 0, busy = 0, full = 0;
        editors.forEach(d => {
            const status = getCapacityStatus(workload[d.id].hours);
            if (status === 'available') available++;
            else if (status === 'busy') busy++;
            else full++;
        });

        document.getElementById('content').innerHTML = `
            <div class="summary">
                <div class="summary-card"><div class="summary-icon available">🟢</div><div class="summary-content"><div class="summary-value">${available}</div><div class="summary-label">Available</div></div></div>
                <div class="summary-card"><div class="summary-icon busy">🟡</div><div class="summary-content"><div class="summary-value">${busy}</div><div class="summary-label">Busy</div></div></div>
                <div class="summary-card"><div class="summary-icon full">🔴</div><div class="summary-content"><div class="summary-value">${full}</div><div class="summary-label">At Capacity</div></div></div>
            </div>
            <div class="team-grid">
                ${editors.map(d => {
                    const w = workload[d.id];
                    const status = getCapacityStatus(w.hours);
                    const pct = Math.min((w.hours / MAX_HOURS) * 100, 100);
                    const name = `${d.firstName} ${d.lastName}`;
                    return `
                        <div class="member-card">
                            <div class="member-top">
                                <div class="member-avatar">${getInitials(name)}</div>
                                <div class="member-info"><div class="member-name">${name}</div><div class="member-role">${d.role || 'Editor'}</div></div>
                                <div class="member-status ${status}"></div>
                            </div>
                            <div class="capacity-bar"><div class="capacity-fill ${status}" style="width: ${pct}%"></div></div>
                            <div class="tasks-summary"><span class="tasks-count">${w.tasks} video${w.tasks !== 1 ? 's' : ''}</span><span class="tasks-detail">${w.hours.toFixed(1)}h / ${MAX_HOURS}h</span></div>
                        </div>
                    `;
                }).join('')}
            </div>
            <div class="footer"><span class="footer-text">Based on assigned edits in production</span></div>
        `;
    }

    signInAnonymously(auth).then(async () => {
        const staffSnap = await getDocs(collection(db, "artifacts", APP_ID, "public", "data", "staff_directory"));
        const allStaff = staffSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        editors = allStaff.filter(s => s.team === 'Production' || s.role?.toLowerCase().includes('edit') || s.role?.toLowerCase().includes('video'));
        if (editors.length === 0) editors = allStaff.slice(0, 4);

        onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "shoot_calendar_events"), (snap) => {
            shoots = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });
    });
</script>
</body>
</html>
