<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Resource Tabs</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --carbon: #1C1C1C;
            --border-grey: #EAECEF;
            --bg-white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            padding-left: 20px;
        }

        /* --- TABS CONTAINER --- */
        .tabs-container {
            display: flex;
            gap: 3rem;
            align-items: center;
        }

        /* --- THE CLICKABLE HEADERS --- */
        .header-link {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 12px 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            width: fit-content;
            border-radius: 20px;
            
            /* Enhanced Visibility: Blue Outline and Ambient Glow */
            border: 1.5px solid var(--dmg-blue);
            box-shadow: 0 4px 20px rgba(33, 160, 216, 0.1);
            background-color: #FFFFFF;
        }

        /* Hover Interaction */
        .header-link:hover {
            transform: translateY(-5px);
            background-color: #FFF;
            /* Intensified Glow on Hover */
            box-shadow: 0 10px 30px rgba(33, 160, 216, 0.25);
            border-color: var(--dmg-blue);
        }

        /* Typography Styling */
        .title-text {
            font-size: 2.5rem; 
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.04em;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .text-left { animation-delay: 0.1s; }
        .text-right { animation-delay: 0.3s; }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: var(--dmg-blue);
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Staggered Dot Entrance */
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        
        @media (max-width: 900px) {
            .title-text { font-size: 1.8rem; }
            .dots-grid { width: 24px; height: 24px; gap: 4px; }
            .tabs-container { gap: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="tabs-container">
        <!-- Tab 1: Notion How To -->
        <a href="https://www.notion.so/HOW-TO-NOTION-WORKSPACE-ARCHITECTURE-2d8b73e3901e80eda4cacc3e842bce96?source=copy_link" target="_top" class="header-link">
            <div class="title-text text-left">NOTION</div>

            <div class="dots-grid">
                <div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div>
            </div>

            <div class="title-text text-right">HOW TO</div>
        </a>

        <!-- Tab 2: How We Work -->
        <a href="https://www.notion.so/OPERATIONAL-WORKFLOW-LINK-PLACEHOLDER" target="_top" class="header-link">
            <div class="title-text text-left" style="animation-delay: 0.4s;">HOW WE</div>

            <div class="dots-grid">
                <div class="dot" style="animation-delay: 0.5s;"></div>
                <div class="dot" style="animation-delay: 0.6s;"></div>
                <div class="dot" style="animation-delay: 0.6s;"></div>
                <div class="dot" style="animation-delay: 0.7s;"></div>
            </div>

            <div class="title-text text-right" style="animation-delay: 0.6s;">WORK</div>
        </a>
    </div>

</body>
</html>
