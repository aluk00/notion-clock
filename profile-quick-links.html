<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Links | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 12px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 340px;
            overflow: hidden;
        }
        .widget-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--dmg-blue);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 14px;
        }
        .link-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 10px;
            border-radius: 12px;
            background: var(--bg-soft);
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
        }
        .link-card:hover {
            background: #FFF;
            border-color: var(--link-color, var(--dmg-blue));
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }
        .link-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--link-color, var(--dmg-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 14px;
            transition: transform 0.2s ease;
        }
        .link-card:hover .link-icon {
            transform: scale(1.1);
        }
        .link-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink);
            text-align: center;
            line-height: 1.2;
        }
        .demo-badge {
            font-size: 7px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: #E6468B;
            padding: 3px 6px;
            border-radius: 4px;
            margin-left: auto;
        }
        .edit-btn {
            display: block;
            width: calc(100% - 28px);
            margin: 0 14px 14px;
            padding: 8px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--ink-sub);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .edit-btn:hover {
            border-color: var(--dmg-blue);
            color: var(--dmg-blue);
            background: #F0F9FF;
        }
        /* Config Modal */
        .config-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .config-overlay.active { display: flex; }
        .config-modal {
            background: #FFF;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow: hidden;
        }
        .config-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .config-title {
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .close-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--bg-soft);
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: var(--ink-sub);
            transition: all 0.2s ease;
        }
        .close-btn:hover {
            background: #E0E0E0;
            color: var(--ink);
        }
        .config-body {
            padding: 16px 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .category-title {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--dmg-blue);
            margin: 16px 0 8px;
        }
        .category-title:first-child { margin-top: 0; }
        .link-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: var(--bg-soft);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .link-option:hover { background: #F0F0F0; }
        .link-option.selected {
            background: #E3F2FD;
            border: 1px solid var(--dmg-blue);
        }
        .link-option input {
            display: none;
        }
        .link-option-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }
        .link-option-text {
            flex: 1;
            font-size: 12px;
            font-weight: 600;
        }
        .link-option-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #FFF;
            transition: all 0.2s ease;
        }
        .link-option.selected .link-option-check {
            background: var(--dmg-blue);
            border-color: var(--dmg-blue);
        }
        .config-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .config-footer button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-save {
            background: var(--dmg-blue);
            color: #FFF;
        }
        .btn-cancel {
            background: #E0E0E0;
            color: #666;
        }
        .limit-notice {
            font-size: 10px;
            color: var(--ink-sub);
            text-align: center;
            padding: 8px;
            background: #FFF9E6;
            border-radius: 6px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="config-overlay" id="config-overlay">
        <div class="config-modal">
            <div class="config-header">
                <span class="config-title">Choose Quick Links</span>
                <button class="close-btn" onclick="window.closeConfig()">×</button>
            </div>
            <div class="config-body" id="config-body"></div>
            <div class="config-footer">
                <button class="btn-cancel" onclick="window.closeConfig()">Cancel</button>
                <button class="btn-save" onclick="window.saveLinks()">Save Links</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const MAX_LINKS = 6;

        // All available links
        const AVAILABLE_LINKS = [
            // Team Pages
            { id: 'creative-home', title: 'Creative Hub', icon: '🎨', color: '#E6468B', url: 'https://www.notion.so/WIP_CREATIVE', category: 'Team Pages' },
            { id: 'production-home', title: 'Production Hub', icon: '🎬', color: '#43B049', url: 'https://www.notion.so/WIP_PRODUCTION', category: 'Team Pages' },
            { id: 'editorial-home', title: 'Editorial Hub', icon: '📰', color: '#E94B4B', url: 'https://www.notion.so/WIP_EDITORIAL', category: 'Team Pages' },
            { id: 'social-home', title: 'Social Hub', icon: '📱', color: '#F2C316', url: 'https://www.notion.so/WIP_SOCIAL', category: 'Team Pages' },
            { id: 'ops-home', title: 'Operations Hub', icon: '⚙️', color: '#21A0D8', url: 'https://www.notion.so/WIP_PEOPLE', category: 'Team Pages' },
            
            // Tools
            { id: 'projects-db', title: 'Projects Database', icon: '📁', color: '#21A0D8', url: 'https://www.notion.so/Projects', category: 'Tools' },
            { id: 'deliverables', title: 'Deliverables', icon: '✅', color: '#43B049', url: 'https://www.notion.so/Deliverables', category: 'Tools' },
            { id: 'calendar', title: 'Shoot Calendar', icon: '📅', color: '#E94B4B', url: 'https://www.notion.so/Calendar', category: 'Tools' },
            { id: 'assets', title: 'Asset Library', icon: '🖼️', color: '#E6468B', url: 'https://www.notion.so/Assets', category: 'Tools' },
            { id: 'templates', title: 'Templates', icon: '📝', color: '#9C27B0', url: 'https://www.notion.so/Templates', category: 'Tools' },
            
            // External
            { id: 'slack', title: 'Slack', icon: '💬', color: '#4A154B', url: 'https://slack.com', category: 'External' },
            { id: 'outlook', title: 'Outlook', icon: '📧', color: '#0078D4', url: 'https://outlook.office.com', category: 'External' },
            { id: 'drive', title: 'Google Drive', icon: '☁️', color: '#4285F4', url: 'https://drive.google.com', category: 'External' },
            { id: 'frame', title: 'Frame.io', icon: '🎞️', color: '#00C8FF', url: 'https://frame.io', category: 'External' },
            { id: 'figma', title: 'Figma', icon: '🎯', color: '#F24E1E', url: 'https://figma.com', category: 'External' },
        ];

        const DEFAULT_LINKS = ['creative-home', 'projects-db', 'deliverables', 'slack'];

        let currentUser = null;
        let userLinks = [];
        let isDemo = true;
        let tempSelection = [];

        const root = document.getElementById('root');

        function render() {
            const selectedLinks = AVAILABLE_LINKS.filter(l => userLinks.includes(l.id));
            
            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid">
                            <span></span><span></span><span></span><span></span>
                        </div>
                        <h2 style="font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); margin: 0;">
                            Quick Links
                        </h2>
                        ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    </div>
                    
                    <div class="links-grid">
                        ${selectedLinks.map(l => `
                            <a href="${l.url}" target="_blank" class="link-card" style="--link-color: ${l.color}">
                                <div class="link-icon" style="background: ${l.color}">${l.icon}</div>
                                <div class="link-title">${l.title}</div>
                            </a>
                        `).join('')}
                        ${selectedLinks.length === 0 ? `
                            <div style="grid-column: span 2; text-align: center; padding: 20px; color: var(--ink-sub); font-size: 11px;">
                                No links selected yet
                            </div>
                        ` : ''}
                    </div>
                    
                    <button class="edit-btn" onclick="window.openConfig()">
                        ✎ Edit My Links
                    </button>
                </div>
            `;
        }

        function renderConfig() {
            const categories = [...new Set(AVAILABLE_LINKS.map(l => l.category))];
            const configBody = document.getElementById('config-body');
            
            configBody.innerHTML = `
                <div class="limit-notice">Select up to ${MAX_LINKS} links (${tempSelection.length}/${MAX_LINKS} selected)</div>
                ${categories.map(cat => `
                    <div class="category-title">${cat}</div>
                    ${AVAILABLE_LINKS.filter(l => l.category === cat).map(l => `
                        <div class="link-option ${tempSelection.includes(l.id) ? 'selected' : ''}" onclick="window.toggleLink('${l.id}')">
                            <div class="link-option-icon" style="background: ${l.color}">${l.icon}</div>
                            <div class="link-option-text">${l.title}</div>
                            <div class="link-option-check">${tempSelection.includes(l.id) ? '✓' : ''}</div>
                        </div>
                    `).join('')}
                `).join('')}
            `;
        }

        window.openConfig = () => {
            tempSelection = [...userLinks];
            renderConfig();
            document.getElementById('config-overlay').classList.add('active');
        };

        window.closeConfig = () => {
            document.getElementById('config-overlay').classList.remove('active');
        };

        window.toggleLink = (linkId) => {
            if (tempSelection.includes(linkId)) {
                tempSelection = tempSelection.filter(id => id !== linkId);
            } else if (tempSelection.length < MAX_LINKS) {
                tempSelection.push(linkId);
            }
            renderConfig();
        };

        window.saveLinks = async () => {
            userLinks = [...tempSelection];
            
            if (currentUser && !isDemo) {
                try {
                    await setDoc(doc(db, "artifacts", appId, "public", "data", "user_quick_links", currentUser.id), {
                        links: userLinks,
                        updatedAt: new Date().toISOString()
                    });
                } catch (e) {
                    console.log('Failed to save:', e);
                }
            } else {
                localStorage.setItem('dmg_quick_links', JSON.stringify(userLinks));
            }
            
            window.closeConfig();
            render();
        };

        async function loadUserLinks(userId) {
            if (userId) {
                try {
                    const docRef = doc(db, "artifacts", appId, "public", "data", "user_quick_links", userId);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        return snap.data().links || [];
                    }
                } catch (e) {
                    console.log('Failed to load links:', e);
                }
            }
            
            const stored = localStorage.getItem('dmg_quick_links');
            if (stored) {
                return JSON.parse(stored);
            }
            
            return DEFAULT_LINKS;
        }

        async function resolveIdentity(authUser) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');

            if (paramId) {
                try {
                    const docRef = doc(db, "artifacts", appId, "public", "data", "staff_directory", paramId);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        currentUser = { id: snap.id, ...snap.data() };
                        isDemo = false;
                        userLinks = await loadUserLinks(currentUser.id);
                        render();
                        return;
                    }
                } catch (e) { console.log('Param lookup failed:', e); }
            }

            if (authUser && authUser.email && !authUser.isAnonymous) {
                try {
                    const q = query(
                        collection(db, "artifacts", appId, "public", "data", "staff_directory"), 
                        where("email", "==", authUser.email)
                    );
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        currentUser = { id: snap.docs[0].id, ...snap.docs[0].data() };
                        isDemo = false;
                        userLinks = await loadUserLinks(currentUser.id);
                        render();
                        return;
                    }
                } catch (e) { console.log('Email lookup failed:', e); }
            }

            isDemo = true;
            userLinks = await loadUserLinks(null);
            render();
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                resolveIdentity(user);
            } else {
                signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
