<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Project Snapshot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --creative-pink: #E6468B;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 0 0 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            background-color: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
        }

        .header-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 20px 0;
        }

        /* --- LEFT SIDE: THE BIG TITLE --- */
        .title-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .title-text {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--ink);
            line-height: 0.92;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            width: 20px;
            height: 20px;
        }

        .dot {
            width: 100%;
            height: 100%;
            background-color: var(--creative-pink);
            border-radius: 50%;
        }

        /* --- VERTICAL SEPARATOR --- */
        .divider {
            width: 1px;
            height: 70px;
            background: var(--border);
            margin: 0 30px;
            position: relative;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -2px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--creative-pink);
        }

        /* --- RIGHT SIDE: THE EXPLAINER --- */
        .explainer-section {
            padding-right: 40px;
        }

        .dots-grid-small {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: 16px;
            height: 16px;
            margin-bottom: 12px;
        }

        .dot-small {
            width: 100%;
            height: 100%;
            background: var(--creative-pink);
            border-radius: 50%;
        }

        .explainer-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink-sub);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title-text">DAILY PROJECT</div>
            <div class="dots-grid">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="title-text">SNAPSHOT</div>
        </div>

        <!-- Vertical Divider -->
        <div class="divider"></div>

        <!-- Explainer Section -->
        <div class="explainer-section">
            <div class="dots-grid-small">
                <div class="dot-small"></div>
                <div class="dot-small"></div>
                <div class="dot-small"></div>
                <div class="dot-small"></div>
            </div>

            <p class="explainer-text">
                Today's project statuses at a glance
            </p>
        </div>
    </div>

</body>
</html>
