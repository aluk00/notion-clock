<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Calendar | DMG Command Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --editorial: #E94B4B;
            --editorial-soft: #FEF2F2;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --success: #10B981;
            --ai-accent: #7C3AED;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: #FFF; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* DMG STYLE HEADER */
        .header { 
            display: flex; align-items: center; justify-content: space-between; 
            margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
            background: #FFF; padding: 20px 24px; border-radius: 16px; border: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 20px; height: 20px; }
        .dot { width: 100%; height: 100%; background: var(--editorial); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        
        .title-block {}
        .title { font-size: 22px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: -0.03em; line-height: 1.1; }
        .subtitle { font-size: 10px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
        
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        
        .slider-toggle { display: flex; background: #F3F4F6; padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
        .slider-btn { padding: 8px 16px; font-size: 10px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.2s; color: var(--ink-sub); border: none; background: transparent; font-family: inherit; }
        .slider-btn.active { background: var(--editorial); color: #FFF; }
        
        .cat-pills { display: flex; gap: 6px; flex-wrap: wrap; }
        .cat-pill { padding: 6px 14px; border-radius: 20px; font-size: 9px; font-weight: 800; text-transform: uppercase; border: 1px solid var(--border); background: #FFF; color: var(--ink-sub); cursor: pointer; transition: 0.2s; font-family: inherit; }
        .cat-pill:hover { border-color: var(--editorial); color: var(--editorial); }
        .cat-pill.active { background: var(--ink); color: #FFF; border-color: var(--ink); }
        
        /* Section Headers */
        .section-header { display: flex; align-items: center; gap: 10px; margin: 24px 0 12px; }
        .section-dot { width: 8px; height: 8px; background: var(--editorial); border-radius: 50%; }
        .section-title { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-sub); }
        
        /* Hooks Grid */
        .hooks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .hook-card { background: #FFF; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; transition: 0.2s; cursor: pointer; position: relative; border-left: 4px solid var(--editorial); }
        .hook-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.06); }
        .hook-cat { font-size: 8px; font-weight: 900; color: var(--editorial); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
        .hook-title { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.3; }
        .hook-desc { font-size: 10px; color: var(--ink-sub); margin-top: 4px; line-height: 1.4; }
        .hook-card.ai-pick { border-left-color: var(--ai-accent); background: #FDF4FF; }
        .hook-card.ai-pick .hook-cat { color: var(--ai-accent); }
        .hook-card.saved { border-left-color: var(--success); }
        .hook-card.saved::after { content: '✓'; position: absolute; top: 10px; right: 12px; font-size: 12px; color: var(--success); font-weight: 800; }
        
        /* Week Strip */
        .week-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
        .week-strip::-webkit-scrollbar { height: 4px; }
        .week-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .day-card { min-width: 160px; background: #FFF; border: 1px solid var(--border); border-radius: 12px; padding: 14px; flex-shrink: 0; }
        .day-card.today { border-color: var(--editorial); background: var(--editorial-soft); }
        .day-date { font-size: 10px; font-weight: 900; color: var(--editorial); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
        .day-item { font-size: 11px; font-weight: 600; color: var(--ink); padding: 4px 0; display: flex; align-items: center; gap: 8px; }
        .day-item::before { content: ''; width: 4px; height: 4px; background: var(--editorial); border-radius: 50%; flex-shrink: 0; }
        
        /* Info Cards */
        .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        @media (max-width: 900px) { .info-grid { grid-template-columns: 1fr; } }
        .info-card { background: #FFF; border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .info-header { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .info-list { list-style: none; padding: 0; margin: 0; }
        .info-list li { font-size: 11px; font-weight: 600; padding: 8px 0; border-bottom: 1px solid #F3F4F6; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.1s; }
        .info-list li:hover { background: #F9FAFB; margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }
        .info-list li:last-child { border-bottom: none; }
        .info-age { font-size: 14px; font-weight: 900; color: var(--editorial); }
        .info-sub-header { font-size: 9px; font-weight: 900; color: var(--ink-sub); text-transform: uppercase; margin-top: 14px; margin-bottom: 6px; letter-spacing: 0.05em; }
        
        /* Calendar Views */
        .year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 1000px) { .year-grid { grid-template-columns: repeat(2, 1fr); } }
        .month-card { background: #FFF; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .month-header { padding: 10px 12px; background: #F9FAFB; border-bottom: 1px solid var(--border); font-weight: 900; font-size: 10px; text-transform: uppercase; text-align: center; letter-spacing: 0.05em; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px; gap: 2px; }
        .day-cell { aspect-ratio: 1; font-size: 9px; font-weight: 600; color: #D1D5DB; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; }
        .day-cell:hover { background: var(--editorial-soft); color: var(--editorial); }
        .day-cell.active { color: #9CA3AF; }
        .day-cell.has-events { background: var(--editorial); color: #FFF; font-weight: 800; }
        .day-cell.is-today { box-shadow: inset 0 0 0 2px var(--editorial); }
        
        /* Week View */
        .week-view-horizontal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
        @media (max-width: 900px) { .week-view-horizontal { grid-template-columns: repeat(2, 1fr); } }
        .week-col { background: #FFF; border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-height: 280px; display: flex; flex-direction: column; }
        .week-col.is-today { border-color: var(--editorial); background: var(--editorial-soft); }
        .week-col-header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
        .week-col-day { font-size: 10px; font-weight: 900; color: var(--editorial); text-transform: uppercase; }
        .week-col-num { font-size: 22px; font-weight: 900; color: var(--ink); }
        .week-col-events { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .week-col-event { background: #F9FAFB; padding: 8px; border-radius: 8px; border-left: 3px solid var(--editorial); }
        .week-col-title { font-size: 11px; font-weight: 700; line-height: 1.3; }
        .week-col-cat { font-size: 8px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; margin-bottom: 2px; }
        
        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: #FFF; width: 100%; max-width: 400px; border-radius: 16px; overflow: hidden; animation: fadeIn 0.2s; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 16px; font-weight: 900; }
        .modal-close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; font-size: 18px; color: var(--ink-sub); border: none; background: transparent; }
        .modal-close:hover { background: #F3F4F6; }
        .modal-body { padding: 16px 20px; max-height: 60vh; overflow-y: auto; }
        .modal-item { background: #F9FAFB; padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; border-left: 3px solid var(--editorial); }
        .modal-item-title { font-size: 13px; font-weight: 700; }
        .modal-item-cat { font-size: 9px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; margin-top: 4px; }
        .btn-save { width: 100%; padding: 12px; background: var(--success); color: #FFF; border: none; border-radius: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 8px; font-family: inherit; }
        .btn-save:hover { filter: brightness(1.1); }
        .btn-save.saved { background: #D1FAE5; color: var(--success); cursor: default; }
        
        /* Ideas Panel */
        .ideas-toggle { position: fixed; right: 20px; bottom: 20px; width: 50px; height: 50px; background: var(--editorial); color: #FFF; border: none; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 4px 16px rgba(233,75,75,0.3); z-index: 80; display: flex; align-items: center; justify-content: center; }
        .ideas-toggle .count { position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; background: var(--ink); color: #FFF; border-radius: 50%; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .ideas-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; background: #FFF; border-left: 1px solid var(--border); z-index: 90; transform: translateX(100%); transition: transform 0.3s; padding: 20px; overflow-y: auto; }
        .ideas-panel.open { transform: translateX(0); }
        .ideas-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .ideas-title { font-size: 14px; font-weight: 900; text-transform: uppercase; }
        .idea-card { background: #F9FAFB; padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; border-left: 3px solid var(--success); position: relative; }
        .idea-card-title { font-size: 12px; font-weight: 700; padding-right: 24px; }
        .idea-card-date { font-size: 9px; color: var(--ink-sub); margin-top: 4px; }
        .idea-delete { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border: none; background: transparent; color: #CCC; cursor: pointer; font-size: 14px; }
        .idea-delete:hover { color: var(--editorial); }
        
        /* Loading */
        #loading { position: fixed; inset: 0; background: #FFF; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
        #loading.hidden { display: none; }
        .loader-dots { display: flex; gap: 8px; }
        .loader-dots span { width: 12px; height: 12px; background: var(--editorial); border-radius: 50%; animation: loader-pulse 1.2s infinite ease-in-out; }
        .loader-dots span:nth-child(2) { animation-delay: 0.15s; }
        .loader-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes loader-pulse { 0%, 100% { transform: scale(0.5); opacity: 0.3; } 50% { transform: scale(1); opacity: 1; } }
    </style>
</head>

<div id="loading">

    <main id="view-calendar" class="hidden">

                <button class="slider-btn" id="cal-btn-week" onclick="setCalendarMode('week')">Week</button>
            </div>
        </div>
        <div id="calendar-mount"></div>
    </main>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">Event</span>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<button class="ideas-toggle" onclick="toggleIdeas()">

<div class="ideas-panel" id="ideas-panel">

    </div>
    <div id="ideas-list"></div>
</div>

function getDateKey(date) {
    return `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function getEvents(date, cat) {
    const key = getDateKey(date);
    return DATABASE.filter(e => e.d === key && (cat === 'all' || e.c === cat || e.c === 'all'));
}

function getReleases(cat) {
    const now = new Date();
    return RELEASES.filter(r => {
        const releaseDate = new Date(r.d);
        if (releaseDate < now) return false;
        if (cat === 'all') return true;
        if (cat === 'film' && (r.c === 'film' || r.c === 'tv')) return true;
        return r.c === cat;
    }).sort((a, b) => new Date(a.d) - new Date(b.d));
}

function isIdeaSaved(title) {
    return savedIdeas.some(i => i.title === title);
}

function saveIdea(title, desc) {
    if (!isIdeaSaved(title)) {
        savedIdeas.push({ title, desc: desc || '', savedAt: new Date().toISOString() });
        localStorage.setItem('editorial_ideas', JSON.stringify(savedIdeas));
        renderIdeas();
    }
}

function deleteIdea(idx) {
    savedIdeas.splice(idx, 1);
    localStorage.setItem('editorial_ideas', JSON.stringify(savedIdeas));
    renderIdeas();
}

function renderIdeas() {
    document.getElementById('ideas-count').textContent = savedIdeas.length;
    const list = document.getElementById('ideas-list');
    if (savedIdeas.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:#CCC; font-size:11px; padding:20px;">No saved ideas yet.<br>Click any hook to save it.</div>';
    } else {
        list.innerHTML = savedIdeas.map((idea, i) => `
            <div class="idea-card">
                <div class="idea-card-title">${idea.title}</div>
                <div class="idea-card-date">${idea.desc}</div>
                <button class="idea-delete" onclick="deleteIdea(${i})">×</button>
            </div>
        `).join('');
    }
}

async function fetchWiki(m, d) {
    try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/all/${m}/${d}`);
        const data = await res.json();
        const births = (data.births || []).map(b => ({
            name: b.text.split(',')[0],
            age: CURRENT_YEAR - b.year,
            desc: b.text.split(',').slice(1).join(',').trim()
        })).slice(0, 8);
        return { births, events: (data.events || []).slice(0, 5) };
    } catch { return { births: [], events: [] }; }
}

async function loadBriefing() {
    const m = String(TODAY.getMonth() + 1).padStart(2, '0');
    const d = String(TODAY.getDate()).padStart(2, '0');
    
    const events = getEvents(TODAY, currentCat);
    const wiki = await fetchWiki(m, d);
    const releases = getReleases(currentCat);
    
    let hooks = [];
    events.forEach(e => hooks.push({ cat: 'Scheduled', title: e.t, desc: 'Editorial Milestone' }));
    wiki.births.slice(0, 4).forEach(b => {
        hooks.push({ cat: 'Birthday', title: `${b.name} turns ${b.age}`, desc: b.desc });
    });
    
    const hooksMount = document.getElementById('hooks-mount');
    if (hooks.length === 0) {
        hooksMount.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#CCC; font-size:12px;">No hooks for this category today</div>';
    } else {
        hooksMount.innerHTML = hooks.slice(0, 12).map(h => `
            <div class="hook-card ${isIdeaSaved(h.title) ? 'saved' : ''}" onclick="openHookModal('${h.title.replace(/'/g, "\\'")}', '${(h.desc || '').replace(/'/g, "\\'")}')">
                <div class="hook-cat">${h.cat}</div>
                <div class="hook-title">${h.title}</div>
                ${h.desc ? `<div class="hook-desc">${h.desc}</div>` : ''}
            </div>
        `).join('');
    }
    
    // Week strip
    const weekMount = document.getElementById('week-mount');
    weekMount.innerHTML = '';
    for (let i = 0; i <= 6; i++) {
        const date = new Date(TODAY);
        date.setDate(TODAY.getDate() + i);
        const dayEvents = getEvents(date, currentCat);
        const isToday = i === 0;
        weekMount.innerHTML += `
            <div class="day-card ${isToday ? 'today' : ''}">
                <div class="day-date">${isToday ? 'Today' : date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' })}</div>
                ${dayEvents.length ? dayEvents.slice(0, 3).map(e => `<div class="day-item">${e.t}</div>`).join('') : '<div style="color:#CCC; font-size:10px; font-style:italic;">No events</div>'}
            </div>
        `;
    }
    
    // Birthdays list
    document.getElementById('births-list').innerHTML = wiki.births.slice(0, 5).map(b => `
        <li onclick="openHookModal('${b.name} Birthday', 'Turns ${b.age}. ${b.desc.replace(/'/g, "\\'")}')">
            <span style="flex:1">${b.name}</span> <span class="info-age">${b.age}</span>
        </li>`).join('') || '<li style="color:#CCC">Loading...</li>';
    
    // History list
    document.getElementById('history-list').innerHTML = wiki.events.slice(0, 5).map(e => `
        <li onclick="openHookModal('On This Day: ${e.year}', '${e.text.replace(/'/g, "\\'")}')">
            <div style="flex:1"><strong style="color:var(--editorial)">${e.year}</strong><br><span style="font-size:10px; color:var(--ink-sub)">${e.text.substring(0, 50)}...</span></div>
        </li>`).join('') || '<li style="color:#CCC">Loading...</li>';
    
    // Releases
    const screenReleases = releases.filter(r => r.c === 'film' || r.c === 'tv').slice(0, 4);
    const gameReleases = releases.filter(r => r.c === 'game').slice(0, 3);
    
    document.getElementById('screen-list').innerHTML = screenReleases.map(r => `
        <li onclick="openHookModal('${r.t}', 'Release: ${r.d}')">
            <span style="flex:1">${r.t}</span> <span style="font-size:9px; color:#9CA3AF;">${r.d.slice(5)}</span>
        </li>`).join('') || '<li style="color:#CCC">No upcoming</li>';
    document.getElementById('games-list').innerHTML = gameReleases.map(r => `
        <li onclick="openHookModal('${r.t}', 'Release: ${r.d}')">
            <span style="flex:1">${r.t}</span> <span style="font-size:9px; color:#9CA3AF;">${r.d.slice(5)}</span>
        </li>`).join('') || '<li style="color:#CCC">No upcoming</li>';
}

function setCalendarMode(mode) {
    currentCalMode = mode;
    document.querySelectorAll('#cal-btn-year, #cal-btn-month, #cal-btn-week').forEach(b => b.classList.remove('active'));
    document.getElementById(`cal-btn-${mode}`).classList.add('active');
    renderCalendar();
}

function renderCalendar() {
    const mount = document.getElementById('calendar-mount');
    if (!mount) return;
    mount.innerHTML = '';
    document.getElementById('calYear').textContent = CURRENT_YEAR;
    
    if (currentCalMode === 'year') {
        mount.className = 'year-grid';
        ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].forEach((name, idx) => {
            const days = new Date(CURRENT_YEAR, idx + 1, 0).getDate();
            const start = (new Date(CURRENT_YEAR, idx, 1).getDay() + 6) % 7;
            let cells = '';
            for (let s = 0; s < start; s++) cells += '<div class="day-cell"></div>';
            for (let d = 1; d <= days; d++) {
                const dateObj = new Date(CURRENT_YEAR, idx, d);
                const events = getEvents(dateObj, currentCat);
                const isToday = dateObj.toDateString() === TODAY.toDateString();
                cells += `<div class="day-cell ${events.length ? 'has-events' : ''} ${isToday ? 'is-today' : ''}" onclick="openDayModal(${idx+1}, ${d})">${d}</div>`;
            }
            mount.innerHTML += `<div class="month-card"><div class="month-header">${name}</div><div class="days-grid">${cells}</div></div>`;
        });
    } else if (currentCalMode === 'week') {
        mount.className = 'week-view-horizontal';
        for (let i = 0; i < 7; i++) {
            const d = new Date(TODAY);
            d.setDate(TODAY.getDate() + i);
            const events = getEvents(d, currentCat);
            const isToday = i === 0;
            mount.innerHTML += `
                <div class="week-col ${isToday ? 'is-today' : ''}">
                    <div class="week-col-header">
                        <div class="week-col-day">${d.toLocaleDateString('en-GB', { weekday: 'short' })}</div>
                        <div class="week-col-num">${d.getDate()}</div>
                    </div>
                    <div class="week-col-events">
                        ${events.length ? events.map(e => `
                            <div class="week-col-event">
                                <div class="week-col-cat">${e.c}</div>
                                <div class="week-col-title">${e.t}</div>
                            </div>
                        `).join('') : '<span style="color:#CCC; font-size:10px; font-style:italic;">No events</span>'}
                    </div>
                </div>`;
        }
    }
}

window.openHookModal = (title, desc) => {
    document.getElementById('modal-title').textContent = 'Save Idea';
    document.getElementById('modal-body').innerHTML = `
        <div class="modal-item">
            <div class="modal-item-title">${title}</div>
            ${desc ? `<div class="modal-item-cat">${desc}</div>` : ''}
        </div>
        <button class="btn-save ${isIdeaSaved(title) ? 'saved' : ''}" onclick="${isIdeaSaved(title) ? '' : `saveIdea('${title.replace(/'/g, "\\'")}', '${(desc||'').replace(/'/g, "\\'")}')`}; this.classList.add('saved'); this.textContent='Saved ✓';">
            ${isIdeaSaved(title) ? 'Saved ✓' : 'Add to My Ideas'}
        </button>
    `;
    document.getElementById('modal').classList.add('active');
};

window.openDayModal = (month, day) => {
    const dateObj = new Date(CURRENT_YEAR, month - 1, day);
    const events = getEvents(dateObj, currentCat);
    
    document.getElementById('modal-title').textContent = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
    document.getElementById('modal-body').innerHTML = events.length > 0 ? events.map(e => `
        <div class="modal-item" onclick="saveIdea('${e.t.replace(/'/g, "\\'")}', 'Calendar'); closeModal();" style="cursor:pointer;">
            <div class="modal-item-title">${e.t}</div>
            <div class="modal-item-cat">Click to save</div>
        </div>
    `).join('') : '<div style="text-align:center; color:#CCC; padding:20px;">No events for this day</div>';
    document.getElementById('modal').classList.add('active');
};

window.closeModal = () => document.getElementById('modal').classList.remove('active');
window.toggleIdeas = () => document.getElementById('ideas-panel').classList.toggle('open');
window.deleteIdea = deleteIdea;
window.saveIdea = saveIdea;
window.setCalendarMode = setCalendarMode;

document.querySelectorAll('.cat-pill').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        loadBriefing();
        renderCalendar();
    });
});

document.querySelectorAll('.slider-btn[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.slider-btn[data-view]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const view = btn.dataset.view;
        document.getElementById('view-briefing').classList.toggle('hidden', view !== 'briefing');
        document.getElementById('view-calendar').classList.toggle('hidden', view !== 'calendar');
        if (view === 'calendar') renderCalendar();
    });
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Init
document.getElementById('todayDate').textContent = TODAY.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
renderIdeas();
loadBriefing().then(() => {
    setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
    }, 300);
});
</script>
