<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Calendar | MAIN</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --dmg-blue: #21A0D8;
            --carbon: #1C1C1C;
            --bg-page: #FFFFFF;
            --bg-base: #F9FAFB;
            --border: #EAECEF;
            --ink: #333;
            --ink-sub: #757575;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            --current-brand: var(--dmg-blue);
            
            --cat-awareness: #9C27B0;
            --cat-anniversary: #FF9800;
            --cat-popculture: #E91E63;
            --cat-entertainment: #00BCD4;
            --cat-heritage: #795548;
            --cat-social: #4CAF50;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            margin: 0; padding: 0;
            color: var(--ink);
            min-height: 100vh;
        }

        .hidden { display: none !important; }

        @keyframes slideUpFade { 
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .main-header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(to bottom, #FFFFFF, #FCFCFC);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-lockup { display: flex; align-items: center; gap: 16px; }

        .header-dots {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 32px; height: 32px;
        }

        .header-dots .dot {
            width: 100%; height: 100%;
            border-radius: 50%;
            background-color: var(--current-brand);
            animation: dotPulse 3s infinite ease-in-out;
        }

        .header-dots .dot:nth-child(1) { animation-delay: 0s; }
        .header-dots .dot:nth-child(2) { animation-delay: 0.75s; }
        .header-dots .dot:nth-child(3) { animation-delay: 1.5s; }
        .header-dots .dot:nth-child(4) { animation-delay: 2.25s; }

        .header-title { display: flex; flex-direction: column; gap: 2px; }
        .brand-name { font-size: 24px; font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; color: var(--current-brand); line-height: 1; }
        .calendar-subtitle { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: var(--ink-sub); }

        .header-controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

        .year-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-base);
            padding: 6px;
            border-radius: 99px;
            border: 1px solid var(--border);
        }

        .year-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 99px;
            color: var(--ink-sub);
            transition: var(--transition);
        }

        .year-btn:hover { background: #FFF; }
        .year-btn.active { background: var(--current-brand); color: #FFF; }

        .view-toggle {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            padding: 10px 16px;
            border: 2px solid var(--border);
            background: #FFF;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            border-radius: var(--radius-md);
            color: var(--ink-sub);
            transition: var(--transition);
        }

        .toggle-btn:hover { border-color: #CCC; }
        .toggle-btn.active { border-color: var(--current-brand); color: var(--current-brand); background: rgba(33, 160, 216, 0.05); }

        .header-stats { display: flex; gap: 20px; }
        .stat-block { text-align: center; }
        .stat-value { font-size: 24px; font-weight: 900; color: var(--current-brand); line-height: 1; }
        .stat-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-sub); margin-top: 4px; }

        .main-content { max-width: 1600px; margin: 0 auto; padding: 30px 40px; }

        .year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        @media (max-width: 1200px) { .year-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 900px) { .year-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { 
            .year-grid { grid-template-columns: 1fr; } 
            .main-content { padding: 20px; }
            .main-header { padding: 16px 20px; }
            .header-controls { width: 100%; justify-content: center; }
        }

        .month-card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            animation: slideUpFade 0.4s ease forwards;
            opacity: 0;
        }

        .month-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

        .month-header {
            padding: 14px 16px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .month-name { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--carbon); }
        .month-badges { display: flex; gap: 6px; }

        .month-badge {
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 99px;
        }

        .badge-ideas { background: var(--current-brand); color: #FFF; }
        .badge-cultural { background: var(--cat-popculture); color: #FFF; }
        .badge-empty { background: #E0E0E0; color: #999; }

        .days-header { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px 10px; border-bottom: 1px solid var(--border); }
        .day-label { font-size: 9px; font-weight: 700; text-transform: uppercase; text-align: center; color: var(--ink-sub); }

        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px; gap: 3px; }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--ink);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            gap: 2px;
        }

        .day-cell:hover { background: var(--bg-base); }
        .day-cell.empty { cursor: default; }
        .day-cell.empty:hover { background: transparent; }
        .day-cell.has-ideas { background: var(--current-brand); color: #FFF; font-weight: 800; }
        .day-cell.has-ideas:hover { filter: brightness(1.1); transform: scale(1.05); }
        .day-cell.has-cultural { border: 2px solid var(--cat-popculture); }
        .day-cell.has-ideas.has-cultural { border: 2px solid #FFF; box-shadow: 0 0 0 2px var(--cat-popculture); }
        .day-cell.weekend { color: var(--ink-sub); }

        .day-dots {
            display: flex;
            gap: 2px;
            position: absolute;
            bottom: 3px;
        }

        .day-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(28, 28, 28, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #FFF;
            width: 100%;
            max-width: 600px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-base);
        }

        .modal-date { font-size: 18px; font-weight: 900; color: var(--carbon); }
        .modal-weekday { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--current-brand); letter-spacing: 0.08em; margin-top: 2px; }

        .close-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #FFF;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: var(--ink-sub);
            transition: var(--transition);
        }

        .close-btn:hover { background: var(--bg-base); color: var(--carbon); transform: rotate(90deg); }

        .modal-body { padding: 20px 24px; flex: 1; overflow-y: auto; }

        .modal-section { margin-bottom: 24px; }
        .modal-section:last-child { margin-bottom: 0; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-sub);
        }

        .section-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .cultural-list { display: flex; flex-direction: column; gap: 8px; }

        .cultural-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            background: var(--bg-base);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--cat-popculture);
        }

        .cultural-item.cat-awareness { border-left-color: var(--cat-awareness); }
        .cultural-item.cat-anniversary { border-left-color: var(--cat-anniversary); }
        .cultural-item.cat-popculture { border-left-color: var(--cat-popculture); }
        .cultural-item.cat-entertainment { border-left-color: var(--cat-entertainment); }
        .cultural-item.cat-heritage { border-left-color: var(--cat-heritage); }
        .cultural-item.cat-social { border-left-color: var(--cat-social); }

        .cultural-content { flex: 1; }
        .cultural-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
        .cultural-meta { font-size: 10px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; }

        .ideas-list { display: flex; flex-direction: column; gap: 8px; }

        .idea-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            background: var(--bg-base);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        .idea-bullet { width: 8px; height: 8px; border-radius: 50%; background: var(--current-brand); flex-shrink: 0; margin-top: 4px; }
        .idea-text { flex: 1; font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; }

        .idea-delete {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #CCC;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .idea-delete:hover { background: #FFEBEE; color: #E53935; }

        .empty-state { text-align: center; padding: 30px 20px; color: var(--ink-sub); }
        .empty-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.5; }
        .empty-text { font-size: 12px; font-weight: 600; }

        .add-idea-form { display: flex; gap: 8px; margin-top: 12px; }

        .idea-input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .idea-input:focus { border-color: var(--current-brand); }
        .idea-input::placeholder { color: #BBB; }

        .add-btn {
            padding: 12px 20px;
            background: var(--current-brand);
            color: #FFF;
            border: none;
            border-radius: var(--radius-md);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-btn:hover { filter: brightness(1.1); }
        .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #loader {
            position: fixed;
            inset: 0;
            background: #FFF;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .loader-dots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 48px; height: 48px; }
        .loader-dots .dot { width: 100%; height: 100%; border-radius: 50%; background: var(--current-brand); animation: dotPulse 1.5s infinite ease-in-out; }

        .loader-text { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: var(--ink-sub); }

        #toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--carbon);
            color: #FFF;
            padding: 12px 24px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            z-index: 3000;
            transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-lg);
        }

        #toast.active { bottom: 30px; }

        .legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px 0;
            border-top: 1px solid var(--border);
            margin-top: 30px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="loader-text">Loading Calendar</div>
    </div>

    <div id="toast">Saved</div>

    <div id="app" class="hidden">
        <header class="main-header">
            <div class="header-inner">
                <div class="header-lockup">
                    <div class="header-dots">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>
                    <div class="header-title">
                        <div class="brand-name" id="brand-title">BRAND</div>
                        <div class="calendar-subtitle">Editorial Calendar</div>
                    </div>
                </div>
                
                <div class="header-controls">
                    <div class="year-nav">
                        <button class="year-btn active" data-year="2026">2026</button>
                        <button class="year-btn" data-year="2027">2027</button>
                        <button class="year-btn" data-year="2028">Jan 2028</button>
                    </div>
                    
                    <div class="view-toggle">
                        <button class="toggle-btn active" data-view="all">All</button>
                        <button class="toggle-btn" data-view="ideas">Ideas Only</button>
                        <button class="toggle-btn" data-view="cultural">Cultural</button>
                    </div>
                </div>

                <div class="header-stats">
                    <div class="stat-block">
                        <div class="stat-value" id="total-ideas">0</div>
                        <div class="stat-label">Ideas</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-value" id="total-cultural">0</div>
                        <div class="stat-label">Cultural</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="year-grid" id="year-grid"></div>
            
            <div class="legend">
                <div class="legend-item"><div class="legend-dot" style="background: var(--current-brand)"></div> Content Ideas</div>
                <div class="legend-item"><div class="legend-dot" style="background: var(--cat-awareness)"></div> Awareness Day</div>
                <div class="legend-item"><div class="legend-dot" style="background: var(--cat-anniversary)"></div> Anniversary</div>
                <div class="legend-item"><div class="legend-dot" style="background: var(--cat-popculture)"></div> Pop Culture</div>
                <div class="legend-item"><div class="legend-dot" style="background: var(--cat-entertainment)"></div> Entertainment</div>
                <div class="legend-item"><div class="legend-dot" style="background: var(--cat-heritage)"></div> Heritage</div>
                <div class="legend-item"><div class="legend-dot" style="background: var(--cat-social)"></div> Social Moment</div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div>
                    <div class="modal-date" id="modal-date">1 January 2026</div>
                    <div class="modal-weekday" id="modal-weekday">Thursday</div>
                </div>
                <div class="close-btn" onclick="closeModal()">×</div>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        var BRAND_COLOURS = {
            'MONEY': '#2E7D32',
            'UK': '#1565C0',
            'MAIN': '#E94B4B',
            'RESPAWN': '#7C4DFF',

        var CAT_COLOURS = {

        // Populate cultural data
        function populateCulturalData() {
            CULTURAL_SEED.forEach(function(event) {
                [2026, 2027, 2028].forEach(function(year) {
                    var dateKey = year + '-' + event.date;
                    if (!culturalData[dateKey]) {
                        culturalData[dateKey] = [];
                    }
                    culturalData[dateKey].push({
                        title: event.title,
                        category: event.category
                    });
                });
            });
        }

        // Get brand from URL
        (function() {
            currentBrand = 'MAIN';
            var colour = '#E94B4B';
            document.documentElement.style.setProperty('--current-brand', colour);
            populateCulturalData();
        })();

        function showApp() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('brand-title').textContent = currentBrand;
            renderYear();
        }

        function renderYear() {
            var grid = document.getElementById('year-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            var monthsToRender = currentYear === 2028 ? 1 : 12;
            
            for (var month = 0; month < monthsToRender; month++) {
                grid.innerHTML += generateMonthCard(currentYear, month);
            }
            
            var cells = grid.querySelectorAll('.day-cell:not(.empty)');
            for (var i = 0; i < cells.length; i++) {
                (function(cell) {
                    cell.addEventListener('click', function() {
                        openDateModal(cell.getAttribute('data-date'));
                    });
                })(cells[i]);
            }
            
            updateStats();
        }

        function generateMonthCard(year, monthIndex) {
            var firstDay = new Date(year, monthIndex, 1);
            var lastDay = new Date(year, monthIndex + 1, 0);
            var daysInMonth = lastDay.getDate();
            var startDayOfWeek = firstDay.getDay();
            var adjustedStartDay = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;

            var ideasInMonth = 0;
            var culturalInMonth = 0;
            var daysHTML = '';
            
            for (var i = 0; i < adjustedStartDay; i++) {
                daysHTML += '<div class="day-cell empty"></div>';
            }
            
            for (var day = 1; day <= daysInMonth; day++) {
                var m = (monthIndex + 1).toString();
                var d = day.toString();
                var dateKey = year + '-' + (m.length < 2 ? '0' + m : m) + '-' + (d.length < 2 ? '0' + d : d);
                
                var ideas = calendarData[dateKey] || [];
                var cultural = culturalData[dateKey] || [];
                
                var hasIdeas = ideas.length > 0;
                var hasCultural = cultural.length > 0;
                
                if (hasIdeas) ideasInMonth += ideas.length;
                if (hasCultural) culturalInMonth += cultural.length;
                
                var dayOfWeek = new Date(year, monthIndex, day).getDay();
                var isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                
                var show = true;
                if (currentView === 'ideas' && !hasIdeas) show = hasIdeas;
                if (currentView === 'cultural' && !hasCultural) show = hasCultural;
                
                var classes = 'day-cell';
                if (hasIdeas) classes += ' has-ideas';
                if (hasCultural && currentView !== 'ideas') classes += ' has-cultural';
                if (isWeekend && !hasIdeas) classes += ' weekend';
                
                var dotsHTML = '';
                if ((hasCultural && currentView !== 'ideas') || (hasIdeas && currentView !== 'cultural')) {
                    dotsHTML = '<div class="day-dots">';
                    if (hasCultural && currentView !== 'ideas') {
                        var cat = cultural[0].category;
                        dotsHTML += '<div class="day-dot" style="background:' + (CAT_COLOURS[cat] || CAT_COLOURS.popculture) + '"></div>';
                    }
                    dotsHTML += '</div>';
                }
                
                daysHTML += '<div class="' + classes + '" data-date="' + dateKey + '">' + day + dotsHTML + '</div>';
            }

            var badgesHTML = '';
            if (ideasInMonth > 0 && currentView !== 'cultural') {
                badgesHTML += '<span class="month-badge badge-ideas">' + ideasInMonth + '</span>';
            }
            if (culturalInMonth > 0 && currentView !== 'ideas') {
                badgesHTML += '<span class="month-badge badge-cultural">' + culturalInMonth + '</span>';
            }
            if (ideasInMonth === 0 && culturalInMonth === 0) {
                badgesHTML = '<span class="month-badge badge-empty">Empty</span>';
            }

            return '<div class="month-card" style="animation-delay: ' + (monthIndex * 0.04) + 's">' +
                '<div class="month-header">' +
                    '<div class="month-name">' + MONTH_NAMES[monthIndex] + ' ' + year + '</div>' +
                    '<div class="month-badges">' + badgesHTML + '</div>' +
                '</div>' +
                '<div class="days-header">' + DAY_LABELS.map(function(d) { return '<div class="day-label">' + d + '</div>'; }).join('') + '</div>' +
                '<div class="days-grid">' + daysHTML + '</div>' +
            '</div>';
        }

        function updateStats() {
            var totalIdeas = 0;
            var totalCultural = 0;
            
            for (var key in calendarData) {
                if (calendarData[key] && calendarData[key].length > 0) {
                    totalIdeas += calendarData[key].length;
                }
            }
            
            for (var key in culturalData) {
                if (culturalData[key] && culturalData[key].length > 0) {
                    totalCultural += culturalData[key].length;
                }
            }
            
            document.getElementById('total-ideas').textContent = totalIdeas;
            document.getElementById('total-cultural').textContent = totalCultural;
        }

        function openDateModal(dateKey) {
            selectedDate = dateKey;
            var parts = dateKey.split('-');
            var year = parseInt(parts[0]);
            var month = parseInt(parts[1]);
            var day = parseInt(parts[2]);
            var date = new Date(year, month - 1, day);
            
            document.getElementById('modal-date').textContent = day + ' ' + MONTH_NAMES[month - 1] + ' ' + year;
            document.getElementById('modal-weekday').textContent = DAY_NAMES[date.getDay()];
            
            renderModalBody();
            document.getElementById('modal').classList.add('active');
        }

        function renderModalBody() {
            var body = document.getElementById('modal-body');
            var ideas = calendarData[selectedDate] || [];
            var cultural = culturalData[selectedDate] || [];
            
            var html = '';
            
            // Cultural section
            if (cultural.length > 0 && currentView !== 'ideas') {
                html += '<div class="modal-section">';
                html += '<div class="section-header"><div class="section-icon" style="background: var(--cat-popculture); color: #FFF;">📅</div><div class="section-title">Cultural Moments</div></div>';
                html += '<div class="cultural-list">';
                for (var i = 0; i < cultural.length; i++) {
                    var c = cultural[i];
                    html += '<div class="cultural-item cat-' + c.category + '">';
                    html += '<div class="cultural-content">';
                    html += '<div class="cultural-title">' + escapeHtml(c.title) + '</div>';
                    html += '<div class="cultural-meta">' + c.category.replace('popculture', 'Pop Culture') + '</div>';
                    html += '</div></div>';
                }
                html += '</div></div>';
            }
            
            // Ideas section
            if (currentView !== 'cultural') {
                html += '<div class="modal-section">';
                html += '<div class="section-header"><div class="section-icon" style="background: var(--current-brand); color: #FFF;">💡</div><div class="section-title">Content Ideas</div></div>';
                
                if (ideas.length === 0) {
                    html += '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">No ideas yet</div></div>';
                } else {
                    html += '<div class="ideas-list">';
                    for (var j = 0; j < ideas.length; j++) {
                        html += '<div class="idea-item">';
                        html += '<div class="idea-bullet"></div>';
                        html += '<div class="idea-text">' + escapeHtml(ideas[j]) + '</div>';
                        html += '<button class="idea-delete" data-index="' + j + '">×</button>';
                        html += '</div>';
                    }
                    html += '</div>';
                }
                
                html += '<div class="add-idea-form">';
                html += '<input type="text" class="idea-input" id="idea-input" placeholder="Add a content idea..." maxlength="200">';
                html += '<button class="add-btn" id="add-btn" onclick="addIdea()">Add</button>';
                html += '</div></div>';
            }
            
            body.innerHTML = html;
            
            // Attach delete handlers
            var deleteBtns = body.querySelectorAll('.idea-delete');
            for (var k = 0; k < deleteBtns.length; k++) {
                (function(btn) {
                    btn.addEventListener('click', function() {
                        deleteIdea(parseInt(btn.getAttribute('data-index')));
                    });
                })(deleteBtns[k]);
            }
            
            // Attach enter key handler
            var input = document.getElementById('idea-input');
            if (input) {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') addIdea();
                });
                input.focus();
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            selectedDate = null;
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addIdea() {
            var input = document.getElementById('idea-input');
            if (!input) return;
            var text = input.value.trim();
            if (!text || !selectedDate) return;

            var btn = document.getElementById('add-btn');
            btn.disabled = true;
            btn.textContent = '...';

            if (!calendarData[selectedDate]) {
                calendarData[selectedDate] = [];
            }
            calendarData[selectedDate].push(text);
            
            if (firestoreConnected && typeof saveToFirestore === 'function') {
                saveToFirestore();
            }
            
            input.value = '';
            renderModalBody();
            renderYear();
            showToast('Idea added');

            btn.disabled = false;
            btn.textContent = 'Add';
        }

        function deleteIdea(index) {
            if (!selectedDate || !calendarData[selectedDate]) return;

            calendarData[selectedDate].splice(index, 1);
            if (calendarData[selectedDate].length === 0) {
                delete calendarData[selectedDate];
            }

            if (firestoreConnected && typeof saveToFirestore === 'function') {
                saveToFirestore();
            }
            
            renderModalBody();
            renderYear();
            showToast('Idea removed');
        }

        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('active');
            setTimeout(function() { toast.classList.remove('active'); }, 2500);
        }

        // Year navigation
        document.querySelectorAll('.year-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.year-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentYear = parseInt(btn.getAttribute('data-year'));
                renderYear();
            });
        });

        // View toggle
        document.querySelectorAll('.toggle-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.toggle-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentView = btn.getAttribute('data-view');
                renderYear();
            });
        });

        // Fallback timeout
        setTimeout(function() {
            if (document.getElementById('loader').style.display !== 'none') {
                showApp();
            }
        }, 2000);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const appId = "dmg-command-centre-native";

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            const auth = getAuth(app);

            window.saveToFirestore = async function() {
                if (!window.db) return;
                const docId = 'editorial_calendar_' + window.currentBrand;
                const docRef = doc(window.db, 'artifacts', appId, 'public', 'data', 'editorial_calendars', docId);
                await setDoc(docRef, {
                    brand: window.currentBrand,
                    data: window.calendarData,
                    lastUpdated: new Date().toISOString()
                });
            };

            signInAnonymously(auth).catch(function(e) {
                console.error('Auth error:', e);
            });

            onAuthStateChanged(auth, function(user) {
                if (user) {
                    const docId = 'editorial_calendar_' + window.currentBrand;
                    const docRef = doc(window.db, 'artifacts', appId, 'public', 'data', 'editorial_calendars', docId);
                    
                    onSnapshot(docRef, function(docSnap) {
                        window.firestoreConnected = true;
                        if (docSnap.exists()) {
                            window.calendarData = docSnap.data().data || {};
                        }
                        showApp();
                    }, function(error) {
                        console.error('Firestore error:', error);
                        showApp();
                    });
                }
            });
        } catch (e) {
            console.error('Firebase error:', e);
        }
    </script>
