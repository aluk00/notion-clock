<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Ledger | Quick Capture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <!--
    ═══════════════════════════════════════════════════════════════════════════════
    PROJECT LEDGER - Quick Intake Widget

    UPDATED: Using sliding page transitions instead of dark modal overlays
    Maintains embedded-in-Notion white background aesthetic

    Actions:
    - New Project (Sales quick capture)
    - Add Episode (to existing project)
    - Add Task (to existing episode)
    - Request Graphics

    API: https://createnotionproject-223535956454.us-central1.run.app
    ═══════════════════════════════════════════════════════════════════════════════
    -->

    <!-- Shared Components CSS -->
    <link rel="stylesheet" href="shared-components.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--surface);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            overflow: hidden;
        }

        /* Page Wrapper - enables sliding transitions */
        .page-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 520px;
            margin: 0 auto;
            overflow: hidden;
        }

        /* Main View */
        .main-view {
            position: absolute;
            inset: 0;
            background: var(--surface);
            transition: var(--slide-transition);
            overflow-y: auto;
            padding: 20px;
        }

        .main-view.slide-out {
            transform: translateX(-30%);
            opacity: 0.3;
            pointer-events: none;
        }

        /* Slide Page */
        .slide-page {
            position: absolute;
            inset: 0;
            background: var(--surface);
            transform: translateX(100%);
            transition: var(--slide-transition);
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .slide-page.active {
            transform: translateX(0);
        }

        .slide-page.closing {
            transform: translateX(100%);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .header-text {
            flex: 1;
        }

        .header-label {
            font-size: 13px;
            font-weight: 800;
            color: var(--dmg-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-subtitle {
            font-size: 10px;
            color: var(--ink-muted);
            margin-top: 3px;
            font-weight: 500;
        }

        /* Action Grid */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 24px 16px;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .action-btn.sales .action-icon { background: var(--sales-soft); }
        .action-btn.creative .action-icon { background: var(--creative-soft); }
        .action-btn.production .action-icon { background: var(--production-soft); }
        .action-btn.design .action-icon { background: var(--design-soft); }

        .action-btn:hover.sales { border-color: var(--sales); }
        .action-btn:hover.creative { border-color: var(--creative); }
        .action-btn:hover.production { border-color: var(--production); }
        .action-btn:hover.design { border-color: var(--design); }

        .action-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--ink);
            text-align: center;
        }

        .action-desc {
            font-size: 10px;
            color: var(--ink-muted);
            text-align: center;
            line-height: 1.4;
        }

        /* Combobox */
        .combobox-wrapper {
            position: relative;
        }

        .combobox-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1.5px solid var(--dmg-blue);
            border-top: none;
            border-radius: 0 0 var(--radius-xs) var(--radius-xs);
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .combobox-dropdown.show {
            display: block;
        }

        .combobox-item {
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .combobox-item:hover {
            background: var(--dmg-blue-soft);
            color: var(--dmg-blue);
        }

        .combobox-item.add-new {
            border-top: 1px solid var(--border);
            color: var(--dmg-blue);
            font-weight: 600;
        }

        .combobox-empty {
            padding: 12px;
            font-size: 11px;
            color: var(--ink-muted);
            text-align: center;
        }

        /* Success Content */
        .success-content {
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .success-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .success-message {
            font-size: 13px;
            color: var(--ink-sub);
            margin-bottom: 28px;
        }

        .success-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .success-btn {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .success-btn.primary {
            background: var(--dmg-blue);
            color: white;
        }

        .success-btn.primary:hover {
            background: #1a8ac0;
        }

        .success-btn.secondary {
            background: var(--surface);
            color: var(--ink-sub);
            border: 1px solid var(--border);
        }

        .success-btn.secondary:hover {
            border-color: var(--ink-muted);
            color: var(--ink);
        }

        /* Section divider in forms */
        .section-divider {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 20px 0 12px;
            padding-bottom: 6px;
            border-bottom: 1px dashed var(--border);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <!-- Main View -->
        <div class="main-view" id="mainView">
            <div class="loading-screen" id="loadingScreen">
                <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                <span class="loading-text">Loading...</span>
            </div>
            <div id="mainContent" style="display:none;">
                <div class="header">
                    <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                    <div class="header-text">
                        <div class="header-label">Project Ledger</div>
                        <div class="header-subtitle">Quick project intake</div>
                    </div>
                </div>

                <div class="action-grid">
                    <button class="action-btn sales" onclick="openNewProjectPage()">
                        <div class="action-icon">📋</div>
                        <div class="action-label">New Project</div>
                        <div class="action-desc">Log a new commercial deal</div>
                    </button>

                    <button class="action-btn creative" onclick="openAddEpisodePage()">
                        <div class="action-icon">🎬</div>
                        <div class="action-label">Add Episode</div>
                        <div class="action-desc">Add content to a project</div>
                    </button>

                    <button class="action-btn production" onclick="openAddTaskPage()">
                        <div class="action-icon">✅</div>
                        <div class="action-label">Add Task</div>
                        <div class="action-desc">Assign work to a team</div>
                    </button>

                    <button class="action-btn design" onclick="openRequestGraphicsPage()">
                        <div class="action-icon">🎨</div>
                        <div class="action-label">Request Graphics</div>
                        <div class="action-desc">Need a thumbnail or asset?</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Slide Page (for forms) -->
        <div class="slide-page" id="slidePage"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Shared Components JS -->
    <script src="shared-components.js"></script>

    <script>
        // ═══════════════════════════════════════════════════════════════════════════
        // CONFIGURATION
        // ═══════════════════════════════════════════════════════════════════════════
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
        const APP_ID = 'dmg-command-centre-native';

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        // Options
        const DEAL_STAGES = ['Brief Received', 'Pitch Sent', 'Deal Agreed', 'Campaign Complete', 'Closed Lost'];
        const PRIORITY_LEVELS = ['High', 'Medium', 'Low'];
        const FORMATS = ['Long-form Video', 'Short-form Video', 'Social Cut', 'BTS', 'Podcast', 'Article', 'Gallery'];
        const DISCIPLINES = ['Creative', 'Edit', 'Design', 'Producer', 'Social', 'Creator'];
        const ASSET_TYPES = ['Thumbnail', 'Social Card', 'Banner', 'Logo Treatment', 'Motion Graphics', 'Other'];

        // ═══════════════════════════════════════════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════════════════════════════════════════
        let projects = [];
        let episodes = [];
        let clients = [];
        let db = null;
        let storage = null;

        // ═══════════════════════════════════════════════════════════════════════════
        // INITIALIZE
        // ═══════════════════════════════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize Firebase
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                storage = firebase.storage();
                await firebase.auth().signInAnonymously();
            } catch (e) {
                console.warn('Firebase init error:', e);
            }

            // Initialize slide page manager
            initSlidePageManager({
                mainViewId: 'mainView',
                slidePageId: 'slidePage'
            });

            // Initialize document upload manager
            initDocumentUploadManager({
                storage: storage,
                db: db,
                appId: APP_ID,
                basePath: 'project-documents'
            });

            // Load data
            await loadData();
        });

        // ═══════════════════════════════════════════════════════════════════════════
        // DATA LOADING
        // ═══════════════════════════════════════════════════════════════════════════
        async function loadData() {
            try {
                const res = await fetch(`${API_URL}/projects`);
                const data = await res.json();
                projects = data?.projects || [];

                // Extract clients and episodes
                const clientSet = new Set();
                projects.forEach(p => {
                    if (p.client) clientSet.add(p.client);
                    if (p.episodes) episodes.push(...p.episodes.map(e => ({ ...e, projectTitle: p.title, projectId: p.id })));
                });
                clients = Array.from(clientSet).sort();

                // Show main content
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } catch (e) {
                console.error('Load failed:', e);
                document.getElementById('loadingScreen').innerHTML = `
                    <div style="text-align:center; color: var(--danger);">
                        <div style="font-size:13px; font-weight:600;">Failed to load</div>
                        <button class="btn btn-primary" style="margin-top:12px;" onclick="loadData()">Retry</button>
                    </div>
                `;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // SLIDE PAGE: NEW PROJECT
        // ═══════════════════════════════════════════════════════════════════════════
        function openNewProjectPage() {
            const content = `
                <div class="field">
                    <label class="field-label">Project Name <span class="required">*</span></label>
                    <input type="text" class="field-input" id="projName" placeholder="e.g. Sky Vegas Q1 Campaign">
                </div>
                <div class="field">
                    <label class="field-label">Client <span class="required">*</span></label>
                    <div class="combobox-wrapper">
                        <input type="text" class="field-input" id="projClient" placeholder="Search or add new..." autocomplete="off"
                            onfocus="showDropdown('clientDropdown')"
                            oninput="filterDropdown('clientDropdown', this.value, ${JSON.stringify(clients).replace(/"/g, '&quot;')})">
                        <div class="combobox-dropdown" id="clientDropdown"></div>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label class="field-label">Deal Value (£) <span class="required">*</span></label>
                        <input type="number" class="field-input" id="projValue" placeholder="25000">
                    </div>
                    <div class="field">
                        <label class="field-label">Deal Stage <span class="required">*</span></label>
                        <select class="field-select" id="projStage">
                            <option value="">Select...</option>
                            ${DEAL_STAGES.map(s => `<option value="${s}">${s}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label class="field-label">Project Budget (£)</label>
                        <input type="number" class="field-input" id="projBudget" placeholder="10000">
                    </div>
                    <div class="field">
                        <label class="field-label">Priority Level</label>
                        <select class="field-select" id="projPriority">
                            <option value="">Select...</option>
                            ${PRIORITY_LEVELS.map(p => `<option value="${p}">${p}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label class="field-label">(Internal) Due Date</label>
                        <input type="date" class="field-input" id="projInternalDue">
                    </div>
                    <div class="field">
                        <label class="field-label">(Client) Due Date</label>
                        <input type="date" class="field-input" id="projClientDue">
                    </div>
                </div>

                <div class="section-divider">Brief & Notes</div>

                <div class="field">
                    <label class="field-label">Brief</label>
                    <textarea class="field-textarea" id="projBrief" placeholder="Brief details, objectives, requirements..."></textarea>
                </div>
                <div class="field">
                    <label class="field-label">Notes</label>
                    <textarea class="field-textarea" id="projNotes" placeholder="Additional notes..."></textarea>
                </div>

                <div class="section-divider">Attachments</div>

                <div id="projectUploadZone"></div>
            `;

            slidePageManager.open(content, {
                title: 'New Project',
                subtitle: 'Log a new commercial deal',
                icon: '📋',
                iconClass: 'sales',
                primaryBtn: { text: 'Create Project', onclick: 'submitNewProject()' }
            });

            // Initialize upload zone after DOM is ready
            setTimeout(() => {
                const uploadZone = document.getElementById('projectUploadZone');
                if (uploadZone) {
                    uploadZone.innerHTML = documentUploadManager.createUploadZoneHTML('projUpload');
                    documentUploadManager.clearUploadedFiles();
                    documentUploadManager.initUploadZone('projUpload');
                }
                document.getElementById('projName').focus();
            }, 100);
        }

        async function submitNewProject() {
            const name = document.getElementById('projName').value.trim();
            const client = document.getElementById('projClient').value.trim();
            const value = document.getElementById('projValue').value;
            const stage = document.getElementById('projStage').value;

            if (!name || !client || !value || !stage) {
                showToast('Please fill required fields', 'error');
                return;
            }

            slidePageManager.setLoading(true);

            try {
                const res = await fetch(`${API_URL}/projects`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: name,
                        client: client,
                        dealValue: parseFloat(value),
                        dealStage: stage,
                        priorityLevel: document.getElementById('projPriority').value || null,
                        internalDueDate: document.getElementById('projInternalDue').value || null,
                        clientDueDate: document.getElementById('projClientDue').value || null,
                        brief: document.getElementById('projBrief').value || null,
                        notes: document.getElementById('projNotes').value || null,
                        projectBudget: document.getElementById('projBudget').value ? parseFloat(document.getElementById('projBudget').value) : null,
                        attachments: documentUploadManager.getUploadedFiles()
                    })
                });

                const data = await res.json();
                if (data.success || data.id) {
                    // Save attachments to Firestore if any
                    const attachments = documentUploadManager.getUploadedFiles();
                    if (attachments.length > 0 && db) {
                        await db.collection('artifacts').doc(APP_ID)
                            .collection('public').doc('data')
                            .collection('project_attachments').doc(data.id)
                            .set({ files: attachments, updatedAt: new Date().toISOString() });
                    }

                    showSuccessPage(data.id, name, data.url);
                    loadData(); // Refresh project list
                } else {
                    throw new Error(data.error || 'Failed');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                slidePageManager.setLoading(false);
            }
        }

        function showSuccessPage(projectId, projectName, notionUrl) {
            const projectUrl = `project-detail.html?id=${projectId}`;
            const projectNotionUrl = notionUrl || `https://notion.so/${projectId.replace(/-/g, '')}`;

            const content = `
                <div class="success-content">
                    <div class="success-icon">🎉</div>
                    <div class="success-title">Project Created!</div>
                    <div class="success-message">"${escapeHtml(projectName)}" has been added to the ledger.</div>
                    <div class="success-actions">
                        <a href="${projectUrl}" class="success-btn primary" target="_blank">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                            </svg>
                            View Project Page
                        </a>
                        <a href="${projectNotionUrl}" class="success-btn secondary" target="_blank">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                <polyline points="15 3 21 3 21 9"/>
                                <line x1="10" y1="14" x2="21" y2="3"/>
                            </svg>
                            Open in Notion
                        </a>
                        <button class="success-btn secondary" onclick="slidePageManager.close()">Done</button>
                    </div>
                </div>
            `;

            document.getElementById('slidePage').innerHTML = `
                <div class="slide-page-header">
                    <button class="back-btn" onclick="slidePageManager.close()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        Back
                    </button>
                </div>
                <div class="slide-page-body">${content}</div>
            `;
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // SLIDE PAGE: ADD EPISODE
        // ═══════════════════════════════════════════════════════════════════════════
        function openAddEpisodePage() {
            const content = `
                <div class="field">
                    <label class="field-label">Parent Project <span class="required">*</span></label>
                    <select class="field-select" id="epProject">
                        <option value="">Select project...</option>
                        ${projects.map(p => `<option value="${p.id}">${escapeHtml(p.title)} ${p.client ? `(${escapeHtml(p.client)})` : ''}</option>`).join('')}
                    </select>
                </div>
                <div class="field">
                    <label class="field-label">Episode Name <span class="required">*</span></label>
                    <input type="text" class="field-input" id="epName" placeholder="e.g. Episode 1 - Behind the Scenes">
                </div>
                <div class="field-row">
                    <div class="field">
                        <label class="field-label">Format</label>
                        <select class="field-select" id="epFormat">
                            <option value="">Select...</option>
                            ${FORMATS.map(f => `<option value="${f}">${f}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label class="field-label">Due Date</label>
                        <input type="date" class="field-input" id="epDue">
                    </div>
                </div>

                <div class="section-divider">Attachments</div>
                <div id="episodeUploadZone"></div>
            `;

            slidePageManager.open(content, {
                title: 'Add Episode',
                subtitle: 'To existing project',
                icon: '🎬',
                iconClass: 'creative',
                primaryBtn: { text: 'Add Episode', onclick: 'submitAddEpisode()' }
            });

            setTimeout(() => {
                const uploadZone = document.getElementById('episodeUploadZone');
                if (uploadZone) {
                    uploadZone.innerHTML = documentUploadManager.createUploadZoneHTML('epUpload');
                    documentUploadManager.clearUploadedFiles();
                    documentUploadManager.initUploadZone('epUpload');
                }
            }, 100);
        }

        async function submitAddEpisode() {
            const projectId = document.getElementById('epProject').value;
            const name = document.getElementById('epName').value.trim();

            if (!projectId || !name) {
                showToast('Please fill required fields', 'error');
                return;
            }

            slidePageManager.setLoading(true);

            try {
                const res = await fetch(`${API_URL}/projects/${projectId}/episodes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        format: document.getElementById('epFormat').value || null,
                        dueDate: document.getElementById('epDue').value || null,
                        attachments: documentUploadManager.getUploadedFiles()
                    })
                });

                const data = await res.json();
                if (data.success || data.id) {
                    showToast('Episode added!', 'success');
                    slidePageManager.close();
                    loadData();
                } else {
                    throw new Error(data.error || 'Failed');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                slidePageManager.setLoading(false);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // SLIDE PAGE: ADD TASK
        // ═══════════════════════════════════════════════════════════════════════════
        function openAddTaskPage() {
            const content = `
                <div class="field">
                    <label class="field-label">Parent Project <span class="required">*</span></label>
                    <select class="field-select" id="taskProject" onchange="updateEpisodeDropdown()">
                        <option value="">Select project...</option>
                        ${projects.map(p => `<option value="${p.id}">${escapeHtml(p.title)}</option>`).join('')}
                    </select>
                </div>
                <div class="field">
                    <label class="field-label">Episode (Optional)</label>
                    <select class="field-select" id="taskEpisode">
                        <option value="">Select episode...</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label">Task Name <span class="required">*</span></label>
                    <input type="text" class="field-input" id="taskName" placeholder="e.g. First cut review">
                </div>
                <div class="field-row">
                    <div class="field">
                        <label class="field-label">Discipline <span class="required">*</span></label>
                        <select class="field-select" id="taskDiscipline">
                            <option value="">Select...</option>
                            ${DISCIPLINES.map(d => `<option value="${d}">${d}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label class="field-label">Due Date</label>
                        <input type="date" class="field-input" id="taskDue">
                    </div>
                </div>
                <div class="field">
                    <label class="field-label">Assigned To</label>
                    <input type="text" class="field-input" id="taskAssigned" placeholder="Team member name">
                </div>
            `;

            slidePageManager.open(content, {
                title: 'Add Task',
                subtitle: 'Assign discipline task',
                icon: '✅',
                iconClass: 'production',
                primaryBtn: { text: 'Add Task', onclick: 'submitAddTask()' }
            });
        }

        function updateEpisodeDropdown() {
            const projectId = document.getElementById('taskProject').value;
            const episodeSelect = document.getElementById('taskEpisode');
            const projectEpisodes = episodes.filter(e => e.projectId === projectId);

            episodeSelect.innerHTML = '<option value="">Select episode...</option>' +
                projectEpisodes.map(e => `<option value="${e.id}">${escapeHtml(e.name || e.title)}</option>`).join('');
        }

        async function submitAddTask() {
            const projectId = document.getElementById('taskProject').value;
            const name = document.getElementById('taskName').value.trim();
            const discipline = document.getElementById('taskDiscipline').value;

            if (!projectId || !name || !discipline) {
                showToast('Please fill required fields', 'error');
                return;
            }

            slidePageManager.setLoading(true);

            try {
                const episodeId = document.getElementById('taskEpisode').value;
                const endpoint = episodeId
                    ? `${API_URL}/episodes/${episodeId}/tasks`
                    : `${API_URL}/projects/${projectId}/tasks`;

                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        discipline: discipline,
                        dueDate: document.getElementById('taskDue').value || null,
                        assignedTo: document.getElementById('taskAssigned').value || null
                    })
                });

                const data = await res.json();
                if (data.success || data.id) {
                    showToast('Task added!', 'success');
                    slidePageManager.close();
                    loadData();
                } else {
                    throw new Error(data.error || 'Failed');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                slidePageManager.setLoading(false);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // SLIDE PAGE: REQUEST GRAPHICS
        // ═══════════════════════════════════════════════════════════════════════════
        function openRequestGraphicsPage() {
            const content = `
                <div class="field">
                    <label class="field-label">Project <span class="required">*</span></label>
                    <select class="field-select" id="gfxProject">
                        <option value="">Select project...</option>
                        ${projects.map(p => `<option value="${p.id}">${escapeHtml(p.title)}</option>`).join('')}
                    </select>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label class="field-label">Asset Type <span class="required">*</span></label>
                        <select class="field-select" id="gfxType">
                            <option value="">Select...</option>
                            ${ASSET_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label class="field-label">Deadline <span class="required">*</span></label>
                        <input type="date" class="field-input" id="gfxDeadline">
                    </div>
                </div>
                <div class="field">
                    <label class="field-label">Brief Notes</label>
                    <textarea class="field-textarea" id="gfxNotes" placeholder="Describe what you need..."></textarea>
                </div>

                <div class="section-divider">Reference Files</div>
                <div id="gfxUploadZone"></div>
            `;

            slidePageManager.open(content, {
                title: 'Request Graphics',
                subtitle: 'Design asset request',
                icon: '🎨',
                iconClass: 'design',
                primaryBtn: { text: 'Submit Request', onclick: 'submitRequestGraphics()' }
            });

            setTimeout(() => {
                const uploadZone = document.getElementById('gfxUploadZone');
                if (uploadZone) {
                    uploadZone.innerHTML = documentUploadManager.createUploadZoneHTML('gfxUpload');
                    documentUploadManager.clearUploadedFiles();
                    documentUploadManager.initUploadZone('gfxUpload');
                }
            }, 100);
        }

        async function submitRequestGraphics() {
            const projectId = document.getElementById('gfxProject').value;
            const assetType = document.getElementById('gfxType').value;
            const deadline = document.getElementById('gfxDeadline').value;

            if (!projectId || !assetType || !deadline) {
                showToast('Please fill required fields', 'error');
                return;
            }

            slidePageManager.setLoading(true);

            try {
                const res = await fetch(`${API_URL}/design-requests`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        projectId: projectId,
                        assetType: assetType,
                        deadline: deadline,
                        notes: document.getElementById('gfxNotes').value || null,
                        referenceFiles: documentUploadManager.getUploadedFiles()
                    })
                });

                const data = await res.json();
                if (data.success || data.id) {
                    showToast('Request submitted!', 'success');
                    slidePageManager.close();
                } else {
                    throw new Error(data.error || 'Failed');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                slidePageManager.setLoading(false);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // DROPDOWN HELPERS
        // ═══════════════════════════════════════════════════════════════════════════
        function showDropdown(id) {
            const dropdown = document.getElementById(id);
            dropdown.classList.add('show');
        }

        function filterDropdown(id, query, items) {
            const dropdown = document.getElementById(id);
            const filtered = items.filter(item =>
                item.toLowerCase().includes(query.toLowerCase())
            );

            let html = filtered.map(item =>
                `<div class="combobox-item" onclick="selectDropdownItem('${id}', '${escapeHtml(item)}')">${escapeHtml(item)}</div>`
            ).join('');

            if (query && !items.some(i => i.toLowerCase() === query.toLowerCase())) {
                html += `<div class="combobox-item add-new" onclick="selectDropdownItem('${id}', '${escapeHtml(query)}')">+ Add "${escapeHtml(query)}"</div>`;
            }

            if (!html) {
                html = '<div class="combobox-empty">No matches</div>';
            }

            dropdown.innerHTML = html;
            dropdown.classList.add('show');
        }

        function selectDropdownItem(dropdownId, value) {
            const dropdown = document.getElementById(dropdownId);
            const input = dropdown.previousElementSibling;
            input.value = value;
            dropdown.classList.remove('show');
        }

        // Close dropdowns on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.combobox-wrapper')) {
                document.querySelectorAll('.combobox-dropdown').forEach(d => d.classList.remove('show'));
            }
        });

        // Close slide page on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && slidePageManager && slidePageManager.isOpen) {
                slidePageManager.close();
            }
        });
    </script>
</body>
</html>
