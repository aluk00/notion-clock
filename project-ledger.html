<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Ledger | Quick Capture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!--
    ═══════════════════════════════════════════════════════════════════════════════
    PROJECT LEDGER - Quick Intake Widget
    Input only · 60 seconds or less

    Actions:
    - New Project (Sales quick capture)
    - Add Episode (to existing project)
    - Add Task (to existing episode)
    - Request Graphics

    API: https://createnotionproject-223535956454.us-central1.run.app
    ═══════════════════════════════════════════════════════════════════════════════
    -->
    <style>
        :root {
            /* Core Colors */
            --ink: #0F172A;
            --ink-sub: #64748B;
            --ink-muted: #94A3B8;
            --border: #E2E8F0;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;

            /* Brand */
            --dmg-blue: #21A0D8;
            --dmg-blue-soft: rgba(33, 160, 216, 0.1);
            --dmg-blue-glow: rgba(33, 160, 216, 0.15);

            /* Action Colors */
            --sales: #21A0D8;
            --sales-soft: rgba(33, 160, 216, 0.1);
            --creative: #E6468B;
            --creative-soft: rgba(230, 70, 139, 0.1);
            --production: #43B049;
            --production-soft: rgba(67, 176, 73, 0.1);
            --design: #9333EA;
            --design-soft: rgba(147, 51, 234, 0.1);

            /* Layout */
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--surface);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        /* Container */
        .container {
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }

        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }

        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .header-text {
            flex: 1;
        }

        .header-label {
            font-size: 13px;
            font-weight: 800;
            color: var(--dmg-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-subtitle {
            font-size: 10px;
            color: var(--ink-muted);
            margin-top: 3px;
            font-weight: 500;
        }

        /* Action Grid */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 24px 16px;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .action-btn.sales .action-icon { background: var(--sales-soft); }
        .action-btn.creative .action-icon { background: var(--creative-soft); }
        .action-btn.production .action-icon { background: var(--production-soft); }
        .action-btn.design .action-icon { background: var(--design-soft); }

        .action-btn:hover.sales { border-color: var(--sales); }
        .action-btn:hover.creative { border-color: var(--creative); }
        .action-btn:hover.production { border-color: var(--production); }
        .action-btn:hover.design { border-color: var(--design); }

        .action-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--ink);
            text-align: center;
        }

        .action-desc {
            font-size: 10px;
            color: var(--ink-muted);
            text-align: center;
            line-height: 1.4;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-alt);
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .modal-icon.sales { background: var(--sales-soft); }
        .modal-icon.creative { background: var(--creative-soft); }
        .modal-icon.production { background: var(--production-soft); }
        .modal-icon.design { background: var(--design-soft); }

        .modal-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
        }

        .modal-subtitle {
            font-size: 10px;
            color: var(--ink-muted);
            font-weight: 500;
        }

        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--ink-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--border);
            color: var(--ink);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            background: var(--surface-alt);
        }

        /* Form Fields */
        .field {
            margin-bottom: 14px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .field-row .field {
            margin-bottom: 0;
        }

        .field-label {
            display: block;
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }

        .field-label .required {
            color: #E94B4B;
        }

        .field-input, .field-select, .field-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            background: var(--surface);
            color: var(--ink);
            outline: none;
            transition: var(--transition);
        }

        .field-input:focus, .field-select:focus, .field-textarea:focus {
            border-color: var(--dmg-blue);
            box-shadow: 0 0 0 3px var(--dmg-blue-glow);
        }

        .field-input::placeholder, .field-textarea::placeholder {
            color: var(--ink-muted);
        }

        .field-textarea {
            min-height: 80px;
            resize: vertical;
        }

        /* Combobox */
        .combobox-wrapper {
            position: relative;
        }

        .combobox-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1.5px solid var(--dmg-blue);
            border-top: none;
            border-radius: 0 0 var(--radius-xs) var(--radius-xs);
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .combobox-dropdown.show {
            display: block;
        }

        .combobox-item {
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .combobox-item:hover {
            background: var(--dmg-blue-soft);
            color: var(--dmg-blue);
        }

        .combobox-item.add-new {
            border-top: 1px solid var(--border);
            color: var(--dmg-blue);
            font-weight: 600;
        }

        .combobox-empty {
            padding: 12px;
            font-size: 11px;
            color: var(--ink-muted);
            text-align: center;
        }

        /* Buttons */
        .btn {
            padding: 10px 16px;
            border-radius: var(--radius-xs);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--dmg-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #1a8ac0;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--ink-sub);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--ink-muted);
            color: var(--ink);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: var(--production); }
        .toast.error { background: #E94B4B; }

        /* Loading */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 12px;
        }

        .loading-text {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading-screen">
            <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading...</span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════════
        // CONFIGURATION
        // ═══════════════════════════════════════════════════════════════════════════
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

        // Options
        const DEAL_STAGES = ['Brief Received', 'Pitch Sent', 'Deal Agreed', 'Campaign Complete', 'Closed Lost'];
        const VERTICALS = ['Spotlight', 'Trailblazers', 'Hub', 'Social-First', 'Custom'];
        const PROJECT_TYPES = ['Commercial', 'Editorial', 'Social', 'Internal'];
        const FORMATS = ['Long-form Video', 'Short-form Video', 'Social Cut', 'BTS', 'Podcast', 'Article', 'Gallery'];
        const DISCIPLINES = ['Creative', 'Edit', 'Design', 'Producer', 'Social', 'Creator'];
        const ASSET_TYPES = ['Thumbnail', 'Social Card', 'Banner', 'Logo Treatment', 'Motion Graphics', 'Other'];

        // ═══════════════════════════════════════════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════════════════════════════════════════
        let projects = [];
        let episodes = [];
        let clients = [];

        // ═══════════════════════════════════════════════════════════════════════════
        // HELPERS
        // ═══════════════════════════════════════════════════════════════════════════
        const escapeHtml = (text) => {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        };

        const showToast = (message, type = '') => {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        const closeModal = () => {
            document.getElementById('modalOverlay').classList.remove('open');
        };

        // ═══════════════════════════════════════════════════════════════════════════
        // DATA LOADING
        // ═══════════════════════════════════════════════════════════════════════════
        async function loadData() {
            try {
                const res = await fetch(`${API_URL}/projects`);
                const data = await res.json();
                projects = data?.projects || [];

                // Extract clients and episodes
                const clientSet = new Set();
                projects.forEach(p => {
                    if (p.client) clientSet.add(p.client);
                    if (p.episodes) episodes.push(...p.episodes.map(e => ({ ...e, projectTitle: p.title, projectId: p.id })));
                });
                clients = Array.from(clientSet).sort();

                render();
            } catch (e) {
                console.error('Load failed:', e);
                render();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // MAIN RENDER
        // ═══════════════════════════════════════════════════════════════════════════
        function render() {
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                    <div class="header-text">
                        <div class="header-label">Project Ledger</div>
                        <div class="header-subtitle">Quick capture · 60 seconds or less</div>
                    </div>
                </div>

                <div class="action-grid">
                    <button class="action-btn sales" onclick="openNewProjectModal()">
                        <div class="action-icon">📋</div>
                        <div class="action-label">New Project</div>
                        <div class="action-desc">Log a new commercial deal</div>
                    </button>

                    <button class="action-btn creative" onclick="openAddEpisodeModal()">
                        <div class="action-icon">🎬</div>
                        <div class="action-label">Add Episode</div>
                        <div class="action-desc">Add content to a project</div>
                    </button>

                    <button class="action-btn production" onclick="openAddTaskModal()">
                        <div class="action-icon">✅</div>
                        <div class="action-label">Add Task</div>
                        <div class="action-desc">Assign work to a team</div>
                    </button>

                    <button class="action-btn design" onclick="openRequestGraphicsModal()">
                        <div class="action-icon">🎨</div>
                        <div class="action-label">Request Graphics</div>
                        <div class="action-desc">Need a thumbnail or asset?</div>
                    </button>
                </div>
            `;
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // MODAL 1: NEW PROJECT (Sales Quick Capture)
        // ═══════════════════════════════════════════════════════════════════════════
        function openNewProjectModal() {
            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <div class="modal-header">
                    <div class="modal-title-group">
                        <div class="modal-icon sales">📋</div>
                        <div>
                            <div class="modal-title">New Project</div>
                            <div class="modal-subtitle">Sales quick capture</div>
                        </div>
                    </div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label class="field-label">Project Name <span class="required">*</span></label>
                        <input type="text" class="field-input" id="projName" placeholder="e.g. Sky Vegas Q1 Campaign">
                    </div>
                    <div class="field">
                        <label class="field-label">Client <span class="required">*</span></label>
                        <div class="combobox-wrapper">
                            <input type="text" class="field-input" id="projClient" placeholder="Search or add new..." autocomplete="off" onfocus="showDropdown('clientDropdown')" oninput="filterDropdown('clientDropdown', this.value, ${JSON.stringify(clients).replace(/"/g, '&quot;')})">
                            <div class="combobox-dropdown" id="clientDropdown"></div>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label class="field-label">Deal Value (£) <span class="required">*</span></label>
                            <input type="number" class="field-input" id="projValue" placeholder="25000">
                        </div>
                        <div class="field">
                            <label class="field-label">Deal Stage <span class="required">*</span></label>
                            <select class="field-select" id="projStage">
                                <option value="">Select...</option>
                                ${DEAL_STAGES.map(s => `<option value="${s}">${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label class="field-label">Vertical</label>
                            <select class="field-select" id="projVertical">
                                <option value="">Select...</option>
                                ${VERTICALS.map(v => `<option value="${v}">${v}</option>`).join('')}
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label">Project Type</label>
                            <select class="field-select" id="projType">
                                <option value="">Select...</option>
                                ${PROJECT_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" id="submitBtn" onclick="submitNewProject()">Create Project</button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('projName').focus();
        }

        async function submitNewProject() {
            const name = document.getElementById('projName').value.trim();
            const client = document.getElementById('projClient').value.trim();
            const value = document.getElementById('projValue').value;
            const stage = document.getElementById('projStage').value;

            if (!name || !client || !value || !stage) {
                showToast('Please fill required fields', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            try {
                const res = await fetch(`${API_URL}/projects`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: name,
                        client: client,
                        dealValue: parseFloat(value),
                        dealStage: stage,
                        vertical: document.getElementById('projVertical').value || null,
                        projectType: document.getElementById('projType').value || null
                    })
                });
                const data = await res.json();
                if (data.success || data.id) {
                    showToast('Project created!', 'success');
                    closeModal();
                    loadData();
                } else {
                    throw new Error(data.error || 'Failed');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Create Project';
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // MODAL 2: ADD EPISODE
        // ═══════════════════════════════════════════════════════════════════════════
        function openAddEpisodeModal() {
            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <div class="modal-header">
                    <div class="modal-title-group">
                        <div class="modal-icon creative">🎬</div>
                        <div>
                            <div class="modal-title">Add Episode</div>
                            <div class="modal-subtitle">To existing project</div>
                        </div>
                    </div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label class="field-label">Parent Project <span class="required">*</span></label>
                        <select class="field-select" id="epProject">
                            <option value="">Select project...</option>
                            ${projects.map(p => `<option value="${p.id}">${escapeHtml(p.title)} ${p.client ? `(${escapeHtml(p.client)})` : ''}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label class="field-label">Episode Name <span class="required">*</span></label>
                        <input type="text" class="field-input" id="epName" placeholder="e.g. Episode 1 - Behind the Scenes">
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label class="field-label">Format</label>
                            <select class="field-select" id="epFormat">
                                <option value="">Select...</option>
                                ${FORMATS.map(f => `<option value="${f}">${f}</option>`).join('')}
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label">Due Date</label>
                            <input type="date" class="field-input" id="epDue">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" id="submitBtn" onclick="submitAddEpisode()">Add Episode</button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('open');
        }

        async function submitAddEpisode() {
            const projectId = document.getElementById('epProject').value;
            const name = document.getElementById('epName').value.trim();

            if (!projectId || !name) {
                showToast('Please fill required fields', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Adding...';

            try {
                const res = await fetch(`${API_URL}/projects/${projectId}/episodes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        format: document.getElementById('epFormat').value || null,
                        dueDate: document.getElementById('epDue').value || null
                    })
                });
                const data = await res.json();
                if (data.success || data.id) {
                    showToast('Episode added!', 'success');
                    closeModal();
                    loadData();
                } else {
                    throw new Error(data.error || 'Failed');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Add Episode';
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // MODAL 3: ADD TASK
        // ═══════════════════════════════════════════════════════════════════════════
        function openAddTaskModal() {
            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <div class="modal-header">
                    <div class="modal-title-group">
                        <div class="modal-icon production">✅</div>
                        <div>
                            <div class="modal-title">Add Task</div>
                            <div class="modal-subtitle">Assign discipline task</div>
                        </div>
                    </div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label class="field-label">Parent Project <span class="required">*</span></label>
                        <select class="field-select" id="taskProject" onchange="updateEpisodeDropdown()">
                            <option value="">Select project...</option>
                            ${projects.map(p => `<option value="${p.id}">${escapeHtml(p.title)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label class="field-label">Episode (Optional)</label>
                        <select class="field-select" id="taskEpisode">
                            <option value="">Select episode...</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="field-label">Task Name <span class="required">*</span></label>
                        <input type="text" class="field-input" id="taskName" placeholder="e.g. First cut review">
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label class="field-label">Discipline <span class="required">*</span></label>
                            <select class="field-select" id="taskDiscipline">
                                <option value="">Select...</option>
                                ${DISCIPLINES.map(d => `<option value="${d}">${d}</option>`).join('')}
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label">Due Date</label>
                            <input type="date" class="field-input" id="taskDue">
                        </div>
                    </div>
                    <div class="field">
                        <label class="field-label">Assigned To</label>
                        <input type="text" class="field-input" id="taskAssigned" placeholder="Team member name">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" id="submitBtn" onclick="submitAddTask()">Add Task</button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function updateEpisodeDropdown() {
            const projectId = document.getElementById('taskProject').value;
            const episodeSelect = document.getElementById('taskEpisode');
            const projectEpisodes = episodes.filter(e => e.projectId === projectId);

            episodeSelect.innerHTML = '<option value="">Select episode...</option>' +
                projectEpisodes.map(e => `<option value="${e.id}">${escapeHtml(e.name || e.title)}</option>`).join('');
        }

        async function submitAddTask() {
            const projectId = document.getElementById('taskProject').value;
            const name = document.getElementById('taskName').value.trim();
            const discipline = document.getElementById('taskDiscipline').value;

            if (!projectId || !name || !discipline) {
                showToast('Please fill required fields', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Adding...';

            try {
                const episodeId = document.getElementById('taskEpisode').value;
                const endpoint = episodeId
                    ? `${API_URL}/episodes/${episodeId}/tasks`
                    : `${API_URL}/projects/${projectId}/tasks`;

                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        discipline: discipline,
                        dueDate: document.getElementById('taskDue').value || null,
                        assignedTo: document.getElementById('taskAssigned').value || null
                    })
                });
                const data = await res.json();
                if (data.success || data.id) {
                    showToast('Task added!', 'success');
                    closeModal();
                    loadData();
                } else {
                    throw new Error(data.error || 'Failed');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Add Task';
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // MODAL 4: REQUEST GRAPHICS
        // ═══════════════════════════════════════════════════════════════════════════
        function openRequestGraphicsModal() {
            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <div class="modal-header">
                    <div class="modal-title-group">
                        <div class="modal-icon design">🎨</div>
                        <div>
                            <div class="modal-title">Request Graphics</div>
                            <div class="modal-subtitle">Design asset request</div>
                        </div>
                    </div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label class="field-label">Project <span class="required">*</span></label>
                        <select class="field-select" id="gfxProject">
                            <option value="">Select project...</option>
                            ${projects.map(p => `<option value="${p.id}">${escapeHtml(p.title)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label class="field-label">Asset Type <span class="required">*</span></label>
                            <select class="field-select" id="gfxType">
                                <option value="">Select...</option>
                                ${ASSET_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label">Deadline <span class="required">*</span></label>
                            <input type="date" class="field-input" id="gfxDeadline">
                        </div>
                    </div>
                    <div class="field">
                        <label class="field-label">Brief Notes</label>
                        <textarea class="field-textarea" id="gfxNotes" placeholder="Describe what you need..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" id="submitBtn" onclick="submitRequestGraphics()">Submit Request</button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('open');
        }

        async function submitRequestGraphics() {
            const projectId = document.getElementById('gfxProject').value;
            const assetType = document.getElementById('gfxType').value;
            const deadline = document.getElementById('gfxDeadline').value;

            if (!projectId || !assetType || !deadline) {
                showToast('Please fill required fields', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            try {
                const res = await fetch(`${API_URL}/design-requests`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        projectId: projectId,
                        assetType: assetType,
                        deadline: deadline,
                        notes: document.getElementById('gfxNotes').value || null
                    })
                });
                const data = await res.json();
                if (data.success || data.id) {
                    showToast('Request submitted!', 'success');
                    closeModal();
                } else {
                    throw new Error(data.error || 'Failed');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Submit Request';
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // DROPDOWN HELPERS
        // ═══════════════════════════════════════════════════════════════════════════
        function showDropdown(id) {
            const dropdown = document.getElementById(id);
            dropdown.classList.add('show');
        }

        function filterDropdown(id, query, items) {
            const dropdown = document.getElementById(id);
            const filtered = items.filter(item =>
                item.toLowerCase().includes(query.toLowerCase())
            );

            let html = filtered.map(item =>
                `<div class="combobox-item" onclick="selectDropdownItem('${id}', '${escapeHtml(item)}')">${escapeHtml(item)}</div>`
            ).join('');

            if (query && !items.some(i => i.toLowerCase() === query.toLowerCase())) {
                html += `<div class="combobox-item add-new" onclick="selectDropdownItem('${id}', '${escapeHtml(query)}')">+ Add "${escapeHtml(query)}"</div>`;
            }

            if (!html) {
                html = '<div class="combobox-empty">No matches</div>';
            }

            dropdown.innerHTML = html;
            dropdown.classList.add('show');
        }

        function selectDropdownItem(dropdownId, value) {
            const dropdown = document.getElementById(dropdownId);
            const input = dropdown.previousElementSibling;
            input.value = value;
            dropdown.classList.remove('show');
        }

        // Close dropdowns on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.combobox-wrapper')) {
                document.querySelectorAll('.combobox-dropdown').forEach(d => d.classList.remove('show'));
            }
        });

        // ═══════════════════════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
