<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intake Hub | DMG Command Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!--
    ═══════════════════════════════════════════════════════════════════════════════
    DMG COMMAND CENTRE - INTAKE HUB
    Last Updated: 17 January 2026

    PATHS:
    1. Log a New Brief (Sales) → Cloud Run API → Notion Master Ledger
    2. Request Design Work → Firebase design_requests → Designer Capacity
    3. Request Video Edit → Firebase edit_queue → Editor Capacity
    4. Add Deliverable → Cloud Run API → Notion Master Ledger (sub-item)

    API: https://createnotionproject-223535956454.us-central1.run.app
    ═══════════════════════════════════════════════════════════════════════════════
    -->
    <style>
        :root {
            --ink: #0F172A;
            --ink-sub: #64748B;
            --ink-muted: #94A3B8;
            --border: #E2E8F0;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;
            --dmg-blue: #21A0D8;
            --dmg-blue-soft: #F0F9FF;
            --dmg-blue-glow: rgba(33, 160, 216, 0.15);
            --production: #43B049;
            --production-soft: rgba(67, 176, 73, 0.1);
            --creative: #E6468B;
            --creative-soft: rgba(230, 70, 139, 0.1);
            --editorial: #E94B4B;
            --editorial-soft: rgba(233, 75, 75, 0.1);
            --available: #10B981;
            --busy: #F59E0B;
            --full: #EF4444;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            color: var(--ink);
            min-height: 100vh;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 580px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .dots { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--dmg-blue); }
        .dots span:nth-child(1) { animation: pulse 2s ease-in-out infinite; }
        .dots span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dots span:nth-child(3) { animation: pulse 2s ease-in-out 0.6s infinite; }
        .dots span:nth-child(4) { animation: pulse 2s ease-in-out 0.9s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .header-title { font-size: 11px; font-weight: 800; color: var(--dmg-blue); text-transform: uppercase; letter-spacing: 0.05em; flex: 1; }
        .reset-btn { font-size: 10px; font-weight: 700; color: var(--ink-sub); background: var(--surface); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: var(--transition); }
        .reset-btn:hover { border-color: var(--ink-sub); color: var(--ink); }

        /* Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: visible; animation: slideIn 0.3s ease-out; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surface-alt); border-radius: var(--radius) var(--radius) 0 0; }
        .card-step { font-size: 10px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
        .card-title { font-size: 18px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
        .card-desc { font-size: 12px; color: var(--ink-sub); margin-top: 4px; line-height: 1.5; }
        .card-body { padding: 20px; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } }

        /* Intake Options */
        .intake-grid { display: grid; gap: 10px; }
        .intake-option { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: var(--transition); background: var(--surface); }
        .intake-option:hover { border-color: var(--ink-muted); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.05); }
        .intake-option.selected { border-color: var(--dmg-blue); background: var(--dmg-blue-soft); }
        .intake-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--surface-alt); flex-shrink: 0; }
        .intake-content { flex: 1; }
        .intake-label { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
        .intake-desc { font-size: 10px; color: var(--ink-sub); line-height: 1.4; }
        .intake-arrow { color: var(--ink-muted); transition: var(--transition); }
        .intake-option:hover .intake-arrow { color: var(--dmg-blue); transform: translateX(3px); }

        /* Form Fields */
        .field { margin-bottom: 16px; }
        .field-label { font-size: 10px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .field-label .required { color: var(--editorial); }
        .field-label .optional { font-weight: 500; color: var(--ink-muted); text-transform: none; }
        .field-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; font-family: inherit; background: var(--surface); color: var(--ink); outline: none; transition: var(--transition); }
        .field-input:focus { border-color: var(--dmg-blue); box-shadow: 0 0 0 3px var(--dmg-blue-glow); }
        .field-input::placeholder { color: var(--ink-muted); }
        textarea.field-input { min-height: 70px; resize: vertical; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; overflow: visible; }
        .field-hint { font-size: 10px; color: var(--ink-muted); margin-top: 6px; }

        /* Custom Select */
        .custom-select { position: relative; z-index: 10; }
        .custom-select:focus-within { z-index: 100; }
        .select-trigger { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; background: var(--surface); color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
        .select-trigger:hover { border-color: var(--dmg-blue); }
        .select-trigger .placeholder { color: var(--ink-muted); font-weight: 500; }
        .select-trigger.open { border-color: var(--dmg-blue); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
        .select-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1.5px solid var(--dmg-blue); border-top: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); max-height: 200px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .select-dropdown.show { display: block; animation: dropIn 0.15s ease-out; }
        @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } }
        .dropdown-item { padding: 10px 14px; font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); }
        .dropdown-item:hover { background: var(--dmg-blue-soft); color: var(--dmg-blue); }
        .dropdown-search { padding: 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
        .dropdown-search input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; outline: none; }
        .dropdown-search input:focus { border-color: var(--dmg-blue); }

        /* Pills */
        .pills { display: flex; flex-wrap: wrap; gap: 8px; }
        .pill { padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; transition: var(--transition); background: var(--surface); color: var(--ink-sub); }
        .pill:hover { border-color: var(--ink-muted); }
        .pill.selected { border-color: var(--dmg-blue); background: var(--dmg-blue-soft); color: var(--dmg-blue); }

        /* Capacity Preview */
        .capacity-preview { background: var(--surface-alt); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 16px; }
        .capacity-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .capacity-title { font-size: 10px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; }
        .capacity-legend { display: flex; gap: 10px; }
        .capacity-dot { display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 600; color: var(--ink-sub); }
        .capacity-dot span { width: 6px; height: 6px; border-radius: 50%; }
        .capacity-dot.available span { background: var(--available); }
        .capacity-dot.busy span { background: var(--busy); }
        .capacity-dot.full span { background: var(--full); }
        .capacity-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .capacity-member { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface); border-radius: 6px; border: 1px solid var(--border); }
        .capacity-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: white; }
        .capacity-name { font-size: 11px; font-weight: 600; color: var(--ink); }
        .capacity-status { width: 6px; height: 6px; border-radius: 50%; }

        /* Effort Box */
        .effort-box { background: var(--surface-alt); border-radius: var(--radius-sm); padding: 12px; margin-top: 16px; border-left: 3px solid var(--production); }
        .effort-title { font-size: 10px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; margin-bottom: 4px; }
        .effort-value { font-size: 20px; font-weight: 800; color: var(--production); }
        .effort-value span { font-size: 11px; font-weight: 600; color: var(--ink-sub); }

        /* Buttons */
        .btn-row { display: flex; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
        .btn { padding: 12px 20px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; cursor: pointer; border: none; transition: var(--transition); flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-back { background: var(--surface); color: var(--ink-sub); border: 1.5px solid var(--border); flex: 0 0 auto; padding: 12px 16px; }
        .btn-back:hover { border-color: var(--ink-sub); color: var(--ink); }
        .btn-primary { background: var(--dmg-blue); color: white; }
        .btn-primary:hover { background: #1a8ac0; }
        .btn-primary:disabled { background: #CBD5E1; cursor: not-allowed; }
        .btn-submit { background: var(--production); color: white; }
        .btn-submit:hover { background: #38a042; }
        .btn-submit:disabled { background: #CBD5E1; cursor: not-allowed; }

        /* Summary */
        .summary-box { background: var(--surface-alt); border-radius: var(--radius-sm); padding: 12px; margin-top: 16px; }
        .summary-title { font-size: 10px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; margin-bottom: 8px; }
        .summary-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
        .summary-row:last-child { border-bottom: none; }
        .summary-label { color: var(--ink-sub); }
        .summary-value { font-weight: 600; color: var(--ink); }

        /* Success */
        .success-screen { text-align: center; padding: 40px 24px; }
        .success-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--production); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: white; font-size: 24px; }
        .success-title { font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
        .success-desc { font-size: 12px; color: var(--ink-sub); margin-bottom: 20px; }

        /* Toast */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: white; padding: 12px 24px; border-radius: 50px; font-size: 12px; font-weight: 600; z-index: 2000; transition: transform 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--full); }
        .toast.success { background: var(--production); }

        /* Loading */
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; gap: 12px; }
        .loading-text { font-size: 11px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.08em; }

        .hidden { display: none !important; }
        @media (max-width: 500px) { .field-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <span class="header-title">Intake Hub</span>
        <button class="reset-btn" id="resetBtn">Start Over</button>
    </div>
    <div id="content">
        <div class="loading">
            <div class="dots"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading...</span>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ═══════════════════════════════════════════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════════════════════════════════════════
    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
    const APP_ID = 'dmg-command-centre-native';

    const TEAM_COLORS = { 'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049', 'Social': '#F59E0B', 'Sales': '#21A0D8', 'Design': '#E6468B' };

    // Effort points from Ecosystem Recap
    const EFFORT = {
        design: { 'Thumbnail': 3, 'Graphics Package': 8, 'Motion Graphics': 8, 'Social Asset': 2, 'Pitch Deck': 10 },
        edit: { 'Quick Cut': 3, 'Standard Edit': 6, 'Complex Edit': 12, 'Breaking/Reactive': 4 },
        modifiers: { 'Motion Graphics': 3, 'Stock Footage': 1.5, 'Voiceover': 1, 'Multi-Platform': 1.5, 'Rush': 3 }
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════════
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let staff = [], designers = [], editors = [], salesTeam = [];
    let projects = [], clients = [];
    let designRequests = [], editQueue = [];

    let currentStep = 'select';
    let intakeType = null;
    let form = {
        // Brief
        client: '', isNewClient: false, title: '', projectType: 'Campaign',
        dealValue: '', dueDate: '', responseFormat: 'Deck',
        channels: [], deliverableCount: '', notes: '', salesLead: null,
        // Design/Edit
        assetType: '', videoComplexity: '', editModifiers: [], brief: '', deadline: '',
        assignedTo: null, linkedProject: null,
        // Deliverable
        deliverableType: '', deliverableTitle: ''
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // DATA
    // ═══════════════════════════════════════════════════════════════════════════
    async function fetchData() {
        try {
            const staffSnap = await getDocs(collection(db, "artifacts", APP_ID, "public", "data", "staff_directory"));
            staff = staffSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            designers = staff.filter(s => s.team === 'Creative' || s.team === 'Design' || s.role?.toLowerCase().includes('design'));
            editors = staff.filter(s => s.team === 'Editorial' || s.role?.toLowerCase().includes('editor'));
            salesTeam = staff.filter(s => s.team === 'Sales');

            try {
                const res = await fetch(API_URL + '/projects');
                const data = await res.json();
                if (data.success && data.projects) {
                    projects = data.projects.filter(p => p.status !== 'Complete' && p.status !== 'Cancelled');
                    clients = [...new Set(projects.map(p => p.client).filter(Boolean))].sort();
                }
            } catch(e) { console.warn('Projects fetch:', e); }

            onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "design_requests"), snap => {
                designRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            });
            onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "edit_queue"), snap => {
                editQueue = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            });
        } catch(e) { console.error('Fetch error:', e); }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════════════
    const initials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();
    const teamColor = t => TEAM_COLORS[t] || '#21A0D8';
    const capStatus = u => u < 80 ? 'available' : u < 100 ? 'busy' : 'full';
    const capColor = s => s === 'available' ? '#10B981' : s === 'busy' ? '#F59E0B' : '#EF4444';
    const weeklyCapacity = p => Number(p.weeklyCapacityPTS ?? p.maxHoursPerWeek ?? 40);

    function calcWorkload(type, id) {
        const items = type === 'design' ? designRequests : editQueue;
        const key = type === 'design' ? 'designerId' : 'editor';
        let effort = 0;
        items.forEach(i => {
            const match = type === 'design' ? i.designerId === id : i.editor === id;
            if (match && i.status !== 'Done' && i.status !== 'Live') {
                effort += i.effortPTS || (type === 'design' ? EFFORT.design[i.assetType] : EFFORT.edit[i.videoComplexity]) || 4;
            }
        });
        return effort;
    }

    function calcEffort() {
        if (intakeType === 'design' && form.assetType) return EFFORT.design[form.assetType] || 4;
        if (intakeType === 'edit' && form.videoComplexity) {
            let base = EFFORT.edit[form.videoComplexity] || 6;
            form.editModifiers.forEach(m => base += EFFORT.modifiers[m] || 0);
            return base;
        }
        return null;
    }

    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast show ${type}`;
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════════════════════════════
    function render() {
        const c = document.getElementById('content');
        switch(currentStep) {
            case 'select': c.innerHTML = renderSelect(); break;
            case 'brief': c.innerHTML = renderBrief(); break;
            case 'brief-2': c.innerHTML = renderBrief2(); break;
            case 'design': c.innerHTML = renderDesign(); break;
            case 'edit': c.innerHTML = renderEdit(); break;
            case 'deliverable': c.innerHTML = renderDeliverable(); break;
            case 'deliverable-2': c.innerHTML = renderDeliverable2(); break;
            case 'success': c.innerHTML = renderSuccess(); break;
        }
        attachListeners();
    }

    function renderSelect() {
        return `
            <div class="card">
                <div class="card-header">
                    <div class="card-step">Start</div>
                    <div class="card-title">What do you need?</div>
                </div>
                <div class="card-body">
                    <div class="intake-grid">
                        <div class="intake-option" data-type="brief">
                            <div class="intake-icon" style="background: var(--dmg-blue-soft);">📋</div>
                            <div class="intake-content">
                                <div class="intake-label">Log a New Brief</div>
                                <div class="intake-desc">Sales: log a new client brief for Creative to respond to</div>
                            </div>
                            <div class="intake-arrow">→</div>
                        </div>
                        <div class="intake-option" data-type="design">
                            <div class="intake-icon" style="background: var(--creative-soft);">🎨</div>
                            <div class="intake-content">
                                <div class="intake-label">Request Design Work</div>
                                <div class="intake-desc">Need a thumbnail, graphics, or visual asset</div>
                            </div>
                            <div class="intake-arrow">→</div>
                        </div>
                        <div class="intake-option" data-type="edit">
                            <div class="intake-icon" style="background: var(--editorial-soft);">🎬</div>
                            <div class="intake-content">
                                <div class="intake-label">Request Video Edit</div>
                                <div class="intake-desc">Need video editing or post-production work</div>
                            </div>
                            <div class="intake-arrow">→</div>
                        </div>
                        <div class="intake-option" data-type="deliverable">
                            <div class="intake-icon" style="background: var(--production-soft);">➕</div>
                            <div class="intake-content">
                                <div class="intake-label">Add Deliverable to Project</div>
                                <div class="intake-desc">Add a new deliverable to an existing project</div>
                            </div>
                            <div class="intake-arrow">→</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // BRIEF FLOW (Sales)
    // ═══════════════════════════════════════════════════════════════════════════
    function renderBrief() {
        return `
            <div class="card">
                <div class="card-header">
                    <div class="card-step">New Brief — 1/2</div>
                    <div class="card-title">The Basics</div>
                </div>
                <div class="card-body">
                    <div class="field">
                        <label class="field-label">Client <span class="required">*</span></label>
                        <div class="custom-select" id="clientPicker">
                            <div class="select-trigger">
                                <span class="${form.client ? '' : 'placeholder'}">${form.client || 'Select or add new...'}</span>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
                            </div>
                            <div class="select-dropdown" id="clientDropdown">

    function renderCapacity(type) {
        const members = type === 'design' ? designers : editors;
        if (!members.length) return '';
        return `
            <div class="capacity-preview">
                <div class="capacity-header">
                    <div class="capacity-title">${type === 'design' ? 'Designer' : 'Editor'} Availability</div>
                    <div class="capacity-legend">
                        <div class="capacity-dot available"><span></span>Free</div>
                        <div class="capacity-dot busy"><span></span>Busy</div>
                        <div class="capacity-dot full"><span></span>Full</div>
                    </div>
                </div>
                <div class="capacity-list">
                    ${members.slice(0,6).map(m => {
                        const effort = calcWorkload(type, type === 'design' ? m.id : `${m.firstName} ${m.lastName}`);
                        const cap = weeklyCapacity(m);
                        const util = cap > 0 ? (effort / cap) * 100 : 0;
                        const status = capStatus(util);
                        return `<div class="capacity-member">
                            <div class="capacity-avatar" style="background:${teamColor(m.team)}">${initials(m.firstName, m.lastName)}</div>
                            <div class="capacity-name">${m.firstName}</div>
                            <div class="capacity-status" style="background:${capColor(status)}"></div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
        `;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // LISTENERS
    // ═══════════════════════════════════════════════════════════════════════════
    function attachListeners() {
        document.getElementById('resetBtn')?.addEventListener('click', () => location.reload());
        document.getElementById('newRequestBtn')?.addEventListener('click', () => location.reload());

        // Intake selection
        document.querySelectorAll('.intake-option').forEach(o => {
            o.addEventListener('click', () => {
                intakeType = o.dataset.type;
                currentStep = intakeType;
                render();
            });
        });

        // Back
        document.getElementById('backBtn')?.addEventListener('click', () => {
            if (currentStep === 'brief') currentStep = 'select';
            else if (currentStep === 'brief-2') currentStep = 'brief';
            else if (currentStep === 'design' || currentStep === 'edit') currentStep = 'select';
            else if (currentStep === 'deliverable') currentStep = 'select';
            else if (currentStep === 'deliverable-2') currentStep = 'deliverable';
            render();
        });

        // Continue
        document.getElementById('continueBtn')?.addEventListener('click', () => {
            if (currentStep === 'brief') currentStep = 'brief-2';
            else if (currentStep === 'deliverable') currentStep = 'deliverable-2';
            render();
        });

        // Pills
        document.querySelectorAll('.pill[data-type]').forEach(p => p.addEventListener('click', () => { form.projectType = p.dataset.type; render(); }));
        document.querySelectorAll('.pill[data-format]').forEach(p => p.addEventListener('click', () => { form.responseFormat = p.dataset.format; render(); }));
        document.querySelectorAll('.pill[data-channel]').forEach(p => p.addEventListener('click', () => {
            const ch = p.dataset.channel;
            form.channels = form.channels.includes(ch) ? form.channels.filter(c => c !== ch) : [...form.channels, ch];
            render();
        }));
        document.querySelectorAll('.pill[data-asset]').forEach(p => p.addEventListener('click', () => { form.assetType = p.dataset.asset; render(); }));
        document.querySelectorAll('.pill[data-complexity]').forEach(p => p.addEventListener('click', () => { form.videoComplexity = p.dataset.complexity; render(); }));
        document.querySelectorAll('.pill[data-modifier]').forEach(p => p.addEventListener('click', () => {
            const m = p.dataset.modifier;
            form.editModifiers = form.editModifiers.includes(m) ? form.editModifiers.filter(x => x !== m) : [...form.editModifiers, m];
            render();
        }));
        document.querySelectorAll('.pill[data-discipline]').forEach(p => p.addEventListener('click', () => { form.deliverableType = p.dataset.discipline; render(); }));

        // Inputs
        document.getElementById('titleInput')?.addEventListener('input', e => { form.title = e.target.value; updateBtnState(); });
        document.getElementById('valueInput')?.addEventListener('input', e => { form.dealValue = e.target.value; });
        document.getElementById('dueDateInput')?.addEventListener('change', e => { form.dueDate = e.target.value; updateBtnState(); });
        document.getElementById('countInput')?.addEventListener('input', e => { form.deliverableCount = e.target.value; });
        document.getElementById('notesInput')?.addEventListener('input', e => { form.notes = e.target.value; });
        document.getElementById('designTitle')?.addEventListener('input', e => { form.title = e.target.value; updateBtnState(); });
        document.getElementById('editTitle')?.addEventListener('input', e => { form.title = e.target.value; updateBtnState(); });
        document.getElementById('deadlineInput')?.addEventListener('change', e => { form.deadline = e.target.value; updateBtnState(); });
        document.getElementById('briefInput')?.addEventListener('input', e => { form.brief = e.target.value; });
        document.getElementById('deliverableTitleInput')?.addEventListener('input', e => { form.deliverableTitle = e.target.value; updateBtnState(); });

        // Dropdowns
        setupDropdown('clientPicker', 'clientDropdown', (val) => {
            if (val === '__new__') {
                const search = document.getElementById('clientSearch');
                form.client = search?.value || '';
                form.isNewClient = true;
            } else {
                form.client = val;
                form.isNewClient = false;
            }
            render();
        });
        setupDropdown('salesLeadPicker', 'salesLeadDropdown', (id) => {
            form.salesLead = salesTeam.find(s => s.id === id);
            render();
        });
        setupDropdown('projectPicker', 'projectDropdown', (id, title, client) => {
            form.linkedProject = { id, title, client };
            render();
        });
        setupDropdown('assignPicker', 'assignDropdown', (id) => {
            form.assignedTo = staff.find(s => s.id === id);
            render();
        });

        // Submit buttons
        document.getElementById('submitBrief')?.addEventListener('click', submitBrief);
        document.getElementById('submitDesign')?.addEventListener('click', submitDesign);
        document.getElementById('submitEdit')?.addEventListener('click', submitEdit);
        document.getElementById('submitDeliverable')?.addEventListener('click', submitDeliverable);

        // Close dropdowns on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.select-dropdown.show').forEach(d => d.classList.remove('show'));
                document.querySelectorAll('.select-trigger.open').forEach(t => t.classList.remove('open'));
            }
        });
    }

    function setupDropdown(pickerId, dropdownId, onSelect) {
        const picker = document.getElementById(pickerId);
        const dropdown = document.getElementById(dropdownId);
        if (!picker || !dropdown) return;

        const trigger = picker.querySelector('.select-trigger');
        trigger?.addEventListener('click', e => {
            e.stopPropagation();
            const open = dropdown.classList.contains('show');
            document.querySelectorAll('.select-dropdown.show').forEach(d => d.classList.remove('show'));
            document.querySelectorAll('.select-trigger.open').forEach(t => t.classList.remove('open'));
            if (!open) { dropdown.classList.add('show'); trigger.classList.add('open'); }
        });

        const search = dropdown.querySelector('.dropdown-search input');
        search?.addEventListener('click', e => e.stopPropagation());
        search?.addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            dropdown.querySelectorAll('.dropdown-item').forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(q) ? 'block' : 'none';
            });
        });

        dropdown.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                const id = item.dataset.id || item.dataset.value;
                const title = item.dataset.title || item.textContent.trim();
                const client = item.dataset.client || '';
                onSelect(id, title, client);
                dropdown.classList.remove('show');
                trigger.classList.remove('open');
            });
        });
    }

    function updateBtnState() {
        const continueBtn = document.getElementById('continueBtn');
        const submitDesign = document.getElementById('submitDesign');
        const submitEdit = document.getElementById('submitEdit');
        const submitDeliverable = document.getElementById('submitDeliverable');

        if (continueBtn && currentStep === 'brief') continueBtn.disabled = !form.client || !form.title || !form.dueDate;
        if (continueBtn && currentStep === 'deliverable') continueBtn.disabled = !form.linkedProject;
        if (submitDesign) submitDesign.disabled = !form.assetType || !form.title || !form.deadline;
        if (submitEdit) submitEdit.disabled = !form.videoComplexity || !form.title || !form.deadline;
        if (submitDeliverable) submitDeliverable.disabled = !form.deliverableType || !form.deliverableTitle || !form.deadline;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // SUBMIT FUNCTIONS
    // ═══════════════════════════════════════════════════════════════════════════
    async function submitBrief() {
        const btn = document.getElementById('submitBrief');
        btn.disabled = true; btn.textContent = 'Submitting...';
        try {
            const payload = {
                TITLE: form.title,
                "CLIENT / EXTERNAL PARTNER": form.client,
                "PROJECT TYPE": form.projectType === 'Campaign' ? '🎯 SHORT TERM CAMPAIGN' : '💡 VIDEO(S) IDEAS',
                "DEAL VALUE": parseFloat(form.dealValue) || 0,
                "(CLIENT) PROJECT DUE DATE": form.dueDate || null,
                "RESPONSE TYPE NEEDED": form.responseFormat,
                "ASSET(S) NEEDED": form.channels.length ? form.channels.join(', ') : null,
                "AGREED CONTENT DELIVERABLES (FOR AI)": form.deliverableCount || null,
                "(SALES) NOTES": form.notes,
                "SALES LEAD(S)": form.salesLead ? `${form.salesLead.firstName} ${form.salesLead.lastName}` : '',
                "DEAL STAGE": "Brief Received",
                "PROJECT STATUS": "Not started"
            };
            const res = await fetch(API_URL + '/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!res.ok) throw new Error('API error');
            showToast('Brief logged!', 'success');
            currentStep = 'success'; render();
        } catch(e) {
            console.error(e);
            showToast('Failed: ' + e.message, 'error');
            btn.disabled = false; btn.textContent = 'Submit Brief ✓';
        }
    }

    async function submitDesign() {
        const btn = document.getElementById('submitDesign');
        btn.disabled = true; btn.textContent = 'Submitting...';
        try {
            // → Firebase design_requests → Designer Capacity widget
            await addDoc(collection(db, "artifacts", APP_ID, "public", "data", "design_requests"), {
                title: form.title,
                headline: form.title,
                assetType: form.assetType,
                deadline: form.deadline,
                brief: form.brief,
                designerId: form.assignedTo?.id || null,
                designerName: form.assignedTo ? `${form.assignedTo.firstName} ${form.assignedTo.lastName}` : null,
                linkedProjectId: form.linkedProject?.id || null,
                linkedProjectTitle: form.linkedProject?.title || null,
                effortPTS: calcEffort(),
                status: 'Not Started',
                source: 'intake_hub',
                createdAt: serverTimestamp()
            });
            showToast('Design request sent!', 'success');
            currentStep = 'success'; render();
        } catch(e) {
            console.error(e);
            showToast('Failed: ' + e.message, 'error');
            btn.disabled = false; btn.textContent = 'Submit →';
        }
    }

    async function submitEdit() {
        const btn = document.getElementById('submitEdit');
        btn.disabled = true; btn.textContent = 'Submitting...';
        try {
            // → Firebase edit_queue → Editor Capacity widget
            await addDoc(collection(db, "artifacts", APP_ID, "public", "data", "edit_queue"), {
                title: form.title,
                videoComplexity: form.videoComplexity,
                editModifiers: form.editModifiers,
                deadline: form.deadline,
                dueDate: form.deadline,
                brief: form.brief,
                editor: form.assignedTo ? `${form.assignedTo.firstName} ${form.assignedTo.lastName}` : null,
                editorId: form.assignedTo?.id || null,
                linkedProjectId: form.linkedProject?.id || null,
                linkedProjectTitle: form.linkedProject?.title || null,
                effortPTS: calcEffort(),
                status: 'Not Started',
                source: 'intake_hub',
                createdAt: serverTimestamp()
            });
            showToast('Edit request sent!', 'success');
            currentStep = 'success'; render();
        } catch(e) {
            console.error(e);
            showToast('Failed: ' + e.message, 'error');
            btn.disabled = false; btn.textContent = 'Submit →';
        }
    }

    async function submitDeliverable() {
        const btn = document.getElementById('submitDeliverable');
        btn.disabled = true; btn.textContent = 'Adding...';
        try {
            // → Cloud Run API → Notion Master Ledger as sub-item
            const payload = {
                "Deliverable Title": form.deliverableTitle,
                "DISCIPLINE": form.deliverableType,
                "DUE DATE": form.deadline,
                "ASSIGNED TO": form.assignedTo ? `${form.assignedTo.firstName} ${form.assignedTo.lastName}` : null,
                "STATUS": "Not Started",
                "PARENT ITEM": form.linkedProject.id
            };
            const res = await fetch(API_URL + '/deliverables', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!res.ok) throw new Error('API error');
            showToast('Deliverable added!', 'success');
            currentStep = 'success'; render();
        } catch(e) {
            console.error(e);
            showToast('Failed: ' + e.message, 'error');
            btn.disabled = false; btn.textContent = 'Add Deliverable ✓';
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════════
    signInAnonymously(auth).then(async () => {
        await fetchData();
        render();
    }).catch(err => {
        console.error(err);
        document.getElementById('content').innerHTML = `<div class="card"><div class="card-body" style="text-align:center;padding:40px"><div style="font-size:24px;margin-bottom:12px">⚠️</div><div style="font-weight:700">Connection Error</div><div style="font-size:12px;color:var(--ink-sub)">Please refresh</div></div></div>`;
    });
</script>
