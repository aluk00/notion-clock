<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intake Hub | DMG Command Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!--
    ═══════════════════════════════════════════════════════════════════════════════
    DMG COMMAND CENTRE - INTAKE HUB
    Last Updated: 17 January 2026

    ARCHITECTURE:
    - Notion (Master Ledger) = Single source of truth for Projects & Deliverables
    - Cloud Run API = Firewall that translates requests into Notion API calls
    - Firebase = Staff Directory, Quick Requests, Real-time updates

    INTAKE TYPES:
    1. New Brief (Sales) → Creates project in Master Ledger via Cloud Run
    2. Design Request → Creates task in design_requests (Firebase) → Designer Capacity
    3. Edit Request → Creates task in edit_queue (Firebase) → Editor Capacity

    API: https://createnotionproject-223535956454.us-central1.run.app
    ═══════════════════════════════════════════════════════════════════════════════
    -->
    <style>
        :root {
            /* Core Colors */
            --ink: #0F172A;
            --ink-sub: #64748B;
            --ink-muted: #94A3B8;
            --border: #E2E8F0;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;

            /* Pillar Colors */
            --dmg-blue: #21A0D8;
            --dmg-blue-soft: #F0F9FF;
            --dmg-blue-glow: rgba(33, 160, 216, 0.15);
            --production: #43B049;
            --production-soft: rgba(67, 176, 73, 0.1);
            --creative: #E6468B;
            --creative-soft: rgba(230, 70, 139, 0.1);
            --editorial: #E94B4B;
            --editorial-soft: rgba(233, 75, 75, 0.1);
            --social: #F59E0B;
            --social-soft: rgba(245, 158, 11, 0.1);

            /* Capacity States */
            --available: #10B981;
            --busy: #F59E0B;
            --full: #EF4444;

            /* Layout */
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            color: var(--ink);
            min-height: 100vh;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        /* Header with Dot Grid */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .dots {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }
        .dots span:nth-child(1) { animation: pulse 2s ease-in-out infinite; }
        .dots span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dots span:nth-child(3) { animation: pulse 2s ease-in-out 0.6s infinite; }
        .dots span:nth-child(4) { animation: pulse 2s ease-in-out 0.9s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .header-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--dmg-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex: 1;
        }

        .reset-btn {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }
        .reset-btn:hover { border-color: var(--ink-sub); color: var(--ink); }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: visible;
            animation: slideIn 0.3s ease-out;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-alt);
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .card-step {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: -0.02em;
        }

        .card-desc {
            font-size: 12px;
            color: var(--ink-sub);
            margin-top: 4px;
            line-height: 1.5;
        }

        .card-body {
            padding: 20px;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } }

        /* Intake Type Selection */
        .intake-grid {
            display: grid;
            gap: 12px;
        }

        .intake-option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            background: var(--surface);
        }

        .intake-option:hover {
            border-color: var(--ink-muted);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        .intake-option.selected {
            border-color: var(--dmg-blue);
            background: var(--dmg-blue-soft);
        }

        .intake-option.selected .intake-icon {
            background: var(--dmg-blue);
            color: white;
        }

        .intake-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: var(--surface-alt);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .intake-content { flex: 1; }

        .intake-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .intake-desc {
            font-size: 11px;
            color: var(--ink-sub);
            line-height: 1.4;
        }

        .intake-arrow {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-muted);
            transition: var(--transition);
        }

        .intake-option:hover .intake-arrow {
            color: var(--dmg-blue);
            transform: translateX(4px);
        }

        /* Capacity Preview */
        .capacity-preview {
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 16px;
        }

        .capacity-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .capacity-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .capacity-legend {
            display: flex;
            gap: 12px;
        }

        .capacity-dot {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            font-weight: 600;
            color: var(--ink-sub);
        }

        .capacity-dot span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .capacity-dot.available span { background: var(--available); }
        .capacity-dot.busy span { background: var(--busy); }
        .capacity-dot.full span { background: var(--full); }

        .capacity-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }

        .capacity-member {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .capacity-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }

        .capacity-info { flex: 1; min-width: 0; }

        .capacity-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .capacity-bar {
            height: 4px;
            background: #E5E5E5;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .capacity-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .capacity-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Form Fields */
        .field {
            margin-bottom: 16px;
        }

        .field-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            display: block;
        }

        .field-label .required { color: var(--editorial); }

        .field-input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            background: var(--surface);
            color: var(--ink);
            outline: none;
            transition: var(--transition);
        }

        .field-input:focus {
            border-color: var(--dmg-blue);
            box-shadow: 0 0 0 3px var(--dmg-blue-glow);
        }

        .field-input::placeholder { color: var(--ink-muted); }

        textarea.field-input {
            min-height: 80px;
            resize: vertical;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            overflow: visible;
        }

        /* Custom Select */
        .custom-select {
            position: relative;
            z-index: 10;
        }

        .custom-select:focus-within {
            z-index: 100;
        }

        .select-trigger {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .select-trigger:hover { border-color: var(--dmg-blue); }
        .select-trigger .placeholder { color: var(--ink-muted); font-weight: 500; }
        .select-trigger.open { border-color: var(--dmg-blue); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }

        .select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1.5px solid var(--dmg-blue);
            border-top: none;
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .select-dropdown.show { display: block; animation: dropIn 0.2s ease-out; }
        @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } }

        .dropdown-item {
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .dropdown-item:hover {
            background: var(--dmg-blue-soft);
            color: var(--dmg-blue);
            padding-left: 18px;
        }

        /* Staff Picker */
        .staff-search {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--surface);
        }

        .staff-search input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 12px;
            outline: none;
        }

        .staff-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .staff-item:hover { background: var(--surface-alt); }

        .staff-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: white;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .staff-name { font-size: 12px; font-weight: 600; color: var(--ink); }
        .staff-role { font-size: 10px; color: var(--ink-sub); }

        .selected-badge {
            background: var(--dmg-blue);
            color: white;
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        /* Asset Type Pills */
        .asset-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .asset-pill {
            padding: 8px 14px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: var(--surface);
            color: var(--ink-sub);
        }

        .asset-pill:hover { border-color: var(--ink-muted); }
        .asset-pill.selected {
            border-color: var(--dmg-blue);
            background: var(--dmg-blue-soft);
            color: var(--dmg-blue);
        }

        /* Effort Estimation */
        .effort-box {
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 16px;
            border-left: 3px solid var(--production);
        }

        .effort-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .effort-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--production);
        }

        .effort-value span {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-sub);
        }

        .effort-breakdown {
            font-size: 11px;
            color: var(--ink-sub);
            margin-top: 6px;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-back {
            background: var(--surface);
            color: var(--ink-sub);
            border: 1.5px solid var(--border);
            flex: 0 0 auto;
            padding: 12px 16px;
        }
        .btn-back:hover { border-color: var(--ink-sub); color: var(--ink); }

        .btn-primary {
            background: var(--dmg-blue);
            color: white;
        }
        .btn-primary:hover { background: #1a8ac0; }
        .btn-primary:disabled { background: #CBD5E1; cursor: not-allowed; }

        .btn-submit {
            background: var(--production);
            color: white;
        }
        .btn-submit:hover { background: #38a042; }

        /* Preview Panel */
        .preview-panel {
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 16px;
        }

        .preview-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .preview-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
        }

        .preview-item:last-child { border-bottom: none; }
        .preview-label { color: var(--ink-sub); }
        .preview-value { font-weight: 600; color: var(--ink); }

        /* Hidden */
        .hidden { display: none !important; }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 12px;
        }

        .loading-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Success Screen */
        .success-screen {
            text-align: center;
            padding: 48px 32px;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--production);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 28px;
        }

        .success-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .success-desc {
            font-size: 13px;
            color: var(--ink-sub);
            margin-bottom: 24px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--full); }
        .toast.success { background: var(--production); }

        /* Responsive */
        @media (max-width: 500px) {
            .field-row { grid-template-columns: 1fr; }
            .capacity-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <span class="header-title">Intake Hub</span>
        <button class="reset-btn" id="resetBtn">Start Over</button>
    </div>

    <div id="content">
        <div class="loading">
            <div class="dots"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading...</span>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, setDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // ═══════════════════════════════════════════════════════════════════════════
    // CONFIGURATION
    // ═══════════════════════════════════════════════════════════════════════════
    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
    const APP_ID = 'dmg-command-centre-native';

    // Team Colors (Design System)
    const TEAM_COLORS = {
        'Editorial': '#E94B4B',
        'Creative': '#E6468B',
        'Production': '#43B049',
        'Social': '#F59E0B',
        'Sales': '#21A0D8',
        'Design': '#E6468B'
    };

    // Effort Points by Task Type (from Ecosystem Recap)
    const EFFORT_POINTS = {
        design: {
            'Thumbnail (Standard)': 3,
            'Thumbnail (Complex)': 5,
            'Graphics Package': 8,
            'Motion Graphics (Simple)': 6,
            'Motion Graphics (Complex)': 12,
            'Social Asset': 2,
            'Pitch Deck': 10
        },
        edit: {
            'Quick Cut': 3,
            'Standard Edit': 6,
            'Complex Edit': 12,
            'Breaking/Reactive': 4
        },
        modifiers: {
            'Motion Graphics': 3,
            'Stock Footage Search': 1.5,
            'Voiceover Recording': 1,
            'Multi-Platform Versions': 1.5,
            'Client Amends': 1.5,
            'Regulated Industry': 3,
            'Rush (under 48hrs)': 3
        },
        seniorityMultiplier: {
            'Junior': 2.0,
            'Midweight': 1.5,
            'Senior': 1.0,
            'Lead': 1.0,
            'Head of': 1.0,
            'Director of': 1.0
        }
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // INITIALIZE
    // ═══════════════════════════════════════════════════════════════════════════
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app);

    let staff = [];
    let designers = [];
    let editors = [];
    let projects = [];
    let clients = [];
    let designRequests = [];
    let editQueue = [];

    // Form State
    let currentStep = 'select';
    let intakeType = null;
    let formData = {
        // Brief fields
        title: '',
        client: '',
        isNewClient: false,
        vertical: '',
        ownerRole: '',
        dealStage: '',
        dealValue: '',
        priority: 'Standard',
        clientDueDate: '',
        internalDueDate: '',
        salesLead: null,
        creativeLead: null,
        productionLead: null,
        notes: '',
        files: [],
        links: [],
        // Design request fields
        assetType: '',
        designBrief: '',
        deadline: '',
        assignedDesigner: null,
        // Edit request fields
        videoComplexity: '',
        editModifiers: [],
        editBrief: '',
        assignedEditor: null,
        // For linking to existing projects
        linkedProject: null
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // DATA FETCHING
    // ═══════════════════════════════════════════════════════════════════════════
    async function fetchData() {
        try {
            // Fetch staff
            const staffSnap = await getDocs(collection(db, "artifacts", APP_ID, "public", "data", "staff_directory"));
            staff = staffSnap.docs.map(d => ({ id: d.id, ...d.data() }));

            // Filter designers and editors
            designers = staff.filter(s =>
                s.team === 'Creative' ||
                s.team === 'Design' ||
                s.role?.toLowerCase().includes('design')
            );

            editors = staff.filter(s =>
                s.team === 'Editorial' ||
                s.role?.toLowerCase().includes('editor')
            );

            // Fetch projects from Cloud Run API
            try {
                const res = await fetch(API_URL + '/projects');
                const data = await res.json();
                if (data.success && data.projects) {
                    projects = data.projects;
                    const clientSet = new Set();
                    projects.forEach(p => p.client && clientSet.add(p.client));
                    clients = Array.from(clientSet).sort();
                }
            } catch(e) {
                console.warn('Could not fetch projects from API:', e);
            }

            // Listen to design requests for capacity
            onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "design_requests"), (snap) => {
                designRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            });

            // Listen to edit queue for capacity
            onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "edit_queue"), (snap) => {
                editQueue = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            });

        } catch(e) {
            console.error('Data fetch error:', e);
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════════════
    function getInitials(firstName, lastName) {
        return `${(firstName || '?')[0]}${(lastName || '?')[0]}`.toUpperCase();
    }

    function getTeamColor(team) {
        return TEAM_COLORS[team] || '#21A0D8';
    }

    function getCapacityStatus(utilization) {
        if (utilization < 80) return 'available';
        if (utilization < 100) return 'busy';
        return 'full';
    }

    function getCapacityColor(status) {
        if (status === 'available') return '#10B981';
        if (status === 'busy') return '#F59E0B';
        return '#EF4444';
    }

    function getWeeklyCapacity(person) {
        return Number(person.weeklyCapacityPTS ?? person.weeklyCapacityPts ?? person.maxHoursPerWeek ?? 40);
    }

    function calculateDesignerWorkload(designerId) {
        let effort = 0;
        let tasks = 0;
        designRequests.forEach(r => {
            if (r.designerId === designerId && r.status !== 'Done') {
                effort += r.effortPTS || EFFORT_POINTS.design[r.assetType] || 3;
                tasks++;
            }
        });
        return { effort, tasks };
    }

    function calculateEditorWorkload(editorName) {
        let effort = 0;
        let tasks = 0;
        editQueue.forEach(item => {
            if (item.editor === editorName && item.status !== 'Live' && item.status !== 'Approved') {
                effort += item.effortPTS || EFFORT_POINTS.edit[item.videoComplexity] || 6;
                tasks++;
            }
        });
        return { effort, tasks };
    }

    function calculateEffortEstimate() {
        if (intakeType === 'design' && formData.assetType) {
            const base = EFFORT_POINTS.design[formData.assetType] || 3;
            const seniority = formData.assignedDesigner?.seniority || 'Senior';
            const multiplier = EFFORT_POINTS.seniorityMultiplier[seniority] || 1.0;
            return (base * multiplier).toFixed(1);
        }
        if (intakeType === 'edit' && formData.videoComplexity) {
            let base = EFFORT_POINTS.edit[formData.videoComplexity] || 6;
            formData.editModifiers.forEach(mod => {
                base += EFFORT_POINTS.modifiers[mod] || 0;
            });
            const seniority = formData.assignedEditor?.seniority || 'Senior';
            const multiplier = EFFORT_POINTS.seniorityMultiplier[seniority] || 1.0;
            return (base * multiplier).toFixed(1);
        }
        return null;
    }

    function showToast(message, type = '') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast show ${type}`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

                                            <div class="staff-name">${s.firstName} ${s.lastName}</div>
                                            <div class="staff-role">${s.role || 'Sales'}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label class="field-label">Creative Lead</label>
                            <div class="custom-select" id="creativeLeadPicker">
                                <div class="select-trigger">
                                    <span class="${formData.creativeLead ? '' : 'placeholder'}">${formData.creativeLead ? `${formData.creativeLead.firstName} ${formData.creativeLead.lastName}` : 'Optional...'}</span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
                                </div>
                                <div class="select-dropdown" id="creativeLeadDropdown">
                                    ${staff.filter(s => s.team === 'Creative').map(s => `
                                        <div class="staff-item" data-id="${s.id}" data-lead="creative">
                                            <div class="staff-avatar" style="background: ${getTeamColor(s.team)}">${getInitials(s.firstName, s.lastName)}</div>
                                            <div class="staff-name">${s.firstName} ${s.lastName}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="field">
                            <label class="field-label">Production Lead</label>
                            <div class="custom-select" id="productionLeadPicker">
                                <div class="select-trigger">
                                    <span class="${formData.productionLead ? '' : 'placeholder'}">${formData.productionLead ? `${formData.productionLead.firstName} ${formData.productionLead.lastName}` : 'Optional...'}</span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
                                </div>
                                <div class="select-dropdown" id="productionLeadDropdown">
                                    ${staff.filter(s => s.team === 'Production').map(s => `
                                        <div class="staff-item" data-id="${s.id}" data-lead="production">
                                            <div class="staff-avatar" style="background: ${getTeamColor(s.team)}">${getInitials(s.firstName, s.lastName)}</div>
                                            <div class="staff-name">${s.firstName} ${s.lastName}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label">Notes & Context</label>
                        <textarea class="field-input" id="briefNotes" placeholder="Any important details, blockers, or context...">${formData.notes}</textarea>
                    </div>

                    <div class="preview-panel">
                        <div class="preview-title">Summary</div>
                        <div class="preview-item">
                            <span class="preview-label">Project</span>
                            <span class="preview-value">${formData.title || '—'}</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Client</span>
                            <span class="preview-value">${formData.client || '—'}</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Deal Stage</span>
                            <span class="preview-value">${formData.dealStage || '—'}</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Value</span>
                            <span class="preview-value">${formData.dealValue ? '£' + Number(formData.dealValue).toLocaleString() : '—'}</span>
                        </div>
                    </div>

                    <div class="btn-row">
                        <button class="btn btn-back" id="backBtn">← Back</button>
                        <button class="btn btn-submit" id="submitBrief">Sync to Ledger ✓</button>
                    </div>
                </div>
            </div>
        `;
    }

    function renderSuccess() {
        const typeLabels = {
            'brief': 'Brief synced to Master Ledger',
            'design': 'Design request added to queue',
            'edit': 'Edit request added to queue'
        };

        return `
            <div class="card">
                <div class="card-body">
                    <div class="success-screen">
                        <div class="success-icon">✓</div>
                        <div class="success-title">Request Submitted</div>
                        <div class="success-desc">${typeLabels[intakeType] || 'Your request has been submitted'}</div>
                        <button class="btn btn-primary" id="newRequestBtn" style="width: auto; padding: 12px 32px;">New Request</button>
                    </div>
                </div>
            </div>
        `;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // EVENT LISTENERS
    // ═══════════════════════════════════════════════════════════════════════════
    function attachEventListeners() {
        // Reset button
        document.getElementById('resetBtn')?.addEventListener('click', () => {
            location.reload();
        });

        // Intake type selection
        document.querySelectorAll('.intake-option').forEach(opt => {
            opt.addEventListener('click', () => {
                intakeType = opt.dataset.type;
                currentStep = intakeType;
                render();
            });
        });

        // Back button
        document.getElementById('backBtn')?.addEventListener('click', () => {
            if (currentStep === 'brief') currentStep = 'select';
            else if (currentStep === 'brief-details') currentStep = 'brief';
            else if (currentStep === 'brief-context') currentStep = 'brief-details';
            else if (currentStep === 'design' || currentStep === 'edit') currentStep = 'select';
            render();
        });

        // Continue button
        document.getElementById('continueBtn')?.addEventListener('click', () => {
            if (currentStep === 'brief') currentStep = 'brief-details';
            else if (currentStep === 'brief-details') currentStep = 'brief-context';
            render();
        });

        // New request button
        document.getElementById('newRequestBtn')?.addEventListener('click', () => {
            location.reload();
        });

        // Asset type pills (Design)
        document.querySelectorAll('.asset-pill[data-type]').forEach(pill => {
            pill.addEventListener('click', () => {
                formData.assetType = pill.dataset.type;
                render();
            });
        });

        // Video complexity pills (Edit)
        document.querySelectorAll('.asset-pill[data-complexity]').forEach(pill => {
            pill.addEventListener('click', () => {
                formData.videoComplexity = pill.dataset.complexity;
                render();
            });
        });

        // Edit modifiers
        document.querySelectorAll('.asset-pill[data-modifier]').forEach(pill => {
            pill.addEventListener('click', () => {
                const mod = pill.dataset.modifier;
                if (formData.editModifiers.includes(mod)) {
                    formData.editModifiers = formData.editModifiers.filter(m => m !== mod);
                } else {
                    formData.editModifiers.push(mod);
                }
                render();
            });
        });

        // Priority pills
        document.querySelectorAll('.asset-pill[data-priority]').forEach(pill => {
            pill.addEventListener('click', () => {
                formData.priority = pill.dataset.priority;
                render();
            });
        });

        // Form inputs
        document.getElementById('designTitle')?.addEventListener('input', (e) => {
            formData.title = e.target.value;
        });
        document.getElementById('designDeadline')?.addEventListener('change', (e) => {
            formData.deadline = e.target.value;
            render();
        });
        document.getElementById('designBrief')?.addEventListener('input', (e) => {
            formData.designBrief = e.target.value;
        });
        document.getElementById('editTitle')?.addEventListener('input', (e) => {
            formData.title = e.target.value;
        });
        document.getElementById('editDeadline')?.addEventListener('change', (e) => {
            formData.deadline = e.target.value;
            render();
        });
        document.getElementById('editBrief')?.addEventListener('input', (e) => {
            formData.editBrief = e.target.value;
        });
        document.getElementById('briefTitle')?.addEventListener('input', (e) => {
            formData.title = e.target.value;
            const btn = document.getElementById('continueBtn');
            if (btn) btn.disabled = !e.target.value;
        });
        document.getElementById('dealValue')?.addEventListener('input', (e) => {
            formData.dealValue = e.target.value;
        });
        document.getElementById('clientDueDate')?.addEventListener('change', (e) => {
            formData.clientDueDate = e.target.value;
        });
        document.getElementById('internalDueDate')?.addEventListener('change', (e) => {
            formData.internalDueDate = e.target.value;
        });
        document.getElementById('briefNotes')?.addEventListener('input', (e) => {
            formData.notes = e.target.value;
        });

        // Custom select dropdowns
        setupCustomSelect('clientPicker', 'clientDropdown', (value) => {
            formData.client = value;
            render();
        });
        setupCustomSelect('verticalPicker', 'verticalDropdown', (value) => {
            formData.vertical = value;
            render();
        });
        setupCustomSelect('ownerPicker', 'ownerDropdown', (value) => {
            formData.ownerRole = value;
            render();
        });
        setupCustomSelect('stagePicker', 'stageDropdown', (value) => {
            formData.dealStage = value;
            render();
        });
        setupCustomSelect('projectPicker', 'projectDropdown', (value, title) => {
            formData.linkedProject = { id: value, title: title };
            render();
        });

        // Staff pickers
        setupStaffPicker('designerPicker', 'designerDropdown', designers, (person) => {
            formData.assignedDesigner = person;
            render();
        });
        setupStaffPicker('editorPicker', 'editorDropdown', editors, (person) => {
            formData.assignedEditor = person;
            render();
        });
        setupStaffPicker('salesLeadPicker', 'salesLeadDropdown', staff.filter(s => s.team === 'Sales'), (person) => {
            formData.salesLead = person;
            render();
        });
        setupStaffPicker('creativeLeadPicker', 'creativeLeadDropdown', staff.filter(s => s.team === 'Creative'), (person) => {
            formData.creativeLead = person;
            render();
        });
        setupStaffPicker('productionLeadPicker', 'productionLeadDropdown', staff.filter(s => s.team === 'Production'), (person) => {
            formData.productionLead = person;
            render();
        });

        // Submit buttons
        document.getElementById('submitDesign')?.addEventListener('click', submitDesignRequest);
        document.getElementById('submitEdit')?.addEventListener('click', submitEditRequest);
        document.getElementById('submitBrief')?.addEventListener('click', submitBrief);

        // Close dropdowns on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.select-dropdown.show').forEach(d => d.classList.remove('show'));
                document.querySelectorAll('.select-trigger.open').forEach(t => t.classList.remove('open'));
            }
        });
    }

    function setupCustomSelect(pickerId, dropdownId, onSelect) {
        const picker = document.getElementById(pickerId);
        const dropdown = document.getElementById(dropdownId);
        if (!picker || !dropdown) return;

        const trigger = picker.querySelector('.select-trigger');
        trigger?.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = dropdown.classList.contains('show');
            document.querySelectorAll('.select-dropdown.show').forEach(d => d.classList.remove('show'));
            document.querySelectorAll('.select-trigger.open').forEach(t => t.classList.remove('open'));
            if (!isOpen) {
                dropdown.classList.add('show');
                trigger.classList.add('open');
            }
        });

        dropdown.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                const value = item.dataset.value || item.dataset.id;
                const title = item.dataset.title || item.textContent.trim();
                onSelect(value, title);
                dropdown.classList.remove('show');
                trigger.classList.remove('open');
            });
        });
    }

    function setupStaffPicker(pickerId, dropdownId, staffList, onSelect) {
        const picker = document.getElementById(pickerId);
        const dropdown = document.getElementById(dropdownId);
        if (!picker || !dropdown) return;

        const trigger = picker.querySelector('.select-trigger');
        trigger?.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = dropdown.classList.contains('show');
            document.querySelectorAll('.select-dropdown.show').forEach(d => d.classList.remove('show'));
            document.querySelectorAll('.select-trigger.open').forEach(t => t.classList.remove('open'));
            if (!isOpen) {
                dropdown.classList.add('show');
                trigger.classList.add('open');
            }
        });

        const searchInput = dropdown.querySelector('.staff-search input');
        searchInput?.addEventListener('click', (e) => e.stopPropagation());
        searchInput?.addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            dropdown.querySelectorAll('.staff-item').forEach(item => {
                const person = staffList.find(s => s.id === item.dataset.id);
                const name = person ? `${person.firstName} ${person.lastName}`.toLowerCase() : '';
                item.style.display = name.includes(q) ? 'flex' : 'none';
            });
        });

        dropdown.querySelectorAll('.staff-item').forEach(item => {
            item.addEventListener('click', () => {
                const person = staffList.find(s => s.id === item.dataset.id);
                if (person) onSelect(person);
                dropdown.classList.remove('show');
                trigger.classList.remove('open');
            });
        });
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // SUBMIT FUNCTIONS
    // ═══════════════════════════════════════════════════════════════════════════
    async function submitDesignRequest() {
        const btn = document.getElementById('submitDesign');
        btn.disabled = true;
        btn.textContent = 'Submitting...';

        try {
            const effortEstimate = calculateEffortEstimate();

            await addDoc(collection(db, "artifacts", APP_ID, "public", "data", "design_requests"), {
                title: formData.title,
                headline: formData.title,
                assetType: formData.assetType,
                deadline: formData.deadline,
                brief: formData.designBrief,
                designerId: formData.assignedDesigner?.id || null,
                designerName: formData.assignedDesigner ? `${formData.assignedDesigner.firstName} ${formData.assignedDesigner.lastName}` : null,
                linkedProjectId: formData.linkedProject?.id || null,
                linkedProjectTitle: formData.linkedProject?.title || null,
                effortPTS: effortEstimate ? parseFloat(effortEstimate) : null,
                status: 'Not Started',
                source: 'intake_hub',
                createdAt: serverTimestamp()
            });

            showToast('Design request submitted!', 'success');
            currentStep = 'success';
            render();
        } catch (error) {
            console.error('Submit error:', error);
            showToast('Failed to submit: ' + error.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Submit Request';
        }
    }

    async function submitEditRequest() {
        const btn = document.getElementById('submitEdit');
        btn.disabled = true;
        btn.textContent = 'Submitting...';

        try {
            const effortEstimate = calculateEffortEstimate();

            await addDoc(collection(db, "artifacts", APP_ID, "public", "data", "edit_queue"), {
                title: formData.title,
                videoComplexity: formData.videoComplexity,
                editModifiers: formData.editModifiers,
                deadline: formData.deadline,
                dueDate: formData.deadline,
                brief: formData.editBrief,
                editor: formData.assignedEditor ? `${formData.assignedEditor.firstName} ${formData.assignedEditor.lastName}` : null,
                editorId: formData.assignedEditor?.id || null,
                linkedProjectId: formData.linkedProject?.id || null,
                linkedProjectTitle: formData.linkedProject?.title || null,
                effortPTS: effortEstimate ? parseFloat(effortEstimate) : null,
                status: 'Not Started',
                source: 'intake_hub',
                createdAt: serverTimestamp()
            });

            showToast('Edit request submitted!', 'success');
            currentStep = 'success';
            render();
        } catch (error) {
            console.error('Submit error:', error);
            showToast('Failed to submit: ' + error.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Submit Request';
        }
    }

    async function submitBrief() {
        const btn = document.getElementById('submitBrief');
        btn.disabled = true;
        btn.textContent = 'Syncing...';

        try {
            const payload = {
                TITLE: formData.title,
                "CLIENT / EXTERNAL PARTNER": formData.client,
                VERTICAL: formData.vertical,
                "OWNER ROLE": formData.ownerRole,
                "DEAL STAGE": formData.dealStage,
                "DEAL VALUE": parseFloat(formData.dealValue) || 0,
                "PRIORITY LEVEL": formData.priority,
                "SALES LEAD(S)": formData.salesLead ? `${formData.salesLead.firstName} ${formData.salesLead.lastName}` : '',
                "CREATIVE LEAD(S)": formData.creativeLead ? `${formData.creativeLead.firstName} ${formData.creativeLead.lastName}` : '',
                "PRODUCTION LEAD(S)": formData.productionLead ? `${formData.productionLead.firstName} ${formData.productionLead.lastName}` : '',
                "(SALES) NOTES": formData.notes,
                "(CLIENT) DUE DATE": formData.clientDueDate || null,
                "(INTERNAL) DUE DATE": formData.internalDueDate || null,
                "PROJECT STATUS": "Not started"
            };

            const res = await fetch(API_URL + '/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error('API error');

            showToast('Brief synced to Master Ledger!', 'success');
            currentStep = 'success';
            render();
        } catch (error) {
            console.error('Submit error:', error);
            showToast('Failed to sync: ' + error.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Sync to Ledger ✓';
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // INITIALIZE
    // ═══════════════════════════════════════════════════════════════════════════
    signInAnonymously(auth).then(async () => {
        await fetchData();
        render();
    }).catch(err => {
        console.error('Auth error:', err);
        document.getElementById('content').innerHTML = `
            <div class="card">
                <div class="card-body" style="text-align: center; padding: 40px;">
                    <div style="font-size: 24px; margin-bottom: 12px;">⚠️</div>
                    <div style="font-weight: 700; margin-bottom: 8px;">Connection Error</div>
                    <div style="font-size: 12px; color: var(--ink-sub);">Unable to connect. Please refresh.</div>
                </div>
            </div>
        `;
    });
</script>
