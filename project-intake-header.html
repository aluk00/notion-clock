<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Intake Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    background: transparent;
    display: flex;
    align-items: center;
    min-height: 80px;
    font-family: 'Inter', sans-serif;
    padding: 5px 20px;
}
.header-container {
    display: flex;
    align-items: center;
    gap: 1rem;
}
.title-text {
    font-size: 2.2rem;
    font-weight: 800;
    color: #1C1C1C;
    letter-spacing: -0.05em;
    text-transform: uppercase;
}
.dots-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    width: 24px;
    height: 24px;
}
.dot {
    width: 100%;
    height: 100%;
    background-color: #21A0D8;
    border-radius: 50%;
}
</style>
</head>
<body>
<div class="header-container">
<div class="title-text">PROJECT</div>
<div class="dots-grid">
<div class="dot"></div><div class="dot"></div>
<div class="dot"></div><div class="dot"></div>
</div>
<div class="title-text text-right">INTAKE</div>
</div>
</body>
</html>
