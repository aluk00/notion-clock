<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ready For Edit Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #FFFFFF;
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            padding-left: 10px;
        }

        .header-container {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            line-height: 1;
        }

        .title-text {
            font-size: 3.5rem;
            font-weight: 800;
            color: #1C1C1C;
            letter-spacing: -0.05em;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: uppercase;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
        }

        .dot {
            width: 100%; height: 100%;
            background-color: #43B049; /* PRODUCTION GREEN */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        
        @media (max-width: 768px) {
            .title-text { font-size: 2rem; }
            .dots-grid { width: 22px; height: 22px; gap: 3px; }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="title-text">READY FOR</div>
        <div class="dots-grid">
            <div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div>
        </div>
        <div class="title-text">EDIT</div>
    </div>
</body>
</html>
