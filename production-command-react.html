                                        <div>
                                            {/* Budget Card */}
                                            <div style={{background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, overflow:'hidden', marginBottom:20}}>
                                                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'18px 20px', borderBottom:'1px solid var(--border)'}}>
                                                    <div style={{display:'flex', alignItems:'center', gap:10}}>
                                                        <span style={{width:10, height:10, borderRadius:'50%', background:'var(--production)'}}></span>
                                                        <span style={{fontSize:12, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.04em'}}>Budget</span>
                                                    </div>
                                                    <button onClick={() => { setEditingBudget(!editingBudget); setNewBudget(budget); }} style={{background:'none', border:'none', fontSize:10, fontWeight:700, color:'var(--production)', textTransform:'uppercase', cursor:'pointer', padding:'4px 10px', borderRadius:20, background:'rgba(67, 176, 73, 0.1)'}}>
                                                        {editingBudget ? 'Cancel' : 'Edit'}
                                                    </button>
                                                </div>
                                                <div style={{padding:20}}>
                                                    {editingBudget ? (
                                                        <div style={{display:'flex', gap:10, marginBottom:16}}>
                                                            <input type="number" value={newBudget} onChange={(e) => setNewBudget(e.target.value)} style={{flex:1, padding:'12px 14px', background:'var(--surface-alt)', border:'1px solid var(--border)', borderRadius:8, fontWeight:700, fontSize:14}} placeholder="Budget..."/>
                                                            <button onClick={handleUpdateBudget} style={{padding:'12px 20px', background:'var(--production)', color:'white', border:'none', borderRadius:8, fontSize:11, fontWeight:700, textTransform:'uppercase', cursor:'pointer'}}>Save</button>
                                                        </div>
                                                    ) : (
                                                        <div style={{marginBottom:16}}>
                                                            <span className="mono" style={{fontSize:32, fontWeight:900, color:'var(--production)'}}>{formatCurrency(budget)}</span>
                                                            <span style={{fontSize:11, fontWeight:700, color:'var(--ink-muted)', marginLeft:10, textTransform:'uppercase'}}>Allocated</span>
                                                        </div>
                                                    )}
                                                    <div style={{height:8, background:'var(--surface-alt)', borderRadius:4, overflow:'hidden', marginBottom:20}}>
                                                        <div style={{height:'100%', background:'var(--production)', width:`${budget > 0 ? Math.min((spent/budget)*100, 100) : 0}%`, transition:'width 0.3s ease'}}/>
                                                    </div>
                                                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
                                                        <div style={{padding:16, background:'var(--surface-alt)', borderRadius:10, textAlign:'center'}}>
                                                            <div style={{fontSize:9, fontWeight:700, color:'var(--danger)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6}}>Spent</div>
                                                            <div className="mono" style={{fontSize:18, fontWeight:800}}>{formatCurrency(spent)}</div>
                                                        </div>
                                                        <div style={{padding:16, background:'var(--surface-alt)', borderRadius:10, textAlign:'center'}}>
                                                            <div style={{fontSize:9, fontWeight:700, color:'var(--ink-muted)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6}}>Remaining</div>
                                                            <div className="mono" style={{fontSize:18, fontWeight:800, color: budget - spent < 0 ? 'var(--danger)' : 'var(--ink)'}}>{formatCurrency(budget - spent)}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Expenses Card */}
                                            <div style={{background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, overflow:'hidden', marginBottom:20}}>
                                                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'18px 20px', borderBottom:'1px solid var(--border)'}}>
                                                    <div style={{display:'flex', alignItems:'center', gap:10}}>
                                                        <span style={{width:10, height:10, borderRadius:'50%', background:'var(--danger)'}}></span>
                                                        <span style={{fontSize:12, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.04em'}}>Expenses</span>
                                                    </div>
                                                    <span style={{fontSize:10, fontWeight:700, padding:'4px 10px', borderRadius:20, background:'var(--surface-alt)', color:'var(--ink-sub)'}}>{productionRecord?.receipts?.length || 0}</span>
                                                </div>
                                                <div style={{padding:20}}>
                                                    <div style={{maxHeight:160, overflow:'auto', marginBottom:16}}>
                                                        {productionRecord?.receipts?.length > 0 ? productionRecord.receipts.map((r, i) => (
                                                            <div key={i} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 14px', background:'var(--surface-alt)', borderRadius:10, marginBottom:8}}>
                                                                <span style={{fontSize:12, fontWeight:700}}>{r.title}</span>
                                                                <span className="mono" style={{fontSize:12, fontWeight:700, color:'var(--danger)'}}>{formatCurrency(r.amt)}</span>
                                                            </div>
                                                        )) : <div style={{textAlign:'center', padding:24, color:'var(--ink-muted)', fontSize:12}}>No expenses recorded</div>}
                                                    </div>
                                                    <div style={{display:'flex', gap:10, marginBottom:10}}>
                                                        <input id="recTitle" placeholder="Item description" style={{flex:1, padding:'12px 14px', background:'var(--surface-alt)', border:'1px solid var(--border)', borderRadius:8, fontSize:12, fontWeight:600}}/>
                                                        <input id="recAmt" type="number" placeholder="£0" style={{width:90, padding:'12px 14px', background:'var(--surface-alt)', border:'1px solid var(--border)', borderRadius:8, fontSize:12, fontWeight:600}}/>
                                                    </div>
                                                    <button onClick={handleAddReceipt} style={{width:'100%', padding:'14px', background:'var(--ink)', color:'white', border:'none', borderRadius:8, fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.03em', cursor:'pointer'}}>Add Expense</button>
                                                </div>
                                            </div>

                                            {/* Key Dates Card */}
                                            <div style={{background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, overflow:'hidden', marginBottom:20}}>
                                                <div style={{display:'flex', alignItems:'center', padding:'18px 20px', borderBottom:'1px solid var(--border)'}}>
                                                    <span style={{width:10, height:10, borderRadius:'50%', background:'var(--dmg-blue)', marginRight:10}}></span>
                                                    <span style={{fontSize:12, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.04em'}}>Key Dates</span>
                                                </div>
                                                <div style={{padding:20}}>
                                                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
                                                        <div style={{padding:16, background:'var(--surface-alt)', borderRadius:10, textAlign:'center'}}>
                                                            <div style={{fontSize:9, fontWeight:700, color:'var(--dmg-blue)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6}}>Client Due</div>
                                                            <div style={{fontSize:14, fontWeight:800}}>{selectedProject?.dueDate ? new Date(selectedProject.dueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '—'}</div>
                                                        </div>
                                                        <div style={{padding:16, background:'var(--surface-alt)', borderRadius:10, textAlign:'center'}}>
                                                            <div style={{fontSize:9, fontWeight:700, color:'var(--production)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6}}>Go Live</div>
                                                            <div style={{fontSize:14, fontWeight:800}}>{selectedProject?.liveDate ? new Date(selectedProject.liveDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '—'}</div>
                                                        </div>
                                                        <div style={{padding:16, background:'var(--surface-alt)', borderRadius:10, textAlign:'center'}}>
                                                            <div style={{fontSize:9, fontWeight:700, color:'var(--amber)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6}}>Internal Due</div>
                                                            <div style={{fontSize:14, fontWeight:800}}>{selectedProject?.internalDueDate ? new Date(selectedProject.internalDueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '—'}</div>
                                                        </div>
                                                        <div style={{padding:16, background:'var(--surface-alt)', borderRadius:10, textAlign:'center'}}>
                                                            <div style={{fontSize:9, fontWeight:700, color:'var(--creative)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6}}>Shoot Date</div>
                                                            <div style={{fontSize:14, fontWeight:800}}>{selectedProject?.shootDate ? new Date(selectedProject.shootDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '—'}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Deliverables Card */}
                                            <div style={{background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, overflow:'hidden'}}>
                                                <div style={{display:'flex', alignItems:'center', padding:'18px 20px', borderBottom:'1px solid var(--border)'}}>
                                                    <span style={{width:10, height:10, borderRadius:'50%', background:'var(--creative)', marginRight:10}}></span>
                                                    <span style={{fontSize:12, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.04em'}}>Deliverables</span>
                                                </div>
                                                <div style={{padding:20}}>
                                                    <DeliverablesList projectId={selectedProjectId} />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Right Column */}
                                        <div>
                                            {/* Schedule Card */}
                                            <div style={{background:'var(--surface)', border:'1px solid var(--production)', borderRadius:14, overflow:'hidden', marginBottom:20}}>
                                                <div style={{display:'flex', alignItems:'center', padding:'18px 20px', borderBottom:'1px solid var(--production)', background:'rgba(67, 176, 73, 0.05)'}}>
                                                    <span style={{width:10, height:10, borderRadius:'50%', background:'var(--production)', marginRight:10}}></span>
                                                    <span style={{fontSize:12, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.04em', color:'var(--production)'}}>Schedule</span>
                                                </div>
                                                <div style={{padding:20}}>
                                                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12}}>
                                                        <input type="date" id="shootDate" style={{padding:'12px 14px', background:'var(--surface-alt)', border:'1px solid var(--border)', borderRadius:8, fontSize:12, fontWeight:600}}/>
                                                        <CustomDropdown value="Standard Shoot" onChange={(v) => document.getElementById('shootFormat').value = v} options={formatOptions} />
                                                        <input type="hidden" id="shootFormat" defaultValue="Standard Shoot" />
                                                    </div>
                                                    <button onClick={handleScheduleShoot} style={{width:'100%', padding:'14px', background:'var(--production)', color:'white', border:'none', borderRadius:8, fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.03em', cursor:'pointer'}}>Add Shoot</button>
                                                    <div style={{marginTop:16}}>
                                                        {projectShoots.length > 0 ? projectShoots.map(s => (
                                                            <div key={s.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:12, fontWeight:700, color:'var(--production)', background:'rgba(67, 176, 73, 0.08)', padding:'12px 14px', borderRadius:10, marginTop:8}}>
                                                                <span>{new Date(s.date || s.startDateTime).toLocaleDateString('en-GB', { weekday:'short', day: 'numeric', month: 'short' })}</span>
                                                                <span style={{textTransform:'uppercase', fontSize:10, background:'var(--production)', color:'white', padding:'4px 8px', borderRadius:4}}>{s.format || 'Shoot'}</span>
                                                            </div>
                                                        )) : <div style={{textAlign:'center', padding:20, color:'var(--ink-muted)', fontSize:12}}>No shoots scheduled</div>}
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Crew Card */}
                                            <div style={{background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, overflow:'hidden'}}>
                                                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'18px 20px', borderBottom:'1px solid var(--border)'}}>
                                                    <div style={{display:'flex', alignItems:'center', gap:10}}>
                                                        <span style={{width:10, height:10, borderRadius:'50%', background:'var(--social)'}}></span>
                                                        <span style={{fontSize:12, fontWeight:800, textTransform:'uppercase', letterSpacing:'0.04em'}}>Crew</span>
                                                    </div>
                                                    <span style={{fontSize:10, fontWeight:700, padding:'4px 10px', borderRadius:20, background:'var(--surface-alt)', color:'var(--ink-sub)'}}>{productionRecord?.crew?.length || 0}</span>
                                                </div>
                                                <div style={{padding:20}}>
                                                    <div style={{maxHeight:180, overflow:'auto', marginBottom:16}}>
                                                        {productionRecord?.crew?.length > 0 ? productionRecord.crew.map((c, i) => (
                                                            <div key={i} style={{display:'flex', alignItems:'center', gap:12, padding:'14px', background:'var(--surface-alt)', borderRadius:10, marginBottom:10}}>
                                                                <div style={{width:40, height:40, borderRadius:'50%', background:'var(--social)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, fontWeight:800, color:'white'}}>{(c.name||'?')[0]}</div>
                                                                <div style={{flex:1}}>
                                                                    <div style={{fontSize:13, fontWeight:700}}>{c.name}</div>
                                                                    <div style={{fontSize:10, fontWeight:600, color:'var(--ink-sub)', textTransform:'uppercase'}}>{c.role}</div>
                                                                </div>
                                                            </div>
                                                        )) : <div style={{textAlign:'center', padding:24, color:'var(--ink-muted)', fontSize:12}}>No crew assigned</div>}
                                                    </div>
                                                    <div style={{marginBottom:10}}>
                                                        <CustomDropdown value="" onChange={(v) => document.getElementById('staffSelect').value = v} options={staffOptions} placeholder="Select team member..." />
                                                        <input type="hidden" id="staffSelect" />
                                                    </div>
                                                    <div style={{marginBottom:12}}>
                                                        <CustomDropdown value="Lead Producer" onChange={(v) => document.getElementById('roleSelect').value = v} options={roleOptions} />
                                                        <input type="hidden" id="roleSelect" defaultValue="Lead Producer" />
                                                    </div>
                                                    <button onClick={handleAssignCrew} style={{width:'100%', padding:'14px', background:'var(--ink)', color:'white', border:'none', borderRadius:8, fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.03em', cursor:'pointer'}}>Assign to Project</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div style={{display:'flex', alignItems:'center', justifyContent:'center', height:'100%'}}>
                                        <div style={{textAlign:'center'}}>
                                            <div style={{fontSize:48, marginBottom:12}}>📋</div>
                                            <div style={{fontSize:11, fontWeight:800, color:'var(--ink-muted)', textTransform:'uppercase'}}>Select a project to view details</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Shoot Detail Modal */}
                    {selectedShoot && (
                        <ShootDetailModal
                            shoot={selectedShoot}
                            project={shootProject}
                            allShoots={shoots}
                            onClose={() => setSelectedShoot(null)}
                            onOpenDesk={handleOpenDesk}
                        />
                    )}

                    {/* Add Shoot Modal */}
                    <AddShootModal
                        show={showAddShootModal}
                        onClose={() => setShowAddShootModal(false)}
                        projects={projects}
                        onAdd={handleAddShootFromModal}
                    />

                    {/* Init Modal */}
                    {showInitModal && (
                        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', backdropFilter:'blur(4px)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100}}>
                            <div style={{background:'var(--surface)', borderRadius:'var(--radius)', padding:32, width:'100%', maxWidth:400}}>
                                <h3 style={{fontSize:18, fontWeight:900, textTransform:'uppercase', marginBottom:4}}>Initialise Production</h3>
                                <p style={{fontSize:10, color:'var(--ink-sub)', fontWeight:600, marginBottom:24, textTransform:'uppercase'}}>Connect project to environment</p>
                                <div style={{marginBottom:16}}>
                                    <CustomDropdown 
                                        label="Project"
                                        value=""
                                        onChange={(v) => document.getElementById('modalProjectSelect').value = v}
                                        options={projectOptions}
                                        placeholder="Select Project..."
                                    />
                                    <input type="hidden" id="modalProjectSelect" />
                                </div>
                                <div style={{marginBottom:24}}>
                                    <div style={{fontSize:9, fontWeight:800, textTransform:'uppercase', color:'var(--ink-sub)', marginBottom:6}}>Budget</div>
                                    <input id="modalBudget" type="number" style={{width:'100%', padding:'12px 14px', background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'var(--radius-sm)', fontSize:12, fontWeight:600}} placeholder="£0.00"/>
                                </div>
                                <div style={{display:'flex', gap:12}}>
                                    <button onClick={() => setShowInitModal(false)} style={{flex:1, padding:'14px', background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'var(--radius-sm)', fontSize:10, fontWeight:800, textTransform:'uppercase', cursor:'pointer'}}>Cancel</button>
                                    <button onClick={handleInitProduction} style={{flex:1, padding:'14px', background:'var(--ink)', color:'white', border:'none', borderRadius:'var(--radius-sm)', fontSize:10, fontWeight:800, textTransform:'uppercase', cursor:'pointer'}}>Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProductionCommand />);
    </script>
</body>
</html>
