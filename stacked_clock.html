<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacked Digital Clock</title>
    <style>
        /* Core Layout */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* ALIGNED TO CENTER */
            align-items: center;
            height: 100vh;
            background-color: transparent; /* Blends with Notion */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            /* Padding removed for perfect centering */
        }

        /* Clock Container */
        .clock-container {
            display: flex;
            flex-direction: column;
            line-height: 0.9; /* Tightens the space between hour and minute */
            font-weight: 900; /* Very thick text */
            color: #000000; /* Black text */
        }

        /* Hour and Minute Styling */
        .time-segment {
            font-size: 5rem; /* Large size */
            letter-spacing: -0.05em; /* Tight kerning */
        }
        
        /* Adjusted Minute segment size to match visual weight */
        .minute-segment {
            font-size: 5rem;
        }

        /* Responsive scaling */
        @media (max-width: 600px) {
            .time-segment { font-size: 3.5rem; }
            .minute-segment { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <span id="hour" class="time-segment">--</span>
        <span id="minute" class="minute-segment">--</span>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            
            // Get hours in 24-hour format (00-23)
            const hours = String(now.getHours()).padStart(2, '0');
            
            // Get minutes (00-59)
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('hour').textContent = hours;
            document.getElementById('minute').textContent = minutes;
        }

        // Initial call
        updateTime();

        // Update every second (1000ms)
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
