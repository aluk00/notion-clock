<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacked Digital Clock</title>
    <style>
        /* Core Layout */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* ALIGNED TO CENTER */
            align-items: center;
            /* Drastically reduce overall height to remove excess padding */
            height: 100%; 
            background-color: transparent; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Clock Container */
        .clock-container {
            display: flex;
            flex-direction: column;
            /* Tighter line height to stack them closely */
            line-height: 0.8; 
            font-weight: 900; 
            color: #000000; 
            /* Push container down slightly to compensate for line-height */
            margin-top: 5px; 
            /* Explicitly set the wrapper size to control Notion iframe height */
            padding: 5px 0; 
        }

        /* Hour and Minute Styling */
        .time-segment {
            /* Reduced size significantly to match screenshot visually */
            font-size: 3rem; 
            letter-spacing: -0.05em; 
        }
        
        .minute-segment {
            font-size: 3rem;
        }

        /* Responsive scaling */
        @media (max-width: 600px) {
            .time-segment { font-size: 2.5rem; }
            .minute-segment { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <span id="hour" class="time-segment">--</span>
        <span id="minute" class="minute-segment">--</span>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            
            // Get hours in 24-hour format (00-23)
            const hours = String(now.getHours()).padStart(2, '0');
            
            // Get minutes (00-59)
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('hour').textContent = hours;
            document.getElementById('minute').textContent = minutes;
        }

        // Initial call
        updateTime();
        // Update every second (1000ms)
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
