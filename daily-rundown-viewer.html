<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Rundown | Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        editorial: '#E94B4B',
                        production: '#43B049',
                        sales: '#21A0D8',
                        social: '#F59E0B',
                        creative: '#E6468B',
                        ink: '#1C1C1C',
                        'ink-sub': '#757575',
                        'bg-soft': '#F9FAFB',
                        border: '#EAECEF',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #E5E7EB;
            border-radius: 20px;
        }
    </style>
</head>
<body class="text-ink">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
        const SECTIONS = ['FILMING', 'INTERNAL', 'EXTERNAL', 'GOING LIVE'];

        const DotGrid = () => (
            <div className="grid grid-cols-2 gap-[2px] w-[12px]">
                {[0, 1, 2, 3].map((i) => (
                    <span
                        key={i}
                        className="w-[5px] h-[5px] rounded-full bg-editorial animate-pulse"
                        style={{ animationDelay: `${i * 0.3}s` }}
                    />
                ))}
            </div>
        );

        const VERTICAL_STYLES = {
            SPORT: 'bg-green-100 text-green-700',
            UK: 'bg-blue-100 text-blue-600',
            RESPAWN: 'bg-purple-100 text-purple-600',
            MAIN: 'bg-gray-100 text-gray-800',
            MONEY: 'bg-yellow-100 text-yellow-700',
            SPOTLIGHT: 'bg-pink-100 text-pink-600'
        };

        const STATUS_ICONS = {
            done: '✓',
            pending: '◔',
            blocked: '!',
            '': ''
        };

        const STATUS_STYLES = {
            done: 'bg-green-500 border-green-500 text-white',
            pending: 'bg-yellow-500 border-yellow-500 text-white',
            blocked: 'bg-red-500 border-red-500 text-white',
            '': 'border-gray-200'
        };

        const RundownCard = ({ item }) => {
            const vertical = (item.vertical || '').toUpperCase();
            const verticalClass = VERTICAL_STYLES[vertical] || 'bg-gray-100 text-gray-600';
            const status = (item.status || '').toLowerCase();
            const statusClass = STATUS_STYLES[status] || 'border-gray-200';
            const statusIcon = STATUS_ICONS[status] || '';
            const creator = item.creator || '';

            return (
                <div className="p-3 bg-white rounded-lg border border-border shadow-[0_2px_4px_rgba(0,0,0,0.02)] hover:shadow-[0_4px_12px_rgba(0,0,0,0.08)] hover:-translate-y-[1px] transition-all duration-200 flex gap-3 group cursor-pointer">
                    <div className={`w-[16px] h-[16px] mt-[2px] rounded-full border-[2px] flex items-center justify-center text-[9px] font-bold flex-shrink-0 ${statusClass}`}>
                        {statusIcon}
                    </div>
                    <div className="flex-1 min-w-0">
                        <div className="flex flex-wrap gap-1.5 mb-1.5 items-center">
                            <span className={`text-[9px] font-extrabold uppercase px-2 py-0.5 rounded ${verticalClass} tracking-wide`}>
                                {vertical || 'MAIN'}
                            </span>
                            {creator && (
                                <span className="text-[9px] font-bold uppercase px-2 py-0.5 rounded bg-gray-50 text-gray-500 border border-gray-200">
                                    {creator}
                                </span>
                            )}
                        </div>
                        <div className="text-[11px] font-semibold text-ink leading-snug break-words">
                            {item.title || 'Untitled'}
                        </div>
                    </div>
                </div>
            );
        };

        const INITIAL_VISIBLE = 5;

        const SectionColumn = ({ section, items }) => {
            const [expanded, setExpanded] = useState(false);
            const sectionItems = items.filter(i => i.section === section);
            const hasMore = sectionItems.length > INITIAL_VISIBLE;
            const displayItems = expanded ? sectionItems : sectionItems.slice(0, INITIAL_VISIBLE);
            const hiddenCount = sectionItems.length - INITIAL_VISIBLE;

            const getSectionColor = () => {
                switch(section) {
                    case 'FILMING': return 'bg-production';
                    case 'INTERNAL': return 'bg-sales';
                    case 'EXTERNAL': return 'bg-creative';
                    case 'GOING LIVE': return 'bg-editorial';
                    default: return 'bg-gray-400';
                }
            };

            return (
                <div className="bg-white border border-border rounded-xl overflow-hidden flex flex-col min-h-[350px]">
                    <div className="p-3 border-b border-border bg-bg-soft flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <div className={`w-2 h-2 rounded-full ${getSectionColor()}`}></div>
                            <span className="text-[10px] font-bold uppercase tracking-widest text-ink-sub">
                                {section}
                            </span>
                        </div>
                        <span className="text-[10px] font-bold bg-white border border-border px-2 py-0.5 rounded-full text-ink-sub">
                            {sectionItems.length}
                        </span>
                    </div>
                    <div className={`flex-1 p-3 custom-scrollbar flex flex-col gap-2 ${expanded ? 'overflow-y-auto max-h-[400px]' : 'overflow-hidden'}`}>
                        {sectionItems.length === 0 ? (
                            <div className="flex-1 flex flex-col items-center justify-center opacity-30 hover:opacity-50 transition-opacity py-8">
                                <div className="w-1 h-10 bg-gray-200 rounded-full mb-3"></div>
                                <span className="text-[9px] font-bold uppercase text-ink-sub tracking-widest">No items</span>
                            </div>
                        ) : (
                            <>
                                {displayItems.map((item) => (
                                    <RundownCard key={item.id} item={item} />
                                ))}
                                {hasMore && !expanded && (
                                    <button
                                        onClick={() => setExpanded(true)}
                                        className="mt-1 py-2 text-[10px] font-bold text-ink-sub hover:text-editorial bg-gradient-to-t from-white via-white to-transparent transition-colors flex items-center justify-center gap-1.5 rounded-lg border border-dashed border-gray-200 hover:border-editorial/30"
                                    >
                                        <span>+{hiddenCount} more</span>
                                        <span className="text-[8px]">▼</span>
                                    </button>
                                )}
                                {expanded && hasMore && (
                                    <button
                                        onClick={() => setExpanded(false)}
                                        className="mt-1 py-2 text-[10px] font-bold text-ink-sub hover:text-editorial transition-colors flex items-center justify-center gap-1.5 rounded-lg border border-dashed border-gray-200 hover:border-editorial/30 sticky bottom-0 bg-white"
                                    >
                                        <span>Show less</span>
                                        <span className="text-[8px]">▲</span>
                                    </button>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const formatDateKey = (date) => date.toISOString().split('T')[0];

            const formatDisplayDate = (date) => {
                return date.toLocaleDateString('en-GB', {
                    weekday: 'long',
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
            };

            const isToday = useMemo(() => {
                return formatDateKey(selectedDate) === formatDateKey(new Date());
            }, [selectedDate]);

            const loadData = useCallback(async () => {
                setLoading(true);
                setError(null);
                try {
                    const dateStr = formatDateKey(selectedDate);
                    const response = await fetch(`${API_URL}/rundown?date=${dateStr}`);

                    if (!response.ok) {
                        const errorText = await response.text();
                        let errorMsg = `Server error (${response.status})`;
                        try {
                            const errorData = JSON.parse(errorText);
                            if (errorData.error) errorMsg = errorData.error;
                        } catch (e) {
                            console.error('Non-JSON error response:', errorText);
                        }
                        throw new Error(errorMsg);
                    }

                    const data = await response.json();
                    if (data.success) {
                        const sortedItems = (data.items || []).sort((a, b) =>
                            new Date(a.createdTime || 0) - new Date(b.createdTime || 0)
                        );
                        setItems(sortedItems);
                    } else {
                        throw new Error(data.error || 'Failed to load');
                    }
                } catch (err) {
                    console.error('Fetch error:', err);
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            }, [selectedDate]);

            useEffect(() => {
                loadData();
                // Auto-refresh every 30 seconds
                const interval = setInterval(loadData, 30000);
                return () => clearInterval(interval);
            }, [loadData]);

            const handlePrevDay = () => {
                const d = new Date(selectedDate);
                d.setDate(d.getDate() - 1);
                setSelectedDate(d);
            };

            const handleNextDay = () => {
                const d = new Date(selectedDate);
                d.setDate(d.getDate() + 1);
                setSelectedDate(d);
            };

            const handleToday = () => {
                setSelectedDate(new Date());
            };

            const totalItems = items.length;
            const doneCount = items.filter(i => i.status === 'done').length;
            const pendingCount = items.filter(i => i.status === 'pending').length;

            return (
                <div className="p-4 font-sans text-ink">
                    <div className="bg-white rounded-2xl border border-border overflow-hidden max-w-[1400px] mx-auto transition-all duration-300 hover:shadow-xl">
                        {/* Header */}
                        <div className="px-4 py-3 border-b border-border flex items-center gap-4 bg-white sticky top-0 z-10">
                            <DotGrid />
                            <h1 className="flex-1 text-[13px] font-extrabold tracking-tight uppercase text-ink">
                                Daily Rundown <span className="text-editorial mx-2">•</span>
                                <span className={isToday ? 'text-editorial' : ''}>
                                    {formatDisplayDate(selectedDate)}
                                </span>
                            </h1>

                            <div className="flex gap-1">
                                <button
                                    onClick={handlePrevDay}
                                    className="px-2.5 py-1.5 text-[10px] font-bold bg-bg-soft hover:bg-editorial hover:text-white rounded-md transition-colors"
                                >
                                    ←
                                </button>
                                <button
                                    onClick={handleToday}
                                    className={`px-3 py-1.5 text-[10px] font-bold rounded-md transition-colors ${
                                        isToday
                                            ? 'bg-editorial text-white'
                                            : 'bg-bg-soft hover:bg-editorial hover:text-white'
                                    }`}
                                >
                                    Today
                                </button>
                                <button
                                    onClick={handleNextDay}
                                    className="px-2.5 py-1.5 text-[10px] font-bold bg-bg-soft hover:bg-editorial hover:text-white rounded-md transition-colors"
                                >
                                    →
                                </button>
                            </div>
                        </div>

                        {/* Stats Bar */}
                        <div className="px-4 py-2 border-b border-border bg-bg-soft flex items-center gap-6">
                            <div className="flex items-center gap-2">
                                <span className="text-[9px] font-bold uppercase text-ink-sub tracking-wide">Total</span>
                                <span className="text-[11px] font-extrabold text-ink">{totalItems}</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-green-500"></span>
                                <span className="text-[9px] font-bold uppercase text-ink-sub tracking-wide">Done</span>
                                <span className="text-[11px] font-extrabold text-green-600">{doneCount}</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-yellow-500"></span>
                                <span className="text-[9px] font-bold uppercase text-ink-sub tracking-wide">Pending</span>
                                <span className="text-[11px] font-extrabold text-yellow-600">{pendingCount}</span>
                            </div>
                            <a
                                href="https://dmgmedia.slack.com/archives/C09A92FRXCZ"
                                target="_blank"
                                rel="noopener noreferrer"
                                className="ml-auto flex items-center gap-1.5 text-[9px] text-ink-sub hover:text-editorial transition-colors group"
                            >
                                <svg className="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/>
                                </svg>
                                <span className="font-semibold group-hover:underline">Updates Channel</span>
                            </a>
                            <div className="flex items-center gap-1.5 text-[9px] text-ink-sub">
                                <svg className="w-3 h-3" viewBox="0 0 100 100" fill="currentColor">
                                    <path d="M6.017 4.313l55.333-4.087c6.797-.583 8.543-.19 12.817 2.917l17.663 12.443c2.913 2.14 3.883 2.723 3.883 5.053v68.243c0 4.277-1.553 6.807-6.99 7.193L24.467 99.967c-4.08.193-6.023-.39-8.16-3.113L3.3 79.94c-2.333-3.113-3.3-5.443-3.3-8.167V11.113c0-3.497 1.553-6.413 6.017-6.8z" fillRule="evenodd"/>
                                </svg>
                                <span className="font-semibold">Synced with Notion</span>
                            </div>
                        </div>

                        {/* Content */}
                        {loading ? (
                            <div className="min-h-[400px] flex flex-col items-center justify-center gap-4 text-ink-sub">
                                <DotGrid />
                                <span className="text-[10px] font-bold uppercase tracking-widest">Loading rundown...</span>
                            </div>
                        ) : error ? (
                            <div className="min-h-[400px] flex flex-col items-center justify-center gap-4">
                                <div className="text-red-500 text-[12px] font-bold text-center px-4">
                                    {error}
                                </div>
                                <button
                                    onClick={loadData}
                                    className="px-4 py-2 text-[11px] font-bold uppercase bg-editorial text-white rounded-lg hover:bg-red-600 transition-colors"
                                >
                                    Retry
                                </button>
                            </div>
                        ) : (
                            <div className="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                {SECTIONS.map((section) => (
                                    <SectionColumn
                                        key={section}
                                        section={section}
                                        items={items}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
