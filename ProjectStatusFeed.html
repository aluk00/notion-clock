<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Status Feed | DMG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #43B049; /* DMG Production Green */
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #21A0D8;
            --team-executive: #1C1C1C;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            color: var(--ink);
            padding: 10px;
        }
        
        .feed-card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 340px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .feed-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        
        /* Header */
        .feed-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
        }
        
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 3px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--brand-primary);
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot-grid span:nth-child(1) { animation-delay: 0s; }
        .dot-grid span:nth-child(2) { animation-delay: 0.3s; }
        .dot-grid span:nth-child(3) { animation-delay: 0.6s; }
        .dot-grid span:nth-child(4) { animation-delay: 0.3s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        
        .feed-title {
            font-size: 13px;
            font-weight: 900;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex: 1;
        }
        
        /* Feed List */
        .feed-list {
            max-height: 480px;
            overflow-y: auto;
            background: var(--bg-soft);
        }
        .feed-list::-webkit-scrollbar { width: 4px; }
        .feed-list::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        
        /* Feed Item */
        .feed-item {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            position: relative;
            background: white;
            transition: all 0.2s ease;
        }
        .feed-item:last-child { border-bottom: none; }
        .feed-item:hover { background: var(--bg-soft); }
        
        .feed-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--team-color, var(--brand-primary));
            opacity: 0.6;
        }
        
        .feed-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        
        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--team-color, var(--brand-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
            color: #FFF;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        
        .user-info {
            flex: 1;
            min-width: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-name {
            font-size: 11px;
            font-weight: 800;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        
        .update-time {
            font-size: 9px;
            font-weight: 700;
            color: #BCBCBC;
            text-transform: uppercase;
        }
        
        /* Summary Text */
        .feed-summary {
            font-size: 12px;
            color: var(--ink-sub);
            line-height: 1.4;
            padding-left: 34px;
            font-weight: 500;
        }
        
        .project-tag {
            display: inline;
            font-weight: 800;
            color: var(--team-color, var(--brand-primary));
            text-transform: uppercase;
            font-size: 11px;
        }
        
        /* Status indicator */
        .status-pill {
            display: inline-block;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--status-bg, #F3F4F6);
            color: var(--status-color, #6B7280);
            margin-top: 8px;
            letter-spacing: 0.05em;
        }
        
        /* Empty State */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }
        .empty-icon { font-size: 24px; margin-bottom: 12px; opacity: 0.3; }
        .empty-text { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.1em; }
        
        .loading {
            padding: 60px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        window.firebaseModules = { initializeApp, getFirestore, collection, onSnapshot, query, orderBy, limit, getAuth, signInAnonymously, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const teamColors = {
            Editorial: '#E94B4B',
            Creative: '#E6468B',
            Production: '#43B049',
            Social: '#F2C316',
            Operations: '#21A0D8',
            Executive: '#1C1C1C'
        };
        
        const statusStyles = {
            'Briefed': { bg: 'rgba(107,114,128,0.1)', color: '#6B7280' },
            'In Progress': { bg: 'rgba(33,160,216,0.1)', color: '#21A0D8' },
            'Review': { bg: 'rgba(245,158,11,0.1)', color: '#F59E0B' },
            'Approved': { bg: 'rgba(67,176,73,0.1)', color: '#43B049' },
            'Live': { bg: 'rgba(155,89,182,0.1)', color: '#9B59B6' }
        };
        
        const generateSummary = (item) => {
            const actions = {
                'status': () => `moved <span class="project-tag">${item.title}</span> to ${item.newStatus}`,
                'new': () => `initialised project <span class="project-tag">${item.title}</span>`,
                'assign': () => `assigned crew to <span class="project-tag">${item.title}</span>`,
                'complete': () => `published <span class="project-tag">${item.title}</span>`,
                'comment': () => `noted update on <span class="project-tag">${item.title}</span>`,
                'update': () => `refined <span class="project-tag">${item.title}</span>`
            };
            return actions[item.type]?.() || `updated <span class="project-tag">${item.title}</span>`;
        };
        
        const DotGrid = () => (
            <div className="dot-grid">
                {[...Array(4)].map((_, i) => <span key={i} />)}
            </div>
        );
        
        function ProjectStatusFeed() {
            const [activities, setActivities] = useState([]);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                const { initializeApp, getFirestore, getAuth, signInAnonymously, onAuthStateChanged, collection, onSnapshot, query, orderBy, limit } = window.firebaseModules;
                
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                const appId = "dmg-command-centre-native";

                signInAnonymously(auth);

                const unsubAuth = onAuthStateChanged(auth, (user) => {
                    if (user) {
                        const q = query(
                            collection(db, "artifacts", appId, "public", "data", "activity_feed"),
                            orderBy('timestamp', 'desc'),
                            limit(15)
                        );
                        
                        const unsubSnap = onSnapshot(q, (snapshot) => {
                            setActivities(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                            setLoading(false);
                        }, (err) => {
                            console.error(err);
                            setLoading(false);
                        });
                        
                        return () => unsubSnap();
                    }
                });

                return () => unsubAuth();
            }, []);
            
            const timeAgo = (ts) => {
                if (!ts) return 'NOW';
                const date = ts.toDate ? ts.toDate() : new Date(ts);
                const diff = Math.floor((Date.now() - date) / 1000);
                if (diff < 60) return 'NOW';
                if (diff < 3600) return `${Math.floor(diff/60)}M`;
                if (diff < 86400) return `${Math.floor(diff/3600)}H`;
                return `${Math.floor(diff/86400)}D`;
            };
            
            const getInitials = (name) => {
                if (!name) return 'TM';
                return name.split(' ').map(n => n[0]).join('').toUpperCase();
            };
            
            return (
                <div className="feed-card">
                    <div className="feed-header">
                        <DotGrid />
                        <span className="feed-title">Network Feed</span>
                    </div>
                    
                    <div className="feed-list">
                        {loading ? (
                            <div className="loading"><DotGrid /></div>
                        ) : activities.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-icon">📡</div>
                                <div className="empty-text">Standby for updates</div>
                            </div>
                        ) : (
                            activities.map(item => {
                                const teamColor = teamColors[item.team] || '#43B049';
                                const statusStyle = statusStyles[item.newStatus] || {};
                                
                                return (
                                    <div 
                                        key={item.id} 
                                        className="feed-item"
                                        style={{ '--team-color': teamColor }}
                                    >
                                        <div className="feed-item-header">
                                            <div className="user-avatar" style={{ background: teamColor }}>
                                                {getInitials(item.user)}
                                            </div>
                                            <div className="user-info">
                                                <span className="user-name">{item.user || 'Team'}</span>
                                                <span className="update-time">{timeAgo(item.timestamp)}</span>
                                            </div>
                                        </div>
                                        <div 
                                            className="feed-summary"
                                            style={{ '--team-color': teamColor }}
                                            dangerouslySetInnerHTML={{ __html: generateSummary(item) }}
                                        />
                                        {item.newStatus && (
                                            <div style={{ paddingLeft: 34, marginTop: 4 }}>
                                                <span 
                                                    className="status-pill"
                                                    style={{ 
                                                        '--status-bg': statusStyle.bg,
                                                        '--status-color': statusStyle.color
                                                    }}
                                                >
                                                    {item.newStatus}
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProjectStatusFeed />);
    </script>
</body>
</html>
