<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Meetings | DMG New Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Core Layout */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent; /* Blends with Notion */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            color: #000000;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 0 4px; /* Minimal padding for narrow cols */
        }

        /* --- COMPACT HEADER --- */
        .header-container {
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1;
            margin-bottom: 16px;
            padding-top: 12px;
        }

        .title-text {
            font-size: 1.1rem; /* Adjusted slightly to fit longer text */
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.02em;
            line-height: 1;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

        /* --- LIST LAYOUT --- */
        .meeting-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .meeting-card {
            display: flex;
            flex-direction: column; 
            gap: 10px;
            padding: 12px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }

        /* Active styling */
        .meeting-card.active {
            border-color: #21a0d8;
            background: #F0F9FF;
            box-shadow: 0 4px 12px rgba(33, 160, 216, 0.1);
        }

        .meeting-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .meeting-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .meeting-name {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #111;
            line-height: 1.2;
        }

        .meeting-time-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .meeting-time {
            font-size: 10px;
            color: #666;
            font-weight: 600;
            white-space: nowrap;
        }

        .live-badge {
            display: none;
            font-size: 9px;
            font-weight: 800;
            color: #21a0d8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            animation: pulseText 2s infinite;
        }
        
        .meeting-card.active .live-badge { display: inline-block; }

        @keyframes pulseText { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* --- BUTTON STATES --- */
        .join-btn {
            width: 100%;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
            
            /* Default: Inactive state */
            background-color: #F3F4F6;
            color: #C5C5C5;
            pointer-events: none;
            cursor: default;
            border: 1px solid transparent;
        }

        /* Active: Within 15m window */
        .meeting-card.active .join-btn {
            background-color: #21a0d8;
            color: white;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(33, 160, 216, 0.2);
        }

        .meeting-card.active .join-btn:hover {
            background-color: #1a8bbd;
            transform: translateY(-1px);
        }

        #loading { font-size: 10px; font-weight: 700; color: #CCC; margin-top: 10px; text-align: center; width: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-text text-left">DAILY</div>
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="title-text text-right">TEAM MTGS</div>
    </div>

    <div id="loading">Syncing...</div>
    <div id="listMount" class="meeting-list"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY", authDomain: "dmg-command-centre-native.firebaseapp.com", projectId: "dmg-command-centre-native", storageBucket: "dmg-command-centre-native.firebasestorage.app", messagingSenderId: "223535956454", appId: "1:223535956454:web:b25e5bc69d8a4a7f209627" };
    const appId = "dmg-command-centre-native";
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // --- RECURRING MEETINGS ---
    const RECURRING_MEETINGS = [
        {
            id: 'recurring-1',
            title: 'Video Daily',
            startTime: '09:00',
            endTime: '09:30',
            link: 'https://dmgt.zoom.us/j/91362309149?from=addon',
            type: 'recurring'
        },
        {
            id: 'recurring-2',
            title: 'Originals Catch-Up',
            startTime: '16:00',
            endTime: '16:15',
            link: 'https://dmgt.zoom.us/j/91891373882?pwd=lQ8vNW93lVdI7LCceVmGDRwGokv8ht.1&from=addon#success',
            type: 'recurring'
        }
    ];

    let dynamicMeetings = [];

    function isMeetingActive(startStr, endStr) {
        const now = new Date();
        const [sH, sM] = startStr.split(':');
        const [eH, eM] = endStr.split(':');
        
        const start = new Date(); start.setHours(parseInt(sH), parseInt(sM), 0);
        const end = new Date(); end.setHours(parseInt(eH), parseInt(eM), 0);

        // Active 15 mins before to 15 mins after
        const windowStart = new Date(start.getTime() - 15 * 60000);
        const windowEnd = new Date(end.getTime() + 15 * 60000);

        return now >= windowStart && now <= windowEnd;
    }

    function render() {
        const mount = document.getElementById('listMount');
        mount.innerHTML = '';
        
        const isWeekend = [0, 6].includes(new Date().getDay());
        let allMeetings = isWeekend ? [...dynamicMeetings] : [...RECURRING_MEETINGS, ...dynamicMeetings];

        const sorted = allMeetings.sort((a,b) => a.startTime.localeCompare(b.startTime));

        if (sorted.length === 0) {
            mount.innerHTML = '<div style="font-size:11px; color:#CCC; font-weight:600; text-align:center; padding: 20px;">No meetings today.</div>';
            return;
        }

        sorted.forEach(m => {
            const active = isMeetingActive(m.startTime, m.endTime);
            const statusClass = active ? 'active' : '';
            const btnText = active ? 'Join Now' : 'Join'; 
            
            const card = document.createElement('div');
            card.className = `meeting-card ${statusClass}`;
            card.innerHTML = `
                <div class="meeting-header">
                    <div class="meeting-info">
                        <span class="meeting-name">${m.title}</span>
                        <div class="meeting-time-row">
                            <span class="meeting-time">${m.startTime} - ${m.endTime}</span>
                            <span class="live-badge">● IN SESSION</span>
                        </div>
                    </div>
                </div>
                <a href="${m.link}" target="_blank" class="join-btn">${btnText}</a>
            `;
            mount.appendChild(card);
        });
    }

    setInterval(render, 30000);

    async function init() {
        const todayKey = new Date().toISOString().split('T')[0];
        onSnapshot(collection(db, "artifacts", appId, "public", "data", "team_meetings"), snap => {
            dynamicMeetings = snap.docs
                .map(d => ({id: d.id, ...d.data()}))
                .filter(m => !m.dateKey || m.dateKey === todayKey);
            render();
            document.getElementById('loading').classList.add('hidden');
        });
    }

    signInAnonymously(auth).then(init);

</script>
</body>
</html>
