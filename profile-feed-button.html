<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 8px 12px;
        }
        .feed-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #E6468B 0%, #D63384 100%);
            color: #FFF;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(230, 70, 139, 0.3);
        }
        .feed-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(230, 70, 139, 0.4);
        }
        .feed-btn-icon { font-size: 16px; }
        .feed-btn-arrow { font-size: 14px; opacity: 0.8; }
