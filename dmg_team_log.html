<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Rota Request | Live Cloud</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-black: #1C1C1C;
            --brand-pink: #E6468B;
            --dmg-blue: #21a0d8;
            --bg-grey: #F9FAFB;
            --border: #EAECEF;
            --text-main: #1C1C1C;
            --text-sub: #757575;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* Heartbeat Loading Animation */
        @keyframes heartbeat { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        .dot { animation: heartbeat 3s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.75s; }
        .dot:nth-child(4) { animation-delay: 1.5s; }
        .dot:nth-child(3) { animation-delay: 2.25s; }

        .widget-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 440px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        .scroll-content::-webkit-scrollbar { width: 6px; }
        .scroll-content::-webkit-scrollbar-thumb { background-color: #E0E0E0; border-radius: 3px; }

        /* Frosted Glass Read-Only State - Scrolling Enabled */
        .frosted-view {
            filter: grayscale(0.8) opacity(0.5);
            /* Removed pointer-events: none to allow scrolling */
            user-select: none;
        }

        .loc-pill {
            transition: var(--transition);
            border: 2.5px solid var(--border);
        }
        .loc-pill.selected {
            background-color: var(--dmg-blue);
            color: white;
            border-color: var(--dmg-blue);
            box-shadow: 0 0 15px rgba(33, 160, 216, 0.4);
        }
        .loc-pill.weekend-selected {
            background-color: #f1f3f5;
            color: #495057;
            border-color: #dee2e6;
            box-shadow: none;
        }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slideDown { animation: slideDown 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        
        /* New Status Pulse */
        @keyframes pulse-soft { 
            0%, 100% { transform: scale(1); opacity: 1; } 
            50% { transform: scale(1.05); opacity: 0.8; } 
        }
        .status-pulse { animation: pulse-soft 2s infinite ease-in-out; }
    </style>

    <!-- React & Firebase -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();
    const appId = 'dmg-command-centre-native';

    // --- HELPERS ---
    const getThisMonday = (base = new Date()) => {
        const d = new Date(base);
        d.setHours(0,0,0,0);
        const day = d.getDay(); // 0=Sun, 1=Mon...
        const diff = (day === 0) ? -6 : 1 - day;
        d.setDate(d.getDate() + diff);
        return d;
    };

    const addDays = (date, n) => new Date(date.getTime() + n * 86400000);
    const fmtShort = (date) => date.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    const normalize = (n) => n ? n.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase() : "";

    // --- COMPONENTS ---

    const DotGrid = ({ color = "var(--dmg-blue)" }) => (
        <div className="grid grid-cols-2 gap-1 w-fit">
            {[...Array(4)].map((_, i) => <span key={i} className="dot w-1.5 h-1.5 rounded-full" style={{ backgroundColor: color }}></span>)}
        </div>
    );

    // --- MAIN APP ---
    const App = () => {
        const [weekOffset, setWeekOffset] = useState(0);
        const [staffName, setStaffName] = useState("");
        const [managerName, setManagerName] = useState("");
        const [selections, setSelections] = useState({});
        const [staffDirectory, setStaffDirectory] = useState([]);
        const [submissions, setSubmissions] = useState([]);
        const [filteredStaff, setFilteredStaff] = useState([]);
        const [showAutocomplete, setShowAutocomplete] = useState(false);
        const [isEditing, setIsEditing] = useState(false);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [isSuccess, setIsSuccess] = useState(false);

        // Date Computations
        const mondayDate = useMemo(() => addDays(getThisMonday(), weekOffset * 7), [weekOffset]);
        const weekCommencing = mondayDate.toISOString().split("T")[0];
        const isPastWeek = useMemo(() => {
            const todayMonday = getThisMonday();
            return mondayDate.getTime() < todayMonday.getTime();
        }, [mondayDate]);

        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        const locs = ["Office", "WFH", "Shoot", "Off-Site", "PTO"];
        const weekendLocs = ["Weekend", "Shoot", "Off-Site"];

        // Initial Auth and Directory Sync
        useEffect(() => {
            auth.signInAnonymously();
            auth.onAuthStateChanged(user => {
                if (user) {
                    db.collection('artifacts').doc(appId).collection('public').doc('data').collection('staff_directory')
                        .onSnapshot(snap => {
                            const list = [];
                            snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                            setStaffDirectory(list);
                        });
                    
                    db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rota_submissions')
                        .onSnapshot(snap => {
                            const list = [];
                            snap.forEach(doc => list.push(doc.data()));
                            setSubmissions(list);
                        });
                }
            });
        }, []);

        const existingSubmission = useMemo(() => {
            if (!staffName || staffName.length < 3) return null;
            const normName = normalize(staffName);
            return submissions.find(s => s.weekId === weekCommencing && normalize(s.name) === normName);
        }, [submissions, staffName, weekCommencing]);

        const isSubmittedView = !!existingSubmission;

        useEffect(() => {
            if (existingSubmission && !isEditing) {
                const loaded = {};
                days.forEach((d, i) => {
                    loaded[d] = existingSubmission.schedule[i] || { status: (d === "Saturday" || d === "Sunday" ? "Weekend" : "Office"), fullDay: true, start: "09:00", end: "17:30" };
                });
                setSelections(loaded);
                if (existingSubmission.manager) setManagerName(existingSubmission.manager);
            } else if (!existingSubmission && !isEditing) {
                resetSelections();
            }
        }, [existingSubmission, isEditing, weekCommencing]);

        const resetSelections = () => {
            const initial = {};
            days.forEach(d => {
                const isWeekend = d === "Saturday" || d === "Sunday";
                initial[d] = { status: isWeekend ? "Weekend" : "Office", fullDay: true, start: "09:00", end: "17:30" };
            });
            setSelections(initial);
        };

        const handleNameInput = (val) => {
            setStaffName(val);
            if (val.length > 1) {
                const matches = staffDirectory.filter(s => 
                    `${s.firstName} ${s.lastName}`.toLowerCase().includes(val.toLowerCase())
                );
                setFilteredStaff(matches);
                setShowAutocomplete(true);
            } else {
                setShowAutocomplete(false);
            }
        };

        const selectUser = (u) => {
            const name = `${u.firstName} ${u.lastName}`;
            setStaffName(name);
            setManagerName(u.manager || "");
            setShowAutocomplete(false);
            setIsEditing(false);
        };

        const updateDay = (day, field, value) => {
            if (isSubmittedView && !isEditing) return;
            setSelections(prev => ({
                ...prev,
                [day]: { ...prev[day], [field]: value }
            }));
        };

        const handleSubmit = async () => {
            if (!staffName || !managerName) return alert("Please complete name and manager selection.");
            setIsSubmitting(true);
            
            const docId = `${weekCommencing}_${normalize(staffName).replace(/\s+/g, "_")}`;
            const payload = {
                name: staffName,
                manager: managerName,
                weekId: weekCommencing,
                schedule: days.map(d => selections[d]),
                submittedAt: new Date().toISOString()
            };

            try {
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rota_submissions').doc(docId).set(payload);
                setIsSubmitting(false);
                setIsEditing(false);
                setIsSuccess(true);
            } catch (e) {
                alert("Cloud Sync Error: " + e.message);
                setIsSubmitting(false);
            }
        };

        if (isSuccess) {
            return (
                <div className="widget-card flex flex-col items-center justify-center p-8 text-center animate-fadeIn">
                    <div className="w-16 h-16 rounded-full bg-green-50 flex items-center justify-center mb-6">
                        <svg className="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 className="text-2xl font-black uppercase text-gray-900 mb-2">Sync Successful</h2>
                    <p className="text-sm text-gray-500 font-medium mb-8">Your pattern for w/c {fmtShort(mondayDate)} has been updated in the cloud.</p>
                    <button onClick={() => setIsSuccess(false)} className="px-8 py-3 bg-black text-white rounded-full text-xs font-black uppercase tracking-widest hover:bg-gray-800 transition-all">Done</button>
                </div>
            );
        }

        return (
            <div className="widget-card flex flex-col">
                {/* HEADER */}
                <div className="p-6 border-b border-gray-100 shrink-0 bg-white z-20">
                    <div className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-3">
                            <DotGrid />
                            <h1 className="text-xl font-black uppercase tracking-tighter">Rota Request</h1>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => {setWeekOffset(prev => prev - 1); setIsEditing(false);}} className="w-8 h-8 rounded-lg border border-gray-200 bg-gray-50 font-bold hover:bg-white transition-all">‹</button>
                            <div className={`px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider border ${isPastWeek ? 'bg-gray-100 text-gray-400 border-gray-200' : 'bg-blue-50 text-[var(--dmg-blue)] border-blue-100'}`}>
                                <span className="opacity-50 mr-1 font-bold">W/C</span> {fmtShort(mondayDate)}
                            </div>
                            <button onClick={() => {setWeekOffset(prev => prev + 1); setIsEditing(false);}} className="w-8 h-8 rounded-lg border border-gray-200 bg-gray-50 font-bold hover:bg-white transition-all">›</button>
                        </div>
                    </div>

                    <div className="space-y-4">
                        <div className="relative">
                            <label className="text-[10px] font-black uppercase text-gray-400 tracking-widest block mb-1.5">Staff Identity</label>
                            <input 
                                type="text" 
                                value={staffName} 
                                onChange={(e) => handleNameInput(e.target.value)}
                                className="w-full p-3 bg-gray-50 border-2 border-gray-100 rounded-xl text-sm font-bold focus:border-[var(--dmg-blue)] focus:bg-white transition-all outline-none"
                                placeholder="Start typing your name..."
                                disabled={isPastWeek || (isSubmittedView && !isEditing)}
                            />
                            {showAutocomplete && filteredStaff.length > 0 && (
                                <div className="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-xl shadow-xl z-50 max-h-48 overflow-y-auto">
                                    {filteredStaff.map(u => (
                                        <div key={u.id} onClick={() => selectUser(u)} className="p-3 text-sm font-bold hover:bg-gray-50 cursor-pointer border-b border-gray-50 last:border-0">{u.firstName} {u.lastName}</div>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div>
                            <label className="text-[10px] font-black uppercase text-gray-400 tracking-widest block mb-1.5">Line Manager</label>
                            <select 
                                value={managerName} 
                                onChange={(e) => setManagerName(e.target.value)}
                                className="w-full p-3 bg-gray-50 border-2 border-gray-100 rounded-xl text-sm font-bold focus:border-[var(--dmg-blue)] focus:bg-white transition-all outline-none appearance-none cursor-pointer"
                                disabled={isPastWeek || (isSubmittedView && !isEditing)}
                            >
                                <option value="" disabled>Select Manager...</option>
                                {[...new Set(staffDirectory.filter(s => s.isManager).map(s => `${s.firstName} ${s.lastName}`))].sort().map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                    </div>
                </div>

                {/* PREMIUM "ALREADY SUBMITTED" BANNER */}
                {isSubmittedView && !isEditing && (
                    <div className="bg-white border-b border-gray-100 px-6 py-4 animate-fadeIn shrink-0 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <div className="status-pulse bg-green-500 w-2 h-2 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
                            <div>
                                <h2 className="text-[11px] font-black uppercase text-gray-900 tracking-wider">Already Submitted</h2>
                                <p className="text-[10px] font-bold text-gray-400">
                                    Logged: {new Date(existingSubmission.submittedAt).toLocaleDateString('en-GB')} @ {new Date(existingSubmission.submittedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                </p>
                            </div>
                        </div>
                        <DotGrid color="#DDD" />
                    </div>
                )}

                {/* SCROLL CONTENT */}
                <div className={`scroll-content flex-1 overflow-y-auto p-6 space-y-8 bg-white ${(isSubmittedView && !isEditing) || isPastWeek ? 'frosted-view' : ''}`}>
                    {days.map((day, i) => {
                        const date = addDays(mondayDate, i);
                        const sel = selections[day] || {};
                        const isWeekend = day === "Saturday" || day === "Sunday";
                        const options = isWeekend ? weekendLocs : locs;

                        return (
                            <div key={day} className="border-b border-gray-50 last:border-0 pb-8 last:pb-0">
                                <div className="flex items-baseline gap-2 mb-4">
                                    <span className="text-sm font-black uppercase tracking-tight text-gray-900">{day}</span>
                                    <span className="text-[10px] font-bold text-[var(--brand-pink)] uppercase tracking-widest">{fmtShort(date)}</span>
                                </div>

                                <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                    {options.map(l => (
                                        <button 
                                            key={l} 
                                            onClick={() => updateDay(day, 'status', l)}
                                            className={`loc-pill px-4 py-2 rounded-full text-[11px] font-black uppercase tracking-wide border-2 ${sel.status === l ? (l === 'Weekend' ? 'weekend-selected' : 'selected') : 'bg-white text-gray-400'}`}
                                            disabled={(isSubmittedView && !isEditing) || isPastWeek}
                                        >
                                            {l}
                                        </button>
                                    ))}
                                </div>

                                {sel.status === "Shoot" && (
                                    <div className="mt-4 p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4 animate-slideDown">
                                        <div className="flex items-center justify-between">
                                            <span className="text-[11px] font-black uppercase text-gray-400 tracking-wider">Full Day?</span>
                                            <div className="flex gap-2 bg-white p-1 rounded-lg border border-gray-200">
                                                <button onClick={() => updateDay(day, 'fullDay', true)} className={`px-4 py-1 rounded-md text-[10px] font-black uppercase transition-all ${sel.fullDay ? 'bg-[var(--dmg-blue)] text-white' : 'text-gray-300'}`}>Yes</button>
                                                <button onClick={() => updateDay(day, 'fullDay', false)} className={`px-4 py-1 rounded-md text-[10px] font-black uppercase transition-all ${!sel.fullDay ? 'bg-[var(--dmg-blue)] text-white' : 'text-gray-300'}`}>No</button>
                                            </div>
                                        </div>
                                        {!sel.fullDay && (
                                            <div className="flex items-center justify-between border-t border-gray-200 pt-3">
                                                <span className="text-[11px] font-black uppercase text-gray-400 tracking-wider">Shift Hours</span>
                                                <div className="flex items-center gap-2">
                                                    <input type="time" value={sel.start} onChange={(e) => updateDay(day, 'start', e.target.value)} className="p-2 rounded-lg border border-gray-200 bg-white text-xs font-bold w-24 text-center outline-none focus:border-[var(--dmg-blue)]" disabled={(isSubmittedView && !isEditing) || isPastWeek} />
                                                    <span className="font-black text-gray-300">-</span>
                                                    <input type="time" value={sel.end} onChange={(e) => updateDay(day, 'end', e.target.value)} className="p-2 rounded-lg border border-gray-200 bg-white text-xs font-bold w-24 text-center outline-none focus:border-[var(--dmg-blue)]" disabled={(isSubmittedView && !isEditing) || isPastWeek} />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>

                {/* FOOTER */}
                <div className="p-6 border-t border-gray-100 bg-white shrink-0">
                    {isSubmittedView && !isEditing ? (
                        <button 
                            onClick={() => setIsEditing(true)}
                            className="w-full py-4 bg-[var(--dmg-blue)] text-white rounded-xl text-sm font-black uppercase tracking-widest hover:brightness-110 transition-all shadow-lg shadow-blue-100"
                        >
                            Want to edit?
                        </button>
                    ) : (
                        <button 
                            onClick={handleSubmit}
                            disabled={isSubmitting || isPastWeek || !staffName || !managerName}
                            className="w-full py-4 bg-[var(--brand-black)] text-white rounded-xl text-sm font-black uppercase tracking-widest hover:bg-[var(--dmg-blue)] transition-all disabled:bg-gray-200"
                        >
                            {isSubmitting ? 'Syncing...' : (isEditing ? 'Update Patterns' : 'Submit Patterns')}
                        </button>
                    )}
                    {isPastWeek && <p className="text-[10px] text-center mt-3 text-red-400 font-bold uppercase tracking-wider">Note: This week is locked for historical records.</p>}
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
