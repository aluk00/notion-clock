
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMG Rota Request | Live Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: transparent;
      }
      .pills-scroller::-webkit-scrollbar {
        display: none;
      }
      .pills-scroller {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      @keyframes slideDown { 
        from { opacity: 0; transform: translateY(-10px); } 
        to { opacity: 1; transform: translateY(0); } 
      }
      .animate-slideDown {
        animation: slideDown 0.3s ease;
      }
      @keyframes fadeIn { 
        from { opacity: 0; } 
        to { opacity: 1; } 
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease;
      }
      .autocomplete-scroller::-webkit-scrollbar {
          width: 6px;
      }
      .autocomplete-scroller::-webkit-scrollbar-track {
          background: #f1f1f1;
      }
      .autocomplete-scroller::-webkit-scrollbar-thumb {
          background: #ccc;
          border-radius: 6px;
      }
      .autocomplete-scroller::-webkit-scrollbar-thumb:hover {
          background: #aaa;
      }

      /* Dot loading animation */
      @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.6; transform: scale(0.9); }
      }
      .dot-animate-1 { animation: pulse 1.4s infinite ease-in-out; animation-delay: 0s; }
      .dot-animate-2 { animation: pulse 1.4s infinite ease-in-out; animation-delay: 0.2s; }
      .dot-animate-3 { animation: pulse 1.4s infinite ease-in-out; animation-delay: 0.2s; }
      .dot-animate-4 { animation: pulse 1.4s infinite ease-in-out; animation-delay: 0.4s; }

      /* Animated checkmark */
      .checkmark {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: block;
        stroke-width: 3;
        stroke: #fff;
        stroke-miterlimit: 10;
        box-shadow: inset 0px 0px 0px #E6468B;
        animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
      }
      .checkmark__circle {
          stroke-dasharray: 166;
          stroke-dashoffset: 166;
          stroke-width: 3;
          stroke-miterlimit: 10;
          stroke: #E6468B;
          fill: none;
          animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
      }
      .checkmark__check {
          transform-origin: 50% 50%;
          stroke-dasharray: 48;
          stroke-dashoffset: 48;
          animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
      }
      @keyframes stroke {
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scale {
        0%, 100% { transform: none; }
        50% { transform: scale3d(1.1, 1.1, 1); }
      }
      @keyframes fill {
        100% { box-shadow: inset 0px 0px 0px 32px #E6468B; }
      }
    </style>
  <script type="importmap">
  {
    "imports": {
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "firebase/app": "https://esm.sh/firebase@10.12.2/app",
      "firebase/firestore": "https://esm.sh/firebase@10.12.2/firestore",
      "firebase/auth": "https://esm.sh/firebase@10.12.2/auth",
      "react": "https://esm.sh/react@18.3.1"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
  <body class="p-5 flex justify-center bg-transparent overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useCallback, useMemo, useRef } from 'react';
      import ReactDOM from 'react-dom/client';
      import { initializeApp } from "firebase/app";
      import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "firebase/firestore";
      import { getAuth, signInAnonymously } from "firebase/auth";

      // --- FIREBASE CONFIGURATION ---
      const firebaseConfig = {
          apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
          authDomain: "dmg-command-centre-native.firebaseapp.com",
          projectId: "dmg-command-centre-native",
          storageBucket: "dmg-command-centre-native.firebasestorage.app",
          messagingSenderId: "223535956454",
          appId: "1:223535956454:web:b25e5bc69d8a4a7f209627",
          measurementId: "G-5HNGPRJGZY"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      const appId = 'dmg-command-centre-native';

      // --- CONSTANTS & HELPERS ---
      const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
      const LOCATIONS = ['Office', 'WFH', 'Shoot', 'Off-Site', 'PTO'];
      const WEEKEND_LOCATIONS = ['Weekend', 'Shoot'];

      const getNextMonday = () => {
          const d = new Date();
          d.setHours(0, 0, 0, 0); // Normalize to the start of the day
          const day = d.getDay();
          // if Sunday (0), we want next Monday (+1 day). If Monday (1), we want next Monday (+7 days), etc.
          const diff = day === 0 ? 1 : 8 - day;
          d.setDate(d.getDate() + diff);
          return d;
      };


      const formatDate = (date) => {
          return date.toLocaleString('en-GB', { day: 'numeric', month: 'short' });
      };

      const createInitialSelections = () => {
          return DAYS.reduce((acc, day) => {
              if (day === 'Saturday' || day === 'Sunday') {
                  acc[day] = { status: 'Weekend', fullDay: true, start: '09:00', end: '17:30' };
              } else {
                  acc[day] = { status: 'Office', fullDay: true, start: '09:00', end: '17:30' };
              }
              return acc;
          }, {});
      };

      // --- UI COMPONENTS ---
      const DotGrid = ({ brandColor = 'bg-[#E6468B]' }) => (
          <div className="grid grid-cols-2 gap-0.5 w-fit">
              <span className={`w-2 h-2 rounded-full ${brandColor}`}></span>
              <span className={`w-2 h-2 rounded-full ${brandColor}`}></span>
              <span className={`w-2 h-2 rounded-full ${brandColor}`}></span>
              <span className={`w-2 h-2 rounded-full ${brandColor}`}></span>
          </div>
      );

      const AnimatedCheckmark = () => (
          <svg className="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
              <circle className="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
              <path className="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
          </svg>
      );

      const LoadingOverlay = ({ isVisible }) => {
          if (!isVisible) return null;
          return (
              <div className="absolute inset-0 bg-white/80 backdrop-blur-md flex flex-col items-center justify-center z-50 animate-fadeIn">
                  <div className="grid grid-cols-2 gap-1.5 w-fit">
                      <span className="w-3 h-3 rounded-full bg-[#E6468B] dot-animate-1"></span>
                      <span className="w-3 h-3 rounded-full bg-[#E6468B] dot-animate-2"></span>
                      <span className="w-3 h-3 rounded-full bg-[#E6468B] dot-animate-3"></span>
                      <span className="w-3 h-3 rounded-full bg-[#E6468B] dot-animate-4"></span>
                  </div>
              </div>
          );
      };

      const ShootDetails = ({ day, selection, onToggleFullDay, onTimeChange, isPast }) => (
          <div className="bg-gray-50 p-4 rounded-xl mt-2.5 animate-slideDown">
              <div className="flex items-center justify-between mb-2.5">
                  <span className="text-xs font-bold text-gray-500">Full Day Shoot?</span>
                  <button
                      onClick={() => onToggleFullDay(day)}
                      className={`px-3 py-1 text-[10px] rounded-md font-black uppercase transition-colors ${selection.fullDay ? 'bg-[#21a0d8] text-white' : 'bg-gray-200 text-gray-700'} disabled:opacity-50 disabled:cursor-not-allowed`}
                      disabled={isPast}
                  >
                      {selection.fullDay ? 'Yes' : 'No'}
                  </button>
              </div>
              {!selection.fullDay && (
                  <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-gray-500">On-Site Times</span>
                      <div className="flex items-center gap-2">
                          <input type="time" className="p-1.5 rounded-md border border-gray-200 text-xs font-bold w-24 disabled:bg-gray-100 disabled:opacity-70 disabled:cursor-not-allowed" value={selection.start} onChange={(e) => onTimeChange(day, 'start', e.target.value)} disabled={isPast} />
                          <span className="text-xs font-black">-</span>
                          <input type="time" className="p-1.5 rounded-md border border-gray-200 text-xs font-bold w-24 disabled:bg-gray-100 disabled:opacity-70 disabled:cursor-not-allowed" value={selection.end} onChange={(e) => onTimeChange(day, 'end', e.target.value)} disabled={isPast} />
                      </div>
                  </div>
              )}
          </div>
      );

      const DayRow = ({ day, date, selection, onSelectLocation, onToggleFullDay, onTimeChange, isPast }) => {
          const availableLocations = ['Saturday', 'Sunday'].includes(day) ? WEEKEND_LOCATIONS : LOCATIONS;

          return (
              <div className="mb-6 pb-6 border-b border-gray-100 last:border-b-0">
                  <h3 className="text-sm font-extrabold">{day}</h3>
                  <span className="text-[10px] font-bold text-[#E6468B] uppercase mb-3 block">{formatDate(date)}</span>
                  <div className="flex gap-2 overflow-x-auto py-4 px-2 mb-3 pills-scroller">
                      {availableLocations.map(loc => {
                          const isSelected = selection.status === loc;
                          let buttonClasses = 'shrink-0 px-4 py-2 rounded-full text-[11px] font-extrabold border-[1.5px] transition-all duration-300 disabled:opacity-60 disabled:cursor-not-allowed ';

                          if (isSelected) {
                              if (loc === 'Weekend') {
                                  buttonClasses += 'bg-gray-600 text-white border-gray-600 shadow-[0_0_10px_rgba(107,114,128,0.4)]';
                              } else {
                                  buttonClasses += 'bg-[#E6468B] text-white border-[#E6468B] shadow-[0_0_10px_rgba(230,70,139,0.4)]';
                              }
                          } else {
                              buttonClasses += 'bg-white text-gray-600 border-gray-200';
                          }

                          return (
                              <button
                                  key={loc}
                                  onClick={() => onSelectLocation(day, loc)}
                                  className={buttonClasses}
                                  disabled={isPast}
                              >
                                  {loc}
                              </button>
                          );
                      })}
                  </div>
                  {selection.status === 'Shoot' && <ShootDetails day={day} selection={selection} onToggleFullDay={onToggleFullDay} onTimeChange={onTimeChange} isPast={isPast} />}
              </div>
          );
      }

      const Overlay = ({ isVisible, children }) => {
        if (!isVisible) return null;
        return (
          <div className="absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center z-50 text-center p-10">
            {children}
          </div>
        );
      };

      const StaffAutocomplete = ({ staffDirectory, value, onChange, placeholder }) => {
          const [filteredStaff, setFilteredStaff] = useState(staffDirectory);
          const [showDropdown, setShowDropdown] = useState(false);
          const wrapperRef = useRef(null);

          useEffect(() => {
              if (!value) {
                  setFilteredStaff(staffDirectory);
              } else {
                  setFilteredStaff(
                      staffDirectory.filter(s =>
                          `${s.firstName} ${s.lastName}`.toLowerCase().includes(value.toLowerCase())
                      )
                  );
              }
          }, [value, staffDirectory]);

          useEffect(() => {
              function handleClickOutside(event) {
                  if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                      setShowDropdown(false);
                  }
              }
              document.addEventListener("mousedown", handleClickOutside);
              return () => document.removeEventListener("mousedown", handleClickOutside);
          }, [wrapperRef]);

          const handleSelect = (name) => {
              onChange(name);
              setShowDropdown(false);
          };

          return (
              <div className="relative" ref={wrapperRef}>
                  <input
                      type="text"
                      value={value}
                      onChange={(e) => onChange(e.target.value)}
                      onFocus={() => setShowDropdown(true)}
                      placeholder={placeholder}
                      autoComplete="off"
                      className="w-full p-3 text-sm font-bold border-2 border-gray-200 rounded-lg bg-gray-50 outline-none focus:border-[#E6468B] focus:bg-white transition"
                  />
                  {showDropdown && filteredStaff.length > 0 && (
                      <ul className="absolute z-10 w-full mt-1 bg-white border-2 border-gray-200 rounded-lg shadow-lg max-h-60 overflow-y-auto animate-slideDown autocomplete-scroller">
                          {filteredStaff.map(s => (
                              <li
                                  key={s.id}
                                  onMouseDown={(e) => {
                                      e.preventDefault();
                                      handleSelect(`${s.firstName} ${s.lastName}`);
                                  }}
                                  className="px-4 py-3 text-sm font-medium text-gray-700 cursor-pointer hover:bg-gray-100 transition-colors"
                              >
                                  {s.firstName} {s.lastName}
                              </li>
                          ))}
                      </ul>
                  )}
              </div>
          );
      };

      // --- MAIN APP COMPONENT ---
      function App() {
          const [staffDirectory, setStaffDirectory] = useState([]);
          const [selections, setSelections] = useState(createInitialSelections());
          const [staffName, setStaffName] = useState('');
          const [manager, setManager] = useState('');
          const [weekCommencing, setWeekCommencing] = useState('');
          const [weekCommencingDate, setWeekCommencingDate] = useState(null);
          const [initialMonday, setInitialMonday] = useState(null);


          const [isLoading, setIsLoading] = useState(false);
          const [toastMessage, setToastMessage] = useState(null);
          const [showAlreadySubmitted, setShowAlreadySubmitted] = useState(false);
          const [showSuccess, setShowSuccess] = useState(false);

          const managers = useMemo(() => {
              const managerSet = new Set(staffDirectory.filter(s => s.isManager).map(s => `${s.firstName} ${s.lastName}`));
              if (!managerSet.has("Anaïs Lukaku")) {
                  managerSet.add("Anaïs Lukaku");
              }
              return Array.from(managerSet).sort();
          }, [staffDirectory]);

          const showToast = (message) => {
              setToastMessage(message);
              setTimeout(() => setToastMessage(null), 2000);
          };
          
          useEffect(() => {
              const monday = getNextMonday();
              setWeekCommencingDate(monday);
              setInitialMonday(monday);

              const init = async () => {
                  try {
                      await signInAnonymously(auth);
                      const staffRef = collection(db, 'artifacts', appId, 'public', 'data', 'staff_directory');
                      onSnapshot(staffRef, (snap) => {
                          const staffData = [];
                          snap.forEach(doc => staffData.push({ id: doc.id, ...doc.data() }));
                          staffData.sort((a, b) => 
                              `${a.firstName} ${a.lastName}`.localeCompare(`${b.firstName} ${b.lastName}`)
                          );
                          setStaffDirectory(staffData);
                      });
                  } catch (error) {
                      console.error("Firebase initialization error:", error);
                      showToast("Error connecting to server.");
                  }
              };
              init();
          }, []);

          useEffect(() => {
              if (weekCommencingDate) {
                  setWeekCommencing(weekCommencingDate.toISOString().split('T')[0]);
              }
          }, [weekCommencingDate]);
          
          const handleNameChange = useCallback((name) => {
              setStaffName(name);
              const selectedStaff = staffDirectory.find(s => `${s.firstName} ${s.lastName}` === name);
              if (selectedStaff && selectedStaff.manager) {
                  setManager(selectedStaff.manager);
              } else if (!selectedStaff) {
                  setManager('');
              }
          }, [staffDirectory]);

          useEffect(() => {
              const checkForSubmission = async () => {
                  setShowAlreadySubmitted(false);
                  setSelections(createInitialSelections()); // Reset to default before fetching new data

                  if (!staffName || staffName.length < 3 || !weekCommencing || !weekCommencingDate || !initialMonday) return;
          
                  const selectedStaff = staffDirectory.find(s => `${s.firstName} ${s.lastName}` === staffName);
                  if (!selectedStaff) return;
          
                  const submissionId = `${weekCommencing}_${staffName.replace(/\s+/g, '_')}`;
                  const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rota_submissions', submissionId);
                  const docSnap = await getDoc(docRef);
          
                  if (docSnap.exists()) {
                      const data = docSnap.data();
                      
                      if (data.schedule && Array.isArray(data.schedule) && data.schedule.length === DAYS.length) {
                          const loadedSelections = DAYS.reduce((acc, day, index) => {
                              acc[day] = data.schedule[index];
                              return acc;
                          }, {});
                          setSelections(loadedSelections);
                      }

                      if (data.manager) setManager(data.manager);

                      const isPast = weekCommencingDate.getTime() < initialMonday.getTime();
                      if (!isPast) {
                          setShowAlreadySubmitted(true);
                      }
                  }
              };
              checkForSubmission();
          }, [staffName, weekCommencing, staffDirectory, initialMonday, weekCommencingDate]);

          const handleUnlockForEdit = () => {
              setShowAlreadySubmitted(false);
              showToast("Edit mode active");
          };

          const handleSelectLocation = (day, location) => {
              setSelections(prev => ({ ...prev, [day]: { ...prev[day], status: location } }));
          };

          const handleToggleFullDay = (day) => {
              setSelections(prev => ({ ...prev, [day]: { ...prev[day], fullDay: !prev[day].fullDay } }));
          };

          const handleTimeChange = (day, type, value) => {
              setSelections(prev => ({ ...prev, [day]: { ...prev[day], [type]: value } }));
          };

          const handlePreviousWeek = () => {
              if (!weekCommencingDate) return;
              const newDate = new Date(weekCommencingDate);
              newDate.setDate(newDate.getDate() - 7);
              setWeekCommencingDate(newDate);
          };
          
          const handleNextWeek = () => {
              if (!weekCommencingDate) return;
              const newDate = new Date(weekCommencingDate);
              newDate.setDate(newDate.getDate() + 7);
              setWeekCommencingDate(newDate);
          };

          const handleSubmit = async () => {
              if (!staffName || !manager) {
                  alert("Please enter your name and select a manager.");
                  return;
              }
              setIsLoading(true);
              const submissionId = `${weekCommencing}_${staffName.replace(/\s+/g, '_')}`;
              const submissionData = {
                  name: staffName,
                  manager,
                  weekId: weekCommencing,
                  schedule: DAYS.map(d => selections[d]),
                  submittedAt: new Date().toISOString()
              };
              
              try {
                  // Simulate network delay for animation
                  await new Promise(resolve => setTimeout(resolve, 1500));
                  await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rota_submissions', submissionId), submissionData);
                  setShowSuccess(true);
              } catch (e) {
                  console.error(e);
                  alert("Error: " + (e instanceof Error ? e.message : "An unknown error occurred."));
              } finally {
                  setIsLoading(false);
              }
          };

          const resetForm = () => {
              setShowSuccess(false);
              setStaffName('');
              setManager('');
              setSelections(createInitialSelections());
              setWeekCommencingDate(initialMonday);
              showToast("Form reset.");
          };

          const isPastWeek = weekCommencingDate && initialMonday && weekCommencingDate.getTime() < initialMonday.getTime();

          return (
              <div className="bg-white w-full max-w-md h-[92vh] flex flex-col rounded-2xl shadow-2xl shadow-gray-500/10 border border-gray-200 overflow-hidden relative font-sans text-gray-800">
                  {/* Header Section */}
                  <div className="p-6 border-b border-gray-200 bg-white">
                      <div className="flex items-center gap-3 mb-4">
                          <DotGrid />
                          <h1 className="text-xl font-black uppercase tracking-tighter">Rota Request</h1>
                      </div>
                      <div className="space-y-4">
                          <div className="input-group">
                              <label className="text-[10px] font-extrabold text-gray-400 uppercase tracking-wider mb-1.5 block">Your Name</label>
                              <StaffAutocomplete
                                  staffDirectory={staffDirectory}
                                  value={staffName}
                                  onChange={handleNameChange}
                                  placeholder="Start typing name..."
                              />
                          </div>
                          <div className="input-group">
                              <label className="text-[10px] font-extrabold text-gray-400 uppercase tracking-wider mb-1.5 block">Line Manager</label>
                              <select
                                  value={manager}
                                  onChange={(e) => setManager(e.target.value)}
                                  disabled
                                  className="w-full p-3 text-sm font-bold border-2 border-gray-200 rounded-lg bg-gray-50 outline-none focus:border-[#E6468B] focus:bg-white transition appearance-none disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed"
                              >
                                  <option value="" disabled>Select Manager...</option>
                                  {managers.map(m => <option key={m} value={m}>{m}</option>)}
                              </select>
                          </div>
                      </div>
                  </div>

                  {/* Week Navigator */}
                  <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white">
                      <button
                          onClick={handlePreviousWeek}
                          className="bg-[#E6468B] text-white p-2 rounded-full disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                          aria-label="Previous week"
                      >
                          <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M15 19l-7-7 7-7" />
                          </svg>
                      </button>
                      <span className="text-sm font-black text-[#E6468B] uppercase">
                          w/c {weekCommencingDate && formatDate(weekCommencingDate)}
                      </span>
                      <button
                          onClick={handleNextWeek}
                          className="bg-[#E6468B] text-white p-2 rounded-full transition-colors"
                          aria-label="Next week"
                      >
                          <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M9 5l7 7-7 7" />
                          </svg>
                      </button>
                  </div>


                  {/* Scrollable Content */}
                  <div className="flex-1 overflow-y-auto p-6 bg-white">
                      {DAYS.map((day, i) => {
                          const currentDay = new Date((weekCommencingDate?.getTime() || 0) + i * 24 * 60 * 60 * 1000);
                          return (
                              <DayRow
                                  key={day + weekCommencing}
                                  day={day}
                                  date={currentDay}
                                  selection={selections[day]}
                                  onSelectLocation={handleSelectLocation}
                                  onToggleFullDay={handleToggleFullDay}
                                  onTimeChange={handleTimeChange}
                                  isPast={!!isPastWeek}
                              />
                          );
                      })}
                  </div>

                  {/* Footer */}
                  <div className="p-6 border-t border-gray-200 bg-white">
                      <button
                          onClick={handleSubmit}
                          disabled={isLoading || isPastWeek}
                          className="w-full bg-[#E6468B] text-white p-4 rounded-xl text-[13px] font-black uppercase tracking-widest cursor-pointer transition-all hover:brightness-110 hover:-translate-y-0.5 disabled:bg-gray-400 disabled:cursor-not-allowed"
                      >
                          {isPastWeek ? 'Viewing Past Rota' : (isLoading ? "Syncing..." : "Submit")}
                      </button>
                  </div>
                  
                  {/* Overlays */}
                  <LoadingOverlay isVisible={isLoading} />

                  <Overlay isVisible={showAlreadySubmitted}>
                      <DotGrid />
                      <h2 className="font-black text-2xl mt-5 mb-2">ALREADY SUBMITTED</h2>
                      <p className="text-gray-600 text-sm">You have already logged a rota for the week commencing <span className="font-bold">{weekCommencingDate && formatDate(weekCommencingDate)}</span>.</p>
                      <button onClick={handleUnlockForEdit} className="mt-6 bg-[#21a0d8] text-white px-6 py-3 rounded-full font-extrabold text-xs uppercase">Want to edit?</button>
                  </Overlay>

                  <Overlay isVisible={showSuccess}>
                      <AnimatedCheckmark />
                      <h2 className="font-black text-2xl mb-2 mt-4">SUBMITTED</h2>
                      <p className="text-gray-600 text-sm">
                          <span className="font-bold">{staffName}</span> has been submitted for w/c <span className="font-bold">{weekCommencingDate && formatDate(weekCommencingDate)}</span>.
                      </p>
                      <button onClick={resetForm} className="mt-6 bg-black text-white px-6 py-3 rounded-full font-extrabold text-xs uppercase">Submit Another</button>
                  </Overlay>
                  
                  {/* Toast Notification */}
                  {toastMessage && (
                      <div className="fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white px-5 py-2.5 rounded-full text-[11px] font-extrabold z-[100] transition-all duration-300 animate-slide-up">
                          {toastMessage}
                      </div>
                  )}
              </div>
          );
      }
      
      const rootElement = document.getElementById('root');
      if (!rootElement) {
        throw new Error("Could not find root element to mount to");
      }

      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
