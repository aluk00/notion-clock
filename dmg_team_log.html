<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Rota Request | Live Cloud</title>
    <style>
        :root {
            --brand-black: #000000;
            --brand-pink: #E6468B;
            --brand-blue: #21a0d8;
            --bg-grey: #FAFAFA;
            --border: #E0E0E0;
            --text-main: #111;
            --text-sub: #666;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body { font-family: 'Inter', sans-serif; background-color: transparent; margin: 0; padding: 20px; color: var(--text-main); height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        
        .widget-card { 
            background: #FFFFFF; width: 100%; max-width: 420px; height: 92vh; 
            display: flex; flex-direction: column; border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 1px solid var(--border); 
            overflow: hidden; position: relative; 
        }

        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 4px; width: fit-content; }
        .dot-grid span { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-pink); }

        .header { padding: 24px; border-bottom: 1px solid var(--border); background: #FFF; }
        .title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .title-row h1 { font-size: 20px; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: -0.02em; }
        
        .input-group { margin-top: 15px; position: relative; }
        .input-label { font-size: 10px; font-weight: 800; color: #999; text-transform: uppercase; margin-bottom: 6px; display: block; letter-spacing: 0.05em; }
        
        .styled-input, .styled-select { 
            width: 100%; padding: 12px; font-size: 14px; font-weight: 700; 
            border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg-grey); 
            box-sizing: border-box; outline: none; transition: 0.2s;
        }
        .styled-input:focus { border-color: var(--brand-pink); background: #FFF; }

        .scroll-content { flex: 1; overflow-y: auto; padding: 24px; background: #FFF; }
        .day-row { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #f5f5f5; }
        .day-title { font-size: 14px; font-weight: 800; margin-bottom: 2px; }
        .day-date { font-size: 10px; font-weight: 700; color: var(--brand-pink); text-transform: uppercase; margin-bottom: 12px; display: block; }
        
        .pills-scroller { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; margin-bottom: 12px; }
        .pills-scroller::-webkit-scrollbar { display: none; }
        
        .loc-pill { 
            flex-shrink: 0; padding: 8px 16px; border-radius: 20px; font-size: 11px; 
            font-weight: 800; border: 1.5px solid var(--border); cursor: pointer; 
            background: #fff; transition: var(--transition); color: #888;
        }
        .loc-pill.selected { background: var(--brand-pink); color: #fff; border-color: var(--brand-pink); box-shadow: 0 4px 12px rgba(230, 70, 139, 0.3); }

        /* SHOOT DETAILS */
        .shoot-meta { background: var(--bg-grey); padding: 15px; border-radius: 12px; margin-top: 10px; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .meta-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .meta-label { font-size: 11px; font-weight: 700; color: #666; }
        .time-inputs { display: flex; align-items: center; gap: 8px; }
        .time-box { padding: 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-weight: 700; width: 80px; }

        .toggle-btn { background: #EEE; border: none; padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .toggle-btn.active { background: var(--brand-blue); color: #FFF; }

        .footer { padding: 20px 24px; border-top: 1px solid var(--border); background: #FFF; }
        .submit-btn { 
            width: 100%; background: var(--brand-black); color: #fff; border: none; 
            padding: 16px; border-radius: 12px; font-size: 13px; font-weight: 900; 
            text-transform: uppercase; cursor: pointer; transition: 0.2s; letter-spacing: 0.1em;
        }
        .submit-btn:hover { transform: translateY(-2px); background: var(--brand-pink); }

        /* OVERLAYS */
        .overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(4px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 40px; }
        .overlay.active { display: flex; }
        
        .edit-btn { background: var(--brand-blue); color: #FFF; border: none; padding: 12px 24px; border-radius: 99px; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #000; color: #FFF; padding: 10px 20px; border-radius: 99px; font-size: 11px; font-weight: 800; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 1000; }
        #toast.visible { opacity: 1; bottom: 30px; }
    </style>
</head>
<body>

<div id="toast">Update Successful</div>

<div class="widget-card">
    <div class="header">
        <div class="title-row">
            <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
            <h1>Rota Request</h1>
        </div>
        
        <div class="input-group">
            <label class="input-label">Your Name</label>
            <input type="text" id="staff-name" list="staff-list" class="styled-input" placeholder="Start typing name..." oninput="checkExistingSubmission()">
            <datalist id="staff-list"></datalist>
        </div>
        
        <div class="input-group">
            <label class="input-label">Line Manager</label>
            <select id="manager-select" class="styled-select">
                <option value="" disabled selected>Select Manager...</option>
            </select>
        </div>
    </div>

    <div class="scroll-content" id="days-mount"></div>

    <div class="footer">
        <button class="submit-btn" id="submit-btn" onclick="submitRota()">Submit</button>
    </div>

    <div id="already-submitted-overlay" class="overlay">
        <div class="dot-grid" style="margin-bottom: 20px;"><span></span><span></span><span></span><span></span></div>
        <h2 style="font-weight:900;">ALREADY SUBMITTED</h2>
        <p>You have already logged a rota for the week commencing <span id="wc-date-display"></span>.</p>
        <button class="edit-btn" onclick="unlockForEdit()">Want to edit?</button>
    </div>

    <div id="success-overlay" class="overlay">
        <div style="font-size: 40px; margin-bottom: 15px;">✅</div>
        <h2 style="font-weight:900;">LOGGED</h2>
        <p>Your patterns have been synced to the cloud for next week.</p>
        <button class="edit-btn" style="background:#000" onclick="location.reload()">Done</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
      authDomain: "dmg-command-centre-native.firebaseapp.com",
      projectId: "dmg-command-centre-native",
      storageBucket: "dmg-command-centre-native.firebasestorage.app",
      messagingSenderId: "223535956454",
      appId: "1:223535956454:web:b25e5bc69d8a4a7f209627",
      measurementId: "G-5HNGPRJGZY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const appId = 'dmg-command-centre-native';

    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    const locs = ['Office', 'WFH', 'Shoot', 'Client / Travel', 'PTO'];
    
    // Complex state for selections
    let selections = {};
    days.forEach(d => {
        selections[d] = { status: 'Office', fullDay: true, start: '09:00', end: '17:30' };
    });

    let weekCommencing = "";
    let staffDirectory = [];

    function getNextMonday() {
        const d = new Date();
        const day = d.getDay();
        const diff = (day === 0) ? 1 : 8 - day;
        return new Date(d.getTime() + diff * 24 * 60 * 60 * 1000);
    }

    function formatDate(date) {
        return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    window.onload = async () => {
        await signInAnonymously(auth);
        const monday = getNextMonday();
        weekCommencing = monday.toISOString().split('T')[0];
        document.getElementById('wc-date-display').innerText = formatDate(monday);

        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'staff_directory'), (snap) => {
            staffDirectory = [];
            snap.forEach(doc => staffDirectory.push(doc.data()));
            populateLists();
        });

        renderDays();
    };

    function populateLists() {
        const listMount = document.getElementById('staff-list');
        const mgrMount = document.getElementById('manager-select');
        listMount.innerHTML = staffDirectory.map(s => `<option value="${s.firstName} ${s.lastName}">`).join('');
        const managers = [...new Set(staffDirectory.filter(s => s.isManager).map(s => `${s.firstName} ${s.lastName}`))].sort();
        
        // Manual override for Anais as requested
        if(!managers.includes("Anaïs Lukaku")) managers.push("Anaïs Lukaku");

        mgrMount.innerHTML = '<option value="" disabled selected>Select Manager...</option>' + 
            managers.map(m => `<option value="${m}">${m}</option>`).join('');
    }

    window.renderDays = () => {
        const monday = getNextMonday();
        document.getElementById('days-mount').innerHTML = days.map((d, i) => {
            const currentDay = new Date(monday.getTime() + i * 24 * 60 * 60 * 1000);
            const sel = selections[d];
            return `
                <div class="day-row">
                    <div class="day-title">${d}</div>
                    <span class="day-date">${formatDate(currentDay)}</span>
                    <div class="pills-scroller">
                        ${locs.map(l => `
                            <div class="loc-pill ${sel.status===l?'selected':''}" onclick="selectLoc('${d}','${l}')">${l}</div>
                        `).join('')}
                    </div>
                    
                    ${sel.status === 'Shoot' ? `
                        <div class="shoot-meta">
                            <div class="meta-row">
                                <span class="meta-label">Full Day Shoot?</span>
                                <button class="toggle-btn ${sel.fullDay ? 'active' : ''}" onclick="toggleFullDay('${d}')">
                                    ${sel.fullDay ? 'Yes' : 'No'}
                                </button>
                            </div>
                            ${!sel.fullDay ? `
                                <div class="meta-row">
                                    <span class="meta-label">On-Site Times</span>
                                    <div class="time-inputs">
                                        <input type="time" class="time-box" value="${sel.start}" onchange="updateTime('${d}', 'start', this.value)">
                                        <span style="font-size:10px; font-weight:900;">-</span>
                                        <input type="time" class="time-box" value="${sel.end}" onchange="updateTime('${d}', 'end', this.value)">
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    window.selectLoc = (day, val) => { selections[day].status = val; renderDays(); };
    window.toggleFullDay = (day) => { selections[day].fullDay = !selections[day].fullDay; renderDays(); };
    window.updateTime = (day, key, val) => { selections[day][key] = val; };

    window.checkExistingSubmission = async () => {
        const name = document.getElementById('staff-name').value.trim();
        if(name.length < 3) return;
        const submissionId = `${weekCommencing}_${name.replace(/\s+/g, '_')}`;
        const docSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rota_submissions', submissionId));
        if (docSnap.exists()) {
            document.getElementById('already-submitted-overlay').classList.add('active');
            if(docSnap.data().manager) document.getElementById('manager-select').value = docSnap.data().manager;
        }
    };

    window.unlockForEdit = () => {
        document.getElementById('already-submitted-overlay').classList.remove('active');
        showToast("Edit mode active");
    };

    window.submitRota = async () => {
        const name = document.getElementById('staff-name').value.trim();
        const mgr = document.getElementById('manager-select').value;
        const btn = document.getElementById('submit-btn');

        if(!name || !mgr) return alert("Enter your name and select a manager.");

        btn.disabled = true;
        btn.innerText = "Syncing...";

        const submissionId = `${weekCommencing}_${name.replace(/\s+/g, '_')}`;

        try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rota_submissions', submissionId), {
                name, manager: mgr, weekId: weekCommencing,
                schedule: days.map(d => selections[d]),
                submittedAt: new Date().toISOString()
            });
            document.getElementById('success-overlay').classList.add('active');
        } catch (e) {
            alert("Error: " + e.message);
            btn.disabled = false;
        }
    };

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.classList.add('visible');
        setTimeout(() => t.classList.remove('visible'), 2000);
    }
</script>
</body>
</html>
