<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMG Rota Request | Live Cloud</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      :root {
          --brand-black: #1f2937;
          --brand-pink: #E6468B;
          --dmg-blue: #21a0d8;
          --border: #EAECEF;
          --text-main: #1f2937;
          --text-sub: #6b7280;
          --bg-grey: #f9fafb;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: transparent;
        margin: 0;
        padding: 20px;
        height: 100vh;
        display: flex;
        justify-content: center;
        overflow: hidden;
        color: var(--text-main);
      }
      .widget-card {
        max-width: 440px;
      }

      @keyframes heartbeat { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
      .dot-anim { animation: heartbeat 3s infinite ease-in-out; }
      .dot-anim:nth-child(1) { animation-delay: 0s; }
      .dot-anim:nth-child(2) { animation-delay: 0.75s; }
      .dot-anim:nth-child(4) { animation-delay: 1.5s; }
      .dot-anim:nth-child(3) { animation-delay: 2.25s; }

      @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slideDown { animation: slideDown 0.3s ease-out forwards; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
      
      @keyframes pulse-soft { 
          0%, 100% { transform: scale(1); opacity: 1; } 
          50% { transform: scale(1.05); opacity: 0.8; } 
      }
      .status-pulse { animation: pulse-soft 2s infinite ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        // --- FIREBASE SERVICES ---
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        let db;
        let auth;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            auth = firebase.auth();

            auth.signInAnonymously().catch((error) => {
                console.error("Anonymous sign-in failed:", error);
            });
        } catch (e) {
            console.error("Firebase initialization error:", e);
        }

        const appId = 'dmg-command-centre-native';
        const staffDirectoryCollection = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('staff_directory');
        const rotaSubmissionsCollection = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rota_submissions');
        const managerCorrectionsCollection = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('manager_corrections');

        const normalize = (n) => n ? n.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase() : "";

        const onStaffDirectorySnapshot = (callback) => {
            return staffDirectoryCollection.onSnapshot((snapshot) => {
                const staffList = [];
                snapshot.forEach(doc => {
                    staffList.push({ id: doc.id, ...doc.data() });
                });
                callback(staffList);
            });
        };

        const onRotaSubmissionsSnapshot = (callback) => {
            return rotaSubmissionsCollection.onSnapshot((snapshot) => {
                const submissionList = [];
                snapshot.forEach(doc => {
                    submissionList.push(doc.data());
                });
                callback(submissionList);
            });
        };

        const submitRota = (payload) => {
            const docId = `${payload.weekId}_${normalize(payload.name).replace(/\s+/g, "_")}`;
            const docRef = rotaSubmissionsCollection.doc(docId);
            return docRef.set(payload);
        };

        const submitManagerCorrection = (payload) => {
            return managerCorrectionsCollection.add(payload);
        };

        // --- COMPONENTS ---
        const DotGrid = ({ color = "var(--dmg-blue)" }) => (
            <div className="grid grid-cols-2 gap-1 w-fit">
                {[...Array(4)].map((_, i) => (
                    <span key={i} className="dot-anim w-1.5 h-1.5 rounded-full" style={{ backgroundColor: color }}></span>
                ))}
            </div>
        );

        const SuccessView = ({ onDone, mondayDate, correctionSubmitted }) => (
            <div className="bg-white/95 backdrop-blur-sm w-full max-w-sm h-[92vh] rounded-2xl shadow-lg border border-[--border] flex flex-col items-center justify-center p-8 text-center animate-fadeIn relative">
                <button onClick={onDone} className="absolute top-6 left-6 text-sm font-bold text-gray-500 hover:text-gray-800 transition-all">&lt; Back</button>
                <div className="w-16 h-16 rounded-full bg-green-50 flex items-center justify-center mb-6">
                    <svg className="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 className="text-2xl font-black uppercase text-gray-800 mb-2">Sync Successful</h2>
                <p className="text-sm text-gray-500 font-medium mb-4">Your working pattern for w/c {fmtShort(mondayDate)} has been submitted.</p>
                {correctionSubmitted && (
                     <p className="text-xs text-amber-600 font-bold p-3 bg-amber-50 border border-amber-200 rounded-lg">Your manager correction has been submitted for review.</p>
                )}
                <div className="mt-8">
                    <button onClick={onDone} className="text-xs font-black uppercase text-gray-400 tracking-widest hover:text-[--dmg-blue] transition-all">Need to edit?</button>
                </div>
            </div>
        );

        const SubmittedBanner = ({ submission }) => (
            <div className="bg-white border-b border-gray-100 px-6 py-4 animate-fadeIn shrink-0 flex items-center justify-between">
                <div className="flex items-center gap-4">
                    <div className="status-pulse bg-green-500 w-2 h-2 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
                    <div>
                        <h2 className="text-[11px] font-black uppercase text-gray-800 tracking-wider">Already Submitted</h2>
                        <p className="text-[10px] font-bold text-gray-400">
                            Logged: {new Date(submission.submittedAt).toLocaleDateString('en-GB')} @ {new Date(submission.submittedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </p>
                    </div>
                </div>
                <DotGrid color="#DDD" />
            </div>
        );

        const DayRow = ({ day, date, selection, isWeekend, isDisabled, onUpdate }) => {
            const locs = ["Office", "WFH", "Shoot", "Off-Site", "PTO"];
            const weekendLocs = ["Weekend", "Shoot", "Off-Site"];
            const options = isWeekend ? weekendLocs : locs;

            return (
                <div className="border-b border-gray-50 last:border-0 pb-8 last:pb-0">
                    <div className="flex items-baseline gap-2 mb-4">
                        <span className="text-sm font-black uppercase tracking-tight text-gray-800">{day}</span>
                        <span className="text-[10px] font-bold text-[--dmg-blue] uppercase tracking-widest">{fmtShort(date)}</span>
                    </div>
                    <div className="flex gap-2 overflow-x-auto py-3 -mx-1 px-1">
                        {options.map(l => (
                            <button
                                key={l}
                                onClick={() => onUpdate(day, 'status', l)}
                                disabled={isDisabled}
                                className={`shrink-0 loc-pill px-5 py-1.5 rounded-full text-[11px] font-black uppercase tracking-wide border-2 transition-all duration-300
                                    ${selection.status === l 
                                        ? (l === 'Weekend' 
                                            ? 'bg-gray-100 text-gray-500 border-gray-200 shadow-none' 
                                            : 'bg-[--dmg-blue] text-white border-[--dmg-blue] shadow-lg shadow-blue-500/20') 
                                        : 'bg-white text-gray-500 border-[--dmg-blue] hover:text-[--dmg-blue] hover:shadow-[0_0_8px_rgba(33,160,216,0.4)]'
                                    }`}
                            >
                                {l}
                            </button>
                        ))}
                    </div>
                    {selection.status === "Shoot" && (
                        <div className="mt-4 p-4 bg-gray-50 rounded-xl border border-gray-100 space-y-4 animate-slideDown">
                            <div className="flex items-center justify-between">
                                <span className="text-[11px] font-black uppercase text-gray-400 tracking-wider">Full Day?</span>
                                <div className="flex gap-2 bg-white p-1 rounded-lg border border-gray-200">
                                    <button onClick={() => onUpdate(day, 'fullDay', true)} className={`px-4 py-1 rounded-md text-[10px] font-black uppercase transition-all ${selection.fullDay ? 'bg-[--dmg-blue] text-white' : 'text-gray-400'}`} disabled={isDisabled}>Yes</button>
                                    <button onClick={() => onUpdate(day, 'fullDay', false)} className={`px-4 py-1 rounded-md text-[10px] font-black uppercase transition-all ${!selection.fullDay ? 'bg-[--dmg-blue] text-white' : 'text-gray-400'}`} disabled={isDisabled}>No</button>
                                </div>
                            </div>
                            {!selection.fullDay && (
                                <div className="flex items-center justify-between border-t border-gray-200 pt-3">
                                    <span className="text-[11px] font-black uppercase text-gray-400 tracking-wider">Shift Hours</span>
                                    <div className="flex items-center gap-2">
                                        <input type="time" value={selection.start} onChange={(e) => onUpdate(day, 'start', e.target.value)} className="p-2 rounded-lg border border-gray-200 bg-white text-xs font-bold w-24 text-center outline-none focus:border-[--dmg-blue]" disabled={isDisabled} />
                                        <span className="font-black text-gray-300">-</span>
                                        <input type="time" value={selection.end} onChange={(e) => onUpdate(day, 'end', e.target.value)} className="p-2 rounded-lg border border-gray-200 bg-white text-xs font-bold w-24 text-center outline-none focus:border-[--dmg-blue]" disabled={isDisabled} />
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };
        
        // --- HELPERS ---
        const getThisMonday = (base = new Date()) => {
            const d = new Date(base);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            const diff = (day === 0) ? -6 : 1 - day;
            d.setDate(d.getDate() + diff);
            return d;
        };

        const addDays = (date, n) => new Date(date.getTime() + n * 86400000);
        const fmtShort = (date) => date.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
        
        // --- APP ---
        function App() {
            const { useState, useEffect, useMemo, useCallback } = React;
            
            const [weekOffset, setWeekOffset] = useState(0);
            const [staffName, setStaffName] = useState("");
            const [managerName, setManagerName] = useState("");
            const [originalManager, setOriginalManager] = useState('');
            const [selections, setSelections] = useState({});
            const [staffDirectory, setStaffDirectory] = useState([]);
            const [submissions, setSubmissions] = useState([]);
            const [filteredStaff, setFilteredStaff] = useState([]);
            const [showAutocomplete, setShowAutocomplete] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [isManagerAutoSelected, setIsManagerAutoSelected] = useState(false);
            const [isCorrectingManager, setIsCorrectingManager] = useState(false);
            const [wasCorrectionSubmitted, setWasCorrectionSubmitted] = useState(false);

            const mondayDate = useMemo(() => addDays(getThisMonday(), weekOffset * 7), [weekOffset]);
            const weekCommencing = useMemo(() => mondayDate.toISOString().split("T")[0], [mondayDate]);
            const isPastWeek = useMemo(() => {
                const todayMonday = getThisMonday();
                return mondayDate.getTime() < todayMonday.getTime();
            }, [mondayDate]);

            const days = useMemo(() => ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"], []);

            const resetSelections = useCallback(() => {
                const initial = {};
                days.forEach(d => {
                    const isWeekend = d === "Saturday" || d === "Sunday";
                    initial[d] = { status: isWeekend ? "Weekend" : "Office", fullDay: true, start: "09:00", end: "17:30" };
                });
                setSelections(initial);
            }, [days]);

            useEffect(() => {
                const unsubStaff = onStaffDirectorySnapshot(setStaffDirectory);
                const unsubSubmissions = onRotaSubmissionsSnapshot(setSubmissions);
                return () => {
                    unsubStaff();
                    unsubSubmissions();
                };
            }, []);

            const existingSubmission = useMemo(() => {
                if (!staffName || staffName.length < 3) return null;
                const normName = normalize(staffName);
                return submissions.find(s => s.weekId === weekCommencing && normalize(s.name) === normName) || null;
            }, [submissions, staffName, weekCommencing]);

            useEffect(() => {
                if (existingSubmission && !isEditing) {
                    const loaded = {};
                    days.forEach((d, i) => {
                        loaded[d] = existingSubmission.schedule?.[i] || { status: (d === "Saturday" || d === "Sunday" ? "Weekend" : "Office"), fullDay: true, start: "09:00", end: "17:30" };
                    });
                    setSelections(loaded);
                    if (existingSubmission.manager) {
                        setManagerName(existingSubmission.manager);
                        setIsManagerAutoSelected(true);
                    }
                } else if (!existingSubmission && !isEditing) {
                    resetSelections();
                }
            }, [existingSubmission, isEditing, weekCommencing, days, resetSelections]);
            
            useEffect(() => {
                resetSelections();
            }, [weekOffset, resetSelections]);

            const handleNameInput = (val) => {
                setStaffName(val);
                setManagerName('');
                setOriginalManager('');
                setIsManagerAutoSelected(false);
                setIsCorrectingManager(false);
                setIsEditing(false);
                if (val.length > 1) {
                    const matches = staffDirectory.filter(s =>
                        `${s.firstName} ${s.lastName}`.toLowerCase().includes(val.toLowerCase())
                    );
                    setFilteredStaff(matches);
                    setShowAutocomplete(true);
                } else {
                    setShowAutocomplete(false);
                }
            };

            const selectUser = (u) => {
                const name = `${u.firstName} ${u.lastName}`;
                const autoManager = u.manager || "";
                setStaffName(name);
                setManagerName(autoManager);
                setOriginalManager(autoManager);
                setIsManagerAutoSelected(true);
                setIsCorrectingManager(false);
                setShowAutocomplete(false);
                setIsEditing(false);
            };

            const updateDay = useCallback((day, field, value) => {
                if (existingSubmission && !isEditing) return;
                setSelections(prev => ({
                    ...prev,
                    [day]: { ...prev[day], [field]: value }
                }));
            }, [existingSubmission, isEditing]);

            const handleSubmit = async () => {
                if (!staffName || !managerName) {
                    alert("Please complete name and manager selection.");
                    return;
                }
                setIsSubmitting(true);

                const rotaPayload = {
                    name: staffName,
                    manager: managerName,
                    weekId: weekCommencing,
                    schedule: days.map(d => selections[d]),
                    submittedAt: new Date().toISOString()
                };

                const promises = [submitRota(rotaPayload)];
                
                const correctionMade = isCorrectingManager && managerName !== originalManager;
                if (correctionMade) {
                    const correctionPayload = {
                        staffName: staffName,
                        originalManager: originalManager,
                        correctedManager: managerName,
                        submittedAt: new Date().toISOString(),
                        status: 'pending'
                    };
                    promises.push(submitManagerCorrection(correctionPayload));
                }
                
                setWasCorrectionSubmitted(correctionMade);

                try {
                    await Promise.all(promises);
                    setIsSubmitting(false);
                    setIsEditing(false);
                    setIsSuccess(true);
                } catch (e) {
                    alert("Cloud Sync Error: " + e.message);
                    setIsSubmitting(false);
                }
            };

            const managers = useMemo(() => {
                const managerNames = staffDirectory
                    .filter(s => s.isManager)
                    .map(s => `${s.firstName} ${s.lastName}`);
                const uniqueManagers = new Set(managerNames);
                if (managerName) {
                    uniqueManagers.add(managerName);
                }
                return [...uniqueManagers].sort();
            }, [staffDirectory, managerName]);
            
            const isSubmittedView = !!existingSubmission;
            const isFormDisabled = isPastWeek || (isSubmittedView && !isEditing);
            
            const handleSuccessDone = () => {
                setIsSuccess(false);
                setWasCorrectionSubmitted(false);
            };

            if (isSuccess) {
                return <SuccessView onDone={handleSuccessDone} mondayDate={mondayDate} correctionSubmitted={wasCorrectionSubmitted} />;
            }

            return (
                <div className="widget-card flex flex-col w-full h-[92vh] rounded-2xl shadow-lg border border-[--border] bg-white text-gray-800">
                    <div className="p-6 border-b border-gray-100 shrink-0 z-20">
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex items-center gap-3">
                                <DotGrid />
                                <h1 className="text-xl font-black uppercase tracking-tighter leading-none text-[--dmg-blue]">
                                    Rota<br />Request
                                </h1>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => { setWeekOffset(p => p - 1); setIsEditing(false); }} className="w-8 h-8 rounded-lg border border-gray-200 bg-gray-50 font-bold hover:bg-white transition-all">‹</button>
                                <div className={`px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider border ${isPastWeek ? 'bg-gray-100 text-gray-400 border-gray-200' : 'bg-blue-50 text-[--dmg-blue] border-blue-100'}`}>
                                    <span className="opacity-50 mr-1 font-bold">W/C</span> {fmtShort(mondayDate)}
                                </div>
                                <button onClick={() => { setWeekOffset(p => p + 1); setIsEditing(false); }} className="w-8 h-8 rounded-lg border border-gray-200 bg-gray-50 font-bold hover:bg-white transition-all">›</button>
                            </div>
                        </div>
                        <div className="space-y-4">
                            <div className="relative">
                                <label className="text-[10px] font-black uppercase text-gray-400 tracking-widest block mb-1.5">Staff Identity</label>
                                <input
                                    type="text"
                                    value={staffName}
                                    onChange={(e) => handleNameInput(e.target.value)}
                                    className="w-full p-3 bg-gray-50 border-2 border-gray-100 rounded-xl text-sm font-bold focus:border-[--dmg-blue] focus:bg-white transition-all outline-none"
                                    placeholder="Start typing your name..."
                                    disabled={isFormDisabled}
                                />
                                {showAutocomplete && filteredStaff.length > 0 && (
                                    <div className="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-xl shadow-xl z-50 max-h-48 overflow-y-auto">
                                        {filteredStaff.map(u => (
                                            <div key={u.id} onClick={() => selectUser(u)} className="p-3 text-sm font-bold hover:bg-gray-50 cursor-pointer border-b border-gray-50 last:border-0">{u.firstName} {u.lastName}</div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div>
                                <div className="flex justify-between items-center mb-1.5">
                                    <label className="text-[10px] font-black uppercase text-gray-400 tracking-widest block">Line Manager</label>
                                    {isManagerAutoSelected && !isCorrectingManager && !isFormDisabled && (
                                        <button
                                            onClick={() => setIsCorrectingManager(true)}
                                            className="text-[10px] font-bold text-[--dmg-blue] hover:underline"
                                        >
                                            Incorrect manager?
                                        </button>
                                    )}
                                </div>
                                {isCorrectingManager ? (
                                     <select
                                        value={managerName}
                                        onChange={(e) => setManagerName(e.target.value)}
                                        className="w-full p-3 bg-gray-50 border-2 rounded-xl text-sm font-bold focus:bg-white transition-all outline-none appearance-none border-amber-400 focus:border-amber-500"
                                        disabled={isFormDisabled}
                                    >
                                        <option value="" disabled>{managerName || 'Select Manager...'}</option>
                                        {managers.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                ) : (
                                    <input
                                        type="text"
                                        readOnly
                                        value={managerName}
                                        className="w-full p-3 bg-gray-100 border-2 border-gray-100 rounded-xl text-sm font-bold cursor-not-allowed text-gray-500"
                                    />
                                )}
                            </div>
                        </div>
                    </div>

                    {isSubmittedView && !isEditing && existingSubmission && <SubmittedBanner submission={existingSubmission} />}

                    <div className={`flex-1 overflow-y-auto p-6 space-y-8 ${(isSubmittedView && !isEditing) || isPastWeek ? 'grayscale opacity-50' : ''}`}>
                        {days.map((day, i) => {
                            const date = addDays(mondayDate, i);
                            const sel = selections[day] || { status: 'Office', fullDay: true, start: "09:00", end: "17:30" };
                            const isWeekend = day === "Saturday" || day === "Sunday";
                            return <DayRow key={day} day={day} date={date} selection={sel} isWeekend={isWeekend} isDisabled={isFormDisabled} onUpdate={updateDay} />;
                        })}
                    </div>

                    <div className="p-6 border-t border-gray-100 shrink-0">
                        {isSubmittedView && !isEditing ? (
                            <button
                                onClick={() => setIsEditing(true)}
                                disabled={isPastWeek}
                                className="w-full py-4 bg-[--dmg-blue] text-white rounded-xl text-sm font-black uppercase tracking-widest hover:brightness-110 transition-all shadow-lg shadow-blue-500/20 disabled:bg-gray-200 disabled:cursor-not-allowed"
                            >
                                Want to edit?
                            </button>
                        ) : (
                            <button
                                onClick={handleSubmit}
                                disabled={isSubmitting || isPastWeek || !staffName || !managerName}
                                className="w-full py-4 bg-[--dmg-blue] text-white rounded-xl text-sm font-black uppercase tracking-widest hover:brightness-110 transition-all disabled:bg-gray-200 disabled:cursor-not-allowed"
                            >
                                {isSubmitting ? 'Syncing...' : (isEditing ? 'Update' : 'Submit')}
                            </button>
                        )}
                        {isPastWeek && <p className="text-[10px] text-center mt-3 text-red-400 font-bold uppercase tracking-wider">Note: This week is locked for historical records.</p>}
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);

    </script>
</body>
</html>
