<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Rota Request | Live Cloud</title>
    <style>
        :root {
            --brand-black: #000000;
            --brand-pink: #E91E63;
            --brand-blue: #21a0d8;
            --bg-grey: #FAFAFA;
            --border: #E0E0E0;
            --text-main: #111;
            --text-sub: #666;
            --loc-office-bg: #F5F5F5; --loc-office-text: #111;
            --loc-wfh-bg: #FCE4EC;    --loc-wfh-text: #C2185B;
            --loc-shoot-bg: #FFF3E0;  --loc-shoot-text: #E65100;
            --loc-pto-bg: #FFEBEE;    --loc-pto-text: #D32F2F;
            --loc-abroad-bg: #E8EAF6; --loc-abroad-text: #3949AB;
            --loc-half-bg: #E0F2F1;   --loc-half-text: #00695C;
        }

        body { font-family: sans-serif; background-color: transparent; margin: 0; padding: 20px; color: var(--text-main); height: 100vh; display: flex; justify-content: center; }
        .widget-card { background: #FFFFFF; width: 100%; max-width: 420px; height: 90vh; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid var(--border); overflow: hidden; position: relative; }
        .header { padding: 24px; border-bottom: 1px solid var(--border); }
        .title-area h1 { font-size: 20px; font-weight: 800; text-transform: uppercase; margin: 0; }
        .input-group { margin-top: 15px; }
        .input-label { font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 6px; display: block; }
        .styled-input, .styled-select { width: 100%; padding: 12px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-grey); box-sizing: border-box; }
        .scroll-content { flex: 1; overflow-y: auto; padding: 20px; }
        .day-row { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f0; }
        .day-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .pills-scroller { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .loc-pill { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); cursor: pointer; background: #fff; }
        .loc-pill.selected { background: var(--brand-pink); color: #fff; border-color: transparent; }
        .footer { padding: 16px 24px; border-top: 1px solid var(--border); }
        .submit-btn { width: 100%; background: var(--brand-black); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .success-overlay { position: absolute; inset: 0; background: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .success-overlay.active { display: flex; }
    </style>
</head>
<body>

<div class="widget-card">
    <div class="header">
        <div class="title-area">
            <h1>Rota Request</h1>
            <div style="font-size:11px; color:var(--text-sub);">Cloud Sync Active</div>
        </div>
        <div class="input-group">
            <label class="input-label">Your Name</label>
            <input type="text" id="staff-name" class="styled-input" placeholder="Full Name...">
        </div>
        <div class="input-group">
            <label class="input-label">Line Manager</label>
            <select id="manager-select" class="styled-select">
                <option value="" disabled selected>Select Manager...</option>
                <option value="Ellie Beetham">Ellie Beetham</option>
                <option value="Matt Macleod">Matt Macleod</option>
                <option value="Nev Brook">Nev Brook</option>
                <option value="Nick Moar">Nick Moar</option>
                <option value="Alex Biddle">Alex Biddle</option>
            </select>
        </div>
    </div>

    <div class="scroll-content" id="days-mount"></div>

    <div class="footer">
        <button class="submit-btn" id="submit-btn" onclick="submitRota()">Sync to Command Centre</button>
    </div>

    <div id="success-screen" class="success-overlay">
        <h2 style="font-weight:900;">REQUEST LOGGED</h2>
        <p style="font-size:14px; color:#666; padding:0 40px;">Your working patterns have been synced to the office cloud.</p>
        <button onclick="location.reload()" style="margin-top:20px; background:none; border:none; text-decoration:underline; cursor:pointer;">Update Again</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMhRhG2j-NprFJdeZ8VvcPQ_sRiqILz6o",
        authDomain: "dmg-command-centre.firebaseapp.com",
        projectId: "dmg-command-centre",
        storageBucket: "dmg-command-centre.firebasestorage.app",
        messagingSenderId: "870188205332",
        appId: "1:870188205332:web:0d6b87300fe272eae0ae01",
        measurementId: "G-25TS57VLVS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const appId = 'dmg-command-centre';

    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
    const locs = ['Office', 'WFH', 'Shoot', 'Abroad', 'PTO'];
    let selections = { Mon:'Office', Tue:'Office', Wed:'Office', Thu:'Office', Fri:'Office' };

    window.onload = async () => {
        await signInAnonymously(auth);
        render();
    };

    function render() {
        document.getElementById('days-mount').innerHTML = days.map(d => `
            <div class="day-row">
                <div class="day-title">${d}</div>
                <div class="pills-scroller">
                    ${locs.map(l => `
                        <div class="loc-pill ${selections[d]===l?'selected':''}" onclick="selectLoc('${d}','${l}')">${l}</div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    window.selectLoc = (day, val) => { selections[day] = val; render(); };

    window.submitRota = async () => {
        const name = document.getElementById('staff-name').value.trim();
        const mgr = document.getElementById('manager-select').value;
        const btn = document.getElementById('submit-btn');

        if(!name || !mgr) return alert("Fill in your name and manager.");

        btn.disabled = true;
        btn.innerText = "Syncing...";

        try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rota_submissions', name), {
                name, manager: mgr,
                schedule: [selections.Mon, selections.Tue, selections.Wed, selections.Thu, selections.Fri],
                updated: new Date().toISOString()
            });
            document.getElementById('success-screen').classList.add('active');
        } catch (e) {
            alert("Sync Failed. Check console.");
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
