<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>DMG Rota Request | Live Cloud</title>
  <style>
    :root{
      --brand-black:#000000;
      --brand-pink:#E6468B;
      --brand-blue:#21a0d8;
      --bg-grey:#FAFAFA;
      --border:#E0E0E0;
      --text-main:#111;
      --text-sub:#666;
      --transition:all .3s cubic-bezier(.16,1,.3,1);
    }
    *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
    body{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:transparent;margin:0;padding:20px;color:var(--text-main);
      height:100vh;display:flex;justify-content:center;overflow:hidden;
    }
    .widget-card{
      background:#fff;width:100%;max-width:440px;height:92vh;
      display:flex;flex-direction:column;border-radius:16px;
      box-shadow:0 10px 40px rgba(0,0,0,.08);
      border:1px solid var(--border);overflow:hidden;position:relative;
    }

    .dot-grid{display:grid;grid-template-columns:repeat(2,6px);gap:4px;width:fit-content}
    .dot-grid span{width:6px;height:6px;border-radius:50%;background:var(--brand-pink)}

    .header{padding:22px 24px;border-bottom:1px solid var(--border);background:#fff}
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .title-left{display:flex;align-items:center;gap:12px}
    h1{font-size:20px;font-weight:900;text-transform:uppercase;margin:0;letter-spacing:-.02em}

    .week-nav{display:flex;align-items:center;gap:10px}
    .nav-btn{
      width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);
      background:var(--bg-grey);cursor:pointer;font-weight:900;transition:.2s;
      display:flex;align-items:center;justify-content:center;user-select:none;
    }
    .nav-btn:hover{border-color:rgba(230,70,139,.45);background:#fff}
    .nav-btn:active{transform:scale(.97)}
    .week-chip{
      font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
      color:var(--brand-pink);
      background:rgba(230,70,139,.08);
      border:1px solid rgba(230,70,139,.18);
      padding:6px 10px;border-radius:999px;white-space:nowrap;
    }
    .week-chip.locked{color:#999;background:#f3f3f3;border-color:#e6e6e6}

    .input-group{margin-top:14px;position:relative}
    .input-label{
      font-size:10px;font-weight:800;color:#999;text-transform:uppercase;
      margin-bottom:6px;display:block;letter-spacing:.05em;
    }
    .styled-input,.styled-select{
      width:100%;padding:12px;font-size:14px;font-weight:700;
      border:1.5px solid var(--border);border-radius:10px;background:var(--bg-grey);
      outline:none;transition:.2s;color:#111;
    }
    .styled-input:focus,.styled-select:focus{border-color:var(--brand-pink);background:#fff}

    .scroll-content{flex:1;overflow-y:auto;padding:22px 24px;background:#fff}
    .day-row{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid #f5f5f5}
    .day-title{font-size:14px;font-weight:800;margin-bottom:2px}
    .day-date{
      font-size:10px;font-weight:700;color:var(--brand-pink);
      text-transform:uppercase;margin-bottom:12px;display:block;letter-spacing:.08em;
    }

    .pills-scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none;margin-bottom:12px}
    .pills-scroller::-webkit-scrollbar{display:none}

    .loc-pill{
      flex-shrink:0;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:900;
      border:1.5px solid var(--border);cursor:pointer;background:#fff;transition:var(--transition);color:#888;
    }
    .loc-pill:hover{
      border-color:rgba(230,70,139,.35);
      box-shadow:0 0 0 2px rgba(230,70,139,.06);
    }
    .loc-pill.selected{
      background:var(--brand-pink);color:#fff;border-color:var(--brand-pink);
      box-shadow:0 2px 10px rgba(230,70,139,.22);
    }

    .shoot-meta{
      background:var(--bg-grey);padding:14px;border-radius:12px;margin-top:10px;
      border:1px solid #f0f0f0;
      animation:slideDown .25s ease;
    }
    @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    .meta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px}
    .meta-label{font-size:11px;font-weight:800;color:#666}
    .time-inputs{display:flex;align-items:center;gap:8px}
    .time-box{
      padding:6px 8px;border-radius:8px;border:1px solid var(--border);
      font-size:12px;font-weight:800;width:92px;background:#fff;
    }

    .toggle-btn{
      background:#eee;border:none;padding:6px 12px;border-radius:8px;
      font-size:10px;font-weight:900;cursor:pointer;text-transform:uppercase;transition:.2s;
      box-shadow:0 0 0 0 rgba(33,160,216,0);
    }
    .toggle-btn:hover{box-shadow:0 0 0 2px rgba(33,160,216,.10)}
    .toggle-btn.active{background:var(--brand-blue);color:#fff}

    .footer{padding:18px 24px;border-top:1px solid var(--border);background:#fff}
    .submit-btn{
      width:100%;background:var(--brand-black);color:#fff;border:none;
      padding:16px;border-radius:12px;font-size:13px;font-weight:900;
      text-transform:uppercase;cursor:pointer;transition:.2s;letter-spacing:.12em;
    }
    .submit-btn:hover{transform:translateY(-2px);background:var(--brand-pink)}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    /* Read-only mode */
    .readonly .styled-input,
    .readonly .styled-select,
    .readonly .loc-pill,
    .readonly .toggle-btn,
    .readonly .time-box,
    .readonly .submit-btn{
      pointer-events:none;
      opacity:.45;
      filter:grayscale(.25);
    }
    .readonly .submit-btn{background:#111;color:#fff;opacity:.35}

    /* Overlays */
    .overlay{
      position:absolute;inset:0;background:rgba(255,255,255,.92);
      backdrop-filter:blur(6px);display:none;flex-direction:column;
      align-items:center;justify-content:center;z-index:100;text-align:center;padding:34px;
    }
    .overlay.active{display:flex}
    .edit-btn{
      background:var(--brand-blue);color:#fff;border:none;padding:12px 22px;border-radius:999px;
      font-weight:900;font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;
    }

    /* Submit “frost + dots + check” overlay */
    .submit-overlay{
      position:absolute;inset:0;display:none;align-items:center;justify-content:center;
      background:rgba(255,255,255,.78);backdrop-filter:blur(10px);
      z-index:120;text-align:center;padding:32px;
    }
    .submit-overlay.active{display:flex}
    .submit-card{
      width:min(320px,90%);background:#fff;border:1px solid var(--border);
      border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.10);
      padding:22px 18px;
    }
    .loading-dots{display:flex;justify-content:center;gap:8px;margin:8px 0 14px}
    .loading-dots span{
      width:10px;height:10px;border-radius:50%;background:var(--brand-pink);
      opacity:.25;transform:scale(.85);
      animation:dotCycle 1s infinite ease-in-out;
    }
    .loading-dots span:nth-child(2){animation-delay:.15s}
    .loading-dots span:nth-child(3){animation-delay:.30s}
    .loading-dots span:nth-child(4){animation-delay:.45s}
    @keyframes dotCycle{
      0%,100%{opacity:.25;transform:scale(.85)}
      50%{opacity:1;transform:scale(1.1)}
    }
    .checkmark{
      width:58px;height:58px;margin:8px auto 10px;display:none;
    }
    .checkmark svg{width:100%;height:100%}
    .checkmark path{
      stroke:var(--brand-pink);
      stroke-width:6;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:100;
      stroke-dashoffset:100;
      animation:draw .6s ease forwards;
    }
    @keyframes draw{to{stroke-dashoffset:0}}

    #toast{
      position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
      background:#000;color:#fff;padding:10px 16px;border-radius:999px;
      font-size:11px;font-weight:900;opacity:0;transition:.25s;pointer-events:none;
      z-index:1000;text-transform:uppercase;letter-spacing:.08em;
    }
    #toast.visible{opacity:1;bottom:30px}
    .muted-note{font-size:12px;color:#777;line-height:1.4;margin-top:10px}
    .muted-note b{color:#111}
  </style>
</head>
<body>
  <div id="toast">Updated</div>

  <div class="widget-card" id="card">
    <div class="header">
      <div class="title-row">
        <div class="title-left">
          <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
          <h1>Rota Request</h1>
        </div>

        <div class="week-nav">
          <button class="nav-btn" id="prev-week" title="Previous week" aria-label="Previous week">‹</button>
          <div class="week-chip" id="wc-chip">W/C ...</div>
          <button class="nav-btn" id="next-week" title="Next week" aria-label="Next week">›</button>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Your Name</label>
        <input type="text" id="staff-name" list="staff-list" class="styled-input" placeholder="Start typing name..." />
        <datalist id="staff-list"></datalist>
      </div>

      <div class="input-group">
        <label class="input-label">Line Manager</label>
        <select id="manager-select" class="styled-select">
          <option value="" disabled selected>Select Manager...</option>
        </select>
      </div>
    </div>

    <div class="scroll-content" id="days-mount"></div>

    <div class="footer">
      <button class="submit-btn" id="submit-btn">Submit</button>
    </div>

    <!-- Already submitted overlay (only for next week) -->
    <div id="already-submitted-overlay" class="overlay">
      <div class="dot-grid" style="margin-bottom:16px;"><span></span><span></span><span></span><span></span></div>
      <h2 style="font-weight:900;margin:0 0 6px;">ALREADY SUBMITTED</h2>
      <p style="margin:0 0 14px;">You have already logged a rota for <span id="wc-date-display"></span>.</p>
      <button class="edit-btn" id="edit-btn">Want to edit?</button>
    </div>

    <!-- Submit animation overlay -->
    <div id="submit-overlay" class="submit-overlay" aria-live="polite">
      <div class="submit-card">
        <div class="dot-grid" style="margin:0 auto 10px;"><span></span><span></span><span></span><span></span></div>

        <div id="submit-loading">
          <div class="loading-dots"><span></span><span></span><span></span><span></span></div>
          <div style="font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:#111;">Syncing to cloud</div>
        </div>

        <div class="checkmark" id="submit-check">
          <svg viewBox="0 0 52 52" role="img" aria-label="Success">
            <path d="M14 27 L22 35 L39 17"></path>
          </svg>
        </div>

        <div id="submit-message" class="muted-note"></div>

        <button class="edit-btn" id="done-btn" style="display:none;background:#000;margin-top:14px;">Done</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getFirestore, doc, setDoc, getDoc, collection, onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
      authDomain: "dmg-command-centre-native.firebaseapp.com",
      projectId: "dmg-command-centre-native",
      storageBucket: "dmg-command-centre-native.firebasestorage.app",
      messagingSenderId: "223535956454",
      appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const appId = "dmg-command-centre-native";
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
    const locs = ["Office","WFH","Shoot","Client / Travel","PTO"];

    const el = (id) => document.getElementById(id);

    const state = {
      weekOffset: 0, // 0 = next week (default), -1 = previous week, etc
      weekCommencing: "",
      mondayDate: null,
      staffDirectory: [],
      selections: {},
      readOnly: false,
      existingDoc: null
    };

    function toast(msg){
      const t = el("toast");
      t.textContent = msg;
      t.classList.add("visible");
      setTimeout(()=>t.classList.remove("visible"), 2000);
    }

    function startOfDay(d){
      const x = new Date(d);
      x.setHours(0,0,0,0);
      return x;
    }

    // Next Monday (for “upcoming rota”)
    function getNextMonday(baseDate = new Date()){
      const d = startOfDay(baseDate);
      const day = d.getDay(); // Sun=0..Sat=6
      const diff = (day === 0) ? 1 : (8 - day);
      return new Date(d.getTime() + diff * 86400000);
    }

    function addDays(date, n){
      return new Date(date.getTime() + n * 86400000);
    }

    function fmtShort(date){
      return date.toLocaleDateString("en-GB", { day:"numeric", month:"short" });
    }

    function fmtWcChip(monday){
      return `W/C ${fmtShort(monday)}`;
    }

    function initSelections(){
      const s = {};
      days.forEach(d => {
        s[d] = { status:"Office", fullDay:true, start:"09:00", end:"17:30" };
      });
      state.selections = s;
    }

    function computeWeek(){
      const nextMon = getNextMonday(new Date());
      const monday = addDays(nextMon, state.weekOffset * 7);
      state.mondayDate = monday;
      state.weekCommencing = monday.toISOString().split("T")[0];

      // Read-only for any week in the past relative to nextMon
      state.readOnly = monday.getTime() < nextMon.getTime();

      const chip = el("wc-chip");
      chip.textContent = fmtWcChip(monday);
      chip.classList.toggle("locked", state.readOnly);

      el("wc-date-display").textContent = fmtWcChip(monday);
      el("card").classList.toggle("readonly", state.readOnly);

      // “Already submitted” overlay only applies to weekOffset === 0
      el("already-submitted-overlay").classList.remove("active");
      state.existingDoc = null;
    }

    function populateLists(){
      const listMount = el("staff-list");
      const mgrMount = el("manager-select");

      listMount.innerHTML = state.staffDirectory
        .map(s => `<option value="${s.firstName} ${s.lastName}">`)
        .join("");

      const managers = [...new Set(
        state.staffDirectory
          .filter(s => s.isManager)
          .map(s => `${s.firstName} ${s.lastName}`)
      )].sort();

      if(!managers.includes("Anaïs Lukaku")) managers.push("Anaïs Lukaku");

      mgrMount.innerHTML =
        '<option value="" disabled selected>Select Manager...</option>' +
        managers.map(m => `<option value="${m}">${m}</option>`).join("");
    }

    function renderDays(){
      const mount = el("days-mount");
      mount.innerHTML = days.map((d,i)=>{
        const current = addDays(state.mondayDate, i);
        const sel = state.selections[d];
        const pills = locs.map(l => {
          const selected = sel.status === l ? "selected" : "";
          return `<div class="loc-pill ${selected}" data-day="${d}" data-loc="${l}">${l}</div>`;
        }).join("");

        const shootMeta = (sel.status === "Shoot" || sel.status === "Client / Travel") ? `
          <div class="shoot-meta">
            <div class="meta-row">
              <span class="meta-label">Full Day?</span>
              <button class="toggle-btn ${sel.fullDay ? "active":""}" data-toggle-day="${d}">
                ${sel.fullDay ? "Yes" : "No"}
              </button>
            </div>
            ${!sel.fullDay ? `
              <div class="meta-row">
                <span class="meta-label">On-site times</span>
                <div class="time-inputs">
                  <input type="time" class="time-box" value="${sel.start}" data-time-day="${d}" data-time-key="start" />
                  <span style="font-size:10px;font-weight:900;">-</span>
                  <input type="time" class="time-box" value="${sel.end}" data-time-day="${d}" data-time-key="end" />
                </div>
              </div>
            ` : ``}
          </div>
        ` : ``;

        return `
          <div class="day-row">
            <div class="day-title">${d}</div>
            <span class="day-date">${fmtShort(current)}</span>
            <div class="pills-scroller">${pills}</div>
            ${shootMeta}
          </div>
        `;
      }).join("");
    }

    function wireDayInteractions(){
      el("days-mount").addEventListener("click", (e) => {
        if(state.readOnly) return;

        const pill = e.target.closest(".loc-pill");
        if(pill){
          const day = pill.getAttribute("data-day");
          const loc = pill.getAttribute("data-loc");
          state.selections[day].status = loc;
          // reset shoot defaults if switching into shoot
          if(loc === "Shoot" || loc === "Client / Travel"){
            if(typeof state.selections[day].fullDay !== "boolean") state.selections[day].fullDay = true;
            if(!state.selections[day].start) state.selections[day].start = "09:00";
            if(!state.selections[day].end) state.selections[day].end = "17:30";
          }
          renderDays();
          return;
        }

        const toggle = e.target.closest("[data-toggle-day]");
        if(toggle){
          const day = toggle.getAttribute("data-toggle-day");
          state.selections[day].fullDay = !state.selections[day].fullDay;
          renderDays();
          return;
        }
      });

      el("days-mount").addEventListener("change", (e) => {
        if(state.readOnly) return;

        const t = e.target;
        if(t && t.matches("[data-time-day]")){
          const day = t.getAttribute("data-time-day");
          const key = t.getAttribute("data-time-key");
          state.selections[day][key] = t.value;
        }
      });
    }

    function submissionIdFor(name){
      return `${state.weekCommencing}_${name.replace(/\\s+/g, "_")}`;
    }

    async function loadExistingIfAny(){
      const name = el("staff-name").value.trim();
      if(name.length < 3) return;

      const id = submissionIdFor(name);
      const snap = await getDoc(doc(db, "artifacts", appId, "public", "data", "rota_submissions", id));

      if(snap.exists()){
        state.existingDoc = snap.data();

        // Fill manager if present
        if(state.existingDoc.manager){
          el("manager-select").value = state.existingDoc.manager;
        }

        // Load schedule into selections
        // Stored as array Monday..Friday in your schema
        const sch = state.existingDoc.schedule;
        if(Array.isArray(sch) && sch.length >= 5){
          days.forEach((dayName, idx) => {
            const v = sch[idx] || {};
            state.selections[dayName] = {
              status: v.status || "Office",
              fullDay: (v.fullDay !== undefined) ? !!v.fullDay : true,
              start: v.start || "09:00",
              end: v.end || "17:30"
            };
          });
          renderDays();
        }

        // If it is next week (editable week) show “already submitted” lock overlay
        if(state.weekOffset === 0 && !state.readOnly){
          el("already-submitted-overlay").classList.add("active");
        }
      }
    }

    function setSubmitOverlay(mode, messageHTML){
      const overlay = el("submit-overlay");
      const loading = el("submit-loading");
      const check = el("submit-check");
      const msg = el("submit-message");
      const done = el("done-btn");

      overlay.classList.add("active");

      if(mode === "loading"){
        loading.style.display = "block";
        check.style.display = "none";
        done.style.display = "none";
        msg.innerHTML = "";
      }

      if(mode === "success"){
        loading.style.display = "none";
        check.style.display = "block";
        msg.innerHTML = messageHTML || "";
        done.style.display = "inline-flex";
      }
    }

    function clearSubmitOverlay(){
      el("submit-overlay").classList.remove("active");
      el("submit-loading").style.display = "block";
      el("submit-check").style.display = "none";
      el("submit-message").innerHTML = "";
      el("done-btn").style.display = "none";
    }

    async function submitRota(){
      if(state.readOnly){
        toast("Viewing past rota");
        return;
      }

      const name = el("staff-name").value.trim();
      const mgr = el("manager-select").value;
      if(!name || !mgr){
        alert("Enter your name and select a manager.");
        return;
      }

      const btn = el("submit-btn");
      btn.disabled = true;

      setSubmitOverlay("loading");

      const id = submissionIdFor(name);
      const payload = {
        name,
        manager: mgr,
        weekId: state.weekCommencing,
        schedule: days.map(d => state.selections[d]),
        submittedAt: new Date().toISOString()
      };

      try{
        await setDoc(doc(db, "artifacts", appId, "public", "data", "rota_submissions", id), payload);

        const msg = `<b>${name}</b> submitted for <b>${fmtWcChip(state.mondayDate)}</b>.`;
        setSubmitOverlay("success", msg);

      }catch(err){
        alert("Error: " + (err?.message || err));
        clearSubmitOverlay();
      }finally{
        btn.disabled = false;
      }
    }

    function setSubmitButtonLabel(){
      const btn = el("submit-btn");
      if(state.readOnly){
        btn.textContent = "Viewing Past Rota";
        btn.disabled = true;
      }else{
        btn.textContent = "Submit";
        btn.disabled = false;
      }
    }

    async function changeWeek(delta){
      state.weekOffset += delta;
      computeWeek();
      initSelections();
      renderDays();
      setSubmitButtonLabel();
      // attempt to load existing for this week (if name already typed)
      await loadExistingIfAny();
    }

    // --- Boot ---
    (async function boot(){
      initSelections();
      computeWeek();
      renderDays();
      wireDayInteractions();

      await signInAnonymously(auth);

      // Staff directory live feed
      onSnapshot(collection(db, "artifacts", appId, "public", "data", "staff_directory"), (snap) => {
        state.staffDirectory = [];
        snap.forEach(d => state.staffDirectory.push(d.data()));
        populateLists();
      });

      // Name typing triggers check/load
      let nameTimer = null;
      el("staff-name").addEventListener("input", () => {
        if(nameTimer) clearTimeout(nameTimer);
        nameTimer = setTimeout(loadExistingIfAny, 250);
      });

      // Manager change does not auto-submit; purely selection
      el("manager-select").addEventListener("change", () => { /* noop */ });

      // Week nav
      el("prev-week").addEventListener("click", () => changeWeek(-1));
      el("next-week").addEventListener("click", () => changeWeek(1));

      // Edit unlock (only for next week submissions)
      el("edit-btn").addEventListener("click", () => {
        el("already-submitted-overlay").classList.remove("active");
        toast("Edit mode active");
      });

      // Submit
      el("submit-btn").addEventListener("click", submitRota);

      // Done
      el("done-btn").addEventListener("click", () => location.reload());

      setSubmitButtonLabel();
    })();
