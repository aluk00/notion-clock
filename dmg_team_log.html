<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Rota Request</title>
    <style>
        /* --- DMG DESIGN SYSTEM --- */
        :root {
            --brand-black: #000000;
            --brand-pink: #E91E63;
            --brand-blue: #21a0d8;
            --bg-grey: #FAFAFA;
            --border: #E0E0E0;
            --text-main: #111;
            --text-sub: #666;
            
            /* Status Colors */
            --loc-office-bg: #F5F5F5; --loc-office-text: #111;
            --loc-wfh-bg: #FCE4EC;    --loc-wfh-text: #C2185B;
            --loc-shoot-bg: #FFF3E0;  --loc-shoot-text: #E65100;
            --loc-pto-bg: #FFEBEE;    --loc-pto-text: #D32F2F;
            --loc-abroad-bg: #E8EAF6; --loc-abroad-text: #3949AB; /* Indigo for Abroad */
            --loc-half-bg: #E0F2F1;   --loc-half-text: #00695C;   /* Teal for Half Day */
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            color: var(--text-main);
        }

        /* --- THE CARD --- */
        .widget-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        /* --- HEADER --- */
        .header {
            padding: 24px 24px 10px 24px;
            border-bottom: 1px solid transparent;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .title-area h1 {
            font-size: 20px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 4px;
        }

        /* HEADER DOTS (Static/Intro Animation) */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 20px;
            height: 20px;
        }
        .dot {
            background-color: var(--brand-pink);
            border-radius: 50%;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform: scale(0);
        }
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }
        @keyframes popIn { to { transform: scale(1); } }

        /* --- INPUT GROUP --- */
        .input-group {
            margin-bottom: 12px;
        }
        
        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .styled-input, .styled-select {
            width: 100%;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-grey);
            color: var(--text-main);
            box-sizing: border-box;
            font-family: inherit;
        }

        .styled-input:focus, .styled-select:focus {
            outline: 2px solid var(--brand-pink);
            background: #fff;
            border-color: transparent;
        }

        /* Custom Arrow for Select */
        .styled-select {
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 8px auto;
        }

        /* --- SCROLL AREA --- */
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 80px 24px;
        }

        .section-header {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            margin: 20px 0 10px 0;
            letter-spacing: 0.05em;
        }

        /* --- DAY ROWS --- */
        .day-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .day-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        
        .date-label { color: var(--text-sub); font-weight: 400; font-size: 13px; }

        .pills-scroller {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .pills-scroller::-webkit-scrollbar { display: none; }

        .loc-pill {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            color: var(--text-sub);
        }

        .loc-pill:hover { border-color: #999; }

        .loc-pill.selected[data-val="Office"] { background: var(--loc-office-bg); color: var(--loc-office-text); border-color: transparent; }
        .loc-pill.selected[data-val="WFH"] { background: var(--loc-wfh-bg); color: var(--loc-wfh-text); border-color: transparent; }
        .loc-pill.selected[data-val="Shoot"] { background: var(--loc-shoot-bg); color: var(--loc-shoot-text); border-color: transparent; }
        .loc-pill.selected[data-val="PTO"] { background: var(--loc-pto-bg); color: var(--loc-pto-text); border-color: transparent; }
        .loc-pill.selected[data-val="Abroad"] { background: var(--loc-abroad-bg); color: var(--loc-abroad-text); border-color: transparent; }
        .loc-pill.selected[data-val="Half Day"] { background: var(--loc-half-bg); color: var(--loc-half-text); border-color: transparent; }

        /* --- NOTES --- */
        .notes-input {
            width: 100%;
            background: var(--bg-grey);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: inherit;
            font-size: 13px;
            resize: none;
            height: 60px;
            box-sizing: border-box;
        }
        .notes-input:focus { outline: 1px solid var(--brand-pink); background: #fff; }

        /* --- FOOTER --- */
        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 16px 24px;
            background: rgba(255,255,255,0.95);
            border-top: 1px solid var(--border);
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        .submit-btn {
            width: 100%;
            background: var(--brand-black);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .submit-btn:hover { background: #333; }
        .submit-btn:active { transform: scale(0.98); }

        /* --- SUCCESS STATE & ANIMATION --- */
        .success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* THE ANIMATED LOGO GRID */
        .success-logo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12%;
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            transform: rotate(0deg);
        }

        .success-dot {
            width: 100%;
            height: 100%;
            background-color: var(--brand-pink); /* Keeping branding consistent */
            border-radius: 50%;
            animation: pulseWave 3s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Staggered Animation Delays */
        .success-dot:nth-child(1) { animation-delay: 0.0s; }
        .success-dot:nth-child(2) { animation-delay: 0.2s; }
        .success-dot:nth-child(3) { animation-delay: 0.2s; }
        .success-dot:nth-child(4) { animation-delay: 0.4s; }

        @keyframes pulseWave {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(0.92);
                opacity: 0.85;
            }
        }

        .success-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: var(--text-main); }
        .success-desc { font-size: 14px; color: var(--text-sub); max-width: 280px; line-height: 1.5; }
        .reset-link { margin-top: 30px; font-size: 12px; color: var(--text-sub); text-decoration: underline; cursor: pointer; }

    </style>
</head>
<body>

        <div class="scroll-content">
            <div class="section-header" id="week-commencing-header">Week Commencing...</div>

    <!-- SUCCESS SCREEN WITH ANIMATION -->

        <!-- The Animated DMG Pulse Logo -->

        <div class="success-title">Request Sent!</div>
        <div class="success-desc" id="success-msg">Your working locations have been sent.</div>
        <div class="reset-link" onclick="resetForm()">Submit another request</div>
    </div>

</div>

<script>
    // --- BACKEND SETUP ---
    const WEBHOOK_URL = ""; // Paste Make.com Webhook URL here

    // --- DATA ---
    const daysOfWeek = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
    // UPDATED LOCATIONS
    const locations = ['Office', 'WFH', 'Shoot', 'Abroad', 'Half Day', 'PTO'];
    let weekData = {}; 
    let nextMondayDate;

    function init() {
        calculateNextWeek();
        renderDays();
    }

    function calculateNextWeek() {
        const today = new Date();
        const dayOfWeek = today.getDay(); 
        const daysUntilMonday = (dayOfWeek === 0) ? 1 : (8 - dayOfWeek);
        
        nextMondayDate = new Date(today);
        nextMondayDate.setDate(today.getDate() + daysUntilMonday);

        const options = { day: 'numeric', month: 'short' };
        const dateStr = nextMondayDate.toLocaleDateString('en-GB', options).toUpperCase();
        document.getElementById('week-commencing-header').innerText = "WEEK COMMENCING MON " + dateStr;
        
        return dateStr;
    }

    function renderDays() {
        const container = document.getElementById('days-container');
        container.innerHTML = '';

        daysOfWeek.forEach((dayName, index) => {
            let rowDate = new Date(nextMondayDate);
            rowDate.setDate(nextMondayDate.getDate() + index);
            const dateString = rowDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

            if (!weekData[dayName]) weekData[dayName] = 'Office';

            const row = document.createElement('div');
            row.className = 'day-row';

            let pills = '';
            locations.forEach(loc => {
                const isSelected = weekData[dayName] === loc ? 'selected' : '';
                // UPDATED ICONS
                let icon = '';
                if(loc === 'Office') icon = '🏢';
                if(loc === 'WFH') icon = '🏠';
                if(loc === 'Shoot') icon = '🎥';
                if(loc === 'PTO') icon = '✈️';
                if(loc === 'Abroad') icon = '🌍';
                if(loc === 'Half Day') icon = '½';
                
                pills += `<div class="loc-pill ${isSelected}" onclick="selectLoc('${dayName}', '${loc}')" data-val="${loc}">${icon} ${loc}</div>`;
            });

            row.innerHTML = `
                <div class="day-title"><span>${dayName}</span><span class="date-label">${dateString}</span></div>
                <div class="pills-scroller">${pills}</div>
            `;
            container.appendChild(row);
        });
    }

    function selectLoc(day, loc) {
        weekData[day] = loc;
        renderDays();
    }

    async function submitRequest() {
        const name = document.getElementById('staff-name').value;
        const manager = document.getElementById('manager-select').value;
        const notes = document.getElementById('notes-input').value;
        const btn = document.querySelector('.submit-btn');

        if (!name) { alert("Please enter your name."); return; }
        if (!manager) { alert("Please select your Line Manager."); return; }

        btn.innerText = "Sending...";
        
        const payload = {
            staffName: name,
            manager: manager,
            weekCommencing: nextMondayDate.toLocaleDateString('en-GB'),
            rota: weekData,
            notes: notes
        };

        // Construct Clipboard Text
        const clipboardText = `*Rota Request: ${name}*
To: ${manager}
W/C: ${payload.weekCommencing}

Mon: ${weekData.Mon} | Tue: ${weekData.Tue} | Wed: ${weekData.Wed}
Thu: ${weekData.Thu} | Fri: ${weekData.Fri}
Notes: ${notes || "None"}`;

        if (WEBHOOK_URL) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                showSuccess(payload.weekCommencing);
            } catch (error) {
                // Fallback to clipboard
                await navigator.clipboard.writeText(clipboardText);
                showSuccess(payload.weekCommencing);
            }
        } else {
            // No Webhook -> Clipboard
            await navigator.clipboard.writeText(clipboardText);
            showSuccess(payload.weekCommencing);
            setTimeout(() => alert("Request copied to clipboard! Please paste in Slack/Notion."), 800);
        }
    }

    function showSuccess(dateStr) {
        const successScreen = document.getElementById('success-screen');
        const msg = document.getElementById('success-msg');
        msg.innerHTML = `Rota request sent for <strong>W/C ${dateStr}</strong>.<br>To: ${document.getElementById('manager-select').value}`;
        
        successScreen.classList.add('active');
        document.querySelector('.submit-btn').innerText = "Submit Request"; 
    }

    function resetForm() {
        document.getElementById('success-screen').classList.remove('active');
    }

    init();
</script>
