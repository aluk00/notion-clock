<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Log | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue: #21a0d8; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 600px; overflow: hidden; }
        .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; }
        .dot-grid span { width: 5px; height: 5px; border-radius: 50%; background: var(--dmg-blue); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 13px; font-weight: 800; }
        .badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--bg-soft); color: var(--ink-sub); margin-left: auto; }
        .list { max-height: 400px; overflow-y: auto; }
        .entry { padding: 16px 20px; border-bottom: 1px solid #F5F5F5; }
        .entry:last-child { border-bottom: none; }
        .entry-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .entry-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #FFF; flex-shrink: 0; }
        .entry-meta { flex: 1; }
        .entry-name { font-size: 13px; font-weight: 700; }
        .entry-time { font-size: 10px; color: var(--ink-sub); }
        .entry-content { font-size: 13px; color: var(--ink); line-height: 1.5; padding-left: 42px; }
        .entry-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-left: 42px; }
        .tag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--bg-soft); color: var(--ink-sub); }
        .empty { padding: 50px 20px; text-align: center; }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); line-height: 1.5; }
        .loading { display: flex; align-items: center; justify-content: center; padding: 50px; color: var(--ink-sub); font-size: 12px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        
        var db = firebase.firestore();
        var auth = firebase.auth();
        var appId = "dmg-command-centre-native";
        
        var COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316'
        };
        
        var entries = [];
        var root = document.getElementById('root');
        
        function getColor(team) {
            return COLORS[team] || '#21a0d8';
        }
        
        function getInitials(name) {
            if (!name) return '??';
            var parts = name.split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        function timeAgo(date) {
            if (!date) return '';
            var d = date.toDate ? date.toDate() : new Date(date);
            var diff = Math.floor((Date.now() - d.getTime()) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff/60) + 'm ago';
            if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        }

        function render() {
            var entriesHtml = '';
            for (var i = 0; i < entries.length; i++) {
                var e = entries[i];
                var tagsHtml = '';
                if (e.tags && e.tags.length) {
                    for (var j = 0; j < e.tags.length; j++) {
                        tagsHtml += '<span class="tag">' + e.tags[j] + '</span>';
                    }
                }
                
                entriesHtml += '\
                    <div class="entry">\
                        <div class="entry-header">\
                            <div class="entry-avatar" style="background:' + getColor(e.team) + '">' + getInitials(e.author) + '</div>\
                            <div class="entry-meta">\
                                <div class="entry-name">' + (e.author || 'Unknown') + '</div>\
                                <div class="entry-time">' + timeAgo(e.timestamp || e.createdAt) + (e.team ? ' • ' + e.team : '') + '</div>\
                            </div>\
                        </div>\
                        <div class="entry-content">' + (e.content || e.message || '') + '</div>\
                        ' + (tagsHtml ? '<div class="entry-tags">' + tagsHtml + '</div>' : '') + '\
                    </div>\
                ';
            }
            
            root.innerHTML = '\
                <div class="widget">\
                    <div class="header">\
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>\
                        <h2 class="title">Team Log</h2>\
                        <span class="badge">' + entries.length + ' entries</span>\
                    </div>\
                    ' + (entries.length === 0 ? '\
                        <div class="empty">\
                            <div class="empty-icon">📋</div>\
                            <div class="empty-title">No Log Entries</div>\
                            <div class="empty-sub">Team updates will appear here. Add entries to the team_log collection in Firebase with fields: author, team, content, timestamp, tags.</div>\
                        </div>\
                    ' : '\
                        <div class="list">' + entriesHtml + '</div>\
                    ') + '\
                </div>\
            ';
        }

        function loadData() {
            root.innerHTML = '<div class="widget"><div class="loading"><div class="spinner"></div>Loading team log...</div></div>';
            
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('team_log')
                .onSnapshot(function(snapshot) {
                    entries = [];
                    snapshot.forEach(function(doc) {
                        entries.push(Object.assign({ id: doc.id }, doc.data()));
                    });
                    entries.sort(function(a, b) {
                        var aTime = (a.timestamp || a.createdAt);
                        var bTime = (b.timestamp || b.createdAt);
                        aTime = aTime && aTime.toDate ? aTime.toDate() : new Date(aTime || 0);
                        bTime = bTime && bTime.toDate ? bTime.toDate() : new Date(bTime || 0);
                        return bTime - aTime;
                    });
                    render();
                }, function(error) {
                    console.error('Firestore error:', error);
                    entries = [];
                    render();
                });
        }

        auth.signInAnonymously().then(function() {
            loadData();
        }).catch(function(error) {
            console.error('Auth error:', error);
            entries = [];
            render();
        });
    </script>
</body>
</html>
