<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Request | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue:#21a0d8;--border:#EAECEF;--ink:#1C1C1C;--ink-sub:#757575;--bg-soft:#F9FAFB;--success:#22C55E; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: transparent; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 400px; overflow: hidden; }
        .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; }
        .dot-grid span { width: 5px; height: 5px; border-radius: 50%; background: var(--dmg-blue); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 13px; font-weight: 800; flex: 1; }
        .week-nav { display: flex; align-items: center; gap: 6px; }
        .week-btn { width: 24px; height: 24px; border: 1px solid var(--border); background: #FFF; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--ink-sub); }
        .week-btn:hover { border-color: var(--dmg-blue); color: var(--dmg-blue); }
        .week-label { font-size: 10px; font-weight: 700; color: var(--ink-sub); }
        .body { padding: 16px 20px; }
        .field { margin-bottom: 16px; }
        .field-label { font-size: 10px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; margin-bottom: 6px; }
        .field-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; }
        .field-input:focus { outline: none; border-color: var(--dmg-blue); }
        .autocomplete { position: relative; }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #FFF; border: 1px solid var(--border); border-radius: 8px; max-height: 150px; overflow-y: auto; z-index: 10; display: none; }
        .autocomplete-list.show { display: block; }
        .autocomplete-item { padding: 10px 12px; font-size: 12px; cursor: pointer; }
        .autocomplete-item:hover { background: var(--bg-soft); }
        .day-grid { display: flex; flex-direction: column; gap: 8px; }
        .day-row { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg-soft); border-radius: 8px; }
        .day-name { font-size: 11px; font-weight: 700; width: 40px; }
        .day-date { font-size: 10px; color: var(--ink-sub); width: 50px; }
        .day-status { flex: 1; }
        .status-select { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; font-family: inherit; background: #FFF; }
        .footer { padding: 16px 20px; border-top: 1px solid var(--border); }
        .submit-btn { width: 100%; padding: 12px; background: var(--dmg-blue); color: #FFF; border: none; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .submit-btn:hover { background: #1a8fc2; }
        .submit-btn:disabled { background: #E5E5E5; color: #999; cursor: not-allowed; }
        .success { text-align: center; padding: 40px 20px; }
        .success-icon { font-size: 48px; margin-bottom: 12px; }
        .success-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
        .success-sub { font-size: 12px; color: var(--ink-sub); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 50px; color: var(--ink-sub); font-size: 12px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const app = initializeApp({apiKey:"AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",authDomain:"dmg-command-centre-native.firebaseapp.com",projectId:"dmg-command-centre-native",storageBucket:"dmg-command-centre-native.appspot.com",messagingSenderId:"223535956454",appId:"1:223535956454:web:b25e5bc69d8a4a7f209627"});
        const auth = getAuth(app), db = getFirestore(app), appId = "dmg-command-centre-native";
        
        const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
        const STATUSES = ['Office','WFH','Shoot','Client / Travel','PTO','Leave','Abroad','Weekend'];
        const COLORS = {Editorial:'#E94B4B',Creative:'#E6468B',Production:'#43B049',Social:'#F2C316',Operations:'#9333EA',Sales:'#F97316'};
        
        let staffDirectory = [], selectedStaff = null, weekOffset = 1, schedule = {}, isLoading = true, submitted = false;
        const root = document.getElementById('root');
        
        const getMonday = offset => { const d = new Date(); d.setDate(d.getDate() + (7 * offset) + (1 - d.getDay())); return d; };
        const formatDate = d => d.toLocaleDateString('en-GB', {day:'numeric',month:'short'});
        
        const initSchedule = () => { schedule = {}; DAYS.forEach((day, i) => { schedule[day] = { status: i >= 5 ? 'Weekend' : 'Office' }; }); };
        
        function render() {
            if (isLoading) { root.innerHTML = '<div class="widget"><div class="loading"><div class="spinner"></div>Loading...</div></div>'; return; }
            if (submitted) {
                root.innerHTML = `<div class="widget"><div class="success"><div class="success-icon">✓</div><div class="success-title">Rota Submitted</div><div class="success-sub">Your rota for w/c ${formatDate(getMonday(weekOffset))} has been submitted for manager approval.</div></div></div>`;
                return;
            }
            
            const monday = getMonday(weekOffset);
            const staffHtml = staffDirectory.map(s => `<div class="autocomplete-item" onclick="selectStaff('${s.id}')">${s.firstName} ${s.lastName} <span style="color:var(--ink-sub);font-size:10px">${s.team}</span></div>`).join('');
            
            const daysHtml = DAYS.map((day, i) => {
                const d = new Date(monday); d.setDate(monday.getDate() + i);
                const isWeekend = i >= 5;
                const options = STATUSES.map(st => `<option value="${st}"${schedule[day].status === st ? ' selected' : ''}>${st}</option>`).join('');
                return `<div class="day-row"><span class="day-name">${day.slice(0,3)}</span><span class="day-date">${formatDate(d)}</span><div class="day-status"><select class="status-select" onchange="updateStatus('${day}',this.value)"${isWeekend ? ' disabled' : ''}>${options}</select></div></div>`;
            }).join('');
            
            root.innerHTML = `<div class="widget"><div class="header"><div class="dot-grid"><span></span><span></span><span></span><span></span></div><h2 class="title">Rota Request</h2><div class="week-nav"><button class="week-btn" onclick="prevWeek()">‹</button><span class="week-label">w/c ${formatDate(monday)}</span><button class="week-btn" onclick="nextWeek()">›</button></div></div><div class="body"><div class="field autocomplete"><label class="field-label">Your Name</label><input type="text" id="staff-search" class="field-input" placeholder="Search your name..." oninput="filterStaff(this.value)" onfocus="showList()" value="${selectedStaff ? selectedStaff.firstName + ' ' + selectedStaff.lastName : ''}"><div class="autocomplete-list" id="staff-list">${staffHtml}</div></div>${selectedStaff ? `<div class="field"><label class="field-label">Manager</label><div style="padding:10px 12px;background:var(--bg-soft);border-radius:8px;font-size:12px;font-weight:600">${selectedStaff.manager || 'Not assigned'}</div></div>` : ''}<div class="field"><label class="field-label">Schedule</label><div class="day-grid">${daysHtml}</div></div></div><div class="footer"><button class="submit-btn" onclick="submitRota()"${selectedStaff ? '' : ' disabled'}>Submit Rota Request</button></div></div>`;
        }
        
        window.prevWeek = () => { weekOffset--; initSchedule(); render(); };
        window.nextWeek = () => { weekOffset++; initSchedule(); render(); };
        window.showList = () => { document.getElementById('staff-list').classList.add('show'); };
        window.filterStaff = val => {
            const list = document.getElementById('staff-list');
            list.querySelectorAll('.autocomplete-item').forEach(item => {
                item.style.display = item.textContent.toLowerCase().includes(val.toLowerCase()) ? 'block' : 'none';
            });
            list.classList.add('show');
        };
        window.selectStaff = id => { selectedStaff = staffDirectory.find(s => s.id === id); document.getElementById('staff-list').classList.remove('show'); render(); };
        window.updateStatus = (day, val) => { schedule[day].status = val; };
        
        window.submitRota = async () => {
            if (!selectedStaff) return;
            const monday = getMonday(weekOffset);
            try {
                // Write to rota_requests (what manager dashboard reads)
                await addDoc(collection(db, "artifacts", appId, "public", "data", "rota_requests"), {
                    staffId: selectedStaff.id,
                    firstName: selectedStaff.firstName,
                    lastName: selectedStaff.lastName,
                    name: selectedStaff.firstName + ' ' + selectedStaff.lastName,
                    team: selectedStaff.team,
                    manager: selectedStaff.manager || '',
                    weekStart: monday.toISOString().split('T')[0],
                    schedule: schedule,
                    status: 'pending',
                    type: 'Schedule',
                    reason: 'Weekly rota submission',
                    startDate: monday,
                    endDate: new Date(monday.getTime() + 6 * 24 * 60 * 60 * 1000),
                    submittedAt: serverTimestamp()
                });
                submitted = true; render();
            } catch (e) { console.error('Submit error:', e); alert('Error submitting rota. Please try again.'); }
        };
        
        document.addEventListener('click', e => {
            if (!e.target.closest('.autocomplete')) {
                const list = document.getElementById('staff-list');
                if (list) list.classList.remove('show');
            }
        });
        
        async function loadStaff() {
            try {
                const snap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                staffDirectory = []; snap.forEach(d => staffDirectory.push({ id: d.id, ...d.data() }));
                staffDirectory.sort((a, b) => (a.firstName + a.lastName).localeCompare(b.firstName + b.lastName));
                isLoading = false; initSchedule(); render();
            } catch (e) { console.error('Load staff error:', e); isLoading = false; render(); }
        }
        
        onAuthStateChanged(auth, user => {
            if (user) loadStaff();
            else signInAnonymously(auth).catch(e => { console.error('Auth failed:', e); isLoading = false; render(); });
        });
    </script>
</body>
</html>
