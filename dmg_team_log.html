<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Request | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dmg-blue: #21a0d8; 
            --dmg-blue-light: #e8f6fc;
            --dmg-blue-soft: rgba(33, 160, 216, 0.08); 
            --dmg-blue-glow: rgba(33, 160, 216, 0.2);
            --border: #E5E7EB; 
            --ink: #1C1C1C; 
            --ink-sub: #6B7280; 
            --success: #2E7D32; 
            --st-office: #2E7D32;
            --st-wfh: #F9A825;
            --st-shoot: #2196F3;
            --st-leave: #F44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: transparent; padding: 12px; color: var(--ink); -webkit-font-smoothing: antialiased; }
        
        .widget { 
            background: #FFF; 
            border: 1.5px solid var(--dmg-blue-glow); 
            border-radius: 20px; 
            max-width: 400px; 
            overflow: hidden; 
            position: relative;
            box-shadow: 0 12px 30px -5px rgba(33, 160, 216, 0.15);
        }
        
        /* Frost Overlay */
        #frost-overlay {
            position: absolute; inset: 0; background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 100; display: none; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 24px;
        }
        .frost-content { 
            background: white; padding: 28px; border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(33, 160, 216, 0.2); 
            border: 2px solid var(--dmg-blue);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } }
        .frost-title { font-weight: 900; font-size: 16px; margin-bottom: 8px; color: var(--dmg-blue); text-transform: uppercase; letter-spacing: 0.02em; }
        .frost-sub { font-size: 12px; color: var(--ink-sub); margin-bottom: 20px; line-height: 1.5; }

        .header { 
            padding: 18px 24px; 
            border-bottom: 1px solid var(--dmg-blue-soft); 
            display: flex; align-items: center; gap: 12px;
            background: linear-gradient(to bottom, var(--dmg-blue-soft), white);
        }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dmg-blue); animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 14px; font-weight: 900; flex: 1; text-transform: uppercase; letter-spacing: 0.02em; color: var(--dmg-blue); }
        .week-nav { display: flex; align-items: center; gap: 8px; background: var(--dmg-blue-soft); padding: 4px; border-radius: 10px; }
        .week-btn { 
            width: 26px; height: 26px; border: none; background: white; 
            border-radius: 8px; font-size: 16px; cursor: pointer; color: var(--dmg-blue); 
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-weight: 800;
        }
        .week-btn:hover { background: var(--dmg-blue); color: white; transform: scale(1.05); }
        .week-label { font-size: 11px; font-weight: 800; color: var(--dmg-blue); padding: 0 4px; }

        .body { padding: 20px 24px; }
        .field { margin-bottom: 20px; }
        .field-label { font-size: 10px; font-weight: 800; color: var(--dmg-blue); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em; }
        .field-input { 
            width: 100%; padding: 12px 16px; border: 2px solid var(--dmg-blue-glow); border-radius: 12px; 
            font-size: 13px; font-weight: 600; font-family: inherit; transition: all 0.2s;
            background: var(--dmg-blue-soft); color: var(--ink);
        }
        .field-input:focus { outline: none; border-color: var(--dmg-blue); background: white; }

        /* Custom Dropdown Styling */
        .custom-select { position: relative; user-select: none; }
        .select-trigger { 
            padding: 10px 14px; background: white; border: 2px solid var(--border); 
            border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s;
        }
        .select-trigger:hover { border-color: var(--dmg-blue); }
        .select-options { 
            position: absolute; top: calc(100% + 4px); left: 0; right: 0; 
            background: white; border: 2px solid var(--dmg-blue); border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 150; display: none;
            overflow: hidden;
        }
        .select-options.show { display: block; }
        .option { 
            padding: 12px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--bg-soft);
        }
        .option:hover { background: var(--dmg-blue-soft); color: var(--dmg-blue); }
        .option.selected { background: var(--dmg-blue-light); color: var(--dmg-blue); }

        .day-row { 
            display: flex; align-items: center; gap: 12px; padding: 10px 14px; 
            background: var(--dmg-blue-soft); border-radius: 14px; margin-bottom: 8px;
            transition: all 0.2s; border: 1px solid transparent;
        }
        .day-row:hover { background: white; border-color: var(--dmg-blue-glow); }
        .day-name { font-size: 11px; font-weight: 900; width: 35px; color: var(--dmg-blue); text-transform: uppercase; }
        .day-date { font-size: 10px; color: var(--ink-sub); width: 45px; font-weight: 600; }
        .day-status { flex: 1; }

        .footer { padding: 20px 24px; border-top: 1px solid var(--border); background: var(--dmg-blue-soft); }
        .submit-btn { 
            width: 100%; padding: 16px; background: var(--dmg-blue); color: #FFF; border: none; 
            border-radius: 14px; font-size: 12px; font-weight: 900; text-transform: uppercase; 
            letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(33, 160, 216, 0.25);
        }
        .submit-btn:hover { transform: translateY(-1px); background: #1a8fc2; box-shadow: 0 6px 15px rgba(33, 160, 216, 0.4); }
        .submit-btn:disabled { background: #CBD5E1; color: #F1F5F9; cursor: not-allowed; box-shadow: none; transform: none; }
        
        /* Success State */
        .success { text-align: center; padding: 50px 30px; }
        .success-icon { font-size: 48px; margin-bottom: 16px; display: block; }

        .autocomplete-list { 
            position: absolute; top: 100%; left: 0; right: 0; background: #FFF; 
            border: 2px solid var(--dmg-blue); border-radius: 12px; max-height: 180px; 
            overflow-y: auto; z-index: 200; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .autocomplete-list.show { display: block; }
        .autocomplete-item { padding: 12px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--bg-soft); }
        .autocomplete-item:hover { background: var(--dmg-blue-soft); color: var(--dmg-blue); }

        .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--dmg-blue); font-size: 13px; font-weight: 800; }
        .spinner { width: 24px; height: 24px; border: 3px solid var(--dmg-blue-glow); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app), db = getFirestore(app), appId = "dmg-command-centre-native";
        
        const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
        
        // Match Office Outlook language & colors
        const STATUSES = [
            { id: 'In Building', label: 'In Building', emoji: '🏢', color: '#2E7D32' },
            { id: 'Remote', label: 'Remote', emoji: '🏠', color: '#F9A825' },
            { id: 'Off-Site (Shoot)', label: 'Off-Site (Shoot)', emoji: '🎥', color: '#2196F3' },
            { id: 'Off-Site (Client)', label: 'Off-Site (Client)', emoji: '🤝', color: '#2196F3' },
            { id: 'On Leave', label: 'On Leave', emoji: '🌴', color: '#F44336' }
        ];

        const WEEKEND_STATUSES = [
            { id: 'Weekend', label: 'Weekend', emoji: '✨', color: '#6B7280' },
            { id: 'Off-Site (Shoot)', label: 'Off-Site (Shoot)', emoji: '🎥', color: '#2196F3' },
            { id: 'Off-Site (Client)', label: 'Off-Site (Client)', emoji: '🤝', color: '#2196F3' }
        ];
        
        let state = {
            staff: [],
            selectedStaff: null,
            weekOffset: 1,
            schedule: {},
            isLoading: true,
            submitted: false,
            existingDocId: null,
            isEditing: false
        };

        const getMonday = offset => { 
            const d = new Date(); 
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff + (7 * offset));
            d.setHours(0,0,0,0);
            return d; 
        };

        const formatDate = d => d.toLocaleDateString('en-GB', {day:'numeric',month:'short'});
        
        const initSchedule = (existing = null) => { 
            state.schedule = {}; 
            DAYS.forEach((day, i) => { 
                if (existing && existing[day]) {
                    state.schedule[day] = existing[day];
                } else {
                    state.schedule[day] = { status: i >= 5 ? 'Weekend' : 'In Building' }; 
                }
            }); 
        };

        async function checkExisting() {
            if (!state.selectedStaff) return;
            const weekStart = getMonday(state.weekOffset).toISOString().split('T')[0];
            
            const q = query(
                collection(db, "artifacts", appId, "public", "data", "rota_requests"),
                where("staffId", "==", state.selectedStaff.id),
                where("weekStart", "==", weekStart)
            );

            try {
                const snap = await getDocs(q);
                if (!snap.empty) {
                    const docData = snap.docs[0].data();
                    state.existingDocId = snap.docs[0].id;
                    if (!state.isEditing) {
                        document.getElementById('frost-overlay').style.display = 'flex';
                    }
                    initSchedule(docData.schedule);
                } else {
                    state.existingDocId = null;
                    document.getElementById('frost-overlay').style.display = 'none';
                    initSchedule();
                }
                render();
            } catch (e) { console.error("Query error", e); }
        }

        window.toggleEdit = () => {
            state.isEditing = true;
            document.getElementById('frost-overlay').style.display = 'none';
            render();
        };

        window.prevWeek = () => { 
            state.weekOffset--; 
            state.isEditing = false; 
            render(); // Immediate feedback
            checkExisting(); 
        };

        window.nextWeek = () => { 
            state.weekOffset++; 
            state.isEditing = false; 
            render(); // Immediate feedback
            checkExisting(); 
        };
        
        window.selectStaff = id => { 
            state.selectedStaff = state.staff.find(s => s.id === id); 
            document.getElementById('staff-list').classList.remove('show'); 
            checkExisting(); 
        };

        window.updateStatus = (day, val) => { 
            state.schedule[day].status = val; 
            document.querySelectorAll('.select-options').forEach(o => o.classList.remove('show'));
            render(); 
        };

        window.submitRota = async () => {
            const monday = getMonday(state.weekOffset);
            const payload = {
                staffId: state.selectedStaff.id,
                name: state.selectedStaff.firstName + ' ' + state.selectedStaff.lastName,
                firstName: state.selectedStaff.firstName,
                lastName: state.selectedStaff.lastName,
                team: state.selectedStaff.team,
                weekStart: monday.toISOString().split('T')[0],
                weekId: monday.toISOString().split('T')[0], // For Outlook widget
                schedule: DAYS.map(d => ({ status: state.schedule[d].status })), // Array format for Outlook widget
                status: 'pending',
                submittedAt: serverTimestamp()
            };

            try {
                if (state.existingDocId) {
                    await updateDoc(doc(db, "artifacts", appId, "public", "data", "rota_requests", state.existingDocId), payload);
                } else {
                    await addDoc(collection(db, "artifacts", appId, "public", "data", "rota_requests"), payload);
                }
                state.submitted = true; 
                render();
            } catch (e) { alert('Error: ' + e.message); }
        };

        function render() {
            const root = document.getElementById('root');
            if (state.isLoading) { root.innerHTML = '<div class="widget"><div class="loading"><div class="spinner"></div>Syncing...</div></div>'; return; }
            
            if (state.submitted) {
                root.innerHTML = `
                    <div class="widget">
                        <div class="success">
                            <span class="success-icon">🚀</span>
                            <div class="frost-title">Rota Synced</div>
                            <div class="frost-sub">Updates are now live on the manager dashboard for w/c ${formatDate(getMonday(state.weekOffset))}.</div>
                            <button class="submit-btn" style="background:var(--ink)" onclick="location.reload()">Send Another</button>
                        </div>
                    </div>`;
                return;
            }

            const monday = getMonday(state.weekOffset);
            
            const daysHtml = DAYS.map((day, i) => {
                const d = new Date(monday); d.setDate(monday.getDate() + i);
                const currentStatus = state.schedule[day]?.status || (i >= 5 ? 'Weekend' : 'In Building');
                const isWeekend = i >= 5;
                const pool = isWeekend ? WEEKEND_STATUSES : STATUSES;
                const statusObj = pool.find(s => s.id === currentStatus) || pool[0];

                return `
                    <div class="day-row">
                        <span class="day-name">${day.slice(0,3)}</span>
                        <span class="day-date">${formatDate(d)}</span>
                        <div class="day-status">
                            <div class="custom-select" id="select-${day}">
                                <div class="select-trigger" onclick="toggleDropdown('${day}')">
                                    <span style="display:flex; align-items:center; gap:8px;">
                                        <span>${statusObj.emoji}</span>
                                        <span style="color:${statusObj.color}">${statusObj.label}</span>
                                    </span>
                                    <span style="font-size:10px; color:var(--dmg-blue); opacity:0.6;">▾</span>
                                </div>
                                <div class="select-options" id="options-${day}">
                                    ${pool.map(st => `
                                        <div class="option ${currentStatus === st.id ? 'selected' : ''}" onclick="updateStatus('${day}','${st.id}')">
                                            <span>${st.emoji}</span>
                                            <span style="color:${st.color}">${st.label}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            root.innerHTML = `
                <div class="widget">
                    <div id="frost-overlay">
                        <div class="frost-content">
                            <div class="frost-title">Already Synced ✨</div>
                            <div class="frost-sub">Your rota for this week is already on the dashboard. Need to change it?</div>
                            <button class="submit-btn" onclick="toggleEdit()">Update Submission</button>
                        </div>
                    </div>

                    <div class="header">
                        <div class="dot-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <h2 class="title">Rota Request</h2>
                        <div class="week-nav">
                            <button class="week-btn" onclick="prevWeek()">‹</button>
                            <span class="week-label">${formatDate(monday)}</span>
                            <button class="week-btn" onclick="nextWeek()">›</button>
                        </div>
                    </div>
                    <div class="body">
                        <div class="field autocomplete" style="position:relative">
                            <label class="field-label">Select Your Name</label>
                            <input type="text" id="staff-search" class="field-input" placeholder="Start typing..." oninput="window.filterStaff(this.value)" onfocus="window.showList()" value="${state.selectedStaff ? state.selectedStaff.firstName + ' ' + state.selectedStaff.lastName : ''}">
                            <div class="autocomplete-list" id="staff-list">
                                ${state.staff.map(s => `<div class="autocomplete-item" onclick="selectStaff('${s.id}')">${s.firstName} ${s.lastName} <span style="color:var(--ink-sub);font-size:10px;font-weight:400;">(${s.team})</span></div>`).join('')}
                            </div>
                        </div>
                        <div class="field">
                            <label class="field-label">Weekly Schedule</label>
                            <div class="day-grid">${daysHtml}</div>
                        </div>
                    </div>
                    <div class="footer">
                        <button class="submit-btn" onclick="submitRota()" ${state.selectedStaff ? '' : 'disabled'}>
                            ${state.isEditing ? 'Update Rota' : 'Sync to Dashboard'}
                        </button>
                    </div>
                </div>
            `;
        }

        window.toggleDropdown = (day) => {
            const el = document.getElementById(`options-${day}`);
            const all = document.querySelectorAll('.select-options');
            all.forEach(o => { if(o.id !== `options-${day}`) o.classList.remove('show'); });
            el.classList.toggle('show');
        };

        window.showList = () => document.getElementById('staff-list').classList.add('show');
        window.filterStaff = val => {
            const list = document.getElementById('staff-list');
            list.querySelectorAll('.autocomplete-item').forEach(item => {
                item.style.display = item.textContent.toLowerCase().includes(val.toLowerCase()) ? 'block' : 'none';
            });
            list.classList.add('show');
        };

        async function loadStaff() {
            try {
                const snap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                state.staff = []; snap.forEach(d => state.staff.push({ id: d.id, ...d.data() }));
                state.staff.sort((a,b) => a.firstName.localeCompare(b.firstName));
                state.isLoading = false; initSchedule(); render();
            } catch (e) { console.error(e); }
        }

        onAuthStateChanged(auth, user => { if(user) loadStaff(); else signInAnonymously(auth); });

        document.addEventListener('click', e => {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.select-options').forEach(o => o.classList.remove('show'));
            }
            if (!e.target.closest('.autocomplete')) {
                const list = document.getElementById('staff-list');
                if(list) list.classList.remove('show');
            }
        });

    </script>
</body>
</html>
