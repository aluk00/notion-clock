<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Request | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Core Colors - Unified Design System */
            --ink: #0F172A;
            --ink-sub: #64748B;
            --ink-muted: #94A3B8;
            --border: #E2E8F0;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;

            /* Primary Brand */
            --dmg-blue: #21A0D8;
            --dmg-blue-soft: rgba(33, 160, 216, 0.1);
            --dmg-blue-glow: rgba(33, 160, 216, 0.15);

            /* Status Colors */
            --success: #43B049;
            --st-office: #43B049;
            --st-wfh: #F59E0B;
            --st-shoot: #21A0D8;
            --st-leave: #E94B4B;

            /* Layout */
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: transparent; padding: 12px; color: var(--ink); -webkit-font-smoothing: antialiased; }

        .widget {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 400px;
            overflow: hidden;
            position: relative;
        }

        /* Frost Overlay */
        #frost-overlay {
            position: absolute; inset: 0; background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 100; display: none; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 24px;
        }
        .frost-content {
            background: white; padding: 24px; border-radius: var(--radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
        .frost-title { font-weight: 800; font-size: 13px; margin-bottom: 8px; color: var(--ink); text-transform: uppercase; letter-spacing: 0.05em; }
        .frost-sub { font-size: 11px; color: var(--ink-sub); margin-bottom: 20px; line-height: 1.5; }

        .header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
            background: var(--surface);
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }
        .dot:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .title {
            font-size: 13px;
            font-weight: 800;
            flex: 1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--dmg-blue);
        }
        .week-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--surface-alt);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .week-btn {
            width: 24px; height: 24px; border: none; background: var(--surface);
            border-radius: 6px; font-size: 14px; cursor: pointer; color: var(--ink-sub);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; align-items: center; justify-content: center; font-weight: 700;
        }
        .week-btn:hover { background: var(--dmg-blue); color: white; }
        .week-label { font-size: 10px; font-weight: 700; color: var(--ink-sub); padding: 0 6px; }

        .body { padding: 16px; }
        .field { margin-bottom: 16px; }
        .field-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.05em;
            display: block;
        }
        .field-input {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 12px; font-weight: 500; font-family: inherit; transition: all 0.2s;
            background: var(--surface); color: var(--ink);
        }
        .field-input:focus { outline: none; border-color: var(--dmg-blue); box-shadow: 0 0 0 3px var(--dmg-blue-soft); }

        /* Custom Dropdown Styling */
        .custom-select { position: relative; user-select: none; }
        .select-trigger {
            padding: 8px 10px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.15s ease;
        }
        .select-trigger:hover { border-color: #D1D5DB; background: var(--surface-alt); }
        .select-options {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 150; display: none;
            overflow: hidden;
        }
        .select-options.show { display: block; }
        .option {
            padding: 10px 12px; font-size: 11px; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--surface-alt);
            transition: background 0.1s ease;
        }
        .option:last-child { border-bottom: none; }
        .option:hover { background: var(--surface-alt); }
        .option.selected { background: var(--dmg-blue-soft); color: var(--dmg-blue); font-weight: 600; }

        .day-row {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            background: var(--surface-alt); border-radius: var(--radius-sm); margin-bottom: 6px;
            transition: all 0.15s ease; border: 1px solid transparent;
        }
        .day-row:hover { background: var(--surface); border-color: var(--border); }
        .day-name { font-size: 10px; font-weight: 700; width: 32px; color: var(--ink); text-transform: uppercase; }
        .day-date { font-size: 9px; color: var(--ink-muted); width: 45px; font-weight: 500; }
        .day-status { flex: 1; }

        .footer { padding: 16px; border-top: 1px solid var(--border); background: var(--surface-alt); }
        .submit-btn {
            width: 100%; padding: 12px; background: var(--dmg-blue); color: #FFF; border: none;
            border-radius: var(--radius-sm); font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .submit-btn:hover { transform: translateY(-1px); background: #1a8ac0; box-shadow: 0 4px 12px rgba(33, 160, 216, 0.2); }
        .submit-btn:disabled { background: #CBD5E1; color: #F1F5F9; cursor: not-allowed; transform: none; }

        /* Success State */
        .success { text-align: center; padding: 40px 24px; }
        .success-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--success);
            color: white;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; background: var(--surface);
            border: 1px solid var(--border); border-radius: var(--radius-sm); max-height: 180px;
            overflow-y: auto; z-index: 200; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .autocomplete-list.show { display: block; }
        .autocomplete-item {
            padding: 10px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
            border-bottom: 1px solid var(--surface-alt);
            transition: background 0.1s ease;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background: var(--surface-alt); }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 12px;
        }
        .loading-text {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app), db = getFirestore(app), appId = "dmg-command-centre-native";
        
        const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
        
        // Match Office Outlook language & colors
        const STATUSES = [
            { id: 'In Building', label: 'In Building', emoji: '🏢', color: '#2E7D32' },
            { id: 'Remote', label: 'Remote', emoji: '🏠', color: '#F9A825' },
            { id: 'Off-Site (Shoot)', label: 'Off-Site (Shoot)', emoji: '🎥', color: '#2196F3' },
            { id: 'Off-Site (Client)', label: 'Off-Site (Client)', emoji: '🤝', color: '#2196F3' },
            { id: 'On Leave', label: 'On Leave', emoji: '🌴', color: '#F44336' }
        ];

        const WEEKEND_STATUSES = [
            { id: 'Weekend', label: 'Weekend', emoji: '✨', color: '#6B7280' },
            { id: 'Off-Site (Shoot)', label: 'Off-Site (Shoot)', emoji: '🎥', color: '#2196F3' },
            { id: 'Off-Site (Client)', label: 'Off-Site (Client)', emoji: '🤝', color: '#2196F3' }
        ];
        
        let state = {
            staff: [],
            selectedStaff: null,
            weekOffset: 1,
            schedule: {},
            isLoading: true,
            submitted: false,
            existingDocId: null,
            isEditing: false
        };

        const getMonday = offset => { 
            const d = new Date(); 
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff + (7 * offset));
            d.setHours(0,0,0,0);
            return d; 
        };

        const formatDate = d => d.toLocaleDateString('en-GB', {day:'numeric',month:'short'});
        
        const initSchedule = (existing = null) => { 
            state.schedule = {}; 
            DAYS.forEach((day, i) => { 
                if (existing && existing[day]) {
                    state.schedule[day] = existing[day];
                } else {
                    state.schedule[day] = { status: i >= 5 ? 'Weekend' : 'In Building' }; 
                }
            }); 
        };

        async function checkExisting() {
            if (!state.selectedStaff) return;
            const weekStart = getMonday(state.weekOffset).toISOString().split('T')[0];
            
            const q = query(
                collection(db, "artifacts", appId, "public", "data", "rota_requests"),
                where("staffId", "==", state.selectedStaff.id),
                where("weekStart", "==", weekStart)
            );

            try {
                const snap = await getDocs(q);
                if (!snap.empty) {
                    const docData = snap.docs[0].data();
                    state.existingDocId = snap.docs[0].id;
                    if (!state.isEditing) {
                        document.getElementById('frost-overlay').style.display = 'flex';
                    }
                    initSchedule(docData.schedule);
                } else {
                    state.existingDocId = null;
                    document.getElementById('frost-overlay').style.display = 'none';
                    initSchedule();
                }
                render();
            } catch (e) { console.error("Query error", e); }
        }

        window.toggleEdit = () => {
            state.isEditing = true;
            document.getElementById('frost-overlay').style.display = 'none';
            render();
        };

        window.prevWeek = () => { 
            state.weekOffset--; 
            state.isEditing = false; 
            render(); // Immediate feedback
            checkExisting(); 
        };

        window.nextWeek = () => { 
            state.weekOffset++; 
            state.isEditing = false; 
            render(); // Immediate feedback
            checkExisting(); 
        };
        
        window.selectStaff = id => { 
            state.selectedStaff = state.staff.find(s => s.id === id); 
            document.getElementById('staff-list').classList.remove('show'); 
            checkExisting(); 
        };

        window.updateStatus = (day, val) => { 
            state.schedule[day].status = val; 
            document.querySelectorAll('.select-options').forEach(o => o.classList.remove('show'));
            render(); 
        };

        window.submitRota = async () => {
            const monday = getMonday(state.weekOffset);
            const payload = {
                staffId: state.selectedStaff.id,
                name: state.selectedStaff.firstName + ' ' + state.selectedStaff.lastName,
                firstName: state.selectedStaff.firstName,
                lastName: state.selectedStaff.lastName,
                team: state.selectedStaff.team,
                weekStart: monday.toISOString().split('T')[0],
                weekId: monday.toISOString().split('T')[0], // For Outlook widget
                schedule: DAYS.map(d => ({ status: state.schedule[d].status })), // Array format for Outlook widget
                status: 'pending',
                submittedAt: serverTimestamp()
            };

            try {
                if (state.existingDocId) {
                    await updateDoc(doc(db, "artifacts", appId, "public", "data", "rota_requests", state.existingDocId), payload);
                } else {
                    await addDoc(collection(db, "artifacts", appId, "public", "data", "rota_requests"), payload);
                }
                state.submitted = true; 
                render();
            } catch (e) { alert('Error: ' + e.message); }
        };

        function render() {
            const root = document.getElementById('root');
            if (state.isLoading) { root.innerHTML = '<div class="widget"><div class="loading"><div class="dot-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span class="loading-text">Syncing...</span></div></div>'; return; }
            
            if (state.submitted) {
                root.innerHTML = `
                    <div class="widget">
                        <div class="success">
                            <span class="success-icon">✓</span>
                            <div class="frost-title">Rota Synced</div>
                            <div class="frost-sub">Updates are now live on the manager dashboard for w/c ${formatDate(getMonday(state.weekOffset))}.</div>
                            <button class="submit-btn" onclick="location.reload()">Submit Another</button>
                        </div>
                    </div>`;
                return;
            }

            const monday = getMonday(state.weekOffset);
            
            const daysHtml = DAYS.map((day, i) => {
                const d = new Date(monday); d.setDate(monday.getDate() + i);
                const currentStatus = state.schedule[day]?.status || (i >= 5 ? 'Weekend' : 'In Building');
                const isWeekend = i >= 5;
                const pool = isWeekend ? WEEKEND_STATUSES : STATUSES;
                const statusObj = pool.find(s => s.id === currentStatus) || pool[0];

                return `
                    <div class="day-row">
                        <span class="day-name">${day.slice(0,3)}</span>
                        <span class="day-date">${formatDate(d)}</span>
                        <div class="day-status">
                            <div class="custom-select" id="select-${day}">
                                <div class="select-trigger" onclick="toggleDropdown('${day}')">
                                    <span style="display:flex; align-items:center; gap:6px;">
                                        <span>${statusObj.emoji}</span>
                                        <span style="color:${statusObj.color}">${statusObj.label}</span>
                                    </span>
                                    <span style="font-size:9px; color:var(--ink-muted);">▾</span>
                                </div>
                                <div class="select-options" id="options-${day}">
                                    ${pool.map(st => `
                                        <div class="option ${currentStatus === st.id ? 'selected' : ''}" onclick="updateStatus('${day}','${st.id}')">
                                            <span>${st.emoji}</span>
                                            <span style="color:${st.color}">${st.label}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            root.innerHTML = `
                <div class="widget">
                    <div id="frost-overlay">
                        <div class="frost-content">
                            <div class="frost-title">Already Synced ✨</div>
                            <div class="frost-sub">Your rota for this week is already on the dashboard. Need to change it?</div>
                            <button class="submit-btn" onclick="toggleEdit()">Update Submission</button>
                        </div>
                    </div>

                    <div class="header">
                        <div class="dot-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <h2 class="title">Rota Request</h2>
                        <div class="week-nav">
                            <button class="week-btn" onclick="prevWeek()">‹</button>
                            <span class="week-label">${formatDate(monday)}</span>
                            <button class="week-btn" onclick="nextWeek()">›</button>
                        </div>
                    </div>
                    <div class="body">
                        <div class="field autocomplete" style="position:relative">
                            <label class="field-label">Select Your Name</label>
                            <input type="text" id="staff-search" class="field-input" placeholder="Start typing..." oninput="window.filterStaff(this.value)" onfocus="window.showList()" value="${state.selectedStaff ? state.selectedStaff.firstName + ' ' + state.selectedStaff.lastName : ''}">
                            <div class="autocomplete-list" id="staff-list">
                                ${state.staff.map(s => `<div class="autocomplete-item" onclick="selectStaff('${s.id}')">${s.firstName} ${s.lastName} <span style="color:var(--ink-sub);font-size:10px;font-weight:400;">(${s.team})</span></div>`).join('')}
                            </div>
                        </div>
                        <div class="field">
                            <label class="field-label">Weekly Schedule</label>
                            <div class="day-grid">${daysHtml}</div>
                        </div>
                    </div>
                    <div class="footer">
                        <button class="submit-btn" onclick="submitRota()" ${state.selectedStaff ? '' : 'disabled'}>
                            ${state.isEditing ? 'Update Rota' : 'Sync to Dashboard'}
                        </button>
                    </div>
                </div>
            `;
        }

        window.toggleDropdown = (day) => {
            const el = document.getElementById(`options-${day}`);
            const all = document.querySelectorAll('.select-options');
            all.forEach(o => { if(o.id !== `options-${day}`) o.classList.remove('show'); });
            el.classList.toggle('show');
        };

        window.showList = () => document.getElementById('staff-list').classList.add('show');
        window.filterStaff = val => {
            const list = document.getElementById('staff-list');
            list.querySelectorAll('.autocomplete-item').forEach(item => {
                item.style.display = item.textContent.toLowerCase().includes(val.toLowerCase()) ? 'block' : 'none';
            });
            list.classList.add('show');
        };

        async function loadStaff() {
            try {
                const snap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                state.staff = []; snap.forEach(d => state.staff.push({ id: d.id, ...d.data() }));
                state.staff.sort((a,b) => a.firstName.localeCompare(b.firstName));
                state.isLoading = false; initSchedule(); render();
            } catch (e) { console.error(e); }
        }

        onAuthStateChanged(auth, user => { if(user) loadStaff(); else signInAnonymously(auth); });

        document.addEventListener('click', e => {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.select-options').forEach(o => o.classList.remove('show'));
            }
            if (!e.target.closest('.autocomplete')) {
                const list = document.getElementById('staff-list');
                if(list) list.classList.remove('show');
            }
        });

    </script>
</body>
</html>
