<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMG Rota Request | Auth</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      :root {
          --dmg-blue: #21a0d8;
          --border: #EAECEF;
          --text-main: #1f2937;
          --text-sub: #6b7280;
          --bg-grey: #f9fafb;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: transparent;
        margin: 0;
        padding: 10px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        color: var(--text-main);
      }
      .widget-card {
        width: 100%;
        max-width: 340px; 
      }
      @keyframes heartbeat { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
      .dot-anim { animation: heartbeat 3s infinite ease-in-out; }
      .dot-anim:nth-child(1) { animation-delay: 0s; }
      .dot-anim:nth-child(2) { animation-delay: 0.75s; }
      .dot-anim:nth-child(4) { animation-delay: 1.5s; }
      .dot-anim:nth-child(3) { animation-delay: 2.25s; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
      .custom-scroll::-webkit-scrollbar { width: 4px; }
      .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
      .custom-scroll::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
      
      .user-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--bg-grey);
        border-radius: 12px;
        margin-bottom: 16px;
      }
      .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        color: #FFF;
      }
      .user-info { flex: 1; }
      .user-name { font-size: 13px; font-weight: 800; color: var(--text-main); }
      .user-team { font-size: 10px; font-weight: 600; color: var(--text-sub); }
      
      .auth-prompt {
        padding: 60px 24px;
        text-align: center;
      }
      .auth-icon { font-size: 48px; margin-bottom: 16px; }
      .auth-title { font-size: 16px; font-weight: 900; color: var(--text-main); margin-bottom: 8px; }
      .auth-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }
      .auth-btn {
        padding: 14px 28px;
        background: var(--dmg-blue);
        color: #FFF;
        border: none;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
      }
      .auth-btn:hover { filter: brightness(1.1); }
      
      .demo-badge {
        font-size: 7px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #FFF;
        background: #E6468B;
        padding: 3px 6px;
        border-radius: 4px;
      }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        const appId = 'dmg-command-centre-native';
        const staffDirectoryCollection = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('staff_directory');
        const rotaSubmissionsCollection = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rota_submissions');
        
        const TEAM_COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Social Video': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316'
        };

        const normalize = (n) => n ? n.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase() : "";
        
        const DotGrid = ({ color = "var(--dmg-blue)" }) => (
            <div className="grid grid-cols-2 gap-1 w-fit">
                {[...Array(4)].map((_, i) => (
                    <span key={i} className="dot-anim w-1.5 h-1.5 rounded-full" style={{ backgroundColor: color }}></span>
                ))}
            </div>
        );

        const DayRow = ({ day, date, selection, isWeekend, onUpdate }) => {
            const locs = ["Office", "WFH", "Shoot", "PTO"];
            const weekendLocs = ["Weekend", "Shoot"];
            const options = isWeekend ? weekendLocs : locs;
            return (
                <div className="border-b border-gray-50 last:border-0 pb-6 last:pb-0">
                    <div className="flex items-baseline gap-2 mb-3">
                        <span className="text-[11px] font-black uppercase tracking-tight text-gray-800">{day}</span>
                        <span className="text-[9px] font-bold text-[--dmg-blue] uppercase tracking-widest opacity-60">
                            {date.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
                        </span>
                    </div>
                    <div className="flex gap-1.5 overflow-x-auto py-1 -mx-1 px-1 custom-scroll">
                        {options.map(l => (
                            <button
                                key={l}
                                onClick={() => onUpdate(day, 'status', l)}
                                className={`shrink-0 px-3 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-wide border-2 transition-all
                                    ${selection.status === l 
                                        ? (l === 'Weekend' ? 'bg-gray-100 text-gray-400 border-gray-200' : 'bg-[--dmg-blue] text-white border-[--dmg-blue]') 
                                        : 'bg-white text-gray-400 border-gray-100 hover:border-[--dmg-blue] hover:text-[--dmg-blue]'
                                    }`}
                            >
                                {l}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        function App() {
            const { useState, useEffect, useMemo } = React;
            
            // Auth & Identity State
            const [authState, setAuthState] = useState('loading'); // loading | unauthenticated | authenticated | demo
            const [currentUser, setCurrentUser] = useState(null);
            const [staffDirectory, setStaffDirectory] = useState([]);
            
            // Form State
            const [weekOffset, setWeekOffset] = useState(0);
            const [selections, setSelections] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);

            const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
            
            const mondayDate = useMemo(() => {
                const d = new Date();
                const day = d.getDay();
                const diff = (day === 0) ? -6 : 1 - day;
                d.setDate(d.getDate() + diff + (weekOffset * 7));
                d.setHours(0,0,0,0);
                return d;
            }, [weekOffset]);

            // Load staff directory
            useEffect(() => {
                const unsub = staffDirectoryCollection.onSnapshot(snap => {
                    setStaffDirectory(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsub();
            }, []);

            // Auth state listener + identity resolution
            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (firebaseUser) => {
                    if (!firebaseUser) {
                        // No user at all - sign in anonymously for demo mode
                        auth.signInAnonymously();
                        return;
                    }

                    // Check if this is a real authenticated user (not anonymous)
                    if (firebaseUser.isAnonymous) {
                        // Check URL param for demo/testing
                        const urlParams = new URLSearchParams(window.location.search);
                        const paramId = urlParams.get('id');
                        
                        if (paramId && staffDirectory.length > 0) {
                            const found = staffDirectory.find(s => s.id === paramId);
                            if (found) {
                                setCurrentUser({
                                    id: found.id,
                                    firstName: found.firstName,
                                    lastName: found.lastName,
                                    team: found.team,
                                    manager: found.manager,
                                    email: found.email
                                });
                                setAuthState('demo');
                                return;
                            }
                        }
                        
                        // Pure anonymous - show demo mode
                        setCurrentUser({
                            id: 'demo',
                            firstName: 'Your',
                            lastName: 'Name',
                            team: 'Creative',
                            manager: 'Manager Name',
                            email: null
                        });
                        setAuthState('demo');
                        return;
                    }

                    // Real authenticated user - look up by email
                    if (firebaseUser.email && staffDirectory.length > 0) {
                        const found = staffDirectory.find(s => 
                            s.email?.toLowerCase() === firebaseUser.email.toLowerCase()
                        );
                        
                        if (found) {
                            setCurrentUser({
                                id: found.id,
                                firstName: found.firstName,
                                lastName: found.lastName,
                                team: found.team,
                                manager: found.manager,
                                email: found.email
                            });
                            setAuthState('authenticated');
                            return;
                        }
                    }

                    // Authenticated but not in staff directory
                    setAuthState('unauthenticated');
                });
                
                return () => unsub();
            }, [staffDirectory]);

            const handleSubmit = async () => {
                if (!currentUser || authState === 'demo') {
                    alert("Please sign in to submit your rota.");
                    return;
                }
                
                setIsSubmitting(true);
                
                const fullName = `${currentUser.firstName} ${currentUser.lastName}`;
                const payload = {
                    userId: currentUser.id,
                    name: fullName,
                    manager: currentUser.manager || '',
                    weekId: mondayDate.toISOString().split("T")[0],
                    schedule: days.map(d => selections[d] || { status: d === "Saturday" || d === "Sunday" ? "Weekend" : "Office" }),
                    submittedAt: new Date().toISOString()
                };
                
                const docId = `${payload.weekId}_${currentUser.id}`;
                await rotaSubmissionsCollection.doc(docId).set(payload);
                
                setIsSubmitting(false);
                setIsSuccess(true);
            };

            const handleSignIn = () => {
                // In production, this would redirect to your auth app or trigger Google sign-in
                // For now, show alert with instructions
                alert("Sign-in would redirect to the DMG auth portal.\n\nFor testing, add ?id=YOUR_STAFF_ID to the URL.");
            };

            const getInitials = (first, last) => `${(first||'?')[0]}${(last||'?')[0]}`.toUpperCase();
            const getTeamColor = (team) => TEAM_COLORS[team] || '#21a0d8';

            // Loading state
            if (authState === 'loading') {
                return (
                    <div className="widget-card bg-white rounded-2xl border border-[--border] p-8 text-center">
                        <DotGrid />
                        <p className="text-xs text-gray-400 mt-4">Loading...</p>
                    </div>
                );
            }

            // Success state
            if (isSuccess) {
                return (
                    <div className="widget-card bg-white rounded-2xl border border-[--border] p-8 text-center animate-fadeIn">
                        <div className="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center mb-4 mx-auto">
                            <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <h2 className="text-lg font-black uppercase text-gray-800">Synced</h2>
                        <p className="text-xs text-gray-500 mt-2">Your rota has been submitted to {currentUser?.manager || 'your manager'}</p>
                        <button onClick={() => { setIsSuccess(false); setWeekOffset(w => w + 1); }} 
                                className="mt-6 text-[10px] font-black uppercase text-[--dmg-blue] hover:underline">
                            Submit Next Week →
                        </button>
                    </div>
                );
            }

            // Main form
            return (
                <div className="widget-card flex flex-col max-h-[94vh] rounded-2xl shadow-lg border border-[--border] bg-white overflow-hidden">
                    {/* Header */}
                    <div className="p-4 border-b border-gray-50 shrink-0">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-2">
                                <DotGrid />
                                <h1 className="text-sm font-black uppercase tracking-tighter leading-tight text-[--dmg-blue]">
                                    Rota<br />Request
                                </h1>
                            </div>
                            <div className="flex items-center gap-2">
                                {authState === 'demo' && <span className="demo-badge">Preview</span>}
                                <div className="flex items-center gap-1.5">
                                    <button onClick={() => setWeekOffset(p => p - 1)} 
                                            className="w-6 h-6 rounded bg-gray-50 text-xs font-bold hover:bg-gray-100 transition-all">‹</button>
                                    <span className="text-[9px] font-black uppercase tracking-wider text-gray-400">
                                        {mondayDate.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
                                    </span>
                                    <button onClick={() => setWeekOffset(p => p + 1)} 
                                            className="w-6 h-6 rounded bg-gray-50 text-xs font-bold hover:bg-gray-100 transition-all">›</button>
                                </div>
                            </div>
                        </div>
                        
                        {/* User Badge - Auto-populated from auth */}
                        {currentUser && (
                            <div className="user-badge">
                                <div className="user-avatar" style={{ background: getTeamColor(currentUser.team) }}>
                                    {getInitials(currentUser.firstName, currentUser.lastName)}
                                </div>
                                <div className="user-info">
                                    <div className="user-name">{currentUser.firstName} {currentUser.lastName}</div>
                                    <div className="user-team">
                                        {currentUser.team} · Reports to {currentUser.manager || 'N/A'}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    {/* Day Rows */}
                    <div className="flex-1 overflow-y-auto p-4 space-y-6 custom-scroll">
                        {days.map((day, i) => {
                            const date = new Date(mondayDate);
                            date.setDate(mondayDate.getDate() + i);
                            const isWeekend = day === "Saturday" || day === "Sunday";
                            const sel = selections[day] || { status: isWeekend ? "Weekend" : "Office" };
                            return (
                                <DayRow 
                                    key={day} 
                                    day={day} 
                                    date={date} 
                                    selection={sel} 
                                    isWeekend={isWeekend}
                                    onUpdate={(d, f, v) => setSelections(p => ({...p, [d]: {...(p[d]||{}), [f]: v}}))} 
                                />
                            );
                        })}
                    </div>
                    
                    {/* Submit */}
                    <div className="p-4 border-t border-gray-50 shrink-0">
                        {authState === 'demo' ? (
                            <button
                                onClick={handleSignIn}
                                className="w-full py-3 bg-gray-800 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-700 transition-all"
                            >
                                Sign In to Submit
                            </button>
                        ) : (
                            <button
                                onClick={handleSubmit}
                                disabled={isSubmitting}
                                className="w-full py-3 bg-[--dmg-blue] text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:brightness-110 transition-all disabled:bg-gray-100 disabled:text-gray-300"
                            >
                                {isSubmitting ? 'Syncing...' : 'Submit Rota'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
