<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Request | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --success: #10B981;
            --warning: #F59E0B;
            --urgent: #EF4444;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-soft); margin: 0; padding: 20px; min-height: 100vh; }
        
        .container { max-width: 500px; margin: 0 auto; }
        
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 20px; height: 20px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 20px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: -0.02em; }
        
        .deadline-banner { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; }
        .deadline-banner.info { background: #DBEAFE; color: #1D4ED8; border: 1px solid #93C5FD; }
        .deadline-banner.warning { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
        .deadline-banner.urgent { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
        .deadline-banner.success { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
        .deadline-icon { font-size: 16px; }
        
        .card { background: #FFF; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .card-title { font-size: 12px; font-weight: 800; color: var(--ink); text-transform: uppercase; }
        .week-nav { display: flex; align-items: center; gap: 8px; }
        .week-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: #FFF; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .week-btn:hover { background: var(--bg-soft); }
        .week-label { font-size: 11px; font-weight: 700; color: var(--ink-sub); min-width: 120px; text-align: center; }
        
        .card-body { padding: 20px; }
        
        .user-info { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-soft); border-radius: 10px; margin-bottom: 20px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #FFF; }
        .user-name { font-size: 13px; font-weight: 700; color: var(--ink); }
        .user-team { font-size: 10px; color: var(--ink-sub); }
        
        .schedule-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
        .day-col { text-align: center; }
        .day-label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 8px; }
        .day-date { font-size: 10px; color: var(--ink-sub); margin-bottom: 8px; }
        
        .status-select { width: 100%; padding: 10px 6px; border: 1px solid var(--border); border-radius: 8px; font-size: 9px; font-weight: 700; text-align: center; cursor: pointer; appearance: none; background: #FFF; }
        .status-select:focus { outline: none; border-color: var(--dmg-blue); }
        .status-select.office { background: #D1FAE5; border-color: var(--success); color: var(--success); }
        .status-select.wfh { background: #FEF3C7; border-color: var(--warning); color: #92400E; }
        .status-select.shoot { background: #DBEAFE; border-color: #3B82F6; color: #1D4ED8; }
        .status-select.pto { background: #FEE2E2; border-color: var(--urgent); color: var(--urgent); }
        
        .btn { width: 100%; padding: 14px; border-radius: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit; }
        .btn-primary { background: var(--dmg-blue); color: #FFF; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn:disabled { background: #E5E7EB; color: #9CA3AF; cursor: not-allowed; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: var(--success); color: #FFF; border-radius: 10px; font-size: 12px; font-weight: 700; z-index: 1000; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        
        .loading { text-align: center; padding: 40px; color: var(--ink-sub); font-size: 12px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Operations': '#21A0D8'
        };
        const STATUSES = ['Office', 'WFH', 'Shoot', 'PTO'];
        const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
        const appId = 'dmg-command-centre-native';
        const basePath = `artifacts/${appId}/public/data`;
        
        const getInitials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();
        
        const getWeekDates = (offset = 0) => {
            const today = new Date();
            const day = today.getDay();
            const monday = new Date(today);
            monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1) + (offset * 7));
            monday.setHours(0, 0, 0, 0);
            
            const dates = [];
            for (let i = 0; i < 5; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                dates.push(d);
            }
            
            return {
                weekId: monday.toISOString().split('T')[0],
                dates,
                monday,
                weekLabel: `${monday.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} - ${dates[4].toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`,
                dayOfWeek: day
            };
        };
        
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [staffDirectory, setStaffDirectory] = useState([]);
            const [rotaSubmissions, setRotaSubmissions] = useState([]);
            const [weekOffset, setWeekOffset] = useState(0);
            const [schedule, setSchedule] = useState(DAYS.map(() => ({ status: 'Office' })));
            const [submitting, setSubmitting] = useState(false);
            const [toast, setToast] = useState(null);
            const [loading, setLoading] = useState(true);
            
            const weekInfo = useMemo(() => getWeekDates(weekOffset), [weekOffset]);
            
            const existingSubmission = useMemo(() => {
                if (!currentUser) return null;
                return rotaSubmissions.find(s => 
                    s.weekId === weekInfo.weekId && 
                    (s.userId === currentUser.id || s.name === `${currentUser.firstName} ${currentUser.lastName}`)
                );
            }, [rotaSubmissions, currentUser, weekInfo]);
            
            const deadlineStatus = useMemo(() => {
                if (weekOffset !== 0) return null;
                if (existingSubmission) return { type: 'success', text: 'Rota submitted for this week ✓', icon: '✅' };
                
                const day = weekInfo.dayOfWeek;
                if (day === 1) return { type: 'info', text: 'Please submit your rota by Wednesday 5pm', icon: '📅' };
                if (day === 2) return { type: 'warning', text: 'Rota due tomorrow (Wednesday 5pm)', icon: '⏰' };
                if (day >= 3 || day === 0) return { type: 'urgent', text: 'Rota overdue! Please submit now', icon: '🚨' };
                return null;
            }, [weekOffset, existingSubmission, weekInfo]);
            
            useEffect(() => {
                if (existingSubmission?.schedule) {
                    setSchedule(existingSubmission.schedule.slice(0, 5));
                } else {
                    setSchedule(DAYS.map(() => ({ status: 'Office' })));
                }
            }, [existingSubmission]);
            
            useEffect(() => {
                // Use correct nested Firestore path
                const unsub1 = db.collection(basePath).doc('staff_directory').collection('staff_directory')
                    .onSnapshot(snap => {
                        setStaffDirectory(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, err => {
                        console.error('Staff directory error:', err.message);
                        setStaffDirectory([]);
                    });
                
                const unsub2 = db.collection(basePath).doc('rota_submissions').collection('rota_submissions')
                    .onSnapshot(snap => {
                        setRotaSubmissions(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, err => {
                        console.error('Rota submissions error:', err.message);
                        setRotaSubmissions([]);
                    });
                
                return () => { unsub1(); unsub2(); };
            }, []);
            
            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (firebaseUser) => {
                    if (!firebaseUser) { auth.signInAnonymously(); return; }
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const paramId = urlParams.get('id');
                    
                    if (paramId && staffDirectory.length > 0) {
                        const found = staffDirectory.find(s => s.id === paramId);
                        if (found) { setCurrentUser(found); setLoading(false); return; }
                    }
                    
                    if (firebaseUser.email && staffDirectory.length > 0) {
                        const found = staffDirectory.find(s => s.email?.toLowerCase() === firebaseUser.email.toLowerCase());
                        if (found) { setCurrentUser(found); setLoading(false); return; }
                    }
                    
                    // No user found - show empty state
                    setCurrentUser(null);
                    setLoading(false);
                });
                return () => unsub();
            }, [staffDirectory]);
            
            const handleSubmit = async () => {
                if (!currentUser) return;
                setSubmitting(true);
                
                const payload = {
                    userId: currentUser.id,
                    name: `${currentUser.firstName} ${currentUser.lastName}`,
                    team: currentUser.team,
                    manager: currentUser.manager || '',
                    weekId: weekInfo.weekId,
                    schedule,
                    submittedAt: new Date().toISOString()
                };
                
                try {
                    if (existingSubmission?.id) {
                        await db.collection(basePath).doc('rota_submissions').collection('rota_submissions').doc(existingSubmission.id).update(payload);
                    } else {
                        await db.collection(basePath).doc('rota_submissions').collection('rota_submissions').add(payload);
                    }
                    setToast(existingSubmission ? 'Rota Updated!' : 'Rota Submitted!');
                } catch (err) {
                    console.error('Submit error:', err.message);
                    setToast('Error saving. Please try again.');
                }
                
                setSubmitting(false);
                setTimeout(() => setToast(null), 3000);
            };
            
            const updateDay = (index, status) => {
                const newSchedule = [...schedule];
                newSchedule[index] = { status };
                setSchedule(newSchedule);
            };
            
            if (loading) {
                return <div className="loading">Loading...</div>;
            }
            
            if (!currentUser) {
                return (
                    <div className="container">
                        <div className="header">
                            <div className="dots">
                                <div className="dot"></div><div className="dot"></div>
                                <div className="dot"></div><div className="dot"></div>
                            </div>
                            <span className="title">Rota Request</span>
                        </div>
                        <div className="card">
                            <div className="card-body">
                                <div style={{ textAlign: 'center', padding: '40px 20px' }}>
                                    <div style={{ fontSize: '48px', marginBottom: '16px' }}>👤</div>
                                    <div style={{ fontSize: '16px', fontWeight: '700', marginBottom: '8px' }}>User Not Found</div>
                                    <div style={{ fontSize: '12px', color: 'var(--ink-sub)' }}>
                                        Please access this page via your profile or contact support.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="container">
                    {toast && <div className="toast">{toast}</div>}
                    
                    <div className="header">
                        <div className="dots">
                            <div className="dot"></div><div className="dot"></div>
                            <div className="dot"></div><div className="dot"></div>
                        </div>
                        <span className="title">Rota Request</span>
                    </div>
                    
                    {deadlineStatus && (
                        <div className={`deadline-banner ${deadlineStatus.type}`}>
                            <span className="deadline-icon">{deadlineStatus.icon}</span>
                            <span>{deadlineStatus.text}</span>
                        </div>
                    )}
                    
                    <div className="card">
                        <div className="card-header">
                            <span className="card-title">Week Schedule</span>
                            <div className="week-nav">
                                <button className="week-btn" onClick={() => setWeekOffset(o => o - 1)}>‹</button>
                                <span className="week-label">{weekInfo.weekLabel}</span>
                                <button className="week-btn" onClick={() => setWeekOffset(o => o + 1)}>›</button>
                            </div>
                        </div>
                        <div className="card-body">
                            {currentUser && (
                                <div className="user-info">
                                    <div className="user-avatar" style={{ background: TEAM_COLORS[currentUser.team] || '#21A0D8' }}>
                                        {getInitials(currentUser.firstName, currentUser.lastName)}
                                    </div>
                                    <div>
                                        <div className="user-name">{currentUser.firstName} {currentUser.lastName}</div>
                                        <div className="user-team">{currentUser.role} • {currentUser.team}</div>
                                    </div>
                                </div>
                            )}
                            
                            <div className="schedule-grid">
                                {DAYS.map((day, i) => (
                                    <div key={day} className="day-col">
                                        <div className="day-label">{day}</div>
                                        <div className="day-date">{weekInfo.dates[i].getDate()}</div>
                                        <select 
                                            className={`status-select ${schedule[i].status.toLowerCase()}`}
                                            value={schedule[i].status}
                                            onChange={e => updateDay(i, e.target.value)}
                                        >
                                            {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                ))}
                            </div>
                            
                            <button 
                                className="btn btn-primary"
                                onClick={handleSubmit}
                                disabled={submitting}
                            >
                                {submitting ? 'Saving...' : existingSubmission ? 'Update Rota' : 'Submit Rota'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
