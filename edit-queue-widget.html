<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Queue | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --production: #43B049;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
            --success: #10B981;
            --warning: #F59E0B;
            --urgent: #EF4444;
            --blue: #3B82F6;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; }
        
        .widget { background: #FFF; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
        
        .header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 16px; height: 16px; }
        .dot { width: 100%; height: 100%; background: var(--production); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 12px; font-weight: 900; color: var(--ink); text-transform: uppercase; }
        
        .filter-pills { display: flex; gap: 6px; }
        .filter-pill { padding: 4px 10px; border-radius: 20px; font-size: 9px; font-weight: 800; text-transform: uppercase; border: 1px solid var(--border); background: #FFF; color: var(--ink-sub); cursor: pointer; font-family: inherit; }
        .filter-pill:hover { border-color: var(--production); }
        .filter-pill.active { background: var(--ink); color: #FFF; border-color: var(--ink); }
        
        .body { padding: 12px; }
        
        .edit-list { display: flex; flex-direction: column; gap: 8px; }
        
        .edit-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-soft); border-radius: 10px; }
        
        .stage-badge { padding: 4px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; text-transform: uppercase; flex-shrink: 0; }
        .stage-badge.rough { background: #DBEAFE; color: var(--blue); }
        .stage-badge.fine { background: #FEF3C7; color: #92400E; }
        .stage-badge.final { background: #D1FAE5; color: var(--success); }
        .stage-badge.feedback { background: #FEE2E2; color: var(--urgent); }
        
        .edit-info { flex: 1; min-width: 0; }
        .edit-title { font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .edit-meta { font-size: 10px; color: var(--ink-sub); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
        .format-tag { padding: 2px 6px; background: #FFF; border-radius: 4px; font-size: 9px; font-weight: 700; }
        
        .editor-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--production); color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; flex-shrink: 0; }
        
        .due-info { text-align: right; flex-shrink: 0; }
        .due-date { font-size: 11px; font-weight: 700; color: var(--ink); }
        .due-date.overdue { color: var(--urgent); }
        .due-date.today { color: var(--warning); }
        .due-label { font-size: 9px; color: var(--ink-sub); }
        
        .footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .footer-stat { font-size: 10px; color: var(--ink-sub); }
        .footer-stat strong { color: var(--ink); }
        .footer-alert { font-size: 10px; color: var(--urgent); font-weight: 700; }
        
        .empty { padding: 30px; text-align: center; color: var(--ink-sub); font-size: 11px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const APP_ID = 'dmg-command-centre-native';
        const basePath = `artifacts/${APP_ID}/public/data`;
        
        // Demo edit queue
        const DEMO_QUEUE = [
            { title: 'Sky Vegas Street Talk', format: 'Street Talk', stage: 'fine', editor: 'JC', dueDate: '2025-01-12', client: 'Sky' },
            { title: 'JAECOO 24 Hours Ep1', format: 'Mail Investigates', stage: 'rough', editor: 'EW', dueDate: '2025-01-13', client: 'JAECOO' },
            { title: 'Wuthering Heights Love Notes', format: 'Street Talk', stage: 'feedback', editor: 'JC', dueDate: '2025-01-10', client: 'Studio Canal' },
            { title: 'Chery Backseat Drivers', format: 'Headlines', stage: 'rough', editor: 'SM', dueDate: '2025-01-14', client: 'Chery' },
            { title: 'Trading 212 Explainer', format: 'Going Viral', stage: 'final', editor: 'EW', dueDate: '2025-01-15', client: 'Trading 212' },
        ];
        
        const STAGES = ['All', 'Rough', 'Fine', 'Feedback'];
        
        function App() {
            const [queue, setQueue] = useState([]);
            const [activeStage, setActiveStage] = useState('All');
            
            useEffect(() => {
                const unsub = db.collection(basePath).doc('edit_queue').collection('items')
                    .orderBy('dueDate')
                    .onSnapshot(snap => {
                        if (snap.empty) {
                            setQueue(DEMO_QUEUE);
                        } else {
                            setQueue(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }
                    }, err => {
                        console.log('Using demo queue:', err.message);
                        setQueue(DEMO_QUEUE);
                    });
                return () => unsub();
            }, []);
            
            const filteredQueue = useMemo(() => {
                if (activeStage === 'All') return queue;
                return queue.filter(q => q.stage.toLowerCase() === activeStage.toLowerCase());
            }, [queue, activeStage]);
            
            const stats = useMemo(() => {
                const today = new Date().toISOString().split('T')[0];
                const overdue = queue.filter(q => q.dueDate < today).length;
                return { total: queue.length, overdue };
            }, [queue]);
            
            const getDueStatus = (dueDate) => {
                const today = new Date().toISOString().split('T')[0];
                if (dueDate < today) return 'overdue';
                if (dueDate === today) return 'today';
                return '';
            };
            
            const formatDate = (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            };
            
            return (
                <div className="widget">
                    <div className="header">
                        <div className="header-left">
                            <div className="dots">
                                <div className="dot"></div>
                                <div className="dot"></div>
                                <div className="dot"></div>
                                <div className="dot"></div>
                            </div>
                            <span className="title">Edit Queue</span>
                        </div>
                        <div className="filter-pills">
                            {STAGES.map(stage => (
                                <button 
                                    key={stage}
                                    className={`filter-pill ${activeStage === stage ? 'active' : ''}`}
                                    onClick={() => setActiveStage(stage)}
                                >{stage}</button>
                            ))}
                        </div>
                    </div>
                    
                    <div className="body">
                        {filteredQueue.length > 0 ? (
                            <div className="edit-list">
                                {filteredQueue.map((item, idx) => (
                                    <div key={item.id || idx} className="edit-item">
                                        <div className={`stage-badge ${item.stage}`}>{item.stage}</div>
                                        <div className="edit-info">
                                            <div className="edit-title">{item.title}</div>
                                            <div className="edit-meta">
                                                <span className="format-tag">{item.format}</span>
                                                <span>{item.client}</span>
                                            </div>
                                        </div>
                                        <div className="editor-avatar">{item.editor}</div>
                                        <div className="due-info">
                                            <div className={`due-date ${getDueStatus(item.dueDate)}`}>
                                                {formatDate(item.dueDate)}
                                            </div>
                                            <div className="due-label">
                                                {getDueStatus(item.dueDate) === 'overdue' ? 'overdue' : 
                                                 getDueStatus(item.dueDate) === 'today' ? 'today' : 'due'}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="empty">No items in queue</div>
                        )}
                    </div>
                    
                    <div className="footer">
                        <span className="footer-stat"><strong>{stats.total}</strong> total in queue</span>
                        {stats.overdue > 0 && (
                            <span className="footer-alert">⚠️ {stats.overdue} overdue</span>
                        )}
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
