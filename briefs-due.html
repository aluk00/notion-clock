<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefs Hub | DMG</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --ink: #111827;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --white: #FFFFFF;
            --surface: #F9FAFB;
            
            /* Theme Colors */
            --hero-pink: #E6468B;
            --hero-blue: #21A0D8;
            --production-green: #43B049;
            --danger: #EF4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--white);
            color: var(--ink);
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* --- Animation --- */
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* --- Layout --- */
        .widget-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            min-height: 60px; /* Kept height for consistency */
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 4px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--hero-pink);
        }
        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }

        .add-btn {
            width: 32px; height: 32px;
            border-radius: 8px;
            background: var(--hero-pink);
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .add-btn:hover { transform: scale(1.05); background: #d63d7e; }

        /* --- List --- */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--white);
        }
        
        /* Custom Scrollbar */
        .list-container::-webkit-scrollbar { width: 5px; }
        .list-container::-webkit-scrollbar-track { background: transparent; }
        .list-container::-webkit-scrollbar-thumb { background: #f1f1f1; border-radius: 10px; }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .card:hover {
            border-color: #D1D5DB;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }

        /* Slide-off animation for completed items */
        .card.completing {
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Complete checkbox */
        .complete-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            background: var(--white);
        }
        .complete-checkbox:hover {
            border-color: var(--production-green);
            background: rgba(67, 176, 73, 0.1);
        }
        .complete-checkbox.completing {
            border-color: var(--production-green);
            background: var(--production-green);
        }
        .complete-checkbox svg {
            width: 12px;
            height: 12px;
            stroke: white;
            stroke-width: 3;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }
        .complete-checkbox.completing svg {
            opacity: 1;
            transform: scale(1);
        }

        /* Source Indicator Bar */
        .card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            border-radius: 12px 0 0 12px;
            background: var(--hero-pink); /* Default: Firebase */
        }
        .card.source-notion::before { background: var(--hero-blue); } /* Notion */

        .date-badge {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-width: 46px; height: 46px;
            background: var(--surface);
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .date-day { font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1; }
        .date-month { font-size: 9px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; margin-top: 2px; }
        
        .card.overdue .date-badge { background: #FEF2F2; border-color: #FECACA; }
        .card.overdue .date-day { color: var(--danger); }
        .card.overdue .date-month { color: var(--danger); }

        /* No date styling */
        .card.no-date .date-badge { background: #F3F4F6; border-color: #E5E7EB; }
        .card.no-date .date-day { font-size: 12px; color: var(--ink-sub); }
        .card.no-date .date-month { color: var(--ink-sub); }

        .info { flex: 1; min-width: 0; }
        .client-name { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--ink-sub); letter-spacing: 0.03em; margin-bottom: 4px; }
        .project-name { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .actions { display: flex; align-items: center; gap: 6px; }

        .icon-btn {
            width: 28px; height: 28px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid transparent;
            background: var(--surface);
            color: var(--ink-sub);
            transition: 0.2s;
        }
        .icon-btn:hover { background: #E5E7EB; color: var(--ink); }
        
        .icon-btn.has-link { background: #ECFDF5; color: var(--production-green); border-color: #D1FAE5; }
        .icon-btn.has-link:hover { background: #D1FAE5; }

        /* Project page link button */
        .icon-btn.project-link {
            width: 24px; height: 24px;
            background: rgba(33, 160, 216, 0.1);
            color: var(--hero-blue);
            border-color: rgba(33, 160, 216, 0.2);
        }
        .icon-btn.project-link:hover {
            background: var(--hero-blue);
            color: white;
            border-color: var(--hero-blue);
        }

        /* Slack button */
        .icon-btn.slack-btn {
            background: rgba(74, 21, 75, 0.1);
            color: #611f69;
            border-color: rgba(74, 21, 75, 0.2);
        }
        .icon-btn.slack-btn:hover {
            background: #611f69;
            color: white;
            border-color: #611f69;
        }

        /* Brief button */
        .icon-btn.brief-btn {
            background: rgba(249, 115, 22, 0.1);
            color: #F97316;
            border-color: rgba(249, 115, 22, 0.2);
        }
        .icon-btn.brief-btn:hover {
            background: #F97316;
            color: white;
            border-color: #F97316;
        }

        /* Card meta row */
        .card-meta {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .meta-tag {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--surface);
            color: var(--ink-sub);
        }
        .meta-tag.creative-lead {
            background: rgba(230, 70, 139, 0.1);
            color: var(--hero-pink);
        }
        .meta-tag.sales-lead {
            background: rgba(249, 115, 22, 0.1);
            color: #F97316;
        }

        /* Section headers */
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            margin-bottom: 8px;
            margin-top: 16px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .section-header:first-child {
            margin-top: 0;
        }
        .section-icon {
            font-size: 14px;
        }
        .section-title {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ink);
        }
        .section-count {
            margin-left: auto;
            font-size: 11px;
            font-weight: 800;
            background: var(--surface);
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--ink-sub);
        }

        /* Due Today header - urgent styling */
        .due-today-header {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, rgba(239, 68, 68, 0.03) 100%);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .due-today-header .section-title { color: var(--danger); }
        .due-today-header .section-count { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        /* Overdue header */
        .overdue-header {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(245, 158, 11, 0.03) 100%);
            border-color: rgba(245, 158, 11, 0.2);
        }
        .overdue-header .section-title { color: #D97706; }
        .overdue-header .section-count { background: rgba(245, 158, 11, 0.1); color: #D97706; }

        /* Due today card highlight */
        .card.due-today {
            border-color: rgba(239, 68, 68, 0.3);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.02) 0%, white 100%);
        }
        .card.due-today::before {
            background: var(--danger);
        }

        /* --- Slide Page (Clean transition - no dark overlay) --- */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: transparent; /* No darkening - keeps Notion white feel */
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        .sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
            background: rgba(255,255,255,0.5); /* Subtle white overlay */
        }

        /* Main content slides back when sheet opens */
        .widget-container.sheet-open {
            transform: translateX(-30px) scale(0.98);
            opacity: 0.5;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .sheet {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 420px;
            max-width: 95vw;
            background: var(--white);
            padding: 0;
            box-shadow: -15px 0 40px rgba(0,0,0,0.08);
            transform: translateX(100%);
            transition: 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sheet-overlay.active .sheet { transform: translateX(0); }

        /* Back button bar */
        .sheet-back-bar {
            padding: 16px 20px;
            background: #F9FAFB;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .sheet-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: var(--white);
            color: var(--ink-sub);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sheet-back-btn:hover {
            border-color: var(--hero-pink);
            color: var(--hero-pink);
            background: rgba(230, 70, 139, 0.05);
        }
        .sheet-back-btn:active {
            transform: scale(0.98);
        }

        .sheet-content { padding: 20px 24px; flex: 1; }

        .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .sheet-title { font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
        .sheet-sub { font-size: 11px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; }
        
        .form-group { margin-bottom: 16px; }
        .label { font-size: 11px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; display: block; margin-bottom: 8px; }
        .input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 14px;
            background: var(--surface);
            color: var(--ink);
        }
        .input:focus { outline: none; border-color: var(--hero-pink); background: var(--white); }
        .input:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--hero-pink);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-primary:hover { background: #d63d7e; }

        .btn-slack {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(74, 21, 75, 0.2);
            background: rgba(74, 21, 75, 0.1);
            color: #611f69;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-slack:hover {
            background: #611f69;
            color: white;
            border-color: #611f69;
        }

        /* Loading */
        .loading-screen {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--white);
            z-index: 50;
        }
        .loading-text { margin-top: 12px; font-size: 11px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            z-index: 2000;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toast.visible { transform: translateX(0); }
        .toast.success { background: var(--production-green); color: white; }
        .toast.error { background: var(--danger); color: white; }

    </style>
</head>
<body>

    <div class="widget-container">
        <div class="header">
            <div class="header-left">
                <div class="dot-grid"><span></span><span></span><span></span><span></span></div>

                <div class="form-group">

                    <input type="text" id="f-title" class="input" placeholder="Project Name">

                <div class="form-group">
                    <label class="label">Due Date</label>
                    <input type="date" id="f-date" class="input">
                </div>

                <div class="form-group">
                    <label class="label">Brief Document Link</label>
                    <input type="url" id="f-brief-link" class="input" placeholder="Link to the brief PDF or document...">

                        </div>
                        <div>
                            <label class="label">Sales Lead</label>

                    <button type="submit" class="btn-primary" id="save-btn">Save Changes</button>

                <div style="margin-top:16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">

                    <a href="#" id="f-open-brief-btn" target="_blank" style="display:none; font-size:12px; font-weight:600; color:#F97316; text-decoration:none;">
                        Open Brief &#8599;
                    </a>

    <script>
        // --- 1. CONFIGURATION ---
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
        const APP_ID = "dmg-command-centre-native";
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        // Paths
        const BRIEFS_PATH = `artifacts/${APP_ID}/public/data/briefs_due`;
        const LINKS_PATH = `artifacts/${APP_ID}/public/data/brief_links`;

        // --- 2. INIT ---
        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.firestore();
        const auth = firebase.auth();
        let globalData = [];

        auth.signInAnonymously()
            .then(() => fetchData())
            .catch(e => { console.error("Auth", e); fetchData(); });

        // --- 3. FETCH DATA ---
        async function fetchData() {
            try {
                // Create timeout for API call
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                // Parallel Fetch: 1. Firebase Briefs | 2. Firebase Links (for Notion) | 3. Notion Projects
                const [fbSnapshot, linkSnapshot, apiRes] = await Promise.all([
                    db.collection(BRIEFS_PATH).get(),
                    db.collection(LINKS_PATH).get(),
                    fetch(`${API_URL}/projects`, { signal: controller.signal })
                        .then(res => { clearTimeout(timeout); return res; })
                        .catch(e => { clearTimeout(timeout); console.warn('[Briefs] API unavailable:', e.message); return { ok: false }; })
                ]);

                // A. Process Firebase Manual Briefs
                const fbItems = fbSnapshot.docs.map(doc => ({
                    id: doc.id,
                    source: 'firebase',
                    ...doc.data(),
                    dueDate: doc.data().dueDate?.toDate ? doc.data().dueDate.toDate() : new Date(doc.data().dueDate)
                }));

                // B. Process Links Overlay
                const linksMap = {};
                linkSnapshot.docs.forEach(doc => {
                    linksMap[doc.id] = doc.data().url;
                });

                // C. Process Notion Projects (from API)
                let notionItems = [];
                if (apiRes.ok) {
                    const apiJson = await apiRes.json();
                    notionItems = (apiJson.projects || []).map(p => {
                        // Priority: Custom Link > Notion Field Link > Notion URL
                        const customLink = linksMap[p.id];
                        // Check multiple date fields - more comprehensive
                        const dateVal = p.clientDueDate || p.internalDueDate || p.dueDate || p.expectedCloseDate || p.publishDate || p.liveDate;

                        // Include projects if they have active deal stage or creative workflow
                        const dealStage = (p.dealStage || '').toLowerCase();
                        const isActiveDeal = dealStage &&
                            !dealStage.includes('complete') &&
                            !dealStage.includes('lost') &&
                            !dealStage.includes('archived');

                        // Include if creative team is actively working on it
                        const creativeStatus = (p.creativeWorkflowStatus || '').toLowerCase();
                        const isActiveCreative = creativeStatus &&
                            creativeStatus !== 'complete';

                        // Skip if no date AND no active deal stage AND no active creative work
                        if (!dateVal && !isActiveDeal && !isActiveCreative) return null;

                        // Extract people names
                        const getPersonName = (people) => {
                            if (!people || !Array.isArray(people) || people.length === 0) return null;
                            return people[0].name || null;
                        };

                        // Generate Slack channel name from client and title
                        const generateSlackChannel = (client, title) => {
                            if (!client && !title) return null;
                            const base = (client || title || '').toLowerCase()
                                .replace(/[^a-z0-9\s-]/g, '')
                                .replace(/\s+/g, '-')
                                .substring(0, 20);
                            const month = new Date().toLocaleDateString('en-GB', { month: '2-digit' });
                            const year = new Date().getFullYear().toString().slice(-2);
                            return `${base}-${month}${year}`;
                        };

                        return {
                            id: p.id,
                            source: 'notion',
                            client: p.client,
                            title: p.title,
                            // Use date if available, otherwise set to 30 days from now for sorting
                            dueDate: dateVal ? new Date(dateVal) : new Date(Date.now() + 30 * 24 * 60 * 60 * 1000),
                            link: customLink || p.creativeResponseLink || p.briefLink,
                            originalLink: p.creativeResponseLink || p.briefLink,
                            projectUrl: p.url, // Direct link to project page in Notion
                            status: p.dealStage || '',
                            creativeStatus: p.creativeWorkflowStatus || '',
                            hasNoDate: !dateVal, // Track if date was missing
                            // NEW: People fields
                            creativeLead: getPersonName(p.creativeLead),
                            salesLead: getPersonName(p.salesLead),
                            // NEW: Brief link (separate from response)
                            briefLink: p.briefLink || null,
                            responseLink: p.creativeResponseLink || customLink || null,
                            // NEW: Slack channel (constructed)
                            slackChannel: generateSlackChannel(p.client, p.title),
                            // NEW: Drive folder
                            driveFolder: p.driveFolder || null
                        };
                    }).filter(p => {
                        if (!p) return false;
                        // Keep if creative team is still working on it
                        const creative = p.creativeStatus.toLowerCase();
                        if (creative && creative !== 'complete') return true;
                        // Otherwise filter out completed deals
                        return !p.status.toLowerCase().includes('complete');
                    });
                }

                // D. Merge & Sort
                globalData = [...fbItems, ...notionItems].sort((a,b) => a.dueDate - b.dueDate);

                render();
            } catch (err) {
                console.error("Error loading data", err);
                // Simple error indicator if totally failed
                document.getElementById('loader').innerHTML = `<div style="color:red; font-size:11px;">Error Loading Data</div>`;
            }
        }

        // --- 4. RENDER ---
        function render() {
            const container = document.getElementById('list-container');
            document.getElementById('loader').style.display = 'none';

            if (globalData.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--ink-sub); margin-top:40px; font-size:12px;">No active briefs.</div>`;
                return;
            }

            // Split into "Due Today" and "Upcoming"
            const today = new Date();
            today.setHours(0,0,0,0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            const dueToday = globalData.filter(item => {
                if (item.hasNoDate) return false;
                const itemDate = new Date(item.dueDate);
                itemDate.setHours(0,0,0,0);
                return itemDate.getTime() === today.getTime();
            });

            const overdue = globalData.filter(item => {
                if (item.hasNoDate) return false;
                return item.dueDate < today;
            });

            const upcoming = globalData.filter(item => {
                if (item.hasNoDate) return true;
                const itemDate = new Date(item.dueDate);
                itemDate.setHours(0,0,0,0);
                return itemDate > today;
            });

            const renderCard = (item) => {
                const day = item.dueDate.getDate();
                const month = item.dueDate.toLocaleDateString('en-GB', { month: 'short' });
                const isOverdue = !item.hasNoDate && item.dueDate < today;
                const isDueToday = !item.hasNoDate && new Date(item.dueDate).setHours(0,0,0,0) === today.getTime();
                const noDateClass = item.hasNoDate ? 'no-date' : '';

                return `
                <div class="card source-${item.source} ${isOverdue ? 'overdue' : ''} ${isDueToday ? 'due-today' : ''} ${noDateClass}" id="card-${item.id}" onclick="openEditSheet('${item.id}')">
                    <div class="complete-checkbox" onclick="event.stopPropagation(); markComplete('${item.id}', '${item.source}')" title="Mark as complete">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div class="date-badge">
                        <span class="date-day">${item.hasNoDate ? 'TBD' : day}</span>
                        <span class="date-month">${item.hasNoDate ? '' : month}</span>
                    </div>
                    <div class="info">
                        <div class="client-name">${item.client || 'Internal'}</div>
                        <div class="project-name">${item.title}</div>
                        <div class="card-meta">
                            ${item.creativeLead ? `<span class="meta-tag creative-lead" title="Creative Lead">🎨 ${item.creativeLead.split(' ')[0]}</span>` : ''}
                            ${item.salesLead ? `<span class="meta-tag sales-lead" title="Sales Lead">💼 ${item.salesLead.split(' ')[0]}</span>` : ''}
                        </div>
                    </div>
                    <div class="actions">
                        ${item.slackChannel ? `
                            <button class="icon-btn slack-btn" onclick="event.stopPropagation(); window.open('https://dmgmedia.slack.com/app_redirect?channel=${item.slackChannel}', '_blank')" title="Open Slack: #${item.slackChannel}">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></svg>
                            </button>
                        ` : ''}
                        ${item.briefLink ? `
                            <button class="icon-btn brief-btn" onclick="event.stopPropagation(); window.open('${item.briefLink}', '_blank')" title="Open Brief Document">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                            </button>
                        ` : ''}
                        ${item.id && item.source === 'notion' ? `
                            <button class="icon-btn project-link" onclick="event.stopPropagation(); window.open('project-detail.html?id=${item.id}', '_blank')" title="View full project page">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                            </button>
                        ` : ''}
                        ${item.responseLink ? `
                            <button class="icon-btn has-link" onclick="event.stopPropagation(); window.open('${item.responseLink}', '_blank')" title="Open Response Doc">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                            </button>
                        ` : ''}
                        <button class="icon-btn" onclick="event.stopPropagation(); openEditSheet('${item.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                    </div>
                </div>
                `;
            };

            let html = '';

            // Due Today Section (urgent, at top)
            if (dueToday.length > 0) {
                html += `
                <div class="section-header due-today-header">
                    <span class="section-icon">🔥</span>
                    <span class="section-title">DUE TODAY</span>
                    <span class="section-count">${dueToday.length}</span>
                </div>
                ${dueToday.map(renderCard).join('')}
                `;
            }

            // Overdue Section (critical)
            if (overdue.length > 0) {
                html += `
                <div class="section-header overdue-header">
                    <span class="section-icon">⚠️</span>
                    <span class="section-title">OVERDUE</span>
                    <span class="section-count">${overdue.length}</span>
                </div>
                ${overdue.map(renderCard).join('')}
                `;
            }

            // Upcoming Section
            if (upcoming.length > 0) {
                html += `
                <div class="section-header upcoming-header">
                    <span class="section-icon">📅</span>
                    <span class="section-title">UPCOMING</span>
                    <span class="section-count">${upcoming.length}</span>
                </div>
                ${upcoming.map(renderCard).join('')}
                `;
            }

            container.innerHTML = html;
        }

        // --- 5. INTERACTION (Sheet Modal) ---
        
        function openNewBrief() {
            document.getElementById('sheet-title').textContent = "New Brief";
            document.getElementById('sheet-sub').textContent = "Create Manual Entry";
            document.getElementById('sheet-form').reset();
            
            // Enable fields for new entry
            document.getElementById('f-id').value = "";
            document.getElementById('f-source').value = "firebase";
            document.getElementById('f-client').disabled = false;
            document.getElementById('f-title').disabled = false;
            document.getElementById('f-date').disabled = false;
            document.getElementById('f-date').valueAsDate = new Date();
            
            document.getElementById('f-open-btn').style.display = 'none';
            document.getElementById('sheet-overlay').classList.add('active');
            document.querySelector('.widget-container').classList.add('sheet-open');
        }

        function openEditSheet(id) {
            const item = globalData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('f-id').value = item.id;
            document.getElementById('f-source').value = item.source;
            document.getElementById('f-client').value = item.client || '';
            document.getElementById('f-title').value = item.title || '';
            document.getElementById('f-link').value = item.responseLink || item.link || '';
            document.getElementById('f-brief-link').value = item.briefLink || '';
            document.getElementById('f-slack').value = item.slackChannel || '';

            // Handle Date
            if(item.dueDate) {
                // Convert to YYYY-MM-DD for input
                const iso = item.dueDate.toISOString().split('T')[0];
                document.getElementById('f-date').value = iso;
            }

            if (item.source === 'notion') {
                // Notion Mode: Read-only metadata, editable links
                document.getElementById('sheet-title').textContent = "Brief Details";
                document.getElementById('sheet-sub').textContent = "Notion Project";

                document.getElementById('f-client').disabled = true;
                document.getElementById('f-title').disabled = true;
                document.getElementById('f-date').disabled = true; // Date comes from Notion

                document.getElementById('f-link').placeholder = "Paste response deck link...";
                document.getElementById('f-brief-link').placeholder = "Paste brief document link...";

                // Show people info for Notion projects
                document.getElementById('people-info').style.display = 'block';
                document.getElementById('f-creative-lead').textContent = item.creativeLead || 'Not assigned';
                document.getElementById('f-sales-lead').textContent = item.salesLead || 'Not assigned';
            } else {
                // Firebase Mode: Full Edit
                document.getElementById('sheet-title').textContent = "Edit Brief";
                document.getElementById('sheet-sub').textContent = "Manual Entry";

                document.getElementById('f-client').disabled = false;
                document.getElementById('f-title').disabled = false;
                document.getElementById('f-date').disabled = false;

                // Hide people info for manual entries
                document.getElementById('people-info').style.display = 'none';
            }

            // Show existing response link button if present
            const openBtn = document.getElementById('f-open-btn');
            if (item.responseLink || item.link) {
                openBtn.href = item.responseLink || item.link;
                openBtn.style.display = 'inline-block';
            } else {
                openBtn.style.display = 'none';
            }

            // Show existing brief link button if present
            const openBriefBtn = document.getElementById('f-open-brief-btn');
            if (item.briefLink) {
                openBriefBtn.href = item.briefLink;
                openBriefBtn.style.display = 'inline-block';
            } else {
                openBriefBtn.style.display = 'none';
            }

            document.getElementById('sheet-overlay').classList.add('active');
            document.querySelector('.widget-container').classList.add('sheet-open');
        }

        // Open Slack channel from form
        function openSlackChannel() {
            const channel = document.getElementById('f-slack').value;
            if (channel) {
                window.open(`https://dmgmedia.slack.com/app_redirect?channel=${channel}`, '_blank');
            } else {
                alert('No Slack channel specified');
            }
        }

        function closeSheet() {
            document.getElementById('sheet-overlay').classList.remove('active');
            document.querySelector('.widget-container').classList.remove('sheet-open');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} visible`;
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        function handleOverlayClick(e) {
            if (e.target.id === 'sheet-overlay') closeSheet();
        }

        // --- 6. SAVE LOGIC ---
        document.getElementById('sheet-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const originalText = btn.textContent;
            btn.textContent = "Saving...";
            btn.disabled = true;

            const id = document.getElementById('f-id').value;
            const source = document.getElementById('f-source').value;
            const linkVal = document.getElementById('f-link').value;

            const briefLinkVal = document.getElementById('f-brief-link').value;

            try {
                if (source === 'notion') {
                    // Logic: Save links to both Firebase (backup) AND Notion (master)

                    // Save to Firebase as backup/cache
                    await db.collection(LINKS_PATH).doc(id).set({
                        url: linkVal,
                        briefUrl: briefLinkVal,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    // Also update Notion via Cloud Run API
                    const updatePayload = {};
                    if (linkVal) updatePayload.creativeResponseLink = linkVal;
                    if (briefLinkVal) updatePayload.briefLink = briefLinkVal;

                    if (Object.keys(updatePayload).length > 0) {
                        try {
                            const notionRes = await fetch(`${API_URL}/projects/${id}`, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(updatePayload)
                            });
                            if (!notionRes.ok) {
                                console.warn('Notion update failed, but Firebase saved');
                            }
                        } catch (notionErr) {
                            console.warn('Notion update error:', notionErr);
                        }
                    }
                } else {
                    // Logic: Save/Update Brief in `briefs_due`
                    const payload = {
                        client: document.getElementById('f-client').value,
                        title: document.getElementById('f-title').value,
                        dueDate: new Date(document.getElementById('f-date').value),
                        link: linkVal,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    if (id) {
                        await db.collection(BRIEFS_PATH).doc(id).update(payload);
                    } else {
                        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        await db.collection(BRIEFS_PATH).add(payload);
                    }
                }

                closeSheet();
                showToast('Changes saved!', 'success');
                fetchData(); // Reload to see changes
            } catch (err) {
                showToast('Error saving: ' + err.message, 'error');
                console.error(err);
            }
            
            btn.textContent = originalText;
            btn.disabled = false;
        });

        // --- 7. MARK COMPLETE LOGIC ---
        async function markComplete(id, source) {
            const card = document.getElementById(`card-${id}`);
            const checkbox = card?.querySelector('.complete-checkbox');
            if (!card || !checkbox) return;

            // Visual feedback
            checkbox.classList.add('completing');

            try {
                if (source === 'notion') {
                    // Update Notion project via Cloud Run API
                    const res = await fetch(`${API_URL}/projects/${id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ dealStage: 'Campaign Complete' })
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        throw new Error(errData.error || `HTTP ${res.status}`);
                    }

                    const data = await res.json();
                    if (!data.success) throw new Error(data.error || 'Update failed');
                } else {
                    // Delete Firebase brief
                    await db.collection(BRIEFS_PATH).doc(id).delete();
                }

                // Slide off animation
                card.classList.add('completing');

                // Remove from local data and re-render after animation
                setTimeout(() => {
                    globalData = globalData.filter(item => item.id !== id);
                    render();
                }, 400);

            } catch (err) {
                console.error('Complete error:', err);
                checkbox.classList.remove('completing');
                alert('Error marking complete: ' + err.message);
            }
        }

        // Close sheet on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('sheet-overlay').classList.contains('active')) {
                    closeSheet();
                }
            }
        });

    </script>
</body>
</html>
