<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefs Due</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f6f8fb;
            min-height: 100vh;
            padding: 24px;
            color: #111;
        }

        .widget-card {
            background: #fff;
            border: 1px solid #EAECEF;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 24px rgba(17, 24, 39, 0.06);
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #21A0D8;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        .dot:nth-child(4) { animation-delay: 0.6s; }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .title {
            font-size: 18px;
            font-weight: 700;
            color: #111;
        }
        
        .add-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #21A0D8;
            color: #fff;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        
        .add-btn:hover {
            background: #198fcb;
            transform: scale(1.05);
        }
        
        .briefs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .brief-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #EAECEF;
            border-left: 4px solid #E6468B;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        
        .brief-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(17, 24, 39, 0.08);
            border-color: #DDE2E8;
        }
        
        .brief-item.overdue {
            border-left-color: #E94B4B;
            background: #fff;
        }
        
        .brief-item.today {
            border-left-color: #F97316;
            background: #fff;
        }
        
        .brief-date {
            text-align: center;
            min-width: 44px;
        }
        
        .brief-day {
            font-size: 18px;
            font-weight: 700;
            color: #111;
            line-height: 1;
        }
        
        .brief-month {
            font-size: 10px;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
        }
        
        .brief-content {
            flex: 1;
            min-width: 0;
        }
        
        .brief-title {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .brief-meta {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .brief-client {
            color: #21A0D8;
            font-weight: 600;
        }
        
        .brief-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .action-btn.link {
            background: #EBF5FF;
            color: #2563EB;
        }
        
        .action-btn.link:hover {
            background: #DBEAFE;
        }
        
        .action-btn.link.has-link {
            background: #D1FAE5;
            color: #059669;
        }

        .action-btn.edit {
            background: #F3F4F6;
            color: #111827;
        }

        .action-btn.edit:hover {
            background: #E5E7EB;
        }
        
        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-overdue {
            background: #FEE2E2;
            color: #DC2626;
        }
        
        .status-today {
            background: #FED7AA;
            color: #C2410C;
        }
        
        .status-upcoming {
            background: #E0E7FF;
            color: #4338CA;
        }

        .rule-card {
            margin-top: 16px;
            border: 1px dashed #DDE2E8;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 11px;
            color: #4B5563;
            background: #F9FAFB;
        }

        .rule-title {
            font-weight: 700;
            font-size: 11px;
            color: #111827;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .rule-columns {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .rule-columns ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .rule-columns li {
            margin-bottom: 4px;
            line-height: 1.4;
        }
        
        .empty-state {
            text-align: center;
            padding: 48px 24px;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .empty-text {
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }
        
        .loading {
            text-align: center;
            padding: 48px;
            color: #666;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 420px;
            transform: translateY(20px);
            transition: transform 0.2s;
        }
        
        .modal-overlay.active .modal {
            transform: translateY(0);
        }
        
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #111;
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #21A0D8;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        
        .btn-primary {
            background: #21A0D8;
            color: #fff;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="widget-card">
        <div class="header">
            <div class="header-left">
                <div class="dot-grid">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="title">Briefs Due</div>
            </div>
            <button class="add-btn" onclick="openAddModal()" aria-label="Add brief">+</button>
        </div>
        
        <div id="content">
            <div class="loading">Loading briefs...</div>
        </div>

        <div class="rule-card">
            <div class="rule-title">Allowed vs Forbidden</div>
            <div class="rule-columns">
                <div>
                    <strong>Allowed</strong>
                    <ul>
                        <li>POST /v1/data_sources/:data_source_id/query</li>
                        <li>Create: parent.type = data_source_id</li>
                        <li>Update: pages.update(...)</li>
                    </ul>
                </div>
                <div>
                    <strong>Forbidden</strong>
                    <ul>
                        <li>.../databases/:id/query</li>
                        <li>Create: parent.database_id</li>
                        <li>Relation writes via database_id</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Add Brief</div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <form id="briefForm">
                <input type="hidden" id="briefId">
                <div class="form-group">
                    <label>Brief Title *</label>
                    <input type="text" id="briefTitleInput" placeholder="e.g. Sky Vegas Q1 Campaign" required>
                </div>
                <div class="form-group">
                    <label>Client / Brand</label>
                    <input type="text" id="briefClient" placeholder="e.g. Sky Vegas">
                </div>
                <div class="form-group">
                    <label>Due Date *</label>
                    <input type="date" id="briefDueDate" required>
                </div>
                <div class="form-group">
                    <label>PDF / Deck Link</label>
                    <input type="url" id="briefLink" placeholder="Paste a PDF or deck link">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="briefStatus">
                        <option value="pending">Pending</option>
                        <option value="in_progress">In Progress</option>
                        <option value="review">In Review</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Brief</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.firebasestorage.app",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const appId = "dmg-command-centre-native";
        const COLLECTION = `artifacts/${appId}/public/data/briefs_due`;
        
        let briefs = [];
        
        function isToday(date) {
            const today = new Date();
            return date.toDateString() === today.toDateString();
        }
        
        function isOverdue(date) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return date < today;
        }
        
        function formatDate(date) {
            return {
                day: date.getDate(),
                month: date.toLocaleDateString('en-GB', { month: 'short' })
            };
        }
        
        function getStatusBadge(dueDate) {
            if (isOverdue(dueDate)) {
                return '<span class="status-badge status-overdue">Overdue</span>';
            } else if (isToday(dueDate)) {
                return '<span class="status-badge status-today">Today</span>';
            }
            return '';
        }
        
        function getItemClass(dueDate) {
            if (isOverdue(dueDate)) return 'brief-item overdue';
            if (isToday(dueDate)) return 'brief-item today';
            return 'brief-item';
        }
        
        async function loadBriefs() {
            const content = document.getElementById('content');
            
            try {
                const snapshot = await db.collection(COLLECTION)
                    .orderBy('dueDate', 'asc')
                    .get();
                
                briefs = [];
                snapshot.forEach(doc => {
                    briefs.push({ id: doc.id, ...doc.data() });
                });
                
                console.log(`Loaded ${briefs.length} briefs from ${COLLECTION}`);
                renderBriefs();
                
            } catch (error) {
                console.error('Error loading briefs:', error);
                
                // If orderBy fails (no index), try without it
                try {
                    const snapshot = await db.collection(COLLECTION).get();
                    briefs = [];
                    snapshot.forEach(doc => {
                        briefs.push({ id: doc.id, ...doc.data() });
                    });
                    briefs.sort((a, b) => {
                        const dateA = a.dueDate?.toDate ? a.dueDate.toDate() : new Date(a.dueDate);
                        const dateB = b.dueDate?.toDate ? b.dueDate.toDate() : new Date(b.dueDate);
                        return dateA - dateB;
                    });
                    renderBriefs();
                } catch (e) {
                    console.error('Fallback also failed:', e);
                    renderBriefs();
                }
            }
        }
        
        function renderBriefs() {
            const content = document.getElementById('content');
            
            // Filter out completed unless you want to show them
            const activeBriefs = briefs.filter(b => b.status !== 'completed');
            
            if (activeBriefs.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <div class="empty-title">No Briefs Due</div>
                        <div class="empty-text">Click the + button to add a brief</div>
                    </div>
                `;
                return;
            }
            
            const html = activeBriefs.map(brief => {
                const dueDate = brief.dueDate?.toDate ? brief.dueDate.toDate() : new Date(brief.dueDate);
                const { day, month } = formatDate(dueDate);
                const hasLink = brief.deckLink || brief.link;
                
                return `
                    <div class="${getItemClass(dueDate)}" onclick="handleBriefClick('${brief.id}')">
                        <div class="brief-date">
                            <div class="brief-day">${day}</div>
                            <div class="brief-month">${month}</div>
                        </div>
                        <div class="brief-content">
                            <div class="brief-title">${brief.title || 'Untitled Brief'}</div>
                            <div class="brief-meta">
                                ${brief.client ? `<span class="brief-client">${brief.client}</span>` : ''}
                                ${getStatusBadge(dueDate)}
                            </div>
                        </div>
                        <div class="brief-actions">
                            <button class="action-btn link ${hasLink ? 'has-link' : ''}" onclick="event.stopPropagation(); openLink('${brief.id}')" title="${hasLink ? 'Open deck' : 'Add deck link'}">
                                ${hasLink ? '📎' : '🔗'}
                            </button>
                            <button class="action-btn edit" onclick="event.stopPropagation(); openBrief('${brief.id}')" title="Edit brief">✏️</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            content.innerHTML = `<div class="briefs-list">${html}</div>`;
        }
        
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Brief';
            document.getElementById('briefForm').reset();
            document.getElementById('briefId').value = '';
            document.getElementById('briefDueDate').valueAsDate = new Date();
            document.getElementById('modal').classList.add('active');
        }
        
        function openBrief(id) {
            const brief = briefs.find(b => b.id === id);
            if (!brief) return;
            
            document.getElementById('modalTitle').textContent = 'Edit Brief';
            document.getElementById('briefId').value = id;
            document.getElementById('briefTitleInput').value = brief.title || '';
            document.getElementById('briefClient').value = brief.client || '';
            document.getElementById('briefLink').value = brief.deckLink || brief.link || '';
            document.getElementById('briefStatus').value = brief.status || 'pending';
            
            const dueDate = brief.dueDate?.toDate ? brief.dueDate.toDate() : new Date(brief.dueDate);
            document.getElementById('briefDueDate').valueAsDate = dueDate;
            
            document.getElementById('modal').classList.add('active');
        }

        function handleBriefClick(id) {
            const brief = briefs.find(b => b.id === id);
            if (!brief) return;
            const link = brief.deckLink || brief.link;
            if (link) {
                window.open(link, '_blank');
                return;
            }
            openBrief(id);
        }
        
        function openLink(id) {
            const brief = briefs.find(b => b.id === id);
            if (!brief) return;
            
            const link = brief.deckLink || brief.link;
            if (link) {
                window.open(link, '_blank');
            } else {
                openBrief(id);
            }
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        document.getElementById('briefForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('briefId').value;
            const data = {
                title: document.getElementById('briefTitleInput').value.trim(),
                client: document.getElementById('briefClient').value.trim(),
                dueDate: new Date(document.getElementById('briefDueDate').value),
                deckLink: document.getElementById('briefLink').value.trim(),
                status: document.getElementById('briefStatus').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            try {
                if (id) {
                    await db.collection(COLLECTION).doc(id).update(data);
                    console.log('Brief updated:', id);
                } else {
                    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    const ref = await db.collection(COLLECTION).add(data);
                    console.log('Brief added:', ref.id);
                }
                
                closeModal();
                loadBriefs();
            } catch (error) {
                console.error('Error saving brief:', error);
                alert('Failed to save brief. Check console for details.');
            }
        });
        
        // Close modal on overlay click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
        
        // Load on start
        loadBriefs();
    </script>
</body>
</html>
