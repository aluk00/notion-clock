<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefs Due | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #111827;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --white: #FFFFFF;
            --surface: #F9FAFB;
            --hero-pink: #E6468B;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--white);
            color: var(--ink);
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }
        @keyframes slideOut {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(100%); }
        }
        .widget-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 4px;
        }
        .dot-grid span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--hero-pink);
        }
        .dot-grid span:nth-child(1) { animation: pulse 2s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2s ease-in-out 0.6s infinite; }
        .title {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .count-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(230, 70, 139, 0.1);
            color: var(--hero-pink);
        }
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .list-container::-webkit-scrollbar { width: 5px; }
        .list-container::-webkit-scrollbar-track { background: transparent; }
        .list-container::-webkit-scrollbar-thumb { background: #f1f1f1; border-radius: 10px; }
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .card:hover {
            border-color: #D1D5DB;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }
        .card.completing {
            animation: slideOut 0.4s ease forwards;
            pointer-events: none;
        }
        .card.overdue { border-left: 3px solid var(--danger); }
        .card.due-soon { border-left: 3px solid var(--warning); }

        /* Checkbox */
        .complete-checkbox {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .complete-checkbox:hover {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }
        .complete-checkbox svg {
            width: 12px;
            height: 12px;
            stroke: transparent;
            stroke-width: 3;
            transition: stroke 0.2s;
        }
        .complete-checkbox:hover svg {
            stroke: var(--success);
        }
        .complete-checkbox.checking {
            border-color: var(--success);
            background: var(--success);
        }
        .complete-checkbox.checking svg {
            stroke: white;
        }

        .date-badge {
            min-width: 50px;
            text-align: center;
            padding: 8px;
            background: var(--surface);
            border-radius: 10px;
        }
        .date-day {
            display: block;
            font-size: 18px;
            font-weight: 900;
            color: var(--ink);
            line-height: 1;
        }
        .date-month {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-sub);
            text-transform: uppercase;
            margin-top: 2px;
        }
        .card.overdue .date-badge { background: rgba(239, 68, 68, 0.1); }
        .card.overdue .date-day { color: var(--danger); }
        .card.due-soon .date-badge { background: rgba(245, 158, 11, 0.1); }
        .card.due-soon .date-day { color: var(--warning); }
        .info { flex: 1; min-width: 0; }
        .client-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .project-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .deal-stage {
            font-size: 9px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(33, 160, 216, 0.1);
            color: #21A0D8;
            margin-top: 4px;
            display: inline-block;
        }
        .actions { display: flex; gap: 6px; }
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .icon-btn:hover { background: var(--surface); border-color: #D1D5DB; }
        .icon-btn.has-link { background: rgba(230, 70, 139, 0.1); border-color: rgba(230, 70, 139, 0.2); }
        .icon-btn.has-link:hover { background: rgba(230, 70, 139, 0.2); }
        .icon-btn svg { stroke: var(--ink-sub); stroke-width: 2; }
        .icon-btn.has-link svg { stroke: var(--hero-pink); }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 12px;
        }
        .loading-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-sub);
            text-transform: uppercase;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-sub);
        }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
        .empty-sub { font-size: 12px; }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="header">
            <div class="header-left">
                <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                <h1 class="title">Briefs Due</h1>
            </div>
            <span class="count-badge" id="count">Loading...</span>
        </div>
        <div id="loader" class="loading">
            <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading projects...</span>
        </div>
        <div class="list-container" id="list-container"></div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';
        let briefsData = [];

        async function fetchData() {
            try {
                const res = await fetch(`${API_URL}/projects`);
                if (!res.ok) throw new Error(`API error: ${res.status}`);

                const data = await res.json();
                const projects = data.projects || [];

                // Filter projects:
                // - Must have a client due date
                // - Exclude completed deals
                // - Exclude projects already in "Sales Review" or "Complete" creative status
                briefsData = projects
                    .filter(p => {
                        const hasDate = p.clientDueDate || p.dueDate;
                        const dealStage = (p.dealStage || '').toLowerCase();
                        const creativeStatus = (p.creativeWorkflowStatus || '').toLowerCase();

                        // Exclude completed deals
                        const isComplete = dealStage.includes('complete') || dealStage.includes('lost');

                        // Exclude briefs already sent (Sales Review or Complete)
                        const briefSent = creativeStatus.includes('sales review') ||
                                         creativeStatus.includes('complete') ||
                                         creativeStatus.includes('sent');

                        return hasDate && !isComplete && !briefSent;
                    })
                    .map(p => ({
                        id: p.id,
                        url: p.url,
                        title: p.title,
                        client: p.client || 'Internal',
                        dueDate: new Date(p.clientDueDate || p.dueDate),
                        dealStage: p.dealStage || '',
                        creativeStatus: p.creativeWorkflowStatus || '',
                        briefLink: p.briefLink || p.creativeResponseLink || ''
                    }))
                    .sort((a, b) => a.dueDate - b.dueDate);

                render();
            } catch (err) {
                console.error('Error loading data:', err);
                document.getElementById('loader').innerHTML = `
                    <div style="color: var(--danger); font-size: 12px;">
                        Error loading data. Check console.
                    </div>
                `;
            }
        }

        function render() {
            const container = document.getElementById('list-container');
            const countBadge = document.getElementById('count');
            document.getElementById('loader').style.display = 'none';

            countBadge.textContent = `${briefsData.length} briefs`;

            if (briefsData.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📋</div>
                        <div class="empty-title">No Briefs Due</div>
                        <div class="empty-sub">All caught up! No pending briefs.</div>
                    </div>
                `;
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const threeDaysFromNow = new Date(today);
            threeDaysFromNow.setDate(threeDaysFromNow.getDate() + 3);

            container.innerHTML = briefsData.map(item => {
                const day = item.dueDate.getDate();
                const month = item.dueDate.toLocaleDateString('en-GB', { month: 'short' });
                const isOverdue = item.dueDate < today;
                const isDueSoon = !isOverdue && item.dueDate <= threeDaysFromNow;

                let cardClass = 'card';
                if (isOverdue) cardClass += ' overdue';
                else if (isDueSoon) cardClass += ' due-soon';

                return `
                    <div class="${cardClass}" id="card-${item.id}" onclick="window.open('${item.url}', '_blank')">
                        <div class="complete-checkbox" onclick="event.stopPropagation(); markBriefSent('${item.id}')" title="Mark brief as sent">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <div class="date-badge">
                            <span class="date-day">${day}</span>
                            <span class="date-month">${month}</span>
                        </div>
                        <div class="info">
                            <div class="client-name">${item.client}</div>
                            <div class="project-name">${item.title}</div>
                            ${item.dealStage ? `<span class="deal-stage">${item.dealStage}</span>` : ''}
                        </div>
                        <div class="actions">
                            ${item.briefLink ? `
                                <button class="icon-btn has-link" onclick="event.stopPropagation(); window.open('${item.briefLink}', '_blank')" title="Open Brief/Response">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                                    </svg>
                                </button>
                            ` : ''}
                            <button class="icon-btn" onclick="event.stopPropagation(); window.open('${item.url}', '_blank')" title="Open in Notion">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <line x1="10" y1="14" x2="21" y2="3"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function markBriefSent(projectId) {
            const card = document.getElementById(`card-${projectId}`);
            const checkbox = card.querySelector('.complete-checkbox');

            // Visual feedback
            checkbox.classList.add('checking');

            try {
                // Update Notion: set creativeWorkflowStatus to "Sales Review"
                const res = await fetch(`${API_URL}/projects/${projectId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        creativeWorkflowStatus: 'Sales Review'
                    })
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    throw new Error(errorData.error || `API error: ${res.status}`);
                }

                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Update failed');

                // Animate out and remove
                card.classList.add('completing');
                showToast('Brief marked as sent!', 'success');

                setTimeout(() => {
                    // Remove from local data and re-render
                    briefsData = briefsData.filter(b => b.id !== projectId);
                    render();
                }, 400);

            } catch (err) {
                console.error('Error marking brief sent:', err);
                checkbox.classList.remove('checking');
                showToast('Failed to update: ' + err.message, 'error');
            }
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} visible`;
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // Load data on page load
        fetchData();

        // Auto-refresh every 5 minutes
        setInterval(fetchData, 5 * 60 * 1000);
    </script>
</body>
</html>
