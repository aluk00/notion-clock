<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Capacity | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --production: #43B049;
            --production-light: rgba(67, 176, 73, 0.1);
            --available: #10B981;
            --busy: #F59E0B;
            --full: #EF4444;
            --ink: #1C1C1C;
            --ink-light: #6B7280;
            --border: #E5E7EB;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            color: var(--ink);
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .dots {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--production);
        }
        .dots span:nth-child(1) { animation: pulse 2s ease-in-out infinite; }
        .dots span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dots span:nth-child(3) { animation: pulse 2s ease-in-out 0.6s infinite; }
        .dots span:nth-child(4) { animation: pulse 2s ease-in-out 0.9s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .pulse-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 500px) { .summary { grid-template-columns: 1fr; } }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .summary-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .summary-icon.available { background: rgba(16, 185, 129, 0.1); }
        .summary-icon.busy { background: rgba(245, 158, 11, 0.1); }
        .summary-icon.full { background: rgba(239, 68, 68, 0.1); }

        .summary-content { flex: 1; }
        .summary-value { font-size: 24px; font-weight: 800; line-height: 1; margin-bottom: 2px; }
        .summary-label { font-size: 10px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .member-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: var(--transition);
        }
        .member-card:hover { border-color: var(--ink-light); }

        .member-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            cursor: pointer;
        }

        .member-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--production);
            color: white;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-info { flex: 1; }
        .member-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; transition: color 0.15s; }
        .member-card:hover .member-name { color: var(--production); }
        .member-role { font-size: 10px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.03em; }

        .member-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .member-status.available { background: var(--available); }
        .member-status.busy { background: var(--busy); }
        .member-status.full { background: var(--full); }

        .capacity-bar {
            height: 6px;
            background: var(--surface-alt);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .capacity-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .capacity-fill.available { background: var(--available); }
        .capacity-fill.busy { background: var(--busy); }
        .capacity-fill.full { background: var(--full); }

        .tasks-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
        }

        .tasks-count { font-weight: 600; color: var(--ink); }
        .tasks-detail { color: var(--ink-light); }

        .task-list {
            display: none;
            background: var(--surface-alt);
            border-radius: 8px;
            padding: 8px;
            margin-top: 10px;
        }
        .task-list.expanded { display: block; }
        .task-item {
            font-size: 10px;
            padding: 6px 8px;
            background: var(--surface);
            border-radius: 6px;
            margin-bottom: 4px;
            border-left: 3px solid var(--production);
        }
        .task-item:last-child { margin-bottom: 0; }
        .task-title { font-weight: 700; color: var(--ink); }
        .task-meta { color: var(--ink-light); margin-top: 2px; display: flex; gap: 8px; }
        .task-date { font-weight: 600; padding: 1px 4px; border-radius: 3px; background: #E5E5E5; }

        .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-text { font-size: 10px; color: var(--ink-light); }

        .btn-request {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--ink);
        }
        .btn-request:hover { border-color: var(--ink); }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 12px;
        }
        .loading-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <span class="pulse-label">Designer Capacity</span>
    </div>

    <div id="content">
        <div class="loading">
            <div class="dots"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading capacity...</span>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const APP_ID = "dmg-command-centre-native";

    // Effort scores in hours per task type
    const EFFORT = {
        'Thumbnail': 0.5,
        'Headline': 0.5,
        'Swipe': 1,
        'Deck': 2,
        'Template': 1.5,
        'Other': 1
    };

    const MAX_HOURS = 6; // Max productive hours per designer per day

    let designers = [];
    let requests = [];

    function getInitials(name) {
        return name.split(' ').map(n => n[0]).join('').toUpperCase();
    }

    function getCapacityStatus(hours) {
        const pct = (hours / MAX_HOURS) * 100;
        if (pct < 50) return 'available';
        if (pct < 80) return 'busy';
        return 'full';
    }

    function render() {
        // Calculate workload per designer based on assigned tasks
        const workload = {};
        const tasksByDesigner = {};
        designers.forEach(d => {
            workload[d.id] = { tasks: 0, hours: 0 };
            tasksByDesigner[d.id] = [];
        });

        // Only count tasks that are In Progress or Not Started and assigned to a designer
        requests.forEach(r => {
            if (r.designerId && workload[r.designerId] && r.status !== 'Done') {
                const effort = EFFORT[r.assetType] || 1;
                workload[r.designerId].tasks++;
                workload[r.designerId].hours += effort;
                tasksByDesigner[r.designerId].push({
                    title: r.headline || r.title || 'Untitled',
                    type: r.assetType,
                    dueDate: r.deadline,
                    liveDate: r.liveDate,
                    status: r.status
                });
            }
        });

        // Calculate summary stats
        let available = 0, busy = 0, full = 0;
        designers.forEach(d => {
            const status = getCapacityStatus(workload[d.id].hours);
            if (status === 'available') available++;
            else if (status === 'busy') busy++;
            else full++;
        });

        document.getElementById('content').innerHTML = `
            <div class="summary">
                <div class="summary-card">
                    <div class="summary-icon available">🟢</div>
                    <div class="summary-content">
                        <div class="summary-value">${available}</div>
                        <div class="summary-label">Available</div>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon busy">🟡</div>
                    <div class="summary-content">
                        <div class="summary-value">${busy}</div>
                        <div class="summary-label">Busy</div>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon full">🔴</div>
                    <div class="summary-content">
                        <div class="summary-value">${full}</div>
                        <div class="summary-label">At Capacity</div>
                    </div>
                </div>
            </div>

            <div class="team-grid">
                ${designers.map((d, idx) => {
                    const w = workload[d.id];
                    const tasks = tasksByDesigner[d.id] || [];
                    const status = getCapacityStatus(w.hours);
                    const pct = Math.min((w.hours / MAX_HOURS) * 100, 100);
                    const name = `${d.firstName} ${d.lastName}`;

                    return `
                        <div class="member-card" id="designer-${idx}">
                            <div class="member-top" onclick="toggleDesignerTasks(${idx})">
                                <div class="member-avatar">${getInitials(name)}</div>
                                <div class="member-info">
                                    <div class="member-name">${name}</div>
                                    <div class="member-role">${d.role || 'Designer'}</div>
                                </div>
                                <div class="member-status ${status}"></div>
                            </div>
                            <div class="capacity-bar">
                                <div class="capacity-fill ${status}" style="width: ${pct}%"></div>
                            </div>
                            <div class="tasks-summary">
                                <span class="tasks-count">${w.tasks} task${w.tasks !== 1 ? 's' : ''}</span>
                                <span class="tasks-detail">${w.hours.toFixed(1)}h / ${MAX_HOURS}h</span>
                            </div>
                            ${tasks.length > 0 ? `
                                <div class="task-list" id="designer-tasks-${idx}">
                                    ${tasks.map(t => `
                                        <div class="task-item">
                                            <div class="task-title">${t.title}</div>
                                            <div class="task-meta">
                                                ${t.type ? `<span>${t.type}</span>` : ''}
                                                ${t.dueDate ? `<span class="task-date">Due: ${new Date(t.dueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>` : ''}
                                                ${t.liveDate ? `<span class="task-date" style="background:#DCFCE7; color:#166534;">Live: ${new Date(t.liveDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>` : ''}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('')}
            </div>

            <div class="footer">
                <span class="footer-text">Based on assigned tasks in queue</span>
                <a href="design-request-form.html" class="btn-request">Submit Request →</a>
            </div>
        `;
    }

    // Global toggle function for expanding task list
    window.toggleDesignerTasks = function(idx) {
        const taskList = document.getElementById(`designer-tasks-${idx}`);
        if (taskList) {
            taskList.classList.toggle('expanded');
        }
    };

    signInAnonymously(auth).then(async () => {
        // Load staff and filter for designers
        const staffSnap = await getDocs(collection(db, "artifacts", APP_ID, "public", "data", "staff_directory"));
        const allStaff = staffSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        // Filter for design team members
        designers = allStaff.filter(s =>
            s.team === 'Creative' ||
            s.team === 'Design' ||
            s.role?.toLowerCase().includes('design') ||
            s.role?.toLowerCase().includes('graphic')
        );

        // If no designers found, use first 4 staff as demo
        if (designers.length === 0) {
            designers = allStaff.slice(0, 4);
        }

        // Listen to design requests (quick requests)
        onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "design_requests"), (snap) => {
            requests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });

        // Also listen to asset_metadata for commercial hub assets that need design work
        onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "asset_metadata"), (snap) => {
            const assetMeta = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            // Filter for assets that might need design (thumbnails, graphics)
            const designAssets = assetMeta.filter(a =>
                !a.thumbnailReady &&
                a.status !== 'Live' &&
                a.status !== 'Approved'
            ).map(a => ({
                id: a.id,
                assetType: 'Thumbnail',
                status: a.status === 'Review' ? 'Done' : (a.status === 'Edit' ? 'In Progress' : 'Not Started'),
                designerId: null, // Unassigned from commercial hub
                source: 'commercial-hub',
                title: a.assetTitle || 'Asset'
            }));

            // Merge with existing requests, avoiding duplicates
            const existingIds = new Set(requests.map(r => r.id));
            const newAssets = designAssets.filter(a => !existingIds.has(a.id));
            requests = [...requests.filter(r => r.source !== 'commercial-hub'), ...newAssets];
            render();
        });
    });
</script>

</body>
</html>
