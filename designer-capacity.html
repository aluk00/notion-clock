<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Capacity | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --production: #43B049;
            --production-light: rgba(67, 176, 73, 0.1);
            --available: #10B981;
            --busy: #F59E0B;
            --full: #EF4444;
            --ink: #1C1C1C;
            --ink-light: #6B7280;
            --border: #E5E7EB;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            color: var(--ink);
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .dots {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--production);
        }
        .dots span:nth-child(1) { animation: pulse 2s ease-in-out infinite; }
        .dots span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dots span:nth-child(3) { animation: pulse 2s ease-in-out 0.6s infinite; }
        .dots span:nth-child(4) { animation: pulse 2s ease-in-out 0.9s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .pulse-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 500px) { .summary { grid-template-columns: 1fr; } }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .summary-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .summary-icon.available { background: rgba(16, 185, 129, 0.1); }
        .summary-icon.busy { background: rgba(245, 158, 11, 0.1); }
        .summary-icon.full { background: rgba(239, 68, 68, 0.1); }

        .summary-content { flex: 1; }
        .summary-value { font-size: 24px; font-weight: 800; line-height: 1; margin-bottom: 2px; }
        .summary-label { font-size: 10px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .member-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: var(--transition);
        }
        .member-card:hover { border-color: var(--ink-light); }

        .member-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            cursor: pointer;
        }

        .member-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--production);
            color: white;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-info { flex: 1; }
        .member-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; transition: color 0.15s; }
        .member-card:hover .member-name { color: var(--production); }
        .member-role { font-size: 10px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.03em; }

        .member-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .member-status.available { background: var(--available); }
        .member-status.busy { background: var(--busy); }
        .member-status.full { background: var(--full); }

        .capacity-bar {
            height: 6px;
            background: var(--surface-alt);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .capacity-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .capacity-fill.available { background: var(--available); }
        .capacity-fill.busy { background: var(--busy); }
        .capacity-fill.full { background: var(--full); }

        .tasks-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
        }

        .tasks-count { font-weight: 600; color: var(--ink); }
        .tasks-detail { color: var(--ink-light); }

        .task-list {
            display: none;
            background: var(--surface-alt);
            border-radius: 8px;
            padding: 8px;
            margin-top: 10px;
        }
        .task-list.expanded { display: block; }
        .task-item {
            font-size: 10px;
            padding: 6px 8px;
            background: var(--surface);
            border-radius: 6px;
            margin-bottom: 4px;
            border-left: 3px solid var(--production);
        }
        .task-item:last-child { margin-bottom: 0; }
        .task-title { font-weight: 700; color: var(--ink); }
        .task-meta { color: var(--ink-light); margin-top: 2px; display: flex; gap: 8px; }
        .task-date { font-weight: 600; padding: 1px 4px; border-radius: 3px; background: #E5E5E5; }

        .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-text { font-size: 10px; color: var(--ink-light); }

        .btn-request {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--ink);
        }
        .btn-request:hover { border-color: var(--ink); }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 12px;
        }
        .loading-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Modal Styles */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #FFF; border-radius: 16px; max-width: 600px; width: 90%; max-height: 90vh; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .modal-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #FFF; flex-shrink: 0; }
        .modal-info { flex: 1; }
        .modal-name { font-size: 18px; font-weight: 800; }
        .modal-role { font-size: 12px; color: var(--ink-light); margin-top: 2px; }
        .modal-capacity { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .modal-bar { width: 120px; height: 8px; background: var(--surface-alt); border-radius: 4px; overflow: hidden; }
        .modal-bar-fill { height: 100%; border-radius: 4px; }
        .modal-percent { font-size: 14px; font-weight: 800; }
        .modal-close { width: 36px; height: 36px; border: none; background: var(--surface-alt); border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--ink-light); }
        .modal-close:hover { background: var(--border); }
        .modal-body { padding: 20px; overflow-y: auto; max-height: calc(90vh - 200px); }
        .modal-section { margin-bottom: 20px; }
        .modal-section:last-child { margin-bottom: 0; }
        .modal-section-title { font-size: 11px; font-weight: 700; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .modal-section-count { background: var(--production); color: #FFF; padding: 2px 8px; border-radius: 10px; font-size: 10px; }
        .modal-task { background: var(--surface-alt); border-radius: 10px; padding: 12px; margin-bottom: 8px; border-left: 3px solid var(--production); }
        .modal-task:last-child { margin-bottom: 0; }
        .modal-task-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
        .modal-task-meta { display: flex; gap: 8px; flex-wrap: wrap; }
        .modal-tag { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: var(--border); color: var(--ink-light); }
        .modal-tag.type { background: rgba(139, 92, 246, 0.1); color: #7C3AED; }
        .modal-tag.due { background: #FEF3C7; color: #92400E; }
        .modal-tag.live { background: #DCFCE7; color: #166534; }
        .modal-tag.status { background: rgba(67, 176, 73, 0.1); color: var(--production); }
        .modal-empty { text-align: center; padding: 30px; color: var(--ink-light); font-size: 12px; }

        /* Assign Project Section */
        .assign-section { background: var(--surface-alt); border-radius: 10px; padding: 14px; }
        .assign-title { font-size: 11px; font-weight: 700; color: var(--ink-light); margin-bottom: 10px; text-transform: uppercase; }
        .assign-select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 500; background: var(--surface); cursor: pointer; }
        .assign-select:focus { outline: none; border-color: var(--production); }
        .assign-btn { margin-top: 10px; width: 100%; padding: 10px; background: var(--production); color: #FFF; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .assign-btn:hover { opacity: 0.9; }
        .assign-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: #FFF; padding: 12px 24px; border-radius: 50px; font-size: 12px; font-weight: 600; z-index: 2000; transition: transform 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--full); }
        .toast.success { background: var(--production); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <span class="pulse-label">Designer Capacity</span>
    </div>

    <div id="content">
        <div class="loading">
            <div class="dots"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading capacity...</span>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal"></div>
    </div>
    <div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs, doc, setDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const APP_ID = "dmg-command-centre-native";
    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

    // Effort points fallback per task type when no effortPTS is provided
    const EFFORT = {
        'Thumbnail': 4,
        'Headline': 2,
        'Swipe': 2,
        'Deck': 6,
        'Template': 3,
        'Other': 2
    };

    let designers = [];
    let requests = [];
    let dailyRundowns = [];
    let apiDeliverables = [];
    let currentDesigner = null;

    // Fetch deliverables from Cloud Run API (optional enhancement)
    // Widget works fine with just Firebase data if API is unavailable
    async function loadApiDeliverables() {
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);

            let res = await fetch(`${API_URL}/deliverables`, { signal: controller.signal });
            clearTimeout(timeout);

            if (!res.ok) {
                console.warn('[Designer Capacity] API returned', res.status, '- using Firebase data only');
                return;
            }

            let data = await res.json();
            let deliverables = data.deliverables || data.projects || [];

            if (deliverables.length === 0) {
                const projRes = await fetch(`${API_URL}/projects`);
                if (projRes.ok) {
                    data = await projRes.json();
                    deliverables = data.projects || [];
                }
            }

            // Filter for design-related items
            apiDeliverables = deliverables.filter(d => {
                const status = (d.status || d.productionWorkflowStatus || '').toLowerCase();
                const discipline = (d.discipline || '').toLowerCase();
                if (status === 'live' || status === 'published' || status === 'complete' || status === 'done') return false;
                if (d.staticAssetsNeeded?.length > 0 || d.staticAssetCount > 0) return true;
                if (discipline === 'design') return true;
                if (d.graphicDesigner) return true;
                if (d.designTaskType) return true;
                return false;
            }).map(d => ({
                id: d.id,
                title: d.title,
                headline: d.title,
                designerId: null, // Will match by name
                designerName: d.graphicDesigner || d.assignedTo,
                effortPTS: d.effortPTS || d.effortPts || EFFORT[d.designTaskType] || 2,
                assetType: d.designTaskType || 'Design',
                deadline: d.dueDate || d.clientDueDate,
                liveDate: d.plannedLiveDate || d.liveDate,
                status: d.status || 'Not Started',
                source: 'api'
            }));

            console.log('[Designer Capacity] Loaded', apiDeliverables.length, 'items from API');
            render();
        } catch (err) {
            // Silently fail - widget works with just Firebase data
            console.warn('[Designer Capacity] API unavailable, using Firebase data only');
        }
    }

    function getInitials(name) {
        return name.split(' ').map(n => n[0]).join('').toUpperCase();
    }

    function getCapacityStatus(utilization) {
        if (utilization < 80) return 'available';
        if (utilization < 100) return 'busy';
        return 'full';
    }

    function getCapacityColor(status) {
        if (status === 'available') return '#10B981';
        if (status === 'busy') return '#F59E0B';
        return '#EF4444';
    }

    function getWeeklyCapacity(person) {
        return Number(person.weeklyCapacityPTS ?? person.weeklyCapacityPts ?? person.maxHoursPerWeek ?? 40);
    }

    function getEffortPoints(item) {
        if (typeof item?.effortPTS === 'number') return item.effortPTS;
        if (typeof item?.effortPts === 'number') return item.effortPts;
        const fallback = EFFORT[item?.assetType] ?? 2;
        return Number(fallback);
    }

    // Show toast notification
    function showToast(message, type = '') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast show ${type}`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Close modal
    window.closeModal = function() {
        document.getElementById('modalOverlay').classList.remove('active');
        currentDesigner = null;
    };

    // Get available projects for designers
    function getAvailableProjects() {
        const projects = [];
        // From design requests (unassigned)
        requests.forEach(item => {
            if (!item.designerId && item.status !== 'Done') {
                projects.push({
                    id: item.id,
                    title: item.headline || item.title || 'Untitled',
                    source: 'design_requests',
                    assetType: item.assetType,
                    deadline: item.deadline
                });
            }
        });
        // From daily rundowns that need design work
        dailyRundowns.forEach(item => {
            if (item.thumbnailStatus === 'needed') {
                projects.push({
                    id: item.id,
                    title: item.title,
                    source: 'daily_rundown',
                    assetType: 'Thumbnail',
                    vertical: item.vertical,
                    creator: item.creator
                });
            }
        });
        return projects;
    }

    // Assign project to designer
    window.assignProject = async function() {
        const select = document.getElementById('assignSelect');
        const projectData = JSON.parse(select.value || 'null');
        if (!projectData || !currentDesigner) return;

        const btn = document.querySelector('.assign-btn');
        btn.disabled = true;
        btn.textContent = 'Assigning...';

        try {
            if (projectData.source === 'design_requests') {
                // Update existing design_requests item
                await setDoc(doc(db, "artifacts", APP_ID, "public", "data", "design_requests", projectData.id), {
                    designerId: currentDesigner.id,
                    designerName: `${currentDesigner.firstName} ${currentDesigner.lastName}`,
                    assignedAt: serverTimestamp()
                }, { merge: true });
            } else if (projectData.source === 'daily_rundown') {
                // Create a new design request from daily rundown
                await addDoc(collection(db, "artifacts", APP_ID, "public", "data", "design_requests"), {
                    title: projectData.title,
                    headline: projectData.title,
                    designerId: currentDesigner.id,
                    designerName: `${currentDesigner.firstName} ${currentDesigner.lastName}`,
                    sourceType: 'daily_rundown',
                    sourceId: projectData.id,
                    assetType: projectData.assetType || 'Thumbnail',
                    vertical: projectData.vertical,
                    creator: projectData.creator,
                    status: 'In Progress',
                    assignedAt: serverTimestamp()
                });
            }

            showToast(`Assigned to ${currentDesigner.firstName}`, 'success');
            closeModal();
        } catch (error) {
            console.error('Assignment error:', error);
            showToast('Failed to assign: ' + error.message, 'error');
        }

        btn.disabled = false;
        btn.textContent = 'Assign to Designer';
    };

    // Open designer detail modal
    window.openDesignerModal = function(designerData) {
        currentDesigner = designerData;
        const modal = document.getElementById('modal');
        const availableProjects = getAvailableProjects();

        const weeklyCapacity = getWeeklyCapacity(designerData);
        const utilization = weeklyCapacity > 0 ? (designerData.effort / weeklyCapacity) * 100 : 0;
        const status = getCapacityStatus(utilization);
        const pct = Math.min(utilization, 100);

        modal.innerHTML = `
            <div class="modal-header">
                <div class="modal-avatar" style="background: #43B049">${getInitials(`${designerData.firstName} ${designerData.lastName}`)}</div>
                <div class="modal-info">
                    <div class="modal-name">${designerData.firstName} ${designerData.lastName}</div>
                    <div class="modal-role">${designerData.role || 'Designer'} • ${designerData.team || 'Creative'}</div>
                    <div class="modal-capacity">
                        <div class="modal-bar">
                            <div class="modal-bar-fill" style="width:${pct}%; background:${getCapacityColor(status)}"></div>
                        </div>
                        <span class="modal-percent" style="color:${getCapacityColor(status)}">${Math.round(pct)}%</span>
                        <span style="font-size: 11px; color: var(--ink-light);">${designerData.tasks} tasks • ${designerData.effort.toFixed(1)} PTS / ${weeklyCapacity} PTS</span>
                    </div>
                </div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <div class="modal-section-title">
                        Current Assignments
                        <span class="modal-section-count">${designerData.taskList.length}</span>
                    </div>
                    ${designerData.taskList.length === 0 ?
                        '<div class="modal-empty">No active tasks assigned</div>' :
                        designerData.taskList.map(t => `
                            <div class="modal-task">
                                <div class="modal-task-title">${t.title || 'Untitled'}</div>
                                <div class="modal-task-meta">
                                    ${t.type ? `<span class="modal-tag type">${t.type}</span>` : ''}
                                    ${t.status ? `<span class="modal-tag status">${t.status}</span>` : ''}
                                    ${t.dueDate ? `<span class="modal-tag due">Due: ${new Date(t.dueDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>` : ''}
                                    ${t.liveDate ? `<span class="modal-tag live">Live: ${new Date(t.liveDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>` : ''}
                                </div>
                            </div>
                        `).join('')
                    }
                </div>

                <div class="modal-section">
                    <div class="assign-section">
                        <div class="assign-title">Assign New Project</div>
                        <select class="assign-select" id="assignSelect">
                            <option value="">Select a project to assign...</option>
                            ${availableProjects.length === 0 ? '<option disabled>No unassigned projects available</option>' : ''}
                            ${availableProjects.map(p => `
                                <option value='${JSON.stringify(p).replace(/'/g, "&#39;")}'>${p.title}${p.assetType ? ` (${p.assetType})` : ''}${p.source === 'daily_rundown' ? ' [Rundown]' : ''}</option>
                            `).join('')}
                        </select>
                        <button class="assign-btn" onclick="assignProject()" ${availableProjects.length === 0 ? 'disabled' : ''}>Assign to Designer</button>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('modalOverlay').classList.add('active');
    };

    function render() {
        // Calculate workload per designer based on assigned tasks
        const workload = {};
        const tasksByDesigner = {};
        const seenIds = {};
        designers.forEach(d => {
            workload[d.id] = { tasks: 0, effort: 0, weeklyCapacity: getWeeklyCapacity(d) };
            tasksByDesigner[d.id] = [];
            seenIds[d.id] = new Set();
        });

        // Count tasks from Firebase design_requests
        requests.forEach(r => {
            if (r.designerId && workload[r.designerId] && r.status !== 'Done') {
                const effort = getEffortPoints(r);
                workload[r.designerId].tasks++;
                workload[r.designerId].effort += effort;
                seenIds[r.designerId].add(r.id);
                tasksByDesigner[r.designerId].push({
                    title: r.headline || r.title || 'Untitled',
                    type: r.assetType,
                    effortPTS: effort,
                    dueDate: r.deadline,
                    liveDate: r.liveDate,
                    status: r.status,
                    source: 'firebase'
                });
            }
        });

        // Count tasks from API deliverables (match by designer name)
        apiDeliverables.forEach(item => {
            if (item.designerName) {
                // Find designer by name
                const designer = designers.find(d =>
                    `${d.firstName} ${d.lastName}` === item.designerName ||
                    d.firstName === item.designerName
                );
                if (designer && workload[designer.id] && !seenIds[designer.id].has(item.id)) {
                    const effort = item.effortPTS || EFFORT[item.assetType] || 2;
                    workload[designer.id].tasks++;
                    workload[designer.id].effort += effort;
                    seenIds[designer.id].add(item.id);
                    tasksByDesigner[designer.id].push({
                        title: item.title || 'Untitled',
                        type: item.assetType,
                        effortPTS: effort,
                        dueDate: item.deadline,
                        liveDate: item.liveDate,
                        status: item.status,
                        source: 'api'
                    });
                }
            }
        });

        // Calculate summary stats
        let available = 0, busy = 0, full = 0;
        designers.forEach(d => {
            const utilization = workload[d.id].weeklyCapacity
                ? (workload[d.id].effort / workload[d.id].weeklyCapacity) * 100
                : 0;
            const status = getCapacityStatus(utilization);
            if (status === 'available') available++;
            else if (status === 'busy') busy++;
            else full++;
        });

        document.getElementById('content').innerHTML = `
            <div class="summary">
                <div class="summary-card">
                    <div class="summary-icon available">🟢</div>
                    <div class="summary-content">
                        <div class="summary-value">${available}</div>
                        <div class="summary-label">Available</div>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon busy">🟡</div>
                    <div class="summary-content">
                        <div class="summary-value">${busy}</div>
                        <div class="summary-label">Busy</div>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon full">🔴</div>
                    <div class="summary-content">
                        <div class="summary-value">${full}</div>
                        <div class="summary-label">At Capacity</div>
                    </div>
                </div>
            </div>

            <div class="team-grid">
                ${designers.map((d, idx) => {
                    const w = workload[d.id];
                    const tasks = tasksByDesigner[d.id] || [];
                    const utilization = w.weeklyCapacity ? (w.effort / w.weeklyCapacity) * 100 : 0;
                    const status = getCapacityStatus(utilization);
                    const pct = Math.min(utilization, 100);
                    const name = `${d.firstName} ${d.lastName}`;

                    // Create serializable data for modal
                    const designerData = JSON.stringify({
                        id: d.id,
                        firstName: d.firstName,
                        lastName: d.lastName,
                        role: d.role,
                        team: d.team,
                        tasks: w.tasks,
                        effort: w.effort,
                        weeklyCapacity: w.weeklyCapacity,
                        taskList: tasks
                    }).replace(/"/g, '&quot;');

                    return `
                        <div class="member-card" id="designer-${idx}">
                            <div class="member-top" onclick="openDesignerModal(${designerData})">
                                <div class="member-avatar">${getInitials(name)}</div>
                                <div class="member-info">
                                    <div class="member-name">${name}</div>
                                    <div class="member-role">${d.role || 'Designer'}</div>
                                </div>
                                <div class="member-status ${status}"></div>
                            </div>
                            <div class="capacity-bar">
                                <div class="capacity-fill ${status}" style="width: ${pct}%"></div>
                            </div>
                            <div class="tasks-summary">
                                <span class="tasks-count">${w.tasks} task${w.tasks !== 1 ? 's' : ''}</span>
                                <span class="tasks-detail">${w.effort.toFixed(1)} PTS / ${w.weeklyCapacity} PTS</span>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>

            <div class="footer">
                <span class="footer-text">Based on assigned effort points in queue</span>
                <a href="project-ledger.html" class="btn-request">Submit Request →</a>
            </div>
        `;
    }

    signInAnonymously(auth).then(async () => {
        // Load API deliverables (canonical Notion data)
        loadApiDeliverables();
        setInterval(loadApiDeliverables, 60000); // Refresh every minute

        // Load staff and filter for designers
        const staffSnap = await getDocs(collection(db, "artifacts", APP_ID, "public", "data", "staff_directory"));
        const allStaff = staffSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        // Filter for design team members
        designers = allStaff.filter(s =>
            s.team === 'Creative' ||
            s.team === 'Design' ||
            s.role?.toLowerCase().includes('design') ||
            s.role?.toLowerCase().includes('graphic')
        );

        // If no designers found, use first 4 staff as demo
        if (designers.length === 0) {
            designers = allStaff.slice(0, 4);
        }

        // Listen to design requests (quick requests)
        onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "design_requests"), (snap) => {
            requests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });

        // Listen to daily rundowns for assignment capability
        onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "daily_rundowns"), (snap) => {
            dailyRundowns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        });

        // Also listen to asset_metadata for commercial hub assets that need design work
        onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "asset_metadata"), (snap) => {
            const assetMeta = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            // Filter for assets that might need design (thumbnails, graphics)
            const designAssets = assetMeta.filter(a =>
                !a.thumbnailReady &&
                a.status !== 'Live' &&
                a.status !== 'Approved'
            ).map(a => ({
                id: a.id,
                assetType: 'Thumbnail',
                status: a.status === 'Review' ? 'Done' : (a.status === 'Edit' ? 'In Progress' : 'Not Started'),
                designerId: null, // Unassigned from commercial hub
                source: 'commercial-hub',
                title: a.assetTitle || 'Asset'
            }));

            // Merge with existing requests, avoiding duplicates
            const existingIds = new Set(requests.map(r => r.id));
            const newAssets = designAssets.filter(a => !existingIds.has(a.id));
            requests = [...requests.filter(r => r.source !== 'commercial-hub'), ...newAssets];
            render();
        });
    });
</script>

</body>
</html>
