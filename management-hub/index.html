<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Management Hub | Live Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Team Colours */
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-people: #21a0d8;
            --team-operations: #21a0d8;
            --team-executive: #1C1C1C;

            /* Status Colors */
            --st-office: #2E7D32;
            --st-wfh: #F9A825;
            --st-shoot: #2196F3;
            --st-pto: #F44336;
            --st-clienttravel: #6A1B9A;
            --st-weekend: #9E9E9E;
            --st-pending: #BDBDBD;

            /* UI Tokens */
            --carbon: #333;
            --bg-page: #FFFFFF;
            --bg-base: #FFFFFF;
            --border: #EAECEF;
            --ink: #333;
            --ink-sub: #757575;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.1);
            --shadow-glow-blue: 0 0 20px rgba(33, 160, 216, 0.2);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            margin: 0; padding: 0; color: var(--ink); min-height: 100vh;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        /* --- IMPACT ANIMATIONS --- */
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        @keyframes dotCycle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        @keyframes loader-bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* --- AUTH SCREEN --- */
        #lock-screen {
            position: fixed; inset: 0; background: var(--bg-base); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .header-dots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 44px; height: 44px; }
        .header-dots .dot { width: 100%; height: 100%; background-color: var(--team-people); border-radius: 50%; }
        #lock-screen .header-dots .dot { animation: dotCycle 3s infinite ease-in-out; }
        #lock-screen .header-dots .dot:nth-child(1) { animation-delay: 0s; }
        #lock-screen .header-dots .dot:nth-child(2) { animation-delay: 0.75s; }
        #lock-screen .header-dots .dot:nth-child(4) { animation-delay: 1.5s; }
        #lock-screen .header-dots .dot:nth-child(3) { animation-delay: 2.25s; }

        .pin-field { display: flex; gap: 12px; margin-bottom: 40px; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: 0.2s; }
        .pin-dot.filled { background: var(--team-people); border-color: var(--team-people); transform: scale(1.2); }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 280px; }
        .n-btn { 
            aspect-ratio: 1.3; border-radius: var(--radius-md); background: var(--bg-page); 
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; 
            font-size: 20px; font-weight: 700; cursor: pointer; color: var(--ink); 
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(33, 160, 216, 0.2);
        }
        .n-btn:hover {
            box-shadow: 0 0 15px rgba(33, 160, 216, 0.5);
            border-color: var(--team-people);
        }
        .n-btn:active, .n-btn.n-btn--active { background: #E0E0E0; transform: scale(0.95); }
        .n-btn-special {
            background-color: var(--team-people);
            color: #FFF;
            font-weight: 800;
        }
        .n-btn-special:hover {
            background-color: #1a8ac6;
            border-color: #1a8ac6;
        }


        /* --- LAYOUT --- */
        .main-container { max-width: 1360px; margin: 0 auto; padding: 40px; }
        .header-lockup { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 30px; }
        .title-text { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.04em; text-transform: uppercase; line-height: 1; color: var(--carbon); opacity: 0; transform: translateY(10px); animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        #app-shell .header-dots .dot { 
            animation: dotCycle 3s infinite ease-in-out;
            background-color: var(--team-people);
        }
        #app-shell .header-dots .dot:nth-child(1) { animation-delay: 0s; }
        #app-shell .header-dots .dot:nth-child(2) { animation-delay: 0.75s; }
        #app-shell .header-dots .dot:nth-child(3) { animation-delay: 1.5s; }
        #app-shell .header-dots .dot:nth-child(4) { animation-delay: 2.25s; }

        .nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
        .tab-nav { display: flex; gap: 8px; padding: 6px; background: #F8F9FA; border-radius: 99px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .tab-trigger { border: none; background: none; padding: 10px 24px; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; border-radius: 99px; color: var(--ink-sub); transition: 0.2s; letter-spacing: 0.05em; }
        .tab-trigger.active { background: var(--team-people); color: #FFF; box-shadow: 0 4px 12px rgba(33, 160, 216, 0.3); }

        .nav-row-right { display: flex; align-items: center; gap: 16px; }
        .header-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out;
            letter-spacing: 0.05em;
        }
        .btn-admin {
            background-color: #4A4A4A;
            color: #FFF;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
        }
        .btn-admin:hover {
            background-color: #666;
            box-shadow: var(--shadow-sm);
        }
        .btn-help {
            background-color: #FFF;
            color: var(--team-people);
            border: 2px solid var(--team-people);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: 900;
        }
        .btn-help:hover {
            transform: scale(1.1);
            background-color: #e3f2fd;
            box-shadow: var(--shadow-glow-blue);
        }

        .week-picker { display: flex; align-items: center; gap: 20px; background: var(--team-people); color: #FFF; padding: 12px 24px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); transition: opacity 0.3s, visibility 0.3s; }
        .week-picker.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .week-btn { background: rgba(255,255,255,0.1); border: none; color: #FFF; font-weight: 900; cursor: pointer; padding: 8px; font-size: 16px; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .week-btn:hover { background: rgba(255,255,255,0.2); }
        .week-label { font-size: 12px; font-weight: 800; text-transform: uppercase; min-width: 200px; text-align: center; letter-spacing: 0.1em; }
        .week-label .wc-prefix { color: #a1ddf7; }

        /* --- DIRECTORY TABLE --- */
        .directory-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; background: var(--bg-base); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-md); table-layout: fixed; }
        .directory-table th { text-align: left; padding: 20px; font-size: 10px; font-weight: 900; color: var(--team-people); text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--border); background: #FDFDFD; }
        .directory-table th:nth-child(1) { width: 35%; }
        .directory-table th:nth-child(2) { width: 30%; }
        .directory-table th:nth-child(3) { width: 15%; }
        .directory-table th:nth-child(4) { width: 20%; text-align: center;}
        .directory-table td { padding: 16px 20px; font-size: 14px; font-weight: 700; color: var(--ink); transition: background-color 0.2s; vertical-align: middle; }
        .directory-table tbody tr { border-bottom: 1px solid var(--border); }
        .directory-table tbody tr:last-child { border-bottom: none; }
        .directory-table tbody tr:hover td { background-color: #f7f7f7; }
        .name-cell { display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.2s; color: var(--ink); font-weight: 700; }
        .name-cell:hover { color: var(--team-people); }
        .name-dots { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; flex-shrink: 0; }
        .name-dots span { width: 6px; height: 6px; border-radius: 50%; }

        .role-cell { color: var(--ink-sub); font-size: 13px; font-weight: 600; }
        .stream-cell { text-transform: capitalize; font-size: 11px; font-weight: 800; }

        .status-cell { text-align: center; }
        .status-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; cursor: help; }
        .status-icon svg { width: 20px; height: 20px; }

        .is-mgr-pill { 
            font-size: 9px; background: var(--team-people); color: #FFF; padding: 4px 10px; 
            border-radius: 99px; vertical-align: middle; margin-left: 10px; font-weight: 900; 
            letter-spacing: 0.05em; line-height: 1; display: inline-block;
        }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(28,28,28,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 6000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-base); width: 100%; max-width: 700px; border-radius: var(--radius-lg); padding: 0; box-shadow: var(--shadow-lg); max-height: 90vh; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .modal-body { padding: 40px; max-height: calc(90vh - 80px); overflow-y: auto; }
        
        .modal-content-with-accent { position: relative; padding-left: 50px; }
        .modal-content-with-accent::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 10px;
            background-color: var(--modal-accent-color);
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
        }

        .modal-header-stacked { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .modal-mgr-name { font-size: 28px; font-weight: 900; margin: 0; letter-spacing: -0.03em; }
        .modal-sub-title { font-size: 14px; font-weight: 800; text-transform: uppercase; margin-top: 4px; }

        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 24px; font-weight: 800; color: #ccc; cursor: pointer; width: 40px; height: 40px; background: var(--bg-page); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; z-index: 10; }
        .close-btn:hover { color: var(--ink); transform: rotate(90deg); }
        
        .p-section-title { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--team-people); margin: 30px 0 15px 0; }
        .p-grid-large { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 44px; height: 44px; flex-shrink: 0; }
        .p-grid-large span { width: 100%; height: 100%; border-radius: 50%; }

        .p-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 25px; }
        .p-meta-card { padding: 20px; background: var(--bg-page); border-radius: var(--radius-md); border: 1.5px solid var(--border); }
        .p-meta-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #999; margin-bottom: 6px; display: block; letter-spacing: 0.05em; }
        .p-meta-val { font-size: 16px; font-weight: 900; }
        .p-meta-val.grey { color: var(--ink-sub); }
        .p-meta-val-container { display: flex; align-items: center; gap: 10px; }
        .profile-status-editor-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

        .presence-table { width: 100%; border-collapse: collapse; margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow:hidden; }
        .presence-table th { background: var(--bg-page); padding: 12px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--team-people); }
        .presence-table td { padding: 12px; text-align: center; border: 1px solid var(--border); font-size: 11px; font-weight: 800; }
        .presence-table tr.prior-week { opacity: 0.5; background-color: #f9f9f9; }
        .presence-table tr.prior-week td { color: #999; }

        .note-item { background: var(--bg-page); border: 1.5px solid var(--border); padding: 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; line-height: 1.5; color: var(--ink); margin-bottom: 10px; border-left: 5px solid; position: relative; }
        .note-meta { position: absolute; top: 16px; right: 16px; font-size: 10px; color: var(--ink-sub); font-weight: 700; }

        .request-item { background: var(--bg-page); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; }
        .request-name-link { font-size: 18px; font-weight: 900; cursor: pointer; color: var(--ink); }
        .request-name-link:hover { color: var(--team-people); text-decoration: underline; }

        .pill-btn { border: none; padding: 6px 14px; border-radius: 99px; font-size: 10px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; margin-top: 4px; display: inline-block; letter-spacing: 0.05em; }
        .pill-suggest { background: var(--team-people); color: #FFF; }
        .pill-update { background: #E0E0E0; color: #333; padding: 4px 10px; font-size: 9px; margin: 0; }
        .pill-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }

        .pattern-editor { background: #FFF; border: 1.5px solid var(--border); padding: 20px; border-radius: var(--radius-md); margin-top: 15px; box-shadow: var(--shadow-sm); }
        .editor-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 15px; }
        .editor-grid.five-day { grid-template-columns: repeat(5, 1fr); }
        .editor-select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; font-weight: 800; background: var(--bg-page); }
        .editor-day-label { font-size: 10px; font-weight: 800; color: var(--ink-sub); text-transform: uppercase; text-align: center; margin-bottom: 4px; }
        
        .btn-action { padding: 14px 20px; border: none; border-radius: var(--radius-sm); font-size: 11px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 0.05em; min-height: 45px; }
        .btn-action:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-approve { background: var(--st-office); color: #FFF; }
        .btn-deny { background: var(--team-editorial); color: #FFF; }
        .btn-sync { background-color: var(--team-people); color: #FFF; }
        .btn-success { background-color: var(--st-office); color: #FFF; }
        .btn-post {
            background-color: var(--team-people); color: #FFF;
            box-shadow: 0 0 8px rgba(33, 160, 216, 0.4);
        }
        .btn-post:hover {
            box-shadow: 0 0 15px rgba(33, 160, 216, 0.7);
        }
        .btn-action:disabled { cursor: not-allowed; opacity: 0.7; }

        .btn-action .sync-loader { display: flex; justify-content: center; align-items: center; gap: 5px; height: 15px; }
        .btn-action .sync-loader span { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: loader-bounce 1.2s infinite ease-in-out; }
        .btn-action .sync-loader span:nth-child(2) { animation-delay: -0.16s; }
        .btn-action .sync-loader span:nth-child(3) { animation-delay: -0.32s; }
        .btn-action .sync-tick { width: 24px; height: 24px; transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); transform: scale(0); fill: currentColor; }
        .btn-success .sync-tick { transform: scale(1); }

        .view-section { display: none; }
        .view-section.active { display: block; opacity: 0; transform: translateY(10px); animation: slideUpFade 0.5s 0.2s forwards; }

        .approvals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .manager-card {
            background: var(--bg-base); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 24px;
            position: relative; transition: var(--transition);
            cursor: pointer; box-shadow: var(--shadow-sm);
            padding-left: 36px;
        }
        .manager-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
        .manager-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 8px;
            border-radius: var(--radius-md) 0 0 var(--radius-md);
            transition: width var(--transition);
            background-color: var(--accent-color, var(--carbon));
        }
        .manager-card:hover::before { width: 12px; }
        .manager-card-ellie::before { 
            background-image: linear-gradient(
                to bottom,
                var(--team-editorial) 0%,
                var(--team-editorial) 50%,
                var(--team-social) 50%,
                var(--team-social) 100%
            );
        }
        .manager-card-nathan::before { 
            background-image: linear-gradient(
                to bottom,
                var(--team-editorial) 0%,
                var(--team-editorial) 33.33%,
                var(--team-social) 33.33%,
                var(--team-social) 66.66%,
                var(--team-creative) 66.66%,
                var(--team-creative) 100%
            );
        }

        .mgr-name {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #555;
        }
        .mgr-pending-alert {
            font-size: 10px;
            font-weight: 900;
            color: #555;
        }
        .mgr-pending-alert.urgent { color: var(--team-editorial); }
        .mgr-pending-alert.all-clear { color: var(--st-office); }

        .outlook-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .outlook-card { background: var(--bg-base); padding: 24px; border-radius: var(--radius-lg); text-align: center; border: 1.5px solid transparent; transition: 0.3s; cursor: pointer; box-shadow: var(--shadow-md), var(--shadow-glow-blue); }
        .outlook-card:not(.locked):hover { transform: translateY(-4px); border-color: var(--team-people); }
        .outlook-card.locked { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; pointer-events:none; }
        .hero-count { font-size: 48px; font-weight: 900; display: block; line-height: 1; color: var(--team-people); }
        .hero-label { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); letter-spacing: 0.05em; margin-top: 8px; display: block; }
        
        .day-scroller-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .day-scroller { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .day-pill { padding: 12px 24px; border: 1.5px solid var(--border); background: var(--bg-base); border-radius: 99px; cursor: pointer; transition: 0.2s; text-align: center; font-weight: 700; font-size: 14px; white-space: nowrap; position: relative; }
        .day-pill:hover { background: #f0f0f0; border-color: #ddd; }
        .day-pill.active { background: var(--team-people); color: #FFF; border-color: var(--team-people); font-weight: 800; box-shadow: var(--shadow-glow-blue); }
        .today-btn { flex-shrink: 0; background-color: #f0f0f0; border-color: #ddd; }
        .today-btn:hover { background-color: #e0e0e0; }
        .day-pill.is-today::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: currentColor;
            opacity: 0.7;
        }
        
        .team-block { margin-bottom: 40px; }
        .stream-header { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 15px; }
        .stream-header-title { display: flex; align-items: center; gap: 12px; }
        .stream-dot { width: 16px; height: 16px; border-radius: 50%; }
        .team-home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .team-home-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-md);
        }
        .team-home-btn svg {
            width: 20px;
            height: 20px;
            fill: #FFF;
        }


        .status-cell-grid { font-weight: 900; text-align: center; }

        #view-teams .directory-table { table-layout: fixed; width: 100%; }
        #view-teams .directory-table th:first-child,
        #view-teams .directory-table td:first-child { width: 32%; }
        #view-teams .directory-table th:not(:first-child),
        #view-teams .directory-table td:not(:first-child) { width: calc(68% / 7); }

        #view-teams .directory-table th { text-align: center; }
        #view-teams .directory-table th:first-child { text-align: left; }
        #view-teams .directory-table .status-cell-grid { padding: 8px; }
        #view-teams .directory-table .status-cell-grid-header {
            padding: 20px 5px;
            font-size: 10px;
        }
        
        .name-role-container {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .name-cell-teams .name-text {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.2;
            white-space: nowrap;
