<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Meetings Header</title>
    <style>
        /* Core Layout */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden; /* Prevents scrollbars */
        }

        body {
            display: flex;
            justify-content: flex-start; /* Aligns content strictly to the left */
            align-items: center; /* Centers text vertically in the block */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* Container for the Lockup */
        .header-container {
            display: flex;
            align-items: center;
            gap: 12px; /* Tight gap */
            line-height: 1;
            padding-left: 2px; /* Tiny buffer to prevent font clipping on the edge */
        }

        /* Text Styling */
        .title-text {
            font-size: 2.5rem; /* Big, impact text */
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.04em;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-left { animation-delay: 0.1s; }
        .text-right { animation-delay: 0.3s; }

        /* The Dots Container */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 24px;
            height: 24px;
        }

        /* Individual Dot Styling */
        .dot {
            width: 100%;
            height: 100%;
            background-color: #21a0d8; /* DMG Blue */
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* Animations */
        @keyframes slideUpFade { 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes popIn { 
            to { transform: scale(1); } 
        }
        
        /* Responsive scaling */
        @media (max-width: 600px) {
            .title-text { font-size: 1.8rem; }
            .header-container { gap: 8px; }
            .dots-grid { width: 18px; height: 18px; gap: 3px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-text text-left">TEAM</div>
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="title-text text-right">MEETINGS</div>
    </div>

</body>
</html>
