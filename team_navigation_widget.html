<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Navigation</title>
    <style>
        /* Core Styles */
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: transparent;
            display: flex;
            justify-content: center;
        }

        /* Grid Container */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 Columns */
            gap: 20px;
            width: 100%;
            max-width: 900px; /* Controls max width of the whole block */
        }

        /* Card Style */
        .nav-card {
            background-color: #ffffff;
            border-radius: 12px;
            text-decoration: none;
            color: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 140px; /* Fixed height for consistency */
            padding: 25px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nav-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }

        /* The Team Label */
        .team-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            z-index: 2;
            margin-top: auto; /* Pushes text to bottom */
        }

        /* The Abstract Dot Icon */
        .card-icon {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 40px;
            height: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            opacity: 1;
            transition: gap 0.3s ease;
        }

        .nav-card:hover .card-icon {
            gap: 8px; /* Subtle expansion animation on hover */
        }

        .dot {
            border-radius: 50%;
            width: 100%;
            height: 100%;
        }

        /* --- TEAM COLORS --- */
        
        /* 1. EDITORIAL (Red) */
        .card-editorial { border-top: 6px solid #D32F2F; }
        .card-editorial .dot { background-color: #D32F2F; }
        .card-editorial:hover .team-name { color: #D32F2F; }

        /* 2. SALES (Teal) */
        .card-sales { border-top: 6px solid #009688; }
        .card-sales .dot { background-color: #009688; }
        .card-sales:hover .team-name { color: #009688; }

        /* 3. CREATIVE (Pink) */
        .card-creative { border-top: 6px solid #E91E63; }
        .card-creative .dot { background-color: #E91E63; }
        .card-creative:hover .team-name { color: #E91E63; }

        /* 4. PRODUCTION (Green - Changed from Orange to avoid Yellow clash) */
        .card-production { border-top: 6px solid #4CAF50; }
        .card-production .dot { background-color: #4CAF50; }
        .card-production:hover .team-name { color: #4CAF50; }

        /* 5. SOCIAL (Yellow) */
        .card-social { border-top: 6px solid #FFC107; }
        .card-social .dot { background-color: #FFC107; }
        .card-social:hover .team-name { color: #dcb005; } 

        /* 6. PEOPLE (Blue) */
        .card-people { border-top: 6px solid #21a0d8; }
        .card-people .dot { background-color: #21a0d8; }
        .card-people:hover .team-name { color: #21a0d8; }


        /* Responsive: 2 Columns on Tablet */
        @media (max-width: 800px) {
            .nav-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* Responsive: 1 Column on Mobile */
        @media (max-width: 500px) {
            .nav-grid { grid-template-columns: 1fr; }
            .nav-card { height: 100px; padding: 20px; }
            .team-name { font-size: 20px; }
            .card-icon { width: 30px; height: 30px; gap: 4px; }
        }

    </style>
</head>
<body>

    <div class="nav-grid">
        
        <!-- 1. Editorial -->
        <a href="YOUR_EDITORIAL_PAGE_LINK" target="_top" class="nav-card card-editorial">
            <div class="card-icon">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="team-name">Editorial</div>
        </a>

        <!-- 2. Sales -->
        <a href="YOUR_SALES_PAGE_LINK" target="_top" class="nav-card card-sales">
            <div class="card-icon">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="team-name">Sales</div>
        </a>

        <!-- 3. Creative -->
        <a href="YOUR_CREATIVE_PAGE_LINK" target="_top" class="nav-card card-creative">
            <div class="card-icon">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="team-name">Creative</div>
        </a>

        <!-- 4. Production -->
        <a href="YOUR_PRODUCTION_PAGE_LINK" target="_top" class="nav-card card-production">
            <div class="card-icon">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="team-name">Production</div>
        </a>

        <!-- 5. Social -->
        <a href="YOUR_SOCIAL_PAGE_LINK" target="_top" class="nav-card card-social">
            <div class="card-icon">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="team-name">Social</div>
        </a>

        <!-- 6. People -->
        <a href="YOUR_PEOPLE_PAGE_LINK" target="_top" class="nav-card card-people">
            <div class="card-icon">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="team-name">People</div>
        </a>

    </div>

</body>
</html>
