<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Queue | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --production: #43B049;
            --production-light: rgba(67, 176, 73, 0.1);
            --urgent: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            --dmg-blue: #21A0D8;
            --creative: #E6468B;
            --editorial: #E94B4B;
            --ink: #1C1C1C;
            --ink-light: #6B7280;
            --ink-muted: #9CA3AF;
            --border: #E5E7EB;
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; color: var(--ink); padding: 16px; -webkit-font-smoothing: antialiased; }

        .dots { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; }
        .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--creative); }
        .dots span:nth-child(1) { animation: pulse 2s ease-in-out infinite; }
        .dots span:nth-child(2) { animation: pulse 2s ease-in-out 0.3s infinite; }
        .dots span:nth-child(3) { animation: pulse 2s ease-in-out 0.6s infinite; }
        .dots span:nth-child(4) { animation: pulse 2s ease-in-out 0.9s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .queue-label { font-size: 11px; font-weight: 700; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; }
        .stats { margin-left: auto; display: flex; gap: 16px; }
        .stat { display: flex; align-items: center; gap: 6px; }
        .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
        .stat-value { font-size: 12px; font-weight: 700; }
        .stat-label { font-size: 10px; color: var(--ink-light); }

        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: var(--transition); }
        .tab:hover { border-color: var(--ink-light); }
        .tab.active { background: var(--ink); color: white; border-color: var(--ink); }

        .columns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 1100px) { .columns { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 700px) { .columns { grid-template-columns: 1fr; } }

        .column { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-height: 200px; }
        .column.forecast { border-color: rgba(33, 160, 216, 0.3); background: rgba(33, 160, 216, 0.02); }
        .column-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .column-dot { width: 8px; height: 8px; border-radius: 50%; }
        .column-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-light); }
        .column-count { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--ink-light); background: var(--surface-alt); padding: 2px 8px; border-radius: 10px; }

        .cards { display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; }

        .card { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; position: relative; transition: var(--transition); }
        .card:hover { border-color: var(--ink-light); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.04); }

        .card-priority { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
        .card-priority.high { background: var(--urgent); }
        .card-priority.medium { background: var(--warning); }
        .card-priority.low { background: var(--success); }
        .card-priority.forecast { background: var(--dmg-blue); }

        .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .card-type { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 4px; background: rgba(230, 70, 139, 0.1); color: var(--creative); }
        .card-source { font-size: 8px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; }
        .card-source.notion { background: rgba(33, 160, 216, 0.1); color: var(--dmg-blue); }
        .card-source.quick { background: rgba(230, 70, 139, 0.1); color: var(--creative); }
        .card-source.commercial-hub { background: rgba(67, 176, 73, 0.1); color: var(--production); }
        .card-source.forecast { background: rgba(33, 160, 216, 0.1); color: var(--dmg-blue); }
        .card-effort { font-size: 9px; font-weight: 600; color: var(--ink-light); margin-left: auto; }

        .card-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; margin-bottom: 6px; }
        .card-project { font-size: 10px; color: var(--ink-light); margin-bottom: 10px; }

        .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .card-due { font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: var(--surface); }
        .card-due.overdue { background: rgba(239, 68, 68, 0.1); color: var(--urgent); }
        .card-due.soon { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .card-live { font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .card-client-due { font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: rgba(33, 160, 216, 0.1); color: var(--dmg-blue); }
        .card-feedback { font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: rgba(139, 92, 246, 0.1); color: #7C3AED; }
        .card-designer { font-size: 10px; color: var(--ink-light); margin-left: auto; }

        .empty { text-align: center; padding: 40px 20px; color: var(--ink-light); font-size: 11px; font-weight: 500; }
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; gap: 12px; }
        .loading-text { font-size: 11px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.1em; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <span class="queue-label">Designer Queue</span>
        <div class="stats">
            <div class="stat">
                <div class="stat-dot" style="background: var(--urgent)"></div>
                <span class="stat-value" id="urgentCount">0</span>
                <span class="stat-label">Urgent</span>
            </div>
            <div class="stat">
                <div class="stat-dot" style="background: var(--warning)"></div>
                <span class="stat-value" id="dueTodayCount">0</span>
                <span class="stat-label">Due Today</span>
            </div>
            <div class="stat">
                <div class="stat-dot" style="background: var(--dmg-blue)"></div>
                <span class="stat-value" id="forecastCount">0</span>
                <span class="stat-label">Forecasted</span>
            </div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-view="all" onclick="switchTab('all')">All</div>
        <div class="tab" data-view="active" onclick="switchTab('active')">In Queue</div>
        <div class="tab" data-view="deliverables" onclick="switchTab('deliverables')">Deliverables</div>
        <div class="tab" data-view="quick" onclick="switchTab('quick')">Quick Requests</div>
        <div class="tab" data-view="forecast" onclick="switchTab('forecast')">Forecasted</div>
    </div>

    <div class="columns" id="columns">
        <div class="loading">
            <div class="dots"><span></span><span></span><span></span><span></span></div>
            <span class="loading-text">Loading queue...</span>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
        authDomain: "dmg-command-centre-native.firebaseapp.com",
        projectId: "dmg-command-centre-native",
        storageBucket: "dmg-command-centre-native.firebasestorage.app",
        messagingSenderId: "223535956454",
        appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const APP_ID = "dmg-command-centre-native";
    const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

    const COLUMNS = [
        { key: 'forecast', title: 'Forecasted', color: 'var(--dmg-blue)', filter: i => i.source === 'forecast', isForecast: true },
        { key: 'with-design', title: 'With Design', color: 'var(--success)', filter: i => i.source !== 'forecast' && (i.status === 'With Design' || i.status === 'Not Started') },
        { key: 'in-progress', title: 'In Progress', color: 'var(--warning)', filter: i => i.source !== 'forecast' && i.status === 'In Progress' },
        { key: 'review', title: 'Ready for Review', color: 'var(--production)', filter: i => i.source !== 'forecast' && (i.status === 'Ready for Review' || i.status === 'Done') }
    ];

    let deliverables = [];
    let quickRequests = [];
    let commercialHubItems = [];
    let forecastedProjects = [];
    let staff = {};
    let currentView = 'all';

    function isOverdue(dateStr) {
        if (!dateStr) return false;
        return new Date(dateStr) < new Date();
    }

    function isDueSoon(dateStr) {
        if (!dateStr) return false;
        const due = new Date(dateStr);
        const now = new Date();
        const diff = (due - now) / (1000 * 60 * 60 * 24);
        return diff >= 0 && diff <= 2;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        const now = new Date();
        const diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
        if (diff < 0) return `${Math.abs(diff)}d overdue`;
        if (diff === 0) return 'Today';
        if (diff === 1) return 'Tomorrow';
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function getPriority(item) {
        if (item.source === 'forecast') return 'forecast';
        if (item.priority === 'Urgent' || item.priorityLevel === 'High') return 'high';
        if (item.priority === 'Tomorrow' || item.priorityLevel === 'Medium') return 'medium';
        return 'low';
    }

    function normaliseDeliverable(d) {
        let status = 'With Design';
        const deskState = d.deskState || '';
        const productionStatus = d.productionStatus || d.status || '';

        if (deskState === 'With Design' || productionStatus === 'Not Started' || productionStatus === 'To Be Briefed') {
            status = 'With Design';
        } else if (deskState === 'In Design' || productionStatus === 'In Progress' || productionStatus === 'In Production') {
            status = 'In Progress';
        } else if (deskState === 'Design Complete' || productionStatus === 'Ready for Review' || productionStatus === 'Stakeholder Review' || productionStatus === 'Internal Review') {
            status = 'Ready for Review';
        } else if (productionStatus === 'Assets Approved' || productionStatus === 'Complete' || productionStatus === 'Live') {
            status = 'Ready for Review';
        }

        return {
            id: d.id,
            source: 'notion',
            title: d.title || 'Untitled',
            project: d.projectTitle || d.project || '',
            type: (d.staticAssetsNeeded && d.staticAssetsNeeded[0]) || (d.assetsNeeded && d.assetsNeeded[0]) || 'Graphic',
            effort: d.designEffort || 0,
            dueDate: d.dueDate,
            liveDate: d.liveDate || d.goLiveDate || d.plannedLiveDate || '',
            clientDueDate: d.clientDueDate || d.deliveryDue || d.feedbackDue || '',
            feedbackStatus: d.feedbackStatus || '',
            designer: d.graphicDesigner || d.assignedCreative || 'Unassigned',
            status: status,
            priority: d.priorityLevel || d.priority || 'Standard'
        };
    }

    function normaliseQuickRequest(r) {
        return {
            id: r.id,
            source: 'quick',
            title: r.headline || 'Untitled',
            project: r.seriesName || '',
            type: r.assetType || 'Asset',
            effort: ({ Thumbnail: 0.5, Headline: 0.5, Swipe: 1, Deck: 2, Template: 1.5 }[r.assetType] || 1),
            dueDate: r.deadline,
            liveDate: r.liveDate || r.goLiveDate || '',
            clientDueDate: r.clientDueDate || r.deliveryDue || '',
            designer: staff[r.designerId] || 'Unassigned',
            status: r.status || 'Not Started',
            priority: r.priority || 'Standard'
        };
    }

    function normaliseCommercialHubItem(a) {
        return {
            id: a.id,
            source: 'commercial-hub',
            title: a.assetTitle || 'Untitled',
            project: a.clientName,
            type: 'Thumbnail',
            effort: 0.5,
            dueDate: a.deliveryDue,
            liveDate: a.liveDate || a.plannedLiveDate,
            clientDueDate: a.feedbackDue || a.deliveryDue,
            feedbackStatus: a.feedbackStatus,
            designer: 'Unassigned',
            status: a.thumbnailReady ? 'Done' : (a.status === 'Edit' ? 'In Progress' : 'With Design'),
            priority: a.deliveryDue && new Date(a.deliveryDue) < new Date(Date.now() + 2*24*60*60*1000) ? 'Urgent' : 'Standard'
        };
    }

    function normaliseForecastProject(project) {
        const staticAssets = project.staticAssetCount || 0;
        const estimatedEffort = staticAssets * 2; // ~2 hours per static asset

        return {
            id: project.id,
            source: 'forecast',
            title: project.title || 'Untitled Project',
            project: project.client || '',
            type: 'Design',
            designer: 'Unassigned',
            status: 'Forecasted',
            priority: project.priority || 'Medium',
            dueDate: project.internalDueDate || project.dueDate,
            liveDate: project.liveDate,
            clientDueDate: project.dueDate,
            dealStage: project.dealStage,
            creativeStatus: project.creativeWorkflowStatus,
            staticAssets: staticAssets,
            effort: estimatedEffort,
            url: project.url
        };
    }

    function getAllItems() {
        let items = [];
        const seenIds = new Set();

        // Deliverables (from Notion)
        if (currentView === 'all' || currentView === 'active' || currentView === 'deliverables') {
            deliverables.filter(d =>
                (d.staticAssetsNeeded?.length > 0 || d.staticAssetCount > 0) &&
                d.status !== 'Live' && d.status !== 'Published'
            ).forEach(d => {
                if (!seenIds.has(d.id)) {
                    items.push(normaliseDeliverable(d));
                    seenIds.add(d.id);
                }
            });
        }

        // Quick requests
        if (currentView === 'all' || currentView === 'active' || currentView === 'quick') {
            quickRequests.filter(r => r.status !== 'Done').forEach(r => {
                if (!seenIds.has(r.id)) {
                    items.push(normaliseQuickRequest(r));
                    seenIds.add(r.id);
                }
            });
        }

        // Commercial hub items (thumbnails)
        if (currentView === 'all' || currentView === 'active') {
            commercialHubItems.forEach(a => {
                if (!seenIds.has(a.id)) {
                    items.push(normaliseCommercialHubItem(a));
                    seenIds.add(a.id);
                }
            });
        }

        // Forecasted projects
        if (currentView === 'all' || currentView === 'forecast') {
            forecastedProjects.forEach(p => {
                if (!seenIds.has(p.id)) {
                    items.push(normaliseForecastProject(p));
                    seenIds.add(p.id);
                }
            });
        }

        return items;
    }

    function render() {
        const items = getAllItems();

        const urgent = items.filter(i => getPriority(i) === 'high').length;
        const dueToday = items.filter(i => i.dueDate?.startsWith(new Date().toISOString().split('T')[0])).length;
        const forecast = items.filter(i => i.source === 'forecast').length;

        document.getElementById('urgentCount').textContent = urgent;
        document.getElementById('dueTodayCount').textContent = dueToday;
        document.getElementById('forecastCount').textContent = forecast;

        // Filter columns based on view
        let visibleColumns = COLUMNS;
        if (currentView === 'active' || currentView === 'deliverables' || currentView === 'quick') {
            visibleColumns = COLUMNS.filter(c => !c.isForecast);
        } else if (currentView === 'forecast') {
            visibleColumns = COLUMNS.filter(c => c.isForecast);
        }

        document.getElementById('columns').innerHTML = visibleColumns.map(col => {
            const colItems = items.filter(col.filter);
            colItems.sort((a, b) => {
                // Forecasts sort by due date
                if (col.isForecast) {
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                }
                // Regular items sort by priority then due date
                const pOrder = { high: 0, medium: 1, low: 2, forecast: 3 };
                if (pOrder[getPriority(a)] !== pOrder[getPriority(b)]) return pOrder[getPriority(a)] - pOrder[getPriority(b)];
                if (!a.dueDate) return 1;
                if (!b.dueDate) return -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });

            return `
                <div class="column ${col.isForecast ? 'forecast' : ''}">
                    <div class="column-header">
                        <div class="column-dot" style="background: ${col.color}"></div>
                        <span class="column-title">${col.title}</span>
                        <span class="column-count">${colItems.length}</span>
                    </div>
                    <div class="cards">
                        ${colItems.length === 0 ? '<div class="empty">No items</div>' : colItems.map(item => {
                            const overdue = isOverdue(item.dueDate);
                            const soon = isDueSoon(item.dueDate);
                            const isForecast = item.source === 'forecast';
                            const sourceLabel = { notion: 'DEL', quick: 'QR', 'commercial-hub': 'HUB', forecast: 'FORECAST' }[item.source] || item.source;
                            return `
                                <div class="card" ${item.url ? `onclick="window.open('${item.url}', '_blank')"` : ''}>
                                    <div class="card-priority ${getPriority(item)}"></div>
                                    <div class="card-top">
                                        <span class="card-type">${item.type}</span>
                                        <span class="card-source ${item.source}">${sourceLabel}</span>
                                        ${item.effort ? `<span class="card-effort">${item.effort} ${isForecast ? 'hrs est' : 'pts'}</span>` : ''}
                                    </div>
                                    <div class="card-title">${item.title}</div>
                                    ${item.project ? `<div class="card-project">${item.project}</div>` : ''}
                                    <div class="card-meta">
                                        ${isForecast && item.staticAssets ? `<span class="card-client-due">${item.staticAssets} asset${item.staticAssets > 1 ? 's' : ''}</span>` : ''}
                                        ${item.dueDate ? `<span class="card-due ${overdue ? 'overdue' : (soon ? 'soon' : '')}">${formatDate(item.dueDate)}</span>` : ''}
                                        ${!isForecast && item.clientDueDate ? `<span class="card-client-due">Client: ${formatDate(item.clientDueDate)}</span>` : ''}
                                        ${!isForecast && item.liveDate ? `<span class="card-live">Live: ${formatDate(item.liveDate)}</span>` : ''}
                                        ${item.feedbackStatus ? `<span class="card-feedback">${item.feedbackStatus}</span>` : ''}
                                        <span class="card-designer">${item.designer}</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    window.switchTab = (view) => {
        currentView = view;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-view="${view}"]`).classList.add('active');
        render();
    };

    async function loadDeliverables() {
        try {
            const res = await fetch(`${API_URL}/deliverables`);
            const data = await res.json();
            deliverables = data.deliverables || data.projects || [];
            render();
        } catch (err) { console.error('Failed to load deliverables', err); }
    }

    async function loadForecastedProjects() {
        try {
            const res = await fetch(`${API_URL}/projects`);
            const data = await res.json();
            const projects = data?.projects || [];

            // Filter for won projects that have static deliverables and aren't yet in active design
            forecastedProjects = projects.filter(p => {
                // Must be a won deal
                const dealStage = (p.dealStage || '').toLowerCase();
                const isWon = dealStage.includes('agreed') || dealStage === 'campaign complete';
                if (!isWon) return false;

                // Must have static deliverables (staticAssetCount > 0)
                const hasStatic = (p.staticAssetCount || 0) > 0;

                // Creative workflow should indicate pre-design or early stage
                const creativeStatus = (p.creativeWorkflowStatus || '').toLowerCase();
                const isPreDesign = !creativeStatus || creativeStatus === 'to be briefed' || creativeStatus === 'in progress';

                // Exclude if already have active design requests for this project
                const hasActiveDesign = quickRequests.some(r => r.projectTitle === p.title) ||
                    deliverables.some(d => d.projectTitle === p.title && d.status !== 'Live' && d.status !== 'Published');

                return hasStatic && isPreDesign && !hasActiveDesign;
            });

            render();
        } catch (err) {
            console.error('Failed to load forecasted projects', err);
        }
    }

    async function loadStaff() {
        const snap = await getDocs(collection(db, "artifacts", APP_ID, "public", "data", "staff_directory"));
        snap.docs.forEach(d => { const data = d.data(); staff[d.id] = `${data.firstName} ${data.lastName}`; });
    }

    signInAnonymously(auth).then(async () => {
        await loadStaff();
        await loadDeliverables();
        await loadForecastedProjects();

        // Listen to design requests (quick requests)
        onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "design_requests"), (snap) => {
            quickRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });

        // Listen to asset_metadata for commercial hub assets needing design
        onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "asset_metadata"), (snap) => {
            const assetMeta = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            // Filter for assets that need thumbnails/design
            commercialHubItems = assetMeta.filter(a =>
                !a.thumbnailReady &&
                a.status !== 'Live' &&
                a.status !== 'Approved'
            );
            render();
        });
    });

    // Refresh deliverables and forecasted projects every 60 seconds
    setInterval(loadDeliverables, 60000);
    setInterval(loadForecastedProjects, 60000);
</script>
</body>
</html>
