<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Project Ledger Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    background: transparent;
    display: flex;
    align-items: center;
    min-height: 80px;
    font-family: 'Inter', sans-serif;
    padding: 5px 20px;
}
.header-container {
    display: flex;
    align-items: center;
    gap: 1rem;
}
.title-text {
    font-size: 2.2rem;
    font-weight: 800;
    color: #1C1C1C;
    letter-spacing: -0.05em;
    opacity: 0;
    transform: translateY(10px);
    animation: slideUpFade 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
    text-transform: uppercase;
}
.text-right { animation-delay: 0.2s; }
.dots-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    width: 24px;
    height: 24px;
}
.dot {
    width: 100%;
    height: 100%;
    background-color: #21A0D8;
    border-radius: 50%;
    transform: scale(0);
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
.dot:nth-child(1){animation-delay:0.3s}
.dot:nth-child(2){animation-delay:0.4s}
.dot:nth-child(3){animation-delay:0.4s}
.dot:nth-child(4){animation-delay:0.5s}
@keyframes slideUpFade { to { opacity:1; transform:translateY(0);} }
@keyframes popIn { to { transform:scale(1);} }
</style>
</head>
<body>
<div class="header-container">
<div class="title-text">COMPLETE PROJECT</div>
<div class="dots-grid">
<div class="dot"></div><div class="dot"></div>
<div class="dot"></div><div class="dot"></div>
</div>
<div class="title-text text-right">LEDGER</div>
</div>
</body>
</html>
