<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-social-video: #F2C316;
            --team-operations: #9333EA;
            --team-sales: #F97316;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 16px;
            color: var(--ink);
        }
        .card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            max-width: 340px;
            position: relative;
            overflow: hidden;
        }
        
        /* Dot grid animation */
        .dot-grid-bg {
            position: absolute;
            top: 16px;
            right: 16px;
            display: grid;
            grid-template-columns: repeat(3, 8px);
            gap: 4px;
            opacity: 0.6;
        }
        .dot-grid-bg span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--team-color, var(--dmg-blue));
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot-grid-bg span:nth-child(1) { animation-delay: 0s; }
        .dot-grid-bg span:nth-child(2) { animation-delay: 0.15s; }
        .dot-grid-bg span:nth-child(3) { animation-delay: 0.3s; }
        .dot-grid-bg span:nth-child(4) { animation-delay: 0.1s; }
        .dot-grid-bg span:nth-child(5) { animation-delay: 0.25s; }
        .dot-grid-bg span:nth-child(6) { animation-delay: 0.4s; }
        .dot-grid-bg span:nth-child(7) { animation-delay: 0.2s; }
        .dot-grid-bg span:nth-child(8) { animation-delay: 0.35s; }
        .dot-grid-bg span:nth-child(9) { animation-delay: 0.5s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        /* Avatar */
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }
        .avatar-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--team-color, var(--dmg-blue)) 0%, color-mix(in srgb, var(--team-color, var(--dmg-blue)) 60%, white) 100%);
        }
        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--team-color, var(--dmg-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
            color: #FFF;
            letter-spacing: -1px;
        }
        .presence-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #22C55E;
            border: 4px solid #FFF;
        }
        .presence-dot.away { background: #F59E0B; }
        .presence-dot.offline { background: #9CA3AF; }
        
        /* Info */
        .user-name {
            font-size: 26px;
            font-weight: 900;
            color: var(--ink);
            margin: 0 0 6px;
            letter-spacing: -0.5px;
        }
        .user-role {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-sub);
            margin-bottom: 14px;
        }
        .team-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 99px;
            background: color-mix(in srgb, var(--team-color, var(--dmg-blue)) 12%, white);
            margin-bottom: 16px;
        }
        .team-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--team-color, var(--dmg-blue));
        }
        .team-name {
            font-size: 12px;
            font-weight: 800;
            color: var(--team-color, var(--dmg-blue));
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        /* Manager info */
        .reports-to {
            font-size: 12px;
            color: var(--ink-sub);
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .reports-to strong {
            font-weight: 700;
            color: var(--ink);
        }
        
        /* Demo badge */
        .demo-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: var(--team-creative);
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Social Video': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316'
        };

        const DEMO_USER = {
            firstName: 'Your',
            lastName: 'Name',
            role: 'Your Role Here',
            team: 'Creative',
            manager: 'Manager Name',
            isManager: false,
            isDemo: true
        };

        let currentUser = null;
        let isDemo = true;

        const root = document.getElementById('root');

        function getTeamColor(team) {
            return TEAM_COLORS[team] || '#21a0d8';
        }

        function getInitials(firstName, lastName) {
            return `${(firstName || '?')[0]}${(lastName || '?')[0]}`.toUpperCase();
        }

        function render() {
            const user = currentUser || DEMO_USER;
            const teamColor = getTeamColor(user.team);
            const initials = getInitials(user.firstName, user.lastName);

            root.innerHTML = `
                <div class="card" style="--team-color: ${teamColor}">
                    ${isDemo ? '<span class="demo-badge">Preview</span>' : ''}
                    
                    <div class="dot-grid-bg">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </div>
                    
                    <div class="avatar-container">
                        <div class="avatar-ring">
                            <div class="avatar-inner">${initials}</div>
                        </div>
                        <div class="presence-dot"></div>
                    </div>
                    
                    <h1 class="user-name">${user.firstName} ${user.lastName}</h1>
                    <p class="user-role">${user.role || 'Team Member'}</p>
                    
                    <div class="team-badge">
                        <span class="team-dot"></span>
                        <span class="team-name">${user.team || 'Team'}</span>
                    </div>
                    
                    ${user.manager && !user.isManager ? `
                        <div class="reports-to">
                            Reports to <strong>${user.manager}</strong>
                        </div>
                    ` : ''}
                    
                    ${user.isManager ? `
                        <div class="reports-to">
                            <strong>Team Lead</strong>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function parseStaffData(data) {
            // Normalize staff data from various field names
            const name = data.name || data.Name || 'Unknown User';
            const nameParts = name.split(' ');
            return {
                firstName: nameParts[0] || 'User',
                lastName: nameParts.slice(1).join(' ') || '',
                role: data.role || data.Role || 'Team Member',
                team: data.team || data.Team || 'Team',
                manager: data.manager || data.Manager || data.managerName || '',
                isManager: data.isManager || data.Is_Manager || false
            };
        }

        async function resolveIdentity(authUser) {
            // 1. First check localStorage session (from profile-login widget)
            const STORAGE_KEY = 'dmg_profile_session';
            const REMEMBER_KEY = 'dmg_profile_remember';
            const remembered = localStorage.getItem(REMEMBER_KEY);
            const session = localStorage.getItem(STORAGE_KEY);

            if (remembered && session) {
                try {
                    const sessionData = JSON.parse(session);
                    if (sessionData.staffId) {
                        const docRef = doc(db, "artifacts", appId, "public", "data", "staff_directory", sessionData.staffId);
                        const snap = await getDoc(docRef);
                        if (snap.exists()) {
                            currentUser = { id: snap.id, ...parseStaffData(snap.data()) };
                            isDemo = false;
                            render();
                            return;
                        }
                    }
                } catch (e) { console.log('Session lookup failed:', e); }
            }

            // 2. Then try URL param
            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');

            if (paramId) {
                try {
                    const docRef = doc(db, "artifacts", appId, "public", "data", "staff_directory", paramId);
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        currentUser = { id: snap.id, ...parseStaffData(snap.data()) };
                        isDemo = false;
                        render();
                        return;
                    }
                } catch (e) { console.log('Param lookup failed:', e); }
            }

            // 3. Finally try Firebase auth email (for future SSO)
            if (authUser && authUser.email && !authUser.isAnonymous) {
                try {
                    const q = query(
                        collection(db, "artifacts", appId, "public", "data", "staff_directory"),
                        where("email", "==", authUser.email)
                    );
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        currentUser = { id: snap.docs[0].id, ...parseStaffData(snap.docs[0].data()) };
                        isDemo = false;
                        render();
                        return;
                    }
                } catch (e) { console.log('Email lookup failed:', e); }
            }

            currentUser = DEMO_USER;
            isDemo = true;
            render();
        }

        // Listen for login/logout events from profile-login widget
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'DMG_PROFILE_LOGIN') {
                currentUser = parseStaffData(e.data.staffMember);
                currentUser.id = e.data.staffId;
                isDemo = false;
                render();
            } else if (e.data?.type === 'DMG_PROFILE_LOGOUT') {
                currentUser = DEMO_USER;
                isDemo = true;
                render();
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                resolveIdentity(user);
            } else {
                signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
