<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Unified Header</title>
    <style>
        /* Core Layout */
        body {
            margin: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            background-color: transparent;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100%;
            box-sizing: border-box;
            white-space: nowrap; /* Forces everything to stay on one line */
        }

        /* --- LEFT SECTION: BRANDING --- */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .title-text {
            font-size: 3.5rem; 
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        /* The Purple Dots Grid */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 38px;
            height: 38px;
        }

        .dot {
            width: 100%;
            height: 100%;
            background-color: #9C27B0; /* PURPLE */
            border-radius: 50%;
        }

        /* --- RIGHT SECTION: INFO (Date & Time) --- */
        .info-container {
            display: flex;
            align-items: center;
            gap: 0; 
        }

        /* The Divider Line */
        .divider-line {
            width: 3px;
            height: 40px; /* Height of the divider bar */
            background-color: #9C27B0; /* PURPLE */
            margin: 0 30px; /* Spacing around the line */
            border-radius: 2px;
        }

        /* Date Styling */
        .date-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000000; 
            text-transform: uppercase;
            letter-spacing: -0.02em;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .date-label {
            font-size: 0.6em; 
            color: #9C27B0; 
            font-weight: 800;
            transform: translateY(-2px); 
        }

        /* Longline Clock Styling (Unstacked) */
        .clock-container {
            display: flex;
            flex-direction: row; /* Horizontal alignment */
            align-items: center;
            font-weight: 800;
            color: #000000;
            font-size: 3.5rem; /* Match the main title size */
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .time-separator {
            margin: 0 5px;
            color: #9C27B0; /* Purple colon */
            position: relative;
            top: -2px;
        }

        /* Responsive Scaling */
        @media (max-width: 1200px) {
            .title-text, .clock-container { font-size: 2.5rem; }
            .date-display { font-size: 1.2rem; }
            .divider-line { margin: 0 15px; height: 30px; }
            .dots-grid { width: 28px; height: 28px; gap: 4px; }
        }
        
        /* Stack vertically only on very small screens to prevent breaking */
        @media (max-width: 900px) {
            body { flex-direction: column; align-items: flex-start; gap: 20px; }
            .info-container { width: 100%; justify-content: flex-start; }
            .divider-line:first-child { display: none; } /* Hide first divider on mobile */
        }
    </style>
</head>
<body>

    <!-- LEFT: BRANDING -->
    <div class="brand-container">
        <div class="title-text">MY</div>
        <div class="dots-grid">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="title-text">DASHBOARD</div>
    </div>

    <!-- RIGHT: LIVE INFO -->
    <div class="info-container">
        
        <!-- Divider 1 -->
        <div class="divider-line"></div>

        <!-- Date -->
        <div class="date-display">
            <span class="date-label">TODAY IS</span>
            <span id="dynamic-date">...</span>
        </div>

        <!-- Divider 2 -->
        <div class="divider-line"></div>

        <!-- Longline Clock -->
        <div class="clock-container">
            <span id="clock-hour">--</span>
            <span class="time-separator">:</span>
            <span id="clock-minute">--</span>
        </div>
    </div>

    <script>
        // --- DATE FUNCTION ---
        function getDaySuffix(day) {
            if (day > 3 && day < 21) return 'th';
            switch (day % 10) {
                case 1:  return "st";
                case 2:  return "nd";
                case 3:  return "rd";
                default: return "th";
            }
        }

        function updateDate() {
            const date = new Date();
            const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

            const dayName = days[date.getDay()];
            const dayNumber = date.getDate();
            const monthName = months[date.getMonth()];

            const dateString = `${dayName} ${dayNumber}${getDaySuffix(dayNumber)} ${monthName}`;
            document.getElementById('dynamic-date').textContent = dateString;
        }

        // --- CLOCK FUNCTION ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('clock-hour').textContent = hours;
            document.getElementById('clock-minute').textContent = minutes;
        }

        updateDate();
        updateClock();
        setInterval(updateClock, 1000); 
        setInterval(updateDate, 60000); 
    </script>

</body>
</html>
