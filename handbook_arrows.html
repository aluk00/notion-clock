<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Divider</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
        }

        .arrow-row {
            display: flex;
            gap: 40px;
            animation: fadeIn 1s ease-out;
        }

        .arrow {
            width: 20px;
            height: 20px;
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.3;
            transition: all 0.4s ease;
        }

        .arrow:nth-child(1) { stroke: #21a0d8; opacity: 0.1; animation: bounce 2s infinite 0.1s; }
        .arrow:nth-child(2) { stroke: #21a0d8; opacity: 0.3; animation: bounce 2s infinite 0.2s; }
        .arrow:nth-child(3) { stroke: #21a0d8; opacity: 0.6; animation: bounce 2s infinite 0.3s; }
        .arrow:nth-child(4) { stroke: #21a0d8; opacity: 0.9; animation: bounce 2s infinite 0.4s; }
        .arrow:nth-child(5) { stroke: #21a0d8; opacity: 0.6; animation: bounce 2s infinite 0.5s; }
        .arrow:nth-child(6) { stroke: #21a0d8; opacity: 0.3; animation: bounce 2s infinite 0.6s; }
        .arrow:nth-child(7) { stroke: #21a0d8; opacity: 0.1; animation: bounce 2s infinite 0.7s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="arrow-row">
        <svg class="arrow" viewBox="0 0 24 24"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
    </div>
</body>
</html>
