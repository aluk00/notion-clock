<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Friends | DMG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-editorial: #E94B4B;
            --team-social: #F2C316;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 4px;
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            max-width: 280px;
        }
        .widget-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }
        .header-icon { font-size: 12px; }
        .header-title {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-sub);
        }
        .edit-btn {
            margin-left: auto;
            font-size: 9px;
            color: var(--dmg-blue);
            text-decoration: none;
            font-weight: 700;
        }
        .edit-btn:hover { text-decoration: underline; }
        
        .friends-row {
            display: flex;
            gap: 10px;
        }
        .friend-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .friend-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #FFF;
            border: 2px solid #FFF;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .friend-name {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="widget">
        <div class="widget-header">
            <span class="header-icon">⭐</span>
            <span class="header-title">Top Friends</span>
            <a href="#" class="edit-btn">Edit</a>
        </div>
        <div class="friends-row">
            <div class="friend-item">
                <div class="friend-avatar" style="background: #E6468B">NB</div>
                <span class="friend-name">Nick</span>
            </div>
            <div class="friend-item">
                <div class="friend-avatar" style="background: #F2C316">MY</div>
                <span class="friend-name">Mimi</span>
            </div>
            <div class="friend-item">
                <div class="friend-avatar" style="background: #43B049">HM</div>
                <span class="friend-name">Hugo</span>
            </div>
            <div class="friend-item">
                <div class="friend-avatar" style="background: #E94B4B">KA</div>
                <span class="friend-name">Kaylee</span>
            </div>
        </div>
    </div>
</body>
</html>
