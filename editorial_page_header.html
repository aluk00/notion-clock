<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Page Header | DMG New Media</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --editorial-red: #E94B4B;
            --carbon: #121212;
            --border-grey: #EAECEF;
            --bg-white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        /* --- HEADER LOCKUP --- */
        .header-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 1200px;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .title-text {
            font-size: 4rem;
            font-weight: 800;
            color: var(--carbon);
            letter-spacing: -0.04em;
            line-height: 1;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-transform: uppercase;
        }

        /* Dots: Scaled to match the 4rem font height (~44px grid) */
        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .dot {
            width: 100%; height: 100%;
            background-color: var(--editorial-red);
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        .description {
            font-size: 14px;
            font-weight: 700;
            color: #777;
            margin-top: -5px;
            letter-spacing: 0.02em;
            opacity: 0;
            animation: slideUpFade 0.8s 0.4s forwards;
            text-transform: uppercase;
        }

        /* --- BUTTONS --- */
        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
            opacity: 0;
            animation: slideUpFade 0.8s 0.6s forwards;
        }

        .nav-btn {
            background: var(--bg-white);
            border: 1.5px solid var(--editorial-red);
            border-radius: 12px;
            padding: 12px 20px;
            text-decoration: none;
            color: var(--carbon);
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(233, 75, 75, 0.05);
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(233, 75, 75, 0.15);
            border-color: var(--editorial-red);
            background-color: #FFF;
        }

        .arrow { font-size: 14px; color: var(--editorial-red); font-weight: 400; }

        /* --- ANIMATIONS --- */
        @keyframes slideUpFade { 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes popIn { 
            to { transform: scale(1); } 
        }

        @media (max-width: 768px) {
            .title-text { font-size: 2.5rem; }
            .dots-grid { width: 28px; height: 28px; gap: 4px; }
            .button-row { flex-direction: column; width: 100%; }
            .nav-btn { justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Title & Dots Row -->
        <div class="title-row">
            <div class="title-text" style="animation-delay: 0.1s;">EDITORIAL</div>
            
            <div class="dots-grid">
                <div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <!-- Description -->
        <div class="description">Sourcing, Pitching, and Editorial Approval</div>

        <!-- Utility Buttons -->
        <div class="button-row">
            <a href="https://notion.so/editorial-hub" target="_top" class="nav-btn">
                <span class="arrow">→</span> OPEN EDITORIAL HUB
            </a>
            <a href="https://notion.so/submit-pitch" target="_top" class="nav-btn">
                <span class="arrow">→</span> SUBMIT PITCH
            </a>
            <a href="https://notion.so/cultural-calendar" target="_top" class="nav-btn">
                <span class="arrow">→</span> CULTURAL CALENDAR
            </a>
        </div>
    </div>

</body>
</html>
