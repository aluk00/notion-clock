<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Initials | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --dmg-blue: #21a0d8; --border: #EAECEF; --ink: #1C1C1C; --ink-sub: #757575; --bg-soft: #F9FAFB; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 12px; color: var(--ink); }
        .widget { background: #FFF; border: 1px solid var(--border); border-radius: 16px; max-width: 600px; overflow: hidden; }
        .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; }
        .dot-grid span { width: 5px; height: 5px; border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .title { font-size: 13px; font-weight: 800; }
        .count { font-size: 11px; color: var(--ink-sub); margin-left: auto; }
        .grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 20px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #FFF; cursor: pointer; transition: transform 0.15s; }
        .avatar:hover { transform: scale(1.1); }
        .empty { padding: 40px 20px; text-align: center; }
        .empty-icon { font-size: 32px; margin-bottom: 10px; }
        .empty-title { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
        .empty-sub { font-size: 11px; color: var(--ink-sub); }
        .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--ink-sub); font-size: 12px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--dmg-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"><div class="loading"><div class="spinner"></div>Loading...</div></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });
        const auth = getAuth(app), db = getFirestore(app), appId = "dmg-command-centre-native";
        const COLORS = { Editorial: '#E94B4B', Creative: '#E6468B', Production: '#43B049', Social: '#F2C316', 'Social Video': '#F2C316', Operations: '#9333EA', Sales: '#F97316', Design: '#8B5CF6' };
        
        const params = new URLSearchParams(window.location.search);
        const teamFilter = params.get('team');
        let staff = [], loading = true;
        const root = document.getElementById('root');
        
        const color = t => COLORS[t] || '#21a0d8';
        const initials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();

        function render() {
            if (loading) { root.innerHTML = `<div class="widget"><div class="loading"><div class="spinner"></div>Loading team...</div></div>`; return; }
            const filtered = teamFilter ? staff.filter(s => s.team === teamFilter) : staff;
            const teamColor = teamFilter ? color(teamFilter) : '#21a0d8';
            
            root.innerHTML = `
                <div class="widget">
                    <div class="header">
                        <div class="dot-grid"><span style="background:${teamColor}"></span><span style="background:${teamColor}"></span><span style="background:${teamColor}"></span><span style="background:${teamColor}"></span></div>
                        <h2 class="title">${teamFilter || 'All Teams'}</h2>
                        <span class="count">${filtered.length} members</span>
                    </div>
                    ${filtered.length === 0 ? `
                        <div class="empty">
                            <div class="empty-icon">👥</div>
                            <div class="empty-title">No Team Members</div>
                            <div class="empty-sub">${teamFilter ? `Add staff to the ${teamFilter} team in Firebase.` : 'Add staff to the staff_directory collection.'}</div>
                        </div>
                    ` : `
                        <div class="grid">
                            ${filtered.map(s => `
                                <div class="avatar" style="background:${color(s.team)}" title="${s.firstName} ${s.lastName} - ${s.role || s.team}">
                                    ${initials(s.firstName, s.lastName)}
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        onAuthStateChanged(auth, user => {
            if (user) {
                onSnapshot(collection(db, "artifacts", appId, "public", "data", "staff_directory"), snap => {
                    staff = []; snap.forEach(d => staff.push({ id: d.id, ...d.data() }));
                    loading = false; render();
                }, e => { console.error(e); loading = false; render(); });
            } else {
                signInAnonymously(auth).catch(e => { loading = false; render(); });
            }
        });
    </script>
</body>
</html>
