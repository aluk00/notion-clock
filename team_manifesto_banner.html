<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Team Manifesto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
            
            /* Team Palette */
            --creative: #E6468B;
            --production: #43B049;
            --editorial: #E94B4B;
            --social: #F2C316;
            --operations: #21A0D8;
        }

        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .banner-wrapper {
            width: 100%;
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 40px;
            box-sizing: border-box;
            background: #FFF;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        /* Decorative Grid Background */
        .banner-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.4;
            pointer-events: none;
        }

        .label {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--dmg-blue);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .line {
            height: 1px;
            background: var(--border);
            flex: 1;
        }

        .main-headline {
            font-size: 64px;
            font-weight: 900;
            line-height: 0.95;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: -0.04em;
            position: relative;
            z-index: 2;
        }

        .outlined {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--ink);
            opacity: 0.3;
        }

        .focus-shifter {
            display: inline-block;
            min-width: 400px;
        }

        .sub-manifesto {
            margin-top: 24px;
            font-size: 11px;
            font-weight: 800;
            color: var(--ink); /* Default color is now Black */
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: flex;
            gap: 32px;
            position: relative;
            z-index: 2;
        }

        .dept-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        /* Hover Glow Effects - Team names change to color and glow */
        .dept-tag:hover { transform: translateY(-2px); }
        
        .tag-creative:hover { color: var(--creative); text-shadow: 0 0 15px var(--creative); }
        .tag-editorial:hover { color: var(--editorial); text-shadow: 0 0 15px var(--editorial); }
        .tag-production:hover { color: var(--production); text-shadow: 0 0 15px var(--production); }
        .tag-social:hover { color: var(--social); text-shadow: 0 0 15px var(--social); }
        .tag-operations:hover { color: var(--operations); text-shadow: 0 0 15px var(--operations); }

        /* The Dots - Now permanently colored */
        .dept-tag::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        
        .tag-editorial::before { background: var(--editorial); box-shadow: 0 0 8px var(--editorial); }
        .tag-creative::before { background: var(--creative); box-shadow: 0 0 8px var(--creative); }
        .tag-production::before { background: var(--production); box-shadow: 0 0 8px var(--production); }
        .tag-social::before { background: var(--social); box-shadow: 0 0 8px var(--social); }
        .tag-operations::before { background: var(--operations); box-shadow: 0 0 8px var(--operations); }

        .dept-tag:hover::before {
            transform: scale(1.4);
        }

        /* Animation for the shifting focus */
        @keyframes fadeInOut {
            0%, 15% { opacity: 0; transform: translateY(10px); }
            20%, 45% { opacity: 1; transform: translateY(0); }
            50%, 75% { opacity: 0; transform: translateY(-10px); }
            80%, 100% { opacity: 0; transform: translateY(10px); }
        }

        .focus-text {
            display: inline-block;
            animation: fadeInOut 6s infinite;
            transition: color 0.5s ease;
        }

        @media (max-width: 900px) {
            .main-headline { font-size: 36px; }
            .focus-shifter { min-width: 220px; }
            .sub-manifesto { gap: 16px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="banner-wrapper">
        <div class="label">
            <span>DMG NEW MEDIA</span>
            <div class="line"></div>
        </div>

        <div class="main-headline">
            Defining the Narrative<br>
            <span class="outlined">Across</span> 
            <span class="focus-shifter">
                <span id="focus-target" class="focus-text">Creative</span>
            </span>
        </div>

        <div class="sub-manifesto">
            <div class="dept-tag tag-editorial">Editorial</div>
            <div class="dept-tag tag-creative">Creative</div>
            <div class="dept-tag tag-production">Production</div>
            <div class="dept-tag tag-social">Social</div>
            <div class="dept-tag tag-operations">Operations</div>
        </div>
    </div>

    <script>
        const teams = [
            { name: "Creative", color: "#E6468B" },
            { name: "Editorial", color: "#E94B4B" },
            { name: "Social", color: "#F2C316" },
            { name: "Production", color: "#43B049" },
            { name: "Operations", color: "#21A0D8" }
        ];
        
        let index = 0;
        const target = document.getElementById('focus-target');

        // Initial setup
        target.textContent = teams[0].name;
        target.style.color = teams[0].color;

        setInterval(() => {
            index = (index + 1) % teams.length;
            
            setTimeout(() => {
                target.textContent = teams[index].name;
                target.style.color = teams[index].color;
            }, 3000); 
            
        }, 6000); 
    </script>
</body>
</html>
