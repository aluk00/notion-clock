<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Team Manifesto | Command Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --border: #EAECEF;
            
            /* Team Palette */
            --creative: #E6468B;
            --production: #43B049;
            --editorial: #E94B4B;
            --social: #F2C316;
            --operations: #21A0D8;
        }

        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .banner-wrapper {
            width: 100%;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* REMOVED LEFT PADDING (0px) */
            padding: 20px 50px 20px 0px; 
            box-sizing: border-box;
            background: #FFF;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        /* Decorative Grid Background */
        .banner-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.4;
            pointer-events: none;
        }

        /* LEFT CONTENT */
        .content-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
            flex: 1;
            margin-right: 30px;
        }

        .label {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--dmg-blue);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .line-deco {
            height: 1px;
            background: var(--border);
            width: 80px;
        }

        .main-headline {
            font-size: 86px; 
            font-weight: 900;
            line-height: 0.95;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: -0.04em;
            white-space: nowrap;
        }

        .outlined {
            color: transparent;
            -webkit-text-stroke: 2px var(--ink);
            opacity: 0.2;
        }

        .focus-shifter {
            display: inline-block;
            min-width: 380px;
        }

        .sub-manifesto {
            margin-top: 24px;
            font-size: 11px;
            font-weight: 800;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: flex;
            gap: 32px;
        }

        .dept-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .dept-tag:hover { transform: translateY(-2px); }
        .tag-creative:hover { color: var(--creative); text-shadow: 0 0 15px var(--creative); }
        .tag-editorial:hover { color: var(--editorial); text-shadow: 0 0 15px var(--editorial); }
        .tag-production:hover { color: var(--production); text-shadow: 0 0 15px var(--production); }
        .tag-social:hover { color: var(--social); text-shadow: 0 0 15px var(--social); }
        .tag-operations:hover { color: var(--operations); text-shadow: 0 0 15px var(--operations); }

        .dept-tag::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        
        .tag-editorial::before { background: var(--editorial); box-shadow: 0 0 8px var(--editorial); }
        .tag-creative::before { background: var(--creative); box-shadow: 0 0 8px var(--creative); }
        .tag-production::before { background: var(--production); box-shadow: 0 0 8px var(--production); }
        .tag-social::before { background: var(--social); box-shadow: 0 0 8px var(--social); }
        .tag-operations::before { background: var(--operations); box-shadow: 0 0 8px var(--operations); }

        .dept-tag:hover::before { transform: scale(1.4); }

        /* RIGHT CONTENT (System Clock & Date) */
        .system-block {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 2;
            padding-left: 25px;
            border-left: 1px solid var(--border);
            height: 180px;
        }

        .clock-container {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .hand {
            stroke-linecap: round;
            transform-origin: 50% 50%;
        }

        .hand-hour, .hand-minute {
            stroke: var(--dmg-blue);
            stroke-width: 6;
        }

        .hand-second {
            stroke: #00e1ff;
            stroke-width: 2;
        }

        .center-pin {
            fill: #ffffff;
            stroke: var(--dmg-blue);
            stroke-width: 3;
        }

        .tick {
            stroke: var(--border);
            stroke-width: 2;
            stroke-linecap: round;
        }

        .date-display {
            display: flex;
            flex-direction: column;
            text-align: left;
            min-width: 100px;
        }

        .date-weekday {
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--dmg-blue);
        }

        .date-main {
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            color: var(--ink);
            margin: 4px 0;
        }

        .date-month {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-sub);
        }

        @keyframes fadeInOut {
            0%, 15% { opacity: 0; transform: translateY(15px); }
            20%, 45% { opacity: 1; transform: translateY(0); }
            50%, 75% { opacity: 0; transform: translateY(-15px); }
            80%, 100% { opacity: 0; transform: translateY(15px); }
        }

        .focus-text {
            display: inline-block;
            animation: fadeInOut 6s infinite;
            transition: color 0.5s ease;
        }

        @media (max-width: 1150px) {
            .main-headline { font-size: 60px; }
            .focus-shifter { min-width: 280px; }
            .system-block { height: 140px; gap: 15px; padding-left: 20px; }
            .clock-container { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>

    <div class="banner-wrapper">
        <div class="content-left">
            <div class="label">
                <div class="line-deco"></div>
            </div>

            <div class="main-headline">
                Defining the Narrative<br>
                <span class="outlined">Across</span> 
                <span class="focus-shifter">
                    <span id="focus-target" class="focus-text">Creative</span>
                </span>
            </div>

            <div class="sub-manifesto">
                <div class="dept-tag tag-editorial">Editorial</div>
                <div class="dept-tag tag-creative">Creative</div>
                <div class="dept-tag tag-production">Production</div>
                <div class="dept-tag tag-social">Social</div>
                <div class="dept-tag tag-operations">Operations</div>
            </div>
        </div>

        <div class="system-block">
            <div class="clock-container">
                <svg viewBox="0 0 200 200">
                    <g id="ticks"></g>
                    <line id="hour-hand" class="hand hand-hour" x1="100" y1="100" x2="100" y2="55" />
                    <line id="minute-hand" class="hand hand-minute" x1="100" y1="100" x2="100" y2="30" />
                    <line id="second-hand" class="hand hand-second" x1="100" y1="110" x2="100" y2="25" />
                    <circle class="center-pin" cx="100" cy="100" r="4" />
                </svg>
            </div>
            <div class="date-display">
                <div id="date-weekday" class="date-weekday">DAY</div>
                <div id="date-main" class="date-main">00</div>
                <div id="date-month" class="date-month">MONTH</div>
            </div>
        </div>
    </div>

    <script>
        // TEAM FOCUS SHIFTER
        const teams = [
            { name: "Creative", color: "#E6468B" },
            { name: "Editorial", color: "#E94B4B" },
            { name: "Social", color: "#F2C316" },
            { name: "Production", color: "#43B049" },
            { name: "Operations", color: "#21A0D8" }
        ];
        
        let index = 0;
        const target = document.getElementById('focus-target');
        target.textContent = teams[0].name;
        target.style.color = teams[0].color;

        setInterval(() => {
            index = (index + 1) % teams.length;
            setTimeout(() => {
                target.textContent = teams[index].name;
                target.style.color = teams[index].color;
            }, 3000); 
        }, 6000); 

        // ANALOG CLOCK
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const ticksGroup = document.getElementById('ticks');

        function generateTicks() {
            const radius = 90;
            const center = 100;
            for (let i = 0; i < 60; i++) {
                const angle = (i * 6) * (Math.PI / 180);
                const isMajor = i % 5 === 0;
                const length = isMajor ? 10 : 5;
                const innerRadius = radius - length;
                const x1 = center + radius * Math.sin(angle);
                const y1 = center - radius * Math.cos(angle);
                const x2 = center + innerRadius * Math.sin(angle);
                const y2 = center - innerRadius * Math.cos(angle);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x1); line.setAttribute("y1", y1);
                line.setAttribute("x2", x2); line.setAttribute("y2", y2);
                line.setAttribute("class", "tick");
                if(isMajor) line.style.strokeWidth = "3px";
                ticksGroup.appendChild(line);
            }
        }

        function updateClock() {
            const now = new Date();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();
            const milliseconds = now.getMilliseconds();

            const secDeg = ((seconds / 60) * 360) + ((milliseconds / 1000) * 6);
            const minDeg = ((minutes / 60) * 360) + ((seconds / 60) * 6);
            const hrDeg = ((hours % 12) / 12 * 360) + ((minutes / 60) * 30);

            secondHand.style.transform = `rotate(${secDeg}deg)`;
            minuteHand.style.transform = `rotate(${minDeg}deg)`;
            hourHand.style.transform = `rotate(${hrDeg}deg)`;
            
            // Update Date
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            document.getElementById('date-weekday').textContent = days[now.getDay()];
            document.getElementById('date-main').textContent = now.getDate().toString().padStart(2, '0');
            document.getElementById('date-month').textContent = months[now.getMonth()] + ' ' + now.getFullYear();

            requestAnimationFrame(updateClock);
        }

        generateTicks();
        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
