<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Profile | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-pink: #E6468B;
            --dmg-blue: #21a0d8;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --bg-soft: #F9FAFB;
            --success: #10B981;
            --error: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FDF2F8 0%, #F0F9FF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--ink);
        }

        .setup-card {
            background: #FFF;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            padding: 32px 32px 24px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--dmg-pink) 0%, #F472B6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            color: var(--ink-sub);
            line-height: 1.5;
        }

        /* Progress Steps */
        .progress {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            background: var(--bg-soft);
        }
        .progress-step {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .progress-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--ink-sub);
            transition: all 0.3s ease;
        }
        .progress-dot.active {
            background: var(--dmg-pink);
            color: #FFF;
            transform: scale(1.1);
        }
        .progress-dot.done {
            background: var(--success);
            color: #FFF;
        }
        .progress-line {
            width: 32px;
            height: 3px;
            background: var(--border);
            border-radius: 2px;
        }
        .progress-line.done { background: var(--success); }

        .body {
            padding: 32px;
        }

        /* Form Elements */
        .form-group { margin-bottom: 20px; }
        .label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .input:focus {
            outline: none;
            border-color: var(--dmg-pink);
            box-shadow: 0 0 0 4px rgba(230, 70, 139, 0.1);
        }
        .input::placeholder { color: #C4C4C4; }
        .input.error { border-color: var(--error); }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--dmg-pink);
            color: #FFF;
        }
        .btn-primary:hover:not(:disabled) {
            background: #D63D7C;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 70, 139, 0.3);
        }
        .btn-primary:disabled {
            background: #E0E0E0;
            color: #999;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--bg-soft);
            color: var(--ink);
            border: 2px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--ink-sub);
        }

        .error-msg {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: var(--error);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        /* Profile Preview */
        .profile-preview {
            background: var(--bg-soft);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
        }
        .preview-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--dmg-pink);
            color: #FFF;
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .preview-name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .preview-role {
            font-size: 14px;
            color: var(--ink-sub);
            margin-bottom: 12px;
        }
        .preview-team {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .preview-details {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--ink-sub);
        }
        .preview-details strong { color: var(--ink); }

        .not-you {
            text-align: center;
            margin-top: 12px;
        }
        .not-you a {
            color: var(--dmg-pink);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        /* PIN Display */
        .pin-display {
            background: linear-gradient(135deg, #FDF2F8 0%, #FCE7F3 100%);
            border: 3px dashed var(--dmg-pink);
            border-radius: 16px;
            padding: 28px;
            text-align: center;
            margin-bottom: 24px;
        }
        .pin-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }
        .pin-digits {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 16px;
            color: var(--dmg-pink);
            font-family: 'Inter', monospace;
        }
        .pin-hint {
            margin-top: 16px;
            font-size: 13px;
            color: var(--ink-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Success State */
        .success-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--success) 0%, #34D399 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        .success-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }
        .success-subtitle {
            font-size: 14px;
            color: var(--ink-sub);
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .checklist {
            background: var(--bg-soft);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            font-size: 13px;
        }
        .checklist-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--success);
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #FFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Already Set Up */
        .already-setup {
            text-align: center;
            padding: 20px 0;
        }
        .already-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--dmg-pink);
            color: #FFF;
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
    </style>
</head>
<body>
    <div class="setup-card" id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const STORAGE_KEY = 'dmg_profile_session';
        const REMEMBER_KEY = 'dmg_profile_remember';

        const TEAM_COLORS = {
            'Creative': { bg: '#FDF2F8', color: '#E6468B' },
            'Production': { bg: '#F3E8FF', color: '#8B5CF6' },
            'Editorial': { bg: '#FEF3C7', color: '#D97706' },
            'Operations': { bg: '#D1FAE5', color: '#059669' },
            'Sales': { bg: '#DBEAFE', color: '#2563EB' },
            'Social': { bg: '#FCE7F3', color: '#DB2777' },
            'default': { bg: '#F3F4F6', color: '#6B7280' }
        };

        let state = {
            step: 'loading', // loading, email, confirm, pin, done, already-setup
            email: '',
            staffMember: null,
            pin: null,
            error: null,
            loading: false
        };

        const appEl = document.getElementById('app');

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        function getTeamStyle(team) {
            return TEAM_COLORS[team] || TEAM_COLORS.default;
        }

        function generatePIN() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        async function checkExistingSetup() {
            const remembered = localStorage.getItem(REMEMBER_KEY);
            const session = localStorage.getItem(STORAGE_KEY);

            if (remembered && session) {
                try {
                    const sessionData = JSON.parse(session);
                    if (sessionData.staffId) {
                        const snap = await getDoc(doc(db, "artifacts", appId, "public", "data", "staff_directory", sessionData.staffId));
                        if (snap.exists()) {
                            state.staffMember = { id: snap.id, ...snap.data() };
                            state.step = 'already-setup';
                            render();
                            return;
                        }
                    }
                } catch (e) {}
            }

            state.step = 'email';
            render();
        }

        async function findStaffByEmail(email) {
            const staffRef = collection(db, "artifacts", appId, "public", "data", "staff_directory");
            const snapshot = await getDocs(staffRef);

            for (const docSnap of snapshot.docs) {
                const data = docSnap.data();
                if (data.email?.toLowerCase() === email.toLowerCase() ||
                    data.Email?.toLowerCase() === email.toLowerCase() ||
                    data.workEmail?.toLowerCase() === email.toLowerCase()) {
                    return { id: docSnap.id, ...data };
                }
            }
            return null;
        }

        async function handleEmailSubmit() {
            const input = document.getElementById('email-input');
            const email = input?.value?.trim()?.toLowerCase();

            if (!email || !email.includes('@')) {
                state.error = 'Please enter a valid email address';
                render();
                return;
            }

            state.loading = true;
            state.error = null;
            state.email = email;
            render();

            try {
                const staff = await findStaffByEmail(email);

                if (!staff) {
                    state.error = "We couldn't find you in the staff directory. Please check your email or contact your manager.";
                    state.loading = false;
                    render();
                    return;
                }

                state.staffMember = staff;
                state.step = 'confirm';
                state.loading = false;
                render();

            } catch (e) {
                state.error = 'Something went wrong. Please try again.';
                state.loading = false;
                render();
            }
        }

        async function handleConfirm() {
            state.loading = true;
            render();

            try {
                // Check if PIN already exists
                const pinDoc = await getDoc(doc(db, "artifacts", appId, "public", "data", "profile_pins", state.staffMember.id));

                let pin;
                if (pinDoc.exists()) {
                    pin = pinDoc.data().pin;
                } else {
                    pin = generatePIN();
                    await setDoc(doc(db, "artifacts", appId, "public", "data", "profile_pins", state.staffMember.id), {
                        pin: pin,
                        email: state.email,
                        createdAt: new Date().toISOString(),
                        staffName: state.staffMember.name || state.staffMember.Name || 'Unknown'
                    });
                }

                state.pin = pin;
                state.step = 'pin';
                state.loading = false;
                render();

            } catch (e) {
                state.error = 'Failed to create profile. Please try again.';
                state.loading = false;
                render();
            }
        }

        function handlePINSaved() {
            // Save session
            const sessionData = {
                staffId: state.staffMember.id,
                email: state.email,
                loginAt: new Date().toISOString()
            };

            localStorage.setItem(STORAGE_KEY, JSON.stringify(sessionData));
            localStorage.setItem(REMEMBER_KEY, 'true');

            // Notify other widgets
            window.postMessage({
                type: 'DMG_PROFILE_LOGIN',
                staffId: state.staffMember.id,
                staffMember: state.staffMember
            }, '*');

            state.step = 'done';
            render();
        }

        function handleStartOver() {
            state = {
                step: 'email',
                email: '',
                staffMember: null,
                pin: null,
                error: null,
                loading: false
            };
            render();
        }

        function handleLogout() {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(REMEMBER_KEY);
            window.postMessage({ type: 'DMG_PROFILE_LOGOUT' }, '*');
            state = {
                step: 'email',
                email: '',
                staffMember: null,
                pin: null,
                error: null,
                loading: false
            };
            render();
        }

        function render() {
            const staff = state.staffMember;
            const name = staff?.name || staff?.Name || 'User';
            const firstName = name.split(' ')[0];
            const role = staff?.role || staff?.Role || 'Team Member';
            const team = staff?.team || staff?.Team || 'Team';
            const manager = staff?.manager || staff?.Manager || staff?.managerName || '';
            const teamStyle = getTeamStyle(team);

            let html = '';

            switch (state.step) {
                case 'loading':
                    html = `
                        <div class="header">
                            <div class="logo">👋</div>
                            <h1>Setting up...</h1>
                        </div>
                        <div class="body" style="text-align: center; padding: 48px;">
                            <div class="loading-spinner" style="border-color: var(--border); border-top-color: var(--dmg-pink); margin: 0 auto;"></div>
                        </div>
                    `;
                    break;

                case 'email':
                    html = `
                        <div class="header">
                            <div class="logo">👋</div>
                            <h1>Welcome!</h1>
                            <p>Let's set up your personal profile. This only takes a minute.</p>
                        </div>

                        <div class="progress">
                            <div class="progress-step">
                                <div class="progress-dot active">1</div>
                            </div>
                            <div class="progress-line"></div>
                            <div class="progress-step">
                                <div class="progress-dot">2</div>
                            </div>
                            <div class="progress-line"></div>
                            <div class="progress-step">
                                <div class="progress-dot">3</div>
                            </div>
                        </div>

                        <div class="body">
                            ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}

                            <div class="form-group">
                                <label class="label">Your work email</label>
                                <input type="email"
                                       id="email-input"
                                       class="input ${state.error ? 'error' : ''}"
                                       placeholder="you@dmgmedia.co.uk"
                                       value="${state.email}"
                                       ${state.loading ? 'disabled' : ''}
                                       onkeydown="if(event.key==='Enter') window.handleEmailSubmit()">
                            </div>

                            <button class="btn btn-primary" onclick="window.handleEmailSubmit()" ${state.loading ? 'disabled' : ''}>
                                ${state.loading ? '<div class="loading-spinner"></div>' : 'Find Me'}
                            </button>
                        </div>
                    `;
                    break;

                case 'confirm':
                    html = `
                        <div class="header">
                            <div class="logo">🎉</div>
                            <h1>Found you!</h1>
                            <p>Please confirm this is your profile.</p>
                        </div>

                        <div class="progress">
                            <div class="progress-step">
                                <div class="progress-dot done">✓</div>
                            </div>
                            <div class="progress-line done"></div>
                            <div class="progress-step">
                                <div class="progress-dot active">2</div>
                            </div>
                            <div class="progress-line"></div>
                            <div class="progress-step">
                                <div class="progress-dot">3</div>
                            </div>
                        </div>

                        <div class="body">
                            <div class="profile-preview">
                                <div class="preview-avatar" style="background: ${teamStyle.color};">
                                    ${getInitials(name)}
                                </div>
                                <div class="preview-name">${name}</div>
                                <div class="preview-role">${role}</div>
                                <span class="preview-team" style="background: ${teamStyle.bg}; color: ${teamStyle.color};">
                                    ${team}
                                </span>
                                ${manager ? `
                                    <div class="preview-details">
                                        Reports to <strong>${manager}</strong>
                                    </div>
                                ` : ''}
                            </div>

                            <button class="btn btn-primary" onclick="window.handleConfirm()" ${state.loading ? 'disabled' : ''}>
                                ${state.loading ? '<div class="loading-spinner"></div>' : "Yes, that's me!"}
                            </button>

                            <div class="not-you">
                                <a href="#" onclick="window.handleStartOver(); return false;">Not you? Try a different email</a>
                            </div>
                        </div>
                    `;
                    break;

                case 'pin':
                    html = `
                        <div class="header">
                            <div class="logo">🔐</div>
                            <h1>Your PIN</h1>
                            <p>Save this PIN - you'll use it to sign in.</p>
                        </div>

                        <div class="progress">
                            <div class="progress-step">
                                <div class="progress-dot done">✓</div>
                            </div>
                            <div class="progress-line done"></div>
                            <div class="progress-step">
                                <div class="progress-dot done">✓</div>
                            </div>
                            <div class="progress-line done"></div>
                            <div class="progress-step">
                                <div class="progress-dot active">3</div>
                            </div>
                        </div>

                        <div class="body">
                            <div class="pin-display">
                                <div class="pin-label">Your 4-digit PIN</div>
                                <div class="pin-digits">${state.pin}</div>
                                <div class="pin-hint">
                                    📸 Screenshot this or write it down
                                </div>
                            </div>

                            <button class="btn btn-primary" onclick="window.handlePINSaved()">
                                I've saved my PIN
                            </button>
                        </div>
                    `;
                    break;

                case 'done':
                    html = `
                        <div class="body" style="padding: 48px 32px;">
                            <div class="success-icon">✓</div>
                            <div class="success-title">You're all set, ${firstName}!</div>
                            <div class="success-subtitle">
                                Your profile is ready. All the widgets on your profile page will now show your personal data.
                            </div>

                            <div class="checklist">
                                <div class="checklist-item">
                                    <span class="checklist-icon">✓</span>
                                    <span>Profile created</span>
                                </div>
                                <div class="checklist-item">
                                    <span class="checklist-icon">✓</span>
                                    <span>PIN saved</span>
                                </div>
                                <div class="checklist-item">
                                    <span class="checklist-icon">✓</span>
                                    <span>Signed in on this device</span>
                                </div>
                            </div>

                            <button class="btn btn-primary" onclick="window.close(); window.location.reload();">
                                Done
                            </button>
                        </div>
                    `;
                    break;

                case 'already-setup':
                    html = `
                        <div class="header">
                            <div class="logo">👋</div>
                            <h1>Welcome back!</h1>
                            <p>You're already signed in.</p>
                        </div>

                        <div class="body">
                            <div class="already-setup">
                                <div class="already-avatar" style="background: ${teamStyle.color};">
                                    ${getInitials(name)}
                                </div>
                                <div class="preview-name">${name}</div>
                                <div class="preview-role" style="margin-bottom: 0;">${role}</div>
                            </div>

                            <button class="btn btn-secondary" onclick="window.handleLogout()" style="margin-top: 24px;">
                                Sign out & start over
                            </button>
                        </div>
                    `;
                    break;
            }

            appEl.innerHTML = html;

            // Focus email input
            if (state.step === 'email') {
                setTimeout(() => document.getElementById('email-input')?.focus(), 50);
            }
        }

        // Expose functions
        window.handleEmailSubmit = handleEmailSubmit;
        window.handleConfirm = handleConfirm;
        window.handlePINSaved = handlePINSaved;
        window.handleStartOver = handleStartOver;
        window.handleLogout = handleLogout;

        // Initialize
        signInAnonymously(auth).then(() => checkExistingSetup());
    </script>
</body>
</html>
