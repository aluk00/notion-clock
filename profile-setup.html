<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Profile | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-pink: #E6468B;
            --dmg-blue: #21a0d8;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
            --success: #10B981;
            --error: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            padding: 12px;
            color: var(--ink);
        }

        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 380px;
            overflow: hidden;
        }

        .header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 5px);
            gap: 2px;
        }
        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--dmg-pink);
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.1s; }
        .dot:nth-child(4) { animation-delay: 0.25s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .title {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex: 1;
        }
        .step-badge {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-sub);
            background: var(--bg-soft);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .body { padding: 20px 18px; }

        /* Progress Steps */
        .progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s ease;
        }
        .progress-dot.active {
            background: var(--dmg-pink);
            transform: scale(1.2);
        }
        .progress-dot.done { background: var(--success); }
        .progress-line {
            width: 24px;
            height: 2px;
            background: var(--border);
            border-radius: 1px;
        }
        .progress-line.done { background: var(--success); }

        /* Welcome Section */
        .welcome {
            text-align: center;
            margin-bottom: 24px;
        }
        .welcome-emoji {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .welcome-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .welcome-subtitle {
            font-size: 13px;
            color: var(--ink-sub);
            line-height: 1.5;
        }

        /* Form Elements */
        .form-group { margin-bottom: 16px; }
        .label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ink-sub);
            margin-bottom: 8px;
        }
        .input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .input:focus {
            outline: none;
            border-color: var(--dmg-pink);
        }
        .input::placeholder { color: #C4C4C4; }
        .input.error { border-color: var(--error); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--dmg-pink);
            color: #FFF;
        }
        .btn-primary:hover:not(:disabled) {
            background: #D63D7C;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background: #E5E5E5;
            color: #999;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: var(--bg-soft);
            color: var(--ink-sub);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: #F0F0F0;
        }

        .error-msg {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: var(--error);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
        }

        .help-text {
            text-align: center;
            margin-top: 16px;
            font-size: 11px;
            color: var(--ink-sub);
        }
        .help-text a {
            color: var(--dmg-pink);
            text-decoration: none;
            font-weight: 600;
        }

        /* Profile Preview Card */
        .profile-preview {
            background: var(--bg-soft);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .preview-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--dmg-pink);
            color: #FFF;
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        .preview-name {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .preview-role {
            font-size: 12px;
            color: var(--ink-sub);
            margin-bottom: 10px;
        }
        .preview-team {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .preview-manager {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--ink-sub);
        }
        .preview-manager strong { color: var(--ink); }

        /* PIN Display */
        .pin-display {
            background: var(--bg-soft);
            border: 2px dashed var(--dmg-pink);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .pin-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }
        .pin-digits {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 14px;
            color: var(--dmg-pink);
        }
        .pin-hint {
            margin-top: 14px;
            font-size: 11px;
            color: var(--ink-sub);
        }

        /* Success State */
        .success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: #FFF;
        }

        .checklist {
            background: var(--bg-soft);
            border-radius: 10px;
            padding: 14px 16px;
            margin: 20px 0;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            font-size: 12px;
            color: var(--ink);
        }
        .checklist-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--success);
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #FFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="widget" id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const STORAGE_KEY = 'dmg_profile_session';
        const REMEMBER_KEY = 'dmg_profile_remember';

        const TEAM_COLORS = {
            'Creative': { bg: '#FDF2F8', color: '#E6468B' },
            'Production': { bg: '#F3E8FF', color: '#8B5CF6' },
            'Editorial': { bg: '#FEF3C7', color: '#D97706' },
            'Operations': { bg: '#D1FAE5', color: '#059669' },
            'Sales': { bg: '#DBEAFE', color: '#2563EB' },
            'Social': { bg: '#FCE7F3', color: '#DB2777' },
            'default': { bg: '#F3F4F6', color: '#6B7280' }
        };

        let state = {
            step: 'loading', // loading, email, confirm, pin, done, already-setup
            email: '',
            staffMember: null,
            pin: null,
            error: null,
            loading: false
        };

        const appEl = document.getElementById('app');

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        function getTeamStyle(team) {
            return TEAM_COLORS[team] || TEAM_COLORS.default;
        }

        function generatePIN() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function getStepLabel(step) {
            switch(step) {
                case 'email': return 'Step 1 of 3';
                case 'confirm': return 'Step 2 of 3';
                case 'pin': return 'Step 3 of 3';
                default: return '';
            }
        }

        async function checkExistingSetup() {
            const remembered = localStorage.getItem(REMEMBER_KEY);
            const session = localStorage.getItem(STORAGE_KEY);

            if (remembered && session) {
                try {
                    const sessionData = JSON.parse(session);
                    if (sessionData.staffId) {
                        const snap = await getDoc(doc(db, "artifacts", appId, "public", "data", "staff_directory", sessionData.staffId));
                        if (snap.exists()) {
                            state.staffMember = { id: snap.id, ...snap.data() };
                            state.step = 'already-setup';
                            render();
                            return;
                        }
                    }
                } catch (e) {}
            }

            state.step = 'email';
            render();
        }

        async function findStaffByEmail(email) {
            const staffRef = collection(db, "artifacts", appId, "public", "data", "staff_directory");
            const snapshot = await getDocs(staffRef);

            for (const docSnap of snapshot.docs) {
                const data = docSnap.data();
                if (data.email?.toLowerCase() === email.toLowerCase() ||
                    data.Email?.toLowerCase() === email.toLowerCase() ||
                    data.workEmail?.toLowerCase() === email.toLowerCase()) {
                    return { id: docSnap.id, ...data };
                }
            }
            return null;
        }

        async function handleEmailSubmit() {
            const input = document.getElementById('email-input');
            const email = input?.value?.trim()?.toLowerCase();

            if (!email || !email.includes('@')) {
                state.error = 'Please enter a valid email address';
                render();
                return;
            }

            state.loading = true;
            state.error = null;
            state.email = email;
            render();

            try {
                const staff = await findStaffByEmail(email);

                if (!staff) {
                    state.error = "We couldn't find that email. Please check and try again.";
                    state.loading = false;
                    render();
                    return;
                }

                state.staffMember = staff;
                state.step = 'confirm';
                state.loading = false;
                render();

            } catch (e) {
                state.error = 'Something went wrong. Please try again.';
                state.loading = false;
                render();
            }
        }

        async function handleConfirm() {
            state.loading = true;
            render();

            try {
                // Check if PIN already exists
                const pinDoc = await getDoc(doc(db, "artifacts", appId, "public", "data", "profile_pins", state.staffMember.id));

                let pin;
                if (pinDoc.exists()) {
                    pin = pinDoc.data().pin;
                } else {
                    pin = generatePIN();
                    await setDoc(doc(db, "artifacts", appId, "public", "data", "profile_pins", state.staffMember.id), {
                        pin: pin,
                        email: state.email,
                        createdAt: new Date().toISOString(),
                        staffName: state.staffMember.name || state.staffMember.Name || 'Unknown'
                    });
                }

                state.pin = pin;
                state.step = 'pin';
                state.loading = false;
                render();

            } catch (e) {
                state.error = 'Failed to create profile. Please try again.';
                state.loading = false;
                state.step = 'confirm';
                render();
            }
        }

        function handlePINSaved() {
            // Save session to localStorage
            const sessionData = {
                staffId: state.staffMember.id,
                email: state.email,
                loginAt: new Date().toISOString()
            };

            localStorage.setItem(STORAGE_KEY, JSON.stringify(sessionData));
            localStorage.setItem(REMEMBER_KEY, 'true');

            // Broadcast login event to other widgets
            window.postMessage({
                type: 'DMG_PROFILE_LOGIN',
                staffId: state.staffMember.id,
                staffMember: state.staffMember
            }, '*');

            state.step = 'done';
            render();
        }

        function handleStartOver() {
            state = {
                step: 'email',
                email: '',
                staffMember: null,
                pin: null,
                error: null,
                loading: false
            };
            render();
        }

        function handleSignOut() {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(REMEMBER_KEY);
            window.postMessage({ type: 'DMG_PROFILE_LOGOUT' }, '*');
            handleStartOver();
        }

        function render() {
            const staff = state.staffMember;
            const name = staff?.name || staff?.Name || 'User';
            const firstName = name.split(' ')[0];
            const role = staff?.role || staff?.Role || 'Team Member';
            const team = staff?.team || staff?.Team || 'Team';
            const manager = staff?.manager || staff?.Manager || staff?.managerName || '';
            const teamStyle = getTeamStyle(team);
            const stepLabel = getStepLabel(state.step);

            let html = '';

            switch (state.step) {
                case 'loading':
                    html = `
                        <div class="header">
                            <div class="dot-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                            <h2 class="title">Profile Setup</h2>
                        </div>
                        <div class="body" style="text-align: center; padding: 40px;">
                            <div class="spinner" style="border-color: var(--border); border-top-color: var(--dmg-pink); margin: 0 auto;"></div>
                        </div>
                    `;
                    break;

                case 'email':
                    html = `
                        <div class="header">
                            <div class="dot-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                            <h2 class="title">Profile Setup</h2>
                            <span class="step-badge">${stepLabel}</span>
                        </div>
                        <div class="body">
                            <div class="progress">
                                <div class="progress-dot active"></div>
                                <div class="progress-line"></div>
                                <div class="progress-dot"></div>
                                <div class="progress-line"></div>
                                <div class="progress-dot"></div>
                            </div>

                            <div class="welcome">
                                <div class="welcome-emoji">👋</div>
                                <div class="welcome-title">Welcome!</div>
                                <div class="welcome-subtitle">Enter your work email to set up your personal profile.</div>
                            </div>

                            ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}

                            <div class="form-group">
                                <label class="label">Work email</label>
                                <input type="email"
                                       id="email-input"
                                       class="input ${state.error ? 'error' : ''}"
                                       placeholder="you@dmgmedia.co.uk"
                                       value="${state.email}"
                                       ${state.loading ? 'disabled' : ''}
                                       onkeydown="if(event.key==='Enter') window.handleEmailSubmit()">
                            </div>

                            <button class="btn btn-primary" onclick="window.handleEmailSubmit()" ${state.loading ? 'disabled' : ''}>
                                ${state.loading ? '<div class="spinner"></div>' : 'Find Me'}
                            </button>
                        </div>
                    `;
                    break;

                case 'confirm':
                    html = `
                        <div class="header">
                            <div class="dot-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                            <h2 class="title">Profile Setup</h2>
                            <span class="step-badge">${stepLabel}</span>
                        </div>
                        <div class="body">
                            <div class="progress">
                                <div class="progress-dot done"></div>
                                <div class="progress-line done"></div>
                                <div class="progress-dot active"></div>
                                <div class="progress-line"></div>
                                <div class="progress-dot"></div>
                            </div>

                            <div class="welcome">
                                <div class="welcome-emoji">🎉</div>
                                <div class="welcome-title">Found you!</div>
                                <div class="welcome-subtitle">Please confirm this is you.</div>
                            </div>

                            <div class="profile-preview">
                                <div class="preview-avatar" style="background: ${teamStyle.color};">
                                    ${getInitials(name)}
                                </div>
                                <div class="preview-name">${name}</div>
                                <div class="preview-role">${role}</div>
                                <span class="preview-team" style="background: ${teamStyle.bg}; color: ${teamStyle.color};">
                                    ${team}
                                </span>
                                ${manager ? `<div class="preview-manager">Reports to <strong>${manager}</strong></div>` : ''}
                            </div>

                            <button class="btn btn-primary" onclick="window.handleConfirm()" ${state.loading ? 'disabled' : ''}>
                                ${state.loading ? '<div class="spinner"></div>' : "Yes, that's me"}
                            </button>

                            <p class="help-text">
                                <a href="#" onclick="window.handleStartOver(); return false;">Not you? Try again</a>
                            </p>
                        </div>
                    `;
                    break;

                case 'pin':
                    html = `
                        <div class="header">
                            <div class="dot-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                            <h2 class="title">Profile Setup</h2>
                            <span class="step-badge">${stepLabel}</span>
                        </div>
                        <div class="body">
                            <div class="progress">
                                <div class="progress-dot done"></div>
                                <div class="progress-line done"></div>
                                <div class="progress-dot done"></div>
                                <div class="progress-line done"></div>
                                <div class="progress-dot active"></div>
                            </div>

                            <div class="welcome">
                                <div class="welcome-emoji">🔐</div>
                                <div class="welcome-title">Your PIN</div>
                                <div class="welcome-subtitle">Save this PIN - you'll need it to sign in.</div>
                            </div>

                            <div class="pin-display">
                                <div class="pin-label">Your 4-digit PIN</div>
                                <div class="pin-digits">${state.pin}</div>
                                <div class="pin-hint">📸 Screenshot or write it down</div>
                            </div>

                            <button class="btn btn-primary" onclick="window.handlePINSaved()">
                                I've saved my PIN
                            </button>
                        </div>
                    `;
                    break;

                case 'done':
                    html = `
                        <div class="header">
                            <div class="dot-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                            <h2 class="title">Profile Setup</h2>
                            <span class="step-badge">Complete</span>
                        </div>
                        <div class="body">
                            <div class="welcome">
                                <div class="success-icon">✓</div>
                                <div class="welcome-title">You're all set!</div>
                                <div class="welcome-subtitle">Your profile is ready, ${firstName}.</div>
                            </div>

                            <div class="checklist">
                                <div class="checklist-item">
                                    <span class="checklist-icon">✓</span>
                                    <span>Profile linked to your account</span>
                                </div>
                                <div class="checklist-item">
                                    <span class="checklist-icon">✓</span>
                                    <span>PIN saved for sign in</span>
                                </div>
                                <div class="checklist-item">
                                    <span class="checklist-icon">✓</span>
                                    <span>Logged in on this device</span>
                                </div>
                            </div>

                            <button class="btn btn-primary" onclick="window.close()">
                                Done
                            </button>
                        </div>
                    `;
                    break;

                case 'already-setup':
                    html = `
                        <div class="header">
                            <div class="dot-grid"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                            <h2 class="title">Profile Setup</h2>
                        </div>
                        <div class="body">
                            <div class="welcome">
                                <div class="welcome-emoji">👋</div>
                                <div class="welcome-title">Welcome back!</div>
                                <div class="welcome-subtitle">You're already signed in.</div>
                            </div>

                            <div class="profile-preview">
                                <div class="preview-avatar" style="background: ${teamStyle.color};">
                                    ${getInitials(name)}
                                </div>
                                <div class="preview-name">${name}</div>
                                <div class="preview-role">${role}</div>
                            </div>

                            <button class="btn btn-secondary" onclick="window.handleSignOut()">
                                Sign out
                            </button>
                        </div>
                    `;
                    break;
            }

            appEl.innerHTML = html;

            // Focus email input on email step
            if (state.step === 'email') {
                setTimeout(() => document.getElementById('email-input')?.focus(), 50);
            }
        }

        // Expose functions to window
        window.handleEmailSubmit = handleEmailSubmit;
        window.handleConfirm = handleConfirm;
        window.handlePINSaved = handlePINSaved;
        window.handleStartOver = handleStartOver;
        window.handleSignOut = handleSignOut;

        // Initialize
        signInAnonymously(auth).then(() => checkExistingSetup());
    </script>
</body>
</html>
