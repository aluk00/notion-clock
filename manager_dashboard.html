<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard | DMG New Media</title>
    <!-- Core Engine CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --st-pending: #FF9800;
            --st-submitted: #43B049;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #FFFFFF;
            margin: 0;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        /* PIN Pad Symmetry */
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-items: center;
        }

        .n-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #F8F9FA;
            border: 1px solid #EAEAEA;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .n-btn:active, .n-btn.key-active {
            background: #FFF;
            border-color: var(--dmg-blue);
            color: var(--dmg-blue);
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(33, 160, 216, 0.2);
        }

        /* Dot Language Components */
        .dot-grid-mini {
            display: grid;
            grid-template-columns: repeat(2, 4px);
            gap: 3px;
        }
        .dot-grid-mini span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #EEE; border-radius: 10px; }

        /* Animation */
        .fade-up { animation: fadeInUp 0.5s ease-out forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Firebase Initialisation
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dmg-command-system';

        const App = () => {
            const [user, setUser] = useState(null);
            const [isLocked, setIsLocked] = useState(true);
            const [pin, setPin] = useState("");
            const [activeTab, setActiveTab] = useState('outlook');
            const [staff, setStaff] = useState([]);
            const [requests, setRequests] = useState([]);
            const [allTasks, setAllTasks] = useState([]);
            const [selectedStaff, setSelectedStaff] = useState(null);
            const [newTask, setNewTask] = useState("");

            // Keyboard Detection for PIN
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (!isLocked) return;
                    if (e.key >= '0' && e.key <= '9') handlePress(e.key);
                    if (e.key === 'Backspace' || e.key === 'Escape') setPin("");
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isLocked, pin]);

            // Authentication Guard (RULE 3)
            useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await auth.signInWithCustomToken(__initial_auth_token).catch(() => auth.signInAnonymously());
                    } else {
                        await auth.signInAnonymously();
                    }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, []);

            // Data Listeners - Guarded by User (RULE 3)
            useEffect(() => {
                if (!user) return;
                
                // Base Path for all queries
                const basePath = db.collection('artifacts').doc(appId).collection('public').doc('data');

                // Listen to Directory
                const unsubStaff = basePath.collection('staff_directory')
                    .onSnapshot(snap => {
                        const list = [];
                        snap.forEach(doc => list.push({ id: doc.id, ...doc.data(), fullName: `${doc.data().firstName || ''} ${doc.data().lastName || ''}` }));
                        setStaff(list);
                    }, (err) => console.error("Staff Listener Error:", err));

                // Listen to Requests
                const unsubReqs = basePath.collection('rota_requests')
                    .onSnapshot(snap => {
                        const list = [];
                        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                        setRequests(list);
                    }, (err) => console.error("Requests Listener Error:", err));

                // Listen to Tasks (RULE 2: Fetch all and filter in JS)
                const unsubTasks = basePath.collection('manager_tasks')
                    .onSnapshot(snap => {
                        const list = [];
                        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                        setAllTasks(list);
                    }, (err) => console.error("Tasks Listener Error:", err));

                return () => {
                    unsubStaff();
                    unsubReqs();
                    unsubTasks();
                };
            }, [user]);

            const currentStaffTasks = useMemo(() => {
                if (!selectedStaff) return [];
                return allTasks.filter(t => t.staffId === selectedStaff.id);
            }, [allTasks, selectedStaff]);

            const handlePress = (val) => {
                if (pin.length < 4) {
                    const newPin = pin + val;
                    setPin(newPin);
                    if (newPin === "2025") {
                        setTimeout(() => setIsLocked(false), 200);
                    }
                }
            };

            const addTask = async () => {
                if (!newTask.trim() || !selectedStaff) return;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('manager_tasks').add({
                    staffId: selectedStaff.id,
                    content: newTask,
                    status: 'pending',
                    timestamp: Date.now()
                });
                setNewTask("");
            };

            const toggleTask = async (taskId, currentStatus) => {
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('manager_tasks').doc(taskId).update({
                    status: currentStatus === 'done' ? 'pending' : 'done'
                });
            };

            if (isLocked) {
                return (
                    <div className="fixed inset-0 bg-white z-[1000] flex flex-col items-center justify-center p-6">
                        <div className="max-w-sm w-full text-center">
                            <div className="flex justify-center gap-2 mb-10">
                                {[1,2,3,4].map(i => <div key={i} className={`w-3 h-3 rounded-full transition-all duration-300 ${pin.length >= i ? 'bg-[#21a0d8] scale-125 shadow-lg shadow-blue-200' : 'bg-gray-100'}`} />)}
                            </div>
                            <h1 className="text-3xl font-black uppercase tracking-tighter mb-2">Manager Access</h1>
                            <p className="text-gray-400 font-bold text-[10px] tracking-[0.3em] uppercase mb-12">New Media Command Centre</p>
                            
                            <div className="numpad-grid mb-10">
                                {[1,2,3,4,5,6,7,8,9].map(n => (
                                    <button key={n} onClick={() => handlePress(n.toString())} className="n-btn">{n}</button>
                                ))}
                                <div />
                                <button onClick={() => handlePress("0")} className="n-btn">0</button>
                                <button onClick={() => setPin("")} className="text-[10px] font-black text-gray-300 uppercase tracking-widest hover:text-red-500 transition-colors">Clear</button>
                            </div>
                            <p className="text-[9px] font-bold text-gray-300 uppercase tracking-widest opacity-50">Keyboard input enabled</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-white">
                    {/* MASTER HEADER */}
                    <header className="px-12 py-10 border-b border-gray-100 flex items-center justify-between">
                        <div className="flex items-center gap-6 leading-none">
                            <h1 className="text-5xl font-black tracking-tighter uppercase">Manager</h1>
                            <div className="grid grid-cols-2 gap-1.5 rotate-45">
                                {[1,2,3,4].map(i => <div key={i} className="w-2.5 h-2.5 rounded-full bg-[#21a0d8]" />)}
                            </div>
                            <h1 className="text-5xl font-black tracking-tighter uppercase">Dashboard</h1>
                        </div>
                        <nav className="flex gap-2 p-1.5 bg-gray-50 rounded-full border border-gray-100">
                            {['outlook', 'teams', 'approvals'].map(tab => (
                                <button 
                                    key={tab} 
                                    onClick={() => setActiveTab(tab)}
                                    className={`px-8 py-3 rounded-full text-[10px] font-black uppercase tracking-widest transition-all ${activeTab === tab ? 'bg-white text-[#21a0d8] shadow-sm' : 'text-gray-400 hover:text-gray-600'}`}
                                >
                                    {tab}
                                </button>
                            ))}
                        </nav>
                    </header>

                    <main className="flex-1 p-12 max-w-7xl mx-auto w-full">
                        {/* VIEW: OUTLOOK */}
                        {activeTab === 'outlook' && (
                            <div className="fade-up space-y-12">
                                <div className="flex items-center gap-4">
                                    <span className="text-[11px] font-black uppercase tracking-[0.3em] text-gray-400">Staff Overview</span>
                                    <div className="flex-1 h-px bg-gray-50" />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {staff.length > 0 ? staff.map(p => {
                                        const req = requests.find(r => r.staffName === p.fullName);
                                        const status = req ? req.status : 'none';
                                        return (
                                            <button 
                                                key={p.id} 
                                                onClick={() => setSelectedStaff(p)}
                                                className="group flex items-center justify-between p-8 bg-white border border-gray-100 rounded-[2rem] hover:border-[#21a0d8] transition-all hover:shadow-2xl text-left"
                                            >
                                                <div className="flex flex-col">
                                                    <span className="font-black text-xl tracking-tight uppercase group-hover:text-[#21a0d8] transition-colors">{p.fullName}</span>
                                                    <span className="text-[9px] font-bold text-gray-300 uppercase tracking-widest mt-1">{p.role}</span>
                                                </div>
                                                <div className={`px-4 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest ${status === 'pending' ? 'bg-[#FF9800] text-white shadow-lg shadow-orange-100' : (status === 'approved' || status === 'submitted') ? 'bg-[#43B049] text-white shadow-lg shadow-green-100' : 'bg-gray-50 text-gray-300'}`}>
                                                    {status === 'pending' ? 'Pending' : (status === 'approved' || status === 'submitted') ? 'Submitted' : 'No Data'}
                                                </div>
                                            </button>
                                        );
                                    }) : (
                                        <div className="col-span-full py-20 text-center">
                                            <div className="flex gap-2 justify-center mb-4">
                                                {[1,2,3].map(i => <div key={i} className="w-2 h-2 rounded-full bg-gray-100 animate-pulse" style={{animationDelay: `${i*0.2}s`}} />)}
                                            </div>
                                            <span className="text-[10px] font-black uppercase text-gray-300 tracking-widest">Awaiting cloud synchronisation</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'teams' && <div className="text-gray-300 font-black uppercase tracking-widest text-center py-20">Teams Filtration Engine active</div>}
                        {activeTab === 'approvals' && <div className="text-gray-300 font-black uppercase tracking-widest text-center py-20">Decision Queue Ready</div>}
                    </main>

                    {/* STAFF MODAL (Tasks + To-Do) */}
                    {selectedStaff && (
                        <div className="fixed inset-0 z-[500] flex items-center justify-center p-6 bg-black/30 backdrop-blur-sm animate-in fade-in duration-300" onClick={() => setSelectedStaff(null)}>
                            <div className="bg-white w-full max-w-2xl rounded-[3rem] p-12 relative shadow-2xl flex flex-col max-h-[85vh] overflow-hidden" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedStaff(null)} className="absolute top-8 right-8 text-gray-300 hover:text-red-500 transition-colors"><X size={32} /></button>
                                
                                <div className="flex flex-col gap-6 mb-12 border-b border-gray-100 pb-10">
                                    <div className="flex items-center gap-4 text-[10px] font-black text-gray-400 tracking-[0.4em] uppercase">
                                        <span>Staff Identity</span>
                                        <div className="flex gap-1">
                                            {[1,2,3,4].map(i => <div key={i} className="w-2 h-2 rounded-full bg-[#21a0d8]" />)}
                                        </div>
                                    </div>
                                    <div className="flex items-end gap-6 leading-none">
                                        <h3 className="text-5xl font-black uppercase tracking-tighter">{selectedStaff.firstName}</h3>
                                        <h3 className="text-5xl font-black uppercase tracking-tighter text-gray-200">{selectedStaff.lastName}</h3>
                                    </div>
                                    <p className="text-xs font-bold text-[#21a0d8] uppercase tracking-[0.2em]">{selectedStaff.role} • {selectedStaff.team} stream</p>
                                </div>

                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-4 space-y-12">
                                    {/* TASKS + TO-DO SECTION */}
                                    <section>
                                        <div className="flex items-center gap-4 mb-8">
                                            <div className="dot-grid-mini"><span></span><span></span><span></span><span></span></div>
                                            <span className="text-[11px] font-black uppercase tracking-[0.2em] text-[#1C1C1C]">Tasks + To-do</span>
                                            <div className="flex-1 h-px bg-gray-50" />
                                        </div>
                                        
                                        <div className="flex gap-4 mb-8">
                                            <input 
                                                type="text" 
                                                value={newTask}
                                                onChange={e => setNewTask(e.target.value)}
                                                placeholder="Enter a task or reminder..." 
                                                className="flex-1 p-5 bg-gray-50 border-2 border-transparent focus:border-[#21a0d8] focus:bg-white rounded-2xl text-sm font-bold transition-all outline-none"
                                            />
                                            <button onClick={addTask} className="px-8 bg-[#1C1C1C] text-white rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-[#333]">Add</button>
                                        </div>

                                        <div className="space-y-3">
                                            {currentStaffTasks.length > 0 ? currentStaffTasks.sort((a,b) => b.timestamp - a.timestamp).map(t => (
                                                <div key={t.id} className="flex items-center justify-between p-6 bg-white border border-gray-100 rounded-3xl group hover:border-[#21a0d8] transition-all">
                                                    <div className="flex items-center gap-5">
                                                        <button 
                                                            onClick={() => toggleTask(t.id, t.status)}
                                                            className={`w-6 h-6 rounded-full border-2 transition-all flex items-center justify-center ${t.status === 'done' ? 'bg-[#43B049] border-[#43B049]' : 'border-gray-200 group-hover:border-[#21a0d8]'}`}
                                                        >
                                                            {t.status === 'done' && <Check size={14} className="text-white" />}
                                                        </button>
                                                        <span className={`text-sm font-bold uppercase tracking-tight transition-all ${t.status === 'done' ? 'text-gray-300 line-through' : 'text-[#1C1C1C]'}`}>{t.content}</span>
                                                    </div>
                                                    <span className="text-[8px] font-black text-gray-200 group-hover:text-gray-400 transition-colors">#{t.id.substring(0,4).toUpperCase()}</span>
                                                </div>
                                            )) : (
                                                <p className="text-center py-10 text-gray-200 text-[10px] font-black uppercase tracking-[0.4em]">No active tasks assigned</p>
                                            )}
                                        </div>
                                    </section>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Lucide Icons Wrapper
        const X = (props) => <svg {...props} width={props.size || 24} height={props.size || 24} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const Check = (props) => <svg {...props} width={props.size || 24} height={props.size || 24} fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
