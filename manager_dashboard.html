<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Management Hub | Live Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Team Colours */
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-people: #21a0d8;
            --team-operations: #21a0d8;
            --team-executive: #1C1C1C;

            /* Status Colors */
            --st-office: #2E7D32;
            --st-wfh: #F9A825;
            --st-shoot: #2196F3;
            --st-pto: #F44336;
            --st-clienttravel: #6A1B9A;
            --st-weekend: #9E9E9E;
            --st-pending: #BDBDBD;

            /* UI Tokens */
            --carbon: #1C1C1C;
            --bg-page: #FFFFFF;
            --bg-base: #FFFFFF;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.1);
            --shadow-glow-blue: 0 0 15px rgba(33, 160, 216, 0.5);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            margin: 0; padding: 0; color: var(--ink); min-height: 100vh;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        /* --- IMPACT ANIMATIONS --- */
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        @keyframes dotCycle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* --- AUTH SCREEN --- */
        #lock-screen {
            position: fixed; inset: 0; background: var(--bg-base); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .header-dots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 44px; height: 44px; }
        .header-dots .dot { width: 100%; height: 100%; background-color: var(--team-people); border-radius: 50%; }
        #lock-screen .header-dots .dot { animation: dotCycle 3s infinite ease-in-out; }
        #lock-screen .header-dots .dot:nth-child(1) { animation-delay: 0s; }
        #lock-screen .header-dots .dot:nth-child(2) { animation-delay: 0.75s; }
        #lock-screen .header-dots .dot:nth-child(4) { animation-delay: 1.5s; }
        #lock-screen .header-dots .dot:nth-child(3) { animation-delay: 2.25s; }

        .pin-field { display: flex; gap: 12px; margin-bottom: 40px; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: 0.2s; }
        .pin-dot.filled { background: var(--team-people); border-color: var(--team-people); transform: scale(1.2); }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 280px; }
        .n-btn { aspect-ratio: 1.3; border-radius: var(--radius-md); background: var(--bg-page); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; cursor: pointer; color: var(--carbon); transition: all 0.2s ease; box-shadow: 0 0 8px rgba(0,0,0,0.05); }
        .n-btn:hover { box-shadow: 0 0 15px rgba(33, 160, 216, 0.3); border-color: var(--team-people); }
        .n-btn:active { background: #E0E0E0; transform: scale(0.95); }
        .n-btn-special { background-color: var(--team-people); color: #FFF; font-weight: 800; }

        /* --- LAYOUT --- */
        .main-container { max-width: 1360px; margin: 0 auto; padding: 40px; }
        .header-lockup { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 30px; }
        .title-text { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.04em; text-transform: uppercase; line-height: 1; color: var(--carbon); opacity: 0; transform: translateY(10px); animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
        .tab-nav { display: flex; gap: 8px; padding: 6px; background: #F8F9FA; border-radius: 99px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .tab-trigger { border: none; background: none; padding: 10px 24px; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; border-radius: 99px; color: var(--ink-sub); transition: 0.2s; letter-spacing: 0.05em; }
        .tab-trigger.active { background: var(--team-people); color: #FFF; box-shadow: 0 4px 12px rgba(33, 160, 216, 0.3); }

        .week-picker { display: flex; align-items: center; gap: 20px; background: var(--team-people); color: #FFF; padding: 12px 24px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); transition: opacity 0.3s; }
        .week-picker.hidden { opacity: 0; pointer-events: none; }
        .week-btn { background: rgba(255,255,255,0.1); border: none; color: #FFF; font-weight: 900; cursor: pointer; padding: 8px; font-size: 16px; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .week-label { font-size: 12px; font-weight: 800; text-transform: uppercase; min-width: 140px; text-align: center; letter-spacing: 0.1em; }

        /* --- DIRECTORY TABLE --- */
        .directory-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; background: var(--bg-base); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-md); table-layout: fixed; }
        .directory-table th { text-align: left; padding: 20px; font-size: 10px; font-weight: 900; color: var(--team-people); text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--border); background: #FDFDFD; width: 25%; }
        .directory-table th.status-header { text-align: center; }
        .directory-table td { padding: 16px 20px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--border); color: var(--carbon); vertical-align: middle; width: 25%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: transparent; }
        .directory-table tbody tr:hover td { background-color: #f7f7f7; }
        
        .name-cell { display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.2s; color: var(--carbon); font-weight: 700; background: transparent !important; }
        .name-cell:hover { color: var(--team-people); }
        .name-dots { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; flex-shrink: 0; }
        .name-dots span { width: 6px; height: 6px; border-radius: 50%; }

        .status-cell { text-align: center; }
        .status-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; }
        .status-icon svg { width: 20px; height: 20px; }

        .is-mgr-pill { font-size: 9px; background: var(--team-people); color: #FFF; padding: 4px 10px; border-radius: 99px; vertical-align: middle; margin-left: 10px; font-weight: 900; letter-spacing: 0.05em; line-height: 1; display: inline-block; }

        /* --- MODAL & PROFILE --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(28,28,28,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 6000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-base); width: 100%; max-width: 700px; border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 24px; font-weight: 800; color: #ccc; cursor: pointer; width: 40px; height: 40px; background: var(--bg-page); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        
        .p-section-title { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--team-people); margin: 35px 0 15px 0; }
        .p-grid-large { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 44px; height: 44px; flex-shrink: 0; }
        .p-grid-large span { width: 100%; height: 100%; border-radius: 50%; }

        .p-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 25px; }
        .p-meta-card { padding: 20px; background: var(--bg-page); border-radius: var(--radius-md); border: 1.5px solid var(--border); }
        .p-meta-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #999; margin-bottom: 6px; display: block; letter-spacing: 0.05em; }
        .p-meta-val { font-size: 16px; font-weight: 900; }
        .p-meta-val.tier-val { color: #999; }

        .presence-table { width: 100%; border-collapse: collapse; margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow:hidden; }
        .presence-table th { background: var(--bg-page); padding: 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--team-people); border: 1px solid var(--border); }
        .presence-table td { padding: 12px; text-align: center; border: 1px solid var(--border); font-size: 11px; font-weight: 800; }
        .presence-table tr.prior-week { opacity: 0.4; background-color: #f5f5f5; pointer-events: none; }
        .presence-table tr.prior-week td { color: #BBB; }

        .note-item { background: var(--bg-page); border: 1.5px solid var(--border); padding: 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; line-height: 1.5; color: var(--carbon); margin-bottom: 10px; border-left: 5px solid; position: relative; }
        .note-meta { position: absolute; top: 16px; right: 16px; font-size: 10px; color: var(--ink-sub); font-weight: 700; }

        .pill-btn { border: none; padding: 6px 14px; border-radius: 99px; font-size: 10px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; margin-top: 4px; display: inline-block; letter-spacing: 0.05em; }
        .pill-suggest { background: var(--team-people); color: #FFF; }
        .pill-update { background: #E0E0E0; color: #333; }

        .btn-post { background-color: var(--team-people); color: #FFF; border: none; padding: 12px 24px; border-radius: 12px; font-size: 11px; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: var(--shadow-glow-blue); transition: 0.2s; }
        .btn-post:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(33, 160, 216, 0.7); }

        /* --- DASHBOARD ELEMENTS --- */
        .view-section { display: none; }
        .view-section.active { display: block; opacity: 0; transform: translateY(10px); animation: slideUpFade 0.5s 0.2s forwards; }

        .approvals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .manager-card { background: var(--bg-base); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; position: relative; transition: var(--transition); cursor: pointer; box-shadow: var(--shadow-sm); padding-left: 36px; }
        .manager-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 8px; border-radius: var(--radius-md) 0 0 var(--radius-md); transition: width var(--transition); background-color: var(--accent-color, var(--carbon)); }

        .outlook-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .outlook-card { background: var(--bg-base); padding: 24px; border-radius: var(--radius-lg); text-align: center; border: 1.5px solid transparent; transition: 0.3s; cursor: pointer; box-shadow: var(--shadow-md); }
        .outlook-card.locked { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; pointer-events:none; }
        .hero-count { font-size: 48px; font-weight: 900; display: block; line-height: 1; color: var(--team-people); }
        .hero-label { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); letter-spacing: 0.05em; margin-top: 8px; display: block; }
        
        .day-scroller { display: flex; gap: 10px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 10px; justify-content: center; }
        .day-pill { padding: 12px 24px; border: 1.5px solid var(--border); background: var(--bg-base); border-radius: 99px; cursor: pointer; transition: 0.2s; text-align: center; font-weight: 700; font-size: 14px; white-space: nowrap; }
        .day-pill.active { background: var(--team-people); color: #FFF; border-color: var(--team-people); font-weight: 800; box-shadow: 0 4px 12px rgba(33, 160, 216, 0.3); }
        
        .stream-header { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 15px; }
        .status-cell-grid { font-weight: 900; text-align: center; }

        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--carbon); color: #FFF; padding: 14px 32px; border-radius: 99px; font-size: 13px; font-weight: 800; opacity: 0; pointer-events: none; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 9000; box-shadow: var(--shadow-lg); }
        #toast.active { opacity: 1; bottom: 40px; }
    </style>
</head>
<body>

    <div id="toast">Update Successful</div>

    <!-- LOCK SCREEN -->
    <div id="lock-screen">
        <div class="header-lockup" style="flex-direction:column; margin-bottom:40px;">
            <div class="header-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="title-text" style="font-size: 3.75rem; color: var(--carbon); margin-top: 20px; opacity: 1; transform: none; line-height: 0.9; text-align: center;">Management<br>Hub</div>
        </div>
        <div class="pin-field">
            <div class="pin-dot" id="p1"></div><div class="pin-dot" id="p2"></div><div class="pin-dot" id="p3"></div><div class="pin-dot" id="p4"></div>
        </div>
        <div class="numpad">
            <div class="n-btn" onclick="press(1)">1</div><div class="n-btn" onclick="press(2)">2</div><div class="n-btn" onclick="press(3)">3</div>
            <div class="n-btn" onclick="press(4)">4</div><div class="n-btn" onclick="press(5)">5</div><div class="n-btn" onclick="press(6)">6</div>
            <div class="n-btn" onclick="press(7)">7</div><div class="n-btn" onclick="press(8)">8</div><div class="n-btn" onclick="press(9)">9</div>
            <div class="n-btn n-btn-special" onclick="clearPin()">CLR</div>
            <div class="n-btn" onclick="press(0)">0</div>
        </div>
    </div>

    <div id="app-shell" class="hidden">
        <div class="main-container">
            <header>
                <div class="header-lockup">
                    <div class="title-text">Management</div>
                    <div class="header-dots">
                        <div class="dot"></div><div class="dot"></div>
                        <div class="dot"></div><div class="dot"></div>
                    </div>
                    <div class="title-text">Hub</div>
                </div>
                <div class="nav-row">
                    <nav class="tab-nav">
                        <button class="tab-trigger active" onclick="switchView('outlook', this)">Directory</button>
                        <button class="tab-trigger" onclick="switchView('teams', this)">Teams</button>
                        <button class="tab-trigger" onclick="switchView('approvals', this)">Approvals</button>
                    </nav>
                    <div class="week-picker" id="week-picker-control">
                        <button class="week-btn" onclick="changeWeek(-1)">←</button>
                        <span class="week-label" id="wc-label">WC ...</span>
                        <button class="week-btn" onclick="changeWeek(1)">→</button>
                    </div>
                </div>
            </header>

            <section id="view-outlook" class="view-section active">
                <div class="outlook-hero">
                    <div class="outlook-card" id="card-Office" onclick="showStatusList('Office')"><span class="hero-count" id="count-office">0</span><span class="hero-label">In Building</span></div>
                    <div class="outlook-card" id="card-WFH" onclick="showStatusList('WFH')"><span class="hero-count" id="count-wfh">0</span><span class="hero-label">Remote</span></div>
                    <div class="outlook-card" id="card-Shoot" onclick="showStatusList('Shoot')"><span class="hero-count" id="count-shoot">0</span><span class="hero-label">On Shoot</span></div>
                    <div class="outlook-card" id="card-OffSite" onclick="showStatusList('OffSite')"><span class="hero-count" id="count-offsite">0</span><span class="hero-label">Off Site</span></div>
                    <div class="outlook-card" id="card-Leave" onclick="showStatusList('Leave')"><span class="hero-count" id="count-leave">0</span><span class="hero-label">Leave</span></div>
                </div>
                <div class="day-scroller" id="day-mount"></div>
                <table class="directory-table">
                    <thead><tr><th>Staff Name</th><th>Role</th><th>Stream</th><th class="status-header">Status</th></tr></thead>
                    <tbody id="directory-mount"></tbody>
                </table>
            </section>

            <section id="view-teams" class="view-section"><div id="teams-grid-mount"></div></section>
            <section id="view-approvals" class="view-section"><div class="approvals-grid" id="approvals-mount"></div></section>
        </div>
    </div>

    <!-- GLOBAL MODAL -->
    <div class="modal-overlay" id="global-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="close-btn" onclick="closeModal()">×</div>
            <div id="modal-mount"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-system.firebaseapp.com",
            projectId: "dmg-command-system",
            storageBucket: "dmg-command-system.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'dmg-command-system';

        let staff = [];
        let submissions = [];
        let responses = [];
        let notes = [];
        let currentUser = null;

        const teamColors = { Editorial: '#E94B4B', Creative: '#E6468B', Production: '#43B049', Social: '#F2C316', Operations: '#21a0d8', Executive: '#1C1C1C' };
        const statusColors = { Office: '#2E7D32', WFH: '#F9A825', Shoot: '#2196F3', PTO: '#F44336', 'Client / Travel': '#6A1B9A', Leave: '#F44336', Weekend: '#9E9E9E', Pending: '#BDBDBD' };
        
        const statusIcons = {
            Office: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 16H9v-2h2v2zm0-4H9v-2h2v2zm0-4H9V9h2v2zm0-4H9V5h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2z"/></svg>`,
            WFH: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"/></svg>`,
            Shoot: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 20v-2h14v2H5zm0-3v-2h2.08l.92-3H6v-2h3.33l.92-3H8V5h8v2h-2.25l-.92 3H16v2h-2.25l-.92 3H15v2H5z"/></svg>`,
            'Client / Travel': `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>`,
            PTO: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>`,
            Leave: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>`,
            Weekend: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>`,
            Pending: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>`
        };

        function getStatusIcon(status) {
            const key = status.replace(/ /g, '');
            const iconSvg = statusIcons[status] || statusIcons['Pending'];
            const color = statusColors[key] || statusColors.Pending;
            return `<div class="status-icon" title="${status}" style="background-color: ${color}20; color: ${color};">${iconSvg}</div>`;
        }

        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }
        
        let currentMonday = getMonday(new Date());
        let selectedDayIdx = (new Date().getDay() >= 1 && new Date().getDay() <= 5) ? new Date().getDay() - 1 : 0;

        let pin = "";
        window.press = (n) => {
            if (pin.length >= 4) return;
            pin += n;
            document.getElementById('p'+pin.length).classList.add('filled');
            if(pin.length === 4) {
                setTimeout(async () => {
                    if(pin === "2025") {
                        document.getElementById('lock-screen').style.opacity = '0';
                        setTimeout(() => { document.getElementById('lock-screen').classList.add('hidden'); document.getElementById('app-shell').classList.remove('hidden'); }, 500);
                        await startSystem();
                    } else { window.clearPin(); }
                }, 200);
            }
        };
        window.clearPin = () => { pin = ""; document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled')); };

        async function startSystem() {
            const authResult = await signInAnonymously(auth);
            currentUser = authResult.user;
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'staff_directory'), (snap) => { staff = []; snap.forEach(d => staff.push({id: d.id, ...d.data()})); updateUI(); });
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'rota_submissions'), (snap) => { submissions = []; snap.forEach(d => submissions.push(d.data())); updateUI(); });
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'rota_responses'), (snap) => { responses = []; snap.forEach(d => responses.push({id: d.id, ...d.data()})); updateUI(); });
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'staff_notes'), (snap) => { notes = []; snap.forEach(d => notes.push({id: d.id, ...d.data()})); updateUI(); });
        }

        function updateUI() {
            if (!currentUser || staff.length === 0) return;
            document.getElementById('wc-label').innerText = `WC ${currentMonday.toLocaleDateString('en-GB', {day:'numeric', month:'short'})}`;
            renderDayScroller();
            renderOutlook();
            renderTeamsGrid();
            renderApprovals();
        }

        window.changeWeek = (offset) => { currentMonday.setDate(currentMonday.getDate() + (offset * 7)); updateUI(); };
        window.selectDay = (idx) => { selectedDayIdx = idx; updateUI(); };

        function renderDayScroller() {
            const mount = document.getElementById('day-mount');
            mount.innerHTML = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'].map((d, i) => {
                const date = new Date(currentMonday.getTime()); date.setDate(date.getDate() + i);
                return `<div class="day-pill ${selectedDayIdx === i ? 'active' : ''}" onclick="selectDay(${i})">${d.substring(0,3)} ${date.getDate()} ${date.toLocaleDateString('en-GB', {month:'short'})}</div>`;
            }).join('');
        }

        function renderOutlook() {
            const mount = document.getElementById('directory-mount');
            const wcStr = currentMonday.toISOString().split('T')[0];
            const viewedDate = new Date(currentMonday); viewedDate.setDate(viewedDate.getDate() + selectedDayIdx);
            const isWeekend = (viewedDate.getDay() === 0 || viewedDate.getDay() === 6);
            
            // Weekend logic
            ['Office','WFH','Leave'].forEach(id => document.getElementById('card-'+id).classList.toggle('locked', isWeekend));

            const counts = { Office: 0, WFH: 0, Shoot: 0, OffSite: 0, Leave: 0 };
            mount.innerHTML = staff.sort((a,b) => a.firstName.localeCompare(b.firstName)).map(s => {
                const fullName = `${s.firstName} ${s.lastName}`;
                const sub = submissions.find(sub => sub.name === fullName && sub.weekId === wcStr);
                const rawStatus = (sub && sub.schedule[selectedDayIdx]) ? sub.schedule[selectedDayIdx].status : 'Office';
                let status = rawStatus || 'Office';

                let countKey = ['PTO','Leave','Abroad'].includes(status) ? 'Leave' : (status === 'Shoot' ? 'Shoot' : (status === 'Client / Travel' ? 'OffSite' : status));
                let displayStatus = isWeekend && !['Shoot', 'Client / Travel'].includes(status) ? "Weekend" : status;
                
                // Safe key mapping
                const keyMap = { Office: 'Office', WFH: 'WFH', Shoot: 'Shoot', OffSite: 'OffSite', Leave: 'Leave' };
                const safeKey = keyMap[countKey] || countKey;

                if (countKey === 'Shoot') counts.Shoot++;
                else if (countKey === 'OffSite') counts.OffSite++;
                else if (!isWeekend && counts[safeKey] !== undefined) counts[safeKey]++;

                const color = teamColors[s.team] || '#CCC';
                const dots = `<div class="name-dots">${Array(4).fill(`<span style="background:${color}"></span>`).join('')}</div>`;
                return `<tr>
                    <td class="name-cell" onclick="openStaffProfile('${s.id}')">${dots} <span>${fullName} ${s.isManager ? '<span class="is-mgr-pill">MGR</span>' : ''}</span></td>
                    <td>${s.role}</td>
                    <td style="color:${color}; text-transform:uppercase; font-size:11px;">${s.team}</td>
                    <td class="status-cell">${getStatusIcon(displayStatus)}</td>
                </tr>`;
            }).join('');

            document.getElementById('count-office').innerText = String(isWeekend ? 0 : counts.Office);
            document.getElementById('count-wfh').innerText = String(isWeekend ? 0 : counts.WFH);
            document.getElementById('count-shoot').innerText = String(counts.Shoot || 0);
            document.getElementById('count-offsite').innerText = String(counts.OffSite || 0);
            document.getElementById('count-leave').innerText = String(isWeekend ? 0 : counts.Leave);
        }

        function renderTeamsGrid() {
            const mount = document.getElementById('teams-grid-mount');
            const wcStr = currentMonday.toISOString().split('T')[0];
            mount.innerHTML = ['Editorial', 'Production', 'Creative', 'Social', 'Operations', 'Executive'].map(v => {
                const members = staff.filter(s => s.team === v);
                if(members.length === 0) return "";
                const vCol = teamColors[v];
                return `<div class="team-block"><div class="stream-header"><div class="stream-dot" style="background:${vCol}"></div>${v} Stream</div><table class="directory-table"><thead><tr><th>Name</th>${['M','T','W','T','F'].map(d => `<th class="status-cell-grid">${d}</th>`).join('')}</tr></thead><tbody>${members.sort((a,b)=>a.firstName.localeCompare(b.firstName)).map(m => {
                    const sub = submissions.find(s => s.name === `${m.firstName} ${m.lastName}` && s.weekId === wcStr);
                    const sched = sub ? sub.schedule : Array(5).fill({status: 'Pending'});
                    return `<tr><td class="name-cell" onclick="openStaffProfile('${m.id}')"><span>${m.firstName} ${m.lastName}</span></td>${sched.map(day => {
                        const st = day.status || 'Pending';
                        return `<td class="status-cell-grid" style="color:var(--st-${(st).toLowerCase().replace(/ /g,'')})">${st === 'Pending' ? '-' : st.charAt(0)}</td>`
                    }).join('')}</tr>`;
                }).join('')}</tbody></table></div>`;
            }).join('');
        }

        function renderApprovals() {
            const mount = document.getElementById('approvals-mount');
            const wcStr = currentMonday.toISOString().split('T')[0];
            mount.innerHTML = staff.filter(s => s.isManager).sort((a,b) => a.firstName.localeCompare(b.firstName)).map(m => {
                const name = `${m.firstName} ${m.lastName}`;
                const reports = staff.filter(s => s.manager === name);
                if(reports.length === 0) return "";
                const pendingCount = reports.filter(r => !responses.some(res => res.name === `${r.firstName} ${r.lastName}` && res.weekId === wcStr && res.status === 'Approved')).length;
                const accent = teamColors[m.team] || '#1C1C1C';
                return `<div class="manager-card" style="--accent-color:${accent}" onclick="openApprovalWorkspace('${m.id}')"><div class="mgr-name">${name}</div><div class="mgr-pending-alert ${pendingCount > 0 ? 'urgent' : 'all-clear'}">${pendingCount > 0 ? `${pendingCount} PENDING ACTIONS` : 'ALL CLEAR'}</div></div>`;
            }).join('');
        }

        // GLOBAL FOR HTML ONCLICK
        window.showStatusList = (statusType) => {
            const viewedDate = new Date(currentMonday); viewedDate.setDate(viewedDate.getDate() + selectedDayIdx);
            const isWeekend = (viewedDate.getDay() === 0 || viewedDate.getDay() === 6);
            if (isWeekend && !['Shoot', 'OffSite'].includes(statusType)) return;

            const wcStr = currentMonday.toISOString().split('T')[0];
            const staffWithStatus = staff.filter(s => {
                const fullName = `${s.firstName} ${s.lastName}`;
                const sub = submissions.find(sub => sub.name === fullName && sub.weekId === wcStr);
                const status = (sub && sub.schedule[selectedDayIdx]) ? sub.schedule[selectedDayIdx].status : 'Office';
                if (statusType === 'Leave') return ['PTO', 'Leave', 'Abroad'].includes(status);
                if (statusType === 'OffSite') return status === 'Client / Travel';
                return status === statusType;
            });

            const mount = document.getElementById('modal-mount');
            mount.innerHTML = `<h2 style="margin-top:0;">Staff: ${statusType}</h2><div style="font-size:10px; font-weight:800; color:#999; text-transform:uppercase; margin-bottom:20px;">For ${viewedDate.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })}</div><div>${staffWithStatus.length > 0 ? staffWithStatus.map(s => `<div class="status-list-item"><span class="status-list-name">${s.firstName} ${s.lastName}</span><span class="status-list-detail">${s.team}</span></div>`).join('') : '<div style="text-align:center; padding: 20px; color: var(--ink-sub);">None logged.</div>'}</div>`;
            document.getElementById('global-modal').classList.add('active');
        };

        window.openStaffProfile = (staffId) => {
            const s = staff.find(x => x.id === staffId);
            const mount = document.getElementById('modal-mount');
            const fullName = `${s.firstName} ${s.lastName}`;
            const teamCol = teamColors[s.team];
            const wcStr = currentMonday.toISOString().split('T')[0];
            const sub = submissions.find(sub => sub.name === fullName && sub.weekId === wcStr);
            const status = (sub && sub.schedule[selectedDayIdx]) ? sub.schedule[selectedDayIdx].status : 'Pending';
            
            const manager = staff.find(x => `${x.firstName} ${x.lastName}` === s.manager);
            const managerColor = manager ? teamColors[manager.team] : 'var(--ink)';

            const weeks = [-7, 0, 7].map(offset => { const d = new Date(currentMonday); d.setDate(d.getDate() + offset); return d.toISOString().split('T')[0]; });

            mount.innerHTML = `
                <div style="display:flex; align-items:center; gap:25px; border-bottom:1.5px solid var(--border); padding-bottom:30px; margin-bottom: 25px;">
                    <div class="p-grid-large">${Array(4).fill(`<span style="background:${teamCol}"></span>`).join('')}</div>
                    <div><h1 style="margin:0; font-size:32px; font-weight:900;">${fullName}</h1><div style="color:#999; font-weight:700; text-transform:uppercase; font-size:11px;">${s.role} • <span style="color:${teamCol}">${s.team} Stream</span></div></div>
                </div>
                <div class="p-meta">
                    <div class="p-meta-card"><span class="p-meta-label">Today</span><div class="p-meta-val" style="color:var(--st-${(status).toLowerCase().replace(/ /g,'')})">${status}</div></div>
                    <div class="p-meta-card"><span class="p-meta-label">Manager</span><div class="p-meta-val" style="color:${managerColor}">${s.manager}</div></div>
                    <div class="p-meta-card"><span class="p-meta-label">Tier</span><div class="p-meta-val tier-val" style="color:#999;">${s.seniority || 'Staff'}</div></div>
                </div>
                <div class="p-section-title" style="color:var(--team-people); text-transform:uppercase;">PRESENCE TIMELINE</div>
                <table class="presence-table">
                    <thead><tr><th style="text-align:left; color:var(--team-people);">Week</th><th style="color:var(--team-people);">M</th><th style="color:var(--team-people);">T</th><th style="color:var(--team-people);">W</th><th style="color:var(--team-people);">T</th><th style="color:var(--team-people);">F</th><th style="color:var(--team-people);">Action</th></tr></thead>
                    <tbody>
                        ${weeks.map((w, idx) => {
                            const sW = submissions.find(sub => sub.name === fullName && sub.weekId === w);
                            const label = idx === 1 ? 'Current' : idx === 0 ? 'Prior' : 'Next';
                            const dateStr = new Date(w).toLocaleDateString('en-GB', {day:'numeric', month:'short'});
                            return `<tr class="${idx === 0 ? 'prior-week' : ''}">
                                <td style="text-align:left"><b>${label} • w/c ${dateStr}</b></td>
                                ${sW ? sW.schedule.map(d => `<td style="color:var(--st-${(d.status).toLowerCase().replace(/ /g,'')})">${d.status.charAt(0)}</td>`).join('') : '<td colspan="5" style="color:#BBB">Pending</td>'}
                                <td>${idx !== 0 ? `<button class="pill-btn ${sW?'pill-update':'pill-suggest'}" onclick="openPatternEditor('${fullName}','${w}','modal-mount')">${sW?'Update':'Suggest'}</button>` : ''}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
                <div id="pattern-editor-mount"></div>
                <div class="p-section-title" style="color:var(--team-people); text-transform:uppercase;">MANAGER REMINDERS</div>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <input type="text" id="new-note-txt" placeholder="Log a reminder..." class="comment-box" style="margin:0; border-radius:12px; width:100%; border: 1px solid #EEE; padding: 12px;">
                    <button class="btn-post" onclick="postNote('${fullName}', '${s.team}')">Post</button>
                </div>
                <div class="notes-list" id="profile-notes-mount"></div>
            `;
            renderProfileNotes(fullName);
            document.getElementById('global-modal').classList.add('active');
        };

        window.openApprovalWorkspace = (mgrId) => {
            const mount = document.getElementById('modal-mount');
            const wcStr = currentMonday.toISOString().split('T')[0];
            const manager = staff.find(s => s.id === mgrId);
            const reports = staff.filter(s => s.manager === `${manager.firstName} ${manager.lastName}`);
            mount.innerHTML = `<h2 style="margin-top:0;">${manager.firstName}'s Workspace</h2>` + reports.map(r => {
                const sub = submissions.find(s => s.name === `${r.firstName} ${r.lastName}` && s.weekId === wcStr);
                const resp = responses.find(res => res.name === `${r.firstName} ${r.lastName}` && res.weekId === wcStr);
                return `<div class="request-item">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <div class="request-name-link" onclick="openStaffProfile('${r.id}')">${r.firstName} ${r.lastName}</div>
                        <span style="font-size:9px; font-weight:900; color:${resp?'var(--st-office)':'#BBB'}">${resp?resp.status:'Awaiting Action'}</span>
                    </div>
                    ${sub ? `<div class="week-strip">${sub.schedule.map((d, i) => `<div class="day-box"><span class="d-label">${['M','T','W','T','F'][i]}</span><span class="d-val">${d.status.charAt(0)}</span></div>`).join('')}</div>
                    ${!resp ? `<textarea id="comment-${r.id}" class="comment-box" placeholder="Feedback..."></textarea><div class="action-row"><button class="btn-action btn-approve" onclick="handleAction('${r.firstName} ${r.lastName}', 'Approved', '${r.id}')">Approve</button><button class="btn-action btn-deny" onclick="handleAction('${r.firstName} ${r.lastName}', 'Denied', '${r.id}')">Deny</button></div>` : `<div style="font-size:11px; color:#999;">${resp.comment}</div>`}` : `<div style="font-size:12px; color:var(--team-editorial);">No submission found.</div>`}
                </div>`;
            }).join('');
            document.getElementById('global-modal').classList.add('active');
        };

        window.openPatternEditor = (name, weekId, mountId = 'pattern-editor-mount') => {
            const mount = document.getElementById(mountId === 'modal-mount' ? 'pattern-editor-mount' : mountId);
            const sub = submissions.find(s => s.name === name && s.weekId === weekId);
            const locs = ['Office', 'WFH', 'Shoot', 'Client / Travel', 'PTO'];
            mount.innerHTML = `<div class="pattern-editor"><div class="editor-grid">${[0,1,2,3,4].map(i => `<select class="editor-select" id="edit-day-${i}">${locs.map(l => `<option value="${l}" ${sub && sub.schedule[i].status===l?'selected':''}>${l}</option>`).join('')}</select>`).join('')}</div><button class="btn-action btn-approve" style="width:100%;" onclick="saveOverride('${name}', '${weekId}')">Save Override</button></div>`;
        };

        window.saveOverride = async (name, weekId) => {
            const schedule = [];
            for(let i=0; i<5; i++) schedule.push({ status: document.getElementById(`edit-day-${i}`).value, fullDay: true });
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rota_submissions', `${weekId}_${name.replace(/ /g, '_')}`), { name, weekId, schedule, timestamp: new Date().toISOString() });
            showToast("Pattern Overridden");
            closeModal();
        };

        window.handleAction = async (name, status, staffId) => {
            const wcStr = currentMonday.toISOString().split('T')[0];
            const comment = document.getElementById(`comment-${staffId}`).value;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rota_responses', `${wcStr}_${name.replace(/ /g, '_')}`), { name, weekId: wcStr, status, comment, timestamp: new Date().toISOString() });
            showToast("Status Updated");
            closeModal();
        };

        window.postNote = async (target, team) => {
            const text = document.getElementById('new-note-txt').value;
            if(!text.trim()) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'staff_notes'), { target, text, date: new Date().toISOString(), team });
            document.getElementById('new-note-txt').value = "";
            showToast("Note Recorded");
            renderProfileNotes(target);
        };

        function renderProfileNotes(name) {
            const mount = document.getElementById('profile-notes-mount');
            const userNotes = notes.filter(n => n.target === name).sort((a,b) => new Date(b.date).getTime() - new Date(a.date).getTime());
            mount.innerHTML = userNotes.map(n => `<div class="note-item" style="border-left-color:${teamColors[n.team] || '#CCC'}">${n.text}<span class="note-meta">${new Date(n.date).toLocaleDateString()}</span></div>`).join('') || '<div style="text-align:center; padding:20px; color:#CCC;">No notes.</div>';
        }

        window.closeModal = () => document.getElementById('global-modal').classList.remove('active');
        window.switchView = (v, btn) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
            document.getElementById('view-'+v).classList.add('active');
            btn.classList.add('active');
            document.getElementById('week-picker-control').classList.toggle('hidden', v === 'approvals');
        };
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('active'); setTimeout(() => t.classList.remove('active'), 2500); }
    </script>
</body>
</html>
