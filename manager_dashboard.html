<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --team-sales: #F97316;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 16px;
            color: var(--ink);
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        .dashboard-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot-grid span:nth-child(1) { animation-delay: 0s; }
        .dot-grid span:nth-child(2) { animation-delay: 0.15s; }
        .dot-grid span:nth-child(3) { animation-delay: 0.3s; }
        .dot-grid span:nth-child(4) { animation-delay: 0.45s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .dashboard-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--ink);
        }
        .demo-badge {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #FFF;
            background: var(--team-creative);
            padding: 4px 10px;
            border-radius: 4px;
            margin-left: auto;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }
        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 900;
            color: var(--ink);
        }
        .stat-trend {
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
        }
        .stat-trend.up { color: var(--success); }
        .stat-trend.down { color: var(--danger); }
        
        /* Team Capacity Section */
        .section {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--ink);
        }
        .section-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
            background: var(--bg-soft);
            color: var(--ink-sub);
        }
        
        /* Team Row */
        .team-row {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #F5F5F5;
        }
        .team-row:last-child { border-bottom: none; }
        .team-color {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 12px;
        }
        .team-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            width: 120px;
        }
        .team-members {
            display: flex;
            gap: 4px;
            flex: 1;
            margin: 0 16px;
        }
        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #FFF;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .member-avatar:hover { transform: scale(1.1); }
        .capacity-bar {
            width: 100px;
            height: 6px;
            background: #E5E5E5;
            border-radius: 3px;
            overflow: hidden;
            margin-right: 12px;
        }
        .capacity-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }
        .capacity-value {
            font-size: 12px;
            font-weight: 800;
            width: 40px;
            text-align: right;
        }
        
        /* Recent Activity */
        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid #F5F5F5;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #FFF;
            flex-shrink: 0;
        }
        .activity-content { flex: 1; }
        .activity-text {
            font-size: 13px;
            color: var(--ink);
            line-height: 1.4;
        }
        .activity-text strong { font-weight: 700; }
        .activity-time {
            font-size: 11px;
            color: var(--ink-sub);
            margin-top: 4px;
        }
        
        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--ink-sub);
            font-size: 13px;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--dmg-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div class="spinner"></div>
            Loading dashboard...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B',
            'Creative': '#E6468B',
            'Production': '#43B049',
            'Social': '#F2C316',
            'Social Video': '#F2C316',
            'Operations': '#9333EA',
            'Sales': '#F97316'
        };

        // Demo data fallback
        const DEMO_STAFF = [
            { id: '1', firstName: 'Nick', lastName: 'B', team: 'Creative', role: 'Creative Lead', isManager: true },
            { id: '2', firstName: 'Ana', lastName: 'C', team: 'Creative', role: 'Senior Creative' },
            { id: '3', firstName: 'Hugo', lastName: 'M', team: 'Production', role: 'Producer' },
            { id: '4', firstName: 'Isobel', lastName: 'W', team: 'Editorial', role: 'Editor', isManager: true },
            { id: '5', firstName: 'Mimi', lastName: 'Y', team: 'Social', role: 'Creator' },
            { id: '6', firstName: 'Dan', lastName: 'Q', team: 'Social', role: 'Presenter' },
            { id: '7', firstName: 'Kaylee', lastName: 'A', team: 'Editorial', role: 'Presenter' },
            { id: '8', firstName: 'Sophia', lastName: 'S', team: 'Editorial', role: 'Finance Creator' },
            { id: '9', firstName: 'Henry', lastName: 'W', team: 'Social', role: 'Sport Creator' },
            { id: '10', firstName: 'Gemma', lastName: 'P', team: 'Production', role: 'Producer', isManager: true },
            { id: '11', firstName: 'Tom', lastName: 'R', team: 'Operations', role: 'Ops Manager', isManager: true },
            { id: '12', firstName: 'Ellie', lastName: 'B', team: 'Creative', role: 'Head of Social', isManager: true }
        ];

        const DEMO_ACTIVITY = [
            { person: 'Nick B', action: 'approved', target: 'Sky Vegas concept deck', time: '10 mins ago', team: 'Creative' },
            { person: 'Gemma P', action: 'scheduled', target: 'Street Talks shoot for Monday', time: '25 mins ago', team: 'Production' },
            { person: 'Isobel W', action: 'published', target: '3 new Headlines videos', time: '1 hour ago', team: 'Editorial' },
            { person: 'Ana C', action: 'submitted', target: 'Chery creative response', time: '2 hours ago', team: 'Creative' },
            { person: 'Tom R', action: 'updated', target: 'team rota for next week', time: '3 hours ago', team: 'Operations' }
        ];

        let staff = [];
        let activity = DEMO_ACTIVITY;
        let isDemo = true;
        const root = document.getElementById('root');

        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();

        function getTeamStats() {
            const teams = {};
            staff.forEach(s => {
                if (!teams[s.team]) {
                    teams[s.team] = { members: [], capacity: Math.floor(Math.random() * 40) + 60 };
                }
                teams[s.team].members.push(s);
            });
            return teams;
        }

        function render() {
            const teamStats = getTeamStats();
            const totalStaff = staff.length;
            const totalManagers = staff.filter(s => s.isManager).length;
            const avgCapacity = Object.values(teamStats).reduce((sum, t) => sum + t.capacity, 0) / Object.keys(teamStats).length || 0;

            root.innerHTML = `
                <div class="dashboard">
                    <div class="dashboard-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h1 class="dashboard-title">Manager Dashboard</h1>
                        ${isDemo ? '<span class="demo-badge">Preview Mode</span>' : ''}
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Team Members</div>
                            <div class="stat-value">${totalStaff}</div>
                            <div class="stat-trend up">↑ Active staff</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Team Leads</div>
                            <div class="stat-value">${totalManagers}</div>
                            <div class="stat-trend">Across ${Object.keys(teamStats).length} teams</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Avg Capacity</div>
                            <div class="stat-value">${Math.round(avgCapacity)}%</div>
                            <div class="stat-trend ${avgCapacity > 80 ? 'down' : 'up'}">${avgCapacity > 80 ? 'High load' : 'Healthy'}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Active Projects</div>
                            <div class="stat-value">8</div>
                            <div class="stat-trend up">↑ 2 this week</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-header">
                            <h2 class="section-title">Team Capacity</h2>
                            <span class="section-badge">${Object.keys(teamStats).length} Teams</span>
                        </div>
                        ${Object.entries(teamStats).map(([team, data]) => `
                            <div class="team-row">
                                <div class="team-color" style="background: ${getTeamColor(team)}"></div>
                                <div class="team-name">${team}</div>
                                <div class="team-members">
                                    ${data.members.slice(0, 6).map(m => `
                                        <div class="member-avatar" style="background: ${getTeamColor(team)}" title="${m.firstName} ${m.lastName}">
                                            ${getInitials(m.firstName, m.lastName)}
                                        </div>
                                    `).join('')}
                                    ${data.members.length > 6 ? `<div class="member-avatar" style="background: #999">+${data.members.length - 6}</div>` : ''}
                                </div>
                                <div class="capacity-bar">
                                    <div class="capacity-fill" style="width: ${data.capacity}%; background: ${data.capacity > 85 ? '#EF4444' : data.capacity > 70 ? '#F59E0B' : '#22C55E'}"></div>
                                </div>
                                <div class="capacity-value" style="color: ${data.capacity > 85 ? '#EF4444' : data.capacity > 70 ? '#F59E0B' : '#22C55E'}">${data.capacity}%</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="section">
                        <div class="section-header">
                            <h2 class="section-title">Recent Activity</h2>
                            <span class="section-badge">Last 24h</span>
                        </div>
                        ${activity.map(a => `
                            <div class="activity-item">
                                <div class="activity-avatar" style="background: ${getTeamColor(a.team)}">
                                    ${a.person.split(' ').map(n => n[0]).join('')}
                                </div>
                                <div class="activity-content">
                                    <div class="activity-text"><strong>${a.person}</strong> ${a.action} <strong>${a.target}</strong></div>
                                    <div class="activity-time">${a.time}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function loadData() {
            try {
                // Load staff from Firebase
                const staffSnap = await getDocs(collection(db, "artifacts", appId, "public", "data", "staff_directory"));
                if (!staffSnap.empty) {
                    staff = [];
                    staffSnap.forEach(d => {
                        staff.push({ id: d.id, ...d.data() });
                    });
                    isDemo = false;
                } else {
                    staff = DEMO_STAFF;
                    isDemo = true;
                }

                // Try to load activity feed
                try {
                    const activitySnap = await getDocs(
                        query(collection(db, "artifacts", appId, "public", "data", "activity_feed"), orderBy("timestamp", "desc"), limit(5))
                    );
                    if (!activitySnap.empty) {
                        activity = [];
                        activitySnap.forEach(d => {
                            const data = d.data();
                            activity.push({
                                person: data.userName || 'Unknown',
                                action: data.action || 'updated',
                                target: data.target || 'item',
                                time: data.timestamp ? formatTime(data.timestamp.toDate()) : 'Recently',
                                team: data.team || 'Operations'
                            });
                        });
                    }
                } catch (e) {
                    console.log('Using demo activity');
                }

            } catch (e) {
                console.log('Using demo data:', e);
                staff = DEMO_STAFF;
                isDemo = true;
            }
            render();
        }

        function formatTime(date) {
            const diff = Date.now() - date.getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 60) return `${mins} mins ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            return `${Math.floor(hours / 24)} days ago`;
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadData();
            } else {
                signInAnonymously(auth).catch(e => {
                    console.error('Auth failed:', e);
                    staff = DEMO_STAFF;
                    isDemo = true;
                    render();
                });
            }
        });
    </script>
</body>
</html>
