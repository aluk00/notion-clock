<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Core palette */
            --ink: #0F172A;
            --ink-sub: #64748B;
            --ink-muted: #94A3B8;
            --border: #E2E8F0;
            --surface: #FFFFFF;
            --surface-alt: #F8FAFC;

            /* Hero/Brand */
            --dmg-blue: #21A0D8;
            --dmg-blue-soft: rgba(33, 160, 216, 0.1);
            --dmg-blue-glow: rgba(33, 160, 216, 0.2);

            /* Semantic */
            --success: #22C55E;
            --success-soft: rgba(34, 197, 94, 0.1);
            --warning: #F59E0B;
            --warning-soft: rgba(245, 158, 11, 0.1);
            --danger: #EF4444;
            --danger-soft: rgba(239, 68, 68, 0.1);

            /* Team colors */
            --creative: #E6468B;
            --creative-soft: rgba(230, 70, 139, 0.1);
            --production: #43B049;
            --production-soft: rgba(67, 176, 73, 0.1);
            --editorial: #E94B4B;
            --editorial-soft: rgba(233, 75, 75, 0.1);
            --social: #F2C316;
            --social-soft: rgba(242, 195, 22, 0.1);
            --operations: #9333EA;
            --operations-soft: rgba(147, 51, 234, 0.1);
            --sales: #F97316;
            --sales-soft: rgba(249, 115, 22, 0.1);
            --design: #8B5CF6;
            --design-soft: rgba(139, 92, 246, 0.1);

            /* Layout */
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;

            /* Smooth transition - natural feel */
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out: cubic-bezier(0, 0, 0.2, 1);
            --ease-in: cubic-bezier(0.4, 0, 1, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: transparent; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
            color: var(--ink);
        }
        .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: -0.04em; }

        /* Smooth keyframes */
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98) translateY(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(24px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.5; }
            100% { transform: scale(4); opacity: 0; }
        }

        .container { max-width: 1320px; margin: 0 auto; }

        /* PIN Screen */
        .pin-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #F8FAFC 0%, #E2E8F0 50%, #CBD5E1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .pin-card {
            background: var(--surface);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.03);
            text-align: center;
            animation: slideUp 0.5s var(--ease);
        }
        .pin-card.shake { animation: shake 0.4s var(--ease); }
        .pin-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--dmg-blue) 0%, #1a8bc0 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            box-shadow: 0 8px 24px var(--dmg-blue-glow);
            transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }
        .pin-logo:hover { transform: scale(1.05); box-shadow: 0 12px 32px var(--dmg-blue-glow); }
        .pin-logo svg { width: 32px; height: 32px; color: white; }
        .pin-title { font-size: 26px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.03em; }
        .pin-subtitle { font-size: 14px; color: var(--ink-sub); margin-bottom: 36px; }
        .pin-dots { display: flex; justify-content: center; gap: 18px; margin-bottom: 36px; }
        .pin-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: transparent;
            transition: all 0.25s var(--ease-bounce);
        }
        .pin-dot.filled { background: var(--dmg-blue); border-color: var(--dmg-blue); transform: scale(1.1); }
        .pin-dot.error { background: var(--danger); border-color: var(--danger); }
        .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 280px; margin: 0 auto; }
        .pin-key {
            width: 100%;
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 26px;
            font-weight: 700;
            background: var(--surface);
            cursor: pointer;
            transition: all 0.2s var(--ease);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .pin-key:hover { background: var(--surface-alt); border-color: var(--dmg-blue); transform: scale(1.02); }
        .pin-key:active { transform: scale(0.96); background: var(--dmg-blue-soft); }
        .pin-key.action { font-size: 14px; color: var(--ink-sub); font-weight: 600; }
        .pin-error { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 20px; min-height: 20px; }

        /* Header */
        .header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            animation: slideIn 0.4s var(--ease);
        }
        .dot-grid { display: grid; grid-template-columns: repeat(2, 6px); gap: 4px; }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
        }
        .dot-grid span:nth-child(1) { animation: pulse 2.5s ease-in-out 0s infinite; }
        .dot-grid span:nth-child(2) { animation: pulse 2.5s ease-in-out 0.3s infinite; }
        .dot-grid span:nth-child(3) { animation: pulse 2.5s ease-in-out 0.9s infinite; }
        .dot-grid span:nth-child(4) { animation: pulse 2.5s ease-in-out 0.6s infinite; }
        .eyebrow { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.16em; color: var(--dmg-blue); }
        .title { font-size: 22px; font-weight: 900; letter-spacing: -0.03em; }
        .status { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); animation: pulse 2s ease-in-out infinite; }
        .status-text { font-size: 11px; font-weight: 700; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; }
        .header-actions { display: flex; gap: 8px; margin-left: 16px; }

        /* Tabs */
        .tabs-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            animation: slideIn 0.4s var(--ease) 0.05s both;
        }
        .tabs { display: flex; gap: 4px; min-width: max-content; }
        .tab {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s var(--ease);
            border: none;
            background: transparent;
            color: var(--ink-sub);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .tab:hover { background: var(--surface-alt); color: var(--ink); }
        .tab.active {
            background: var(--dmg-blue);
            color: white;
            box-shadow: 0 4px 12px var(--dmg-blue-glow);
        }
        .tab-badge {
            padding: 3px 8px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 800;
            background: rgba(255,255,255,0.25);
            transition: all 0.25s var(--ease);
        }
        .tab:not(.active) .tab-badge { background: var(--danger-soft); color: var(--danger); }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 16px;
            animation: slideIn 0.4s var(--ease) 0.1s both;
            transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
        }
        .card:hover { border-color: var(--dmg-blue-soft); }
        .card-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .card-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--ink);
        }
        .card-meta { font-size: 12px; color: var(--ink-sub); font-weight: 600; }
        .card-body { padding: 22px; }

        /* Buttons */
        .btn {
            padding: 11px 20px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s var(--ease);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            transform: scale(0);
            opacity: 0;
            transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
        }
        .btn:active::after { transform: scale(2); opacity: 1; transition: 0s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--dmg-blue); color: white; }
        .btn-primary:hover:not(:disabled) { background: #1a8bc0; box-shadow: 0 4px 12px var(--dmg-blue-glow); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover:not(:disabled) { box-shadow: 0 4px 12px var(--success-soft); transform: translateY(-1px); }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover:not(:disabled) { box-shadow: 0 4px 12px var(--danger-soft); transform: translateY(-1px); }
        .btn-ghost { background: transparent; color: var(--ink-sub); border: 1px solid var(--border); }
        .btn-ghost:hover:not(:disabled) { background: var(--surface-alt); border-color: var(--dmg-blue); color: var(--dmg-blue); }
        .btn-sm { padding: 8px 14px; font-size: 11px; }
        .btn-icon { width: 38px; height: 38px; padding: 0; justify-content: center; }

        /* Avatar */
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
            transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }
        .avatar:hover { transform: scale(1.08); }
        .avatar-sm { width: 34px; height: 34px; font-size: 12px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
        .stat-card {
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            padding: 22px;
            text-align: center;
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
            cursor: default;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        .stat-value { font-size: 32px; font-weight: 900; letter-spacing: -0.03em; transition: color 0.25s var(--ease); }
        .stat-label { font-size: 10px; color: var(--ink-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 6px; }

        /* Team Cards */
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
        .team-card {
            background: var(--surface-alt);
            border-radius: var(--radius);
            padding: 22px;
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
            cursor: default;
        }
        .team-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
        .team-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
        .team-dot { width: 14px; height: 14px; border-radius: 50%; transition: transform 0.2s var(--ease); }
        .team-card:hover .team-dot { transform: scale(1.2); }
        .team-name { font-size: 16px; font-weight: 800; }
        .team-meta { margin-left: auto; font-size: 12px; color: var(--ink-sub); font-weight: 600; }
        .capacity-bar { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
        .capacity-fill { height: 100%; border-radius: 5px; transition: width 0.6s var(--ease-out); }
        .capacity-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-sub); margin-top: 10px; }
        .members-row { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
        .member-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s var(--ease-bounce);
            border: 2px solid transparent;
        }
        .member-avatar:hover {
            transform: scale(1.15) translateY(-2px);
            border-color: white;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            z-index: 10;
        }

        /* List Items */
        .list-item {
            padding: 18px 22px;
            border-bottom: 1px solid var(--surface-alt);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s var(--ease);
            cursor: pointer;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: var(--surface-alt); }
        .list-item-info { flex: 1; min-width: 0; }
        .list-item-title { font-size: 14px; font-weight: 700; transition: color 0.2s var(--ease); }
        .list-item:hover .list-item-title { color: var(--dmg-blue); }
        .list-item-subtitle { font-size: 12px; color: var(--ink-sub); margin-top: 3px; }
        .list-item-meta { font-size: 13px; font-weight: 600; margin-top: 5px; }
        .list-item-actions { display: flex; gap: 8px; }

        /* Pills/Badges */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: transform 0.2s var(--ease);
        }
        .pill:hover { transform: scale(1.05); }
        .pill-success { background: var(--success-soft); color: #166534; }
        .pill-warning { background: var(--warning-soft); color: #92400E; }
        .pill-danger { background: var(--danger-soft); color: #B91C1C; }
        .pill-blue { background: var(--dmg-blue-soft); color: #1E40AF; }
        .pill-gray { background: var(--surface-alt); color: var(--ink-sub); }

        /* Empty State */
        .empty { padding: 70px 28px; text-align: center; animation: fadeIn 0.4s var(--ease); }
        .empty-icon { font-size: 56px; margin-bottom: 18px; }
        .empty-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
        .empty-subtitle { font-size: 14px; color: var(--ink-sub); max-width: 320px; margin: 0 auto; line-height: 1.5; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            padding: 14px 28px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            opacity: 0;
            transition: all 0.4s var(--ease-out);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--ink); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; animation: fadeIn 0.25s var(--ease); }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            width: 100%;
            max-width: 580px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.18);
            animation: slideUp 0.35s var(--ease);
        }
        .modal-header {
            padding: 22px 26px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title { font-size: 18px; font-weight: 800; }
        .modal-close {
            width: 38px;
            height: 38px;
            border: none;
            background: var(--surface-alt);
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            color: var(--ink-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s var(--ease);
        }
        .modal-close:hover { background: var(--border); color: var(--ink); transform: rotate(90deg); }
        .modal-body { padding: 26px; overflow-y: auto; max-height: calc(90vh - 160px); }
        .modal-footer {
            padding: 18px 26px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* Form Elements */
        .form-group { margin-bottom: 22px; }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ink-sub);
            margin-bottom: 10px;
        }
        .form-input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s var(--ease);
            background: var(--surface);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--dmg-blue);
            box-shadow: 0 0 0 4px var(--dmg-blue-soft);
        }
        .form-select {
            width: 100%;
            padding: 13px 16px;
            padding-right: 44px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            background: var(--surface);
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748B' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 18px 18px;
            transition: all 0.25s var(--ease);
        }
        .form-select:focus { outline: none; border-color: var(--dmg-blue); box-shadow: 0 0 0 4px var(--dmg-blue-soft); }
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
        .form-toggle { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .toggle-switch {
            width: 48px;
            height: 26px;
            background: var(--border);
            border-radius: 13px;
            position: relative;
            transition: background 0.3s var(--ease);
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.3s var(--ease-bounce);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .form-toggle input:checked + .toggle-switch { background: var(--success); }
        .form-toggle input:checked + .toggle-switch::after { transform: translateX(22px); }
        .form-toggle input { display: none; }
        .toggle-label { font-size: 14px; font-weight: 600; }

        /* Calendar Grid */
        .calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
        .calendar-title { font-size: 16px; font-weight: 800; }
        .calendar-grid {
            display: grid;
            grid-template-columns: 160px repeat(5, 1fr);
            gap: 1px;
            background: var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .calendar-header {
            background: var(--surface-alt);
            padding: 14px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;

        .calendar-cell {
            background: var(--surface);
            padding: 12px;
            text-align: center;

        .calendar-cell:hover { background: var(--dmg-blue-soft); }
        .calendar-cell.pending { background: var(--warning-soft); }
        .calendar-icon { font-size: 20px; transition: transform 0.2s var(--ease); }
        .calendar-cell:hover .calendar-icon { transform: scale(1.15); }
        .calendar-legend { display: flex; gap: 24px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-sub); font-weight: 500; }

        /* Table */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 14px 18px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;

        }
        td {
            padding: 16px 18px;

            transition: background 0.2s var(--ease);
        }
        tr:hover td { background: var(--surface-alt); }
        .table-input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 13px;
            width: 90px;
            text-align: center;
            transition: all 0.2s var(--ease);
        }
        .table-input:focus { outline: none; border-color: var(--dmg-blue); box-shadow: 0 0 0 3px var(--dmg-blue-soft); }

        /* Forecast Card */
        .forecast-card {
            background: linear-gradient(135deg, var(--dmg-blue-soft) 0%, var(--production-soft) 100%);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 22px;

        .forecast-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dmg-blue); }
        .forecast-value { font-size: 36px; font-weight: 900; letter-spacing: -0.03em; }
        .forecast-label { font-size: 12px; color: var(--ink-sub); }
        .forecast-bar { height: 14px; background: rgba(255,255,255,0.6); border-radius: 7px; overflow: hidden; margin-top: 14px; }
        .forecast-fill { height: 100%; border-radius: 7px; transition: width 0.6s var(--ease-out); }
        .forecast-warning {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            padding: 12px 16px;
            background: var(--warning-soft);

        /* Approval Card */

            margin-bottom: 14px;
            background: var(--surface);

        }
        .approval-card:hover { border-color: var(--dmg-blue); box-shadow: 0 8px 24px rgba(0,0,0,0.06); transform: translateY(-2px); }
        .approval-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
        .approval-project { font-size: 15px; font-weight: 800; text-transform: uppercase; }
        .approval-field { font-size: 12px; color: var(--ink-sub); margin-top: 3px; }
        .approval-change {
            display: flex;
            align-items: center;

            padding: 14px;

        .approval-arrow { color: var(--ink-muted); font-size: 18px; }
        .approval-meta { font-size: 12px; color: var(--ink-sub); display: flex; align-items: center; gap: 10px; }
        .approval-actions { display: flex; gap: 10px; margin-top: 14px; }

        /* Loading */
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px; }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--dmg-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 18px;
        }
        .loading-text { font-size: 12px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; }

        /* Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, var(--surface-alt) 25%, var(--border) 50%, var(--surface-alt) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }
    </style>
</head>
<body>
    <!-- PIN Screen -->
    <div class="pin-screen" id="pinScreen" style="display:none;">
        <div class="pin-card" id="pinCard">
            <div class="pin-logo">

                <button class="pin-key action" data-key="back">←</button>
            </div>
            <div class="pin-error" id="pinError"></div>
        </div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <div id="root">
            <div class="loading">
                <div class="spinner"></div>
                <span class="loading-text">Loading Dashboard...</span>
            </div>
        </div>
    </div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, updateDoc, deleteDoc, setDoc, addDoc, getDoc, getDocs, serverTimestamp, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        });

        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";
        const API_URL = 'https://createnotionproject-223535956454.us-central1.run.app';

        // Team colors
        const TEAM_COLORS = {
            Editorial: { color: '#E94B4B', soft: 'rgba(233, 75, 75, 0.1)' },
            Creative: { color: '#E6468B', soft: 'rgba(230, 70, 139, 0.1)' },
            Production: { color: '#43B049', soft: 'rgba(67, 176, 73, 0.1)' },
            Social: { color: '#F2C316', soft: 'rgba(242, 195, 22, 0.1)' },
            Operations: { color: '#9333EA', soft: 'rgba(147, 51, 234, 0.1)' },
            Sales: { color: '#F97316', soft: 'rgba(249, 115, 22, 0.1)' },
            Design: { color: '#8B5CF6', soft: 'rgba(139, 92, 246, 0.1)' }
        };
        const TEAMS = Object.keys(TEAM_COLORS);
        const SENIORITY_LEVELS = ['Intern', 'Junior', 'Midweight', 'Senior', 'Lead', 'Head of', 'Director of', 'Executive'];
        const JOB_ROLES = ['Creator', 'Creative', 'Editor', 'Designer', 'Producer', 'Channel Lead', 'Account Manager', 'Strategist', 'Manager', 'Admin', 'Videographer', 'Team Led', 'Project Manager', 'Channel Producer', 'Content Producer'];
        const SECONDARY_ROLES = ['Creative', 'Producer', 'Channel Lead', 'Creator', 'Editor', 'Designer'];
        const EMPLOYMENT_TYPES = ['Full-time', 'Freelance', 'Contractor', 'Intern'];
        const STAFF_STATUS = ['Active', 'On Leave', 'Inactive'];
        const LINE_MANAGER_OPTIONS = ['Anais Lukaku', 'Ellie Beetham', 'Nev Brook', 'Nick Moar', 'Matthew Macleod', 'Nathan Aspell', 'Williams Olufemi', 'Nick Bolwell', 'Alice Baker', 'Maxine Halperin', 'Deli Koprinkov'];

        // State
        let staff = [], notionStaff = [], rotaRequests = [], projects = [], pendingChanges = [], effortConfig = null, rundownItems = [];
        let activeTab = 'overview', loading = true, calendarWeekOffset = 0, staffViewMode = 'team', rundownDate = new Date();
        const root = document.getElementById('root');

        // Merge Firebase staff with Notion staff data (Notion has accurate emails)
        function getMergedStaff() {
            // Create lookup by notionId and by name
            const notionById = {};
            const notionByName = {};
            notionStaff.forEach(ns => {
                if (ns.id) notionById[ns.id] = ns;
                const fullName = `${ns.firstName || ''} ${ns.lastName || ''}`.trim().toLowerCase();
                if (fullName) notionByName[fullName] = ns;
            });

            // Merge: use Firebase as base, enrich with Notion data
            return staff.map(fs => {
                let ns = null;
                if (fs.notionId) ns = notionById[fs.notionId];
                if (!ns) {
                    const fullName = `${fs.firstName || ''} ${fs.lastName || ''}`.trim().toLowerCase();
                    ns = notionByName[fullName];
                }
                if (ns) {
                    return {
                        ...fs,
                        email: ns.email || fs.email,
                        team: ns.team || fs.team,
                        role: ns.role || fs.role,
                        seniority: ns.seniority || fs.seniority,
                        status: ns.status || fs.status,
                        weeklyCapacityPTS: ns.weeklyCapacityPTS || fs.weeklyCapacityPTS,
                        isLineManager: ns.isLineManager || fs.isLineManager,
                        notionId: ns.id,
                        notionUrl: ns.notionUrl
                    };
                }
                return fs;
            });
        }

        // PIN Management
        const PIN_HASH = '1234';
        const AUTH_TIMEOUT = 30 * 60 * 1000;
        let pinEntry = '';

        function checkAuth() {
            const auth = sessionStorage.getItem('managerAuth');
            const authTime = sessionStorage.getItem('managerAuthTime');
            if (auth === 'true' && authTime) {
                if (Date.now() - parseInt(authTime) < AUTH_TIMEOUT) return true;
            }
            sessionStorage.removeItem('managerAuth');
            sessionStorage.removeItem('managerAuthTime');
            return false;
        }

        function setAuth() {
            sessionStorage.setItem('managerAuth', 'true');
            sessionStorage.setItem('managerAuthTime', Date.now().toString());
        }

        function resetAuthTimer() {
            if (checkAuth()) sessionStorage.setItem('managerAuthTime', Date.now().toString());
        }

        function showPinScreen() {
            document.getElementById('pinScreen').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            pinEntry = '';
            updatePinDots();
        }

        function hidePinScreen() {
            document.getElementById('pinScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        function updatePinDots() {
            document.querySelectorAll('.pin-dot').forEach((dot, i) => {
                dot.classList.toggle('filled', i < pinEntry.length);
                dot.classList.remove('error');
            });
        }

        function handlePinKey(key) {
            document.getElementById('pinError').textContent = '';
            if (key === 'clear') pinEntry = '';
            else if (key === 'back') pinEntry = pinEntry.slice(0, -1);
            else if (pinEntry.length < 4) pinEntry += key;
            updatePinDots();
            if (pinEntry.length === 4) verifyPin();
        }

        async function verifyPin() {
            let correctPin = PIN_HASH;
            try {
                const configDoc = await getDoc(doc(db, "artifacts", appId, "public", "data", "config", "managerPin"));
                if (configDoc.exists()) correctPin = configDoc.data().pin || PIN_HASH;
            } catch (e) {}

            if (pinEntry === correctPin) {
                setAuth();
                hidePinScreen();
                showToast('Welcome back!', 'success');
            } else {
                document.querySelectorAll('.pin-dot').forEach(dot => dot.classList.add('error'));
                document.getElementById('pinCard').classList.add('shake');
                document.getElementById('pinError').textContent = 'Incorrect PIN. Please try again.';
                setTimeout(() => {
                    document.getElementById('pinCard').classList.remove('shake');
                    pinEntry = '';
                    updatePinDots();
                }, 500);
            }
        }

        document.getElementById('pinKeypad').addEventListener('click', (e) => {
            const key = e.target.closest('.pin-key')?.dataset.key;
            if (key) handlePinKey(key);
        });

        document.addEventListener('click', resetAuthTimer);
        document.addEventListener('keydown', resetAuthTimer);
        setInterval(() => {
            if (document.getElementById('mainContent').style.display !== 'none' && !checkAuth()) {
                showPinScreen();
                showToast('Session expired. Please sign in again.', 'info');
            }
        }, 60000);

        // Utilities
        const color = t => TEAM_COLORS[t]?.color || '#21A0D8';
        const colorSoft = t => TEAM_COLORS[t]?.soft || 'rgba(33, 160, 216, 0.1)';
        const initials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();
        const capacityColor = c => c > 100 ? '#EF4444' : c >= 80 ? '#F59E0B' : '#22C55E';

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function formatDate(d) {
            if (!d) return '';
            const date = d.toDate ? d.toDate() : new Date(d);
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        }

        function formatDateTime(d) {
            if (!d) return '';
            const date = d.toDate ? d.toDate() : new Date(d);
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        function getWeekDates(offset = 0) {
            const today = new Date();
            const monday = new Date(today);
            monday.setDate(today.getDate() - today.getDay() + 1 + (offset * 7));
            return Array.from({length: 5}, (_, i) => {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                return d;
            });
        }

        function isWithinRange(date, start, end) {
            if (!start || !end) return false;
            const d = new Date(date).setHours(0,0,0,0);
            return d >= new Date(start).setHours(0,0,0,0) && d <= new Date(end).setHours(0,0,0,0);
        }

        const normalizeName = (name) => (name || '').toLowerCase().trim();
        const toNameArray = (value) => {
            if (!value) return [];
            if (Array.isArray(value)) return value.flatMap(item => typeof item === 'string' ? [item] : item?.name ? [item.name] : []);
            return typeof value === 'string' ? [value] : value?.name ? [value.name] : [];
        };

        const projectEffort = (p) => Number(p?.effortPTS ?? p?.effortPts ?? 0);
        const projectAssignees = (p) => ['assignedTo','assignee','owner','editor','producer','creativeLead','productionLead','designLead','designer'].flatMap(f => toNameArray(p?.[f])).map(normalizeName).filter(Boolean);
        const isProjectComplete = (p) => {
            const s = `${p?.status || p?.dealStage || ''}`.toLowerCase();
            return s.includes('complete') || s.includes('done') || s.includes('live');
        };

        function getWeeklyCapacity(person) {
            return Number(person.weeklyCapacityPTS ?? person.weeklyCapacityPts ?? person.maxHoursPerWeek ?? 40);
        }

        function getMemberEffort(person) {
            const name = normalizeName(`${person.firstName || ''} ${person.lastName || ''}`);
            let currentEffort = 0;
            projects.forEach(p => {
                if (!projectAssignees(p).includes(name) || isProjectComplete(p)) return;
                currentEffort += projectEffort(p);
            });
            const weeklyCapacity = getWeeklyCapacity(person);
            return { currentEffort, weeklyCapacity, utilization: weeklyCapacity > 0 ? (currentEffort / weeklyCapacity) * 100 : 0 };
        }

        window.closeModal = () => document.getElementById('modalOverlay').classList.remove('active');

        // ========== PROJECT DETAIL MODAL ==========

        window.openProjectDetailModal = (projectId) => {
            const p = projects.find(proj => proj.id === projectId);
            if (!p) return;

            const mergedStaff = getMergedStaff();
            const stageColor = getProjectStageColor(p.dealStage || p.status);
            const dueDate = p.dueDate ? new Date(p.dueDate).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : 'Not set';

            // Get assigned staff
            const creativeLead = p.creativeLead?.[0]?.name || p.creativeLead || 'Unassigned';
            const productionLead = p.productionLead?.[0]?.name || p.productionLead || 'Unassigned';
            const videoEditor = p.videoEditor?.[0]?.name || p.videoEditor || 'Unassigned';

            // Calculate budget info
            const budget = p.budget || p.totalBudget || 0;
            const spent = p.spent || p.actualSpend || 0;
            const remaining = budget - spent;
            const budgetPercent = budget > 0 ? Math.round((spent / budget) * 100) : 0;

            // Get deliverables count
            const movingAssets = p.movingAssetCount || 0;
            const staticAssets = p.staticAssetCount || 0;
            const totalAssets = movingAssets + staticAssets;

            // Find related change requests
            const projectRequests = pendingChanges.filter(c => c.projectId === projectId || c.projectTitle === p.title);

            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <div class="modal-header" style="background:linear-gradient(135deg, ${stageColor.color}15 0%, transparent 100%);">
                    <div style="flex:1;">
                        <div style="font-size:11px;font-weight:700;color:var(--ink-sub);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">${p.client || 'Internal Project'}</div>
                        <span class="modal-title" style="font-size:20px;">${p.title || 'Untitled Project'}</span>
                        <div style="display:flex;gap:8px;margin-top:8px;">
                            <span style="font-size:10px;font-weight:700;padding:4px 10px;border-radius:6px;background:${stageColor.bg};color:${stageColor.color};text-transform:uppercase;">${p.dealStage || p.status || 'Active'}</span>
                            ${p.vertical ? `<span style="font-size:10px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--surface-alt);color:var(--ink-sub);">${p.vertical}</span>` : ''}
                        </div>
                    </div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body" style="max-height:60vh;overflow-y:auto;">
                    <!-- Key Info Grid -->
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;">
                        <div style="background:var(--surface-alt);border-radius:var(--radius-sm);padding:14px;text-align:center;">
                            <div style="font-size:11px;color:var(--ink-sub);font-weight:600;margin-bottom:4px;">Due Date</div>
                            <div style="font-size:14px;font-weight:800;color:var(--ink);">${dueDate}</div>
                        </div>
                        <div style="background:var(--surface-alt);border-radius:var(--radius-sm);padding:14px;text-align:center;">
                            <div style="font-size:11px;color:var(--ink-sub);font-weight:600;margin-bottom:4px;">Deliverables</div>
                            <div style="font-size:14px;font-weight:800;color:var(--dmg-blue);">${totalAssets} total</div>
                            <div style="font-size:10px;color:var(--ink-sub);">${movingAssets} video • ${staticAssets} static</div>
                        </div>
                        <div style="background:var(--surface-alt);border-radius:var(--radius-sm);padding:14px;text-align:center;">
                            <div style="font-size:11px;color:var(--ink-sub);font-weight:600;margin-bottom:4px;">Format</div>
                            <div style="font-size:14px;font-weight:800;color:var(--ink);">${p.format || p.contentType || 'TBD'}</div>
                        </div>
                    </div>

                    <!-- Budget Section -->
                    <div style="background:var(--surface-alt);border-radius:var(--radius-sm);padding:18px;margin-bottom:20px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                            <div style="font-size:12px;font-weight:700;color:var(--ink);">Budget</div>
                            ${budget > 0 ? `<div style="font-size:11px;color:var(--ink-sub);">${budgetPercent}% spent</div>` : ''}
                        </div>
                        ${budget > 0 ? `
                            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:12px;">
                                <div>
                                    <div style="font-size:10px;color:var(--ink-sub);margin-bottom:2px;">Total Budget</div>
                                    <div style="font-size:18px;font-weight:900;color:var(--ink);">£${budget.toLocaleString()}</div>
                                </div>
                                <div>
                                    <div style="font-size:10px;color:var(--ink-sub);margin-bottom:2px;">Spent</div>
                                    <div style="font-size:18px;font-weight:900;color:var(--warning);">£${spent.toLocaleString()}</div>
                                </div>
                                <div>
                                    <div style="font-size:10px;color:var(--ink-sub);margin-bottom:2px;">Remaining</div>
                                    <div style="font-size:18px;font-weight:900;color:${remaining >= 0 ? 'var(--success)' : 'var(--danger)'};">£${remaining.toLocaleString()}</div>
                                </div>
                            </div>
                            <div class="capacity-bar" style="height:8px;">
                                <div class="capacity-fill" style="width:${Math.min(budgetPercent, 100)}%;background:${budgetPercent > 90 ? 'var(--danger)' : budgetPercent > 70 ? 'var(--warning)' : 'var(--success)'}"></div>

        function getProjectStageColor(stage) {

            if (s.includes('complete') || s.includes('live')) return { bg: 'rgba(67, 176, 73, 0.1)', color: '#43B049' };
            if (s.includes('edit') || s.includes('review')) return { bg: 'rgba(249, 115, 22, 0.1)', color: '#F97316' };
            if (s.includes('filming') || s.includes('shoot') || s.includes('production')) return { bg: 'rgba(33, 160, 216, 0.1)', color: '#21A0D8' };
            if (s.includes('agreed') || s.includes('briefed') || s.includes('pre-prod')) return { bg: 'rgba(139, 92, 246, 0.1)', color: '#8B5CF6' };
            return { bg: 'rgba(107, 114, 128, 0.1)', color: '#6B7280' };

            }));

                                <div class="stat-card" style="cursor:pointer;transition:all 0.15s var(--ease);" onclick="openOfficeOutlookModal('sick')" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                                    <div style="font-size:28px;margin-bottom:8px;">🤒</div>

        function renderCapacity() {
            const mergedStaff = getMergedStaff();
            const activeStaff = mergedStaff.filter(s => s.active !== false && s.status !== 'Inactive');

            // Calculate forecasted projects
            const forecastedProjects = projects.filter(p => {
                const stage = (p.dealStage || '').toLowerCase();
                const status = (p.status || p.productionWorkflowStatus || '').toLowerCase();
                return (stage.includes('agreed') || stage.includes('won')) && !status.includes('in production') && !status.includes('complete') && ((p.movingAssetCount > 0) || (p.staticAssetCount > 0));
            });
            const forecastedHours = forecastedProjects.reduce((sum, p) => sum + (p.movingAssetCount || 0) * 4 + (p.staticAssetCount || 0) * 2, 0);

            // Group staff by team
            const staffByTeam = {};
            TEAMS.forEach(t => staffByTeam[t] = []);
            staffByTeam['Unassigned'] = [];
            activeStaff.forEach(s => {
                const team = s.team || 'Unassigned';
                if (!staffByTeam[team]) staffByTeam[team] = [];
                staffByTeam[team].push(s);
            });
            const activeTeams = Object.entries(staffByTeam).filter(([_, members]) => members.length > 0);

            // Get person's assigned projects
            const getPersonProjects = (person) => {
                const name = `${person.firstName || ''} ${person.lastName || ''}`.toLowerCase();
                return projects.filter(p => {
                    const creative = (p.creativeLead?.[0]?.name || p.creativeLead || '').toLowerCase();
                    const production = (p.productionLead?.[0]?.name || p.productionLead || '').toLowerCase();
                    const editor = (p.videoEditor?.[0]?.name || p.videoEditor || '').toLowerCase();
                    return creative.includes(name.split(' ')[0]) || production.includes(name.split(' ')[0]) || editor.includes(name.split(' ')[0]);
                });
            };

            // Calculate team-level insights for forecasting
            const getTeamInsights = (teamName, members) => {
                const totalCapacity = members.reduce((sum, m) => sum + getWeeklyCapacity(m), 0);
                const currentEffort = members.reduce((sum, m) => sum + getMemberEffort(m).currentEffort, 0);
                const utilization = totalCapacity > 0 ? Math.round((currentEffort / totalCapacity) * 100) : 0;
                const availableHours = totalCapacity - currentEffort;
                const overloaded = members.filter(m => getMemberEffort(m).utilization > 100).length;
                const underutilized = members.filter(m => getMemberEffort(m).utilization < 50).length;
                return { totalCapacity, currentEffort, utilization, availableHours, overloaded, underutilized };
            };

            return `
                <!-- Forecasting Insights -->
                <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg, var(--surface) 0%, var(--dmg-blue-soft) 100%);">
                    <div class="card-header" style="border-bottom:none;">
                        <span class="card-title"><div class="dot-grid"><span></span><span></span><span></span><span></span></div>Capacity Forecast</span>
                    </div>
                    <div class="card-body" style="padding-top:0;">
                        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:16px;">
                            ${activeTeams.map(([teamName, members]) => {
                                const insights = getTeamInsights(teamName, members);
                                const needsHelp = insights.utilization > 85 || insights.overloaded > 0;
                                return `
                                    <div style="background:white;border-radius:var(--radius-sm);padding:16px;border-left:4px solid ${color(teamName)};">
                                        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
                                            <div style="font-size:13px;font-weight:700;color:var(--ink);">${teamName}</div>
                                            <div style="font-size:20px;font-weight:900;color:${capacityColor(insights.utilization)};">${insights.utilization}%</div>
                                        </div>
                                        <div class="capacity-bar" style="height:6px;margin-bottom:10px;"><div class="capacity-fill" style="width:${Math.min(insights.utilization, 100)}%;background:${capacityColor(insights.utilization)}"></div></div>
                                        <div style="font-size:11px;color:var(--ink-sub);margin-bottom:4px;">${members.length} members • ${insights.availableHours.toFixed(0)} hrs available</div>
                                        ${needsHelp ? `
                                            <div style="margin-top:8px;padding:8px;background:var(--warning-soft);border-radius:var(--radius-xs);font-size:11px;color:var(--warning);font-weight:600;">
                                                ${insights.overloaded > 0 ? `⚠️ ${insights.overloaded} overloaded` : '⚠️ Near capacity - may need freelancers'}
                                            </div>
                                        ` : insights.underutilized > 1 ? `
                                            <div style="margin-top:8px;padding:8px;background:var(--success-soft);border-radius:var(--radius-xs);font-size:11px;color:var(--success);font-weight:600;">
                                                ✓ ${insights.underutilized} available for more work
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}

                        ${forecastedProjects.length > 0 ? `

                                <div>
                                    <div style="font-size:12px;font-weight:700;color:var(--ink);">Pipeline Incoming</div>
                                    <div style="font-size:11px;color:var(--ink-sub);">${forecastedProjects.length} projects • ${forecastedHours} estimated hours</div>
                                </div>
                                <button class="btn btn-ghost btn-sm" onclick="setTab('projects')" style="font-size:11px;">View Projects →</button>
                            </div>
                        ` : ''}
                    </div>
                </div>

                <!-- Individual Capacity by Team -->
                ${activeTeams.map(([teamName, members]) => `
                    <div class="card" style="margin-bottom:16px;">
                        <div class="card-header">
                            <div style="display:flex;align-items:center;gap:10px;">
                                <div style="width:10px;height:10px;border-radius:50%;background:${color(teamName)};"></div>
                                <span class="card-title">${teamName}</span>
                            </div>
                            <span class="card-meta">${members.length} members</span>
                        </div>
                        <div class="card-body">
                            <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:12px;">

                                    const personProjects = getPersonProjects(s);
                                    return `
                                        <div style="background:var(--surface-alt);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all 0.15s var(--ease);border:1px solid transparent;" onclick="openStaffModal('${s.id}')" onmouseover="this.style.borderColor='var(--dmg-blue)';this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='transparent';this.style.transform=''">

                                                </div>

                                            </div>
                                            <div class="capacity-bar" style="height:6px;margin-bottom:8px;"><div class="capacity-fill" style="width:${Math.min(stats.utilization, 100)}%;background:${capacityColor(stats.utilization)}"></div></div>
                                            <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-sub);margin-bottom:8px;">

                                                <div style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px;">
                                                    <div style="font-size:9px;font-weight:700;color:var(--ink-sub);text-transform:uppercase;margin-bottom:4px;">Assigned (${personProjects.length})</div>
                                                    <div style="display:flex;flex-wrap:wrap;gap:4px;">
                                                        ${personProjects.slice(0, 3).map(p => `
                                                            <span style="font-size:9px;padding:2px 6px;background:var(--dmg-blue-soft);color:var(--dmg-blue);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px;" title="${p.title}">${p.title?.substring(0, 15) || 'Project'}${(p.title?.length || 0) > 15 ? '...' : ''}</span>
                                                        `).join('')}
                                                        ${personProjects.length > 3 ? `<span style="font-size:9px;padding:2px 6px;background:var(--surface);color:var(--ink-sub);border-radius:4px;">+${personProjects.length - 3}</span>` : ''}

                                                </div>
                                            ` : `
                                                <div style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px;">
