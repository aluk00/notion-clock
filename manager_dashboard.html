<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard | DMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --team-sales: #F97316;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 16px;
            color: var(--ink);
        }
        .dashboard { max-width: 1200px; margin: 0 auto; }
        .dashboard-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 6px);
            gap: 3px;
        }
        .dot-grid span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dmg-blue);
            animation: pulse 2.5s infinite ease-in-out;
        }
        .dot-grid span:nth-child(1) { animation-delay: 0s; }
        .dot-grid span:nth-child(2) { animation-delay: 0.15s; }
        .dot-grid span:nth-child(3) { animation-delay: 0.3s; }
        .dot-grid span:nth-child(4) { animation-delay: 0.45s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }
        .dashboard-title { font-size: 20px; font-weight: 900; color: var(--ink); }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }
        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .stat-value { font-size: 32px; font-weight: 900; color: var(--ink); }
        .stat-trend { font-size: 11px; font-weight: 600; margin-top: 6px; color: var(--ink-sub); }
        
        .section {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-title { font-size: 14px; font-weight: 800; color: var(--ink); }
        .section-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
            background: var(--bg-soft);
            color: var(--ink-sub);
        }
        
        .team-row {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #F5F5F5;
        }
        .team-row:last-child { border-bottom: none; }
        .team-color {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 12px;
        }
        .team-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            width: 120px;
        }
        .team-members {
            display: flex;
            gap: 4px;
            flex: 1;
            margin: 0 16px;
        }
        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #FFF;
        }
        .capacity-bar {
            width: 100px;
            height: 6px;
            background: #E5E5E5;
            border-radius: 3px;
            overflow: hidden;
            margin-right: 12px;
        }
        .capacity-fill { height: 100%; border-radius: 3px; }
        .capacity-value { font-size: 12px; font-weight: 800; width: 40px; text-align: right; }
        
        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-title { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
        .empty-sub { font-size: 12px; color: var(--ink-sub); max-width: 300px; margin: 0 auto; line-height: 1.5; }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--ink-sub);
            font-size: 13px;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--dmg-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div class="spinner"></div>
            Loading dashboard...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native",
            storageBucket: "dmg-command-centre-native.appspot.com",
            messagingSenderId: "223535956454",
            appId: "1:223535956454:web:b25e5bc69d8a4a7f209627"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Social Video': '#F2C316', 'Operations': '#9333EA', 'Sales': '#F97316'
        };

        let staff = [];
        let isLoading = true;
        const root = document.getElementById('root');

        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();

        function getTeamStats() {
            const teams = {};
            staff.forEach(s => {
                if (!teams[s.team]) {
                    teams[s.team] = { members: [], capacity: 0 };
                }
                teams[s.team].members.push(s);
                if (s.capacity) {
                    teams[s.team].capacity = Math.round(
                        teams[s.team].members.reduce((sum, m) => sum + (m.capacity || 0), 0) / teams[s.team].members.length
                    );
                }
            });
            return teams;
        }

        function render() {
            if (isLoading) {
                root.innerHTML = `<div class="loading"><div class="spinner"></div>Loading dashboard...</div>`;
                return;
            }

            const teamStats = getTeamStats();
            const totalStaff = staff.length;
            const totalManagers = staff.filter(s => s.isManager).length;
            const teamCount = Object.keys(teamStats).length;

            root.innerHTML = `
                <div class="dashboard">
                    <div class="dashboard-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h1 class="dashboard-title">Manager Dashboard</h1>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Team Members</div>
                            <div class="stat-value">${totalStaff}</div>
                            <div class="stat-trend">${totalStaff > 0 ? 'Active staff' : 'Add staff to get started'}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Teams</div>
                            <div class="stat-value">${teamCount}</div>
                            <div class="stat-trend">${teamCount > 0 ? 'Departments' : 'No teams yet'}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Team Leads</div>
                            <div class="stat-value">${totalManagers}</div>
                            <div class="stat-trend">${totalManagers > 0 ? 'Managers' : 'Assign managers'}</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-header">
                            <h2 class="section-title">Team Capacity</h2>
                            <span class="section-badge">${teamCount} Teams</span>
                        </div>
                        ${teamCount === 0 ? `
                            <div class="empty-state">
                                <div class="empty-icon">👥</div>
                                <div class="empty-title">No Teams Yet</div>
                                <div class="empty-sub">Add staff members to the staff_directory collection in Firebase to see team capacity here.</div>
                            </div>
                        ` : Object.entries(teamStats).map(([team, data]) => `
                            <div class="team-row">
                                <div class="team-color" style="background: ${getTeamColor(team)}"></div>
                                <div class="team-name">${team}</div>
                                <div class="team-members">
                                    ${data.members.slice(0, 6).map(m => `
                                        <div class="member-avatar" style="background: ${getTeamColor(team)}" title="${m.firstName} ${m.lastName}">
                                            ${getInitials(m.firstName, m.lastName)}
                                        </div>
                                    `).join('')}
                                    ${data.members.length > 6 ? `<div class="member-avatar" style="background: #999">+${data.members.length - 6}</div>` : ''}
                                </div>
                                <div class="capacity-bar">
                                    <div class="capacity-fill" style="width: ${data.capacity}%; background: ${data.capacity > 85 ? '#EF4444' : data.capacity > 70 ? '#F59E0B' : '#22C55E'}"></div>
                                </div>
                                <div class="capacity-value" style="color: ${data.capacity > 85 ? '#EF4444' : data.capacity > 70 ? '#F59E0B' : '#22C55E'}">${data.capacity}%</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function loadData() {
            try {
                const staffRef = collection(db, "artifacts", appId, "public", "data", "staff_directory");
                onSnapshot(staffRef, (snapshot) => {
                    staff = [];
                    snapshot.forEach(d => staff.push({ id: d.id, ...d.data() }));
                    isLoading = false;
                    render();
                }, (error) => {
                    console.error('Snapshot error:', error);
                    isLoading = false;
                    render();
                });
            } catch (e) {
                console.error('Load error:', e);
                isLoading = false;
                render();
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadData();
            } else {
                signInAnonymously(auth).catch(e => {
                    console.error('Auth failed:', e);
                    isLoading = false;
                    render();
                });
            }
        });
    </script>
</body>
</html>
