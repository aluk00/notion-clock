<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Management Hub | Live Cloud</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDK (Stable for Single File) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            /* Team Colours */
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-people: #21a0d8;
            --team-operations: #21a0d8;
            --team-executive: #1C1C1C;

            /* Status Colors */
            --st-office: #2E7D32;
            --st-wfh: #F9A825;
            --st-shoot: #2196F3;
            --st-pto: #F44336;
            --st-clienttravel: #6A1B9A;
            --st-weekend: #9E9E9E;
            --st-pending: #BDBDBD;
            
            /* Capacity Colors */
            --cap-good: #43B049;
            --cap-warn: #F2C316;
            --cap-danger: #E94B4B;

            /* UI Tokens */
            --carbon: #333;
            --bg-page: #FFFFFF;
            --bg-base: #FFFFFF;
            --border: #EAECEF;
            --ink: #333;
            --ink-sub: #757575;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.1);
            --shadow-glow-blue: 0 0 20px rgba(33, 160, 216, 0.2);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            margin: 0; padding: 0; color: var(--ink); min-height: 100vh;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        /* --- IMPACT ANIMATIONS --- */
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }
        @keyframes dotCycle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        @keyframes loader-bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* --- AUTH SCREEN --- */
        #lock-screen {
            position: fixed; inset: 0; background: var(--bg-base); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .header-dots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 44px; height: 44px; }
        .header-dots .dot { width: 100%; height: 100%; background-color: var(--team-people); border-radius: 50%; }
        #lock-screen .header-dots .dot { animation: dotCycle 3s infinite ease-in-out; }
        #lock-screen .header-dots .dot:nth-child(1) { animation-delay: 0s; }
        #lock-screen .header-dots .dot:nth-child(2) { animation-delay: 0.75s; }
        #lock-screen .header-dots .dot:nth-child(4) { animation-delay: 1.5s; }
        #lock-screen .header-dots .dot:nth-child(3) { animation-delay: 2.25s; }

        .pin-field { display: flex; gap: 12px; margin-bottom: 40px; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: 0.2s; }
        .pin-dot.filled { background: var(--team-people); border-color: var(--team-people); transform: scale(1.2); }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 280px; }
        .n-btn { 
            aspect-ratio: 1.3; border-radius: var(--radius-md); background: var(--bg-page); 
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; 
            font-size: 20px; font-weight: 700; cursor: pointer; color: var(--ink); 
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(33, 160, 216, 0.2);
        }
        .n-btn:hover {
            box-shadow: 0 0 15px rgba(33, 160, 216, 0.5);
            border-color: var(--team-people);
        }
        .n-btn:active, .n-btn.n-btn--active { background: #E0E0E0; transform: scale(0.95); }
        .n-btn-special {
            background-color: var(--team-people);
            color: #FFF;
            font-weight: 800;
        }
        .n-btn-special:hover {
            background-color: #1a8ac6;
            border-color: #1a8ac6;
        }


        /* --- LAYOUT --- */
        .main-container { max-width: 1360px; margin: 0 auto; padding: 40px; }
        .header-lockup { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 30px; }
        .title-text { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.04em; text-transform: uppercase; line-height: 1; color: var(--carbon); opacity: 0; transform: translateY(10px); animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        #app-shell .header-dots .dot { 
            animation: dotCycle 3s infinite ease-in-out;
            background-color: var(--team-people);
        }
        #app-shell .header-dots .dot:nth-child(1) { animation-delay: 0s; }
        #app-shell .header-dots .dot:nth-child(2) { animation-delay: 0.75s; }
        #app-shell .header-dots .dot:nth-child(3) { animation-delay: 1.5s; }
        #app-shell .header-dots .dot:nth-child(4) { animation-delay: 2.25s; }

        .nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
        .tab-nav { display: flex; gap: 8px; padding: 6px; background: #F8F9FA; border-radius: 99px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .tab-trigger { border: none; background: none; padding: 10px 24px; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; border-radius: 99px; color: var(--ink-sub); transition: 0.2s; letter-spacing: 0.05em; }
        .tab-trigger.active { background: var(--team-people); color: #FFF; box-shadow: 0 4px 12px rgba(33, 160, 216, 0.3); }

        .nav-row-right { display: flex; align-items: center; gap: 16px; }
        .header-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out;
            letter-spacing: 0.05em;
        }
        .btn-admin {
            background-color: #4A4A4A;
            color: #FFF;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
        }
        .btn-admin:hover {
            background-color: #666;
            box-shadow: var(--shadow-sm);
        }
        .btn-help {
            background-color: #FFF;
            color: var(--team-people);
            border: 2px solid var(--team-people);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: 900;
        }
        .btn-help:hover {
            transform: scale(1.1);
            background-color: #e3f2fd;
            box-shadow: var(--shadow-glow-blue);
        }

        .week-picker { display: flex; align-items: center; gap: 20px; background: var(--team-people); color: #FFF; padding: 12px 24px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); transition: opacity 0.3s, visibility 0.3s; }
        .week-picker.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .week-btn { background: rgba(255,255,255,0.1); border: none; color: #FFF; font-weight: 900; cursor: pointer; padding: 8px; font-size: 16px; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .week-btn:hover { background: rgba(255,255,255,0.2); }
        .week-label { font-size: 12px; font-weight: 800; text-transform: uppercase; min-width: 200px; text-align: center; letter-spacing: 0.1em; }
        .week-label .wc-prefix { color: #a1ddf7; }

        /* --- DIRECTORY TABLE --- */
        .directory-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; background: var(--bg-base); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-md); table-layout: fixed; }
        .directory-table th { text-align: left; padding: 20px; font-size: 10px; font-weight: 900; color: var(--team-people); text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--border); background: #FDFDFD; }
        .directory-table th:nth-child(1) { width: 35%; }
        .directory-table th:nth-child(2) { width: 30%; }
        .directory-table th:nth-child(3) { width: 15%; }
        .directory-table th:nth-child(4) { width: 20%; text-align: center;}
        .directory-table td { padding: 16px 20px; font-size: 14px; font-weight: 700; color: var(--ink); transition: background-color 0.2s; vertical-align: middle; }
        .directory-table tbody tr { border-bottom: 1px solid var(--border); }
        .directory-table tbody tr:last-child { border-bottom: none; }
        .directory-table tbody tr:hover td { background-color: #f7f7f7; }
        .name-cell { display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.2s; color: var(--ink); font-weight: 700; }
        .name-cell:hover { color: var(--team-people); }
        .name-dots { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; flex-shrink: 0; }
        .name-dots span { width: 6px; height: 6px; border-radius: 50%; }

        .role-cell { color: var(--ink-sub); font-size: 13px; font-weight: 600; }
        .stream-cell { text-transform: capitalize; font-size: 11px; font-weight: 800; }

        .status-cell { text-align: center; }
        .status-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; cursor: help; }
        .status-icon svg { width: 20px; height: 20px; }

        .is-mgr-pill { 
            font-size: 9px; background: var(--team-people); color: #FFF; padding: 4px 10px; 
            border-radius: 99px; vertical-align: middle; margin-left: 10px; font-weight: 900; 
            letter-spacing: 0.05em; line-height: 1; display: inline-block;
        }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(28,28,28,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 6000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-base); width: 100%; max-width: 700px; border-radius: var(--radius-lg); padding: 0; box-shadow: var(--shadow-lg); max-height: 90vh; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .modal-body { padding: 40px; max-height: calc(90vh - 80px); overflow-y: auto; }
        
        .modal-content-with-accent { position: relative; padding-left: 50px; }
        .modal-content-with-accent::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 10px;
            background-color: var(--modal-accent-color);
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
        }

        .modal-header-stacked { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .modal-mgr-name { font-size: 28px; font-weight: 900; margin: 0; letter-spacing: -0.03em; }
        .modal-sub-title { font-size: 14px; font-weight: 800; text-transform: uppercase; margin-top: 4px; }

        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 24px; font-weight: 800; color: #ccc; cursor: pointer; width: 40px; height: 40px; background: var(--bg-page); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; z-index: 10; }
        .close-btn:hover { color: var(--ink); transform: rotate(90deg); }
        
        .p-section-title { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--team-people); margin: 30px 0 15px 0; }
        .p-grid-large { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 44px; height: 44px; flex-shrink: 0; }
        .p-grid-large span { width: 100%; height: 100%; border-radius: 50%; }

        .p-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 25px; }
        .p-meta-card { padding: 20px; background: var(--bg-page); border-radius: var(--radius-md); border: 1.5px solid var(--border); }
        .p-meta-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #999; margin-bottom: 6px; display: block; letter-spacing: 0.05em; }
        .p-meta-val { font-size: 16px; font-weight: 900; }
        .p-meta-val.grey { color: var(--ink-sub); }
        .p-meta-val-container { display: flex; align-items: center; gap: 10px; }
        .profile-status-editor-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

        .presence-table { width: 100%; border-collapse: collapse; margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow:hidden; }
        .presence-table th { background: var(--bg-page); padding: 12px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--team-people); }
        .presence-table td { padding: 12px; text-align: center; border: 1px solid var(--border); font-size: 11px; font-weight: 800; }
        .presence-table tr.prior-week { opacity: 0.5; background-color: #f9f9f9; }
        .presence-table tr.prior-week td { color: #999; }

        .note-item { background: var(--bg-page); border: 1.5px solid var(--border); padding: 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; line-height: 1.5; color: var(--ink); margin-bottom: 10px; border-left: 5px solid; position: relative; }
        .note-meta { position: absolute; top: 16px; right: 16px; font-size: 10px; color: var(--ink-sub); font-weight: 700; }

        .request-item { background: var(--bg-page); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; }
        .request-name-link { font-size: 18px; font-weight: 900; cursor: pointer; color: var(--ink); }
        .request-name-link:hover { color: var(--team-people); text-decoration: underline; }

        .pill-btn { border: none; padding: 6px 14px; border-radius: 99px; font-size: 10px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; margin-top: 4px; display: inline-block; letter-spacing: 0.05em; }
        .pill-suggest { background: var(--team-people); color: #FFF; }
        .pill-update { background: #E0E0E0; color: #333; padding: 4px 10px; font-size: 9px; margin: 0; }
        .pill-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }

        .pattern-editor { background: #FFF; border: 1.5px solid var(--border); padding: 20px; border-radius: var(--radius-md); margin-top: 15px; box-shadow: var(--shadow-sm); }
        .editor-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 15px; }
        .editor-grid.five-day { grid-template-columns: repeat(5, 1fr); }
        .editor-select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; font-weight: 800; background: var(--bg-page); }
        .editor-day-label { font-size: 10px; font-weight: 800; color: var(--ink-sub); text-transform: uppercase; text-align: center; margin-bottom: 4px; }
        
        .btn-action { padding: 14px 20px; border: none; border-radius: var(--radius-sm); font-size: 11px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 0.05em; min-height: 45px; }
        .btn-action:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-approve { background: var(--st-office); color: #FFF; }
        .btn-deny { background: var(--team-editorial); color: #FFF; }
        .btn-sync { background-color: var(--team-people); color: #FFF; }
        .btn-success { background-color: var(--st-office); color: #FFF; }
        .btn-post {
            background-color: var(--team-people); color: #FFF;
            box-shadow: 0 0 8px rgba(33, 160, 216, 0.4);
        }
        .btn-post:hover {
            box-shadow: 0 0 15px rgba(33, 160, 216, 0.7);
        }
        .btn-action:disabled { cursor: not-allowed; opacity: 0.7; }

        .btn-action .sync-loader { display: flex; justify-content: center; align-items: center; gap: 5px; height: 15px; }
        .btn-action .sync-loader span { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: loader-bounce 1.2s infinite ease-in-out; }
        .btn-action .sync-loader span:nth-child(2) { animation-delay: -0.16s; }
        .btn-action .sync-loader span:nth-child(3) { animation-delay: -0.32s; }
        .btn-action .sync-tick { width: 24px; height: 24px; transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); transform: scale(0); fill: currentColor; }
        .btn-success .sync-tick { transform: scale(1); }
        
        .modal-action-bar { margin-bottom: 25px; }
        .btn-back {
            background: #f0f0f0; color: var(--ink); padding: 10px 16px;
        }
        .btn-back:hover { background: #e0e0e0; box-shadow: var(--shadow-sm); }


        /* --- GRANULAR APPROVAL STYLES --- */
        .approval-strip-container {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }
        .approval-strip { 
            display: flex; 
            gap: 12px; 
            min-width: min-content; 
        }
        .approval-day { 
            background: #f4f6f8; 
            border-radius: var(--radius-md); 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            border: 2px solid transparent; 
            transition: 0.3s; 
            position: relative; 
            flex: 0 0 130px; /* Consistent card width */
        }
        .approval-day.decided-yes { border-color: var(--st-office); background: #e8f5e9; }
        .approval-day.decided-no { border-color: var(--st-pto); background: #ffebee; }
        .approval-day.decided-suggest { border-color: var(--st-wfh); background: #fffde7; }
        
        .day-title { font-size: 10px; font-weight: 900; color: #999; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em; }
        .requested-status { font-size: 14px; font-weight: 900; color: var(--carbon); margin-bottom: 12px; }
        
        .decision-group { display: flex; gap: 6px; }
        .dec-btn { 
            width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border); 
            background: #FFF; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.2s; font-size: 14px; font-weight: 800;
        }
        .dec-btn:hover { border-color: var(--carbon); }
        .dec-btn.active-yes { background: var(--st-office); color: #FFF; border-color: var(--st-office); }
        .dec-btn.active-no { background: var(--st-pto); color: #FFF; border-color: var(--st-pto); }
        .dec-btn.active-suggest { background: var(--st-wfh); color: #FFF; border-color: var(--st-wfh); }
        
        .day-comment-input {
            width: 100%; margin-top: 10px; padding: 8px; font-size: 11px; font-weight: 600;
            border: 1px solid var(--border); border-radius: 8px; outline: none;
        }

        /* --- CAPACITY CARD STYLES --- */
        .capacity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .capacity-card {
            background: #FFF; border: 1.5px solid var(--border); border-radius: var(--radius-md);
            padding: 24px; transition: 0.3s; cursor: pointer; position: relative; overflow: hidden;
        }
        .capacity-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: #CCC; }
        
        .cap-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px; }
        .cap-name-role-container { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .cap-name { font-size: 18px; font-weight: 900; color: var(--ink); margin: 0; }
        .cap-role { font-size: 14px; font-weight: 700; text-transform: none; letter-spacing: normal; margin: 0; padding-bottom: 2px; }
        .cap-team-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }

        .cap-bar-bg { width: 100%; height: 8px; background: #F0F0F0; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
        .cap-bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); position: relative; }
        .cap-bar-fill:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 140%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--carbon);
            color: #FFF;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            z-index: 10;
        }
        
        .cap-stats { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink); }
        .cap-load-text { color: var(--ink-sub); }
        .cap-project-count { background: #F3F4F6; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; }

        /* Project Modal Styles */
        .pm-staff-name { font-size: 28px; font-weight: 900; margin: 5px 0 0 0; color: var(--carbon); cursor: pointer; transition: color 0.2s; display: inline-block; }
        .pm-staff-name:hover { color: var(--team-people); }
        .pm-project-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .pm-project-card { 
            border: 1px solid var(--border); padding: 16px; border-radius: 12px; background: #FAFAFA;
            display: flex; justify-content: flex-start; align-items: center; transition: all 0.2s ease-out;
            text-decoration: none;
        }
        .pm-project-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow-blue);
            border-color: var(--team-people);
        }
        .pm-title { font-weight: 800; font-size: 14px; margin-bottom: 4px; color: var(--ink); }
        .pm-meta { font-size: 11px; color: var(--ink-sub); font-weight: 600; text-transform: uppercase; }

        Leave: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>`,
        Weekend: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>`,

    };

    function getStatusIcon(status) {
        const iconSvg = statusIcons[status] || statusIcons['Pending'];
        const color = statusColors[status.replace(/ /g, '')] || statusColors.Pending;
        return `<div class="status-icon" title="${status}" style="background-color: ${color}20; color: ${color};">${iconSvg}</div>`;
    }

    const getTodayIndex = () => {
        const day = new Date().getDay(); // 0=sun, 1=mon, ..., 6=sat
        return day === 0 ? 6 : day - 1; // Mon=0, Tue=1, ..., Sun=6
    };

    function getInitialMonday() {
        const today = new Date();
        const dayOfWeek = today.getDay(); // 0=Sun, 1=Mon...
        
        if (dayOfWeek === 0) { // If today is Sunday, forecast to next Monday
            today.setDate(today.getDate() + 1);
        } else { // Otherwise, go to this week's Monday
            const offset = dayOfWeek - 1; 
            today.setDate(today.getDate() - offset);
        }
        today.setHours(0, 0, 0, 0);
        return today;
    }
    
    let currentMonday = getInitialMonday();
    let selectedDayIdx = new Date().getDay() === 0 ? 0 : getTodayIndex();
    let pin = "";
    let listenersInitialised = false;

    const clearPin = () => {
        pin = "";
        document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled'));
    };
    
    const press = (n) => {
        if (pin.length >= 4) return;
        pin += n;
        document.getElementById('p'+pin.length).classList.add('filled');
        if(pin.length === 4) {
            setTimeout(() => {
                if(pin === "2025") {
                    document.getElementById('lock-screen').style.opacity = '0';
                    setTimeout(() => { 
                        document.getElementById('lock-screen').classList.add('hidden'); 
                        document.getElementById('app-shell').classList.remove('hidden'); 
                    }, 500);
                } else { 
                    clearPin();
                }
            }, 200);
        }
    };

    function setupPinPad() {
        document.querySelector('.numpad').addEventListener('click', (event) => {
            const target = event.target;
            const button = target.closest('.n-btn');
            if (button) {
                const value = button.dataset.value;
                if (value === 'clear') {
                    clearPin();
                } else if (value) {
                    press(parseInt(value, 10));
                }
            }
        });

        document.addEventListener('keydown', (event) => {
            const lockScreen = document.getElementById('lock-screen');
            if (lockScreen && !lockScreen.classList.contains('hidden')) {
                const key = event.key;
                let buttonToAnimate = null;
                
                if (key >= '0' && key <= '9') {
                    press(parseInt(key, 10));
                    buttonToAnimate = document.querySelector(`.n-btn[data-value="${key}"]`);
                } else if (key === 'Backspace' || key === 'Delete') {
                    clearPin();
                    buttonToAnimate = document.querySelector('.n-btn[data-value="clear"]');
                }

                if (buttonToAnimate) {
                    event.preventDefault();
                    buttonToAnimate.classList.add('n-btn--active');
                    setTimeout(() => { 
                        buttonToAnimate.classList.remove('n-btn--active');
                    }, 150);
                }
            }
        });
    }
    setupPinPad();

    const todayBtn = document.getElementById('today-btn');
    if (todayBtn) {
        todayBtn.addEventListener('click', () => window.jumpToToday());
    }

    auth.onAuthStateChanged((user) => {
        if (user && !listenersInitialised) {
            listenersInitialised = true;
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('staff_directory')
                .onSnapshot(snap => { staffList = []; snap.forEach(d => staffList.push({id: d.id, ...d.data()})); updateUI(); });
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rota_submissions')
                .onSnapshot(snap => { rotaSubmissions = []; snap.forEach(d => rotaSubmissions.push(d.data())); updateUI(); });
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rota_responses')
                .onSnapshot(snap => { rotaResponses = []; snap.forEach(d => rotaResponses.push({id: d.id, ...d.data()})); updateUI(); });
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('staff_notes')
                .onSnapshot(snap => { staffNotes = []; snap.forEach(d => staffNotes.push({id: d.id, ...d.data()})); updateUI(); });
            projectList = DUMMY_PROJECTS;
        }
    });
    
    auth.signInAnonymously().catch((error) => console.error("Anonymous sign-in failed:", error));

    function updateUI() {
        if (!listenersInitialised) return;
        currentMonday.setHours(0,0,0,0);
        const weekEndDate = new Date(currentMonday);
        weekEndDate.setDate(weekEndDate.getDate() + 6);
        const startDateFormatted = currentMonday.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
        const endDateFormatted = weekEndDate.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
        document.getElementById('wc-label').innerHTML = `<span class="wc-prefix">W/C</span> ${startDateFormatted} - ${endDateFormatted}`;
        renderDayScroller();
        renderOutlook();
        renderTeamsGrid();
        renderApprovals();
        renderWorkload();
    }

    window.changeWeek = (offset) => { currentMonday.setDate(currentMonday.getDate() + (offset * 7)); updateUI(); };
    window.selectDay = (idx) => { selectedDayIdx = idx; updateUI(); };
    
    window.jumpToToday = () => {
        const today = new Date();
        const dayOfWeek = today.getDay();
        const offset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
        const mondayOfCurrentWeek = new Date(today);
        mondayOfCurrentWeek.setDate(today.getDate() - offset);
        mondayOfCurrentWeek.setHours(0, 0, 0, 0);
        currentMonday = mondayOfCurrentWeek;
        selectedDayIdx = getTodayIndex();
        updateUI();
    };

    function renderDayScroller() {
        const mount = document.getElementById('day-mount');
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        mount.innerHTML = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'].map((d, i) => {
            const date = new Date(currentMonday.getTime());
            date.setDate(date.getDate() + i);
            const isToday = date.getTime() === today.getTime();
            const todayClass = isToday ? 'is-today' : '';
            return `<div class="day-pill ${selectedDayIdx === i ? 'active' : ''} ${todayClass}" onclick="selectDay(${i})">${d.substring(0,3)} ${date.getDate()} ${date.toLocaleDateString('en-GB', {month:'short'})}</div>`;
        }).join('');
    }

    function renderOutlook() {
        const mount = document.getElementById('directory-mount');
        if (staffList.length === 0) {
            mount.innerHTML = `<tr><td colspan="4" class="table-loader">Loading Directory...</td></tr>`;
            return;
        }
        const wcStr = currentMonday.toISOString().split('T')[0];
        const viewedDate = new Date(currentMonday);
        viewedDate.setDate(viewedDate.getDate() + selectedDayIdx);
        const isViewedDayWeekend = (viewedDate.getDay() === 0 || viewedDate.getDay() === 6);
        const table = document.getElementById('view-outlook').querySelector('.directory-table');
        if (table) {
            const headerCell = table.rows[0].cells[3];
            if (headerCell) {
                headerCell.innerHTML = `Status for ${viewedDate.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' })}`;
            }
        }
        const weekendLockedCards = ['Office', 'WFH', 'Leave'];
        const allCards = ['Office', 'WFH', 'Shoot', 'OffSite', 'Leave'];
        allCards.forEach(id => {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                const isLocked = isViewedDayWeekend && weekendLockedCards.includes(id);
                card.classList.toggle('locked', isLocked);
            }
        });
        const counts = { Office: 0, WFH: 0, Shoot: 0, OffSite: 0, Leave: 0 };
        mount.innerHTML = staffList.sort((a,b) => a.firstName.localeCompare(b.firstName)).map(s => {
            const fullName = `${s.firstName} ${s.lastName}`;
            const sub = rotaSubmissions.find(sub => normalize(sub.name) === normalize(fullName) && sub.weekId === wcStr);
            let rawStatus = 'Office';
            if (sub && sub.schedule && sub.schedule[selectedDayIdx]) {
                rawStatus = sub.schedule[selectedDayIdx].status;
            }
            let status = isViewedDayWeekend ? 'Weekend' : (rawStatus || 'Office');
            if (isViewedDayWeekend && ['Shoot', 'Client / Travel'].includes(rawStatus)) {
                status = rawStatus;
            }
            let countKey = ['PTO','Leave','Abroad'].includes(status) ? 'Leave' 
                         : status === 'Shoot' ? 'Shoot'
                         : status === 'Client / Travel' ? 'OffSite'
                         : status;
            if (counts[countKey] !== undefined) {
                 counts[countKey]++;
            }
            const color = teamColors[s.team] || '#CCC';
            const dots = `<div class="name-dots">${Array(4).fill(`<span style="background:${color}"></span>`).join('')}</div>`;
            return `<tr>
                        <td class="name-cell" onclick="openStaffProfile('${s.id}')">${dots} <span>${fullName} ${s.isManager ? '<span class="is-mgr-pill">MGR</span>' : ''}</span></td>
                        <td class="role-cell">${s.role}</td>
                        <td class="stream-cell" style="color:${color};">${s.team}</td>
                        <td class="status-cell">${getStatusIcon(status)}</td>
                    </tr>`;
        }).join('');
        document.getElementById('count-office').innerText = String(isViewedDayWeekend ? 0 : counts.Office);
        document.getElementById('count-wfh').innerText = String(isViewedDayWeekend ? 0 : counts.WFH);
        document.getElementById('count-shoot').innerText = String(counts.Shoot);
        document.getElementById('count-offsite').innerText = String(counts.OffSite);
        document.getElementById('count-leave').innerText = String(isViewedDayWeekend ? 0 : counts.Leave);
    }

    function renderTeamsGrid() {
        const mount = document.getElementById('teams-grid-mount');
        if (staffList.length === 0) {
            mount.innerHTML = `<div class="table-loader">Loading Team Schedules...</div>`;
            return;
        }
        const wcStr = currentMonday.toISOString().split('T')[0];
        const dayHeaders = Array.from({ length: 7 }).map((_, i) => {
            const date = new Date(currentMonday);
            date.setDate(date.getDate() + i);
            const dayName = date.toLocaleDateString('en-GB', { weekday: 'short' });
            const dayOfMonth = date.getDate();
            return `<th class="status-cell-grid status-cell-grid-header">${dayName} ${dayOfMonth}</th>`;
        }).join('');
        mount.innerHTML = ['Editorial', 'Production', 'Creative', 'Social', 'Operations', 'Executive'].map(v => {
            const members = staffList.filter(s => s.team === v);
            if(members.length === 0) return "";
            const vCol = teamColors[v];
            const homeLink = teamHomepages[v];
            const homeIcon = `<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"/></svg>`;
            const homeButton = homeLink ? `<a href="${homeLink}" target="_blank" class="team-home-btn" style="background-color: ${vCol}">${homeIcon}</a>` : '';
            return `<div class="team-block">
                        <div class="stream-header">
                            <div class="stream-header-title">
                                <div class="stream-dot" style="background:${vCol}"></div>
                                <span>${v} Stream</span>
                            </div>
                            ${homeButton}
                        </div>
                        <table class="directory-table">
                            <thead><tr><th>Name</th>${dayHeaders}</tr></thead>
                            <tbody>${members.sort((a,b)=>a.firstName.localeCompare(b.firstName)).map(m => {
                                const fullName = `${m.firstName} ${m.lastName}`;
                                const sub = rotaSubmissions.find(s => normalize(s.name) === normalize(fullName) && s.weekId === wcStr);
                                let weeklySchedule = (sub && sub.schedule) ? [...sub.schedule] : Array(7).fill({ status: 'Pending' });
                                while (weeklySchedule.length < 7) {
                                    weeklySchedule.push({ status: weeklySchedule.length < 5 ? 'Pending' : 'Weekend' });
                                }
                                const color = teamColors[m.team] || '#CCC';
                                const dots = `<div class="name-dots">${Array(4).fill(`<span style="background:${color}"></span>`).join('')}</div>`;
                                return `<tr>
                                    <td class="name-cell name-cell-teams" onclick="openStaffProfile('${m.id}')">
                                        ${dots}
                                        <div class="name-role-container">
                                            <span class="name-text">${fullName}</span>
                                            <span class="role-text-inline">${m.role}</span>
                                        </div>
                                    </td>
                                    ${weeklySchedule.map((day) => `<td class="status-cell-grid">${getStatusIcon(day.status || 'Pending')}</td>`).join('')}
                                </tr>`;
                            }).join('')}</tbody>
                        </table>
                    </div>`;
        }).join('');
    }

    function renderApprovals() {
        const mount = document.getElementById('approvals-mount');
        if (staffList.length === 0) {
            mount.innerHTML = `<div class="table-loader">Loading Manager Approvals...</div>`;
            return;
        }
        const wcStr = currentMonday.toISOString().split('T')[0];
        mount.innerHTML = staffList.filter(s => s.isManager).sort((a,b) => a.firstName.localeCompare(b.firstName)).map(m => {
            const name = `${m.firstName} ${m.lastName}`;
            const reports = staffList.filter(s => s.manager === name);
            if(reports.length === 0) return "";
            const pendingCount = reports.filter(r => {
                const fName = `${r.firstName} ${r.lastName}`;
                const hasResp = rotaResponses.some(res => normalize(res.staffName) === normalize(fName) && res.weekCommencing === wcStr);
                const hasSubmission = rotaSubmissions.some(sub => normalize(sub.name) === normalize(fName) && sub.weekId === wcStr);
                return hasSubmission && !hasResp;
            }).length;
            const accent = teamColors[m.team] || '#1C1C1C';
            let specialClass = '';
            if (name.includes('Ellie')) specialClass = 'manager-card-ellie';
            if (name.includes('Nathan')) specialClass = 'manager-card-nathan';
            return `<div class="manager-card ${specialClass}" style="--accent-color: ${accent}" onclick="openApprovalWorkspace('${m.id}')"><div class="mgr-name">${name}</div><div class="mgr-pending-alert ${pendingCount > 0 ? 'urgent' : 'all-clear'}">${pendingCount > 0 ? `${pendingCount} Pending Action${pendingCount > 1 ? 's' : ''}` : 'All Clear'}</div></div>`;
        }).join('');
    }

    // --- WORKLOAD VIEW LOGIC ---
    function renderWorkload() {
        const mount = document.getElementById('workload-mount');
        if (staffList.length === 0) {
            mount.innerHTML = `<div class="table-loader"><div class="header-dots" style="margin: 0 auto 20px;"><div class="dot" style="background-color:var(--team-creative); animation-delay: 0s;"></div><div class="dot" style="background-color:var(--team-production); animation-delay: 0.2s;"></div><div class="dot" style="background-color:var(--team-production); animation-delay: 0.4s;"></div><div class="dot" style="background-color:var(--team-creative); animation-delay: 0.6s;"></div></div>Loading Capacity Data...</div>`;
            return;
        }
        const targetRoles = ['designer', 'editor', 'producer', 'creative', 'lead'];
        let workloadStaff = staffList.filter(s => {
            const role = (s.role || '').toLowerCase();
            return targetRoles.some(tr => role.includes(tr));
        });

        if (isOnlyShowingActiveProjects) {
            workloadStaff = workloadStaff.filter(s => {
                 const fullName = `${s.firstName} ${s.lastName}`;
                 const normName = normalize(fullName).replace(/\s+/g, '');
                 const projectIds = DUMMY_ASSIGNMENTS[normName] || [];
                 return projectIds.length > 0;
            });
        }
        
        const teamsToRender = isProductionFilterActive ? ['Production'] : ['Editorial', 'Production', 'Creative', 'Social', 'Operations', 'Executive'];

        mount.innerHTML = teamsToRender.map(teamName => {
            const members = workloadStaff.filter(s => s.team === teamName).sort((a,b) => a.firstName.localeCompare(b.firstName));
            if (members.length === 0) return "";
            
            const teamColor = teamColors[teamName];
            
            // Team capacity warning calculation
            let totalPercentage = 0;
            members.forEach(s => {
                 const fullName = `${s.firstName} ${s.lastName}`;
                 const normName = normalize(fullName).replace(/\s+/g, '');
                 const projectIds = DUMMY_ASSIGNMENTS[normName] || [];
                 const userProjects = projectList.filter(p => projectIds.includes(p.id));
                 const currentLoad = userProjects.reduce((sum, p) => sum + (p.effortScore || 0), 0);
                 let weeklyCapacity = 5; 
                 if (s.role.toLowerCase().includes('lead')) weeklyCapacity = 6;
                 if (s.role.toLowerCase().includes('junior')) weeklyCapacity = 4;
                 totalPercentage += weeklyCapacity > 0 ? (currentLoad / weeklyCapacity) * 100 : 0;
            });
            const averageCapacity = members.length > 0 ? totalPercentage / members.length : 0;
            const capacityWarningIcon = averageCapacity > 85 ? `<svg class="team-warning-icon" title="Team capacity is high (${Math.round(averageCapacity)}%)" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>` : '';

            const memberCards = members.map(s => {
                const fullName = `${s.firstName} ${s.lastName}`;
                const normName = normalize(fullName).replace(/\s+/g,'');
                const projectIds = DUMMY_ASSIGNMENTS[normName] || [];
                const userProjects = projectList.filter(p => projectIds.includes(p.id));
                const currentLoad = userProjects.reduce((sum, p) => sum + (p.effortScore || 0), 0);
                
                let weeklyCapacity = 5; 
                if (s.role.toLowerCase().includes('lead')) weeklyCapacity = 6;
                if (s.role.toLowerCase().includes('junior')) weeklyCapacity = 4;

                const percentage = weeklyCapacity > 0 ? (currentLoad / weeklyCapacity) * 100 : 0;
                const clampedPercentage = Math.min(percentage, 100);
                
                let colorVar = '--cap-good';
                if (percentage >= 100) colorVar = '--cap-danger';
                else if (percentage >= 80) colorVar = '--cap-warn';
                
                return `
                <div class="capacity-card" onclick="openProjectModal('${s.id}')">
                    <div class="cap-header">
                        <div>
                            <div class="cap-name-role-container">
                                <h3 class="cap-name">${fullName}</h3>
                                <p class="cap-role" style="color:${teamColor}">${s.role}</p>
                            </div>
                        </div>
                        <div class="name-dots">${Array(4).fill(`<span style="background:${teamColor}"></span>`).join('')}</div>
                    </div>
                    <div class="cap-bar-bg">
                        <div class="cap-bar-fill" style="width:${clampedPercentage}%; background:var(${colorVar})" data-tooltip="${Math.round(percentage)}%"></div>
                    </div>
                    <div class="cap-stats">
                        <span class="cap-load-text">${currentLoad} / ${weeklyCapacity} Capacity</span>
                        <span class="cap-project-count">${userProjects.length} Active Projects</span>
                    </div>
                </div>`;
            }).join('');
            
            return `<div class="team-block">
                <div class="stream-header">
                    <div class="stream-header-title">
                        <div class="stream-dot" style="background:${teamColor}"></div>
                        <span>${teamName} Stream</span>
                        ${capacityWarningIcon}
                    </div>
                </div>
                <div class="capacity-grid">${memberCards}</div>
            </div>`;
        }).join('');
    }

    window.openProjectModal = (staffId) => {
        const mount = document.getElementById('modal-mount');
        const s = staffList.find(x => x.id === staffId);
        if (!s) return;
        const teamCol = teamColors[s.team];
        mount.innerHTML = `<div class="modal-loader"><div class="header-dots">${Array(4).fill(`<div class="dot" style="background-color:${teamCol}"></div>`).join('')}</div></div>`;
        document.getElementById('global-modal').classList.add('active');
        setTimeout(() => {
            const fullName = `${s.firstName} ${s.lastName}`;
            const normName = normalize(fullName).replace(/\s+/g,'');
            const projectIds = DUMMY_ASSIGNMENTS[normName] || [];
            const userProjects = projectList.filter(p => projectIds.includes(p.id));
            const currentLoad = userProjects.reduce((sum, p) => sum + (p.effortScore || 0), 0);
            let weeklyCapacity = 5; 
            if (s.role.toLowerCase().includes('lead')) weeklyCapacity = 6;
            if (s.role.toLowerCase().includes('junior')) weeklyCapacity = 4;
            const percentage = weeklyCapacity > 0 ? (currentLoad / weeklyCapacity) * 100 : 0;
            const clampedPercentage = Math.min(percentage, 100);
            let colorVar = '--cap-good';
            if (percentage >= 100) colorVar = '--cap-danger';
            else if (percentage >= 80) colorVar = '--cap-warn';
            let statusText = 'Available';
            if (percentage >= 100) statusText = 'Overloaded';
            else if (percentage >= 99) statusText = 'At Capacity';
            else if (currentLoad === 0) statusText = 'Free';

            const projectOptions = DUMMY_PROJECTS.map(p => `<option value="${p.id}">${p.title}</option>`).join('');

            mount.innerHTML = `
                <div class="close-btn" onclick="closeModal()">×</div>
                <div class="modal-body">
                    <div style="margin-bottom: 20px;">
                        <div style="font-size:10px; font-weight:800; text-transform:uppercase; color:#999; letter-spacing:0.05em;">Active Workload</div>
                        <h2 class="pm-staff-name" onclick="openProfileFromWorkload('${s.id}')" title="View Full Profile">${fullName}</h2>
                    </div>
                    <div style="margin-bottom: 25px;">
                        <div class="cap-stats" style="margin-bottom: 8px;">
                            <span style="color:var(${colorVar}); font-size:11px; font-weight:800; text-transform:uppercase;">${statusText}</span>
                            <span class="cap-load-text"><b>${currentLoad}</b> / ${weeklyCapacity} Capacity</span>
                        </div>
                        <div class="cap-bar-bg">
                            <div class="cap-bar-fill" style="width:${clampedPercentage}%; background-color:var(${colorVar})"></div>
                        </div>
                    </div>
                    <h3 style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 12px; letter-spacing: 0.05em;">Active Projects (${userProjects.length})</h3>
                    ${userProjects.length > 0 ? `
                        <div class="pm-project-list">
                            ${userProjects.map(p => `
                                <a href="${p.notionUrl}" class="pm-project-card" onclick="openProjectLink(event, '${p.notionUrl}')">
                                    <div>
                                        <div class="pm-title">${p.title}</div>
                                        <div class="pm-meta">${p.projectType} • <span style="color:var(--team-people)">${p.status}</span></div>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    ` : `<div style="text-align:center; padding:40px; color:#999; font-weight:600; font-size:14px;">No active projects assigned.</div>`}

                    <div class="pm-actions">
                        <div class="pm-add-project-container">
                             <button class="btn-action btn-sync" style="width:100%" onclick="this.nextElementSibling.classList.toggle('hidden')">Add Project</button>
                             <select class="project-select hidden" onchange="console.log('Selected project:', this.value)">
                                <option disabled selected>Select a project to add...</option>
                                ${projectOptions}
                             </select>
                        </div>
                    </div>
                </div>
            `;
        }, 250);
    };
    
    window.showStatusList = (statusType) => {
        const mount = document.getElementById('modal-mount');
        mount.innerHTML = `<div class="modal-loader"><div class="header-dots">${Array(4).fill(`<div class="dot"></div>`).join('')}</div></div>`;
        document.getElementById('global-modal').classList.add('active');

        setTimeout(() => {
            const viewedDate = new Date(currentMonday);
            viewedDate.setDate(viewedDate.getDate() + selectedDayIdx);
            const isViewedDayWeekend = (viewedDate.getDay() === 0 || viewedDate.getDay() === 6);
            if (isViewedDayWeekend && !['Shoot', 'OffSite'].includes(statusType)) {
                window.closeModal();
                return;
            }
            const wcStr = currentMonday.toISOString().split('T')[0];
            const staffWithStatus = staffList.map(s => {
                const fullName = `${s.firstName} ${s.lastName}`;
                const sub = rotaSubmissions.find(sub => normalize(sub.name) === normalize(fullName) && sub.weekId === wcStr);
                const status = (sub && sub.schedule[selectedDayIdx]) ? sub.schedule[selectedDayIdx].status : 'Office';
                return { ...s, currentStatus: status };
            }).filter(s => {
                if (statusType === 'Leave') return ['PTO', 'Leave', 'Abroad'].includes(s.currentStatus);
                if (statusType === 'Shoot') return s.currentStatus === 'Shoot';
                if (statusType === 'OffSite') return s.currentStatus === 'Client / Travel';
                return s.currentStatus === statusType;
            });
            const dotsHTML = `<div class="status-modal-dots">${Array(4).fill(`<span></span>`).join('')}</div>`;
            mount.innerHTML = `
                <div class="close-btn" onclick="closeModal()">×</div>
                <div class="modal-body">
                    <div class="status-modal-header">
                        <span class="status-modal-title-prefix">Status</span>
                        ${dotsHTML}
                        <span class="status-modal-title-main">${statusType}</span>
                    </div>
                    <div style="font-size:10px; font-weight:800; color:#999; text-transform:uppercase; margin-bottom:20px;">For ${viewedDate.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })}</div>
                    <div>
                        ${staffWithStatus.length > 0 ? staffWithStatus.map(s => {
                            let detail = s.team;
                            let isStreamDetail = true;
                            if (statusType === 'Leave') { detail = "PTO"; isStreamDetail = false; }
                            if (s.currentStatus === 'PTO' && Math.random() > 0.8) { detail = "Sick Day"; isStreamDetail = false; }
                            if (statusType === 'Shoot' || statusType === 'OffSite') { detail = Math.random() > 0.5 ? "Full Day" : "9am - 1pm"; isStreamDetail = false; }
                            const detailStyle = isStreamDetail ? `style="color: ${teamColors[s.team]}; font-weight: 700;"` : '';
                            return `<div class="status-list-item">
                                <span class="status-list-name" onclick="openStaffProfile('${s.id}')">${s.firstName} ${s.lastName}</span>
                                <span class="status-list-detail" ${detailStyle}>${detail}</span>
                            </div>`;
                        }).join('') : `<div style="text-align:center; padding: 20px; color: var(--ink-sub);">No staff members with this status today.</div>`}
                    </div>
                </div>
            `;
        }, 100);
    };

    window.openApprovalWorkspace = (mgrId) => {
        const mount = document.getElementById('modal-mount');
        const manager = staffList.find(s => s.id === mgrId);
        if (!manager) return;
        
        const accent = teamColors[manager.team] || '#1C1C1C';
        mount.innerHTML = `<div class="modal-loader"><div class="header-dots">${Array(4).fill(`<div class="dot" style="background-color:${accent}"></div>`).join('')}</div></div>`;
        document.getElementById('global-modal').classList.add('active');

        setTimeout(() => {
            const wcStr = currentMonday.toISOString().split('T')[0];
            const mgrName = `${manager.firstName} ${manager.lastName}`;
            const reports = staffList.filter(s => s.manager === mgrName).sort((a,b) => a.firstName.localeCompare(b.firstName));

            mount.innerHTML = `
                <div class="close-btn" onclick="closeModal()">×</div>
                <div class="modal-content-with-accent" style="--modal-accent-color: ${accent};">
                    <div class="modal-body">
                        <div class="modal-header-stacked">
                            <h2 class="modal-mgr-name">${mgrName}</h2>
                            <div class="modal-sub-title" style="color: ${accent};">Approval Workspace</div>
                        </div>
                        ${reports.map(r => {
                            const fName = `${r.firstName} ${r.lastName}`;
                            const sub = rotaSubmissions.find(s => normalize(s.name) === normalize(fName) && s.weekId === wcStr);
                            const resp = rotaResponses.find(res => normalize(res.staffName) === normalize(fName) && res.weekCommencing === wcStr);
                            return `
                            <div class="request-item" id="req-card-${r.id}">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                                    <div class="request-name-link" onclick="openStaffProfile('${r.id}')">${fName}</div>
                                    <span style="font-size:9px; font-weight:900; text-transform:uppercase; color:${resp ? 'var(--st-office)' : 'var(--team-editorial)'}">
                                        ${resp ? 'Reviewed' : 'Awaiting Review'}
                                    </span>
                                </div>
                                ${sub ? `
                                    <div class="approval-strip-container">
                                        <div class="approval-strip">
                                            ${sub.schedule.slice(0,5).map((d, i) => {
                                                const dayName = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'][i];
                                                return `
                                                <div class="approval-day" id="app-day-${r.id}-${i}">
                                                    <span class="day-title">${dayName}</span>
                                                    <span class="requested-status">${d.status}</span>
                                                    <div class="decision-group">
                                                        <div class="dec-btn" title="Approve" onclick="setDailyDecision('${r.id}', ${i}, 'yes')">✓</div>
                                                        <div class="dec-btn" title="Deny" onclick="setDailyDecision('${r.id}', ${i}, 'no')">✕</div>
                                                        <div class="dec-btn" title="Suggest" onclick="openPatternEditor('${fName}', '${wcStr}', 'editor-mount-${r.id}')">?</div>
                                                    </div>
                                                    <input type="text" class="day-comment-input hidden" id="comm-${r.id}-${i}" placeholder="Why?">
                                                </div>`;
                                            }).join('')}
                                        </div>
                                    </div>
                                    <div class="action-row">
                                        <button class="btn-action btn-sync" style="width:100%;" onclick="saveDetailedApproval(this, '${fName}', '${r.id}')">Confirm Approval Log</button>
                                    </div>
                                ` : `
                                    <div style="font-size:12px; color:var(--team-editorial); margin: 15px 0; font-weight:700;">No submission found for this week.</div>
                                    <button class="pill-btn pill-suggest" onclick="openPatternEditor('${fName}', '${wcStr}', 'editor-mount-${r.id}')">Suggest Working Pattern</button>
                                `}
                                <div id="editor-mount-${r.id}"></div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }, 100);
    };

    window.setDailyDecision = (staffId, dayIdx, type) => {
        const container = document.getElementById(`app-day-${staffId}-${dayIdx}`);
        const commInput = document.getElementById(`comm-${staffId}-${dayIdx}`);
        container.classList.remove('decided-yes', 'decided-no', 'decided-suggest');
        container.querySelectorAll('.dec-btn').forEach(b => b.classList.remove('active-yes', 'active-no', 'active-suggest'));
        if (type === 'yes') {
            container.classList.add('decided-yes');
            container.querySelector('.dec-btn[title="Approve"]').classList.add('active-yes');
            commInput.classList.add('hidden');
        } else if (type === 'no') {
            container.classList.add('decided-no');
            container.querySelector('.dec-btn[title="Deny"]').classList.add('active-no');
            commInput.classList.remove('hidden');
            commInput.focus();
        } else {
            container.classList.add('decided-suggest');
            container.querySelector('.dec-btn[title="Suggest"]').classList.add('active-suggest');
            commInput.classList.add('hidden');
        }
    };

    window.saveDetailedApproval = async (buttonEl, name, staffId) => {
        buttonEl.disabled = true;
        buttonEl.innerHTML = `<div class="sync-loader"><span></span><span></span><span></span></div>`;
        const wcStr = currentMonday.toISOString().split('T')[0];
        const decisions = Array.from({length: 5}).map((_, i) => {
            const container = document.getElementById(`app-day-${staffId}-${i}`);
            let decisionStatus = 'Pending';
            if (container.classList.contains('decided-yes')) decisionStatus = 'Approved';
            if (container.classList.contains('decided-no')) decisionStatus = 'Denied';
            if (container.classList.contains('decided-suggest')) decisionStatus = 'Suggest';
            return { dayIndex: i, status: decisionStatus, comment: document.getElementById(`comm-${staffId}-${i}`).value || "" };
        });
        const respId = `${wcStr}_${normalize(name).replace(/\s+/g, '_')}`;
        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rota_responses').doc(respId).set({ 
            staffName: name, weekCommencing: wcStr, status: 'Reviewed', dailyDecisions: decisions, timestamp: new Date().toISOString() 
        });
        buttonEl.classList.remove('btn-sync');
        buttonEl.classList.add('btn-success');
        buttonEl.innerHTML = `<svg class="sync-tick" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
        showToast("Review Recorded");
        setTimeout(window.closeModal, 1000);
    };

    window.openStaffProfile = (staffId) => {
        const mount = document.getElementById('modal-mount');
        const s = staffList.find(x => x.id === staffId);
        if (!s) return;
        const teamCol = teamColors[s.team];
        mount.innerHTML = `<div class="modal-loader"><div class="header-dots">${Array(4).fill(`<div class="dot" style="background-color:${teamCol}"></div>`).join('')}</div></div>`;
        document.getElementById('global-modal').classList.add('active');
        setTimeout(() => {
            const fullName = `${s.firstName} ${s.lastName}`;
            const wcStr = currentMonday.toISOString().split('T')[0];
            const sub = rotaSubmissions.find(sub => normalize(sub.name) === normalize(fullName) && sub.weekId === wcStr);
            const status = sub && sub.schedule[selectedDayIdx] ? sub.schedule[selectedDayIdx].status : 'Pending';
            const statusKey = status.replace(/ /g, '');
            const color = statusColors[statusKey] || statusColors.Pending;
            const manager = staffList.find(x => x.fullName === s.manager);
            const managerColor = manager ? teamColors[manager.team] : 'var(--ink)';
            const weeks = [-7, 0, 7].map(offset => { const d = new Date(currentMonday); d.setDate(d.getDate() + offset); return d.toISOString().split('T')[0]; });
            const backButtonHtml = (modalContext.from === 'workload' && modalContext.staffId === staffId)
                ? `<div class="modal-action-bar"><button class="btn-action btn-back" onclick="goBackToWorkload()">← Back to Workload</button></div>` : '';

            mount.innerHTML = `
                <div class="close-btn" onclick="closeModal()">×</div>
                <div class="modal-body">
                    ${backButtonHtml}
                    <div style="display:flex; align-items:center; gap:25px; border-bottom:1.5px solid var(--border); padding-bottom:25px; margin-bottom: 25px;">
                        <div class="p-grid-large">${Array(4).fill(`<span style="background:${teamCol}"></span>`).join('')}</div>
                        <div>
                            <h1 style="margin:0; font-size:32px; font-weight:900; letter-spacing:-0.03em;">${fullName}</h1>
                            <div style="color:#999; font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:0.05em; margin-top:4px;">${s.role} • <span style="color:${teamCol}">${s.team} Stream</span></div>
                        </div>
                    </div>
                    <div class="p-meta">
                        <div class="p-meta-card"><span class="p-meta-label">Status for this day</span><div class="p-meta-val" style="color:${color}">${status}</div></div>
                        <div class="p-meta-card"><span class="p-meta-label">Direct Manager</span><div class="p-meta-val" style="color:${managerColor};">${s.manager}</div></div>
                        <div class="p-meta-card"><span class="p-meta-label">Employee Tier</span><div class="p-meta-val grey">${s.seniority || 'Staff'}</div></div>
                    </div>
                    <div class="p-section-title">Presence Timeline</div>
                    <table class="presence-table">
                        <thead><tr><th>Week</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th><th>S</th><th>Action</th></tr></thead>
                        <tbody>
                            ${weeks.map((w, index) => {
                                const sW = rotaSubmissions.find(sub => normalize(sub.name) === normalize(fullName) && sub.weekId === w);
                                const isPriorWeek = index === 0;
                                const weekDate = new Date(w);
                                const label = index === 0 ? 'Prior' : index === 1 ? 'Current' : 'Next';
                                const dateString = `W/C ${weekDate.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})}`;
                                const weekLabel = index > 0 ? `${label} <span style="color: ${teamCol}">${dateString}</span>` : `${label} ${dateString}`;
                                let scheduleCellsHtml;
                                if (sW && Array.isArray(sW.schedule)) {
                                    let scheduleDays = [...sW.schedule];
                                    while (scheduleDays.length < 7) {
                                        scheduleDays.push({ status: scheduleDays.length < 5 ? 'Pending' : 'Weekend' });
                                    }
                                    scheduleCellsHtml = scheduleDays.map(d => `<td style="color:${statusColors[(d.status || 'Pending').replace(/ /g,'')] || statusColors.Pending}">${d.status.charAt(0)}</td>`).join('');
                                } else {
                                    scheduleCellsHtml = `<td colspan="7" style="color:#BBB">Pending</td>`;
                                }
                                return `<tr class="${isPriorWeek ? 'prior-week' : ''}">
                                            <td style="text-align:left"><b>${weekLabel}</b></td>
                                            ${scheduleCellsHtml}
                                            <td>${!isPriorWeek ? `<button class="pill-btn ${sW?'pill-update':'pill-suggest'}" onclick="openPatternEditor('${fullName}','${w}','pattern-editor-mount')">${sW?'Update':'Suggest'}</button>` : ''}</td>
                                        </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                    <div id="pattern-editor-mount" style="margin-top: -1px;"></div>
                    <div class="p-section-title">Manager Notes</div>
                    <div style="display:flex; gap:10px; margin-bottom:20px;">
                        <input type="text" id="new-note-txt" placeholder="Log a reminder or note..." class="comment-box" style="margin:0; border-radius:12px;">
                        <button class="btn-action btn-post" onclick="postNote(this, '${fullName}', '${s.team}')" style="flex-shrink:0; border-radius:12px;">Post</button>
                    </div>
                    <div class="notes-list" id="profile-notes-mount"></div>
                </div>
            `;
            renderProfileNotes(fullName);
        }, 100);
    };

    window.openPatternEditor = (name, weekCommencing, mountId = 'pattern-editor-mount') => {
        const mount = document.getElementById(mountId);
        if (mount.querySelector('.pattern-editor')) {
            mount.innerHTML = ''; return;
        }
        mount.innerHTML = '';
        const sub = rotaSubmissions.find(s => normalize(s.name) === normalize(name) && s.weekId === weekCommencing);
        const weekdayLocs = ['Office', 'WFH', 'Shoot', 'Client / Travel', 'PTO'];
        const weekendLocs = ['Weekend', 'Shoot', 'Client / Travel'];
        const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        mount.innerHTML = `
            <div class="pattern-editor">
                <div style="font-size:10px; font-weight:900; margin-bottom:12px; color:var(--team-people); text-transform:uppercase;">Set Working Pattern: ${new Date(weekCommencing).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
                <div class="editor-grid">
                    ${dayLabels.map((day, i) => {
                        const isWeekend = i >= 5;
                        const locs = isWeekend ? weekendLocs : weekdayLocs;
                        const defaultStatus = isWeekend ? 'Weekend' : 'Office';
                        const cur = sub && sub.schedule && sub.schedule[i] ? sub.schedule[i].status : defaultStatus;
                        return `<div><div class="editor-day-label">${day}</div><select class="editor-select" id="edit-day-${i}">${locs.map(l => `<option value="${l}" ${cur === l ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
                    }).join('')}
                </div>
                <button class="btn-action btn-sync" style="width:100%;" onclick="window.saveOverride(this, '${name}', '${weekCommencing}')">Sync to Cloud</button>
            </div>`;
    };

    window.saveOverride = async (buttonEl, name, weekCommencing) => {
        buttonEl.disabled = true;
        buttonEl.innerHTML = `<div class="sync-loader"><span></span><span></span><span></span></div>`;
        try {
            const schedule = Array.from({length: 7}).map((_, i) => ({ status: document.getElementById(`edit-day-${i}`).value, fullDay: true }));
            const submissionId = `${weekCommencing}_${normalize(name).replace(/\s+/g, '_')}`;
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('rota_submissions').doc(submissionId).set({ 
                name: name, weekId: weekCommencing, schedule, managerName: staffList.find(s => normalize(`${s.firstName} ${s.lastName}`) === normalize(name))?.manager || 'Unknown', timestamp: new Date().toISOString() 
            });
            buttonEl.classList.remove('btn-sync');
            buttonEl.classList.add('btn-success');
            buttonEl.innerHTML = `<svg class="sync-tick" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
            showToast("Cloud Synced");
            setTimeout(window.closeModal, 1000);
        } catch (error) {
            console.error("Failed to save override:", error);
            buttonEl.innerHTML = 'Sync to Cloud';
            buttonEl.disabled = false;
            showToast("Sync Failed!");
        }
    };

    function renderProfileNotes(name) {
        const mount = document.getElementById('profile-notes-mount');
        const userNotes = staffNotes.filter(n => normalize(n.target) === normalize(name)).sort((a,b) => new Date(b.date).getTime() - new Date(a.date).getTime());
        mount.innerHTML = userNotes.map(n => `<div class="note-item" style="border-left-color: ${teamColors[n.team] || 'var(--team-people)'}">${n.text}<span class="note-meta">${new Date(n.date).toLocaleDateString()}</span></div>`).join('') || '<div style="font-size:12px; color:#CCC; text-align:center; padding:20px;">No manager notes.</div>';
    }

    window.postNote = async (buttonEl, target, team) => {
        const textInput = document.getElementById('new-note-txt');
        const text = textInput.value;
        if(!text.trim()) return;
        buttonEl.disabled = true;
        buttonEl.innerHTML = `<div class="sync-loader"><span></span><span></span><span></span></div>`;
        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('staff_notes').add({ target, text, date: new Date().toISOString(), team });
        textInput.value = "";
        showToast("Note Recorded");
        buttonEl.disabled = false;
        buttonEl.innerHTML = 'Post';
    };

    window.closeModal = () => {
        const modal = document.getElementById('global-modal');
        modal.classList.remove('active');
        setTimeout(() => {
            document.getElementById('modal-mount').innerHTML = '';
            modalContext = { from: null, staffId: null };
        }, 300);
    };

    window.switchView = (v, btn) => {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
        document.getElementById('view-'+v).classList.add('active');
        btn.classList.add('active');
        document.getElementById('week-picker-control').classList.toggle('hidden', v === 'approvals' || v === 'workload');
    };
    
    window.openProjectLink = (event, url) => {
        event.preventDefault();
        event.stopPropagation();
        window.open(url, '_blank', 'noopener,noreferrer');
    };

    window.openProfileFromWorkload = (staffId) => {
        modalContext = { from: 'workload', staffId: staffId };
        openStaffProfile(staffId);
    };

    window.goBackToWorkload = () => {
        const staffId = modalContext.staffId;
        closeModal();
        setTimeout(() => openProjectModal(staffId), 350); 
    };

    window.toggleFilter = (filterName, buttonEl) => {
        if (filterName === 'production') {
            isProductionFilterActive = !isProductionFilterActive;
        } else if (filterName === 'activeProjects') {
            isOnlyShowingActiveProjects = !isOnlyShowingActiveProjects;
        }
        buttonEl.classList.toggle('active');
        renderWorkload();
    };

    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('active'); setTimeout(() => t.classList.remove('active'), 2500); }
</script>
</body>
</html>
