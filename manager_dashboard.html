                `).join('')}
            `;
        }

        function renderAvailability() {
            const mergedStaff = getMergedStaff();
            const activeStaff = mergedStaff.filter(s => s.active !== false && s.status !== 'Inactive');
            const weekDates = getWeekDates(calendarWeekOffset);
            const approved = rotaRequests.filter(r => r.status === 'approved').map(r => ({
                ...r,
                start: r.startDate?.toDate ? r.startDate.toDate() : r.startDate ? new Date(r.startDate) : null,
                end: r.endDate?.toDate ? r.endDate.toDate() : r.endDate ? new Date(r.endDate) : null
            }));

            const getStatusForDay = (person, date) => {
                const name = `${person.firstName || ''} ${person.lastName || ''}`.toLowerCase();
                const request = approved.find(r => {
                    const reqName = `${r.firstName || r.name || ''} ${r.lastName || ''}`.toLowerCase();
                    return reqName.includes(name.split(' ')[0]) && isWithinRange(date, r.start, r.end);
                });
                if (request) {
                    const type = (request.type || 'leave').toLowerCase();
                    if (type === 'wfh') return { icon: '🏠', label: 'WFH', color: 'rgba(33, 160, 216, 0.15)', textColor: '#21A0D8' };
                    if (type === 'sick') return { icon: '🤒', label: 'Sick', color: 'rgba(239, 68, 68, 0.15)', textColor: '#EF4444' };
                    return { icon: '🏖️', label: 'Leave', color: 'rgba(249, 115, 22, 0.15)', textColor: '#F97316' };
                }
                return { icon: '🏢', label: 'Office', color: 'rgba(67, 176, 73, 0.1)', textColor: '#43B049' };
            };

            const weekLabel = `Week of ${weekDates[0].toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`;
            const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

            // Group staff by team
            const staffByTeam = {};
            TEAMS.forEach(t => staffByTeam[t] = []);
            staffByTeam['Unassigned'] = [];
            activeStaff.forEach(s => {
                const team = s.team || 'Unassigned';
                if (!staffByTeam[team]) staffByTeam[team] = [];
                staffByTeam[team].push(s);
            });

            // Get teams that have members
            const activeTeams = Object.entries(staffByTeam).filter(([_, members]) => members.length > 0);

            return `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title"><div class="dot-grid"><span></span><span></span><span></span><span></span></div>Weekly Attendance</span>
                        <span class="card-meta">${activeStaff.length} team members</span>
                    </div>
                    <div class="card-body">
                        <div class="calendar-nav">
                            <button class="btn btn-ghost btn-sm" onclick="changeWeek(-1)">← Previous</button>
                            <span class="calendar-title">${weekLabel}</span>
                            <button class="btn btn-ghost btn-sm" onclick="changeWeek(1)">Next →</button>
                        </div>

                        <!-- Team-grouped attendance -->
                        ${activeTeams.map(([teamName, members]) => `
                            <div style="margin-bottom:24px;">
                                <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid ${color(teamName)};">
                                    <div style="width:10px;height:10px;border-radius:50%;background:${color(teamName)};"></div>
                                    <span style="font-weight:700;font-size:14px;">${teamName}</span>
                                    <span style="font-size:12px;color:var(--ink-sub);">${members.length} members</span>
                                </div>
                                <div class="calendar-grid" style="grid-template-columns:180px repeat(5, 1fr);">
                                    <div class="calendar-header" style="font-size:10px;">Team Member</div>
                                    ${dayLabels.map((d, i) => `<div class="calendar-header" style="font-size:10px;">${d} ${weekDates[i].getDate()}</div>`).join('')}
                                    ${members.map(s => `
                                        <div class="calendar-row-name" style="cursor:pointer;padding:8px;" onclick="openAttendanceModal('${s.id}')">
                                            <div class="avatar avatar-sm" style="background:${color(teamName)};width:28px;height:28px;font-size:10px;">${initials(s.firstName, s.lastName)}</div>
                                            <span style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.firstName} ${(s.lastName || '').charAt(0)}.</span>
                                        </div>
                                        ${weekDates.map(date => {
                                            const status = getStatusForDay(s, date);
                                            return `
                                                <div class="calendar-cell" title="${status.label}" style="background:${status.color};cursor:pointer;border-radius:6px;" onclick="openAttendanceModal('${s.id}')">
                                                    <span style="font-size:16px;">${status.icon}</span>
                                                </div>
                                            `;
                                        }).join('')}
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}

                        <div class="calendar-legend" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
                            <div class="legend-item"><span>🏢</span> Office</div>
                            <div class="legend-item"><span>🏠</span> WFH</div>
                            <div class="legend-item"><span>🏖️</span> Leave</div>
                            <div class="legend-item"><span>🤒</span> Sick</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderApprovals() {
            const pending = pendingChanges.filter(c => c.status === 'pending');
            const recent = pendingChanges.filter(c => c.status !== 'pending').slice(0, 10);
            const formatFieldName = (f) => ({ creativeWorkflowStatus: 'Creative Status', productionWorkflowStatus: 'Production Status', socialWorkflowStatus: 'Social Status', dealStage: 'Deal Stage' }[f] || f);

            return `
                <div class="card">
                    <div class="card-header"><span class="card-title"><div class="dot-grid"><span></span><span></span><span></span><span></span></div>Project Changes</span><span class="card-meta">${pending.length} awaiting review</span></div>
                    <div style="padding:12px 20px;background:var(--surface-alt);border-bottom:1px solid var(--border);font-size:12px;color:var(--ink-sub);">
                        Status changes on projects (e.g., moving from "Briefed" to "In Production", changing editors/designers)
                    </div>
                    ${pending.length === 0 ? `<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">All Caught Up</div><div class="empty-subtitle">No pending project changes require your approval.</div></div>` : `
                        <div class="card-body">${pending.map(c => `
                            <div class="approval-card">
                                <div class="approval-header">
                                    <div><div class="approval-project">${c.projectTitle || 'Unknown Project'}</div><div class="approval-field">${formatFieldName(c.field)} change requested</div></div>
                                    <span class="pill pill-warning">Pending</span>
                                </div>
                                <div class="approval-change">
                                    <span class="approval-value" style="background:var(--surface-alt);">${c.currentValue || 'None'}</span>
                                    <span class="approval-arrow">→</span>
                                    <span class="approval-value" style="background:var(--dmg-blue-soft);color:var(--dmg-blue);">${c.requestedValue}</span>
                                </div>
                                <div class="approval-meta"><span>Requested by ${c.requestedByName || 'Unknown'}</span><span>•</span><span>${formatDateTime(c.requestedAt)}</span></div>
                                <div class="approval-actions">
                                    <button class="btn btn-success btn-sm" onclick="approveChange('${c.id}')">Approve</button>
                                    <button class="btn btn-danger btn-sm" onclick="rejectChange('${c.id}')">Reject</button>
                                </div>
                            </div>
                        `).join('')}</div>
                    `}
                </div>
                ${recent.length > 0 ? `<div class="card"><div class="card-header"><span class="card-title">Recently Processed</span></div><div>${recent.map(c => `<div class="list-item" style="opacity:0.8;cursor:default;"><div class="list-item-info"><div class="list-item-title">${c.projectTitle}</div><div class="list-item-subtitle">${formatFieldName(c.field)}: ${c.currentValue} → ${c.requestedValue}</div></div><span class="pill ${c.status === 'approved' ? 'pill-success' : 'pill-danger'}">${c.status}</span></div>`).join('')}</div></div>` : ''}
            `;
        }

        function renderRotaRequests() {
            const pending = rotaRequests.filter(r => r.status === 'pending');
            const processed = rotaRequests.filter(r => r.status !== 'pending');

            return `
                <div class="card">
                    <div class="card-header"><span class="card-title"><div class="dot-grid"><span></span><span></span><span></span><span></span></div>Leave & WFH Requests</span><span class="card-meta">${pending.length} awaiting</span></div>
                    <div style="padding:12px 20px;background:var(--surface-alt);border-bottom:1px solid var(--border);font-size:12px;color:var(--ink-sub);">
                        Staff requests for annual leave, sick days, or working from home
                    </div>
                    ${pending.length === 0 ? `<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">No Pending Requests</div><div class="empty-subtitle">Staff leave/WFH requests will appear here for approval.</div></div>` : `
                        <div>${pending.map(r => `
                            <div class="list-item">
                                <div class="avatar" style="background:${color(r.team)}">${initials(r.firstName || r.name, r.lastName)}</div>
                                <div class="list-item-info">
                                    <div class="list-item-title">${r.firstName || r.name || 'Unknown'} ${r.lastName || ''}</div>
                                    <div class="list-item-subtitle">${r.team || 'No team'} • ${r.reason || 'No reason given'}</div>
                                    <div class="list-item-meta">${formatDate(r.startDate)} → ${formatDate(r.endDate)}</div>
                                </div>
                                <span class="pill ${(r.type || 'leave').toLowerCase() === 'wfh' ? 'pill-blue' : (r.type || 'leave').toLowerCase() === 'sick' ? 'pill-danger' : 'pill-warning'}">${r.type || 'Leave'}</span>
                                <div class="list-item-actions">
                                    <button class="btn btn-success btn-sm" onclick="approveRota('${r.id}')">Approve</button>
                                    <button class="btn btn-danger btn-sm" onclick="rejectRota('${r.id}')">Reject</button>
                                </div>
                            </div>
                        `).join('')}</div>
                    `}
                </div>
                ${processed.length > 0 ? `<div class="card"><div class="card-header"><span class="card-title">Recently Processed</span></div><div>${processed.slice(0, 10).map(r => `<div class="list-item" style="opacity:0.7;cursor:default;"><div class="avatar avatar-sm" style="background:${color(r.team)}">${initials(r.firstName || r.name, r.lastName)}</div><div class="list-item-info"><div class="list-item-title">${r.firstName || r.name || 'Unknown'} ${r.lastName || ''}</div><div class="list-item-subtitle">${formatDate(r.startDate)} → ${formatDate(r.endDate)}</div></div><span class="pill ${r.status === 'approved' ? 'pill-success' : 'pill-danger'}">${r.status}</span></div>`).join('')}</div></div>` : ''}
            `;
        }

        window.toggleStaffView = () => {
            staffViewMode = staffViewMode === 'team' ? 'alpha' : 'team';
            render();
        };

        function renderStaff() {
            const mergedStaff = getMergedStaff();

            // Sort based on view mode
            let sortedStaff;
            if (staffViewMode === 'alpha') {
                sortedStaff = [...mergedStaff].sort((a, b) => `${a.firstName} ${a.lastName}`.localeCompare(`${b.firstName} ${b.lastName}`));
            } else {
                sortedStaff = mergedStaff;
            }

            // Group by team if in team view
            const staffByTeam = {};
            if (staffViewMode === 'team') {
                TEAMS.forEach(t => staffByTeam[t] = []);
                staffByTeam['Unassigned'] = [];
                sortedStaff.forEach(s => {
                    const team = s.team || 'Unassigned';
                    if (!staffByTeam[team]) staffByTeam[team] = [];
                    staffByTeam[team].push(s);
                });
            }
            const activeTeams = Object.entries(staffByTeam).filter(([_, members]) => members.length > 0);

            const renderStaffRow = (s) => `
                <tr style="cursor:pointer;transition:background 0.1s;" onclick="openStaffModal('${s.id}')" onmouseover="this.style.background='var(--dmg-blue-soft)'" onmouseout="this.style.background=''">
                    <td><div style="display:flex;align-items:center;gap:12px;"><div class="avatar avatar-sm" style="background:${color(s.team)}">${initials(s.firstName, s.lastName)}</div><div><div style="font-weight:700;">${s.firstName} ${s.lastName}</div><div style="font-size:11px;color:var(--ink-sub);">${s.email || 'No email'}</div></div></div></td>
                    ${staffViewMode === 'alpha' ? `<td><span class="pill" style="background:${colorSoft(s.team)};color:${color(s.team)}">${s.team || 'Unassigned'}</span></td>` : ''}
                    <td>${s.role || '—'}</td>
                    <td>${s.seniority || '—'}</td>
                    <td>${getWeeklyCapacity(s)} PTS</td>
                    <td><span class="pill ${(s.status === 'Active' || s.active !== false) ? 'pill-success' : 'pill-gray'}">${s.status || (s.active !== false ? 'Active' : 'Inactive')}</span></td>
                    <td onclick="event.stopPropagation()">
                        ${s.notionUrl ? `<a href="${s.notionUrl}" target="_blank" class="btn btn-ghost btn-sm" title="View in Notion" style="font-size:10px;padding:4px 8px;color:var(--ink-muted);">↗</a>` : ''}
                    </td>
                </tr>
            `;

            return `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title"><div class="dot-grid"><span></span><span></span><span></span><span></span></div>Team Directory</span>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <div style="display:flex;border:1px solid var(--border);border-radius:var(--radius-xs);overflow:hidden;">
                                <button class="btn btn-sm" style="border:none;border-radius:0;padding:6px 12px;font-size:11px;${staffViewMode === 'team' ? 'background:var(--dmg-blue);color:white;' : 'background:transparent;'}" onclick="event.stopPropagation();staffViewMode='team';render();">By Team</button>
                                <button class="btn btn-sm" style="border:none;border-radius:0;padding:6px 12px;font-size:11px;${staffViewMode === 'alpha' ? 'background:var(--dmg-blue);color:white;' : 'background:transparent;'}" onclick="event.stopPropagation();staffViewMode='alpha';render();">A-Z</button>
                            </div>
                            <button class="btn btn-ghost btn-sm" onclick="loadStaffFromNotion()" title="Refresh from Notion">↻ Sync</button>
                            <button class="btn btn-primary btn-sm" onclick="openAddStaffModal()">+ Add Member</button>
                        </div>
                    </div>
                    ${mergedStaff.length === 0 ? `<div class="empty"><div class="empty-icon">👥</div><div class="empty-title">No Staff Members</div><div class="empty-subtitle">Click "Add Member" to add your first team member.</div></div>` :
                        staffViewMode === 'team' ? `
                            <!-- Team-grouped view -->
                            ${activeTeams.map(([teamName, members]) => `
                                <div style="margin-bottom:0;">
                                    <div style="display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surface-alt);border-bottom:1px solid var(--border);">
                                        <div style="width:10px;height:10px;border-radius:50%;background:${color(teamName)};"></div>
                                        <span style="font-weight:700;font-size:13px;">${teamName}</span>
                                        <span style="font-size:11px;color:var(--ink-sub);">${members.length} members</span>
                                    </div>
                                    <div class="table-wrapper" style="margin:0;">
                                        <table>
                                            <thead><tr><th>Name</th><th>Role</th><th>Seniority</th><th>Capacity</th><th>Status</th><th></th></tr></thead>
                                            <tbody>${members.map(renderStaffRow).join('')}</tbody>
                                        </table>
                                    </div>
                                </div>
                            `).join('')}
                        ` : `
                            <!-- Alphabetical view -->
                            <div class="table-wrapper">
                                <table>
                                    <thead><tr><th>Name</th><th>Team</th><th>Role</th><th>Seniority</th><th>Capacity</th><th>Status</th><th></th></tr></thead>
                                    <tbody>${sortedStaff.map(renderStaffRow).join('')}</tbody>
                                </table>
                            </div>
                        `
                    }
                </div>
            `;
        }

        function renderEffortConfig() {
            const defaultConfig = {
                taskTypes: {
                    // Video/Editing tasks
                    video_edit_short: { baseHours: 4, label: 'Video Edit (Short)' },
                    video_edit_medium: { baseHours: 8, label: 'Video Edit (Medium)' },
                    video_edit_long: { baseHours: 16, label: 'Video Edit (Long)' },
                    motion_graphics: { baseHours: 6, label: 'Motion Graphics' },
                    colour_grade: { baseHours: 2, label: 'Colour Grade' },
                    sound_mix: { baseHours: 3, label: 'Sound Mix' },
                    revision_round: { baseHours: 2, label: 'Revision Round' },
                    social_cutdown: { baseHours: 1, label: 'Social Cutdown' },
                    script: { baseHours: 3, label: 'Script Writing' },
                    // Design tasks
                    thumbnail: { baseHours: 0.5, label: 'Thumbnail' },
                    carousel: { baseHours: 2, label: 'Carousel/Multi-image' },
                    deck: { baseHours: 4, label: 'Presentation Deck' },
                    template: { baseHours: 3, label: 'Template Design' },
                    brand_kit: { baseHours: 8, label: 'Brand Kit' },
                    infographic: { baseHours: 3, label: 'Infographic' },
                    social_graphic: { baseHours: 1, label: 'Social Graphic' }
                },
                seniorityMultipliers: { intern: 1.5, junior: 1.3, midweight: 1.0, senior: 0.85, lead: 0.75 }
            };
            const config = effortConfig || defaultConfig;

            // Layman descriptions for task types
            const taskDescriptions = {
                // Video/Editing
                'video_edit_short': 'Quick edits under 3 mins - social clips, teasers, reels',
                'video_edit_medium': 'Standard videos 3-10 mins - typical YouTube content',
                'video_edit_long': 'Long-form videos 10+ mins - documentaries, interviews',
                'motion_graphics': 'Animated lower thirds, intros, outros, text animations',
                'colour_grade': 'Colour correction and grading for consistent look',
                'sound_mix': 'Audio mixing, music sync, voiceover integration',
                'revision_round': 'Client feedback revisions and amendments',
                'social_cutdown': 'Reformatting existing content for different social platforms',
                'script': 'Writing voiceover, dialogue, or narrative for video content',
                // Design
                'thumbnail': 'Eye-catching preview images for videos and content',
                'carousel': 'Multi-image posts for Instagram/LinkedIn carousels',
                'deck': 'Presentation slides for pitches or internal use',
                'template': 'Reusable design templates for recurring content',
                'brand_kit': 'Full brand identity package - logos, colours, guidelines',
                'infographic': 'Data visualisation and information graphics',
                'social_graphic': 'Single static image for social media posts'
            };

            return `
                <div class="card">
                    <div class="card-header"><span class="card-title"><div class="dot-grid"><span></span><span></span><span></span><span></span></div>Task Effort Scores</span><button class="btn btn-primary btn-sm" onclick="addTaskType()">+ Add Task Type</button></div>
                    <div style="padding:16px 20px;background:var(--surface-alt);border-bottom:1px solid var(--border);font-size:12px;color:var(--ink-sub);">

                    </div>

                                <td><input class="table-input" style="width:160px;" value="${val.label}" onchange="updateTaskType('${key}', 'label', this.value)"></td>

                                <td><input class="table-input" type="number" style="width:80px;" value="${val.baseHours}" onchange="updateTaskType('${key}', 'baseHours', this.value)"></td>
                                <td><button class="btn btn-ghost btn-sm" onclick="removeTaskType('${key}')">Remove</button></td>
                            </tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><span class="card-title">Seniority Multipliers</span><span class="card-meta">Adjust effort based on experience level</span></div>

                const included = ['agreed', 'won', 'confirmed', 'active', 'in production', 'in progress', 'filming', 'edit', 'review', 'pre-production', 'briefed'];
                if (excluded.some(e => stage.includes(e))) return false;
                if (included.some(i => stage.includes(i))) return true;
                return !!(p.creativeLead || p.productionLead || p.videoEditor || stage);

                const s = (stage || '').toLowerCase();
                if (s.includes('complete') || s.includes('live')) return { bg: 'rgba(67, 176, 73, 0.1)', color: '#43B049' };
                if (s.includes('edit') || s.includes('review')) return { bg: 'rgba(249, 115, 22, 0.1)', color: '#F97316' };
                if (s.includes('filming') || s.includes('shoot') || s.includes('production')) return { bg: 'rgba(33, 160, 216, 0.1)', color: '#21A0D8' };
                if (s.includes('agreed') || s.includes('briefed') || s.includes('pre-prod')) return { bg: 'rgba(139, 92, 246, 0.1)', color: '#8B5CF6' };

        window.changeRundownDate = (delta) => {
            rundownDate.setDate(rundownDate.getDate() + delta);

        };

        window.loadRundown = async () => {
            const dateKey = rundownDate.toISOString().split('T')[0];
            try {
                const res = await fetch(`${API_URL}/rundown?date=${dateKey}`);
                const data = await res.json();
                if (data.success) {
                    rundownItems = data.items || [];
                } else {
                    rundownItems = [];
                }
            } catch (e) {
                console.error('Failed to load rundown:', e);
                rundownItems = [];
            }
            render();
        };

        window.cycleRundownStatus = async (id) => {
            const statuses = ['Not Started', 'Pending', 'Done', 'Blocked'];
            const item = rundownItems.find(i => i.id === id);
            if (!item) return;

            const currentIdx = statuses.indexOf(item.status || 'Not Started');
            const nextStatus = statuses[(currentIdx + 1) % statuses.length];

            try {
                await fetch(`${API_URL}/rundown/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: nextStatus })
                });
                item.status = nextStatus;
                showToast(`Status: ${nextStatus}`);
                render();
            } catch (e) {
                showToast('Failed to update status', 'error');
            }
        };

                lastName: document.getElementById('staffLastName').value.trim(),
                phone: document.getElementById('staffPhone')?.value.trim() || '',
                slackId: document.getElementById('staffSlackId')?.value.trim() || '',
                team: document.getElementById('staffTeam').value,
                role: document.getElementById('staffRole').value,
                seniority: document.getElementById('staffSeniority').value,
                employmentType: document.getElementById('staffEmploymentType')?.value || '',
                secondaryRoles: secondaryRoles,
                lineManagerDropdown: document.getElementById('staffLineManager')?.value || '',
                status: document.getElementById('staffStatus')?.value || 'Active',
                isLineManager: document.getElementById('staffIsLineManager')?.checked || false,
                isCreator: document.getElementById('staffIsCreator')?.checked || false,
                isEditor: document.getElementById('staffIsEditor')?.checked || false,
                isProducer: document.getElementById('staffIsProducer')?.checked || false,
                maxHoursPerWeek: parseInt(document.getElementById('staffMaxHours')?.value) || 40,
                active: document.getElementById('staffStatus')?.value === 'Active'
            };
            if (!data.firstName) { showToast('First name is required', 'error'); return; }

            let notionSynced = false;

            // Try to sync to Notion Staff Directory (gracefully handle if API not available)
            async function tryNotionSync(method, url, body) {
                try {
                    const response = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const text = await response.text();
                    // Check for HTML error pages
                    if (!text || text.trim().startsWith('<!') || text.trim().startsWith('<html')) {
                        console.warn('Notion API returned HTML - endpoint not configured');
                        return null;
                    }
                    // Try to parse JSON safely
                    try {
                        const result = JSON.parse(text);
                        if (!response.ok) {
                            console.warn('Notion API error:', result.error || 'Unknown error');
                            return null;
                        }
                        return result;
                    } catch (parseErr) {
                        console.warn('Notion API returned invalid JSON:', text.substring(0, 100));
                        return null;
                    }
                } catch (e) {
                    console.warn('Notion sync unavailable:', e.message);
                    return null;
                }
            }

            try {
                if (id) {
                    const staffDoc = staff.find(s => s.id === id);
                    if (staffDoc?.notionId) {
                        const result = await tryNotionSync('PATCH', `${API_URL}/staff-directory/${staffDoc.notionId}`, data);
                        notionSynced = !!result?.success;
                    } else {
                        const result = await tryNotionSync('POST', `${API_URL}/staff-directory`, data);
                        if (result?.success) { data.notionId = result.id; notionSynced = true; }
                    }
                    await updateDoc(doc(db, "artifacts", appId, "public", "data", "staff_directory", id), { ...data, updatedAt: serverTimestamp() });
                    showToast(notionSynced ? 'Team member updated & synced to Notion' : 'Team member updated (Notion sync pending)');
                } else {
                    const result = await tryNotionSync('POST', `${API_URL}/staff-directory`, data);
                    if (result?.success) { data.notionId = result.id; notionSynced = true; }
                    await addDoc(collection(db, "artifacts", appId, "public", "data", "staff_directory"), { ...data, createdAt: serverTimestamp() });
                    showToast(notionSynced ? 'Team member added & synced to Notion' : 'Team member added (Notion sync pending)');
                }
                closeModal();
            } catch (e) {
                console.error(e);
                showToast('Error: ' + e.message, 'error');
            }
        };

        window.archiveStaff = async (id) => {
            if (!confirm('Archive this team member? They will be marked as inactive.')) return;
            try {
                const staffDoc = staff.find(s => s.id === id);
                let notionSynced = false;
                if (staffDoc?.notionId) {
                    try {
                        const res = await fetch(`${API_URL}/staff-directory/${staffDoc.notionId}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ active: false })
                        });
                        if (res.ok) {
                            const text = await res.text();
                            if (!text.startsWith('<!')) notionSynced = true;
                        }
                    } catch (e) { console.warn('Notion archive unavailable:', e.message); }
                }
                await updateDoc(doc(db, "artifacts", appId, "public", "data", "staff_directory", id), { active: false, updatedAt: serverTimestamp() });
                showToast(notionSynced ? 'Team member archived & synced' : 'Team member archived (Notion sync pending)');
                closeModal();
            } catch (e) { showToast('Error: ' + e.message, 'error'); }
        };

        window.approveRota = async (id) => {

                await updateDoc(doc(db, "artifacts", appId, "public", "data", "rota_requests", id), { status: 'approved', processedAt: serverTimestamp() });
                showToast('Request approved');

        window.rejectRota = async (id) => {

        // Attendance modal state

        window.openAttendanceModal = (staffId) => {

        window.selectAttendanceDay = (dayIndex) => {
            // Only allow selection for current or future weeks
            if (attendanceModalWeekOffset >= 0) {
                const weekDates = getWeekDates(attendanceModalWeekOffset);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const selectedDate = weekDates[dayIndex];

        window.submitAttendanceStatus = async (statusType) => {
            const s = staff.find(m => m.id === attendanceModalStaffId);
            if (!s || attendanceModalSelectedDay === null) return;

            const weekDates = getWeekDates(attendanceModalWeekOffset);
            const selectedDate = weekDates[attendanceModalSelectedDay];

            if (statusType === 'office') {
                // Clear any existing request for this day - just close the form
                showToast('Status set to In Office');
                attendanceModalSelectedDay = null;
                attendanceModalShowForm = false;
                renderAttendanceModal();
                return;
            }

            try {
                await addDoc(collection(db, "artifacts", appId, "public", "data", "rota_requests"), {
                    firstName: s.firstName,
                    lastName: s.lastName,
                    name: `${s.firstName} ${s.lastName}`,
                    team: s.team,
                    type: statusType,
                    reason: statusType === 'wfh' ? 'Working from home' : statusType === 'sick' ? 'Sick leave' : 'Annual leave',
                    startDate: Timestamp.fromDate(selectedDate),
                    endDate: Timestamp.fromDate(selectedDate),

                    createdAt: serverTimestamp()
                });
                showToast(`${statusType.toUpperCase()} request submitted for ${selectedDate.toLocaleDateString('en-GB', {day:'numeric',month:'short'})}`);

                attendanceModalShowForm = false;

        function renderAttendanceModal() {
            const s = staff.find(m => m.id === attendanceModalStaffId);
            if (!s) return;

            const weekDates = getWeekDates(attendanceModalWeekOffset);
            const approved = rotaRequests.filter(r => r.status === 'approved').map(r => ({

                return { icon: '🏢', label: 'In Office', color: 'var(--success-soft)' };

                ...r,
                start: r.startDate?.toDate ? r.startDate.toDate() : r.startDate ? new Date(r.startDate) : null,

                        <button class="btn btn-ghost btn-sm" onclick="changeAttendanceWeek(1)">Next →</button>
                    </div>
                    ${canEdit ? '<div style="font-size:11px;color:var(--ink-sub);text-align:center;margin-bottom:12px;">Click a day to set or request a status change</div>' : ''}
                    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px;">
                        ${weekDates.map((date, i) => {
                            const status = getStatusForDay(date, approved);
                            const hasPending = pending.some(r => {
                                const reqName = `${r.firstName || r.name || ''} ${r.lastName || ''}`.toLowerCase();
                                return reqName.includes(personName.split(' ')[0]) && isWithinRange(date, r.start, r.end);
                            });
                            const isSelected = attendanceModalSelectedDay === i;

                            return `
                                <div style="background:${isSelected ? 'var(--dmg-blue-soft)' : status.color};border-radius:var(--radius-sm);padding:16px;text-align:center;${hasPending ? 'border:2px dashed var(--warning);' : isSelected ? 'border:2px solid var(--dmg-blue);' : ''}${canClick ? 'cursor:pointer;transition:transform 0.1s;' : ''}${isPast ? 'opacity:0.5;' : ''}" ${canClick ? `onclick="selectAttendanceDay(${i})" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'"` : ''}>
                                    <div style="font-size:11px;font-weight:700;color:var(--ink-sub);text-transform:uppercase;margin-bottom:6px;">${dayLabels[i]}</div>
                                    <div style="font-size:13px;font-weight:600;margin-bottom:10px;">${date.getDate()} ${date.toLocaleDateString('en-GB', {month: 'short'})}</div>

                                </div>

                                    <span style="font-size:10px;">Leave</span>
                                </button>
                                <button class="btn btn-sm" style="flex-direction:column;gap:4px;padding:12px 8px;background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);" onclick="submitAttendanceStatus('sick')">
                                    <span style="font-size:20px;">🤒</span>
                                    <span style="font-size:10px;">Sick</span>
                                </button>
                            </div>
                            <button class="btn btn-ghost btn-sm" style="margin-top:12px;width:100%;" onclick="cancelAttendanceForm()">Cancel</button>
                        </div>
                    ` : ''}
                    ${personRequests.length > 0 ? `
                        <div style="border-top:1px solid var(--border);padding-top:20px;">
                            <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-sub);margin-bottom:12px;">Upcoming Requests</div>
                            ${personRequests.filter(r => r.end && r.end >= new Date()).slice(0, 5).map(r => `
                                <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--surface-alt);border-radius:var(--radius-xs);margin-bottom:8px;">
                                    <div style="display:flex;align-items:center;gap:10px;">
                                        <span style="font-size:18px;">${(r.type || 'leave').toLowerCase() === 'wfh' ? '🏠' : (r.type || 'leave').toLowerCase() === 'sick' ? '🤒' : '🏖️'}</span>
                                        <div>
                                            <div style="font-size:13px;font-weight:600;">${r.type || 'Leave'}</div>
                                            <div style="font-size:11px;color:var(--ink-sub);">${r.start ? r.start.toLocaleDateString('en-GB', {day:'numeric',month:'short'}) : '?'} - ${r.end ? r.end.toLocaleDateString('en-GB', {day:'numeric',month:'short'}) : '?'}</div>

                                </div>

                        </div>
                    ` : ''}
                </div>
                <div class="modal-footer">
                    <button class="btn btn-ghost" onclick="closeModal()">Close</button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }

        window.openOfficeOutlookModal = (statusType) => {
            const today = new Date();
            const todayStr = today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });

            const approved = rotaRequests.filter(r => r.status === 'approved').map(r => ({
                ...r,
                start: r.startDate?.toDate ? r.startDate.toDate() : r.startDate ? new Date(r.startDate) : null,
                end: r.endDate?.toDate ? r.endDate.toDate() : r.endDate ? new Date(r.endDate) : null
            }));

            const categorized = { office: [], wfh: [], leave: [], sick: [] };
            staff.filter(s => s.active !== false).forEach(s => {
                const name = `${s.firstName || ''} ${s.lastName || ''}`.toLowerCase();
                const request = approved.find(r => {
                    const reqName = `${r.firstName || r.name || ''} ${r.lastName || ''}`.toLowerCase();
                    return reqName.includes(name.split(' ')[0]) && isWithinRange(today, r.start, r.end);
                });
                if (request) {
                    const type = (request.type || 'leave').toLowerCase();
                    if (type === 'wfh') categorized.wfh.push(s);
                    else if (type === 'sick') categorized.sick.push(s);
                    else categorized.leave.push(s);
                } else {
                    categorized.office.push(s);
                }
            });

            const titles = { office: 'In Office', wfh: 'Working Remotely', leave: 'On Leave', sick: 'Sick Leave' };
            const icons = { office: '🏢', wfh: '🏠', leave: '🏖️', sick: '🤒' };
            const colors = { office: 'var(--success)', wfh: 'var(--dmg-blue)', leave: 'var(--warning)', sick: 'var(--danger)' };
            const staffList = categorized[statusType] || [];

            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <div class="modal-header">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <span style="font-size:28px;">${icons[statusType]}</span>
                        <div>
                            <span class="modal-title">${titles[statusType]}</span>
                            <div style="font-size:12px;color:var(--ink-sub);margin-top:2px;">${todayStr}</div>
                        </div>
                    </div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body" style="max-height:400px;overflow-y:auto;">
                    ${staffList.length === 0 ? `
                        <div class="empty" style="padding:40px;">

                            <div class="empty-title">No one here</div>
                            <div class="empty-subtitle">No staff members with this status today.</div>
                        </div>
                    ` : staffList.map(s => `
                        <div class="list-item" onclick="openAttendanceModal('${s.id}')" style="cursor:pointer;">
                            <div class="avatar" style="background:${color(s.team)}">${initials(s.firstName, s.lastName)}</div>
                            <div class="list-item-info">
                                <div class="list-item-title">${s.firstName} ${s.lastName}</div>
                                <div class="list-item-subtitle">${s.team || 'Team Member'} • ${s.role || ''}</div>
                            </div>
                            <span class="pill" style="background:${colors[statusType]}20;color:${colors[statusType]};">${titles[statusType]}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="modal-footer">
                    <div style="display:flex;gap:8px;margin-right:auto;">
                        ${Object.keys(titles).map(key => `
                            <button class="btn ${key === statusType ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="openOfficeOutlookModal('${key}')" style="gap:6px;">
                                <span>${icons[key]}</span>
                                <span>${categorized[key].length}</span>
                            </button>
                        `).join('')}
                    </div>
                    <button class="btn btn-ghost" onclick="closeModal()">Close</button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        };

        window.approveChange = async (id) => {
            const change = pendingChanges.find(c => c.id === id);
            if (!change) return;
            try {
                await fetch(`${API_URL}/projects/${change.projectId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [change.field]: change.requestedValue })
                });
                await updateDoc(doc(db, "artifacts", appId, "public", "data", "pendingChanges", id), { status: 'approved', processedAt: serverTimestamp() });
                showToast('Change approved & synced to Notion');
            } catch (e) { showToast('Error: ' + e.message, 'error'); }
        };

        window.rejectChange = async (id) => {
            try {
                await updateDoc(doc(db, "artifacts", appId, "public", "data", "pendingChanges", id), { status: 'rejected', processedAt: serverTimestamp() });
                showToast('Change rejected');
            } catch (e) { showToast('Error: ' + e.message, 'error'); }
        };

        window.saveProjectAssignment = async (projectId) => {
            const selects = document.querySelectorAll(`.project-assign[data-project="${projectId}"]`);
            const updates = {};
            const notionUpdates = {};
            selects.forEach(select => {
                const role = select.dataset.role;
                const staffId = select.value;
                if (staffId) {
                    const member = staff.find(s => s.id === staffId);
                    if (member) {
                        const fullName = `${member.firstName} ${member.lastName || ''}`.trim();
                        updates[role] = fullName;
                        updates[`${role}Id`] = staffId;
                        // Map roles to Notion field names
                        const notionFieldMap = {
                            creativeLead: 'Creative Lead',
                            productionLead: 'Production Lead',
                            editor: 'Video Editor',
                            designer: 'Graphic Designer',
                            salesLead: 'Sales Lead'
                        };
                        if (notionFieldMap[role]) {
                            notionUpdates[notionFieldMap[role]] = fullName;
                        }
                    }
                }
            });
            if (Object.keys(updates).length === 0) { showToast('No assignments selected', 'error'); return; }
            try {
                // Sync to Notion Master Ledger
                await fetch(`${API_URL}/projects/${projectId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(notionUpdates)
                });
                // Also save to Firebase for quick access
                await setDoc(doc(db, "artifacts", appId, "public", "data", "project_assignments", projectId), { ...updates, projectId, updatedAt: serverTimestamp() }, { merge: true });
                showToast('Assignment saved & synced to Notion');
            } catch (e) { showToast('Error: ' + e.message, 'error'); }
        };

        window.updateTaskType = async (key, field, value) => {
            if (!effortConfig) effortConfig = { taskTypes: {}, seniorityMultipliers: {} };
            if (!effortConfig.taskTypes[key]) effortConfig.taskTypes[key] = {};
            effortConfig.taskTypes[key][field] = field === 'baseHours' ? parseFloat(value) : value;
            await saveEffortConfig();
        };

        window.updateSeniorityMultiplier = async (key, value) => {
            if (!effortConfig) effortConfig = { taskTypes: {}, seniorityMultipliers: {} };
            effortConfig.seniorityMultipliers[key] = parseFloat(value);
            await saveEffortConfig();
        };

        window.addTaskType = async () => {
            const key = prompt('Enter task type key (e.g. video_short):');
            if (!key) return;
            if (!effortConfig) effortConfig = { taskTypes: {}, seniorityMultipliers: {} };
            effortConfig.taskTypes[key] = { baseHours: 4, label: key.replace(/_/g, ' ') };
            await saveEffortConfig();
            render();
        };

        window.removeTaskType = async (key) => {
            if (!confirm(`Remove "${key}"?`)) return;
            delete effortConfig.taskTypes[key];
            await saveEffortConfig();
            render();
        };

        async function saveEffortConfig() {
            try {
                await setDoc(doc(db, "artifacts", appId, "public", "config", "effortScores"), effortConfig);
                showToast('Configuration saved');
            } catch (e) { showToast('Error: ' + e.message, 'error'); }
        }

        async function loadProjects() {
            try {
                const res = await fetch(`${API_URL}/projects`);
                const data = await res.json();
                if (data.success) { projects = data.projects || []; render(); }
            } catch (e) { console.error('Failed to load projects:', e); }
        }

        async function loadStaffFromNotion() {
            try {
                const res = await fetch(`${API_URL}/staff-directory`);
                const data = await res.json();
                if (data.success) {
                    notionStaff = data.staff || [];
                    console.log('[Manager] Loaded', notionStaff.length, 'staff from Notion');
                    render();
                }
            } catch (e) {
                console.error('Failed to load staff from Notion:', e);
            }
        }

        // ========== INITIALIZE ==========

        onAuthStateChanged(auth, user => {
            if (user) {
                if (checkAuth()) hidePinScreen(); else showPinScreen();

                onSnapshot(collection(db, "artifacts", appId, "public", "data", "staff_directory"), snap => {
                    staff = [];
                    snap.forEach(d => staff.push({ id: d.id, ...d.data() }));
                    staff.sort((a, b) => (a.firstName || '').localeCompare(b.firstName || ''));
                    loading = false;
                    render();
                });

                onSnapshot(collection(db, "artifacts", appId, "public", "data", "rota_requests"), snap => {
                    rotaRequests = [];
                    snap.forEach(d => rotaRequests.push({ id: d.id, ...d.data() }));
                    rotaRequests.sort((a, b) => (b.submittedAt?.toDate?.() || new Date(0)) - (a.submittedAt?.toDate?.() || new Date(0)));
                    render();
                });

                onSnapshot(collection(db, "artifacts", appId, "public", "data", "pendingChanges"), snap => {
                    pendingChanges = [];
                    snap.forEach(d => pendingChanges.push({ id: d.id, ...d.data() }));
                    pendingChanges.sort((a, b) => (b.requestedAt?.toDate?.() || new Date(0)) - (a.requestedAt?.toDate?.() || new Date(0)));
                    render();
                });

                onSnapshot(doc(db, "artifacts", appId, "public", "config", "effortScores"), snap => {
                    if (snap.exists()) effortConfig = snap.data();
                });

                loadProjects();
                loadStaffFromNotion();
                setInterval(loadProjects, 60000);
                setInterval(loadStaffFromNotion, 60000);
            } else {
                signInAnonymously(auth);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('active')) closeModal();
        });
    </script>
</body>
</html>
