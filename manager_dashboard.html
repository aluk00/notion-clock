<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMG Command Centre | Management Hub</title>
    <style>
        :root {
            /* Canonical Team Colours */
            --team-editorial: #E94B4B;
            --team-sales: #0FA59A;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-people: #21A0D8;

            /* Status Shades */
            --st-office: #BCD9B8;
            --st-wfh: #F2E7D5;
            --st-shoot: #D1E1F0;
            --st-pto: #EBD4D4;

            /* UI Tokens */
            --bg-page: #FFFFFF;
            --bg-base: #F8F9FA;
            --border-soft: #EAEAEA;
            --ink: #1A1A1A;
            --ink-sub: #757575;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-chip: 999px;
            --shadow-soft: 0 4px 20px rgba(0,0,0,0.04);
            --shadow-glow: 0 8px 24px rgba(33, 160, 216, 0.25);
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            margin: 0; padding: 0; color: var(--ink); min-height: 100vh;
        }

        .hidden { display: none !important; }

        /* --- DMG DOT COMPONENT --- */
        .dot-grid { display: grid; grid-template-columns: repeat(2, 8px); gap: 4px; width: fit-content; }
        .dot-grid span { width: 8px; height: 8px; border-radius: 50%; background: var(--team-people); }
        .dots-editorial span { background: var(--team-editorial); }
        .dots-social span { background: var(--team-social); }
        .dots-creative span { background: var(--team-creative); }
        .dots-production span { background: var(--team-production); }
        .dots-people span { background: var(--team-people); }

        /* --- LOCK SCREEN --- */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-page); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .lock-card { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; max-width: 380px; width: 90%; 
        }
        .lock-logo { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 24px; }
        .lock-logo .dot-grid span { width: 12px; height: 12px; animation: dotPulse 2s infinite ease-in-out; }
        @keyframes dotPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.8); opacity: 0.5; } }
        .lock-title { font-size: 22px; font-weight: 900; letter-spacing: -0.04em; text-transform: uppercase; margin-bottom: 32px; }
        
        .pin-field { display: flex; gap: 12px; justify-content: center; margin-bottom: 40px; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-soft); transition: var(--transition); }
        .pin-dot.filled { background: var(--team-people); border-color: var(--team-people); transform: scale(1.2); box-shadow: 0 0 10px rgba(33, 160, 216, 0.3); }
        
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 280px; }
        .n-btn { 
            width: 100%; aspect-ratio: 1.3 / 1; border-radius: var(--radius-md); background: var(--bg-base); border: 1px solid var(--border-soft);
            display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; cursor: pointer; transition: var(--transition);
        }
        .n-btn:hover { background: #EEE; }
        .n-btn:active { 
            background: #FFF; 
            border-color: var(--team-people); 
            box-shadow: 0 0 15px var(--team-people); 
            transform: scale(0.95);
            transition: all 0.05s ease;
        }

        /* --- APP SHELL --- */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .main-header { padding: 40px 0; display: flex; flex-direction: column; gap: 24px; border-bottom: 1px solid var(--border-soft); margin-bottom: 40px; }
        .header-lockup { display: flex; align-items: center; gap: 1.5rem; }
        .title-text { font-size: 4rem; font-weight: 800; color: #000000; letter-spacing: -0.04em; line-height: 1; opacity: 0; transform: translateY(10px); animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; text-transform: uppercase; }
        .header-dots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 44px; height: 44px; flex-shrink: 0; }
        .header-dots .dot { width: 100%; height: 100%; background-color: var(--team-people); border-radius: 50%; transform: scale(0); animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }

        .tab-nav { display: flex; gap: 12px; padding: 4px; background: var(--bg-base); width: fit-content; border-radius: var(--radius-chip); }
        .tab-trigger { background: transparent; border: none; padding: 10px 24px; font-size: 13px; font-weight: 900; color: var(--ink-sub); cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; border-radius: var(--radius-chip); transition: var(--transition); }
        .tab-trigger:hover { color: var(--ink); transform: translateY(-2px); background: #FFF; box-shadow: var(--shadow-glow); }
        .tab-trigger.active { background: #FFF; color: var(--ink); box-shadow: var(--shadow-soft); }

        /* --- VIEWS --- */
        .view-section { display: none; animation: slideIn 0.3s ease-out; padding-bottom: 80px; }
        .view-section.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- OUTLOOK TAB --- */
        .metric-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
        .metric-card { background: #FFF; border: 1px solid var(--border-soft); padding: 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); cursor: pointer; transition: var(--transition); border-top: 4px solid var(--ink); }
        .metric-card:hover { transform: translateY(-4px); border-color: var(--team-people); }
        .metric-val { font-size: 48px; font-weight: 900; line-height: 1; margin-bottom: 8px; letter-spacing: -2px; }
        .metric-label { font-size: 10px; font-weight: 800; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.1em; }

        .presence-list-box { background: var(--bg-base); padding: 24px; border-radius: var(--radius-lg); margin-bottom: 40px; }
        .presence-header { font-size: 11px; font-weight: 900; text-transform: uppercase; color: var(--ink-sub); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .chip-stack { display: flex; flex-wrap: wrap; gap: 8px; }
        .person-chip { background: #FFF; border: 1px solid var(--border-soft); padding: 6px 12px; border-radius: var(--radius-chip); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        .weekly-strip { display: flex; gap: 10px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 5px; }
        .day-btn { background: var(--bg-base); border: 1px solid var(--border-soft); padding: 10px 20px; border-radius: var(--radius-md); font-size: 12px; font-weight: 800; cursor: pointer; transition: var(--transition); white-space: nowrap; }
        .day-btn.active { background: var(--ink); color: #FFF; border-color: var(--ink); }

        /* --- TABLES --- */
        .directory-box { background: #FFF; border: 1px solid var(--border-soft); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-soft); }
        .directory-table { width: 100%; border-collapse: collapse; }
        .directory-table th { text-align: left; font-size: 9px; font-weight: 900; color: #BBB; text-transform: uppercase; padding: 15px 20px; border-bottom: 1px solid var(--border-soft); }
        .directory-table td { padding: 18px 20px; font-size: 13px; font-weight: 700; border-bottom: 1px solid #F9F9F9; }
        
        .name-cell { display: flex; align-items: center; gap: 12px; }
        .staff-name-link { text-decoration: none; font-weight: 800; cursor: pointer; transition: opacity 0.2s; }
        .staff-name-link:hover { opacity: 0.7; text-decoration: underline; }
        .role-subtext { font-size: 11px; color: #BBB; font-weight: 500; margin-left: 8px; text-transform: none; letter-spacing: 0; }

        .status-chip { padding: 4px 10px; border-radius: var(--radius-chip); font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; }
        .chip-office { background: var(--st-office); color: #2D4F2D; }
        .chip-wfh { background: var(--st-wfh); color: #5F4B2D; }
        .chip-shoot { background: var(--st-shoot); color: #2D425F; }
        .chip-pto { background: var(--st-pto); color: #5F2D2D; }

        /* --- FOLDER CARDS --- */
        .silo-stack { display: flex; flex-direction: column; gap: 32px; }
        .folder-card { background: #FFF; border: 1px solid var(--border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); position: relative; padding: 40px 30px 30px; }
        .folder-tab { position: absolute; top: -14px; left: 30px; background: #EEE; color: var(--ink); padding: 6px 16px; border-radius: 8px 8px 0 0; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border-soft); border-bottom: none; }
        .folder-card[data-team="editorial"] .folder-tab { border-top: 3px solid var(--team-editorial); }
        .folder-card[data-team="production"] .folder-tab { border-top: 3px solid var(--team-production); }
        .folder-card[data-team="creative"] .folder-tab { border-top: 3px solid var(--team-creative); }
        .folder-card[data-team="social"] .folder-tab { border-top: 3px solid var(--team-social); }
        .folder-card[data-team="sales"] .folder-tab { border-top: 3px solid var(--team-sales); }
        .folder-card[data-team="people"] .folder-tab { border-top: 3px solid var(--team-people); }

        /* --- APPROVALS --- */
        .manager-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .manager-card { background: #FFF; border: 1px solid var(--border-soft); padding: 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); cursor: pointer; transition: var(--transition); }
        .manager-card:hover { transform: translateY(-4px); border-color: var(--team-people); box-shadow: var(--shadow-glow); }
        .manager-name { font-size: 18px; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 5px; } /* EMBOLDENED */
        .manager-role { font-size: 11px; font-weight: 600; color: var(--ink-sub); text-transform: uppercase; letter-spacing: 0.05em; }

        .request-item { display: grid; grid-template-columns: 80px 120px 1fr; align-items: center; padding: 15px 0; border-bottom: 1px solid #F5F5F5; }
        .segmented-control { display: flex; background: #F0F0F0; padding: 3px; border-radius: 10px; width: fit-content; margin-left: auto; }
        .segment-btn { border: none; background: none; padding: 6px 12px; font-size: 9px; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 7px; color: var(--ink-sub); transition: var(--transition); }
        .segment-btn.active-approve { background: var(--team-production); color: #FFF; }
        .segment-btn.active-deny { background: var(--team-editorial); color: #FFF; }
        .segment-btn.active-suggest { background: var(--team-social); color: var(--ink); }

        /* --- MODAL SYSTEM --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal-overlay.open { display: flex; }
        .modal-body { background: #FFF; width: 640px; max-height: 85vh; padding: 40px; border-radius: 24px; box-shadow: 0 40px 100px rgba(0,0,0,0.15); overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px; font-weight: 900; color: #BBB; }

        /* HISTORY LAYOUT */
        .history-week-block { margin-bottom: 30px; border: 1px solid #EEE; border-radius: 12px; overflow: hidden; }
        .history-week-title { background: #FAFAFA; padding: 10px 15px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #888; border-bottom: 1px solid #EEE; }
        .history-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: #EEE; }
        .history-day { background: #FFF; padding: 15px 10px; text-align: center; }
        .h-day-name { font-size: 9px; font-weight: 800; color: #BBB; margin-bottom: 5px; text-transform: uppercase; }
        
        @media (max-width: 768px) {
            .title-text { font-size: 2.2rem; }
            .header-dots { width: 28px; height: 28px; gap: 4px; }
            .metric-row { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

            </main>
        </div>
    </div>

            { id: "m2", name: "Ellie Beetham", role: "Head of Social Creative" },
            { id: "m3", name: "Nev Brook", role: "Director of Social Production" },
            { id: "m4", name: "Matthew Macleod", role: "Head of Social Production" },
            { id: "m5", name: "Nathan Aspell", role: "Director of Creative and Platforms" }
        ];

        const requests = [
            { staff: "Nick Bolwell", managerId: "m2", days: ["Office", "Office", "WFH", "Office", "Office"] },
            { staff: "Romy Grigg", managerId: "m2", days: ["Office", "Office", "Shoot", "Shoot", "WFH"] }
        ];

        let pin = "";
        let outlookDayIndex = 0;
        let forecastDayIndex = 0;

        // --- AUTH ---
        function press(n) { if(pin.length < 4) { pin += n; syncPin(); if(pin.length === 4) setTimeout(auth, 200); } }
        function clearPin() { pin = ""; syncPin(); }
        function syncPin() { for(let i=1; i<=4; i++) document.getElementById('p'+i).classList.toggle('filled', i <= pin.length); }
        function auth() { if(pin === "2025") { document.getElementById('lock-screen').style.opacity = 0; setTimeout(() => { document.getElementById('lock-screen').classList.add('hidden'); document.getElementById('app-shell').classList.remove('hidden'); }, 300); } else { clearPin(); } }

        // --- NAVIGATION ---
        function navigate(view, btn) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
            document.getElementById('view-'+view).classList.add('active');
            btn.classList.add('active');
            if(view === 'teams') renderTeams();
            if(view === 'approvals') renderManagerGrid();
        }

        // --- DATES ---
        function getWC() {
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            const mon = new Date(now.setDate(diff));
            return `w/c ${mon.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`.toUpperCase();
        }

        // --- RENDERING ---
        function selectOutlookDay(index, btn) {
            outlookDayIndex = index;
            document.querySelectorAll('#outlook-strip .day-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderOutlookSummary();
        }

        function selectForecastDay(index, btn) {
            forecastDayIndex = index;
            document.querySelectorAll('#forecast-strip .day-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderForecastDirectory();
        }

        function renderOutlookSummary() {
            const wc = getWC();
            document.getElementById('outlook-wc-header').innerText = wc;
            document.getElementById('in-office-label').innerText = `IN OFFICE • ${wc}`;

            const stats = { Office: 0, WFH: 0, Shoot: 0, PTO: 0 };
            const inOffice = [];

            staff.forEach(s => {
                const status = s.schedule[outlookDayIndex];
                stats[status]++;
                if(status === 'Office') inOffice.push(s);
            });

            document.getElementById('count-office').innerText = stats.Office;
            document.getElementById('count-wfh').innerText = stats.WFH;
            document.getElementById('count-shoot').innerText = stats.Shoot;
            document.getElementById('count-pto').innerText = stats.PTO;

            document.getElementById('today-chips-mount').innerHTML = inOffice.map(s => `
                <div class="person-chip">
                    <div class="dot-grid dots-${s.team}" style="transform:scale(0.6)"><span></span><span></span><span></span><span></span></div>
                    ${s.name}
                </div>
            `).join('') || '<div style="font-size:12px; color:var(--ink-sub);">None scheduled for Office.</div>';
        }

        function renderForecastDirectory() {
            const directoryMount = document.getElementById('directory-mount');
            directoryMount.innerHTML = "";

            staff.forEach(s => {
                const status = s.schedule[forecastDayIndex];
                directoryMount.innerHTML += `
                    <tr>
                        <td>
                            <div class="name-cell">
                                <div class="dot-grid dots-${s.team}" style="transform:scale(0.6)"><span></span><span></span><span></span><span></span></div>
                                <span class="staff-name-link" style="color:var(--team-${s.team})" onclick="openStaffHistory(${s.id})">${s.name}</span>
                            </div>
                        </td>
                        <td><span style="font-size:11px; color:#BBB; font-weight:500;">${s.role}</span></td>
                        <td><span class="status-chip chip-${status.toLowerCase()}">${status}</span></td>
                    </tr>
                `;
            });
        }

        function renderTeams() {
            document.getElementById('teams-wc-label').innerText = getWC();
            const mount = document.getElementById('teams-mount');
            const groups = [...new Set(staff.map(s => s.team))];
            
            mount.innerHTML = groups.map(teamName => {
                const teamStaff = staff.filter(s => s.team === teamName);
                return `
                    <div class="folder-card" data-team="${teamName}">
                        <div class="folder-tab">
                            <div class="dot-grid dots-${teamName}"><span></span><span></span><span></span><span></span></div>
                            ${teamName} Stream
                        </div>
                        <table class="directory-table">
                            <thead><tr><th>Name & Role</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th></tr></thead>
                            <tbody>
                                ${teamStaff.map(s => `
                                    <tr>
                                        <td>
                                            <span class="staff-name-link" style="color:var(--team-${s.team})" onclick="openStaffHistory(${s.id})">${s.name}</span>
                                            <span class="role-subtext">${s.role}</span>
                                        </td>
                                        ${s.schedule.map(st => `<td><span class="status-chip chip-${st.toLowerCase()}">${st.charAt(0)}</span></td>`).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }).join('');
        }

        function renderManagerGrid() {
            const mount = document.getElementById('manager-grid-mount');
            mount.innerHTML = managers.map(m => `
                <div class="manager-card" onclick="openManagerRequests('${m.id}', '${m.name}')">
                    <div class="manager-name">${m.name}</div>
                    <div class="manager-role">${m.role}</div>
                    <div style="margin-top:15px; font-size:10px; font-weight:800; color:var(--team-people);">
                        ${requests.filter(r => r.managerId === m.id).length} Pending Requests
                    </div>
                </div>
            `).join('');
        }

        // --- POPUP FOR METRIC CARDS ---
        function openCategoryModal(cat) {
            document.getElementById('modal-title').innerText = `${cat} Breakdown • ${getWC()}`;
            const list = staff.filter(s => s.schedule[outlookDayIndex] === cat);
            document.getElementById('modal-content-body').innerHTML = list.map(s => `
                <div style="padding:12px 0; border-bottom:1px solid #F5F5F5; font-weight:700; display:flex; justify-content:space-between; align-items:center;">
                    <div class="name-cell">
                        <div class="dot-grid dots-${s.team}" style="transform:scale(0.6)"><span></span><span></span><span></span><span></span></div>
                        ${s.name}
                    </div>
                    <span style="font-size:10px; color:var(--ink-sub); text-transform:uppercase;">${s.role}</span>
                </div>
            `).join('') || `<div style="padding:20px; text-align:center; color:var(--ink-sub);">No staff in ${cat} on this day.</div>`;
            document.getElementById('modal-overlay').classList.add('open');
        }

        // --- HISTORY MODAL ---
        function openStaffHistory(staffId) {
            const s = staff.find(x => x.id === staffId);
            document.getElementById('modal-title').innerText = `${s.name} • Operational History`;
            const mount = document.getElementById('modal-content-body');
            
            let html = `
                <div style="margin-bottom:20px; font-size:13px; font-weight:700; color:var(--team-${s.team});">${s.role}</div>
                
                <div class="history-week-block">
                    <div class="history-week-title">Current Week (${getWC()})</div>
                    <div class="history-row">
                        ${s.schedule.map((st, i) => `
                            <div class="history-day">
                                <div class="h-day-name">${['M','T','W','T','F'][i]}</div>
                                <span class="status-chip chip-${st.toLowerCase()}">${st.charAt(0)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            s.history.forEach((hist, idx) => {
                html += `
                <div class="history-week-block">
                    <div class="history-week-title">Week Minus ${idx+1}</div>
                    <div class="history-row">
                        ${hist.map((st, i) => `
                            <div class="history-day">
                                <div class="h-day-name">${['M','T','W','T','F'][i]}</div>
                                <span class="status-chip chip-${st.toLowerCase()}">${st.charAt(0)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                `;
            });

            mount.innerHTML = html;
            document.getElementById('modal-overlay').classList.add('open');
        }

        function openManagerRequests(id, name) {
            const mgrReqs = requests.filter(r => r.managerId === id);
            document.getElementById('modal-title').innerText = `Pending Requests: ${name}`;
            const mount = document.getElementById('modal-content-body');
            
            mount.innerHTML = mgrReqs.map(req => `
                <div style="margin-bottom:40px;">
                    <div style="font-size:18px; font-weight:900; margin-bottom:15px;">${req.staff}</div>
                    ${['Mon','Tue','Wed','Thu','Fri'].map((day, i) => `
                        <div class="request-item">
                            <div class="day-label">${day}</div>
                            <div style="font-size:13px; font-weight:800;">${req.days[i]}</div>
                            <div class="segmented-control">
                                <button class="segment-btn" onclick="stamp(this, 'approve')">Approve</button>
                                <button class="segment-btn" onclick="stamp(this, 'deny')">Deny</button>
                                <button class="segment-btn" onclick="segment(this, 'suggest')">Suggest</button>
                            </div>
                        </div>
                        <textarea class="feedback-area" placeholder="Add rationale for ${day}..."></textarea>
                    `).join('')}
                    <button class="n-btn" style="width:100%; background:var(--ink); color:#FFF; margin-top:20px; height:45px;" onclick="submitRequest(this)">Submit</button>
                </div>
            `).join('');
            document.getElementById('modal-overlay').classList.add('open');
        }

        function stamp(btn, action) {
            const parent = btn.parentElement;
            parent.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active-approve','active-deny','active-suggest'));
            btn.classList.add('active-'+action);
            const feedback = parent.parentElement.nextElementSibling;
            if(action === 'deny' || action === 'suggest') feedback.classList.add('visible');
            else feedback.classList.remove('visible');
        }

        function submitRequest(btn) {
            btn.innerText = "Synchronising...";
            setTimeout(() => {
                btn.parentElement.style.opacity = "0.3";
                btn.parentElement.style.pointerEvents = "none";
                btn.innerText = "Decisions Logged";
            }, 600);
        }

        function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

        // Boot
        renderOutlookSummary();
        renderForecastDirectory();
        renderManagerGrid();
    </script>
</body>
</html>
