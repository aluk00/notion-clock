<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Online | DMG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --team-editorial: #E94B4B;
            --team-creative: #E6468B;
            --team-production: #43B049;
            --team-social: #F2C316;
            --team-operations: #9333EA;
            --border: #EAECEF;
            --ink: #1C1C1C;
            --ink-sub: #757575;
            --bg-soft: #F9FAFB;
            --online: #22C55E;
            --away: #F59E0B;
            --busy: #EF4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            margin: 0;
            padding: 6px;
            color: var(--ink);
        }
        .widget {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 14px;
            max-width: 700px;
            width: 100%;
            overflow: hidden;
        }
        .widget-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot-grid {
            display: grid;
            grid-template-columns: repeat(2, 4px);
            gap: 2px;
        }
        .dot-grid span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--online);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        .header-title { font-size: 11px; font-weight: 900; color: var(--ink); }
        .online-count {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            color: var(--online);
            margin-left: auto;
        }
        .online-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--online);
            animation: blink 2s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .filter-tabs {
            display: flex;
            gap: 4px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        .filter-tab {
            padding: 4px 8px;
            border-radius: 99px;
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-sub);
            background: var(--bg-soft);
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .filter-tab:hover { color: var(--ink); }
        .filter-tab.active { background: var(--ink); color: #FFF; }
        .filter-tab .count {
            display: inline-block;
            margin-left: 2px;
            padding: 1px 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 99px;
            font-size: 8px;
        }
        
        .people-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1px;
            background: #F0F0F0;
        }
        
        .person-card {
            padding: 8px 10px;
            background: #FFF;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .person-card:hover { background: var(--bg-soft); }
        
        .person-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #FFF;
            position: relative;
            flex-shrink: 0;
        }
        .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid #FFF;
        }
        .status-dot.online { background: var(--online); }
        .status-dot.away { background: var(--away); }
        .status-dot.busy { background: var(--busy); }
        .status-dot.offline { background: #CCC; }
        
        .person-info { flex: 1; min-width: 0; }
        .person-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .person-role {
            font-size: 9px;
            color: var(--ink-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .person-mood { font-size: 12px; flex-shrink: 0; }
        
        .empty-state {
            padding: 30px 14px;
            text-align: center;
            background: #FFF;
        }
        .empty-icon { font-size: 24px; margin-bottom: 8px; }
        .empty-title { font-size: 12px; font-weight: 800; color: var(--ink); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrV1NuvPO-_CLtQPyOhR_ERsRvE2dxDlY",
            authDomain: "dmg-command-centre-native.firebaseapp.com",
            projectId: "dmg-command-centre-native"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "dmg-command-centre-native";

        const TEAM_COLORS = {
            'Editorial': '#E94B4B', 'Creative': '#E6468B', 'Production': '#43B049',
            'Social': '#F2C316', 'Operations': '#9333EA', 'Sales': '#F97316'
        };

        const DEMO_PEOPLE = [
            { id: '1', firstName: 'Nick', lastName: 'B', team: 'Creative', role: 'Creative Lead', status: 'online', mood: '🎯' },
            { id: '2', firstName: 'Ana', lastName: 'C', team: 'Creative', role: 'Senior Creative', status: 'online', mood: '🔥' },
            { id: '3', firstName: 'Hugo', lastName: 'M', team: 'Production', role: 'Producer', status: 'online', mood: '☕' },
            { id: '4', firstName: 'Mimi', lastName: 'Y', team: 'Social', role: 'Creator', status: 'busy', mood: '😤' },
            { id: '5', firstName: 'Dan', lastName: 'Q', team: 'Social', role: 'Presenter', status: 'away', mood: null },
            { id: '6', firstName: 'Kaylee', lastName: 'A', team: 'Editorial', role: 'Presenter', status: 'online', mood: '🎉' },
            { id: '7', firstName: 'Sophia', lastName: 'S', team: 'Editorial', role: 'Finance', status: 'online', mood: '💪' },
            { id: '8', firstName: 'Gemma', lastName: 'P', team: 'Production', role: 'Producer', status: 'online', mood: '🧘' },
            { id: '9', firstName: 'Ellie', lastName: 'B', team: 'Creative', role: 'Head of Social', status: 'busy', mood: '🔥' }
        ];

        let people = DEMO_PEOPLE;
        let activeFilter = 'all';
        const root = document.getElementById('root');

        const getTeamColor = t => TEAM_COLORS[t] || '#21a0d8';
        const getInitials = (f, l) => `${(f||'?')[0]}${(l||'?')[0]}`.toUpperCase();

        function getFilteredPeople() {
            if (activeFilter === 'all') return people;
            if (activeFilter === 'online') return people.filter(p => p.status === 'online');
            return people.filter(p => p.team === activeFilter);
        }

        function render() {
            const filtered = getFilteredPeople();
            const onlineCount = people.filter(p => p.status === 'online').length;
            const teams = [...new Set(people.map(p => p.team))].sort();

            root.innerHTML = `
                <div class="widget">
                    <div class="widget-header">
                        <div class="dot-grid"><span></span><span></span><span></span><span></span></div>
                        <h2 class="header-title">Who's Online</h2>
                        <div class="online-count">
                            <span class="online-dot"></span>
                            <span>${onlineCount} online</span>
                        </div>
                    </div>
                    
                    <div class="filter-tabs">
                        <button class="filter-tab ${activeFilter === 'all' ? 'active' : ''}" onclick="window.setFilter('all')">All<span class="count">${people.length}</span></button>
                        <button class="filter-tab ${activeFilter === 'online' ? 'active' : ''}" onclick="window.setFilter('online')">Online<span class="count">${onlineCount}</span></button>
                        ${teams.map(t => `<button class="filter-tab ${activeFilter === t ? 'active' : ''}" onclick="window.setFilter('${t}')">${t}</button>`).join('')}
                    </div>
                    
                    <div class="people-grid">
                        ${filtered.length === 0 ? `
                            <div class="empty-state">
                                <div class="empty-icon">👀</div>
                                <div class="empty-title">Nobody here</div>
                            </div>
                        ` : filtered.map(p => `
                            <div class="person-card">
                                <div class="person-avatar" style="background: ${getTeamColor(p.team)}">
                                    ${getInitials(p.firstName, p.lastName)}
                                    <div class="status-dot ${p.status}"></div>
                                </div>
                                <div class="person-info">
                                    <div class="person-name">${p.firstName} ${p.lastName}</div>
                                    <div class="person-role">${p.role}</div>
                                </div>
                                ${p.mood ? `<div class="person-mood">${p.mood}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.setFilter = (filter) => { activeFilter = filter; render(); };

        onAuthStateChanged(auth, u => { if (u) render(); else signInAnonymously(auth); });
    </script>
</body>
</html>
