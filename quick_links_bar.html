<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --production: #06402B;
            --editorial: #E94B4B;
            --design: #F2C316;
            --border: #E5E7EB;
            --text-main: #1C1C1C;
            --text-sub: #6B7280;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 12px 16px; background: transparent; }
        
        .container { display: flex; align-items: center; gap: 14px; }
        
        .header { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .dots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 16px; height: 16px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; }
        @keyframes heartbeat { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dot-anim { animation: heartbeat 3s infinite ease-in-out; }
        .dot-anim:nth-child(1) { animation-delay: 0s; }
        .dot-anim:nth-child(2) { animation-delay: 0.75s; }
        .dot-anim:nth-child(4) { animation-delay: 1.5s; }
        .dot-anim:nth-child(3) { animation-delay: 2.25s; }
        .title { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-main); white-space: nowrap; }
        
        .divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
        
        .links { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow-x: auto; }
        
        .link-pill { text-decoration: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; background: #FFF; border: 1.5px solid var(--border); transition: all 0.2s ease; white-space: nowrap; }
        .link-pill:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.06); }
        
        .link-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .link-dot.green { background: var(--production); }
        .link-dot.red { background: var(--editorial); }
        .link-dot.yellow { background: var(--design); }
        
        .link-title { font-size: 10px; font-weight: 700; color: var(--text-main); }
        
        .link-pill:hover .link-dot.green { box-shadow: 0 0 0 3px rgba(6, 64, 43, 0.2); }
        .link-pill:hover .link-dot.red { box-shadow: 0 0 0 3px rgba(233, 75, 75, 0.2); }
        .link-pill:hover .link-dot.yellow { box-shadow: 0 0 0 3px rgba(242, 195, 22, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="dots-grid">
                <div class="dot dot-anim"></div>
                <div class="dot dot-anim"></div>
                <div class="dot dot-anim"></div>
                <div class="dot dot-anim"></div>
            </div>
            <span class="title">Quick Links</span>
        </div>
        
        <div class="divider"></div>
        
        <div class="links">
            <a href="daily-rundown.html" class="link-pill" target="_top">
                <div class="link-dot red"></div>
                <span class="link-title">Daily Rundown</span>
            </a>
            
            <a href="social-command-centre.html" class="link-pill" target="_top">
                <div class="link-dot red"></div>
                <span class="link-title">Editorial Calendar</span>
            </a>
            
            <a href="design-request-form.html" class="link-pill" target="_top">
                <div class="link-dot yellow"></div>
                <span class="link-title">Request Graphics</span>
            </a>
            
            <a href="shoot-calendar.html" class="link-pill" target="_top">
                <div class="link-dot green"></div>
                <span class="link-title">Shoot Calendar</span>
            </a>
        </div>
    </div>
</body>
</html>
