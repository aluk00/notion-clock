<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Links | New Media Hub</title>
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --dmg-blue-hover: #f0f9ff;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Core Layout */
        html, body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow-x: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* Combined Container: Longline Flex */
        .master-container {
            display: flex;
            align-items: center;
            padding: 10px;
            gap: 25px; /* Gap between Header and Buttons */
            width: fit-content;
        }

        /* --- STACKED HEADER SECTION --- */
        .header-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.3rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .title-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.04em;
            line-height: 0.9;
            opacity: 0;
            white-space: nowrap;
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-top { animation-delay: 0.1s; }
        .text-bottom { animation-delay: 0.3s; }

        .dots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            width: 24px;
            height: 24px;
            margin: 2px 0;
        }

        .dot {
            width: 100%;
            height: 100%;
            background-color: var(--dmg-blue);
            border-radius: 50%;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot:nth-child(4) { animation-delay: 0.4s; }

        /* --- BUTTONS SECTION --- */
        .links-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .link-card {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 8px;
            background: #ffffff;
            border: 1.5px solid var(--dmg-blue);
            transition: var(--transition);
            min-width: 105px;
        }

        .link-card:hover {
            background-color: var(--dmg-blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(33, 160, 216, 0.12);
        }

        .category-tag {
            font-size: 7px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
            color: var(--dmg-blue);
            opacity: 0.7;
        }

        .link-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--dmg-blue);
            margin: 0;
            line-height: 1.1;
            white-space: nowrap;
        }

        /* Animations */
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { to { transform: scale(1); } }

        /* Mobile adjustments */
        @media (max-width: 800px) {
            .master-container { gap: 15px; }
            .title-text { font-size: 1.4rem; }
            .dots-grid { width: 20px; height: 20px; }
            .link-card { min-width: 90px; padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <div class="master-container">
        <!-- 1. THE STACKED HEADER -->
        <div class="header-stack">
            <div class="title-text text-top">QUICK</div>
            <div class="dots-grid">
                <div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div>
            </div>
            <div class="title-text text-bottom">LINKS</div>
        </div>

        <!-- 2. THE BUTTONS GRID -->
        <div class="links-grid">
            <a href="https://wd3.myworkday.com/dmgt/d/home.htmld" target="_blank" class="link-card">
                <span class="category-tag">Operations</span>

            </a>

            <a href="https://eu1.concursolutions.com/" target="_blank" class="link-card">

            <a href="https://myhub.dmgmedia.co.uk/new-starter-section/" target="_blank" class="link-card">
                <span class="category-tag">Operations</span>
                <p class="link-title">My Hub</p>
            </a>

                <span class="category-tag">Commercial</span>
                <p class="link-title">Status Doc</p>
            </a>

            <a href="https://docs.google.com/document/d/1TN0-5Ianw4i5CAB-mV3mPgtpt8WJ8YhrNTeOcOPVmtk/edit?tab=t.0" target="_blank" class="link-card">
                <span class="category-tag">Continuity</span>
                <p class="link-title">Handover</p>
            </a>

            <a href="#" target="_blank" class="link-card">
                <span class="category-tag">Editorial</span>
                <p class="link-title">Daily Slate</p>
            </a>

            <a href="https://www.notion.so/2a0f65028edf80b8b85ccbaf8a39f21e?v=2a0f65028edf8069b23b000c2d683d30" target="_blank" class="link-card">
                <span class="category-tag">Design</span>
                <p class="link-title">Graphics Req</p>
            </a>
        </div>
    </div>

</body>
</html>
