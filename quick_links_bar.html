<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Links | DMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dmg-blue: #21a0d8;
            --ink: #1C1C1C;
            --ink-sub: #6B7280;
            --border: #E5E7EB;
            --bg-soft: #F9FAFB;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: transparent; margin: 0; padding: 8px; }
        
        .widget { background: #FFF; border-radius: 12px; border: 1px solid var(--border); padding: 12px; }
        
        .header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 12px; height: 12px; }
        .dot { width: 100%; height: 100%; background: var(--dmg-blue); border-radius: 50%; animation: pulse 2.5s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.625s; }
        .dot:nth-child(3) { animation-delay: 1.25s; }
        .dot:nth-child(4) { animation-delay: 1.875s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .title { font-size: 10px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: 0.02em; }
        
        .links { display: flex; flex-wrap: wrap; gap: 6px; }
        
        .link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--bg-soft); border-radius: 8px; text-decoration: none; transition: all 0.2s; border: 1px solid transparent; }
        .link:hover { background: #EBF8FD; border-color: var(--dmg-blue); transform: translateY(-1px); }
        
        .link-icon { font-size: 12px; }
        .link-text { font-size: 10px; font-weight: 700; color: var(--ink); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const QUICK_LINKS = [
            { icon: '📅', text: 'Rota', url: 'https://aluk00.github.io/notion-clock/rota-request-v2.html' },
            { icon: '🗓️', text: 'Leave', url: 'https://wd3.myworkday.com/dmgt/d/home.htmld' },
            { icon: '🗺️', text: 'Org Chart', url: 'https://aluk00.github.io/notion-clock/org-chart.html' },
            { icon: '📊', text: 'Projects', url: '#' },
            { icon: '📧', text: 'Email Sig', url: 'https://aluk00.github.io/notion-clock/email-signature.html' },
            { icon: '💡', text: 'Suggestions', url: 'https://aluk00.github.io/notion-clock/suggestion-box.html' },
        ];
        
        const DotGrid = () => (
            <div className="dots">
                <div className="dot"></div>
                <div className="dot"></div>
                <div className="dot"></div>
                <div className="dot"></div>
            </div>
        );
        
        function App() {
            return (
                <div className="widget">
                    <div className="header">
                        <DotGrid />
                        <span className="title">Quick Links</span>
                    </div>
                    <div className="links">
                        {QUICK_LINKS.map((link, i) => (
                            <a key={i} href={link.url} target="_blank" className="link">
                                <span className="link-icon">{link.icon}</span>
                                <span className="link-text">{link.text}</span>
                            </a>
                        ))}
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
